regime: non_listed

hero:
  h1: { en: "Traveling to Kuwait with your dog", fr: "Voyager au Koweït avec ton chien", es: "Viajar a Kuwait con tu perro", pt: "Viajar para o Kuwait com seu cachorro" }
  intro:
    en: >-
      Kuwait does not use the EU pet-travel framework — it applies its own scheme run by the Public
      Authority of Agriculture Affairs and Fish Resources (PAAF). Before your dog travels you must
      obtain a pet import certificate from PAAF, submit a written request with the pet's and the
      sponsor's details, and carry a valid veterinary health certificate signed by a licensed
      veterinarian. Your dog must be vaccinated against rabies between 30 days and one year before
      arrival, and the health certificate must be dated within 30 days before entry. The exact path
      depends on the country your dog is travelling from and its animal-health history. PAAF does not
      publish every detail online — some points (a rabies antibody test, a restricted-breed list, a
      minimum age, quarantine) are decided case by case — so this guide states clearly what is
      officially documented and what you must confirm directly with PAAF before you book.
    fr: >-
      Le Koweït n'applique pas le cadre européen — il a son propre dispositif géré par l'Autorité
      publique des affaires agricoles et des ressources halieutiques (PAAF). Avant le voyage, tu
      devez obtenir un certificat d'importation d'animal auprès de la PAAF, déposer une demande écrite
      avec les informations de l'animal et du sponsor, et présenter un certificat vétérinaire valide
      signé par un vétérinaire habilité. Ton chien doit être vacciné contre la rage entre 30 jours et
      un an avant l'arrivée, et le certificat sanitaire doit être daté dans les 30 jours précédant
      l'entrée. Le parcours exact dépend du pays de départ et de l'historique sanitaire de l'animal. La
      PAAF ne publie pas tous les détails en ligne — certains points (titrage antirabique, liste de
      races restreintes, âge minimum, quarantaine) sont examinés au cas par cas — ce guide distingue
      donc ce qui est officiellement documenté de ce que tu dois confirmer directement avec la PAAF.
    es: >-
      Kuwait no aplica el marco europeo de viaje con mascotas — tiene su propio sistema gestionado por
      la Autoridad Pública de Asuntos Agrícolas y Recursos Pesqueros (PAAF). Antes de que tu perro
      viaje debes obtener un certificado de importación de mascota de la PAAF, presentar una solicitud
      escrita con los datos de la mascota y del patrocinador, y llevar un certificado sanitario
      veterinario válido firmado por un veterinario autorizado. Tu perro debe estar vacunado contra la
      rabia entre 30 días y un año antes de la llegada, y el certificado sanitario debe estar fechado
      dentro de los 30 días anteriores a la entrada. El camino exacto depende del país desde el que
      viaja tu perro y de su historial sanitario animal. La PAAF no publica todos los detalles en línea
      — algunos puntos (una prueba de titulación de rabia, una lista de razas restringidas, una edad
      mínima, la cuarentena) se deciden caso por caso — así que esta guía indica con claridad lo que
      está oficialmente documentado y lo que debes confirmar directamente con la PAAF antes de reservar.

    pt: "O Kuwait não utiliza o regime europeu de viagens com animais de estimação — aplica o próprio sistema, administrado pela Public Authority of Agriculture Affairs and Fish Resources (PAAF). Antes de o seu cachorro viajar, você precisa obter um certificado de importação de animal de estimação junto à PAAF, apresentar uma solicitação por escrito com os dados do animal e do patrocinador, e levar um atestado de saúde veterinário válido, assinado por um veterinário licenciado. Seu cachorro deve ser vacinado contra a raiva entre 30 dias e um ano antes da chegada, e o atestado de saúde deve ter data dentro de 30 dias antes da entrada. O caminho exato depende do país de onde o seu cachorro está viajando e do seu histórico sanitário animal. A PAAF não publica todos os detalhes on-line — alguns pontos (teste sorológico antirrábico, lista de raças restritas, idade mínima, quarentena) são decididos caso a caso — portanto este guia indica claramente o que está oficialmente documentado e o que você precisa confirmar diretamente com a PAAF antes de reservar."
difficulty:
  level: moderate
  label: { en: "Moderate — advance PAAF import certificate required", fr: "Modéré — certificat d'importation PAAF préalable requis", es: "Moderada — se requiere un certificado de importación PAAF previo", pt: "Moderado — certificado de importação da PAAF obrigatório com antecedência" }

prepTime:
  eu:
    en: "For a country with an agreed Kuwait health certificate (e.g. the United States): plan several weeks — microchip/identification, a rabies vaccination valid 30 days to 1 year before arrival, the PAAF import certificate and a health certificate dated within 30 days of entry."
    fr: "Pour un pays disposant d'un certificat sanitaire koweïtien convenu (ex. États-Unis) : compte plusieurs semaines — identification, vaccination antirabique valide de 30 jours à 1 an avant l'arrivée, certificat d'importation PAAF et certificat sanitaire daté dans les 30 jours de l'entrée."
    es: "Para un país con un certificado sanitario koweití acordado (p. ej., Estados Unidos): prevé varias semanas — microchip/identificación, una vacunación antirrábica válida entre 30 días y 1 año antes de la llegada, el certificado de importación PAAF y un certificado sanitario fechado dentro de los 30 días de la entrada."
    pt: "Para um país com um atestado de saúde acordado com o Kuwait (por exemplo, os Estados Unidos): planeje várias semanas — microchip/identificação, uma vacinação antirrábica válida de 30 dias a 1 ano antes da chegada, o certificado de importação da PAAF e um atestado de saúde datado dentro de 30 dias da entrada."
  listed:
    en: "From other countries, the applicable model certificate and any additional test (such as a rabies antibody test) depend on your dog's origin and PAAF — confirm the exact requirements before making plans."
    fr: "Depuis d'autres pays, le modèle de certificat applicable et tout test supplémentaire (tel qu'un titrage antirabique) dépendent de l'origine du chien et de la PAAF — confirme les exigences exactes avant tout projet."
    es: "Desde otros países, el modelo de certificado aplicable y cualquier prueba adicional (como una prueba de titulación de rabia) dependen del origen de tu perro y de la PAAF — confirma los requisitos exactos antes de hacer planes."
    pt: "De outros países, o modelo de atestado aplicável e qualquer teste adicional (como o teste sorológico antirrábico) dependem da origem do seu cachorro e da PAAF — confirme as exigências exatas antes de fazer planos."
  nonListed:
    en: "From a country subject to animal-health restrictions, or without the required paperwork, import may be delayed or refused — timing is case-by-case and cannot be assumed."
    fr: "Depuis un pays soumis à des restrictions sanitaires, ou sans les documents requis, l'importation peut être retardée ou refusée — les délais sont examinés au cas par cas et ne peuvent être présumés."
    es: "Desde un país sujeto a restricciones sanitarias animales, o sin la documentación requerida, la importación puede retrasarse o denegarse — los plazos se determinan caso por caso y no pueden darse por sentados."
    pt: "De um país sujeito a restrições sanitárias animais, ou sem a documentação exigida, a importação pode ser atrasada ou recusada — o prazo é definido caso a caso e não pode ser presumido."

