origin:
  scheme: eu
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate and normally no border check."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire et normalement pas de contrôle frontalier."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario y normalmente sin control fronterizo."
      pt: "Um cachorro vindo de outro país da UE precisa de um passaporte europeu que comprove um microchip ISO válido e uma vacinação antirrábica em dia. Sem teste sorológico, sem certificado sanitário e, normalmente, sem controle de fronteira."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Switzerland, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination and an EU animal health certificate endorsed by an official vet before departure. No antibody test is required; present yourself to customs at a travellers' point of entry."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Suisse, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire européen visé par un vétérinaire officiel avant le départ. Pas de titrage ; présente-toi à la douane à un point d'entrée voyageurs."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Suiza, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal de la UE refrendado por un veterinario oficial antes de la salida. No se exige prueba de titulación; preséntate ante la aduana en un punto de entrada de viajeros."
      pt: "Vindo de um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Suíça, Japão, Austrália e outros), seu cachorro precisa de microchip, vacinação antirrábica válida e certificado sanitário europeu endossado por um veterinário oficial antes da partida. Não é exigido teste sorológico; apresente-se à alfândega em um ponto de entrada de viajantes."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-designated laboratory, then a compulsory 3-month wait before entry. An endorsed EU animal health certificate is also required."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen visé est également requis."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exige un certificado sanitario animal de la UE refrendado."
      pt: "Vindo de um país não listado (de risco), acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório designado pela UE, e depois 3 meses obrigatórios de espera antes da entrada. Também é exigido um certificado sanitário europeu endossado."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Lithuania depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien en Lituanie dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Lituania depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega à Lituânia depende do país de onde você veio."
  points:
    - from: eu
      en: "From another EU country: no systematic border check — keep the EU pet passport with you."
      fr: "Depuis un autre pays de l'UE : pas de contrôle systématique — garde le passeport européen sur toi."
      es: "Desde otro país de la UE: sin control fronterizo sistemático — lleva contigo el pasaporte europeo."
      pt: "De outro país da UE: sem controle de fronteira sistemático — leve o passaporte europeu com você."
    - from: non_eu
      en: "From outside the EU: enter via a designated travellers' point of entry and present yourself spontaneously to Lithuanian customs and the State Food and Veterinary Service (VMVT) for documentary and identity checks."
      fr: "Depuis hors UE : entre par un point d'entrée voyageurs désigné et présente-toi spontanément à la douane lituanienne et au Service national de l'alimentation et de la vétérinaire (VMVT) pour les contrôles documentaires et d'identité."
      es: "Desde fuera de la UE: entra por un punto de entrada de viajeros designado y preséntate espontáneamente ante la aduana lituana y el Servicio Estatal de Alimentación y Veterinaria (VMVT) para los controles documentales y de identidad."
      pt: "De fora da UE: entre por um ponto de entrada de viajantes designado e apresente-se espontaneamente à alfândega lituana e ao VMVT (Valstybinė maisto ir veterinarijos tarnyba, serviço estatal de alimentação e veterinária) para os controles de documentos e de identificação."
    - en: "No pet import permit is issued and no prior appointment is needed for standard non-commercial travel."
      fr: "Aucun permis d'import d'animal n'est délivré et aucun rendez-vous préalable n'est nécessaire pour un voyage non commercial standard."
      es: "No se expide ningún permiso de importación de mascotas ni se necesita cita previa para un viaje no comercial estándar."
      pt: "Nenhuma autorização de importação de animal de estimação é emitida e não é preciso agendamento prévio para uma viagem não comercial padrão."
    - en: "Carry original documents (not copies); an English or officially translated certificate is recommended."
      fr: "Munis-toi des documents originaux (pas de copies) ; un certificat en anglais ou traduit officiellement est recommandé."
      es: "Lleva los documentos originales (no copias); se recomienda un certificado en inglés o traducido oficialmente."
      pt: "Leve os documentos originais (não cópias); recomenda-se um certificado em inglês ou traduzido oficialmente."
    - en: "If documents are missing or invalid, border authorities may order re-export, quarantine or other measures — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, les autorités frontalières peuvent ordonner réexpédition, quarantaine ou d'autres mesures — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, las autoridades fronterizas pueden ordenar la reexpedición, la cuarentena u otras medidas — a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, as autoridades de fronteira podem determinar a reexportação, a quarentena ou outras medidas — às custas do dono."
    - en: "Fight-breed dogs (American Pit Bull Terrier) and fight/dangerous crossbreeds are not allowed into Lithuania."
      fr: "Les chiens de type combat (American Pit Bull Terrier) et les croisements de chiens de combat/dangereux ne sont pas admis en Lituanie."
      es: "Los perros de raza de combate (American Pit Bull Terrier) y los cruces de combate/peligrosos no están permitidos en Lituania."
      pt: "Cachorros de raça de briga (American Pit Bull Terrier) e cruzamentos de cachorros de briga ou perigosos não são admitidos na Lituânia."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Lithuania regulates fighting and dangerous dog breeds under the Law on Welfare and Protection of Animals and the State Food and Veterinary Service (VMVT) Director's Order No. B1-5 of 9 January 2013, which sets the official List of Fighting and Dangerous Dog Breeds."
    fr: "La Lituanie réglemente les chiens de combat et les races dangereuses au titre de la loi sur le bien-être et la protection des animaux et de l'arrêté du directeur du Service national de l'alimentation et de la vétérinaire (VMVT) n° B1-5 du 9 janvier 2013, qui fixe la liste officielle des races de chiens de combat et dangereux."
    es: "Lituania regula las razas de perros de combate y peligrosas mediante la Ley de Bienestar y Protección de los Animales y la Orden del Director del Servicio Estatal de Alimentación y Veterinaria (VMVT) n.º B1-5, de 9 de enero de 2013, que establece la Lista oficial de razas de perros de combate y peligrosas."
    pt: "A Lituânia regula as raças de cachorros de briga e as raças perigosas pela Lei de bem-estar e proteção dos animais e pelo Despacho nº B1-5 do diretor do VMVT (Valstybinė maisto ir veterinarijos tarnyba, serviço estatal de alimentação e veterinária), de 9 de janeiro de 2013, que estabelece a Lista oficial das raças de cachorros de briga e perigosas."
  cat1:
    en: "Fighting breed (kovinių šunų veislė): the American Pit Bull Terrier. Fight dogs, and crossbreeds of fight and dangerous dogs, are not allowed in Lithuania — they cannot be brought in, kept, bred, purchased or sold. Any such crossbreed already in the country must be neutered."
    fr: "Race de combat (kovinių šunų veislė) : l'American Pit Bull Terrier. Les chiens de combat, ainsi que les croisements de chiens de combat et dangereux, ne sont pas admis en Lituanie — ils ne peuvent être importés, détenus, élevés, achetés ni vendus. Un tel croisement déjà présent dans le pays doit être stérilisé."
    es: "Raza de combate (kovinių šunų veislė): el American Pit Bull Terrier. Los perros de combate, así como los cruces de perros de combate y peligrosos, no están permitidos en Lituania — no se pueden importar, tener, criar, comprar ni vender. Cualquier cruce de este tipo que ya se encuentre en el país debe esterilizarse."
    pt: "Raça de briga (kovinių šunų veislė): o American Pit Bull Terrier. Cachorros de briga, assim como cruzamentos de cachorros de briga e de cachorros perigosos, não são admitidos na Lituânia — não podem ser trazidos, mantidos, criados, comprados nem vendidos. Todo cruzamento desse tipo que já esteja no país precisa ser castrado."
  cat2:
    en: "Dangerous breeds (pavojingų šunų veislės): American Staffordshire Terrier, Staffordshire Bull Terrier, American Bulldog, Dogo Argentino, Fila Brasileiro (Brazilian Mastiff), Kangal (Turkish Shepherd), Caucasian Shepherd Dog and South Russian Shepherd Dog. To bring in, keep, breed, purchase or sell one, the owner (aged 18 or over) must hold a permit issued by the municipal administration of residence; the dog must be registered and identified with a microchip and kept under the VMVT keeping requirements, including muzzle and lead in public places."
    fr: "Races dangereuses (pavojingų šunų veislės) : American Staffordshire Terrier, Staffordshire Bull Terrier, American Bulldog, Dogue argentin, Fila Brasileiro (mâtin brésilien), Kangal (berger turc), berger du Caucase et berger de Russie méridionale. Pour en importer, détenir, élever, acheter ou vendre un, le propriétaire (âgé de 18 ans ou plus) doit détenir un permis délivré par l'administration municipale de résidence ; le chien doit être enregistré et identifié par une puce et détenu selon les exigences du VMVT, dont muselière et laisse dans les lieux publics."
    es: "Razas peligrosas (pavojingų šunų veislės): American Staffordshire Terrier, Staffordshire Bull Terrier, American Bulldog, Dogo Argentino, Fila Brasileiro (mastín brasileño), Kangal (pastor turco), pastor del Cáucaso y pastor de Rusia meridional. Para importar, tener, criar, comprar o vender uno, el propietario (de 18 años o más) debe disponer de un permiso expedido por la administración municipal de su residencia; el perro debe estar registrado e identificado con microchip y mantenerse conforme a los requisitos de tenencia del VMVT, incluidos bozal y correa en lugares públicos."
    pt: "Raças perigosas (pavojingų šunų veislės): American Staffordshire Terrier, Staffordshire Bull Terrier, American Bulldog, Dogo Argentino, Fila Brasileiro, Kangal (pastor da Anatólia), pastor do Cáucaso e pastor da Rússia Meridional. Para trazer, manter, criar, comprar ou vender um deles, o dono (com 18 anos ou mais) precisa de uma autorização emitida pela administração municipal do lugar onde mora; o cachorro deve estar registrado e identificado com microchip e ser mantido conforme as exigências de posse do VMVT, incluindo focinheira e guia em locais públicos."
  note:
    en: "A permit is issued by the municipal administration of the owner's place of residence and is refused to persons under 18. Confirm the current rules with VMVT and your municipality before travelling, as a dog resembling a listed breed may still be assessed as dangerous."
    fr: "Le permis est délivré par l'administration municipale du lieu de résidence du propriétaire et refusé aux personnes de moins de 18 ans. Confirme les règles en vigueur auprès du VMVT et de ton municipalité avant de voyager, car un chien ressemblant à une race listée peut néanmoins être évalué comme dangereux."
    es: "El permiso lo expide la administración municipal del lugar de residencia del propietario y se deniega a los menores de 18 años. Confirma las normas vigentes con el VMVT y tu municipio antes de viajar, ya que un perro que se parezca a una raza listada puede igualmente ser evaluado como peligroso."
    pt: "A autorização é emitida pela administração municipal do lugar de residência do dono e é recusada a menores de 18 anos. Confirme as regras em vigor com o VMVT e com o seu município antes de viajar, pois um cachorro parecido com uma raça listada ainda pode ser avaliado como perigoso."

