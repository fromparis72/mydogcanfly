origin:
  scheme: eu
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate and normally no border check."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire et normalement pas de contrôle frontalier."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario y normalmente sin control fronterizo."
      pt: "Um cachorro vindo de outro país da UE precisa de um passaporte europeu que comprove um microchip ISO válido e uma vacinação antirrábica em dia. Sem teste sorológico, sem certificado sanitário e, normalmente, sem controle de fronteira."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Switzerland, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination and an EU animal health certificate endorsed by an official vet before departure. No antibody test is required; present yourself to Latvian customs at a travellers' point of entry."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Suisse, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire européen visé par un vétérinaire officiel avant le départ. Pas de titrage ; présente-toi à la douane lettone à un point d'entrée voyageurs."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Suiza, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal de la UE refrendado por un veterinario oficial antes de la salida. No se exige prueba de titulación; preséntate ante la aduana letona en un punto de entrada de viajeros."
      pt: "Vindo de um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Suíça, Japão, Austrália e outros), seu cachorro precisa de microchip, vacinação antirrábica válida e certificado sanitário europeu endossado por um veterinário oficial antes da partida. Não é exigido teste sorológico; apresente-se à alfândega letã em um ponto de entrada de viajantes."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country — which for Latvia includes neighbouring Russia and Belarus — add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-designated laboratory, then a compulsory 3-month wait before entry. An endorsed EU animal health certificate is also required."
      fr: "Depuis un pays non listé (à risque) — ce qui, pour la Lettonie, inclut la Russie et la Biélorussie voisines — ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen visé est également requis."
      es: "Desde un país no listado (con riesgo) — que para Letonia incluye a los vecinos Rusia y Bielorrusia — añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exige un certificado sanitario animal de la UE refrendado."
      pt: "Vindo de um país não listado (de risco) — o que, no caso da Letônia, inclui a vizinha Rússia e a Bielorrússia —, acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório designado pela UE, e depois 3 meses obrigatórios de espera antes da entrada. Também é exigido um certificado sanitário europeu endossado."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Latvia depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien en Lettonie dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Letonia depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega à Letônia depende do país de onde você veio."
  points:
    - from: eu
      en: "From another EU country: no systematic border check — keep the EU pet passport with you."
      fr: "Depuis un autre pays de l'UE : pas de contrôle systématique — garde le passeport européen sur toi."
      es: "Desde otro país de la UE: sin control fronterizo sistemático — lleva contigo el pasaporte europeo."
      pt: "De outro país da UE: sem controle de fronteira sistemático — leve o passaporte europeu com você."
    - from: non_eu
      en: "From outside the EU: enter via a travellers' point of entry and present your dog spontaneously to Latvian customs (VID) for documentary and identity checks."
      fr: "Depuis hors UE : entre par un point d'entrée voyageurs et présente ton chien spontanément à la douane lettone (VID) pour les contrôles documentaires et d'identité."
      es: "Desde fuera de la UE: entra por un punto de entrada de viajeros y presenta a tu perro espontáneamente ante la aduana letona (VID) para los controles documentales y de identidad."
      pt: "De fora da UE: entre por um ponto de entrada de viajantes e apresente seu cachorro espontaneamente à alfândega letã (VID) para os controles de documentos e de identificação."
    - en: "Commercial-type movements or more than five animals without exemption are handled at the Food and Veterinary Service border control posts of Terehova and Pāternieki."
      fr: "Les mouvements de type commercial ou de plus de cinq animaux sans dérogation sont traités aux postes de contrôle frontalier du Service alimentaire et vétérinaire de Terehova et Pāternieki."
      es: "Los movimientos de tipo comercial o de más de cinco animales sin exención se gestionan en los puestos de control fronterizo del Servicio Alimentario y Veterinario de Terehova y Pāternieki."
      pt: "Deslocamentos de tipo comercial ou com mais de cinco animais sem isenção são tratados nos postos de controle de fronteira do PVD (Pārtikas un veterinārais dienests, Serviço Alimentar e Veterinário) de Terehova e Pāternieki."
    - en: "No import permit is issued and no prior appointment with customs is needed."
      fr: "Aucun permis d'import n'est délivré et aucun rendez-vous préalable avec la douane n'est nécessaire."
      es: "No se expide ningún permiso de importación ni se necesita cita previa con la aduana."
      pt: "Não é emitida autorização de importação e não é preciso agendamento prévio com a alfândega."
    - en: "Carry original documents (not copies); the health certificate must be in Latvian and English."
      fr: "Munis-toi des documents originaux (pas de copies) ; le certificat sanitaire doit être en letton et en anglais."
      es: "Lleva los documentos originales (no copias); el certificado sanitario debe estar en letón y en inglés."
      pt: "Leve os documentos originais (não cópias); o certificado sanitário precisa estar em letão e em inglês."
    - en: "If documents are missing or invalid, authorities may order return to the country of dispatch, isolation under official control, or euthanasia — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, les autorités peuvent ordonner le renvoi vers le pays d'expédition, l'isolement sous contrôle officiel ou l'euthanasie — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, las autoridades pueden ordenar la devolución al país de expedición, el aislamiento bajo control oficial o la eutanasia — a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, as autoridades podem determinar a devolução ao país de expedição, o isolamento sob controle oficial ou a eutanásia — às custas do dono."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Latvia has no national breed-specific ban: no dog breed is prohibited from being imported, kept or owned. Instead, dangerous dogs are identified individually under the Animal Protection Law (Dzīvnieku aizsardzības likums), and all owners share the same registration and welfare duties."
    fr: "La Lettonie n'a aucune interdiction nationale visant des races : aucune race de chien n'est interdite d'importation, de détention ou de propriété. Les chiens dangereux sont plutôt identifiés au cas par cas selon la loi sur la protection des animaux (Dzīvnieku aizsardzības likums), et tous les propriétaires ont les mêmes obligations d'enregistrement et de bien-être."
    es: "Letonia no tiene ninguna prohibición nacional específica por raza: ninguna raza de perro está prohibida para su importación, tenencia o propiedad. En su lugar, los perros peligrosos se identifican individualmente conforme a la Ley de Protección Animal (Dzīvnieku aizsardzības likums), y todos los propietarios comparten las mismas obligaciones de registro y bienestar."
    pt: "A Letônia não tem nenhuma proibição nacional dirigida a raças: nenhuma raça de cachorro é proibida de ser importada, mantida ou possuída. Em vez disso, os cachorros perigosos são identificados caso a caso pela Lei de Proteção Animal (Dzīvnieku aizsardzības likums), e todos os donos têm os mesmos deveres de registro e de bem-estar."
  cat1:
    en: "Individual assessment, not a breed list: under Section 5.1 of the Animal Protection Law a dog is recognised as dangerous only by a behaviour-assessment commission set up by the Food and Veterinary Service (PVD), based on the individual dog's behaviour — never automatically because of its breed or appearance."
    fr: "Évaluation individuelle, pas de liste de races : selon l'article 5.1 de la loi sur la protection des animaux, un chien n'est reconnu dangereux que par une commission d'évaluation comportementale établie par le Service alimentaire et vétérinaire (PVD), sur la base du comportement du chien concerné — jamais automatiquement en raison de sa race ou de son apparence."
    es: "Evaluación individual, no una lista de razas: según el artículo 5.1 de la Ley de Protección Animal, un perro solo se reconoce como peligroso mediante una comisión de evaluación del comportamiento creada por el Servicio Alimentario y Veterinario (PVD), basada en el comportamiento individual del perro — nunca automáticamente por su raza o apariencia."
    pt: "Avaliação individual, e não lista de raças: pelo artigo 5.1 da Lei de Proteção Animal, um cachorro só é reconhecido como perigoso por uma comissão de avaliação comportamental constituída pelo PVD (Pārtikas un veterinārais dienests, Serviço Alimentar e Veterinário), com base no comportamento daquele cachorro em particular — nunca de forma automática por causa da raça ou da aparência."
  cat2:
    en: "Owner responsibility: every dog must be microchipped and registered in the Agricultural Data Centre pet register, and the owner must keep the animal safely and prevent it from endangering people or other animals. Once a dog is declared dangerous, extra keeping requirements set by Cabinet regulation apply."
    fr: "Responsabilité du propriétaire : tout chien doit être pucé et enregistré au registre des animaux du Centre de données agricoles, et le propriétaire doit détenir l'animal en sécurité et l'empêcher de mettre en danger les personnes ou d'autres animaux. Dès qu'un chien est déclaré dangereux, des exigences de détention supplémentaires fixées par règlement du Cabinet s'appliquent."
    es: "Responsabilidad del propietario: todo perro debe llevar microchip y estar registrado en el registro de mascotas del Centro de Datos Agrícolas, y el propietario debe mantener al animal de forma segura e impedir que ponga en peligro a personas u otros animales. Una vez que un perro se declara peligroso, se aplican requisitos de tenencia adicionales establecidos por reglamento del Gabinete."
    pt: "Responsabilidade do dono: todo cachorro precisa ter microchip e estar registrado no cadastro de animais de estimação do Centro de Dados Agrícolas (Lauksaimniecības datu centrs), e o dono deve manter o animal em segurança e impedir que ele ponha em risco pessoas ou outros animais. Uma vez declarado perigoso, passam a valer exigências adicionais de posse fixadas por regulamento do Conselho de Ministros."
  note:
    en: "Because there is no breed ban, no dog is refused entry to Latvia purely on the basis of its breed. For the exact keeping rules for a dog already assessed as dangerous, contact the Food and Veterinary Service (PVD)."
    fr: "Comme il n'existe aucune interdiction de race, aucun chien n'est refusé à l'entrée en Lettonie du seul fait de sa race. Pour les règles exactes de détention d'un chien déjà évalué comme dangereux, contacte le Service alimentaire et vétérinaire (PVD)."
    es: "Como no existe ninguna prohibición de raza, a ningún perro se le niega la entrada en Letonia únicamente por su raza. Para conocer las normas exactas de tenencia de un perro ya evaluado como peligroso, contacta con el Servicio Alimentario y Veterinario (PVD)."
    pt: "Como não existe proibição de raças, nenhum cachorro tem a entrada na Letônia recusada apenas por causa da raça. Para as regras exatas de posse de um cachorro já avaliado como perigoso, entre em contato com o PVD (Pārtikas un veterinārais dienests, Serviço Alimentar e Veterinário)."

