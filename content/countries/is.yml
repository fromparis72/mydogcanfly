# Country Entry Guide — Iceland (source of truth, bilingual EN/FR).
# Iceland is EEA (EFTA) but NOT in the EU: it runs its own strict national import scheme (MAST),
# not the EU pet-passport framework. Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_is
iso2: "IS"
name: { en: "Iceland", fr: "Islande", es: "Islandia", pt: "Islândia" }
region: { en: "Europe (EEA, non-EU)", fr: "Europe (EEE, hors UE)", es: "Europa (EEE, fuera de la UE)", pt: "Europa (EEE, fora da UE)" }


regime: island_strict

hero:
  h1: { en: "Traveling to Iceland with your dog", fr: "Voyager en Islande avec ton chien", es: "Viajar a Islandia con tu perro", pt: "Viajar para a Islândia com seu cachorro" }
  intro:
    en: >-
      Iceland has one of the strictest pet-import regimes in the world, and it is not the EU system.
      Although Iceland is part of the EEA, it is not an EU member and does not use the EU pet passport.
      Every dog — even for a two-week holiday — is treated as an import: it needs an import permit from
      MAST (the Icelandic Food and Veterinary Authority), may come only from an approved country, must
      complete a long list of vaccinations, a rabies antibody test and parasite treatments, and must
      then spend at least 14 days in a government quarantine station on arrival. There is no way around
      the quarantine for ordinary pets. Preparation takes months, so start early. This guide explains
      the whole path so you know exactly what to arrange before you book your flight to Keflavík.
    fr: >-
      L'Islande applique l'un des régimes d'importation d'animaux les plus stricts au monde, et ce n'est
      pas le système de l'UE. Bien que l'Islande fasse partie de l'EEE, elle n'est pas membre de l'UE et
      n'utilise pas le passeport européen. Tout chien — même pour deux semaines de vacances — est
      considéré comme une importation : il faut un permis d'importation de MAST (l'Autorité islandaise
      de l'alimentation et vétérinaire), l'animal ne peut venir que d'un pays approuvé, doit recevoir une
      longue liste de vaccinations, un titrage antirabique et des traitements antiparasitaires, puis
      passer au moins 14 jours en station de quarantaine officielle à l'arrivée. Il n'existe aucune
      dérogation à la quarantaine pour les animaux ordinaires. La préparation prend des mois : anticipe.
      Ce guide détaille tout le parcours pour savoir exactement quoi organiser avant de réserver ton
      vol vers Keflavík.
    es: >-
      Islandia tiene uno de los regímenes de importación de mascotas más estrictos del mundo, y no es el
      sistema de la UE. Aunque Islandia forma parte del EEE, no es miembro de la UE y no utiliza el
      pasaporte europeo para mascotas. Todo perro —incluso para unas vacaciones de dos semanas— se trata
      como una importación: necesita un permiso de importación de MAST (la Autoridad Islandesa de
      Alimentación y Veterinaria), solo puede proceder de un país aprobado, debe completar una larga
      lista de vacunas, una prueba de titulación de rabia y tratamientos antiparasitarios, y luego debe
      pasar al menos 14 días en una estación de cuarentena gubernamental a su llegada. No existe forma de
      evitar la cuarentena para mascotas ordinarias. La preparación lleva meses, así que empieza pronto.
      Esta guía explica todo el recorrido para que sepas exactamente qué organizar antes de reservar tu
      vuelo a Keflavík.

    pt: "A Islândia tem um dos regimes de importação de animais de estimação mais rigorosos do mundo, e ele não é o sistema da UE. Embora a Islândia faça parte do EEE, ela não é membro da UE e não usa o passaporte europeu para animais. Todo cachorro — mesmo para umas férias de duas semanas — é tratado como importação: precisa de uma autorização de importação da MAST (a Icelandic Food and Veterinary Authority, autoridade islandesa de alimentos e veterinária), só pode vir de um país aprovado, precisa cumprir uma longa lista de vacinações, um teste sorológico antirrábico e tratamentos antiparasitários e, depois, passar pelo menos 14 dias em uma estação de quarentena do governo na chegada. Não há como escapar da quarentena para os animais de estimação comuns. A preparação leva meses, então comece cedo. Este guia explica todo o percurso para você saber exatamente o que providenciar antes de comprar a passagem para Keflavík."
difficulty:
  level: difficult
  label: { en: "Difficult — import permit and mandatory quarantine", fr: "Difficile — permis d'importation et quarantaine obligatoire", es: "Difícil — permiso de importación y cuarentena obligatoria", pt: "Difícil — autorização de importação e quarentena obrigatória" }

prepTime:
  eu:
    en: "Category 1 (rabies-free approved country): ~1.5–3 months — microchip, rabies vaccination, antibody test at least 30 days later (no waiting after result), other vaccines, two parasite treatments, plus a booked quarantine slot."
    fr: "Catégorie 1 (pays approuvé indemne de rage) : ~1,5 à 3 mois — puce, vaccin antirabique, titrage au moins 30 jours après (sans attente après le résultat), autres vaccins, deux traitements antiparasitaires, plus un créneau de quarantaine réservé."
    es: "Categoría 1 (país aprobado libre de rabia): ~1,5–3 meses — microchip, vacunación antirrábica, prueba de titulación al menos 30 días después (sin espera tras el resultado), otras vacunas, dos tratamientos antiparasitarios, más una plaza de cuarentena reservada."
    pt: "Categoria 1 (país aprovado livre de raiva): ~1,5–3 meses — microchip, vacinação antirrábica, teste sorológico pelo menos 30 dias depois (sem espera após o resultado), outras vacinas, dois tratamentos antiparasitários, mais uma vaga de quarentena reservada."
  listed:
    en: "Category 2 (approved, rabies controlled): ~4–5 months — the same steps plus a compulsory 90-day wait counted from the antibody blood sampling before the dog may enter."
    fr: "Catégorie 2 (approuvé, rage maîtrisée) : ~4 à 5 mois — les mêmes étapes plus un délai obligatoire de 90 jours compté depuis la prise de sang du titrage avant l'entrée du chien."
    es: "Categoría 2 (aprobado, rabia controlada): ~4–5 meses — los mismos pasos más una espera obligatoria de 90 días contada desde la extracción de sangre para la prueba de titulación antes de que el perro pueda entrar."
    pt: "Categoria 2 (aprovado, raiva controlada): ~4–5 meses — as mesmas etapas mais uma espera obrigatória de 90 dias contada a partir da coleta de sangue do teste sorológico antes de o cachorro poder entrar."
  nonListed:
    en: "Non-approved country: ~6+ months and only for a resident moving to Iceland who has owned the dog abroad for at least 6 months; Category 2 conditions apply, including canine influenza vaccination."
    fr: "Pays non approuvé : ~6 mois et plus, et uniquement pour un résident s'installant en Islande ayant possédé le chien à l'étranger depuis au moins 6 mois ; conditions de catégorie 2, y compris vaccination contre la grippe canine."
    es: "País no aprobado: ~6 meses o más, y solo para un residente que se traslada a Islandia y que ha tenido al perro en el extranjero durante al menos 6 meses; se aplican las condiciones de la categoría 2, incluida la vacunación contra la gripe canina."
    pt: "País não aprovado: ~6 meses ou mais, e somente para um residente que está se mudando para a Islândia e que teve o cachorro no exterior por pelo menos 6 meses; aplicam-se as condições da categoria 2, incluindo a vacinação contra a gripe canina."

