# Country Entry Guide — Kazakhstan (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_kz
iso2: "KZ"
name: { en: "Kazakhstan", fr: "Kazakhstan", es: "Kazajistán", pt: "Cazaquistão" }
region: { en: "Central Asia", fr: "Asie centrale", es: "Asia Central", pt: "Ásia Central" }


regime: non_listed
exit:
  authority: Committee for Veterinary Control
  authorityUrl: https://www.gov.kz/memleket/entities/vetcontrol?lang=en
  intro:
    en: "Kazakhstan is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Committee for Veterinary Control and Supervision (Ministry of Agriculture)."
    fr: "Le Kazakhstan est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par le Comité de contrôle et de supervision vétérinaires (ministère de l'Agriculture)."
    es: "Kazajistán no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el Comité de Control y Supervisión Veterinaria (Ministerio de Agricultura)."
    pt: "O Cazaquistão não é um país listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para retornar à UE — além de um certificado veterinário de exportação endossado pelo Committee for Veterinary Control and Supervision (Ministério da Agricultura)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico (titulação): exame de sangue em um laboratório aprovado pela UE, pelo menos 30 dias após a vacinação — um resultado válido é essencial para retornar à UE e não pode ser resolvido de última hora."
    - timing: window
      scope: any
      text:
        en: "The Committee's territorial veterinary inspectors issue the veterinary certificate for the exported animal, applied for via the state e-government portal."
        fr: "Les inspecteurs vétérinaires territoriaux du Comité délivrent le certificat vétérinaire pour l'animal exporté, demandé via le portail e-gouvernement de l'État."
        es: "Los inspectores veterinarios territoriales del Comité emiten el certificado veterinario para el animal exportado, solicitado a través del portal estatal de gobierno electrónico."
        pt: "Os inspetores veterinários territoriais do Committee emitem o certificado veterinário para o animal exportado, solicitado por meio do portal estatal de governo eletrônico."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico (titulação) da UE válido antes de sair, ele continua válido por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Kazakhstan with your dog", fr: "Voyager au Kazakhstan avec ton chien", es: "Viajar a Kazajistán con tu perro", pt: "Viajar para o Cazaquistão com seu cachorro" }
  intro:
    en: >-
      Kazakhstan is not part of the EU: it is a member of the Eurasian Economic Union (EAEU) and applies
      the Union's common veterinary requirements, enforced by the Veterinary Control and Surveillance
      Committee of the Ministry of Agriculture. A dog travelling for personal use — up to two animals per
      owner — can enter without an import permit and without quarantine, provided it carries a valid rabies
      vaccination, the other vaccinations required for dogs, and an official veterinary certificate from the
      state veterinary service of the country of departure, issued after a clinical examination within five
      days of travel. What you must prepare still depends on your dog's country of departure and how many
      animals you bring. This guide explains the standard EAEU path and the cases where an import permit and
      quarantine apply, so you know what to organise before you fly.
    fr: >-
      Le Kazakhstan ne fait pas partie de l'UE : il est membre de l'Union économique eurasiatique (UEEA) et
      applique les exigences vétérinaires communes de l'Union, mises en œuvre par le Comité de contrôle et de
      surveillance vétérinaires du ministère de l'Agriculture. Un chien voyageant à titre personnel — jusqu'à
      deux animaux par propriétaire — peut entrer sans permis d'importation et sans quarantaine, à condition
      d'avoir une vaccination antirabique valide, les autres vaccins exigés pour les chiens, et un certificat
      vétérinaire officiel du service vétérinaire d'État du pays de départ, établi après un examen clinique
      dans les cinq jours précédant le voyage. Ce qu'il faut préparer dépend aussi du pays de départ et du
      nombre d'animaux. Ce guide détaille le parcours standard UEEA et les cas où un permis et une quarantaine
      s'appliquent, pour savoir quoi organiser avant de partir.
    es: >-
      Kazajistán no forma parte de la UE: es miembro de la Unión Económica Euroasiática (UEEA) y aplica
      los requisitos veterinarios comunes de la Unión, aplicados por el Comité de Control y Vigilancia
      Veterinaria del Ministerio de Agricultura. Un perro que viaja a título personal — hasta dos animales
      por propietario — puede entrar sin permiso de importación y sin cuarentena, siempre que lleve una
      vacunación antirrábica válida, las demás vacunas exigidas para los perros y un certificado
      veterinario oficial del servicio veterinario estatal del país de salida, expedido tras un examen
      clínico dentro de los cinco días previos al viaje. Lo que debes preparar depende también del país
      de salida de tu perro y de cuántos animales lleves. Esta guía explica la vía estándar de la UEEA y
      los casos en los que se aplican un permiso de importación y la cuarentena, para que sepas qué
      organizar antes de volar.

    pt: "O Cazaquistão não faz parte da UE: é membro da União Econômica Eurasiática (UEE) e aplica as exigências veterinárias comuns da União, impostas pelo Veterinary Control and Surveillance Committee do Ministério da Agricultura. Um cachorro que viaja para uso pessoal — até dois animais por dono — pode entrar sem autorização de importação e sem quarentena, desde que porte uma vacinação antirrábica válida, as outras vacinas exigidas para cachorros e um certificado veterinário oficial do serviço veterinário estatal do país de partida, emitido após um exame clínico dentro de cinco dias antes da viagem. O que você precisa preparar ainda depende do país de partida do seu cachorro e de quantos animais você leva. Este guia explica o caminho padrão da UEE e os casos em que se aplicam autorização de importação e quarentena, para você saber o que organizar antes de voar."
difficulty:
  level: moderate
  label: { en: "Moderate (vaccinations + veterinary certificate)", fr: "Modéré (vaccins + certificat vétérinaire)", es: "Moderado (vacunas + certificado veterinario)", pt: "Moderado (vacinas + certificado veterinário)" }

prepTime:
  eu:
    en: "From another EAEU country (Russia, Belarus, Armenia, Kyrgyzstan): a few days if the vaccinations are up to date and recorded in the veterinary passport."
    fr: "Depuis un autre pays de l'UEEA (Russie, Biélorussie, Arménie, Kirghizistan) : quelques jours si les vaccins sont à jour et consignés dans le passeport vétérinaire."
    es: "Desde otro país de la UEEA (Rusia, Bielorrusia, Armenia, Kirguistán): unos días si las vacunas están al día y registradas en el pasaporte veterinario."
    pt: "De outro país da UEE (Rússia, Belarus, Armênia, Quirguistão): alguns dias se as vacinas já estiverem em dia e registradas no passaporte veterinário."
  listed:
    en: "From any other country, up to 2 pets: about 3 weeks if the primary rabies shot and the other dog vaccinations are still needed (given more than 20 days before departure), plus the 5-day clinical exam and export certificate."
    fr: "Depuis tout autre pays, jusqu'à 2 animaux : environ 3 semaines si la primo-vaccination antirabique et les autres vaccins du chien restent à faire (plus de 20 jours avant le départ), plus l'examen clinique des 5 jours et le certificat d'export."
    es: "Desde cualquier otro país, hasta 2 mascotas: unas 3 semanas si aún faltan la primovacunación antirrábica y las demás vacunas del perro (administradas más de 20 días antes de la salida), más el examen clínico de los 5 días y el certificado de exportación."
    pt: "De qualquer outro país, até 2 animais: cerca de 3 semanas se a primovacinação antirrábica e as outras vacinas do cachorro ainda forem necessárias (aplicadas há mais de 20 dias antes da partida), além do exame clínico de 5 dias e do certificado de exportação."
  nonListed:
    en: "More than 2 animals or a commercial import: several weeks — an import permit must be obtained in advance and a 21-day pre-export quarantine applies."
    fr: "Plus de 2 animaux ou import commercial : plusieurs semaines — un permis d'importation doit être obtenu à l'avance et une quarantaine de 21 jours avant export s'applique."
    es: "Más de 2 animales o una importación comercial: varias semanas — debe obtenerse un permiso de importación por adelantado y se aplica una cuarentena de 21 días previa a la exportación."
    pt: "Mais de 2 animais ou uma importação comercial: várias semanas — uma autorização de importação precisa ser obtida com antecedência, e se aplica uma quarentena de 21 dias antes da exportação."

