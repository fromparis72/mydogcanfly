# Country Entry Guide — Oman (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_om
iso2: "OM"
name: { en: "Oman", fr: "Oman", es: "Omán", pt: "Omã" }
region: { en: "Middle East", fr: "Moyen-Orient", es: "Oriente Medio", pt: "Oriente Médio" }


regime: non_listed

hero:
  h1: { en: "Traveling to Oman with your dog", fr: "Voyager à Oman avec ton chien", es: "Viajar a Omán con tu perro", pt: "Viajar para Omã com seu cachorro" }
  intro:
    en: >-
      Oman welcomes pet dogs, but entry runs through the country's own scheme, not the EU framework.
      Before your dog travels you must obtain a PRIOR veterinary import permit from the Ministry of
      Agriculture, Fisheries Wealth and Water Resources (Veterinary Quarantine Department), applied for
      through the Customs "Bayan" system. On top of the permit, your dog needs an electronic microchip, a
      valid rabies vaccination and — for every origin — a rabies antibody test carried out by an
      accredited laboratory. Oman follows the recommendations of the World Organisation for Animal Health
      (WOAH-OIE), so the same core procedure applies whatever country your dog leaves from. The exact
      timing depends on the country your dog is travelling from, its vaccination and blood-test dates, and
      its breed. This guide explains the permit, the tests, the minimum age and the banned breeds so you
      know what to prepare before you book.
    fr: >-
      Oman accueille les chiens, mais l'entrée passe par le dispositif propre au pays, pas par le cadre de
      l'UE. Avant le voyage de ton chien, tu dois obtenir un permis vétérinaire d'importation
      PRÉALABLE auprès du ministère de l'Agriculture, de la Richesse halieutique et des Ressources en eau
      (département de la quarantaine vétérinaire), demandé via le système douanier « Bayan ». Outre le
      permis, ton chien doit avoir une puce électronique, une vaccination antirabique valide et — pour
      toute origine — un titrage des anticorps antirabiques réalisé par un laboratoire agréé. Oman suit les
      recommandations de l'Organisation mondiale de la santé animale (WOAH-OIE), de sorte que la même
      procédure de base s'applique quel que soit le pays de départ. Le calendrier exact dépend du pays de
      départ, des dates de vaccination et de prise de sang, et de la race. Ce guide détaille le permis, les
      tests, l'âge minimum et les races interdites pour savoir quoi préparer avant de réserver.
    es: >-
      Omán acoge a los perros de compañía, pero la entrada pasa por el régimen propio del país, no por el
      marco de la UE. Antes de que tu perro viaje debes obtener un permiso veterinario de importación PREVIO
      del Ministerio de Agricultura, Riqueza Pesquera y Recursos Hídricos (Departamento de Cuarentena
      Veterinaria), solicitado a través del sistema aduanero «Bayan». Además del permiso, tu perro necesita
      un microchip electrónico, una vacunación antirrábica válida y — para cualquier origen — una prueba de
      titulación de anticuerpos contra la rabia realizada por un laboratorio acreditado. Omán sigue las
      recomendaciones de la Organización Mundial de Sanidad Animal (WOAH-OIE), por lo que el mismo
      procedimiento básico se aplica sea cual sea el país desde el que sale tu perro. El calendario exacto
      depende del país de salida, de las fechas de vacunación y de análisis de sangre, y de la raza. Esta
      guía explica el permiso, las pruebas, la edad mínima y las razas prohibidas para que sepas qué
      preparar antes de reservar.

    pt: "Omã recebe cachorros de estimação, mas a entrada segue o sistema próprio do país, e não o regime da UE. Antes de o seu cachorro viajar, você precisa obter uma autorização veterinária PRÉVIA junto ao Ministério da Agricultura, Riqueza Pesqueira e Recursos Hídricos (Departamento de Quarentena Veterinária), solicitada por meio do sistema alfandegário \"Bayan\". Além da autorização, o seu cachorro precisa de um microchip eletrônico, uma vacinação antirrábica válida e — para qualquer origem — um teste sorológico antirrábico realizado por um laboratório credenciado. Omã segue as recomendações da Organização Mundial de Saúde Animal (WOAH-OIE), portanto o mesmo procedimento central se aplica seja qual for o país de onde o seu cachorro parte. O prazo exato depende do país de onde o seu cachorro está viajando, das datas da vacinação e do exame de sangue, e da raça. Este guia explica a autorização, os exames, a idade mínima e as raças proibidas para você saber o que preparar antes de reservar."
difficulty:
  level: moderate
  label: { en: "Moderate — advance import permit and rabies antibody test required", fr: "Modéré — permis d'importation préalable et titrage antirabique requis", es: "Moderado — se exigen permiso de importación previo y prueba de titulación de rabia", pt: "Moderado — autorização de importação prévia e teste sorológico antirrábico obrigatórios" }

prepTime:
  eu:
    en: "From the EU or another country: plan several months. The rabies antibody test blood sample is taken 21–30 days after the rabies vaccination, and its result must be at least 3 months old (and under 12 months) when the dog is exported."
    fr: "Depuis l'UE ou un autre pays : compte plusieurs mois. Le prélèvement du titrage antirabique est effectué 21–30 jours après la vaccination antirabique, et son résultat doit avoir au moins 3 mois (et moins de 12 mois) au moment de l'exportation du chien."
    es: "Desde la UE u otro país: planifica varios meses. La muestra de sangre para la prueba de titulación de rabia se toma 21–30 días después de la vacunación antirrábica, y su resultado debe tener al menos 3 meses (y menos de 12 meses) en el momento de la exportación del perro."
    pt: "Da UE ou de outro país: planeje vários meses. A coleta de sangue para o teste sorológico antirrábico é feita de 21 a 30 dias após a vacinação antirrábica, e o resultado deve ter pelo menos 3 meses (e menos de 12 meses) quando o cachorro for exportado."
  listed:
    en: "Oman applies one WOAH-based scheme to all origins: microchip, rabies vaccination, rabies antibody test and the advance veterinary permit are always required — the 3-month post-test waiting period drives the overall timeline."
    fr: "Oman applique un dispositif unique fondé sur WOAH à toutes les origines : puce, vaccination antirabique, titrage antirabique et permis vétérinaire préalable sont toujours requis — le délai d'attente de 3 mois après le test conditionne le calendrier global."
    es: "Omán aplica un único régimen basado en la WOAH a todos los orígenes: microchip, vacunación antirrábica, prueba de titulación de rabia y el permiso veterinario previo son siempre obligatorios — el período de espera de 3 meses tras la prueba marca el calendario global."
    pt: "Omã aplica um único regime baseado na WOAH para todas as origens: microchip, vacinação antirrábica, teste sorológico antirrábico e a autorização veterinária prévia são sempre exigidos — o período de espera de 3 meses após o teste é o que determina o prazo geral."
  nonListed:
    en: "If your dog is a banned breed, under 4 months old, or its documents/blood-test dates are out of range, import is refused — timing cannot be assumed and eligibility must be confirmed first."
    fr: "Si ton chien est d'une race interdite, a moins de 4 mois, ou si ses documents/dates de prise de sang sont hors délais, l'importation est refusée — les délais ne peuvent être présumés et l'éligibilité doit d'abord être confirmée."
    es: "Si tu perro es de una raza prohibida, tiene menos de 4 meses, o sus documentos/fechas de análisis de sangre están fuera de plazo, se deniega la importación — no se pueden dar por supuestos los plazos y primero debe confirmarse la elegibilidad."
    pt: "Se o seu cachorro for de uma raça proibida, tiver menos de 4 meses ou se os documentos/as datas do exame de sangue estiverem fora do prazo, a importação é recusada — o prazo não pode ser presumido e a elegibilidade precisa ser confirmada antes."

