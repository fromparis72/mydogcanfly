  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "Effectively ≥15 weeks", fr: "En pratique ≥15 semaines", es: "En la práctica ≥15 semanas", pt: "Na prática, ≥15 semanas" }
    when: { en: "12-week rabies shot + 21-day wait (listed); about 7 months from a non-listed country.", fr: "Vaccin à 12 semaines + 21 jours (pays listé) ; environ 7 mois depuis un pays non listé.", es: "Vacuna a las 12 semanas + espera de 21 días (país listado); unos 7 meses desde un país no listado.", pt: "Vacina antirrábica às 12 semanas + 21 dias de espera (país listado); cerca de 7 meses vindo de um país não listado." }
    exceptions: { en: "Unvaccinated young dogs may enter from another EU country with a passport if Estonia is the destination, but not from non-EU countries.", fr: "Un jeune chien non vacciné peut entrer depuis un autre pays de l'UE avec un passeport si l'Estonie est la destination, mais pas depuis un pays hors UE.", es: "Los perros jóvenes sin vacunar pueden entrar desde otro país de la UE con pasaporte si Estonia es el destino, pero no desde países fuera de la UE.", pt: "Cachorros jovens não vacinados podem entrar vindos de outro país da UE com passaporte, se a Estônia for o destino, mas não a partir de países fora da UE." }
