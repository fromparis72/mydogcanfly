origin:
  scheme: eu
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate and normally no border check. The same simplified rules apply to Norway, Switzerland, Andorra, Iceland, Liechtenstein, Monaco, San Marino, Vatican, the Faroe Islands, Gibraltar and Greenland."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire et normalement pas de contrôle frontalier. Les mêmes règles simplifiées s'appliquent à la Norvège, la Suisse, l'Andorre, l'Islande, le Liechtenstein, Monaco, Saint-Marin, le Vatican, les Îles Féroé, Gibraltar et le Groenland."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario y normalmente sin control fronterizo. Las mismas normas simplificadas se aplican a Noruega, Suiza, Andorra, Islandia, Liechtenstein, Mónaco, San Marino, el Vaticano, las Islas Feroe, Gibraltar y Groenlandia."
      pt: "Um cachorro vindo de outro país da UE precisa de um passaporte europeu para animais que comprove um microchip ISO válido e uma vacinação antirrábica em dia. Sem teste sorológico, sem certificado sanitário e, normalmente, sem controle de fronteira. As mesmas regras simplificadas valem para Noruega, Suíça, Andorra, Islândia, Liechtenstein, Mônaco, San Marino, Vaticano, Ilhas Faroé, Gibraltar e Groenlândia."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Japan, Australia and others in Annex II part 2), your dog needs a microchip, a valid rabies vaccination and an EU animal health certificate endorsed by an official vet before departure, plus a signed non-commercial movement declaration. No antibody test is required; entry is via any border station open to international travellers, under EMTA supervision."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Japon, Australie et autres de l'annexe II partie 2), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire européen visé par un vétérinaire officiel avant le départ, plus une déclaration de mouvement non commercial signée. Pas de titrage ; l'entrée se fait par tout poste-frontière ouvert au trafic international voyageurs, sous la supervision de l'EMTA."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Japón, Australia y otros del anexo II parte 2), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal de la UE refrendado por un veterinario oficial antes de la salida, más una declaración de movimiento no comercial firmada. No se exige prueba de titulación; la entrada se realiza por cualquier puesto fronterizo abierto al tráfico internacional de viajeros, bajo la supervisión de la EMTA."
      pt: "Vindo de um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Japão, Austrália e outros do anexo II, parte 2), seu cachorro precisa de microchip, vacinação antirrábica válida e um certificado sanitário europeu endossado por um veterinário oficial antes da partida, além de uma declaração de deslocamento não comercial assinada. Não é exigido teste sorológico; a entrada é feita por qualquer posto de fronteira aberto ao tráfego internacional de viajantes, sob supervisão da EMTA."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-designated laboratory, then a compulsory 3-month wait before entry. An endorsed EU animal health certificate with the original laboratory report is also required. Bringing unvaccinated young dogs from non-EU countries is not allowed."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen visé accompagné du rapport de laboratoire original est également requis. L'entrée de jeunes chiens non vaccinés depuis un pays hors UE n'est pas autorisée."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exige un certificado sanitario animal de la UE refrendado junto con el informe de laboratorio original. No se permite traer perros jóvenes sin vacunar desde países fuera de la UE."
      pt: "Vindo de um país não listado (de risco), acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório designado pela UE, e depois 3 meses obrigatórios de espera antes da entrada. Também são exigidos um certificado sanitário europeu endossado e o laudo original do laboratório. Não é permitido levar cachorros jovens não vacinados de países fora da UE."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Estonia depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien en Estonie dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Estonia depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega à Estônia depende de onde você embarcou."
  points:
    - from: eu
      en: "From another EU country: no systematic border check — keep the EU pet passport with you."
      fr: "Depuis un autre pays de l'UE : pas de contrôle systématique — garde le passeport européen sur toi."
      es: "Desde otro país de la UE: sin control fronterizo sistemático — lleva contigo el pasaporte europeo."
      pt: "De outro país da UE: sem controle de fronteira sistemático — leve o passaporte europeu com você."
    - from: non_eu
      en: "From outside the EU: enter via any border station open to international travellers; supervision of the entry is carried out by the Estonian Tax and Customs Board (EMTA)."
      fr: "Depuis hors UE : entre par tout poste-frontière ouvert au trafic international voyageurs ; la supervision de l'entrée est assurée par le Bureau estonien des impôts et des douanes (EMTA)."
      es: "Desde fuera de la UE: entra por cualquier puesto fronterizo abierto al tráfico internacional de viajeros; la supervisión de la entrada la realiza la Junta Tributaria y Aduanera de Estonia (EMTA)."
      pt: "De fora da UE: entre por qualquer posto de fronteira aberto ao tráfego internacional de viajantes; a supervisão da entrada é feita pelo Conselho Tributário e Aduaneiro da Estônia (EMTA)."
    - en: "No import permit is issued and no prior appointment with customs is needed for non-commercial pet travel."
      fr: "Aucun permis d'import n'est délivré et aucun rendez-vous préalable avec la douane n'est nécessaire pour le voyage non commercial."
      es: "No se expide ningún permiso de importación ni se necesita cita previa con la aduana para el viaje no comercial."
      pt: "Nenhuma autorização de importação é emitida e não é preciso agendamento prévio na alfândega para a viagem não comercial com animal de estimação."
    - en: "Carry the original documents (not copies); the health certificate must be in English and Estonian, and be accompanied by the signed non-commercial movement declaration."
      fr: "Munis-toi des documents originaux (pas de copies) ; le certificat sanitaire doit être en anglais et en estonien, accompagné de la déclaration de mouvement non commercial signée."
      es: "Lleva los documentos originales (no copias); el certificado sanitario debe estar en inglés y estonio, y ir acompañado de la declaración de movimiento no comercial firmada."
      pt: "Leve os documentos originais (não cópias); o certificado sanitário precisa estar em inglês e em estoniano e vir acompanhado da declaração de deslocamento não comercial assinada."
    - en: "If documents are missing or invalid, the animal is treated as a commercial import subject to veterinary checks, and customs may refuse entry or order other measures at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, l'animal est traité comme une importation commerciale soumise à des contrôles vétérinaires, et la douane peut refuser l'entrée ou ordonner d'autres mesures aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, el animal se trata como una importación comercial sujeta a controles veterinarios, y la aduana puede denegar la entrada u ordenar otras medidas a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, o animal é tratado como importação comercial sujeita a controles veterinários, e a alfândega pode recusar a entrada ou determinar outras medidas às custas do dono."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Estonia has no national breed ban: no dog breed is prohibited from entering the country by law. Dangerous-dog control is based on owner responsibility and is handled at the local (municipal) level rather than by a national breed list."
    fr: "L'Estonie n'a pas d'interdiction nationale de races : aucune race de chien n'est légalement interdite d'entrée dans le pays. Le contrôle des chiens dangereux repose sur la responsabilité du propriétaire et relève de l'échelon local (municipal) plutôt que d'une liste nationale de races."
    es: "Estonia no tiene una prohibición nacional de razas: ninguna raza de perro tiene prohibida por ley la entrada al país. El control de los perros peligrosos se basa en la responsabilidad del propietario y se gestiona a nivel local (municipal) en lugar de mediante una lista nacional de razas."
    pt: "A Estônia não tem proibição nacional de raças: nenhuma raça de cachorro está proibida por lei de entrar no país. O controle dos cachorros perigosos se baseia na responsabilidade do dono e é tratado no nível local (municipal), e não por uma lista nacional de raças."
  cat1:
    en: "There is no legally defined 'Category 1' of banned breeds. A dog is treated as dangerous on the basis of its individual behaviour, not its breed. Estonia's Animal Protection Act sets general keeping and welfare duties, and municipal by-laws (eeskirjad) may require measures such as a muzzle and lead in public places."
    fr: "Il n'existe pas de « catégorie 1 » de races interdites définie par la loi. Un chien est considéré comme dangereux sur la base de son comportement individuel, et non de sa race. La loi estonienne sur la protection des animaux (Animal Protection Act) fixe des devoirs généraux de détention et de bien-être, et les règlements municipaux (eeskirjad) peuvent imposer des mesures comme la muselière et la laisse dans les lieux publics."
    es: "No existe una «categoría 1» de razas prohibidas definida por ley. Un perro se considera peligroso en función de su comportamiento individual, no de su raza. La Ley de Protección Animal de Estonia establece deberes generales de tenencia y bienestar, y las ordenanzas municipales (eeskirjad) pueden exigir medidas como el bozal y la correa en los lugares públicos."
    pt: "Não existe uma “categoria 1” de raças proibidas definida em lei. Um cachorro é tratado como perigoso com base no comportamento individual dele, e não na raça. A Lei de Proteção Animal da Estônia (Animal Protection Act) fixa deveres gerais de posse e bem-estar, e as posturas municipais (eeskirjad) podem exigir medidas como focinheira e guia em locais públicos."
  cat2:
    en: "There is likewise no 'Category 2'. Since 1 July 2026, Estonian municipalities have wider powers to act against dangerous or repeatedly loose dogs — including fines of up to €6,400 — but this targets an individual dog's behaviour, not specific breeds. Always check the by-laws of your destination municipality."
    fr: "Il n'existe pas non plus de « catégorie 2 ». Depuis le 1er juillet 2026, les municipalités estoniennes disposent de pouvoirs élargis pour agir contre les chiens dangereux ou en divagation répétée — avec des amendes jusqu'à 6 400 € — mais cela vise le comportement d'un chien en particulier, pas des races spécifiques. Vérifie toujours les règlements de ton municipalité de destination."
    es: "Tampoco existe una «categoría 2». Desde el 1 de julio de 2026, los municipios estonios tienen poderes más amplios para actuar contra los perros peligrosos o que se sueltan de forma reiterada — incluidas multas de hasta 6400 € — pero esto se dirige al comportamiento de un perro en particular, no a razas concretas. Comprueba siempre las ordenanzas de tu municipio de destino."
    pt: "Também não existe uma “categoria 2”. Desde 1º de julho de 2026, os municípios estonianos têm poderes mais amplos para agir contra cachorros perigosos ou que ficam soltos de forma reiterada — inclusive multas de até 6.400 € —, mas isso mira o comportamento de um cachorro específico, não raças determinadas. Verifique sempre as posturas do município de destino."
  note:
    en: "Because rules can vary by municipality, confirm any local muzzle, leash or registration requirement with the destination local government before you travel."
    fr: "Comme les règles peuvent varier selon la municipalité, vérifie toute obligation locale de muselière, de laisse ou d'enregistrement auprès de la collectivité de destination avant de voyager."
    es: "Como las normas pueden variar según el municipio, confirma cualquier obligación local de bozal, correa o registro con el gobierno local de destino antes de viajar."
    pt: "Como as regras podem variar de município para município, confirme com a prefeitura de destino qualquer exigência local de focinheira, guia ou registro antes de viajar."

