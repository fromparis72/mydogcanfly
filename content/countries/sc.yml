notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian and the Veterinary Services (via your import permit) can confirm the exact procedure for your individual dog."
    fr: "Seul un vétérinaire et les Veterinary Services (via ton permis d'importation) peuvent confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario y los Veterinary Services (a través de tu permiso de importación) pueden confirmar el procedimiento exacto para tu perro."
    pt: "Somente um médico-veterinário e os Veterinary Services (por meio da sua autorização de importação) podem confirmar o procedimento exato para o seu cachorro."
  - en: "Requirements depend on: the country of origin and its rabies status, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine et de son statut rabique, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen y su situación respecto a la rabia, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem e da sua situação em relação à raiva, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
