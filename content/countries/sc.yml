  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact steps depend on three things — Seychelles (your destination) sets a strict national scheme, but your dog's origin and history decide the detail."
    fr: "Les étapes exactes dépendent de trois éléments — les Seychelles (ta destination) imposent un régime national strict, mais l'origine et l'historique de ton chien en déterminent le détail."
    es: "Los pasos exactos dependen de tres factores — Seychelles (tu destino) impone un régimen nacional estricto, pero el origen y el historial de tu perro determinan los detalles."
    pt: "As etapas exatas dependem de três fatores — as Seicheles (seu destino) impõem um regime nacional rigoroso, mas a origem e o histórico do seu cachorro determinam os detalhes."
  items:
    - stars: 5
      label: { en: "Country of destination — Seychelles", fr: "Pays de destination — Seychelles", es: "País de destino — Seychelles", pt: "País de destino — Seicheles" }
      text:
        en: "Seychelles applies its own scheme under the Animals Diseases and Imports Act 1981 and the Animal and Plant Biosecurity Act 2014: a Veterinary Import Permit, a microchip, core vaccinations, an official veterinary certificate and a mandatory quarantine at Union Vale apply to every imported dog, because the country protects a favourable, rabies-free animal-health status."
        fr: "Les Seychelles appliquent leur propre régime au titre de l'Animals Diseases and Imports Act 1981 et de l'Animal and Plant Biosecurity Act 2014 : permis d'importation vétérinaire, puce, vaccinations essentielles, certificat vétérinaire officiel et quarantaine obligatoire à Union Vale s'appliquent à tout chien importé, car le pays protège un statut sanitaire favorable et indemne de rage."
        es: "Seychelles aplica su propio régimen en virtud del Animals Diseases and Imports Act 1981 y del Animal and Plant Biosecurity Act 2014: un permiso de importación veterinario, un microchip, las vacunas esenciales, un certificado veterinario oficial y una cuarentena obligatoria en Union Vale se aplican a todo perro importado, porque el país protege un estatus sanitario animal favorable y libre de rabia."
        pt: "As Seicheles aplicam seu próprio regime nos termos do Animals Diseases and Imports Act 1981 e do Animal and Plant Biosecurity Act 2014: autorização veterinária de importação, microchip, vacinações essenciais, certificado veterinário oficial e quarentena obrigatória em Union Vale se aplicam a todo cachorro importado, porque o país protege um status sanitário animal favorável e livre de raiva."
    - stars: 5
      label: { en: "Country of departure and its rabies status", fr: "Pays de départ et son statut rabique", es: "País de salida y su situación respecto a la rabia", pt: "País de partida e seu status em relação à raiva" }
      text:
        en: "The exporting country's rabies status sets the path. From a rabies-free country the rabies vaccination is not mandatory; from a rabies-affected country the dog must be vaccinated and pass a rabies antibody test. The official veterinary certificate and all documents must be endorsed by the Veterinary Authority of the exporting country."
        fr: "Le statut rabique du pays exportateur détermine le parcours. Depuis un pays indemne de rage, la vaccination antirabique n'est pas obligatoire ; depuis un pays touché par la rage, le chien doit être vacciné et réussir un titrage antirabique. Le certificat vétérinaire officiel et tous les documents doivent être visés par l'Autorité vétérinaire du pays exportateur."
        es: "La situación del país exportador respecto a la rabia determina el camino. Desde un país libre de rabia, la vacunación antirrábica no es obligatoria; desde un país afectado por la rabia, el perro debe estar vacunado y superar una prueba de titulación de rabia. El certificado veterinario oficial y todos los documentos deben ser refrendados por la Autoridad Veterinaria del país exportador."
        pt: "O status do país exportador em relação à raiva determina o caminho a seguir. De um país livre de raiva, a vacinação antirrábica não é obrigatória; de um país afetado pela raiva, o cachorro precisa ser vacinado e passar em um teste sorológico antirrábico. O certificado veterinário oficial e todos os documentos precisam ser endossados pela Autoridade Veterinária do país exportador."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "Your dog must have resided continuously in the exporting country for at least six months before export (or since birth if younger), and a certificate must confirm no rabies cases in the country or locality of origin over the past six months. A recent stay elsewhere can change the certification the permit requires."
        fr: "Ton chien doit avoir résidé de façon continue dans le pays exportateur pendant au moins six mois avant l'export (ou depuis la naissance s'il est plus jeune), et un certificat doit confirmer l'absence de cas de rage dans le pays ou la localité d'origine au cours des six derniers mois. Un séjour récent ailleurs peut modifier la certification exigée par le permis."
        es: "Tu perro debe haber residido de forma continua en el país exportador durante al menos seis meses antes de la exportación (o desde el nacimiento si es más joven), y un certificado debe confirmar que no ha habido casos de rabia en el país o la localidad de origen durante los últimos seis meses. Una estancia reciente en otro lugar puede cambiar la certificación que exige el permiso."
        pt: "Seu cachorro precisa ter residido continuamente no país exportador por pelo menos seis meses antes da exportação (ou desde o nascimento, se for mais novo), e um certificado precisa confirmar a ausência de casos de raiva no país ou na localidade de origem nos últimos seis meses. Uma estadia recente em outro lugar pode mudar a certificação exigida pela autorização."
  note:
    en: "So read the requirements below as the Seychelles framework, then confirm your dog's origin, history and exact conditions against your Veterinary Import Permit and your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre seychellois, puis confirme l'origine, l'historique et les conditions exactes de ton chien avec ton permis d'importation vétérinaire et ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Seychelles y luego confirma el origen, el historial y las condiciones exactas de tu perro con tu permiso de importación veterinario y tu veterinario."
    pt: "Portanto, leia as exigências abaixo como o marco seichelense e, depois, confirme a origem, o histórico e as condições exatas do seu cachorro com a sua autorização veterinária de importação e com o seu veterinário."

requirements:
  - item: { en: "Veterinary Import Permit", fr: "Permis d'importation vétérinaire", es: "Permiso de importación veterinario", pt: "Autorização veterinária de importação" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "A Veterinary Import Permit is a MUST for every dog. Apply in writing to the Chief Executive Officer at least 4 weeks ahead (rabies-free country) or at least 4 months ahead (rabies-affected country). The permit is normally issued within 7 working days and is valid for one month from the intended arrival date; no dog may be shipped before written confirmation is received.", fr: "Un permis d'importation vétérinaire est OBLIGATOIRE pour chaque chien. À demander par écrit au Chief Executive Officer au moins 4 semaines à l'avance (pays indemne de rage) ou au moins 4 mois à l'avance (pays touché par la rage). Le permis est normalement délivré sous 7 jours ouvrés et valable un mois à compter de la date d'arrivée prévue ; aucun chien ne peut être expédié avant réception d'une confirmation écrite.", es: "Un permiso de importación veterinario es OBLIGATORIO para cada perro. Solicítalo por escrito al Chief Executive Officer al menos 4 semanas antes (país libre de rabia) o al menos 4 meses antes (país afectado por la rabia). El permiso se expide normalmente en un plazo de 7 días hábiles y es válido durante un mes a partir de la fecha de llegada prevista; ningún perro puede ser enviado antes de recibir la confirmación por escrito.", pt: "Uma autorização veterinária de importação é OBRIGATÓRIA para todo cachorro. Solicite por escrito ao Chief Executive Officer com pelo menos 4 semanas de antecedência (país livre de raiva) ou pelo menos 4 meses de antecedência (país afetado pela raiva). A autorização normalmente é emitida em até 7 dias úteis e é válida por um mês a partir da data de chegada prevista; nenhum cachorro pode ser enviado antes de receber a confirmação por escrito." }
    exceptions: { en: "After the veterinary permit, request a separate import permit from the Ministry of Finance to clear the animal; customs and airline handling fees are payable at the airport.", fr: "Après le permis vétérinaire, demande un permis d'importation distinct au Ministère des Finances pour dédouaner l'animal ; des frais de douane et de manutention aérienne sont dus à l'aéroport.", es: "Después del permiso veterinario, solicita un permiso de importación aparte al Ministerio de Finanzas para despachar el animal; en el aeropuerto hay que pagar tasas de aduana y de manipulación de la aerolínea.", pt: "Depois da autorização veterinária, solicite uma autorização de importação separada junto ao Ministry of Finance para liberar o animal; as taxas alfandegárias e de manuseio da companhia aérea são pagas no aeroporto." }
    ref: { en: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), Animals Diseases and Imports Act 1981; Application to Import Live Animals", fr: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), Animals Diseases and Imports Act 1981 ; Application to Import Live Animals", es: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), Animals Diseases and Imports Act 1981; Application to Import Live Animals", pt: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), Animals Diseases and Imports Act 1981; Application to Import Live Animals" }
  - item: { en: "Microchip", fr: "Puce électronique", es: "Microchip", pt: "Microchip" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "The dog's microchip number must be recorded on the letter of application, the import permit and every accompanying certificate; it is the identification linking your dog to each document and vaccination record. An ISO 11784/11785-compliant chip is the international norm.", fr: "Le numéro de puce du chien doit être consigné sur la lettre de demande, le permis d'importation et chaque certificat d'accompagnement ; c'est l'identification qui relie ton chien à chaque document et à chaque vaccin. Une puce conforme ISO 11784/11785 est la norme internationale.", es: "El número del microchip del perro debe constar en la carta de solicitud, el permiso de importación y cada certificado que lo acompañe; es la identificación que vincula a tu perro con cada documento y registro de vacunación. Un microchip conforme a la norma ISO 11784/11785 es el estándar internacional.", pt: "O número do microchip do cachorro precisa constar na carta de solicitação, na autorização de importação e em cada certificado que a acompanha; é a identificação que liga o seu cachorro a cada documento e registro de vacinação. Um microchip compatível com a norma ISO 11784/11785 é o padrão internacional." }
    exceptions: { en: "The published conditions require the microchip number on all documents; confirm the chip can be read and is ISO-compatible with your vet before travel.", fr: "Les conditions publiées exigent le numéro de puce sur tous les documents ; vérifie avec ton vétérinaire que la puce est lisible et compatible ISO avant le voyage.", es: "Las condiciones publicadas exigen el número del microchip en todos los documentos; confirma con tu veterinario, antes de viajar, que el microchip se puede leer y es compatible con ISO.", pt: "As condições publicadas exigem o número do microchip em todos os documentos; confirme com o seu veterinário, antes de viajar, que o microchip pode ser lido e é compatível com a norma ISO." }
    ref: { en: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 1.1", fr: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 1.1", es: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 1.1", pt: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 1.1" }
  - item: { en: "Minimum age", fr: "Âge minimum", es: "Edad mínima", pt: "Idade mínima" }
    required: { en: "16 weeks", fr: "16 semaines", es: "16 semanas", pt: "16 semanas" }
    when: { en: "The dog must be at least sixteen (16) weeks of age to be eligible for import.", fr: "Le chien doit être âgé d'au moins seize (16) semaines pour être admissible à l'importation.", es: "El perro debe tener al menos dieciséis (16) semanas para poder importarse.", pt: "O cachorro precisa ter pelo menos dezesseis (16) semanas de idade para ser elegível à importação." }
    exceptions: { en: "From a rabies-affected country the rabies vaccination (given at ≥3 months) plus the antibody-test timing push the earliest travel date well beyond 16 weeks.", fr: "Depuis un pays touché par la rage, la vaccination antirabique (à ≥3 mois) et les délais du titrage repoussent la date de voyage la plus précoce bien au-delà de 16 semaines.", es: "Desde un país afectado por la rabia, la vacunación antirrábica (administrada a ≥3 meses) y los plazos de la prueba de titulación retrasan la fecha de viaje más temprana bastante más allá de las 16 semanas.", pt: "De um país afetado pela raiva, a vacinação antirrábica (aplicada a ≥3 meses) somada aos prazos do teste sorológico empurram a data de viagem mais cedo bem além das 16 semanas." }
    ref: { en: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 2.1", fr: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 2.1", es: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 2.1", pt: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 2.1" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required from rabies-affected countries", fr: "Requise depuis les pays touchés par la rage", es: "Obligatoria desde los países afectados por la rabia", pt: "Obrigatória para países afetados pela raiva" }
    when: { en: "For dogs from rabies-affected countries: a valid rabies vaccination record with an inactivated vaccine given when the dog was at least 3 months of age; a booster must be done 30 days and no more than 12 months before export.", fr: "Pour les chiens venant de pays touchés par la rage : un carnet de vaccination antirabique valide avec un vaccin inactivé administré quand le chien avait au moins 3 mois ; un rappel doit être fait 30 jours et au plus 12 mois avant l'export.", es: "Para los perros procedentes de países afectados por la rabia: un registro válido de vacunación antirrábica con una vacuna inactivada administrada cuando el perro tenía al menos 3 meses; debe aplicarse un refuerzo entre 30 días y no más de 12 meses antes de la exportación.", pt: "Para cachorros vindos de países afetados pela raiva: um registro de vacinação antirrábica válido, com vacina inativada aplicada quando o cachorro tinha pelo menos 3 meses de idade; um reforço precisa ser feito entre 30 dias e no máximo 12 meses antes da exportação." }
    exceptions: { en: "The rabies vaccination is not mandatory for dogs originating from rabies-free countries (subject to the rabies-free country conditions).", fr: "La vaccination antirabique n'est pas obligatoire pour les chiens originaires de pays indemnes de rage (sous réserve des conditions applicables aux pays indemnes de rage).", es: "La vacunación antirrábica no es obligatoria para los perros originarios de países libres de rabia (con sujeción a las condiciones aplicables a los países libres de rabia).", pt: "A vacinação antirrábica não é obrigatória para cachorros originários de países livres de raiva (sujeita às condições aplicáveis a países livres de raiva)." }
    ref: { en: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clauses 5.0 & 6.21", fr: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clauses 5.0 et 6.21", es: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clauses 5.0 & 6.21", pt: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clauses 5.0 & 6.21" }
  - item: { en: "Rabies antibody test (RNATT)", fr: "Titrage antirabique (RNATT)", es: "Prueba de titulación de rabia (RNATT)", pt: "Teste sorológico antirrábico (RNATT)" }
    required: { en: "Required from rabies-affected countries", fr: "Requis depuis les pays touchés par la rage", es: "Obligatoria desde los países afectados por la rabia", pt: "Obrigatória para países afetados pela raiva" }
    when: { en: "For dogs from rabies-affected countries: a Rabies Neutralization Antibody Titre Test with a result greater than 0.5 IU, performed at least one month after the primary vaccination and not more than 6 months before departure. A copy of the rabies vaccination certificate and the RNATT result must be included in the permit application.", fr: "Pour les chiens venant de pays touchés par la rage : un titrage des anticorps antirabiques (RNATT) avec un résultat supérieur à 0,5 UI, réalisé au moins un mois après la primo-vaccination et au plus 6 mois avant le départ. Une copie du certificat de vaccination antirabique et du résultat RNATT doit accompagner la demande de permis.", es: "Para los perros procedentes de países afectados por la rabia: una prueba de titulación de anticuerpos neutralizantes de la rabia (RNATT) con un resultado superior a 0,5 UI, realizada al menos un mes después de la primovacunación y no más de 6 meses antes de la salida. En la solicitud del permiso debe incluirse una copia del certificado de vacunación antirrábica y del resultado de la RNATT.", pt: "Para cachorros vindos de países afetados pela raiva: um Rabies Neutralization Antibody Titre Test (teste sorológico antirrábico) com resultado superior a 0,5 UI, realizado pelo menos um mês após a vacinação primária e no máximo 6 meses antes da partida. Uma cópia do certificado de vacinação antirrábica e do resultado do RNATT precisa acompanhar o pedido de autorização." }
    exceptions: { en: "Not required for dogs from rabies-free countries. If the rabies conditions are not met, the dog faces a minimum 6-month quarantine or return to the country of origin at the importer's expense.", fr: "Non requis pour les chiens venant de pays indemnes de rage. Si les conditions rabiques ne sont pas remplies, le chien subit une quarantaine d'au moins 6 mois ou est renvoyé au pays d'origine aux frais de l'importateur.", es: "No obligatoria para los perros procedentes de países libres de rabia. Si no se cumplen las condiciones sobre la rabia, el perro se enfrenta a una cuarentena mínima de 6 meses o a la devolución al país de origen a cargo del importador.", pt: "Não obrigatório para cachorros vindos de países livres de raiva. Se as condições relativas à raiva não forem cumpridas, o cachorro enfrenta uma quarentena mínima de 6 meses ou a devolução ao país de origem às custas do importador." }
    ref: { en: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 6.22", fr: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 6.22", es: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 6.22", pt: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 6.22" }
  - item: { en: "Rabies-free origin certificate & residence", fr: "Certificat d'origine indemne de rage & résidence", es: "Certificado de origen libre de rabia y residencia", pt: "Certificado de origem livre de raiva e residência" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "The dog must have resided continuously in the exporting country for at least six months before export (or since birth if younger), and be accompanied by an official certificate stating that no rabies cases have been reported in the country of origin (rabies-free countries) or the county/province/locality of origin (rabies-affected countries) during the six months before export.", fr: "Le chien doit avoir résidé de façon continue dans le pays exportateur pendant au moins six mois avant l'export (ou depuis la naissance s'il est plus jeune), et être accompagné d'un certificat officiel attestant qu'aucun cas de rage n'a été signalé dans le pays d'origine (pays indemnes de rage) ou dans le comté/province/localité d'origine (pays touchés par la rage) durant les six mois précédant l'export.", es: "El perro debe haber residido de forma continua en el país exportador durante al menos seis meses antes de la exportación (o desde el nacimiento si es más joven), y debe ir acompañado de un certificado oficial que indique que no se han notificado casos de rabia en el país de origen (países libres de rabia) o en el condado/provincia/localidad de origen (países afectados por la rabia) durante los seis meses previos a la exportación.", pt: "O cachorro precisa ter residido continuamente no país exportador por pelo menos seis meses antes da exportação (ou desde o nascimento, se for mais novo), e precisa estar acompanhado de um certificado oficial declarando que não houve casos de raiva no país de origem (países livres de raiva) ou no condado/província/localidade de origem (países afetados pela raiva) durante os seis meses anteriores à exportação." }
    exceptions: { en: "This residence and locality certification is what allows the short (minimum 2-week) quarantine instead of the 6-month quarantine.", fr: "Cette certification de résidence et de localité est ce qui permet la quarantaine courte (minimum 2 semaines) au lieu de la quarantaine de 6 mois.", es: "Esta certificación de residencia y localidad es lo que permite la cuarentena corta (mínimo 2 semanas) en lugar de la cuarentena de 6 meses.", pt: "É essa certificação de residência e de localidade que permite a quarentena curta (mínimo de 2 semanas) em vez da quarentena de 6 meses." }
    ref: { en: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clauses 6.11, 6.12 & 6.24", fr: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clauses 6.11, 6.12 et 6.24", es: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clauses 6.11, 6.12 & 6.24", pt: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clauses 6.11, 6.12 & 6.24" }
  - item: { en: "Core vaccinations", fr: "Vaccinations essentielles", es: "Vacunas esenciales", pt: "Vacinas essenciais" }
    required: { en: "Required", fr: "Requises", es: "Obligatorias", pt: "Obrigatório" }
    when: { en: "Dogs must be vaccinated against canine distemper, canine parvovirus, infectious canine hepatitis and leptospirosis. All vaccinations must be done not less than two weeks before the date of departure, and the records provided with the application.", fr: "Les chiens doivent être vaccinés contre la maladie de Carré, la parvovirose canine, l'hépatite de Rubarth (hépatite contagieuse) et la leptospirose. Toutes les vaccinations doivent être réalisées au moins deux semaines avant la date de départ, et les carnets fournis avec la demande.", es: "Los perros deben estar vacunados contra el moquillo canino, la parvovirosis canina, la hepatitis infecciosa canina y la leptospirosis. Todas las vacunaciones deben realizarse al menos dos semanas antes de la fecha de salida, y los registros deben aportarse con la solicitud.", pt: "Os cachorros precisam estar vacinados contra cinomose canina, parvovirose canina, hepatite infecciosa canina e leptospirose. Todas as vacinações precisam ser feitas com pelo menos duas semanas de antecedência em relação à data de partida, e os registros devem ser fornecidos com o pedido." }
    exceptions: { en: "None published beyond the two-week pre-departure interval.", fr: "Aucune publiée au-delà du délai de deux semaines avant le départ.", es: "Ninguna publicada más allá del intervalo de dos semanas antes de la salida.", pt: "Nenhuma publicada além do intervalo de duas semanas antes da partida." }
    ref: { en: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 1.1", fr: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 1.1", es: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 1.1", pt: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 1.1" }
  - item: { en: "Official veterinary certificate", fr: "Certificat vétérinaire officiel", es: "Certificado veterinario oficial", pt: "Certificado veterinário oficial" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "All animals must be accompanied by a valid original veterinary certificate, dated, signed and stamped, issued by the Veterinary Authority of the exporting country. Documents must be in English or French, or otherwise translated and endorsed by that authority.", fr: "Tout animal doit être accompagné d'un certificat vétérinaire original valide, daté, signé et tamponné, délivré par l'Autorité vétérinaire du pays exportateur. Les documents doivent être en anglais ou en français, ou à défaut traduits et visés par cette autorité.", es: "Todos los animales deben ir acompañados de un certificado veterinario original válido, fechado, firmado y sellado, expedido por la Autoridad Veterinaria del país exportador. Los documentos deben estar en inglés o francés, o bien traducidos y refrendados por dicha autoridad.", pt: "Todos os animais precisam estar acompanhados de um certificado veterinário original válido, datado, assinado e carimbado, emitido pela Autoridade Veterinária do país exportador. Os documentos precisam estar em inglês ou francês, ou então traduzidos e endossados por essa autoridade." }
    exceptions: { en: "Original veterinary certificates must be available at the port of entry.", fr: "Les certificats vétérinaires originaux doivent être disponibles au point d'entrée.", es: "Los certificados veterinarios originales deben estar disponibles en el punto de entrada.", pt: "Os certificados veterinários originais precisam estar disponíveis no ponto de entrada." }
    ref: { en: "Biosecurity Section (MoFBE) — Animals and Animal Products; Veterinary Services (SAA) — clause 4.0", fr: "Section biosécurité (MoFBE) — Animaux et produits animaux ; Veterinary Services (SAA) — clause 4.0", es: "Biosecurity Section (MoFBE) — Animals and Animal Products; Veterinary Services (SAA) — clause 4.0", pt: "Biosecurity Section (MoFBE) — Animals and Animal Products; Veterinary Services (SAA) — clause 4.0" }
  - item: { en: "Sterilisation of listed breeds", fr: "Stérilisation des races listées", es: "Esterilización de las razas listadas", pt: "Esterilização das raças listadas" }
    required: { en: "Required for listed breeds & crosses", fr: "Requise pour les races listées et leurs croisements", es: "Obligatoria para las razas listadas y sus cruces", pt: "Obrigatória para raças listadas e seus cruzamentos" }
    when: { en: "There is no restriction on the breed of dog that can enter, but dogs of certain breeds and their crosses (Annex 1 of the import conditions) must be surgically sterilised before entry. A certificate signed by a qualified veterinary surgeon must be produced with the permit application, and the original must accompany the dog on arrival.", fr: "Il n'existe aucune restriction sur la race de chien pouvant entrer, mais les chiens de certaines races et leurs croisements (Annexe 1 des conditions d'importation) doivent être stérilisés chirurgicalement avant l'entrée. Un certificat signé par un vétérinaire qualifié doit être produit avec la demande de permis, et l'original doit accompagner le chien à l'arrivée.", es: "No existe ninguna restricción sobre la raza de perro que puede entrar, pero los perros de ciertas razas y sus cruces (Anexo 1 de las condiciones de importación) deben esterilizarse quirúrgicamente antes de la entrada. Con la solicitud del permiso debe presentarse un certificado firmado por un cirujano veterinario cualificado, y el original debe acompañar al perro a la llegada.", pt: "Não há restrição quanto à raça de cachorro que pode entrar, mas cachorros de determinadas raças e seus cruzamentos (Anexo 1 das condições de importação) precisam ser esterilizados cirurgicamente antes da entrada. Um certificado assinado por um cirurgião veterinário qualificado precisa ser apresentado com o pedido de autorização, e o original precisa acompanhar o cachorro na chegada." }
    exceptions: { en: "See the Restricted breeds section for the Annex 1 list; no breed is banned outright from import.", fr: "Voir la section Races réglementées pour la liste de l'Annexe 1 ; aucune race n'est totalement interdite d'importation.", es: "Consulta la sección de Razas restringidas para ver la lista del Anexo 1; ninguna raza está totalmente prohibida para la importación.", pt: "Consulte a seção Raças restritas para ver a lista do Anexo 1; nenhuma raça é totalmente proibida de importação." }
    ref: { en: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 2.2 & Annex 1", fr: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 2.2 et Annexe 1", es: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 2.2 & Annex 1", pt: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 2.2 & Annex 1" }
  - item: { en: "Transport as manifest cargo", fr: "Transport en fret manifesté", es: "Transporte como carga manifestada", pt: "Transporte como carga manifestada" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "All animals must travel as manifest cargo, preferably on a direct or approved scheduled flight, in an IATA-compliant container, and must not make contact with any other animals en route. A Veterinary Officer collects the dog at the airport.", fr: "Tout animal doit voyager en fret manifesté, de préférence sur un vol direct ou un vol régulier approuvé, dans un conteneur conforme IATA, et ne doit avoir aucun contact avec d'autres animaux en route. Un vétérinaire officiel récupère le chien à l'aéroport.", es: "Todos los animales deben viajar como carga manifestada, preferiblemente en un vuelo directo o regular aprobado, en un contenedor conforme a la IATA, y no deben entrar en contacto con ningún otro animal durante el trayecto. Un veterinario oficial recoge al perro en el aeropuerto.", pt: "Todos os animais precisam viajar como carga manifestada, preferencialmente em um voo direto ou regular aprovado, em um contêiner compatível com a IATA, e não podem entrar em contato com nenhum outro animal durante o trajeto. Um Veterinary Officer recolhe o cachorro no aeroporto." }
    exceptions: { en: "Quarantine must be booked at least 2 weeks in advance and confirmed 24 hours before arrival.", fr: "La quarantaine doit être réservée au moins 2 semaines à l'avance et confirmée 24 heures avant l'arrivée.", es: "La cuarentena debe reservarse al menos 2 semanas antes y confirmarse 24 horas antes de la llegada.", pt: "A quarentena precisa ser reservada com pelo menos 2 semanas de antecedência e confirmada 24 horas antes da chegada." }
    ref: { en: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 7.0", fr: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 7.0", es: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 7.0", pt: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clause 7.0" }
  - item: { en: "Quarantine (Union Vale, Mahe)", fr: "Quarantaine (Union Vale, Mahé)", es: "Cuarentena (Union Vale, Mahé)", pt: "Quarentena (Union Vale, Mahé)" }
    required: { en: "Required — minimum 2 weeks", fr: "Requise — minimum 2 semaines", es: "Obligatoria — mínimo 2 semanas", pt: "Obrigatória — mínimo 2 semanas" }
    when: { en: "By law, all animals are quarantined on arrival at the single facility on Mahe. Dogs meeting the rabies-free or rabies-affected conditions serve a minimum 2-week (14-day) quarantine. The base quarantine fee is SR 1,000 for the two-week period; owners provide the dog's food and may visit daily 09:00–18:00.", fr: "Par la loi, tout animal est mis en quarantaine à l'arrivée dans l'unique centre de Mahé. Les chiens remplissant les conditions (pays indemne ou touché par la rage) effectuent une quarantaine minimale de 2 semaines (14 jours). Le tarif de base est de 1 000 SR pour les deux semaines ; le propriétaire fournit la nourriture et peut visiter chaque jour de 09h00 à 18h00.", es: "Por ley, todos los animales quedan en cuarentena a la llegada en la única instalación de Mahé. Los perros que cumplen las condiciones de país libre o afectado por la rabia cumplen una cuarentena mínima de 2 semanas (14 días). La tarifa base de cuarentena es de 1000 SR por el periodo de dos semanas; los propietarios aportan la comida del perro y pueden visitarlo a diario de 09:00 a 18:00.", pt: "Por lei, todos os animais ficam em quarentena na chegada, na única instalação em Mahé. Cachorros que atendem às condições de país livre ou afetado pela raiva cumprem uma quarentena mínima de 2 semanas (14 dias). A taxa básica de quarentena é de SR 1.000 pelo período de duas semanas; os donos fornecem a comida do cachorro e podem visitá-lo diariamente das 09h00 às 18h00." }
    exceptions: { en: "If the rabies conditions are not met, the quarantine is a minimum of 6 months, or the dog is returned to origin. Extensions cost SR 500 per week (SR 75 per day).", fr: "Si les conditions rabiques ne sont pas remplies, la quarantaine est d'au moins 6 mois, ou le chien est renvoyé à l'origine. Toute extension coûte 500 SR par semaine (75 SR par jour).", es: "Si no se cumplen las condiciones sobre la rabia, la cuarentena es de un mínimo de 6 meses, o el perro es devuelto al origen. Las prórrogas cuestan 500 SR por semana (75 SR por día).", pt: "Se as condições relativas à raiva não forem cumpridas, a quarentena é de no mínimo 6 meses, ou o cachorro é devolvido à origem. As prorrogações custam SR 500 por semana (SR 75 por dia)." }
    ref: { en: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clauses 6.0 & 12.0", fr: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clauses 6.0 et 12.0", es: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clauses 6.0 & 12.0", pt: "Veterinary Services (SAA) — Importation of Cats and Dogs (VS/REG/05/11/01), clauses 6.0 & 12.0" }

origin:
  eu:
    title: { en: "From a rabies-free country", fr: "Depuis un pays indemne de rage", es: "Desde un país libre de rabia", pt: "De um país livre de raiva" }
    body:
      en: "This is the lighter path. The rabies vaccination and antibody test are not mandatory, but the dog must have resided continuously in the exporting country for at least six months (or since birth) and carry an official certificate that no rabies cases have been reported there in the last six months. Add the microchip, core vaccinations (distemper, parvovirus, infectious hepatitis, leptospirosis) done at least two weeks before departure, the official veterinary certificate, the Veterinary Import Permit and a minimum 2-week quarantine at Union Vale."
      fr: "C'est le parcours allégé. La vaccination antirabique et le titrage ne sont pas obligatoires, mais le chien doit avoir résidé de façon continue dans le pays exportateur pendant au moins six mois (ou depuis la naissance) et être muni d'un certificat officiel attestant l'absence de cas de rage dans ce pays au cours des six derniers mois. Ajoute la puce, les vaccinations essentielles (maladie de Carré, parvovirose, hépatite contagieuse, leptospirose) réalisées au moins deux semaines avant le départ, le certificat vétérinaire officiel, le permis d'importation vétérinaire et une quarantaine minimale de 2 semaines à Union Vale."
      es: "Este es el camino más ligero. La vacunación antirrábica y la prueba de titulación no son obligatorias, pero el perro debe haber residido de forma continua en el país exportador durante al menos seis meses (o desde el nacimiento) y llevar un certificado oficial de que no se han notificado casos de rabia allí en los últimos seis meses. Añade el microchip, las vacunas esenciales (moquillo, parvovirosis, hepatitis infecciosa, leptospirosis) aplicadas al menos dos semanas antes de la salida, el certificado veterinario oficial, el permiso de importación veterinario y una cuarentena mínima de 2 semanas en Union Vale."
      pt: "Este é o caminho mais simples. A vacinação antirrábica e o teste sorológico não são obrigatórios, mas o cachorro precisa ter residido continuamente no país exportador por pelo menos seis meses (ou desde o nascimento) e portar um certificado oficial de que não houve casos de raiva ali nos últimos seis meses. Acrescente o microchip, as vacinações essenciais (cinomose, parvovirose, hepatite infecciosa, leptospirose) feitas pelo menos duas semanas antes da partida, o certificado veterinário oficial, a autorização veterinária de importação e uma quarentena mínima de 2 semanas em Union Vale."
    cls: warn
  listed:
    title: { en: "From a rabies-affected country", fr: "Depuis un pays touché par la rage", es: "Desde un país afectado por la rabia", pt: "De um país afetado pela raiva" }
    body:
      en: "Add rabies protection to the standard requirements. The dog needs a valid rabies vaccination (inactivated vaccine, given at ≥3 months, boosted 30 days to 12 months before export) and a rabies antibody test (RNATT) with a result above 0.5 IU, taken at least one month after vaccination and within 6 months of departure. A certificate must confirm no rabies in the county/province/locality of origin over the past six months. All other requirements — permit, microchip, core vaccinations, veterinary certificate and the minimum 2-week quarantine — still apply; apply for the permit at least four months ahead."
      fr: "Ajoute la protection antirabique aux exigences standard. Le chien a besoin d'une vaccination antirabique valide (vaccin inactivé, administré à ≥3 mois, rappel entre 30 jours et 12 mois avant l'export) et d'un titrage antirabique (RNATT) supérieur à 0,5 UI, réalisé au moins un mois après la vaccination et dans les 6 mois précédant le départ. Un certificat doit attester l'absence de rage dans le comté/province/localité d'origine au cours des six derniers mois. Toutes les autres exigences — permis, puce, vaccinations essentielles, certificat vétérinaire et quarantaine minimale de 2 semaines — restent applicables ; demande le permis au moins quatre mois à l'avance."
      es: "Añade la protección antirrábica a los requisitos estándar. El perro necesita una vacunación antirrábica válida (vacuna inactivada, administrada a ≥3 meses, con refuerzo entre 30 días y 12 meses antes de la exportación) y una prueba de titulación de rabia (RNATT) con un resultado superior a 0,5 UI, realizada al menos un mes después de la vacunación y en los 6 meses previos a la salida. Un certificado debe confirmar la ausencia de rabia en el condado/provincia/localidad de origen durante los últimos seis meses. Todos los demás requisitos — permiso, microchip, vacunas esenciales, certificado veterinario y la cuarentena mínima de 2 semanas — siguen aplicándose; solicita el permiso al menos cuatro meses antes."
      pt: "Acrescente a proteção antirrábica às exigências padrão. O cachorro precisa de uma vacinação antirrábica válida (vacina inativada, aplicada a ≥3 meses, com reforço entre 30 dias e 12 meses antes da exportação) e de um teste sorológico antirrábico (RNATT) com resultado acima de 0,5 UI, feito pelo menos um mês após a vacinação e dentro de 6 meses antes da partida. Um certificado precisa confirmar a ausência de raiva no condado/província/localidade de origem nos últimos seis meses. Todas as outras exigências — autorização, microchip, vacinações essenciais, certificado veterinário e quarentena mínima de 2 semanas — continuam valendo; solicite a autorização com pelo menos quatro meses de antecedência."
    cls: warn
  nonListed:
    title: { en: "Conditions not met — long quarantine or refusal", fr: "Conditions non remplies — quarantaine longue ou refus", es: "Condiciones no cumplidas — cuarentena larga o denegación", pt: "Condições não cumpridas — quarentena longa ou recusa" }
    body:
      en: "If the dog does not meet the rabies conditions set for its country of origin, it must undergo a minimum six-month post-arrival quarantine, or at worst be returned to the country of origin at the importer's expense. No animal may be shipped until written confirmation is received that import is permitted and every permit condition has been complied with. Confirm your dog's eligibility with the Veterinary Services before making any arrangements."
      fr: "Si le chien ne remplit pas les conditions rabiques fixées pour son pays d'origine, il doit subir une quarantaine post-arrivée d'au moins six mois, ou au pire être renvoyé au pays d'origine aux frais de l'importateur. Aucun animal ne peut être expédié avant réception d'une confirmation écrite que l'importation est autorisée et que chaque condition du permis est remplie. Confirme l'éligibilité de ton chien auprès des Veterinary Services avant toute organisation."
      es: "Si el perro no cumple las condiciones sobre la rabia fijadas para su país de origen, debe someterse a una cuarentena posterior a la llegada de un mínimo de seis meses, o en el peor de los casos ser devuelto al país de origen a cargo del importador. Ningún animal puede ser enviado hasta que se reciba la confirmación por escrito de que la importación está permitida y de que se ha cumplido cada condición del permiso. Confirma la elegibilidad de tu perro con los Veterinary Services antes de hacer cualquier gestión."
      pt: "Se o cachorro não cumprir as condições relativas à raiva estabelecidas para o seu país de origem, ele precisa passar por uma quarentena pós-chegada de no mínimo seis meses, ou, na pior das hipóteses, ser devolvido ao país de origem às custas do importador. Nenhum animal pode ser enviado até que se receba a confirmação por escrito de que a importação é permitida e de que todas as condições da autorização foram cumpridas. Confirme a elegibilidade do seu cachorro junto aos Veterinary Services antes de fazer qualquer providência."
    cls: no

arrival:
  intro:
    en: "Every dog arrives the same way: as manifest cargo, then to the Union Vale quarantine station on Mahe for a minimum of two weeks."
    fr: "Tout chien arrive de la même manière : en fret manifesté, puis à la station de quarantaine de Union Vale, sur Mahé, pour au minimum deux semaines."
    es: "Todo perro llega de la misma manera: como carga manifestada, y luego a la estación de cuarentena de Union Vale, en Mahé, durante un mínimo de dos semanas."
    pt: "Todo cachorro chega da mesma forma: como carga manifestada, seguindo depois para a estação de quarentena de Union Vale, em Mahé, por no mínimo duas semanas."
  points:
    - en: "Book the quarantine kennel at least 2 weeks in advance and confirm 24 hours before arrival; without a confirmed booking the dog cannot be received."
      fr: "Réserve le chenil de quarantaine au moins 2 semaines à l'avance et confirme 24 heures avant l'arrivée ; sans réservation confirmée, le chien ne peut être reçu."
      es: "Reserva la perrera de cuarentena al menos 2 semanas antes y confirma 24 horas antes de la llegada; sin una reserva confirmada, el perro no puede ser recibido."
      pt: "Reserve o canil de quarentena com pelo menos 2 semanas de antecedência e confirme 24 horas antes da chegada; sem uma reserva confirmada, o cachorro não pode ser recebido."
    - en: "The dog must arrive as manifest cargo in an IATA-compliant container; a Veterinary Officer collects it at the airport. It is preferable that the owner or a responsible person be present, as customs and cargo/handling fees must be settled."
      fr: "Le chien doit arriver en fret manifesté dans un conteneur conforme IATA ; un vétérinaire officiel le récupère à l'aéroport. Il est préférable que le propriétaire ou une personne responsable soit présent, car des frais de douane et de manutention doivent être réglés."
      es: "El perro debe llegar como carga manifestada en un contenedor conforme a la IATA; un veterinario oficial lo recoge en el aeropuerto. Es preferible que el propietario o una persona responsable esté presente, ya que hay que abonar las tasas de aduana y de carga/manipulación."
      pt: "O cachorro precisa chegar como carga manifestada em um contêiner compatível com a IATA; um Veterinary Officer o recolhe no aeroporto. É preferível que o dono ou uma pessoa responsável esteja presente, já que as taxas alfandegárias e de manuseio de carga precisam ser pagas."
    - en: "Original documents — the Veterinary Import Permit, official veterinary certificate, vaccination and (where required) RNATT records — must be available at the port of entry; consignments without a valid permit and certificate are not cleared."
      fr: "Les documents originaux — permis d'importation vétérinaire, certificat vétérinaire officiel, carnets de vaccination et (si requis) résultats RNATT — doivent être disponibles au point d'entrée ; les envois sans permis et certificat valides ne sont pas dédouanés."
      es: "Los documentos originales — el permiso de importación veterinario, el certificado veterinario oficial, los registros de vacunación y (cuando se exija) de la RNATT — deben estar disponibles en el punto de entrada; los envíos sin un permiso y un certificado válidos no se despachan."
      pt: "Os documentos originais — a autorização veterinária de importação, o certificado veterinário oficial, os registros de vacinação e (quando exigido) o resultado do RNATT — precisam estar disponíveis no ponto de entrada; remessas sem autorização e certificado válidos não são liberadas."
    - en: "A Veterinary Officer examines the dog immediately on arrival and monitors it throughout quarantine; the base fee is SR 1,000 for two weeks and the owner provides the dog's food."
      fr: "Un vétérinaire officiel examine le chien dès l'arrivée et le surveille pendant toute la quarantaine ; le tarif de base est de 1 000 SR pour deux semaines et le propriétaire fournit la nourriture."
      es: "Un veterinario oficial examina al perro inmediatamente a la llegada y lo supervisa durante toda la cuarentena; la tarifa base es de 1000 SR por dos semanas y el propietario aporta la comida del perro."
      pt: "Um Veterinary Officer examina o cachorro imediatamente na chegada e o acompanha durante toda a quarentena; a taxa básica é de SR 1.000 por duas semanas, e o dono fornece a comida do cachorro."
    - en: "Failure to comply with the conditions results in a minimum 6-month quarantine, return of the animal to the country of origin, or in the worst case euthanasia — all at the owner's risk and expense."
      fr: "Le non-respect des conditions entraîne une quarantaine d'au moins 6 mois, le renvoi de l'animal au pays d'origine ou, dans le pire des cas, l'euthanasie — le tout au risque et aux frais du propriétaire."
      es: "El incumplimiento de las condiciones da lugar a una cuarentena mínima de 6 meses, a la devolución del animal al país de origen o, en el peor de los casos, a la eutanasia — todo ello por cuenta y riesgo del propietario."
      pt: "O descumprimento das condições resulta em uma quarentena mínima de 6 meses, na devolução do animal ao país de origem ou, no pior caso, na eutanásia — tudo por conta e risco do dono."
    - en: "Owners are responsible for collecting their dog from the station at the end of quarantine and for onward travel arrangements."
      fr: "Le propriétaire est responsable de venir chercher son chien à la station à la fin de la quarantaine et d'organiser la suite du voyage."
      es: "Los propietarios son responsables de recoger a su perro en la estación al final de la cuarentena y de organizar la continuación del viaje."
      pt: "Os donos são responsáveis por buscar o cachorro na estação ao final da quarentena e por organizar a continuação da viagem."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Seychelles places no outright ban on any dog breed — there is no restriction on the type of dog or cat that can enter the country. However, dogs of certain breeds and their crosses must be surgically sterilised before entry, with a veterinary certificate produced at application and the original carried on arrival."
    fr: "Les Seychelles n'interdisent aucune race de chien de façon absolue — il n'existe aucune restriction sur le type de chien ou de chat pouvant entrer dans le pays. Toutefois, les chiens de certaines races et leurs croisements doivent être stérilisés chirurgicalement avant l'entrée, avec un certificat vétérinaire produit lors de la demande et l'original présenté à l'arrivée."
    es: "Seychelles no impone una prohibición absoluta a ninguna raza de perro — no existe restricción sobre el tipo de perro o gato que puede entrar en el país. Sin embargo, los perros de ciertas razas y sus cruces deben esterilizarse quirúrgicamente antes de la entrada, con un certificado veterinario presentado en la solicitud y el original llevado a la llegada."
    pt: "As Seicheles não proíbem totalmente nenhuma raça de cachorro — não há restrição quanto ao tipo de cachorro ou gato que pode entrar no país. No entanto, cachorros de determinadas raças e seus cruzamentos precisam ser esterilizados cirurgicamente antes da entrada, com um certificado veterinário apresentado no pedido e o original levado na chegada."
  cat1:
    en: "Breeds requiring surgical sterilisation before entry (Annex 1 of the import conditions) include, among others: Akita Inu, American Pit Bull Terrier, American Staffordshire Terrier, Argentine Dogo (Dogo Argentino), Boerboel, Bullmastiff, Bully Kutta, Cane Corso, Doberman, Dogue de Bordeaux, English Mastiff, Fila Brasileiro, German Shepherd (Alsatian), Great Dane, Neapolitan Mastiff, Perro de Presa Canario, Perro de Presa Mallorquin (Ca de Bou), Rottweiler, Staffordshire Bull Terrier, Tibetan Mastiff and Tosa Inu."
    fr: "Les races nécessitant une stérilisation chirurgicale avant l'entrée (Annexe 1 des conditions d'importation) comprennent notamment : Akita Inu, American Pit Bull Terrier, American Staffordshire Terrier, Dogo Argentino, Boerboel, Bullmastiff, Bully Kutta, Cane Corso, Doberman, Dogue de Bordeaux, English Mastiff, Fila Brasileiro, Berger allemand (Alsatian), Dogue allemand (Great Dane), Mâtin de Naples, Perro de Presa Canario, Perro de Presa Mallorquin (Ca de Bou), Rottweiler, Staffordshire Bull Terrier, Mâtin du Tibet et Tosa Inu."
    es: "Las razas que requieren esterilización quirúrgica antes de la entrada (Anexo 1 de las condiciones de importación) incluyen, entre otras: Akita Inu, American Pit Bull Terrier, American Staffordshire Terrier, Dogo Argentino, Boerboel, Bullmastiff, Bully Kutta, Cane Corso, Doberman, Dogue de Bordeaux, Mastín Inglés, Fila Brasileiro, Pastor Alemán (Alsatian), Gran Danés, Mastín Napolitano, Perro de Presa Canario, Perro de Presa Mallorquín (Ca de Bou), Rottweiler, Staffordshire Bull Terrier, Mastín Tibetano y Tosa Inu."
    pt: "As raças que exigem esterilização cirúrgica antes da entrada (Anexo 1 das condições de importação) incluem, entre outras: Akita Inu, American Pit Bull Terrier, American Staffordshire Terrier, Dogo Argentino, Boerboel, Bullmastiff, Bully Kutta, Cane Corso, Doberman, Dogue de Bordeaux, Mastim Inglês, Fila Brasileiro, Pastor Alemão (Alsatian), Dogue Alemão, Mastim Napolitano, Perro de Presa Canario, Perro de Presa Mallorquin (Ca de Bou), Rottweiler, Staffordshire Bull Terrier, Mastim Tibetano e Tosa Inu."
  cat2:
    en: "The Annex 1 list also covers several other mastiff- and bulldog-type breeds (such as the Alangu Mastiff, Alano Español, Bedlington Terrier, Boston Terrier, Bulldog, Dogo Sardesco, French Bulldog, Gull Dong, Gull Terr, Irish Staffordshire Bull Terrier, Korea Jindo Dog, Lottatore Brindisino and Shar Pei). Sterilisation applies to these breeds and their crosses; it is a condition of entry, not an import ban."
    fr: "La liste de l'Annexe 1 couvre aussi plusieurs autres races de type mâtin ou bouledogue (telles que l'Alangu Mastiff, l'Alano Español, le Bedlington Terrier, le Boston Terrier, le Bulldog, le Dogo Sardesco, le Bouledogue français, le Gull Dong, le Gull Terr, l'Irish Staffordshire Bull Terrier, le Korea Jindo Dog, le Lottatore Brindisino et le Shar Pei). La stérilisation s'applique à ces races et à leurs croisements ; c'est une condition d'entrée, pas une interdiction d'importation."
    es: "La lista del Anexo 1 abarca también varias otras razas de tipo mastín y bulldog (como el Alangu Mastiff, el Alano Español, el Bedlington Terrier, el Boston Terrier, el Bulldog, el Dogo Sardesco, el Bulldog Francés, el Gull Dong, el Gull Terr, el Irish Staffordshire Bull Terrier, el Korea Jindo Dog, el Lottatore Brindisino y el Shar Pei). La esterilización se aplica a estas razas y sus cruces; es una condición de entrada, no una prohibición de importación."
    pt: "A lista do Anexo 1 também abrange várias outras raças do tipo mastim e buldogue (como o Alangu Mastiff, o Alano Español, o Bedlington Terrier, o Boston Terrier, o Buldogue, o Dogo Sardesco, o Buldogue Francês, o Gull Dong, o Gull Terr, o Irish Staffordshire Bull Terrier, o Korea Jindo Dog, o Lottatore Brindisino e o Shar Pei). A esterilização se aplica a essas raças e seus cruzamentos; é uma condição de entrada, não uma proibição de importação."
  note:
    en: "Confirm whether your dog's breed or cross falls under Annex 1 with the Veterinary Services before making any travel arrangements, as the list is set by national import conditions and may change without notice."
    fr: "Vérifie auprès des Veterinary Services si la race ou le croisement de ton chien relève de l'Annexe 1 avant toute organisation de voyage, car la liste est fixée par les conditions d'importation nationales et peut changer sans préavis."
    es: "Confirma con los Veterinary Services si la raza o el cruce de tu perro está incluido en el Anexo 1 antes de hacer cualquier gestión de viaje, ya que la lista la fijan las condiciones de importación nacionales y puede cambiar sin previo aviso."
    pt: "Confirme junto aos Veterinary Services se a raça ou o cruzamento do seu cachorro está no Anexo 1 antes de fazer qualquer providência de viagem, já que a lista é definida pelas condições nacionais de importação e pode mudar sem aviso prévio."

checklist:
  - en: "Confirm your dog's origin country rabies status (rabies-free or rabies-affected) — it decides your whole path"
    fr: "Vérifie le statut rabique du pays d'origine de ton chien (indemne ou touché par la rage) — il détermine tout ton parcours"
    es: "Confirma la situación respecto a la rabia del país de origen de tu perro (libre o afectado por la rabia) — determina todo tu camino"
    pt: "Confirme o status do país de origem do seu cachorro em relação à raiva (livre de raiva ou afetado pela raiva) — isso determina todo o seu caminho"
  - en: "Check whether your dog's breed or cross is on Annex 1 and, if so, arrange surgical sterilisation with a certificate"
    fr: "Vérifie si la race ou le croisement de ton chien figure à l'Annexe 1 et, le cas échéant, organise la stérilisation avec certificat"
    es: "Comprueba si la raza o el cruce de tu perro está en el Anexo 1 y, en tal caso, organiza la esterilización quirúrgica con certificado"
    pt: "Verifique se a raça ou o cruzamento do seu cachorro está no Anexo 1 e, se estiver, providencie a esterilização cirúrgica com certificado"
  - en: "Microchip implanted; the number recorded on the application and every certificate"
    fr: "Puce posée ; le numéro consigné sur la demande et chaque certificat"
    es: "Microchip implantado; el número registrado en la solicitud y en cada certificado"
    pt: "Microchip implantado; o número registrado no pedido e em cada certificado"
  - en: "Dog at least 16 weeks old at import"
    fr: "Chien âgé d'au moins 16 semaines à l'importation"
    es: "Perro de al menos 16 semanas en la importación"
    pt: "Cachorro com pelo menos 16 semanas de idade na importação"
  - en: "From a rabies-affected country: rabies vaccination (inactivated, ≥3 months) then RNATT >0.5 IU (≥1 month after vaccine, ≤6 months before departure)"
    fr: "Depuis un pays touché par la rage : vaccination antirabique (inactivée, ≥3 mois) puis RNATT >0,5 UI (≥1 mois après le vaccin, ≤6 mois avant le départ)"
    es: "Desde un país afectado por la rabia: vacunación antirrábica (inactivada, ≥3 meses) y luego RNATT >0,5 UI (≥1 mes después de la vacuna, ≤6 meses antes de la salida)"
    pt: "De um país afetado pela raiva: vacinação antirrábica (inativada, ≥3 meses) e depois RNATT >0,5 UI (≥1 mês após a vacina, ≤6 meses antes da partida)"
  - en: "Core vaccinations up to date (distemper, parvovirus, infectious hepatitis, leptospirosis), done ≥2 weeks before departure"
    fr: "Vaccinations essentielles à jour (maladie de Carré, parvovirose, hépatite contagieuse, leptospirose), réalisées ≥2 semaines avant le départ"
    es: "Vacunas esenciales al día (moquillo, parvovirosis, hepatitis infecciosa, leptospirosis), aplicadas ≥2 semanas antes de la salida"
    pt: "Vacinações essenciais em dia (cinomose, parvovirose, hepatite infecciosa, leptospirose), feitas ≥2 semanas antes da partida"
  - en: "Official certificate that no rabies has occurred in the country/locality of origin in the past 6 months, plus 6 months' prior residence"
    fr: "Certificat officiel attestant l'absence de rage dans le pays/la localité d'origine depuis 6 mois, plus 6 mois de résidence préalable"
    es: "Certificado oficial de que no ha habido rabia en el país/la localidad de origen en los últimos 6 meses, más 6 meses de residencia previa"
    pt: "Certificado oficial de que não houve raiva no país/na localidade de origem nos últimos 6 meses, além de 6 meses de residência prévia"
  - en: "Apply for the Veterinary Import Permit in writing — 4 weeks ahead (rabies-free) or 4 months ahead (rabies-affected)"
    fr: "Demande le permis d'importation vétérinaire par écrit — 4 semaines à l'avance (indemne) ou 4 mois à l'avance (touché par la rage)"
    es: "Solicita el permiso de importación veterinario por escrito — 4 semanas antes (libre de rabia) o 4 meses antes (afectado por la rabia)"
    pt: "Solicite a autorização veterinária de importação por escrito — 4 semanas antes (livre de raiva) ou 4 meses antes (afetado pela raiva)"
  - en: "Original veterinary certificate (English or French) and all records travelling with the dog; fly as manifest cargo in an IATA crate"
    fr: "Certificat vétérinaire original (anglais ou français) et tous les carnets voyageant avec le chien ; vol en fret manifesté dans une caisse IATA"
    es: "Certificado veterinario original (inglés o francés) y todos los registros viajando con el perro; vuelo como carga manifestada en una jaula IATA"
    pt: "Certificado veterinário original (em inglês ou francês) e todos os registros viajando com o cachorro; voo como carga manifestada em uma caixa de transporte IATA"
  - en: "Book the Union Vale quarantine ≥2 weeks ahead and confirm 24 hours before arrival; obtain the Ministry of Finance import permit for customs clearance"
    fr: "Réserve la quarantaine de Union Vale ≥2 semaines à l'avance et confirme 24 heures avant l'arrivée ; obtiens le permis d'importation du Ministère des Finances pour le dédouanement"
    es: "Reserva la cuarentena de Union Vale ≥2 semanas antes y confirma 24 horas antes de la llegada; obtén el permiso de importación del Ministerio de Finanzas para el despacho de aduanas"
    pt: "Reserve a quarentena de Union Vale ≥2 semanas antes e confirme 24 horas antes da chegada; obtenha a autorização de importação do Ministry of Finance para o desembaraço aduaneiro"

