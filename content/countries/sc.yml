# Country Entry Guide — Seychelles (source of truth, bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_sc
iso2: "SC"
name: { en: "Seychelles", fr: "Seychelles", es: "Seychelles", pt: "Seicheles" }
region: { en: "Africa (Indian Ocean)", fr: "Afrique (océan Indien)", es: "África (océano Índico)", pt: "África (oceano Índico)" }


regime: non_listed
exit:
  authority: Veterinary / National Biosecurity Services
  authorityUrl: https://macce.gov.sc/
  intro:
    en: "Seychelles is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Veterinary / National Biosecurity Services (NBS)."
    fr: "Les Seychelles est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par les services vétérinaires / de biosécurité nationale (NBS)."
    es: "Seychelles no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por los servicios veterinarios / de bioseguridad nacional (NBS)."
    pt: "As Seicheles não são um país listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para retornar à UE — além de um certificado veterinário de exportação endossado pelos Serviços Veterinários / de Biossegurança Nacional (NBS)."
  steps:
    - timing: longlead
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico (titulação): exame de sangue em um laboratório aprovado pela UE, pelo menos 30 dias após a vacinação — um resultado válido é essencial para retornar à UE e não pode ser resolvido de última hora."
    - timing: window
      text:
        en: "Under the Animal and Plant Biosecurity Act, the veterinary/biosecurity authority controls animal movement and endorses the export veterinary certificate."
        fr: "Selon l'Animal and Plant Biosecurity Act, l'autorité vétérinaire/de biosécurité contrôle les mouvements d'animaux et vise le certificat vétérinaire d'export."
        es: "Según la Animal and Plant Biosecurity Act, la autoridad veterinaria/de bioseguridad controla el movimiento de animales y refrenda el certificado veterinario de exportación."
        pt: "Segundo o Animal and Plant Biosecurity Act, a autoridade veterinária/de biossegurança controla a movimentação de animais e endossa o certificado veterinário de exportação."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico (titulação) da UE válido antes de sair, ele continua válido por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Seychelles with your dog", fr: "Voyager aux Seychelles avec ton chien", es: "Viajar a Seychelles con tu perro", pt: "Viajar para as Seicheles com seu cachorro" }
  intro:
    en: >-
      Seychelles welcomes dogs, but as a rabies-free Indian Ocean archipelago it runs strict import
      controls delivered by the Veterinary Services (Seychelles Agricultural Agency) and the national
      Biosecurity Section of the Ministry responsible for agriculture. Every dog needs a Veterinary
      Import Permit obtained before departure, an identifying microchip, up-to-date core vaccinations,
      an official veterinary certificate from the exporting country and a mandatory quarantine on
      arrival at the Union Vale station on Mahe. What you must prepare depends heavily on where your
      dog is coming from: dogs from rabies-free countries follow a lighter path, while dogs from
      rabies-affected countries must add a rabies vaccination and a rabies antibody test before they
      can qualify for the short quarantine. Apply for the permit at least four weeks ahead from a
      rabies-free country, and at least four months ahead from a rabies-affected country. This guide
      explains each official step so you know exactly what to prepare before you book.
    fr: >-
      Les Seychelles accueillent les chiens, mais en tant qu'archipel de l'océan Indien indemne de
      rage, elles appliquent des contrôles d'importation stricts assurés par les Veterinary Services
      (Seychelles Agricultural Agency) et la Section biosécurité du ministère chargé de l'agriculture.
      Chaque chien doit disposer d'un permis d'importation vétérinaire obtenu avant le départ, d'une
      puce d'identification, de vaccinations essentielles à jour, d'un certificat vétérinaire officiel
      du pays exportateur et d'une quarantaine obligatoire à l'arrivée à la station de Union Vale, sur
      Mahé. Ce qu'il faut préparer dépend fortement de la provenance du chien : les chiens issus de
      pays indemnes de rage suivent un parcours allégé, tandis que les chiens venant de pays touchés
      par la rage doivent ajouter une vaccination antirabique et un titrage des anticorps antirabiques.
      Demande le permis au moins quatre semaines à l'avance depuis un pays indemne de rage, et au
      moins quatre mois à l'avance depuis un pays touché par la rage. Ce guide détaille chaque étape.
    es: >-
      Seychelles acoge a los perros, pero como archipiélago del océano Índico libre de rabia aplica
      controles de importación estrictos gestionados por los Veterinary Services (Seychelles
      Agricultural Agency) y la Sección de Bioseguridad nacional del ministerio responsable de la
      agricultura. Cada perro necesita un permiso de importación veterinario obtenido antes de la
      salida, un microchip de identificación, las vacunas esenciales al día, un certificado
      veterinario oficial del país exportador y una cuarentena obligatoria a la llegada en la estación
      de Union Vale, en Mahé. Lo que debes preparar depende en gran medida del lugar de procedencia de
      tu perro: los perros de países libres de rabia siguen un camino más ligero, mientras que los
      perros de países afectados por la rabia deben añadir una vacunación antirrábica y una prueba de
      titulación de rabia antes de poder optar a la cuarentena corta. Solicita el permiso al menos
      cuatro semanas antes desde un país libre de rabia, y al menos cuatro meses antes desde un país
      afectado por la rabia. Esta guía explica cada paso oficial para que sepas exactamente qué
      preparar antes de reservar.

    pt: "As Seicheles recebem bem os cachorros, mas, como um arquipélago do oceano Índico livre de raiva, aplicam controles de importação rigorosos, conduzidos pelos Veterinary Services (Seychelles Agricultural Agency) e pela Seção de Biossegurança nacional do ministério responsável pela agricultura. Todo cachorro precisa de uma autorização veterinária de importação obtida antes da partida, um microchip de identificação, vacinações essenciais em dia, um certificado veterinário oficial do país exportador e uma quarentena obrigatória na chegada, na estação de Union Vale, em Mahé. O que você precisa preparar depende muito da procedência do seu cachorro: cachorros vindos de países livres de raiva seguem um caminho mais simples, enquanto cachorros vindos de países afetados pela raiva precisam acrescentar uma vacinação antirrábica e um teste sorológico antirrábico (titulação) antes de poderem se qualificar para a quarentena curta. Solicite a autorização com pelo menos quatro semanas de antecedência partindo de um país livre de raiva, e com pelo menos quatro meses de antecedência partindo de um país afetado pela raiva. Este guia explica cada etapa oficial para você saber exatamente o que preparar antes de reservar."
difficulty:
  level: difficult
  label: { en: "Difficult — permit, tests and quarantine required", fr: "Difficile — permis, tests et quarantaine exigés", es: "Difícil — se exigen permiso, pruebas y cuarentena", pt: "Difícil — exige autorização, exames e quarentena" }

prepTime:
  eu:
    en: "From a rabies-free country: apply for the permit at least 4 weeks ahead — microchip, core vaccinations (≥2 weeks before departure), a rabies-free country certificate, 6 months' prior residence and a minimum 2-week quarantine at Union Vale."
    fr: "Depuis un pays indemne de rage : demande le permis au moins 4 semaines à l'avance — puce, vaccinations essentielles (≥2 semaines avant le départ), certificat de pays indemne de rage, 6 mois de résidence préalable et quarantaine minimale de 2 semaines à Union Vale."
    es: "Desde un país libre de rabia: solicita el permiso al menos 4 semanas antes — microchip, vacunas esenciales (≥2 semanas antes de la salida), un certificado de país libre de rabia, 6 meses de residencia previa y una cuarentena mínima de 2 semanas en Union Vale."
    pt: "De um país livre de raiva: solicite a autorização com pelo menos 4 semanas de antecedência — microchip, vacinações essenciais (≥2 semanas antes da partida), certificado de país livre de raiva, 6 meses de residência prévia e quarentena mínima de 2 semanas em Union Vale."
  listed:
    en: "From a rabies-affected country: apply at least 4 months ahead — add a rabies vaccination and a rabies antibody test (RNATT >0.5 IU), plus a locality rabies-free certificate, before the same minimum 2-week quarantine."
    fr: "Depuis un pays touché par la rage : demande au moins 4 mois à l'avance — ajoute une vaccination antirabique et un titrage antirabique (RNATT >0,5 UI), plus un certificat de localité indemne de rage, avant la même quarantaine minimale de 2 semaines."
    es: "Desde un país afectado por la rabia: solicita al menos 4 meses antes — añade una vacunación antirrábica y una prueba de titulación de rabia (RNATT >0,5 UI), más un certificado de localidad libre de rabia, antes de la misma cuarentena mínima de 2 semanas."
    pt: "De um país afetado pela raiva: solicite com pelo menos 4 meses de antecedência — acrescente uma vacinação antirrábica e um teste sorológico antirrábico (RNATT >0,5 UI), além de um certificado de localidade livre de raiva, antes da mesma quarentena mínima de 2 semanas."
  nonListed:
    en: "If the rabies conditions are not met: the dog faces a minimum 6-month post-arrival quarantine, or is returned to the country of origin at the importer's expense."
    fr: "Si les conditions rabiques ne sont pas remplies : le chien subit une quarantaine post-arrivée d'au moins 6 mois, ou est renvoyé au pays d'origine aux frais de l'importateur."
    es: "Si no se cumplen las condiciones sobre la rabia: el perro se enfrenta a una cuarentena posterior a la llegada de al menos 6 meses, o es devuelto al país de origen a cargo del importador."
    pt: "Se as condições relativas à raiva não forem cumpridas: o cachorro enfrenta uma quarentena pós-chegada de no mínimo 6 meses, ou é devolvido ao país de origem às custas do importador."

