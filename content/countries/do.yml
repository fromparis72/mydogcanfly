# Country Entry Guide — Dominican Republic (source of truth, bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_do
iso2: "DO"
name: { en: "Dominican Republic", fr: "République dominicaine", es: "República Dominicana", pt: "República Dominicana" }
region: { en: "Caribbean", fr: "Caraïbes", es: "Caribe", pt: "Caribe" }


regime: non_listed
domestic:
  intro:
    en: "Domestic flight in the Dominican Republic: no State requirement — the movement guide does not cover dogs."
    fr: "Vol intérieur en République dominicaine : aucune exigence de l'État — la guía de movilización ne couvre pas les chiens."
    es: "Vuelo nacional en República Dominicana: ningún requisito del Estado — la guía de movilización no cubre a los perros."
    pt: "Voo doméstico na República Dominicana: nenhuma exigência do Estado — a guía de movilización não cobre cachorros."
  points:
    - en: "The national movement guide applies to sheep, goats, horses, cattle and bees — dogs are not listed. Any paperwork at the airport is the airline's own."
      fr: "La guía de movilización nationale s'applique aux ovins, caprins, équidés, bovins et abeilles — les chiens n'y figurent pas. Tout document exigé à l'aéroport est propre à la compagnie."
      es: "La guía de movilización nacional se aplica a ovinos, caprinos, equinos, bovinos y apícolas — los perros no figuran. Cualquier documento exigido en el aeropuerto es de la aerolínea."
      pt: "A guía de movilización nacional se aplica a ovinos, caprinos, equinos, bovinos e abelhas — os cachorros não constam nela. Qualquer documento exigido no aeroporto é da própria companhia aérea."
    - en: "The main domestic carrier takes small dogs in the cabin only, with weight limits, a health certificate and breed restrictions."
      fr: "La principale compagnie intérieure n'accepte les petits chiens qu'en cabine, avec limites de poids, certificat de santé et restrictions de race."
      es: "La principal aerolínea nacional solo acepta perros pequeños en cabina, con límites de peso, certificado de salud y restricciones de raza."
      pt: "A principal companhia aérea doméstica só aceita cachorros pequenos na cabine, com limites de peso, atestado de saúde e restrições de raça."
exit:
  authority: DIGEGA
  authorityUrl: https://www.ganaderia.gob.do/index.php/servicios/item/539-autorizacion-para-la-exportacion-de-animales-productos-y-subproductos-de-origen-animal
  intro:
    en: "The Dominican Republic is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus a health certificate validated by DIGEGA."
    fr: "La République dominicaine est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire validé par la DIGEGA."
    es: "República Dominicana no está listada: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario validado por la DIGEGA."
    pt: "A República Dominicana é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde validado pela DIGEGA."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: eu
      text:
        en: "A private vet does the pre-export check and completes the EU non-commercial certificate; it is signed by the veterinary college (COLVET) where required, then submitted to DIGEGA for validation and official signature."
        fr: "Un vétérinaire privé réalise le contrôle pré-export et remplit le certificat UE non commercial ; il est signé par l'ordre vétérinaire (COLVET) si nécessaire, puis soumis à la DIGEGA pour validation et signature officielle."
        es: "Un veterinario privado hace el control previo a la exportación y rellena el certificado UE no comercial; lo firma el colegio veterinario (COLVET) cuando corresponde y luego se presenta a la DIGEGA para su validación y firma oficial."
        pt: "Um veterinário particular faz o controle pré-exportação e preenche o certificado não comercial da UE; ele é assinado pelo conselho veterinário (COLVET) quando exigido e depois enviado à DIGEGA para validação e assinatura oficial."
    - timing: window
      scope: non_eu
      text:
        en: "A private vet does the pre-export check; the certificate is signed by the veterinary college (COLVET) where required, then submitted to DIGEGA for validation and official signature."
        fr: "Un vétérinaire privé fait le contrôle pré-export ; le certificat est signé par le collège vétérinaire (COLVET) quand c'est exigé, puis soumis à la DIGEGA pour validation et signature officielle."
        es: "Un veterinario privado hace el control previo a la exportación; el certificado lo firma el colegio veterinario (COLVET) cuando se exige, y luego se presenta a DIGEGA para su validación y firma oficial."
        pt: "Um veterinário particular faz a checagem pré-exportação; o certificado é assinado pelo conselho veterinário (COLVET) quando exigido e depois enviado à DIGEGA para validação e assinatura oficial."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to the Dominican Republic with your dog", fr: "Voyager en République dominicaine avec ton chien", es: "Viajar a la República Dominicana con tu perro", pt: "Viajar com seu cachorro para a República Dominicana" }
  intro:
    en: >-
      The Dominican Republic welcomes dogs, and its rules are relatively straightforward: the country
      runs its own scheme through the Directorate General of Livestock (DIGEGA), not the EU pet-passport
      system. A dog travelling with its owner needs a veterinary health certificate issued in the country
      of departure, a valid rabies vaccination and up-to-date core vaccines, plus internal and external
      parasite treatment. No prior import permit is needed for a personal pet accompanying its owner —
      only a commercial import requires a DIGEGA authorization. What you must prepare still depends on your
      dog's country of departure and recent history, because the certificate must confirm the dog comes
      from a disease-free zone. This guide explains exactly what to prepare before you book your flight.
    fr: >-
      La République dominicaine accueille les chiens, et ses règles sont relativement simples : le pays
      applique son propre dispositif via la Direction générale de l'élevage (DIGEGA), et non le système du
      passeport européen. Un chien voyageant avec son propriétaire a besoin d'un certificat sanitaire
      vétérinaire établi dans le pays de départ, d'une vaccination antirabique valide et de vaccins de base
      à jour, ainsi que d'un traitement antiparasitaire interne et externe. Aucun permis d'importation
      préalable n'est exigé pour un animal de compagnie accompagnant son propriétaire — seule une
      importation commerciale nécessite une autorisation de la DIGEGA. Ce qu'il faut préparer dépend tout
      de même du pays de départ et de l'historique récent du chien, car le certificat doit confirmer qu'il
      provient d'une zone indemne de maladies. Ce guide détaille exactement quoi préparer avant de réserver.
    es: >-
      La República Dominicana acoge a los perros, y sus normas son relativamente sencillas: el país
      aplica su propio sistema a través de la Dirección General de Ganadería (DIGEGA), no el sistema del
      pasaporte europeo para mascotas. Un perro que viaja con su propietario necesita un certificado
      sanitario veterinario expedido en el país de salida, una vacunación antirrábica válida y las vacunas
      básicas al día, además de un tratamiento contra parásitos internos y externos. No se exige permiso de
      importación previo para una mascota personal que acompaña a su propietario — solo una importación
      comercial requiere una autorización de la DIGEGA. Lo que debes preparar depende igualmente del país
      de salida y del historial reciente de tu perro, porque el certificado debe confirmar que el perro
      procede de una zona libre de enfermedades. Esta guía explica exactamente qué preparar antes de reservar tu vuelo.

    pt: "A República Dominicana recebe cachorros, e suas regras são relativamente simples: o país aplica seu próprio esquema por meio da Direção-Geral de Pecuária (DIGEGA), e não o sistema do passaporte europeu para animais. Um cachorro que viaja com seu dono precisa de um certificado veterinário de saúde emitido no país de partida, de vacinação antirrábica válida e das vacinas essenciais em dia, além de tratamento contra parasitas internos e externos. Não é preciso autorização de importação prévia para um animal de estimação que acompanha seu dono — só a importação comercial exige uma autorização da DIGEGA. O que você tem de preparar ainda depende do país de partida e do histórico recente do seu cachorro, porque o certificado precisa confirmar que o cachorro vem de uma zona livre de doenças. Este guia explica exatamente o que preparar antes de você comprar a passagem."
difficulty:
  level: easy
  label: { en: "Easy — one health certificate, no permit for personal pets", fr: "Facile — un certificat sanitaire, sans permis pour les animaux de compagnie", es: "Fácil — un certificado sanitario, sin permiso para mascotas personales", pt: "Fácil — um atestado de saúde, sem autorização para animais de estimação" }

prepTime:
  eu:
    en: "A few days if the rabies vaccine is already valid — the health certificate is issued after an exam within 72 hours of departure and is valid 10 days."
    fr: "Quelques jours si le vaccin antirabique est déjà valide — le certificat sanitaire est établi après un examen dans les 72 heures avant le départ et est valable 10 jours."
    es: "Unos días si la vacuna antirrábica ya es válida — el certificado sanitario se expide tras un examen dentro de las 72 horas previas a la salida y es válido 10 días."
    pt: "Alguns dias se a vacina antirrábica já estiver válida — o atestado de saúde é emitido após um exame feito nas 72 horas anteriores à partida e vale 10 dias."
  listed:
    en: "~1 month if a first rabies shot is still needed: it must be given at least 30 days before departure (dog at least 3 months old)."
    fr: "~1 mois si une première vaccination antirabique reste à faire : elle doit être administrée au moins 30 jours avant le départ (chien d'au moins 3 mois)."
    es: "~1 mes si aún falta la primera vacuna antirrábica: debe administrarse al menos 30 días antes de la salida (perro de al menos 3 meses)."
    pt: "~1 mês se ainda faltar a primeira dose antirrábica: ela precisa ser aplicada no mínimo 30 dias antes da partida (com o cachorro tendo pelo menos 3 meses)."
  nonListed:
    en: "Longer for a commercial import: allow extra time to obtain the DIGEGA authorization through the VUCE single window before shipping."
    fr: "Plus long pour une importation commerciale : prévois du temps pour obtenir l'autorisation de la DIGEGA via le guichet unique VUCE avant l'expédition."
    es: "Más tiempo para una importación comercial: prevé tiempo adicional para obtener la autorización de la DIGEGA a través de la ventanilla única VUCE antes del envío."
    pt: "Mais tempo para uma importação comercial: reserve prazo extra para obter a autorização de importação da DIGEGA pela janela única VUCE antes do embarque."

