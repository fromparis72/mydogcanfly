notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro."
    pt: "Só um médico-veterinário pode confirmar o procedimento exato para o seu cachorro."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Cyprus (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — Chypre (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Chipre (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — Chipre (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — Cyprus", fr: "Pays de destination — Chypre", es: "País de destino — Chipre", pt: "País de destino — Chipre" }
      text:
        en: "Cyprus applies the EU pet-movement framework: an ISO microchip and a valid rabies vaccination are always required, and no tapeworm treatment is needed. As an island it admits pets only at designated points, and it bans four dog breeds outright."
        fr: "Chypre applique le cadre européen : puce ISO et vaccination antirabique valide toujours exigées, et aucun traitement contre l'échinococcose n'est requis. En tant qu'île, elle n'admet les animaux qu'à des points désignés et interdit purement et simplement quatre races de chiens."
        es: "Chipre aplica el marco europeo de movimiento de animales: siempre se exigen un microchip ISO y una vacunación antirrábica válida, y no se necesita tratamiento contra la tenia. Al ser una isla, admite mascotas únicamente en puntos designados y prohíbe por completo cuatro razas de perros."
        pt: "Chipre aplica o quadro europeu de circulação de animais de estimação: microchip ISO e vacinação antirrábica válida são sempre obrigatórios, e nenhum tratamento contra a tênia é necessário. Como é uma ilha, só admite animais de estimação em pontos designados, e proíbe totalmente quatro raças de cachorros."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Whether your dog leaves from an EU country, a listed non-EU country or a non-listed country decides whether an antibody test and a health certificate are required."
        fr: "Que ton chien parte d'un pays de l'UE, d'un pays tiers listé ou d'un pays non listé détermine si un titrage et un certificat sanitaire sont exigés."
        es: "Que tu perro salga de un país de la UE, de un país tercero listado o de un país no listado determina si se exigen una prueba de titulación y un certificado sanitario."
        pt: "Partir de um país da UE, de um país listado fora da UE ou de um país não listado é o que define se o teste sorológico e o certificado sanitário são exigidos."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay in a rabies-risk country can trigger an antibody test even if you fly in from an exempt country. It is your dog's real origin and history that count — not only the last airport."
        fr: "Un séjour récent dans un pays à risque rabique peut imposer un titrage même si tu arrives d'un pays exempté. C'est l'origine réelle et l'historique du chien qui comptent — pas seulement l'aéroport de destination finale."
        es: "Una estancia reciente en un país con riesgo de rabia puede obligar a una prueba de titulación aunque llegues desde un país exento. Lo que cuenta es el origen y el historial reales de tu perro — no solo el último aeropuerto."
        pt: "Uma estadia recente em um país de risco de raiva pode acionar a exigência do teste sorológico mesmo que você chegue de um país isento. O que conta é a origem e o histórico reais do seu cachorro — não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Cyprus's framework, then confirm your dog's exact origin and history with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre chypriote, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Chipre y luego confirma el origen y el historial exactos de tu perro con tu veterinario."
    pt: "Leia então as exigências abaixo como o quadro cipriota, e confirme com seu veterinário a origem e o histórico exatos do seu cachorro."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "ISO 11784/11785 transponder (HDX or FDX-B); must be implanted before the rabies vaccination.", fr: "Transpondeur ISO 11784/11785 (HDX ou FDX-B) ; posé avant la vaccination antirabique.", es: "Transpondedor ISO 11784/11785 (HDX o FDX-B); debe implantarse antes de la vacunación antirrábica.", pt: "Transponder ISO 11784/11785 (HDX ou FDX-B); deve ser implantado antes da vacinação antirrábica." }
    exceptions: { en: "A legible tattoo is accepted only if done before 3 July 2011.", fr: "Un tatouage lisible n'est accepté que s'il est antérieur au 3 juillet 2011.", es: "Un tatuaje legible solo se acepta si se hizo antes del 3 de julio de 2011.", pt: "Uma tatuagem legível só é aceita se tiver sido feita antes de 3 de julho de 2011." }
    ref: { en: "EU Reg. 576/2013; Cyprus Veterinary Services", fr: "Règl. UE 576/2013 ; Services vétérinaires de Chypre", es: "Regl. UE 576/2013; Servicios Veterinarios de Chipre", pt: "Regulamento UE 576/2013; Cyprus Veterinary Services" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Dog at least 12 weeks old at the shot; valid from 21 days after the primary vaccination.", fr: "Chien d'au moins 12 semaines ; valide 21 jours après la primo-vaccination.", es: "Perro de al menos 12 semanas en el momento de la vacuna; válida a partir de los 21 días de la primovacunación.", pt: "Cachorro com pelo menos 12 semanas na data da vacina; válida a partir de 21 dias após a primovacinação." }
    exceptions: { en: "Entry unvaccinated against rabies is prohibited regardless of the country of origin; the microchip must already be in place.", fr: "L'entrée sans vaccination antirabique est interdite quel que soit le pays d'origine ; la puce doit déjà être posée.", es: "La entrada sin vacunación antirrábica está prohibida independientemente del país de origen; el microchip debe estar ya implantado.", pt: "A entrada de um cachorro não vacinado contra a raiva é proibida, seja qual for o país de origem; o microchip já deve estar implantado." }
    ref: { en: "EU Reg. 576/2013, Annex III; Cyprus Veterinary Services", fr: "Règl. UE 576/2013, annexe III ; Services vétérinaires de Chypre", es: "Regl. UE 576/2013, anexo III; Servicios Veterinarios de Chipre", pt: "Regulamento UE 576/2013, anexo III; Cyprus Veterinary Services" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Non-listed origins only: blood ≥30 days after vaccination, ≥3 months before entry, result ≥0.5 IU/ml, EU-approved lab.", fr: "Pays non listés : sang ≥30 jours après le vaccin, ≥3 mois avant l'entrée, résultat ≥0,5 UI/ml, labo agréé UE.", es: "Solo orígenes no listados: sangre ≥30 días tras la vacuna, ≥3 meses antes de la entrada, resultado ≥0,5 UI/ml, laboratorio autorizado por la UE.", pt: "Apenas origens não listadas: sangue ≥30 dias após a vacinação, ≥3 meses antes da entrada, resultado ≥0,5 UI/ml, laboratório aprovado pela UE." }
    exceptions: { en: "Not required from the EU or from listed countries (US, Canada, UK, Switzerland, Japan, Australia…).", fr: "Non requis depuis l'UE ou les pays listés (USA, Canada, RU, Suisse, Japon, Australie…).", es: "No se exige desde la UE ni desde países listados (EE. UU., Canadá, RU, Suiza, Japón, Australia…).", pt: "Não exigido para quem vem da UE ou de países listados (EUA, Canadá, Reino Unido, Suíça, Japão, Austrália…)." }
    ref: { en: "EU Reg. 2020/692; Cyprus Veterinary Services", fr: "Règl. UE 2020/692 ; Services vétérinaires de Chypre", es: "Regl. UE 2020/692; Servicios Veterinarios de Chipre", pt: "Regulamento UE 2020/692; Cyprus Veterinary Services" }
  - item: { en: "EU pet passport", fr: "Passeport européen", es: "Pasaporte europeo para mascotas", pt: "Passaporte europeu para animais" }
    required: { en: "EU origins", fr: "Origines UE", es: "Orígenes de la UE", pt: "Origens na UE" }
    when: { en: "Issued by an EU vet; records the microchip and rabies vaccination.", fr: "Délivré par un vétérinaire de l'UE ; consigne la puce et la vaccination.", es: "Expedido por un veterinario de la UE; registra el microchip y la vacunación antirrábica.", pt: "Emitido por um veterinário da UE; registra o microchip e a vacinação antirrábica." }
    exceptions: { en: "Replaced by an animal health certificate for non-EU origins.", fr: "Remplacé par un certificat sanitaire pour les origines hors UE.", es: "Se sustituye por un certificado sanitario para orígenes fuera de la UE.", pt: "Substituído por um certificado sanitário quando a origem é de fora da UE." }
    ref: { en: "EU Reg. 577/2013", fr: "Règl. UE 577/2013", es: "Regl. UE 577/2013", pt: "Regulamento UE 577/2013" }
  - item: { en: "EU animal health certificate", fr: "Certificat sanitaire UE", es: "Certificado sanitario animal de la UE", pt: "Certificado sanitário europeu" }
    required: { en: "Non-EU origins", fr: "Origines hors UE", es: "Orígenes fuera de la UE", pt: "Origens fora da UE" }
    when: { en: "Issued/endorsed by an official vet before departure; valid 10 days to entry, then up to 4 months for onward EU travel.", fr: "Établi/visé par un vétérinaire officiel avant départ ; valable 10 jours jusqu'à l'entrée, puis jusqu'à 4 mois pour circuler dans l'UE.", es: "Expedido/refrendado por un veterinario oficial antes de la salida; válido 10 días hasta la entrada y luego hasta 4 meses para circular por la UE.", pt: "Emitido/endossado por um veterinário oficial antes da partida; válido por 10 dias até a entrada e, depois, por até 4 meses para circular pela UE." }
    exceptions: { en: "Not needed for EU origins (passport instead).", fr: "Inutile pour les origines UE (passeport à la place).", es: "No necesario para orígenes de la UE (en su lugar, el pasaporte).", pt: "Não é necessário para origens na UE (usa-se o passaporte)." }
    ref: { en: "EU Reg. 577/2013, Annex IV; Cyprus Veterinary Services", fr: "Règl. UE 577/2013, annexe IV ; Services vétérinaires de Chypre", es: "Regl. UE 577/2013, anexo IV; Servicios Veterinarios de Chipre", pt: "Regulamento UE 577/2013, anexo IV; Cyprus Veterinary Services" }
  - item: { en: "Tapeworm (Echinococcus) treatment", fr: "Traitement échinococcose", es: "Tratamiento contra la tenia (Echinococcus)", pt: "Tratamento contra a tênia (Echinococcus)" }
    required: { en: "Not required", fr: "Non requis", es: "No obligatorio", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Only Finland, Ireland, Malta, N. Ireland and Norway require it — not Cyprus.", fr: "Seuls la Finlande, l'Irlande, Malte, l'Irlande du Nord et la Norvège l'exigent — pas Chypre.", es: "Solo lo exigen Finlandia, Irlanda, Malta, Irlanda del Norte y Noruega — no Chipre.", pt: "Só a Finlândia, a Irlanda, Malta, a Irlanda do Norte e a Noruega exigem — Chipre não." }
    ref: { en: "European Commission — pet travel", fr: "Commission européenne — voyage animaux", es: "Comisión Europea — viaje de animales", pt: "Comissão Europeia — viagens com animais de estimação" }
  - item: { en: "Advance notification of arrival", fr: "Notification préalable d'arrivée", es: "Notificación previa de llegada", pt: "Aviso prévio de chegada" }
    required: { en: "Third-country arrivals", fr: "Arrivées de pays tiers", es: "Llegadas de países terceros", pt: "Chegadas de países terceiros" }
    when: { en: "For a dog arriving from a non-EU country: notify the District Veterinary Office of the point of entry at least 48 hours before arrival (date, time, flight number or ship name).", fr: "Pour un chien arrivant d'un pays hors UE : prévenir le bureau vétérinaire de district du point d'entrée au moins 48 heures avant l'arrivée (date, heure, numéro de vol ou nom du navire).", es: "Para un perro que llega de un país no perteneciente a la UE: notifica a la Oficina Veterinaria de Distrito del punto de entrada al menos 48 horas antes de la llegada (fecha, hora, número de vuelo o nombre del barco).", pt: "Para um cachorro que chega de um país fora da UE: avise o District Veterinary Office (escritório veterinário distrital) do ponto de entrada com no mínimo 48 horas de antecedência, informando data, horário e número do voo ou nome do navio." }
    exceptions: { en: "No import permit is issued; no prior notification is required for intra-EU arrivals.", fr: "Aucun permis d'import n'est délivré ; aucune notification préalable n'est exigée pour les arrivées intra-UE.", es: "No se expide permiso de importación; no se exige notificación previa para las llegadas intracomunitarias.", pt: "Não é emitida nenhuma licença de importação; não é exigida notificação prévia para as chegadas de dentro da UE." }
    ref: { en: "Cyprus Veterinary Services — non-commercial movement", fr: "Services vétérinaires de Chypre — mouvement non commercial", es: "Servicios Veterinarios de Chipre — movimiento no comercial", pt: "Cyprus Veterinary Services — circulação não comercial" }
  - item: { en: "Point of entry / border check", fr: "Point d'entrée / contrôle frontalier", es: "Punto de entrada / control fronterizo", pt: "Ponto de entrada / controle de fronteira" }
    required: { en: "All arrivals", fr: "Toutes les arrivées", es: "Todas las llegadas", pt: "Todas as chegadas" }
    when: { en: "Pets may enter only at designated points (Larnaka and Pafos airports, Lemesos/Larnaka ports, marinas); documents and identity are inspected by the Veterinary Officer or Customs.", fr: "Les animaux ne peuvent entrer qu'aux points désignés (aéroports de Larnaca et Paphos, ports de Limassol/Larnaca, marinas) ; documents et identité contrôlés par le vétérinaire officiel ou la douane.", es: "Las mascotas solo pueden entrar en puntos designados (aeropuertos de Lárnaca y Pafos, puertos de Limasol/Lárnaca, marinas); los documentos y la identidad los inspecciona el veterinario oficial o Aduanas.", pt: "Os animais de estimação só podem entrar por pontos designados (aeroportos de Lárnaca e Pafos, portos de Lemesos/Lárnaca, marinas); os documentos e a identidade são conferidos pelo Veterinary Officer (veterinário oficial) ou pela alfândega." }
    exceptions: { en: "Entry from any non-designated point is prohibited.", fr: "L'entrée par tout point non désigné est interdite.", es: "La entrada por cualquier punto no designado está prohibida.", pt: "A entrada por qualquer ponto não designado é proibida." }
    ref: { en: "Cyprus Veterinary Services; Cyprus Customs & Excise", fr: "Services vétérinaires de Chypre ; Douane chypriote", es: "Servicios Veterinarios de Chipre; Aduanas e Impuestos Especiales de Chipre", pt: "Cyprus Veterinary Services; Cyprus Customs & Excise" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "At least 105 days old", fr: "Au moins 105 jours", es: "Al menos 105 días de edad", pt: "Pelo menos 105 dias de idade" }
    when: { en: "12-week rabies shot + 21-day wait; any pet entering Cyprus must be at least 105 days old.", fr: "Vaccin à 12 semaines + 21 jours ; tout animal entrant à Chypre doit avoir au moins 105 jours.", es: "Vacuna a las 12 semanas + espera de 21 días; toda mascota que entre en Chipre debe tener al menos 105 días.", pt: "Vacina antirrábica às 12 semanas + 21 dias de espera; todo animal que entra em Chipre precisa ter pelo menos 105 dias de idade." }
    exceptions: { en: "The entry of pets under 105 days old is prohibited regardless of the country of origin.", fr: "L'entrée d'un animal de moins de 105 jours est interdite quel que soit le pays d'origine.", es: "La entrada de mascotas menores de 105 días está prohibida independientemente del país de origen.", pt: "A entrada de animais com menos de 105 dias é proibida, seja qual for o país de origem." }
    ref: { en: "EU Reg. 576/2013; Cyprus Veterinary Services", fr: "Règl. UE 576/2013 ; Services vétérinaires de Chypre", es: "Regl. UE 576/2013; Servicios Veterinarios de Chipre", pt: "Regulamento UE 576/2013; Cyprus Veterinary Services" }
  - item: { en: "Prohibited breeds", fr: "Races interdites", es: "Razas prohibidas", pt: "Raças proibidas" }
    required: { en: "Banned from entry", fr: "Interdites d'entrée", es: "Con entrada prohibida", pt: "Proibidas de entrar" }
    when: { en: "Pit Bull Terrier, Japanese Tosa, Dogo Argentino and Fila Brasileiro (and their crosses) may not enter Cyprus, regardless of the country of origin.", fr: "Le Pit Bull Terrier, le Tosa japonais, le Dogo Argentino et le Fila Brasileiro (et leurs croisements) ne peuvent entrer à Chypre, quel que soit le pays d'origine.", es: "El Pit Bull Terrier, el Tosa japonés, el Dogo Argentino y el Fila Brasileiro (y sus cruces) no pueden entrar en Chipre, independientemente del país de origen.", pt: "Pit Bull Terrier, Tosa Japonês, Dogo Argentino e Fila Brasileiro (e seus cruzamentos) não podem entrar em Chipre, seja qual for o país de origem." }
    exceptions: { en: "No exemption exists; these breeds are refused entry.", fr: "Aucune dérogation ; ces races sont refusées à l'entrée.", es: "No existe ninguna excepción; a estas razas se les deniega la entrada.", pt: "Não existe nenhuma isenção; essas raças têm a entrada recusada." }
    ref: { en: "Cyprus Veterinary Services — prohibited breeds", fr: "Services vétérinaires de Chypre — races interdites", es: "Servicios Veterinarios de Chipre — razas prohibidas", pt: "Cyprus Veterinary Services — raças proibidas" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not required", fr: "Non requise", es: "No obligatoria", pt: "Não obrigatório" }
