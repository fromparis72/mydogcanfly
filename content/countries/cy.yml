origin:
  scheme: eu
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate and no advance notification. It must still enter at a designated point and must not be a banned breed."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire et pas de notification préalable. Il doit tout de même entrer par un point désigné et ne pas être d'une race interdite."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario y sin notificación previa. Aun así debe entrar por un punto designado y no ser de una raza prohibida."
      pt: "Um cachorro vindo de outro país da UE precisa de um passaporte europeu que comprove um microchip ISO válido e uma vacinação antirrábica em dia. Sem teste sorológico, sem certificado sanitário e sem aviso prévio. Mesmo assim, ele precisa entrar por um ponto designado e não pode ser de uma raça proibida."
    cls: ok
  listed:
    title: { en: "Health certificate + 48h notice", fr: "Certificat sanitaire + préavis 48 h", es: "Certificado sanitario + preaviso de 48 h", pt: "Certificado sanitário + aviso de 48 horas" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Switzerland, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination and an EU animal health certificate endorsed by an official vet before departure. No antibody test is required, but you must notify the District Veterinary Office at least 48 hours before arrival and present the dog at a designated point of entry."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Suisse, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire européen visé par un vétérinaire officiel avant le départ. Pas de titrage, mais tu dois prévenir le bureau vétérinaire de district au moins 48 heures avant l'arrivée et présenter le chien à un point d'entrée désigné."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Suiza, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal de la UE refrendado por un veterinario oficial antes de la salida. No se exige prueba de titulación, pero debes notificar a la Oficina Veterinaria de Distrito al menos 48 horas antes de la llegada y presentar al perro en un punto de entrada designado."
      pt: "Vindo de um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Suíça, Japão, Austrália e outros), seu cachorro precisa de microchip, vacinação antirrábica válida e certificado sanitário europeu endossado por um veterinário oficial antes da partida. Não é exigido teste sorológico, mas você precisa avisar o District Veterinary Office com no mínimo 48 horas de antecedência e apresentar o cachorro em um ponto de entrada designado."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-approved laboratory, then a compulsory 3-month wait before entry. An endorsed EU animal health certificate and the 48-hour advance notification are also required."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen visé et la notification préalable de 48 heures sont également requis."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exigen un certificado sanitario animal de la UE refrendado y la notificación previa de 48 horas."
      pt: "Vindo de um país não listado (de risco), acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório aprovado pela UE, e depois 3 meses obrigatórios de espera antes da entrada. Também são exigidos um certificado sanitário europeu endossado e o aviso prévio de 48 horas."
    cls: no

arrival:
  intro:
    en: "Cyprus is an island: every pet must enter at a designated point, and what happens on arrival depends on where you flew from."
    fr: "Chypre est une île : tout animal doit entrer par un point désigné, et ce qui se passe à l'arrivée dépend de ton lieu de départ."
    es: "Chipre es una isla: toda mascota debe entrar por un punto designado, y lo que ocurre a la llegada depende del lugar desde el que hayas volado."
    pt: "Chipre é uma ilha: todo animal de estimação precisa entrar por um ponto designado, e o que acontece na chegada depende de onde você embarcou."
  points:
    - en: "Pets may enter only through designated points of entry — Larnaka (LCA) and Pafos (PFO) international airports, the Lemesos (Limassol) and Larnaka ports, and approved marinas. Entry from any other point is prohibited."
      fr: "Les animaux ne peuvent entrer que par des points d'entrée désignés — aéroports internationaux de Larnaca (LCA) et Paphos (PFO), ports de Limassol et de Larnaca, et marinas agréées. L'entrée par tout autre point est interdite."
      es: "Las mascotas solo pueden entrar por puntos de entrada designados — aeropuertos internacionales de Lárnaca (LCA) y Pafos (PFO), puertos de Limasol y Lárnaca, y marinas autorizadas. La entrada por cualquier otro punto está prohibida."
      pt: "Os animais de estimação só podem entrar por pontos de entrada designados — os aeroportos internacionais de Lárnaca (LCA) e Pafos (PFO), os portos de Lemesos (Limassol) e Lárnaca e as marinas aprovadas. A entrada por qualquer outro ponto é proibida."
    - from: eu
      en: "From another EU country: no systematic border check and no prior notification — keep the EU pet passport with you."
      fr: "Depuis un autre pays de l'UE : pas de contrôle systématique ni de notification préalable — garde le passeport européen sur toi."
      es: "Desde otro país de la UE: sin control fronterizo sistemático ni notificación previa — lleva contigo el pasaporte europeo."
      pt: "De outro país da UE: sem controle de fronteira sistemático e sem aviso prévio — leve o passaporte europeu com você."
    - from: non_eu
      en: "From outside the EU: notify the District Veterinary Office of the point of entry at least 48 hours before arrival with the date, time and flight number or ship name."
      fr: "Depuis hors UE : préviens le bureau vétérinaire de district du point d'entrée au moins 48 heures avant l'arrivée avec la date, l'heure et le numéro de vol ou le nom du navire."
      es: "Desde fuera de la UE: notifica a la Oficina Veterinaria de Distrito del punto de entrada al menos 48 horas antes de la llegada con la fecha, la hora y el número de vuelo o el nombre del barco."
      pt: "De fora da UE: avise o District Veterinary Office do ponto de entrada com no mínimo 48 horas de antecedência, informando a data, o horário e o número do voo ou o nome do navio."
    - en: "On arrival, the dog and its documents are inspected by the Veterinary Officer or by the duty Customs Officer acting for the Veterinary Services; compliant animals enter without quarantine."
      fr: "À l'arrivée, le chien et ses documents sont contrôlés par le vétérinaire officiel ou par le douanier de service agissant pour les Services vétérinaires ; les animaux conformes entrent sans quarantaine."
      es: "A la llegada, el perro y sus documentos los inspecciona el veterinario oficial o el funcionario de aduanas de guardia que actúa en nombre de los Servicios Veterinarios; los animales que cumplen los requisitos entran sin cuarentena."
      pt: "Na chegada, o cachorro e os documentos são conferidos pelo Veterinary Officer (veterinário oficial) ou pelo agente da alfândega de plantão que atua em nome dos Veterinary Services; os animais em conformidade entram sem quarentena."
    - en: "Carry original documents (not copies); if documents are missing or invalid, the authorities may order re-export, quarantine or other measures — at the owner's expense."
      fr: "Munis-toi des documents originaux (pas de copies) ; si les documents manquent ou sont invalides, les autorités peuvent ordonner réexpédition, quarantaine ou d'autres mesures — aux frais du propriétaire."
      es: "Lleva los documentos originales (no copias); si faltan documentos o no son válidos, las autoridades pueden ordenar la reexpedición, la cuarentena u otras medidas — a cargo del propietario."
      pt: "Leve os documentos originais (não cópias); se faltarem documentos ou eles não forem válidos, as autoridades podem determinar a reexportação, a quarentena ou outras medidas — às custas do dono."
    - en: "Banned breeds (Pit Bull Terrier, Japanese Tosa, Dogo Argentino, Fila Brasileiro and their crosses) are refused entry, whatever their country of origin."
      fr: "Les races interdites (Pit Bull Terrier, Tosa japonais, Dogo Argentino, Fila Brasileiro et leurs croisements) sont refusées à l'entrée, quel que soit leur pays d'origine."
      es: "A las razas prohibidas (Pit Bull Terrier, Tosa japonés, Dogo Argentino, Fila Brasileiro y sus cruces) se les deniega la entrada, sea cual sea su país de origen."
      pt: "As raças proibidas (Pit Bull Terrier, Tosa Japonês, Dogo Argentino, Fila Brasileiro e seus cruzamentos) têm a entrada recusada, seja qual for o país de origem."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Cyprus prohibits four dog breeds from entering or being kept in the country, regardless of the country of origin. The ban is enforced by the Veterinary Services at every point of entry and there is no import permit or exemption route."
    fr: "Chypre interdit l'entrée et la détention de quatre races de chiens, quel que soit le pays d'origine. L'interdiction est appliquée par les Services vétérinaires à chaque point d'entrée et il n'existe aucun permis d'importation ni dérogation."
    es: "Chipre prohíbe la entrada y la tenencia de cuatro razas de perros en el país, independientemente del país de origen. La prohibición la aplican los Servicios Veterinarios en cada punto de entrada y no existe permiso de importación ni vía de excepción."
    pt: "Chipre proíbe que quatro raças de cachorros entrem ou sejam mantidas no país, seja qual for o país de origem. A proibição é aplicada pelos Veterinary Services em todos os pontos de entrada e não existe autorização de importação nem via de isenção."
  cat1:
    en: "Banned breeds: Pit Bull Terrier (American Pit Bull), Japanese Tosa (Tosa Inu), Dogo Argentino (Argentinian Mastiff) and Fila Brasileiro (Brazilian Mastiff). The ban also covers dogs from a cross of these breeds, and dogs from the cross of any breed with a banned breed where a registered veterinarian certifies that the dangerous-breed characteristics predominate. These dogs may not enter Cyprus, including in transit."
    fr: "Races interdites : Pit Bull Terrier (American Pit Bull), Tosa japonais (Tosa Inu), Dogo Argentino (dogue argentin) et Fila Brasileiro (mâtin brésilien). L'interdiction vise aussi les chiens issus d'un croisement de ces races, et les chiens issus du croisement de toute race avec une race interdite lorsqu'un vétérinaire agréé certifie que les caractéristiques de la race dangereuse prédominent. Ces chiens ne peuvent entrer à Chypre, y compris en transit."
    es: "Razas prohibidas: Pit Bull Terrier (American Pit Bull), Tosa japonés (Tosa Inu), Dogo Argentino (mastín argentino) y Fila Brasileiro (mastín brasileño). La prohibición abarca también a los perros procedentes de un cruce de estas razas y a los perros procedentes del cruce de cualquier raza con una raza prohibida cuando un veterinario colegiado certifica que predominan las características de la raza peligrosa. Estos perros no pueden entrar en Chipre, ni siquiera en tránsito."
    pt: "Raças proibidas: Pit Bull Terrier (American Pit Bull), Tosa Japonês (Tosa Inu), Dogo Argentino (mastim argentino) e Fila Brasileiro (mastim brasileiro). A proibição abrange também os cachorros nascidos do cruzamento dessas raças e os cachorros nascidos do cruzamento de qualquer raça com uma raça proibida quando um médico-veterinário registrado atesta que predominam as características da raça perigosa. Esses cachorros não podem entrar em Chipre, nem mesmo em trânsito."
  cat2:
    en: "Cyprus operates a single outright ban rather than a permit-based second category: there is no lawful way to import one of the four breeds. All other dogs must be microchipped and are subject to Cyprus's general dog-ownership rules (registration and responsible-ownership obligations under national dog legislation). Confirm your dog's breed with your vet before booking, as a cross whose banned-breed traits predominate can also be refused."
    fr: "Chypre applique une interdiction absolue unique plutôt qu'une seconde catégorie soumise à permis : il n'existe aucun moyen légal d'importer l'une des quatre races. Tous les autres chiens doivent être pucés et sont soumis aux règles générales de détention de Chypre (enregistrement et obligations de détention responsable prévues par la législation canine nationale). Confirme la race de ton chien avec ton vétérinaire avant de réserver, car un croisement dont les traits d'une race interdite prédominent peut aussi être refusé."
    es: "Chipre aplica una única prohibición absoluta en lugar de una segunda categoría basada en permisos: no existe una forma legal de importar una de las cuatro razas. Todos los demás perros deben llevar microchip y están sujetos a las normas generales de tenencia de perros de Chipre (obligaciones de registro y de tenencia responsable en virtud de la legislación canina nacional). Confirma la raza de tu perro con tu veterinario antes de reservar, ya que también puede rechazarse un cruce en el que predominen los rasgos de una raza prohibida."
    pt: "Chipre aplica uma proibição pura e simples, sem uma segunda categoria sujeita a autorização: não existe forma legal de importar uma das quatro raças. Todos os outros cachorros precisam ter microchip e ficam sujeitos às regras gerais de posse de cachorros de Chipre (registro e obrigações de posse responsável previstas na legislação nacional sobre cães). Confirme a raça do seu cachorro com o veterinário antes de comprar a passagem, porque um cruzamento em que predominem os traços de uma raça proibida também pode ser recusado."
  note:
    en: "A dog that merely resembles a banned breed is judged on its dominant characteristics by a registered veterinarian. If there is any doubt about your dog's breed or lineage, contact the Cyprus Veterinary Services before travelling."
    fr: "Un chien qui ressemble simplement à une race interdite est jugé sur ses caractéristiques dominantes par un vétérinaire agréé. En cas de doute sur la race ou la lignée de ton chien, contacte les Services vétérinaires de Chypre avant de voyager."
    es: "Un perro que simplemente se parece a una raza prohibida es juzgado por sus características dominantes por un veterinario colegiado. Si hay alguna duda sobre la raza o el linaje de tu perro, contacta con los Servicios Veterinarios de Chipre antes de viajar."
    pt: "Um cachorro que apenas se pareça com uma raça proibida é avaliado por um médico-veterinário registrado a partir de suas características dominantes. Se houver qualquer dúvida sobre a raça ou a linhagem do seu cachorro, procure os Cyprus Veterinary Services antes de viajar."

checklist:
  - en: "Microchip (ISO 11784/11785) implanted before the rabies vaccination"
    fr: "Puce (ISO 11784/11785) posée avant la vaccination antirabique"
    es: "Microchip (ISO 11784/11785) implantado antes de la vacunación antirrábica"
    pt: "Microchip (ISO 11784/11785) implantado antes da vacinação antirrábica"
  - en: "Valid rabies vaccination (dog ≥12 weeks at the shot, +21 days)"
    fr: "Vaccination antirabique valide (chien ≥12 semaines, +21 jours)"
    es: "Vacunación antirrábica válida (perro ≥12 semanas en la vacuna, +21 días)"
    pt: "Vacinação antirrábica válida (cachorro com ≥12 semanas na data da vacina, +21 dias)"
  - en: "Rabies antibody test — non-listed countries only"
    fr: "Titrage antirabique — pays non listés uniquement"
    es: "Prueba de titulación de rabia — solo países no listados"
    pt: "Teste sorológico antirrábico — apenas para países não listados"
  - en: "EU pet passport (EU origin) or endorsed EU health certificate (non-EU origin)"
    fr: "Passeport européen (origine UE) ou certificat sanitaire UE visé (hors UE)"
    es: "Pasaporte europeo (origen UE) o certificado sanitario UE refrendado (origen fuera de la UE)"
    pt: "Passaporte europeu (origem na UE) ou certificado sanitário europeu endossado (origem fora da UE)"
  - en: "Dog at least 105 days old and not a banned breed"
    fr: "Chien d'au moins 105 jours et non d'une race interdite"
    es: "Perro de al menos 105 días y que no sea de una raza prohibida"
    pt: "Cachorro com pelo menos 105 dias e que não seja de raça proibida"
  - en: "For non-EU arrivals: notify the District Veterinary Office at least 48 hours before arrival"
    fr: "Arrivées hors UE : prévenir le bureau vétérinaire de district au moins 48 heures avant l'arrivée"
    es: "Para llegadas de fuera de la UE: notifica a la Oficina Veterinaria de Distrito al menos 48 horas antes de la llegada"
    pt: "Chegadas de fora da UE: avisar o District Veterinary Office com no mínimo 48 horas de antecedência"
  - en: "Arrive at a designated point of entry (Larnaka/Pafos airport, Lemesos/Larnaka port)"
    fr: "Arriver à un point d'entrée désigné (aéroport de Larnaca/Paphos, port de Limassol/Larnaca)"
    es: "Llega a un punto de entrada designado (aeropuerto de Lárnaca/Pafos, puerto de Limasol/Lárnaca)"
    pt: "Chegar por um ponto de entrada designado (aeroporto de Lárnaca/Pafos, porto de Lemesos/Lárnaca)"
  - en: "Original documents plus a suitable IATA crate if travelling in the hold"
    fr: "Documents originaux et caisse IATA adaptée si voyage en soute"
    es: "Documentos originales más una jaula IATA adecuada si viaja en bodega"
    pt: "Documentos originais e caixa de transporte adequada à IATA se a viagem for no porão"

