    exceptions: { en: "Compliant animals enter without quarantine; only if rules are breached may the authorities order re-export, quarantine or other measures.", fr: "Les animaux conformes entrent sans quarantaine ; uniquement en cas de non-conformité, les autorités peuvent ordonner réexpédition, quarantaine ou d'autres mesures.", es: "Los animales que cumplen los requisitos entran sin cuarentena; solo en caso de incumplimiento pueden las autoridades ordenar la reexpedición, la cuarentena u otras medidas.", pt: "Os animais em conformidade entram sem quarentena; só em caso de descumprimento das regras as autoridades podem determinar a reexportação, a quarentena ou outras medidas." }
