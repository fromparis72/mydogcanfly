origin:
  scheme: eu
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate and normally no border check."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire et normalement pas de contrôle frontalier."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario y normalmente sin control fronterizo."
      pt: "Um cachorro vindo de outro país da UE precisa de um passaporte europeu que comprove um microchip ISO válido e uma vacinação antirrábica em dia. Sem teste sorológico, sem certificado sanitário e, normalmente, sem controle de fronteira."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Switzerland, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination, a clinical exam by an official vet within 48 hours of departure and an EU animal health certificate. No antibody test is required; present yourself to customs at a travellers' point of entry."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Suisse, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide, d'un examen clinique par un vétérinaire officiel dans les 48 heures avant le départ et d'un certificat sanitaire européen. Pas de titrage ; présente-toi à la douane à un point d'entrée voyageurs."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Suiza, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida, un examen clínico realizado por un veterinario oficial en las 48 horas antes de la salida y un certificado sanitario animal de la UE. No se exige prueba de titulación; preséntate ante la aduana en un punto de entrada de viajeros."
      pt: "Vindo de um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Suíça, Japão, Austrália e outros), seu cachorro precisa de microchip, vacinação antirrábica válida, exame clínico feito por um veterinário oficial nas 48 horas anteriores à partida e certificado sanitário europeu. Não é exigido teste sorológico; apresente-se à alfândega em um ponto de entrada de viajantes."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-designated laboratory, then a compulsory 3-month wait before travel. A clinical exam and an EU animal health certificate are also required."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant le voyage. Un examen clinique et un certificat sanitaire européen sont également requis."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes del viaje. También se exigen un examen clínico y un certificado sanitario animal de la UE."
      pt: "Vindo de um país não listado (de risco), acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório designado pela UE, e depois 3 meses obrigatórios de espera antes da viagem. Também são exigidos um exame clínico e um certificado sanitário europeu."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Luxembourg depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien au Luxembourg dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Luxemburgo depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega ao Luxemburgo depende de onde você embarcou."
  points:
    - from: eu
      en: "From another EU country: no systematic border check — keep the EU pet passport with you."
      fr: "Depuis un autre pays de l'UE : pas de contrôle systématique — garde le passeport européen sur toi."
      es: "Desde otro país de la UE: sin control fronterizo sistemático — lleva contigo el pasaporte europeo."
      pt: "De outro país da UE: sem controle de fronteira sistemático — leve o passaporte europeu com você."
    - from: non_eu
      en: "From outside the EU: enter via a designated travellers' point of entry (mainly Luxembourg Airport) and present yourself spontaneously to customs and veterinary services for documentary and identity checks."
      fr: "Depuis hors UE : entre par un point d'entrée voyageurs désigné (principalement l'aéroport de Luxembourg) et présente-toi spontanément à la douane et aux services vétérinaires pour les contrôles documentaires et d'identité."
      es: "Desde fuera de la UE: entra por un punto de entrada de viajeros designado (principalmente el aeropuerto de Luxemburgo) y preséntate espontáneamente ante la aduana y los servicios veterinarios para los controles documentales y de identidad."
      pt: "De fora da UE: entre por um ponto de entrada de viajantes designado (principalmente o Aeroporto de Luxemburgo) e apresente-se espontaneamente à alfândega e aos serviços veterinários para o controle dos documentos e da identidade."
    - en: "No import permit is issued for a pet travelling with its owner; commercial consignments are cleared through TRACES at a border control post."
      fr: "Aucun permis d'import n'est délivré pour un animal voyageant avec son maître ; les envois commerciaux sont dédouanés via TRACES à un poste de contrôle frontalier."
      es: "No se expide ningún permiso de importación para una mascota que viaje con su propietario; los envíos comerciales se despachan a través de TRACES en un puesto de control fronterizo."
      pt: "Nenhuma autorização de importação é emitida para um animal de estimação que viaja com o dono; as remessas comerciais são desembaraçadas pelo TRACES em um posto de controle fronteiriço."
    - en: "Carry original documents (not copies), in French or German, or officially translated."
      fr: "Munis-toi des documents originaux (pas de copies), en français ou en allemand, ou traduits officiellement."
      es: "Lleva los documentos originales (no copias), en francés o en alemán, o traducidos oficialmente."
      pt: "Leve os documentos originais (não cópias), em francês ou alemão, ou com tradução oficial."
    - en: "If documents are missing or invalid, the animal can be seized and placed in official quarantine at the owner's expense, and the case referred to the public prosecutor."
      fr: "Si les documents manquent ou sont invalides, l'animal peut être saisi et placé en quarantaine officielle aux frais du propriétaire, et l'affaire transmise au parquet."
      es: "Si faltan documentos o no son válidos, el animal puede ser confiscado y puesto en cuarentena oficial a cargo del propietario, y el caso remitido a la fiscalía."
      pt: "Se faltarem documentos ou eles não forem válidos, o animal pode ser apreendido e colocado em quarentena oficial às custas do dono, e o caso encaminhado ao Ministério Público."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Luxembourg regulates dogs 'liable to be dangerous' under the amended law of 9 May 2008. Rather than banning breeds, it lists them and makes keeping one subject to prior authorisation and conditions. Only the listed breeds (or dogs resembling them by morphology) are concerned."
    fr: "Le Luxembourg réglemente les chiens « susceptibles d'être dangereux » selon la loi modifiée du 9 mai 2008. Plutôt que d'interdire des races, il les liste et soumet leur détention à une autorisation préalable et à des conditions. Seules les races listées (ou les chiens qui leur ressemblent par la morphologie) sont concernées."
    es: "Luxemburgo regula los perros «susceptibles de ser peligrosos» conforme a la ley modificada del 9 de mayo de 2008. En lugar de prohibir razas, las enumera y somete su tenencia a una autorización previa y a ciertas condiciones. Solo se ven afectadas las razas listadas (o los perros que se les parezcan por su morfología)."
    pt: "O Luxemburgo regulamenta os cachorros “suscetíveis de serem perigosos” pela lei modificada de 9 de maio de 2008. Em vez de proibir raças, ele as lista e sujeita a posse de um desses cachorros a autorização prévia e a condições. Só as raças listadas (ou os cachorros que se parecem com elas pela morfologia) são afetadas."
  cat1:
    en: "Listed breeds (Article 10): American Staffordshire Terrier, Staffordshire Bull Terrier, Mastiff and Tosa. Keeping one requires prior authorisation from the Ministry of Agriculture, obtained after passing the 'Hondsführerschäin' training and producing a criminal-record extract and ID. A second declaration to the commune is due within 18 months of birth, with an obedience-training certificate; some listed dogs must be neutered."
    fr: "Races listées (article 10) : American Staffordshire Terrier, Staffordshire Bull Terrier, Mastiff et Tosa. Leur détention exige une autorisation préalable du ministère de l'Agriculture, obtenue après la réussite de la formation « Hondsführerschäin » et sur présentation d'un extrait de casier judiciaire et d'une pièce d'identité. Une seconde déclaration à la commune est due dans les 18 mois suivant la naissance, avec un certificat de dressage ; certains chiens listés doivent être castrés."
    es: "Razas listadas (artículo 10): American Staffordshire Terrier, Staffordshire Bull Terrier, Mastiff y Tosa. Su tenencia requiere autorización previa del Ministerio de Agricultura, obtenida tras superar la formación «Hondsführerschäin» y presentar un extracto del registro de antecedentes penales y un documento de identidad. Se debe presentar una segunda declaración al municipio en los 18 meses siguientes al nacimiento, con un certificado de adiestramiento en obediencia; algunos perros listados deben esterilizarse."
    pt: "Raças listadas (artigo 10): American Staffordshire Terrier, Staffordshire Bull Terrier, Mastiff e Tosa. Ter um deles exige autorização prévia do Ministério da Agricultura, obtida depois de ser aprovado no curso “Hondsführerschäin” e mediante apresentação de um extrato de antecedentes criminais e de um documento de identidade. Uma segunda declaração ao município é devida em até 18 meses após o nascimento, acompanhada de um certificado de adestramento em obediência; alguns cachorros listados devem ser castrados."
  cat2:
    en: "Look-alike dogs: dogs resembling the listed breeds by their morphological characteristics without being entered in a pedigree book recognised by the minister (commonly called pit-bulls and boer-bulls). The same authorisation, training and conditions apply as for the listed breeds."
    fr: "Chiens assimilables : chiens ressemblant aux races listées par leurs caractéristiques morphologiques sans être inscrits à un livre généalogique reconnu par le ministre (communément appelés pit-bulls et boer-bulls). Les mêmes autorisation, formation et conditions s'appliquent que pour les races listées."
    es: "Perros similares: perros que se parecen a las razas listadas por sus características morfológicas sin estar inscritos en un libro genealógico reconocido por el ministro (comúnmente llamados pit-bulls y boer-bulls). Se aplican la misma autorización, formación y condiciones que para las razas listadas."
    pt: "Cachorros assemelhados: cachorros que se parecem com as raças listadas por suas características morfológicas sem estarem inscritos em um livro genealógico reconhecido pelo ministro (comumente chamados de pit-bulls e boer-bulls). Aplicam-se a mesma autorização, o mesmo curso e as mesmas condições das raças listadas."
  note:
    en: "Luxembourg does not impose a blanket import ban on these dogs, but you cannot keep one there without the ministerial authorisation and conditions above. All dogs must be leashed in built-up areas and covered by third-party liability insurance. Confirm your situation with ALVA before travelling."
    fr: "Le Luxembourg n'impose pas d'interdiction générale d'importation de ces chiens, mais on ne peut en détenir un sans l'autorisation ministérielle et les conditions ci-dessus. Tout chien doit être tenu en laisse en agglomération et couvert par une assurance responsabilité civile. Confirme ta situation auprès de l'ALVA avant de voyager."
    es: "Luxemburgo no impone una prohibición general de importación de estos perros, pero no se puede tener uno allí sin la autorización ministerial y las condiciones anteriores. Todos los perros deben ir con correa en zonas urbanizadas y estar cubiertos por un seguro de responsabilidad civil. Confirma tu situación con la ALVA antes de viajar."
    pt: "O Luxemburgo não impõe uma proibição geral de importação desses cachorros, mas você não pode ter um lá sem a autorização ministerial e as condições acima. Todo cachorro deve andar na coleira em áreas urbanizadas e estar coberto por um seguro de responsabilidade civil. Confirme sua situação com a ALVA antes de viajar."

