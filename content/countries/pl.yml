notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro."
    pt: "Só um médico-veterinário pode confirmar o procedimento exato para o seu cachorro."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Poland (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — la Pologne (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Polonia (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — a Polônia (seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Poland", fr: "Pays de destination — Pologne", es: "País de destino — Polonia", pt: "País de destino — Polônia" }
      text:
        en: "Poland applies the EU pet-movement framework: an ISO microchip and a valid rabies vaccination are always required, and no tapeworm treatment is needed to enter Poland. Poland adds no breed import ban, but keeping certain breeds requires a local permit."
        fr: "La Pologne applique le cadre européen : puce ISO et vaccination antirabique valide toujours exigées, et aucun traitement contre l'échinococcose n'est requis pour entrer en Pologne. La Pologne n'ajoute aucune interdiction d'import de race, mais la détention de certaines races exige un permis local."
        es: "Polonia aplica el marco europeo de movimiento de animales: siempre se exigen un microchip ISO y una vacunación antirrábica válida, y no se necesita tratamiento contra la tenia para entrar en Polonia. Polonia no añade ninguna prohibición de importación por raza, pero tener ciertas razas requiere un permiso local."
        pt: "A Polônia aplica o marco europeu de circulação de animais de estimação: microchip ISO e vacinação antirrábica válida são sempre obrigatórios, e nenhum tratamento contra a tênia (Echinococcus) é exigido para entrar na Polônia. A Polônia não acrescenta nenhuma proibição de importação por raça, mas manter certas raças exige uma autorização local."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Whether your dog leaves from an EU country, a listed non-EU country or a non-listed country decides whether an antibody test and a health certificate are required."
        fr: "Que ton chien parte d'un pays de l'UE, d'un pays tiers listé ou d'un pays non listé détermine si un titrage et un certificat sanitaire sont exigés."
        es: "Que tu perro salga de un país de la UE, de un país tercero listado o de un país no listado determina si se exigen una prueba de titulación y un certificado sanitario."
        pt: "Partir de um país da UE, de um país listado fora da UE ou de um país não listado é o que define se o teste sorológico e o certificado sanitário são exigidos."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay in a rabies-risk country can trigger an antibody test even if you fly in from an exempt country. It is your dog's real origin and history that count — not only the last airport."
        fr: "Un séjour récent dans un pays à risque rabique peut imposer un titrage même si tu arrives d'un pays exempté. C'est l'origine réelle et l'historique du chien qui comptent — pas seulement l'aéroport de destination finale."
        es: "Una estancia reciente en un país con riesgo de rabia puede obligar a una prueba de titulación aunque llegues desde un país exento. Lo que cuenta es el origen y el historial reales de tu perro — no solo el último aeropuerto."
        pt: "Uma estadia recente em um país de risco de raiva pode acionar a exigência do teste sorológico mesmo que você chegue de um país isento. O que conta é a origem e o histórico reais do seu cachorro — não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Poland's framework, then confirm your dog's exact origin and history with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre polonais, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Polonia y luego confirma el origen y el historial exactos de tu perro con tu veterinario."
    pt: "Portanto, leia as exigências abaixo como o marco regulatório da Polônia e depois confirme com seu veterinário a origem e o histórico exatos do seu cachorro."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "ISO 11784/11785 transponder; must be implanted before the rabies vaccination.", fr: "Transpondeur ISO 11784/11785 ; doit être posé avant la vaccination antirabique.", es: "Transpondedor ISO 11784/11785; debe implantarse antes de la vacunación antirrábica.", pt: "Transponder ISO 11784/11785; deve ser implantado antes da vacinação antirrábica." }
    exceptions: { en: "A legible tattoo is accepted only if done before 3 July 2011.", fr: "Un tatouage lisible n'est accepté que s'il est antérieur au 3 juillet 2011.", es: "Un tatuaje legible solo se acepta si se hizo antes del 3 de julio de 2011.", pt: "Uma tatuagem legível só é aceita se tiver sido feita antes de 3 de julho de 2011." }
    ref: { en: "EU Reg. 576/2013; wetgiw.gov.pl", fr: "Règl. UE 576/2013 ; wetgiw.gov.pl", es: "Regl. UE 576/2013; wetgiw.gov.pl", pt: "Regulamento UE 576/2013; wetgiw.gov.pl" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Dog at least 12 weeks old at the shot; valid from 21 days after the primary vaccination.", fr: "Chien d'au moins 12 semaines ; valide 21 jours après la primo-vaccination.", es: "Perro de al menos 12 semanas en el momento de la vacuna; válida a partir de los 21 días de la primovacunación.", pt: "Cachorro com pelo menos 12 semanas na data da vacina; válida a partir de 21 dias após a primovacinação." }
    exceptions: { en: "Poland does not allow the entry of young dogs without a valid rabies vaccination; the microchip must precede the shot.", fr: "La Pologne n'autorise pas l'entrée de jeunes chiens sans vaccination antirabique valide ; la puce doit précéder le vaccin.", es: "Polonia no permite la entrada de perros jóvenes sin una vacunación antirrábica válida; el microchip debe preceder a la vacuna.", pt: "A Polônia não permite a entrada de cachorros jovens sem vacinação antirrábica válida; o microchip deve ser aplicado antes da vacina." }
    ref: { en: "EU Reg. 576/2013, Annex III; wetgiw.gov.pl", fr: "Règl. UE 576/2013, annexe III ; wetgiw.gov.pl", es: "Regl. UE 576/2013, anexo III; wetgiw.gov.pl", pt: "Regulamento UE 576/2013, anexo III; wetgiw.gov.pl" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Non-listed origins only (e.g. Ukraine, Turkey, Georgia, Egypt): blood ≥30 days after vaccination, ≥3 months before entry, result ≥0.5 IU/ml, EU-designated lab.", fr: "Pays non listés uniquement (p. ex. Ukraine, Turquie, Géorgie, Égypte) : sang ≥30 jours après le vaccin, ≥3 mois avant l'entrée, résultat ≥0,5 UI/ml, labo agréé UE.", es: "Solo orígenes no listados (p. ej. Ucrania, Turquía, Georgia, Egipto): sangre ≥30 días tras la vacuna, ≥3 meses antes de la entrada, resultado ≥0,5 UI/ml, laboratorio autorizado por la UE.", pt: "Apenas para origens não listadas (ex.: Ucrânia, Turquia, Geórgia, Egito): sangue coletado ≥30 dias após a vacinação e ≥3 meses antes da entrada, resultado ≥0,5 UI/ml, em laboratório designado pela UE." }
    exceptions: { en: "Not required from the EU or from listed countries (US, Canada, UK, Switzerland, Japan, Australia…).", fr: "Non requis depuis l'UE ou les pays listés (USA, Canada, RU, Suisse, Japon, Australie…).", es: "No se exige desde la UE ni desde países listados (EE. UU., Canadá, RU, Suiza, Japón, Australia…).", pt: "Não exigido para quem vem da UE ou de países listados (EUA, Canadá, Reino Unido, Suíça, Japão, Austrália…)." }
    ref: { en: "EU Reg. 2020/692; wetgiw.gov.pl", fr: "Règl. UE 2020/692 ; wetgiw.gov.pl", es: "Regl. UE 2020/692; wetgiw.gov.pl", pt: "Regulamento UE 2020/692; wetgiw.gov.pl" }
  - item: { en: "EU pet passport", fr: "Passeport européen", es: "Pasaporte europeo para mascotas", pt: "Passaporte europeu para animais" }
    required: { en: "EU origins", fr: "Origines UE", es: "Orígenes de la UE", pt: "Origens na UE" }
    when: { en: "Issued by an EU vet; records the microchip and rabies vaccination.", fr: "Délivré par un vétérinaire de l'UE ; consigne la puce et la vaccination.", es: "Expedido por un veterinario de la UE; registra el microchip y la vacunación antirrábica.", pt: "Emitido por um veterinário da UE; registra o microchip e a vacinação antirrábica." }
    exceptions: { en: "Replaced by an animal health certificate for non-EU origins.", fr: "Remplacé par un certificat sanitaire pour les origines hors UE.", es: "Se sustituye por un certificado sanitario para orígenes fuera de la UE.", pt: "Substituído por um certificado sanitário quando a origem é de fora da UE." }
    ref: { en: "EU Reg. 577/2013", fr: "Règl. UE 577/2013", es: "Regl. UE 577/2013", pt: "Regulamento UE 577/2013" }
  - item: { en: "EU animal health certificate", fr: "Certificat sanitaire UE", es: "Certificado sanitario animal de la UE", pt: "Certificado sanitário europeu" }
    required: { en: "Non-EU origins", fr: "Origines hors UE", es: "Orígenes fuera de la UE", pt: "Origens fora da UE" }
    when: { en: "Issued/endorsed by an official vet before departure; valid 10 days to entry, then up to 4 months for onward EU travel. A written owner declaration of non-commercial movement is also required.", fr: "Établi/visé par un vétérinaire officiel avant départ ; valable 10 jours jusqu'à l'entrée, puis jusqu'à 4 mois pour circuler dans l'UE. Une déclaration écrite du propriétaire de mouvement non commercial est également exigée.", es: "Expedido/refrendado por un veterinario oficial antes de la salida; válido 10 días hasta la entrada y luego hasta 4 meses para circular por la UE. También se exige una declaración escrita del propietario de movimiento no comercial.", pt: "Emitido/endossado por um veterinário oficial antes da partida; válido por 10 dias até a entrada e depois por até 4 meses para deslocamentos dentro da UE. Também é exigida uma declaração escrita do dono de que o deslocamento não é comercial." }
    exceptions: { en: "Not needed for EU origins (passport instead).", fr: "Inutile pour les origines UE (passeport à la place).", es: "No necesario para orígenes de la UE (en su lugar, el pasaporte).", pt: "Não é necessário para origens na UE (usa-se o passaporte)." }
    ref: { en: "EU Reg. 577/2013, Annex IV; wetgiw.gov.pl", fr: "Règl. UE 577/2013, annexe IV ; wetgiw.gov.pl", es: "Regl. UE 577/2013, anexo IV; wetgiw.gov.pl", pt: "Regulamento UE 577/2013, anexo IV; wetgiw.gov.pl" }
  - item: { en: "Tapeworm (Echinococcus) treatment", fr: "Traitement échinococcose", es: "Tratamiento contra la tenia (Echinococcus)", pt: "Tratamento contra a tênia (Echinococcus)" }
    required: { en: "Not required", fr: "Non requis", es: "No obligatorio", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Only Finland, Ireland, Malta, N. Ireland and Norway require it — not Poland.", fr: "Seuls la Finlande, l'Irlande, Malte, l'Irlande du Nord et la Norvège l'exigent — pas la Pologne.", es: "Solo lo exigen Finlandia, Irlanda, Malta, Irlanda del Norte y Noruega — no Polonia.", pt: "Só Finlândia, Irlanda, Malta, Irlanda do Norte e Noruega exigem — a Polônia não." }
    ref: { en: "European Commission — pet travel", fr: "Commission européenne — voyage animaux", es: "Comisión Europea — viaje de animales", pt: "Comissão Europeia — viagens com animais de estimação" }
  - item: { en: "Advance notification / import permit", fr: "Notification préalable / permis d'import", es: "Notificación previa / permiso de importación", pt: "Notificação prévia / autorização de importação" }
    required: { en: "Not required", fr: "Non requis", es: "No obligatorio", pt: "Não obrigatório" }
    when: { en: "Up to 5 pets per traveller move under the non-commercial rules; 6 or more (or unaccompanied) follow commercial import rules.", fr: "Jusqu'à 5 animaux par voyageur relèvent des règles non commerciales ; 6 ou plus (ou non accompagnés) suivent les règles d'import commercial.", es: "Hasta 5 mascotas por viajero se rigen por las normas no comerciales; 6 o más (o sin acompañante) siguen las normas de importación comercial.", pt: "Até 5 animais por viajante se enquadram nas regras não comerciais; 6 ou mais (ou desacompanhados) seguem as regras de importação comercial." }
    exceptions: { en: "Poland issues no import permit for a private pet and requires no prior customs appointment.", fr: "La Pologne ne délivre aucun permis d'import pour un animal de compagnie privé et n'exige aucun rendez-vous douanier préalable.", es: "Polonia no expide ningún permiso de importación para una mascota privada ni exige cita previa en aduanas.", pt: "A Polônia não emite autorização de importação para animal de estimação particular e não exige agendamento prévio na alfândega." }
    ref: { en: "EU Reg. 576/2013; wetgiw.gov.pl", fr: "Règl. UE 576/2013 ; wetgiw.gov.pl", es: "Regl. UE 576/2013; wetgiw.gov.pl", pt: "Regulamento UE 576/2013; wetgiw.gov.pl" }
  - item: { en: "Border check (documents & identity)", fr: "Contrôle frontalier (documents & identité)", es: "Control fronterizo (documentos e identidad)", pt: "Controle de fronteira (documentos e identidade)" }
    required: { en: "Non-EU arrivals", fr: "Arrivées hors UE", es: "Llegadas de fuera de la UE", pt: "Chegadas de fora da UE" }
    when: { en: "At a designated travellers' point of entry; customs (KAS) or the official veterinary service read the microchip and check the documents.", fr: "À un point d'entrée voyageurs désigné ; la douane (KAS) ou le service vétérinaire officiel lit la puce et contrôle les documents.", es: "En un punto de entrada de viajeros designado; la aduana (KAS) o el servicio veterinario oficial lee el microchip y revisa los documentos.", pt: "Em um ponto de entrada de viajantes designado; a alfândega (KAS) ou o serviço veterinário oficial leem o microchip e conferem os documentos." }
    exceptions: { en: "No systematic check for intra-EU (Schengen) arrivals.", fr: "Pas de contrôle systématique pour les arrivées intra-UE (Schengen).", es: "Sin control sistemático para las llegadas intracomunitarias (Schengen).", pt: "Sem controle sistemático para as chegadas de dentro da UE (Schengen)." }
    ref: { en: "EU Reg. 576/2013; wetgiw.gov.pl", fr: "Règl. UE 576/2013 ; wetgiw.gov.pl", es: "Regl. UE 576/2013; wetgiw.gov.pl", pt: "Regulamento UE 576/2013; wetgiw.gov.pl" }
  - item: { en: "Restricted / dangerous breeds", fr: "Races restreintes / dangereuses", es: "Razas restringidas / peligrosas", pt: "Raças restritas / perigosas" }
    required: { en: "Keeping permit (not an import ban)", fr: "Permis de détention (pas d'interdiction d'import)", es: "Permiso de tenencia (no una prohibición de importación)", pt: "Autorização de posse (não é proibição de importação)" }
    when: { en: "No breed is refused entry or transit, but keeping or breeding a dog of a breed officially listed as aggressive requires a permit from the local municipality.", fr: "Aucune race n'est refusée à l'entrée ou au transit, mais détenir ou élever un chien d'une race officiellement listée comme agressive exige un permis de la commune locale.", es: "A ninguna raza se le deniega la entrada o el tránsito, pero tener o criar un perro de una raza oficialmente listada como agresiva requiere un permiso del municipio local.", pt: "Nenhuma raça tem entrada ou trânsito recusados, mas manter ou criar um cachorro de uma raça oficialmente listada como agressiva exige autorização do município local." }
    exceptions: { en: "The list of ~11 breeds is set by ministerial regulation; the permit is issued by the mayor (wójt/burmistrz/prezydent miasta).", fr: "La liste d'environ 11 races est fixée par arrêté ministériel ; le permis est délivré par le maire (wójt/burmistrz/prezydent miasta).", es: "La lista de unas 11 razas la fija un reglamento ministerial; el permiso lo expide el alcalde (wójt/burmistrz/prezydent miasta).", pt: "A lista de cerca de 11 raças é definida por portaria ministerial; a autorização é emitida pelo chefe do município (wójt/burmistrz/prezydent miasta)." }
    ref: { en: "Reg. MSWiA 28.04.2003 (Dz.U. 2003 no. 77 item 687); Animal Protection Act art. 10", fr: "Arrêté MSWiA du 28.04.2003 (Dz.U. 2003 nr 77 poz. 687) ; Loi sur la protection des animaux art. 10", es: "Regl. MSWiA de 28.04.2003 (Dz.U. 2003 n.º 77 pos. 687); Ley de Protección de los Animales art. 10", pt: "Rozporządzenie MSWiA 28.04.2003 (Dz.U. 2003 nr 77 poz. 687); Ustawa o ochronie zwierząt (Lei de proteção dos animais) art. 10" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "Effectively ≥15 weeks", fr: "En pratique ≥15 semaines", es: "En la práctica ≥15 semanas", pt: "Na prática, ≥15 semanas" }
    when: { en: "12-week rabies shot + 21-day wait (listed); about 7 months from a non-listed country.", fr: "Vaccin à 12 semaines + 21 jours (pays listé) ; environ 7 mois depuis un pays non listé.", es: "Vacuna a las 12 semanas + espera de 21 días (país listado); unos 7 meses desde un país no listado.", pt: "Vacina antirrábica às 12 semanas + 21 dias de espera (país listado); cerca de 7 meses vindo de um país não listado." }
    exceptions: { en: "Puppies under 12 weeks cannot be vaccinated, so cannot enter Poland from outside the EU without a valid rabies vaccination.", fr: "Un chiot de moins de 12 semaines ne peut être vacciné, donc ne peut entrer en Pologne depuis hors UE sans vaccination antirabique valide.", es: "Los cachorros menores de 12 semanas no pueden vacunarse, por lo que no pueden entrar en Polonia desde fuera de la UE sin una vacunación antirrábica válida.", pt: "Filhotes com menos de 12 semanas não podem ser vacinados e, por isso, não podem entrar na Polônia vindos de fora da UE sem vacinação antirrábica válida." }
    ref: { en: "EU Reg. 576/2013; wetgiw.gov.pl", fr: "Règl. UE 576/2013 ; wetgiw.gov.pl", es: "Regl. UE 576/2013; wetgiw.gov.pl", pt: "Regulamento UE 576/2013; wetgiw.gov.pl" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
