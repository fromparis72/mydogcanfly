    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Only if rules are breached — authorities may then order re-export or other measures at the owner's expense.", fr: "Uniquement en cas de non-conformité — les autorités peuvent alors ordonner la réexpédition ou d'autres mesures aux frais du propriétaire.", es: "Solo en caso de incumplimiento — las autoridades pueden ordenar la reexpedición u otras medidas a cargo del propietario.", pt: "Apenas em caso de descumprimento das regras — as autoridades podem então determinar a reexportação ou outras medidas às custas do dono." }
    ref: { en: "EU Reg. 576/2013; wetgiw.gov.pl", fr: "Règl. UE 576/2013 ; wetgiw.gov.pl", es: "Regl. UE 576/2013; wetgiw.gov.pl", pt: "Regulamento UE 576/2013; wetgiw.gov.pl" }

origin:
  scheme: eu
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate and normally no border check. If you plan to keep a listed aggressive breed in Poland, arrange the municipal keeping permit."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire et normalement pas de contrôle frontalier. Si tu compte détenir en Pologne une race listée comme agressive, prévois le permis de détention communal."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario y normalmente sin control fronterizo. Si tienes previsto tener en Polonia una raza listada como agresiva, gestiona el permiso de tenencia municipal."
      pt: "Um cachorro vindo de outro país da UE precisa do passaporte europeu para animais comprovando microchip ISO válido e vacinação antirrábica em dia. Sem teste sorológico, sem certificado sanitário e normalmente sem controle de fronteira. Se você pretende manter na Polônia uma raça listada como agressiva, providencie a autorização de posse municipal."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Switzerland, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination and an EU animal health certificate endorsed by an official vet before departure, plus a written non-commercial declaration. No antibody test is required; arrive via a designated travellers' point of entry."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Suisse, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire européen visé par un vétérinaire officiel avant le départ, ainsi qu'une déclaration écrite de non-commercialité. Pas de titrage ; arrive par un point d'entrée voyageurs désigné."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Suiza, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal de la UE refrendado por un veterinario oficial antes de la salida, más una declaración escrita de no comercialidad. No se exige prueba de titulación; llega por un punto de entrada de viajeros designado."
      pt: "Vindo de um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Suíça, Japão, Austrália e outros), seu cachorro precisa de microchip, vacinação antirrábica válida e um certificado sanitário europeu endossado por um veterinário oficial antes da partida, além de uma declaração escrita de deslocamento não comercial. Não é exigido teste sorológico; entre por um ponto de entrada de viajantes designado."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country such as Ukraine, Turkey, Georgia or Egypt, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-designated laboratory, then a compulsory 3-month wait before entry. An endorsed EU animal health certificate is also required."
      fr: "Depuis un pays non listé (à risque) comme l'Ukraine, la Turquie, la Géorgie ou l'Égypte, ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen visé est également requis."
      es: "Desde un país no listado (con riesgo) como Ucrania, Turquía, Georgia o Egipto, añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exige un certificado sanitario animal de la UE refrendado."
      pt: "Vindo de um país não listado (de risco), como Ucrânia, Turquia, Geórgia ou Egito, acrescente o teste sorológico antirrábico (titulação): sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório designado pela UE, e depois 3 meses obrigatórios de espera antes da entrada. Também é exigido um certificado sanitário europeu endossado."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Poland depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien en Pologne dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Polonia depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega à Polônia depende do país de onde você veio."
  points:
    - from: eu
      en: "From another EU country: no systematic border check — keep the EU pet passport with you."
      fr: "Depuis un autre pays de l'UE : pas de contrôle systématique — garde le passeport européen sur toi."
      es: "Desde otro país de la UE: sin control fronterizo sistemático — lleva contigo el pasaporte europeo."
      pt: "De outro país da UE: sem controle de fronteira sistemático — leve o passaporte europeu com você."
    - from: non_eu
      en: "From outside the EU: arrive via a designated travellers' point of entry, where customs (KAS) or the official veterinary service read the microchip and check the documents against it."
      fr: "Depuis hors UE : arrive par un point d'entrée voyageurs désigné, où la douane (KAS) ou le service vétérinaire officiel lit la puce et contrôle les documents par rapport à celle-ci."
      es: "Desde fuera de la UE: llega por un punto de entrada de viajeros designado, donde la aduana (KAS) o el servicio veterinario oficial lee el microchip y coteja los documentos con él."
      pt: "De fora da UE: entre por um ponto de entrada de viajantes designado, onde a alfândega (KAS) ou o serviço veterinário oficial leem o microchip e conferem os documentos com base nele."
    - en: "No import permit is issued for a private pet and no prior appointment with customs is needed."
      fr: "Aucun permis d'import n'est délivré pour un animal de compagnie privé et aucun rendez-vous préalable avec la douane n'est nécessaire."
      es: "No se expide ningún permiso de importación para una mascota privada ni se necesita cita previa con la aduana."
      pt: "Nenhuma autorização de importação é emitida para animal de estimação particular e não é preciso agendamento prévio na alfândega."
    - en: "Carry the original documents (not copies); Polish or bilingual/officially translated documents are expected."
      fr: "Munis-toi des documents originaux (pas de copies) ; des documents en polonais ou bilingues/traduits officiellement sont attendus."
      es: "Lleva los documentos originales (no copias); se esperan documentos en polaco o bilingües/traducidos oficialmente."
      pt: "Leve os documentos originais (não cópias); espera-se que estejam em polonês ou bilíngues/traduzidos oficialmente."
    - en: "If identification or documents are missing or invalid, authorities may order re-export, quarantine or other measures at the owner's expense."
      fr: "Si l'identification ou les documents manquent ou sont invalides, les autorités peuvent ordonner réexpédition, quarantaine ou d'autres mesures aux frais du propriétaire."
      es: "Si falta la identificación o los documentos, o no son válidos, las autoridades pueden ordenar la reexpedición, la cuarentena u otras medidas a cargo del propietario."
      pt: "Se a identificação ou os documentos estiverem ausentes ou inválidos, as autoridades podem determinar a reexportação, a quarentena ou outras medidas às custas do dono."
    - en: "No breed is refused at the border, but keeping a listed aggressive breed in Poland requires a permit from the local municipality."
      fr: "Aucune race n'est refusée à la frontière, mais détenir en Pologne une race listée comme agressive exige un permis de la commune locale."
      es: "A ninguna raza se le deniega en la frontera, pero tener en Polonia una raza listada como agresiva requiere un permiso del municipio local."
      pt: "Nenhuma raça é recusada na fronteira, mas manter na Polônia uma raça listada como agressiva exige autorização do município local."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Poland does not ban any breed from entering or transiting the country. Instead, it regulates the keeping of certain breeds: a Ministry of Interior and Administration regulation (28 April 2003) lists about eleven breeds officially considered aggressive, and the Animal Protection Act requires a permit to keep or breed a dog of one of these breeds."
    fr: "La Pologne n'interdit à aucune race d'entrer ou de transiter par le pays. Elle réglemente plutôt la détention de certaines races : un arrêté du ministère de l'Intérieur et de l'Administration (28 avril 2003) liste environ onze races officiellement considérées comme agressives, et la loi sur la protection des animaux exige un permis pour détenir ou élever un chien de l'une de ces races."
    es: "Polonia no prohíbe a ninguna raza entrar o transitar por el país. En su lugar, regula la tenencia de ciertas razas: un reglamento del Ministerio del Interior y Administración (28 de abril de 2003) enumera unas once razas oficialmente consideradas agresivas, y la Ley de Protección de los Animales exige un permiso para tener o criar un perro de una de estas razas."
    pt: "A Polônia não proíbe a entrada nem o trânsito de nenhuma raça pelo país. Em vez disso, ela regula a posse de certas raças: uma portaria do Ministério do Interior e da Administração (MSWiA, de 28 de abril de 2003) lista cerca de onze raças oficialmente consideradas agressivas, e a Ustawa o ochronie zwierząt (Lei de proteção dos animais) exige autorização para manter ou criar um cachorro de uma dessas raças."
  cat1:
    en: "Listed aggressive breeds: American Pit Bull Terrier, Perro de Presa Mallorquin (Ca de Bou), American Bulldog, Dogo Argentino, Perro de Presa Canario, Tosa Inu, Rottweiler, Akbash Dog, Anatolian Karabash, Moscow Watchdog and Caucasian Shepherd Dog. These dogs may still enter and transit Poland freely."
    fr: "Races listées comme agressives : American Pit Bull Terrier, Perro de Presa Mallorquin (Ca de Bou), Bouledogue américain, Dogo Argentino, Perro de Presa Canario, Tosa Inu, Rottweiler, Akbash, Anatolian Karabash, chien de garde de Moscou et berger du Caucase. Ces chiens peuvent entrer et transiter librement en Pologne."
    es: "Razas listadas como agresivas: American Pit Bull Terrier, Perro de Presa Mallorquín (Ca de Bou), Bulldog americano, Dogo Argentino, Perro de Presa Canario, Tosa Inu, Rottweiler, Akbash, Karabash de Anatolia, perro guardián de Moscú y pastor del Cáucaso. Estos perros pueden entrar y transitar libremente por Polonia."
    pt: "Raças listadas como agressivas: American Pit Bull Terrier, Perro de Presa Mallorquin (Ca de Bou), American Bulldog, Dogo Argentino, Perro de Presa Canario, Tosa Inu, Rottweiler, Akbash Dog, Anatolian Karabash, Moscow Watchdog e Caucasian Shepherd Dog (pastor do Cáucaso). Esses cachorros continuam podendo entrar e transitar livremente pela Polônia."
  cat2:
    en: "Keeping permit: to keep or breed a dog of a listed breed in Poland, the owner must obtain a permit from the head of the local municipality (wójt, burmistrz or prezydent miasta) where the dog will be kept. The permit is granted only if the dog is kept in conditions that pose no threat to people or animals; it is refused or withdrawn otherwise."
    fr: "Permis de détention : pour détenir ou élever en Pologne un chien d'une race listée, le propriétaire doit obtenir un permis auprès du chef de la commune (wójt, burmistrz ou prezydent miasta) où le chien sera détenu. Le permis n'est accordé que si le chien est détenu dans des conditions ne présentant aucun danger pour les personnes ou les animaux ; il est refusé ou retiré dans le cas contraire."
    es: "Permiso de tenencia: para tener o criar en Polonia un perro de una raza listada, el propietario debe obtener un permiso del jefe del municipio (wójt, burmistrz o prezydent miasta) donde se tendrá el perro. El permiso solo se concede si el perro se mantiene en condiciones que no supongan ninguna amenaza para las personas o los animales; de lo contrario, se deniega o se retira."
    pt: "Autorização de posse: para manter ou criar na Polônia um cachorro de uma raça listada, o dono precisa obter uma autorização do chefe do município (wójt, burmistrz ou prezydent miasta) onde o cachorro será mantido. A autorização só é concedida se o cachorro for mantido em condições que não representem ameaça a pessoas ou animais; caso contrário, ela é recusada ou cassada."
  note:
    en: "The list applies to the breeds named in the regulation, not merely to look-alike dogs. This is a keeping-permit rule, not an import restriction: a tourist passing through with such a dog does not need the permit, but a resident keeping one does. Confirm the current list and local formalities with the destination municipality before moving."
    fr: "La liste vise les races nommées dans l'arrêté, et non les simples chiens ressemblants. Il s'agit d'une règle de permis de détention, pas d'une restriction d'import : un touriste de passage avec un tel chien n'a pas besoin du permis, mais un résident qui en détient un, oui. Confirme la liste en vigueur et les formalités locales auprès de la commune de destination avant de déménager."
    es: "La lista se aplica a las razas nombradas en el reglamento, no simplemente a perros parecidos. Es una norma de permiso de tenencia, no una restricción de importación: un turista de paso con un perro así no necesita el permiso, pero un residente que tenga uno, sí. Confirma la lista vigente y los trámites locales con el municipio de destino antes de mudarte."
    pt: "A lista se aplica às raças nomeadas na portaria, e não simplesmente a cachorros parecidos. É uma regra de autorização de posse, não uma restrição de importação: um turista que só está de passagem com um cachorro desses não precisa da autorização, mas um residente que o mantém precisa. Confirme a lista atual e as formalidades locais com o município de destino antes de se mudar."

