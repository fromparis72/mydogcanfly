# Country Entry Guide — Rwanda (trilingual EN/FR/ES).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_rw
iso2: "RW"
name: { en: "Rwanda", fr: "Rwanda", es: "Ruanda", pt: "Ruanda" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
exit:
  authority: RAB
  authorityUrl: https://rwandatrade.rw/procedure/419?l=en
  intro:
    en: "Rwanda is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Rwanda Agriculture and Animal Resources Development Board (RAB)."
    fr: "Le Rwanda est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par le Rwanda Agriculture and Animal Resources Development Board (RAB)."
    es: "Ruanda no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el Rwanda Agriculture and Animal Resources Development Board (RAB)."
    pt: "Ruanda é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pelo Rwanda Agriculture and Animal Resources Development Board (RAB)."
  steps:
    - timing: longlead
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      text:
        en: "RAB is the veterinary competent authority that issues the export permit and the veterinary health certificate for dogs and cats."
        fr: "Le RAB est l'autorité vétérinaire compétente qui délivre le permis d'export et le certificat sanitaire vétérinaire pour les chiens et chats."
        es: "El RAB es la autoridad veterinaria competente que emite el permiso de exportación y el certificado sanitario veterinario para perros y gatos."
        pt: "O RAB é a autoridade veterinária competente que emite a autorização de exportação e o atestado de saúde veterinário para cachorros e gatos."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Rwanda with your dog", fr: "Voyager au Rwanda avec ton chien", es: "Viajar a Ruanda con tu perro", pt: "Viajar para Ruanda com seu cachorro" }
  intro:
    en: >-
      Rwanda welcomes pet dogs, but entry is controlled by its own authorities — the Rwanda
      Agriculture and Animal Resources Development Board (RAB), the veterinary services, and the
      Rwanda Inspectorate, Competition and Consumer Protection Authority (RICA), with customs handled
      by the Rwanda Revenue Authority (RRA). No dog may arrive without an import permit obtained in
      advance and a RAB non-objection. Every dog needs a valid rabies vaccination and an
      international veterinary (health) certificate signed by a veterinarian in the country of
      export. Rwanda is not an EU country and does not recognise the EU pet passport as an entry
      document; it also does not operate an EU-style list of approved countries. Rwanda is a
      rabies-endemic country, so the rabies vaccination is treated as a core requirement for every
      origin. What mainly changes with your origin is who endorses your certificate and how far
      ahead you must plan. This guide explains each step before you book your flight.
    fr: >-
      Le Rwanda accueille les chiens de compagnie, mais l'entrée est contrôlée par ses propres
      autorités — le Rwanda Agriculture and Animal Resources Development Board (RAB), les services
      vétérinaires et la Rwanda Inspectorate, Competition and Consumer Protection Authority (RICA),
      le dédouanement étant assuré par la Rwanda Revenue Authority (RRA). Aucun chien ne peut arriver
      sans un permis d'importation obtenu à l'avance et une non-objection du RAB. Chaque chien doit
      disposer d'une vaccination antirabique valide et d'un certificat vétérinaire international
      (certificat sanitaire) signé par un vétérinaire du pays d'export. Le Rwanda n'est pas un pays
      de l'UE et ne reconnaît pas le passeport européen comme document d'entrée ; il n'applique pas
      non plus de liste de pays approuvés à l'européenne. Le Rwanda est un pays d'enzootie rabique :
      la vaccination antirabique est donc une exigence de base pour toute origine. Ce qui change
      surtout selon l'origine, c'est qui vise ton certificat et le délai à prévoir. Ce guide
      détaille chaque étape avant de réserver ton vol.
    es: >-
      Ruanda acoge a los perros de compañía, pero la entrada está controlada por sus propias
      autoridades — el Rwanda Agriculture and Animal Resources Development Board (RAB), los servicios
      veterinarios y la Rwanda Inspectorate, Competition and Consumer Protection Authority (RICA),
      con el despacho aduanero a cargo de la Rwanda Revenue Authority (RRA). Ningún perro puede llegar
      sin un permiso de importación obtenido con antelación y una no objeción del RAB. Cada perro
      necesita una vacunación antirrábica válida y un certificado veterinario internacional
      (certificado sanitario) firmado por un veterinario del país de exportación. Ruanda no es un país
      de la UE y no reconoce el pasaporte europeo para mascotas como documento de entrada; tampoco
      aplica una lista de países aprobados al estilo de la UE. Ruanda es un país de rabia endémica, por
      lo que la vacunación antirrábica se considera un requisito básico para todo origen. Lo que cambia
      sobre todo según el origen es quién refrenda tu certificado y con cuánta antelación debes
      planificar. Esta guía explica cada paso antes de reservar tu vuelo.

    pt: "Ruanda recebe bem cachorros de estimação, mas a entrada é controlada por suas próprias autoridades — o Rwanda Agriculture and Animal Resources Development Board (RAB), os serviços veterinários, e a Rwanda Inspectorate, Competition and Consumer Protection Authority (RICA), com a alfândega administrada pela Rwanda Revenue Authority (RRA). Nenhum cachorro pode chegar sem uma autorização de importação obtida com antecedência e uma não objeção do RAB. Todo cachorro precisa de uma vacinação antirrábica válida e de um certificado veterinário (de saúde) internacional assinado por um veterinário no país de exportação. Ruanda não é um país da UE e não reconhece o passaporte europeu para animais de estimação como documento de entrada; também não opera uma lista de países aprovados no estilo da UE. Ruanda tem raiva endêmica, portanto a vacinação antirrábica é tratada como exigência central para qualquer origem. O que muda principalmente conforme a origem é quem endossa seu certificado e com quanto tempo de antecedência você deve planejar. Este guia explica cada etapa antes de você reservar seu voo."
difficulty:
  level: moderate
  label: { en: "Moderate — advance import permit, RAB non-objection and vet certificate", fr: "Modérée — permis préalable, non-objection du RAB et certificat vétérinaire", es: "Moderada — permiso de importación previo, no objeción del RAB y certificado veterinario", pt: "Moderada — autorização de importação prévia, não objeção do RAB e certificado veterinário" }

prepTime:
  eu:
    en: "From Europe: allow ~4–6 weeks for the import permit and RAB non-objection, a rabies vaccination given 30 days to 12 months before entry, and an international veterinary certificate signed before departure."
    fr: "Depuis l'Europe : prévoir ~4 à 6 semaines pour le permis et la non-objection du RAB, une vaccination antirabique faite de 30 jours à 12 mois avant l'entrée et un certificat vétérinaire international signé avant le départ."
    es: "Desde Europa: prevé ~4 a 6 semanas para el permiso de importación y la no objeción del RAB, una vacunación antirrábica administrada de 30 días a 12 meses antes de la entrada, y un certificado veterinario internacional firmado antes de la salida."
    pt: "Da Europa: reserve ~4 a 6 semanas para a autorização de importação e a não objeção do RAB, uma vacinação antirrábica aplicada entre 30 dias e 12 meses antes da entrada, e um certificado veterinário internacional assinado antes da partida."
  listed:
    en: "From other non-EU countries: ~4–6 weeks — the same core steps (import permit, RAB non-objection, rabies vaccination, international veterinary certificate), with the certificate endorsed by your national veterinary authority."
    fr: "Depuis d'autres pays hors UE : ~4 à 6 semaines — mêmes étapes de base (permis, non-objection du RAB, vaccination antirabique, certificat vétérinaire international), le certificat étant visé par ton autorité vétérinaire nationale."
    es: "Desde otros países no pertenecientes a la UE: ~4 a 6 semanas — los mismos pasos básicos (permiso de importación, no objeción del RAB, vacunación antirrábica, certificado veterinario internacional), con el certificado refrendado por tu autoridad veterinaria nacional."
    pt: "De outros países fora da UE: ~4 a 6 semanas — as mesmas etapas principais (autorização de importação, não objeção do RAB, vacinação antirrábica, certificado veterinário internacional), com o certificado endossado pela sua autoridade veterinária nacional."
  nonListed:
    en: "From all origins: Rwanda applies the same import-permit and certificate requirements; allow extra time so the rabies vaccination is at least 30 days old and the permit is issued (about 4–5 working days once documents are complete) before travel."
    fr: "Depuis toute origine : le Rwanda applique les mêmes exigences de permis et de certificat ; prévois une marge pour que le vaccin ait au moins 30 jours et que le permis soit délivré (environ 4 à 5 jours ouvrables une fois le dossier complet) avant le voyage."
    es: "Desde todos los orígenes: Ruanda aplica los mismos requisitos de permiso de importación y de certificado; prevé un margen para que la vacuna antirrábica tenga al menos 30 días y para que el permiso se expida (unos 4 a 5 días hábiles una vez completo el expediente) antes del viaje."
    pt: "De todas as origens: Ruanda aplica as mesmas exigências de autorização de importação e certificado; reserve tempo extra para que a vacinação antirrábica tenha pelo menos 30 dias e para que a autorização seja emitida (cerca de 4 a 5 dias úteis assim que os documentos estiverem completos) antes da viagem."

