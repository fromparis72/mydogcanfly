notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro."
    pt: "Só um médico-veterinário pode confirmar o procedimento exato para o seu cachorro."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Finland (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — la Finlande (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Finlandia (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — a Finlândia (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — Finland", fr: "Pays de destination — Finlande", es: "País de destino — Finlandia", pt: "País de destino — Finlândia" }
      text:
        en: "Finland applies the EU pet-movement framework — ISO microchip and valid rabies vaccination always required — and adds a national rule: a vet-administered tapeworm (Echinococcus) treatment 24–120 hours before nearly every arrival."
        fr: "La Finlande applique le cadre européen — puce ISO et vaccination antirabique valide toujours exigées — et ajoute une règle nationale : un traitement antiténia (Echinococcus) par un vétérinaire 24 à 120 h avant presque toute arrivée."
        es: "Finlandia aplica el marco europeo de movimiento de animales — siempre se exigen microchip ISO y vacunación antirrábica válida — y añade una norma nacional: un tratamiento contra la tenia (Echinococcus) administrado por un veterinario 24–120 h antes de casi toda llegada."
        pt: "A Finlândia aplica o quadro europeu de circulação de animais de estimação — microchip ISO e vacinação antirrábica válida sempre obrigatórios — e acrescenta uma regra nacional: tratamento contra a tênia (Echinococcus) aplicado por um veterinário 24–120 horas antes de quase toda chegada."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Whether your dog leaves from an EU country, a listed non-EU country or a non-listed country decides whether an antibody test and a health certificate are required — and whether the tapeworm treatment is waived (Ireland, Malta, Norway, Northern Ireland)."
        fr: "Que ton chien parte d'un pays de l'UE, d'un pays tiers listé ou d'un pays non listé détermine si un titrage et un certificat sanitaire sont exigés — et si le traitement antiténia est levé (Irlande, Malte, Norvège, Irlande du Nord)."
        es: "Que tu perro salga de un país de la UE, de un país tercero listado o de un país no listado determina si se exigen una prueba de titulación y un certificado sanitario — y si se exime el tratamiento contra la tenia (Irlanda, Malta, Noruega, Irlanda del Norte)."
        pt: "Partir de um país da UE, de um país listado fora da UE ou de um país não listado é o que define se o teste sorológico e o certificado sanitário são exigidos — e se o tratamento contra a tênia é dispensado (Irlanda, Malta, Noruega, Irlanda do Norte)."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay in a rabies-risk country can trigger an antibody test even if you fly in from an exempt country. It is your dog's real origin and history that count — not only the last airport."
        fr: "Un séjour récent dans un pays à risque rabique peut imposer un titrage même si tu arrives d'un pays exempté. C'est l'origine réelle et l'historique du chien qui comptent — pas seulement l'aéroport de destination finale."
        es: "Una estancia reciente en un país con riesgo de rabia puede obligar a una prueba de titulación aunque llegues desde un país exento. Lo que cuenta es el origen y el historial reales de tu perro — no solo el último aeropuerto."
        pt: "Uma estadia recente em um país de risco de raiva pode acionar a exigência do teste sorológico mesmo que você chegue de um país isento. O que conta é a origem e o histórico reais do seu cachorro — não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Finland's framework, then confirm your dog's exact origin and history with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre finlandais, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Finlandia y luego confirma el origen y el historial exactos de tu perro con tu veterinario."
    pt: "Leia então as exigências abaixo como o quadro finlandês, e confirme com seu veterinário a origem e o histórico exatos do seu cachorro."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Must comply with ISO 11784/11785 and be implanted before the rabies vaccination.", fr: "Doit être conforme à ISO 11784/11785 et posée avant la vaccination antirabique.", es: "Debe cumplir la norma ISO 11784/11785 e implantarse antes de la vacunación antirrábica.", pt: "Deve estar em conformidade com a norma ISO 11784/11785 e ser implantado antes da vacinação antirrábica." }
    exceptions: { en: "A legible tattoo is accepted only if done before 3 July 2011.", fr: "Un tatouage lisible n'est accepté que s'il est antérieur au 3 juillet 2011.", es: "Un tatuaje legible solo se acepta si se hizo antes del 3 de julio de 2011.", pt: "Uma tatuagem legível só é aceita se tiver sido feita antes de 3 de julho de 2011." }
    ref: { en: "EU Reg. 576/2013; ruokavirasto.fi", fr: "Règl. UE 576/2013 ; ruokavirasto.fi", es: "Regl. UE 576/2013; ruokavirasto.fi", pt: "Regulamento UE 576/2013; ruokavirasto.fi" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Dog at least 12 weeks old at the shot; valid from at least 21 days after the primary vaccination.", fr: "Chien d'au moins 12 semaines ; valide au moins 21 jours après la primo-vaccination.", es: "Perro de al menos 12 semanas en el momento de la vacuna; válida a partir de al menos 21 días de la primovacunación.", pt: "Cachorro com pelo menos 12 semanas na data da vacina; válida a partir de, no mínimo, 21 dias após a primovacinação." }
    exceptions: { en: "The microchip must already be in place; a booster within validity has no 21-day wait.", fr: "La puce doit déjà être posée ; un rappel dans la validité n'impose pas de délai de 21 jours.", es: "El microchip debe estar ya implantado; un refuerzo dentro de la valide no conlleva la espera de 21 días.", pt: "O microchip já deve estar implantado; um reforço aplicado dentro da validade não tem espera de 21 dias." }
    ref: { en: "EU Reg. 576/2013, Annex III; ruokavirasto.fi", fr: "Règl. UE 576/2013, annexe III ; ruokavirasto.fi", es: "Regl. UE 576/2013, anexo III; ruokavirasto.fi", pt: "Regulamento UE 576/2013, anexo III; ruokavirasto.fi" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Non-listed origins only: blood ≥30 days after vaccination, then a 3-month wait, result ≥0.5 IU/ml, EU-approved lab.", fr: "Pays non listés : sang ≥30 jours après le vaccin, puis délai de 3 mois, résultat ≥0,5 UI/ml, labo agréé UE.", es: "Solo orígenes no listados: sangre ≥30 días tras la vacuna, y luego una espera de 3 meses, resultado ≥0,5 UI/ml, laboratorio autorizado por la UE.", pt: "Apenas para origens não listadas: sangue coletado ≥30 dias após a vacinação, depois 3 meses de espera, resultado ≥0,5 UI/ml, em laboratório aprovado pela UE." }
    exceptions: { en: "Not required from the EU or from listed countries (US, Canada, UK, Switzerland, Japan, Australia…).", fr: "Non requis depuis l'UE ou les pays listés (USA, Canada, RU, Suisse, Japon, Australie…).", es: "No se exige desde la UE ni desde países listados (EE. UU., Canadá, RU, Suiza, Japón, Australia…).", pt: "Não exigido para quem vem da UE ou de países listados (EUA, Canadá, Reino Unido, Suíça, Japão, Austrália…)." }
    ref: { en: "EU Reg. 2020/692; ruokavirasto.fi", fr: "Règl. UE 2020/692 ; ruokavirasto.fi", es: "Regl. UE 2020/692; ruokavirasto.fi", pt: "Regulamento UE 2020/692; ruokavirasto.fi" }
  - item: { en: "EU pet passport", fr: "Passeport européen", es: "Pasaporte europeo para mascotas", pt: "Passaporte europeu para animais" }
    required: { en: "EU origins", fr: "Origines UE", es: "Orígenes de la UE", pt: "Origens na UE" }
    when: { en: "Issued by an EU vet; records the microchip, rabies vaccination and tapeworm treatment.", fr: "Délivré par un vétérinaire de l'UE ; consigne la puce, la vaccination et le traitement antiténia.", es: "Expedido por un veterinario de la UE; registra el microchip, la vacunación antirrábica y el tratamiento contra la tenia.", pt: "Emitido por um veterinário da UE; registra o microchip, a vacinação antirrábica e o tratamento contra a tênia." }
    exceptions: { en: "Replaced by an animal health certificate for non-EU origins.", fr: "Remplacé par un certificat sanitaire pour les origines hors UE.", es: "Se sustituye por un certificado sanitario para orígenes fuera de la UE.", pt: "Substituído por um certificado sanitário quando a origem é de fora da UE." }
    ref: { en: "EU Reg. 577/2013; ruokavirasto.fi", fr: "Règl. UE 577/2013 ; ruokavirasto.fi", es: "Regl. UE 577/2013; ruokavirasto.fi", pt: "Regulamento UE 577/2013; ruokavirasto.fi" }
  - item: { en: "EU animal health certificate", fr: "Certificat sanitaire UE", es: "Certificado sanitario animal de la UE", pt: "Certificado sanitário europeu" }
    required: { en: "Non-EU origins", fr: "Origines hors UE", es: "Orígenes fuera de la UE", pt: "Origens fora da UE" }
    when: { en: "Issued/endorsed by an official vet before departure; valid 10 days to entry. The tapeworm treatment is recorded on it.", fr: "Établi/visé par un vétérinaire officiel avant départ ; valable 10 jours jusqu'à l'entrée. Le traitement antiténia y est consigné.", es: "Expedido/refrendado por un veterinario oficial antes de la salida; válido 10 días hasta la entrada. El tratamiento contra la tenia se registra en él.", pt: "Emitido/endossado por um veterinário oficial antes da partida; válido por 10 dias até a entrada. O tratamento contra a tênia é registrado nele." }
    exceptions: { en: "Not needed for EU origins (passport instead).", fr: "Inutile pour les origines UE (passeport à la place).", es: "No necesario para orígenes de la UE (en su lugar, el pasaporte).", pt: "Não é necessário para origens na UE (usa-se o passaporte)." }
    ref: { en: "EU Reg. 577/2013, Annex IV; ruokavirasto.fi", fr: "Règl. UE 577/2013, annexe IV ; ruokavirasto.fi", es: "Regl. UE 577/2013, anexo IV; ruokavirasto.fi", pt: "Regulamento UE 577/2013, anexo IV; ruokavirasto.fi" }
  - item: { en: "Tapeworm (Echinococcus) treatment", fr: "Traitement échinococcose (ténia)", es: "Tratamiento contra la tenia (Echinococcus)", pt: "Tratamento contra a tênia (Echinococcus)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Dogs only: praziquantel by a vet 24–120 hours (1–5 days) before arrival in Finland, recorded in the passport/certificate.", fr: "Chiens uniquement : praziquantel par un vétérinaire 24 à 120 h (1 à 5 jours) avant l'arrivée en Finlande, consigné au passeport/certificat.", es: "Solo perros: praziquantel administrado por un veterinario 24–120 horas (1–5 días) antes de la llegada a Finlandia, registrado en el pasaporte/certificado.", pt: "Apenas para cachorros: praziquantel aplicado por um veterinário 24–120 horas (1 a 5 dias) antes da chegada à Finlândia, registrado no passaporte/certificado." }
    exceptions: { en: "Waived for dogs arriving directly from Ireland, Malta, Norway or Northern Ireland. An EU/Norway 28-day repeat-treatment scheme is an alternative.", fr: "Levé pour les chiens arrivant directement d'Irlande, de Malte, de Norvège ou d'Irlande du Nord. Un schéma de traitement répété à 28 jours (UE/Norvège) est une alternative.", es: "Se exime para los perros que llegan directamente de Irlanda, Malta, Noruega o Irlanda del Norte. Un esquema de tratamiento repetido cada 28 días (UE/Noruega) es una alternativa.", pt: "Dispensado para cachorros que chegam diretamente da Irlanda, de Malta, da Noruega ou da Irlanda do Norte. Um esquema de tratamento repetido a cada 28 dias (UE/Noruega) é uma alternativa." }
    ref: { en: "EU Reg. 2018/772; ruokavirasto.fi", fr: "Règl. UE 2018/772 ; ruokavirasto.fi", es: "Regl. UE 2018/772; ruokavirasto.fi", pt: "Regulamento UE 2018/772; ruokavirasto.fi" }
  - item: { en: "Advance notification / import permit", fr: "Notification préalable / permis d'import", es: "Notificación previa / permiso de importación", pt: "Notificação prévia / autorização de importação" }
    required: { en: "Not required", fr: "Non requis", es: "No obligatorio", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Finland issues no import permit and requires no prior appointment for non-commercial movement.", fr: "La Finlande ne délivre aucun permis d'import et n'exige aucun rendez-vous préalable pour un mouvement non commercial.", es: "Finlandia no expide permiso de importación ni exige cita previa para un movimiento no comercial.", pt: "A Finlândia não emite autorização de importação nem exige agendamento prévio para a circulação não comercial." }
    ref: { en: "ruokavirasto.fi; tulli.fi", fr: "ruokavirasto.fi ; tulli.fi", es: "ruokavirasto.fi; tulli.fi", pt: "ruokavirasto.fi; tulli.fi" }
  - item: { en: "Border check (documents & identity)", fr: "Contrôle frontalier (documents & identité)", es: "Control fronterizo (documentos e identidad)", pt: "Controle de fronteira (documentos e identidade)" }
    required: { en: "Non-EU arrivals", fr: "Arrivées hors UE", es: "Llegadas de fuera de la UE", pt: "Chegadas de fora da UE" }
