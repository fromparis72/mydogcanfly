    exceptions: { en: "No systematic check for intra-EU arrivals — keep the EU pet passport with you.", fr: "Pas de contrôle systématique pour les arrivées intra-UE — garde le passeport européen sur toi.", es: "Sin control sistemático para las llegadas intracomunitarias — lleva contigo el pasaporte europeo.", pt: "Sem controle sistemático para as chegadas de dentro da UE — leve o passaporte europeu com você." }
