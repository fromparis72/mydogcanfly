origin:
  scheme: eu
  eu:
    title: { en: "Simplified — EU pet passport + tapeworm", fr: "Simplifié — passeport européen + antiténia", es: "Simplificado — pasaporte europeo + tenia", pt: "Simplificado — passaporte europeu + tênia" }
    body:
      en: "A dog from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test and no health certificate — but a vet must still treat the dog against the Echinococcus tapeworm 24–120 hours before arrival and record it (unless arriving directly from Ireland, Malta, Norway or Northern Ireland)."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage ni de certificat sanitaire — mais un vétérinaire doit traiter le chien contre le ténia Echinococcus 24 à 120 h avant l'arrivée et l'inscrire (sauf arrivée directe d'Irlande, Malte, Norvège ou Irlande du Nord)."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación ni certificado sanitario — pero un veterinario debe además tratar al perro contra la tenia Echinococcus 24–120 h antes de la llegada y registrarlo (salvo que llegue directamente de Irlanda, Malta, Noruega o Irlanda del Norte)."
      pt: "Um cachorro vindo de outro país da UE precisa de um passaporte europeu para animais que comprove um microchip ISO válido e uma vacinação antirrábica em dia. Sem teste sorológico e sem certificado sanitário — mas um veterinário ainda precisa tratar o cachorro contra a tênia Echinococcus 24–120 horas antes da chegada e registrar o tratamento (a não ser que a chegada seja direta da Irlanda, de Malta, da Noruega ou da Irlanda do Norte)."
    cls: warn
  listed:
    title: { en: "Health certificate + tapeworm, no blood test", fr: "Certificat sanitaire + antiténia, sans prise de sang", es: "Certificado sanitario + tenia, sin análisis de sangre", pt: "Certificado sanitário + tênia, sem exame de sangue" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Switzerland, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination, an EU animal health certificate endorsed by an official vet, and the tapeworm treatment 24–120 hours before arrival. No antibody test; enter through Helsinki-Vantaa airport or another permitted point and take the red Customs channel."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Suisse, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide, d'un certificat sanitaire européen visé par un vétérinaire officiel, et du traitement antiténia 24 à 120 h avant l'arrivée. Pas de titrage ; entre par l'aéroport d'Helsinki-Vantaa ou un autre point autorisé et emprunte le canal rouge de la douane."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Suiza, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida, un certificado sanitario animal de la UE refrendado por un veterinario oficial, y el tratamiento contra la tenia 24–120 h antes de la llegada. No se exige prueba de titulación; entra por el aeropuerto de Helsinki-Vantaa u otro punto autorizado y toma el canal rojo de Aduanas."
      pt: "Vindo de um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Suíça, Japão, Austrália e outros), seu cachorro precisa de microchip, vacinação antirrábica válida, certificado sanitário europeu endossado por um veterinário oficial e do tratamento contra a tênia 24–120 horas antes da chegada. Não é exigido teste sorológico; entre pelo aeroporto de Helsinki-Vantaa ou por outro ponto autorizado e siga pelo canal vermelho da alfândega."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait + tapeworm", fr: "Titrage + 3 mois d'attente + antiténia", es: "Prueba de titulación + espera de 3 meses + tenia", pt: "Teste sorológico + 3 meses de espera + tênia" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-approved laboratory, then a compulsory 3-month wait before entry. An endorsed EU animal health certificate and the tapeworm treatment 24–120 hours before arrival are also required."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen visé et le traitement antiténia 24 à 120 h avant l'arrivée sont également requis."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exigen un certificado sanitario animal de la UE refrendado y el tratamiento contra la tenia 24–120 h antes de la llegada."
      pt: "Vindo de um país não listado (de risco), acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório aprovado pela UE, e depois 3 meses obrigatórios de espera antes da entrada. Também são exigidos um certificado sanitário europeu endossado e o tratamento contra a tênia 24–120 horas antes da chegada."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Finland depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien en Finlande dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Finlandia depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega à Finlândia depende de onde você embarcou."
  points:
    - from: eu
      en: "From another EU country: no systematic border check — keep the EU pet passport with you, including the tapeworm-treatment entry."
      fr: "Depuis un autre pays de l'UE : pas de contrôle systématique — garde le passeport européen sur toi, avec la mention du traitement antiténia."
      es: "Desde otro país de la UE: sin control fronterizo sistemático — lleva contigo el pasaporte europeo, con el registro del tratamiento contra la tenia."
      pt: "De outro país da UE: sem controle de fronteira sistemático — leve o passaporte europeu com você, com o registro do tratamento contra a tênia."
    - from: non_eu
      en: "From outside the EU: enter through a permitted point (Helsinki-Vantaa airport, or listed land/sea crossings), take the red channel and present the dog and its documents to Finnish Customs (Tulli)."
      fr: "Depuis hors UE : entre par un point autorisé (aéroport d'Helsinki-Vantaa, ou postes terrestres/maritimes listés), emprunte le canal rouge et présente le chien et ses documents à la douane finlandaise (Tulli)."
      es: "Desde fuera de la UE: entra por un punto autorizado (aeropuerto de Helsinki-Vantaa o pasos terrestres/marítimos listados), toma el canal rojo y presenta al perro y sus documentos ante Aduanas de Finlandia (Tulli)."
      pt: "De fora da UE: entre por um ponto autorizado (aeroporto de Helsinki-Vantaa ou passagens terrestres/marítimas listadas), siga pelo canal vermelho e apresente o cachorro e os documentos dele à alfândega finlandesa (Tulli)."
    - en: "No import permit is issued and no prior appointment with Customs is needed for non-commercial movement."
      fr: "Aucun permis d'import n'est délivré et aucun rendez-vous préalable avec la douane n'est nécessaire pour un mouvement non commercial."
      es: "No se expide ningún permiso de importación ni se necesita cita previa con Aduanas para un movimiento no comercial."
      pt: "Não é emitida nenhuma autorização de importação e não é preciso agendamento prévio com a alfândega para a circulação não comercial."
    - en: "Carry original documents (not copies): passport or endorsed health certificate, and — where required — the rabies antibody-test certificate."
      fr: "Munis-toi des documents originaux (pas de copies) : passeport ou certificat sanitaire visé, et — si requis — le certificat de titrage antirabique."
      es: "Lleva los documentos originales (no copias): pasaporte o certificado sanitario refrendado y — cuando se exija — el certificado de la prueba de titulación de rabia."
      pt: "Leve os documentos originais (não cópias): passaporte ou certificado sanitário endossado e — quando exigido — o certificado do teste sorológico antirrábico."
    - en: "The tapeworm treatment must already be recorded before you arrive — it cannot be given at the border."
      fr: "Le traitement antiténia doit déjà être consigné avant l'arrivée — il ne peut être administré à la frontière."
      es: "El tratamiento contra la tenia debe estar ya registrado antes de tu llegada — no puede administrarse en la frontera."
      pt: "O tratamento contra a tênia já precisa estar registrado antes da sua chegada — ele não pode ser aplicado na fronteira."
    - en: "If documents are missing or invalid, Customs may order re-export or other measures at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, la douane peut ordonner réexpédition ou d'autres mesures aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, Aduanas puede ordenar la reexpedición u otras medidas a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, a alfândega pode determinar a reexportação ou outras medidas às custas do dono."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Finland has no breed-specific ban: all dog breeds may be imported and no breed is prohibited or categorised as dangerous in national law. Finland relies on an owner-responsibility model under the Animal Welfare Act (693/2023) rather than breed lists."
    fr: "La Finlande n'a aucune interdiction visant une race : toutes les races de chiens peuvent être importées et aucune race n'est interdite ou classée dangereuse par la loi nationale. La Finlande s'appuie sur un modèle de responsabilité du propriétaire selon la loi sur le bien-être animal (693/2023), plutôt que sur des listes de races."
    es: "Finlandia no tiene ninguna prohibición por raza: todas las razas de perros pueden importarse y ninguna raza está prohibida ni clasificada como peligrosa en la ley nacional. Finlandia se basa en un modelo de responsabilidad del propietario en virtud de la Ley de Bienestar Animal (693/2023), en lugar de listas de razas."
    pt: "A Finlândia não tem proibição por raça: todas as raças de cachorro podem ser importadas e nenhuma raça é proibida ou classificada como perigosa na legislação nacional. Em vez de listas de raças, a Finlândia adota um modelo de responsabilidade do dono, previsto na Lei de bem-estar animal (Eläinten hyvinvointilaki, 693/2023)."
  cat1:
    en: "No banned category exists. Unlike some EU states, Finland maintains no national list of prohibited or 'dangerous' breeds, and the Finnish Kennel Club has publicly opposed breed bans as a welfare tool."
    fr: "Aucune catégorie interdite n'existe. Contrairement à certains États de l'UE, la Finlande ne tient aucune liste nationale de races interdites ou « dangereuses », et le Kennel Club finlandais s'est publiquement opposé aux interdictions de races comme outil de bien-être."
    es: "No existe ninguna categoría prohibida. A diferencia de algunos Estados de la UE, Finlandia no mantiene ninguna lista nacional de razas prohibidas o 'peligrosas', y el Kennel Club finlandés se ha opuesto públicamente a las prohibiciones por raza como herramienta de bienestar."
    pt: "Não existe categoria proibida. Diferentemente de alguns países da UE, a Finlândia não mantém nenhuma lista nacional de raças proibidas ou “perigosas”, e o Finnish Kennel Club já se posicionou publicamente contra as proibições por raça como instrumento de bem-estar animal."
  cat2:
    en: "The only breeding-related import limit concerns wolf-dog hybrids and wild-crossed animals, which are not treated as ordinary pet dogs. Individual municipalities may set local public-order rules (e.g. leashing)."
    fr: "La seule limite d'importation liée à l'élevage concerne les hybrides chien-loup et les animaux croisés avec des espèces sauvages, qui ne sont pas traités comme des chiens de compagnie ordinaires. Les municipalités peuvent fixer des règles locales d'ordre public (p. ex. tenue en laisse)."
    es: "El único límite de importación relacionado con la cría concierne a los híbridos de lobo y perro y a los animales cruzados con especies silvestres, que no se tratan como perros de compañía ordinarios. Los municipios pueden fijar normas locales de orden público (p. ej. llevar con correa)."
    pt: "O único limite de importação ligado à criação diz respeito aos híbridos de lobo com cachorro e aos animais cruzados com espécies selvagens, que não são tratados como cachorros de estimação comuns. Cada município pode estabelecer regras locais de ordem pública (por exemplo, o uso de guia)."
  note:
    en: "The owner is legally responsible for keeping any dog safely and humanely. Confirm any local municipal rules for your destination in Finland."
    fr: "Le propriétaire est légalement responsable de détenir tout chien de manière sûre et respectueuse. Vérifie les éventuelles règles municipales locales de ta destination en Finlande."
    es: "El propietario es legalmente responsable de tener a cualquier perro de forma segura y humanitaria. Confirma las posibles normas municipales locales de tu destino en Finlandia."
    pt: "O dono é legalmente responsável por manter qualquer cachorro em segurança e com bem-estar. Confirme as regras municipais locais do seu destino na Finlândia."

