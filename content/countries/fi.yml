# Country Entry Guide — Finland (source of truth, bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_fi
iso2: "FI"
name: { en: "Finland", fr: "Finlande", es: "Finlandia", pt: "Finlândia" }
region: { en: "Europe (EU)", fr: "Europe (UE)", es: "Europa (UE)", pt: "Europa (UE)" }


regime: eu

hero:
  h1: { en: "Traveling to Finland with your dog", fr: "Voyager en Finlande avec ton chien", es: "Viajar a Finlandia con tu perro", pt: "Viajar para a Finlândia com seu cachorro" }
  intro:
    en: >-
      Finland welcomes dogs, but what you need to prepare depends mainly on the country your dog is
      travelling from — not only on Finland itself. As an EU member, Finland applies the EU pet-movement
      rules: an ISO microchip and a valid rabies vaccination are always required. A dog from another EU
      country needs an EU pet passport; a dog from a listed non-EU country needs an EU animal health
      certificate but no blood test; a dog from a non-listed country also needs a rabies antibody test
      and a three-month wait. Finland adds one national rule the rest of the EU usually does not: almost
      every dog must be treated against the Echinococcus tapeworm by a vet 24–120 hours before arrival.
      This guide explains each case so you know exactly what to prepare before you book your flight.
    fr: >-
      La Finlande accueille les chiens, mais ce qu'il faut préparer dépend surtout du pays d'où ton
      chien voyage — pas seulement de la Finlande. En tant qu'État membre de l'UE, la Finlande applique
      les règles européennes : une puce ISO et une vaccination antirabique valide sont toujours exigées.
      Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen ; un chien d'un pays tiers
      listé a besoin d'un certificat sanitaire européen mais pas de prise de sang ; un chien d'un pays
      non listé doit aussi passer un titrage antirabique et respecter un délai de trois mois. La Finlande
      ajoute une règle nationale que le reste de l'UE n'impose généralement pas : presque tout chien doit
      être traité contre le ténia Echinococcus par un vétérinaire 24 à 120 heures avant l'arrivée. Ce
      guide détaille chaque cas pour savoir quoi préparer avant de réserver ton vol.
    es: >-
      Finlandia acoge a los perros, pero lo que debes preparar depende sobre todo del país desde el que
      viaja tu perro — no solo de Finlandia. Como Estado miembro de la UE, Finlandia aplica las normas
      europeas de movimiento de animales de compañía: siempre se exigen un microchip ISO y una
      vacunación antirrábica válida. Un perro que llega de otro país de la UE necesita un pasaporte
      europeo para mascotas; un perro de un país tercero listado necesita un certificado sanitario animal
      de la UE, pero no un análisis de sangre; un perro de un país no listado necesita además una prueba
      de titulación de rabia y una espera de tres meses. Finlandia añade una norma nacional que el resto
      de la UE no suele imponer: casi todo perro debe recibir de un veterinario un tratamiento contra la
      tenia Echinococcus 24–120 horas antes de la llegada. Esta guía explica cada caso para que sepas
      exactamente qué preparar antes de reservar tu vuelo.

    pt: "A Finlândia recebe bem os cachorros, mas o que você precisa preparar depende principalmente do país de onde seu cachorro parte — e não só da Finlândia em si. Como membro da União Europeia, a Finlândia aplica as regras europeias de circulação de animais de estimação: microchip ISO e vacinação antirrábica válida são sempre obrigatórios. Um cachorro vindo de outro país da UE precisa do passaporte europeu para animais; um cachorro vindo de um país listado fora da UE precisa de um certificado sanitário europeu, mas não de exame de sangue; um cachorro vindo de um país não listado precisa também do teste sorológico antirrábico e de três meses de espera. A Finlândia acrescenta uma regra nacional que o resto da UE normalmente não tem: quase todo cachorro precisa ser tratado contra a tênia Echinococcus por um veterinário 24–120 horas antes da chegada. Este guia explica cada caso para você saber exatamente o que preparar antes de comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Easy to difficult (depends on origin)", fr: "Facile à difficile (selon l'origine)", es: "De fácil a difícil (según el origen)", pt: "De fácil a difícil (depende da origem)" }

prepTime:
  eu:
    en: "A few days if the passport is up to date — plus a vet visit for the tapeworm treatment 24–120 hours before arrival."
    fr: "Quelques jours si le passeport est à jour — plus une visite vétérinaire pour le traitement antiténia 24 à 120 h avant l'arrivée."
    es: "Unos días si el pasaporte está al día — más una visita al veterinario para el tratamiento contra la tenia 24–120 h antes de la llegada."
    pt: "Alguns dias se o passaporte estiver em dia — mais uma consulta veterinária para o tratamento contra a tênia 24–120 horas antes da chegada."
  listed:
    en: "~3–4 weeks: 21-day wait after the rabies shot, a health certificate valid 10 days, and the tapeworm treatment 24–120 hours before arrival."
    fr: "~3–4 semaines : délai de 21 jours après le vaccin, certificat sanitaire valable 10 jours, et traitement antiténia 24 à 120 h avant l'arrivée."
    es: "~3–4 semanas: espera de 21 días tras la vacuna antirrábica, un certificado sanitario válido 10 días, y el tratamiento contra la tenia 24–120 h antes de la llegada."
    pt: "Cerca de 3 a 4 semanas: 21 dias de espera depois da vacina antirrábica, um certificado sanitário válido por 10 dias e o tratamento contra a tênia 24–120 horas antes da chegada."
  nonListed:
    en: "~4–7 months: antibody test at least 30 days after vaccination, a compulsory 3-month wait, then the tapeworm treatment 24–120 hours before arrival."
    fr: "~4–7 mois : titrage au moins 30 jours après le vaccin, délai obligatoire de 3 mois, puis traitement antiténia 24 à 120 h avant l'arrivée."
    es: "~4–7 meses: prueba de titulación al menos 30 días después de la vacuna, una espera obligatoria de 3 meses, y luego el tratamiento contra la tenia 24–120 h antes de la llegada."
    pt: "Cerca de 4 a 7 meses: teste sorológico no mínimo 30 dias depois da vacinação, 3 meses obrigatórios de espera e, então, o tratamento contra a tênia 24–120 horas antes da chegada."

