# Country Entry Guide — Uganda (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_ug
iso2: "UG"
name: { en: "Uganda", fr: "Ouganda", es: "Uganda", pt: "Uganda" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
exit:
  authority: MAAIF
  authorityUrl: https://www.agriculture.go.ug/dogs-and-cats/
  intro:
    en: "Uganda is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Commissioner for Animal Health (MAAIF)."
    fr: "L'Ouganda est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par le Commissaire à la santé animale (MAAIF)."
    es: "Uganda no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el Comisionado de Sanidad Animal (MAAIF)."
    pt: "Uganda não é um país listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para retornar à UE — além de um certificado veterinário de exportação endossado pelo Commissioner for Animal Health (MAAIF)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico (titulação): exame de sangue em um laboratório aprovado pela UE, pelo menos 30 dias após a vacinação — um resultado válido é essencial para retornar à UE e não pode ser resolvido de última hora."
    - timing: window
      scope: any
      text:
        en: "The Commissioner for Animal Health (MAAIF) issues the official veterinary health certificate after application and inspection."
        fr: "Le Commissaire à la santé animale (MAAIF) délivre le certificat sanitaire vétérinaire officiel après demande et inspection."
        es: "El Comisionado de Sanidad Animal (MAAIF) emite el certificado sanitario veterinario oficial tras la solicitud y la inspección."
        pt: "O Commissioner for Animal Health (MAAIF) emite o certificado veterinário oficial após o pedido e a inspeção."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico (titulação) da UE válido antes de sair, ele continua válido por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Uganda with your dog", fr: "Voyager en Ouganda avec ton chien", es: "Viajar a Uganda con tu perro", pt: "Viajar para Uganda com seu cachorro" }
  intro:
    en: >-
      Uganda welcomes pet dogs, but entry is controlled by its own veterinary authority — the
      Directorate of Animal Resources (Department of Animal Health) within the Ministry of
      Agriculture, Animal Industry and Fisheries (MAAIF) — under the Animal Diseases Act (Cap. 38).
      No dog may arrive without an import permit obtained in advance from the Commissioner for Animal
      Health (CAH); the application must be submitted at least 7 days before importation and the
      permit itself sets the exact animal-health requirements and the authorised port of entry. Every
      dog must travel with an official Veterinary Health Certificate issued by the veterinary
      authority of the country of origin, and a valid rabies vaccination certificate — Uganda is a
      rabies-endemic country. On arrival the dog is inspected by a veterinary officer, and MAAIF's
      published import procedure provides for a post-import quarantine of 21–30 days. Uganda is not an
      EU country and does not recognise the EU pet passport as an entry document. This guide explains
      each step before you book your flight.
    fr: >-
      L'Ouganda accueille les chiens de compagnie, mais l'entrée est contrôlée par sa propre autorité
      vétérinaire — la Directorate of Animal Resources (Department of Animal Health) au sein du
      ministère de l'Agriculture, de l'Industrie animale et de la Pêche (MAAIF) — au titre de
      l'Animal Diseases Act (Cap. 38). Aucun chien ne peut arriver sans un permis d'importation obtenu
      à l'avance auprès du Commissioner for Animal Health (CAH) ; la demande doit être déposée au moins
      7 jours avant l'importation et le permis lui-même fixe les exigences sanitaires exactes et le
      point d'entrée autorisé. Chaque chien doit voyager avec un certificat vétérinaire officiel
      délivré par l'autorité vétérinaire du pays d'origine et un certificat de vaccination antirabique
      valide — l'Ouganda est un pays d'enzootie rabique. À l'arrivée, le chien est inspecté par un
      agent vétérinaire, et la procédure d'importation publiée par le MAAIF prévoit une quarantaine
      post-importation de 21 à 30 jours. L'Ouganda n'est pas un pays de l'UE et ne reconnaît pas le
      passeport européen comme document d'entrée. Ce guide détaille chaque étape avant de réserver
      ton vol.
    es: >-
      Uganda acoge a los perros de compañía, pero la entrada está controlada por su propia autoridad
      veterinaria — la Directorate of Animal Resources (Department of Animal Health), dentro del
      Ministry of Agriculture, Animal Industry and Fisheries (MAAIF) — al amparo del Animal Diseases
      Act (Cap. 38). Ningún perro puede llegar sin un permiso de importación obtenido con antelación
      del Commissioner for Animal Health (CAH); la solicitud debe presentarse al menos 7 días antes de
      la importación y el propio permiso fija los requisitos sanitarios exactos y el punto de entrada
      autorizado. Todo perro debe viajar con un certificado sanitario veterinario oficial expedido por
      la autoridad veterinaria del país de origen y un certificado de vacunación antirrábica válido —
      Uganda es un país con rabia endémica. A la llegada, el perro es inspeccionado por un agente
      veterinario, y el procedimiento de importación publicado por el MAAIF prevé una cuarentena
      posterior a la importación de 21 a 30 días. Uganda no es un país de la UE y no reconoce el
      pasaporte europeo para mascotas como documento de entrada. Esta guía explica cada paso antes de
      que reserves tu vuelo.

    pt: "Uganda recebe bem os cachorros de estimação, mas a entrada é controlada pela sua própria autoridade veterinária — a Directorate of Animal Resources (Department of Animal Health), dentro do Ministry of Agriculture, Animal Industry and Fisheries (MAAIF) — segundo o Animal Diseases Act (Cap. 38). Nenhum cachorro pode chegar sem uma autorização de importação obtida com antecedência junto ao Commissioner for Animal Health (CAH); o pedido precisa ser enviado com pelo menos 7 dias de antecedência da importação, e a própria autorização define as exigências sanitárias exatas e o porto de entrada autorizado. Todo cachorro precisa viajar com um certificado veterinário oficial emitido pela autoridade veterinária do país de origem, e um certificado de vacinação antirrábica válido — Uganda é um país com raiva endêmica. Na chegada, o cachorro é inspecionado por um agente veterinário, e o procedimento de importação publicado pelo MAAIF prevê uma quarentena pós-importação de 21 a 30 dias. Uganda não é um país da UE e não reconhece o passaporte europeu para animais de estimação como documento de entrada. Este guia explica cada etapa antes de você reservar o seu voo."
difficulty:
  level: difficult
  label: { en: "Difficult — advance import permit and a published 21–30 day post-import quarantine", fr: "Difficile — permis d'importation préalable et quarantaine post-importation publiée de 21 à 30 jours", es: "Difícil — permiso de importación previo y una cuarentena posterior a la importación publicada de 21 a 30 días", pt: "Difícil — exige autorização de importação prévia e uma quarentena pós-importação publicada de 21 a 30 dias" }

prepTime:
  eu:
    en: "From Europe: allow ~6–10 weeks — apply to the Commissioner for Animal Health for the import permit (at least 7 days ahead), a valid rabies vaccination, and an official veterinary health certificate before departure. Plan for a possible 21–30 day post-import quarantine."
    fr: "Depuis l'Europe : prévoir ~6 à 10 semaines — demander le permis d'importation au Commissioner for Animal Health (au moins 7 jours à l'avance), une vaccination antirabique valide et un certificat vétérinaire officiel avant le départ. Prévoir une éventuelle quarantaine post-importation de 21 à 30 jours."
    es: "Desde Europa: prevé ~6–10 semanas — solicita al Commissioner for Animal Health el permiso de importación (al menos 7 días antes), una vacunación antirrábica válida y un certificado sanitario veterinario oficial antes de la salida. Cuenta con una posible cuarentena posterior a la importación de 21 a 30 días."
    pt: "Da Europa: reserve cerca de 6 a 10 semanas — solicite ao Commissioner for Animal Health a autorização de importação (com pelo menos 7 dias de antecedência), uma vacinação antirrábica válida e um certificado veterinário oficial antes da partida. Planeje-se para uma possível quarentena pós-importação de 21 a 30 dias."
  listed:
    en: "From other non-EU countries: ~6–10 weeks — the same core steps (import permit from the CAH, rabies vaccination, official veterinary health certificate), with the certificate issued by your national veterinary authority."
    fr: "Depuis d'autres pays hors UE : ~6 à 10 semaines — mêmes étapes de base (permis du CAH, vaccination antirabique, certificat vétérinaire officiel), le certificat étant établi par ton autorité vétérinaire nationale."
    es: "Desde otros países fuera de la UE: ~6–10 semanas — los mismos pasos básicos (permiso de importación del CAH, vacunación antirrábica, certificado sanitario veterinario oficial), con el certificado expedido por tu autoridad veterinaria nacional."
    pt: "De outros países fora da UE: cerca de 6 a 10 semanas — as mesmas etapas básicas (autorização de importação do CAH, vacinação antirrábica, certificado veterinário oficial), com o certificado emitido pela sua autoridade veterinária nacional."
  nonListed:
    en: "From all origins: Uganda applies the same import-permit and certificate requirements; allow extra time because the permit sets the exact animal-health conditions and the published procedure includes a 21–30 day quarantine period."
    fr: "Depuis toute origine : l'Ouganda applique les mêmes exigences de permis et de certificat ; prévois une marge car le permis fixe les conditions sanitaires exactes et la procédure publiée inclut une quarantaine de 21 à 30 jours."
    es: "Desde cualquier origen: Uganda aplica los mismos requisitos de permiso de importación y certificado; deja tiempo extra porque el permiso fija las condiciones sanitarias exactas y el procedimiento publicado incluye un periodo de cuarentena de 21 a 30 días."
    pt: "De todas as origens: Uganda aplica as mesmas exigências de autorização de importação e certificado; reserve tempo extra porque a autorização define as condições sanitárias exatas e o procedimento publicado inclui um período de quarentena de 21 a 30 dias."

