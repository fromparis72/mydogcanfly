    es: "Lo que necesitas para traer un perro a Uganda: un permiso de importación previo del Commissioner for Animal Health, una vacunación antirrábica, un certificado sanitario veterinario oficial — y una cuarentena posterior a la importación publicada de 21 a 30 días."
