notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog, and the Commissioner for Animal Health sets the exact conditions (and port of entry) on your import permit."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien, et le Commissioner for Animal Health fixe les conditions exactes (et le point d'entrée) sur ton permis d'importation."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro, y el Commissioner for Animal Health fija las condiciones exactas (y el punto de entrada) en tu permiso de importación."
    pt: "Somente um médico-veterinário pode confirmar o procedimento exato para o seu cachorro, e o Commissioner for Animal Health define as condições exatas (e o porto de entrada) na sua autorização de importação."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Uganda (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — l'Ouganda (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Uganda (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — Uganda (seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Uganda", fr: "Pays de destination — Ouganda", es: "País de destino — Uganda", pt: "País de destino — Uganda" }
      text:
        en: "Uganda always requires an advance import permit from the Commissioner for Animal Health (applied for at least 7 days ahead), an official Veterinary Health Certificate from the origin-country authority and a valid rabies vaccination. The permit itself states the exact animal-health requirements and the authorised port of entry. Rules flow from the Animal Diseases Act (Cap. 38)."
        fr: "L'Ouganda exige toujours un permis d'importation préalable du Commissioner for Animal Health (demandé au moins 7 jours à l'avance), un certificat vétérinaire officiel de l'autorité du pays d'origine et une vaccination antirabique valide. Le permis lui-même indique les exigences sanitaires exactes et le point d'entrée autorisé. Les règles découlent de l'Animal Diseases Act (Cap. 38)."
        es: "Uganda siempre exige un permiso de importación previo del Commissioner for Animal Health (solicitado al menos 7 días antes), un certificado sanitario veterinario oficial de la autoridad del país de origen y una vacunación antirrábica válida. El propio permiso indica los requisitos sanitarios exactos y el punto de entrada autorizado. Las normas se derivan del Animal Diseases Act (Cap. 38)."
        pt: "Uganda sempre exige uma autorização de importação prévia do Commissioner for Animal Health (solicitada com pelo menos 7 dias de antecedência), um certificado veterinário oficial da autoridade do país de origem e uma vacinação antirrábica válida. A própria autorização indica as exigências sanitárias exatas e o porto de entrada autorizado. As regras decorrem do Animal Diseases Act (Cap. 38)."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Your departure country decides which veterinary authority issues and endorses the health certificate — for example an EU official veterinarian, or a USDA-accredited vet with APHIS endorsement from the United States. Uganda's published procedure does not set easier or harder tiers by origin; the Commissioner for Animal Health also assesses the disease status of the country of origin when issuing the permit."
        fr: "Ton pays de départ détermine quelle autorité vétérinaire établit et vise le certificat sanitaire — par exemple un vétérinaire officiel de l'UE, ou un vétérinaire agréé USDA avec visa APHIS depuis les États-Unis. La procédure publiée de l'Ouganda n'établit pas de niveaux plus ou moins stricts selon l'origine ; le Commissioner for Animal Health évalue aussi le statut sanitaire du pays d'origine lors de la délivrance du permis."
        es: "Tu país de salida decide qué autoridad veterinaria expide y refrenda el certificado sanitario — por ejemplo un veterinario oficial de la UE, o un veterinario acreditado por el USDA con refrendo de APHIS desde Estados Unidos. El procedimiento publicado de Uganda no establece niveles más o menos estrictos según el origen; el Commissioner for Animal Health también evalúa el estatus sanitario del país de origen al expedir el permiso."
        pt: "O seu país de partida determina qual autoridade veterinária emite e endossa o certificado veterinário — por exemplo, um veterinário oficial da UE, ou um veterinário credenciado pelo USDA com endosso do APHIS, no caso dos Estados Unidos. O procedimento publicado de Uganda não estabelece níveis mais fáceis ou mais difíceis por origem; o Commissioner for Animal Health também avalia o status sanitário do país de origem ao emitir a autorização."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "The Commissioner for Animal Health searches the animal-disease status of the country of origin before setting the permit conditions, so your dog's real origin and recent movements matter. Confirm your dog's history with your vet before you finalise the permit application."
        fr: "Le Commissioner for Animal Health examine le statut des maladies animales du pays d'origine avant de fixer les conditions du permis ; l'origine réelle et les déplacements récents de ton chien comptent donc. Confirme l'historique de ton chien avec ton vétérinaire avant de finaliser la demande de permis."
        es: "El Commissioner for Animal Health examina el estatus de las enfermedades animales del país de origen antes de fijar las condiciones del permiso, por lo que el origen real y los desplazamientos recientes de tu perro importan. Confirma el historial de tu perro con tu veterinario antes de finalizar la solicitud del permiso."
        pt: "O Commissioner for Animal Health pesquisa o status de doenças animais do país de origem antes de definir as condições da autorização, então a origem real e os deslocamentos recentes do seu cachorro importam. Confirme o histórico do seu cachorro com o seu veterinário antes de finalizar o pedido de autorização."
  note:
    en: "So read the requirements below as Uganda's framework, then confirm your dog's exact origin and history with your vet — the import permit lists the precise conditions."
    fr: "Lis donc les exigences ci-dessous comme le cadre ougandais, puis confirme l'origine et l'historique exacts avec ton vétérinaire — le permis d'importation liste les conditions précises."
    es: "Así que lee los requisitos siguientes como el marco de Uganda y luego confirma el origen y el historial exactos de tu perro con tu veterinario — el permiso de importación detalla las condiciones precisas."
    pt: "Portanto, leia as exigências abaixo como o marco de Uganda e, depois, confirme a origem exata e o histórico do seu cachorro com o seu veterinário — a autorização de importação lista as condições precisas."

requirements:
  - item: { en: "Import permit", fr: "Permis d'importation", es: "Permiso de importación", pt: "Autorização de importação" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Obtained in advance from the Commissioner for Animal Health (CAH) before the dog is imported. The importer submits a written application at least 7 days before importation, stating the source country and supplier, and the type of animal, breed, sex and quantity. The CAH assesses the disease status of the country of origin and issues a permit stating the animal-health requirements and the port of entry to be used.", fr: "À obtenir à l'avance auprès du Commissioner for Animal Health (CAH) avant l'importation du chien. L'importateur dépose une demande écrite au moins 7 jours avant l'importation, en indiquant le pays source et le fournisseur, ainsi que le type d'animal, la race, le sexe et la quantité. Le CAH évalue le statut sanitaire du pays d'origine et délivre un permis indiquant les exigences sanitaires et le point d'entrée à utiliser.", es: "Se obtiene con antelación del Commissioner for Animal Health (CAH) antes de que el perro sea importado. El importador presenta una solicitud por escrito al menos 7 días antes de la importación, indicando el país de origen y el proveedor, así como el tipo de animal, la raza, el sexo y la cantidad. El CAH evalúa el estatus sanitario del país de origen y expide un permiso que indica los requisitos sanitarios y el punto de entrada que debe utilizarse.", pt: "Obtida com antecedência junto ao Commissioner for Animal Health (CAH) antes de o cachorro ser importado. O importador envia um pedido por escrito com pelo menos 7 dias de antecedência da importação, indicando o país de origem e o fornecedor, e o tipo de animal, raça, sexo e quantidade. O CAH avalia o status sanitário do país de origem e emite uma autorização indicando as exigências sanitárias e o porto de entrada a ser usado." }
    exceptions: { en: "No exceptions — any person wishing to import live animals into Uganda must apply for an import permit from the Commissioner for Animal Health prior to importation. The permit may be refused if the disease risk is deemed unmanageable.", fr: "Aucune exception — toute personne souhaitant importer des animaux vivants en Ouganda doit demander un permis d'importation au Commissioner for Animal Health avant l'importation. Le permis peut être refusé si le risque de maladie est jugé ingérable.", es: "Sin excepciones — toda persona que desee importar animales vivos a Uganda debe solicitar un permiso de importación al Commissioner for Animal Health antes de la importación. El permiso puede denegarse si el riesgo de enfermedad se considera inmanejable.", pt: "Sem exceções — qualquer pessoa que deseje importar animais vivos para Uganda precisa solicitar uma autorização de importação ao Commissioner for Animal Health antes da importação. A autorização pode ser recusada se o risco de doença for considerado incontrolável." }
    ref: { en: "MAAIF — Import, Export and Transit of Animals and Animal Products (Pre-import Procedure); Animal Diseases Act (Cap. 38)", fr: "MAAIF — Import, export et transit des animaux et produits animaux (procédure de pré-importation) ; Animal Diseases Act (Cap. 38)", es: "MAAIF — Importación, exportación y tránsito de animales y productos animales (procedimiento previo a la importación); Animal Diseases Act (Cap. 38)", pt: "MAAIF — Import, Export and Transit of Animals and Animal Products (procedimento pré-importação); Animal Diseases Act (Cap. 38)" }
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Not published (recommended)", fr: "Non publié (recommandée)", es: "No publicado (recomendado)", pt: "Não publicado (recomendado)" }
    when: { en: "MAAIF's published import procedure for dogs does not list a microchip as a mandatory entry condition. An ISO 11784/11785 15-digit microchip is nonetheless recommended for identification, ideally implanted before the rabies vaccination so the records match. Confirm the exact identification requirement on your permit.", fr: "La procédure d'importation publiée du MAAIF pour les chiens ne mentionne pas la puce comme condition d'entrée obligatoire. Une puce ISO 11784/11785 à 15 chiffres est néanmoins recommandée pour l'identification, idéalement posée avant la vaccination antirabique pour que les documents concordent. Confirme l'exigence exacte d'identification sur ton permis.", es: "El procedimiento de importación publicado del MAAIF para perros no incluye el microchip como condición de entrada obligatoria. No obstante, se recomienda un microchip ISO 11784/11785 de 15 dígitos para la identificación, idealmente implantado antes de la vacunación antirrábica para que los registros coincidan. Confirma el requisito exacto de identificación en tu permiso.", pt: "O procedimento de importação publicado pelo MAAIF para cachorros não lista o microchip como condição de entrada obrigatória. Ainda assim, um microchip ISO 11784/11785 de 15 dígitos é recomendado para identificação, idealmente implantado antes da vacinação antirrábica para que os registros coincidam. Confirme a exigência exata de identificação na sua autorização." }
    exceptions: { en: "Because identification is not published as mandatory, treat it as strongly recommended and verify with the Commissioner for Animal Health.", fr: "L'identification n'étant pas publiée comme obligatoire, considère-la comme fortement recommandée et vérifie auprès du Commissioner for Animal Health.", es: "Como la identificación no está publicada como obligatoria, considérala muy recomendable y verifícalo con el Commissioner for Animal Health.", pt: "Como a identificação não é publicada como obrigatória, trate-a como fortemente recomendada e verifique com o Commissioner for Animal Health." }
    ref: { en: "MAAIF import conditions (microchip not listed as mandatory)", fr: "Conditions d'importation du MAAIF (puce non listée comme obligatoire)", es: "Condiciones de importación del MAAIF (microchip no listado como obligatorio)", pt: "Condições de importação do MAAIF (microchip não listado como obrigatório)" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Every dog must have a valid rabies vaccination certificate. Uganda is a rabies-endemic country and rabies is the top animal-health concern in MAAIF's guidance for dogs. The exact timing/validity window is set on the import permit by the Commissioner for Animal Health rather than published as a fixed rule.", fr: "Chaque chien doit disposer d'un certificat de vaccination antirabique valide. L'Ouganda est un pays d'enzootie rabique et la rage est la première préoccupation sanitaire dans les orientations du MAAIF pour les chiens. Le délai/la validité exacts sont fixés sur le permis d'importation par le Commissioner for Animal Health plutôt que publiés comme règle figée.", es: "Todo perro debe disponer de un certificado de vacunación antirrábica válido. Uganda es un país con rabia endémica y la rabia es la principal preocupación sanitaria en las orientaciones del MAAIF para los perros. El plazo/la valide exactos los fija el Commissioner for Animal Health en el permiso de importación, en lugar de publicarse como una regla fija.", pt: "Todo cachorro precisa ter um certificado de vacinação antirrábica válido. Uganda é um país com raiva endêmica, e a raiva é a principal preocupação sanitária na orientação do MAAIF para cachorros. O prazo/janela de validade exatos são definidos na autorização de importação pelo Commissioner for Animal Health, em vez de publicados como regra fixa." }
    exceptions: { en: "None published. The precise pre-travel timing is confirmed by the CAH on the permit and by your veterinarian.", fr: "Aucune exception publiée. Le délai précis avant le voyage est confirmé par le CAH sur le permis et par ton vétérinaire.", es: "Ninguna publicada. El plazo preciso antes del viaje lo confirman el CAH en el permiso y tu veterinario.", pt: "Nenhuma publicada. O prazo preciso antes da viagem é confirmado pelo CAH na autorização e pelo seu veterinário." }
    ref: { en: "MAAIF — Dogs and Cats (rabies vaccination certificate); Animal Diseases Act (Cap. 38) & Local Government (Dog Control and Registration) Act", fr: "MAAIF — Chiens et chats (certificat de vaccination antirabique) ; Animal Diseases Act (Cap. 38) et Local Government (Dog Control and Registration) Act", es: "MAAIF — Perros y gatos (certificado de vacunación antirrábica); Animal Diseases Act (Cap. 38) y Local Government (Dog Control and Registration) Act", pt: "MAAIF — Dogs and Cats (certificado de vacinação antirrábica); Animal Diseases Act (Cap. 38) e Local Government (Dog Control and Registration) Act" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not listed in published conditions", fr: "Non mentionné dans les conditions publiées", es: "No mencionada en las condiciones publicadas", pt: "Não consta das condições publicadas" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "MAAIF's published import procedure does not list a rabies antibody (blood) test to enter Uganda. Because the requirement is not published, confirm directly with the Commissioner for Animal Health for your specific origin, and note the permit can set additional conditions.", fr: "La procédure d'importation publiée du MAAIF ne mentionne pas de titrage antirabique (prise de sang) pour entrer en Ouganda. Cette exigence n'étant pas publiée, vérifie directement auprès du Commissioner for Animal Health pour ton origine précise, et note que le permis peut fixer des conditions supplémentaires.", es: "El procedimiento de importación publicado del MAAIF no incluye una prueba de titulación de rabia (análisis de sangre) para entrar en Uganda. Como el requisito no está publicado, confírmalo directamente con el Commissioner for Animal Health para tu origen concreto, y ten en cuenta que el permiso puede fijar condiciones adicionales.", pt: "O procedimento de importação publicado pelo MAAIF não lista um teste sorológico antirrábico (exame de sangue) para entrar em Uganda. Como a exigência não é publicada, confirme diretamente com o Commissioner for Animal Health para a sua origem específica, e note que a autorização pode definir condições adicionais." }
    ref: { en: "MAAIF import conditions (no antibody test listed)", fr: "Conditions d'importation du MAAIF (aucun titrage listé)", es: "Condiciones de importación del MAAIF (ninguna prueba de titulación listada)", pt: "Condições de importação do MAAIF (nenhum teste sorológico listado)" }
  - item: { en: "Other vaccinations (distemper, hepatitis, parvovirus, parainfluenza, kennel cough)", fr: "Autres vaccinations (Carré, hépatite, parvovirose, parainfluenza, toux du chenil)", es: "Otras vacunaciones (moquillo, hepatitis, parvovirosis, parainfluenza, tos de las perreras)", pt: "Outras vacinações (cinomose, hepatite, parvovirose, parainfluenza, tosse dos canis)" }
    required: { en: "Recommended", fr: "Recommandées", es: "Recomendadas", pt: "Recomendado" }
    when: { en: "MAAIF's guidance on dogs references vaccination records against rabies, Canine Distemper, Canine Parvovirus, Infectious Canine Hepatitis, Parainfluenza and Canine Infectious Tracheobronchitis (kennel cough). Keep these up to date and recorded on the certificate.", fr: "Les orientations du MAAIF sur les chiens évoquent les preuves de vaccination contre la rage, la maladie de Carré, la parvovirose canine, l'hépatite de Rubarth, la parainfluenza et la trachéobronchite infectieuse canine (toux du chenil). Tiens-les à jour et consignez-les sur le certificat.", es: "Las orientaciones del MAAIF sobre perros mencionan los registros de vacunación contra la rabia, el moquillo canino, la parvovirosis canina, la hepatitis infecciosa canina, la parainfluenza y la traqueobronquitis infecciosa canina (tos de las perreras). Mantenlas al día y consígnalas en el certificado.", pt: "A orientação do MAAIF sobre cachorros faz referência a registros de vacinação contra raiva, cinomose canina, parvovirose canina, hepatite infecciosa canina, parainfluenza e traqueobronquite infecciosa canina (tosse dos canis). Mantenha-os em dia e registrados no certificado." }
    exceptions: { en: "These are recorded in MAAIF's guidance chiefly in the context of clearing dogs for export; for import, confirm which are compulsory on your permit.", fr: "Ces éléments figurent dans les orientations du MAAIF surtout dans le contexte de la certification des chiens à l'export ; pour l'import, confirme lesquels sont obligatoires sur ton permis.", es: "Estos elementos figuran en las orientaciones del MAAIF sobre todo en el contexto de la certificación de perros para la exportación; para la importación, confirma cuáles son obligatorios en tu permiso.", pt: "Esses itens constam da orientação do MAAIF principalmente no contexto de liberar cachorros para exportação; para a importação, confirme quais são obrigatórios na sua autorização." }
    ref: { en: "MAAIF — Dogs and Cats (Key Animal Health Requirements)", fr: "MAAIF — Chiens et chats (principales exigences sanitaires)", es: "MAAIF — Perros y gatos (principales requisitos sanitarios)", pt: "MAAIF — Dogs and Cats (principais exigências sanitárias)" }
  - item: { en: "Official veterinary health certificate", fr: "Certificat vétérinaire officiel", es: "Certificado sanitario veterinario oficial", pt: "Certificado veterinário oficial" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "The dog must be accompanied by an official Veterinary Health Certificate, in English or with an English translation, issued by the veterinary authority of the country of origin, attesting that the animal satisfactorily meets the animal-health requirements set in the import permit. From the United States it should be issued by a USDA-accredited veterinarian and endorsed by USDA-APHIS.", fr: "Le chien doit être accompagné d'un certificat vétérinaire officiel, en anglais ou avec une traduction en anglais, délivré par l'autorité vétérinaire du pays d'origine, attestant que l'animal satisfait aux exigences sanitaires fixées dans le permis d'importation. Depuis les États-Unis, il doit être établi par un vétérinaire agréé USDA et visé par l'USDA-APHIS.", es: "El perro debe ir acompañado de un certificado sanitario veterinario oficial, en inglés o con una traducción al inglés, expedido por la autoridad veterinaria del país de origen, que acredite que el animal cumple satisfactoriamente los requisitos sanitarios fijados en el permiso de importación. Desde Estados Unidos debe ser expedido por un veterinario acreditado por el USDA y refrendado por el USDA-APHIS.", pt: "O cachorro precisa estar acompanhado de um certificado veterinário oficial, em inglês ou com tradução para o inglês, emitido pela autoridade veterinária do país de origem, atestando que o animal atende satisfatoriamente às exigências sanitárias definidas na autorização de importação. Dos Estados Unidos, ele deve ser emitido por um veterinário credenciado pelo USDA e endossado pelo USDA-APHIS." }
    exceptions: { en: "Use the certificate format required by your national veterinary authority and matching the conditions on the Ugandan permit; the documents are checked by the port veterinary inspector on arrival.", fr: "Utilise le format de certificat exigé par ton autorité vétérinaire nationale et correspondant aux conditions du permis ougandais ; les documents sont contrôlés par le vétérinaire inspecteur au point d'entrée à l'arrivée.", es: "Usa el formato de certificado exigido por tu autoridad veterinaria nacional y que coincida con las condiciones del permiso ugandés; los documentos los revisa el veterinario inspector del punto de entrada a la llegada.", pt: "Use o formato de certificado exigido pela sua autoridade veterinária nacional e que corresponda às condições da autorização ugandense; os documentos são verificados pelo inspetor veterinário do porto na chegada." }
    ref: { en: "MAAIF — Import Procedure (official Veterinary Health Certificate from origin-country authority)", fr: "MAAIF — Procédure d'importation (certificat vétérinaire officiel de l'autorité du pays d'origine)", es: "MAAIF — Procedimiento de importación (certificado sanitario veterinario oficial de la autoridad del país de origen)", pt: "MAAIF — Import Procedure (certificado veterinário oficial da autoridade do país de origem)" }
  - item: { en: "Parasite / deworming treatment", fr: "Traitement antiparasitaire / vermifuge", es: "Tratamiento antiparasitario / desparasitación", pt: "Tratamento antiparasitário / vermifugação" }
    required: { en: "Not published as mandatory", fr: "Non publié comme obligatoire", es: "No publicado como obligatorio", pt: "Não publicado como obrigatório" }
    when: { en: "A specific deworming or external-parasite treatment is not published as a mandatory entry condition in MAAIF's import procedure. Deworming and tick control before departure are commonly advised as good practice and may be added as conditions on the permit.", fr: "Un traitement vermifuge ou antiparasitaire externe précis n'est pas publié comme condition d'entrée obligatoire dans la procédure d'importation du MAAIF. La vermifugation et la lutte contre les tiques avant le départ sont souvent conseillées en bonne pratique et peuvent être ajoutées comme conditions du permis.", es: "Un tratamiento antiparasitario específico, de desparasitación o contra parásitos externos, no está publicado como condición de entrada obligatoria en el procedimiento de importación del MAAIF. La desparasitación y el control de garrapatas antes de la salida suelen aconsejarse como buena práctica y pueden añadirse como condiciones del permiso.", pt: "Um tratamento específico de vermifugação ou contra parasitas externos não é publicado como condição de entrada obrigatória no procedimento de importação do MAAIF. A vermifugação e o controle de carrapatos antes da partida são comumente recomendados como boa prática e podem ser acrescentados como condições na autorização." }
    exceptions: { en: "Confirm any compulsory treatment on your permit and with your vet, especially for tick- and worm-borne diseases.", fr: "Confirme tout traitement obligatoire sur ton permis et avec ton vétérinaire, en particulier pour les maladies transmises par les tiques et les vers.", es: "Confirma cualquier tratamiento obligatorio en tu permiso y con tu veterinario, especialmente para las enfermedades transmitidas por garrapatas y vermes.", pt: "Confirme qualquer tratamento obrigatório na sua autorização e com o seu veterinário, especialmente para doenças transmitidas por carrapatos e vermes." }
    ref: { en: "MAAIF import conditions (no mandatory parasite treatment published)", fr: "Conditions d'importation du MAAIF (aucun traitement antiparasitaire obligatoire publié)", es: "Condiciones de importación del MAAIF (ningún tratamiento antiparasitario obligatorio publicado)", pt: "Condições de importação do MAAIF (nenhum tratamento antiparasitário obrigatório publicado)" }
  - item: { en: "Port-of-entry veterinary inspection", fr: "Inspection vétérinaire au point d'entrée", es: "Inspección veterinaria en el punto de entrada", pt: "Inspeção veterinária no ponto de entrada" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "The accompanying documents are presented to the official veterinary inspector before a general inspection of the animal on arrival. The veterinary inspector at the port of entry inspects the documents and the dog to detect any signs of ill health. Confirm the specified arrival date to the port veterinary official at least 3 days in advance so facilities are prepared. For air travel the main port of entry is Entebbe International Airport.", fr: "Les documents d'accompagnement sont présentés au vétérinaire inspecteur officiel avant une inspection générale de l'animal à l'arrivée. Le vétérinaire inspecteur au point d'entrée contrôle les documents et le chien pour détecter tout signe de mauvaise santé. Confirme la date d'arrivée prévue au vétérinaire officiel du point d'entrée au moins 3 jours à l'avance afin que les installations soient préparées. Pour la voie aérienne, le principal point d'entrée est l'aéroport international d'Entebbe.", es: "Los documentos de acompañamiento se presentan al veterinario inspector oficial antes de una inspección general del animal a la llegada. El veterinario inspector del punto de entrada revisa los documentos y al perro para detectar cualquier signo de mala salud. Confirma la fecha de llegada prevista al veterinario oficial del punto de entrada al menos 3 días antes para que las instalaciones estén preparadas. Para la vía aérea, el principal punto de entrada es el Aeropuerto Internacional de Entebbe.", pt: "Os documentos que acompanham o cachorro são apresentados ao inspetor veterinário oficial antes de uma inspeção geral do animal na chegada. O inspetor veterinário no porto de entrada verifica os documentos e o cachorro para detectar qualquer sinal de doença. Confirme a data de chegada prevista ao agente veterinário do porto com pelo menos 3 dias de antecedência para que as instalações estejam preparadas. Para viagens aéreas, o principal porto de entrada é o Aeroporto Internacional de Entebbe." }
    exceptions: { en: "None — inspection applies to imported live animals at the port of entry named on the permit.", fr: "Aucune — l'inspection s'applique aux animaux vivants importés au point d'entrée indiqué sur le permis.", es: "Ninguna — la inspección se aplica a los animales vivos importados en el punto de entrada indicado en el permiso.", pt: "Nenhuma — a inspeção se aplica a animais vivos importados no porto de entrada indicado na autorização." }
    ref: { en: "MAAIF — Import Procedure (inspection of documents and animals at the port of entry)", fr: "MAAIF — Procédure d'importation (inspection des documents et des animaux au point d'entrée)", es: "MAAIF — Procedimiento de importación (inspección de los documentos y los animales en el punto de entrada)", pt: "MAAIF — Import Procedure (inspeção de documentos e animais no porto de entrada)" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Published: 21–30 days post-import", fr: "Publiée : 21 à 30 jours après l'importation", es: "Publicada: de 21 a 30 días tras la importación", pt: "Publicada: de 21 a 30 dias após a importação" }
    when: { en: "MAAIF's published import procedure states that imported animals are moved to animal quarantine/holding facilities after the general examination on arrival, and that during a quarantine period of 21–30 days samples are collected for testing for certain diseases. The final import/release permit is issued once the animal has passed the prescribed tests at the end of the post-import quarantine.", fr: "La procédure d'importation publiée du MAAIF indique que les animaux importés sont placés dans des installations de quarantaine/détention après l'examen général à l'arrivée, et que pendant une période de quarantaine de 21 à 30 jours des échantillons sont prélevés pour rechercher certaines maladies. Le permis d'importation/de libération final est délivré une fois que l'animal a passé les tests prescrits à la fin de la quarantaine post-importation.", es: "El procedimiento de importación publicado del MAAIF indica que los animales importados se trasladan a instalaciones de cuarentena/retención tras el examen general a la llegada, y que durante un periodo de cuarentena de 21 a 30 días se recogen muestras para analizar determinadas enfermedades. El permiso final de importación/liberación se expide una vez que el animal ha superado las pruebas prescritas al final de la cuarentena posterior a la importación.", pt: "O procedimento de importação publicado pelo MAAIF indica que os animais importados são levados a instalações de quarentena/retenção após o exame geral na chegada, e que durante um período de quarentena de 21 a 30 dias são coletadas amostras para testar certas doenças. A autorização final de importação/liberação é emitida assim que o animal passar nos testes prescritos ao final da quarentena pós-importação." }
    exceptions: { en: "This 21–30 day period appears in MAAIF's general live-animal import procedure. How fully it is applied to an accompanied pet dog is set by the Commissioner for Animal Health and the port veterinary officer on your permit, so confirm the exact handling for your dog in advance.", fr: "Cette période de 21 à 30 jours figure dans la procédure générale d'importation d'animaux vivants du MAAIF. La manière dont elle s'applique à un chien de compagnie accompagné est fixée par le Commissioner for Animal Health et l'agent vétérinaire du point d'entrée sur ton permis ; confirme donc à l'avance le traitement exact pour ton chien.", es: "Este periodo de 21 a 30 días figura en el procedimiento general de importación de animales vivos del MAAIF. Cómo se aplica exactamente a un perro de compañía acompañado lo fijan el Commissioner for Animal Health y el agente veterinario del punto de entrada en tu permiso, así que confirma con antelación el tratamiento exacto para tu perro.", pt: "Esse período de 21 a 30 dias aparece no procedimento geral de importação de animais vivos do MAAIF. O quanto ele se aplica integralmente a um cachorro de estimação acompanhado é definido pelo Commissioner for Animal Health e pelo agente veterinário do porto na sua autorização, então confirme com antecedência o tratamento exato para o seu cachorro." }
    ref: { en: "MAAIF — Post-Import Procedure (21–30 day quarantine; release after prescribed tests)", fr: "MAAIF — Procédure post-importation (quarantaine de 21 à 30 jours ; libération après les tests prescrits)", es: "MAAIF — Procedimiento posterior a la importación (cuarentena de 21 a 30 días; liberación tras las pruebas prescritas)", pt: "MAAIF — Post-Import Procedure (quarentena de 21 a 30 dias; liberação após os testes prescritos)" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "Not published", fr: "Non publié", es: "No publicado", pt: "Não publicado" }
    when: { en: "MAAIF's published import procedure does not state a specific minimum travelling age for dogs. In practice a dog must carry a valid rabies vaccination, and puppies are typically vaccinated against rabies from around 12 weeks, so a very young puppy cannot yet meet the rabies condition.", fr: "La procédure d'importation publiée du MAAIF n'indique pas d'âge minimum de voyage précis pour les chiens. En pratique, un chien doit disposer d'une vaccination antirabique valide, et les chiots sont généralement vaccinés contre la rage à partir d'environ 12 semaines, si bien qu'un très jeune chiot ne peut pas encore remplir la condition rabique.", es: "El procedimiento de importación publicado del MAAIF no indica una edad mínima de viaje específica para los perros. En la práctica, un perro debe disponer de una vacunación antirrábica válida, y los cachorros suelen vacunarse contra la rabia a partir de las 12 semanas aproximadamente, de modo que un cachorro muy joven aún no puede cumplir la condición de la rabia.", pt: "O procedimento de importação publicado pelo MAAIF não indica uma idade mínima de viagem específica para cachorros. Na prática, um cachorro precisa portar uma vacinação antirrábica válida, e os filhotes normalmente são vacinados contra a raiva a partir de cerca de 12 semanas, então um filhote muito jovem ainda não consegue cumprir a condição antirrábica." }
    exceptions: { en: "Confirm the minimum age for your dog with the Commissioner for Animal Health and your vet.", fr: "Confirme l'âge minimum pour ton chien auprès du Commissioner for Animal Health et de ton vétérinaire.", es: "Confirma la edad mínima para tu perro con el Commissioner for Animal Health y tu veterinario.", pt: "Confirme a idade mínima para o seu cachorro com o Commissioner for Animal Health e com o seu veterinário." }
    ref: { en: "MAAIF import conditions (minimum age not published)", fr: "Conditions d'importation du MAAIF (âge minimum non publié)", es: "Condiciones de importación del MAAIF (edad mínima no publicada)", pt: "Condições de importação do MAAIF (idade mínima não publicada)" }
  - item: { en: "Restricted breeds", fr: "Races restreintes", es: "Razas restringidas", pt: "Raças restritas" }
    required: { en: "No national import ban found", fr: "Aucune interdiction nationale trouvée", es: "No se ha encontrado prohibición nacional de importación", pt: "Nenhuma proibição nacional de importação encontrada" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "We found no official Ugandan breed-specific import ban; entry is controlled by permit and health requirements, not by breed. The permit application does record the dog's breed.", fr: "Nous n'avons trouvé aucune interdiction d'importation officielle par race en Ouganda ; l'entrée est encadrée par le permis et les exigences sanitaires, non par la race. La demande de permis enregistre toutefois la race du chien.", es: "No encontramos ninguna prohibición de importación oficial de Uganda por raza; la entrada se controla mediante el permiso y los requisitos sanitarios, no por la raza. La solicitud del permiso sí registra la raza del perro.", pt: "Não encontramos nenhuma proibição de importação oficial de Uganda por raça; a entrada é controlada pela autorização e pelas exigências sanitárias, não pela raça. O pedido de autorização registra a raça do cachorro, no entanto." }
    ref: { en: "MAAIF import conditions (no breed-specific legislation cited)", fr: "Conditions d'importation du MAAIF (aucune législation par race citée)", es: "Condiciones de importación del MAAIF (ninguna legislación por raza citada)", pt: "Condições de importação do MAAIF (nenhuma legislação por raça citada)" }

origin:
  scheme: eu
  eu:
    title: { en: "From Europe / the EU", fr: "Depuis l'Europe / l'UE", es: "Desde Europa / la UE", pt: "Da Europa / da UE" }
    body:
      en: "There is no EU pet-passport shortcut into Uganda: the EU passport is not a Ugandan document. A dog from Europe needs the import permit from the Commissioner for Animal Health (applied for at least 7 days ahead), a valid rabies vaccination and an official Veterinary Health Certificate issued by the national veterinary authority in English (or with an English translation). Plan for the port-of-entry inspection at Entebbe and the published 21–30 day post-import quarantine. No rabies antibody test is listed in the published conditions."
      fr: "Aucun raccourci « passeport européen » pour entrer en Ouganda : le passeport UE n'est pas un document ougandais. Un chien venant d'Europe a besoin du permis d'importation du Commissioner for Animal Health (demandé au moins 7 jours à l'avance), d'une vaccination antirabique valide et d'un certificat vétérinaire officiel délivré par l'autorité vétérinaire nationale en anglais (ou avec une traduction en anglais). Prévois l'inspection au point d'entrée d'Entebbe et la quarantaine post-importation publiée de 21 à 30 jours. Aucun titrage antirabique n'est mentionné dans les conditions publiées."
      es: "No hay ningún atajo por pasaporte europeo para entrar en Uganda: el pasaporte europeo no es un documento ugandés. Un perro que llega de Europa necesita el permiso de importación del Commissioner for Animal Health (solicitado al menos 7 días antes), una vacunación antirrábica válida y un certificado sanitario veterinario oficial expedido por la autoridad veterinaria nacional en inglés (o con una traducción al inglés). Cuenta con la inspección en el punto de entrada de Entebbe y la cuarentena posterior a la importación publicada de 21 a 30 días. No se incluye ninguna prueba de titulación de rabia en las condiciones publicadas."
      pt: "Não existe um atalho de passaporte europeu para entrar em Uganda: o passaporte da UE não é um documento ugandense. Um cachorro vindo da Europa precisa da autorização de importação do Commissioner for Animal Health (solicitada com pelo menos 7 dias de antecedência), de uma vacinação antirrábica válida e de um certificado veterinário oficial emitido pela autoridade veterinária nacional em inglês (ou com tradução para o inglês). Planeje-se para a inspeção no porto de entrada em Entebbe e para a quarentena pós-importação publicada de 21 a 30 dias. Nenhum teste sorológico antirrábico é listado nas condições publicadas."
    cls: warn
  listed:
    title: { en: "From other non-EU countries", fr: "Depuis d'autres pays hors UE", es: "Desde otros países fuera de la UE", pt: "De outros países fora da UE" }
    body:
      en: "Uganda does not operate an EU-style list of approved countries for pet entry. From any non-EU origin the same core requirements apply: import permit from the Commissioner for Animal Health, rabies vaccination and an official veterinary health certificate. From the United States, for example, the certificate must be issued by a USDA-accredited veterinarian and endorsed by USDA-APHIS; note that APHIS does not publish a dedicated Uganda page (Uganda falls under 'unknown requirements'), so work from Uganda's own MAAIF conditions and the permit."
      fr: "L'Ouganda n'applique pas de liste de pays approuvés à l'européenne pour l'entrée des animaux. Depuis toute origine hors UE, les mêmes exigences de base s'appliquent : permis d'importation du Commissioner for Animal Health, vaccination antirabique et certificat vétérinaire officiel. Depuis les États-Unis, par exemple, le certificat doit être établi par un vétérinaire agréé USDA et visé par l'USDA-APHIS ; à noter que l'APHIS ne publie pas de page dédiée à l'Ouganda (l'Ouganda relève des « exigences inconnues »), appuie-toi donc sur les conditions du MAAIF et sur le permis."
      es: "Uganda no aplica una lista de países aprobados al estilo de la UE para la entrada de mascotas. Desde cualquier origen fuera de la UE se aplican los mismos requisitos básicos: permiso de importación del Commissioner for Animal Health, vacunación antirrábica y un certificado sanitario veterinario oficial. Desde Estados Unidos, por ejemplo, el certificado debe ser expedido por un veterinario acreditado por el USDA y refrendado por el USDA-APHIS; ten en cuenta que APHIS no publica una página dedicada a Uganda (Uganda entra en la categoría de «requisitos desconocidos»), así que guíate por las propias condiciones del MAAIF de Uganda y por el permiso."
      pt: "Uganda não opera uma lista de países aprovados no estilo da UE para a entrada de animais de estimação. De qualquer origem fora da UE, aplicam-se as mesmas exigências centrais: autorização de importação do Commissioner for Animal Health, vacinação antirrábica e um certificado veterinário oficial. Dos Estados Unidos, por exemplo, o certificado precisa ser emitido por um veterinário credenciado pelo USDA e endossado pelo USDA-APHIS; note que o APHIS não publica uma página dedicada a Uganda (Uganda entra na categoria de \"exigências não comunicadas\"), então baseie-se nas próprias condições do MAAIF de Uganda e na autorização."
    cls: warn
  nonListed:
    title: { en: "From all other origins", fr: "Depuis toute autre origine", es: "Desde cualquier otro origen", pt: "De todas as outras origens" }
    body:
      en: "Whatever the origin, Uganda's framework is the same: apply in advance to the Commissioner for Animal Health for the import permit (which searches the disease status of your country of origin), carry a valid rabies vaccination and an official veterinary health certificate, and present everything to the port veterinary inspector. MAAIF's procedure provides for a 21–30 day post-import quarantine with disease testing before a final release permit is issued. Arriving without a permit or the required certificates risks refusal, extended quarantine or return at the owner's expense."
      fr: "Quelle que soit l'origine, le cadre ougandais est le même : demande à l'avance le permis d'importation au Commissioner for Animal Health (qui examine le statut sanitaire de ton pays d'origine), munis-toi d'une vaccination antirabique valide et d'un certificat vétérinaire officiel, et présente l'ensemble au vétérinaire inspecteur du point d'entrée. La procédure du MAAIF prévoit une quarantaine post-importation de 21 à 30 jours avec tests de dépistage avant la délivrance d'un permis de libération final. Arriver sans permis ou sans les certificats requis expose à un refus, à une quarantaine prolongée ou à un renvoi aux frais du propriétaire."
      es: "Sea cual sea el origen, el marco de Uganda es el mismo: solicita con antelación al Commissioner for Animal Health el permiso de importación (que examina el estatus sanitario de tu país de origen), lleva una vacunación antirrábica válida y un certificado sanitario veterinario oficial, y preséntalo todo al veterinario inspector del punto de entrada. El procedimiento del MAAIF prevé una cuarentena posterior a la importación de 21 a 30 días con pruebas de enfermedades antes de expedir un permiso de liberación final. Llegar sin permiso o sin los certificados exigidos expone a una denegación, a una cuarentena prolongada o a una devolución a cargo del propietario."
      pt: "Seja qual for a origem, o marco de Uganda é o mesmo: solicite com antecedência ao Commissioner for Animal Health a autorização de importação (que pesquisa o status sanitário do seu país de origem), leve uma vacinação antirrábica válida e um certificado veterinário oficial, e apresente tudo ao inspetor veterinário do porto. O procedimento do MAAIF prevê uma quarentena pós-importação de 21 a 30 dias com testes de doenças antes da emissão de uma autorização final de liberação. Chegar sem uma autorização ou sem os certificados exigidos arrisca recusa, quarentena prolongada ou devolução às custas do dono."
    cls: warn

arrival:
  intro:
    en: "What happens when your dog reaches Uganda depends on your permit and the certificates you carry."
    fr: "Ce qui se passe à l'arrivée en Ouganda dépend de ton permis et des certificats que tu porte."
    es: "Lo que ocurre cuando tu perro llega a Uganda depende de tu permiso y de los certificados que lleves."
    pt: "O que acontece quando o seu cachorro chega a Uganda depende da sua autorização e dos certificados que você leva."
  points:
    - en: "Enter at the port of entry named on your permit — for air travel this is chiefly Entebbe International Airport — and present the original import permit, the rabies vaccination certificate and the official Veterinary Health Certificate to the veterinary inspector."
      fr: "Entre par le point d'entrée indiqué sur ton permis — pour la voie aérienne, il s'agit principalement de l'aéroport international d'Entebbe — et présente le permis d'importation original, le certificat de vaccination antirabique et le certificat vétérinaire officiel au vétérinaire inspecteur."
      es: "Entra por el punto de entrada indicado en tu permiso — para la vía aérea es principalmente el Aeropuerto Internacional de Entebbe — y presenta el permiso de importación original, el certificado de vacunación antirrábica y el certificado sanitario veterinario oficial al veterinario inspector."
      pt: "Entre pelo porto de entrada indicado na sua autorização — para viagens aéreas, isso é principalmente o Aeroporto Internacional de Entebbe — e apresente a autorização de importação original, o certificado de vacinação antirrábica e o certificado veterinário oficial ao inspetor veterinário."
    - en: "Confirm your dog's arrival date to the port veterinary official at least 3 days in advance so that facilities are prepared for inspection and any holding."
      fr: "Confirme la date d'arrivée de ton chien au vétérinaire officiel du point d'entrée au moins 3 jours à l'avance afin que les installations soient prêtes pour l'inspection et l'éventuelle détention."
      es: "Confirma la fecha de llegada de tu perro al veterinario oficial del punto de entrada al menos 3 días antes para que las instalaciones estén preparadas para la inspección y una posible retención."
      pt: "Confirme a data de chegada do seu cachorro ao agente veterinário do porto com pelo menos 3 dias de antecedência para que as instalações estejam preparadas para a inspeção e uma eventual retenção."
    - en: "The veterinary inspector checks the documents and examines the dog for any signs of ill health before clearance."
      fr: "Le vétérinaire inspecteur contrôle les documents et examine le chien pour détecter tout signe de mauvaise santé avant le dédouanement."
      es: "El veterinario inspector revisa los documentos y examina al perro para detectar cualquier signo de mala salud antes del despacho."
      pt: "O inspetor veterinário verifica os documentos e examina o cachorro em busca de qualquer sinal de doença antes da liberação."
    - en: "Under MAAIF's published procedure, imported animals are moved to quarantine/holding facilities and may be held for 21–30 days with disease testing; the final release permit is issued once the prescribed tests are passed."
      fr: "Selon la procédure publiée du MAAIF, les animaux importés sont placés en quarantaine/détention et peuvent y être maintenus de 21 à 30 jours avec dépistage de maladies ; le permis de libération final est délivré une fois les tests prescrits réussis."
      es: "Según el procedimiento publicado del MAAIF, los animales importados se trasladan a instalaciones de cuarentena/retención y pueden mantenerse de 21 a 30 días con pruebas de enfermedades; el permiso de liberación final se expide una vez superadas las pruebas prescritas."
      pt: "Segundo o procedimento publicado pelo MAAIF, os animais importados são levados a instalações de quarentena/retenção e podem ficar retidos de 21 a 30 dias com testes de doenças; a autorização final de liberação é emitida assim que os testes prescritos forem aprovados."
    - en: "Carry original documents (not copies) and keep a set with you throughout the journey."
      fr: "Munis-toi des documents originaux (pas de copies) et garde-en un jeu sur toi durant tout le trajet."
      es: "Lleva los documentos originales (no copias) y guarda un juego contigo durante todo el trayecto."
      pt: "Leve os documentos originais (não cópias) e mantenha um jogo com você durante todo o trajeto."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Uganda's published import conditions control entry through the import permit and health requirements, not through breed. We found no national breed-specific import ban in MAAIF's official conditions, although the permit application does record the dog's breed."
    fr: "Les conditions d'importation publiées de l'Ouganda encadrent l'entrée par le permis d'importation et les exigences sanitaires, non par la race. Nous n'avons trouvé aucune interdiction d'importation nationale par race dans les conditions officielles du MAAIF, même si la demande de permis enregistre la race du chien."
    es: "Las condiciones de importación publicadas de Uganda controlan la entrada mediante el permiso de importación y los requisitos sanitarios, no mediante la raza. No encontramos ninguna prohibición de importación nacional por raza en las condiciones oficiales del MAAIF, aunque la solicitud del permiso sí registra la raza del perro."
    pt: "As condições de importação publicadas de Uganda controlam a entrada por meio da autorização de importação e das exigências sanitárias, não pela raça. Não encontramos nenhuma proibição nacional de importação por raça nas condições oficiais do MAAIF, embora o pedido de autorização registre a raça do cachorro."
  cat1:
    en: "No prohibited-breed list: MAAIF's official import conditions do not name banned breeds. A compliant dog of any breed can be imported once the permit, rabies vaccination and official veterinary health certificate are in order."
    fr: "Pas de liste de races interdites : les conditions d'importation officielles du MAAIF ne nomment aucune race prohibée. Un chien conforme, quelle que soit sa race, peut être importé dès lors que le permis, la vaccination antirabique et le certificat vétérinaire officiel sont en règle."
    es: "Ninguna lista de razas prohibidas: las condiciones de importación oficiales del MAAIF no nombran razas prohibidas. Un perro que cumpla los requisitos, sea cual sea su raza, puede importarse una vez que el permiso, la vacunación antirrábica y el certificado sanitario veterinario oficial estén en regla."
    pt: "Nenhuma lista de raças proibidas: as condições de importação oficiais do MAAIF não citam raças proibidas. Um cachorro em conformidade, de qualquer raça, pode ser importado assim que a autorização, a vacinação antirrábica e o certificado veterinário oficial estiverem em ordem."
  cat2:
    en: "Uganda applies national dog rules on its territory — including rabies vaccination and dog control and registration under the Local Government (Dog Control and Registration) Act — but these are domestic ownership and public-health rules, not breed import bans. We found no official breed-specific import restriction to report."
    fr: "L'Ouganda applique des règles nationales sur les chiens sur son territoire — dont la vaccination antirabique et le contrôle et l'enregistrement des chiens au titre du Local Government (Dog Control and Registration) Act — mais il s'agit de règles de détention et de santé publique internes, non d'interdictions d'importation par race. Nous n'avons trouvé aucune restriction d'importation officielle par race à signaler."
    es: "Uganda aplica normas nacionales sobre los perros en su territorio — incluidas la vacunación antirrábica y el control y registro de perros al amparo del Local Government (Dog Control and Registration) Act — pero se trata de normas internas de tenencia y salud pública, no de prohibiciones de importación por raza. No encontramos ninguna restricción de importación oficial por raza que señalar."
    pt: "Uganda aplica regras nacionais sobre cachorros no seu território — incluindo vacinação antirrábica e controle e registro de cachorros segundo o Local Government (Dog Control and Registration) Act — mas essas são regras internas de posse e saúde pública, não proibições de importação por raça. Não encontramos nenhuma restrição de importação oficial por raça a relatar."
  note:
    en: "Because national rules are not always published in full and can change, treat this as 'none found' rather than a guarantee, and verify current breed and import conditions with the Commissioner for Animal Health before you travel."
    fr: "Les règles nationales n'étant pas toujours publiées en intégralité et pouvant évoluer, considère cela comme « rien de trouvé » plutôt qu'une garantie, et vérifie les conditions de race et d'importation à jour auprès du Commissioner for Animal Health avant de voyager."
    es: "Como las normas nacionales no siempre se publican de forma íntegra y pueden cambiar, considéralo como «nada encontrado» más que como una garantía, y verifica las condiciones de raza e importación vigentes con el Commissioner for Animal Health antes de viajar."
    pt: "Como as regras nacionais nem sempre são publicadas na íntegra e podem mudar, trate isso como \"nada encontrado\", e não como uma garantia, e verifique as condições atuais de raça e importação com o Commissioner for Animal Health antes de viajar."

checklist:
  - en: "Apply to the Commissioner for Animal Health for the import permit at least 7 days before importation (state source country, supplier, type, breed, sex, quantity)"
    fr: "Demande le permis d'importation au Commissioner for Animal Health au moins 7 jours avant l'importation (indique pays source, fournisseur, type, race, sexe, quantité)"
    es: "Solicita el permiso de importación al Commissioner for Animal Health al menos 7 días antes de la importación (indica país de origen, proveedor, tipo, raza, sexo, cantidad)"
    pt: "Solicite ao Commissioner for Animal Health a autorização de importação com pelo menos 7 dias de antecedência da importação (indicando país de origem, fornecedor, tipo, raça, sexo, quantidade)"
  - en: "ISO microchip (recommended) implanted before the rabies vaccination"
    fr: "Puce ISO (recommandée) posée avant la vaccination antirabique"
    es: "Microchip ISO (recomendado) implantado antes de la vacunación antirrábica"
    pt: "Microchip ISO (recomendado) implantado antes da vacinação antirrábica"
  - en: "Valid rabies vaccination certificate (Uganda is rabies-endemic)"
    fr: "Certificat de vaccination antirabique valide (l'Ouganda est un pays d'enzootie rabique)"
    es: "Certificado de vacunación antirrábica válido (Uganda es un país con rabia endémica)"
    pt: "Certificado de vacinação antirrábica válido (Uganda tem raiva endêmica)"
  - en: "Up-to-date distemper, hepatitis, parvovirus, parainfluenza and kennel-cough vaccinations recorded"
    fr: "Vaccinations à jour contre la maladie de Carré, l'hépatite, la parvovirose, la parainfluenza et la toux du chenil, consignées"
    es: "Vacunaciones al día contra el moquillo, la hepatitis, la parvovirosis, la parainfluenza y la tos de las perreras, consignadas"
    pt: "Vacinações contra cinomose, hepatite, parvovirose, parainfluenza e tosse dos canis em dia e registradas"
  - en: "Official Veterinary Health Certificate from the origin-country authority, in English (USDA-APHIS endorsed from the US)"
    fr: "Certificat vétérinaire officiel de l'autorité du pays d'origine, en anglais (visé USDA-APHIS depuis les États-Unis)"
    es: "Certificado sanitario veterinario oficial de la autoridad del país de origen, en inglés (refrendado por el USDA-APHIS desde EE. UU.)"
    pt: "Certificado veterinário oficial da autoridade do país de origem, em inglês (endossado pelo USDA-APHIS, no caso dos EUA)"
  - en: "Confirm the arrival date to the port veterinary official at least 3 days ahead (Entebbe International Airport for air travel)"
    fr: "Confirme la date d'arrivée au vétérinaire officiel du point d'entrée au moins 3 jours à l'avance (aéroport international d'Entebbe pour la voie aérienne)"
    es: "Confirma la fecha de llegada al veterinario oficial del punto de entrada al menos 3 días antes (Aeropuerto Internacional de Entebbe para la vía aérea)"
    pt: "Confirme a data de chegada ao agente veterinário do porto com pelo menos 3 dias de antecedência (Aeroporto Internacional de Entebbe para viagens aéreas)"
  - en: "Plan for the published 21–30 day post-import quarantine and release after prescribed tests"
    fr: "Prévois la quarantaine post-importation publiée de 21 à 30 jours et la libération après les tests prescrits"
    es: "Cuenta con la cuarentena posterior a la importación publicada de 21 a 30 días y la liberación tras las pruebas prescritas"
    pt: "Planeje-se para a quarentena pós-importação publicada de 21 a 30 dias e para a liberação após os testes prescritos"
  - en: "Original permit and certificates to present at the port of entry; airline reservation and suitable travel crate if travelling in the hold"
    fr: "Permis et certificats originaux à présenter au point d'entrée ; réservation et caisse de transport adaptée si voyage en soute"
    es: "Permiso y certificados originales para presentar en el punto de entrada; reserva de la aerolínea y jaula de transporte adecuada si viaja en bodega"
    pt: "Autorização e certificados originais para apresentar no porto de entrada; reserva na companhia aérea e caixa de transporte adequada às normas IATA em caso de viagem no porão"

