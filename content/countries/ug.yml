  metaTitle: { en: "Taking Your Dog to Uganda: Pet Travel Requirements 2026", fr: "Voyager en Ouganda avec ton chien : formalités (2026)", es: "Viajar a Uganda con tu perro: requisitos de entrada (2026)", pt: "Viajar para Uganda com seu cachorro: exigências de entrada (2026)" }
