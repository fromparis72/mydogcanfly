# Country Entry Guide — Nigeria (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_ng
iso2: "NG"
name: { en: "Nigeria", fr: "Nigéria", es: "Nigeria", pt: "Nigéria" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
exit:
  authority: NAQS
  authorityUrl: https://naqs.gov.ng/
  intro:
    en: "Nigeria is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Nigeria Agricultural Quarantine Service (NAQS)."
    fr: "Le Nigeria est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par le Nigeria Agricultural Quarantine Service (NAQS)."
    es: "Nigeria no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el Nigeria Agricultural Quarantine Service (NAQS)."
    pt: "A Nigéria é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pela Nigeria Agricultural Quarantine Service (NAQS)."
  steps:
    - timing: longlead
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      text:
        en: "NAQS Animal Quarantine performs the export health inspection and certifies the veterinary health certificate, with the Chief Veterinary Officer issuing the export permit."
        fr: "La quarantaine animale de la NAQS réalise l'inspection sanitaire d'export et certifie le certificat sanitaire vétérinaire, le vétérinaire en chef délivrant le permis d'export."
        es: "La cuarentena animal de NAQS realiza la inspección sanitaria de exportación y certifica el certificado sanitario veterinario, con el Jefe de Veterinaria emitiendo el permiso de exportación."
        pt: "A NAQS Animal Quarantine realiza a inspeção sanitária de exportação e certifica o atestado de saúde veterinário, com o Chief Veterinary Officer emitindo a autorização de exportação."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Nigeria with your dog", fr: "Voyager au Nigéria avec ton chien", es: "Viajar a Nigeria con tu perro", pt: "Viajar para a Nigéria com seu cachorro" }
  intro:
    en: >-
      Nigeria admits pet dogs, but entry is controlled by its own veterinary authorities — the Nigeria
      Agricultural Quarantine Service (NAQS) and the Federal Department of Livestock and Pest Control
      Services, both under the Federal Ministry of Agriculture and Food Security. No dog should be
      shipped without an import permit obtained in advance from the Nigerian authorities. Every dog
      must be microchipped, carry a valid rabies vaccination and travel with an official international
      veterinary health certificate endorsed by the exporting country's government vet. On arrival,
      NAQS veterinary officers inspect the dog and its documents at the point of entry. Nigeria is a
      rabies-endemic country and applies its own national scheme rather than the EU framework, so the
      exact steps depend on where your dog is coming from. This guide explains what to prepare before
      you book your flight.
    fr: >-
      Le Nigéria admet les chiens de compagnie, mais l'entrée est contrôlée par ses propres autorités
      vétérinaires — la Nigeria Agricultural Quarantine Service (NAQS) et le Federal Department of
      Livestock and Pest Control Services, tous deux rattachés au ministère fédéral de l'Agriculture et
      de la Sécurité alimentaire. Aucun chien ne doit être expédié sans un permis d'importation obtenu
      à l'avance auprès des autorités nigérianes. Chaque chien doit être identifié par puce, disposer
      d'une vaccination antirabique valide et voyager avec un certificat vétérinaire international
      officiel visé par le vétérinaire gouvernemental du pays d'export. À l'arrivée, les agents
      vétérinaires de la NAQS inspectent le chien et ses documents au point d'entrée. Le Nigéria est un
      pays d'endémie rabique et applique son propre schéma national plutôt que le cadre européen ; les
      étapes exactes dépendent donc du pays d'où vient ton chien. Ce guide détaille quoi préparer
      avant de réserver ton vol.
    es: >-
      Nigeria admite perros de compañía, pero la entrada está controlada por sus propias autoridades
      veterinarias — el Nigeria Agricultural Quarantine Service (NAQS) y el Federal Department of
      Livestock and Pest Control Services, ambos dependientes del Federal Ministry of Agriculture and
      Food Security. Ningún perro debe enviarse sin un permiso de importación obtenido con antelación
      ante las autoridades nigerianas. Todo perro debe llevar microchip, disponer de una vacunación
      antirrábica válida y viajar con un certificado sanitario veterinario internacional oficial
      refrendado por el veterinario gubernamental del país exportador. A la llegada, los agentes
      veterinarios del NAQS inspeccionan al perro y sus documentos en el punto de entrada. Nigeria es un
      país con rabia endémica y aplica su propio esquema nacional en lugar del marco europeo, por lo que
      los pasos exactos dependen del país del que provenga tu perro. Esta guía explica qué preparar
      antes de reservar tu vuelo.

    pt: "A Nigéria admite cachorros de estimação, mas a entrada é controlada por suas próprias autoridades veterinárias — a Nigeria Agricultural Quarantine Service (NAQS) e o Federal Department of Livestock and Pest Control Services, ambos sob o Federal Ministry of Agriculture and Food Security. Nenhum cachorro deve ser embarcado sem uma autorização de importação obtida com antecedência junto às autoridades nigerianas. Todo cachorro deve ter microchip, portar uma vacinação antirrábica válida e viajar com um atestado de saúde veterinário internacional oficial endossado pelo veterinário do governo do país de exportação. Na chegada, os agentes veterinários da NAQS inspecionam o cachorro e seus documentos no ponto de entrada. A Nigéria tem raiva endêmica e aplica seu próprio esquema nacional em vez do quadro da UE, portanto as etapas exatas dependem de onde seu cachorro está vindo. Este guia explica o que preparar antes de você reservar seu voo."
difficulty:
  level: moderate
  label: { en: "Moderate — advance import permit + endorsed certificate", fr: "Modérée — permis d'importation préalable + certificat visé", es: "Moderada — permiso de importación previo + certificado refrendado", pt: "Moderada — autorização de importação prévia + certificado endossado" }

prepTime:
  eu:
    en: "From Europe: allow ~4–6 weeks — the advance import permit is the pacing step, plus a rabies vaccination and a health certificate valid for 30 days."
    fr: "Depuis l'Europe : prévoir ~4 à 6 semaines — le permis d'importation préalable est l'étape déterminante, plus une vaccination antirabique et un certificat sanitaire valable 30 jours."
    es: "Desde Europa: prevé ~4–6 semanas — el permiso de importación previo es el paso que marca el ritmo, más una vacunación antirrábica y un certificado sanitario válido 30 días."
    pt: "Da Europa: reserve ~4 a 6 semanas — a autorização de importação prévia é a etapa que determina o ritmo, além de uma vacinação antirrábica e um atestado de saúde válido por 30 dias."
  listed:
    en: "From a rabies-controlled country (US, Canada, Gulf states…): ~4–6 weeks, driven by the import permit and the endorsed health certificate."
    fr: "Depuis un pays à rage maîtrisée (USA, Canada, pays du Golfe…) : ~4 à 6 semaines, selon le permis et le certificat sanitaire visé."
    es: "Desde un país con rabia controlada (EE. UU., Canadá, países del Golfo…): ~4–6 semanas, según el permiso de importación y el certificado sanitario refrendado."
    pt: "De um país com raiva controlada (EUA, Canadá, países do Golfo…): ~4 a 6 semanas, conforme a autorização de importação e o atestado de saúde endossado."
  nonListed:
    en: "From a high-rabies-risk country: similar base steps, but expect closer scrutiny at the airport; dogs from an area quarantined for rabies may be refused."
    fr: "Depuis un pays à haut risque rabique : mêmes étapes de base, mais contrôle renforcé à l'aéroport ; un chien venant d'une zone en quarantaine rabique peut être refusé."
    es: "Desde un país con alto riesgo de rabia: pasos básicos similares, pero espera un control más estricto en el aeropuerto; los perros procedentes de una zona en cuarentena por rabia pueden ser rechazados."
    pt: "De um país de alto risco de raiva: etapas básicas semelhantes, mas espere um controle mais rigoroso no aeroporto; cachorros vindos de uma área em quarentena por raiva podem ser recusados."

