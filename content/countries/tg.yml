seo:
  title: { en: "Togo Dog Entry Requirements — Travel Guide", fr: "Formalités d'entrée chien au Togo — Guide", es: "Requisitos de entrada de perros en Togo — Guía de viaje", pt: "Exigências de entrada de cachorros no Togo — Guia de viagem" }
  metaTitle: { en: "Traveling to Togo With Your Dog: Entry Requirements (2026)", fr: "Voyager au Togo avec ton chien : formalités (2026)", es: "Viajar a Togo con tu perro: requisitos de entrada (2026)", pt: "Viajar para o Togo com seu cachorro: exigências de entrada (2026)" }
  metaDesc:
