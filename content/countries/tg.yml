notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog, and Togo's veterinary services confirm the exact conditions for entry."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien, et les services vétérinaires togolais confirment les conditions exactes d'entrée."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro, y los servicios veterinarios de Togo confirman las condiciones exactas de entrada."
    pt: "Somente um médico-veterinário pode confirmar o procedimento exato para o seu cachorro, e os serviços veterinários do Togo confirmam as condições exatas de entrada."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Togo (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — le Togo (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Togo (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — o Togo (seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Togo", fr: "Pays de destination — Togo", es: "País de destino — Togo", pt: "País de destino — Togo" }
      text:
        en: "Togo runs its own veterinary scheme under the Ministère de l'Agriculture, de la Pêche, des Ressources Animales et de la Souveraineté Alimentaire. The one procedure published in detail is the international veterinary health certificate covering identification (microchip), a current rabies vaccination and a clinical inspection. There is no EU-style pet passport route, and no personal-pet import-permit form is published."
        fr: "Le Togo applique son propre dispositif vétérinaire sous le Ministère de l'Agriculture, de la Pêche, des Ressources Animales et de la Souveraineté Alimentaire. La seule procédure publiée en détail est le certificat vétérinaire international couvrant l'identification (puce), une vaccination antirabique à jour et une inspection clinique. Il n'existe pas de voie « passeport » de l'UE, ni de formulaire de permis d'importation personnel publié."
        es: "Togo aplica su propio sistema veterinario bajo el Ministère de l'Agriculture, de la Pêche, des Ressources Animales et de la Souveraineté Alimentaire. El único procedimiento publicado en detalle es el certificado sanitario veterinario internacional, que cubre la identificación (microchip), una vacunación antirrábica en vigor y una inspección clínica. No existe una vía de pasaporte para mascotas al estilo de la UE, ni se publica ningún formulario de permiso de importación para mascotas privadas."
        pt: "O Togo aplica o seu próprio dispositivo veterinário sob o Ministère de l'Agriculture, de la Pêche, des Ressources Animales et de la Souveraineté Alimentaire. O único procedimento publicado em detalhe é o certificado veterinário internacional, que cobre a identificação (microchip), uma vacinação antirrábica em dia e uma inspeção clínica. Não existe uma via de passaporte no estilo da UE, nem é publicado nenhum formulário de autorização de importação para animal de estimação pessoal."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The country of departure decides which certificate model your official vet uses and how the rabies vaccination is documented. For the United States, USDA APHIS publishes the exact Togo dog/cat certificate and endorsement process; other origins use their own country's official export certificate, since Togo does not publish a separate model for them."
        fr: "Le pays de départ détermine le modèle de certificat qu'utilise ton vétérinaire officiel et la manière dont la vaccination antirabique est documentée. Pour les États-Unis, l'USDA APHIS publie le certificat chien/chat exact pour le Togo et la procédure d'endossement ; les autres origines utilisent le certificat d'exportation officiel de leur propre pays, le Togo ne publiant pas de modèle distinct pour elles."
        es: "El país de salida determina qué modelo de certificado utiliza tu veterinario oficial y cómo se documenta la vacunación antirrábica. Para Estados Unidos, el USDA APHIS publica el certificado perro/gato exacto para Togo y el proceso de refrendo; los demás orígenes utilizan el certificado de exportación oficial de su propio país, ya que Togo no publica un modelo distinto para ellos."
        pt: "O país de partida determina qual modelo de certificado o seu veterinário oficial usa e como a vacinação antirrábica é documentada. Para os Estados Unidos, o USDA APHIS publica o certificado exato para cachorros/gatos do Togo e o processo de endosso; outras origens usam o certificado de exportação oficial do próprio país, já que o Togo não publica um modelo distinto para elas."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "The dog must originate from premises not quarantined for rabies and not have been exposed to rabies. A recent stay in a higher-risk country can therefore matter to the veterinary services, not only the last airport you fly from. Togo is itself rabies-endemic, so the rabies status attested on the certificate is the focus."
        fr: "Le chien doit provenir d'un établissement non placé en quarantaine pour la rage et ne pas avoir été exposé à la rage. Un séjour récent dans un pays à risque plus élevé peut donc compter pour les services vétérinaires, pas seulement le dernier aéroport de départ. Le Togo étant lui-même endémique pour la rage, c'est le statut rabique attesté sur le certificat qui est au centre."
        es: "El perro debe proceder de instalaciones no puestas en cuarentena por rabia y no haber estado expuesto a la rabia. Por tanto, una estancia reciente en un país de mayor riesgo puede importar a los servicios veterinarios, no solo el último aeropuerto del que sales. El propio Togo tiene rabia endémica, por lo que el foco está en el estado antirrábico acreditado en el certificado."
        pt: "O cachorro precisa vir de instalações não colocadas em quarentena por raiva e não ter sido exposto à raiva. Uma estadia recente em um país de maior risco pode, portanto, importar para os serviços veterinários, não apenas o último aeroporto de onde você parte. O próprio Togo tem raiva endêmica, então o foco está no status antirrábico atestado no certificado."
  note:
    en: "So read the requirements below as Togo's framework, then confirm your dog's exact origin, history and documents with your vet and Togo's veterinary services before booking."
    fr: "Lis donc les exigences ci-dessous comme le cadre togolais, puis confirme l'origine, l'historique et les documents exacts de ton chien avec ton vétérinaire et les services vétérinaires togolais avant de réserver."
    es: "Así que lee los requisitos siguientes como el marco de Togo y luego confirma el origen, el historial y los documentos exactos de tu perro con tu veterinario y los servicios veterinarios de Togo antes de reservar."
    pt: "Portanto, leia as exigências abaixo como o marco do Togo e, depois, confirme a origem exata, o histórico e os documentos do seu cachorro com o seu veterinário e com os serviços veterinários do Togo antes de reservar."

