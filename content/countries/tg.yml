    es: "Normas oficiales para traer un perro a Togo: certificado sanitario veterinario internacional, microchip. Con fuentes y fecha; puntos no publicados señalados."
    pt: "Regras oficiais para levar um cachorro ao Togo: certificado veterinário internacional, microchip. Com fontes e data; pontos não publicados sinalizados."
