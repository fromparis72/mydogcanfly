  - item: { en: "Identification (ISO microchip)", fr: "Identification (puce ISO)", es: "Identificación (microchip ISO)", pt: "Identificação (microchip ISO)" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "The official Togo dog/cat veterinary health certificate identifies each animal by microchip number (box 21), and the accredited vet certifies that the microchip's presence has been verified. An ISO 11784/11785 microchip is therefore the working standard; it must match the certificate and the vaccination record and is also needed for any later return to the EU.", fr: "Le certificat vétérinaire officiel chien/chat pour le Togo identifie chaque animal par son numéro de puce (case 21), et le vétérinaire agréé certifie que la présence de la puce a été vérifiée. Une puce ISO 11784/11785 est donc la norme de travail ; elle doit correspondre au certificat et au carnet de vaccination et est aussi nécessaire pour un éventuel retour ultérieur vers l'UE.", es: "El certificado sanitario veterinario oficial perro/gato para Togo identifica a cada animal por su número de microchip (casilla 21), y el veterinario acreditado certifica que se ha verificado la presencia del microchip. Un microchip ISO 11784/11785 es, por tanto, la norma de trabajo; debe coincidir con el certificado y con el registro de vacunación y también es necesario para un posible regreso posterior a la UE.", pt: "O certificado veterinário oficial para cachorros/gatos do Togo identifica cada animal pelo número do microchip (campo 21), e o veterinário credenciado certifica que a presença do microchip foi verificada. Um microchip ISO 11784/11785 é, portanto, a norma de trabalho; ele precisa corresponder ao certificado e à caderneta de vacinação, e também é necessário para um eventual retorno à UE." }
    exceptions: { en: "None documented on the certificate — the microchip number is a required field.", fr: "Aucune documentée sur le certificat — le numéro de puce est un champ obligatoire.", es: "Ninguna documentada en el certificado — el número de microchip es un campo obligatorio.", pt: "Nenhuma documentada no certificado — o número do microchip é um campo obrigatório." }
    ref: { en: "USDA/APHIS — Veterinary Health Certificate for Export of Dogs and Cats to the Togolese Republic (box 21; certification statement 1)", fr: "USDA/APHIS — Certificat vétérinaire pour l'exportation de chiens et chats vers la République togolaise (case 21 ; mention de certification 1)", es: "USDA/APHIS — Veterinary Health Certificate for Export of Dogs and Cats to the Togolese Republic (casilla 21; declaración de certificación 1)", pt: "USDA/APHIS — Veterinary Health Certificate for Export of Dogs and Cats to the Togolese Republic (campo 21; declaração de certificação 1)" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "The dog must be current on rabies vaccination at the time of export, recorded in the certificate's rabies vaccination table (microchip number, date, vaccine name, batch, end date of validity). Togo is rabies-endemic. The official certificate does not state a fixed minimum interval between vaccination and travel, so confirm the exact timing with your vet and Togo's veterinary services.", fr: "Le chien doit être à jour de sa vaccination antirabique au moment de l'exportation, consignée dans le tableau de vaccination antirabique du certificat (numéro de puce, date, nom du vaccin, lot, date de fin de validité). Le Togo est endémique pour la rage. Le certificat officiel n'indique pas de délai minimal fixe entre la vaccination et le voyage ; confirme le calendrier exact avec ton vétérinaire et les services vétérinaires togolais.", es: "El perro debe estar al día en su vacunación antirrábica en el momento de la exportación, registrada en la tabla de vacunación antirrábica del certificado (número de microchip, fecha, nombre de la vacuna, lote, fecha de fin de valide). Togo tiene rabia endémica. El certificado oficial no indica un intervalo mínimo fijo entre la vacunación y el viaje, así que confirma el calendario exacto con tu veterinario y los servicios veterinarios de Togo.", pt: "O cachorro precisa estar em dia com a vacinação antirrábica no momento da exportação, registrada na tabela de vacinação antirrábica do certificado (número do microchip, data, nome da vacina, lote, data de fim da validade). O Togo tem raiva endêmica. O certificado oficial não indica um intervalo mínimo fixo entre a vacinação e a viagem, então confirme o calendário exato com o seu veterinário e com os serviços veterinários do Togo." }
    exceptions: { en: "A dog too young to be validly vaccinated against rabies cannot meet the requirement.", fr: "Un chien trop jeune pour être valablement vacciné contre la rage ne peut satisfaire l'exigence.", es: "Un perro demasiado joven para estar válidamente vacunado contra la rabia no puede cumplir el requisito.", pt: "Um cachorro jovem demais para ser validamente vacinado contra a raiva não pode cumprir essa exigência." }
    ref: { en: "USDA/APHIS — Togo dog/cat veterinary health certificate (certification statement 4; rabies vaccination table)", fr: "USDA/APHIS — Certificat vétérinaire chien/chat pour le Togo (mention de certification 4 ; tableau de vaccination antirabique)", es: "USDA/APHIS — Certificado sanitario veterinario perro/gato para Togo (declaración de certificación 4; tabla de vacunación antirrábica)", pt: "USDA/APHIS — Togo dog/cat veterinary health certificate (declaração de certificação 4; tabela de vacinação antirrábica)" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not required", fr: "Non requis", es: "No obligatoria", pt: "Não obrigatório" }
    when: { en: "The official Togo veterinary health certificate does not require a rabies antibody test for entry; a current rabies vaccination is what is certified. (A rabies antibody test may still be relevant for a later return to the EU, because Togo is rabies-endemic.)", fr: "Le certificat vétérinaire officiel togolais n'exige pas de titrage des anticorps antirabiques pour l'entrée ; c'est une vaccination antirabique à jour qui est certifiée. (Un titrage peut toutefois rester pertinent pour un retour ultérieur vers l'UE, le Togo étant à rage endémique.)", es: "El certificado sanitario veterinario oficial de Togo no exige una prueba de titulación de rabia para la entrada; lo que se certifica es una vacunación antirrábica en vigor. (Una prueba de titulación de rabia puede seguir siendo relevante para un regreso posterior a la UE, ya que Togo tiene rabia endémica.)", pt: "O certificado veterinário oficial do Togo não exige um teste sorológico antirrábico para a entrada; o que é certificado é uma vacinação antirrábica em dia. (Um teste sorológico antirrábico ainda pode ser relevante para um retorno posterior à UE, já que o Togo tem raiva endêmica.)" }
    exceptions: { en: "None published. Confirm with Togo's veterinary services if your dog travels from an origin with specific conditions.", fr: "Aucune publiée. Vérifie auprès des services vétérinaires togolais si ton chien voyage depuis une origine soumise à des conditions particulières.", es: "Ninguna publicada. Confírmalo con los servicios veterinarios de Togo si tu perro viaja desde un origen sujeto a condiciones particulares.", pt: "Nenhuma publicada. Confirme com os serviços veterinários do Togo se o seu cachorro viaja de uma origem com condições específicas." }
    ref: { en: "USDA/APHIS — Togo dog/cat veterinary health certificate (no antibody-test requirement)", fr: "USDA/APHIS — Certificat vétérinaire chien/chat pour le Togo (aucune exigence de titrage)", es: "USDA/APHIS — Certificado sanitario veterinario perro/gato para Togo (sin exigencia de prueba de titulación)", pt: "USDA/APHIS — Togo dog/cat veterinary health certificate (sem exigência de teste sorológico)" }
  - item: { en: "International veterinary health certificate", fr: "Certificat vétérinaire international", es: "Certificado sanitario veterinario internacional", pt: "Certificado veterinário internacional" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "An international veterinary health certificate must accompany the dog. From the US it is the APHIS-published Togo dog/cat certificate, issued by a USDA-accredited vet (electronic signature accepted) and endorsed by APHIS with an original ink signature and embossment. From other origins, an official vet of the country of origin issues that country's international veterinary certificate, as Togo does not publish its own model; French is convenient for the Togolese administration.", fr: "Un certificat vétérinaire international doit accompagner le chien. Depuis les USA, il s'agit du certificat chien/chat pour le Togo publié par l'APHIS, établi par un vétérinaire agréé USDA (signature électronique acceptée) et endossé par l'APHIS avec une signature à l'encre originale et un embossage. Depuis les autres origines, un vétérinaire officiel du pays d'origine établit le certificat vétérinaire international de ce pays, le Togo ne publiant pas de modèle propre ; le français est commode pour l'administration togolaise.", es: "Un certificado sanitario veterinario internacional debe acompañar al perro. Desde EE. UU. es el certificado perro/gato para Togo publicado por el APHIS, expedido por un veterinario acreditado por el USDA (se acepta firma electrónica) y refrendado por el APHIS con una firma a tinta original y un sello en relieve. Desde otros orígenes, un veterinario oficial del país de origen expide el certificado veterinario internacional de ese país, ya que Togo no publica un modelo propio; el francés resulta cómodo para la administración togolesa.", pt: "Um certificado veterinário internacional precisa acompanhar o cachorro. Dos EUA, é o certificado para cachorros/gatos do Togo publicado pelo APHIS, emitido por um veterinário credenciado pelo USDA (assinatura eletrônica aceita) e endossado pelo APHIS com uma assinatura original a tinta e selo em relevo. De outras origens, um veterinário oficial do país de origem emite o certificado veterinário internacional desse país, já que o Togo não publica um modelo próprio; o francês é conveniente para a administração togolesa." }
    exceptions: { en: "None — an official certificate must accompany the dog and be presented with the vaccination record.", fr: "Aucune — un certificat officiel doit accompagner le chien et être présenté avec le carnet de vaccination.", es: "Ninguna — un certificado oficial debe acompañar al perro y presentarse junto con el registro de vacunación.", pt: "Nenhuma — um certificado oficial deve acompanhar o cachorro e ser apresentado junto com a caderneta de vacinação." }
    ref: { en: "USDA/APHIS — Pet Travel From the United States to Togo (electronic signature accepted; original ink endorsement required); Togo dog/cat veterinary health certificate", fr: "USDA/APHIS — Voyage d'un animal des États-Unis vers le Togo (signature électronique acceptée ; endossement à l'encre original requis) ; certificat vétérinaire chien/chat pour le Togo", es: "USDA/APHIS — Pet Travel From the United States to Togo (se acepta firma electrónica; se exige refrendo original a tinta); certificado sanitario veterinario perro/gato para Togo", pt: "USDA/APHIS — Pet Travel From the United States to Togo (assinatura eletrônica aceita; endosso original a tinta exigido); Togo dog/cat veterinary health certificate" }
  - item: { en: "Clinical examination & health statements", fr: "Examen clinique et attestations sanitaires", es: "Examen clínico y declaraciones sanitarias", pt: "Exame clínico e declarações de saúde" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "On inspection, the dog is certified free of any infectious or contagious disease (and, to the vet's knowledge, exposure thereto, including rabies), originating from premises not quarantined for rabies and not exposed to rabies, and current on rabies vaccination.", fr: "À l'examen, le chien est certifié indemne de toute maladie infectieuse ou contagieuse (et, à la connaissance du vétérinaire, d'exposition à celles-ci, y compris la rage), provenant d'un établissement non placé en quarantaine pour la rage et non exposé à la rage, et à jour de sa vaccination antirabique.", es: "En la inspección, se certifica que el perro está libre de cualquier enfermedad infecciosa o contagiosa (y, según el conocimiento del veterinario, de exposición a ellas, incluida la rabia), que procede de instalaciones no puestas en cuarentena por rabia y no expuestas a la rabia, y que está al día de su vacunación antirrábica.", pt: "Na inspeção, certifica-se que o cachorro está livre de qualquer doença infecciosa ou contagiosa (e, ao conhecimento do veterinário, de exposição a elas, incluindo a raiva), vindo de instalações não colocadas em quarentena por raiva e não expostas à raiva, e em dia com a vacinação antirrábica." }
    exceptions: { en: "None.", fr: "Aucune.", es: "Ninguna.", pt: "Nenhuma." }
    ref: { en: "USDA/APHIS — Togo dog/cat veterinary health certificate (certification statements 2–4)", fr: "USDA/APHIS — Certificat vétérinaire chien/chat pour le Togo (mentions de certification 2 à 4)", es: "USDA/APHIS — Certificado sanitario veterinario perro/gato para Togo (declaraciones de certificación 2 a 4)", pt: "USDA/APHIS — Togo dog/cat veterinary health certificate (declarações de certificação 2 a 4)" }
  - item: { en: "Parasite / tapeworm treatment", fr: "Traitement antiparasitaire / échinocoque", es: "Tratamiento antiparasitario / contra la tenia", pt: "Tratamento antiparasitário / contra tênias" }
    required: { en: "Not published", fr: "Non communiqué", es: "No comunicado", pt: "Não publicado" }
    when: { en: "No mandatory internal or external parasite treatment for a pet dog is set out on Togo's official certificate. A vet may still recommend it as good practice for a rabies-endemic, tropical destination.", fr: "Aucun traitement antiparasitaire interne ou externe obligatoire pour un chien de compagnie n'est prévu sur le certificat officiel togolais. Un vétérinaire peut néanmoins le recommander comme bonne pratique pour une destination tropicale endémique pour la rage.", es: "El certificado oficial de Togo no establece ningún tratamiento antiparasitario interno o externo obligatorio para un perro de compañía. Aun así, un veterinario puede recomendarlo como buena práctica para un destino tropical con rabia endémica.", pt: "Nenhum tratamento antiparasitário interno ou externo obrigatório para um cachorro de estimação é previsto no certificado oficial do Togo. Um veterinário ainda pode recomendá-lo como boa prática para um destino tropical com raiva endêmica." }
    exceptions: { en: "Unknown — confirm any requirement with Togo's veterinary services.", fr: "Non communiqué — confirme toute exigence auprès des services vétérinaires togolais.", es: "No comunicado — confirma cualquier requisito con los servicios veterinarios de Togo.", pt: "Não comunicado — confirme qualquer exigência com os serviços veterinários do Togo." }
    ref: { en: "No parasite-treatment requirement on the USDA/APHIS Togo dog/cat certificate", fr: "Aucune exigence de traitement antiparasitaire sur le certificat chien/chat USDA/APHIS pour le Togo", es: "Sin exigencia de tratamiento antiparasitario en el certificado perro/gato USDA/APHIS para Togo", pt: "Nenhuma exigência de tratamento antiparasitário no certificado USDA/APHIS para cachorros/gatos do Togo" }
  - item: { en: "Import authorization / advance notification", fr: "Autorisation d'importation / notification préalable", es: "Autorización de importación / notificación previa", pt: "Autorização de importação / notificação prévia" }
    required: { en: "Not published for private pets", fr: "Non communiquée pour les animaux privés", es: "No publicada para mascotas privadas", pt: "Não publicada para animais de estimação privados" }
    when: { en: "APHIS publishes no import-permit step for a pet dog to Togo — only the veterinary health certificate. Togo's own commercial framework treats live animals as 'sensitive products': a business importer needs a prior import declaration certificate from the Ministère du Commerce and, among the required documents, an import authorization signed by the Minister in charge of animal and fishery production. This is a commercial regime (business registration, fees, local-purchase quota) and is not published as a rule for a private traveller's pet, so any personal-pet notification should be confirmed with Togo's veterinary services.", fr: "L'APHIS ne publie aucune étape de permis d'importation pour un chien de compagnie vers le Togo — seulement le certificat vétérinaire. Le cadre commercial togolais classe les animaux vivants parmi les « produits sensibles » : un importateur professionnel doit obtenir un certificat de déclaration préalable d'importation auprès du Ministère du Commerce et, parmi les pièces exigées, une autorisation d'importation signée par le Ministre chargé de la production animale et halieutique. Il s'agit d'un régime commercial (enregistrement d'entreprise, frais, quota d'achat local) et non d'une règle publiée pour l'animal d'un voyageur privé ; toute notification pour un animal de compagnie personnel est donc à confirmer auprès des services vétérinaires togolais.", es: "El APHIS no publica ningún paso de permiso de importación para un perro de compañía hacia Togo — solo el certificado sanitario veterinario. El propio marco comercial de Togo clasifica los animales vivos como «productos sensibles»: un importador profesional necesita un certificado de declaración previa de importación del Ministère du Commerce y, entre los documentos exigidos, una autorización de importación firmada por el Ministro encargado de la producción animal y pesquera. Se trata de un régimen comercial (registro de empresa, tasas, cuota de compra local) y no de una norma publicada para la mascota de un viajero privado, por lo que cualquier notificación de mascota personal debe confirmarse con los servicios veterinarios de Togo.", pt: "O APHIS não publica nenhuma etapa de autorização de importação para um cachorro de estimação com destino ao Togo — apenas o certificado veterinário. O próprio marco comercial do Togo trata os animais vivos como \"produtos sensíveis\": um importador empresarial precisa de um certificado de declaração prévia de importação junto ao Ministère du Commerce e, entre os documentos exigidos, uma autorização de importação assinada pelo Ministro responsável pela produção animal e pesqueira. Trata-se de um regime comercial (registro de empresa, taxas, cota de compra local) e não é publicado como regra para o animal de um viajante privado, então qualquer notificação para um animal de estimação pessoal deve ser confirmada com os serviços veterinários do Togo." }
    exceptions: { en: "Unknown for a private pet — no personal-pet import-permit form is published.", fr: "Non communiqué pour un animal privé — aucun formulaire de permis d'importation personnel n'est publié.", es: "No comunicado para una mascota privada — no se publica ningún formulario de permiso de importación para mascotas personales.", pt: "Não comunicado para um animal de estimação privado — nenhum formulário de autorização de importação pessoal é publicado." }
    ref: { en: "Service-Public Togo — Certificat de déclaration préalable d'importation des produits sensibles (live animals; import authorization signed by the Minister of animal & fishery production)", fr: "Service-Public Togo — Certificat de déclaration préalable d'importation des produits sensibles (animaux vivants ; autorisation d'importation signée par le Ministre de la production animale et halieutique)", es: "Service-Public Togo — Certificat de déclaration préalable d'importation des produits sensibles (animales vivos; autorización de importación firmada por el Ministro de producción animal y pesquera)", pt: "Service-Public Togo — Certificat de déclaration préalable d'importation des produits sensibles (animais vivos; autorização de importação assinada pelo Ministro da produção animal e pesqueira)" }
  - item: { en: "Airport / border veterinary inspection & customs", fr: "Inspection vétérinaire aéroport / frontière et douane", es: "Inspección veterinaria en aeropuerto / frontera y aduanas", pt: "Inspeção veterinária no aeroporto / na fronteira e alfândega" }
    required: { en: "Not published in detail", fr: "Non communiquée en détail", es: "No publicada en detalle", pt: "Não publicado em detalhe" }
    when: { en: "Pets normally arrive by air at Lomé–Tokoin (Gnassingbé Eyadéma) International Airport. Togo's veterinary services and customs (Office Togolais des Recettes, OTR) oversee imports of live animals, so expect your dog and its documents to be presented on arrival. The exact steps and fees for a private pet are not published in detail — confirm with Togo's veterinary services.", fr: "Les animaux de compagnie arrivent normalement par avion à l'aéroport international de Lomé–Tokoin (Gnassingbé Eyadéma). Les services vétérinaires togolais et la douane (Office Togolais des Recettes, OTR) encadrent l'importation des animaux vivants ; attends-toi donc à présenter ton chien et ses documents à l'arrivée. Les étapes et frais exacts pour un animal privé ne sont pas publiés en détail — à confirmer auprès des services vétérinaires togolais.", es: "Las mascotas suelen llegar por avión al Aeropuerto Internacional de Lomé–Tokoin (Gnassingbé Eyadéma). Los servicios veterinarios de Togo y las aduanas (Office Togolais des Recettes, OTR) supervisan las importaciones de animales vivos, así que espera tener que presentar a tu perro y sus documentos a la llegada. Los pasos y las tasas exactos para una mascota privada no se publican en detalle — confírmalo con los servicios veterinarios de Togo.", pt: "Os animais de estimação normalmente chegam por via aérea ao Aeroporto Internacional de Lomé–Tokoin (Gnassingbé Eyadéma). Os serviços veterinários do Togo e a alfândega (Office Togolais des Recettes, OTR) supervisionam as importações de animais vivos, então espere apresentar o seu cachorro e seus documentos na chegada. As etapas exatas e as taxas para um animal de estimação privado não são publicadas em detalhe — confirme com os serviços veterinários do Togo." }
    exceptions: { en: "Unknown — exact airport procedure for a personal pet is not published.", fr: "Non communiqué — la procédure aéroportuaire exacte pour un animal personnel n'est pas publiée.", es: "No comunicado — el procedimiento aeroportuario exacto para una mascota personal no se publica.", pt: "Não comunicado — o procedimento exato no aeroporto para um animal de estimação pessoal não é publicado." }
    ref: { en: "Office Togolais des Recettes (OTR) — customs; Ministère de l'Agriculture, de la Pêche, des Ressources Animales et de la Souveraineté Alimentaire (veterinary services)", fr: "Office Togolais des Recettes (OTR) — douane ; Ministère de l'Agriculture, de la Pêche, des Ressources Animales et de la Souveraineté Alimentaire (services vétérinaires)", es: "Office Togolais des Recettes (OTR) — aduanas; Ministère de l'Agriculture, de la Pêche, des Ressources Animales et de la Souveraineté Alimentaire (servicios veterinarios)", pt: "Office Togolais des Recettes (OTR) — alfândega; Ministère de l'Agriculture, de la Pêche, des Ressources Animales et de la Souveraineté Alimentaire (serviços veterinários)" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Not published (linked to rabies vaccination)", fr: "Non communiqué (lié à la vaccination antirabique)", es: "No comunicada (ligada a la vacunación antirrábica)", pt: "Não publicado (vinculado à vacinação antirrábica)" }
    when: { en: "No stand-alone minimum age is published by Togo. In practice a puppy must be old enough to be validly vaccinated against rabies and to meet the certificate's rabies statement.", fr: "Aucun âge minimum distinct n'est publié par le Togo. En pratique, un chiot doit être en âge d'être valablement vacciné contre la rage et de satisfaire à la mention antirabique du certificat.", es: "Togo no publica ninguna edad mínima independiente. En la práctica, un cachorro debe tener edad suficiente para estar válidamente vacunado contra la rabia y cumplir la declaración antirrábica del certificado.", pt: "O Togo não publica uma idade mínima independente. Na prática, um filhote precisa ter idade suficiente para ser validamente vacinado contra a raiva e para cumprir a declaração antirrábica do certificado." }
    exceptions: { en: "A puppy too young to be vaccinated against rabies cannot meet the requirement.", fr: "Un chiot trop jeune pour être vacciné contre la rage ne peut satisfaire l'exigence.", es: "Un cachorro demasiado joven para ser vacunado contra la rabia no puede cumplir el requisito.", pt: "Um filhote jovem demais para ser vacinado contra a raiva não pode cumprir essa exigência." }
    ref: { en: "No minimum-age rule found in official Togo sources; USDA/APHIS Togo dog/cat certificate (rabies statement)", fr: "Aucune règle d'âge minimum trouvée dans les sources officielles togolaises ; certificat chien/chat USDA/APHIS pour le Togo (mention antirabique)", es: "No se ha encontrado ninguna norma de edad mínima en las fuentes oficiales de Togo; certificado perro/gato USDA/APHIS para Togo (declaración antirrábica)", pt: "Nenhuma regra de idade mínima encontrada em fontes oficiais do Togo; USDA/APHIS Togo dog/cat certificate (declaração antirrábica)" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not specified", fr: "Non prévue", es: "No prevista", pt: "Não especificada" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "No quarantine is set out in Togo's official documents for a compliant pet dog; non-compliant animals may be held under veterinary control at the border.", fr: "Aucune quarantaine n'est prévue dans les documents officiels togolais pour un chien de compagnie conforme ; les animaux non conformes peuvent être placés sous contrôle vétérinaire à la frontière.", es: "Los documentos oficiales de Togo no prevén ninguna cuarentena para un perro de compañía que cumpla las normas; los animales que no las cumplan pueden quedar bajo control veterinario en la frontera.", pt: "Nenhuma quarentena é prevista nos documentos oficiais do Togo para um cachorro de estimação em conformidade; animais em situação irregular podem ser retidos sob controle veterinário na fronteira." }
    ref: { en: "No quarantine requirement found in official Togo sources / USDA-APHIS Togo certificate", fr: "Aucune exigence de quarantaine trouvée dans les sources officielles togolaises / le certificat USDA-APHIS pour le Togo", es: "No se ha encontrado ninguna exigencia de cuarentena en las fuentes oficiales de Togo / el certificado USDA-APHIS para Togo", pt: "Nenhuma exigência de quarentena encontrada em fontes oficiais do Togo / no certificado USDA-APHIS do Togo" }
