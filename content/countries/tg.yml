origin:
  eu:
    title: { en: "From the European Union", fr: "Depuis l'Union européenne", es: "Desde la Unión Europea", pt: "Da União Europeia" }
    body:
      en: "For a dog leaving the EU, there is no EU pet-passport shortcut into Togo, which is a non-EU third country. You travel with an international veterinary health certificate issued by an official vet of the country of origin, covering a verified microchip, a current rabies vaccination and clinical health, with the dog originating from premises not quarantined for rabies. Togo does not publish its own certificate model for EU origins, so your official vet uses your country's export certificate; French is convenient for the Togolese administration."
      fr: "Pour un chien quittant l'UE, il n'existe pas de raccourci « passeport UE » vers le Togo, pays tiers hors UE. Tu voyages avec un certificat vétérinaire international établi par un vétérinaire officiel du pays d'origine, couvrant une puce vérifiée, une vaccination antirabique à jour et l'état clinique, le chien provenant d'un établissement non placé en quarantaine pour la rage. Le Togo ne publie pas de modèle propre pour les origines UE ; ton vétérinaire officiel utilise donc le certificat d'exportation de ton pays ; le français est commode pour l'administration togolaise."
      es: "Para un perro que sale de la UE, no existe un atajo de pasaporte europeo para mascotas hacia Togo, que es un país tercero fuera de la UE. Viajas con un certificado sanitario veterinario internacional expedido por un veterinario oficial del país de origen, que cubre un microchip verificado, una vacunación antirrábica en vigor y el estado clínico, con el perro procedente de instalaciones no puestas en cuarentena por rabia. Togo no publica un modelo de certificado propio para orígenes de la UE, por lo que tu veterinario oficial utiliza el certificado de exportación de tu país; el francés resulta cómodo para la administración togolesa."
      pt: "Para um cachorro que sai da UE, não existe um atalho de passaporte europeu para entrar no Togo, que é um país terceiro fora da UE. Você viaja com um certificado veterinário internacional emitido por um veterinário oficial do país de origem, cobrindo um microchip verificado, uma vacinação antirrábica em dia e a saúde clínica, com o cachorro vindo de instalações não colocadas em quarentena por raiva. O Togo não publica um modelo de certificado próprio para origens da UE, então o seu veterinário oficial usa o certificado de exportação do seu país; o francês é conveniente para a administração togolesa."
    cls: warn
  listed:
    title: { en: "From the United States & other third countries", fr: "Depuis les États-Unis et autres pays tiers", es: "Desde Estados Unidos y otros países terceros", pt: "Dos Estados Unidos e de outros países terceiros" }
    body:
      en: "From the US, USDA APHIS publishes the exact 'Veterinary Health Certificate for Export of Dogs and Cats to the Togolese Republic.' A USDA-accredited vet verifies the microchip, certifies the health statements and records a current rabies vaccination; the certificate is submitted through VEHCS with an accepted electronic signature, then APHIS provides the original ink-signed, embossed endorsement that must travel with the dog. Other third countries follow the same logic using their own official export certificate."
      fr: "Depuis les USA, l'USDA APHIS publie le « Certificat vétérinaire pour l'exportation de chiens et chats vers la République togolaise » exact. Un vétérinaire agréé USDA vérifie la puce, certifie les mentions sanitaires et consigne une vaccination antirabique à jour ; le certificat est soumis via VEHCS avec une signature électronique acceptée, puis l'APHIS fournit l'endossement original signé à l'encre et embossé qui doit accompagner le chien. Les autres pays tiers suivent la même logique avec leur propre certificat d'exportation officiel."
      es: "Desde EE. UU., el USDA APHIS publica el «Veterinary Health Certificate for Export of Dogs and Cats to the Togolese Republic» exacto. Un veterinario acreditado por el USDA verifica el microchip, certifica las declaraciones sanitarias y registra una vacunación antirrábica en vigor; el certificado se presenta a través de VEHCS con una firma electrónica aceptada, y después el APHIS proporciona el refrendo original firmado a tinta y con sello en relieve que debe viajar con el perro. Los demás países terceros siguen la misma lógica usando su propio certificado de exportación oficial."
      pt: "Dos EUA, o USDA APHIS publica exatamente o \"Veterinary Health Certificate for Export of Dogs and Cats to the Togolese Republic\". Um veterinário credenciado pelo USDA verifica o microchip, certifica as declarações de saúde e registra uma vacinação antirrábica em dia; o certificado é enviado pelo VEHCS com uma assinatura eletrônica aceita, e depois o APHIS fornece o endosso original assinado a tinta e com selo em relevo, que precisa viajar com o cachorro. Outros países terceiros seguem a mesma lógica usando o seu próprio certificado de exportação oficial."
    cls: warn
  nonListed:
    title: { en: "From a rabies-endemic or other origin", fr: "Depuis une origine endémique pour la rage ou autre", es: "Desde un origen con rabia endémica u otro", pt: "De uma origem de raiva endêmica ou outra" }
    body:
      en: "The core process does not change: a verified microchip, a current rabies vaccination and an international veterinary certificate from the country of origin, with the dog originating from premises not quarantined for rabies. Because Togo is itself rabies-endemic, the veterinary authorities focus on the rabies status of the dog and its origin. Since much of the fine detail is unpublished, confirm every additional condition directly with Togo's veterinary services before you travel."
      fr: "Le processus de base ne change pas : une puce vérifiée, une vaccination antirabique à jour et un certificat vétérinaire international du pays d'origine, le chien provenant d'un établissement non placé en quarantaine pour la rage. Le Togo étant lui-même endémique pour la rage, les autorités vétérinaires se concentrent sur le statut rabique du chien et de son origine. Beaucoup de détails n'étant pas publiés, confirme chaque condition supplémentaire directement auprès des services vétérinaires togolais avant de voyager."
      es: "El proceso básico no cambia: un microchip verificado, una vacunación antirrábica en vigor y un certificado veterinario internacional del país de origen, con el perro procedente de instalaciones no puestas en cuarentena por rabia. Como el propio Togo tiene rabia endémica, las autoridades veterinarias se centran en el estado antirrábico del perro y de su origen. Dado que gran parte del detalle fino no está publicado, confirma cada condición adicional directamente con los servicios veterinarios de Togo antes de viajar."
      pt: "O processo básico não muda: um microchip verificado, uma vacinação antirrábica em dia e um certificado veterinário internacional do país de origem, com o cachorro vindo de instalações não colocadas em quarentena por raiva. Como o próprio Togo tem raiva endêmica, as autoridades veterinárias focam no status antirrábico do cachorro e da sua origem. Como muitos detalhes finos não são publicados, confirme cada condição adicional diretamente com os serviços veterinários do Togo antes de viajar."
    cls: neutral

arrival:
  intro:
    en: "What happens when your dog reaches Togo depends on the documents you carry."
    fr: "Ce qui se passe à l'arrivée de ton chien au Togo dépend des documents que tu présente."
    es: "Lo que ocurre cuando tu perro llega a Togo depende de los documentos que lleves."
    pt: "O que acontece quando o seu cachorro chega ao Togo depende dos documentos que você leva."
  points:
    - en: "Pets normally arrive by air at Lomé–Tokoin (Gnassingbé Eyadéma) International Airport, where Togo's veterinary services and customs (OTR) oversee imported live animals."
      fr: "Les animaux de compagnie arrivent normalement par avion à l'aéroport international de Lomé–Tokoin (Gnassingbé Eyadéma), où les services vétérinaires togolais et la douane (OTR) encadrent les animaux vivants importés."
      es: "Las mascotas suelen llegar por avión al Aeropuerto Internacional de Lomé–Tokoin (Gnassingbé Eyadéma), donde los servicios veterinarios de Togo y las aduanas (OTR) supervisan los animales vivos importados."
      pt: "Os animais de estimação normalmente chegam por via aérea ao Aeroporto Internacional de Lomé–Tokoin (Gnassingbé Eyadéma), onde os serviços veterinários do Togo e a alfândega (OTR) supervisionam os animais vivos importados."
    - en: "Carry the originals: the international veterinary health certificate (from the US, the APHIS-endorsed ink-signed original) and the rabies vaccination record."
      fr: "Munis-toi des originaux : le certificat vétérinaire international (depuis les USA, l'original signé à l'encre et endossé par l'APHIS) et le carnet de vaccination antirabique."
      es: "Lleva los originales: el certificado sanitario veterinario internacional (desde EE. UU., el original firmado a tinta y refrendado por el APHIS) y el registro de vacunación antirrábica."
      pt: "Leve os originais: o certificado veterinário internacional (dos EUA, o original assinado a tinta e endossado pelo APHIS) e a caderneta de vacinação antirrábica."
    - en: "Documents must be consistent — the microchip number, vaccination and health statements must match across the certificate and the vaccination record."
      fr: "Les documents doivent être cohérents — le numéro de puce, la vaccination et les mentions sanitaires doivent concorder entre le certificat et le carnet de vaccination."
      es: "Los documentos deben ser coherentes — el número de microchip, la vacunación y las declaraciones sanitarias deben coincidir entre el certificado y el registro de vacunación."
      pt: "Os documentos precisam ser consistentes — o número do microchip, a vacinação e as declarações de saúde precisam coincidir entre o certificado e a caderneta de vacinação."
    - en: "If documents are missing, invalid or inconsistent, the animal may be refused, returned or held under veterinary control at the owner's expense."
      fr: "Si les documents manquent, sont invalides ou incohérents, l'animal peut être refusé, renvoyé ou placé sous contrôle vétérinaire aux frais du propriétaire."
      es: "Si faltan documentos, no son válidos o son incoherentes, el animal puede ser rechazado, devuelto o retenido bajo control veterinario a cargo del propietario."
      pt: "Se os documentos estiverem incompletos, inválidos ou inconsistentes, o animal pode ser recusado, devolvido ou retido sob controle veterinário às custas do proprietário."
    - en: "Exact airport steps and fees for a personal pet are not published in detail — confirm with Togo's veterinary services before you travel."
      fr: "Les étapes et frais exacts à l'aéroport pour un animal de compagnie personnel ne sont pas publiés en détail — à confirmer auprès des services vétérinaires togolais avant de voyager."
      es: "Los pasos y las tasas exactos en el aeropuerto para una mascota personal no se publican en detalle — confírmalo con los servicios veterinarios de Togo antes de viajar."
      pt: "As etapas exatas no aeroporto e as taxas para um animal de estimação pessoal não são publicadas em detalhe — confirme com os serviços veterinários do Togo antes de viajar."

travellerExperience: null

restrictedDogs:
  intro:
    en: "No national breed-specific import ban for dogs was found in the official sources of Togo's veterinary services or the Ministère de l'Agriculture, de la Pêche, des Ressources Animales et de la Souveraineté Alimentaire. Entry to Togo is controlled through the veterinary health certificate and the rabies requirements, not through a published list of prohibited breeds."
    fr: "Aucune interdiction d'importation nationale par race de chien n'a été trouvée dans les sources officielles des services vétérinaires togolais ou du Ministère de l'Agriculture, de la Pêche, des Ressources Animales et de la Souveraineté Alimentaire. L'entrée au Togo est encadrée par le certificat vétérinaire et les exigences antirabiques, non par une liste publiée de races interdites."
    es: "No se ha encontrado ninguna prohibición nacional de importación por raza de perro en las fuentes oficiales de los servicios veterinarios de Togo ni del Ministère de l'Agriculture, de la Pêche, des Ressources Animales et de la Souveraineté Alimentaire. La entrada a Togo se controla mediante el certificado sanitario veterinario y los requisitos antirrábicos, no mediante una lista publicada de razas prohibidas."
    pt: "Nenhuma proibição nacional de importação por raça de cachorro foi encontrada nas fontes oficiais dos serviços veterinários do Togo nem do Ministère de l'Agriculture, de la Pêche, des Ressources Animales et de la Souveraineté Alimentaire. A entrada no Togo é controlada por meio do certificado veterinário e das exigências antirrábicas, não por uma lista publicada de raças proibidas."
  cat1:
    en: "No official list of prohibited dog breeds and no national breed-specific import ban was located in Togolese government publications. This is the absence of a published rule, not a confirmation that any breed is guaranteed admissible."
    fr: "Aucune liste officielle de races de chiens interdites ni interdiction d'importation nationale par race n'a été trouvée dans les publications du gouvernement togolais. Il s'agit de l'absence d'une règle publiée, non d'une confirmation qu'une race serait garantie admissible."
    es: "No se ha localizado ninguna lista oficial de razas de perros prohibidas ni ninguna prohibición nacional de importación por raza en las publicaciones del gobierno togolés. Se trata de la ausencia de una norma publicada, no de una confirmación de que alguna raza sea admisible con garantías."
    pt: "Nenhuma lista oficial de raças de cachorro proibidas nem proibição nacional de importação por raça foi localizada nas publicações do governo togolês. Isso é a ausência de uma regra publicada, não uma confirmação de que alguma raça tenha admissão garantida."
  cat2:
    en: "Because national legislation can change and local rules may exist, confirm the status of your specific breed with Togo's veterinary services before you travel, especially for guard or fighting-type dogs."
    fr: "La législation nationale pouvant évoluer et des règles locales pouvant exister, confirme le statut de ta race précise auprès des services vétérinaires togolais avant de voyager, en particulier pour les chiens de garde ou de type combat."
    es: "Dado que la legislación nacional puede cambiar y pueden existir normas locales, confirma el estatus de tu raza concreta con los servicios veterinarios de Togo antes de viajar, especialmente para perros de guarda o de tipo combate."
    pt: "Como a legislação nacional pode mudar e podem existir regras locais, confirme a situação da sua raça específica com os serviços veterinários do Togo antes de viajar, especialmente para cachorros de guarda ou de tipo combate."
  note:
    en: "Treat any breed question as unresolved until Togo's veterinary services confirm it in writing."
    fr: "Considère toute question de race comme non tranchée tant que les services vétérinaires togolais ne l'ont pas confirmée par écrit."
    es: "Considera cualquier cuestión de raza como no resuelta hasta que los servicios veterinarios de Togo lo confirmen por escrito."
    pt: "Trate qualquer dúvida sobre raça como não resolvida até que os serviços veterinários do Togo a confirmem por escrito."

checklist:
  - en: "ISO microchip in place and matching all documents (required field on the official certificate)"
    fr: "Puce ISO posée et concordant avec tous les documents (champ obligatoire du certificat officiel)"
    es: "Microchip ISO implantado y coincidente con todos los documentos (campo obligatorio del certificado oficial)"
    pt: "Microchip ISO implantado e correspondente a todos os documentos (campo obrigatório no certificado oficial)"
  - en: "Valid rabies vaccination, current at export and correctly recorded (confirm the exact timing with your vet)"
    fr: "Vaccination antirabique valide, à jour au départ et correctement consignée (confirme le calendrier exact avec ton vétérinaire)"
    es: "Vacunación antirrábica válida, en vigor en el momento de la exportación y correctamente registrada (confirma el calendario exacto con tu veterinario)"
    pt: "Vacinação antirrábica válida, em dia no momento da exportação e corretamente registrada (confirme o calendário exato com o seu veterinário)"
  - en: "International veterinary health certificate from an official vet of the country of origin (French is convenient)"
    fr: "Certificat vétérinaire international d'un vétérinaire officiel du pays d'origine (le français est commode)"
    es: "Certificado sanitario veterinario internacional de un veterinario oficial del país de origen (el francés resulta cómodo)"
    pt: "Certificado veterinário internacional de um veterinário oficial do país de origem (o francês é conveniente)"
  - en: "From the US: APHIS-published Togo dog/cat certificate, issued in VEHCS and endorsed by APHIS with an original ink signature and embossment"
    fr: "Depuis les USA : certificat chien/chat pour le Togo publié par l'APHIS, établi dans VEHCS et endossé par l'APHIS avec signature à l'encre originale et embossage"
    es: "Desde EE. UU.: certificado perro/gato para Togo publicado por el APHIS, expedido en VEHCS y refrendado por el APHIS con firma a tinta original y sello en relieve"
    pt: "Dos EUA: certificado para cachorros/gatos do Togo publicado pelo APHIS, emitido no VEHCS e endossado pelo APHIS com assinatura original a tinta e selo em relevo"
  - en: "Original documents ready for veterinary and customs checks at Lomé airport"
    fr: "Documents originaux prêts pour les contrôles vétérinaire et douanier à l'aéroport de Lomé"
    es: "Documentos originales listos para los controles veterinario y aduanero en el aeropuerto de Lomé"
    pt: "Documentos originais prontos para as verificações veterinária e alfandegária no aeroporto de Lomé"
  - en: "Confirm any breed, minimum age, notification or additional condition with Togo's veterinary services before booking"
    fr: "Confirme toute question de race, d'âge minimum, de notification ou condition supplémentaire auprès des services vétérinaires togolais avant de réserver"
    es: "Confirma cualquier cuestión de raza, edad mínima, notificación o condición adicional con los servicios veterinarios de Togo antes de reservar"
    pt: "Confirme qualquer questão de raça, idade mínima, notificação ou condição adicional com os serviços veterinários do Togo antes de reservar"
  - en: "Airline reservation confirming your dog's travel option and suitable IATA crate"
    fr: "Réservation confirmant l'option de transport de ton chien et caisse IATA adaptée"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y jaula IATA adecuada"
    pt: "Reserva na companhia aérea confirmando a opção de transporte do seu cachorro e caixa de transporte adequada às normas da IATA"

