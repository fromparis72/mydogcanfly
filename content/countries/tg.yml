# Country Entry Guide — Togo / Togo (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_tg
iso2: "TG"
name: { en: "Togo", fr: "Togo", es: "Togo", pt: "Togo" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
exit:
  authority: Direction de l'Élevage (MAPRASA)
  authorityUrl: https://agriculture.gouv.tg
  intro:
    en: "Togo is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the veterinary services of the Direction de l'Élevage (MAPRASA)."
    fr: "Le Togo est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par les services vétérinaires de la Direction de l'Élevage (MAPRASA)."
    es: "Togo no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por los servicios veterinarios de la Direction de l'Élevage (MAPRASA)."
    pt: "O Togo não é um país listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para retornar à UE — além de um certificado veterinário de exportação endossado pelos serviços veterinários da Direction de l'Élevage (MAPRASA)."
  steps:
    - timing: longlead
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico (titulação): exame de sangue em um laboratório aprovado pela UE, pelo menos 30 dias após a vacinação — um resultado válido é essencial para retornar à UE e não pode ser resolvido de última hora."
    - timing: window
      text:
        en: "The Direction de l'Élevage's veterinary services endorse the export health certificate before departure."
        fr: "Les services vétérinaires de la Direction de l'Élevage visent le certificat sanitaire d'export avant le départ."
        es: "Los servicios veterinarios de la Direction de l'Élevage refrendan el certificado sanitario de exportación antes de salir."
        pt: "Os serviços veterinários da Direction de l'Élevage endossam o certificado veterinário de exportação antes da partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico (titulação) da UE válido antes de sair, ele continua válido por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Togo with your dog", fr: "Voyager au Togo avec ton chien", es: "Viajar a Togo con tu perro", pt: "Viajar para o Togo com seu cachorro" }
  intro:
    en: >-
      Togo welcomes pet dogs, but entry runs through the country's own veterinary scheme, overseen by
      the livestock and veterinary services of the Ministère de l'Agriculture, de la Pêche, des
      Ressources Animales et de la Souveraineté Alimentaire, not the EU framework. The one procedure
      that is officially published in detail is the international veterinary health certificate: for
      dogs leaving the United States, USDA APHIS publishes the exact "Veterinary Health Certificate for
      Export of Dogs and Cats to the Togolese Republic," which requires a microchip, a current rabies
      vaccination and a veterinary inspection. Togo is a rabies-endemic country, so the rabies rule is
      central. Beyond that certificate, Togo publishes almost nothing for a private pet — no personal-pet
      import-permit form, no fixed timing windows, no breed list — so this guide states plainly what is
      documented and flags the rest as "unknown," to be confirmed with Togo's veterinary services and
      your own vet before you book.
    fr: >-
      Le Togo accueille les chiens, mais l'entrée passe par le dispositif vétérinaire propre au pays,
      supervisé par les services de l'élevage et vétérinaires du Ministère de l'Agriculture, de la Pêche,
      des Ressources Animales et de la Souveraineté Alimentaire, et non par le cadre de l'UE. La seule
      procédure officiellement publiée en détail est le certificat vétérinaire international : pour un
      chien quittant les États-Unis, l'USDA APHIS publie le « Certificat vétérinaire pour l'exportation
      de chiens et chats vers la République togolaise », qui exige une puce, une vaccination antirabique
      à jour et une inspection vétérinaire. Le Togo est un pays où la rage est endémique : la règle
      antirabique est donc centrale. Au-delà de ce certificat, le Togo ne publie presque rien pour un
      animal de compagnie privé — pas de formulaire de permis d'importation personnel, pas de délais
      fixes, pas de liste de races — ; ce guide indique clairement ce qui est documenté et signale le
      reste comme « non communiqué », à confirmer auprès des services vétérinaires togolais et de ton
      vétérinaire avant de réserver.
    es: >-
      Togo acoge a los perros, pero la entrada se rige por el propio sistema veterinario del país,
      supervisado por los servicios ganaderos y veterinarios del Ministère de l'Agriculture, de la Pêche,
      des Ressources Animales et de la Souveraineté Alimentaire, y no por el marco de la UE. El único
      procedimiento publicado oficialmente en detalle es el certificado sanitario veterinario
      internacional: para los perros que salen de Estados Unidos, el USDA APHIS publica el "Veterinary
      Health Certificate for Export of Dogs and Cats to the Togolese Republic" exacto, que exige un
      microchip, una vacunación antirrábica en vigor y una inspección veterinaria. Togo es un país con
      rabia endémica, así que la norma antirrábica es central. Más allá de ese certificado, Togo apenas
      publica nada para una mascota privada — ningún formulario de permiso de importación personal,
      ninguna ventana de plazos fija, ninguna lista de razas — por lo que esta guía indica claramente lo
      que está documentado y marca el resto como "no comunicado", para confirmarlo con los servicios
      veterinarios de Togo y con tu propio veterinario antes de reservar.

    pt: "O Togo recebe bem os cachorros de estimação, mas a entrada passa pelo próprio dispositivo veterinário do país, supervisionado pelos serviços de pecuária e veterinários do Ministère de l'Agriculture, de la Pêche, des Ressources Animales et de la Souveraineté Alimentaire, e não pelo marco da UE. O único procedimento oficialmente publicado em detalhe é o certificado veterinário internacional: para cachorros que saem dos Estados Unidos, o USDA APHIS publica exatamente o \"Veterinary Health Certificate for Export of Dogs and Cats to the Togolese Republic\", que exige um microchip, uma vacinação antirrábica em dia e uma inspeção veterinária. O Togo é um país com raiva endêmica, então a regra antirrábica é central. Além desse certificado, o Togo publica quase nenhuma informação para um animal de estimação privado — nenhum formulário de autorização de importação pessoal, nenhuma janela de prazos fixa, nenhuma lista de raças — então este guia declara claramente o que está documentado e sinaliza o restante como \"não comunicado\", a ser confirmado com os serviços veterinários do Togo e com o seu próprio veterinário antes de reservar."
difficulty:
  level: moderate
  label: { en: "Moderate — international veterinary certificate with microchip and current rabies vaccination required", fr: "Modéré — certificat vétérinaire international avec puce et vaccination antirabique à jour requis", es: "Moderado — se exige certificado veterinario internacional con microchip y vacunación antirrábica en vigor", pt: "Moderado — exige certificado veterinário internacional com microchip e vacinação antirrábica em dia" }

prepTime:
  eu:
    en: "From the EU: allow a few weeks. Identification (microchip) and rabies vaccination should already be in order; then have an official vet of the country of origin issue an international veterinary health certificate close to departure. Togo does not publish its own timing windows for a private pet — confirm with Togo's veterinary services and your vet."
    fr: "Depuis l'UE : prévois quelques semaines. L'identification (puce) et la vaccination antirabique doivent déjà être en règle ; fais ensuite établir un certificat vétérinaire international par un vétérinaire officiel du pays d'origine peu avant le départ. Le Togo ne publie pas de délais propres pour un animal de compagnie privé — à confirmer auprès des services vétérinaires togolais et de ton vétérinaire."
    es: "Desde la UE: prevé unas semanas. La identificación (microchip) y la vacunación antirrábica deben estar ya en regla; después, haz que un veterinario oficial del país de origen expida un certificado sanitario veterinario internacional poco antes de la salida. Togo no publica plazos propios para una mascota privada — confírmalo con los servicios veterinarios de Togo y con tu veterinario."
    pt: "Da UE: reserve algumas semanas. A identificação (microchip) e a vacinação antirrábica já devem estar em ordem; depois, peça a um veterinário oficial do país de origem para emitir um certificado veterinário internacional próximo da partida. O Togo não publica prazos próprios para um animal de estimação privado — confirme com os serviços veterinários do Togo e com o seu veterinário."
  listed:
    en: "From the United States: USDA APHIS publishes the exact Togo dog/cat veterinary health certificate. A USDA-accredited vet issues it (electronic signature accepted); APHIS must then ink-sign and emboss it (original endorsement required). The dog needs a verified microchip and a current rabies vaccination."
    fr: "Depuis les États-Unis : l'USDA APHIS publie le certificat vétérinaire chien/chat exact pour le Togo. Un vétérinaire agréé USDA l'établit (signature électronique acceptée) ; l'APHIS doit ensuite le signer à l'encre et l'embosser (endossement original requis). Le chien doit avoir une puce vérifiée et une vaccination antirabique à jour."
    es: "Desde Estados Unidos: el USDA APHIS publica el certificado sanitario veterinario perro/gato exacto para Togo. Un veterinario acreditado por el USDA lo expide (se acepta firma electrónica); después, el APHIS debe firmarlo a tinta y estamparlo en relieve (se exige el refrendo original). El perro necesita un microchip verificado y una vacunación antirrábica en vigor."
    pt: "Dos Estados Unidos: o USDA APHIS publica exatamente o certificado veterinário para cachorros/gatos do Togo. Um veterinário credenciado pelo USDA o emite (assinatura eletrônica aceita); o APHIS precisa então assiná-lo com tinta e aplicar o selo em relevo (endosso original exigido). O cachorro precisa de um microchip verificado e uma vacinação antirrábica em dia."
  nonListed:
    en: "From a rabies-endemic or other origin: the same core steps apply — microchip, current rabies vaccination and an international veterinary certificate from the country of origin. Because much detail is unpublished, confirm every additional condition directly with Togo's veterinary services before booking."
    fr: "Depuis une origine où la rage est endémique ou toute autre origine : les mêmes étapes de base s'appliquent — puce, vaccination antirabique à jour et certificat vétérinaire international du pays d'origine. Beaucoup de détails n'étant pas publiés, confirme chaque condition supplémentaire directement auprès des services vétérinaires togolais avant de réserver."
    es: "Desde un origen con rabia endémica o cualquier otro origen: se aplican los mismos pasos básicos — microchip, vacunación antirrábica en vigor y certificado veterinario internacional del país de origen. Como muchos detalles no están publicados, confirma cada condición adicional directamente con los servicios veterinarios de Togo antes de reservar."
    pt: "De uma origem com raiva endêmica ou outra: as mesmas etapas básicas se aplicam — microchip, vacinação antirrábica em dia e um certificado veterinário internacional do país de origem. Como muitos detalhes não são publicados, confirme cada condição adicional diretamente com os serviços veterinários do Togo antes de reservar."

