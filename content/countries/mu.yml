notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian and the Division of Veterinary Services (via your import permit) can confirm the exact procedure for your individual dog."
    fr: "Seul un vétérinaire et la Division of Veterinary Services (via ton permis d'importation) peuvent confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario y la Division of Veterinary Services (a través de tu permiso de importación) pueden confirmar el procedimiento exacto para tu perro."
    pt: "Só um veterinário e a Division of Veterinary Services (por meio da sua autorização de importação) podem confirmar o procedimento exato para o seu cachorro."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact steps depend on three things — Mauritius (your destination) sets a strict national scheme, but your dog's origin and history decide the detail."
    fr: "Les étapes exactes dépendent de trois éléments — Maurice (ta destination) impose un régime national strict, mais l'origine et l'historique de ton chien en déterminent le détail."
    es: "Los pasos exactos dependen de tres factores — Mauricio (tu destino) impone un régimen nacional estricto, pero el origen y el historial de tu perro determinan los detalles."
    pt: "As etapas exatas dependem de três fatores — a Ilha Maurício (seu destino) impõe um regime nacional rigoroso, mas a origem e o histórico do seu cachorro determinam os detalhes."
  items:
    - stars: 5
      label: { en: "Country of destination — Mauritius", fr: "Pays de destination — Maurice", es: "País de destino — Mauricio", pt: "País de destino — Ilha Maurício" }
      text:
        en: "Mauritius applies its own scheme under the Animal Disease Act 1925: an import permit, ISO microchip, rabies protection, several disease tests and treatments, an International Veterinary Certificate and a mandatory quarantine at Reduit apply to every imported dog."
        fr: "Maurice applique son propre régime au titre de l'Animal Disease Act 1925 : permis d'importation, puce ISO, protection antirabique, plusieurs tests et traitements, Certificat vétérinaire international et quarantaine obligatoire à Réduit s'appliquent à tout chien importé."
        es: "Mauricio aplica su propio régimen al amparo de la Animal Disease Act 1925: un permiso de importación, un microchip ISO, protección antirrábica, varias pruebas y tratamientos de enfermedades, un Certificado Veterinario Internacional y una cuarentena obligatoria en Réduit se aplican a todo perro importado."
        pt: "A Ilha Maurício aplica o seu próprio regime nos termos do Animal Disease Act 1925 (lei sobre doenças animais): autorização de importação, microchip ISO, proteção antirrábica, vários testes e tratamentos de doenças, Certificado Veterinário Internacional e quarentena obrigatória em Réduit valem para todo cachorro importado."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Your dog's country of export must be certified by that country's Veterinary Authority, which endorses every test and the health certificate. The Division of Veterinary Services assesses the country's status at permit application and may refuse a permit in case of a sanitary threat."
        fr: "Le pays d'exportation de ton chien doit être certifié par l'Autorité vétérinaire de ce pays, qui vise chaque test et le certificat sanitaire. La Division of Veterinary Services évalue le statut du pays lors de la demande de permis et peut refuser un permis en cas de menace sanitaire."
        es: "El país de exportación de tu perro debe estar certificado por la Autoridad Veterinaria de ese país, que refrenda cada prueba y el certificado sanitario. La Division of Veterinary Services evalúa el estatus del país en el momento de la solicitud del permiso y puede denegarlo en caso de amenaza sanitaria."
        pt: "O país de exportação do seu cachorro precisa ser certificado pela Autoridade Veterinária desse país, que endossa cada teste e o atestado de saúde. A Division of Veterinary Services avalia o estatuto do país no momento do pedido de autorização e pode recusá-la em caso de ameaça sanitária."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "The rabies antibody test must be taken 3 to 12 months before shipment, followed by at least a 3-month waiting period, so your dog's recent residence and rabies history determine when it can travel. A stay in a higher-risk country can change what the permit requires."
        fr: "Le titrage antirabique doit être réalisé 3 à 12 mois avant l'expédition, suivi d'un délai d'attente d'au moins 3 mois ; la résidence récente et l'historique rabique du chien déterminent donc quand il peut voyager. Un séjour dans un pays à risque plus élevé peut modifier les exigences du permis."
        es: "La prueba de titulación de rabia debe realizarse de 3 a 12 meses antes del envío, seguida de un período de espera de al menos 3 meses, por lo que la residencia reciente y el historial de rabia de tu perro determinan cuándo puede viajar. Una estancia en un país de mayor riesgo puede cambiar lo que exige el permiso."
        pt: "O teste sorológico antirrábico precisa ser feito de 3 a 12 meses antes do embarque, seguido de um período de espera de pelo menos 3 meses; por isso, a residência recente e o histórico de raiva do seu cachorro determinam quando ele pode viajar. Uma estadia em um país de risco mais alto pode mudar o que a autorização exige."
  note:
    en: "So read the requirements below as the Mauritian framework, then confirm your dog's origin, history and exact conditions against your import permit and your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre mauricien, puis confirme l'origine, l'historique et les conditions exactes de ton chien avec ton permis d'importation et ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Mauricio y luego confirma el origen, el historial y las condiciones exactas de tu perro con tu permiso de importación y tu veterinario."
    pt: "Leia então as exigências abaixo como o quadro geral da Ilha Maurício e depois confirme a origem, o histórico e as condições exatas do seu cachorro na sua autorização de importação e com o seu veterinário."

requirements:
  - item: { en: "Import permit", fr: "Permis d'importation", es: "Permiso de importación", pt: "Autorização de importação" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Apply to the Division of Veterinary Services at least 3 months before departure; no dog may be embarked for Mauritius without a permit. Normal permit delivery is around two working days once all conditions are met.", fr: "À demander à la Division of Veterinary Services au moins 3 mois avant le départ ; aucun chien ne peut être embarqué pour Maurice sans permis. Délai normal de délivrance : environ deux jours ouvrés une fois toutes les conditions réunies.", es: "Solicítalo a la Division of Veterinary Services al menos 3 meses antes de la salida; ningún perro puede embarcarse hacia Mauricio sin permiso. La entrega normal del permiso es de unos dos días hábiles una vez cumplidas todas las condiciones.", pt: "Peça a autorização à Division of Veterinary Services pelo menos 3 meses antes da partida; nenhum cachorro pode ser embarcado para a Ilha Maurício sem autorização. A emissão normal leva cerca de dois dias úteis, uma vez cumpridas todas as condições." }
    exceptions: { en: "Import permits may be refused in case of a sanitary threat to the country.", fr: "Un permis d'importation peut être refusé en cas de menace sanitaire pour le pays.", es: "Los permisos de importación pueden denegarse en caso de amenaza sanitaria para el país.", pt: "As autorizações de importação podem ser recusadas em caso de ameaça sanitária para o país." }
    ref: { en: "DVS — Guidelines to bring dogs to Mauritius; Animal Disease Act 1925", fr: "DVS — Guidelines to bring dogs to Mauritius ; Animal Disease Act 1925", es: "DVS — Guidelines to bring dogs to Mauritius; Animal Disease Act 1925", pt: "DVS — Guidelines to bring dogs to Mauritius; Animal Disease Act 1925" }
  - item: { en: "Microchip", fr: "Puce électronique", es: "Microchip", pt: "Microchip" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "A registered veterinarian must scan the dog's microchip before collecting the RNATT blood sample; the microchip number is recorded on the application form, the laboratory report and the health certificate.", fr: "Un vétérinaire agréé doit lire la puce du chien avant de prélever le sang pour le RNATT ; le numéro de puce est consigné sur le formulaire de demande, le rapport de laboratoire et le certificat sanitaire.", es: "Un veterinario colegiado debe leer el microchip del perro antes de tomar la muestra de sangre para la RNATT; el número de microchip se registra en el formulario de solicitud, el informe de laboratorio y el certificado sanitario.", pt: "Um veterinário registrado precisa ler o microchip do cachorro antes de coletar a amostra de sangue para o RNATT; o número do microchip é registrado no formulário de pedido, no laudo do laboratório e no atestado de saúde." }
    exceptions: { en: "The microchip is the identification linking your dog to every test and document.", fr: "La puce est l'identification qui relie ton chien à chaque test et document.", es: "El microchip es la identificación que vincula a tu perro con cada prueba y documento.", pt: "O microchip é a identificação que liga o seu cachorro a cada teste e a cada documento." }
    ref: { en: "DVS — Guidelines to bring dogs to Mauritius; Application form for pet import permits", fr: "DVS — Guidelines to bring dogs to Mauritius ; Formulaire de demande de permis d'importation d'animaux", es: "DVS — Guidelines to bring dogs to Mauritius; formulario de solicitud de permisos de importación de mascotas", pt: "DVS — Guidelines to bring dogs to Mauritius; formulário de pedido de autorização de importação de animais de estimação" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Vaccinated or revaccinated with a vaccine produced in accordance with the WOAH Terrestrial Manual, following the manufacturer's recommendations, before the antibody test.", fr: "Vacciné ou revacciné avec un vaccin produit conformément au Manuel terrestre de l'OMSA (WOAH), selon les recommandations du fabricant, avant le titrage.", es: "Vacunado o revacunado con una vacuna producida conforme al Manual Terrestre de la OMSA (WOAH), siguiendo las recomendaciones del fabricante, antes de la prueba de titulación.", pt: "Vacinado ou revacinado com uma vacina produzida de acordo com o Manual Terrestre da WOAH, seguindo as recomendações do fabricante, antes do teste sorológico." }
    exceptions: { en: "Wait 4 weeks between the rabies vaccination and the blood sample for the RNAT test.", fr: "Attendre 4 semaines entre la vaccination antirabique et le prélèvement pour le test RNAT.", es: "Espera 4 semanas entre la vacunación antirrábica y la extracción de sangre para la prueba RNAT.", pt: "Espere 4 semanas entre a vacinação antirrábica e a coleta de sangue para o teste RNAT." }
    ref: { en: "DVS — Guidelines to bring dogs to Mauritius (import permit conditions)", fr: "DVS — Guidelines to bring dogs to Mauritius (conditions du permis)", es: "DVS — Guidelines to bring dogs to Mauritius (condiciones del permiso de importación)", pt: "DVS — Guidelines to bring dogs to Mauritius (condições da autorização de importação)" }
  - item: { en: "Rabies antibody test (RNATT)", fr: "Titrage antirabique (RNATT)", es: "Prueba de titulación de rabia (RNATT)", pt: "Teste sorológico antirrábico (RNATT)" }
    required: { en: "Required", fr: "Requis", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Blood collected ≥4 weeks after vaccination and tested by FAVN or RFFIT in a laboratory approved by the exporting country's Veterinary Authority or a WOAH reference laboratory; result must be ≥0.5 IU/ml. Sample taken not less than 3 and not more than 12 months before shipment.", fr: "Sang prélevé ≥4 semaines après le vaccin et analysé par FAVN ou RFFIT dans un laboratoire agréé par l'Autorité vétérinaire du pays exportateur ou un laboratoire de référence OMSA ; résultat ≥0,5 UI/ml. Prélèvement entre 3 et 12 mois avant l'expédition.", es: "Sangre extraída ≥4 semanas después de la vacunación y analizada por FAVN o RFFIT en un laboratorio aprobado por la Autoridad Veterinaria del país exportador o un laboratorio de referencia de la OMSA; el resultado debe ser ≥0,5 UI/ml. Muestra tomada entre 3 y 12 meses antes del envío.", pt: "Sangue coletado ≥4 semanas depois da vacinação e analisado por FAVN ou RFFIT em um laboratório aprovado pela Autoridade Veterinária do país exportador ou em um laboratório de referência da WOAH; o resultado precisa ser ≥0,5 UI/ml. Amostra colhida no mínimo 3 e no máximo 12 meses antes do embarque." }
    exceptions: { en: "A waiting period of at least 3 months from the sampling date must be observed before travel. A result below 0.5 IU/ml means re-vaccinate and repeat the test. The laboratory must also send a copy of results directly to the DVS.", fr: "Un délai d'attente d'au moins 3 mois à partir de la date de prélèvement doit être respecté avant le voyage. Un résultat inférieur à 0,5 UI/ml impose de revacciner et de refaire le test. Le laboratoire doit aussi envoyer une copie des résultats directement à la DVS.", es: "Debe observarse un período de espera de al menos 3 meses desde la fecha de extracción antes del viaje. Un resultado inferior a 0,5 UI/ml obliga a revacunar y repetir la prueba. El laboratorio también debe enviar una copia de los resultados directamente a la DVS.", pt: "É preciso respeitar um período de espera de pelo menos 3 meses a partir da data da coleta antes da viagem. Um resultado abaixo de 0,5 UI/ml obriga a revacinar e repetir o teste. O laboratório também precisa enviar uma cópia dos resultados diretamente à DVS." }
    ref: { en: "DVS — Guidelines to bring dogs to Mauritius (RNAT test)", fr: "DVS — Guidelines to bring dogs to Mauritius (test RNAT)", es: "DVS — Guidelines to bring dogs to Mauritius (prueba RNAT)", pt: "DVS — Guidelines to bring dogs to Mauritius (teste RNAT)" }
  - item: { en: "Ehrlichia canis test", fr: "Test Ehrlichia canis", es: "Prueba de Ehrlichia canis", pt: "Teste de Ehrlichia canis" }
    required: { en: "Required", fr: "Requis", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Tested for Ehrlichia canis by Indirect Fluorescent Antibody Test (IFAT) with a negative result at a dilution of 1:40, within 45 days before departure.", fr: "Testé pour Ehrlichia canis par test d'immunofluorescence indirecte (IFAT) avec résultat négatif à une dilution de 1:40, dans les 45 jours avant le départ.", es: "Analizado para Ehrlichia canis mediante prueba de inmunofluorescencia indirecta (IFAT) con resultado negativo a una dilución de 1:40, dentro de los 45 días previos a la salida.", pt: "Testado para Ehrlichia canis por teste de imunofluorescência indireta (IFAT), com resultado negativo na diluição de 1:40, nos 45 dias anteriores à partida." }
    exceptions: { en: "The laboratory must send a copy of the results directly to the DVS to confirm authenticity.", fr: "Le laboratoire doit envoyer une copie des résultats directement à la DVS pour confirmer l'authenticité.", es: "El laboratorio debe enviar una copia de los resultados directamente a la DVS para confirmar su autenticidad.", pt: "O laboratório precisa enviar uma cópia dos resultados diretamente à DVS para confirmar a autenticidade." }
    ref: { en: "DVS — Guidelines to bring dogs to Mauritius (Ehrlichia canis)", fr: "DVS — Guidelines to bring dogs to Mauritius (Ehrlichia canis)", es: "DVS — Guidelines to bring dogs to Mauritius (Ehrlichia canis)", pt: "DVS — Guidelines to bring dogs to Mauritius (Ehrlichia canis)" }
  - item: { en: "Brucella canis test", fr: "Test Brucella canis", es: "Prueba de Brucella canis", pt: "Teste de Brucella canis" }
    required: { en: "Required", fr: "Requis", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Tested for Brucella canis by a rapid slide agglutination test or a tube agglutination test, with a negative result.", fr: "Testé pour Brucella canis par test d'agglutination rapide sur lame ou test d'agglutination en tube, avec résultat négatif.", es: "Analizado para Brucella canis mediante una prueba de aglutinación rápida en placa o una prueba de aglutinación en tubo, con resultado negativo.", pt: "Testado para Brucella canis por teste rápido de aglutinação em lâmina ou teste de aglutinação em tubo, com resultado negativo." }
    exceptions: { en: "The laboratory must send a copy of the results directly to the DVS to confirm authenticity.", fr: "Le laboratoire doit envoyer une copie des résultats directement à la DVS pour confirmer l'authenticité.", es: "El laboratorio debe enviar una copia de los resultados directamente a la DVS para confirmar su autenticidad.", pt: "O laboratório precisa enviar uma cópia dos resultados diretamente à DVS para confirmar a autenticidade." }
    ref: { en: "DVS — Guidelines to bring dogs to Mauritius (Brucella canis)", fr: "DVS — Guidelines to bring dogs to Mauritius (Brucella canis)", es: "DVS — Guidelines to bring dogs to Mauritius (Brucella canis)", pt: "DVS — Guidelines to bring dogs to Mauritius (Brucella canis)" }
  - item: { en: "Core vaccinations", fr: "Vaccinations essentielles", es: "Vacunaciones esenciales", pt: "Vacinas essenciais" }
    required: { en: "Required", fr: "Requises", es: "Obligatorias", pt: "Obrigatório" }
    when: { en: "Vaccinated against distemper (maladie de Carre), infectious hepatitis, leptospirosis and canine parvovirus; up to date but not done less than two weeks before dispatch by air, and certified by a registered vet with vaccine make, batch number, expiry and date given.", fr: "Vacciné contre la maladie de Carré, l'hépatite infectieuse, la leptospirose et la parvovirose canine ; à jour mais pas moins de deux semaines avant l'expédition par avion, et certifié par un vétérinaire agréé avec la marque du vaccin, le numéro de lot, la date de péremption et la date d'administration.", es: "Vacunado contra el moquillo (maladie de Carre), la hepatitis infecciosa, la leptospirosis y el parvovirus canino; al día pero no realizado menos de dos semanas antes del envío por avión, y certificado por un veterinario colegiado con la marca de la vacuna, el número de lote, la caducidad y la fecha de administración.", pt: "Vacinado contra cinomose (maladie de Carre), hepatite infecciosa, leptospirose e parvovirose canina; em dia, mas não aplicada menos de duas semanas antes do envio por via aérea, e certificada por um veterinário registrado com a marca da vacina, o número do lote, a validade e a data de aplicação." }
    exceptions: { en: "None published.", fr: "Aucune publiée.", es: "Ninguna publicada.", pt: "Nenhuma publicada." }
    ref: { en: "DVS — Guidelines to bring dogs to Mauritius (vaccination)", fr: "DVS — Guidelines to bring dogs to Mauritius (vaccination)", es: "DVS — Guidelines to bring dogs to Mauritius (vacunación)", pt: "DVS — Guidelines to bring dogs to Mauritius (vacinação)" }
  - item: { en: "Sterilisation certificate", fr: "Certificat de stérilisation", es: "Certificado de esterilización", pt: "Certificado de castração" }
    required: { en: "Required (except breeding dogs)", fr: "Requis (sauf chiens reproducteurs)", es: "Obligatorio (salvo perros reproductores)", pt: "Obrigatório (exceto cachorros reprodutores)" }
    when: { en: "A sterilisation certificate signed and stamped by a registered veterinarian must accompany the application, except for animals imported for breeding.", fr: "Un certificat de stérilisation signé et tamponné par un vétérinaire agréé doit accompagner la demande, sauf pour les animaux importés pour la reproduction.", es: "Un certificado de esterilización firmado y sellado por un veterinario colegiado debe acompañar la solicitud, salvo para los animales importados para reproducción.", pt: "Um certificado de castração assinado e carimbado por um veterinário registrado precisa acompanhar o pedido, exceto para animais importados para reprodução." }
    exceptions: { en: "Breeding dogs instead need a pedigree/equivalent certificate proving pure breed (with sire and dam), a valid breeder's licence registered by the Animal Welfare Unit.", fr: "Les chiens reproducteurs doivent à la place fournir un certificat de pedigree/équivalent prouvant la race pure (avec père et mère) et une licence d'éleveur valide enregistrée par l'Animal Welfare Unit.", es: "Los perros reproductores necesitan en su lugar un certificado de pedigrí/equivalente que acredite la raza pura (con padre y madre) y una licencia de criador válida registrada por la Animal Welfare Unit.", pt: "Os cachorros reprodutores precisam, em vez disso, de um certificado de pedigree/equivalente que comprove a raça pura (com pai e mãe) e de uma licença de criador válida registrada pela Animal Welfare Unit." }
    ref: { en: "DVS — Guidelines to bring dogs to Mauritius (documents)", fr: "DVS — Guidelines to bring dogs to Mauritius (documents)", es: "DVS — Guidelines to bring dogs to Mauritius (documentos)", pt: "DVS — Guidelines to bring dogs to Mauritius (documentos)" }
  - item: { en: "International Veterinary Certificate", fr: "Certificat vétérinaire international", es: "Certificado Veterinario Internacional", pt: "Certificado Veterinário Internacional" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "An International Veterinary Certificate issued and endorsed by the Competent Authority of the exporting country must accompany the dog; all test reports must also be endorsed by that authority. The dog must show no clinical signs of rabies or other infectious disease the day before or on the day of shipment.", fr: "Un Certificat vétérinaire international délivré et visé par l'Autorité compétente du pays exportateur doit accompagner le chien ; tous les rapports de test doivent aussi être visés par cette autorité. Le chien ne doit présenter aucun signe clinique de rage ou d'autre maladie infectieuse la veille ou le jour de l'expédition.", es: "Un Certificado Veterinario Internacional expedido y refrendado por la Autoridad Competente del país exportador debe acompañar al perro; todos los informes de las pruebas también deben ser refrendados por esa autoridad. El perro no debe mostrar ningún signo clínico de rabia u otra enfermedad infecciosa la víspera o el día del envío.", pt: "Um Certificado Veterinário Internacional emitido e endossado pela Autoridade Competente do país exportador precisa acompanhar o cachorro; todos os laudos dos testes também precisam ser endossados por essa autoridade. O cachorro não pode apresentar nenhum sinal clínico de raiva ou de outra doença infecciosa na véspera nem no dia do embarque." }
    exceptions: { en: "Original documents (or certified true copies) must be produced at the animal's arrival.", fr: "Les documents originaux (ou copies certifiées conformes) doivent être présentés à l'arrivée de l'animal.", es: "Los documentos originales (o copias compulsadas) deben presentarse a la llegada del animal.", pt: "Os documentos originais (ou cópias autenticadas) precisam ser apresentados na chegada do animal." }
    ref: { en: "DVS — Guidelines to bring dogs to Mauritius (certificate)", fr: "DVS — Guidelines to bring dogs to Mauritius (certificat)", es: "DVS — Guidelines to bring dogs to Mauritius (certificado)", pt: "DVS — Guidelines to bring dogs to Mauritius (certificado)" }
  - item: { en: "Transport as manifest cargo", fr: "Transport en fret manifesté", es: "Transporte como carga manifestada", pt: "Transporte como carga manifestada" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "All pets must arrive as manifest CARGO only — not in the cabin and not in the luggage hold as excess luggage. A local broker's coordinates must be provided for customs clearance.", fr: "Tout animal doit arriver en fret manifesté uniquement — ni en cabine ni en soute comme excédent de bagages. Les coordonnées d'un courtier local doivent être fournies pour le dédouanement.", es: "Todas las mascotas deben llegar únicamente como CARGA manifestada — ni en la cabina ni en la bodega de equipaje como exceso de equipaje. Deben facilitarse los datos de un agente local para el despacho de aduanas.", pt: "Todos os animais de estimação precisam chegar exclusivamente como CARGA manifestada — nem na cabine, nem no porão como excesso de bagagem. É preciso informar os dados de um despachante local para o desembaraço aduaneiro." }
    exceptions: { en: "Inform the DVS of the flight number and arrival time at least four days before arrival.", fr: "Informer la DVS du numéro de vol et de l'heure d'arrivée au moins quatre jours avant l'arrivée.", es: "Informa a la DVS del número de vuelo y la hora de llegada al menos cuatro días antes de la llegada.", pt: "Informe à DVS o número do voo e o horário de chegada pelo menos quatro dias antes da chegada." }
    ref: { en: "DVS — Guidelines to bring dogs to Mauritius (import permit conditions)", fr: "DVS — Guidelines to bring dogs to Mauritius (conditions du permis)", es: "DVS — Guidelines to bring dogs to Mauritius (condiciones del permiso de importación)", pt: "DVS — Guidelines to bring dogs to Mauritius (condições da autorização de importação)" }
  - item: { en: "Quarantine (Reduit)", fr: "Quarantaine (Réduit)", es: "Cuarentena (Réduit)", pt: "Quarentena (Réduit)" }
    required: { en: "Required — minimum 5 days", fr: "Requise — minimum 5 jours", es: "Obligatoria — mínimo 5 días", pt: "Obrigatória — mínimo de 5 dias" }
    when: { en: "The dog undergoes a minimum quarantine of 5 days at the Quarantine Facility at Reduit; availability of a kennel must be confirmed before the permit is issued. Kennel rent is Rs 15 per day per animal.", fr: "Le chien effectue une quarantaine minimale de 5 jours au centre de quarantaine de Réduit ; la disponibilité d'un chenil doit être confirmée avant la délivrance du permis. Le chenil coûte 15 Rs par jour et par animal.", es: "El perro pasa una cuarentena mínima de 5 días en el Centro de Cuarentena de Réduit; la disponibilidad de una perrera debe confirmarse antes de expedir el permiso. El alquiler de la perrera es de 15 Rs por día y por animal.", pt: "O cachorro cumpre uma quarentena mínima de 5 dias no Quarantine Facility de Réduit; a disponibilidade de um canil precisa ser confirmada antes da emissão da autorização. O aluguel do canil é de 15 rupias mauricianas por dia e por animal." }
    exceptions: { en: "The facility has no clinical vet or medication on site; a private vet may be called at the owner's cost. Owners provide the dog's food.", fr: "Le centre n'a ni vétérinaire clinique ni médicaments sur place ; un vétérinaire privé peut être appelé aux frais du propriétaire. Les propriétaires fournissent la nourriture du chien.", es: "El centro no dispone de veterinario clínico ni de medicación in situ; puede llamarse a un veterinario privado a cargo del propietario. Los propietarios proporcionan la comida del perro.", pt: "O centro não tem veterinário clínico nem medicamentos no local; um veterinário particular pode ser chamado às custas do dono. Os donos fornecem a comida do cachorro." }
    ref: { en: "DVS — Guidelines to bring dogs to Mauritius (post arrival)", fr: "DVS — Guidelines to bring dogs to Mauritius (après l'arrivée)", es: "DVS — Guidelines to bring dogs to Mauritius (después de la llegada)", pt: "DVS — Guidelines to bring dogs to Mauritius (após a chegada)" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Effectively several months", fr: "En pratique plusieurs mois", es: "En la práctica varios meses", pt: "Na prática, vários meses" }
    when: { en: "No explicit minimum age is published, but rabies vaccination, the 4-week wait before the RNATT and the 3-month post-sampling waiting period push the earliest travel date to several months of age.", fr: "Aucun âge minimum explicite n'est publié, mais la vaccination antirabique, l'attente de 4 semaines avant le RNATT et le délai de 3 mois après prélèvement repoussent la date de voyage la plus précoce à plusieurs mois.", es: "No se publica una edad mínima explícita, pero la vacunación antirrábica, la espera de 4 semanas antes de la RNATT y el período de espera de 3 meses tras la extracción retrasan la fecha más temprana de viaje a varios meses de edad.", pt: "Não há idade mínima explícita publicada, mas a vacinação antirrábica, a espera de 4 semanas antes do RNATT e o período de espera de 3 meses após a coleta empurram a data de viagem mais cedo possível para vários meses de idade." }
    exceptions: { en: "Confirm any age condition on your individual import permit.", fr: "Vérifie toute condition d'âge sur ton permis d'importation individuel.", es: "Confirma cualquier condición de edad en tu permiso de importación individual.", pt: "Confirme qualquer condição de idade na sua autorização de importação individual." }
    ref: { en: "DVS — Guidelines to bring dogs to Mauritius", fr: "DVS — Guidelines to bring dogs to Mauritius", es: "DVS — Guidelines to bring dogs to Mauritius", pt: "DVS — Guidelines to bring dogs to Mauritius" }

origin:
  eu:
    title: { en: "Standard route — rabies antibody test", fr: "Parcours standard — titrage antirabique", es: "Ruta estándar — prueba de titulación de rabia", pt: "Percurso padrão — teste sorológico antirrábico" }
    body:
      en: "Most travellers follow this path. Your dog is microchipped, vaccinated against rabies, then blood-tested (RNATT) at least 4 weeks later with a result of ≥0.5 IU/ml, taken 3 to 12 months before shipment. A minimum 3-month waiting period from the sampling date then applies before travel. Add the Ehrlichia canis and Brucella canis tests, core vaccinations, an endorsed International Veterinary Certificate, the import permit and the 5-day quarantine at Reduit."
      fr: "La plupart des voyageurs suivent ce parcours. Ton chien est pucé, vacciné contre la rage, puis soumis à un titrage (RNATT) au moins 4 semaines plus tard avec un résultat ≥0,5 UI/ml, réalisé 3 à 12 mois avant l'expédition. Un délai d'attente d'au moins 3 mois à partir de la date de prélèvement s'applique ensuite avant le voyage. Ajoute les tests Ehrlichia canis et Brucella canis, les vaccinations essentielles, un Certificat vétérinaire international visé, le permis d'importation et la quarantaine de 5 jours à Réduit."
      es: "La mayoría de los viajeros siguen esta ruta. A tu perro se le implanta el microchip, se le vacuna contra la rabia y luego se le hace un análisis de sangre (RNATT) al menos 4 semanas después con un resultado de ≥0,5 UI/ml, tomado de 3 a 12 meses antes del envío. Después se aplica un período de espera mínimo de 3 meses desde la fecha de extracción antes del viaje. Añade las pruebas de Ehrlichia canis y Brucella canis, las vacunaciones esenciales, un Certificado Veterinario Internacional refrendado, el permiso de importación y la cuarentena de 5 días en Réduit."
      pt: "A maioria dos viajantes segue este percurso. Seu cachorro recebe o microchip, é vacinado contra a raiva e, pelo menos 4 semanas depois, faz o exame de sangue (RNATT) com resultado ≥0,5 UI/ml, colhido de 3 a 12 meses antes do embarque. Depois, aplica-se um período de espera mínimo de 3 meses a partir da data da coleta antes da viagem. Acrescente os testes de Ehrlichia canis e Brucella canis, as vacinações essenciais, um Certificado Veterinário Internacional endossado, a autorização de importação e a quarentena de 5 dias em Réduit."
    cls: warn
  listed:
    title: { en: "Alternative — six-month quarantine station", fr: "Alternative — station de quarantaine de six mois", es: "Alternativa — estación de cuarentena de seis meses", pt: "Alternativa — estação de quarentena de seis meses" }
    body:
      en: "Instead of the rabies antibody test, the import permit conditions allow a dog that was kept in an approved quarantine station for six months prior to shipment, under the supervision of the exporting country's Veterinary Authority. All other requirements — permit, disease tests, core vaccinations, endorsed certificate and the 5-day quarantine at Reduit — still apply."
      fr: "À la place du titrage antirabique, les conditions du permis autorisent un chien maintenu six mois dans une station de quarantaine agréée avant l'expédition, sous la supervision de l'Autorité vétérinaire du pays exportateur. Toutes les autres exigences — permis, tests de maladies, vaccinations essentielles, certificat visé et quarantaine de 5 jours à Réduit — restent applicables."
      es: "En lugar de la prueba de titulación de rabia, las condiciones del permiso de importación admiten un perro que haya permanecido en una estación de cuarentena aprobada durante seis meses antes del envío, bajo la supervisión de la Autoridad Veterinaria del país exportador. Todos los demás requisitos — permiso, pruebas de enfermedades, vacunaciones esenciales, certificado refrendado y la cuarentena de 5 días en Réduit — siguen aplicándose."
      pt: "Em vez do teste sorológico antirrábico, as condições da autorização de importação admitem um cachorro que tenha ficado em uma estação de quarentena aprovada durante seis meses antes do embarque, sob a supervisão da Autoridade Veterinária do país exportador. Todas as demais exigências — autorização, testes de doenças, vacinações essenciais, certificado endossado e a quarentena de 5 dias em Réduit — continuam valendo."
    cls: warn
  nonListed:
    title: { en: "Permit refusal — sanitary threat", fr: "Refus de permis — menace sanitaire", es: "Denegación del permiso — amenaza sanitaria", pt: "Recusa da autorização — ameaça sanitária" }
    body:
      en: "There is no published fixed list of approved or eligible countries; the Division of Veterinary Services assesses the country's status when you apply. An import permit may be refused in case of a sanitary threat to the country, and applications may take longer when the dog is imported from a new country. Confirm your country's eligibility with the DVS before making any arrangements."
      fr: "Il n'existe pas de liste fixe publiée de pays approuvés ou éligibles ; la Division of Veterinary Services évalue le statut du pays lors de ta demande. Un permis d'importation peut être refusé en cas de menace sanitaire pour le pays, et une demande peut être plus longue lorsque le chien vient d'un nouveau pays. Confirme l'éligibilité de ton pays auprès de la DVS avant toute organisation."
      es: "No hay una lista fija publicada de países aprobados o elegibles; la Division of Veterinary Services evalúa el estatus del país cuando presentas la solicitud. Un permiso de importación puede denegarse en caso de amenaza sanitaria para el país, y las solicitudes pueden tardar más cuando el perro se importa desde un país nuevo. Confirma la elegibilidad de tu país con la DVS antes de organizar nada."
      pt: "Não existe uma lista fixa publicada de países aprovados ou elegíveis; a Division of Veterinary Services avalia o estatuto do país quando você faz o pedido. A autorização de importação pode ser recusada em caso de ameaça sanitária para o país, e os pedidos podem demorar mais quando o cachorro é importado de um país novo. Confirme a elegibilidade do seu país com a DVS antes de organizar qualquer coisa."
    cls: no

arrival:
  intro:
    en: "Every dog arrives the same way: as manifest cargo, then to the Reduit quarantine facility for a minimum of 5 days."
    fr: "Tout chien arrive de la même manière : en fret manifesté, puis au centre de quarantaine de Réduit pour au minimum 5 jours."
    es: "Todos los perros llegan de la misma manera: como carga manifestada, y luego al centro de cuarentena de Réduit durante un mínimo de 5 días."
    pt: "Todo cachorro chega da mesma forma: como carga manifestada e depois para o centro de quarentena de Réduit por no mínimo 5 dias."
  points:
    - en: "Inform the Division of Veterinary Services of the flight number and arrival time by email at least four days before the dog arrives."
      fr: "Informe la Division of Veterinary Services du numéro de vol et de l'heure d'arrivée par e-mail au moins quatre jours avant l'arrivée du chien."
      es: "Informa a la Division of Veterinary Services del número de vuelo y la hora de llegada por correo electrónico al menos cuatro días antes de la llegada del perro."
      pt: "Informe à Division of Veterinary Services o número do voo e o horário de chegada por e-mail pelo menos quatro dias antes de o cachorro chegar."
    - en: "Your local broker must be present at the airport for customs formalities; if no representative is present, the animal risks being put back on the plane at the owner's cost."
      fr: "Ton courtier local doit être présent à l'aéroport pour les formalités douanières ; en l'absence de représentant, l'animal risque d'être remis dans l'avion aux frais du propriétaire."
      es: "Tu agente local debe estar presente en el aeropuerto para los trámites de aduanas; si no hay ningún representante, el animal corre el riesgo de ser devuelto al avión a cargo del propietario."
      pt: "O seu despachante local precisa estar presente no aeroporto para as formalidades aduaneiras; se nenhum representante estiver presente, o animal corre o risco de ser recolocado no avião às custas do dono."
    - en: "The dog must arrive with all original documents endorsed by the exporting country's Competent Authority, including the International Veterinary Certificate; consignments without an import permit and certificate are not cleared."
      fr: "Le chien doit arriver avec tous les documents originaux visés par l'Autorité compétente du pays exportateur, dont le Certificat vétérinaire international ; les envois sans permis d'importation et certificat ne sont pas dédouanés."
      es: "El perro debe llegar con todos los documentos originales refrendados por la Autoridad Competente del país exportador, incluido el Certificado Veterinario Internacional; los envíos sin permiso de importación y certificado no se despachan."
      pt: "O cachorro precisa chegar com todos os documentos originais endossados pela Autoridade Competente do país exportador, incluindo o Certificado Veterinário Internacional; as remessas sem autorização de importação e sem certificado não são liberadas."
    - en: "The dog is taken to the Quarantine Facility at Reduit for a minimum of 5 days; kennel rent is Rs 15 per day and the owner provides the dog's food."
      fr: "Le chien est conduit au centre de quarantaine de Réduit pour au minimum 5 jours ; le chenil coûte 15 Rs par jour et le propriétaire fournit la nourriture."
      es: "El perro es llevado al Centro de Cuarentena de Réduit durante un mínimo de 5 días; el alquiler de la perrera es de 15 Rs por día y el propietario proporciona la comida del perro."
      pt: "O cachorro é levado ao Quarantine Facility de Réduit por no mínimo 5 dias; o aluguel do canil é de 15 rupias mauricianas por dia e o dono fornece a comida do cachorro."
    - en: "The facility has no clinical veterinarian or medication on site; if treatment is needed, a private vet can be called or the dog taken to a clinic, at the owner's cost and under DVS supervision."
      fr: "Le centre n'a ni vétérinaire clinique ni médicaments sur place ; si un traitement est nécessaire, un vétérinaire privé peut être appelé ou le chien conduit en clinique, aux frais du propriétaire et sous la supervision de la DVS."
      es: "El centro no dispone de veterinario clínico ni de medicación in situ; si se necesita tratamiento, puede llamarse a un veterinario privado o llevar al perro a una clínica, a cargo del propietario y bajo la supervisión de la DVS."
      pt: "O centro não tem veterinário clínico nem medicamentos no local; se for preciso tratamento, um veterinário particular pode ser chamado ou o cachorro levado a uma clínica, às custas do dono e sob a supervisão da DVS."
    - en: "The dog must be collected by the owner or a person authorised in writing at the end of the quarantine period; a veterinary clearance fee of Rs 500 applies."
      fr: "Le chien doit être récupéré par le propriétaire ou une personne autorisée par écrit à la fin de la quarantaine ; des frais de dédouanement vétérinaire de 500 Rs s'appliquent."
      es: "El perro debe ser recogido por el propietario o una persona autorizada por escrito al final del período de cuarentena; se aplica una tasa de despacho veterinario de 500 Rs."
      pt: "O cachorro precisa ser retirado pelo dono ou por uma pessoa autorizada por escrito ao fim do período de quarentena; aplica-se uma taxa de liberação veterinária de 500 rupias mauricianas."

