restrictedDogs:
  intro:
    en: "Mauritius restricts certain dog breeds under the Animal Welfare Act 2013. Some breeds are banned from import outright (Fourth Schedule), while breeds classed as 'dangerous' (First Schedule) may only be imported as pure breeds, excluding those on the banned list."
    fr: "Maurice restreint certaines races de chiens au titre de l'Animal Welfare Act 2013. Certaines races sont totalement interdites d'importation (Quatrième annexe), tandis que les races classées « dangereuses » (Première annexe) ne peuvent être importées que comme races pures, à l'exclusion de celles figurant sur la liste interdite."
    es: "Mauricio restringe ciertas razas de perros al amparo de la Animal Welfare Act 2013. Algunas razas están totalmente prohibidas para la importación (Cuarto Anexo), mientras que las razas clasificadas como «peligrosas» (Primer Anexo) solo pueden importarse como razas puras, excluyendo las de la lista prohibida."
    pt: "A Ilha Maurício restringe certas raças de cachorro nos termos do Animal Welfare Act 2013 (lei de bem-estar animal). Algumas raças são totalmente proibidas de importação (Quarto Anexo), enquanto as raças classificadas como «perigosas» (Primeiro Anexo) só podem ser importadas como raças puras, excluindo as que estão na lista de proibidas."
  cat1:
    en: "Banned from import (Fourth Schedule, Animal Welfare Act 2013): American Pit Bull Terrier, American Staffordshire Terrier, Staffordshire Terrier, Blue Nose Pit Bull, Red Nose Pit Bull, Japanese Tosa, Dogo Argentino, Fila Brasileiro and Boerboel. These breeds cannot be imported into Mauritius."
    fr: "Interdits d'importation (Quatrième annexe, Animal Welfare Act 2013) : American Pit Bull Terrier, American Staffordshire Terrier, Staffordshire Terrier, Blue Nose Pit Bull, Red Nose Pit Bull, Tosa japonais, Dogo Argentino, Fila Brasileiro et Boerboel. Ces races ne peuvent pas être importées à Maurice."
    es: "Prohibidos para la importación (Cuarto Anexo, Animal Welfare Act 2013): American Pit Bull Terrier, American Staffordshire Terrier, Staffordshire Terrier, Blue Nose Pit Bull, Red Nose Pit Bull, Tosa Inu, Dogo Argentino, Fila Brasileiro y Boerboel. Estas razas no pueden importarse a Mauricio."
    pt: "Proibidos de importação (Quarto Anexo, Animal Welfare Act 2013): American Pit Bull Terrier, American Staffordshire Terrier, Staffordshire Terrier, Blue Nose Pit Bull, Red Nose Pit Bull, Tosa Japonês, Dogo Argentino, Fila Brasileiro e Boerboel. Essas raças não podem ser importadas para a Ilha Maurício."
  cat2:
    en: "'Dangerous dogs' (First Schedule) include Alaskan Malamute, Bull Mastiff, Cane Corso, Dobermann, Kangal, Mastino Napoletano, Presa Canario, Rhodesian Ridgeback and Rottweiler, among others. Only a pure breed from this list — excluding the Fourth Schedule banned breeds — may be imported, which in practice requires a pedigree certificate."
    fr: "Les « chiens dangereux » (Première annexe) incluent notamment l'Alaskan Malamute, le Bull Mastiff, le Cane Corso, le Dobermann, le Kangal, le Mastino Napoletano, le Presa Canario, le Rhodesian Ridgeback et le Rottweiler. Seul un chien de race pure de cette liste — hors races interdites de la Quatrième annexe — peut être importé, ce qui exige en pratique un certificat de pedigree."
    es: "Los «perros peligrosos» (Primer Anexo) incluyen, entre otros, el Alaskan Malamute, el Bull Mastiff, el Cane Corso, el Dóberman, el Kangal, el Mastino Napoletano, el Presa Canario, el Rhodesian Ridgeback y el Rottweiler. Solo puede importarse un perro de raza pura de esta lista — excluidas las razas prohibidas del Cuarto Anexo —, lo que en la práctica exige un certificado de pedigrí."
    pt: "Os «cachorros perigosos» (Primeiro Anexo) incluem, entre outros, Alaskan Malamute, Bull Mastiff, Cane Corso, Dobermann, Kangal, Mastino Napoletano, Presa Canario, Rhodesian Ridgeback e Rottweiler. Só pode ser importado um cachorro de raça pura dessa lista — excluídas as raças proibidas do Quarto Anexo —, o que na prática exige um certificado de pedigree."
  note:
    en: "Confirm your dog's breed eligibility with the Division of Veterinary Services and the Animal Welfare Unit before making any travel arrangements, as the schedules are set by national law and conditions may change without notice."
    fr: "Confirme l'éligibilité de la race de ton chien auprès de la Division of Veterinary Services et de l'Animal Welfare Unit avant toute organisation de voyage, car les annexes sont fixées par la loi nationale et les conditions peuvent changer sans préavis."
    es: "Confirma la elegibilidad de la raza de tu perro con la Division of Veterinary Services y la Animal Welfare Unit antes de organizar cualquier viaje, ya que los anexos los fija la ley nacional y las condiciones pueden cambiar sin previo aviso."
    pt: "Confirme a elegibilidade da raça do seu cachorro junto à Division of Veterinary Services e à Animal Welfare Unit antes de organizar qualquer viagem, pois os anexos são fixados pela lei nacional e as condições podem mudar sem aviso prévio."

checklist:
  - en: "Confirm your dog's breed is not banned (Fourth Schedule) and, if a 'dangerous' breed, that it is pure breed with a pedigree"
    fr: "Vérifie que la race de ton chien n'est pas interdite (Quatrième annexe) et, si c'est une race « dangereuse », qu'elle est pure avec un pedigree"
    es: "Confirma que la raza de tu perro no está prohibida (Cuarto Anexo) y, si es una raza «peligrosa», que es de raza pura con un pedigrí"
    pt: "Confirme que a raça do seu cachorro não é proibida (Quarto Anexo) e, se for uma raça «perigosa», que ela é pura e tem pedigree"
  - en: "Microchip implanted and scanned before the rabies blood sample"
    fr: "Puce posée et lue avant le prélèvement sanguin antirabique"
    es: "Microchip implantado y leído antes de la extracción de sangre para la rabia"
    pt: "Microchip implantado e lido antes da coleta de sangue para o teste antirrábico"
  - en: "Rabies vaccination, then RNATT ≥0.5 IU/ml (blood ≥4 weeks after vaccine), taken 3–12 months before shipment"
    fr: "Vaccination antirabique, puis RNATT ≥0,5 UI/ml (sang ≥4 semaines après le vaccin), réalisé 3 à 12 mois avant l'expédition"
    es: "Vacunación antirrábica, luego RNATT ≥0,5 UI/ml (sangre ≥4 semanas después de la vacuna), realizada de 3 a 12 meses antes del envío"
    pt: "Vacinação antirrábica e depois RNATT ≥0,5 UI/ml (sangue ≥4 semanas após a vacina), colhido de 3 a 12 meses antes do embarque"
  - en: "Observe the minimum 3-month waiting period from the sampling date before travel"
    fr: "Respecte le délai d'attente d'au moins 3 mois à partir de la date de prélèvement avant le voyage"
    es: "Respeta el período de espera mínimo de 3 meses desde la fecha de extracción antes del viaje"
    pt: "Respeite o período de espera mínimo de 3 meses a partir da data da coleta antes da viagem"
  - en: "Ehrlichia canis (IFAT, within 45 days) and Brucella canis tests, both negative"
    fr: "Tests Ehrlichia canis (IFAT, dans les 45 jours) et Brucella canis, tous deux négatifs"
    es: "Pruebas de Ehrlichia canis (IFAT, dentro de 45 días) y Brucella canis, ambas negativas"
    pt: "Testes de Ehrlichia canis (IFAT, nos 45 dias anteriores) e de Brucella canis, ambos negativos"
  - en: "Core vaccinations up to date (distemper, hepatitis, leptospirosis, parvovirus), not within 2 weeks of dispatch"
    fr: "Vaccinations essentielles à jour (maladie de Carré, hépatite, leptospirose, parvovirose), pas dans les 2 semaines avant l'expédition"
    es: "Vacunaciones esenciales al día (moquillo, hepatitis, leptospirosis, parvovirus), no dentro de las 2 semanas previas al envío"
    pt: "Vacinações essenciais em dia (cinomose, hepatite, leptospirose, parvovirose), não aplicadas nas 2 semanas anteriores ao envio"
  - en: "Sterilisation certificate (or pedigree + breeder's licence for breeding dogs)"
    fr: "Certificat de stérilisation (ou pedigree + licence d'éleveur pour les chiens reproducteurs)"
    es: "Certificado de esterilización (o pedigrí + licencia de criador para perros reproductores)"
    pt: "Certificado de castração (ou pedigree + licença de criador para cachorros reprodutores)"
  - en: "Apply for the import permit at least 3 months before departure, with motivation letter and required documents"
    fr: "Demande le permis d'importation au moins 3 mois avant le départ, avec lettre de motivation et documents requis"
    es: "Solicita el permiso de importación al menos 3 meses antes de la salida, con carta de motivación y documentos requeridos"
    pt: "Peça a autorização de importação pelo menos 3 meses antes da partida, com carta de motivação e os documentos exigidos"
  - en: "Endorsed International Veterinary Certificate and all original test reports travelling with the dog"
    fr: "Certificat vétérinaire international visé et tous les rapports de test originaux voyageant avec le chien"
    es: "Certificado Veterinario Internacional refrendado y todos los informes de pruebas originales viajando con el perro"
    pt: "Certificado Veterinário Internacional endossado e todos os laudos originais dos testes viajando com o cachorro"
  - en: "Fly the dog as manifest cargo, arrange a local broker, notify the DVS ≥4 days before arrival, and book the Reduit quarantine"
    fr: "Fais voyager le chien en fret manifesté, mandatez un courtier local, préviens la DVS ≥4 jours avant l'arrivée et réserve la quarantaine de Réduit"
    es: "Haz viajar al perro como carga manifestada, contrata un agente local, avisa a la DVS ≥4 días antes de la llegada y reserva la cuarentena de Réduit"
    pt: "Faça o cachorro viajar como carga manifestada, contrate um despachante local, avise a DVS ≥4 dias antes da chegada e reserve a quarentena de Réduit"

