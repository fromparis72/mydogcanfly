# Country Entry Guide — Mauritius (source of truth, bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_mu
iso2: "MU"
name: { en: "Mauritius", fr: "Maurice", es: "Mauricio", pt: "Ilha Maurício" }
region: { en: "Africa (Indian Ocean)", fr: "Afrique (océan Indien)", es: "África (océano Índico)", pt: "África (oceano Índico)" }


regime: listed
exit:
  authority: DVS
  authorityUrl: https://sps.govmu.org/lvd-exports/
  intro:
    en: "Mauritius is a listed country, so no rabies titer is needed to return — but the Division of Veterinary Services (DVS) is the competent authority that certifies your dog for export to the EU."
    fr: "Maurice est un pays listé : pas de titrage pour revenir — mais la Division des services vétérinaires (DVS) est l'autorité compétente qui certifie ton chien pour l'export vers l'UE."
    es: "Mauricio es un país listado: no hace falta titulación para volver — pero la División de Servicios Veterinarios (DVS) es la autoridad competente que certifica a tu perro para la exportación a la UE."
    pt: "A Ilha Maurício é um país listado: não é preciso teste sorológico antirrábico (titulação) para voltar — mas a Division of Veterinary Services (DVS) é a autoridade competente que certifica o seu cachorro para a exportação à UE."
  steps:
    - timing: window
      text:
        en: "The DVS issues the international veterinary certificate after inspection of the dog and health control; request it before departure so it meets the EU entry conditions."
        fr: "La DVS délivre le certificat vétérinaire international après inspection du chien et contrôle sanitaire ; demande-le avant le départ pour qu'il respecte les conditions d'entrée UE."
        es: "La DVS emite el certificado veterinario internacional tras la inspección del perro y el control sanitario; solicítalo antes de salir para que cumpla las condiciones de entrada en la UE."
        pt: "A DVS emite o certificado veterinário internacional após a inspeção do cachorro e o controle sanitário; peça-o antes da partida para que atenda às condições de entrada na UE."
  onSiteNote:
    en: "The DVS is Mauritius's competent authority for certifying animals bound for the EU — go through it, not just a private vet."
    fr: "La DVS est l'autorité compétente mauricienne pour certifier les animaux à destination de l'UE — passe par elle, pas seulement par un vétérinaire privé."
    es: "La DVS es la autoridad competente de Mauricio para certificar animales con destino a la UE — pasa por ella, no solo por un veterinario privado."
    pt: "A DVS é a autoridade competente da Ilha Maurício para certificar animais com destino à UE — passe por ela, não apenas por um veterinário particular."

hero:
  h1: { en: "Traveling to Mauritius with your dog", fr: "Voyager à Maurice avec ton chien", es: "Viajar a Mauricio con tu perro", pt: "Viajar para a Ilha Maurício com seu cachorro" }
  intro:
    en: >-
      Mauritius welcomes dogs, but as a rabies-free Indian Ocean island it runs strict import controls
      managed by the Division of Veterinary Services of the Ministry of Agro-Industry and Food Security.
      Every dog needs an import permit obtained before departure, a rabies neutralising antibody titer
      test (RNATT) followed by a waiting period, several disease tests, up-to-date core vaccinations, an
      International Veterinary Certificate endorsed by the exporting country's authorities, and a
      mandatory quarantine at the Reduit facility on arrival. What you must prepare depends heavily on
      where your dog is coming from and its rabies history. Plan on several months of veterinary
      preparation and apply for the permit at least three months before departure. This guide explains
      each official step so you know exactly what to prepare before you book.
    fr: >-
      Maurice accueille les chiens, mais en tant qu'île de l'océan Indien indemne de rage, elle applique
      des contrôles d'importation stricts gérés par la Division of Veterinary Services du Ministère de
      l'Agro-Industrie et de la Sécurité alimentaire. Chaque chien doit disposer d'un permis
      d'importation obtenu avant le départ, d'un titrage des anticorps antirabiques (RNATT) suivi d'un
      délai d'attente, de plusieurs tests de maladies, de vaccinations essentielles à jour, d'un
      Certificat vétérinaire international visé par les autorités du pays exportateur, et d'une
      quarantaine obligatoire au centre de Réduit à l'arrivée. Ce qu'il faut préparer dépend fortement
      de la provenance du chien et de son historique rabique. Compte plusieurs mois de préparation
      vétérinaire et demande le permis au moins trois mois avant le départ. Ce guide détaille chaque
      étape officielle.
    es: >-
      Mauricio acoge a los perros, pero como isla del océano Índico libre de rabia aplica controles de
      importación estrictos gestionados por la Division of Veterinary Services del Ministerio de
      Agroindustria y Seguridad Alimentaria. Cada perro necesita un permiso de importación obtenido
      antes de la salida, una prueba de titulación de anticuerpos neutralizantes de la rabia (RNATT)
      seguida de un período de espera, varias pruebas de enfermedades, vacunaciones esenciales al día,
      un Certificado Veterinario Internacional refrendado por las autoridades del país exportador, y una
      cuarentena obligatoria en el centro de Réduit a la llegada. Lo que debes preparar depende mucho
      del lugar del que venga tu perro y de su historial antirrábico. Cuenta con varios meses de
      preparación veterinaria y solicita el permiso al menos tres meses antes de la salida. Esta guía
      explica cada paso oficial para que sepas exactamente qué preparar antes de reservar.

    pt: "A Ilha Maurício recebe bem os cachorros, mas, por ser uma ilha do oceano Índico livre de raiva, aplica controles de importação rigorosos, geridos pela Division of Veterinary Services do Ministry of Agro-Industry and Food Security. Todo cachorro precisa de uma autorização de importação obtida antes da partida, de um teste sorológico antirrábico de anticorpos neutralizantes (RNATT) seguido de um período de espera, de vários testes de doenças, de vacinações essenciais em dia, de um Certificado Veterinário Internacional endossado pelas autoridades do país exportador e de uma quarentena obrigatória no centro de Réduit na chegada. O que você precisa preparar depende muito de onde o seu cachorro vem e do histórico dele em relação à raiva. Conte com vários meses de preparação veterinária e peça a autorização pelo menos três meses antes da partida. Este guia explica cada etapa oficial para você saber exatamente o que preparar antes de reservar."
difficulty:
  level: difficult
  label: { en: "Difficult — permit, tests and quarantine required", fr: "Difficile — permis, tests et quarantaine exigés", es: "Difícil — se exigen permiso, pruebas y cuarentena", pt: "Difícil — exige autorização, exames e quarentena" }

prepTime:
  eu:
    en: "Standard route (rabies antibody test): allow several months — rabies vaccination, RNATT and a minimum 3-month waiting period from sampling, disease tests, permit and a 5-day quarantine."
    fr: "Parcours standard (titrage antirabique) : compte plusieurs mois — vaccination antirabique, RNATT et délai d'attente d'au moins 3 mois à partir du prélèvement, tests de maladies, permis et quarantaine de 5 jours."
    es: "Ruta estándar (prueba de titulación de rabia): cuenta con varios meses — vacunación antirrábica, RNATT y un período de espera mínimo de 3 meses desde la extracción, pruebas de enfermedades, permiso y una cuarentena de 5 días."
    pt: "Percurso padrão (teste sorológico antirrábico): conte com vários meses — vacinação antirrábica, RNATT e um período de espera mínimo de 3 meses a partir da coleta, testes de doenças, autorização de importação e quarentena de 5 dias."
  listed:
    en: "Quarantine-station alternative: instead of the antibody test, the dog is kept in an approved quarantine station in the exporting country for six months before shipment — plan well over half a year."
    fr: "Alternative station de quarantaine : à la place du titrage, le chien est maintenu six mois dans une station de quarantaine agréée du pays exportateur avant l'expédition — prévois bien plus de six mois."
    es: "Alternativa de estación de cuarentena: en lugar de la prueba de titulación, el perro se mantiene en una estación de cuarentena aprobada del país exportador durante seis meses antes del envío — cuenta con bastante más de medio año."
    pt: "Alternativa com estação de quarentena: em vez do teste sorológico, o cachorro fica seis meses em uma estação de quarentena aprovada no país exportador antes do embarque — conte com bem mais de meio ano."
  nonListed:
    en: "Import permits may be refused where the Division of Veterinary Services identifies a sanitary threat; the country's status is assessed at the time of application."
    fr: "Un permis d'importation peut être refusé lorsque la Division of Veterinary Services identifie une menace sanitaire ; le statut du pays est évalué au moment de la demande."
    es: "Los permisos de importación pueden denegarse cuando la Division of Veterinary Services identifica una amenaza sanitaria; el estatus del país se evalúa en el momento de la solicitud."
    pt: "As autorizações de importação podem ser recusadas quando a Division of Veterinary Services identifica uma ameaça sanitária; o estatuto do país é avaliado no momento do pedido."

