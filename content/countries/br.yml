notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro."
    pt: "Só um médico-veterinário pode confirmar o procedimento exato para o seu cachorro."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Brazil (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — le Brésil (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Brasil (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — o Brasil (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — Brazil", fr: "Pays de destination — Brésil", es: "País de destino — Brasil", pt: "País de destino — Brasil" }
      text:
        en: "Brazil requires an official International Veterinary Certificate (CVI), a valid rabies vaccination, an anti-parasite treatment and a clinical exam. No import permit and no quarantine apply to a personal pet dog."
        fr: "Le Brésil exige un Certificat Vétérinaire International (CVI) officiel, une vaccination antirabique valide, un traitement antiparasitaire et un examen clinique. Aucun permis d'importation ni quarantaine ne s'applique à un chien de compagnie personnel."
        es: "Brasil exige un Certificado Veterinario Internacional (CVI) oficial, una vacunación antirrábica válida, un tratamiento antiparasitario y un examen clínico. No se aplica ningún permiso de importación ni cuarentena a un perro de compañía personal."
        pt: "O Brasil exige um Certificado Veterinário Internacional (CVI) oficial, vacinação antirrábica válida, tratamento antiparasitário e exame clínico. Não há autorização de importação nem quarentena para um cachorro de estimação."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The departure country's official veterinary authority must issue or endorse the CVI. If that country is recognised as rabies-free by the WOAH, proof of rabies vaccination is not required."
        fr: "L'autorité vétérinaire officielle du pays de départ doit émettre ou viser le CVI. Si ce pays est reconnu indemne de rage par l'OMSA, la preuve de vaccination antirabique n'est pas exigée."
        es: "La autoridad veterinaria oficial del país de salida debe expedir o refrendar el CVI. Si ese país está reconocido como libre de rabia por la OMSA, no se exige prueba de vacunación antirrábica."
        pt: "A autoridade veterinária oficial do país de partida deve emitir ou endossar o CVI. Se esse país for reconhecido como livre de raiva pela WOAH, não é preciso comprovar a vacinação antirrábica."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "The rabies situation of your dog's real origin matters more than the last airport. A puppy under 90 days must not have been in contact with any urban rabies case in the previous 90 days."
        fr: "La situation rabique de l'origine réelle de ton chien compte plus que le dernier aéroport. Un chiot de moins de 90 jours ne doit pas avoir été en contact avec un cas de rage urbaine dans les 90 jours précédents."
        es: "La situación de rabia del origen real de tu perro cuenta más que el último aeropuerto. Un cachorro de menos de 90 días no debe haber estado en contacto con ningún caso de rabia urbana en los 90 días anteriores."
        pt: "A situação da raiva na origem real do seu cachorro pesa mais do que o último aeroporto. Um filhote com menos de 90 dias não pode ter tido contato com nenhum caso de raiva urbana nos 90 dias anteriores."
  note:
    en: "So read the requirements below as Brazil's framework, then confirm your dog's exact origin and history with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre brésilien, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Brasil y luego confirma el origen y el historial exactos de tu perro con tu veterinario."
    pt: "Leia então as exigências abaixo como o quadro geral do Brasil, e confirme com seu veterinário a origem e o histórico exatos do seu cachorro."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Not required", fr: "Non requise", es: "No obligatorio", pt: "Não obrigatório" }
    when: { en: "Optional for Brazil; if an electronic ID is used it must comply with ISO 11784/11785 and its location be noted on the CVI.", fr: "Facultative pour le Brésil ; si une identification électronique est utilisée, elle doit être conforme à l'ISO 11784/11785 et sa localisation indiquée sur le CVI.", es: "Opcional para Brasil; si se utiliza una identificación electrónica, debe cumplir con la ISO 11784/11785 y su ubicación indicarse en el CVI.", pt: "Facultativo para o Brasil; se houver identificação eletrônica, ela deve atender às normas ISO 11784/11785 e sua localização deve constar no CVI." }
    exceptions: { en: "Strongly recommended for reliable identification and often required by the departure country and the airline.", fr: "Fortement recommandée pour une identification fiable et souvent exigée par le pays de départ et la compagnie aérienne.", es: "Muy recomendado para una identificación fiable y a menudo exigido por el país de salida y la aerolínea.", pt: "Fortemente recomendado para uma identificação confiável, e muitas vezes exigido pelo país de partida e pela companhia aérea." }
    ref: { en: "Portaria MAPA nº 741/2024, Art. 17", fr: "Portaria MAPA nº 741/2024, art. 17", es: "Portaria MAPA nº 741/2024, art. 17", pt: "Portaria MAPA nº 741/2024, art. 17" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "For all dogs from 90 days of age, using an authorised vaccine that is still in date; a first vaccination allows departure only 21 days after the shot.", fr: "Pour tout chien à partir de 90 jours, avec un vaccin autorisé encore en cours de validité ; une primo-vaccination n'autorise le départ que 21 jours après l'injection.", es: "Para todos los perros a partir de los 90 días de edad, con una vacuna autorizada aún vigente; una primovacunación solo permite la salida 21 días después de la inyección.", pt: "Para todos os cães a partir dos 90 dias de idade, com vacina autorizada e dentro da validade; em caso de primeira dose, a saída só é permitida 21 dias depois da aplicação." }
    exceptions: { en: "Not required if the origin country/zone is WOAH-recognised rabies-free (stated on the CVI), or for puppies under 90 days meeting the age conditions.", fr: "Non requise si le pays/la zone d'origine est reconnu indemne de rage par l'OMSA (mentionné sur le CVI), ou pour les chiots de moins de 90 jours remplissant les conditions d'âge.", es: "No obligatoria si el país/la zona de origen está reconocido como libre de rabia por la OMSA (indicado en el CVI), o para los cachorros de menos de 90 días que cumplan las condiciones de edad.", pt: "Não é exigida se o país ou a zona de origem for reconhecido pela WOAH como livre de raiva (o que deve constar no CVI), nem para filhotes com menos de 90 dias que atendam às condições de idade." }
    ref: { en: "Portaria MAPA nº 741/2024, Art. 9–12", fr: "Portaria MAPA nº 741/2024, art. 9 à 12", es: "Portaria MAPA nº 741/2024, art. 9 a 12", pt: "Portaria MAPA nº 741/2024, art. 9 a 12" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not required", fr: "Non requis", es: "No obligatoria", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Brazil does not require a rabies antibody test for the entry of a personal pet dog.", fr: "Le Brésil n'exige pas de titrage antirabique pour l'entrée d'un chien de compagnie personnel.", es: "Brasil no exige una prueba de titulación de rabia para la entrada de un perro de compañía personal.", pt: "O Brasil não exige teste sorológico antirrábico para a entrada de um cachorro de estimação." }
    ref: { en: "Portaria MAPA nº 741/2024", fr: "Portaria MAPA nº 741/2024", es: "Portaria MAPA nº 741/2024", pt: "Portaria MAPA nº 741/2024" }
  - item: { en: "Official pet passport (in lieu of CVI)", fr: "Passeport officiel (à la place du CVI)", es: "Pasaporte oficial para mascotas (en lugar del CVI)", pt: "Passaporte oficial para animais (no lugar do CVI)" }
    required: { en: "Accepted only from reciprocal countries", fr: "Accepté uniquement depuis les pays réciproques", es: "Aceptado solo desde países recíprocos", pt: "Aceito somente de países com reciprocidade" }
    when: { en: "A pet passport is accepted only if issued/endorsed by the origin's veterinary authority and if that country reciprocally accepts the Brazilian passport; it must carry all CVI data.", fr: "Un passeport n'est accepté que s'il est émis/visé par l'autorité vétérinaire d'origine et si ce pays accepte réciproquement le passeport brésilien ; il doit contenir toutes les données du CVI.", es: "Un pasaporte para mascotas solo se acepta si es expedido/refrendado por la autoridad veterinaria de origen y si ese país acepta recíprocamente el pasaporte brasileño; debe contener todos los datos del CVI.", pt: "Um passaporte para animais só é aceito se for emitido ou endossado pela autoridade veterinária da origem e se esse país aceitar reciprocamente o passaporte brasileiro; ele deve conter todos os dados do CVI." }
    exceptions: { en: "The European Pet Passport is currently NOT valid to enter Brazil — a CVI is required instead.", fr: "Le passeport européen pour animaux n'est actuellement PAS valable pour entrer au Brésil — un CVI est requis à la place.", es: "El pasaporte europeo para mascotas actualmente NO es válido para entrar en Brasil — en su lugar se requiere un CVI.", pt: "O passaporte europeu para animais de estimação NÃO é válido hoje para entrar no Brasil — é preciso o CVI." }
    ref: { en: "Portaria MAPA nº 741/2024, Art. 8; MAPA guidance", fr: "Portaria MAPA nº 741/2024, art. 8 ; guide MAPA", es: "Portaria MAPA nº 741/2024, art. 8; guía del MAPA", pt: "Portaria MAPA nº 741/2024, art. 8; orientações do MAPA" }
  - item: { en: "International Veterinary Certificate (CVI)", fr: "Certificat Vétérinaire International (CVI)", es: "Certificado Veterinario Internacional (CVI)", pt: "Certificado Veterinário Internacional (CVI)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Original CVI issued or endorsed by an official veterinarian of the departure country's veterinary authority, on the MERCOSUR model (mandatory since 6 Sept 2025); valid 60 days from issue while the rabies vaccination stays valid.", fr: "CVI original émis ou visé par un vétérinaire officiel de l'autorité vétérinaire du pays de départ, sur le modèle MERCOSUR (obligatoire depuis le 6 sept. 2025) ; valable 60 jours à compter de l'émission tant que la vaccination antirabique reste valide.", es: "CVI original expedido o refrendado por un veterinario oficial de la autoridad veterinaria del país de salida, según el modelo del MERCOSUR (obligatorio desde el 6 de septiembre de 2025); válido 60 días desde su expedición mientras la vacunación antirrábica siga vigente.", pt: "CVI original emitido ou endossado por um veterinário oficial da autoridade veterinária do país de partida, no modelo do MERCOSUL (obrigatório desde 6 de setembro de 2025); válido por 60 dias a contar da emissão, enquanto a vacinação antirrábica continuar válida." }
    exceptions: { en: "A certificate signed only by a private veterinarian is not accepted. Brazil may refuse animals previously diagnosed with leishmaniasis.", fr: "Un certificat signé uniquement par un vétérinaire privé n'est pas accepté. Le Brésil peut refuser un animal ayant déjà été diagnostiqué avec une leishmaniose.", es: "No se acepta un certificado firmado únicamente por un veterinario privado. Brasil puede rechazar a animales previamente diagnosticados con leishmaniasis.", pt: "Um certificado assinado apenas por um veterinário particular não é aceito. O Brasil pode recusar animais que já tenham tido diagnóstico de leishmaniose." }
    ref: { en: "Portaria MAPA nº 741/2024, Art. 5–6, 15", fr: "Portaria MAPA nº 741/2024, art. 5-6, 15", es: "Portaria MAPA nº 741/2024, art. 5-6, 15", pt: "Portaria MAPA nº 741/2024, art. 5 e 6, e 15" }
  - item: { en: "Broad-spectrum anti-parasite treatment", fr: "Traitement antiparasitaire à large spectre", es: "Tratamiento antiparasitario de amplio espectro", pt: "Tratamento antiparasitário de amplo espectro" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Against internal and external parasites, with authorised products, within the 15 days before the CVI is issued; active ingredients must be recorded.", fr: "Contre les parasites internes et externes, avec des produits autorisés, dans les 15 jours précédant l'émission du CVI ; les principes actifs doivent être consignés.", es: "Contra parásitos internos y externos, con productos autorizados, dentro de los 15 días previos a la expedición del CVI; deben registrarse los principios activos.", pt: "Contra parasitas internos e externos, com produtos autorizados, nos 15 dias anteriores à emissão do CVI; os princípios ativos devem ser registrados." }
    exceptions: { en: "—", fr: "—", es: "—", pt: "—" }
    ref: { en: "Portaria MAPA nº 741/2024, Art. 13", fr: "Portaria MAPA nº 741/2024, art. 13", es: "Portaria MAPA nº 741/2024, art. 13", pt: "Portaria MAPA nº 741/2024, art. 13" }
  - item: { en: "Clinical examination", fr: "Examen clinique", es: "Examen clínico", pt: "Exame clínico" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "By a registered veterinarian within 10 days before the CVI is issued, confirming no signs of infectious or parasitic disease and fitness for transport.", fr: "Par un vétérinaire enregistré dans les 10 jours précédant l'émission du CVI, confirmant l'absence de signes de maladie infectieuse ou parasitaire et l'aptitude au transport.", es: "Por un veterinario registrado dentro de los 10 días previos a la expedición del CVI, confirmando la ausencia de signos de enfermedad infecciosa o parasitaria y la aptitud para el transporte.", pt: "Feito por médico-veterinário registrado nos 10 dias anteriores à emissão do CVI, atestando a ausência de sinais de doença infecciosa ou parasitária e a aptidão para o transporte." }
    exceptions: { en: "—", fr: "—", es: "—", pt: "—" }
    ref: { en: "Portaria MAPA nº 741/2024, Art. 14", fr: "Portaria MAPA nº 741/2024, art. 14", es: "Portaria MAPA nº 741/2024, art. 14", pt: "Portaria MAPA nº 741/2024, art. 14" }
  - item: { en: "Import permit / advance notification", fr: "Permis d'importation / notification préalable", es: "Permiso de importación / notificación previa", pt: "Autorização de importação / notificação prévia" }
    required: { en: "Not required", fr: "Non requis", es: "No obligatorio", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "No import permit is needed for a personal pet dog or cat; other pet species (ferrets, rabbits, etc.) do need a MAPA import authorisation.", fr: "Aucun permis d'importation n'est requis pour un chien ou chat de compagnie personnel ; les autres espèces de compagnie (furets, lapins, etc.) nécessitent une autorisation d'importation du MAPA.", es: "No se necesita permiso de importación para un perro o gato de compañía personal; otras especies de compañía (hurones, conejos, etc.) sí necesitan una autorización de importación del MAPA.", pt: "Não é preciso autorização de importação para cão ou gato de estimação; outras espécies de companhia (furões, coelhos etc.) precisam de autorização de importação do MAPA." }
    ref: { en: "MAPA / VIGIAGRO — how to bring your dog or cat", fr: "MAPA / VIGIAGRO — comment amener ton chien ou chat", es: "MAPA / VIGIAGRO — cómo traer a tu perro o gato", pt: "MAPA / VIGIAGRO — como trazer seu cão ou gato" }
  - item: { en: "Border check (VIGIAGRO)", fr: "Contrôle frontalier (VIGIAGRO)", es: "Control fronterizo (VIGIAGRO)", pt: "Fiscalização na fronteira (VIGIAGRO)" }
    required: { en: "On arrival", fr: "À l'arrivée", es: "A la llegada", pt: "Na chegada" }
    when: { en: "Present the original CVI (or accepted passport) to the VIGIAGRO agricultural inspection at the point of entry; agents must not retain the original.", fr: "Présente le CVI original (ou le passeport accepté) à l'inspection agricole VIGIAGRO au point d'entrée ; les agents ne doivent pas retenir l'original.", es: "Presenta el CVI original (o el pasaporte aceptado) a la inspección agropecuaria de VIGIAGRO en el punto de entrada; los agentes no deben retener el original.", pt: "Apresente o CVI original (ou o passaporte aceito) à fiscalização agropecuária do VIGIAGRO no ponto de entrada; os agentes não podem reter o original." }
    exceptions: { en: "—", fr: "—", es: "—", pt: "—" }
    ref: { en: "Portaria MAPA nº 741/2024, Art. 7; VIGIAGRO", fr: "Portaria MAPA nº 741/2024, art. 7 ; VIGIAGRO", es: "Portaria MAPA nº 741/2024, art. 7; VIGIAGRO", pt: "Portaria MAPA nº 741/2024, art. 7; VIGIAGRO" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "Conditional under 90 days", fr: "Conditionnel sous 90 jours", es: "Condicional por debajo de los 90 días", pt: "Condicional abaixo de 90 dias" }
    when: { en: "A puppy under 90 days may enter unvaccinated if the CVI certifies its age and that it has had no contact with any urban rabies case in the previous 90 days.", fr: "Un chiot de moins de 90 jours peut entrer non vacciné si le CVI atteste son âge et l'absence de contact avec tout cas de rage urbaine dans les 90 jours précédents.", es: "Un cachorro de menos de 90 días puede entrar sin vacunar si el CVI certifica su edad y que no ha tenido contacto con ningún caso de rabia urbana en los 90 días anteriores.", pt: "Um filhote com menos de 90 dias pode entrar sem vacina se o CVI atestar sua idade e que ele não teve contato com nenhum caso de raiva urbana nos 90 dias anteriores." }
    exceptions: { en: "A nursing puppy travelling with its mother is treated as one biological unit and noted on the mother's CVI.", fr: "Un chiot allaité voyageant avec sa mère est traité comme une unité biologique et mentionné sur le CVI de la mère.", es: "Un cachorro lactante que viaja con su madre se trata como una unidad biológica y se indica en el CVI de la madre.", pt: "Um filhote em fase de amamentação que viaja com a mãe é tratado como uma única unidade biológica e é registrado no CVI da mãe." }
    ref: { en: "Portaria MAPA nº 741/2024, Art. 11, 16", fr: "Portaria MAPA nº 741/2024, art. 11, 16", es: "Portaria MAPA nº 741/2024, art. 11, 16", pt: "Portaria MAPA nº 741/2024, art. 11 e 16" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
