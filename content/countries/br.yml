    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Only in case of non-compliance — VIGIAGRO may then order refusal, re-export, retention or other measures at the owner's expense.", fr: "Uniquement en cas de non-conformité — le VIGIAGRO peut alors ordonner un refus, une réexpédition, une rétention ou d'autres mesures aux frais du propriétaire.", es: "Solo en caso de incumplimiento — VIGIAGRO puede entonces ordenar el rechazo, la reexportación, la retención u otras medidas a cargo del propietario.", pt: "Apenas em caso de irregularidade — o VIGIAGRO pode então determinar a recusa, a reexportação, a retenção ou outras medidas, às custas do proprietário." }
    ref: { en: "Portaria MAPA nº 741/2024, Art. 18–19", fr: "Portaria MAPA nº 741/2024, art. 18-19", es: "Portaria MAPA nº 741/2024, art. 18-19", pt: "Portaria MAPA nº 741/2024, art. 18 e 19" }

origin:
  eu:
    title: { en: "Standard case — rabies-affected country", fr: "Cas standard — pays touché par la rage", es: "Caso estándar — país afectado por la rabia", pt: "Caso padrão — país com presença de raiva" }
    body:
      en: "From most countries, your dog needs a valid rabies vaccination (from 90 days of age), a broad-spectrum anti-parasite treatment within 15 days and a clinical exam within 10 days, all recorded on an official International Veterinary Certificate (CVI) issued or endorsed by the departure country's veterinary authority. No antibody test and no quarantine."
      fr: "Depuis la plupart des pays, ton chien a besoin d'une vaccination antirabique valide (dès 90 jours), d'un traitement antiparasitaire à large spectre dans les 15 jours et d'un examen clinique dans les 10 jours, le tout consigné sur un Certificat Vétérinaire International (CVI) officiel émis ou visé par l'autorité vétérinaire du pays de départ. Pas de titrage ni de quarantaine."
      es: "Desde la mayoría de los países, tu perro necesita una vacunación antirrábica válida (desde los 90 días), un tratamiento antiparasitario de amplio espectro dentro de los 15 días y un examen clínico dentro de los 10 días, todo registrado en un Certificado Veterinario Internacional (CVI) oficial expedido o refrendado por la autoridad veterinaria del país de salida. Sin prueba de titulación ni cuarentena."
      pt: "Vindo da maioria dos países, seu cachorro precisa de vacinação antirrábica válida (a partir dos 90 dias de idade), tratamento antiparasitário de amplo espectro nos 15 dias anteriores e exame clínico nos 10 dias anteriores, tudo registrado em um Certificado Veterinário Internacional (CVI) oficial emitido ou endossado pela autoridade veterinária do país de partida. Sem teste sorológico e sem quarentena."
    cls: warn
  listed:
    title: { en: "Rabies-free country — no vaccination proof", fr: "Pays indemne de rage — sans preuve de vaccination", es: "País libre de rabia — sin prueba de vacunación", pt: "País livre de raiva — sem comprovação de vacina" }
    body:
      en: "If your dog's origin country or zone is officially recognised as rabies-free by the WOAH — and Brazil recognises that status in advance — no proof of rabies vaccination is required. This must be certified on the CVI. The anti-parasite treatment, clinical exam and official CVI still apply."
      fr: "Si le pays ou la zone d'origine de ton chien est officiellement reconnu indemne de rage par l'OMSA — et que le Brésil reconnaît ce statut au préalable — aucune preuve de vaccination antirabique n'est requise. Cela doit être certifié sur le CVI. Le traitement antiparasitaire, l'examen clinique et le CVI officiel restent exigés."
      es: "Si el país o la zona de origen de tu perro está oficialmente reconocido como libre de rabia por la OMSA — y Brasil reconoce ese estatus de antemano — no se exige prueba de vacunación antirrábica. Esto debe certificarse en el CVI. El tratamiento antiparasitario, el examen clínico y el CVI oficial siguen siendo obligatorios."
      pt: "Se o país ou a zona de origem do seu cachorro for oficialmente reconhecido como livre de raiva pela WOAH — e o Brasil reconhecer esse status previamente —, não é preciso comprovar a vacinação antirrábica. Isso deve ser atestado no CVI. O tratamento antiparasitário, o exame clínico e o CVI oficial continuam valendo."
    cls: ok
  nonListed:
    title: { en: "First vaccination or young puppy", fr: "Primo-vaccination ou jeune chiot", es: "Primera vacunación o cachorro joven", pt: "Primeira vacinação ou filhote novo" }
    body:
      en: "If the rabies vaccination is a first-time shot, departure is only allowed 21 days after it. A puppy under 90 days may enter unvaccinated only if the CVI certifies its age and that it has had no contact with urban rabies in the previous 90 days. Plan the extra lead time before booking."
      fr: "Si la vaccination antirabique est une primo-vaccination, le départ n'est autorisé que 21 jours après. Un chiot de moins de 90 jours ne peut entrer non vacciné que si le CVI atteste son âge et l'absence de contact avec la rage urbaine dans les 90 jours précédents. Prévois ce délai supplémentaire avant de réserver."
      es: "Si la vacunación antirrábica es una primera dosis, la salida solo se permite 21 días después. Un cachorro de menos de 90 días solo puede entrar sin vacunar si el CVI certifica su edad y que no ha tenido contacto con la rabia urbana en los 90 días anteriores. Prevé este plazo adicional antes de reservar."
      pt: "Se a vacinação antirrábica for a primeira dose, a saída só é permitida 21 dias depois dela. Um filhote com menos de 90 dias só pode entrar sem vacina se o CVI atestar sua idade e que ele não teve contato com raiva urbana nos 90 dias anteriores. Considere esse prazo extra antes de reservar."
    cls: warn

arrival:
  intro:
    en: "When your dog reaches Brazil, checks are carried out by VIGIAGRO, the international agricultural surveillance service, at the point of entry."
    fr: "À l'arrivée de ton chien au Brésil, les contrôles sont effectués par le VIGIAGRO, le service de surveillance agricole internationale, au point d'entrée."
    es: "Cuando tu perro llega a Brasil, los controles los realiza VIGIAGRO, el servicio de vigilancia agropecuaria internacional, en el punto de entrada."
    pt: "Quando seu cachorro chega ao Brasil, a conferência é feita pelo VIGIAGRO, serviço de vigilância agropecuária internacional, no ponto de entrada."
  points:
    - en: "Present the original International Veterinary Certificate (or an accepted official passport) to the VIGIAGRO desk on arrival."
      fr: "Présente le Certificat Vétérinaire International original (ou un passeport officiel accepté) au guichet VIGIAGRO à l'arrivée."
      es: "Presenta el Certificado Veterinario Internacional original (o un pasaporte oficial aceptado) en el mostrador de VIGIAGRO a la llegada."
      pt: "Apresente o Certificado Veterinário Internacional original (ou um passaporte oficial aceito) no guichê do VIGIAGRO ao chegar."
    - en: "The certificate must be issued or endorsed by an official government veterinarian — one signed only by a private vet is refused."
      fr: "Le certificat doit être émis ou visé par un vétérinaire officiel du gouvernement — un certificat signé uniquement par un vétérinaire privé est refusé."
      es: "El certificado debe ser expedido o refrendado por un veterinario oficial del gobierno — se rechaza uno firmado únicamente por un veterinario privado."
      pt: "O certificado deve ser emitido ou endossado por um veterinário oficial do governo — um documento assinado apenas por veterinário particular é recusado."
    - en: "VIGIAGRO agents must not keep the original CVI — it stays with the owner throughout the trip."
      fr: "Les agents du VIGIAGRO ne doivent pas conserver le CVI original — il reste avec le propriétaire pendant tout le voyage."
      es: "Los agentes de VIGIAGRO no deben quedarse con el CVI original — permanece con el propietario durante todo el viaje."
      pt: "Os agentes do VIGIAGRO não podem ficar com o CVI original — ele permanece com o proprietário durante toda a viagem."
    - en: "No import permit and no prior appointment are needed for a personal pet dog; carry original documents, not copies."
      fr: "Aucun permis d'importation ni rendez-vous préalable n'est nécessaire pour un chien de compagnie personnel ; munis-toi des documents originaux, pas de copies."
      es: "No se necesita permiso de importación ni cita previa para un perro de compañía personal; lleva los documentos originales, no copias."
      pt: "Não é preciso autorização de importação nem agendamento prévio para um cachorro de estimação; leve os documentos originais, não cópias."
    - en: "If documents are missing or invalid, VIGIAGRO may order refusal, re-export, retention or other sanitary measures — all at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, le VIGIAGRO peut ordonner un refus, une réexpédition, une rétention ou d'autres mesures sanitaires — le tout aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, VIGIAGRO puede ordenar el rechazo, la reexportación, la retención u otras medidas sanitarias — todo a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, o VIGIAGRO pode determinar a recusa, a reexportação, a retenção ou outras medidas sanitárias — tudo às custas do proprietário."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Brazil has no national law banning specific dog breeds from import, and the MERCOSUR framework only lets member states set up a specific regime for breeds considered dangerous. Pit-bull-type dogs are legal and popular nationally."
    fr: "Le Brésil n'a pas de loi nationale interdisant l'importation de races de chiens spécifiques, et le cadre MERCOSUR permet seulement aux États membres d'instaurer un régime spécifique pour les races considérées dangereuses. Les chiens de type pit-bull sont légaux et populaires à l'échelle nationale."
    es: "Brasil no tiene ninguna ley nacional que prohíba la importación de razas de perros específicas, y el marco del MERCOSUR solo permite a los Estados miembros establecer un régimen específico para las razas consideradas peligrosas. Los perros de tipo pit bull son legales y populares a escala nacional."
    pt: "O Brasil não tem lei nacional que proíba a importação de raças específicas, e o quadro do MERCOSUL apenas permite que os Estados-membros criem um regime específico para raças consideradas perigosas. Cães do tipo pit bull são legais e populares no país."
  cat1:
    en: "No breed is banned from entering Brazil at federal level. There is no national dangerous-dog import category comparable to those of some European countries."
    fr: "Aucune race n'est interdite d'entrée au Brésil au niveau fédéral. Il n'existe pas de catégorie nationale d'importation de chiens dangereux comparable à celle de certains pays européens."
    es: "Ninguna raza está prohibida de entrar en Brasil a nivel federal. No existe una categoría nacional de importación de perros peligrosos comparable a la de algunos países europeos."
    pt: "Nenhuma raça é proibida de entrar no Brasil em nível federal. Não existe uma categoria nacional de importação de cães perigosos comparável à de alguns países europeus."
  cat2:
    en: "Some states and municipalities regulate pit-bull-type dogs locally (for example rules on breeding, sale, sterilisation or microchipping). Check the specific rules of your destination state or city."
    fr: "Certains États et municipalités réglementent localement les chiens de type pit-bull (par exemple règles d'élevage, de vente, de stérilisation ou de puçage). Vérifie les règles spécifiques de ton État ou de ta ville de destination."
    es: "Algunos estados y municipios regulan localmente a los perros de tipo pit bull (por ejemplo, normas sobre cría, venta, esterilización o implantación de microchip). Consulta las normas específicas de tu estado o ciudad de destino."
    pt: "Alguns estados e municípios regulam localmente os cães do tipo pit bull (por exemplo, regras de criação, venda, castração ou microchipagem). Verifique as regras específicas do estado ou da cidade de destino."
  note:
    en: "Because local rules vary, confirm any breed-specific requirement with the authorities of your final destination in Brazil before travelling."
    fr: "Comme les règles locales varient, confirme toute exigence propre à une race auprès des autorités de ta destination finale au Brésil avant de voyager."
    es: "Como las normas locales varían, confirma cualquier requisito propio de una raza con las autoridades de tu destino final en Brasil antes de viajar."
    pt: "Como as regras locais variam, confirme qualquer exigência ligada à raça com as autoridades do seu destino final no Brasil antes de viajar."

checklist:
