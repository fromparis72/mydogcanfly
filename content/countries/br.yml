# Country Entry Guide — Brazil (source of truth, bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_br
iso2: "BR"
name: { en: "Brazil", fr: "Brésil", es: "Brasil", pt: "Brasil" }
region: { en: "South America", fr: "Amérique du Sud", es: "América del Sur", pt: "América do Sul" }


regime: non_listed
domestic:
  intro:
    en: "Domestic flight in Brazil: no import formality, but the State does require a transit certificate."
    fr: "Vol intérieur au Brésil : aucune formalité d'import, mais l'État exige bien un certificat de transit."
    es: "Vuelo nacional en Brasil: ningún trámite de importación, pero el Estado sí exige un certificado de tránsito."
    pt: "Voo doméstico no Brasil: nenhuma formalidade de importação, mas o Estado exige um atestado de trânsito."
  points:
    - en: "An Atestado Sanitário for the domestic transit of dogs and cats, issued by a CRMV-registered vet and valid 10 days, must accompany the animal."
      fr: "Un Atestado Sanitário pour le transit national des chiens et chats, établi par un vétérinaire inscrit au CRMV et valable 10 jours, doit accompagner l'animal."
      es: "Un Atestado Sanitário para el tránsito nacional de perros y gatos, emitido por un veterinario inscrito en el CRMV y válido 10 días, debe acompañar al animal."
      pt: "O animal deve estar acompanhado de um Atestado Sanitário para trânsito interestadual de cães e gatos, emitido por médico-veterinário inscrito no CRMV e válido por 10 dias."
    - en: "Rabies vaccination is required for dogs over 90 days, valid one year. The livestock GTA does not apply to dogs and cats."
      fr: "La vaccination antirabique est exigée pour les chiens de plus de 90 jours, valable un an. La GTA du bétail ne s'applique pas aux chiens et chats."
      es: "La vacuna antirrábica es obligatoria para perros de más de 90 días, válida un año. La GTA del ganado no se aplica a perros y gatos."
      pt: "A vacinação antirrábica é exigida para cães com mais de 90 dias e vale um ano. A GTA, usada para animais de produção, não se aplica a cães e gatos."
    - en: "Whatever the airline asks for (health certificate, vaccination record, breed or crate rules) is its own commercial policy, not a legal requirement — check with your carrier."
      fr: "Ce que la compagnie demande (certificat de santé, carnet de vaccination, règles de race ou de caisse) relève de sa politique commerciale, pas d'une obligation légale — vérifie auprès d'elle."
      es: "Lo que pida la aerolínea (certificado de salud, cartilla de vacunación, reglas de raza o jaula) es su política comercial, no una obligación legal — consúltalo con ella."
      pt: "Tudo o que a companhia aérea pedir (atestado de saúde, carteira de vacinação, regras de raça ou de caixa de transporte) é política comercial dela, não exigência legal — confirme com a sua companhia."
  territories:
    - name: { en: "Fernando de Noronha", fr: "Fernando de Noronha", es: "Fernando de Noronha", pt: "Fernando de Noronha" }
      note:
        en: "Dogs and cats are banned from the island whatever their origin, with narrow exceptions for assistance and police dogs and for residents. The airline itself is fined for carrying a non-compliant animal."
        fr: "Les chiens et chats sont interdits sur l'île quelle que soit leur origine, avec de rares exceptions pour les chiens d'assistance, de police et ceux des résidents. La compagnie elle-même est sanctionnée si elle embarque un animal non conforme."
        es: "Los perros y gatos están prohibidos en la isla sea cual sea su origen, con escasas excepciones para perros de asistencia, de policía y de residentes. La propia aerolínea es multada si embarca un animal no conforme."
        pt: "Cães e gatos são proibidos na ilha, qualquer que seja a origem, com exceções restritas para cães de assistência, cães policiais e animais de residentes. A própria companhia aérea é multada se transportar um animal irregular."
      url: https://www.noronha.pe.gov.br/saude/vigilancia-em-saude/vigilancia-animal/
exit:
  authority: VIGIAGRO (MAPA)
  authorityUrl: https://www.gov.br/agricultura/pt-br/assuntos/vigilancia-agropecuaria/animais-estimacao/sair-do-brasil
  intro:
    en: "Brazil is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an international veterinary certificate (CVI) issued by VIGIAGRO/MAPA."
    fr: "Le Brésil est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat vétérinaire international (CVI) délivré par VIGIAGRO/MAPA."
    es: "Brasil no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado veterinario internacional (CVI) emitido por VIGIAGRO/MAPA."
    pt: "O Brasil é um país não listado, então o teste sorológico antirrábico válido é obrigatório para voltar à União Europeia — além do certificado veterinário internacional (CVI) emitido pelo VIGIAGRO/MAPA."
  steps:
    - timing: longlead
      text:
        en: "Anticipate the rabies antibody titer well ahead: blood test in an EU-approved lab at least 30 days after vaccination — MAPA notes the full EU process can take 3 to 6 months."
        fr: "Anticipe largement le titrage antirabique : prise de sang dans un labo agréé UE au moins 30 jours après la vaccination — le MAPA indique que le processus UE complet peut prendre 3 à 6 mois."
        es: "Anticipa ampliamente la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE al menos 30 días tras la vacuna — el MAPA indica que el proceso completo de la UE puede tardar de 3 a 6 meses."
        pt: "Antecipe bastante o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — o MAPA observa que todo o processo europeu pode levar de 3 a 6 meses."
    - timing: window
      text:
        en: "Submit the online request on gov.br with your vet's health certificate and records; a federal agricultural auditor reviews it (up to 48h) and issues the digitally signed CVI, free of charge."
        fr: "Dépose la demande en ligne sur gov.br avec le certificat sanitaire et les documents de ton vétérinaire ; un auditeur fédéral agricole l'examine (jusqu'à 48 h) et délivre le CVI signé numériquement, gratuitement."
        es: "Presenta la solicitud en línea en gov.br con el certificado sanitario y los documentos de tu veterinario; un auditor fiscal federal agropecuario lo revisa (hasta 48 h) y emite el CVI firmado digitalmente, de forma gratuita."
        pt: "Faça o pedido on-line no gov.br com o atestado de saúde e os registros do seu veterinário; um auditor fiscal federal agropecuário analisa o processo (em até 48 h) e emite o CVI assinado digitalmente, gratuitamente."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Brazil with your dog", fr: "Voyager au Brésil avec ton chien", es: "Viajar a Brasil con tu perro", pt: "Viajar ao Brasil com seu cachorro" }
  intro:
    en: >-
      Brazil welcomes dogs, and the procedure is comparatively simple: there is no import permit for a
      personal pet, no quarantine and no rabies antibody test for entry from most countries. The main
      document is an International Veterinary Certificate (CVI) issued or endorsed by an official
      veterinarian of your departure country's government veterinary authority — a certificate signed by
      a private vet alone is not accepted. Your dog needs a valid rabies vaccination (from 90 days of
      age), a broad-spectrum anti-parasite treatment and a clinical exam shortly before travel. On
      arrival, Brazil's agricultural inspection service, VIGIAGRO, checks your documents. This guide
      explains exactly what to prepare before you book your flight.
    fr: >-
      Le Brésil accueille les chiens, et la démarche est relativement simple : aucun permis d'importation
      pour un animal de compagnie personnel, pas de quarantaine et pas de titrage antirabique pour l'entrée
      depuis la plupart des pays. Le document principal est un Certificat Vétérinaire International (CVI)
      émis ou visé par un vétérinaire officiel de l'autorité vétérinaire gouvernementale du pays de départ
      — un certificat signé uniquement par un vétérinaire privé n'est pas accepté. Ton chien doit avoir
      une vaccination antirabique valide (à partir de 90 jours), un traitement antiparasitaire à large
      spectre et un examen clinique peu avant le voyage. À l'arrivée, le service d'inspection
      agricole brésilien, le VIGIAGRO, contrôle tes documents. Ce guide détaille exactement quoi préparer
      avant de réserver ton vol.
    es: >-
      Brasil acoge a los perros, y el procedimiento es relativamente sencillo: no hay permiso de
      importación para una mascota personal, ni cuarentena ni prueba de titulación de rabia para la
      entrada desde la mayoría de los países. El documento principal es un Certificado Veterinario
      Internacional (CVI) expedido o refrendado por un veterinario oficial de la autoridad veterinaria
      gubernamental de tu país de salida — no se acepta un certificado firmado únicamente por un
      veterinario privado. Tu perro necesita una vacunación antirrábica válida (a partir de los 90 días
      de edad), un tratamiento antiparasitario de amplio espectro y un examen clínico poco antes del
      viaje. A la llegada, el servicio de inspección agropecuaria de Brasil, VIGIAGRO, revisa tus
      documentos. Esta guía explica exactamente qué preparar antes de reservar tu vuelo.

    pt: "O Brasil recebe bem os cachorros, e o procedimento é relativamente simples: não há autorização de importação para um animal de estimação, nem quarentena, nem teste sorológico antirrábico para a entrada vinda da maioria dos países. O documento principal é um Certificado Veterinário Internacional (CVI) emitido ou endossado por um veterinário oficial da autoridade veterinária do governo do país de partida — um certificado assinado apenas por um veterinário particular não é aceito. Seu cachorro precisa de vacinação antirrábica válida (a partir dos 90 dias de idade), tratamento antiparasitário de amplo espectro e exame clínico pouco antes da viagem. Na chegada, o VIGIAGRO, serviço de inspeção agropecuária do Brasil, confere os documentos. Este guia explica exatamente o que preparar antes de comprar a passagem."
difficulty:
  level: easy
  label: { en: "Easy to moderate", fr: "Facile à modéré", es: "De fácil a moderado", pt: "Fácil a moderado" }

prepTime:
  eu:
    en: "A few days if the rabies vaccination is already valid: arrange the anti-parasite treatment, clinical exam and the official CVI within the final 15 days."
    fr: "Quelques jours si la vaccination antirabique est déjà valide : organise le traitement antiparasitaire, l'examen clinique et le CVI officiel dans les 15 derniers jours."
    es: "Unos días si la vacunación antirrábica ya es válida: organiza el tratamiento antiparasitario, el examen clínico y el CVI oficial dentro de los últimos 15 días."
    pt: "Alguns dias se a vacinação antirrábica já estiver válida: organize o tratamento antiparasitário, o exame clínico e o CVI oficial nos últimos 15 dias."
  listed:
    en: "Similar timing from a WOAH rabies-free country: no proof of rabies vaccination is needed, but the CVI, treatment and exam still apply."
    fr: "Délai similaire depuis un pays reconnu indemne de rage par l'OMSA : aucune preuve de vaccination antirabique n'est exigée, mais le CVI, le traitement et l'examen restent requis."
    es: "Plazo similar desde un país reconocido como libre de rabia por la OMSA: no se exige prueba de vacunación antirrábica, pero el CVI, el tratamiento y el examen siguen siendo obligatorios."
    pt: "Prazo parecido vindo de um país reconhecido como livre de raiva pela WOAH: não é preciso comprovar a vacinação antirrábica, mas o CVI, o tratamento e o exame continuam valendo."
  nonListed:
    en: "About 3 weeks for a first-time rabies vaccination: departure is only allowed 21 days after the primary shot."
    fr: "Environ 3 semaines pour une primo-vaccination antirabique : le départ n'est autorisé que 21 jours après la première injection."
    es: "Unas 3 semanas para una primera vacunación antirrábica: la salida solo se permite 21 días después de la primovacunación."
    pt: "Cerca de 3 semanas em caso de primeira vacinação antirrábica: a saída só é permitida 21 dias depois da primeira dose."

