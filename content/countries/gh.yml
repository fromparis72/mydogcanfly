# Country Entry Guide — Ghana (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_gh
iso2: "GH"
name: { en: "Ghana", fr: "Ghana", es: "Ghana", pt: "Gana" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
exit:
  authority: VSD
  authorityUrl: https://vsd.gov.gh/
  intro:
    en: "Ghana is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Veterinary Services Directorate (VSD)."
    fr: "Le Ghana est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par la Veterinary Services Directorate (VSD)."
    es: "Ghana no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por la Veterinary Services Directorate (VSD)."
    pt: "Gana é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pela Veterinary Services Directorate (VSD)."
  steps:
    - timing: longlead
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      text:
        en: "VSD veterinary officers conduct a final inspection and issue the Veterinary Health Certificate (export permit) required at exit."
        fr: "Les vétérinaires officiels de la VSD réalisent une inspection finale et délivrent le certificat sanitaire vétérinaire (permis d'export) exigé au départ."
        es: "Los veterinarios oficiales de la VSD hacen una inspección final y emiten el certificado sanitario veterinario (permiso de exportación) exigido a la salida."
        pt: "Os veterinários oficiais da VSD realizam uma inspeção final e emitem o atestado de saúde veterinário (autorização de exportação) exigido na saída."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Ghana with your dog", fr: "Voyager au Ghana avec ton chien", es: "Viajar a Ghana con tu perro", pt: "Viajar para Gana com seu cachorro" }
  intro:
    en: >-
      Ghana admits pet dogs, but entry is controlled by its own veterinary authority — the Veterinary
      Services Directorate (VSD), part of the Ministry of Food and Agriculture (MOFA) — not by the EU
      framework. No dog may be shipped without a signed Veterinary Import Permit obtained in advance
      from the VSD, and the permit is only issued once your dog has passed a set of disease tests
      (Brucella canis, Trypanosoma evansi, Babesia gibsoni, Dirofilaria immitis and Leishmania), all of
      which must be negative. Every dog also needs a valid rabies vaccination, the core canine
      vaccinations, and an official international veterinary health certificate endorsed by the
      exporting country's government vet. On arrival at Kotoka International Airport, VSD officers
      inspect the dog and its documents. Ghana is a rabies-endemic country, so the exact steps depend
      on where your dog is coming from. This guide explains what to prepare before you book your flight.
    fr: >-
      Le Ghana admet les chiens de compagnie, mais l'entrée est contrôlée par sa propre autorité
      vétérinaire — la Veterinary Services Directorate (VSD), rattachée au ministère de l'Alimentation
      et de l'Agriculture (MOFA) — et non par le cadre européen. Aucun chien ne peut être expédié sans
      un permis d'importation vétérinaire signé, obtenu à l'avance auprès de la VSD, et ce permis n'est
      délivré qu'une fois ton chien testé négatif à une série de maladies (Brucella canis, Trypanosoma
      evansi, Babesia gibsoni, Dirofilaria immitis et Leishmania). Chaque chien a aussi besoin d'une
      vaccination antirabique valide, des vaccinations canines de base et d'un certificat vétérinaire
      international officiel visé par le vétérinaire gouvernemental du pays d'export. À l'arrivée à
      l'aéroport international de Kotoka, les agents de la VSD inspectent le chien et ses documents. Le
      Ghana étant un pays d'endémie rabique, les étapes exactes dépendent du pays d'où vient ton
      chien. Ce guide détaille quoi préparer avant de réserver ton vol.
    es: >-
      Ghana admite a los perros de compañía, pero la entrada la controla su propia autoridad
      veterinaria — la Veterinary Services Directorate (VSD), parte del Ministerio de Alimentación y
      Agricultura (MOFA) — y no el marco de la UE. Ningún perro puede embarcarse sin un permiso de
      importación veterinario firmado, obtenido con antelación de la VSD, y el permiso solo se expide
      una vez que tu perro ha superado una serie de pruebas de enfermedades (Brucella canis, Trypanosoma
      evansi, Babesia gibsoni, Dirofilaria immitis y Leishmania), todas ellas con resultado negativo.
      Cada perro necesita además una vacunación antirrábica válida, las vacunaciones caninas básicas y
      un certificado sanitario veterinario internacional oficial refrendado por el veterinario
      gubernamental del país exportador. A la llegada al Aeropuerto Internacional de Kotoka, los agentes
      de la VSD inspeccionan al perro y sus documentos. Ghana es un país con rabia endémica, por lo que
      los pasos exactos dependen del país del que venga tu perro. Esta guía explica qué preparar antes
      de reservar tu vuelo.

    pt: "Gana admite cachorros de estimação, mas a entrada é controlada por sua própria autoridade veterinária — a Veterinary Services Directorate (VSD), parte do Ministério da Alimentação e Agricultura (MOFA) — e não pelo quadro da UE. Nenhum cachorro pode ser embarcado sem uma autorização veterinária de importação assinada, obtida com antecedência junto à VSD, e essa autorização só é emitida depois que seu cachorro for aprovado em uma série de testes de doenças (Brucella canis, Trypanosoma evansi, Babesia gibsoni, Dirofilaria immitis e Leishmania), todos com resultado negativo. Todo cachorro também precisa de uma vacinação antirrábica válida, das vacinações caninas essenciais e de um atestado de saúde veterinário internacional oficial endossado pelo veterinário do governo do país de exportação. Na chegada ao Aeroporto Internacional de Kotoka, os agentes da VSD inspecionam o cachorro e seus documentos. Gana é um país com raiva endêmica, portanto as etapas exatas dependem de onde seu cachorro está vindo. Este guia explica o que preparar antes de reservar seu voo."
difficulty:
  level: difficult
  label: { en: "Difficult — advance permit + negative disease tests", fr: "Difficile — permis préalable + tests de maladies négatifs", es: "Difícil — permiso previo + pruebas de enfermedades negativas", pt: "Difícil — autorização prévia + testes de doenças negativos" }

prepTime:
  eu:
    en: "From Europe / rabies-free origins: allow ~5–8 weeks — the disease tests (all negative, originals) and the advance import permit are the pacing steps, plus an endorsed health certificate valid 30 days."
    fr: "Depuis l'Europe / origines indemnes de rage : prévoir ~5 à 8 semaines — les tests de maladies (tous négatifs, originaux) et le permis d'importation préalable sont les étapes déterminantes, plus un certificat sanitaire visé valable 30 jours."
    es: "Desde Europa / orígenes libres de rabia: reserva ~5 a 8 semanas — las pruebas de enfermedades (todas negativas, originales) y el permiso de importación previo son los pasos que marcan el ritmo, más un certificado sanitario refrendado válido 30 días."
    pt: "Da Europa / origens livres de raiva: reserve ~5 a 8 semanas — os testes de doenças (todos negativos, originais) e a autorização de importação prévia são as etapas que determinam o ritmo, além de um atestado de saúde endossado válido por 30 dias."
  listed:
    en: "From a rabies-controlled country (US, Canada, Gulf states…): ~5–8 weeks, driven by the disease tests and the VSD import permit."
    fr: "Depuis un pays à rage maîtrisée (USA, Canada, pays du Golfe…) : ~5 à 8 semaines, selon les tests de maladies et le permis d'importation VSD."
    es: "Desde un país con la rabia controlada (EE. UU., Canadá, países del Golfo…): ~5 a 8 semanas, según las pruebas de enfermedades y el permiso de importación de la VSD."
    pt: "De um país com raiva controlada (EUA, Canadá, países do Golfo…): ~5 a 8 semanas, conforme os testes de doenças e a autorização de importação da VSD."
  nonListed:
    en: "From a high-rabies-risk country: similar base steps, but expect closer scrutiny at the airport; dogs from an area quarantined for rabies may be refused."
    fr: "Depuis un pays à haut risque rabique : mêmes étapes de base, mais contrôle renforcé à l'aéroport ; un chien venant d'une zone en quarantaine rabique peut être refusé."
    es: "Desde un país con alto riesgo de rabia: los mismos pasos básicos, pero espera un control más estricto en el aeropuerto; un perro procedente de una zona en cuarentena por rabia puede ser rechazado."
    pt: "De um país de alto risco de raiva: etapas básicas semelhantes, mas espere um controle mais rigoroso no aeroporto; cachorros vindos de uma área em quarentena por raiva podem ser recusados."

