  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — El Salvador (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — le Salvador (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — El Salvador (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — El Salvador (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — El Salvador", fr: "Pays de destination — Salvador", es: "País de destino — El Salvador", pt: "País de destino — El Salvador" }
      text:
        en: "MAG (Dirección General de Ganadería, Quarantine Division) runs an authorization-based scheme: an import authorization, the official zoosanitary certificate and the vaccination card are always required for a dog, cat or rabbit."
        fr: "Le MAG (Dirección General de Ganadería, Division de la quarantaine) applique un dispositif fondé sur une autorisation : une autorisation d'importation, le certificat zoosanitaire officiel et la cartilla de vaccination sont toujours exigés pour un chien, un chat ou un lapin."
        es: "El MAG (Dirección General de Ganadería, División de Cuarentena) aplica un esquema basado en una autorización: siempre se exigen una autorización de importación, el certificado zoosanitario oficial y la cartilla de vacunación para un perro, un gato o un conejo."
        pt: "O MAG (Dirección General de Ganadería, Divisão de Quarentena) aplica um esquema baseado em autorização: a autorização de importação, o certificado zoossanitário oficial e a carteira de vacinação são sempre obrigatórios para cachorro, gato ou coelho."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The zoosanitary certificate and vaccination card must be issued by the veterinary authority of the country of origin, so that country's veterinary services and health status matter directly. Arrivals from the United States use a specific bilateral health certificate completed by a licensed veterinarian."
        fr: "Le certificat zoosanitaire et la cartilla de vaccination doivent être délivrés par l'autorité vétérinaire du pays d'origine ; les services vétérinaires et le statut sanitaire de ce pays comptent donc directement. Les arrivées des États-Unis utilisent un certificat sanitaire bilatéral spécifique complété par un vétérinaire licencié."
        es: "El certificado zoosanitario y la cartilla de vacunación deben ser expedidos por la autoridad veterinaria del país de origen, de modo que los servicios veterinarios y el estatus sanitario de ese país influyen directamente. Las llegadas desde Estados Unidos utilizan un certificado sanitario bilateral específico completado por un veterinario licenciado."
        pt: "O certificado zoossanitário e a carteira de vacinação precisam ser emitidos pela autoridade veterinária do país de origem; por isso o serviço veterinário e a situação sanitária desse país contam diretamente. Quem chega dos Estados Unidos usa um atestado de saúde bilateral específico, preenchido por um veterinário licenciado."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "Your dog's recent residence and vaccination history determine whether its record is complete and valid — the rabies vaccine must be current (within 365 days). It is the dog's real history that counts, not only the last airport."
        fr: "La résidence récente et l'historique de vaccination du chien déterminent si son carnet est complet et valide — le vaccin antirabique doit être en cours de validité (dans les 365 jours). C'est l'historique réel du chien qui compte, pas seulement le dernier aéroport."
        es: "La residencia reciente y el historial de vacunación de tu perro determinan si su registro está completo y en vigor — la vacuna antirrábica debe estar vigente (dentro de los 365 días). Lo que cuenta es el historial real del perro, no solo el último aeropuerto."
        pt: "Onde o seu cachorro morou recentemente e o histórico de vacinação dele determinam se a carteira está completa e válida — a vacina antirrábica precisa estar em dia (aplicada nos últimos 365 dias). O que conta é o histórico real do cachorro, não só o último aeroporto."
  note:
    en: "So read the requirements below as El Salvador's framework, then confirm your dog's exact origin and history with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre salvadorien, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de El Salvador y luego confirma el origen y el historial exactos de tu perro con tu veterinario."
    pt: "Leia então as exigências abaixo como o quadro geral de El Salvador, e confirme com seu veterinário a origem e o histórico exatos do seu cachorro."

requirements:
  - item: { en: "Identification (microchip)", fr: "Identification (puce électronique)", es: "Identificación (microchip)", pt: "Identificação (microchip)" }
    required: { en: "Not published", fr: "Non communiqué", es: "No publicado", pt: "Não publicado" }
    when: { en: "MAG's published requirements for importing pets (dogs, cats, rabbits) do not mention a microchip; identification is carried through the zoosanitary certificate and vaccination card.", fr: "Les exigences publiées du MAG pour l'importation d'animaux de compagnie (chiens, chats, lapins) ne mentionnent pas de puce ; l'identification passe par le certificat zoosanitaire et la cartilla de vaccination.", es: "Los requisitos publicados por el MAG para importar mascotas (perros, gatos, conejos) no mencionan un microchip; la identificación se recoge a través del certificado zoosanitario y la cartilla de vacunación.", pt: "As exigências publicadas pelo MAG para a importação de animais de estimação (cães, gatos, coelhos) não mencionam microchip; a identificação é feita por meio do certificado zoossanitário e da carteira de vacinação." }
    exceptions: { en: "A microchip is not required by MAG but is strongly advised for identification, for the return trip and because most airlines require it.", fr: "La puce n'est pas exigée par le MAG mais fortement conseillée pour l'identification, le retour et parce que la plupart des compagnies l'exigent.", es: "El MAG no exige el microchip, pero se recomienda encarecidamente para la identificación, para el viaje de regreso y porque la mayoría de las aerolíneas lo exigen.", pt: "O microchip não é exigido pelo MAG, mas é fortemente recomendado para a identificação, para a viagem de volta e porque a maioria das companhias aéreas o exige." }
    ref: { en: "MAG — Import authorizations for pets (Dirección General de Ganadería)", fr: "MAG — Autorisations d'importation de mascotas (Dirección General de Ganadería)", es: "MAG — Autorizaciones de importación de mascotas (Dirección General de Ganadería)", pt: "MAG — Autorizações de importação de animais de estimação (Dirección General de Ganadería)" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "The animal must be vaccinated against rabies and this must appear on the vaccination card. On the bilateral US–El Salvador certificate, animals over 2 months old must be vaccinated, with the vaccine applied no more than 365 days before embarkation, and the rabies vaccination certificate must accompany the health documents.", fr: "L'animal doit être vacciné contre la rage et cela doit figurer sur la cartilla de vaccination. Sur le certificat bilatéral États-Unis–Salvador, les animaux de plus de 2 mois doivent être vaccinés, avec un vaccin appliqué au plus 365 jours avant l'embarquement, et le certificat de vaccination antirabique doit accompagner les documents sanitaires.", es: "El animal debe estar vacunado contra la rabia y esto debe constar en la cartilla de vacunación. En el certificado bilateral EE. UU.–El Salvador, los animales de más de 2 meses deben estar vacunados, con la vacuna aplicada como máximo 365 días antes del embarque, y el certificado de vacunación antirrábica debe acompañar a los documentos sanitarios.", pt: "O animal precisa estar vacinado contra a raiva, e isso precisa constar na carteira de vacinação. No certificado bilateral EUA–El Salvador, animais com mais de 2 meses de idade precisam estar vacinados, com a vacina aplicada no máximo 365 dias antes do embarque, e o certificado de vacinação antirrábica precisa acompanhar os documentos sanitários." }
    exceptions: { en: "The date of immunization and the trade name of the product used must be indicated. No minimum waiting period after vaccination is published by MAG.", fr: "La date d'immunisation et le nom commercial du produit utilisé doivent être indiqués. Aucun délai d'attente minimum après vaccination n'est publié par le MAG.", es: "Deben indicarse la fecha de inmunización y el nombre comercial del producto utilizado. El MAG no publica ningún periodo de espera mínimo tras la vacunación.", pt: "A data da imunização e o nome comercial do produto utilizado precisam ser indicados. O MAG não publica nenhum prazo mínimo de espera após a vacinação." }
    ref: { en: "MAG — Pet import authorizations; USDA APHIS — El Salvador dog/cat health certificate", fr: "MAG — Autorisations d'importation de mascotas ; USDA APHIS — Certificat de santé chien/chat Salvador", es: "MAG — Autorizaciones de importación de mascotas; USDA APHIS — Certificado sanitario perro/gato El Salvador", pt: "MAG — Autorizações de importação de animais de estimação; USDA APHIS — atestado de saúde para cães/gatos de El Salvador" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not required", fr: "Non requis", es: "No obligatorio", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "MAG's published requirements for dogs do not include a rabies antibody test. Whether one is requested for specific high-risk origins is not published — confirm with MAG before travel.", fr: "Les exigences publiées du MAG pour les chiens ne comprennent pas de titrage antirabique. L'éventuelle exigence pour certaines origines à haut risque n'est pas publiée — vérifie auprès du MAG avant le voyage.", es: "Los requisitos publicados por el MAG para perros no incluyen una prueba de titulación de rabia. Si se solicita para determinados orígenes de alto riesgo no está publicado — confírmalo con el MAG antes de viajar.", pt: "As exigências publicadas pelo MAG para cachorros não incluem teste sorológico antirrábico. Não há publicação sobre a exigência dele para origens específicas de alto risco — confirme com o MAG antes da viagem." }
    ref: { en: "MAG — Import authorizations for pets (Dirección General de Ganadería)", fr: "MAG — Autorisations d'importation de mascotas (Dirección General de Ganadería)", es: "MAG — Autorizaciones de importación de mascotas (Dirección General de Ganadería)", pt: "MAG — Autorizações de importação de animais de estimação (Dirección General de Ganadería)" }
  - item: { en: "Official zoosanitary certificate", fr: "Certificat zoosanitaire officiel", es: "Certificado zoosanitario oficial", pt: "Certificado zoossanitário oficial" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Present the official zoosanitary certificate (original or a copy) issued by the country of origin, together with the vaccination card. From the US, use the bilateral certificate declaring the animal was examined within 30 days and found healthy and free of clinical signs of infectious and parasitic disease, vaccinated against rabies, and treated for endo/ectoparasites; it must be made out at least in duplicate.", fr: "Présente le certificat zoosanitaire officiel (original ou copie) délivré par le pays d'origine, accompagné de la cartilla de vaccination. Depuis les États-Unis, utilise le certificat bilatéral déclarant que l'animal a été examiné dans les 30 jours et trouvé en bonne santé et exempt de signes cliniques de maladie infectieuse et parasitaire, vacciné contre la rage et traité contre les endo/ectoparasites ; il doit être établi au moins en double exemplaire.", es: "Presenta el certificado zoosanitario oficial (original o copia) expedido por el país de origen, junto con la cartilla de vacunación. Desde EE. UU., usa el certificado bilateral que declara que el animal fue examinado dentro de los 30 días y se encontró sano y libre de signos clínicos de enfermedad infecciosa y parasitaria, vacunado contra la rabia y tratado contra endo/ectoparásitos; debe emitirse al menos por duplicado.", pt: "Apresente o certificado zoossanitário oficial (original ou cópia) emitido pelo país de origem, junto com a carteira de vacinação. Vindo dos EUA, use o certificado bilateral que declara que o animal foi examinado nos 30 dias anteriores e considerado saudável e livre de sinais clínicos de doenças infecciosas e parasitárias, vacinado contra a raiva e tratado contra endo e ectoparasitas; ele precisa ser emitido pelo menos em duas vias." }
    exceptions: { en: "USDA endorsement is NOT required; the certificate does not need notarisation or an El Salvador consular stamp.", fr: "Le visa de l'USDA n'est PAS exigé ; le certificat n'a pas besoin d'être notarié ni de porter le cachet consulaire du Salvador.", es: "NO se exige el refrendo del USDA; el certificado no necesita notarización ni sello consular de El Salvador.", pt: "O endosso do USDA NÃO é exigido; o certificado não precisa de reconhecimento em cartório nem de carimbo consular de El Salvador." }
    ref: { en: "MAG — Pet import authorizations; USDA APHIS — El Salvador dog/cat health certificate", fr: "MAG — Autorisations d'importation de mascotas ; USDA APHIS — Certificat de santé chien/chat Salvador", es: "MAG — Autorizaciones de importación de mascotas; USDA APHIS — Certificado sanitario perro/gato El Salvador", pt: "MAG — Autorizações de importação de animais de estimação; USDA APHIS — atestado de saúde para cães/gatos de El Salvador" }
  - item: { en: "Internal & external parasite treatment", fr: "Traitement antiparasitaire interne & externe", es: "Tratamiento antiparasitario interno y externo", pt: "Tratamento antiparasitário interno e externo" }
    required: { en: "Required (per bilateral US certificate)", fr: "Requis (selon le certificat bilatéral américain)", es: "Obligatorio (según el certificado bilateral de EE. UU.)", pt: "Obrigatório (conforme o certificado bilateral dos EUA)" }
    when: { en: "The bilateral US–El Salvador health certificate requires the animal to be treated for endoparasites and ectoparasites with products approved by the country of origin. This is declared on the certificate.", fr: "Le certificat sanitaire bilatéral États-Unis–Salvador exige que l'animal soit traité contre les endoparasites et les ectoparasites avec des produits approuvés par le pays d'origine. Cela est déclaré sur le certificat.", es: "El certificado sanitario bilateral EE. UU.–El Salvador exige que el animal sea tratado contra endoparásitos y ectoparásitos con productos aprobados por el país de origen. Esto se declara en el certificado.", pt: "O atestado de saúde bilateral EUA–El Salvador exige que o animal seja tratado contra endoparasitas e ectoparasitas com produtos aprovados pelo país de origem. Isso é declarado no certificado." }
    exceptions: { en: "No specific tapeworm/Echinococcus timing window is published — a general internal/external parasite treatment is required. For origins other than the US, confirm the exact wording of the zoosanitary certificate with your vet.", fr: "Aucun délai spécifique (échinococcose/ténia) n'est publié — un traitement antiparasitaire interne/externe général est exigé. Pour les origines autres que les États-Unis, vérifie la formulation exacte du certificat zoosanitaire avec ton vétérinaire.", es: "No se publica ningún plazo específico contra la tenia/Echinococcus — se exige un tratamiento antiparasitario interno/externo general. Para orígenes distintos de EE. UU., confirma con tu veterinario la redacción exacta del certificado zoosanitario.", pt: "Não há prazo específico publicado para tênia/Echinococcus — o que se exige é um tratamento antiparasitário interno/externo geral. Para origens que não sejam os EUA, confirme com seu veterinário o texto exato do certificado zoossanitário." }
    ref: { en: "USDA APHIS — El Salvador dog/cat health certificate; MAG pet import authorizations", fr: "USDA APHIS — Certificat de santé chien/chat Salvador ; MAG autorisations d'importation de mascotas", es: "USDA APHIS — Certificado sanitario perro/gato El Salvador; MAG autorizaciones de importación de mascotas", pt: "USDA APHIS — atestado de saúde para cães/gatos de El Salvador; autorizações de importação de animais de estimação do MAG" }
  - item: { en: "Import authorization (MAG)", fr: "Autorisation d'importation (MAG)", es: "Autorización de importación (MAG)", pt: "Autorização de importação (MAG)" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "MAG issues an import authorization to bring a dog, cat or rabbit into the country. Submit the import application form with the vaccination card and the official zoosanitary certificate, and pay the fee. The authorization costs $9.04, is valid for 30 days and may be used only once (it is not valid for the return trip).", fr: "Le MAG délivre une autorisation d'importation pour faire entrer un chien, un chat ou un lapin. Dépose le formulaire de demande d'importation avec la cartilla de vaccination et le certificat zoosanitaire officiel, puis paie les frais. L'autorisation coûte 9,04 $, est valable 30 jours et ne peut être utilisée qu'une seule fois (elle n'est pas valable pour le retour).", es: "El MAG expide una autorización de importación para hacer entrar un perro, un gato o un conejo en el país. Presenta el formulario de solicitud de importación con la cartilla de vacunación y el certificado zoosanitario oficial, y paga la tasa. La autorización cuesta 9,04 $, es válida 30 días y solo puede usarse una vez (no es válida para el viaje de regreso).", pt: "O MAG emite uma autorização de importação para levar um cachorro, gato ou coelho ao país. Entregue o formulário de solicitação de importação com a carteira de vacinação e o certificado zoossanitário oficial, e pague a taxa. A autorização custa US$ 9,04, vale 30 dias e só pode ser usada uma vez (não vale para a viagem de volta)." }
    exceptions: { en: "The authorization can be obtained in advance at the MAG window in Santa Tecla (or by email) or at the moment of arrival at the international airport, land borders and ports. It may be arranged by any person, not only the pet's owner.", fr: "L'autorisation peut être obtenue à l'avance au guichet du MAG à Santa Tecla (ou par courriel) ou au moment de l'arrivée à l'aéroport international, aux frontières terrestres et aux ports. Elle peut être effectuée par toute personne, pas uniquement le propriétaire de l'animal.", es: "La autorización puede obtenerse por adelantado en la ventanilla del MAG en Santa Tecla (o por correo electrónico) o en el momento de la llegada en el aeropuerto internacional, las fronteras terrestres y los puertos. Puede tramitarla cualquier persona, no solo el propietario del animal.", pt: "A autorização pode ser obtida com antecedência no guichê do MAG em Santa Tecla (ou por e-mail) ou no momento da chegada ao aeroporto internacional, às fronteiras terrestres e aos portos. Ela pode ser providenciada por qualquer pessoa, não apenas pelo dono do animal." }
    ref: { en: "MAG — Import authorizations for pets; USDA APHIS — El Salvador (import permit)", fr: "MAG — Autorisations d'importation de mascotas ; USDA APHIS — Salvador (permis d'importation)", es: "MAG — Autorizaciones de importación de mascotas; USDA APHIS — El Salvador (permiso de importación)", pt: "MAG — Autorizações de importação de animais de estimação; USDA APHIS — El Salvador (autorização de importação)" }
  - item: { en: "Quarantine permit at port of entry", fr: "Permis de quarantaine au point d'entrée", es: "Permiso de cuarentena en el punto de entrada", pt: "Permissão de quarentena no ponto de entrada" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Per USDA APHIS, personal pet dogs and cats must obtain a quarantine permit at the port of entry upon arrival in El Salvador. This is handled at the MAG quarantine point together with the document check, not a period of confinement.", fr: "Selon l'USDA APHIS, les chiens et chats de compagnie doivent obtenir un permis de quarantaine au point d'entrée à l'arrivée au Salvador. Cela est traité au poste de quarantaine du MAG en même temps que le contrôle documentaire, et non par une période de confinement.", es: "Según el USDA APHIS, los perros y gatos de compañía deben obtener un permiso de cuarentena en el punto de entrada a la llegada a El Salvador. Esto se tramita en el puesto de cuarentena del MAG junto con el control documental, y no es un periodo de confinamiento.", pt: "Segundo o USDA APHIS, cães e gatos de estimação pessoais precisam obter uma permissão de quarentena no ponto de entrada ao chegar a El Salvador. Isso é resolvido no posto de quarentena do MAG junto com a conferência dos documentos; não se trata de um período de confinamento." }
    exceptions: { en: "Commercial lots of animals must instead be accompanied by an import permit issued by MAG's General Directorate of Plant and Animal Health.", fr: "Les lots commerciaux d'animaux doivent en revanche être accompagnés d'un permis d'importation délivré par la Direction générale de santé végétale et animale du MAG.", es: "Los lotes comerciales de animales, en cambio, deben ir acompañados de un permiso de importación expedido por la Dirección General de Sanidad Vegetal y Animal del MAG.", pt: "Já os lotes comerciais de animais precisam ser acompanhados de uma autorização de importação emitida pela Direção-Geral de Sanidade Vegetal e Animal do MAG." }
    ref: { en: "USDA APHIS — El Salvador; MAG pet import authorizations", fr: "USDA APHIS — Salvador ; MAG autorisations d'importation de mascotas", es: "USDA APHIS — El Salvador; MAG autorizaciones de importación de mascotas", pt: "USDA APHIS — El Salvador; autorizações de importação de animais de estimação do MAG" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Not published", fr: "Non communiqué", es: "No publicado", pt: "Não publicado" }
    when: { en: "MAG does not publish a minimum entry age. The bilateral US certificate requires rabies vaccination only for animals over 2 months old, which sets a practical lower bound for vaccinated puppies.", fr: "Le MAG ne publie pas d'âge minimum d'entrée. Le certificat bilatéral américain n'exige la vaccination antirabique que pour les animaux de plus de 2 mois, ce qui fixe une limite basse pratique pour les chiots vaccinés.", es: "El MAG no publica una edad mínima de entrada. El certificado bilateral de EE. UU. solo exige la vacunación antirrábica para animales de más de 2 meses, lo que fija un límite inferior práctico para los cachorros vacunados.", pt: "O MAG não publica idade mínima de entrada. O certificado bilateral dos EUA exige vacinação antirrábica apenas para animais com mais de 2 meses de idade, o que estabelece na prática um piso para filhotes vacinados." }
    exceptions: { en: "Airline age rules and your home country's return rules may be stricter — confirm both.", fr: "Les règles d'âge des compagnies et les règles de retour de ton pays peuvent être plus strictes — vérifie les deux.", es: "Las normas de edad de las aerolíneas y las normas de regreso de tu país pueden ser más estrictas — confirma ambas.", pt: "As regras de idade da companhia aérea e as regras de retorno do seu país podem ser mais rígidas — confirme as duas." }
    ref: { en: "USDA APHIS — El Salvador dog/cat health certificate; MAG pet import authorizations", fr: "USDA APHIS — Certificat de santé chien/chat Salvador ; MAG autorisations d'importation de mascotas", es: "USDA APHIS — Certificado sanitario perro/gato El Salvador; MAG autorizaciones de importación de mascotas", pt: "USDA APHIS — atestado de saúde para cães/gatos de El Salvador; autorizações de importação de animais de estimação do MAG" }
  - item: { en: "Quarantine (confinement)", fr: "Quarantaine (confinement)", es: "Cuarentena (confinamiento)", pt: "Quarentena (confinamento)" }
    required: { en: "Not published", fr: "Non communiquée", es: "No publicada", pt: "Não publicado" }
    when: { en: "No routine period of confinement is set out in the published requirements; entry is handled through document review and the quarantine permit at the point of entry.", fr: "Aucune période de confinement de routine n'est prévue dans les exigences publiées ; l'entrée se fait par contrôle documentaire et permis de quarantaine au point d'entrée.", es: "En los requisitos publicados no se establece ningún periodo de confinamiento de rutina; la entrada se tramita mediante el control documental y el permiso de cuarentena en el punto de entrada.", pt: "As exigências publicadas não preveem nenhum período de confinamento de rotina; a entrada é resolvida pela análise dos documentos e pela permissão de quarentena no ponto de entrada." }
    exceptions: { en: "Handling of a non-compliant or sick animal on arrival is not detailed in the published requirements — confirm with MAG.", fr: "Le traitement d'un animal non conforme ou malade à l'arrivée n'est pas détaillé dans les exigences publiées — vérifie auprès du MAG.", es: "El tratamiento de un animal no conforme o enfermo a la llegada no se detalla en los requisitos publicados — confírmalo con el MAG.", pt: "As exigências publicadas não detalham o que acontece com um animal doente ou fora das exigências na chegada — confirme com o MAG." }
    ref: { en: "MAG — Import authorizations for pets; USDA APHIS — El Salvador", fr: "MAG — Autorisations d'importation de mascotas ; USDA APHIS — Salvador", es: "MAG — Autorizaciones de importación de mascotas; USDA APHIS — El Salvador", pt: "MAG — Autorizações de importação de animais de estimação; USDA APHIS — El Salvador" }

origin:
  scheme: own
  eu:
    from: any
    title: { en: "Standard — a personal pet from any country", fr: "Standard — un animal de compagnie depuis n'importe quel pays", es: "Estándar — una mascota de compañía desde cualquier país", pt: "Padrão — um animal de estimação pessoal de qualquer país" }
    body:
      en: "A dog arriving with its owner needs a MAG import authorization plus the official zoosanitary certificate (original or copy) and the vaccination card from the country of origin. You submit the import application form with these documents and pay the $9.04 fee; the authorization is valid 30 days and single-use. It can be arranged in advance at the MAG window in Santa Tecla or by email, or completed on arrival at the airport, a land border or a port. Personal pets also take a quarantine permit at the point of entry. There is no routine confinement for a compliant pet."
      fr: "Un chien arrivant avec son propriétaire a besoin d'une autorisation d'importation du MAG, du certificat zoosanitaire officiel (original ou copie) et de la cartilla de vaccination du pays d'origine. Tu dépose le formulaire de demande d'importation avec ces documents et réglez les frais de 9,04 $ ; l'autorisation est valable 30 jours et à usage unique. Elle peut être organisée à l'avance au guichet du MAG à Santa Tecla ou par courriel, ou effectuée à l'arrivée à l'aéroport, à une frontière terrestre ou à un port. Les animaux de compagnie prennent aussi un permis de quarantaine au point d'entrée. Aucun confinement de routine pour un animal conforme."
      es: "Un perro que llega con su propietario necesita una autorización de importación del MAG más el certificado zoosanitario oficial (original o copia) y la cartilla de vacunación del país de origen. Presentas el formulario de solicitud de importación con estos documentos y pagas la tasa de 9,04 $; la autorización es válida 30 días y de un solo uso. Puede tramitarse por adelantado en la ventanilla del MAG en Santa Tecla o por correo electrónico, o completarse a la llegada en el aeropuerto, en una frontera terrestre o en un puerto. Las mascotas de compañía también tramitan un permiso de cuarentena en el punto de entrada. No hay confinamiento de rutina para una mascota que cumpla los requisitos."
      pt: "Um cachorro que chega com o dono precisa de uma autorização de importação do MAG, mais o certificado zoossanitário oficial (original ou cópia) e a carteira de vacinação do país de origem. Você entrega o formulário de solicitação de importação com esses documentos e paga a taxa de US$ 9,04; a autorização vale 30 dias e é de uso único. Ela pode ser providenciada com antecedência no guichê do MAG em Santa Tecla ou por e-mail, ou resolvida na chegada ao aeroporto, a uma fronteira terrestre ou a um porto. Os animais de estimação pessoais também retiram uma permissão de quarentena no ponto de entrada. Não há confinamento de rotina para um animal em conformidade."
    cls: ok
  listed:
    from: [us]
    title: { en: "Arriving from the United States — bilateral certificate", fr: "Arrivée depuis les États-Unis — certificat bilatéral", es: "Llegada desde Estados Unidos — certificado bilateral", pt: "Chegando dos Estados Unidos — certificado bilateral" }
    body:
      en: "From the United States a licensed veterinarian completes the agreed 'Veterinary Health Certificate for Export of Dogs and Cats from the United States to El Salvador'. It certifies the animal was examined within 30 days and is healthy and free of clinical signs of infectious and parasitic disease; vaccinated against rabies no more than 365 days before embarkation (animals over 2 months old must be vaccinated), with the rabies vaccination certificate attached; and treated for endo- and ectoparasites. USDA endorsement is NOT required, and no notary or El Salvador consular stamp is needed. The certificate should be issued at least in duplicate."
      fr: "Depuis les États-Unis, un vétérinaire licencié complète le « Certificat sanitaire vétérinaire pour l'exportation de chiens et chats des États-Unis vers le Salvador » convenu. Il certifie que l'animal a été examiné dans les 30 jours et est en bonne santé et exempt de signes cliniques de maladie infectieuse et parasitaire ; vacciné contre la rage au plus 365 jours avant l'embarquement (les animaux de plus de 2 mois doivent être vaccinés), avec le certificat de vaccination antirabique joint ; et traité contre les endo- et ectoparasites. Le visa de l'USDA n'est PAS exigé, et aucun notaire ni cachet consulaire salvadorien n'est nécessaire. Le certificat doit être établi au moins en double exemplaire."
      es: "Desde Estados Unidos, un veterinario licenciado completa el «Certificado sanitario veterinario para la exportación de perros y gatos de Estados Unidos a El Salvador» acordado. Certifica que el animal fue examinado dentro de los 30 días y está sano y libre de signos clínicos de enfermedad infecciosa y parasitaria; vacunado contra la rabia como máximo 365 días antes del embarque (los animales de más de 2 meses deben estar vacunados), con el certificado de vacunación antirrábica adjunto; y tratado contra endo- y ectoparásitos. NO se exige el refrendo del USDA, y no se necesita notaría ni sello consular de El Salvador. El certificado debe emitirse al menos por duplicado."
      pt: "Vindo dos Estados Unidos, um veterinário licenciado preenche o «Veterinary Health Certificate for Export of Dogs and Cats from the United States to El Salvador» acordado entre os dois países. Ele certifica que o animal foi examinado nos 30 dias anteriores e está saudável e livre de sinais clínicos de doenças infecciosas e parasitárias; vacinado contra a raiva no máximo 365 dias antes do embarque (animais com mais de 2 meses de idade precisam estar vacinados), com o certificado de vacinação antirrábica anexado; e tratado contra endo e ectoparasitas. O endosso do USDA NÃO é exigido, e não é preciso reconhecimento em cartório nem carimbo consular de El Salvador. O certificado deve ser emitido pelo menos em duas vias."
    cls: ok
  nonListed:
    title: { en: "Vaccination timing & practical reminders", fr: "Délais de vaccination & rappels pratiques", es: "Plazos de vacunación y recordatorios prácticos", pt: "Prazos da vacinação e lembretes práticos" }
    body:
      en: "Because the rabies vaccine must be current (within 365 days) and, on the US certificate, is required for animals over 2 months old, plan the vaccination well ahead. MAG does not publish a microchip rule, a rabies antibody-test rule or a minimum entry age for dogs — but confirm your dog's situation with your vet and, if in doubt, directly with MAG's Quarantine Division. Remember the import authorization is single-use and not valid for the return trip: for the way back you will need the export zoosanitary certificate for pets."
      fr: "Comme le vaccin antirabique doit être en cours de validité (dans les 365 jours) et, sur le certificat américain, est exigé pour les animaux de plus de 2 mois, prévois la vaccination bien à l'avance. Le MAG ne publie ni règle de puce, ni règle de titrage antirabique, ni âge minimum d'entrée pour les chiens — mais confirme la situation de ton chien avec ton vétérinaire et, en cas de doute, directement auprès de la Division de la quarantaine du MAG. Rappelle-toi que l'autorisation d'importation est à usage unique et non valable pour le retour : au retour, il tu faudra le certificat zoosanitaire d'exportation de mascotas."
      es: "Como la vacuna antirrábica debe estar vigente (dentro de los 365 días) y, en el certificado de EE. UU., se exige para animales de más de 2 meses, planifica la vacunación con mucha antelación. El MAG no publica ninguna norma de microchip, ni de prueba de titulación de rabia, ni una edad mínima de entrada para perros — pero confirma la situación de tu perro con tu veterinario y, en caso de duda, directamente con la División de Cuarentena del MAG. Recuerda que la autorización de importación es de un solo uso y no es válida para el viaje de regreso: para la vuelta necesitarás el certificado zoosanitario de exportación de mascotas."
      pt: "Como a vacina antirrábica precisa estar em dia (aplicada nos últimos 365 dias) e, no certificado dos EUA, é exigida para animais com mais de 2 meses de idade, planeje a vacinação com bastante antecedência. O MAG não publica regra de microchip, regra de teste sorológico antirrábico nem idade mínima de entrada para cachorros — mas confirme a situação do seu cachorro com seu veterinário e, na dúvida, diretamente com a Divisão de Quarentena do MAG. Lembre-se de que a autorização de importação é de uso único e não vale para a viagem de volta: para voltar, você vai precisar do certificado zoossanitário de exportação para animais de estimação."
    cls: neutral

arrival:
  intro:
    en: "What happens when your dog reaches El Salvador centres on the MAG quarantine document check and the quarantine permit at the point of entry."
    fr: "Ce qui se passe à l'arrivée de ton chien au Salvador tourne autour du contrôle documentaire de quarantaine du MAG et du permis de quarantaine au point d'entrée."
    es: "Lo que ocurre cuando tu perro llega a El Salvador gira en torno al control documental de cuarentena del MAG y al permiso de cuarentena en el punto de entrada."
    pt: "O que acontece quando seu cachorro chega a El Salvador gira em torno da conferência de documentos feita pela quarentena do MAG e da permissão de quarentena no ponto de entrada."
  points:
    - en: "Documents are checked by MAG (Dirección General de Ganadería, Quarantine Division) at the international airport, a land border or a port."
      fr: "Les documents sont contrôlés par le MAG (Dirección General de Ganadería, Division de la quarantaine) à l'aéroport international, à une frontière terrestre ou à un port."
      es: "Los documentos los revisa el MAG (Dirección General de Ganadería, División de Cuarentena) en el aeropuerto internacional, en una frontera terrestre o en un puerto."
      pt: "Os documentos são conferidos pelo MAG (Dirección General de Ganadería, Divisão de Quarentena) no aeroporto internacional, em uma fronteira terrestre ou em um porto."
    - en: "The MAG import authorization can be obtained in advance or completed on arrival at the point of entry ($9.04, valid 30 days, single-use)."
      fr: "L'autorisation d'importation du MAG peut être obtenue à l'avance ou effectuée à l'arrivée au point d'entrée (9,04 $, valable 30 jours, à usage unique)."
      es: "La autorización de importación del MAG puede obtenerse por adelantado o completarse a la llegada en el punto de entrada (9,04 $, válida 30 días, de un solo uso)."
      pt: "A autorização de importação do MAG pode ser obtida com antecedência ou resolvida na chegada ao ponto de entrada (US$ 9,04, válida por 30 dias, de uso único)."
    - en: "Carry the official zoosanitary certificate (original or copy) plus the vaccination card; arrivals from the US carry the bilateral health certificate, issued at least in duplicate."
      fr: "Munis-toi du certificat zoosanitaire officiel (original ou copie) et de la cartilla de vaccination ; les arrivées des États-Unis portent le certificat sanitaire bilatéral, établi au moins en double exemplaire."
      es: "Lleva el certificado zoosanitario oficial (original o copia) más la cartilla de vacunación; las llegadas desde EE. UU. llevan el certificado sanitario bilateral, emitido al menos por duplicado."
      pt: "Leve o certificado zoossanitário oficial (original ou cópia) e a carteira de vacinação; quem chega dos EUA leva o atestado de saúde bilateral, emitido pelo menos em duas vias."
    - en: "Personal pet dogs and cats must obtain a quarantine permit at the port of entry upon arrival (per USDA APHIS)."
      fr: "Les chiens et chats de compagnie doivent obtenir un permis de quarantaine au point d'entrée à l'arrivée (selon l'USDA APHIS)."
      es: "Los perros y gatos de compañía deben obtener un permiso de cuarentena en el punto de entrada a la llegada (según el USDA APHIS)."
      pt: "Cães e gatos de estimação pessoais precisam obter uma permissão de quarentena no ponto de entrada ao chegar (segundo o USDA APHIS)."
    - en: "Missing or invalid documents can delay clearance — confirm the current requirements with MAG's Quarantine Division before you fly."
      fr: "Des documents manquants ou invalides peuvent retarder le dédouanement — confirme les exigences en vigueur auprès de la Division de la quarantaine du MAG avant de voler."
      es: "Los documentos que falten o no sean válidos pueden retrasar el despacho — confirma los requisitos vigentes con la División de Cuarentena del MAG antes de volar."
      pt: "Documentos faltando ou inválidos podem atrasar a liberação — confirme as exigências em vigor com a Divisão de Quarentena do MAG antes de voar."
    - en: "Airlines have their own crate, breed and booking rules — confirm them separately before you fly."
      fr: "Les compagnies ont leurs propres règles de caisse, de race et de réservation — vérifie-les séparément avant de voler."
      es: "Las aerolíneas tienen sus propias normas de jaula, raza y reserva — confírmalas por separado antes de volar."
      pt: "As companhias aéreas têm as próprias regras de caixa de transporte, raça e reserva — confirme-as separadamente antes de voar."

travellerExperience: null

restrictedDogs:
  intro:
    en: "MAG publishes no breed-specific import ban for dogs entering El Salvador: entry formalities are health-based, not breed-based. Keeping dogs is instead governed by the Special Law for the Protection and Welfare of Animals (Ley Especial de Protección y Bienestar Animal, Legislative Decree No. 276, in force since 2022), which takes a behaviour-based approach rather than banning named breeds."
    fr: "Le MAG ne publie aucune interdiction d'importation visant une race pour les chiens entrant au Salvador : les formalités d'entrée sont sanitaires, non fondées sur la race. La détention des chiens relève en revanche de la Loi spéciale de protection et de bien-être animal (Ley Especial de Protección y Bienestar Animal, Décret législatif n° 276, en vigueur depuis 2022), qui adopte une approche comportementale plutôt que d'interdire des races nommées."
    es: "El MAG no publica ninguna prohibición de importación por raza para los perros que entran en El Salvador: las formalidades de entrada se basan en la sanidad, no en la raza. La tenencia de perros se rige en cambio por la Ley Especial de Protección y Bienestar Animal (Decreto Legislativo n.º 276, en vigor desde 2022), que adopta un enfoque basado en el comportamiento en lugar de prohibir razas concretas."
    pt: "O MAG não publica nenhuma proibição de importação por raça para os cachorros que entram em El Salvador: as formalidades de entrada são sanitárias, e não baseadas na raça. A posse de cachorros, por sua vez, é regida pela Lei Especial de Proteção e Bem-Estar Animal (Ley Especial de Protección y Bienestar Animal, Decreto Legislativo nº 276, em vigor desde 2022), que adota uma abordagem baseada no comportamento em vez de proibir raças nominalmente."
  cat1:
    en: "No dog breed is refused entry to El Salvador under MAG's published import rules. Any dog meeting the import-authorization, zoosanitary-certificate and vaccination requirements may be imported regardless of breed."
    fr: "Aucune race de chien n'est refusée à l'entrée du Salvador selon les règles d'importation publiées du MAG. Tout chien répondant aux exigences d'autorisation d'importation, de certificat zoosanitaire et de vaccination peut être importé, quelle que soit sa race."
    es: "Ninguna raza de perro es rechazada a la entrada de El Salvador según las normas de importación publicadas por el MAG. Cualquier perro que cumpla los requisitos de autorización de importación, certificado zoosanitario y vacunación puede importarse con independencia de su raza."
    pt: "Nenhuma raça de cachorro tem a entrada recusada em El Salvador pelas regras de importação publicadas pelo MAG. Qualquer cachorro que cumpra as exigências de autorização de importação, certificado zoossanitário e vacinação pode ser importado, seja qual for a raça."
  cat2:
    en: "Under the Special Law for the Protection and Welfare of Animals, breeding, hybridising or training companion animals to increase their dangerousness is prohibited, and dogs showing aggressive behaviour must be walked with a muzzle, leash or harness. The law also empowers the Animal Welfare Institute (Instituto de Bienestar Animal) to set policies that may include controls on the importation, reproduction or trade of breeds harmful to human life and other species — but no list of banned breeds is published. These rules concern keeping and conduct, not entry at the border."
    fr: "En vertu de la Loi spéciale de protection et de bien-être animal, l'élevage, l'hybridation ou le dressage d'animaux de compagnie pour accroître leur dangerosité sont interdits, et les chiens au comportement agressif doivent être promenés avec muselière, laisse ou harnais. La loi habilite aussi l'Institut de bien-être animal (Instituto de Bienestar Animal) à définir des politiques pouvant inclure des contrôles sur l'importation, la reproduction ou le commerce de races nuisibles à la vie humaine et aux autres espèces — mais aucune liste de races interdites n'est publiée. Ces règles concernent la détention et le comportement, pas l'entrée à la frontière."
    es: "Conforme a la Ley Especial de Protección y Bienestar Animal, se prohíbe criar, hibridar o adiestrar animales de compañía para aumentar su peligrosidad, y los perros que muestren un comportamiento agresivo deben pasearse con bozal, correa o arnés. La ley también faculta al Instituto de Bienestar Animal para fijar políticas que pueden incluir controles sobre la importación, la reproducción o el comercio de razas dañinas para la vida humana y otras especies — pero no se publica ninguna lista de razas prohibidas. Estas normas se refieren a la tenencia y la conducta, no a la entrada en la frontera."
    pt: "Pela Lei Especial de Proteção e Bem-Estar Animal, é proibido criar, hibridizar ou treinar animais de companhia para aumentar a periculosidade deles, e os cachorros que apresentam comportamento agressivo precisam ser conduzidos com focinheira, guia ou peitoral. A lei também dá ao Instituto de Bem-Estar Animal (Instituto de Bienestar Animal) o poder de definir políticas que podem incluir controles sobre a importação, a reprodução ou o comércio de raças nocivas à vida humana e a outras espécies — mas nenhuma lista de raças proibidas é publicada. Essas regras dizem respeito à posse e à conduta, não à entrada na fronteira."
  note:
    en: "So no breed is refused entry for its breed alone, but if you will live in El Salvador you must comply with the Special Law for the Protection and Welfare of Animals. Confirm current national rules, and your airline's breed policy, before booking."
    fr: "Ainsi, aucune race n'est refusée à l'entrée du seul fait de sa race, mais si tu résideras au Salvador, tu dois respecter la Loi spéciale de protection et de bien-être animal. Vérifie les règles nationales en vigueur, ainsi que la politique de race de ta compagnie, avant de réserver."
    es: "Así pues, ninguna raza es rechazada a la entrada solo por su raza, pero si vas a residir en El Salvador debes cumplir la Ley Especial de Protección y Bienestar Animal. Confirma las normas nacionales vigentes, así como la política de razas de tu aerolínea, antes de reservar."
    pt: "Ou seja, nenhuma raça tem a entrada recusada apenas por ser essa raça, mas, se você for morar em El Salvador, precisa cumprir a Lei Especial de Proteção e Bem-Estar Animal. Confirme as regras nacionais em vigor e a política de raças da sua companhia aérea antes de reservar."

checklist:
  - en: "MAG import authorization for pets ($9.04, valid 30 days, single-use) — obtained in advance or at the point of entry"
    fr: "Autorisation d'importation de mascotas du MAG (9,04 $, valable 30 jours, à usage unique) — obtenue à l'avance ou au point d'entrée"
    es: "Autorización de importación de mascotas del MAG (9,04 $, válida 30 días, de un solo uso) — obtenida por adelantado o en el punto de entrada"
    pt: "Autorização de importação do MAG para animais de estimação (US$ 9,04, válida por 30 dias, de uso único) — obtida com antecedência ou no ponto de entrada"
  - en: "Official zoosanitary certificate from the country of origin (original or copy)"
    fr: "Certificat zoosanitaire officiel du pays d'origine (original ou copie)"
    es: "Certificado zoosanitario oficial del país de origen (original o copia)"
    pt: "Certificado zoossanitário oficial do país de origem (original ou cópia)"
  - en: "Vaccination card from the country of origin, with a valid rabies vaccine (within 365 days; animals over 2 months vaccinated)"
    fr: "Cartilla de vaccination du pays d'origine, avec un vaccin antirabique valide (dans les 365 jours ; animaux de plus de 2 mois vaccinés)"
    es: "Cartilla de vacunación del país de origen, con una vacuna antirrábica válida (dentro de los 365 días; animales de más de 2 meses vacunados)"
    pt: "Carteira de vacinação do país de origem, com vacina antirrábica válida (aplicada nos últimos 365 dias; animais com mais de 2 meses vacinados)"
  - en: "From the US: the bilateral El Salvador dog/cat health certificate, issued at least in duplicate (no USDA endorsement, notary or consular stamp)"
    fr: "Depuis les États-Unis : le certificat sanitaire bilatéral chien/chat Salvador, établi au moins en double (sans visa USDA, notaire ni cachet consulaire)"
    es: "Desde EE. UU.: el certificado sanitario bilateral perro/gato de El Salvador, emitido al menos por duplicado (sin refrendo del USDA, notaría ni sello consular)"
    pt: "Vindo dos EUA: o atestado de saúde bilateral de El Salvador para cães/gatos, emitido pelo menos em duas vias (sem endosso do USDA, sem cartório e sem carimbo consular)"
  - en: "Internal and external parasite treatment with products approved by the country of origin"
    fr: "Traitement antiparasitaire interne et externe avec des produits approuvés par le pays d'origine"
    es: "Tratamiento antiparasitario interno y externo con productos aprobados por el país de origen"
    pt: "Tratamento antiparasitário interno e externo com produtos aprovados pelo país de origem"
  - en: "Microchip fitted (not required by MAG, but advised for ID, return trip and airlines)"
    fr: "Puce posée (non exigée par le MAG, mais conseillée pour l'ID, le retour et les compagnies)"
    es: "Microchip implantado (no exigido por el MAG, pero recomendado para la identificación, el regreso y las aerolíneas)"
    pt: "Microchip implantado (não exigido pelo MAG, mas recomendado para a identificação, a viagem de volta e as companhias aéreas)"
  - en: "For the return trip: MAG export zoosanitary certificate for pets (the import authorization is not valid for the way back)"
    fr: "Pour le retour : certificat zoosanitaire d'exportation de mascotas du MAG (l'autorisation d'importation n'est pas valable au retour)"
    es: "Para el viaje de regreso: certificado zoosanitario de exportación de mascotas del MAG (la autorización de importación no es válida para la vuelta)"
    pt: "Para a viagem de volta: certificado zoossanitário de exportação do MAG para animais de estimação (a autorização de importação não vale para a volta)"
  - en: "Airline reservation and suitable travel crate if travelling in the hold"
    fr: "Réservation compagnie et caisse de transport adaptée si voyage en soute"
    es: "Reserva de la aerolínea y jaula de transporte adecuada si viaja en bodega"
    pt: "Reserva na companhia aérea e caixa de transporte adequada às normas IATA se for viajar no porão"

