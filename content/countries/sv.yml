# Country Entry Guide — El Salvador (bilingual EN/FR).
# El Salvador is NOT in the EU. This encodes El Salvador's own MAG / Dirección General de Ganadería scheme.
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_sv
iso2: "SV"
name: { en: "El Salvador", fr: "Salvador", es: "El Salvador", pt: "El Salvador" }
region: { en: "Central America", fr: "Amérique centrale", es: "América Central", pt: "América Central" }


regime: non_listed
exit:
  authority: MAG
  authorityUrl: https://www.mag.gob.sv/certificados-zoosanitarios-de-exportacion-de-mascotas/
  intro:
    en: "El Salvador is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Ministerio de Agricultura y Ganadería (MAG)."
    fr: "Le Salvador est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par le Ministerio de Agricultura y Ganadería (MAG)."
    es: "El Salvador no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el Ministerio de Agricultura y Ganadería (MAG)."
    pt: "El Salvador é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação visado pelo Ministerio de Agricultura y Ganadería (MAG)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: eu
      text:
        en: "MAG (Quarantine Division) issues the export zoosanitary certificate from a vet's health certificate dated within 15 days, 3–5 working days before travel, then apostilled for the EU."
        fr: "Le MAG (division de quarantaine) délivre le certificat zoosanitaire d'export à partir d'un certificat de moins de 15 jours, 3–5 jours ouvrés avant le voyage, puis apostillé pour l'UE."
        es: "El MAG (División de Cuarentena) emite el certificado zoosanitario de exportación a partir de un certificado de menos de 15 días, 3–5 días hábiles antes del viaje, luego apostillado para la UE."
        pt: "O MAG (Divisão de Quarentena) emite o certificado zoossanitário de exportação a partir de um atestado de saúde veterinário com no máximo 15 dias, de 3 a 5 dias úteis antes da viagem, e ele é depois apostilado para a UE."
    - timing: window
      scope: non_eu
      text:
        en: "MAG (Quarantine Division) issues the export zoosanitary certificate from a vet's health certificate dated within 15 days, 3–5 working days before travel."
        fr: "Le MAG (division Quarantaine) délivre le certificat zoosanitaire d'export à partir d'un certificat vétérinaire de moins de 15 jours, 3 à 5 jours ouvrés avant le voyage."
        es: "El MAG (División de Cuarentena) expide el certificado zoosanitario de exportación a partir de un certificado veterinario de menos de 15 días, 3–5 días hábiles antes del viaje."
        pt: "O MAG (Divisão de Quarentena) emite o certificado zoossanitário de exportação a partir de um atestado veterinário com até 15 dias, de 3 a 5 dias úteis antes da viagem."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to El Salvador with your dog", fr: "Voyager au Salvador avec ton chien", es: "Viajar a El Salvador con tu perro", pt: "Viajar para El Salvador com seu cachorro" }
  intro:
    en: >-
      El Salvador welcomes dogs, and its rules are handled by its own animal-health authority — the
      Directorate General of Livestock (Dirección General de Ganadería), through its Quarantine Division,
      within the Ministry of Agriculture and Livestock (MAG, Ministerio de Agricultura y Ganadería), not
      the EU pet-passport system. A dog travelling with its owner needs an import authorization issued by
      MAG, together with the vaccination card and the official zoosanitary certificate from the country of
      origin. Unlike some neighbours, El Salvador does require this import authorization for a personal pet
      dog — but it is inexpensive and can be obtained in advance or on arrival at the international airport,
      a land border or a port. What you must prepare still depends on your dog's country of departure and
      recent history, because the zoosanitary certificate and vaccination card are issued by the veterinary
      authority of that country. This guide explains what to prepare before you book your flight.
    fr: >-
      Le Salvador accueille les chiens, et ses règles relèvent de sa propre autorité sanitaire animale —
      la Direction générale de l'Élevage (Dirección General de Ganadería), via sa Division de la quarantaine,
      au sein du Ministère de l'Agriculture et de l'Élevage (MAG, Ministerio de Agricultura y Ganadería), et
      non du système du passeport européen. Un chien voyageant avec son propriétaire a besoin d'une
      autorisation d'importation délivrée par le MAG, accompagnée de la cartilla de vaccination et du
      certificat zoosanitaire officiel du pays d'origine. À la différence de certains voisins, le Salvador
      exige bien cette autorisation d'importation pour un chien de compagnie — mais elle est peu coûteuse et
      peut être obtenue à l'avance ou à l'arrivée, à l'aéroport international, à une frontière terrestre ou à
      un port. Ce qu'il faut préparer dépend tout de même du pays de départ et de l'historique récent du
      chien, car le certificat zoosanitaire et la cartilla sont délivrés par l'autorité vétérinaire de ce
      pays. Ce guide détaille quoi préparer avant de réserver ton vol.
    es: >-
      El Salvador acoge a los perros, y sus normas las gestiona su propia autoridad de sanidad animal — la
      Dirección General de Ganadería, a través de su División de Cuarentena, dentro del Ministerio de
      Agricultura y Ganadería (MAG), no el sistema del pasaporte europeo para mascotas. Un perro que viaja
      con su propietario necesita una autorización de importación expedida por el MAG, junto con la cartilla
      de vacunación y el certificado zoosanitario oficial del país de origen. A diferencia de algunos países
      vecinos, El Salvador sí exige esta autorización de importación para un perro de compañía — pero es
      económica y puede obtenerse por adelantado o a la llegada en el aeropuerto internacional, en una
      frontera terrestre o en un puerto. Lo que debes preparar depende igualmente del país de salida de tu
      perro y de su historial reciente, ya que el certificado zoosanitario y la cartilla de vacunación los
      expide la autoridad veterinaria de ese país. Esta guía explica qué preparar antes de reservar tu vuelo.

    pt: "El Salvador recebe cachorros, e as regras do país são conduzidas pela sua própria autoridade de saúde animal — a Direção-Geral de Pecuária (Dirección General de Ganadería), por meio da sua Divisão de Quarentena, dentro do Ministério da Agricultura e Pecuária (MAG, Ministerio de Agricultura y Ganadería) —, e não pelo sistema do passaporte europeu para animais. Um cachorro que viaja com seu dono precisa de uma autorização de importação emitida pelo MAG, junto com a carteira de vacinação e o certificado zoossanitário oficial do país de origem. Diferentemente de alguns vizinhos, El Salvador realmente exige essa autorização de importação para um cachorro de estimação pessoal — mas ela é barata e pode ser obtida com antecedência ou na chegada ao aeroporto internacional, a uma fronteira terrestre ou a um porto. O que você tem de preparar também depende do país de partida e do histórico recente do seu cachorro, porque o certificado zoossanitário e a carteira de vacinação são emitidos pela autoridade veterinária desse país. Este guia explica o que preparar antes de você reservar o voo."
difficulty:
  level: easy
  label: { en: "Easy — one MAG import authorization plus a zoosanitary certificate and vaccination card", fr: "Facile — une autorisation d'importation du MAG, un certificat zoosanitaire et une cartilla de vaccination", es: "Fácil — una autorización de importación del MAG más un certificado zoosanitario y la cartilla de vacunación", pt: "Fácil — uma autorização de importação do MAG, mais um certificado zoossanitário e a carteira de vacinação" }

prepTime:
  eu:
    en: "A few days if the rabies vaccine is already valid — you mainly need the official zoosanitary certificate and vaccination card from the country of departure, plus the MAG import authorization ($9.04)."
    fr: "Quelques jours si le vaccin antirabique est déjà valide — il faut surtout le certificat zoosanitaire officiel et la cartilla de vaccination du pays de départ, ainsi que l'autorisation d'importation du MAG (9,04 $)."
    es: "Unos días si la vacuna antirrábica ya está en vigor — necesitas sobre todo el certificado zoosanitario oficial y la cartilla de vacunación del país de salida, más la autorización de importación del MAG (9,04 $)."
    pt: "Alguns dias se a vacina antirrábica já estiver válida — você precisa basicamente do certificado zoossanitário oficial e da carteira de vacinação do país de partida, mais a autorização de importação do MAG (US$ 9,04)."
  listed:
    en: "From the United States: allow time for a licensed veterinarian to complete the bilateral El Salvador health certificate (rabies vaccine within 365 days, endo/ectoparasite treatment). USDA endorsement, notary and consular stamp are NOT required."
    fr: "Depuis les États-Unis : prévois le temps qu'un vétérinaire licencié complète le certificat sanitaire bilatéral Salvador (vaccin antirabique dans les 365 jours, traitement endo/ectoparasitaire). Le visa de l'USDA, le notaire et le cachet consulaire ne sont PAS exigés."
    es: "Desde Estados Unidos: prevé el tiempo para que un veterinario licenciado complete el certificado sanitario bilateral de El Salvador (vacuna antirrábica dentro de los 365 días, tratamiento endo/ectoparasitario). NO se exigen el refrendo del USDA, la notaría ni el sello consular."
    pt: "Vindo dos Estados Unidos: reserve tempo para que um veterinário licenciado preencha o atestado de saúde bilateral de El Salvador (vacina antirrábica aplicada nos últimos 365 dias, tratamento contra endo e ectoparasitas). Não são exigidos endosso do USDA, reconhecimento em cartório nem carimbo consular."
  nonListed:
    en: "~1 month if a rabies shot is still needed: the animal must be vaccinated (over 2 months of age) with a rabies vaccine applied no more than 365 days before travel, recorded on the vaccination card."
    fr: "~1 mois si une vaccination antirabique reste à faire : l'animal doit être vacciné (à partir de 2 mois) avec un vaccin antirabique appliqué au plus 365 jours avant le voyage, consigné sur la cartilla."
    es: "~1 mes si aún falta poner una vacuna antirrábica: el animal debe estar vacunado (a partir de 2 meses de edad) con una vacuna antirrábica aplicada como máximo 365 días antes del viaje, registrada en la cartilla de vacunación."
    pt: "~1 mês se ainda faltar a dose antirrábica: o animal precisa ser vacinado (com mais de 2 meses de idade) com uma vacina antirrábica aplicada no máximo 365 dias antes da viagem, registrada na carteira de vacinação."

