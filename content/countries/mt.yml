regime: eu

hero:
  h1: { en: "Traveling to Malta with your dog", fr: "Voyager à Malte avec ton chien", es: "Viajar a Malta con tu perro", pt: "Viajar para Malta com seu cachorro" }
  intro:
    en: >-
      Malta welcomes dogs, but what you need to prepare depends mainly on the country your dog is
      travelling from — not only on Malta itself. As an EU member, Malta applies the EU pet-movement
      rules: an ISO microchip and a valid rabies vaccination are always required. A dog coming from
      another EU country simply needs an EU pet passport; a dog from a listed non-EU country (such as
      the United States, Canada or the United Kingdom) needs an EU animal health certificate but no
      blood test; a dog from a non-listed country faces the longest path, including a rabies antibody
      test and a three-month wait. Because Malta is an island, two extra steps apply to almost every
      dog: a tapeworm treatment given by a vet shortly before arrival, and an advance arrival
      notification to the veterinary authorities. This guide explains each case so you know exactly
      what to prepare before you book your flight.
    fr: >-
      Malte accueille les chiens, mais ce qu'il faut préparer dépend surtout du pays d'où ton chien
      voyage — pas seulement de Malte. En tant qu'État membre de l'UE, Malte applique les règles
      européennes de mouvement des animaux : une puce ISO et une vaccination antirabique valide sont
      toujours exigées. Un chien venant d'un autre pays de l'UE a simplement besoin d'un passeport
      européen ; un chien en provenance d'un pays tiers listé (États-Unis, Canada, Royaume-Uni…) a
      besoin d'un certificat sanitaire européen mais pas de prise de sang ; un chien venant d'un pays
      non listé suit le parcours le plus long, avec un titrage antirabique et un délai de trois mois.
      Comme Malte est une île, deux étapes supplémentaires concernent presque tous les chiens : un
      traitement contre le ténia administré par un vétérinaire peu avant l'arrivée, et une notification
      d'arrivée préalable aux autorités vétérinaires. Ce guide détaille chaque cas pour savoir
      exactement quoi préparer avant de réserver ton vol.
    es: >-
      Malta acoge a los perros, pero lo que debes preparar depende sobre todo del país desde el que
      viaja tu perro — no solo de Malta. Como Estado miembro de la UE, Malta aplica las normas europeas
      de movimiento de animales de compañía: siempre se exigen un microchip ISO y una vacunación
      antirrábica válida. Un perro que llega de otro país de la UE solo necesita un pasaporte europeo
      para mascotas; un perro procedente de un país tercero listado (como Estados Unidos, Canadá o el
      Reino Unido) necesita un certificado sanitario animal de la UE, pero no una prueba de sangre; un
      perro de un país no listado se enfrenta al camino más largo, que incluye una prueba de titulación
      de rabia y una espera de tres meses. Como Malta es una isla, dos pasos adicionales se aplican a
      casi todos los perros: un tratamiento contra la tenia administrado por un veterinario poco antes
      de la llegada, y una notificación de llegada previa a las autoridades veterinarias. Esta guía
      explica cada caso para que sepas exactamente qué preparar antes de reservar tu vuelo.

    pt: "Malta recebe bem os cachorros, mas o que você precisa preparar depende principalmente do país de onde seu cachorro parte — e não só de Malta em si. Como membro da União Europeia, Malta aplica as regras europeias de circulação de animais de estimação: microchip ISO e vacinação antirrábica válida são sempre obrigatórios. Um cachorro vindo de outro país da UE precisa apenas do passaporte europeu para animais; um cachorro vindo de um país listado fora da UE (como Estados Unidos, Canadá ou Reino Unido) precisa de um certificado sanitário europeu, mas não de exame de sangue; um cachorro vindo de um país não listado enfrenta o caminho mais longo, com teste sorológico antirrábico e três meses de espera. Como Malta é uma ilha, duas etapas a mais valem para quase todo cachorro: um tratamento contra a tênia aplicado por um veterinário pouco antes da chegada e uma notificação prévia de chegada às autoridades veterinárias. Este guia explica cada caso para você saber exatamente o que preparar antes de comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Easy to difficult (depends on origin)", fr: "Facile à difficile (selon l'origine)", es: "De fácil a difícil (según el origen)", pt: "De fácil a difícil (depende da origem)" }

prepTime:
  eu:
    en: "A few days if the passport is up to date — plus a vet-recorded tapeworm treatment 24–120 hours before arrival and an advance arrival notification."
    fr: "Quelques jours si le passeport est à jour — plus un traitement contre le ténia consigné par le vétérinaire 24 à 120 heures avant l'arrivée et une notification d'arrivée préalable."
    es: "Unos días si el pasaporte está al día — más un tratamiento contra la tenia registrado por el veterinario 24–120 horas antes de la llegada y una notificación de llegada previa."
    pt: "Alguns dias se o passaporte estiver em dia — mais um tratamento contra a tênia registrado pelo veterinário de 24 a 120 horas antes da chegada e uma notificação prévia de chegada."
  listed:
    en: "~3–4 weeks: 21-day wait after the rabies shot, a health certificate valid 10 days, plus the tapeworm treatment and advance notice."
    fr: "~3–4 semaines : délai de 21 jours après le vaccin, certificat sanitaire valable 10 jours, plus le traitement contre le ténia et une notification préalable."
    es: "~3–4 semanas: espera de 21 días tras la vacuna antirrábica, un certificado sanitario válido 10 días, más el tratamiento contra la tenia y una notificación previa."
    pt: "Cerca de 3 a 4 semanas: 21 dias de espera depois da vacina antirrábica, certificado sanitário válido por 10 dias, mais o tratamento contra a tênia e a notificação prévia."
  nonListed:
    en: "~4–7 months: antibody test at least 30 days after vaccination, then a compulsory 3-month wait, plus the tapeworm treatment and advance notice."
    fr: "~4–7 mois : titrage au moins 30 jours après le vaccin, puis un délai obligatoire de 3 mois, plus le traitement contre le ténia et une notification préalable."
    es: "~4–7 meses: prueba de titulación al menos 30 días después de la vacuna, y luego una espera obligatoria de 3 meses, más el tratamiento contra la tenia y una notificación previa."
    pt: "Cerca de 4 a 7 meses: teste sorológico no mínimo 30 dias depois da vacinação, seguido de 3 meses obrigatórios de espera, mais o tratamento contra a tênia e a notificação prévia."

