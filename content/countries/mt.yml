# Country Entry Guide — Malta (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_mt
iso2: "MT"
name: { en: "Malta", fr: "Malte", es: "Malta", pt: "Malta" }
