# Country Entry Guide — The Gambia (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_gm
iso2: "GM"
name: { en: "The Gambia", fr: "Gambie", es: "Gambia", pt: "Gâmbia" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
exit:
  authority: Department of Livestock Services
  authorityUrl: https://moa.gov.gm/
  intro:
    en: "Gambia is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Department of Livestock Services (veterinary services)."
    fr: "La Gambie est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par le Department of Livestock Services (services vétérinaires)."
    es: "Gambia no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el Department of Livestock Services (servicios veterinarios)."
    pt: "A Gâmbia é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pelo Department of Livestock Services (serviços veterinários)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "The Department of Livestock Services (the national competent authority) regulates animal movement and issues the export veterinary documentation."
        fr: "Le Department of Livestock Services (autorité nationale compétente) régule les mouvements d'animaux et délivre la documentation vétérinaire d'export."
        es: "El Department of Livestock Services (autoridad nacional competente) regula el movimiento de animales y emite la documentación veterinaria de exportación."
        pt: "O Department of Livestock Services (a autoridade nacional competente) regula a movimentação de animais e emite a documentação veterinária de exportação."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to The Gambia with your dog", fr: "Voyager en Gambie avec ton chien", es: "Viajar a Gambia con tu perro", pt: "Viajar para a Gâmbia com seu cachorro" }
  intro:
    en: >-
      The Gambia admits pet dogs, but entry is controlled by its own veterinary authority — the
      Department of Livestock Services (the country's veterinary services and competent authority
      within the Ministry of Agriculture) — and not by the EU framework. The United States export
      authorities (USDA APHIS) confirm that an import permit issued by the Department of Livestock
      Services is required to bring an animal into The Gambia, and Gambian customs (the Gambia Revenue
      Authority) treat live animals from other countries as goods "subject to strict control" that
      must travel with an official import certificate. In practice your dog will also need an official
      international veterinary health certificate from a government-authorised vet in the country of
      origin, together with proof of a valid rabies vaccination. Beyond those points, The Gambia
      publishes very little detail on-line about the exact steps for a pet dog: several specifics are
      simply not made public. This guide sets out what is officially confirmed, flags clearly what is
      unknown, and tells you where to confirm the rest before you book your flight.
    fr: >-
      La Gambie admet les chiens de compagnie, mais l'entrée est contrôlée par sa propre autorité
      vétérinaire — le Department of Livestock Services (les services vétérinaires et l'autorité
      compétente du pays, au sein du ministère de l'Agriculture) — et non par le cadre européen. Les
      autorités d'exportation américaines (USDA APHIS) confirment qu'un permis d'importation délivré
      par le Department of Livestock Services est exigé pour faire entrer un animal en Gambie, et la
      douane gambienne (Gambia Revenue Authority) considère les animaux vivants venant d'autres pays
      comme des marchandises « soumises à un contrôle strict » devant voyager avec un certificat
      d'importation officiel. En pratique, ton chien aura aussi besoin d'un certificat vétérinaire
      international officiel établi par un vétérinaire mandaté du pays d'origine, ainsi que d'une preuve
      de vaccination antirabique valide. Au-delà de ces points, la Gambie publie très peu de détails en
      ligne sur les étapes exactes pour un chien de compagnie : plusieurs précisions ne sont tout
      simplement pas rendues publiques. Ce guide expose ce qui est officiellement confirmé, signale
      clairement ce qui reste inconnu et indique où vérifier le reste avant de réserver ton vol.
    es: >-
      Gambia admite a los perros de compañía, pero la entrada la controla su propia autoridad
      veterinaria — el Department of Livestock Services (los servicios veterinarios y la autoridad
      competente del país, dentro del Ministerio de Agricultura) — y no el marco de la UE. Las
      autoridades de exportación de Estados Unidos (USDA APHIS) confirman que se exige un permiso de
      importación expedido por el Department of Livestock Services para introducir un animal en Gambia,
      y la aduana gambiana (Gambia Revenue Authority) trata a los animales vivos procedentes de otros
      países como mercancías «sujetas a control estricto» que deben viajar con un certificado de
      importación oficial. En la práctica, tu perro también necesitará un certificado sanitario
      veterinario internacional oficial de un veterinario autorizado por el gobierno del país de origen,
      junto con una prueba de vacunación antirrábica válida. Más allá de esos puntos, Gambia publica muy
      pocos detalles en línea sobre los pasos exactos para un perro de compañía: varios detalles
      simplemente no se hacen públicos. Esta guía expone lo que está oficialmente confirmado, señala con
      claridad lo que es desconocido e indica dónde confirmar el resto antes de reservar tu vuelo.

    pt: "A Gâmbia admite cachorros de estimação, mas a entrada é controlada por sua própria autoridade veterinária — o Department of Livestock Services (os serviços veterinários e a autoridade competente do país, dentro do Ministério da Agricultura) — e não pelo quadro da UE. As autoridades de exportação dos Estados Unidos (USDA APHIS) confirmam que uma autorização de importação emitida pelo Department of Livestock Services é exigida para levar um animal à Gâmbia, e a alfândega gambiana (Gambia Revenue Authority) trata os animais vivos vindos de outros países como mercadorias 'sujeitas a controle rigoroso', que devem viajar com um certificado de importação oficial. Na prática, seu cachorro também vai precisar de um atestado de saúde veterinário internacional oficial emitido por um veterinário autorizado pelo governo no país de origem, junto com a comprovação de uma vacinação antirrábica válida. Além desses pontos, a Gâmbia publica muito poucos detalhes on-line sobre as etapas exatas para um cachorro de estimação: várias especificidades simplesmente não são divulgadas. Este guia apresenta o que está oficialmente confirmado, sinaliza claramente o que não é conhecido, e indica onde confirmar o restante antes de reservar seu voo."
difficulty:
  level: difficult
  label: { en: "Difficult — import permit required and most requirements not officially published", fr: "Difficile — permis d'importation requis et exigences majoritairement non publiées", es: "Difícil — permiso de importación obligatorio y la mayoría de los requisitos no publicados oficialmente", pt: "Difícil — autorização de importação exigida e a maioria das exigências não é publicada oficialmente" }

prepTime:
  eu:
    en: "From the EU: allow ample time and start by contacting the Department of Livestock Services for the import permit, then have an official EU vet issue the international veterinary certificate close to departure. Exact processing times are not published: Unknown — plan a comfortable margin."
    fr: "Depuis l'UE : prévois une marge confortable et commence par contacter le Department of Livestock Services pour le permis d'importation, puis fais établir le certificat vétérinaire international par un vétérinaire officiel de l'UE peu avant le départ. Les délais exacts ne sont pas publiés : non communiqués — prévois large."
    es: "Desde la UE: reserva bastante tiempo y empieza por contactar con el Department of Livestock Services para el permiso de importación; después, haz que un veterinario oficial de la UE expida el certificado veterinario internacional poco antes de la salida. Los plazos exactos de tramitación no están publicados: Desconocidos — planifica un margen holgado."
    pt: "Da UE: reserve bastante tempo e comece entrando em contato com o Department of Livestock Services para a autorização de importação, depois peça a um veterinário oficial da UE para emitir o certificado veterinário internacional perto da partida. Os prazos exatos de processamento não são publicados: não comunicado — planeje uma margem confortável."
  listed:
    en: "From another third country (e.g. the United States): USDA APHIS confirms an import permit from the Department of Livestock Services is required and that the health certificate must be issued by an accredited vet and government-endorsed before departure. Exact lead time is not published: Unknown."
    fr: "Depuis un autre pays tiers (p. ex. les États-Unis) : l'USDA APHIS confirme qu'un permis d'importation du Department of Livestock Services est exigé et que le certificat sanitaire doit être établi par un vétérinaire accrédité et visé par le gouvernement avant le départ. Le délai exact n'est pas publié : non communiqué."
    es: "Desde otro país tercero (p. ej. Estados Unidos): el USDA APHIS confirma que se exige un permiso de importación del Department of Livestock Services y que el certificado sanitario debe ser expedido por un veterinario acreditado y refrendado por el gobierno antes de la salida. El plazo exacto no está publicado: Desconocido."
    pt: "De outro país terceiro (por exemplo, os Estados Unidos): a USDA APHIS confirma que é exigida uma autorização de importação do Department of Livestock Services e que o atestado de saúde deve ser emitido por um veterinário credenciado e endossado pelo governo antes da partida. O prazo exato não é publicado: não comunicado."
  nonListed:
    en: "Whatever the origin, the limiting step is obtaining the Department of Livestock Services import permit and a valid rabies vaccination in time. Because The Gambia publishes so little, confirm the current procedure directly with the veterinary authority well before travel."
    fr: "Quelle que soit l'origine, l'étape limitante est l'obtention du permis d'importation du Department of Livestock Services et d'une vaccination antirabique valide à temps. La Gambie publiant très peu, confirme la procédure à jour directement auprès de l'autorité vétérinaire bien avant le voyage."
    es: "Sea cual sea el origen, el paso limitante es obtener a tiempo el permiso de importación del Department of Livestock Services y una vacunación antirrábica válida. Como Gambia publica tan poco, confirma el procedimiento actual directamente con la autoridad veterinaria mucho antes de viajar."
    pt: "Seja qual for a origem, a etapa limitante é obter a tempo a autorização de importação do Department of Livestock Services e uma vacinação antirrábica válida. Como a Gâmbia publica muito pouco, confirme o procedimento atual diretamente com a autoridade veterinária bem antes da viagem."

