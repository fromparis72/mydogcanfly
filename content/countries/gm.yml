seo:
  title: { en: "The Gambia Dog Entry Requirements — Travel Guide", fr: "Formalités d'entrée chien en Gambie — Guide", es: "Requisitos de entrada de perros en Gambia — Guía de viaje", pt: "Exigências de Entrada de Cachorros na Gâmbia — Guia de Viagem" }
  metaTitle: { en: "Taking Your Dog to the Gambia: Pet Travel Requirements", fr: "Voyager en Gambie avec ton chien : formalités (2026)", es: "Viajar a Gambia con tu perro: requisitos de entrada (2026)", pt: "Levar seu cachorro para a Gâmbia: exigências de entrada 2026" }
  metaDesc:
    en: "Official rules for bringing a dog into The Gambia: an import permit from the Department of Livestock Services. Many details are unpublished — sourced and dated."
    fr: "Règles officielles pour faire entrer un chien en Gambie : permis d'importation du Department of Livestock Services. Beaucoup de détails non publiés — sourcé et daté."
    es: "Normas oficiales para traer un perro a Gambia: un permiso de importación del Department of Livestock Services. Muchos detalles no publicados — con fuentes y fecha."
    pt: "Regras oficiais para levar um cachorro à Gâmbia: uma autorização de importação do Department of Livestock Services. Muitos detalhes não são publicados."
  slug: "gambia"
