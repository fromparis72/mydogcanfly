  - item: { en: "Import permit (Department of Livestock Services)", fr: "Permis d'importation (Department of Livestock Services)", es: "Permiso de importación (Department of Livestock Services)", pt: "Autorização de importação (Department of Livestock Services)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "USDA APHIS states that an import permit issued by the Department of Livestock Services (Veterinary Services and Competent Authority of The Gambia) is required to import an animal into The Gambia. Contact that authority to apply. The exact application form, fees, lead time and whether the permit must be secured before departure or on arrival are not officially published: Unknown — confirm directly.", fr: "L'USDA APHIS indique qu'un permis d'importation délivré par le Department of Livestock Services (services vétérinaires et autorité compétente de la Gambie) est exigé pour importer un animal en Gambie. Contacte cette autorité pour en faire la demande. Le formulaire exact, les frais, le délai et le fait de devoir l'obtenir avant le départ ou à l'arrivée ne sont pas publiés officiellement : non communiqués — à confirmer directement.", es: "El USDA APHIS indica que se exige un permiso de importación expedido por el Department of Livestock Services (servicios veterinarios y autoridad competente de Gambia) para importar un animal a Gambia. Contacta con esa autoridad para solicitarlo. El formulario exacto, las tasas, el plazo y si el permiso debe obtenerse antes de la salida o a la llegada no están publicados oficialmente: Desconocidos — confírmalo directamente.", pt: "A USDA APHIS informa que é exigida uma autorização de importação emitida pelo Department of Livestock Services (Serviços Veterinários e Autoridade Competente da Gâmbia) para importar um animal à Gâmbia. Entre em contato com essa autoridade para solicitá-la. O formulário exato de solicitação, as taxas, o prazo e se a autorização deve ser obtida antes da partida ou na chegada não são publicados oficialmente: não comunicado — confirme diretamente." }
    exceptions: { en: "No exceptions published — an animal without the required permit risks refusal or detention at customs.", fr: "Aucune exception publiée — un animal sans le permis exigé risque le refus ou la rétention à la douane.", es: "No hay excepciones publicadas — un animal sin el permiso exigido corre el riesgo de ser rechazado o retenido en la aduana.", pt: "Nenhuma exceção publicada — um animal sem a autorização exigida corre o risco de recusa ou retenção na alfândega." }
    ref: { en: "USDA APHIS — Export Live Animals to The Gambia (import permit from Department of Livestock Services)", fr: "USDA APHIS — Export d'animaux vivants vers la Gambie (permis d'importation du Department of Livestock Services)", es: "USDA APHIS — Exportación de animales vivos a Gambia (permiso de importación del Department of Livestock Services)", pt: "USDA APHIS — Export Live Animals to The Gambia (autorização de importação do Department of Livestock Services)" }
  - item: { en: "Identification (ISO microchip)", fr: "Identification (puce ISO)", es: "Identificación (microchip ISO)", pt: "Identificação (microchip ISO)" }
    required: { en: "Recommended", fr: "Recommandée", es: "Recomendado", pt: "Recomendado" }
    when: { en: "The Gambia does not publish a microchip rule for pet dogs. An internationally readable ISO 11784/11785 microchip, implanted before the rabies vaccination so records match, is strongly advisable for identification and for any later return to the EU.", fr: "La Gambie ne publie pas de règle de puce pour les chiens de compagnie. Une puce ISO 11784/11785 lisible à l'international, posée avant la vaccination antirabique pour que les documents concordent, est fortement conseillée pour l'identification et pour un éventuel retour ultérieur vers l'UE.", es: "Gambia no publica una norma de microchip para los perros de compañía. Un microchip ISO 11784/11785 legible a nivel internacional, implantado antes de la vacunación antirrábica para que los registros coincidan, es muy aconsejable para la identificación y para un posible regreso posterior a la UE.", pt: "A Gâmbia não publica uma regra de microchip para cachorros de estimação. Um microchip ISO 11784/11785 legível internacionalmente, implantado antes da vacinação antirrábica para que os registros coincidam, é fortemente recomendável para identificação e para uma eventual volta à UE." }
    exceptions: { en: "Whether a microchip (or which standard) is mandatory for entry is not officially published: Unknown.", fr: "Le caractère obligatoire d'une puce (ou la norme exigée) pour l'entrée n'est pas publié officiellement : non communiqué.", es: "Si un microchip (o qué norma) es obligatorio para la entrada no está publicado oficialmente: Desconocido.", pt: "Se um microchip (ou qual norma) é obrigatório para a entrada não é publicado oficialmente: não comunicado." }
    ref: { en: "No microchip rule published on official Gambian sources; ISO standard is EU/international best practice", fr: "Aucune règle de puce publiée sur les sources officielles gambiennes ; la norme ISO est la bonne pratique UE/internationale", es: "No hay ninguna norma de microchip publicada en las fuentes oficiales gambianas; la norma ISO es la buena práctica de la UE/internacional", pt: "Nenhuma regra de microchip publicada em fontes oficiais gambianas; a norma ISO é a melhor prática da UE/internacional" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required in practice", fr: "Requise en pratique", es: "Obligatoria en la práctica", pt: "Obrigatória na prática" }
    when: { en: "The Gambia is in a rabies-endemic region, and USDA APHIS advises proof of current rabies vaccination for dogs travelling abroad. A valid rabies vaccination recorded in the vaccination booklet and on the veterinary certificate should be carried. The exact minimum interval between vaccination and travel required by The Gambia is not published: Unknown.", fr: "La Gambie se situe dans une région d'endémie rabique, et l'USDA APHIS recommande une preuve de vaccination antirabique à jour pour les chiens voyageant à l'étranger. Une vaccination antirabique valide consignée dans le carnet de vaccination et sur le certificat vétérinaire doit être emportée. Le délai minimum exact entre la vaccination et le voyage exigé par la Gambie n'est pas publié : non communiqué.", es: "Gambia se sitúa en una región con rabia endémica, y el USDA APHIS recomienda una prueba de vacunación antirrábica al día para los perros que viajan al extranjero. Debe llevarse una vacunación antirrábica válida registrada en la cartilla de vacunación y en el certificado veterinario. El intervalo mínimo exacto entre la vacunación y el viaje exigido por Gambia no está publicado: Desconocido.", pt: "A Gâmbia está em uma região com raiva endêmica, e a USDA APHIS recomenda comprovação de vacinação antirrábica em dia para cachorros que viajam para o exterior. Deve-se levar uma vacinação antirrábica válida, registrada na carteira de vacinação e no certificado veterinário. O intervalo mínimo exato entre a vacinação e a viagem exigido pela Gâmbia não é publicado: não comunicado." }
    exceptions: { en: "A dog too young to be validly vaccinated cannot meet a rabies requirement. Confirm timing with your vet and the Department of Livestock Services.", fr: "Un chien trop jeune pour être valablement vacciné ne peut satisfaire une exigence antirabique. Confirme le calendrier avec ton vétérinaire et le Department of Livestock Services.", es: "Un perro demasiado joven para estar válidamente vacunado no puede cumplir un requisito antirrábico. Confirma los plazos con tu veterinario y el Department of Livestock Services.", pt: "Um cachorro jovem demais para ser validamente vacinado não pode cumprir uma exigência de raiva. Confirme os prazos com seu veterinário e com o Department of Livestock Services." }
    ref: { en: "USDA APHIS — pet travel guidance (proof of current rabies vaccination); rabies-endemic region", fr: "USDA APHIS — recommandations voyage animaux (preuve de vaccination antirabique à jour) ; région d'endémie rabique", es: "USDA APHIS — recomendaciones de viaje de mascotas (prueba de vacunación antirrábica al día); región con rabia endémica", pt: "USDA APHIS — orientação para viagem de animais de estimação (comprovação de vacinação antirrábica em dia); região com raiva endêmica" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not published", fr: "Non prévu", es: "No previsto", pt: "Não publicado" }
    when: { en: "No rabies antibody test is published as a Gambian entry requirement for a pet dog. (A rabies antibody test may still be relevant for a later return to the EU, because the region is rabies-endemic.)", fr: "Aucun titrage antirabique n'est publié comme exigence d'entrée gambienne pour un chien de compagnie. (Un titrage peut toutefois rester pertinent pour un retour ultérieur vers l'UE, la région étant à rage endémique.)", es: "No se publica ninguna prueba de titulación de rabia como requisito de entrada gambiano para un perro de compañía. (Una prueba de titulación de rabia puede seguir siendo pertinente para un regreso posterior a la UE, ya que la región tiene rabia endémica.)", pt: "Nenhum teste sorológico antirrábico (titulação) é publicado como exigência de entrada gambiana para um cachorro de estimação. (Um teste sorológico antirrábico ainda pode ser relevante para uma volta futura à UE, pois a região tem raiva endêmica.)" }
    exceptions: { en: "Unknown for special cases or specific origins — confirm with the Department of Livestock Services, as conditions can differ by the dog's rabies history.", fr: "Non communiqué pour les cas particuliers ou certaines origines — à confirmer auprès du Department of Livestock Services, les conditions pouvant varier selon l'historique rabique du chien.", es: "Desconocido para casos especiales u orígenes concretos — confírmalo con el Department of Livestock Services, ya que las condiciones pueden variar según el historial antirrábico del perro.", pt: "Não comunicado para casos especiais ou origens específicas — confirme com o Department of Livestock Services, pois as condições podem variar conforme o histórico de raiva do cachorro." }
    ref: { en: "No rabies antibody test found in official Gambian entry requirements", fr: "Aucun titrage antirabique trouvé dans les exigences d'entrée officielles gambiennes", es: "No se ha encontrado ninguna prueba de titulación de rabia en los requisitos de entrada oficiales gambianos", pt: "Nenhum teste sorológico antirrábico encontrado nas exigências oficiais de entrada da Gâmbia" }
  - item: { en: "International veterinary health certificate", fr: "Certificat vétérinaire international", es: "Certificado sanitario veterinario internacional", pt: "Atestado de saúde veterinário internacional" }
    required: { en: "Required (original)", fr: "Requis (original)", es: "Obligatorio (original)", pt: "Obrigatório (original)" }
    when: { en: "Gambian customs require imports of animals to be accompanied by an official import certificate, and USDA APHIS requires the live-animal health certificate to be issued by an accredited veterinarian and endorsed by the exporting country's government authority (for the US, APHIS endorses within 72 hours of departure). Carry the original with your dog.", fr: "La douane gambienne exige que les importations d'animaux soient accompagnées d'un certificat d'importation officiel, et l'USDA APHIS exige que le certificat sanitaire pour animaux vivants soit établi par un vétérinaire accrédité et visé par l'autorité gouvernementale du pays d'export (pour les États-Unis, l'APHIS le vise dans les 72 heures précédant le départ). Emporte l'original avec ton chien.", es: "La aduana gambiana exige que las importaciones de animales vayan acompañadas de un certificado de importación oficial, y el USDA APHIS exige que el certificado sanitario para animales vivos sea expedido por un veterinario acreditado y refrendado por la autoridad gubernamental del país exportador (para EE. UU., el APHIS lo refrenda en las 72 horas previas a la salida). Lleva el original con tu perro.", pt: "A alfândega gambiana exige que as importações de animais sejam acompanhadas de um certificado de importação oficial, e a USDA APHIS exige que o atestado de saúde do animal vivo seja emitido por um veterinário credenciado e endossado pela autoridade governamental do país de exportação (para os EUA, a APHIS endossa em até 72 horas antes da partida). Leve o original com seu cachorro." }
    exceptions: { en: "The exact Gambian certificate model and its statements/validity for a pet dog are not published: Unknown. Use your country's official export certificate and have it government-endorsed.", fr: "Le modèle exact du certificat gambien et ses mentions/validité pour un chien de compagnie ne sont pas publiés : non communiqués. Utilise le certificat d'export officiel de ton pays et fais-le viser par le gouvernement.", es: "El modelo exacto del certificado gambiano y sus declaraciones/valide para un perro de compañía no están publicados: Desconocidos. Usa el certificado de exportación oficial de tu país y hazlo refrendar por el gobierno.", pt: "O modelo exato do certificado gambiano e suas declarações/validade para um cachorro de estimação não são publicados: não comunicado. Use o certificado oficial de exportação do seu país e faça-o ser endossado pelo governo." }
    ref: { en: "USDA APHIS — Export Live Animals to The Gambia; Trade.gov (US ITA) — Gambia Import Requirements (import certificate for animals)", fr: "USDA APHIS — Export d'animaux vivants vers la Gambie ; Trade.gov (US ITA) — Exigences d'importation Gambie (certificat d'importation pour animaux)", es: "USDA APHIS — Exportación de animales vivos a Gambia; Trade.gov (US ITA) — Requisitos de importación de Gambia (certificado de importación para animales)", pt: "USDA APHIS — Export Live Animals to The Gambia; Trade.gov (US ITA) — Gambia Import Requirements (certificado de importação para animais)" }
  - item: { en: "Parasite / tapeworm treatment", fr: "Traitement antiparasitaire / échinocoque", es: "Tratamiento antiparasitario / contra la tenia", pt: "Tratamento antiparasitário / contra tênias" }
    required: { en: "Not published", fr: "Non prévu", es: "No previsto", pt: "Não publicado" }
    when: { en: "The Gambia does not publish a mandatory internal or external parasite treatment for personal pet dogs on its official pages.", fr: "La Gambie ne publie pas de traitement antiparasitaire interne ou externe obligatoire pour les chiens de compagnie personnels sur ses pages officielles.", es: "Gambia no publica en sus páginas oficiales ningún tratamiento antiparasitario interno o externo obligatorio para los perros de compañía personales.", pt: "A Gâmbia não publica um tratamento antiparasitário interno ou externo obrigatório para cachorros de estimação pessoais em suas páginas oficiais." }
    exceptions: { en: "Unknown — a vet may recommend treatments; confirm any requirement with the Department of Livestock Services.", fr: "Non communiqué — un vétérinaire peut recommander des traitements ; confirme toute exigence auprès du Department of Livestock Services.", es: "Desconocido — un veterinario puede recomendar tratamientos; confirma cualquier requisito con el Department of Livestock Services.", pt: "Não comunicado — um veterinário pode recomendar tratamentos; confirme qualquer exigência com o Department of Livestock Services." }
    ref: { en: "No parasite-treatment rule published on official Gambian sources", fr: "Aucune règle de traitement antiparasitaire publiée sur les sources officielles gambiennes", es: "No hay ninguna norma de tratamiento antiparasitario publicada en las fuentes oficiales gambianas", pt: "Nenhuma regra de tratamento antiparasitário publicada em fontes oficiais gambianas" }
  - item: { en: "Advance notification / customs clearance", fr: "Notification préalable / dédouanement", es: "Notificación previa / despacho de aduanas", pt: "Notificação prévia / desembaraço aduaneiro" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Live animals from other countries are treated by the Gambia Revenue Authority as goods 'subject to strict control' and must clear customs with an import declaration and the required certificates, processed through the ASYCUDA system (generally via a licensed clearing agent). Present the import permit and veterinary certificate at clearance.", fr: "Les animaux vivants venant d'autres pays sont traités par la Gambia Revenue Authority comme des marchandises « soumises à un contrôle strict » et doivent être dédouanés avec une déclaration d'importation et les certificats exigés, via le système ASYCUDA (généralement par un agent en douane agréé). Présente le permis d'importation et le certificat vétérinaire au dédouanement.", es: "Los animales vivos procedentes de otros países son tratados por la Gambia Revenue Authority como mercancías «sujetas a control estricto» y deben pasar la aduana con una declaración de importación y los certificados exigidos, tramitados a través del sistema ASYCUDA (por lo general mediante un agente de aduanas autorizado). Presenta el permiso de importación y el certificado veterinario en el despacho.", pt: "Os animais vivos vindos de outros países são tratados pela Gambia Revenue Authority como mercadorias 'sujeitas a controle rigoroso' e devem passar pelo desembaraço aduaneiro com uma declaração de importação e os certificados exigidos, processados pelo sistema ASYCUDA (geralmente por meio de um despachante licenciado). Apresente a autorização de importação e o certificado veterinário no desembaraço." }
    exceptions: { en: "The precise procedure for a traveller's accompanied pet dog (as opposed to commercial cargo) is not detailed publicly: Unknown.", fr: "La procédure précise pour un chien de compagnie accompagné par un voyageur (par opposition au fret commercial) n'est pas détaillée publiquement : non communiquée.", es: "El procedimiento preciso para un perro de compañía acompañado por un viajero (a diferencia de la carga comercial) no se detalla públicamente: Desconocido.", pt: "O procedimento exato para um cachorro de estimação acompanhado por um viajante (em oposição à carga comercial) não é detalhado publicamente: não comunicado." }
    ref: { en: "Gambia Revenue Authority — Customs FAQs; Trade.gov (US ITA) — Prohibited and Restricted Imports (animals under strict control)", fr: "Gambia Revenue Authority — FAQ douane ; Trade.gov (US ITA) — Importations prohibées et restreintes (animaux sous contrôle strict)", es: "Gambia Revenue Authority — FAQ de aduanas; Trade.gov (US ITA) — Importaciones prohibidas y restringidas (animales bajo control estricto)", pt: "Gambia Revenue Authority — Customs FAQs; Trade.gov (US ITA) — Prohibited and Restricted Imports (animais sob controle rigoroso)" }
  - item: { en: "Airport / border veterinary inspection", fr: "Inspection vétérinaire à l'aéroport / à la frontière", es: "Inspección veterinaria en el aeropuerto / la frontera", pt: "Inspeção veterinária no aeroporto / na fronteira" }
    required: { en: "Likely (not detailed)", fr: "Probable (non détaillée)", es: "Probable (no detallada)", pt: "Provável (não detalhado)" }
    when: { en: "As the veterinary competent authority, the Department of Livestock Services oversees animal imports and customs classifies incoming animals under strict control, so an inspection of the dog and its documents at the point of entry is to be expected. The exact inspection process is not officially published: Unknown.", fr: "En tant qu'autorité vétérinaire compétente, le Department of Livestock Services supervise les importations d'animaux et la douane classe les animaux entrants sous contrôle strict ; une inspection du chien et de ses documents au point d'entrée est donc à prévoir. Le processus exact d'inspection n'est pas publié officiellement : non communiqué.", es: "Como autoridad veterinaria competente, el Department of Livestock Services supervisa las importaciones de animales y la aduana clasifica a los animales entrantes bajo control estricto, por lo que cabe esperar una inspección del perro y sus documentos en el punto de entrada. El proceso exacto de inspección no está publicado oficialmente: Desconocido.", pt: "Como autoridade veterinária competente, o Department of Livestock Services supervisiona as importações de animais, e a alfândega classifica os animais que chegam sob controle rigoroso, portanto é esperada uma inspeção do cachorro e de seus documentos no ponto de entrada. O processo exato de inspeção não é publicado oficialmente: não comunicado." }
    exceptions: { en: "Consequences of missing or invalid documents (refusal, detention) are not detailed publicly for pets: Unknown — keep originals ready.", fr: "Les conséquences de documents manquants ou invalides (refus, rétention) ne sont pas détaillées publiquement pour les animaux de compagnie : non communiquées — garde les originaux prêts.", es: "Las consecuencias de documentos que falten o no sean válidos (rechazo, retención) no se detallan públicamente para las mascotas: Desconocidas — ten listos los originales.", pt: "As consequências de documentos ausentes ou inválidos (recusa, retenção) não são detalhadas publicamente para animais de estimação: não comunicado — mantenha os originais prontos." }
    ref: { en: "Department of Livestock Services (competent authority); Gambia Revenue Authority — Customs", fr: "Department of Livestock Services (autorité compétente) ; Gambia Revenue Authority — Douane", es: "Department of Livestock Services (autoridad competente); Gambia Revenue Authority — Aduanas", pt: "Department of Livestock Services (autoridade competente); Gambia Revenue Authority — Alfândega" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not published", fr: "Non communiquée", es: "No publicada", pt: "Não publicado" }
    when: { en: "The Gambia does not publish a routine quarantine requirement for pet dogs on its official pages.", fr: "La Gambie ne publie pas d'exigence de quarantaine systématique pour les chiens de compagnie sur ses pages officielles.", es: "Gambia no publica en sus páginas oficiales ningún requisito de cuarentena rutinaria para los perros de compañía.", pt: "A Gâmbia não publica uma exigência de quarentena rotineira para cachorros de estimação em suas páginas oficiais." }
    exceptions: { en: "Whether quarantine can be imposed on non-compliant or suspect animals is not published: Unknown. Confirm with the Department of Livestock Services.", fr: "La possibilité d'imposer une quarantaine aux animaux non conformes ou suspects n'est pas publiée : non communiquée. À confirmer auprès du Department of Livestock Services.", es: "Si puede imponerse una cuarentena a los animales no conformes o sospechosos no está publicado: Desconocido. Confírmalo con el Department of Livestock Services.", pt: "Se a quarentena pode ser imposta a animais em não conformidade ou suspeitos não é publicado: não comunicado. Confirme com o Department of Livestock Services." }
    ref: { en: "No quarantine rule published on official Gambian sources", fr: "Aucune règle de quarantaine publiée sur les sources officielles gambiennes", es: "No hay ninguna norma de cuarentena publicada en las fuentes oficiales gambianas", pt: "Nenhuma regra de quarentena publicada em fontes oficiais gambianas" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Unknown", fr: "Non communiqué", es: "Desconocida", pt: "Não comunicado" }
    when: { en: "The Gambia does not publish an explicit minimum travelling age for pet dogs. In practice a dog needs to be old enough to be validly vaccinated against rabies (generally about 12 weeks) with the vaccination in effect before travel.", fr: "La Gambie ne publie pas d'âge minimum de voyage explicite pour les chiens de compagnie. En pratique, un chien doit être en âge d'être valablement vacciné contre la rage (généralement environ 12 semaines), la vaccination devant produire ses effets avant le voyage.", es: "Gambia no publica una edad mínima de viaje explícita para los perros de compañía. En la práctica, un perro debe tener edad suficiente para estar válidamente vacunado contra la rabia (por lo general unas 12 semanas), con la vacunación en vigor antes del viaje.", pt: "A Gâmbia não publica uma idade mínima explícita de viagem para cachorros de estimação. Na prática, o cachorro precisa ter idade suficiente para ser validamente vacinado contra a raiva (geralmente cerca de 12 semanas), com a vacinação já em vigor antes da viagem." }
    exceptions: { en: "The exact minimum age is not officially published: Unknown — confirm with your vet and the Department of Livestock Services.", fr: "L'âge minimum exact n'est pas publié officiellement : non communiqué — à confirmer avec ton vétérinaire et le Department of Livestock Services.", es: "La edad mínima exacta no está publicada oficialmente: Desconocida — confírmalo con tu veterinario y el Department of Livestock Services.", pt: "A idade mínima exata não é publicada oficialmente: não comunicado — confirme com seu veterinário e com o Department of Livestock Services." }
    ref: { en: "No explicit minimum age in official Gambian sources", fr: "Aucun âge minimum explicite dans les sources officielles gambiennes", es: "No hay una edad mínima explícita en las fuentes oficiales gambianas", pt: "Nenhuma idade mínima explícita em fontes oficiais gambianas" }
  - item: { en: "Banned / restricted breeds", fr: "Races interdites / restreintes", es: "Razas prohibidas / restringidas", pt: "Raças proibidas / restritas" }
    required: { en: "No published breed ban", fr: "Aucune interdiction par race publiée", es: "No hay ninguna prohibición por raza publicada", pt: "Nenhuma proibição de raça publicada" }
    when: { en: "The Gambia's official prohibited and restricted import lists (Customs and Excise Act 2010) contain no dog breed. Entry is controlled by the import permit and health requirements, not by a national list of prohibited breeds.", fr: "Les listes officielles d'importations prohibées et restreintes de la Gambie (Customs and Excise Act 2010) ne mentionnent aucune race de chien. L'entrée est encadrée par le permis d'importation et les exigences sanitaires, non par une liste nationale de races interdites.", es: "Las listas oficiales de importaciones prohibidas y restringidas de Gambia (Customs and Excise Act 2010) no contienen ninguna raza de perro. La entrada se rige por el permiso de importación y los requisitos sanitarios, no por una lista nacional de razas prohibidas.", pt: "As listas oficiais gambianas de importações proibidas e restritas (Customs and Excise Act 2010) não contêm nenhuma raça de cachorro. A entrada é controlada pela autorização de importação e pelas exigências sanitárias, não por uma lista nacional de raças proibidas." }
    exceptions: { en: "This is an absence of published rule, not a guarantee — confirm your dog's breed and any cross with the Department of Livestock Services before travel.", fr: "Il s'agit d'une absence de règle publiée, non d'une garantie — confirme la race de ton chien et tout croisement auprès du Department of Livestock Services avant de voyager.", es: "Se trata de una ausencia de norma publicada, no de una garantía — confirma la raza de tu perro y cualquier cruce con el Department of Livestock Services antes de viajar.", pt: "Isso é a ausência de uma regra publicada, não uma garantia — confirme a raça do seu cachorro e qualquer cruzamento com o Department of Livestock Services antes de viajar." }
    ref: { en: "Trade.gov (US ITA) — Gambia Prohibited and Restricted Imports (no dog breed listed)", fr: "Trade.gov (US ITA) — Importations prohibées et restreintes Gambie (aucune race de chien listée)", es: "Trade.gov (US ITA) — Importaciones prohibidas y restringidas de Gambia (ninguna raza de perro listada)", pt: "Trade.gov (US ITA) — Gambia Prohibited and Restricted Imports (nenhuma raça de cachorro listada)" }

origin:
  scheme: eu
  eu:
    title: { en: "From the European Union", fr: "Depuis l'Union européenne", es: "Desde la Unión Europea", pt: "Da União Europeia" }
    body:
      en: "There is no EU pet-passport shortcut into The Gambia: the EU passport is not a Gambian document. A dog from the EU still needs an import permit from the Department of Livestock Services, an original international veterinary certificate issued and endorsed by the official EU vet close to departure, and a valid rabies vaccination recorded in the passport / vaccination booklet. An ISO microchip is best practice for identification. Several finer details are not published by The Gambia, so confirm the current procedure with the veterinary authority before you travel."
      fr: "Aucun raccourci « passeport européen » pour entrer en Gambie : le passeport UE n'est pas un document gambien. Un chien venant de l'UE a tout de même besoin d'un permis d'importation du Department of Livestock Services, d'un certificat vétérinaire international original établi et visé par le vétérinaire officiel de l'UE peu avant le départ, et d'une vaccination antirabique valide consignée dans le passeport / carnet de vaccination. Une puce ISO est la bonne pratique pour l'identification. Plusieurs détails ne sont pas publiés par la Gambie ; confirme la procédure à jour auprès de l'autorité vétérinaire avant de voyager."
      es: "No hay atajo del pasaporte europeo para entrar en Gambia: el pasaporte de la UE no es un documento gambiano. Un perro procedente de la UE necesita igualmente un permiso de importación del Department of Livestock Services, un certificado veterinario internacional original expedido y refrendado por el veterinario oficial de la UE poco antes de la salida, y una vacunación antirrábica válida registrada en el pasaporte / la cartilla de vacunación. Un microchip ISO es la buena práctica para la identificación. Gambia no publica varios detalles más concretos, así que confirma el procedimiento actual con la autoridad veterinaria antes de viajar."
      pt: "Não existe atalho de passaporte europeu para entrar na Gâmbia: o passaporte da UE não é um documento gambiano. Um cachorro vindo da UE também precisa de uma autorização de importação do Department of Livestock Services, de um certificado veterinário internacional original emitido e endossado pelo veterinário oficial da UE perto da partida, e de uma vacinação antirrábica válida registrada no passaporte / carteira de vacinação. Um microchip ISO é a melhor prática para identificação. Vários detalhes mais específicos não são publicados pela Gâmbia, portanto confirme o procedimento atual com a autoridade veterinária antes de viajar."
    cls: warn
  listed:
    title: { en: "From another third country", fr: "Depuis un autre pays tiers", es: "Desde otro país tercero", pt: "De outro país terceiro" }
    body:
      en: "From a non-EU country, the core requirements are the same: an import permit from the Department of Livestock Services, a valid rabies vaccination, and an original international veterinary certificate issued by an authorised vet and endorsed by the government of the country of origin. For travellers from the United States, USDA APHIS confirms the health certificate must be issued by a USDA-accredited veterinarian and endorsed by APHIS within 72 hours of departure. Use your country's official export certificate model."
      fr: "Depuis un pays hors UE, les exigences de base sont identiques : un permis d'importation du Department of Livestock Services, une vaccination antirabique valide et l'original d'un certificat vétérinaire international établi par un vétérinaire mandaté et visé par le gouvernement du pays d'origine. Pour les voyageurs des États-Unis, l'USDA APHIS confirme que le certificat sanitaire doit être établi par un vétérinaire accrédité par l'USDA et visé par l'APHIS dans les 72 heures précédant le départ. Utilise le modèle de certificat d'export officiel de ton pays."
      es: "Desde un país no perteneciente a la UE, los requisitos básicos son los mismos: un permiso de importación del Department of Livestock Services, una vacunación antirrábica válida y el original de un certificado veterinario internacional expedido por un veterinario autorizado y refrendado por el gobierno del país de origen. Para los viajeros procedentes de Estados Unidos, el USDA APHIS confirma que el certificado sanitario debe ser expedido por un veterinario acreditado por el USDA y refrendado por el APHIS en las 72 horas previas a la salida. Usa el modelo de certificado de exportación oficial de tu país."
      pt: "Vindo de um país fora da UE, as exigências principais são as mesmas: uma autorização de importação do Department of Livestock Services, uma vacinação antirrábica válida e um certificado veterinário internacional original emitido por um veterinário autorizado e endossado pelo governo do país de origem. Para viajantes vindos dos Estados Unidos, a USDA APHIS confirma que o atestado de saúde deve ser emitido por um veterinário credenciado pela USDA e endossado pela APHIS em até 72 horas antes da partida. Use o modelo oficial de certificado de exportação do seu país."
    cls: warn
  nonListed:
    title: { en: "Rabies history & special cases", fr: "Historique rabique et cas particuliers", es: "Historial antirrábico y casos especiales", pt: "Histórico de raiva e casos particulares" }
    body:
      en: "The Gambia does not publish a separate at-risk-country track or a rabies antibody test for personal pets entering the country, but the Department of Livestock Services can attach conditions to your import permit based on the dog's origin and rabies history. Because the region is rabies-endemic, a current rabies vaccination is essential, and if your dog has stayed in a higher-risk country you should confirm directly what evidence will be required before you travel. Plan the rabies antibody test now if you intend to bring the dog into the EU later."
      fr: "La Gambie ne publie pas de parcours distinct pour les pays à risque ni de titrage antirabique pour les animaux personnels entrant dans le pays, mais le Department of Livestock Services peut assortir ton permis d'importation de conditions selon l'origine et l'historique rabique du chien. La région étant à rage endémique, une vaccination antirabique à jour est essentielle, et si ton chien a séjourné dans un pays à risque plus élevé, confirme directement les preuves exigées avant de voyager. Prévois dès maintenant le titrage antirabique si tu compte amener le chien dans l'UE plus tard."
      es: "Gambia no publica un itinerario aparte para los países de riesgo ni una prueba de titulación de rabia para las mascotas personales que entran en el país, pero el Department of Livestock Services puede incorporar condiciones a tu permiso de importación según el origen y el historial antirrábico del perro. Como la región tiene rabia endémica, una vacunación antirrábica al día es esencial, y si tu perro ha estado en un país de mayor riesgo debes confirmar directamente qué pruebas se exigirán antes de viajar. Planifica ya la prueba de titulación de rabia si tienes previsto llevar al perro a la UE más adelante."
      pt: "A Gâmbia não publica uma via separada para países de risco nem um teste sorológico antirrábico para animais de estimação pessoais que entram no país, mas o Department of Livestock Services pode acrescentar condições à sua autorização de importação com base na origem e no histórico de raiva do cachorro. Como a região tem raiva endêmica, uma vacinação antirrábica em dia é essencial, e se seu cachorro esteve em um país de maior risco, você deve confirmar diretamente quais comprovações serão exigidas antes de viajar. Planeje já o teste sorológico antirrábico (titulação) se pretende levar o cachorro à UE mais tarde."
    cls: neutral

arrival:
  intro:
    en: "What happens when your dog reaches The Gambia depends on your import permit and your documents; the exact process is not fully published, so keep every original ready."
    fr: "Ce qui se passe à l'arrivée de ton chien en Gambie dépend de ton permis d'importation et de tes documents ; le processus exact n'est pas entièrement publié, alors garde chaque original prêt."
    es: "Lo que ocurre cuando tu perro llega a Gambia depende de tu permiso de importación y de tus documentos; el proceso exacto no está publicado por completo, así que ten listo cada original."
    pt: "O que acontece quando seu cachorro chega à Gâmbia depende da sua autorização de importação e dos seus documentos; o processo exato não é totalmente publicado, portanto mantenha todos os originais prontos."
  points:
    - en: "At the point of entry (Banjul International Airport for most air arrivals), your dog and its documents are subject to control by the veterinary and customs authorities."
      fr: "Au point d'entrée (l'aéroport international de Banjul pour la plupart des arrivées aériennes), ton chien et ses documents sont soumis au contrôle des autorités vétérinaires et douanières."
      es: "En el punto de entrada (el Aeropuerto Internacional de Banjul para la mayoría de las llegadas aéreas), tu perro y sus documentos están sujetos al control de las autoridades veterinarias y aduaneras."
      pt: "No ponto de entrada (Aeroporto Internacional de Banjul, para a maioria das chegadas por via aérea), seu cachorro e seus documentos ficam sujeitos ao controle das autoridades veterinárias e alfandegárias."
    - en: "Present the originals: the Department of Livestock Services import permit, the international veterinary certificate, the vaccination booklet and proof of rabies vaccination."
      fr: "Présente les originaux : le permis d'importation du Department of Livestock Services, le certificat vétérinaire international, le carnet de vaccination et la preuve de vaccination antirabique."
      es: "Presenta los originales: el permiso de importación del Department of Livestock Services, el certificado veterinario internacional, la cartilla de vacunación y la prueba de vacunación antirrábica."
      pt: "Apresente os originais: a autorização de importação do Department of Livestock Services, o certificado veterinário internacional, a carteira de vacinação e a comprovação da vacinação antirrábica."
    - en: "Customs treat live animals from abroad as goods 'subject to strict control'; clearance is handled through the ASYCUDA system, generally with a licensed clearing agent."
      fr: "La douane traite les animaux vivants venant de l'étranger comme des marchandises « soumises à un contrôle strict » ; le dédouanement passe par le système ASYCUDA, généralement avec un agent en douane agréé."
      es: "La aduana trata a los animales vivos procedentes del extranjero como mercancías «sujetas a control estricto»; el despacho se tramita a través del sistema ASYCUDA, por lo general con un agente de aduanas autorizado."
      pt: "A alfândega trata os animais vivos vindos do exterior como mercadorias 'sujeitas a controle rigoroso'; o desembaraço é feito pelo sistema ASYCUDA, geralmente com um despachante licenciado."
    - en: "The exact consequences of missing or invalid documents for a pet dog are not published: Unknown. Assume that incomplete paperwork can lead to delay, detention or refusal, at the owner's expense."
      fr: "Les conséquences exactes de documents manquants ou invalides pour un chien de compagnie ne sont pas publiées : non communiquées. Partez du principe que des documents incomplets peuvent entraîner un retard, une rétention ou un refus, aux frais du propriétaire."
      es: "Las consecuencias exactas de documentos que falten o no sean válidos para un perro de compañía no están publicadas: Desconocidas. Da por hecho que una documentación incompleta puede provocar retraso, retención o rechazo, a cargo del propietario."
      pt: "As consequências exatas de documentos ausentes ou inválidos para um cachorro de estimação não são publicadas: não comunicado. Considere que a documentação incompleta pode causar atraso, retenção ou recusa, por conta do dono."
    - en: "Keep a full set of original documents with you throughout the journey."
      fr: "Garde un jeu complet de documents originaux sur toi durant tout le trajet."
      es: "Guarda contigo un juego completo de documentos originales durante todo el trayecto."
      pt: "Mantenha com você um conjunto completo de documentos originais durante toda a viagem."

travellerExperience: null

restrictedDogs:
  intro:
    en: "No breed-specific import ban for dogs is published on The Gambia's official customs or government pages. The prohibited and restricted import lists under the Customs and Excise Act 2010 do not name any dog breed; entry is controlled by the import permit and health requirements, not by a national list of prohibited breeds."
    fr: "Aucune interdiction d'importation par race pour les chiens n'est publiée sur les pages officielles douanières ou gouvernementales de la Gambie. Les listes d'importations prohibées et restreintes du Customs and Excise Act 2010 ne nomment aucune race de chien ; l'entrée est encadrée par le permis d'importation et les exigences sanitaires, non par une liste nationale de races interdites."
    es: "No se publica ninguna prohibición de importación por raza para los perros en las páginas oficiales aduaneras o gubernamentales de Gambia. Las listas de importaciones prohibidas y restringidas del Customs and Excise Act 2010 no nombran ninguna raza de perro; la entrada se rige por el permiso de importación y los requisitos sanitarios, no por una lista nacional de razas prohibidas."
    pt: "Nenhuma proibição de importação por raça de cachorro é publicada nas páginas oficiais de alfândega ou governo da Gâmbia. As listas de importações proibidas e restritas do Customs and Excise Act 2010 não citam nenhuma raça de cachorro; a entrada é controlada pela autorização de importação e pelas exigências sanitárias, não por uma lista nacional de raças proibidas."
  cat1:
    en: "We found no official Gambian instrument banning breeds such as pit bull types from import. This is an absence of published rule rather than a positive authorisation of any specific breed."
    fr: "Nous n'avons trouvé aucun texte officiel gambien interdisant à l'importation des races comme les types pit-bull. Il s'agit d'une absence de règle publiée, et non d'une autorisation expresse d'une race précise."
    es: "No hemos encontrado ningún texto oficial gambiano que prohíba la importación de razas como los tipos pit bull. Se trata de una ausencia de norma publicada, más que de una autorización expresa de una raza concreta."
    pt: "Não encontramos nenhum instrumento oficial gambiano que proíba a importação de raças como os tipos pit bull. Isso é a ausência de uma regra publicada, e não uma autorização positiva de nenhuma raça específica."
  cat2:
    en: "There is likewise no published lighter 'permitted with conditions' breed category at the border. Note that most live animals from other African countries are separately placed under strict control by customs, but that is a regional-origin control, not a breed rule."
    fr: "Il n'existe de même aucune catégorie allégée « autorisée sous conditions » publiée à la frontière. Note que la plupart des animaux vivants venant d'autres pays africains sont, séparément, placés sous contrôle strict par la douane, mais il s'agit d'un contrôle lié à l'origine régionale, non d'une règle par race."
    es: "Tampoco existe ninguna categoría más laxa de «autorizada con condiciones» publicada en la frontera. Ten en cuenta que la mayoría de los animales vivos procedentes de otros países africanos son, por separado, puestos bajo control estricto por la aduana, pero se trata de un control ligado al origen regional, no de una norma por raza."
    pt: "Também não há uma categoria mais branda de raça 'permitida com condições' publicada na fronteira. Observe que a maioria dos animais vivos vindos de outros países africanos é colocada separadamente sob controle rigoroso pela alfândega, mas isso é um controle por origem regional, não uma regra por raça."
  note:
    en: "Because rules can change and are not fully published online, confirm your dog's breed and any cross with the Department of Livestock Services before you travel."
    fr: "Les règles pouvant évoluer et n'étant pas entièrement publiées en ligne, confirme la race de ton chien et tout croisement auprès du Department of Livestock Services avant de voyager."
    es: "Como las normas pueden cambiar y no están publicadas por completo en línea, confirma la raza de tu perro y cualquier cruce con el Department of Livestock Services antes de viajar."
    pt: "Como as regras podem mudar e não são totalmente publicadas on-line, confirme a raça do seu cachorro e qualquer cruzamento com o Department of Livestock Services antes de viajar."

checklist:
  - en: "Contact the Department of Livestock Services early to obtain the required import permit (confirm form, fees and timing)"
    fr: "Contacte tôt le Department of Livestock Services pour obtenir le permis d'importation exigé (confirme formulaire, frais et calendrier)"
    es: "Contacta pronto con el Department of Livestock Services para obtener el permiso de importación exigido (confirma formulario, tasas y calendario)"
    pt: "Entre em contato com o Department of Livestock Services com antecedência para obter a autorização de importação exigida (confirme formulário, taxas e prazos)"
  - en: "Permanent identification (ISO microchip recommended) implanted before the rabies vaccination"
    fr: "Identification permanente (puce ISO recommandée) posée avant la vaccination antirabique"
    es: "Identificación permanente (microchip ISO recomendado) implantada antes de la vacunación antirrábica"
    pt: "Identificação permanente (microchip ISO recomendado) implantado antes da vacinação antirrábica"
  - en: "Valid rabies vaccination recorded in the vaccination booklet (confirm the required timing with your vet)"
    fr: "Vaccination antirabique valide consignée dans le carnet de vaccination (confirme le délai exigé avec ton vétérinaire)"
    es: "Vacunación antirrábica válida registrada en la cartilla de vacunación (confirma el plazo exigido con tu veterinario)"
    pt: "Vacinação antirrábica válida registrada na carteira de vacinação (confirme o prazo exigido com seu veterinário)"
  - en: "Original international veterinary certificate, issued and government-endorsed close to departure (APHIS-endorsed for US departures)"
    fr: "Original du certificat vétérinaire international, établi et visé par le gouvernement peu avant le départ (visé par l'APHIS pour un départ des États-Unis)"
    es: "Certificado veterinario internacional original, expedido y refrendado por el gobierno poco antes de la salida (refrendado por el APHIS para las salidas desde EE. UU.)"
    pt: "Certificado veterinário internacional original, emitido e endossado pelo governo perto da partida (endossado pela APHIS para partidas dos EUA)"
  - en: "Up-to-date vaccination booklet carried with you"
    fr: "Carnet de vaccination à jour emporté avec toi"
    es: "Cartilla de vacunación al día que lleves contigo"
    pt: "Carteira de vacinação atualizada levada com você"
  - en: "Plan customs clearance (ASYCUDA), generally through a licensed clearing agent, and present originals to the veterinary authority"
    fr: "Prévois le dédouanement (ASYCUDA), généralement via un agent en douane agréé, et présente les originaux à l'autorité vétérinaire"
    es: "Planifica el despacho de aduanas (ASYCUDA), por lo general mediante un agente de aduanas autorizado, y presenta los originales a la autoridad veterinaria"
    pt: "Planeje o desembaraço aduaneiro (ASYCUDA), geralmente por meio de um despachante licenciado, e apresente os originais à autoridade veterinária"
  - en: "If you will return to the EU, plan the rabies antibody test (the region is rabies-endemic)"
    fr: "Si tu rentre dans l'UE, prévois le titrage antirabique (la région est à rage endémique)"
    es: "Si vas a regresar a la UE, planifica la prueba de titulación de rabia (la región tiene rabia endémica)"
    pt: "Se você for voltar à UE, planeje o teste sorológico antirrábico (titulação) (a região tem raiva endêmica)"
  - en: "Airline reservation confirming your dog's travel option and a suitable travel crate"
    fr: "Réservation confirmant l'option de transport de ton chien et caisse de transport adaptée"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y una jaula de transporte adecuada"
    pt: "Reserva na companhia aérea confirmando a opção de viagem do cachorro e uma caixa de transporte adequada às normas IATA"

