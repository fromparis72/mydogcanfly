notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog, and the Department of Livestock Services sets the exact conditions on your import permit. The Gambia publishes little detail online, so several points here are marked Unknown and must be confirmed directly."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien, et le Department of Livestock Services fixe les conditions exactes sur ton permis d'importation. La Gambie publie peu de détails en ligne ; plusieurs points ici sont donc indiqués comme non communiqués et doivent être confirmés directement."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro, y el Department of Livestock Services fija las condiciones exactas en tu permiso de importación. Gambia publica pocos detalles en línea, por lo que varios puntos aquí están marcados como Desconocidos y deben confirmarse directamente."
    pt: "Só um médico-veterinário pode confirmar o procedimento exato para o seu cachorro, e o Department of Livestock Services define as condições exatas da sua autorização de importação. A Gâmbia publica poucos detalhes on-line, portanto vários pontos aqui estão marcados como não comunicado e precisam ser confirmados diretamente."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — The Gambia (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — la Gambie (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Gambia (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — a Gâmbia (seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — The Gambia", fr: "Pays de destination — Gambie", es: "País de destino — Gambia", pt: "País de destino — Gâmbia" }
      text:
        en: "The Gambia runs its own scheme through the Department of Livestock Services. An import permit from that authority is required, live animals from abroad are treated by customs as goods under strict control, and in practice an original international veterinary certificate and a valid rabies vaccination are expected. Many finer details are simply not published, so the destination framework must be confirmed with the veterinary authority itself."
        fr: "La Gambie applique son propre dispositif via le Department of Livestock Services. Un permis d'importation de cette autorité est exigé, les animaux vivants venant de l'étranger sont traités par la douane comme des marchandises sous contrôle strict, et en pratique un certificat vétérinaire international original et une vaccination antirabique valide sont attendus. De nombreux détails ne sont pas publiés ; le cadre du pays de destination doit donc être confirmé auprès de l'autorité vétérinaire elle-même."
        es: "Gambia aplica su propio dispositivo a través del Department of Livestock Services. Se exige un permiso de importación de esa autoridad, la aduana trata a los animales vivos procedentes del extranjero como mercancías bajo control estricto y, en la práctica, se esperan un certificado veterinario internacional original y una vacunación antirrábica válida. Muchos detalles más concretos simplemente no están publicados, por lo que el marco del país de destino debe confirmarse con la propia autoridad veterinaria."
        pt: "A Gâmbia opera seu próprio esquema por meio do Department of Livestock Services. É exigida uma autorização de importação dessa autoridade, os animais vivos vindos do exterior são tratados pela alfândega como mercadorias sob controle rigoroso, e na prática espera-se um certificado veterinário internacional original e uma vacinação antirrábica válida. Muitos detalhes mais específicos simplesmente não são publicados, portanto o quadro de destino deve ser confirmado com a própria autoridade veterinária."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The international veterinary certificate is issued by a government-authorised vet in the country of departure, using that country's official model and endorsement. For US departures, USDA APHIS confirms the certificate must be issued by an accredited veterinarian and endorsed by APHIS before the dog leaves. The country of departure therefore decides who signs and endorses your paperwork."
        fr: "Le certificat vétérinaire international est établi par un vétérinaire mandaté du pays de départ, selon le modèle et le visa officiels de ce pays. Pour un départ des États-Unis, l'USDA APHIS confirme que le certificat doit être établi par un vétérinaire accrédité et visé par l'APHIS avant le départ du chien. Le pays de départ détermine donc qui signe et vise tes documents."
        es: "El certificado veterinario internacional lo expide un veterinario autorizado por el gobierno del país de salida, usando el modelo y el refrendo oficiales de ese país. Para las salidas desde EE. UU., el USDA APHIS confirma que el certificado debe ser expedido por un veterinario acreditado y refrendado por el APHIS antes de que el perro salga. El país de salida decide, por tanto, quién firma y refrenda tus documentos."
        pt: "O certificado veterinário internacional é emitido por um veterinário autorizado pelo governo no país de partida, usando o modelo e o endosso oficiais desse país. Para partidas dos Estados Unidos, a USDA APHIS confirma que o certificado deve ser emitido por um veterinário credenciado e endossado pela APHIS antes de o cachorro partir. O país de partida, portanto, determina quem assina e endossa seus documentos."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "Your dog's rabies history and recent country of residence matter, not only the last airport. West Africa, including The Gambia, is a rabies-endemic region, so a current rabies vaccination is essential and a stay in a higher-risk country can affect what the authority asks for. Confirm your dog's full history with your vet and the Department of Livestock Services."
        fr: "L'historique antirabique et le pays de résidence récent de ton chien comptent, pas seulement le dernier aéroport. L'Afrique de l'Ouest, dont la Gambie, est une région d'endémie rabique : une vaccination antirabique à jour est essentielle et un séjour dans un pays à risque plus élevé peut influer sur ce qui est demandé. Confirme l'historique complet de ton chien auprès de ton vétérinaire et du Department of Livestock Services."
        es: "El historial antirrábico y el país de residencia reciente de tu perro importan, no solo el último aeropuerto. África Occidental, incluida Gambia, es una región con rabia endémica, por lo que una vacunación antirrábica al día es esencial y una estancia en un país de mayor riesgo puede influir en lo que pida la autoridad. Confirma el historial completo de tu perro con tu veterinario y el Department of Livestock Services."
        pt: "O histórico de raiva do seu cachorro e o país de residência recente importam, não apenas o último aeroporto. A África Ocidental, incluindo a Gâmbia, é uma região com raiva endêmica, portanto uma vacinação antirrábica em dia é essencial, e uma estadia em um país de maior risco pode afetar o que a autoridade exige. Confirme o histórico completo do seu cachorro com seu veterinário e com o Department of Livestock Services."
  note:
    en: "So read the requirements below as The Gambia's confirmed framework plus clearly marked unknowns, then confirm your dog's exact origin, history and the current procedure with your vet and the Department of Livestock Services before booking."
    fr: "Lis donc les exigences ci-dessous comme le cadre confirmé de la Gambie assorti d'inconnues clairement signalées, puis confirme l'origine, l'historique exacts de ton chien et la procédure à jour auprès de ton vétérinaire et du Department of Livestock Services avant de réserver."
    es: "Así que lee los requisitos siguientes como el marco confirmado de Gambia más las incógnitas claramente señaladas, y luego confirma el origen y el historial exactos de tu perro y el procedimiento actual con tu veterinario y el Department of Livestock Services antes de reservar."
    pt: "Portanto, leia as exigências abaixo como o quadro confirmado da Gâmbia, com os pontos desconhecidos claramente marcados, e depois confirme a origem exata, o histórico do seu cachorro e o procedimento atual com seu veterinário e com o Department of Livestock Services antes de reservar."

