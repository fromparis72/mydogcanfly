# Country Entry Guide — Algeria (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_dz
iso2: "DZ"
name: { en: "Algeria", fr: "Algérie", es: "Argelia", pt: "Argélia" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
domestic:
  intro:
    en: "Domestic flight in Algeria: no travel document is required by law, but rabies vaccination is compulsory for every dog."
    fr: "Vol intérieur en Algérie : aucun document de voyage n'est exigé par la loi, mais la vaccination antirabique est obligatoire pour tout chien."
    es: "Vuelo nacional en Argelia: la ley no exige ningún documento de viaje, pero la vacuna antirrábica es obligatoria para todo perro."
    pt: "Voo doméstico na Argélia: nenhum documento de viagem é exigido por lei, mas a vacinação antirrábica é obrigatória para todo cachorro."
  points:
    - en: "Rabies vaccination of dogs and cats is compulsory, and the certificate is registered with the communal hygiene office. This is a general obligation, never tied to travel."
      fr: "La vaccination antirabique des chiens et chats est obligatoire, et le certificat s'enregistre au bureau d'hygiène communal. C'est une obligation générale, jamais liée au voyage."
      es: "La vacuna antirrábica de perros y gatos es obligatoria, y el certificado se registra en la oficina de higiene comunal. Es una obligación general, nunca ligada al viaje."
      pt: "A vacinação antirrábica de cachorros e gatos é obrigatória, e o certificado é registrado junto ao serviço municipal de higiene. Trata-se de uma obrigação geral, nunca vinculada à viagem."
    - en: "No microchip is required by Algerian law; a dog in a public place must wear a collar with the owner's name and address."
      fr: "Aucune puce n'est exigée par le droit algérien ; un chien sur la voie publique doit porter un collier avec le nom et l'adresse de son maître."
      es: "La ley argelina no exige microchip; un perro en la vía pública debe llevar collar con el nombre y la dirección de su dueño."
      pt: "Nenhum microchip é exigido pela legislação argelina; um cachorro em local público deve usar coleira com o nome e o endereço do proprietário."
    - en: "Where a wilaya declares a rabies-infected zone, leash and muzzle rules apply and movement can be restricted."
      fr: "Là où une wilaya déclare une zone infectée par la rage, les règles de laisse et de muselière s'appliquent et les mouvements peuvent être restreints."
      es: "Donde una wilaya declara zona infectada de rabia, se aplican reglas de correa y bozal y el movimiento puede restringirse."
      pt: "Quando uma wilaya declara uma zona infectada por raiva, aplicam-se regras de coleira e focinheira, e a circulação pode ser restringida."
exit:
  authority: DSV
  authorityUrl: https://psl.madr.gov.dz/dsv/
  intro:
    en: "Algeria is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus a sanitary export clearance from the veterinary services (DSV)."
    fr: "L'Algérie est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus une dérogation sanitaire d'export des services vétérinaires (DSV)."
    es: "Argelia no está listada: una titulación antirrábica válida es obligatoria para volver a la UE — más una autorización sanitaria de exportación de los servicios veterinarios (DSV)."
    pt: "A Argélia é um país não listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de uma liberação sanitária de exportação dos serviços veterinários (DSV)."
  steps:
    - timing: longlead
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Providenciar com antecedência o teste sorológico antirrábico (titulação): exame de sangue em laboratório aprovado pela UE, pelo menos 30 dias após a vacinação — um resultado válido é indispensável para voltar à UE e não pode ser resolvido de última hora."
    - timing: window
      text:
        en: "Obtain the sanitary export clearance and the official veterinary visa via the DSV platform; the health certificate is issued by a vet and endorsed by the official veterinary services."
        fr: "Obtiens la dérogation sanitaire d'export et le visa vétérinaire officiel via la plateforme DSV ; le certificat sanitaire est établi par un vétérinaire et visé par les services vétérinaires officiels."
        es: "Obtén la autorización sanitaria de exportación y el visado veterinario oficial a través de la plataforma DSV; el certificado sanitario lo emite un veterinario y lo refrenda el servicio veterinario oficial."
        pt: "Obter a liberação sanitária de exportação e o visto veterinário oficial pela plataforma da DSV; o atestado de saúde é emitido por um veterinário e endossado pelos serviços veterinários oficiais."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o cachorro já tinha um teste sorológico antirrábico (titulação) válido para a UE antes da partida, ele permanece válido por toda a vida enquanto a vacinação antirrábica estiver em dia — vale a pena verificar isso antes de viajar."

hero:
  h1: { en: "Traveling to Algeria with your dog", fr: "Voyager en Algérie avec ton chien", es: "Viajar a Argelia con tu perro", pt: "Viajar para a Argélia com seu cachorro" }
  intro:
    en: >-
      Algeria welcomes pet dogs, but entry runs through the country's own scheme managed by the
      Ministry of Agriculture and Rural Development's veterinary authority (Direction des Services
      Vétérinaires, DSV), not the EU framework. According to the Algerian Customs, a traveller's
      dog must arrive with a certificate of good health (certificat de bonne santé) issued and
      signed by a veterinarian less than eight days before travel, together with proof of a valid
      rabies vaccination given more than one month and less than one year before shipment. On
      arrival, your dog is subject to veterinary sanitary inspection at the border post. Algeria is
      a country where rabies is present, so the rabies rule is central. This guide explains the
      health certificate, the rabies vaccination window and the border inspection, and flags the
      points the Algerian authorities do not publish, so you know exactly what to prepare — and what
      to confirm with the DSV — before you book your flight.
    fr: >-
      L'Algérie accueille les chiens, mais l'entrée passe par le dispositif propre au pays, géré par
      l'autorité vétérinaire du ministère de l'Agriculture et du Développement Rural (Direction des
      Services Vétérinaires, DSV), et non par le cadre de l'UE. Selon la Douane algérienne, le chien
      d'un voyageur doit arriver avec un certificat de bonne santé établi et signé par un
      vétérinaire moins de huit jours avant le voyage, accompagné de la preuve d'une vaccination
      antirabique valide effectuée plus d'un mois et moins d'un an avant l'expédition. À l'arrivée,
      ton chien est soumis à l'inspection sanitaire vétérinaire au poste frontière. L'Algérie est
      un pays où la rage est présente ; la règle antirabique est donc centrale. Ce guide détaille le
      certificat sanitaire, la fenêtre de vaccination antirabique et le contrôle à la frontière, et
      signale les points que les autorités algériennes ne publient pas, afin de savoir exactement
      quoi préparer — et quoi confirmer auprès de la DSV — avant de réserver ton vol.
    es: >-
      Argelia acoge a los perros de compañía, pero la entrada se rige por el sistema propio del país
      gestionado por la autoridad veterinaria del Ministerio de Agricultura y Desarrollo Rural
      (Direction des Services Vétérinaires, DSV), y no por el marco de la UE. Según las Aduanas
      argelinas, el perro de un viajero debe llegar con un certificado de buena salud (certificat de
      bonne santé) expedido y firmado por un veterinario menos de ocho días antes del viaje, junto
      con la prueba de una vacunación antirrábica válida administrada más de un mes y menos de un año
      antes del envío. A la llegada, tu perro se somete a inspección sanitaria veterinaria en el
      puesto fronterizo. Argelia es un país donde la rabia está presente, por lo que la norma
      antirrábica es central. Esta guía explica el certificado sanitario, la ventana de vacunación
      antirrábica y el control en la frontera, y señala los puntos que las autoridades argelinas no
      publican, para que sepas exactamente qué preparar — y qué confirmar con la DSV — antes de
      reservar tu vuelo.

    pt: "A Argélia recebe cachorros de companhia, mas a entrada segue um esquema próprio do país, administrado pela autoridade veterinária do Ministério da Agricultura e do Desenvolvimento Rural (Direction des Services Vétérinaires, DSV), e não o modelo europeu. Segundo a Alfândega argelina, o cachorro de um viajante deve chegar com um atestado de boa saúde (certificat de bonne santé), emitido e assinado por um veterinário menos de oito dias antes da viagem, junto com o comprovante de uma vacinação antirrábica válida, aplicada há mais de um mês e há menos de um ano antes do envio. Na chegada, o cachorro fica sujeito a inspeção sanitária veterinária no posto de fronteira. A Argélia é um país onde a raiva está presente, por isso a regra da raiva é central. Este guia explica o atestado de saúde, o prazo da vacinação antirrábica e a inspeção de fronteira, e assinala os pontos que as autoridades argelinas não publicam, para que você saiba exatamente o que preparar — e o que confirmar com a DSV — antes de reservar o voo."
difficulty:
  level: moderate
  label: { en: "Moderate — official health certificate and rabies vaccination required", fr: "Modéré — certificat sanitaire officiel et vaccination antirabique requis", es: "Moderado — se requieren certificado sanitario oficial y vacunación antirrábica", pt: "Moderado — atestado de saúde oficial e vacinação antirrábica obrigatórios" }

prepTime:
  eu:
    en: "From the EU: a few days if the rabies vaccination is already valid — the certificate of good health is issued by a veterinarian in the eight days before travel."
    fr: "Depuis l'UE : quelques jours si la vaccination antirabique est déjà valide — le certificat de bonne santé est établi par un vétérinaire dans les huit jours précédant le voyage."
    es: "Desde la UE: unos días si la vacunación antirrábica ya es válida — el certificado de buena salud lo expide un veterinario en los ocho días previos al viaje."
    pt: "Da UE: alguns dias, se a vacinação antirrábica já estiver válida — o atestado de boa saúde é emitido por um veterinário nos oito dias que antecedem a viagem."
  listed:
    en: "From any other country: similar timing; allow about 4–5 weeks if the first rabies shot is still needed, because the vaccination must be at least one month old before shipment."
    fr: "Depuis tout autre pays : délais comparables ; prévois environ 4 à 5 semaines s'il faut encore faire le premier vaccin antirabique, car la vaccination doit dater d'au moins un mois avant l'expédition."
    es: "Desde cualquier otro país: plazos similares; reserva unas 4 o 5 semanas si aún falta la primera vacuna antirrábica, porque la vacunación debe tener al menos un mes antes del envío."
    pt: "De qualquer outro país: prazo semelhante; contar com cerca de 4 a 5 semanas se a primeira dose da vacina antirrábica ainda for necessária, pois a vacinação deve ter pelo menos um mês de aplicada antes do envio."
  nonListed:
    en: "Whatever the origin, the certificate is signed close to departure, so most of the lead time is the rabies vaccination itself. Confirm any extra requirement for your dog's origin with the DSV before booking."
    fr: "Quelle que soit l'origine, le certificat est signé peu avant le départ ; l'essentiel du délai tient donc à la vaccination antirabique elle-même. Confirme auprès de la DSV toute exigence supplémentaire liée à l'origine de ton chien avant de réserver."
    es: "Sea cual sea el origen, el certificado se firma poco antes de la salida, así que la mayor parte del tiempo de antelación corresponde a la propia vacunación antirrábica. Confirma con la DSV cualquier requisito adicional relacionado con el origen de tu perro antes de reservar."
    pt: "Qualquer que seja a origem, o certificado é assinado perto da partida, de modo que a maior parte do prazo de antecedência é a própria vacinação antirrábica. Confirmar qualquer exigência adicional para a origem do cachorro junto da DSV antes de reservar."

