factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do cachorro" }
  intro:
    en: "The exact documents depend on three things — Algeria (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — l'Algérie (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Argelia (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — a Argélia (o destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Algeria", fr: "Pays de destination — Algérie", es: "País de destino — Argelia", pt: "País de destino — Argélia" }
      text:
        en: "Algeria runs its own scheme under the Direction des Services Vétérinaires (DSV): a certificate of good health signed less than eight days before travel and a valid rabies vaccination are required, and your dog is subject to veterinary sanitary inspection at the border post on arrival. Algeria does not follow the EU pet-passport framework."
        fr: "L'Algérie applique son propre dispositif sous l'égide de la Direction des Services Vétérinaires (DSV) : un certificat de bonne santé signé moins de huit jours avant le voyage et une vaccination antirabique valide sont exigés, et ton chien est soumis à l'inspection sanitaire vétérinaire au poste frontière à l'arrivée. L'Algérie ne suit pas le cadre du passeport européen pour animaux."
        es: "Argelia aplica su propio sistema bajo la Direction des Services Vétérinaires (DSV): se exigen un certificado de buena salud firmado menos de ocho días antes del viaje y una vacunación antirrábica válida, y tu perro se somete a inspección sanitaria veterinaria en el puesto fronterizo a la llegada. Argelia no sigue el marco del pasaporte europeo para mascotas."
        pt: "A Argélia segue seu próprio esquema pela Direction des Services Vétérinaires (DSV): são exigidos um atestado de boa saúde assinado menos de oito dias antes da viagem e uma vacinação antirrábica válida, e o cachorro fica sujeito a inspeção sanitária veterinária no posto de fronteira na chegada. A Argélia não segue o modelo de passaporte europeu para animais de estimação."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The certificate of good health is issued by a veterinarian in the country of departure. The country of departure decides who signs your documents and shapes the rabies-vaccination evidence the Algerian border expects. Requirements can be stricter for animals coming from a country where rabies is widespread."
        fr: "Le certificat de bonne santé est établi par un vétérinaire du pays de départ. Le pays de départ détermine qui signe tes documents et conditionne les preuves de vaccination antirabique attendues à la frontière algérienne. Les exigences peuvent être plus strictes pour un animal provenant d'un pays où la rage est très présente."
        es: "El certificado de buena salud lo expide un veterinario del país de salida. El país de salida determina quién firma tus documentos y condiciona las pruebas de vacunación antirrábica que espera la frontera argelina. Los requisitos pueden ser más estrictos para un animal procedente de un país donde la rabia está muy presente."
        pt: "O atestado de boa saúde é emitido por um veterinário no país de partida. O país de partida determina quem assina os documentos e molda o comprovante de vacinação antirrábica esperado pela fronteira argelina. As exigências podem ser mais rigorosas para animais provenientes de um país onde a raiva é disseminada."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde o cachorro esteve recentemente" }
      text:
        en: "Your dog's rabies history and recent country of residence matter to the veterinary services, not only the last airport. A stay in a high-risk country can change what the border vet asks for, so confirm your dog's full history with your vet and the DSV before you travel."
        fr: "L'historique antirabique et le pays de résidence récent de ton chien comptent pour les services vétérinaires, pas seulement l'aéroport de départ. Un séjour dans un pays à haut risque peut modifier ce que demande le vétérinaire frontalier ; confirme donc l'historique complet de ton chien avec ton vétérinaire et la DSV avant de voyager."
        es: "El historial antirrábico y el país de residencia reciente de tu perro importan a los servicios veterinarios, no solo el último aeropuerto. Una estancia en un país de alto riesgo puede cambiar lo que pide el veterinario de frontera, así que confirma el historial completo de tu perro con tu veterinario y la DSV antes de viajar."
        pt: "O histórico de raiva do cachorro e o país de residência recente importam para os serviços veterinários, não apenas o último aeroporto. Uma estadia em um país de alto risco pode mudar o que o veterinário de fronteira exige, portanto confirmar o histórico completo do cachorro com o veterinário e com a DSV antes de viajar."
  note:
    en: "So read the requirements below as Algeria's published framework, then confirm your dog's exact origin, history and any additional step with your vet and the DSV before booking."
    fr: "Lis donc les exigences ci-dessous comme le cadre publié par l'Algérie, puis confirme l'origine, l'historique exacts de ton chien et toute étape supplémentaire avec ton vétérinaire et la DSV avant de réserver."
    es: "Así que lee los requisitos siguientes como el marco publicado por Argelia y luego confirma el origen y el historial exactos de tu perro, así como cualquier paso adicional, con tu veterinario y la DSV antes de reservar."
    pt: "Portanto, ler as exigências abaixo como o quadro publicado pela Argélia e, em seguida, confirmar a origem exata, o histórico do cachorro e qualquer etapa adicional com o veterinário e com a DSV antes de reservar."

requirements:
  - item: { en: "Identification (microchip)", fr: "Identification (puce électronique)", es: "Identificación (microchip)", pt: "Identificação (microchip)" }
    required: { en: "Not published", fr: "Non publiée", es: "No publicada", pt: "Não publicado" }
    when: { en: "An ISO microchip is the standard way to identify the animal on the health certificate and is needed for a later return to the EU; place it before the rabies vaccination. The Algerian Customs traveller information does not publish a separate microchip requirement.", fr: "Une puce ISO est le moyen standard d'identifier l'animal sur le certificat sanitaire et est nécessaire pour un retour ultérieur vers l'UE ; posez-la avant la vaccination antirabique. L'information voyageurs de la Douane algérienne ne publie pas d'exigence distincte sur la puce.", es: "Un microchip ISO es la forma estándar de identificar al animal en el certificado sanitario y es necesario para un posterior regreso a la UE; colócalo antes de la vacunación antirrábica. La información para viajeros de las Aduanas argelinas no publica un requisito específico de microchip.", pt: "Um microchip ISO é a forma padrão de identificar o animal no atestado de saúde e é necessário para um eventual retorno à UE; implantá-lo antes da vacinação antirrábica. As informações para viajantes da Alfândega argelina não publicam uma exigência separada de microchip." }
    exceptions: { en: "Unknown — confirm identification requirements with the DSV, as they are not stated in the published customs guidance.", fr: "Non communiqué — confirme les exigences d'identification auprès de la DSV, celles-ci n'étant pas précisées dans les consignes douanières publiées.", es: "Desconocido — confirma los requisitos de identificación con la DSV, ya que no se indican en las directrices aduaneras publicadas.", pt: "Não comunicado — confirmar as exigências de identificação com a DSV, pois não constam nas orientações aduaneiras publicadas." }
    ref: { en: "Douane algérienne — Voyage en Algérie (animaux de compagnie)", fr: "Douane algérienne — Voyage en Algérie (animaux de compagnie)", es: "Douane algérienne — Voyage en Algérie (animaux de compagnie)", pt: "Alfândega argelina — Voyage en Algérie (animaux de compagnie)" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "The dog must carry a valid rabies vaccination certificate or record. Per the Algerian Customs, the vaccination must have been carried out more than one month and less than one year before the animal is shipped.", fr: "Le chien doit disposer d'un certificat ou d'un carnet de vaccination antirabique valide. Selon la Douane algérienne, la vaccination doit avoir été effectuée plus d'un mois et moins d'un an avant l'expédition de l'animal.", es: "El perro debe contar con un certificado o una cartilla de vacunación antirrábica válida. Según las Aduanas argelinas, la vacunación debe haberse realizado más de un mes y menos de un año antes del envío del animal.", pt: "O cachorro deve portar um certificado ou caderneta de vacinação antirrábica válida. Segundo a Alfândega argelina, a vacinação deve ter sido aplicada há mais de um mês e há menos de um ano antes do envio do animal." }
    exceptions: { en: "None published for the vaccination window — an out-of-date or too-recent vaccination does not meet the rule.", fr: "Aucune publiée pour la fenêtre de vaccination — une vaccination périmée ou trop récente ne satisfait pas la règle.", es: "Ninguna publicada para la ventana de vacunación — una vacunación caducada o demasiado reciente no cumple la norma.", pt: "Nenhuma publicada para o prazo da vacinação — uma vacinação vencida ou aplicada muito recentemente não atende à regra." }
    ref: { en: "Douane algérienne — Voyage en Algérie (animaux de compagnie)", fr: "Douane algérienne — Voyage en Algérie (animaux de compagnie)", es: "Douane algérienne — Voyage en Algérie (animaux de compagnie)", pt: "Alfândega argelina — Voyage en Algérie (animaux de compagnie)" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not published", fr: "Non prévu", es: "No prevista", pt: "Não publicado" }
    when: { en: "Algeria's published traveller pet-entry rules do not mention a rabies antibody test for personal pets.", fr: "Les règles publiées d'entrée d'animaux de compagnie pour les voyageurs en Algérie ne mentionnent pas de titrage antirabique pour les animaux personnels.", es: "Las normas publicadas de entrada de mascotas para viajeros en Argelia no mencionan una prueba de titulación de rabia para las mascotas personales.", pt: "As regras publicadas pela Argélia para a entrada de animais de companhia de viajantes não mencionam um teste sorológico antirrábico para animais de companhia particulares." }
    exceptions: { en: "Unknown for specific cases — confirm with the DSV, as requirements can differ by the dog's origin and rabies history.", fr: "Non communiqué pour les cas particuliers — à confirmer auprès de la DSV, les exigences pouvant varier selon l'origine et l'historique rabique du chien.", es: "Desconocido para casos concretos — confírmalo con la DSV, ya que los requisitos pueden variar según el origen y el historial de rabia del perro.", pt: "Não comunicado para casos específicos — confirmar com a DSV, pois as exigências podem variar conforme a origem e o histórico de raiva do cachorro." }
    ref: { en: "Douane algérienne — Voyage en Algérie; MADR — Direction des Services Vétérinaires", fr: "Douane algérienne — Voyage en Algérie ; MADR — Direction des Services Vétérinaires", es: "Douane algérienne — Voyage en Algérie; MADR — Direction des Services Vétérinaires", pt: "Alfândega argelina — Voyage en Algérie; MADR — Direction des Services Vétérinaires" }
  - item: { en: "Certificate of good health (certificat de bonne santé)", fr: "Certificat de bonne santé", es: "Certificado de buena salud (certificat de bonne santé)", pt: "Atestado de boa saúde (certificat de bonne santé)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "A certificate of good health, established and signed by a veterinarian, dated less than eight days before travel, must be presented on entry to Algeria. French-language documents are accepted in Algeria.", fr: "Un certificat de bonne santé, établi et signé par un vétérinaire, daté de moins de huit jours avant le voyage, doit être présenté à l'entrée en Algérie. Les documents en langue française sont acceptés en Algérie.", es: "Un certificado de buena salud, expedido y firmado por un veterinario, con fecha de menos de ocho días antes del viaje, debe presentarse a la entrada a Argelia. Se aceptan los documentos en francés en Argelia.", pt: "Um atestado de boa saúde, elaborado e assinado por um veterinário, datado de menos de oito dias antes da viagem, deve ser apresentado na entrada na Argélia. Documentos em francês são aceitos na Argélia." }
    exceptions: { en: "None — the health documents are mandatory for a companion animal accompanying a traveller.", fr: "Aucune — les documents sanitaires sont obligatoires pour un animal de compagnie accompagnant un voyageur.", es: "Ninguna — los documentos sanitarios son obligatorios para un animal de compañía que acompaña a un viajero.", pt: "Nenhuma — os documentos de saúde são obrigatórios para um animal de companhia que acompanha um viajante." }
    ref: { en: "Douane algérienne — Voyage en Algérie (animaux de compagnie)", fr: "Douane algérienne — Voyage en Algérie (animaux de compagnie)", es: "Douane algérienne — Voyage en Algérie (animaux de compagnie)", pt: "Alfândega argelina — Voyage en Algérie (animaux de compagnie)" }
  - item: { en: "International veterinary / export certificate", fr: "Certificat vétérinaire / d'exportation international", es: "Certificado veterinario / de exportación internacional", pt: "Certificado veterinário internacional / de exportação" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "For imports, the DSV operates a sanitary derogation (dérogation sanitaire d'importation) regime, and a country of origin is authorised only after a health certificate model has been adopted. Whether a traveller's accompanying pet needs this derogation is not clearly published — confirm with the DSV.", fr: "Pour les importations, la DSV applique un régime de dérogation sanitaire d'importation, et un pays d'origine n'est autorisé qu'après l'adoption d'un modèle de certificat sanitaire. La nécessité de cette dérogation pour l'animal accompagnant un voyageur n'est pas clairement publiée — à confirmer auprès de la DSV.", es: "Para las importaciones, la DSV aplica un régimen de excepción sanitaria (dérogation sanitaire d'importation), y un país de origen solo se autoriza tras la adopción de un modelo de certificado sanitario. Si la mascota que acompaña a un viajero necesita esta excepción no se publica con claridad — confírmalo con la DSV.", pt: "Para importações, a DSV opera um regime de derrogação sanitária (dérogation sanitaire d'importation), e um país de origem só é autorizado depois de adotado um modelo de certificado de saúde. Não fica claramente publicado se o cachorro de um viajante que o acompanha precisa dessa derrogação — confirmar com a DSV." }
    exceptions: { en: "Commercial movements clearly fall under the DSV import-derogation procedure; personal-pet treatment is not fully detailed.", fr: "Les mouvements commerciaux relèvent clairement de la procédure de dérogation sanitaire de la DSV ; le traitement de l'animal de compagnie personnel n'est pas entièrement détaillé.", es: "Los movimientos comerciales entran claramente en el procedimiento de excepción de importación de la DSV; el tratamiento de la mascota personal no está totalmente detallado.", pt: "As movimentações comerciais claramente se enquadram no procedimento de derrogação de importação da DSV; o tratamento para animais de companhia particulares não é totalmente detalhado." }
    ref: { en: "MADR — Dérogation sanitaire d'importation (DSV)", fr: "MADR — Dérogation sanitaire d'importation (DSV)", es: "MADR — Dérogation sanitaire d'importation (DSV)", pt: "MADR — Dérogation sanitaire d'importation (DSV)" }
  - item: { en: "Advance notification / import permit", fr: "Notification préalable / permis d'import", es: "Notificación previa / permiso de importación", pt: "Notificação prévia / autorização de importação" }
    required: { en: "Not published (personal pet)", fr: "Non publié (animal personnel)", es: "No publicado (mascota personal)", pt: "Não publicado (animal de companhia particular)" }
    when: { en: "The Algerian Customs treats a traveller's pet as a border formality checked on arrival; no prior import permit is published for a personal accompanying pet. Larger or commercial movements go through the DSV import-derogation process.", fr: "La Douane algérienne traite l'animal d'un voyageur comme une formalité contrôlée à la frontière ; aucun permis d'importation préalable n'est publié pour un animal personnel accompagnant. Les mouvements plus importants ou commerciaux passent par la procédure de dérogation sanitaire de la DSV.", es: "Las Aduanas argelinas tratan la mascota de un viajero como una formalidad fronteriza que se comprueba a la llegada; no se publica ningún permiso de importación previo para una mascota personal acompañante. Los movimientos mayores o comerciales pasan por el procedimiento de excepción de importación de la DSV.", pt: "A Alfândega argelina trata o animal de companhia de um viajante como uma formalidade de fronteira verificada na chegada; nenhuma autorização de importação prévia é publicada para um animal de companhia particular que viaja acompanhado. Movimentações maiores ou comerciais passam pelo processo de derrogação de importação da DSV." }
    exceptions: { en: "Unknown — confirm with the DSV whether a prior authorisation applies to your case.", fr: "Non communiqué — confirme auprès de la DSV si une autorisation préalable s'applique à ton cas.", es: "Desconocido — confirma con la DSV si una autorización previa se aplica a tu caso.", pt: "Não comunicado — confirmar com a DSV se uma autorização prévia se aplica ao seu caso." }
    ref: { en: "Douane algérienne — Voyage en Algérie; MADR — Dérogation sanitaire d'importation", fr: "Douane algérienne — Voyage en Algérie ; MADR — Dérogation sanitaire d'importation", es: "Douane algérienne — Voyage en Algérie; MADR — Dérogation sanitaire d'importation", pt: "Alfândega argelina — Voyage en Algérie; MADR — Dérogation sanitaire d'importation" }
  - item: { en: "Border veterinary inspection", fr: "Inspection vétérinaire à la frontière", es: "Inspección veterinaria en la frontera", pt: "Inspeção veterinária na fronteira" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Animals entering the national territory are subject to veterinary sanitary inspection at the border post; present your dog and its documents on arrival. Clearance is contingent on the veterinary sanitary authorisation and control visa issued by the border inspection services.", fr: "Les animaux entrant sur le territoire national sont soumis à l'inspection sanitaire vétérinaire au poste frontière ; présente ton chien et ses documents à l'arrivée. Le dédouanement est subordonné à l'autorisation sanitaire vétérinaire et au visa de contrôle délivrés par les services d'inspection frontaliers.", es: "Los animales que entran en el territorio nacional se someten a inspección sanitaria veterinaria en el puesto fronterizo; presenta a tu perro y sus documentos a la llegada. El despacho está supeditado a la autorización sanitaria veterinaria y al visado de control expedidos por los servicios de inspección fronteriza.", pt: "Os animais que entram no território nacional ficam sujeitos a inspeção sanitária veterinária no posto de fronteira; apresentar o cachorro e seus documentos na chegada. A liberação depende da autorização sanitária veterinária e do visto de controle emitidos pelos serviços de inspeção de fronteira." }
    exceptions: { en: "None for a live dog entering the territory.", fr: "Aucune pour un chien vivant entrant sur le territoire.", es: "Ninguna para un perro vivo que entra en el territorio.", pt: "Nenhuma para um cachorro vivo que entra no território." }
    ref: { en: "Douane algérienne — Animaux vivants et produits d'origine animale; Décret exécutif n° 91-452 (16/11/1991); Loi n° 88-08 (26/01/1988)", fr: "Douane algérienne — Animaux vivants et produits d'origine animale ; Décret exécutif n° 91-452 (16/11/1991) ; Loi n° 88-08 (26/01/1988)", es: "Douane algérienne — Animaux vivants et produits d'origine animale; Décret exécutif n° 91-452 (16/11/1991); Loi n° 88-08 (26/01/1988)", pt: "Alfândega argelina — Animaux vivants et produits d'origine animale; Décret exécutif n° 91-452 (16/11/1991); Loi n° 88-08 (26/01/1988)" }
  - item: { en: "Parasite / tapeworm treatment", fr: "Traitement antiparasitaire / échinococcose", es: "Tratamiento antiparasitario / contra la tenia", pt: "Tratamento antiparasitário / contra tênias" }
    required: { en: "Not published", fr: "Non prévu", es: "No previsto", pt: "Não publicado" }
    when: { en: "Algeria's published traveller pet-entry rules do not mention a compulsory internal or external parasite (tapeworm) treatment for dogs.", fr: "Les règles publiées d'entrée d'animaux de compagnie pour les voyageurs en Algérie ne mentionnent pas de traitement antiparasitaire interne ou externe (échinococcose) obligatoire pour les chiens.", es: "Las normas publicadas de entrada de mascotas para viajeros en Argelia no mencionan un tratamiento obligatorio contra parásitos internos o externos (tenia) para los perros.", pt: "As regras publicadas pela Argélia para a entrada de animais de companhia de viajantes não mencionam um tratamento antiparasitário interno ou externo (contra tênias) obrigatório para cachorros." }
    exceptions: { en: "Unknown — confirm with the DSV.", fr: "Non communiqué — à confirmer auprès de la DSV.", es: "Desconocido — confírmalo con la DSV.", pt: "Não comunicado — confirmar com a DSV." }
    ref: { en: "Douane algérienne — Voyage en Algérie (animaux de compagnie)", fr: "Douane algérienne — Voyage en Algérie (animaux de compagnie)", es: "Douane algérienne — Voyage en Algérie (animaux de compagnie)", pt: "Alfândega argelina — Voyage en Algérie (animaux de compagnie)" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Linked to rabies vaccination", fr: "Lié à la vaccination antirabique", es: "Vinculada a la vacunación antirrábica", pt: "Vinculada à vacinação antirrábica" }
    when: { en: "A puppy must be old enough to hold a valid rabies vaccination that is more than one month and less than one year old at shipment. Algeria does not publish a separate stand-alone minimum age.", fr: "Un chiot doit être en âge de disposer d'une vaccination antirabique valide, datant de plus d'un mois et de moins d'un an au moment de l'expédition. L'Algérie ne publie pas d'âge minimum distinct spécifique.", es: "Un cachorro debe tener la edad suficiente para contar con una vacunación antirrábica válida, con más de un mes y menos de un año en el momento del envío. Argelia no publica una edad mínima autónoma aparte.", pt: "O filhote deve ter idade suficiente para portar uma vacinação antirrábica válida, aplicada há mais de um mês e há menos de um ano no momento do envio. A Argélia não publica uma idade mínima autônoma separada." }
    exceptions: { en: "A puppy too young to be validly vaccinated cannot meet the rabies rule — confirm with the DSV.", fr: "Un chiot trop jeune pour être valablement vacciné ne peut satisfaire la règle antirabique — à confirmer auprès de la DSV.", es: "Un cachorro demasiado joven para ser vacunado válidamente no puede cumplir la norma antirrábica — confírmalo con la DSV.", pt: "Um filhote jovem demais para ser validamente vacinado não pode cumprir a regra da raiva — confirmar com a DSV." }
    ref: { en: "Douane algérienne — Voyage en Algérie (vaccination antirabique)", fr: "Douane algérienne — Voyage en Algérie (vaccination antirabique)", es: "Douane algérienne — Voyage en Algérie (vaccination antirabique)", pt: "Alfândega argelina — Voyage en Algérie (vaccination antirabique)" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not mentioned in published rules", fr: "Non mentionnée dans les règles publiées", es: "No se menciona en las normas publicadas", pt: "Não mencionado nas regras publicadas" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Non-compliant animals may be refused or held under veterinary control at the owner's expense; a specific quarantine period is not published — confirm with the DSV.", fr: "Les animaux non conformes peuvent être refusés ou placés sous contrôle vétérinaire aux frais du propriétaire ; aucune durée de quarantaine spécifique n'est publiée — à confirmer auprès de la DSV.", es: "Los animales no conformes pueden ser rechazados o retenidos bajo control veterinario a cargo del propietario; no se publica un periodo de cuarentena específico — confírmalo con la DSV.", pt: "Animais em não conformidade podem ser recusados ou retidos sob controle veterinário às custas do proprietário; um período específico de quarentena não é publicado — confirmar com a DSV." }
    ref: { en: "Décret exécutif n° 91-452 (16/11/1991); Loi n° 88-08 (26/01/1988)", fr: "Décret exécutif n° 91-452 (16/11/1991) ; Loi n° 88-08 (26/01/1988)", es: "Décret exécutif n° 91-452 (16/11/1991); Loi n° 88-08 (26/01/1988)", pt: "Décret exécutif n° 91-452 (16/11/1991); Loi n° 88-08 (26/01/1988)" }
  - item: { en: "Banned / dangerous breeds (import)", fr: "Races interdites / dangereuses (import)", es: "Razas prohibidas / peligrosas (importación)", pt: "Raças proibidas / perigosas (importação)" }
    required: { en: "No national import ban published", fr: "Aucune interdiction nationale d'import publiée", es: "No se publica ninguna prohibición nacional de importación", pt: "Nenhuma proibição nacional de importação publicada" }
    when: { en: "The Algerian veterinary and customs authorities do not publish a specific list of dog breeds banned from import. Local (wilaya) rules on keeping or breeding dangerous dogs may exist but are not a national import law.", fr: "Les autorités vétérinaires et douanières algériennes ne publient pas de liste précise de races de chiens interdites à l'importation. Des règles locales (de wilaya) sur la détention ou l'élevage de chiens dangereux peuvent exister mais ne constituent pas une loi nationale d'importation.", es: "Las autoridades veterinarias y aduaneras argelinas no publican una lista específica de razas de perros prohibidas para la importación. Pueden existir normas locales (de wilaya) sobre la tenencia o la cría de perros peligrosos, pero no constituyen una ley nacional de importación.", pt: "As autoridades veterinárias e aduaneiras argelinas não publicam uma lista específica de raças de cachorros proibidas para importação. Regras locais (wilaya) sobre a posse ou criação de cachorros considerados perigosos podem existir, mas não constituem uma lei nacional de importação." }
    exceptions: { en: "Unknown — confirm current breed rules with the DSV before you travel.", fr: "Non communiqué — confirme les règles de race en vigueur auprès de la DSV avant de voyager.", es: "Desconocido — confirma las normas de razas vigentes con la DSV antes de viajar.", pt: "Não comunicado — confirmar as regras de raça vigentes com a DSV antes de viajar." }
    ref: { en: "MADR — Direction des Services Vétérinaires (DSV)", fr: "MADR — Direction des Services Vétérinaires (DSV)", es: "MADR — Direction des Services Vétérinaires (DSV)", pt: "MADR — Direction des Services Vétérinaires (DSV)" }

origin:
  eu:
    title: { en: "From the European Union", fr: "Depuis l'Union européenne", es: "Desde la Unión Europea", pt: "Da União Europeia" }
    body:
      en: "For a dog leaving the EU, a veterinarian issues the certificate of good health for Algeria in the eight days before travel. Your dog needs a valid rabies vaccination given more than one month and less than one year before shipment (recorded in the passport / vaccination record) and, in practice, an ISO microchip for a later EU return. No rabies antibody test is published as an Algerian entry requirement. On arrival, the border veterinary services inspect the dog and its documents."
      fr: "Pour un chien quittant l'UE, un vétérinaire établit le certificat de bonne santé pour l'Algérie dans les huit jours précédant le voyage. Ton chien a besoin d'une vaccination antirabique valide effectuée plus d'un mois et moins d'un an avant l'expédition (consignée dans le passeport / carnet de vaccination) et, en pratique, d'une puce ISO pour un retour ultérieur vers l'UE. Aucun titrage antirabique n'est publié comme exigence d'entrée en Algérie. À l'arrivée, les services vétérinaires frontaliers contrôlent le chien et ses documents."
      es: "Para un perro que sale de la UE, un veterinario expide el certificado de buena salud para Argelia en los ocho días previos al viaje. Tu perro necesita una vacunación antirrábica válida administrada más de un mes y menos de un año antes del envío (registrada en el pasaporte / cartilla de vacunación) y, en la práctica, un microchip ISO para un posterior regreso a la UE. No se publica ninguna prueba de titulación de rabia como requisito de entrada a Argelia. A la llegada, los servicios veterinarios de frontera inspeccionan al perro y sus documentos."
      pt: "Para um cachorro que sai da UE, um veterinário emite o atestado de boa saúde para a Argélia nos oito dias que antecedem a viagem. O cachorro precisa de uma vacinação antirrábica válida, aplicada há mais de um mês e há menos de um ano antes do envio (registrada no passaporte / caderneta de vacinação) e, na prática, de um microchip ISO para um eventual retorno à UE. Nenhum teste sorológico antirrábico é publicado como exigência de entrada na Argélia. Na chegada, os serviços veterinários de fronteira inspecionam o cachorro e seus documentos."
    cls: ok
  listed:
    title: { en: "From any other country", fr: "Depuis tout autre pays", es: "Desde cualquier otro país", pt: "De qualquer outro país" }
    body:
      en: "From a non-EU country, the core requirements are the same: a valid rabies vaccination within the one-month-to-one-year window and a certificate of good health signed by a veterinarian less than eight days before travel. Use your country's official veterinary documents and have them signed close to departure. For imports generally, the DSV authorises a country of origin only once a health-certificate model has been adopted, so check your origin's status with the DSV."
      fr: "Depuis un pays hors UE, les exigences de base sont identiques : une vaccination antirabique valide dans la fenêtre d'un mois à un an et un certificat de bonne santé signé par un vétérinaire moins de huit jours avant le voyage. Utilise les documents vétérinaires officiels de ton pays et fais-les signer peu avant le départ. Pour les importations en général, la DSV n'autorise un pays d'origine qu'après l'adoption d'un modèle de certificat sanitaire ; vérifie donc le statut de ton origine auprès de la DSV."
      es: "Desde un país fuera de la UE, los requisitos básicos son los mismos: una vacunación antirrábica válida dentro de la ventana de un mes a un año y un certificado de buena salud firmado por un veterinario menos de ocho días antes del viaje. Utiliza los documentos veterinarios oficiales de tu país y hazlos firmar poco antes de la salida. Para las importaciones en general, la DSV solo autoriza un país de origen una vez que se ha adoptado un modelo de certificado sanitario, así que comprueba el estatus de tu origen con la DSV."
      pt: "De um país fora da UE, as exigências essenciais são as mesmas: uma vacinação antirrábica válida dentro do prazo de um mês a um ano e um atestado de boa saúde assinado por um veterinário menos de oito dias antes da viagem. Usar os documentos veterinários oficiais do país de origem e providenciar que sejam assinados perto da partida. Para importações em geral, a DSV só autoriza um país de origem depois de adotado um modelo de certificado de saúde, portanto verificar a situação da origem junto da DSV."
    cls: warn
  nonListed:
    title: { en: "Rabies history & special cases", fr: "Historique rabique et cas particuliers", es: "Historial de rabia y casos especiales", pt: "Histórico de raiva e casos particulares" }
    body:
      en: "Algeria is a country where rabies is present and does not publish a separate at-risk-country track or an antibody test for personal pets. However, the border veterinary services take the dog's rabies history and recent residence into account. If your dog has stayed in a high-risk country, or if you are unsure whether an import derogation applies, confirm directly with the DSV what evidence the border will require before you travel."
      fr: "L'Algérie est un pays où la rage est présente et ne publie pas de parcours distinct pour les pays à risque ni de titrage pour les animaux personnels. Toutefois, les services vétérinaires frontaliers tiennent compte de l'historique rabique et de la résidence récente du chien. Si ton chien a séjourné dans un pays à haut risque, ou si tu ignorez si une dérogation d'importation s'applique, confirme directement auprès de la DSV les preuves exigées à la frontière avant de voyager."
      es: "Argelia es un país donde la rabia está presente y no publica una vía aparte para países de riesgo ni una prueba de titulación para las mascotas personales. Sin embargo, los servicios veterinarios de frontera tienen en cuenta el historial de rabia y la residencia reciente del perro. Si tu perro ha estado en un país de alto riesgo, o si no sabes si se aplica una excepción de importación, confirma directamente con la DSV qué pruebas exigirá la frontera antes de viajar."
      pt: "A Argélia é um país onde a raiva está presente e não publica uma via separada para países de risco nem um teste sorológico para animais de companhia particulares. No entanto, os serviços veterinários de fronteira levam em conta o histórico de raiva e a residência recente do cachorro. Se o cachorro esteve em um país de alto risco, ou se houver dúvida sobre a aplicação de uma derrogação de importação, confirmar diretamente com a DSV quais comprovantes a fronteira exigirá antes de viajar."
    cls: neutral

arrival:
  intro:
    en: "What happens when your dog reaches Algeria depends on your documents and the border veterinary inspection."
    fr: "Ce qui se passe à l'arrivée de ton chien en Algérie dépend de tes documents et de l'inspection vétérinaire à la frontière."
    es: "Lo que ocurre cuando tu perro llega a Argelia depende de tus documentos y de la inspección veterinaria en la frontera."
    pt: "O que acontece quando o cachorro chega à Argélia depende dos documentos apresentados e da inspeção veterinária de fronteira."
  points:
    - en: "At the Algerian point of entry, your dog is subject to veterinary sanitary inspection at the border post, alongside the customs check."
      fr: "Au point d'entrée algérien, ton chien est soumis à l'inspection sanitaire vétérinaire au poste frontière, aux côtés du contrôle douanier."
      es: "En el punto de entrada argelino, tu perro se somete a inspección sanitaria veterinaria en el puesto fronterizo, junto con el control aduanero."
      pt: "No ponto de entrada argelino, o cachorro fica sujeito a inspeção sanitária veterinária no posto de fronteira, junto com o controle aduaneiro."
    - en: "Present the documents: the certificate of good health signed less than eight days before travel and proof of the valid rabies vaccination (more than one month, less than one year old)."
      fr: "Présente les documents : le certificat de bonne santé signé moins de huit jours avant le voyage et la preuve de la vaccination antirabique valide (datant de plus d'un mois et de moins d'un an)."
      es: "Presenta los documentos: el certificado de buena salud firmado menos de ocho días antes del viaje y la prueba de la vacunación antirrábica válida (con más de un mes y menos de un año)."
      pt: "Apresentar os documentos: o atestado de boa saúde assinado menos de oito dias antes da viagem e o comprovante da vacinação antirrábica válida (aplicada há mais de um mês e há menos de um ano)."
    - en: "Clearance depends on the veterinary sanitary authorisation and control visa issued by the border inspection services."
      fr: "Le dédouanement dépend de l'autorisation sanitaire vétérinaire et du visa de contrôle délivrés par les services d'inspection frontaliers."
      es: "El despacho depende de la autorización sanitaria veterinaria y del visado de control expedidos por los servicios de inspección fronteriza."
      pt: "A liberação depende da autorização sanitária veterinária e do visto de controle emitidos pelos serviços de inspeção de fronteira."
    - en: "If documents are missing or invalid, the animal may be refused entry or held under veterinary control — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, l'animal peut être refusé à l'entrée ou placé sous contrôle vétérinaire — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, el animal puede ser rechazado a la entrada o retenido bajo control veterinario — a cargo del propietario."
      pt: "Se os documentos estiverem ausentes ou inválidos, a entrada do animal pode ser recusada, ou ele pode ser retido sob controle veterinário — às custas do proprietário."
    - en: "Enter through a border post equipped with veterinary inspection services, and declare your dog to customs on arrival."
      fr: "Entre par un poste frontière doté de services d'inspection vétérinaire et déclare ton chien à la douane à l'arrivée."
      es: "Entra por un puesto fronterizo dotado de servicios de inspección veterinaria y declara a tu perro en aduanas a la llegada."
      pt: "Entrar por um posto de fronteira equipado com serviços de inspeção veterinária e declarar o cachorro à alfândega na chegada."

travellerExperience: null

restrictedDogs:
  intro:
    en: "The Algerian national veterinary and customs authorities do not publish a specific list of dog breeds banned from import. This does not mean any dog is automatically accepted: entry still depends on the health certificate, the rabies vaccination and the border veterinary inspection."
    fr: "Les autorités vétérinaires et douanières nationales algériennes ne publient pas de liste précise de races de chiens interdites à l'importation. Cela ne signifie pas qu'un chien est automatiquement accepté : l'entrée dépend toujours du certificat sanitaire, de la vaccination antirabique et de l'inspection vétérinaire à la frontière."
    es: "Las autoridades veterinarias y aduaneras nacionales argelinas no publican una lista específica de razas de perros prohibidas para la importación. Esto no significa que cualquier perro sea aceptado automáticamente: la entrada sigue dependiendo del certificado sanitario, la vacunación antirrábica y la inspección veterinaria en la frontera."
    pt: "As autoridades veterinárias e aduaneiras nacionais da Argélia não publicam uma lista específica de raças de cachorros proibidas para importação. Isso não significa que qualquer cachorro seja automaticamente aceito: a entrada continua a depender do atestado de saúde, da vacinação antirrábica e da inspeção veterinária de fronteira."
  cat1:
    en: "No national import ban on named breeds is published by the Direction des Services Vétérinaires or the Algerian Customs. We could not confirm a federal dangerous-breed import list from an official source."
    fr: "Aucune interdiction nationale d'importation portant sur des races nommées n'est publiée par la Direction des Services Vétérinaires ni par la Douane algérienne. Nous n'avons pas pu confirmer de liste fédérale de races dangereuses interdites à partir d'une source officielle."
    es: "La Direction des Services Vétérinaires ni las Aduanas argelinas publican ninguna prohibición nacional de importación sobre razas concretas. No pudimos confirmar una lista federal de razas peligrosas prohibidas a partir de una fuente oficial."
    pt: "Nenhuma proibição nacional de importação para raças nomeadas é publicada pela Direction des Services Vétérinaires ou pela Alfândega argelina. Não foi possível confirmar, a partir de uma fonte oficial, uma lista federal de importação de raças perigosas."
  cat2:
    en: "Local (wilaya-level) measures on keeping, breeding or selling dogs considered dangerous may exist in some areas, but these are not a national import law and are not published by the national veterinary authority. Their scope and content are Unknown at national level."
    fr: "Des mesures locales (au niveau de la wilaya) sur la détention, l'élevage ou la vente de chiens considérés comme dangereux peuvent exister dans certaines régions, mais elles ne constituent pas une loi nationale d'importation et ne sont pas publiées par l'autorité vétérinaire nationale. Leur portée et leur contenu sont non communiqués au niveau national."
    es: "Pueden existir medidas locales (a nivel de wilaya) sobre la tenencia, la cría o la venta de perros considerados peligrosos en algunas zonas, pero no constituyen una ley nacional de importación ni las publica la autoridad veterinaria nacional. Su alcance y contenido son Desconocidos a nivel nacional."
    pt: "Medidas locais (a nível de wilaya) sobre a posse, criação ou venda de cachorros considerados perigosos podem existir em algumas áreas, mas não constituem uma lei nacional de importação e não são publicadas pela autoridade veterinária nacional. Seu alcance e conteúdo não são comunicados a nível nacional."
  note:
    en: "Because breed rules can change and may vary locally, confirm your dog's breed and any restriction with the DSV before you travel."
    fr: "Les règles de race pouvant évoluer et varier localement, confirme la race de ton chien et toute restriction auprès de la DSV avant de voyager."
    es: "Como las normas de razas pueden cambiar y variar a nivel local, confirma la raza de tu perro y cualquier restricción con la DSV antes de viajar."
    pt: "Como as regras de raça podem mudar e variar localmente, confirmar a raça do cachorro e qualquer restrição com a DSV antes de viajar."

checklist:
  - en: "Valid rabies vaccination given more than 1 month and less than 1 year before shipment (record carried)"
    fr: "Vaccination antirabique valide effectuée plus d'un mois et moins d'un an avant l'expédition (carnet emporté)"
    es: "Vacunación antirrábica válida administrada más de 1 mes y menos de 1 año antes del envío (con la cartilla contigo)"
    pt: "Vacinação antirrábica válida, aplicada há mais de 1 mês e há menos de 1 ano antes do envio (caderneta levada)"
  - en: "Certificate of good health signed by a veterinarian less than 8 days before travel"
    fr: "Certificat de bonne santé signé par un vétérinaire moins de 8 jours avant le voyage"
    es: "Certificado de buena salud firmado por un veterinario menos de 8 días antes del viaje"
    pt: "Atestado de boa saúde assinado por um veterinário menos de 8 dias antes da viagem"
  - en: "ISO microchip in place before vaccination (standard identification; needed for an EU return)"
    fr: "Puce ISO posée avant la vaccination (identification standard ; nécessaire pour un retour vers l'UE)"
    es: "Microchip ISO implantado antes de la vacunación (identificación estándar; necesario para un regreso a la UE)"
    pt: "Microchip ISO implantado antes da vacinação (identificação padrão; necessário para um retorno à UE)"
  - en: "Original documents ready for the border veterinary inspection and customs"
    fr: "Documents originaux prêts pour l'inspection vétérinaire à la frontière et la douane"
    es: "Documentos originales listos para la inspección veterinaria en la frontera y la aduana"
    pt: "Documentos originais prontos para a inspeção veterinária de fronteira e a alfândega"
  - en: "Confirm identification, any import derogation and breed rules with the DSV for your dog's origin"
    fr: "Confirme l'identification, toute dérogation d'importation et les règles de race auprès de la DSV pour l'origine de ton chien"
    es: "Confirma con la DSV la identificación, cualquier excepción de importación y las normas de razas para el origen de tu perro"
    pt: "Confirmar a identificação, uma eventual derrogação de importação e as regras de raça com a DSV, conforme a origem do cachorro"
  - en: "Enter through a border post with veterinary inspection services and declare your dog to customs"
    fr: "Entre par un poste frontière doté de services d'inspection vétérinaire et déclare ton chien à la douane"
    es: "Entra por un puesto fronterizo con servicios de inspección veterinaria y declara a tu perro en aduanas"
    pt: "Entrar por um posto de fronteira com serviços de inspeção veterinária e declarar o cachorro à alfândega"
  - en: "Check any special requirement for your dog's rabies history with the DSV before booking"
    fr: "Vérifie auprès de la DSV toute exigence particulière liée à l'historique rabique de ton chien avant de réserver"
    es: "Comprueba con la DSV cualquier requisito especial relacionado con el historial de rabia de tu perro antes de reservar"
    pt: "Verificar com a DSV qualquer exigência especial relacionada ao histórico de raiva do cachorro antes de reservar"
  - en: "Airline reservation confirming your dog's travel option and suitable IATA crate"
    fr: "Réservation confirmant l'option de transport de ton chien et caisse IATA adaptée"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y una jaula IATA adecuada"
    pt: "Reserva na companhia aérea confirmando a opção de transporte do seu cachorro e caixa de transporte adequada às normas da IATA"

