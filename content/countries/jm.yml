  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact steps depend on three things — Jamaica (your destination) sets a strict national scheme, but your dog's origin decides the detail."
    fr: "Les étapes exactes dépendent de trois éléments — la Jamaïque (ta destination) impose un régime national strict, mais l'origine de ton chien en détermine le détail."
    es: "Los pasos exactos dependen de tres factores — Jamaica (tu destino) impone un régimen nacional estricto, pero el origen de tu perro determina el detalle."
    pt: "As etapas exatas dependem de três fatores — a Jamaica (seu destino) define um regime nacional rigoroso, mas é a origem do seu cachorro que decide os detalhes."
  items:
    - stars: 5
      label: { en: "Country of destination — Jamaica", fr: "Pays de destination — Jamaïque", es: "País de destino — Jamaica", pt: "País de destino — Jamaica" }
      text:
        en: "Jamaica's Veterinary Services Division requires every dog to hold a Veterinary Import Permit, an ISO microchip, rabies protection with an antibody test, several parasite treatments and disease tests, an official export health certificate, and at least 14 days of quarantine at Plumb Point, Kingston."
        fr: "La Veterinary Services Division jamaïcaine exige de tout chien un permis d'importation vétérinaire, une puce ISO, une protection antirabique avec titrage, plusieurs traitements antiparasitaires et tests de maladies, un certificat sanitaire d'export officiel, et au moins 14 jours de quarantaine à Plumb Point, Kingston."
        es: "La Veterinary Services Division de Jamaica exige que todo perro cuente con un permiso de importación veterinario, un microchip ISO, protección antirrábica con prueba de titulación, varios tratamientos antiparasitarios y pruebas de enfermedades, un certificado sanitario de exportación oficial, y al menos 14 días de cuarentena en Plumb Point, Kingston."
        pt: "A Veterinary Services Division da Jamaica exige de todo cachorro uma autorização veterinária de importação, um microchip ISO, proteção contra a raiva com teste sorológico, vários tratamentos antiparasitários e exames de doenças, um atestado de saúde oficial de exportação e pelo menos 14 dias de quarentena em Plumb Point, Kingston."
    - stars: 5
      label: { en: "Country of departure and its category", fr: "Pays de départ et sa catégorie", es: "País de salida y su categoría", pt: "País de partida e sua categoria" }
      text:
        en: "Dogs may only be imported directly from a country listed in Category 1 (rabies-free or well-controlled). This list includes the EU, the UK, the USA, Canada, Australia, New Zealand and many Caribbean neighbours. A dog from a country not on the list cannot be imported directly."
        fr: "Un chien ne peut être importé directement que depuis un pays listé en Catégorie 1 (indemne de rage ou bien maîtrisée). Cette liste inclut l'UE, le Royaume-Uni, les USA, le Canada, l'Australie, la Nouvelle-Zélande et de nombreux voisins des Caraïbes. Un chien venant d'un pays hors liste ne peut être importé directement."
        es: "Un perro solo puede importarse directamente desde un país listado en la Categoría 1 (libre de rabia o bien controlada). Esta lista incluye la UE, el Reino Unido, EE. UU., Canadá, Australia, Nueva Zelanda y muchos vecinos del Caribe. Un perro procedente de un país fuera de la lista no puede importarse directamente."
        pt: "Os cachorros só podem ser importados diretamente de um país listado na Categoria 1 (livre de raiva ou com a raiva bem controlada). Essa lista inclui a UE, o Reino Unido, os EUA, o Canadá, a Austrália, a Nova Zelândia e muitos vizinhos do Caribe. Um cachorro que vem de um país fora da lista não pode ser importado diretamente."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A dog from a country not in Category 1 must first live in a Category 1 country for a continuous period of at least six months before it qualifies. It is your dog's real origin and residence history that count — not only the last airport."
        fr: "Un chien venant d'un pays hors Catégorie 1 doit d'abord résider de façon continue au moins six mois dans un pays de Catégorie 1 avant d'être éligible. C'est l'origine réelle et l'historique de résidence du chien qui comptent — pas seulement le dernier aéroport."
        es: "Un perro procedente de un país fuera de la Categoría 1 debe primero vivir de forma continua al menos seis meses en un país de Categoría 1 antes de poder optar a la importación. Lo que cuenta es el origen y el historial de residencia reales de tu perro — no solo el último aeropuerto."
        pt: "Um cachorro que vem de um país fora da Categoria 1 precisa antes morar em um país da Categoria 1 por um período contínuo de pelo menos seis meses para se qualificar. O que conta é a origem e o histórico de residência reais do seu cachorro — não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Jamaica's framework, then confirm your dog's category, origin and history with your vet and the VSD before you commit to a date."
    fr: "Lis donc les exigences ci-dessous comme le cadre jamaïcain, puis confirme la catégorie, l'origine et l'historique de ton chien avec ton vétérinaire et la VSD avant de fixer une date."
    es: "Así que lee los requisitos siguientes como el marco de Jamaica y luego confirma la categoría, el origen y el historial de tu perro con tu veterinario y con la VSD antes de fijar una fecha."
    pt: "Então leia as exigências abaixo como o marco geral da Jamaica e depois confirme a categoria, a origem e o histórico do seu cachorro com seu veterinário e com a VSD antes de fechar uma data."

requirements:
  - item: { en: "Veterinary Import Permit", fr: "Permis d'importation vétérinaire", es: "Permiso de importación veterinario", pt: "Autorização veterinária de importação" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Submit the Preliminary Application Form to the VSD Permit Unit at least 1 month ahead if all conditions are already met, or at least 6 months ahead if not. After review, apply online via the MOAT trade system; fee J$5,000; permit valid up to 3 months.", fr: "Soumets le formulaire de demande préliminaire à l'unité des permis de la VSD au moins 1 mois à l'avance si toutes les conditions sont remplies, ou au moins 6 mois sinon. Après examen, demande en ligne via le système MOAT ; frais 5 000 J$ ; permis valable jusqu'à 3 mois.", es: "Presenta el formulario de solicitud preliminar a la unidad de permisos de la VSD al menos 1 mes antes si ya se cumplen todas las condiciones, o al menos 6 meses antes en caso contrario. Tras la revisión, solicítalo en línea a través del sistema comercial MOAT; tasa de 5.000 J$; permiso válido hasta 3 meses.", pt: "Envie o Preliminary Application Form (formulário de solicitação preliminar) à unidade de autorizações da VSD com pelo menos 1 mês de antecedência se todas as condições já estiverem cumpridas, ou com pelo menos 6 meses se não estiverem. Depois da análise, faça o pedido on-line pelo sistema de comércio MOAT; taxa de J$ 5.000; autorização válida por até 3 meses." }
    exceptions: { en: "A dog arriving at any port without a valid Veterinary Import Permit is denied entry.", fr: "Un chien arrivant à un port sans permis d'importation vétérinaire valide se voit refuser l'entrée.", es: "A un perro que llegue a cualquier puerto sin un permiso de importación veterinario válido se le deniega la entrada.", pt: "Um cachorro que chega a qualquer porto sem uma autorização veterinária de importação válida tem a entrada negada." }
    ref: { en: "VSD — Guidelines for the Importation of Dogs and Cats (Step 6); Regulations 2017", fr: "VSD — Directives pour l'importation de chiens et chats (étape 6) ; règlement 2017", es: "VSD — Directrices para la importación de perros y gatos (paso 6); reglamento de 2017", pt: "VSD — Guidelines for the Importation of Dogs and Cats (diretrizes para a importação de cães e gatos, etapa 6); regulamento de 2017" }
  - item: { en: "Category 1 country of origin", fr: "Pays d'origine de Catégorie 1", es: "País de origen de Categoría 1", pt: "País de origem da Categoria 1" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Dogs may only be imported directly from a country listed in Category 1 of Regulation 10 (rabies-free or well-controlled), which includes the EU, UK, USA, Canada, Australia, New Zealand and many Caribbean states.", fr: "Un chien ne peut être importé directement que depuis un pays listé en Catégorie 1 du Règlement 10 (indemne de rage ou bien maîtrisée), incluant l'UE, le Royaume-Uni, les USA, le Canada, l'Australie, la Nouvelle-Zélande et de nombreux États des Caraïbes.", es: "Un perro solo puede importarse directamente desde un país listado en la Categoría 1 del Reglamento 10 (libre de rabia o bien controlada), que incluye la UE, el Reino Unido, EE. UU., Canadá, Australia, Nueva Zelanda y muchos estados del Caribe.", pt: "Os cachorros só podem ser importados diretamente de um país listado na Categoria 1 do Regulamento 10 (livre de raiva ou com a raiva bem controlada), que inclui a UE, o Reino Unido, os EUA, o Canadá, a Austrália, a Nova Zelândia e muitos Estados do Caribe." }
    exceptions: { en: "A dog from a country not in Category 1 must first reside for a continuous period of at least 6 months in a Category 1 country before it qualifies for entry.", fr: "Un chien venant d'un pays hors Catégorie 1 doit d'abord résider de façon continue au moins 6 mois dans un pays de Catégorie 1 avant d'être éligible.", es: "Un perro procedente de un país fuera de la Categoría 1 debe residir primero de forma continua al menos 6 meses en un país de Categoría 1 antes de poder optar a la entrada.", pt: "Um cachorro que vem de um país fora da Categoria 1 precisa antes residir por um período contínuo de pelo menos 6 meses em um país da Categoria 1 para se qualificar à entrada." }
    ref: { en: "VSD — Guidelines (Step 2, Eligibility); First Schedule, Part I, Category 1", fr: "VSD — Directives (étape 2, éligibilité) ; première annexe, partie I, Catégorie 1", es: "VSD — Directrices (paso 2, elegibilidad); primer anexo, parte I, Categoría 1", pt: "VSD — Guidelines (etapa 2, elegibilidade); primeiro anexo, parte I, Categoria 1" }
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "ISO Standard 11784 (or Annex A to 11785) microchip that can be read by an Avid or other ISO-compatible reader; the scanned number must be recorded correctly on all documents.", fr: "Puce ISO 11784 (ou Annexe A à la norme 11785) lisible par un lecteur Avid ou autre lecteur compatible ISO ; le numéro scanné doit être consigné correctement sur tous les documents.", es: "Microchip ISO 11784 (o Anexo A de la norma 11785) que pueda leerse con un lector Avid u otro lector compatible con ISO; el número escaneado debe consignarse correctamente en todos los documentos.", pt: "Microchip conforme a norma ISO 11784 (ou o anexo A da 11785), legível por um leitor Avid ou outro leitor compatível com ISO; o número lido precisa ser registrado corretamente em todos os documentos." }
    exceptions: { en: "If the chip cannot be read or is recorded incorrectly, the dog is not eligible. If the dog was vaccinated for rabies before the chip was implanted, it must be re-vaccinated after implantation.", fr: "Si la puce est illisible ou mal consignée, le chien n'est pas éligible. Si le chien a été vacciné contre la rage avant la pose de la puce, il doit être revacciné après la pose.", es: "Si el chip no puede leerse o se consigna incorrectamente, el perro no es elegible. Si el perro fue vacunado contra la rabia antes de implantarse el chip, debe revacunarse después de la implantación.", pt: "Se o chip não puder ser lido ou estiver registrado incorretamente, o cachorro não é elegível. Se o cachorro foi vacinado contra a raiva antes da implantação do chip, precisa ser revacinado depois da implantação." }
    ref: { en: "VSD — Guidelines (Step 3, Microchip requirements)", fr: "VSD — Directives (étape 3, exigences de puce)", es: "VSD — Directrices (paso 3, requisitos del microchip)", pt: "VSD — Guidelines (etapa 3, exigências de microchip)" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Inactivated (killed-virus) or recombinant rabies vaccine compliant with the WOAH/OIE Terrestrial Manual, given when the dog was at least 90 days (3 months) old and valid at the time of export. Primary vaccination must be given not less than 6 months and not more than 1 year before shipment.", fr: "Vaccin antirabique inactivé (virus tué) ou recombinant conforme au Manuel terrestre WOAH/OIE, administré quand le chien avait au moins 90 jours (3 mois) et valide au moment de l'export. La primo-vaccination doit être administrée au moins 6 mois et au plus 1 an avant l'expédition.", es: "Vacuna antirrábica inactivada (virus muerto) o recombinante conforme al Manual Terrestre de la WOAH/OIE, administrada cuando el perro tenía al menos 90 días (3 meses) y válida en el momento de la exportación. La primovacunación debe administrarse no menos de 6 meses y no más de 1 año antes del envío.", pt: "Vacina antirrábica inativada (vírus morto) ou recombinante em conformidade com o Manual Terrestre da WOAH/OIE, aplicada quando o cachorro tinha pelo menos 90 dias (3 meses) de vida e válida no momento da exportação. A primovacinação precisa ser aplicada no mínimo 6 meses e no máximo 1 ano antes do embarque." }
    exceptions: { en: "Vaccines with 3-year validity are accepted. For an older dog with an unbroken history, a booster given within the year before shipment is accepted with the most recent certificate.", fr: "Les vaccins à validité de 3 ans sont acceptés. Pour un chien âgé au suivi continu, un rappel administré dans l'année précédant l'expédition est accepté avec le certificat le plus récent.", es: "Se aceptan las vacunas con valide de 3 años. Para un perro mayor con un historial continuo, se acepta un refuerzo administrado dentro del año anterior al envío junto con el certificado más reciente.", pt: "Vacinas com validade de 3 anos são aceitas. Para um cachorro mais velho com histórico ininterrupto, aceita-se um reforço aplicado no ano anterior ao embarque, junto com o certificado mais recente." }
    ref: { en: "VSD — Guidelines (Step 4 & Step 5, Rabies)", fr: "VSD — Directives (étapes 4 et 5, rage)", es: "VSD — Directrices (pasos 4 y 5, rabia)", pt: "VSD — Guidelines (etapas 4 e 5, raiva)" }
  - item: { en: "Rabies antibody test (FAVN)", fr: "Titrage antirabique (FAVN)", es: "Prueba de titulación de rabia (FAVN)", pt: "Teste sorológico antirrábico (FAVN)" }
    required: { en: "Required", fr: "Requis", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Fluorescent Antibody Virus Neutralization (FAVN) test at an OIE/WHO-approved rabies laboratory, result at least 0.5 IU/ml. The dog is eligible for entry not less than 3 months and not more than 12 months after the blood sample was drawn.", fr: "Test de séroneutralisation par immunofluorescence (FAVN) dans un laboratoire antirabique agréé OIE/OMS, résultat d'au moins 0,5 UI/ml. Le chien est éligible au plus tôt 3 mois et au plus tard 12 mois après le prélèvement sanguin.", es: "Prueba de seroneutralización por anticuerpos fluorescentes (FAVN) en un laboratorio antirrábico aprobado por la OIE/OMS, resultado de al menos 0,5 UI/ml. El perro es elegible para la entrada no antes de 3 meses ni después de 12 meses desde la extracción de la muestra de sangre.", pt: "Teste de soroneutralização por imunofluorescência (FAVN) em laboratório antirrábico aprovado pela OIE/OMS, com resultado de pelo menos 0,5 UI/ml. O cachorro fica elegível à entrada no mínimo 3 meses e no máximo 12 meses depois da coleta da amostra de sangue." }
    exceptions: { en: "A result below 0.5 IU/ml is not acceptable: the dog must be re-vaccinated and re-tested. The lab report (in English, on letterhead) must show the microchip number, blood-draw date and test result.", fr: "Un résultat inférieur à 0,5 UI/ml est refusé : le chien doit être revacciné et retesté. Le rapport de laboratoire (en anglais, à en-tête) doit indiquer le numéro de puce, la date de prélèvement et le résultat.", es: "Un resultado inferior a 0,5 UI/ml no es aceptable: el perro debe revacunarse y repetir la prueba. El informe de laboratorio (en inglés, con membrete) debe indicar el número de microchip, la fecha de extracción y el resultado.", pt: "Um resultado abaixo de 0,5 UI/ml não é aceito: o cachorro precisa ser revacinado e testado de novo. O laudo do laboratório (em inglês, em papel timbrado) precisa mostrar o número do microchip, a data da coleta de sangue e o resultado do teste." }
    ref: { en: "VSD — Guidelines (Step 4, Rabies antibody test)", fr: "VSD — Directives (étape 4, titrage antirabique)", es: "VSD — Directrices (paso 4, prueba de titulación de rabia)", pt: "VSD — Guidelines (etapa 4, teste sorológico antirrábico)" }
  - item: { en: "Parasite treatments (internal & external)", fr: "Traitements antiparasitaires (internes & externes)", es: "Tratamientos antiparasitarios (internos y externos)", pt: "Tratamentos antiparasitários (internos e externos)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorios", pt: "Obrigatório" }
    when: { en: "Helminths: faecal exam and two broad-spectrum treatments at least 14 days apart, the last 7 days before export. External parasites: two treatments, the first 30 days before shipment and the second within 48 hours of export. Heartworm and leptospirosis treatment/vaccination also required.", fr: "Helminthes : examen fécal et deux traitements à large spectre à au moins 14 jours d'intervalle, le dernier 7 jours avant l'export. Parasites externes : deux traitements, le premier 30 jours avant l'expédition et le second dans les 48 heures avant l'export. Traitement/vaccination contre la dirofilariose et la leptospirose également exigés.", es: "Helmintos: examen fecal y dos tratamientos de amplio espectro con al menos 14 días de diferencia, el último 7 días antes de la exportación. Parásitos externos: dos tratamientos, el primero 30 días antes del envío y el segundo dentro de las 48 horas previas a la exportación. También se exige tratamiento/vacunación contra la dirofilariosis y la leptospirosis.", pt: "Helmintos: exame de fezes e dois tratamentos de amplo espectro com pelo menos 14 dias de intervalo, sendo o último 7 dias antes da exportação. Parasitas externos: dois tratamentos, o primeiro 30 dias antes do embarque e o segundo nas 48 horas anteriores à exportação. Também são exigidos tratamento/vacinação contra dirofilariose e leptospirose." }
    exceptions: { en: "Product names, active ingredients, dose rates and dates must be stated on the certificate; the dog must be certified free of external parasites at each treatment.", fr: "Noms des produits, principes actifs, doses et dates doivent figurer sur le certificat ; le chien doit être certifié indemne de parasites externes à chaque traitement.", es: "Los nombres de los productos, principios activos, dosis y fechas deben figurar en el certificado; el perro debe certificarse libre de parásitos externos en cada tratamiento.", pt: "Os nomes dos produtos, os princípios ativos, as doses e as datas precisam constar do certificado; o cachorro precisa ser atestado livre de parasitas externos em cada tratamento." }
    ref: { en: "VSD — Guidelines (Step 5, Test and vaccination requirements)", fr: "VSD — Directives (étape 5, exigences de tests et vaccinations)", es: "VSD — Directrices (paso 5, requisitos de pruebas y vacunas)", pt: "VSD — Guidelines (etapa 5, exigências de exames e vacinação)" }
  - item: { en: "Disease tests & core vaccinations", fr: "Tests de maladies & vaccins de base", es: "Pruebas de enfermedades y vacunas básicas", pt: "Exames de doenças e vacinas essenciais" }
    required: { en: "Required", fr: "Requis", es: "Obligatorias", pt: "Obrigatório" }
    when: { en: "Negative tests for Leishmania infantum, Ehrlichia, Babesia, Borrelia (Lyme), Brucella canis, and a heartworm antigen test for dogs 6 months or older; core vaccination against distemper, parvovirus, adenovirus (hepatitis/CAV-2) and parainfluenza. The dog must be examined and found fit for travel within 24 hours of export.", fr: "Tests négatifs pour Leishmania infantum, Ehrlichia, Babesia, Borrelia (Lyme), Brucella canis, et test antigénique de dirofilariose pour les chiens de 6 mois et plus ; vaccination de base contre la maladie de Carré, la parvovirose, l'adénovirus (hépatite/CAV-2) et la parainfluenza. Le chien doit être examiné et jugé apte au voyage dans les 24 heures avant l'export.", es: "Pruebas negativas de Leishmania infantum, Ehrlichia, Babesia, Borrelia (enfermedad de Lyme) y Brucella canis, y una prueba de antígenos de dirofilariosis para perros de 6 meses o más; vacunación básica contra el moquillo, el parvovirus, el adenovirus (hepatitis/CAV-2) y la parainfluenza. El perro debe ser examinado y declarado apto para viajar dentro de las 24 horas previas a la exportación.", pt: "Testes negativos para Leishmania infantum, Ehrlichia, Babesia, Borrelia (Lyme) e Brucella canis, além de teste de antígeno de dirofilariose para cachorros de 6 meses ou mais; vacinação essencial contra cinomose, parvovirose, adenovírus (hepatite/CAV-2) e parainfluenza. O cachorro precisa ser examinado e considerado apto a viajar nas 24 horas anteriores à exportação." }
    exceptions: { en: "The exact test list depends on origin and is confirmed on the import permit; each laboratory report must be signed and stamped by the official veterinarian.", fr: "La liste exacte des tests dépend de l'origine et est confirmée sur le permis d'importation ; chaque rapport de laboratoire doit être signé et tamponné par le vétérinaire officiel.", es: "La lista exacta de pruebas depende del origen y se confirma en el permiso de importación; cada informe de laboratorio debe estar firmado y sellado por el veterinario oficial.", pt: "A lista exata de exames depende da origem e é confirmada na autorização de importação; cada laudo de laboratório precisa ser assinado e carimbado pelo veterinário oficial." }
    ref: { en: "VSD — Guidelines (Step 5, Test and vaccination requirements)", fr: "VSD — Directives (étape 5, exigences de tests et vaccinations)", es: "VSD — Directrices (paso 5, requisitos de pruebas y vacunas)", pt: "VSD — Guidelines (etapa 5, exigências de exames e vacinação)" }
  - item: { en: "Official export health certificate", fr: "Certificat sanitaire d'export officiel", es: "Certificado sanitario de exportación oficial", pt: "Atestado de saúde oficial de exportação" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Model veterinary health certificate for import into Jamaica, completed by an official veterinarian of the exporting country, in English, with every page signed and stamped. If issued by an accredited vet, it must be endorsed by the exporting country's official veterinary department.", fr: "Certificat sanitaire vétérinaire modèle pour l'import en Jamaïque, rempli par un vétérinaire officiel du pays exportateur, en anglais, chaque page signée et tamponnée. S'il est établi par un vétérinaire accrédité, il doit être visé par le service vétérinaire officiel du pays exportateur.", es: "Certificado sanitario veterinario modelo para la importación a Jamaica, cumplimentado por un veterinario oficial del país exportador, en inglés, con todas las páginas firmadas y selladas. Si lo expide un veterinario acreditado, debe estar refrendado por el departamento veterinario oficial del país exportador.", pt: "Atestado de saúde veterinário modelo para importação na Jamaica, preenchido por um veterinário oficial do país exportador, em inglês, com todas as páginas assinadas e carimbadas. Se for emitido por um veterinário credenciado, precisa ser endossado pelo departamento veterinário oficial do país exportador." }
    exceptions: { en: "Corrections must be struck through, remain legible and be signed/stamped; correction fluid is not allowed. The original must accompany the dog.", fr: "Les corrections doivent être barrées, rester lisibles et être signées/tamponnées ; le blanc correcteur est interdit. L'original doit accompagner le chien.", es: "Las correcciones deben tacharse, seguir siendo legibles y estar firmadas/selladas; no se permite el líquido corrector. El original debe acompañar al perro.", pt: "As correções precisam ser feitas com um risco, continuar legíveis e ser assinadas/carimbadas; corretivo líquido não é permitido. O original precisa acompanhar o cachorro." }
    ref: { en: "VSD — Guidelines (Step 8, Veterinary export health certificate)", fr: "VSD — Directives (étape 8, certificat sanitaire d'export)", es: "VSD — Directrices (paso 8, certificado sanitario de exportación)", pt: "VSD — Guidelines (etapa 8, atestado de saúde veterinário de exportação)" }
  - item: { en: "Advance notification of arrival", fr: "Notification préalable d'arrivée", es: "Notificación previa de llegada", pt: "Aviso prévio de chegada" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Give the Director of Veterinary Services at least 3 weeks' notice of arrival, then a 48-hour confirmation. Submit the Animal Landing Notification Form at least 2 days before arrival with owner, broker, date/time and flight details.", fr: "Préviens le directeur des services vétérinaires au moins 3 semaines avant l'arrivée, puis confirme 48 heures avant. Soumets le formulaire de notification d'atterrissage animal au moins 2 jours avant l'arrivée avec propriétaire, courtier, date/heure et détails du vol.", es: "Avisa al director de servicios veterinarios con al menos 3 semanas de antelación a la llegada y confirma 48 horas antes. Presenta el formulario de notificación de desembarque de animales al menos 2 días antes de la llegada con los datos del propietario, el agente, la fecha/hora y el vuelo.", pt: "Avise o Director of Veterinary Services (diretor dos serviços veterinários) com pelo menos 3 semanas de antecedência da chegada e depois confirme 48 horas antes. Envie o Animal Landing Notification Form (formulário de notificação de desembarque de animais) pelo menos 2 dias antes da chegada, com dono, despachante, data/hora e dados do voo." }
    exceptions: { en: "Notify the Jamaica Customs Agency of the pending arrival and confirm applicable customs fees before release.", fr: "Préviens la Jamaica Customs Agency de l'arrivée imminente et confirme les frais de douane applicables avant la remise de l'animal.", es: "Notifica a la Jamaica Customs Agency la llegada prevista y confirma las tasas aduaneras aplicables antes de la entrega del animal.", pt: "Informe a Jamaica Customs Agency (alfândega jamaicana) sobre a chegada prevista e confirme as taxas aduaneiras aplicáveis antes da liberação." }
    ref: { en: "VSD — Guidelines (Step 7, Notification of arrival; Step 10)", fr: "VSD — Directives (étape 7, notification d'arrivée ; étape 10)", es: "VSD — Directrices (paso 7, notificación de llegada; paso 10)", pt: "VSD — Guidelines (etapa 7, notificação de chegada; etapa 10)" }
  - item: { en: "Entry point & transport", fr: "Point d'entrée & transport", es: "Punto de entrada y transporte", pt: "Ponto de entrada e transporte" }
    required: { en: "Kingston only", fr: "Kingston uniquement", es: "Solo Kingston", pt: "Somente Kingston" }
    when: { en: "The dog must arrive directly into Kingston (unless the Chief Veterinary Officer authorizes otherwise), as manifested cargo, in a crate that meets the applicable requirements. Except for service dogs, all dogs are checked at the freight terminal, not the passenger terminal.", fr: "Le chien doit arriver directement à Kingston (sauf autorisation contraire du chef des services vétérinaires), en fret manifesté, dans une caisse conforme aux exigences applicables. Sauf pour les chiens d'assistance, tous les chiens sont contrôlés au terminal de fret, pas au terminal passagers.", es: "El perro debe llegar directamente a Kingston (salvo que el jefe de servicios veterinarios autorice otra cosa), como carga manifestada, en una jaula conforme a los requisitos aplicables. Salvo los perros de asistencia, todos los perros se controlan en la terminal de carga, no en la de pasajeros.", pt: "O cachorro precisa chegar diretamente a Kingston (salvo autorização em contrário do Chief Veterinary Officer), como carga manifestada, em caixa de transporte. Salvo os cães de assistência, todos os cachorros são conferidos no terminal de cargas, não no terminal de passageiros." }
    exceptions: { en: "Transit/transhipment via Jamaica needs prior VSD authorization and the dog must not leave the international/air side of the airport.", fr: "Le transit/transbordement via la Jamaïque nécessite l'autorisation préalable de la VSD et le chien ne doit pas quitter la zone internationale de l'aéroport.", es: "El tránsito/transbordo vía Jamaica requiere autorización previa de la VSD y el perro no debe abandonar la zona internacional/aérea del aeropuerto.", pt: "O trânsito/transbordo pela Jamaica exige autorização prévia da VSD, e o cachorro não pode sair da zona internacional (lado ar) do aeroporto." }
    ref: { en: "VSD — Guidelines (Step 9, Travel to Jamaica; Step 12, Transit)", fr: "VSD — Directives (étape 9, voyage vers la Jamaïque ; étape 12, transit)", es: "VSD — Directrices (paso 9, viaje a Jamaica; paso 12, tránsito)", pt: "VSD — Guidelines (etapa 9, viagem para a Jamaica; etapa 12, trânsito)" }
  - item: { en: "Quarantine (Plumb Point, Kingston)", fr: "Quarantaine (Plumb Point, Kingston)", es: "Cuarentena (Plumb Point, Kingston)", pt: "Quarentena (Plumb Point, Kingston)" }
    required: { en: "Required — at least 14 days", fr: "Requise — au moins 14 jours", es: "Obligatoria — al menos 14 días", pt: "Obrigatória — no mínimo 14 dias" }
    when: { en: "On entry, dogs must undergo at least 14 days of quarantine at the National Quarantine Facility, Plumb Point. An official veterinarian examines the dog and checks documents before determining release or continued quarantine.", fr: "À l'entrée, les chiens doivent subir au moins 14 jours de quarantaine au centre national de quarantaine de Plumb Point. Un vétérinaire officiel examine le chien et contrôle les documents avant de décider de la remise ou du maintien en quarantaine.", es: "A su entrada, los perros deben someterse a al menos 14 días de cuarentena en el National Quarantine Facility de Plumb Point. Un veterinario oficial examina al perro y revisa los documentos antes de decidir la liberación o la continuación de la cuarentena.", pt: "Na entrada, os cachorros precisam cumprir pelo menos 14 dias de quarentena na National Quarantine Facility (unidade nacional de quarentena) de Plumb Point. Um veterinário oficial examina o cachorro e confere os documentos antes de decidir pela liberação ou pela continuidade da quarentena." }
    exceptions: { en: "A registered service dog, or a dog under an approved pet travel scheme, may be transported to an inspector-approved place at the owner's expense subject to conditions (site inspected ~14 days before, no other dogs/cats present).", fr: "Un chien d'assistance enregistré, ou un chien relevant d'un régime de voyage approuvé, peut être transporté vers un lieu agréé par l'inspecteur aux frais du propriétaire sous conditions (site inspecté ~14 jours avant, aucun autre chien/chat présent).", es: "Un perro de asistencia registrado, o un perro bajo un régimen de viaje de mascotas aprobado, puede trasladarse a un lugar aprobado por el inspector a cargo del propietario, sujeto a condiciones (lugar inspeccionado ~14 días antes, sin otros perros/gatos presentes).", pt: "Um cão de assistência registrado, ou um cachorro sob um regime de viagem aprovado, pode ser levado a um local aprovado pelo inspetor, às custas do dono e sob condições (local vistoriado ~14 dias antes, sem outros cães/gatos presentes)." }
    ref: { en: "VSD — Guidelines (Step 11, Post entry and quarantine)", fr: "VSD — Directives (étape 11, post-entrée et quarantaine)", es: "VSD — Directrices (paso 11, posentrada y cuarentena)", pt: "VSD — Guidelines (etapa 11, pós-entrada e quarentena)" }
  - item: { en: "Age, pregnancy & eligibility", fr: "Âge, gestation & éligibilité", es: "Edad, gestación y elegibilidad", pt: "Idade, gestação e elegibilidade" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "The dog must not be under quarantine restrictions, pregnant, or suckling young at the time of export. Because rabies vaccination requires the dog to be at least 90 days old, plus the antibody test and 3-month wait, imported dogs are effectively well over 6 months old.", fr: "Le chien ne doit pas être sous restriction de quarantaine, gestant, ni allaitant au moment de l'export. Comme le vaccin antirabique exige un chien d'au moins 90 jours, plus le titrage et les 3 mois d'attente, un chien importé a en pratique bien plus de 6 mois.", es: "El perro no debe estar sujeto a restricciones de cuarentena, ni estar gestante o amamantando crías en el momento de la exportación. Como la vacunación antirrábica exige que el perro tenga al menos 90 días, más la prueba de titulación y la espera de 3 meses, un perro importado tiene en la práctica bastante más de 6 meses.", pt: "No momento da exportação, o cachorro não pode estar sob restrições de quarentena, gestante nem amamentando filhotes. Como a vacinação antirrábica exige que o cachorro tenha pelo menos 90 dias de vida, somados o teste sorológico e os 3 meses de espera, na prática os cachorros importados têm bem mais de 6 meses." }
    exceptions: { en: "There is no reduced procedure for young puppies.", fr: "Aucune procédure allégée pour les jeunes chiots.", es: "No existe un procedimiento reducido para cachorros jóvenes.", pt: "Não existe procedimento simplificado para filhotes novos." }
    ref: { en: "VSD — Guidelines (Step 2, Eligibility)", fr: "VSD — Directives (étape 2, éligibilité)", es: "VSD — Directrices (paso 2, elegibilidad)", pt: "VSD — Guidelines (etapa 2, elegibilidade)" }

origin:
  scheme: eu
  eu:
    title: { en: "European Union — in Category 1, full scheme applies", fr: "Union européenne — en Catégorie 1, régime complet applicable", es: "Unión Europea — en Categoría 1, se aplica el régimen completo", pt: "União Europeia — na Categoria 1, regime completo aplicável" }
    body:
      en: "European Union Member States are listed in Category 1, so a dog can be imported directly from the EU. However, Jamaica does not recognise the EU pet passport as a shortcut: you follow the full national procedure — Veterinary Import Permit, ISO microchip, rabies vaccination, a FAVN antibody test (≥0.5 IU/ml) with the 3-to-12-month window, parasite treatments and disease tests, an official export health certificate, arrival as cargo into Kingston and at least 14 days of quarantine."
      fr: "Les États membres de l'Union européenne figurent en Catégorie 1, un chien peut donc être importé directement depuis l'UE. Toutefois, la Jamaïque ne reconnaît pas le passeport européen comme raccourci : tu suis la procédure nationale complète — permis d'importation vétérinaire, puce ISO, vaccination antirabique, test FAVN (≥0,5 UI/ml) avec la fenêtre de 3 à 12 mois, traitements antiparasitaires et tests de maladies, certificat sanitaire d'export officiel, arrivée en fret à Kingston et au moins 14 jours de quarantaine."
      es: "Los Estados miembros de la Unión Europea están listados en la Categoría 1, por lo que un perro puede importarse directamente desde la UE. Sin embargo, Jamaica no reconoce el pasaporte europeo como atajo: debes seguir el procedimiento nacional completo — permiso de importación veterinario, microchip ISO, vacunación antirrábica, una prueba de titulación FAVN (≥0,5 UI/ml) con la ventana de 3 a 12 meses, tratamientos antiparasitarios y pruebas de enfermedades, un certificado sanitario de exportación oficial, llegada como carga a Kingston y al menos 14 días de cuarentena."
      pt: "Os Estados membros da União Europeia estão listados na Categoria 1, então um cachorro pode ser importado diretamente da UE. No entanto, a Jamaica não reconhece o passaporte europeu para animais como atalho: você segue o procedimento nacional completo — autorização veterinária de importação, microchip ISO, vacinação antirrábica, teste sorológico FAVN (≥0,5 UI/ml) com a janela de 3 a 12 meses, tratamentos antiparasitários e exames de doenças, atestado de saúde oficial de exportação, chegada como carga em Kingston e pelo menos 14 dias de quarentena."
    cls: warn
  listed:
    title: { en: "Category 1 approved countries", fr: "Pays approuvés de Catégorie 1", es: "Países aprobados de Categoría 1", pt: "Países aprovados da Categoria 1" }
    body:
      en: "Category 1 covers countries recognised as rabies-free or where rabies is well-controlled — including the United Kingdom, United States, Canada, Australia, New Zealand, and Caribbean neighbours such as Barbados, the Bahamas, Trinidad and Tobago and the Cayman Islands. From any of these, your dog can be imported directly, subject to the same full procedure: import permit, microchip, rabies vaccination and FAVN antibody test, treatments, official health certificate, cargo arrival into Kingston and at least 14 days of quarantine."
      fr: "La Catégorie 1 couvre les pays reconnus indemnes de rage ou où la rage est bien maîtrisée — dont le Royaume-Uni, les États-Unis, le Canada, l'Australie, la Nouvelle-Zélande, et des voisins des Caraïbes comme la Barbade, les Bahamas, Trinité-et-Tobago et les îles Caïmans. Depuis l'un d'eux, ton chien peut être importé directement, sous réserve de la même procédure complète : permis, puce, vaccination antirabique et test FAVN, traitements, certificat sanitaire officiel, arrivée en fret à Kingston et au moins 14 jours de quarantaine."
      es: "La Categoría 1 abarca los países reconocidos como libres de rabia o donde la rabia está bien controlada — incluidos el Reino Unido, Estados Unidos, Canadá, Australia, Nueva Zelanda, y vecinos del Caribe como Barbados, las Bahamas, Trinidad y Tobago y las islas Caimán. Desde cualquiera de ellos, tu perro puede importarse directamente, sujeto al mismo procedimiento completo: permiso de importación, microchip, vacunación antirrábica y prueba de titulación FAVN, tratamientos, certificado sanitario oficial, llegada como carga a Kingston y al menos 14 días de cuarentena."
      pt: "A Categoria 1 abrange os países reconhecidos como livres de raiva ou onde a raiva está bem controlada — incluindo Reino Unido, Estados Unidos, Canadá, Austrália, Nova Zelândia e vizinhos do Caribe como Barbados, Bahamas, Trinidad e Tobago e Ilhas Cayman. De qualquer um deles, seu cachorro pode ser importado diretamente, sujeito ao mesmo procedimento completo: autorização de importação, microchip, vacinação antirrábica e teste sorológico FAVN, tratamentos, atestado de saúde oficial, chegada como carga em Kingston e pelo menos 14 dias de quarentena."
    cls: warn
  nonListed:
    title: { en: "Countries not in Category 1 — six-month residency first", fr: "Pays hors Catégorie 1 — six mois de résidence d'abord", es: "Países fuera de la Categoría 1 — primero seis meses de residencia", pt: "Países fora da Categoria 1 — seis meses de residência primeiro" }
    body:
      en: "A dog from a country that is not listed in Category 1 cannot be imported directly into Jamaica. It must first live in a Category 1 country for a continuous period of at least six months, and only then may it qualify — completing all the Category 1 steps (permit, microchip, rabies vaccination and FAVN test, treatments, certificate) from that approved country. Confirm your dog's eligibility with the VSD before making any plans."
      fr: "Un chien venant d'un pays non listé en Catégorie 1 ne peut pas être importé directement en Jamaïque. Il doit d'abord résider de façon continue au moins six mois dans un pays de Catégorie 1, et ce n'est qu'alors qu'il peut devenir éligible — en accomplissant toutes les étapes de Catégorie 1 (permis, puce, vaccination antirabique et test FAVN, traitements, certificat) depuis ce pays approuvé. Confirme l'éligibilité de ton chien auprès de la VSD avant tout projet."
      es: "Un perro procedente de un país que no esté listado en la Categoría 1 no puede importarse directamente a Jamaica. Debe primero vivir de forma continua al menos seis meses en un país de Categoría 1, y solo entonces puede optar a la importación — completando todos los pasos de la Categoría 1 (permiso, microchip, vacunación antirrábica y prueba FAVN, tratamientos, certificado) desde ese país aprobado. Confirma la elegibilidad de tu perro con la VSD antes de hacer cualquier plan."
      pt: "Um cachorro que vem de um país não listado na Categoria 1 não pode ser importado diretamente para a Jamaica. Ele precisa antes morar em um país da Categoria 1 por um período contínuo de pelo menos seis meses e só então pode se qualificar — cumprindo todas as etapas da Categoria 1 (autorização, microchip, vacinação antirrábica e teste FAVN, tratamentos, certificado) a partir desse país aprovado. Confirme a elegibilidade do seu cachorro com a VSD antes de fazer qualquer plano."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Jamaica is tightly controlled by the Veterinary Services Division and Jamaica Customs."
    fr: "Ce qui se passe à l'arrivée de ton chien en Jamaïque est étroitement contrôlé par la Veterinary Services Division et la douane jamaïcaine."
    es: "Lo que ocurre cuando tu perro llega a Jamaica está estrictamente controlado por la Veterinary Services Division y la aduana jamaicana."
    pt: "O que acontece quando seu cachorro chega à Jamaica é rigorosamente controlado pela Veterinary Services Division e pela alfândega jamaicana."
  points:
    - en: "Your dog must arrive directly into Kingston as manifested cargo in a travel crate; except for service dogs, it is handled at the freight terminal, not the passenger terminal."
      fr: "Ton chien doit arriver directement à Kingston en fret manifesté dans une caisse de transport ; sauf pour les chiens d'assistance, il est pris en charge au terminal de fret, pas au terminal passagers."
      es: "Tu perro debe llegar directamente a Kingston como carga manifestada en una jaula de transporte; salvo los perros de asistencia, se gestiona en la terminal de carga, no en la de pasajeros."
      pt: "Seu cachorro precisa chegar diretamente a Kingston como carga manifestada, em caixa de transporte; salvo no caso de cães de assistência, ele é atendido no terminal de cargas, não no terminal de passageiros."
    - en: "As far as practicable, arrive during working hours (8:30 a.m.–5:00 p.m. Mon–Thu, 8:30 a.m.–4:00 p.m. Fri); arrivals outside these hours attract extra fees."
      fr: "Dans la mesure du possible, arrive pendant les heures ouvrables (8h30–17h00 du lundi au jeudi, 8h30–16h00 le vendredi) ; les arrivées hors de ces heures entraînent des frais supplémentaires."
      es: "En la medida de lo posible, llega en horario laboral (8:30–17:00 de lunes a jueves, 8:30–16:00 los viernes); las llegadas fuera de este horario conllevan tasas adicionales."
      pt: "Na medida do possível, chegue no horário de expediente (das 8h30 às 17h de segunda a quinta e das 8h30 às 16h na sexta); chegadas fora desse horário geram taxas extras."
    - en: "An official veterinarian examines the dog, verifies it is healthy and free of listed diseases, and carries out a full documentary check against the import permit."
      fr: "Un vétérinaire officiel examine le chien, vérifie qu'il est sain et indemne des maladies listées, et effectue un contrôle documentaire complet au regard du permis d'importation."
      es: "Un veterinario oficial examina al perro, verifica que está sano y libre de las enfermedades listadas, y realiza un control documental completo cotejándolo con el permiso de importación."
      pt: "Um veterinário oficial examina o cachorro, verifica se ele está saudável e livre das doenças listadas e faz uma conferência documental completa em relação à autorização de importação."
    - en: "The dog undergoes at least 14 days of quarantine at the National Quarantine Facility, Plumb Point; the veterinarian determines release or continued quarantine."
      fr: "Le chien subit au moins 14 jours de quarantaine au centre national de quarantaine de Plumb Point ; le vétérinaire décide de la remise ou du maintien en quarantaine."
      es: "El perro pasa al menos 14 días de cuarentena en el National Quarantine Facility de Plumb Point; el veterinario decide la liberación o la continuación de la cuarentena."
      pt: "O cachorro cumpre pelo menos 14 dias de quarentena na National Quarantine Facility de Plumb Point; o veterinário decide pela liberação ou pela continuidade da quarentena."
    - en: "Carry the original endorsed health certificate, laboratory reports and the valid import permit; the dog must arrive before the permit expires."
      fr: "Munis-toi du certificat sanitaire original visé, des rapports de laboratoire et du permis d'importation valide ; le chien doit arriver avant l'expiration du permis."
      es: "Lleva el certificado sanitario original refrendado, los informes de laboratorio y el permiso de importación válido; el perro debe llegar antes de que caduque el permiso."
      pt: "Leve o atestado de saúde original endossado, os laudos de laboratório e a autorização de importação válida; o cachorro precisa chegar antes de a autorização vencer."
    - en: "A dog arriving without a valid Veterinary Import Permit is denied entry; if import guidelines are breached, the dog may be re-exported or euthanised at the owner's expense."
      fr: "Un chien arrivant sans permis d'importation vétérinaire valide se voit refuser l'entrée ; en cas de non-respect des directives, le chien peut être réexpédié ou euthanasié aux frais du propriétaire."
      es: "A un perro que llegue sin un permiso de importación veterinario válido se le deniega la entrada; si se incumplen las directrices de importación, el perro puede ser reexportado o sacrificado a cargo del propietario."
      pt: "Um cachorro que chega sem uma autorização veterinária de importação válida tem a entrada negada; em caso de descumprimento das diretrizes de importação, o cachorro pode ser reexportado ou sofrer eutanásia às custas do dono."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Jamaica bans the import of certain dog breeds and all hybrids under the Animals Diseases (Importation) Control (Amendment) Regulations, 2017, on top of the biosecurity procedure."
    fr: "La Jamaïque interdit l'importation de certaines races de chiens et de tous les hybrides au titre du règlement Animals Diseases (Importation) Control (Amendment) Regulations, 2017, en plus de la procédure de biosécurité."
    es: "Jamaica prohíbe la importación de ciertas razas de perros y de todos los híbridos en virtud del reglamento Animals Diseases (Importation) Control (Amendment) Regulations, 2017, además del procedimiento de bioseguridad."
    pt: "A Jamaica proíbe a importação de certas raças de cachorro e de todos os híbridos pelas Animals Diseases (Importation) Control (Amendment) Regulations, 2017, além do procedimento de biossegurança."
  cat1:
    en: "Prohibited breeds (cannot be imported): Dogo Argentino, Fila Brasileiro, Japanese Tosa and Pit Bull Terrier. A dog belonging to one of these breeds is refused importation."
    fr: "Races interdites (importation impossible) : Dogo Argentino, Fila Brasileiro, Tosa japonais et Pit Bull Terrier. Un chien appartenant à l'une de ces races est refusé à l'importation."
    es: "Razas prohibidas (no pueden importarse): Dogo Argentino, Fila Brasileiro, Tosa japonés y Pit Bull Terrier. A un perro perteneciente a una de estas razas se le rechaza la importación."
    pt: "Raças proibidas (não podem ser importadas): dogo argentino, fila brasileiro, tosa japonês e pit bull terrier. Um cachorro de uma dessas raças tem a importação recusada."
  cat2:
    en: "Hybrids — the offspring of a domestic dog crossed with another species — are also prohibited from import into Jamaica."
    fr: "Les hybrides — descendants d'un chien domestique croisé avec une autre espèce — sont également interdits d'importation en Jamaïque."
    es: "Los híbridos — descendientes de un perro doméstico cruzado con otra especie — también tienen prohibida la importación a Jamaica."
    pt: "Os híbridos — filhotes do cruzamento de um cachorro doméstico com outra espécie — também são proibidos de importação na Jamaica."
  note:
    en: "These prohibitions are set out in the 2017 Regulations. Confirm your dog's breed eligibility with the Veterinary Services Division before making any travel arrangements."
    fr: "Ces interdictions figurent dans le règlement de 2017. Confirme l'éligibilité de la race de ton chien auprès de la Veterinary Services Division avant toute organisation de voyage."
    es: "Estas prohibiciones se establecen en el reglamento de 2017. Confirma la elegibilidad de la raza de tu perro con la Veterinary Services Division antes de organizar el viaje."
    pt: "Essas proibições constam do regulamento de 2017. Confirme com a Veterinary Services Division se a raça do seu cachorro é elegível antes de organizar qualquer viagem."

checklist:
  - en: "Confirm your dog's country is in Category 1 (or complete a 6-month residency in a Category 1 country first)"
    fr: "Vérifie que le pays de ton chien est en Catégorie 1 (ou effectuez d'abord 6 mois de résidence dans un pays de Catégorie 1)"
    es: "Confirma que el país de tu perro está en la Categoría 1 (o completa antes 6 meses de residencia en un país de Categoría 1)"
    pt: "Confirme que o país do seu cachorro está na Categoria 1 (ou cumpra antes 6 meses de residência em um país da Categoria 1)"
  - en: "Confirm your dog is not a prohibited breed (Dogo Argentino, Fila Brasileiro, Japanese Tosa, Pit Bull Terrier) or a hybrid"
    fr: "Vérifie que ton chien n'est pas une race interdite (Dogo Argentino, Fila Brasileiro, Tosa japonais, Pit Bull Terrier) ni un hybride"
    es: "Confirma que tu perro no es de una raza prohibida (Dogo Argentino, Fila Brasileiro, Tosa japonés, Pit Bull Terrier) ni un híbrido"
    pt: "Confirme que seu cachorro não é de uma raça proibida (dogo argentino, fila brasileiro, tosa japonês, pit bull terrier) nem um híbrido"
  - en: "ISO microchip (11784/11785) implanted before rabies vaccination and recorded on every document"
    fr: "Puce ISO (11784/11785) posée avant la vaccination antirabique et consignée sur chaque document"
    es: "Microchip ISO (11784/11785) implantado antes de la vacunación antirrábica y registrado en todos los documentos"
    pt: "Microchip ISO (11784/11785) implantado antes da vacinação antirrábica e registrado em todos os documentos"
  - en: "Valid rabies vaccination (dog ≥90 days at the shot), then a FAVN antibody test ≥0.5 IU/ml"
    fr: "Vaccination antirabique valide (chien ≥90 jours au vaccin), puis un test FAVN ≥0,5 UI/ml"
    es: "Vacunación antirrábica válida (perro ≥90 días en la vacuna), y luego una prueba de titulación FAVN ≥0,5 UI/ml"
    pt: "Vacinação antirrábica válida (cachorro com ≥90 dias na aplicação) e depois um teste sorológico FAVN ≥0,5 UI/ml"
  - en: "Respect the FAVN window — entry 3 to 12 months after the blood was drawn"
    fr: "Respecte la fenêtre FAVN — entrée 3 à 12 mois après le prélèvement sanguin"
    es: "Respeta la ventana FAVN — entrada de 3 a 12 meses después de la extracción de sangre"
    pt: "Respeite a janela do FAVN — entrada de 3 a 12 meses depois da coleta de sangue"
  - en: "Complete parasite treatments and disease tests within the required windows"
    fr: "Réalise les traitements antiparasitaires et tests de maladies dans les délais requis"
    es: "Completa los tratamientos antiparasitarios y las pruebas de enfermedades dentro de los plazos requeridos"
    pt: "Conclua os tratamentos antiparasitários e os exames de doenças dentro dos prazos exigidos"
  - en: "Submit the Preliminary Application Form and obtain the Veterinary Import Permit (fee J$5,000, valid 3 months)"
    fr: "Soumets le formulaire de demande préliminaire et obtiens le permis d'importation vétérinaire (frais 5 000 J$, valable 3 mois)"
    es: "Presenta el formulario de solicitud preliminar y obtén el permiso de importación veterinario (tasa de 5.000 J$, válido 3 meses)"
    pt: "Envie o Preliminary Application Form e obtenha a autorização veterinária de importação (taxa de J$ 5.000, válida por 3 meses)"
  - en: "Original official export health certificate, in English, signed and stamped on every page"
    fr: "Certificat sanitaire d'export officiel original, en anglais, signé et tamponné sur chaque page"
    es: "Certificado sanitario de exportación oficial original, en inglés, firmado y sellado en todas las páginas"
    pt: "Atestado de saúde oficial de exportação original, em inglês, assinado e carimbado em todas as páginas"
  - en: "Give 3 weeks' notice + 48-hour confirmation and submit the Animal Landing Notification Form"
    fr: "Donnez un préavis de 3 semaines + confirmation 48 heures avant et soumets le formulaire de notification d'atterrissage animal"
    es: "Da un preaviso de 3 semanas + confirmación 48 horas antes y presenta el formulario de notificación de desembarque de animales"
    pt: "Avise com 3 semanas de antecedência + confirmação 48 horas antes e envie o Animal Landing Notification Form"
  - en: "Book a flight arriving directly into Kingston as cargo; plan for at least 14 days of quarantine at Plumb Point"
    fr: "Réserve un vol arrivant directement à Kingston en fret ; prévois au moins 14 jours de quarantaine à Plumb Point"
    es: "Reserva un vuelo que llegue directamente a Kingston como carga; prevé al menos 14 días de cuarentena en Plumb Point"
    pt: "Reserve um voo que chegue diretamente a Kingston como carga; conte com pelo menos 14 dias de quarentena em Plumb Point"

