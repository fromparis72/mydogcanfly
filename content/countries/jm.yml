# Country Entry Guide — Jamaica (source of truth, bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_jm
iso2: "JM"
name: { en: "Jamaica", fr: "Jamaïque", es: "Jamaica", pt: "Jamaica" }
region: { en: "Caribbean", fr: "Caraïbes", es: "Caribe", pt: "Caribe" }


regime: listed

hero:
  h1: { en: "Traveling to Jamaica with your dog", fr: "Voyager en Jamaïque avec ton chien", es: "Viajar a Jamaica con tu perro", pt: "Viajar para a Jamaica com seu cachorro" }
  intro:
    en: >-
      Jamaica welcomes dogs, but as a rabies-free island it runs a strict import scheme managed by the
      Veterinary Services Division (VSD) of the Ministry of Agriculture, Fisheries and Mining — not the
      EU pet-passport system. Every dog needs a Veterinary Import Permit obtained in advance, and dogs
      may only be imported directly from countries listed in Category 1 (rabies-free or where rabies is
      well-controlled). A dog from a country not in Category 1 must first live in a Category 1 country
      for at least six months before it can qualify. Your dog must be microchipped, vaccinated against
      rabies, pass a rabies antibody test, complete a series of parasite treatments and disease tests,
      travel with an official export health certificate, arrive as cargo into Kingston and complete at
      least 14 days of quarantine. Plan several months of preparation before you book.
    fr: >-
      La Jamaïque accueille les chiens, mais en tant qu'île indemne de rage elle applique un régime
      d'importation strict géré par la Veterinary Services Division (VSD) du ministère de l'Agriculture,
      de la Pêche et des Mines — et non le système du passeport européen. Tout chien doit disposer d'un
      permis d'importation vétérinaire obtenu à l'avance, et un chien ne peut être importé directement
      que depuis un pays listé en Catégorie 1 (indemne de rage ou où la rage est bien maîtrisée). Un
      chien venant d'un pays hors Catégorie 1 doit d'abord résider au moins six mois dans un pays de
      Catégorie 1. Ton chien doit être pucé, vacciné contre la rage, réussir un test de titrage
      antirabique, suivre une série de traitements antiparasitaires et de tests de maladies, voyager
      avec un certificat sanitaire d'export officiel, arriver en fret à Kingston et effectuer au moins
      14 jours de quarantaine. Prévois plusieurs mois de préparation avant de réserver.
    es: >-
      Jamaica acoge a los perros, pero, al ser una isla libre de rabia, aplica un régimen de importación
      estricto gestionado por la Veterinary Services Division (VSD) del ministerio de Agricultura, Pesca
      y Minería — y no el sistema del pasaporte europeo. Todo perro necesita un permiso de importación
      veterinario obtenido con antelación, y un perro solo puede importarse directamente desde países
      listados en la Categoría 1 (libres de rabia o donde la rabia está bien controlada). Un perro
      procedente de un país fuera de la Categoría 1 debe primero vivir al menos seis meses en un país de
      Categoría 1 antes de poder optar a la importación. Tu perro debe llevar microchip, estar vacunado
      contra la rabia, superar una prueba de titulación de rabia, completar una serie de tratamientos
      antiparasitarios y pruebas de enfermedades, viajar con un certificado sanitario de exportación
      oficial, llegar como carga a Kingston y completar al menos 14 días de cuarentena. Prevé varios
      meses de preparación antes de reservar.

    pt: "A Jamaica recebe cachorros, mas, como ilha livre de raiva, aplica um regime de importação rigoroso conduzido pela Veterinary Services Division (VSD) do Ministry of Agriculture, Fisheries and Mining (Ministério da Agricultura, Pesca e Mineração) — e não o sistema do passaporte europeu para animais. Todo cachorro precisa de uma autorização veterinária de importação (Veterinary Import Permit) obtida com antecedência, e os cachorros só podem ser importados diretamente de países listados na Categoria 1 (livres de raiva ou onde a raiva está bem controlada). Um cachorro que vem de um país fora da Categoria 1 precisa antes morar em um país da Categoria 1 por pelo menos seis meses para poder se qualificar. Seu cachorro precisa ter microchip, estar vacinado contra a raiva, passar em um teste sorológico antirrábico, cumprir uma série de tratamentos antiparasitários e exames de doenças, viajar com um atestado de saúde oficial de exportação, chegar como carga em Kingston e cumprir pelo menos 14 dias de quarentena. Conte com vários meses de preparação antes de comprar a passagem."
difficulty:
  level: difficult
  label: { en: "Difficult — permit, antibody test and quarantine required", fr: "Difficile — permis, titrage et quarantaine exigés", es: "Difícil — se exigen permiso, prueba de titulación y cuarentena", pt: "Difícil — exige autorização, teste sorológico e quarentena" }

prepTime:
  eu:
    en: "EU Member States are in Category 1, but Jamaica applies its full scheme (no EU passport shortcut): permit, rabies antibody test with a 3-month wait, treatments — allow several months."
    fr: "Les États membres de l'UE sont en Catégorie 1, mais la Jamaïque applique son régime complet (pas de raccourci passeport UE) : permis, titrage antirabique avec 3 mois d'attente, traitements — compte plusieurs mois."
    es: "Los Estados miembros de la UE están en la Categoría 1, pero Jamaica aplica su régimen completo (sin atajo de pasaporte europeo): permiso, prueba de titulación de rabia con 3 meses de espera, tratamientos — cuenta con varios meses."
    pt: "Os Estados membros da UE estão na Categoria 1, mas a Jamaica aplica o regime completo (sem atalho de passaporte europeu): autorização, teste sorológico antirrábico com 3 meses de espera, tratamentos — reserve vários meses."
  listed:
    en: "Category 1 approved countries (UK, USA, Canada, Australia, NZ, Caribbean neighbours…): several months — microchip, rabies vaccination and antibody test, treatments, certificate, permit and quarantine."
    fr: "Pays approuvés de Catégorie 1 (Royaume-Uni, USA, Canada, Australie, NZ, voisins des Caraïbes…) : plusieurs mois — puce, vaccination et titrage antirabiques, traitements, certificat, permis et quarantaine."
    es: "Países aprobados de Categoría 1 (Reino Unido, EE. UU., Canadá, Australia, Nueva Zelanda, vecinos del Caribe…): varios meses — microchip, vacunación y prueba de titulación antirrábicas, tratamientos, certificado, permiso y cuarentena."
    pt: "Países aprovados da Categoria 1 (Reino Unido, EUA, Canadá, Austrália, NZ, vizinhos do Caribe…): vários meses — microchip, vacinação e teste sorológico antirrábicos, tratamentos, certificado, autorização e quarentena."
  nonListed:
    en: "Countries not in Category 1: much longer — the dog must first live in a Category 1 country for at least six months before it can even qualify for import."
    fr: "Pays hors Catégorie 1 : bien plus long — le chien doit d'abord résider au moins six mois dans un pays de Catégorie 1 avant de pouvoir prétendre à l'importation."
    es: "Países fuera de la Categoría 1: mucho más largo — el perro debe vivir primero al menos seis meses en un país de Categoría 1 antes de poder optar siquiera a la importación."
    pt: "Países fora da Categoria 1: bem mais longo — o cachorro precisa antes morar em um país da Categoria 1 por pelo menos seis meses para sequer poder se qualificar à importação."

