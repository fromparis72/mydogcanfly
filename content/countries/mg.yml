# Country Entry Guide — Madagascar (source of truth, bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_mg
iso2: "MG"
name: { en: "Madagascar", fr: "Madagascar", es: "Madagascar", pt: "Madagascar" }
region: { en: "Africa (Indian Ocean)", fr: "Afrique (océan Indien)", es: "África (océano Índico)", pt: "África (oceano Índico)" }


regime: non_listed
exit:
  authority: DSV
  authorityUrl: https://www.minae.gov.mg/direction-des-services-veterinaires-dsv/
  intro:
    en: "Madagascar is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Direction des Services Vétérinaires (DSV)."
    fr: "Madagascar est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par la Direction des Services Vétérinaires (DSV)."
    es: "Madagascar no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por la Direction des Services Vétérinaires (DSV)."
    pt: "Madagascar é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pela Direction des Services Vétérinaires (DSV)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "An official DSV veterinarian issues the health certificate at origin, approved by the DSV officer at the airport border post before export."
        fr: "Un vétérinaire officiel de la DSV délivre le certificat sanitaire à l'origine, approuvé par l'agent DSV au poste frontière de l'aéroport avant l'export."
        es: "Un veterinario oficial de la DSV emite el certificado sanitario en origen, aprobado por el agente de la DSV en el puesto fronterizo del aeropuerto antes de exportar."
        pt: "Um veterinário oficial da DSV emite o atestado de saúde na origem, aprovado pelo agente da DSV no posto de fronteira do aeroporto antes da exportação."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Madagascar with your dog", fr: "Voyager à Madagascar avec ton chien", es: "Viajar a Madagascar con tu perro", pt: "Viajar para Madagascar com seu cachorro" }
  intro:
    en: >-
      Madagascar allows pet dogs, but entry is controlled by its own veterinary authority — the
      Direction des Services Vétérinaires (DSV) of the Ministère de l'Agriculture et de l'Élevage —
      and by the Malagasy Customs (Direction générale des douanes). Unlike rabies-free Mauritius,
      Madagascar is a large Indian-Ocean island where rabies is present, so a rabies vaccination is
      central to the file. The official customs classification for dogs and cats (heading 0106.19 40)
      states plainly that importing a dog requires a prior import authorization, and that customs
      clearance depends on presenting an anti-rabies vaccination certificate issued by the Veterinary
      Service. Several practical details — the exact vaccination timing, whether a rabies antibody
      test is required, minimum age, and any quarantine — are not clearly published in official
      Malagasy sources, so this guide marks them as unknown rather than guess. Confirm every point
      with the DSV and your veterinarian before you book.
    fr: >-
      Madagascar admet les chiens de compagnie, mais l'entrée est contrôlée par sa propre autorité
      vétérinaire — la Direction des Services Vétérinaires (DSV) du Ministère de l'Agriculture et de
      l'Élevage — et par la Douane malagasy (Direction générale des douanes). Contrairement à Maurice,
      indemne de rage, Madagascar est une grande île de l'océan Indien où la rage est présente : la
      vaccination antirabique est donc au cœur du dossier. La classification douanière officielle des
      chiens et chats (position 0106.19 40) indique clairement que l'importation d'un chien est soumise
      à une autorisation d'importation préalable et que le dédouanement est subordonné à la présentation
      d'un certificat de vaccination antirabique délivré par le Service vétérinaire. Plusieurs détails
      pratiques — le calendrier exact de vaccination, l'exigence éventuelle d'un titrage antirabique,
      l'âge minimum et une quarantaine — ne sont pas clairement publiés par les sources officielles
      malgaches : ce guide les indique donc comme non communiqués plutôt que de deviner. Confirme
      chaque point avec la DSV et ton vétérinaire avant de réserver.
    es: >-
      Madagascar admite perros de compañía, pero la entrada está controlada por su propia autoridad
      veterinaria — la Direction des Services Vétérinaires (DSV) del Ministère de l'Agriculture et de
      l'Élevage — y por la Aduana malgache (Direction générale des douanes). A diferencia de Mauricio,
      libre de rabia, Madagascar es una gran isla del océano Índico donde la rabia está presente, por lo
      que la vacunación antirrábica es fundamental en el expediente. La clasificación aduanera oficial de
      perros y gatos (partida 0106.19 40) indica claramente que importar un perro requiere una
      autorización de importación previa, y que el despacho de aduanas depende de presentar un
      certificado de vacunación antirrábica expedido por el Servicio Veterinario. Varios detalles
      prácticos — el calendario exacto de vacunación, si se exige una prueba de titulación de rabia, la
      edad mínima y una posible cuarentena — no están claramente publicados en las fuentes oficiales
      malgaches, por lo que esta guía los marca como no comunicados en lugar de suponerlos. Confirma
      cada punto con la DSV y tu veterinario antes de reservar.

    pt: "Madagascar permite cachorros de estimação, mas a entrada é controlada por sua própria autoridade veterinária — a Direction des Services Vétérinaires (DSV) do Ministère de l'Agriculture et de l'Élevage — e pela alfândega malgaxe (Direction générale des douanes). Diferentemente da Ilha Maurício, livre de raiva, Madagascar é uma grande ilha do oceano Índico onde a raiva está presente, portanto a vacinação antirrábica é central no processo. A classificação alfandegária oficial para cachorros e gatos (código 0106.19 40) declara claramente que a importação de um cachorro exige uma autorização de importação prévia, e que o desembaraço aduaneiro depende da apresentação de um certificado de vacinação antirrábica emitido pelo Serviço Veterinário. Vários detalhes práticos — o prazo exato da vacinação, se um teste sorológico antirrábico é exigido, a idade mínima e qualquer quarentena — não são claramente publicados em fontes oficiais malgaxes, portanto este guia os marca como não comunicado em vez de presumir. Confirme cada ponto com a DSV e com seu veterinário antes de reservar."
difficulty:
  level: moderate
  label: { en: "Moderate — import authorization and rabies vaccination; several details unpublished", fr: "Modérée — autorisation d'importation et vaccination antirabique ; plusieurs détails non publiés", es: "Moderada — autorización de importación y vacunación antirrábica; varios detalles no publicados", pt: "Moderada — autorização de importação e vacinação antirrábica; vários detalhes não publicados" }

prepTime:
  eu:
    en: "From Europe / the EU: allow time to obtain the DSV import authorization and a valid rabies vaccination certificate, plus a health certificate from your vet. Exact lead times are not published — start well ahead."
    fr: "Depuis l'Europe / l'UE : prévois le temps d'obtenir l'autorisation d'importation de la DSV et un certificat de vaccination antirabique valide, plus un certificat sanitaire de ton vétérinaire. Les délais exacts ne sont pas publiés — anticipe largement."
    es: "Desde Europa / la UE: prevé tiempo para obtener la autorización de importación de la DSV y un certificado de vacunación antirrábica válido, además de un certificado sanitario de tu veterinario. Los plazos exactos no están publicados — empieza con mucha antelación."
    pt: "Da Europa / da UE: reserve tempo para obter a autorização de importação da DSV e um certificado de vacinação antirrábica válido, além de um atestado de saúde do seu veterinário. Os prazos exatos não são publicados — comece com bastante antecedência."
  listed:
    en: "From another third country: the same national scheme applies — import authorization and anti-rabies vaccination certificate. Madagascar does not operate an EU-style list of approved countries."
    fr: "Depuis un autre pays tiers : le même régime national s'applique — autorisation d'importation et certificat de vaccination antirabique. Madagascar n'applique pas de liste de pays approuvés à l'européenne."
    es: "Desde otro país tercero: se aplica el mismo régimen nacional — autorización de importación y certificado de vacunación antirrábica. Madagascar no aplica una lista de países aprobados al estilo de la UE."
    pt: "De outro país terceiro: aplica-se o mesmo esquema nacional — autorização de importação e certificado de vacinação antirrábica. Madagascar não opera uma lista de países aprovados no estilo da UE."
  nonListed:
    en: "From all origins: because published details are limited, contact the DSV early to confirm your exact file; additional tests, conditions or a refusal cannot be ruled out and are set case by case."
    fr: "Depuis toute origine : les détails publiés étant limités, contacte tôt la DSV pour confirmer ton dossier exact ; des tests ou conditions supplémentaires, voire un refus, ne peuvent être exclus et sont fixés au cas par cas."
    es: "Desde cualquier origen: como los detalles publicados son limitados, contacta pronto con la DSV para confirmar tu expediente exacto; no se pueden descartar pruebas o condiciones adicionales, o incluso un rechazo, y se fijan caso por caso."
    pt: "De todas as origens: como os detalhes publicados são limitados, entre em contato com a DSV com antecedência para confirmar seu processo exato; testes adicionais, condições ou uma recusa não podem ser descartados e são definidos caso a caso."

