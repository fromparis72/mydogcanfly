factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do cachorro" }
  intro:
    en: "The exact documents depend on three things — DR Congo (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — la RD Congo (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — la RD Congo (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — a RDC (o destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — DR Congo", fr: "Pays de destination — RD Congo", es: "País de destino — RD Congo", pt: "País de destino — RDC" }
      text:
        en: "DR Congo requires, in practice, a valid rabies vaccination and an official international veterinary health certificate, inspects imported animals at approved entry points through the SQAV, and places imported animals in quarantine for a period set by the veterinary authority. Many finer points (microchip standard, rabies timing, antibody test, minimum age, quarantine duration) are not published, which is itself a planning factor."
        fr: "La RD Congo exige, en pratique, une vaccination antirabique valide et un certificat sanitaire vétérinaire international officiel, inspecte les animaux importés aux points d'entrée agréés via le SQAV, et place les animaux importés en quarantaine pour une durée fixée par l'autorité vétérinaire. De nombreux points précis (norme de puce, délais de la rage, titrage, âge minimum, durée de quarantaine) ne sont pas publiés, ce qui constitue en soi un facteur de préparation."
        es: "La RD Congo exige, en la práctica, una vacunación antirrábica válida y un certificado sanitario veterinario internacional oficial, inspecciona los animales importados en los puntos de entrada autorizados a través del SQAV y coloca a los animales importados en cuarentena durante un periodo fijado por la autoridad veterinaria. Muchos puntos concretos (norma del microchip, plazos de la rabia, prueba de titulación, edad mínima, duración de la cuarentena) no se publican, lo que constituye en sí mismo un factor de planificación."
        pt: "A RDC exige, na prática, uma vacinação antirrábica válida e um atestado de saúde veterinário internacional oficial, inspeciona os animais importados em pontos de entrada aprovados por meio do SQAV, e coloca os animais importados em quarentena por um período definido pela autoridade veterinária. Muitos pontos mais específicos (padrão de microchip, calendário da raiva, teste sorológico, idade mínima, duração da quarentena) não são publicados, o que em si é um fator a considerar no planejamento."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The country of departure decides which official certificate your vet uses and which veterinary authority endorses it. DR Congo publishes no country-specific model, and for the United States USDA/APHIS has no dog/cat certificate for DR Congo — so the departure country's own official international veterinary certificate, endorsed by its competent authority, is used, and the importer may need to obtain an import permit from a Congolese ministry first."
        fr: "Le pays de départ détermine le certificat officiel utilisé par ton vétérinaire et l'autorité vétérinaire qui le vise. La RD Congo ne publie aucun modèle propre à un pays, et pour les États-Unis l'USDA/APHIS ne dispose d'aucun certificat chiens/chats pour la RD Congo — c'est donc le certificat vétérinaire international officiel du pays de départ, visé par son autorité compétente, qui est utilisé, l'importateur pouvant devoir obtenir au préalable un permis d'importation auprès d'un ministère congolais."
        es: "El país de salida determina qué certificado oficial utiliza tu veterinario y qué autoridad veterinaria lo refrenda. La RD Congo no publica ningún modelo específico por país y, para Estados Unidos, el USDA/APHIS no dispone de certificado de perros/gatos para la RD Congo — así que se utiliza el certificado veterinario internacional oficial del propio país de salida, refrendado por su autoridad competente, y el importador puede necesitar obtener antes un permiso de importación de un ministerio congoleño."
        pt: "O país de partida determina qual certificado oficial o veterinário utiliza e qual autoridade veterinária o endossa. A RDC não publica um modelo específico por país, e para os Estados Unidos o USDA/APHIS não possui certificado para cachorros/gatos com destino à RDC — portanto, usa-se o próprio certificado veterinário internacional oficial do país de partida, endossado pela sua autoridade competente, e o importador pode precisar antes obter uma autorização de importação junto a um ministério congolês."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde o cachorro esteve recentemente" }
      text:
        en: "A recent stay in a country with a poor animal-health status or an active disease-control measure can change what DR Congo's veterinary services accept, because it is your dog's real origin and history that matter for a rabies-endemic destination, not only the last airport. The SQAV inspector can refuse an animal that presents a risk to human, animal or plant health."
        fr: "Un séjour récent dans un pays au statut sanitaire dégradé ou sous mesure active de lutte contre une maladie peut modifier ce que les services vétérinaires congolais acceptent, car c'est l'origine réelle et l'historique du chien qui comptent pour une destination où la rage est endémique, pas seulement le dernier aéroport. L'inspecteur du SQAV peut refuser un animal présentant un risque pour la santé humaine, animale ou végétale."
        es: "Una estancia reciente en un país con un estatus sanitario deficiente o bajo una medida activa de control de enfermedades puede cambiar lo que aceptan los servicios veterinarios de la RD Congo, porque lo que cuenta para un destino donde la rabia es endémica es el origen y el historial reales de tu perro, no solo el último aeropuerto. El inspector del SQAV puede rechazar a un animal que presente un riesgo para la salud humana, animal o vegetal."
        pt: "Uma estadia recente em um país com situação sanitária animal desfavorável ou com medida ativa de controle de doenças pode mudar o que os serviços veterinários da RDC aceitam, pois o que importa para um destino de raiva endêmica é a origem real e o histórico do cachorro, não apenas o último aeroporto. O inspetor do SQAV pode recusar um animal que represente risco para a saúde humana, animal ou vegetal."
  note:
    en: "So read the requirements below as DR Congo's general framework, then confirm your dog's exact origin, history and the current documents with your vet and the SQAV before booking."
    fr: "Lis donc les exigences ci-dessous comme le cadre général congolais, puis confirme l'origine et l'historique exacts de ton chien ainsi que les documents en vigueur avec ton vétérinaire et le SQAV avant de réserver."
    es: "Así que lee los requisitos siguientes como el marco general de la RD Congo y luego confirma el origen y el historial exactos de tu perro, así como los documentos vigentes, con tu veterinario y el SQAV antes de reservar."
    pt: "Portanto, ler as exigências abaixo como o quadro geral da RDC e, em seguida, confirmar a origem exata, o histórico do cachorro e os documentos vigentes com o veterinário e com o SQAV antes de reservar."

requirements:
  - item: { en: "Microchip (identification)", fr: "Puce électronique (identification)", es: "Microchip (identificación)", pt: "Microchip (identificação)" }
    required: { en: "Not published (Unknown)", fr: "Non publiée (Non communiqué)", es: "No publicado (Desconocido)", pt: "Não publicado (não informado)" }
    when: { en: "No official Congolese source specifies a microchip or an identification standard for importing a pet dog. The ISO 11784/11785 chip is the international norm and is strongly recommended so the animal can be matched to its certificate, but DR Congo does not publish it as a stand-alone obligation.", fr: "Aucune source officielle congolaise ne précise de puce ou de norme d'identification pour l'importation d'un chien de compagnie. La puce ISO 11784/11785 est la référence internationale et est fortement recommandée pour que l'animal corresponde à son certificat, mais la RD Congo ne la publie pas comme obligation autonome.", es: "Ninguna fuente oficial congoleña especifica un microchip ni una norma de identificación para importar un perro de compañía. El chip ISO 11784/11785 es la norma internacional y se recomienda encarecidamente para que el animal pueda vincularse a su certificado, pero la RD Congo no lo publica como obligación autónoma.", pt: "Nenhuma fonte oficial congolesa especifica um microchip ou um padrão de identificação para a importação de um cachorro de companhia. O chip ISO 11784/11785 é a norma internacional e é fortemente recomendado, para que o animal possa ser correspondido ao seu certificado, mas a RDC não o publica como uma obrigação autônoma." }
    exceptions: { en: "Unknown — confirm the required identification with the SQAV and the Ministry of Agriculture, Fisheries and Livestock.", fr: "Non communiqué — confirme l'identification requise auprès du SQAV et du Ministère de l'Agriculture, de la Pêche et de l'Élevage.", es: "Desconocido — confirma la identificación requerida con el SQAV y el Ministerio de Agricultura, Pesca y Ganadería.", pt: "Não comunicado — confirmar a identificação exigida com o SQAV e com o Ministério da Agricultura, Pesca e Pecuária." }
    ref: { en: "No official published requirement found (SQAV / Ministry of Agriculture)", fr: "Aucune exigence officielle publiée trouvée (SQAV / Ministère de l'Agriculture)", es: "No se encontró ningún requisito oficial publicado (SQAV / Ministerio de Agricultura)", pt: "Nenhuma exigência oficial publicada encontrada (SQAV / Ministério da Agricultura)" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required in practice; timing and validity unpublished", fr: "Requise en pratique ; délais et validité non publiés", es: "Obligatoria en la práctica; plazos y valide no publicados", pt: "Obrigatória na prática; calendário e validade não publicados" }
    when: { en: "DR Congo lies in a rabies-endemic region, so a valid rabies vaccination recorded by the vet is expected for import and for the international veterinary certificate. The exact minimum waiting period after vaccination and the validity window are not published in any official Congolese model.", fr: "La RD Congo se situe dans une région où la rage est endémique ; une vaccination antirabique valide consignée par le vétérinaire est donc attendue à l'importation et pour le certificat vétérinaire international. Le délai minimal exact après vaccination et la fenêtre de validité ne sont publiés dans aucun modèle officiel congolais.", es: "La RD Congo se encuentra en una región donde la rabia es endémica, por lo que se espera una vacunación antirrábica válida registrada por el veterinario para la importación y para el certificado veterinario internacional. El periodo mínimo exacto de espera tras la vacunación y la ventana de valide no se publican en ningún modelo oficial congoleño.", pt: "A RDC está numa região de raiva endêmica, por isso é esperada uma vacinação antirrábica válida, registrada pelo veterinário, para a importação e para o certificado veterinário internacional. O período mínimo exato de carência após a vacinação e o prazo de validade não são publicados em nenhum modelo oficial congolês." }
    exceptions: { en: "Unknown — confirm the exact rabies timing with your vet and the SQAV.", fr: "Non communiqué — confirme les délais exacts de la rage avec ton vétérinaire et le SQAV.", es: "Desconocido — confirma los plazos exactos de la rabia con tu veterinario y el SQAV.", pt: "Não comunicado — confirmar o calendário exato da raiva com o veterinário e com o SQAV." }
    ref: { en: "General animal-health framework (Decree of 28 July 1938 on animal health police); no published import model", fr: "Cadre général de police sanitaire (Décret du 28 juillet 1938 sur la police sanitaire des animaux) ; aucun modèle d'importation publié", es: "Marco general de sanidad animal (Decreto del 28 de julio de 1938 sobre la policía sanitaria animal); no hay modelo de importación publicado", pt: "Quadro geral de saúde animal (Décret de 28 de julho de 1938 sobre a polícia sanitária animal); nenhum modelo de importação publicado" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not published (Unknown)", fr: "Non publié (Non communiqué)", es: "No publicada (Desconocido)", pt: "Não publicado (não informado)" }
    when: { en: "No official Congolese source requires a rabies antibody test for importing a dog, and none excludes it either. Because nothing is published, treat it as unknown and confirm before travel.", fr: "Aucune source officielle congolaise n'exige de titrage des anticorps antirabiques pour l'importation d'un chien, et aucune ne l'exclut non plus. Rien n'étant publié, considère ce point comme non communiqué et confirme avant le voyage.", es: "Ninguna fuente oficial congoleña exige una prueba de titulación de rabia para importar un perro, y ninguna la excluye tampoco. Como no se publica nada, considéralo desconocido y confírmalo antes de viajar.", pt: "Nenhuma fonte oficial congolesa exige um teste sorológico antirrábico para a importação de um cachorro, e nenhuma o exclui tampouco. Como nada é publicado, tratar como não comunicado e confirmar antes da viagem." }
    exceptions: { en: "Unknown — a specific origin's authority could still request one; confirm with your vet.", fr: "Non communiqué — l'autorité d'une origine spécifique pourrait tout de même en demander un ; confirme avec ton vétérinaire.", es: "Desconocido — la autoridad de un origen concreto podría solicitarla igualmente; confírmalo con tu veterinario.", pt: "Não comunicado — a autoridade de uma origem específica ainda pode solicitá-lo; confirmar com o veterinário." }
    ref: { en: "No official published requirement found (SQAV / Ministry of Agriculture)", fr: "Aucune exigence officielle publiée trouvée (SQAV / Ministère de l'Agriculture)", es: "No se encontró ningún requisito oficial publicado (SQAV / Ministerio de Agricultura)", pt: "Nenhuma exigência oficial publicada encontrada (SQAV / Ministério da Agricultura)" }
  - item: { en: "Official international veterinary health certificate", fr: "Certificat sanitaire vétérinaire international officiel", es: "Certificado sanitario veterinario internacional oficial", pt: "Atestado de saúde veterinário internacional oficial" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Congolese animal-health law provides that the veterinary authority publishes the list of animals and animal products that require an international veterinary certificate before importation. In practice an official international veterinary health certificate issued and endorsed by the veterinary authority of the country of departure must accompany the dog. DR Congo publishes no country-specific model, so the origin's own endorsed international certificate is used. French is acceptable, DR Congo being a francophone country.", fr: "La loi congolaise de police sanitaire prévoit que l'autorité vétérinaire publie la liste des animaux et produits animaux exigeant un certificat vétérinaire international avant l'importation. En pratique, un certificat sanitaire vétérinaire international officiel établi et visé par l'autorité vétérinaire du pays de départ doit accompagner le chien. La RD Congo ne publie aucun modèle propre à un pays ; c'est donc le certificat international visé de l'origine qui est utilisé. Le français est accepté, la RD Congo étant un pays francophone.", es: "La ley de sanidad animal congoleña establece que la autoridad veterinaria publica la lista de animales y productos animales que requieren un certificado veterinario internacional antes de la importación. En la práctica, un certificado sanitario veterinario internacional oficial expedido y refrendado por la autoridad veterinaria del país de salida debe acompañar al perro. La RD Congo no publica ningún modelo específico por país, así que se utiliza el propio certificado internacional refrendado del origen. El francés es aceptable, al ser la RD Congo un país francófono.", pt: "A legislação congolesa de saúde animal prevê que a autoridade veterinária publica a lista de animais e produtos de origem animal que exigem um certificado veterinário internacional antes da importação. Na prática, um atestado de saúde veterinário internacional oficial, emitido e endossado pela autoridade veterinária do país de partida, deve acompanhar o cachorro. A RDC não publica um modelo específico por país, portanto usa-se o próprio certificado internacional endossado da origem. O francês é aceito, já que a RDC é um país francófono." }
    exceptions: { en: "None — an endorsed certificate should accompany every dog; confirm the exact wording accepted by DR Congo.", fr: "Aucune — un certificat visé doit accompagner chaque chien ; confirme la rédaction exacte acceptée par la RD Congo.", es: "Ninguna — un certificado refrendado debe acompañar a cada perro; confirma la redacción exacta que acepta la RD Congo.", pt: "Nenhuma — um certificado endossado deve acompanhar todo cachorro; confirmar o texto exato aceito pela RDC." }
    ref: { en: "Decree of 28 July 1938 on animal health police (international veterinary certificate for listed imports); USDA/APHIS — Export Live Animals to DR Congo", fr: "Décret du 28 juillet 1938 sur la police sanitaire des animaux (certificat vétérinaire international pour les importations listées) ; USDA/APHIS — Exportation d'animaux vivants vers la RD Congo", es: "Decreto del 28 de julio de 1938 sobre la policía sanitaria animal (certificado veterinario internacional para importaciones listadas); USDA/APHIS — Exportación de animales vivos a la RD Congo", pt: "Décret de 28 de julho de 1938 sobre a polícia sanitária animal (certificado veterinário internacional para importações listadas); USDA/APHIS — Export Live Animals to DR Congo" }
  - item: { en: "Parasite / tapeworm treatment", fr: "Traitement antiparasitaire / contre les ténias", es: "Tratamiento antiparasitario / contra la tenia", pt: "Tratamento antiparasitário / contra tênias" }
    required: { en: "Not published (Unknown)", fr: "Non publié (Non communiqué)", es: "No publicado (Desconocido)", pt: "Não publicado (não informado)" }
    when: { en: "No official Congolese source specifies an internal or external parasite or tapeworm treatment for importing a pet dog. A vet may still advise one as good practice.", fr: "Aucune source officielle congolaise ne précise de traitement antiparasitaire interne ou externe ni contre les ténias pour l'importation d'un chien de compagnie. Un vétérinaire peut néanmoins en conseiller un par bonne pratique.", es: "Ninguna fuente oficial congoleña especifica un tratamiento antiparasitario interno o externo ni contra la tenia para importar un perro de compañía. Un veterinario puede aconsejarlo igualmente como buena práctica.", pt: "Nenhuma fonte oficial congolesa especifica um tratamento antiparasitário interno ou externo ou contra tênias para a importação de um cachorro de companhia. Um veterinário ainda pode recomendá-lo como boa prática." }
    exceptions: { en: "Unknown.", fr: "Non communiqué.", es: "Desconocido.", pt: "Não informado." }
    ref: { en: "No official published requirement found (SQAV / Ministry of Agriculture)", fr: "Aucune exigence officielle publiée trouvée (SQAV / Ministère de l'Agriculture)", es: "No se encontró ningún requisito oficial publicado (SQAV / Ministerio de Agricultura)", pt: "Nenhuma exigência oficial publicada encontrada (SQAV / Ministério da Agricultura)" }
  - item: { en: "Import authorization / permit", fr: "Autorisation / permis d'importation", es: "Autorización / permiso de importación", pt: "Autorização / permissão de importação" }
    required: { en: "Framework exists; need for a personal pet unclear", fr: "Cadre existant ; nécessité pour un animal personnel incertaine", es: "Existe un marco; la necesidad para una mascota personal no está clara", pt: "Quadro existente; necessidade para um cachorro de companhia particular não está clara" }
    when: { en: "USDA/APHIS advises that, where no export certificate is published, the importer apply for an import permit at the appropriate Congolese ministry, which will outline the specific requirements. Congolese law also lets the authority prohibit imports deemed dangerous and defines approved entry points. Whether a traveller's accompanying pet needs an individual permit is not clearly stated.", fr: "L'USDA/APHIS conseille, en l'absence de certificat d'exportation publié, que l'importateur demande un permis d'importation auprès du ministère congolais compétent, qui précisera les exigences. La loi congolaise permet aussi à l'autorité d'interdire les importations jugées dangereuses et définit les points d'entrée agréés. La nécessité d'un permis individuel pour l'animal de compagnie accompagné d'un voyageur n'est pas clairement établie.", es: "El USDA/APHIS aconseja que, cuando no se publica ningún certificado de exportación, el importador solicite un permiso de importación en el ministerio congoleño competente, que detallará los requisitos específicos. La ley congoleña también permite a la autoridad prohibir las importaciones consideradas peligrosas y define los puntos de entrada autorizados. No se indica con claridad si la mascota que acompaña a un viajero necesita un permiso individual.", pt: "O USDA/APHIS orienta que, quando nenhum certificado de exportação é publicado, o importador solicite uma autorização de importação junto ao ministério congolês competente, que definirá as exigências específicas. A legislação congolesa também permite que a autoridade proíba importações consideradas perigosas e define os pontos de entrada aprovados. Não fica claro se o cachorro de um viajante que o acompanha precisa de uma autorização individual." }
    exceptions: { en: "Unknown for personal pets — confirm with the SQAV and the Ministry of Agriculture, Fisheries and Livestock before travel.", fr: "Non communiqué pour les animaux personnels — confirme auprès du SQAV et du Ministère de l'Agriculture, de la Pêche et de l'Élevage avant le voyage.", es: "Desconocido para mascotas personales — confirma con el SQAV y el Ministerio de Agricultura, Pesca y Ganadería antes de viajar.", pt: "Não comunicado para animais de companhia particulares — confirmar com o SQAV e com o Ministério da Agricultura, Pesca e Pecuária antes da viagem." }
    ref: { en: "USDA/APHIS — Export Live Animals to DR Congo (apply for import permit); Decree No. 05/161 of 18 Nov 2005 (SQAV)", fr: "USDA/APHIS — Exportation d'animaux vivants vers la RD Congo (demander un permis d'importation) ; Décret n° 05/161 du 18 novembre 2005 (SQAV)", es: "USDA/APHIS — Exportación de animales vivos a la RD Congo (solicitar permiso de importación); Decreto n.º 05/161 del 18 de noviembre de 2005 (SQAV)", pt: "USDA/APHIS — Export Live Animals to DR Congo (solicitar autorização de importação); Décret n° 05/161 de 18 de novembro de 2005 (SQAV)" }
  - item: { en: "Border veterinary inspection (SQAV)", fr: "Inspection vétérinaire frontalière (SQAV)", es: "Inspección veterinaria fronteriza (SQAV)", pt: "Inspeção veterinária de fronteira (SQAV)" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "The Animal and Plant Quarantine Service (SQAV) ensures zoosanitary surveillance and inspects animals and products of animal origin on arrival at approved entry points; it works with the customs administration (DGDA). The competent inspector can refuse an animal that presents a risk to human, animal or plant health. Present your dog and its documents at the point of entry.", fr: "Le Service de Quarantaine Animale et Végétale (SQAV) assure la surveillance zoosanitaire et inspecte les animaux et produits d'origine animale à l'arrivée aux points d'entrée agréés ; il collabore avec l'administration douanière (DGDA). L'inspecteur compétent peut refuser un animal présentant un risque pour la santé humaine, animale ou végétale. Présente ton chien et ses documents au point d'entrée.", es: "El Servicio de Cuarentena Animal y Vegetal (SQAV) garantiza la vigilancia zoosanitaria e inspecciona los animales y los productos de origen animal a su llegada en los puntos de entrada autorizados; trabaja con la administración de aduanas (DGDA). El inspector competente puede rechazar a un animal que presente un riesgo para la salud humana, animal o vegetal. Presenta a tu perro y sus documentos en el punto de entrada.", pt: "O Serviço de Quarentena Animal e Vegetal (SQAV) assegura a vigilância zoossanitária e inspeciona animais e produtos de origem animal na chegada aos pontos de entrada aprovados; atua junto à administração aduaneira (DGDA). O inspetor competente pode recusar um animal que represente risco para a saúde humana, animal ou vegetal. Apresentar o cachorro e seus documentos no ponto de entrada." }
    exceptions: { en: "Exact steps and fees for a personal pet at the airport are not published; confirm with the SQAV.", fr: "Les étapes et frais exacts pour un animal de compagnie personnel à l'aéroport ne sont pas publiés ; confirme auprès du SQAV.", es: "Los pasos y las tasas exactos para una mascota personal en el aeropuerto no se publican; confirma con el SQAV.", pt: "As etapas exatas e as taxas para um cachorro de companhia particular no aeroporto não são publicadas; confirmar com o SQAV." }
    ref: { en: "Decree No. 05/161 of 18 Nov 2005 (SQAV); DGDA — customs control of animal-origin goods", fr: "Décret n° 05/161 du 18 novembre 2005 (SQAV) ; DGDA — contrôle douanier des produits d'origine animale", es: "Decreto n.º 05/161 del 18 de noviembre de 2005 (SQAV); DGDA — control aduanero de mercancías de origen animal", pt: "Décret n° 05/161 de 18 de novembro de 2005 (SQAV); DGDA — controle aduaneiro de mercadorias de origem animal" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Not published (Unknown)", fr: "Non publié (Non communiqué)", es: "No publicada (Desconocido)", pt: "Não publicado (não informado)" }
    when: { en: "No stand-alone minimum age is published. In practice a puppy must be old enough to be validly vaccinated against rabies, but DR Congo does not publish a specific age.", fr: "Aucun âge minimum autonome n'est publié. En pratique, un chiot doit être en âge d'être valablement vacciné contre la rage, mais la RD Congo ne publie pas d'âge spécifique.", es: "No se publica ninguna edad mínima autónoma. En la práctica, un cachorro debe tener la edad suficiente para ser vacunado válidamente contra la rabia, pero la RD Congo no publica una edad específica.", pt: "Nenhuma idade mínima autônoma é publicada. Na prática, o filhote deve ter idade suficiente para ser validamente vacinado contra a raiva, mas a RDC não publica uma idade específica." }
    exceptions: { en: "Unknown — confirm with your vet and the SQAV.", fr: "Non communiqué — confirme avec ton vétérinaire et le SQAV.", es: "Desconocido — confirma con tu veterinario y el SQAV.", pt: "Não comunicado — confirmar com o veterinário e com o SQAV." }
    ref: { en: "No official published minimum age (SQAV / Ministry of Agriculture)", fr: "Aucun âge minimum officiel publié (SQAV / Ministère de l'Agriculture)", es: "No hay edad mínima oficial publicada (SQAV / Ministerio de Agricultura)", pt: "Nenhuma idade mínima oficial publicada (SQAV / Ministério da Agricultura)" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Required by law; duration set by the veterinary authority", fr: "Imposée par la loi ; durée fixée par l'autorité vétérinaire", es: "Obligatoria por ley; duración fijada por la autoridad veterinaria", pt: "Obrigatória por lei; duração definida pela autoridade veterinária" }
    when: { en: "Congolese law provides that imported animals must be placed in quarantine for a period determined by the veterinary authority before being released into the country. The exact duration and where it is served for a compliant pet dog are not published — confirm them with the SQAV before travel.", fr: "La loi congolaise prévoit que les animaux importés doivent être placés en quarantaine pour une durée déterminée par l'autorité vétérinaire avant leur mise en circulation dans le pays. La durée exacte et le lieu de la quarantaine pour un chien de compagnie conforme ne sont pas publiés — confirme-les auprès du SQAV avant le voyage.", es: "La ley congoleña establece que los animales importados deben colocarse en cuarentena durante un periodo determinado por la autoridad veterinaria antes de ser liberados en el país. La duración exacta y el lugar donde se cumple para un perro de compañía que cumple los requisitos no se publican — confírmalos con el SQAV antes de viajar.", pt: "A legislação congolesa prevê que os animais importados devem ser colocados em quarentena por um período determinado pela autoridade veterinária antes de serem liberados no país. A duração exata e o local de cumprimento para um cachorro de companhia em conformidade não são publicados — confirmar com o SQAV antes da viagem." }
    exceptions: { en: "Unknown — the published rule sets no fixed duration; the veterinary authority decides case by case.", fr: "Non communiqué — la règle publiée ne fixe pas de durée ; l'autorité vétérinaire décide au cas par cas.", es: "Desconocido — la norma publicada no fija una duración; la autoridad veterinaria decide caso por caso.", pt: "Não comunicado — a regra publicada não fixa uma duração; a autoridade veterinária decide caso a caso." }
    ref: { en: "Decree No. 05/161 of 18 Nov 2005 (SQAV) — quarantine of imported animals", fr: "Décret n° 05/161 du 18 novembre 2005 (SQAV) — quarantaine des animaux importés", es: "Decreto n.º 05/161 del 18 de noviembre de 2005 (SQAV) — cuarentena de animales importados", pt: "Décret n° 05/161 de 18 de novembro de 2005 (SQAV) — quarentena de animais importados" }
  - item: { en: "Banned / restricted breeds", fr: "Races interdites / restreintes", es: "Razas prohibidas / restringidas", pt: "Raças proibidas / restritas" }
    required: { en: "No published import ban found", fr: "Aucune interdiction d'importation publiée", es: "No se encontró ninguna prohibición de importación publicada", pt: "Nenhuma proibição de importação publicada foi encontrada" }
    when: { en: "No official Congolese breed-specific import ban was found. Entry appears to be controlled by health requirements, inspection and quarantine, not by breed.", fr: "Aucune interdiction d'importation par race officielle congolaise n'a été trouvée. L'entrée semble encadrée par les exigences sanitaires, l'inspection et la quarantaine, non par la race.", es: "No se encontró ninguna prohibición de importación congoleña específica por raza. La entrada parece estar controlada por los requisitos sanitarios, la inspección y la cuarentena, no por la raza.", pt: "Nenhuma proibição de importação específica por raça foi encontrada em fontes oficiais congolesas. A entrada parece ser controlada por exigências sanitárias, inspeção e quarentena, e não por raça." }
    exceptions: { en: "Unknown — no published list confirms or excludes any breed; verify with the SQAV.", fr: "Non communiqué — aucune liste publiée ne confirme ni n'exclut de race ; vérifie auprès du SQAV.", es: "Desconocido — ninguna lista publicada confirma ni excluye ninguna raza; verifica con el SQAV.", pt: "Não comunicado — nenhuma lista publicada confirma ou exclui qualquer raça; verificar com o SQAV." }
    ref: { en: "No official published breed legislation found (SQAV / Ministry of Agriculture)", fr: "Aucune législation par race officielle publiée trouvée (SQAV / Ministère de l'Agriculture)", es: "No se encontró ninguna legislación oficial por raza publicada (SQAV / Ministerio de Agricultura)", pt: "Nenhuma legislação oficial sobre raças publicada encontrada (SQAV / Ministério da Agricultura)" }

origin:
  scheme: eu
  eu:
    title: { en: "From the European Union", fr: "Depuis l'Union européenne", es: "Desde la Unión Europea", pt: "Da União Europeia" }
    body:
      en: "DR Congo is a non-EU third country and does not run the EU pet-passport scheme, and it publishes no EU-specific certificate model. In practice a dog leaving the EU needs a microchip, a valid rabies vaccination and an official international veterinary health certificate issued and endorsed by the EU country's competent veterinary authority close to departure. On arrival the animal is inspected by the SQAV and may be quarantined for a period set by the veterinary authority. Because the exact EU→DR Congo requirements are not published, confirm them with your official vet and the SQAV before you travel."
      fr: "La RD Congo est un pays tiers hors UE et n'applique pas le dispositif de passeport pour animal de compagnie de l'UE ; elle ne publie aucun modèle de certificat propre à l'UE. En pratique, un chien quittant l'UE a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire vétérinaire international officiel établi et visé par l'autorité vétérinaire compétente du pays de l'UE peu avant le départ. À l'arrivée, l'animal est inspecté par le SQAV et peut être placé en quarantaine pour une durée fixée par l'autorité vétérinaire. Les exigences exactes UE→RD Congo n'étant pas publiées, confirme-les avec ton vétérinaire officiel et le SQAV avant de voyager."
      es: "La RD Congo es un país tercero fuera de la UE y no aplica el sistema de pasaporte europeo para mascotas, ni publica ningún modelo de certificado específico para la UE. En la práctica, un perro que sale de la UE necesita un microchip, una vacunación antirrábica válida y un certificado sanitario veterinario internacional oficial expedido y refrendado por la autoridad veterinaria competente del país de la UE poco antes de la salida. A la llegada, el animal es inspeccionado por el SQAV y puede quedar en cuarentena durante un periodo fijado por la autoridad veterinaria. Como los requisitos exactos UE→RD Congo no se publican, confírmalos con tu veterinario oficial y el SQAV antes de viajar."
      pt: "A RDC é um país terceiro fora da UE e não opera o esquema de passaporte europeu para animais de estimação, e não publica um modelo de certificado específico para a UE. Na prática, um cachorro que sai da UE precisa de um microchip, de uma vacinação antirrábica válida e de um atestado de saúde veterinário internacional oficial, emitido e endossado pela autoridade veterinária competente do país da UE perto da partida. Na chegada, o animal é inspecionado pelo SQAV e pode ser colocado em quarentena por um período definido pela autoridade veterinária. Como as exigências exatas UE→RDC não são publicadas, confirmar com o veterinário oficial e com o SQAV antes de viajar."
    cls: warn
  listed:
    title: { en: "From the United States — no published certificate", fr: "Depuis les États-Unis — aucun certificat publié", es: "Desde Estados Unidos — sin certificado publicado", pt: "Dos Estados Unidos — nenhum certificado publicado" }
    body:
      en: "USDA/APHIS lists DR Congo export certificates only for cattle, bovine germplasm and poultry — there is no dog or cat certificate. APHIS advises that the importer apply for an import permit at the appropriate Congolese ministry, which will most likely outline the specific requirements. In practice a USDA-accredited vet would still issue an international veterinary health certificate for the dog, endorsed by USDA, but the entry conditions must be confirmed with the Congolese authorities first, and quarantine on arrival should be expected."
      fr: "L'USDA/APHIS ne publie de certificats d'exportation vers la RD Congo que pour les bovins, la génétique bovine et la volaille — il n'existe aucun certificat chiens ou chats. L'APHIS conseille que l'importateur demande un permis d'importation auprès du ministère congolais compétent, qui précisera vraisemblablement les exigences. En pratique, un vétérinaire agréé USDA établirait tout de même un certificat sanitaire vétérinaire international pour le chien, visé par l'USDA, mais les conditions d'entrée doivent d'abord être confirmées auprès des autorités congolaises, et une quarantaine à l'arrivée est à prévoir."
      es: "El USDA/APHIS solo enumera certificados de exportación a la RD Congo para bovinos, material genético bovino y aves de corral — no hay certificado de perros ni de gatos. APHIS aconseja que el importador solicite un permiso de importación en el ministerio congoleño competente, que muy probablemente detallará los requisitos específicos. En la práctica, un veterinario acreditado por el USDA expediría igualmente un certificado sanitario veterinario internacional para el perro, refrendado por el USDA, pero las condiciones de entrada deben confirmarse primero con las autoridades congoleñas, y cabe esperar una cuarentena a la llegada."
      pt: "O USDA/APHIS lista certificados de exportação para a RDC apenas para bovinos, material genético bovino e aves — não existe certificado para cachorros ou gatos. O APHIS orienta o importador a solicitar uma autorização de importação junto ao ministério congolês competente, que provavelmente definirá as exigências específicas. Na prática, um veterinário credenciado pelo USDA ainda emitiria um atestado de saúde veterinário internacional para o cachorro, endossado pelo USDA, mas as condições de entrada devem ser confirmadas antes com as autoridades congolesas, e é preciso prever quarentena na chegada."
    cls: warn
  nonListed:
    title: { en: "From other countries — general DR Congo framework", fr: "Depuis d'autres pays — cadre général congolais", es: "Desde otros países — marco general de la RD Congo", pt: "De outros países — quadro geral da RDC" }
    body:
      en: "For other origins there is no publicly posted country-specific model. The general framework still applies: a valid rabies vaccination, an official international veterinary health certificate endorsed by the origin's veterinary authority, SQAV inspection at an approved entry point and quarantine for a period set by the veterinary authority. The authority can prohibit an import deemed dangerous to human, animal or plant health. Confirm the current requirements with the SQAV and the Ministry of Agriculture, Fisheries and Livestock."
      fr: "Pour les autres origines, aucun modèle propre au pays n'est publié. Le cadre général s'applique tout de même : vaccination antirabique valide, certificat sanitaire vétérinaire international officiel visé par l'autorité vétérinaire d'origine, inspection du SQAV à un point d'entrée agréé et quarantaine pour une durée fixée par l'autorité vétérinaire. L'autorité peut interdire une importation jugée dangereuse pour la santé humaine, animale ou végétale. Confirme les exigences en vigueur auprès du SQAV et du Ministère de l'Agriculture, de la Pêche et de l'Élevage."
      es: "Para otros orígenes no hay ningún modelo específico por país publicado. El marco general se aplica igualmente: una vacunación antirrábica válida, un certificado sanitario veterinario internacional oficial refrendado por la autoridad veterinaria de origen, inspección del SQAV en un punto de entrada autorizado y cuarentena durante un periodo fijado por la autoridad veterinaria. La autoridad puede prohibir una importación considerada peligrosa para la salud humana, animal o vegetal. Confirma los requisitos vigentes con el SQAV y el Ministerio de Agricultura, Pesca y Ganadería."
      pt: "Para outras origens, não há um modelo específico por país publicado. O quadro geral continua a se aplicar: vacinação antirrábica válida, atestado de saúde veterinário internacional oficial endossado pela autoridade veterinária de origem, inspeção do SQAV em um ponto de entrada aprovado e quarentena por um período definido pela autoridade veterinária. A autoridade pode proibir uma importação considerada perigosa para a saúde humana, animal ou vegetal. Confirmar as exigências vigentes com o SQAV e com o Ministério da Agricultura, Pesca e Pecuária."
    cls: neutral

arrival:
  intro:
    en: "What happens when your dog reaches DR Congo depends on your documents and on the SQAV inspection at the point of entry."
    fr: "Ce qui se passe à l'arrivée de ton chien en RD Congo dépend de tes documents et de l'inspection du SQAV au point d'entrée."
    es: "Lo que ocurre cuando tu perro llega a la RD Congo depende de tus documentos y de la inspección del SQAV en el punto de entrada."
    pt: "O que acontece quando o cachorro chega à RDC depende dos documentos apresentados e da inspeção do SQAV no ponto de entrada."
  points:
    - en: "Present your dog for veterinary inspection at an approved entry point; the SQAV ensures zoosanitary surveillance and works alongside the customs administration (DGDA)."
      fr: "Présente ton chien à l'inspection vétérinaire à un point d'entrée agréé ; le SQAV assure la surveillance zoosanitaire et collabore avec l'administration douanière (DGDA)."
      es: "Presenta a tu perro para la inspección veterinaria en un punto de entrada autorizado; el SQAV garantiza la vigilancia zoosanitaria y trabaja junto a la administración de aduanas (DGDA)."
      pt: "Apresentar o cachorro para inspeção veterinária em um ponto de entrada aprovado; o SQAV assegura a vigilância zoossanitária e atua junto à administração aduaneira (DGDA)."
    - en: "Carry the originals: the official international veterinary health certificate, proof of rabies vaccination and any identification and import-permit document."
      fr: "Munis-toi des originaux : le certificat sanitaire vétérinaire international officiel, la preuve de vaccination antirabique et tout document d'identification et de permis d'importation."
      es: "Lleva los originales: el certificado sanitario veterinario internacional oficial, la prueba de vacunación antirrábica y cualquier documento de identificación y de permiso de importación."
      pt: "Levar os originais: o atestado de saúde veterinário internacional oficial, o comprovante de vacinação antirrábica e qualquer documento de identificação e de autorização de importação."
    - en: "Expect quarantine: Congolese law provides that imported animals are placed in quarantine for a period determined by the veterinary authority before being released — confirm the practical arrangements for a pet dog with the SQAV in advance."
      fr: "Anticipe la quarantaine : la loi congolaise prévoit que les animaux importés sont placés en quarantaine pour une durée déterminée par l'autorité vétérinaire avant leur mise en circulation — confirme à l'avance les modalités pratiques pour un chien de compagnie auprès du SQAV."
      es: "Cuenta con la cuarentena: la ley congoleña establece que los animales importados se colocan en cuarentena durante un periodo determinado por la autoridad veterinaria antes de ser liberados — confirma con antelación las modalidades prácticas para un perro de compañía con el SQAV."
      pt: "Prever quarentena: a legislação congolesa determina que os animais importados sejam colocados em quarentena por um período determinado pela autoridade veterinária antes de serem liberados — confirmar com antecedência as condições práticas para um cachorro de companhia com o SQAV."
    - en: "If documents are missing, incomplete or invalid, the inspector can refuse the animal, which presents a risk to human, animal or plant health; the exact consequences are not published, so avoid any gap in your paperwork."
      fr: "Si les documents manquent, sont incomplets ou invalides, l'inspecteur peut refuser l'animal présentant un risque pour la santé humaine, animale ou végétale ; les conséquences exactes ne sont pas publiées, évite donc toute lacune dans ton dossier."
      es: "Si faltan documentos o están incompletos o no son válidos, el inspector puede rechazar al animal, que presenta un riesgo para la salud humana, animal o vegetal; las consecuencias exactas no se publican, así que evita cualquier laguna en tu documentación."
      pt: "Se os documentos estiverem incompletos, ausentes ou inválidos, o inspetor pode recusar o animal, que representa risco para a saúde humana, animal ou vegetal; as consequências exatas não são publicadas, portanto é melhor evitar qualquer lacuna na documentação."
    - en: "Because DR Congo publishes little, confirm entry-point procedures with the SQAV, the Ministry of Agriculture, Fisheries and Livestock and your airline before departure."
      fr: "La RD Congo publiant peu, confirme les procédures au point d'entrée avec le SQAV, le Ministère de l'Agriculture, de la Pêche et de l'Élevage et ta compagnie aérienne avant le départ."
      es: "Como la RD Congo publica poco, confirma los procedimientos del punto de entrada con el SQAV, el Ministerio de Agricultura, Pesca y Ganadería y tu aerolínea antes de la salida."
      pt: "Como a RDC publica pouco, confirmar os procedimentos no ponto de entrada com o SQAV, com o Ministério da Agricultura, Pesca e Pecuária e com a companhia aérea antes da partida."

travellerExperience: null

restrictedDogs:
  intro:
    en: "No official Congolese breed-specific import ban was found in published government sources. Entry appears to be controlled by veterinary health requirements, inspection and quarantine, not by breed."
    fr: "Aucune interdiction d'importation par race officielle congolaise n'a été trouvée dans les sources gouvernementales publiées. L'entrée semble encadrée par les exigences sanitaires vétérinaires, l'inspection et la quarantaine, non par la race."
    es: "No se encontró ninguna prohibición de importación congoleña específica por raza en las fuentes gubernamentales publicadas. La entrada parece estar controlada por los requisitos sanitarios veterinarios, la inspección y la cuarentena, no por la raza."
    pt: "Nenhuma proibição de importação específica por raça foi encontrada em fontes governamentais publicadas da RDC. A entrada parece ser controlada por exigências sanitárias veterinárias, inspeção e quarentena, e não por raça."
  cat1:
    en: "There is no published national list of prohibited or dangerous breeds for import. Absence of a published list is not the same as a guarantee — no official text confirms that every breed is admitted either, and the veterinary authority can prohibit an import it deems dangerous."
    fr: "Il n'existe pas de liste nationale publiée de races interdites ou dangereuses à l'importation. L'absence de liste publiée ne vaut pas garantie — aucun texte officiel ne confirme non plus que toutes les races sont admises, et l'autorité vétérinaire peut interdire une importation qu'elle juge dangereuse."
    es: "No existe una lista nacional publicada de razas prohibidas o peligrosas para la importación. La ausencia de una lista publicada no equivale a una garantía — ningún texto oficial confirma tampoco que se admita toda raza, y la autoridad veterinaria puede prohibir una importación que considere peligrosa."
    pt: "Não existe uma lista nacional publicada de raças proibidas ou perigosas para importação. A ausência de uma lista publicada não é o mesmo que uma garantia — nenhum texto oficial confirma que todas as raças sejam admitidas, e a autoridade veterinária pode proibir uma importação que considere perigosa."
  cat2:
    en: "No published 'permitted with conditions' category exists for particular breeds. Local municipal rules on keeping certain dogs, if any, are not documented in the official sources reviewed."
    fr: "Aucune catégorie « autorisée sous conditions » publiée n'existe pour des races particulières. D'éventuelles règles municipales locales sur la détention de certains chiens ne sont pas documentées dans les sources officielles consultées."
    es: "No existe ninguna categoría publicada de «permitida con condiciones» para razas concretas. Las eventuales normas municipales locales sobre la tenencia de ciertos perros no están documentadas en las fuentes oficiales consultadas."
    pt: "Não existe uma categoria publicada de \"permitido com condições\" para raças específicas. Regras municipais locais sobre a posse de determinados cachorros, se existirem, não estão documentadas nas fontes oficiais consultadas."
  note:
    en: "Because the position is unpublished rather than confirmed, verify your specific breed with the SQAV before you travel, especially for types often restricted elsewhere."
    fr: "La situation étant non publiée plutôt que confirmée, vérifie ta race précise auprès du SQAV avant de voyager, surtout pour les types souvent restreints ailleurs."
    es: "Como la situación no está publicada más que confirmada, verifica tu raza concreta con el SQAV antes de viajar, especialmente para los tipos que suelen estar restringidos en otros lugares."
    pt: "Como a posição não é publicada nem confirmada, verificar a raça específica com o SQAV antes de viajar, especialmente para tipos frequentemente restritos em outros lugares."

checklist:
  - en: "Valid rabies vaccination, current and correctly recorded (dates and vaccine)"
    fr: "Vaccination antirabique valide, à jour et correctement consignée (dates et vaccin)"
    es: "Vacunación antirrábica válida, al día y correctamente registrada (fechas y vacuna)"
    pt: "Vacinação antirrábica válida, em dia e corretamente registrada (datas e vacina)"
  - en: "Identification in order (ISO microchip strongly recommended) matching every document"
    fr: "Identification en règle (puce ISO fortement recommandée) correspondant à chaque document"
    es: "Identificación en regla (microchip ISO muy recomendado) que coincida con cada documento"
    pt: "Identificação em ordem (microchip ISO fortemente recomendado) correspondente a todos os documentos"
  - en: "Official international veterinary health certificate issued and endorsed by the origin's veterinary authority"
    fr: "Certificat sanitaire vétérinaire international officiel établi et visé par l'autorité vétérinaire d'origine"
    es: "Certificado sanitario veterinario internacional oficial expedido y refrendado por la autoridad veterinaria de origen"
    pt: "Atestado de saúde veterinário internacional oficial, emitido e endossado pela autoridade veterinária de origem"
  - en: "Ask the SQAV and the Ministry of Agriculture, Fisheries and Livestock whether an import permit applies to your accompanying pet"
    fr: "Demande au SQAV et au Ministère de l'Agriculture, de la Pêche et de l'Élevage si un permis d'importation s'applique à ton animal accompagné"
    es: "Pregunta al SQAV y al Ministerio de Agricultura, Pesca y Ganadería si un permiso de importación se aplica a tu mascota acompañante"
    pt: "Perguntar ao SQAV e ao Ministério da Agricultura, Pesca e Pecuária se uma autorização de importação se aplica ao cachorro que viaja acompanhado"
  - en: "Plan for quarantine on arrival — confirm the duration and arrangements for a pet dog with the SQAV"
    fr: "Prévois une quarantaine à l'arrivée — confirme la durée et les modalités pour un chien de compagnie auprès du SQAV"
    es: "Prevé una cuarentena a la llegada — confirma la duración y las modalidades para un perro de compañía con el SQAV"
    pt: "Prever quarentena na chegada — confirmar a duração e as condições para um cachorro de companhia com o SQAV"
  - en: "Original documents ready to present at the SQAV inspection at an approved entry point"
    fr: "Documents originaux prêts à présenter à l'inspection du SQAV à un point d'entrée agréé"
    es: "Documentos originales listos para presentar en la inspección del SQAV en un punto de entrada autorizado"
    pt: "Documentos originais prontos para apresentação na inspeção do SQAV em um ponto de entrada aprovado"
  - en: "Confirm any breed, antibody-test, parasite-treatment or minimum-age point directly with the authorities (unpublished)"
    fr: "Confirme tout point de race, titrage, traitement antiparasitaire ou âge minimum directement avec les autorités (non publié)"
    es: "Confirma cualquier punto de raza, prueba de titulación, tratamiento antiparasitario o edad mínima directamente con las autoridades (no publicado)"
    pt: "Confirmar diretamente com as autoridades qualquer ponto sobre raça, teste sorológico, tratamento antiparasitário ou idade mínima (não publicado)"
  - en: "Airline reservation confirming your dog's travel option and a suitable IATA crate"
    fr: "Réservation confirmant l'option de transport de ton chien et une caisse IATA adaptée"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y una jaula IATA adecuada"
    pt: "Reserva na companhia aérea confirmando a opção de viagem do cachorro e uma caixa de transporte adequada às normas IATA"

