notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly fornece informações gerais — não constitui aconselhamento veterinário nem jurídico."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog; DR Congo publishes very little, so also confirm directly with the SQAV and the Ministry of Agriculture, Fisheries and Livestock."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien ; la RD Congo publiant très peu, confirme aussi directement auprès du SQAV et du Ministère de l'Agriculture, de la Pêche et de l'Élevage."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro; la RD Congo publica muy poco, así que confirma también directamente con el SQAV y el Ministerio de Agricultura, Pesca y Ganadería."
    pt: "Somente um médico-veterinário pode confirmar o procedimento exato para cada cachorro; a RDC publica muito pouco, portanto também é preciso confirmar diretamente com o SQAV e com o Ministério da Agricultura, Pesca e Pecuária."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem de: país de origem, histórico de viagens anteriores, identificação, vacinas, itinerário e data da viagem."
