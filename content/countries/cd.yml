# Country Entry Guide — Democratic Republic of the Congo (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_cd
iso2: "CD"
name: { en: "Democratic Republic of the Congo", fr: "République démocratique du Congo", es: "República Democrática del Congo", pt: "República Democrática do Congo" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed

hero:
  h1: { en: "Traveling to the Democratic Republic of the Congo with your dog", fr: "Voyager en République démocratique du Congo avec ton chien", es: "Viajar a la República Democrática del Congo con tu perro", pt: "Viajar para a República Democrática do Congo com seu cachorro" }
  intro:
    en: >-
      The Democratic Republic of the Congo (DR Congo) accepts pet dogs, but it publishes very little of
      its own detail, so much of the exact procedure has to be confirmed directly with the authorities.
      The animal-health authority is the Ministry of Agriculture, Fisheries and Livestock, and the border
      control body is the Animal and Plant Quarantine Service (Service de Quarantaine Animale et Végétale,
      SQAV), created by decree in 2005 and working alongside the customs administration (Direction Générale
      des Douanes et Accises, DGDA). Congolese law requires imported animals to be presented for inspection
      at an approved entry point and to be placed in quarantine for a period set by the veterinary
      authority. In practice your dog will also need a valid rabies vaccination and an official
      international veterinary health certificate signed by the veterinary authority of the country of
      departure. DR Congo lies in a rabies-endemic region, so the rabies rule is central. Because so many
      specifics are simply not published, this guide clearly separates what an official source confirms
      from what remains unknown — always confirm the exact, current procedure with your vet and the SQAV
      before you book.
    fr: >-
      La République démocratique du Congo (RD Congo) accepte les chiens de compagnie, mais elle publie très
      peu de détails propres : une grande partie de la procédure exacte doit être confirmée directement
      auprès des autorités. L'autorité sanitaire est le Ministère de l'Agriculture, de la Pêche et de
      l'Élevage, et l'organe de contrôle aux frontières est le Service de Quarantaine Animale et Végétale
      (SQAV), créé par décret en 2005 et travaillant aux côtés de l'administration douanière (Direction
      Générale des Douanes et Accises, DGDA). La loi congolaise impose que les animaux importés soient
      présentés à l'inspection à un point d'entrée agréé et placés en quarantaine pour une durée fixée par
      l'autorité vétérinaire. En pratique, ton chien aura aussi besoin d'une vaccination antirabique
      valide et d'un certificat sanitaire vétérinaire international officiel signé par l'autorité
      vétérinaire du pays de départ. La RD Congo se situe dans une région où la rage est endémique : la
      règle antirabique est donc centrale. De nombreux points n'étant tout simplement pas publiés, ce guide
      distingue clairement ce qu'une source officielle confirme de ce qui reste inconnu — confirme
      toujours la procédure exacte et à jour avec ton vétérinaire et le SQAV avant de réserver.
    es: >-
      La República Democrática del Congo (RD Congo) acepta perros de compañía, pero publica muy pocos
      detalles propios, por lo que gran parte del procedimiento exacto debe confirmarse directamente con
      las autoridades. La autoridad sanitaria es el Ministerio de Agricultura, Pesca y Ganadería, y el
      organismo de control fronterizo es el Servicio de Cuarentena Animal y Vegetal (Service de Quarantaine
      Animale et Végétale, SQAV), creado por decreto en 2005 y que trabaja junto a la administración de
      aduanas (Direction Générale des Douanes et Accises, DGDA). La ley congoleña exige que los animales
      importados se presenten a inspección en un punto de entrada autorizado y se coloquen en cuarentena
      durante un periodo fijado por la autoridad veterinaria. En la práctica, tu perro también necesitará
      una vacunación antirrábica válida y un certificado sanitario veterinario internacional oficial
      firmado por la autoridad veterinaria del país de salida. La RD Congo se encuentra en una región donde
      la rabia es endémica, por lo que la norma antirrábica es central. Como muchos detalles simplemente no
      se publican, esta guía separa claramente lo que confirma una fuente oficial de lo que sigue siendo
      desconocido — confirma siempre el procedimiento exacto y actual con tu veterinario y el SQAV antes de
      reservar.

    pt: "A República Democrática do Congo (RDC) aceita cachorros de companhia, mas publica muito poucos detalhes próprios, de modo que boa parte do procedimento exato precisa ser confirmada diretamente com as autoridades. A autoridade de saúde animal é o Ministério da Agricultura, Pesca e Pecuária, e o órgão de controle de fronteira é o Serviço de Quarentena Animal e Vegetal (Service de Quarantaine Animale et Végétale, SQAV), criado por decreto em 2005 e que atua junto à administração aduaneira (Direction Générale des Douanes et Accises, DGDA). A legislação congolesa exige que os animais importados sejam apresentados para inspeção em um ponto de entrada aprovado e colocados em quarentena por um período definido pela autoridade veterinária. Na prática, o cachorro também precisará de uma vacinação antirrábica válida e de um atestado de saúde veterinário internacional oficial, assinado pela autoridade veterinária do país de partida. A RDC está numa região de raiva endêmica, por isso a regra da raiva é central. Como muitos detalhes simplesmente não são publicados, este guia separa claramente o que é confirmado por uma fonte oficial do que permanece não comunicado — confirmar sempre o procedimento exato e atual com o veterinário e com o SQAV antes de reservar."
difficulty:
  level: difficult
  label: { en: "Difficult — mandatory quarantine framework and very little published detail", fr: "Difficile — cadre de quarantaine obligatoire et très peu de détails publiés", es: "Difícil — marco de cuarentena obligatoria y muy pocos detalles publicados", pt: "Difícil — quadro de quarentena obrigatória e muito poucos detalhes publicados" }

prepTime:
  eu:
    en: "From the EU: DR Congo publishes no EU-specific model, so allow several weeks. Have the microchip and rabies vaccination in order, then an official EU vet issues and endorses an international veterinary health certificate close to departure. Plan for SQAV inspection and possible quarantine on arrival, and confirm the current conditions with the veterinary authority."
    fr: "Depuis l'UE : la RD Congo ne publie pas de modèle propre à l'UE, prévois donc plusieurs semaines. Mets la puce et la vaccination antirabique en règle, puis un vétérinaire officiel de l'UE établit et vise un certificat sanitaire vétérinaire international peu avant le départ. Prévois l'inspection du SQAV et une éventuelle quarantaine à l'arrivée, et confirme les conditions en vigueur auprès de l'autorité vétérinaire."
    es: "Desde la UE: la RD Congo no publica ningún modelo específico para la UE, así que reserva varias semanas. Ten el microchip y la vacunación antirrábica en regla y, después, un veterinario oficial de la UE expide y refrenda un certificado sanitario veterinario internacional poco antes de la salida. Prevé la inspección del SQAV y una posible cuarentena a la llegada, y confirma las condiciones vigentes con la autoridad veterinaria."
    pt: "Da UE: a RDC não publica um modelo específico para a UE, portanto contar com várias semanas. Deixar o microchip e a vacinação antirrábica em dia; depois, um veterinário oficial da UE emite e endossa um atestado de saúde veterinário internacional perto da partida. Prever a inspeção do SQAV e uma possível quarentena na chegada, e confirmar as condições vigentes com a autoridade veterinária."
  listed:
    en: "From the United States: USDA/APHIS publishes no dog or cat export certificate for DR Congo. APHIS advises that the importer apply for an import permit at the appropriate Congolese ministry, which will outline the requirements — allow several weeks and start with the Ministry of Agriculture, Fisheries and Livestock and the SQAV."
    fr: "Depuis les États-Unis : l'USDA/APHIS ne publie aucun certificat d'exportation de chiens ou de chats pour la RD Congo. L'APHIS conseille que l'importateur demande un permis d'importation auprès du ministère congolais compétent, qui précisera les exigences — prévois plusieurs semaines et commence par le Ministère de l'Agriculture, de la Pêche et de l'Élevage et le SQAV."
    es: "Desde Estados Unidos: el USDA/APHIS no publica ningún certificado de exportación de perros o gatos para la RD Congo. APHIS aconseja que el importador solicite un permiso de importación en el ministerio congoleño competente, que detallará los requisitos — reserva varias semanas y empieza por el Ministerio de Agricultura, Pesca y Ganadería y el SQAV."
    pt: "Dos Estados Unidos: o USDA/APHIS não publica um certificado de exportação para cachorros ou gatos com destino à RDC. O APHIS orienta o importador a solicitar uma autorização de importação junto ao ministério congolês competente, que definirá as exigências — contar com várias semanas e começar pelo Ministério da Agricultura, Pesca e Pecuária e pelo SQAV."
  nonListed:
    en: "From other origins: the same core elements apply — valid rabies vaccination, an official international veterinary certificate endorsed by the origin's authority, SQAV inspection at an approved entry point and quarantine for a period set by the veterinary authority. Timelines and the exact quarantine duration are not published, so confirm directly before booking."
    fr: "Depuis d'autres origines : les mêmes éléments de base s'appliquent — vaccination antirabique valide, certificat vétérinaire international officiel visé par l'autorité d'origine, inspection du SQAV à un point d'entrée agréé et quarantaine pour une durée fixée par l'autorité vétérinaire. Les délais et la durée exacte de quarantaine ne sont pas publiés ; confirme directement avant de réserver."
    es: "Desde otros orígenes: se aplican los mismos elementos básicos — vacunación antirrábica válida, un certificado veterinario internacional oficial refrendado por la autoridad de origen, inspección del SQAV en un punto de entrada autorizado y cuarentena durante un periodo fijado por la autoridad veterinaria. Los plazos y la duración exacta de la cuarentena no se publican, así que confírmalos directamente antes de reservar."
    pt: "De outras origens: aplicam-se os mesmos elementos essenciais — vacinação antirrábica válida, certificado veterinário internacional oficial endossado pela autoridade de origem, inspeção do SQAV em um ponto de entrada aprovado e quarentena por um período definido pela autoridade veterinária. Os prazos e a duração exata da quarentena não são publicados, portanto confirmar diretamente antes de reservar."

