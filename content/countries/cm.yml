# Country Entry Guide — Cameroon (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_cm
iso2: "CM"
name: { en: "Cameroon", fr: "Cameroun", es: "Camerún", pt: "Camarões" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
exit:
  authority: DSV (MINEPIA)
  authorityUrl: https://minepia.cm
  intro:
    en: "Cameroon is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Direction des Services Vétérinaires (MINEPIA)."
    fr: "Le Cameroun est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par la Direction des Services Vétérinaires (MINEPIA)."
    es: "Camerún no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por la Direction des Services Vétérinaires (MINEPIA)."
    pt: "Camarões é um país não listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pela Direction des Services Vétérinaires (MINEPIA)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Providenciar com antecedência o teste sorológico antirrábico (titulação): exame de sangue em laboratório aprovado pela UE, pelo menos 30 dias após a vacinação — um resultado válido é indispensável para voltar à UE e não pode ser resolvido de última hora."
    - timing: window
      scope: any
      text:
        en: "The MINEPIA Direction des Services Vétérinaires manages animal health and issues the export health certificate before departure."
        fr: "La Direction des Services Vétérinaires du MINEPIA gère la santé animale et délivre le certificat sanitaire d'export avant le départ."
        es: "La Direction des Services Vétérinaires del MINEPIA gestiona la sanidad animal y emite el certificado sanitario de exportación antes de salir."
        pt: "A Direction des Services Vétérinaires do MINEPIA administra a saúde animal e emite o atestado de saúde de exportação antes da partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o cachorro já tinha um teste sorológico antirrábico (titulação) válido para a UE antes da partida, ele permanece válido por toda a vida enquanto a vacinação antirrábica estiver em dia — vale a pena verificar isso antes de viajar."

hero:
  h1: { en: "Traveling to Cameroon with your dog", fr: "Voyager au Cameroun avec ton chien", es: "Viajar a Camerún con tu perro", pt: "Viajar para Camarões com seu cachorro" }
  intro:
    en: >-
      Cameroon accepts pet dogs, but it publishes very little detail of its own, so the clearest
      official picture comes from the veterinary health certificate its authorities have agreed with
      exporting countries. The animal-health authority is the Ministry of Livestock, Fisheries and
      Animal Industries (MINEPIA) and its Veterinary Services Branch (Direction des Services
      Vétérinaires). In practice your dog needs a microchip, a valid rabies vaccination and an official
      international veterinary health certificate signed and endorsed by the veterinary authority of the
      country of departure. Cameroon is a rabies-endemic country and every imported animal is subject to
      veterinary sanitary inspection at the border. Because many specifics are simply not published, this
      guide flags clearly what is confirmed by an official source and what remains unknown — always
      confirm the exact procedure with your vet and with MINEPIA before you book.
    fr: >-
      Le Cameroun accepte les chiens de compagnie, mais il publie très peu de détails propres ; l'image
      officielle la plus claire provient du certificat sanitaire vétérinaire que ses autorités ont
      convenu avec les pays exportateurs. L'autorité sanitaire est le Ministère de l'Élevage, des Pêches
      et des Industries Animales (MINEPIA) et sa Direction des Services Vétérinaires. En pratique, ton
      chien doit disposer d'une puce électronique, d'une vaccination antirabique valide et d'un certificat
      sanitaire vétérinaire international officiel signé et visé par l'autorité vétérinaire du pays de
      départ. Le Cameroun est un pays où la rage est endémique et tout animal importé est soumis à
      l'inspection sanitaire vétérinaire à la frontière. De nombreux points n'étant tout simplement pas
      publiés, ce guide indique clairement ce qui est confirmé par une source officielle et ce qui reste
      inconnu — confirme toujours la procédure exacte avec ton vétérinaire et le MINEPIA avant de réserver.
    es: >-
      Camerún acepta perros de compañía, pero publica muy pocos detalles propios, así que la imagen
      oficial más clara procede del certificado sanitario veterinario que sus autoridades han acordado
      con los países exportadores. La autoridad de sanidad animal es el Ministerio de Ganadería, Pesca e
      Industrias Animales (MINEPIA) y su Dirección de los Servicios Veterinarios (Direction des Services
      Vétérinaires). En la práctica tu perro necesita un microchip, una vacunación antirrábica válida y un
      certificado sanitario veterinario internacional oficial firmado y refrendado por la autoridad
      veterinaria del país de salida. Camerún es un país con rabia endémica y todo animal importado está
      sujeto a inspección sanitaria veterinaria en la frontera. Como muchos detalles simplemente no están
      publicados, esta guía señala con claridad lo que está confirmado por una fuente oficial y lo que
      sigue siendo desconocido — confirma siempre el procedimiento exacto con tu veterinario y con el
      MINEPIA antes de reservar.

    pt: "Camarões aceita cachorros de companhia, mas publica muito poucos detalhes próprios, de modo que o quadro oficial mais claro vem do atestado de saúde veterinário que suas autoridades acordaram com os países exportadores. A autoridade de saúde animal é o Ministério da Pecuária, Pesca e Indústrias Animais (MINEPIA) e sua Divisão de Serviços Veterinários (Direction des Services Vétérinaires). Na prática, o cachorro precisa de um microchip, de uma vacinação antirrábica válida e de um atestado de saúde veterinário internacional oficial, assinado e endossado pela autoridade veterinária do país de partida. Camarões é um país de raiva endêmica, e todo animal importado está sujeito a inspeção sanitária veterinária na fronteira. Como muitos detalhes simplesmente não são publicados, este guia assinala claramente o que é confirmado por uma fonte oficial e o que permanece não comunicado — confirmar sempre o procedimento exato com o veterinário e com o MINEPIA antes de reservar."
difficulty:
  level: moderate
  label: { en: "Moderate — official endorsed veterinary certificate; several details unpublished", fr: "Modéré — certificat vétérinaire officiel visé ; plusieurs détails non publiés", es: "Moderado — certificado veterinario oficial refrendado; varios detalles no publicados", pt: "Moderado — certificado veterinário oficial endossado; vários detalhes não publicados" }

prepTime:
  eu:
    en: "From the EU: allow a few days to a couple of weeks if the microchip and rabies vaccination are already in order — an official EU vet issues and endorses the international health certificate close to departure. Cameroon does not publish an EU-specific model, so confirm the wording with your vet."
    fr: "Depuis l'UE : prévois quelques jours à deux semaines si la puce et la vaccination antirabique sont déjà en règle — un vétérinaire officiel de l'UE établit et vise le certificat sanitaire international peu avant le départ. Le Cameroun ne publie pas de modèle propre à l'UE ; confirme la rédaction avec ton vétérinaire."
    es: "Desde la UE: prevé de unos días a un par de semanas si el microchip y la vacunación antirrábica ya están en regla — un veterinario oficial de la UE emite y refrenda el certificado sanitario internacional poco antes de la salida. Camerún no publica un modelo específico para la UE, así que confirma la redacción con tu veterinario."
    pt: "Da UE: contar com alguns dias a duas semanas, se o microchip e a vacinação antirrábica já estiverem em dia — um veterinário oficial da UE emite e endossa o atestado de saúde internacional perto da partida. Camarões não publica um modelo específico para a UE, portanto confirmar o texto com o veterinário."
  listed:
    en: "From the United States: the USDA-endorsed dog/cat certificate is valid for 30 days after issuance; allow 1–2 weeks for USDA (VEHCS) endorsement, and about 3 weeks more if the rabies vaccination still has to be done."
    fr: "Depuis les États-Unis : le certificat chiens/chats visé par l'USDA est valable 30 jours après émission ; compte 1 à 2 semaines pour le visa de l'USDA (VEHCS), et environ 3 semaines de plus si la vaccination antirabique reste à faire."
    es: "Desde Estados Unidos: el certificado para perros/gatos refrendado por el USDA es válido 30 días tras su emisión; prevé de 1 a 2 semanas para el refrendo del USDA (VEHCS), y unas 3 semanas más si aún falta administrar la vacunación antirrábica."
    pt: "Dos Estados Unidos: o certificado para cachorros/gatos endossado pelo USDA é válido por 30 dias após a emissão; contar com 1 a 2 semanas para o endosso do USDA (VEHCS), e cerca de mais 3 semanas se a vacinação antirrábica ainda precisar ser feita."
  nonListed:
    en: "From other origins: where a MINEPIA import authorization applies, the decision can take up to 30 days — allow several weeks and confirm with the Veterinary Services whether a personal accompanying pet needs one."
    fr: "Depuis d'autres origines : lorsqu'une autorisation d'importation du MINEPIA s'applique, la décision peut prendre jusqu'à 30 jours — prévois plusieurs semaines et confirme auprès des Services Vétérinaires si un animal de compagnie accompagné en a besoin."
    es: "Desde otros orígenes: cuando se aplica una autorización de importación del MINEPIA, la decisión puede tardar hasta 30 días — prevé varias semanas y confirma con los Servicios Veterinarios si una mascota personal acompañada necesita una."
    pt: "De outras origens: quando se aplica uma autorização de importação do MINEPIA, a decisão pode levar até 30 dias — contar com várias semanas e confirmar com os Serviços Veterinários se um cachorro de companhia particular que viaja acompanhado precisa dela."

