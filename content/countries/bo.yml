restrictedDogs:
  intro:
    en: "Bolivia has no SENASAG breed-specific import ban. National Law No. 553 (2014) regulates the keeping of dogs considered dangerous, but this governs ownership and public safety within Bolivia — it is not an entry ban applied at the border by the animal-health authority."
    fr: "La Bolivie n'a aucune interdiction d'importation liée à la race au niveau du SENASAG. La loi nationale n° 553 (2014) réglemente la détention des chiens considérés comme dangereux, mais elle porte sur la détention et la sécurité publique en Bolivie — ce n'est pas une interdiction d'entrée appliquée à la frontière par l'autorité sanitaire animale."
    es: "Bolivia no tiene ninguna prohibición de importación por raza a nivel del SENASAG. La Ley Nacional N.º 553 (2014) regula la tenencia de perros considerados peligrosos, pero rige la tenencia y la seguridad pública dentro de Bolivia — no es una prohibición de entrada aplicada en la frontera por la autoridad de sanidad animal."
    pt: "A Bolívia não tem, no SENASAG, proibição de importação por raça. A Ley Nacional N.º 553 (2014) regula a posse de cachorros considerados perigosos, mas trata da posse e da segurança pública dentro da Bolívia — não é uma proibição de entrada aplicada na fronteira pela autoridade de saúde animal."
  cat1:
    en: "No banned category at entry: no breed is refused entry to Bolivia on the basis of its breed, provided the SENASAG sanitary requirements (import permit, zoosanitary certificate, vaccinations, parasite treatment, inspection) are met."
    fr: "Aucune catégorie interdite à l'entrée : aucune race n'est refusée à l'entrée en Bolivie en raison de sa race, sous réserve du respect des exigences sanitaires du SENASAG (permis d'importation, certificat zoosanitaire, vaccinations, antiparasitaire, inspection)."
    es: "Ninguna categoría prohibida a la entrada: no se rechaza la entrada a Bolivia de ninguna raza por razón de su raza, siempre que se cumplan los requisitos sanitarios del SENASAG (permiso de importación, certificado zoosanitario, vacunaciones, antiparasitario, inspección)."
    pt: "Nenhuma categoria proibida na entrada: nenhuma raça tem a entrada na Bolívia recusada por causa da raça, desde que sejam cumpridas as exigências sanitárias do SENASAG (autorização de importação, certificado zoossanitário, vacinações, tratamento antiparasitário, inspeção)."
  cat2:
    en: "Ownership rules: Law No. 553 on the keeping of dangerous dogs for citizen security lists breeds treated as dangerous — including American Staffordshire Terrier, American Staffordshire Bull Terrier, Pit Bull Terrier, Bull Terrier, Bullmastiff, Doberman, Dogo Argentino, Dogo de Burdeos, Fila Brasileiro, Rottweiler and Tosa Inu, and their crosses. Owners must obtain police authorisation and register the dog with the municipality; breeding for profit and training for fighting are prohibited. These are ownership obligations, not entry bans."
    fr: "Règles de détention : la loi n° 553 sur la tenue des chiens dangereux pour la sécurité citoyenne liste des races réputées dangereuses — dont l'American Staffordshire Terrier, l'American Staffordshire Bull Terrier, le Pit Bull Terrier, le Bull Terrier, le Bullmastiff, le Doberman, le Dogo Argentino, le Dogue de Bordeaux, le Fila Brasileiro, le Rottweiler et le Tosa Inu, ainsi que leurs croisements. Les propriétaires doivent obtenir une autorisation de la police et enregistrer le chien auprès de la municipalité ; l'élevage à but lucratif et le dressage au combat sont interdits. Ce sont des obligations de détention, pas des interdictions d'entrée."
    es: "Reglas de tenencia: la Ley N.º 553 sobre la tenencia de perros peligrosos para la seguridad ciudadana enumera razas consideradas peligrosas — incluidos el American Staffordshire Terrier, el American Staffordshire Bull Terrier, el Pit Bull Terrier, el Bull Terrier, el Bullmastiff, el Doberman, el Dogo Argentino, el Dogo de Burdeos, el Fila Brasileiro, el Rottweiler y el Tosa Inu, y sus cruces. Los propietarios deben obtener autorización de la policía y registrar al perro en el municipio; la cría con fines de lucro y el adiestramiento para la pelea están prohibidos. Son obligaciones de tenencia, no prohibiciones de entrada."
    pt: "Regras de posse: a Ley N.º 553, sobre a posse de cachorros perigosos para a segurança cidadã, lista raças tratadas como perigosas — incluindo American Staffordshire Terrier, American Staffordshire Bull Terrier, Pit Bull Terrier, Bull Terrier, Bullmastiff, Doberman, Dogo Argentino, Dogo de Burdeos, Fila Brasileiro, Rottweiler e Tosa Inu, e seus cruzamentos. Os tutores precisam obter autorização da polícia e registrar o cachorro no município; a criação com fins lucrativos e o adestramento para brigas são proibidos. São obrigações de posse, não proibições de entrada."
  note:
    en: "Because there is no national breed ban at the border, focus on the SENASAG sanitary rules for entry. If you will live in Bolivia with a listed breed, check the police authorisation and municipal registration obligations under Law No. 553."
    fr: "Comme il n'y a pas d'interdiction nationale de race à la frontière, concentre-toi sur les règles sanitaires du SENASAG pour l'entrée. Si tu vivez en Bolivie avec une race listée, vérifie les obligations d'autorisation policière et d'enregistrement municipal de la loi n° 553."
    es: "Como no hay una prohibición nacional de raza en la frontera, céntrate en las normas sanitarias del SENASAG para la entrada. Si vas a vivir en Bolivia con una raza listada, consulta las obligaciones de autorización policial y de registro municipal de la Ley N.º 553."
    pt: "Como não existe proibição nacional de raças na fronteira, concentre-se nas regras sanitárias do SENASAG para a entrada. Se você for morar na Bolívia com uma raça listada, confira as obrigações de autorização policial e de registro municipal da Ley N.º 553."

checklist:
  - en: "SENASAG Zoosanitary Import Permit obtained before departure (form SENASAGIMPFOR001, letter to the Departmental Head, bank-deposit proof, liquidation form)"
    fr: "Permis Zoosanitaire d'Importation SENASAG obtenu avant le départ (formulaire SENASAGIMPFOR001, lettre au Chef Départemental, justificatif de dépôt bancaire, formulaire de liquidation)"
    es: "Permiso Zoosanitario de Importación del SENASAG obtenido antes de la salida (formulario SENASAGIMPFOR001, carta al Jefe Departamental, comprobante de depósito bancario, formulario de liquidación)"
    pt: "Autorização Zoossanitária de Importação do SENASAG obtida antes da partida (formulário SENASAGIMPFOR001, carta ao Chefe Departamental, comprovante de depósito bancário, formulário de liquidação)"
  - en: "Original zoosanitary certificate, one per animal, from the official veterinary authority of the departure country — all information in Spanish"
    fr: "Certificat zoosanitaire original, un par animal, de l'autorité vétérinaire officielle du pays de départ — toute l'information en espagnol"
    es: "Certificado zoosanitario original, uno por animal, de la autoridad veterinaria oficial del país de salida — toda la información en español"
    pt: "Certificado zoossanitário original, um por animal, da autoridade veterinária oficial do país de partida — todas as informações em espanhol"
  - en: "Rabies vaccination (from 3 months) plus core vaccinations recorded within the required window (60 days for third countries)"
    fr: "Vaccination antirabique (dès 3 mois) plus vaccinations de base consignées dans la fenêtre requise (60 jours pour les pays tiers)"
    es: "Vacunación antirrábica (desde los 3 meses) más vacunaciones básicas registradas dentro de la ventana requerida (60 días para los países terceros)"
    pt: "Vacinação antirrábica (a partir dos 3 meses) mais as vacinações essenciais registradas dentro da janela exigida (60 dias para os países terceiros)"
  - en: "Internal & external parasite treatment within 30 days before shipment (14 days from an Andean Community country), recorded on the certificate"
    fr: "Traitement antiparasitaire interne & externe dans les 30 jours avant l'embarquement (14 jours depuis un pays de la Communauté andine), consigné sur le certificat"
    es: "Tratamiento antiparasitario interno y externo dentro de los 30 días previos al embarque (14 días desde un país de la Comunidad Andina), registrado en el certificado"
    pt: "Tratamento antiparasitário interno e externo nos 30 dias anteriores ao embarque (14 dias vindo de um país da Comunidade Andina), registrado no certificado"
  - en: "Official departure inspection recorded; crate washed and disinfected before use, with no waste accompanying the animal"
    fr: "Inspection officielle au départ consignée ; caisse lavée et désinfectée avant usage, sans déchet accompagnant l'animal"
    es: "Inspección oficial de salida registrada; jaula lavada y desinfectada antes de su uso, sin residuos que acompañen al animal"
    pt: "Inspeção oficial na partida registrada; caixa de transporte lavada e desinfetada antes do uso, sem nenhum resíduo acompanhando o animal"
  - en: "Commercial invoice and packing list if the pet was purchased (sale/purchase)"
    fr: "Facture commerciale et liste de colisage si l'animal a été acheté (vente/achat)"
    es: "Factura comercial y lista de empaque si la mascota fue comprada (venta/compra)"
    pt: "Fatura comercial e lista de embalagem se o animal tiver sido comprado (venda/compra)"
  - en: "Travel planned within the import permit validity (60 days air/land), and rabies vaccine still valid on arrival"
    fr: "Voyage planifié dans la validité du permis d'importation (60 jours aérien/terrestre), et vaccin antirabique encore valide à l'arrivée"
    es: "Viaje planificado dentro de la valide del permiso de importación (60 días aéreo/terrestre), y vacuna antirrábica aún válida a la llegada"
    pt: "Viagem planejada dentro da validade da autorização de importação (60 dias aéreo/terrestre), e vacina antirrábica ainda válida na chegada"
  - en: "Microchip recommended for identification (and required by many other countries / for the return)"
    fr: "Puce recommandée pour l'identification (et exigée par de nombreux autres pays / pour le retour)"
    es: "Microchip recomendado para la identificación (y exigido por muchos otros países / para el regreso)"
    pt: "Microchip recomendado para a identificação (e exigido por muitos outros países / para a volta)"
  - en: "Airline reservation confirming your dog's travel option and a suitable IATA crate if in the hold"
    fr: "Réservation confirmant l'option de transport de ton chien et une caisse IATA adaptée si en soute"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y una jaula adecuada conforme a la IATA si viaja en bodega"
    pt: "Reserva da companhia aérea confirmando a opção de viagem do seu cachorro e uma caixa de transporte IATA adequada se ele for no porão"

