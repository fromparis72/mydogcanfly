# Country Entry Guide — Bolivia (bilingual EN/FR).
# Bolivia is NOT in the EU. This encodes Bolivia's own SENASAG scheme (REGENSA, R/A 172/2022).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_bo
iso2: "BO"
name: { en: "Bolivia", fr: "Bolivie", es: "Bolivia", pt: "Bolívia" }
region: { en: "South America", fr: "Amérique du Sud", es: "América del Sur", pt: "América do Sul" }


regime: non_listed
exit:
  authority: SENASAG
  authorityUrl: https://www.senasag.gob.bo/
  intro:
    en: "Bolivia is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by SENASAG."
    fr: "La Bolivie est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par le SENASAG."
    es: "Bolivia no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el SENASAG."
    pt: "A Bolívia é um país não listado, então um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — mais um atestado de saúde de exportação avalizado pelo SENASAG."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "SENASAG issues the export zoosanitary certificate within 24–48h once the documents (including a vet health certificate dated within the last 10 days) are complete."
        fr: "Le SENASAG délivre le certificat zoosanitaire d'export en 24–48 h une fois le dossier complet (dont un certificat sanitaire de moins de 10 jours)."
        es: "El SENASAG emite el certificado zoosanitario de exportación en 24–48 h una vez completa la documentación (incluido un certificado sanitario de menos de 10 días)."
        pt: "O SENASAG emite o certificado zoossanitário de exportação em 24–48 h assim que a documentação estiver completa (incluindo um atestado de saúde veterinário emitido nos últimos 10 dias)."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Bolivia with your dog", fr: "Voyager en Bolivie avec ton chien", es: "Viajar a Bolivia con tu perro", pt: "Viajar para a Bolívia com seu cachorro" }
  intro:
    en: >-
      Bolivia welcomes dogs, but its entry procedure is a little more formal than some of its neighbours.
      SENASAG (Servicio Nacional de Sanidad Agropecuaria e Inocuidad Alimentaria, the national
      animal-health authority) works through two documents. First, a Zoosanitary Import Permit
      (Permiso Zoosanitario de Importación) must be obtained from SENASAG before your dog leaves the
      country of origin. Second, your dog travels with an original zoosanitary certificate issued by the
      official veterinary authority of the departure country, showing current vaccinations — including
      rabies for a dog over three months old — and internal and external parasite treatment. SENASAG
      then certifies the animal on arrival at customs. There is no published rabies antibody test, and
      there is no routine quarantine for a healthy, compliant pet, though SENASAG may impose one if
      requirements are not met. This guide explains exactly what to prepare, and the timing to respect,
      before you book your flight.
    fr: >-
      La Bolivie accueille les chiens, mais sa procédure d'entrée est un peu plus formelle que celle de
      certains pays voisins. Le SENASAG (Servicio Nacional de Sanidad Agropecuaria e Inocuidad
      Alimentaria, l'autorité sanitaire animale nationale) fonctionne avec deux documents. D'abord, un
      Permis Zoosanitaire d'Importation (Permiso Zoosanitario de Importación) doit être obtenu auprès du
      SENASAG avant le départ du chien du pays d'origine. Ensuite, ton chien voyage avec un certificat
      zoosanitaire original émis par l'autorité vétérinaire officielle du pays de départ, attestant des
      vaccinations à jour — dont la rage pour un chien de plus de trois mois — et un traitement
      antiparasitaire interne et externe. Le SENASAG certifie ensuite l'animal à l'arrivée en douane. Il
      n'existe pas de titrage antirabique publié, et il n'y a pas de quarantaine systématique pour un
      animal sain et conforme, même si le SENASAG peut en imposer une si les exigences ne sont pas
      remplies. Ce guide détaille quoi préparer, et les délais à respecter, avant de réserver ton vol.
    es: >-
      Bolivia acoge a los perros, pero su procedimiento de entrada es un poco más formal que el de
      algunos de sus vecinos. El SENASAG (Servicio Nacional de Sanidad Agropecuaria e Inocuidad
      Alimentaria, la autoridad nacional de sanidad animal) funciona con dos documentos. Primero, hay
      que obtener del SENASAG un Permiso Zoosanitario de Importación antes de que tu perro salga del
      país de origen. Segundo, tu perro viaja con un certificado zoosanitario original expedido por la
      autoridad veterinaria oficial del país de salida, que acredite las vacunaciones al día — incluida
      la rabia para un perro de más de tres meses — y un tratamiento contra parásitos internos y
      externos. El SENASAG certifica luego al animal a su llegada en la aduana. No hay una prueba de
      titulación de rabia publicada, y no existe una cuarentena rutinaria para una mascota sana y
      conforme, aunque el SENASAG puede imponer una si no se cumplen los requisitos. Esta guía explica
      exactamente qué preparar, y los plazos que respetar, antes de reservar tu vuelo.

    pt: "A Bolívia recebe bem os cachorros, mas seu procedimento de entrada é um pouco mais formal que o de alguns países vizinhos. O SENASAG (Servicio Nacional de Sanidad Agropecuaria e Inocuidad Alimentaria, a autoridade nacional de saúde animal) trabalha com dois documentos. Primeiro, é preciso obter do SENASAG uma Autorização Zoossanitária de Importação (Permiso Zoosanitario de Importación) antes de o seu cachorro sair do país de origem. Segundo, o seu cachorro viaja com um certificado zoossanitário original emitido pela autoridade veterinária oficial do país de partida, atestando as vacinações em dia — inclusive a raiva para um cachorro com mais de três meses — e o tratamento antiparasitário interno e externo. O SENASAG certifica então o animal na chegada à alfândega. Não há teste sorológico antirrábico publicado, e não existe quarentena de rotina para um animal saudável e em conformidade, ainda que o SENASAG possa impor uma se as exigências não forem cumpridas. Este guia explica exatamente o que preparar, e os prazos a respeitar, antes de você comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Moderate — a prior SENASAG import permit is required", fr: "Modérée — un permis d'importation SENASAG préalable est requis", es: "Moderada — se requiere un permiso de importación previo del SENASAG", pt: "Moderado — é obrigatória uma autorização de importação prévia do SENASAG" }

prepTime:
  eu:
    en: "Standard case (third countries, incl. EU): allow time to obtain the SENASAG Zoosanitary Import Permit before departure, plus a zoosanitary certificate with vaccinations done within 60 days and parasite treatment within 30 days before shipment."
    fr: "Cas standard (pays tiers, dont l'UE) : prévois du temps pour obtenir le Permis Zoosanitaire d'Importation du SENASAG avant le départ, plus un certificat zoosanitaire avec vaccinations fais dans les 60 jours et antiparasitaire dans les 30 jours avant l'embarquement."
    es: "Caso estándar (países terceros, incl. la UE): prevé tiempo para obtener el Permiso Zoosanitario de Importación del SENASAG antes de la salida, más un certificado zoosanitario con vacunaciones hechas dentro de los 60 días y tratamiento antiparasitario dentro de los 30 días previos al embarque."
    pt: "Caso padrão (países terceiros, incl. a UE): reserve tempo para obter a Autorização Zoossanitária de Importação do SENASAG antes da partida, mais um certificado zoossanitário com vacinações feitas nos 60 dias e tratamento antiparasitário nos 30 dias anteriores ao embarque."
  listed:
    en: "From an Andean Community country (Peru, Ecuador, Colombia): the vaccination window is wider (given between 1 month and 1 year before export) but no vaccine may be given in the 14 days before shipment — plan the schedule with your vet."
    fr: "Depuis un pays de la Communauté andine (Pérou, Équateur, Colombie) : la fenêtre de vaccination est plus large (entre 1 mois et 1 an avant l'export) mais aucun vaccin ne doit être fait dans les 14 jours avant l'embarquement — planifie le calendrier avec ton vétérinaire."
    es: "Desde un país de la Comunidad Andina (Perú, Ecuador, Colombia): la ventana de vacunación es más amplia (administrada entre 1 mes y 1 año antes de la exportación) pero no puede aplicarse ninguna vacuna en los 14 días previos al embarque — planifica el calendario con tu veterinario."
    pt: "De um país da Comunidade Andina (Peru, Equador, Colômbia): a janela de vacinação é mais ampla (aplicada entre 1 mês e 1 ano antes da exportação), mas nenhuma vacina pode ser aplicada nos 14 dias anteriores ao embarque — planeje o calendário com seu veterinário."
  nonListed:
    en: "If requirements are not met: SENASAG may require quarantine of at least 30 days under its supervision — always prepare and obtain the import permit in advance."
    fr: "Si les exigences ne sont pas remplies : le SENASAG peut imposer une quarantaine d'au moins 30 jours sous sa supervision — prépare toujours et obtiens le permis d'importation à l'avance."
    es: "Si no se cumplen los requisitos: el SENASAG puede exigir una cuarentena de al menos 30 días bajo su supervisión — prepara y obtén siempre el permiso de importación por adelantado."
    pt: "Se as exigências não forem cumpridas: o SENASAG pode exigir uma quarentena de pelo menos 30 dias sob sua supervisão — prepare e obtenha sempre a autorização de importação com antecedência."

