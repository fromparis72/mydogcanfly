notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian and the Animal Production and Health Division (Office of the Chief Veterinary Officer) can confirm the exact procedure for your individual dog; the import permit lists the precise conditions that apply."
    fr: "Seuls un vétérinaire et l'Animal Production and Health Division (bureau du Chief Veterinary Officer) peuvent confirmer la procédure exacte pour ton chien ; le permis d'importation détaille les conditions précises applicables."
    es: "Solo un veterinario y la Animal Production and Health Division (oficina del Chief Veterinary Officer) pueden confirmar el procedimiento exacto para tu perro; el permiso de importación detalla las condiciones precisas aplicables."
    pt: "Só um médico-veterinário e a Animal Production and Health Division (Office of the Chief Veterinary Officer) podem confirmar o procedimento exato para o seu cachorro; a autorização de importação lista as condições precisas que se aplicam."
  - en: "Requirements depend on: the country of origin and its category, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine et de sa catégorie, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen y su categoría, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem e da sua categoria, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact steps depend on three things — Trinidad and Tobago (your destination) sets the scheme, but your dog's origin category decides the detail."
    fr: "Les étapes exactes dépendent de trois éléments — Trinité-et-Tobago (ta destination) fixe le dispositif, mais la catégorie d'origine de ton chien en détermine le détail."
    es: "Los pasos exactos dependen de tres factores — Trinidad y Tobago (tu destino) fija el sistema, pero la categoría de origen de tu perro determina el detalle."
    pt: "As etapas exatas dependem de três coisas — Trinidad e Tobago (seu destino) define o esquema, mas é a categoria de origem do seu cachorro que determina os detalhes."
  items:
    - stars: 5
      label: { en: "Country of destination — Trinidad and Tobago", fr: "Pays de destination — Trinité-et-Tobago", es: "País de destino — Trinidad y Tobago", pt: "País de destino — Trinidad e Tobago" }
      text:
        en: "The Animal Production and Health Division requires every dog to hold an import permit, an ISO microchip, a parasite treatment within 10 days of travel and an official health certificate dated within 7 days of travel. Since April 2013 there is no quarantine when all requirements are met."
        fr: "L'Animal Production and Health Division exige de tout chien un permis d'importation, une puce ISO, un traitement antiparasitaire dans les 10 jours avant le voyage et un certificat sanitaire officiel daté dans les 7 jours avant le voyage. Depuis avril 2013, aucune quarantaine si toutes les conditions sont remplies."
        es: "La Animal Production and Health Division exige que todo perro tenga un permiso de importación, un microchip ISO, un tratamiento antiparasitario dentro de los 10 días previos al viaje y un certificado sanitario oficial fechado dentro de los 7 días previos al viaje. Desde abril de 2013 no hay cuarentena cuando se cumplen todos los requisitos."
        pt: "A Animal Production and Health Division exige que todo cachorro tenha uma autorização de importação, um microchip ISO, um tratamento antiparasitário feito nos 10 dias anteriores à viagem e um atestado de saúde oficial emitido nos 7 dias anteriores à viagem. Desde abril de 2013 não há quarentena quando todas as exigências são cumpridas."
    - stars: 5
      label: { en: "Country of departure and its category", fr: "Pays de départ et sa catégorie", es: "País de salida y su categoría", pt: "País de partida e sua categoria" }
      text:
        en: "Trinidad and Tobago sorts countries into Category 1 (no rabies antibody test), Category 2 (rabies vaccination and antibody test required) and Category 3 (all other countries — vaccination, antibody test and a five-month wait). The EU is split between Category 1 and Category 2, so your exact departure country matters."
        fr: "Trinité-et-Tobago classe les pays en Catégorie 1 (pas de titrage antirabique), Catégorie 2 (vaccination et titrage antirabiques exigés) et Catégorie 3 (tous les autres pays — vaccination, titrage et délai de cinq mois). L'UE est répartie entre Catégorie 1 et Catégorie 2 ; ton pays de départ précis compte donc."
        es: "Trinidad y Tobago clasifica los países en Categoría 1 (sin prueba de titulación de rabia), Categoría 2 (vacunación y prueba de titulación de rabia obligatorias) y Categoría 3 (todos los demás países — vacunación, prueba de titulación y una espera de cinco meses). La UE está dividida entre Categoría 1 y Categoría 2, por lo que tu país de salida concreto importa."
        pt: "Trinidad e Tobago classifica os países na Categoria 1 (sem teste sorológico antirrábico), na Categoria 2 (vacinação antirrábica e teste sorológico obrigatórios) e na Categoria 3 (todos os demais países — vacinação, teste sorológico e cinco meses de espera). A UE está dividida entre a Categoria 1 e a Categoria 2, então o seu país exato de partida faz diferença."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "The import permit application asks for the countries where the dog lived during the six months before entry. It is your dog's real origin and residence history that determine its category — not only the last airport it flew from."
        fr: "La demande de permis d'importation demande les pays où le chien a vécu durant les six mois précédant l'entrée. C'est l'origine réelle et l'historique de résidence du chien qui déterminent sa catégorie — pas seulement le dernier aéroport de départ."
        es: "La solicitud del permiso de importación pregunta por los países donde el perro vivió durante los seis meses previos a la entrada. Son el origen real y el historial de residencia de tu perro los que determinan su categoría — no solo el último aeropuerto del que salió."
        pt: "O formulário de pedido da autorização de importação pergunta em quais países o cachorro morou nos seis meses anteriores à entrada. O que define a categoria é a origem real e o histórico de residência do seu cachorro — não apenas o último aeroporto de onde ele decolou."
  note:
    en: "So read the requirements below as the Trinidad and Tobago framework, then confirm your dog's category, origin and history with your vet and the Office of the Chief Veterinary Officer before you commit to a date."
    fr: "Lis donc les exigences ci-dessous comme le cadre de Trinité-et-Tobago, puis confirme la catégorie, l'origine et l'historique de ton chien avec ton vétérinaire et le bureau du Chief Veterinary Officer avant de fixer une date."
    es: "Así que lee los requisitos siguientes como el marco de Trinidad y Tobago y luego confirma la categoría, el origen y el historial de tu perro con tu veterinario y la oficina del Chief Veterinary Officer antes de fijar una fecha."
    pt: "Leia então as exigências abaixo como o quadro geral de Trinidad e Tobago e, antes de fechar uma data, confirme a categoria, a origem e o histórico do seu cachorro com seu veterinário e com o Office of the Chief Veterinary Officer."

requirements:
  - item: { en: "Import permit", fr: "Permis d'importation", es: "Permiso de importación", pt: "Autorização de importação" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Apply to the Office of the Chief Veterinary Officer (APHD) at least one and a half (1½) months in advance for Category 1 and Category 2 origins. For Category 3 origins, apply at least five (5) months in advance. Complete one application form per animal and obtain the permit before travel.", fr: "Demande au bureau du Chief Veterinary Officer (APHD) au moins un mois et demi (1½) à l'avance pour les origines Catégorie 1 et 2. Pour les origines Catégorie 3, demande au moins cinq (5) mois à l'avance. Remplis un formulaire par animal et obtiens le permis avant le voyage.", es: "Solicítalo a la oficina del Chief Veterinary Officer (APHD) al menos un mes y medio (1½) de antelación para orígenes de Categoría 1 y 2. Para orígenes de Categoría 3, solicítalo al menos cinco (5) meses de antelación. Rellena un formulario de solicitud por animal y obtén el permiso antes del viaje.", pt: "Faça o pedido ao Office of the Chief Veterinary Officer (APHD) com pelo menos um mês e meio (1½) de antecedência para origens das Categorias 1 e 2. Para origens da Categoria 3, faça o pedido com pelo menos cinco (5) meses de antecedência. Preencha um formulário de pedido por animal e obtenha a autorização antes da viagem." }
    exceptions: { en: "A dog that does not meet the conditions on the import permit may be re-exported at the consignee's expense or euthanised, as determined by the Inspector. Special conditions apply to service dogs.", fr: "Un chien ne remplissant pas les conditions du permis peut être réexpédié aux frais du destinataire ou euthanasié, sur décision de l'Inspecteur. Des conditions spéciales s'appliquent aux chiens d'assistance.", es: "Un perro que no cumpla las condiciones del permiso de importación puede ser reexportado a cargo del destinatario o sacrificado, según lo determine el Inspector. Se aplican condiciones especiales a los perros de asistencia.", pt: "Um cachorro que não cumpra as condições da autorização de importação pode ser reexportado às custas do consignatário ou submetido a eutanásia, conforme determinação do Inspector (fiscal). Condições especiais se aplicam a cães de assistência." }
    ref: { en: "APHD — Guidelines for the Importation of Dogs and Cats into Trinidad and Tobago (April 2013)", fr: "APHD — Directives pour l'importation de chiens et chats à Trinité-et-Tobago (avril 2013)", es: "APHD — Directrices para la importación de perros y gatos a Trinidad y Tobago (abril de 2013)", pt: "APHD — Guidelines for the Importation of Dogs and Cats into Trinidad and Tobago (diretrizes de importação, abril de 2013)" }
  - item: { en: "Origin category", fr: "Catégorie d'origine", es: "Categoría de origen", pt: "Categoria de origem" }
    required: { en: "Determines the procedure", fr: "Détermine la procédure", es: "Determina el procedimiento", pt: "Define o procedimento" }
    when: { en: "Category 1 = no rabies antibody test (e.g. UK, Australia, New Zealand, Barbados, Jamaica, and EU states such as Germany, Ireland, Portugal, Sweden). Category 2 = rabies vaccination and antibody test (e.g. USA, Canada, France, Spain, Italy, the Netherlands, Japan). Category 3 = all other countries.", fr: "Catégorie 1 = pas de titrage antirabique (ex. Royaume-Uni, Australie, Nouvelle-Zélande, Barbade, Jamaïque, et États de l'UE comme l'Allemagne, l'Irlande, le Portugal, la Suède). Catégorie 2 = vaccination et titrage antirabiques (ex. USA, Canada, France, Espagne, Italie, Pays-Bas, Japon). Catégorie 3 = tous les autres pays.", es: "Categoría 1 = sin prueba de titulación de rabia (p. ej. Reino Unido, Australia, Nueva Zelanda, Barbados, Jamaica, y Estados de la UE como Alemania, Irlanda, Portugal, Suecia). Categoría 2 = vacunación antirrábica y prueba de titulación (p. ej. EE. UU., Canadá, Francia, España, Italia, los Países Bajos, Japón). Categoría 3 = todos los demás países.", pt: "Categoria 1 = sem teste sorológico antirrábico (por exemplo, Reino Unido, Austrália, Nova Zelândia, Barbados, Jamaica e países da UE como Alemanha, Irlanda, Portugal e Suécia). Categoria 2 = vacinação antirrábica e teste sorológico (por exemplo, EUA, Canadá, França, Espanha, Itália, Países Baixos e Japão). Categoria 3 = todos os demais países." }
    exceptions: { en: "The published Category lists are authoritative; check the current list with the APHD, as it is periodically revised.", fr: "Les listes de Catégories publiées font foi ; vérifie la liste en vigueur auprès de l'APHD, car elle est révisée périodiquement.", es: "Las listas de Categorías publicadas tienen valor legal; comprueba la lista en vigor con la APHD, ya que se revisa periódicamente.", pt: "As listas de Categorias publicadas são a referência oficial; confira a lista vigente com a APHD, pois ela é revisada periodicamente." }
    ref: { en: "APHD — Guidelines (Category 1/2/3 country tables)", fr: "APHD — Directives (tableaux des pays de Catégorie 1/2/3)", es: "APHD — Directrices (tablas de países de Categoría 1/2/3)", pt: "APHD — Guidelines (tabelas de países das Categorias 1/2/3)" }
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "The dog must be microchipped with a brand accepted by the International Standards Organization (ISO Standard 11784 or Annex A to standard 11785). For Category 2 and 3 origins, the rabies vaccination must be given after the microchip is implanted.", fr: "Le chien doit être pucé avec une marque acceptée par l'Organisation internationale de normalisation (norme ISO 11784 ou Annexe A à la norme 11785). Pour les origines Catégorie 2 et 3, la vaccination antirabique doit être administrée après la pose de la puce.", es: "El perro debe llevar un microchip de una marca aceptada por la Organización Internacional de Normalización (norma ISO 11784 o Anexo A de la norma 11785). Para orígenes de Categoría 2 y 3, la vacunación antirrábica debe administrarse después de implantar el microchip.", pt: "O cachorro precisa ter um microchip de uma marca aceita pela International Standards Organization (norma ISO 11784 ou anexo A da norma 11785). Para origens das Categorias 2 e 3, a vacinação antirrábica precisa ser aplicada depois da implantação do microchip." }
    exceptions: { en: "The microchip number must be recorded on the application form and all accompanying documents.", fr: "Le numéro de puce doit figurer sur le formulaire de demande et sur tous les documents d'accompagnement.", es: "El número de microchip debe figurar en el formulario de solicitud y en todos los documentos de acompañamiento.", pt: "O número do microchip precisa constar do formulário de pedido e de todos os documentos que acompanham o animal." }
    ref: { en: "APHD — Guidelines (microchip requirement)", fr: "APHD — Directives (exigence de puce)", es: "APHD — Directrices (requisito de microchip)", pt: "APHD — Guidelines (exigência de microchip)" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required for Category 2 & 3", fr: "Requise pour Catégorie 2 et 3", es: "Obligatoria para Categoría 2 y 3", pt: "Obrigatória para as Categorias 2 e 3" }
    when: { en: "For Category 2 and 3 origins, the dog must be currently vaccinated against rabies, vaccinated after the microchip was implanted, and the vaccine administered according to the manufacturer's data sheet.", fr: "Pour les origines Catégorie 2 et 3, le chien doit être valablement vacciné contre la rage, vacciné après la pose de la puce, et le vaccin administré selon la notice du fabricant.", es: "Para orígenes de Categoría 2 y 3, el perro debe estar vigentemente vacunado contra la rabia, vacunado después de implantar el microchip, y la vacuna administrada según la ficha técnica del fabricante.", pt: "Para origens das Categorias 2 e 3, o cachorro precisa estar com a vacinação antirrábica em dia, ter sido vacinado depois da implantação do microchip e ter recebido a vacina conforme a bula do fabricante." }
    exceptions: { en: "Category 1 origins are not required by the published guidelines to show a rabies vaccination or antibody test; the exporting country's health certificate still details the applicable conditions.", fr: "Les origines Catégorie 1 ne sont pas tenues, selon les directives publiées, de présenter une vaccination ou un titrage antirabiques ; le certificat sanitaire du pays exportateur détaille néanmoins les conditions applicables.", es: "Según las directrices publicadas, los orígenes de Categoría 1 no están obligados a presentar una vacunación antirrábica ni una prueba de titulación; el certificado sanitario del país exportador detalla, no obstante, las condiciones aplicables.", pt: "As diretrizes publicadas não exigem vacinação antirrábica nem teste sorológico para origens da Categoria 1; ainda assim, o atestado de saúde do país exportador detalha as condições aplicáveis." }
    ref: { en: "APHD — Guidelines (Category 2 & 3 requirements)", fr: "APHD — Directives (exigences Catégorie 2 et 3)", es: "APHD — Directrices (requisitos de Categoría 2 y 3)", pt: "APHD — Guidelines (exigências das Categorias 2 e 3)" }
  - item: { en: "Rabies antibody test (FAVN or RFFIT)", fr: "Titrage antirabique (FAVN ou RFFIT)", es: "Prueba de titulación de rabia (FAVN o RFFIT)", pt: "Teste sorológico antirrábico (FAVN ou RFFIT)" }
    required: { en: "Required for Category 2 & 3", fr: "Requis pour Catégorie 2 et 3", es: "Obligatoria para Categoría 2 y 3", pt: "Obrigatória para as Categorias 2 e 3" }
    when: { en: "A rabies blood test (FAVN or RFFIT) must be done on each dog at least one (1) month after vaccination, at a laboratory approved by the APHD, and must show a protective level. The original laboratory result must reach the Office of the Chief Veterinary Officer (the laboratory may email it directly).", fr: "Un test sérologique antirabique (FAVN ou RFFIT) doit être réalisé sur chaque chien au moins un (1) mois après la vaccination, dans un laboratoire agréé par l'APHD, et doit montrer un titre protecteur. Le résultat original de laboratoire doit parvenir au bureau du Chief Veterinary Officer (le laboratoire peut l'envoyer directement par courriel).", es: "Debe realizarse una prueba sanguínea de rabia (FAVN o RFFIT) a cada perro al menos un (1) mes después de la vacunación, en un laboratorio aprobado por la APHD, y debe mostrar un nivel protector. El resultado original del laboratorio debe llegar a la oficina del Chief Veterinary Officer (el laboratorio puede enviarlo directamente por correo electrónico).", pt: "O exame de sangue para raiva (FAVN ou RFFIT) precisa ser feito em cada cachorro no mínimo um (1) mês depois da vacinação, em laboratório aprovado pela APHD, e precisa mostrar um nível protetor. O resultado original do laboratório precisa chegar ao Office of the Chief Veterinary Officer (o laboratório pode enviá-lo diretamente por e-mail)." }
    exceptions: { en: "Not required for Category 1 origins. For Category 3, travel must not take place until at least 5 calendar months from the vaccination date.", fr: "Non requis pour les origines Catégorie 1. Pour la Catégorie 3, le voyage ne peut avoir lieu qu'au moins 5 mois civils après la date de vaccination.", es: "No se exige para orígenes de Categoría 1. Para la Categoría 3, el viaje no puede realizarse hasta al menos 5 meses naturales desde la fecha de vacunación.", pt: "Não é exigido para origens da Categoria 1. Para a Categoria 3, a viagem só pode acontecer no mínimo 5 meses corridos depois da data da vacinação." }
    ref: { en: "APHD — Guidelines (Category 2 & 3, rabies blood test)", fr: "APHD — Directives (Catégorie 2 et 3, test sérologique antirabique)", es: "APHD — Directrices (Categoría 2 y 3, prueba sanguínea de rabia)", pt: "APHD — Guidelines (Categorias 2 e 3, exame de sangue para raiva)" }
  - item: { en: "Parasite treatment (internal & external)", fr: "Traitement antiparasitaire (interne & externe)", es: "Tratamiento antiparasitario (interno y externo)", pt: "Tratamento antiparasitário (interno e externo)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "The dog must be treated against internal and external parasites within 10 days of travel. The treatment is recorded on the official health certificate.", fr: "Le chien doit être traité contre les parasites internes et externes dans les 10 jours avant le voyage. Le traitement est consigné sur le certificat sanitaire officiel.", es: "El perro debe ser tratado contra parásitos internos y externos dentro de los 10 días previos al viaje. El tratamiento se registra en el certificado sanitario oficial.", pt: "O cachorro precisa ser tratado contra parasitas internos e externos nos 10 dias anteriores à viagem. O tratamento é registrado no atestado de saúde oficial." }
    exceptions: { en: "No separate tapeworm (Echinococcus) window is published — a general internal/external parasite treatment within the 10-day window is required.", fr: "Aucun délai distinct contre l'échinococcose (ténia) n'est publié — un traitement antiparasitaire interne/externe général dans la fenêtre de 10 jours est exigé.", es: "No se publica un plazo específico contra la tenia (Echinococcus) — se exige un tratamiento antiparasitario interno/externo general dentro de la ventana de 10 días.", pt: "Não há prazo específico publicado para a tênia (Echinococcus) — o que se exige é um tratamento antiparasitário interno/externo geral dentro da janela de 10 dias." }
    ref: { en: "APHD — Guidelines (parasite treatment)", fr: "APHD — Directives (traitement antiparasitaire)", es: "APHD — Directrices (tratamiento antiparasitario)", pt: "APHD — Guidelines (tratamento antiparasitário)" }
  - item: { en: "Additional tests", fr: "Tests complémentaires", es: "Pruebas adicionales", pt: "Exames adicionais" }
    required: { en: "Possible — depends on origin", fr: "Possibles — selon l'origine", es: "Posibles — según el origen", pt: "Possíveis — depende da origem" }
    when: { en: "For Category 3 origins, up to 5 or 6 additional tests for dogs may be required depending on the exporting country. Any additional tests are listed on the import permit.", fr: "Pour les origines Catégorie 3, jusqu'à 5 ou 6 tests complémentaires pour les chiens peuvent être exigés selon le pays exportateur. Tout test complémentaire est indiqué sur le permis d'importation.", es: "Para orígenes de Categoría 3, pueden exigirse hasta 5 o 6 pruebas adicionales para perros según el país exportador. Cualquier prueba adicional se indica en el permiso de importación.", pt: "Para origens da Categoria 3, podem ser exigidos até 5 ou 6 exames adicionais para cachorros, dependendo do país exportador. Todos os exames adicionais são listados na autorização de importação." }
    exceptions: { en: "The exact list is confirmed on the individual import permit once the origin is known.", fr: "La liste exacte est confirmée sur le permis d'importation individuel une fois l'origine connue.", es: "La lista exacta se confirma en el permiso de importación individual una vez que se conoce el origen.", pt: "A lista exata é confirmada na própria autorização de importação, assim que a origem é conhecida." }
    ref: { en: "APHD — Guidelines (additional tests, Category 3)", fr: "APHD — Directives (tests complémentaires, Catégorie 3)", es: "APHD — Directrices (pruebas adicionales, Categoría 3)", pt: "APHD — Guidelines (exames adicionais, Categoria 3)" }
  - item: { en: "Official health certificate", fr: "Certificat sanitaire officiel", es: "Certificado sanitario oficial", pt: "Atestado de saúde oficial" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "A valid official health certificate from the exporting country, dated within 7 days of the travel date, detailing all the requirements. Where issued by a private vet, it must be endorsed by the government veterinary authority of the exporting country.", fr: "Un certificat sanitaire officiel valide du pays exportateur, daté dans les 7 jours avant le voyage, détaillant toutes les exigences. S'il est établi par un vétérinaire privé, il doit être visé par l'autorité vétérinaire gouvernementale du pays exportateur.", es: "Un certificado sanitario oficial válido del país exportador, fechado dentro de los 7 días previos a la fecha del viaje, que detalle todos los requisitos. Cuando lo expide un veterinario privado, debe ser refrendado por la autoridad veterinaria gubernamental del país exportador.", pt: "Um atestado de saúde oficial válido do país exportador, emitido nos 7 dias anteriores à data da viagem, detalhando todas as exigências. Se for emitido por um veterinário particular, precisa ser endossado pela autoridade veterinária oficial do país exportador." }
    exceptions: { en: "The dog must arrive with all the documents indicated on the import permit; the original certificate must accompany the dog.", fr: "Le chien doit arriver avec tous les documents indiqués sur le permis d'importation ; le certificat original doit accompagner le chien.", es: "El perro debe llegar con todos los documentos indicados en el permiso de importación; el certificado original debe acompañar al perro.", pt: "O cachorro precisa chegar com todos os documentos indicados na autorização de importação; o certificado original precisa acompanhar o cachorro." }
    ref: { en: "APHD — Guidelines (official health certificate)", fr: "APHD — Directives (certificat sanitaire officiel)", es: "APHD — Directrices (certificado sanitario oficial)", pt: "APHD — Guidelines (atestado de saúde oficial)" }
  - item: { en: "Advance notification of arrival", fr: "Notification préalable d'arrivée", es: "Notificación previa de llegada", pt: "Aviso prévio de chegada" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Notify the Veterinary Officer (Quarantine, Veterinary Services) at least two (2) working days / 48 hours before the scheduled arrival, giving the expected arrival details.", fr: "Préviens le vétérinaire officiel (Quarantaine, Services vétérinaires) au moins deux (2) jours ouvrables / 48 heures avant l'arrivée prévue, en indiquant les détails d'arrivée.", es: "Avisa al veterinario oficial (Cuarentena, Servicios Veterinarios) al menos dos (2) días hábiles / 48 horas antes de la llegada prevista, indicando los detalles de llegada previstos.", pt: "Avise o Veterinary Officer (Quarantine, Veterinary Services) com pelo menos dois (2) dias úteis / 48 horas de antecedência em relação à chegada prevista, informando os dados previstos do voo." }
    exceptions: { en: "Contact numbers and email are provided by the APHD and printed on the import permit.", fr: "Les numéros de contact et le courriel sont fournis par l'APHD et figurent sur le permis d'importation.", es: "Los números de contacto y el correo electrónico los facilita la APHD y figuran en el permiso de importación.", pt: "Os telefones de contato e o e-mail são fornecidos pela APHD e vêm impressos na autorização de importação." }
    ref: { en: "APHD — Guidelines (notification of arrival)", fr: "APHD — Directives (notification d'arrivée)", es: "APHD — Directrices (notificación de llegada)", pt: "APHD — Guidelines (aviso de chegada)" }
  - item: { en: "Transport method", fr: "Mode de transport", es: "Método de transporte", pt: "Forma de transporte" }
    required: { en: "Cabin, checked baggage or cargo", fr: "Cabine, bagage enregistré ou fret", es: "Cabina, equipaje facturado o carga", pt: "Cabine, bagagem despachada ou carga" }
    when: { en: "Since 17 August 2022, dogs may be imported by air via the cabin, as checked baggage or as cargo; the earlier cargo-only condition on the import permit was removed.", fr: "Depuis le 17 août 2022, les chiens peuvent être importés par avion en cabine, en bagage enregistré ou en fret ; l'ancienne condition « fret uniquement » du permis a été supprimée.", es: "Desde el 17 de agosto de 2022, los perros pueden importarse por vía aérea en cabina, como equipaje facturado o como carga; se eliminó la anterior condición de «solo carga» del permiso de importación.", pt: "Desde 17 de agosto de 2022, os cachorros podem ser importados por via aérea na cabine, como bagagem despachada ou como carga; a antiga condição de transporte apenas como carga foi retirada da autorização de importação." }
    exceptions: { en: "Airlines set their own crate, breed and booking rules — confirm them separately.", fr: "Les compagnies aériennes fixent leurs propres règles de caisse, de race et de réservation — vérifie-les séparément.", es: "Las aerolíneas fijan sus propias normas de jaula, raza y reserva — confírmalas por separado.", pt: "As companhias aéreas definem as próprias regras de caixa de transporte, raça e reserva — confirme-as separadamente." }
    ref: { en: "APHD — Media Release: Pet Travel into Trinidad and Tobago (17 Aug 2022)", fr: "APHD — Communiqué : Voyage d'animaux vers Trinité-et-Tobago (17 août 2022)", es: "APHD — Comunicado de prensa: Viaje de mascotas a Trinidad y Tobago (17 de agosto de 2022)", pt: "APHD — Media Release: Pet Travel into Trinidad and Tobago (17 de agosto de 2022)" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "None if compliant", fr: "Aucune si conforme", es: "Ninguna si se cumplen los requisitos", pt: "Nenhuma se estiver em conformidade" }
    when: { en: "Since April 2013, no quarantine is imposed on a dog that meets all import requirements on arrival.", fr: "Depuis avril 2013, aucune quarantaine n'est imposée à un chien qui remplit toutes les conditions d'importation à l'arrivée.", es: "Desde abril de 2013, no se impone cuarentena a un perro que cumple todos los requisitos de importación a la llegada.", pt: "Desde abril de 2013, nenhuma quarentena é imposta a um cachorro que cumpra todas as exigências de importação na chegada." }
    exceptions: { en: "A dog that does not meet the requirements may be quarantined, returned to the country of origin, or euthanised, as determined by the Inspector.", fr: "Un chien ne remplissant pas les conditions peut être mis en quarantaine, renvoyé vers le pays d'origine, ou euthanasié, sur décision de l'Inspecteur.", es: "Un perro que no cumpla los requisitos puede ser puesto en cuarentena, devuelto al país de origen o sacrificado, según lo determine el Inspector.", pt: "Um cachorro que não cumpra as exigências pode ser posto em quarentena, devolvido ao país de origem ou submetido a eutanásia, conforme determinação do Inspector (fiscal)." }
    ref: { en: "APHD — Guidelines (no-quarantine system, April 2013)", fr: "APHD — Directives (système sans quarantaine, avril 2013)", es: "APHD — Directrices (sistema sin cuarentena, abril de 2013)", pt: "APHD — Guidelines (sistema sem quarentena, abril de 2013)" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Not specified", fr: "Non communiqué", es: "No especificada", pt: "Não especificada" }
    when: { en: "The published guidelines do not state an explicit minimum age. In practice, for Category 2 and 3 origins the rabies vaccination (given per the manufacturer's data sheet, usually from about 12 weeks) plus the antibody test and waiting periods mean an imported dog is several months old.", fr: "Les directives publiées n'indiquent pas d'âge minimum explicite. En pratique, pour les origines Catégorie 2 et 3, la vaccination antirabique (selon la notice du fabricant, généralement à partir d'environ 12 semaines) plus le titrage et les délais d'attente impliquent un chien de plusieurs mois.", es: "Las directrices publicadas no indican una edad mínima explícita. En la práctica, para orígenes de Categoría 2 y 3, la vacunación antirrábica (administrada según la ficha técnica del fabricante, normalmente a partir de unas 12 semanas) más la prueba de titulación y los períodos de espera implican que un perro importado tenga varios meses.", pt: "As diretrizes publicadas não fixam uma idade mínima explícita. Na prática, para origens das Categorias 2 e 3, a vacinação antirrábica (aplicada conforme a bula do fabricante, geralmente a partir de cerca de 12 semanas), somada ao teste sorológico e aos prazos de espera, faz com que um cachorro importado tenha vários meses de vida." }
    exceptions: { en: "Confirm any age condition with the APHD when applying for the permit.", fr: "Confirme toute condition d'âge auprès de l'APHD lors de la demande de permis.", es: "Confirma cualquier condición de edad con la APHD al solicitar el permiso.", pt: "Confirme qualquer condição de idade com a APHD ao solicitar a autorização." }
    ref: { en: "APHD — Guidelines (rabies vaccination timing)", fr: "APHD — Directives (calendrier de vaccination antirabique)", es: "APHD — Directrices (calendario de vacunación antirrábica)", pt: "APHD — Guidelines (prazos da vacinação antirrábica)" }

origin:
  scheme: eu
  eu:
    title: { en: "European Union — split between Category 1 and Category 2", fr: "Union européenne — répartie entre Catégorie 1 et Catégorie 2", es: "Unión Europea — dividida entre Categoría 1 y Categoría 2", pt: "União Europeia — dividida entre a Categoria 1 e a Categoria 2" }
    body:
      en: "Trinidad and Tobago does not recognise the EU pet passport, and EU Member States are not treated as one block. Several EU countries — for example Germany, Ireland, Portugal, Sweden, Malta, Austria, Belgium, Denmark, the Czech Republic and Luxembourg — are in Category 1, so no rabies antibody test is required. Others — for example France, Spain, Italy, the Netherlands, Poland and Finland — are in Category 2, which requires a rabies vaccination (after microchipping) and a rabies antibody test (FAVN or RFFIT) at least one month after vaccination. In every case you still need the import permit, ISO microchip, parasite treatment and an official health certificate dated within 7 days of travel. Always check the current Category list for your exact country."
      fr: "Trinité-et-Tobago ne reconnaît pas le passeport européen, et les États membres de l'UE ne sont pas traités comme un bloc unique. Plusieurs pays de l'UE — par exemple l'Allemagne, l'Irlande, le Portugal, la Suède, Malte, l'Autriche, la Belgique, le Danemark, la République tchèque et le Luxembourg — sont en Catégorie 1, sans titrage antirabique requis. D'autres — par exemple la France, l'Espagne, l'Italie, les Pays-Bas, la Pologne et la Finlande — sont en Catégorie 2, qui exige une vaccination antirabique (après la puce) et un titrage antirabique (FAVN ou RFFIT) au moins un mois après la vaccination. Dans tous les cas, il faut le permis d'importation, la puce ISO, le traitement antiparasitaire et un certificat sanitaire officiel daté dans les 7 jours avant le voyage. Vérifie toujours la liste de Catégorie en vigueur pour ton pays précis."
      es: "Trinidad y Tobago no reconoce el pasaporte europeo para mascotas, y los Estados miembros de la UE no se tratan como un bloque único. Varios países de la UE — por ejemplo Alemania, Irlanda, Portugal, Suecia, Malta, Austria, Bélgica, Dinamarca, la República Checa y Luxemburgo — están en Categoría 1, por lo que no se exige prueba de titulación de rabia. Otros — por ejemplo Francia, España, Italia, los Países Bajos, Polonia y Finlandia — están en Categoría 2, que exige una vacunación antirrábica (después del microchip) y una prueba de titulación de rabia (FAVN o RFFIT) al menos un mes después de la vacunación. En todos los casos sigues necesitando el permiso de importación, el microchip ISO, el tratamiento antiparasitario y un certificado sanitario oficial fechado dentro de los 7 días previos al viaje. Comprueba siempre la lista de Categorías en vigor para tu país concreto."
      pt: "Trinidad e Tobago não reconhece o passaporte europeu para animais, e os Estados-membros da UE não são tratados como um bloco único. Vários países da UE — por exemplo, Alemanha, Irlanda, Portugal, Suécia, Malta, Áustria, Bélgica, Dinamarca, República Tcheca e Luxemburgo — estão na Categoria 1, então não é exigido teste sorológico antirrábico. Outros — por exemplo, França, Espanha, Itália, Países Baixos, Polônia e Finlândia — estão na Categoria 2, que exige vacinação antirrábica (depois do microchip) e teste sorológico antirrábico (FAVN ou RFFIT) feito no mínimo um mês depois da vacinação. Em todos os casos você ainda precisa da autorização de importação, do microchip ISO, do tratamento antiparasitário e de um atestado de saúde oficial emitido nos 7 dias anteriores à viagem. Confira sempre a lista de Categorias vigente para o seu país exato."
    cls: warn
  listed:
    title: { en: "Category 1 & 2 countries", fr: "Pays de Catégorie 1 et 2", es: "Países de Categoría 1 y 2", pt: "Países das Categorias 1 e 2" }
    body:
      en: "Category 1 covers countries where no rabies antibody test is required — including Great Britain, Australia, New Zealand, Singapore, and Caribbean neighbours such as Barbados, Jamaica, Dominica, St. Lucia and St. Kitts-Nevis. From these, prepare the import permit, ISO microchip, parasite treatment and health certificate. Category 2 covers countries where a rabies antibody test is required in addition — including the United States, Canada, Mexico, Japan and several European states. From a Category 2 country, your dog must be microchipped, then vaccinated against rabies, and pass a FAVN/RFFIT antibody test taken at least one month after vaccination, with the original result sent to the CVO."
      fr: "La Catégorie 1 couvre les pays où aucun titrage antirabique n'est requis — dont le Royaume-Uni (Grande-Bretagne), l'Australie, la Nouvelle-Zélande, Singapour, et des voisins des Caraïbes comme la Barbade, la Jamaïque, la Dominique, Sainte-Lucie et Saint-Kitts-et-Nevis. Depuis ces pays, prépare le permis d'importation, la puce ISO, le traitement antiparasitaire et le certificat sanitaire. La Catégorie 2 couvre les pays où un titrage antirabique est exigé en plus — dont les États-Unis, le Canada, le Mexique, le Japon et plusieurs États européens. Depuis un pays de Catégorie 2, le chien doit être pucé, puis vacciné contre la rage, et réussir un titrage FAVN/RFFIT réalisé au moins un mois après la vaccination, le résultat original étant transmis au CVO."
      es: "La Categoría 1 abarca países donde no se exige prueba de titulación de rabia — como Gran Bretaña, Australia, Nueva Zelanda, Singapur, y vecinos del Caribe como Barbados, Jamaica, Dominica, Santa Lucía y San Cristóbal y Nieves. Desde estos, prepara el permiso de importación, el microchip ISO, el tratamiento antiparasitario y el certificado sanitario. La Categoría 2 abarca países donde además se exige una prueba de titulación de rabia — como Estados Unidos, Canadá, México, Japón y varios Estados europeos. Desde un país de Categoría 2, tu perro debe llevar microchip, luego vacunarse contra la rabia y superar una prueba de titulación FAVN/RFFIT realizada al menos un mes después de la vacunación, con el resultado original enviado al CVO."
      pt: "A Categoria 1 abrange os países onde não é exigido teste sorológico antirrábico — incluindo Grã-Bretanha, Austrália, Nova Zelândia, Singapura e vizinhos do Caribe como Barbados, Jamaica, Dominica, Santa Lúcia e São Cristóvão e Névis. Vindo desses países, prepare a autorização de importação, o microchip ISO, o tratamento antiparasitário e o atestado de saúde. A Categoria 2 abrange os países onde, além disso, é exigido um teste sorológico antirrábico — incluindo Estados Unidos, Canadá, México, Japão e vários países europeus. De um país da Categoria 2, seu cachorro precisa ser microchipado, depois vacinado contra a raiva e aprovado em um teste sorológico FAVN/RFFIT feito no mínimo um mês depois da vacinação, com o resultado original enviado ao CVO."
    cls: warn
  nonListed:
    title: { en: "Category 3 — all other countries", fr: "Catégorie 3 — tous les autres pays", es: "Categoría 3 — todos los demás países", pt: "Categoria 3 — todos os demais países" }
    body:
      en: "Any country not listed in Category 1 or Category 2 falls in Category 3. From these origins the dog needs an ISO microchip, a rabies vaccination (after microchipping), and a rabies antibody test (FAVN or RFFIT) at least one month after vaccination showing a protective level. Crucially, the import permit application must be made — and travel must take place — at least five months after the rabies vaccination date, and up to 5 or 6 additional tests may be required depending on the exporting country. Plan several months ahead and confirm the exact test list with the APHD."
      fr: "Tout pays non listé en Catégorie 1 ou 2 relève de la Catégorie 3. Depuis ces origines, le chien a besoin d'une puce ISO, d'une vaccination antirabique (après la puce) et d'un titrage antirabique (FAVN ou RFFIT) au moins un mois après la vaccination, montrant un titre protecteur. Point crucial : la demande de permis — et le voyage — doivent intervenir au moins cinq mois après la date de vaccination antirabique, et jusqu'à 5 ou 6 tests complémentaires peuvent être exigés selon le pays exportateur. Prévois plusieurs mois et confirme la liste exacte des tests auprès de l'APHD."
      es: "Cualquier país no listado en Categoría 1 o Categoría 2 pertenece a la Categoría 3. Desde estos orígenes, el perro necesita un microchip ISO, una vacunación antirrábica (después del microchip) y una prueba de titulación de rabia (FAVN o RFFIT) al menos un mes después de la vacunación que muestre un nivel protector. Fundamental: la solicitud del permiso de importación — y el viaje — deben realizarse al menos cinco meses después de la fecha de vacunación antirrábica, y pueden exigirse hasta 5 o 6 pruebas adicionales según el país exportador. Planifica con varios meses de antelación y confirma la lista exacta de pruebas con la APHD."
      pt: "Qualquer país que não conste da Categoria 1 nem da Categoria 2 se enquadra na Categoria 3. Vindo dessas origens, o cachorro precisa de microchip ISO, de vacinação antirrábica (depois do microchip) e de um teste sorológico antirrábico (FAVN ou RFFIT) feito no mínimo um mês depois da vacinação e com nível protetor. E, o que é decisivo, o pedido da autorização de importação precisa ser feito — e a viagem precisa acontecer — no mínimo cinco meses depois da data da vacinação antirrábica, e podem ser exigidos até 5 ou 6 exames adicionais, dependendo do país exportador. Planeje-se com vários meses de antecedência e confirme a lista exata de exames com a APHD."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Trinidad and Tobago is controlled by the Animal Production and Health Division and the Veterinary Services quarantine officers."
    fr: "Ce qui se passe à l'arrivée de ton chien à Trinité-et-Tobago est contrôlé par l'Animal Production and Health Division et les agents de quarantaine des Services vétérinaires."
    es: "Lo que ocurre cuando tu perro llega a Trinidad y Tobago lo controlan la Animal Production and Health Division y los agentes de cuarentena de los Servicios Veterinarios."
    pt: "O que acontece quando seu cachorro chega a Trinidad e Tobago é controlado pela Animal Production and Health Division e pelos agentes de quarentena dos Veterinary Services."
  points:
    - en: "You must hold a valid import permit before the dog enters the country, and notify the Veterinary Officer (Quarantine) at least 2 working days / 48 hours before arrival."
      fr: "Tu dois détenir un permis d'importation valide avant l'entrée du chien, et prévenir le vétérinaire officiel (Quarantaine) au moins 2 jours ouvrables / 48 heures avant l'arrivée."
      es: "Debes tener un permiso de importación válido antes de que el perro entre en el país, y avisar al veterinario oficial (Cuarentena) al menos 2 días hábiles / 48 horas antes de la llegada."
      pt: "Você precisa ter uma autorização de importação válida antes de o cachorro entrar no país e avisar o Veterinary Officer (Quarantine) com pelo menos 2 dias úteis / 48 horas de antecedência em relação à chegada."
    - en: "Since 17 August 2022 the dog may travel in the cabin, as checked baggage or as cargo; officials verify the animal and its documents on arrival."
      fr: "Depuis le 17 août 2022, le chien peut voyager en cabine, en bagage enregistré ou en fret ; les agents vérifient l'animal et ses documents à l'arrivée."
      es: "Desde el 17 de agosto de 2022, el perro puede viajar en cabina, como equipaje facturado o como carga; los agentes verifican al animal y sus documentos a la llegada."
      pt: "Desde 17 de agosto de 2022, o cachorro pode viajar na cabine, como bagagem despachada ou como carga; os agentes conferem o animal e seus documentos na chegada."
    - en: "Carry the original official health certificate (dated within 7 days of travel) and, for Category 2/3 origins, the rabies vaccination record and antibody-test result, plus everything listed on the import permit."
      fr: "Munis-toi du certificat sanitaire officiel original (daté dans les 7 jours avant le voyage) et, pour les origines Catégorie 2/3, du carnet de vaccination antirabique et du résultat de titrage, ainsi que de tout ce qui figure sur le permis d'importation."
      es: "Lleva el certificado sanitario oficial original (fechado dentro de los 7 días previos al viaje) y, para orígenes de Categoría 2/3, el registro de vacunación antirrábica y el resultado de la prueba de titulación, además de todo lo que figure en el permiso de importación."
      pt: "Leve o atestado de saúde oficial original (emitido nos 7 dias anteriores à viagem) e, para origens das Categorias 2/3, a carteira de vacinação antirrábica e o resultado do teste sorológico, além de tudo o que estiver listado na autorização de importação."
    - en: "If all requirements are met, no quarantine is imposed and the dog is released."
      fr: "Si toutes les conditions sont remplies, aucune quarantaine n'est imposée et le chien est libéré."
      es: "Si se cumplen todos los requisitos, no se impone cuarentena y el perro es liberado."
      pt: "Se todas as exigências forem cumpridas, nenhuma quarentena é imposta e o cachorro é liberado."
    - en: "A dog that does not meet the import requirements may be quarantined, re-exported at the consignee's expense, or euthanised, as determined by the Inspector."
      fr: "Un chien ne remplissant pas les conditions d'importation peut être mis en quarantaine, réexpédié aux frais du destinataire, ou euthanasié, sur décision de l'Inspecteur."
      es: "Un perro que no cumpla los requisitos de importación puede ser puesto en cuarentena, reexportado a cargo del destinatario o sacrificado, según lo determine el Inspector."
      pt: "Um cachorro que não cumpra as exigências de importação pode ser posto em quarentena, reexportado às custas do consignatário ou submetido a eutanásia, conforme determinação do Inspector (fiscal)."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Trinidad and Tobago regulates certain breeds under the Dog Control Act, Chapter 67:56 (Act No. 11 of 2013), which repealed the earlier Dangerous Dogs Act, 2000, and came into force in stages in 2014–2015. This is separate from the biosecurity import scheme, and it governs how these dogs may be kept."
    fr: "Trinité-et-Tobago réglemente certaines races au titre du Dog Control Act, Chapitre 67:56 (loi n° 11 de 2013), qui a abrogé l'ancien Dangerous Dogs Act de 2000 et est entré en vigueur par étapes en 2014–2015. C'est distinct du dispositif de biosécurité à l'importation, et cela régit la manière de détenir ces chiens."
    es: "Trinidad y Tobago regula ciertas razas en virtud del Dog Control Act, Capítulo 67:56 (Ley n.º 11 de 2013), que derogó el anterior Dangerous Dogs Act de 2000 y entró en vigor por etapas en 2014–2015. Esto es independiente del sistema de bioseguridad de importación, y rige la manera en que pueden tenerse estos perros."
    pt: "Trinidad e Tobago regula certas raças pelo Dog Control Act, Chapter 67:56 (Act No. 11 of 2013), que revogou o antigo Dangerous Dogs Act, 2000 e entrou em vigor por etapas em 2014–2015. Isso é separado do esquema sanitário de importação e rege a forma como esses cachorros podem ser mantidos."
  cat1:
    en: "'Class A' dogs listed in the Schedule are: American Pit Bull Terrier, American Staffordshire Terrier, American Bully, Dogo Argentino, Japanese Tosa and Fila Brasileiro — plus any dog bred from these or predominantly conforming to their standards. Owners must register and license the dog, have it spayed/neutered and microchipped, hold liability insurance, and keep it muzzled and under control in public."
    fr: "Les chiens « Classe A » listés à l'Annexe sont : American Pit Bull Terrier, American Staffordshire Terrier, American Bully, Dogo Argentino, Tosa japonais et Fila Brasileiro — ainsi que tout chien issu de ces races ou conforme de manière prédominante à leurs standards. Le propriétaire doit enregistrer et licencier le chien, le faire stériliser et pucer, souscrire une assurance responsabilité civile, et le tenir muselé et sous contrôle en public."
    es: "Los perros de «Clase A» listados en el Anexo son: American Pit Bull Terrier, American Staffordshire Terrier, American Bully, Dogo Argentino, Tosa japonés y Fila Brasileiro — además de cualquier perro criado a partir de estos o que se ajuste de forma predominante a sus estándares. El propietario debe registrar y licenciar al perro, esterilizarlo y ponerle microchip, contratar un seguro de responsabilidad civil, y mantenerlo con bozal y bajo control en público."
    pt: "Os cachorros de “Classe A” listados no anexo (Schedule) são: American Pit Bull Terrier, American Staffordshire Terrier, American Bully, Dogo Argentino, Tosa Japonês e Fila Brasileiro — além de qualquer cachorro descendente dessas raças ou que corresponda predominantemente aos seus padrões. Os donos precisam registrar e licenciar o cachorro, castrá-lo e implantar um microchip, contratar seguro de responsabilidade civil e mantê-lo com focinheira e sob controle em locais públicos."
  cat2:
    en: "The Dog Control Act does not, on its face, contain an explicit import ban (the repealed Dangerous Dogs Act, 2000 had prohibited importing dangerous dogs), and the APHD's published import guidelines do not list breed prohibitions. In practice, importing a Class A breed means committing to the full Class A ownership regime (registration, licensing, insurance, sterilisation, muzzling)."
    fr: "Le Dog Control Act ne contient pas, en l'état, d'interdiction d'importation explicite (l'ancien Dangerous Dogs Act de 2000 interdisait l'importation de chiens dangereux), et les directives d'importation publiées par l'APHD ne listent pas d'interdictions de races. En pratique, importer une race de Classe A implique de s'engager dans le régime complet de détention de Classe A (enregistrement, licence, assurance, stérilisation, muselière)."
    es: "El Dog Control Act no contiene, en su literalidad, una prohibición de importación explícita (el derogado Dangerous Dogs Act de 2000 sí prohibía importar perros peligrosos), y las directrices de importación publicadas por la APHD no listan prohibiciones de razas. En la práctica, importar una raza de Clase A implica comprometerse con el régimen completo de tenencia de Clase A (registro, licencia, seguro, esterilización, bozal)."
    pt: "O Dog Control Act não traz, em seu texto, uma proibição explícita de importação (o revogado Dangerous Dogs Act, 2000 proibia importar cachorros perigosos), e as diretrizes de importação publicadas pela APHD não listam proibições de raça. Na prática, importar uma raça de Classe A significa assumir todo o regime de posse da Classe A (registro, licenciamento, seguro, esterilização e focinheira)."
  note:
    en: "Because the enforcement and import status of the breed law can change, confirm the current position with the Office of the Chief Veterinary Officer and the relevant Municipal Corporation before making any travel arrangements. Airlines may also refuse certain breeds."
    fr: "Comme l'application et le statut à l'importation de la loi sur les races peuvent évoluer, confirme la situation en vigueur auprès du bureau du Chief Veterinary Officer et de la Municipal Corporation compétente avant toute organisation de voyage. Les compagnies aériennes peuvent aussi refuser certaines races."
    es: "Dado que la aplicación y el estado de importación de la ley sobre razas pueden cambiar, confirma la situación en vigor con la oficina del Chief Veterinary Officer y la Municipal Corporation competente antes de organizar cualquier viaje. Las aerolíneas también pueden rechazar ciertas razas."
    pt: "Como a aplicação da lei sobre raças e sua repercussão na importação podem mudar, confirme a situação atual com o Office of the Chief Veterinary Officer e com a Municipal Corporation competente antes de tomar qualquer providência de viagem. As companhias aéreas também podem recusar certas raças."

checklist:
  - en: "Determine your dog's origin category (Category 1, 2 or 3) with the APHD"
    fr: "Déterminez la catégorie d'origine de ton chien (Catégorie 1, 2 ou 3) avec l'APHD"
    es: "Determina la categoría de origen de tu perro (Categoría 1, 2 o 3) con la APHD"
    pt: "Determinar a categoria de origem do seu cachorro (Categoria 1, 2 ou 3) junto à APHD"
  - en: "Confirm your dog is not a Class A breed under the Dog Control Act (or that you can meet the ownership rules)"
    fr: "Vérifie que ton chien n'est pas une race Classe A du Dog Control Act (ou que tu peux respecter les règles de détention)"
    es: "Confirma que tu perro no es una raza de Clase A del Dog Control Act (o que puedes cumplir las normas de tenencia)"
    pt: "Confirmar que seu cachorro não é de uma raça de Classe A do Dog Control Act (ou que você consegue cumprir as regras de posse)"
  - en: "ISO microchip (11784 / Annex A to 11785) implanted before any rabies vaccination"
    fr: "Puce ISO (11784 / Annexe A à 11785) posée avant toute vaccination antirabique"
    es: "Microchip ISO (11784 / Anexo A de 11785) implantado antes de cualquier vacunación antirrábica"
    pt: "Microchip ISO (11784 / anexo A da 11785) implantado antes de qualquer vacinação antirrábica"
  - en: "For Category 2 & 3: valid rabies vaccination, then a FAVN/RFFIT antibody test at least 1 month later showing a protective level"
    fr: "Pour Catégorie 2 et 3 : vaccination antirabique valide, puis titrage FAVN/RFFIT au moins 1 mois après montrant un titre protecteur"
    es: "Para Categoría 2 y 3: vacunación antirrábica válida, y luego una prueba de titulación FAVN/RFFIT al menos 1 mes después que muestre un nivel protector"
    pt: "Para as Categorias 2 e 3: vacinação antirrábica válida e, no mínimo 1 mês depois, um teste sorológico FAVN/RFFIT com nível protetor"
  - en: "For Category 3: apply and travel at least 5 months after the rabies vaccination date"
    fr: "Pour Catégorie 3 : demande le permis et voyage au moins 5 mois après la date de vaccination antirabique"
    es: "Para Categoría 3: solicita el permiso y viaja al menos 5 meses después de la fecha de vacunación antirrábica"
    pt: "Para a Categoria 3: solicitar a autorização e viajar no mínimo 5 meses depois da data da vacinação antirrábica"
  - en: "Internal and external parasite treatment within 10 days of travel"
    fr: "Traitement antiparasitaire interne et externe dans les 10 jours avant le voyage"
    es: "Tratamiento antiparasitario interno y externo dentro de los 10 días previos al viaje"
    pt: "Tratamento antiparasitário interno e externo nos 10 dias anteriores à viagem"
  - en: "Apply for the import permit in advance (1½ months for Category 1/2, 5 months for Category 3)"
    fr: "Demande le permis d'importation à l'avance (1½ mois pour Catégorie 1/2, 5 mois pour Catégorie 3)"
    es: "Solicita el permiso de importación con antelación (1½ meses para Categoría 1/2, 5 meses para Categoría 3)"
    pt: "Solicitar a autorização de importação com antecedência (1½ mês para as Categorias 1/2, 5 meses para a Categoria 3)"
  - en: "Official health certificate from the exporting country, dated within 7 days of travel, government-endorsed"
    fr: "Certificat sanitaire officiel du pays exportateur, daté dans les 7 jours avant le voyage, visé par le gouvernement"
    es: "Certificado sanitario oficial del país exportador, fechado dentro de los 7 días previos al viaje, refrendado por el gobierno"
    pt: "Atestado de saúde oficial do país exportador, emitido nos 7 dias anteriores à viagem e endossado pelo governo"
  - en: "Notify the Veterinary Officer (Quarantine) at least 2 working days / 48 hours before arrival"
    fr: "Préviens le vétérinaire officiel (Quarantaine) au moins 2 jours ouvrables / 48 heures avant l'arrivée"
    es: "Avisa al veterinario oficial (Cuarentena) al menos 2 días hábiles / 48 horas antes de la llegada"
    pt: "Avisar o Veterinary Officer (Quarantine) com pelo menos 2 dias úteis / 48 horas de antecedência em relação à chegada"
  - en: "Book a flight (cabin, checked baggage or cargo) and a suitable IATA crate; no quarantine if compliant"
    fr: "Réserve un vol (cabine, bagage enregistré ou fret) et une caisse IATA adaptée ; pas de quarantaine si conforme"
    es: "Reserva un vuelo (cabina, equipaje facturado o carga) y una jaula IATA adecuada; sin cuarentena si se cumplen los requisitos"
    pt: "Reservar o voo (cabine, bagagem despachada ou carga) e uma caixa de transporte adequada às normas da IATA; sem quarentena se estiver tudo em conformidade"

