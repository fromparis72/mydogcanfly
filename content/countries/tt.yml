# Country Entry Guide — Trinidad and Tobago (source of truth, bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_tt
iso2: "TT"
name: { en: "Trinidad and Tobago", fr: "Trinité-et-Tobago", es: "Trinidad y Tobago", pt: "Trinidad e Tobago" }
region: { en: "Caribbean", fr: "Caraïbes", es: "Caribe", pt: "Caribe" }


regime: listed

hero:
  h1: { en: "Traveling to Trinidad and Tobago with your dog", fr: "Voyager à Trinité-et-Tobago avec ton chien", es: "Viajar a Trinidad y Tobago con tu perro", pt: "Viajar com seu cachorro para Trinidad e Tobago" }
  intro:
    en: >-
      Trinidad and Tobago welcomes dogs, and since April 2013 it allows them to enter without quarantine
      once its import requirements are fully met. The scheme is run by the Animal Production and Health
      Division (APHD) and the Office of the Chief Veterinary Officer (CVO) of the Ministry of Agriculture,
      Land and Fisheries — not the EU pet-passport system. Every dog needs an import permit obtained in
      advance, an ISO microchip, a parasite treatment and an official health certificate. What else you
      must prepare depends on your dog's country of origin: the country is sorted into Category 1 (no
      rabies antibody test), Category 2 (rabies vaccination plus a rabies antibody test) or Category 3
      (all other countries — rabies vaccination, antibody test and a five-month wait). This guide explains
      exactly what to prepare before you book your flight.
    fr: >-
      Trinité-et-Tobago accueille les chiens et, depuis avril 2013, autorise leur entrée sans quarantaine
      dès lors que ses conditions d'importation sont pleinement remplies. Le dispositif est géré par
      l'Animal Production and Health Division (APHD) et le bureau du Chief Veterinary Officer (CVO) du
      ministère de l'Agriculture, des Terres et de la Pêche — et non par le système du passeport européen.
      Tout chien a besoin d'un permis d'importation obtenu à l'avance, d'une puce ISO, d'un traitement
      antiparasitaire et d'un certificat sanitaire officiel. Le reste dépend du pays d'origine du chien :
      celui-ci est classé en Catégorie 1 (pas de titrage antirabique), Catégorie 2 (vaccination antirabique
      et titrage antirabique) ou Catégorie 3 (tous les autres pays — vaccination, titrage et délai de cinq
      mois). Ce guide détaille exactement quoi préparer avant de réserver ton vol.
    es: >-
      Trinidad y Tobago acoge a los perros y, desde abril de 2013, permite su entrada sin cuarentena
      una vez que se cumplen plenamente sus requisitos de importación. El sistema lo gestionan la Animal
      Production and Health Division (APHD) y la oficina del Chief Veterinary Officer (CVO) del Ministerio
      de Agricultura, Tierras y Pesca — no el sistema del pasaporte europeo para mascotas. Todo perro
      necesita un permiso de importación obtenido con antelación, un microchip ISO, un tratamiento
      antiparasitario y un certificado sanitario oficial. Lo demás que debas preparar depende del país de
      origen de tu perro: el país se clasifica en Categoría 1 (sin prueba de titulación de rabia),
      Categoría 2 (vacunación antirrábica más una prueba de titulación de rabia) o Categoría 3 (todos los
      demás países — vacunación antirrábica, prueba de titulación y una espera de cinco meses). Esta guía
      explica exactamente qué preparar antes de reservar tu vuelo.

    pt: "Trinidad e Tobago recebe cachorros e, desde abril de 2013, permite a entrada sem quarentena desde que todas as exigências de importação sejam cumpridas. O esquema é conduzido pela Animal Production and Health Division (APHD) e pelo Office of the Chief Veterinary Officer (CVO) do Ministry of Agriculture, Land and Fisheries (Ministério da Agricultura, Terras e Pesca) — e não pelo sistema do passaporte europeu para animais. Todo cachorro precisa de uma autorização de importação obtida com antecedência, de um microchip ISO, de um tratamento antiparasitário e de um atestado de saúde oficial. O que mais você tem de preparar depende do país de origem do seu cachorro: o país é classificado na Categoria 1 (sem teste sorológico antirrábico), na Categoria 2 (vacinação antirrábica mais teste sorológico antirrábico) ou na Categoria 3 (todos os demais países — vacinação antirrábica, teste sorológico e cinco meses de espera). Este guia explica exatamente o que preparar antes de você comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Moderate — import permit and (for most origins) a rabies antibody test, but no quarantine", fr: "Modérée — permis d'importation et (pour la plupart des origines) titrage antirabique, mais sans quarantaine", es: "Moderada — permiso de importación y (para la mayoría de los orígenes) prueba de titulación de rabia, pero sin cuarentena", pt: "Moderado — autorização de importação e (para a maioria das origens) teste sorológico antirrábico, mas sem quarentena" }

prepTime:
  eu:
    en: "EU countries are split: some (e.g. Germany, Ireland, Portugal, Sweden) are in Category 1 — allow ~1.5 months for the permit. Others (e.g. France, Spain, Italy, the Netherlands) are in Category 2 and also need a rabies antibody test taken at least 1 month after vaccination."
    fr: "Les pays de l'UE sont répartis : certains (ex. Allemagne, Irlande, Portugal, Suède) sont en Catégorie 1 — compte ~1,5 mois pour le permis. D'autres (ex. France, Espagne, Italie, Pays-Bas) sont en Catégorie 2 et exigent aussi un titrage antirabique réalisé au moins 1 mois après la vaccination."
    es: "Los países de la UE están divididos: algunos (p. ej. Alemania, Irlanda, Portugal, Suecia) están en Categoría 1 — calcula ~1,5 meses para el permiso. Otros (p. ej. Francia, España, Italia, los Países Bajos) están en Categoría 2 y también necesitan una prueba de titulación de rabia realizada al menos 1 mes después de la vacunación."
    pt: "Os países da UE estão divididos: alguns (por exemplo, Alemanha, Irlanda, Portugal, Suécia) estão na Categoria 1 — reserve cerca de 1,5 mês para a autorização. Outros (por exemplo, França, Espanha, Itália, Países Baixos) estão na Categoria 2 e precisam ainda de um teste sorológico antirrábico feito no mínimo 1 mês depois da vacinação."
  listed:
    en: "Category 1 countries: about 1.5 months — mainly the permit lead time, microchip, parasite treatment and health certificate. Category 2 countries (e.g. USA, Canada): longer, because of the rabies vaccination and antibody test."
    fr: "Pays de Catégorie 1 : environ 1,5 mois — surtout le délai du permis, la puce, le traitement antiparasitaire et le certificat sanitaire. Pays de Catégorie 2 (ex. USA, Canada) : plus long, en raison de la vaccination et du titrage antirabiques."
    es: "Países de Categoría 1: alrededor de 1,5 meses — sobre todo el plazo del permiso, el microchip, el tratamiento antiparasitario y el certificado sanitario. Países de Categoría 2 (p. ej. EE. UU., Canadá): más tiempo, debido a la vacunación antirrábica y la prueba de titulación."
    pt: "Países da Categoria 1: cerca de 1,5 mês — sobretudo o prazo de emissão da autorização, mais o microchip, o tratamento antiparasitário e o atestado de saúde. Países da Categoria 2 (por exemplo, EUA, Canadá): mais tempo, por causa da vacinação antirrábica e do teste sorológico."
  nonListed:
    en: "Category 3 (all other countries): at least 5 months — the permit application must be made, and travel must take place, at least five months after the rabies vaccination date, on top of the antibody test."
    fr: "Catégorie 3 (tous les autres pays) : au moins 5 mois — la demande de permis, et le voyage, doivent intervenir au moins cinq mois après la date de vaccination antirabique, en plus du titrage."
    es: "Categoría 3 (todos los demás países): al menos 5 meses — la solicitud del permiso, y el viaje, deben realizarse al menos cinco meses después de la fecha de vacunación antirrábica, además de la prueba de titulación."
    pt: "Categoria 3 (todos os demais países): pelo menos 5 meses — o pedido de autorização precisa ser feito, e a viagem precisa acontecer, no mínimo cinco meses depois da data da vacinação antirrábica, além do teste sorológico."

