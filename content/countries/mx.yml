    ref: { en: "SENASICA — requirements to enter Mexico", fr: "SENASICA — exigences pour entrer au Mexique", es: "SENASICA — requisitos para entrar a México", pt: "SENASICA — exigências para entrar no México" }
  - item: { en: "Internal & external deworming", fr: "Vermifugation interne & externe", es: "Desparasitación interna y externa", pt: "Vermifugação interna e externa" }
    required: { en: "Conditional", fr: "Conditionnelle", es: "Condicional", pt: "Condicional" }
    when: { en: "Must have been done within the previous 6 months and the dog be free of ectoparasites — stated on the certificate for arrivals from countries other than the US/Canada.", fr: "Doit avoir été effectuée dans les 6 mois précédents et le chien être exempt d'ectoparasites — mentionné sur le certificat pour les arrivées depuis les pays autres que USA/Canada.", es: "Debe haberse hecho dentro de los 6 meses previos y el perro estar libre de ectoparásitos — indicado en el certificado para las llegadas de países distintos de EE. UU./Canadá.", pt: "Precisa ter sido feita nos 6 meses anteriores e o cachorro estar livre de ectoparasitas — informado no certificado nas chegadas de países que não sejam EUA/Canadá." }
    exceptions: { en: "For US/Canada arrivals, the dog is simply checked for ectoparasites on arrival.", fr: "Pour les arrivées depuis USA/Canada, le chien est simplement contrôlé pour les ectoparasites à l'arrivée.", es: "Para las llegadas desde EE. UU./Canadá, simplemente se revisa al perro en busca de ectoparásitos a la llegada.", pt: "Nas chegadas dos EUA/Canadá, o cachorro é apenas examinado em busca de ectoparasitas no momento da chegada." }
    ref: { en: "SENASICA — requirements to enter Mexico", fr: "SENASICA — exigences pour entrer au Mexique", es: "SENASICA — requisitos para entrar a México", pt: "SENASICA — exigências para entrar no México" }
  - item: { en: "Clean crate / carrier", fr: "Caisse / cage propre", es: "Jaula / transportadora limpia", pt: "Caixa / bolsa de transporte limpa" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "The crate must be clean, with no bedding, toys, treats or objects made with ruminant-origin ingredients; it is given a preventive spray on arrival. Collar and leash are allowed.", fr: "La caisse doit être propre, sans litière, jouets, friandises ni objets à base d'ingrédients d'origine ruminante ; elle reçoit une pulvérisation préventive à l'arrivée. Collier et laisse sont autorisés.", es: "La jaula debe estar limpia, sin cama, juguetes, premios ni objetos elaborados con ingredientes de origen rumiante; recibe una fumigación preventiva a la llegada. Se permiten collar y correa.", pt: "A caixa de transporte precisa estar limpa, sem forração, brinquedos, petiscos nem objetos feitos com ingredientes de origem ruminante; ela recebe uma pulverização preventiva na chegada. Coleira e guia são permitidas." }
    exceptions: { en: "Any prohibited items found inside are removed and destroyed.", fr: "Tout article interdit trouvé à l'intérieur est retiré et détruit.", es: "Cualquier artículo prohibido que se encuentre dentro se retira y se destruye.", pt: "Qualquer item proibido encontrado dentro dela é retirado e destruído." }
    ref: { en: "SADER-SENASICA — general information", fr: "SADER-SENASICA — informations générales", es: "SADER-SENASICA — información general", pt: "SADER-SENASICA — informações gerais" }
  - item: { en: "Advance notification / import permit", fr: "Notification préalable / permis d'import", es: "Notificación previa / permiso de importación", pt: "Notificação prévia / autorização de importação" }
    required: { en: "Not required", fr: "Non requis", es: "No obligatorio", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "No prior permit is needed; SENASICA issues the free Import Zoosanitary Certificate at the point of entry.", fr: "Aucun permis préalable n'est nécessaire ; le SENASICA délivre gratuitement le Certificat Zoosanitaire d'Importation au point d'entrée.", es: "No se necesita permiso previo; SENASICA expide gratuitamente el Certificado Zoosanitario de Importación en el punto de entrada.", pt: "Não é preciso permissão prévia; o SENASICA emite gratuitamente o Certificado Zoossanitário de Importação no ponto de entrada." }
    ref: { en: "SENASICA — travelling with your pet", fr: "SENASICA — voyager avec ton animal", es: "SENASICA — viajar con tu mascota", pt: "SENASICA — viajar com seu animal de estimação" }
  - item: { en: "OISA border inspection", fr: "Inspection frontalière OISA", es: "Inspección fronteriza de la OISA", pt: "Inspeção de fronteira da OISA" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "At the point of entry, SENASICA's OISA staff carry out a physical inspection (plus a documentary review for arrivals from other countries) to confirm the dog shows no signs of disease, fresh wounds or ectoparasites.", fr: "Au point d'entrée, le personnel OISA du SENASICA effectue une inspection physique (plus un examen documentaire pour les arrivées d'autres pays) afin de vérifier l'absence de signes de maladie, de plaies fraîches et d'ectoparasites.", es: "En el punto de entrada, el personal de la OISA de SENASICA realiza una inspección física (más una revisión documental para las llegadas de otros países) para confirmar que el perro no presenta signos de enfermedad, heridas frescas ni ectoparásitos.", pt: "No ponto de entrada, a equipe da OISA do SENASICA faz uma inspeção física (mais uma conferência documental nas chegadas de outros países) para confirmar que o cachorro não apresenta sinais de doença, feridas recentes nem ectoparasitas." }
    exceptions: { en: "From the US/Canada it is a brief physical check only.", fr: "Depuis les USA/Canada, il s'agit d'un simple contrôle physique bref.", es: "Desde EE. UU./Canadá se trata solo de una breve revisión física.", pt: "Vindo dos EUA/Canadá, trata-se apenas de uma breve conferência física." }
    ref: { en: "SENASICA — inspection at the point of entry", fr: "SENASICA — inspection au point d'entrée", es: "SENASICA — inspección en el punto de entrada", pt: "SENASICA — inspeção no ponto de entrada" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "No minimum age", fr: "Pas d'âge minimum", es: "Sin edad mínima", pt: "Sem idade mínima" }
    when: { en: "Mexico sets no minimum entry age; animals under 3 months are exempt from the rabies-vaccination requirement.", fr: "Le Mexique ne fixe pas d'âge minimum d'entrée ; les animaux de moins de 3 mois sont exemptés de l'exigence de vaccination antirabique.", es: "México no fija una edad mínima de entrada; los animales menores de 3 meses están exentos del requisito de vacunación antirrábica.", pt: "O México não fixa idade mínima de entrada; animais com menos de 3 meses estão isentos da exigência de vacinação antirrábica." }
    exceptions: { en: "Airline age rules and your home country's return rules may be stricter.", fr: "Les règles d'âge des compagnies et les règles de retour de ton pays peuvent être plus strictes.", es: "Las normas de edad de las aerolíneas y las normas de regreso de tu país pueden ser más estrictas.", pt: "As regras de idade da companhia aérea e as regras de retorno do seu país podem ser mais rígidas." }
    ref: { en: "SENASICA — requirements to enter Mexico", fr: "SENASICA — exigences pour entrer au Mexique", es: "SENASICA — requisitos para entrar a México", pt: "SENASICA — exigências para entrar no México" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not required", fr: "Non requise", es: "No obligatoria", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "If a risk is detected (e.g. ticks or possible exotic parasites), the OISA may hold the dog until laboratory results rule it out; costs are the owner's.", fr: "Si un risque est détecté (p. ex. tiques ou parasites exotiques possibles), l'OISA peut retenir le chien jusqu'aux résultats de laboratoire ; les frais sont à la charge du propriétaire.", es: "Si se detecta un riesgo (p. ej. garrapatas o posibles parásitos exóticos), la OISA puede retener al perro hasta que los resultados de laboratorio lo descarten; los costes corren a cargo del propietario.", pt: "Se for detectado um risco (por exemplo, carrapatos ou possíveis parasitas exóticos), a OISA pode reter o cachorro até que os resultados de laboratório o descartem; os custos correm por conta do dono." }
    ref: { en: "SENASICA — considerations during inspection", fr: "SENASICA — considérations lors de l'inspection", es: "SENASICA — consideraciones durante la inspección", pt: "SENASICA — considerações durante a inspeção" }

origin:
  eu:
    title: { en: "From the US or Canada — inspection only", fr: "Depuis les USA ou le Canada — simple inspection", es: "Desde EE. UU. o Canadá — solo inspección", pt: "Dos EUA ou do Canadá — apenas inspeção" }
    body:
      en: "If your dog's origin is Mexico, the US or Canada and it arrives from the US or Canada, no Certificate of Good Health and no vaccination card are required. On arrival, SENASICA staff carry out a brief physical inspection to confirm the dog shows no signs of infectious or contagious disease, no fresh or healing wounds, and no ectoparasites."
      fr: "Si l'origine de ton chien est le Mexique, les USA ou le Canada et qu'il arrive des USA ou du Canada, aucun Certificat de Bonne Santé ni carnet de vaccination n'est requis. À l'arrivée, le personnel du SENASICA effectue une brève inspection physique pour confirmer l'absence de signes de maladie infectieuse ou contagieuse, de plaies fraîches ou en cicatrisation, et d'ectoparasites."
      es: "Si el origen de tu perro es México, EE. UU. o Canadá y llega desde EE. UU. o Canadá, no se exige ningún Certificado de Buena Salud ni cartilla de vacunación. A la llegada, el personal de SENASICA realiza una breve inspección física para confirmar que el perro no presenta signos de enfermedad infecciosa o contagiosa, ni heridas frescas o en cicatrización, ni ectoparásitos."
      pt: "Se a origem do seu cachorro é o México, os EUA ou o Canadá e ele chega dos EUA ou do Canadá, não são exigidos Certificado de Boa Saúde nem carteira de vacinação. Na chegada, a equipe do SENASICA faz uma breve inspeção física para confirmar que o cachorro não apresenta sinais de doença infecciosa ou contagiosa, nem feridas recentes ou em cicatrização, nem ectoparasitas."
    cls: ok
  listed:
    title: { en: "From any other country — Certificate of Good Health", fr: "Depuis tout autre pays — Certificat de Bonne Santé", es: "Desde cualquier otro país — Certificado de Buena Salud", pt: "De qualquer outro país — Certificado de Boa Saúde" }
    body:
      en: "Arriving from a country other than the US or Canada, you must present a Certificate of Good Health issued within the last 15 days (original + copy) on official or licensed-vet letterhead. It must give the exporter and importer details, the rabies vaccine date and validity (dogs under 3 months exempt), confirm the dog is clinically healthy, and confirm it was dewormed internally and externally within the previous 6 months and is free of ectoparasites."
      fr: "En arrivant d'un pays autre que les USA ou le Canada, tu dois présenter un Certificat de Bonne Santé établi dans les 15 derniers jours (original + copie) sur papier officiel ou à en-tête d'un vétérinaire agréé. Il doit indiquer les coordonnées de l'exportateur et de l'importateur, la date et la validité du vaccin antirabique (chiens de moins de 3 mois exemptés), confirmer que le chien est cliniquement sain et qu'il a été vermifugé en interne et en externe dans les 6 mois précédents et est exempt d'ectoparasites."
      es: "Al llegar de un país distinto de EE. UU. o Canadá, debes presentar un Certificado de Buena Salud expedido dentro de los últimos 15 días (original + copia) en papel oficial o con membrete de un veterinario acreditado. Debe indicar los datos del exportador y del importador, la fecha y la valide de la vacuna antirrábica (perros menores de 3 meses exentos), confirmar que el perro está clínicamente sano, y confirmar que fue desparasitado interna y externamente dentro de los 6 meses previos y está libre de ectoparásitos."
      pt: "Chegando de um país que não seja os EUA ou o Canadá, você precisa apresentar um Certificado de Boa Saúde emitido nos últimos 15 dias (original + cópia), em papel oficial ou timbrado de veterinário credenciado. Ele deve trazer os dados do exportador e do importador, a data e a validade da vacina antirrábica (cachorros com menos de 3 meses estão isentos), confirmar que o cachorro está clinicamente saudável e confirmar que ele foi vermifugado interna e externamente nos 6 meses anteriores e está livre de ectoparasitas."
    cls: warn
  nonListed:
    title: { en: "Missing documents & the return trip", fr: "Documents manquants & voyage de retour", es: "Documentos que faltan y el viaje de regreso", pt: "Documentos faltando e a viagem de volta" }
    body:
      en: "If you lack the certificate or vaccination proof, a private vet in Mexico can examine your dog, apply any needed treatment and issue the certificate on the spot (at your expense), so entry is rarely blocked. Remember that even though Mexico may not demand a rabies vaccination at the border, one is strongly recommended — and almost always required — to bring your dog back into your home country."
      fr: "Si le certificat ou la preuve de vaccination te manque, un vétérinaire privé au Mexique peut examiner ton chien, appliquer tout traitement nécessaire et délivrer le certificat sur place (à tes frais), si bien que l'entrée est rarement bloquée. Rappelle-toi que même si le Mexique n'exige pas toujours la vaccination antirabique à la frontière, elle est fortement recommandée — et presque toujours obligatoire — pour ramener ton chien dans ton pays."
      es: "Si te falta el certificado o la prueba de vacunación, un veterinario privado en México puede examinar a tu perro, aplicar cualquier tratamiento necesario y expedir el certificado en el momento (a tu cargo), por lo que la entrada rara vez se bloquea. Recuerda que, aunque México no siempre exija la vacunación antirrábica en la frontera, es muy recomendable — y casi siempre obligatoria — para traer de vuelta a tu perro a tu país de origen."
      pt: "Se faltar o certificado ou a prova de vacinação, um veterinário particular no México pode examinar seu cachorro, aplicar o tratamento necessário e emitir o certificado na hora (às suas custas), de modo que a entrada raramente é bloqueada. Lembre-se de que, mesmo que o México nem sempre exija a vacinação antirrábica na fronteira, ela é fortemente recomendada — e quase sempre obrigatória — para levar seu cachorro de volta ao seu país de origem."
    cls: neutral

arrival:
  intro:
    en: "What happens when your dog reaches Mexico depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien au Mexique dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a México depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega ao México depende do lugar de onde você embarcou."
  points:
    - en: "Go to the SENASICA Animal and Plant Health Inspection Office (OISA) at the airport, seaport or land border of entry to obtain the free Import Zoosanitary Certificate."
      fr: "Rends-toi au bureau d'inspection sanitaire (OISA) du SENASICA de l'aéroport, du port ou de la frontière terrestre d'arrivée pour obtenir le Certificat Zoosanitaire d'Importation gratuit."
      es: "Acude a la Oficina de Inspección de Sanidad Agropecuaria (OISA) de SENASICA en el aeropuerto, puerto o frontera terrestre de entrada para obtener el Certificado Zoosanitario de Importación gratuito."
      pt: "Vá até o Escritório de Inspeção de Sanidade Agropecuária (OISA) do SENASICA no aeroporto, porto ou fronteira terrestre de entrada para obter o Certificado Zoossanitário de Importação gratuito."
    - en: "From the US or Canada: a brief physical inspection only — no certificate or vaccination card needed."
      fr: "Depuis les USA ou le Canada : une brève inspection physique uniquement — sans certificat ni carnet de vaccination."
      es: "Desde EE. UU. o Canadá: solo una breve inspección física — sin necesidad de certificado ni cartilla de vacunación."
      pt: "Dos EUA ou do Canadá: apenas uma breve inspeção física — sem necessidade de certificado nem de carteira de vacinação."
    - en: "From any other country: present the original Certificate of Good Health (plus a copy) for a documentary and physical review."
      fr: "Depuis tout autre pays : présente le Certificat de Bonne Santé original (plus une copie) pour un examen documentaire et physique."
      es: "Desde cualquier otro país: presenta el Certificado de Buena Salud original (más una copia) para una revisión documental y física."
      pt: "De qualquer outro país: apresente o Certificado de Boa Saúde original (mais uma cópia) para uma conferência documental e física."
    - en: "The crate must be clean and empty of bedding, toys, treats and ruminant-based items; it is sprayed with a preventive treatment. Collar and leash are allowed."
      fr: "La caisse doit être propre et vide de litière, jouets, friandises et articles à base de ruminant ; elle est pulvérisée d'un traitement préventif. Collier et laisse sont autorisés."
      es: "La jaula debe estar limpia y sin cama, juguetes, premios ni artículos a base de rumiante; se le aplica un tratamiento preventivo por fumigación. Se permiten collar y correa."
      pt: "A caixa de transporte precisa estar limpa e sem forração, brinquedos, petiscos nem itens à base de ruminante; ela recebe a pulverização de um tratamento preventivo. Coleira e guia são permitidas."
    - en: "If ectoparasites or ticks are found, or a possible exotic parasite is suspected, the OISA may keep the dog until lab results clear it — at the owner's expense."
      fr: "Si des ectoparasites ou des tiques sont trouvés, ou qu'un parasite exotique est suspecté, l'OISA peut garder le chien jusqu'aux résultats de laboratoire — aux frais du propriétaire."
      es: "Si se encuentran ectoparásitos o garrapatas, o se sospecha de un posible parásito exótico, la OISA puede retener al perro hasta que los resultados de laboratorio lo descarten — a cargo del propietario."
      pt: "Se forem encontrados ectoparasitas ou carrapatos, ou se houver suspeita de um possível parasita exótico, a OISA pode manter o cachorro até que os resultados de laboratório o liberem — às custas do dono."
    - en: "Frequent travellers can register in the Pet Frequent Traveler Program (PMVF) to hold a document valid for six months and skip repeated paperwork."
      fr: "Les voyageurs fréquents peuvent s'inscrire au Programme Animal Voyageur Fréquent (PMVF) pour disposer d'un document valable six mois et éviter les formalités répétées."
      es: "Los viajeros frecuentes pueden inscribirse en el Programa Mascota Viajero Frecuente (PMVF) para disponer de un documento válido durante seis meses y evitar los trámites repetidos."
      pt: "Quem viaja com frequência pode se inscrever no Programa Mascota Viajero Frecuente (PMVF) para ter um documento válido por seis meses e evitar repetir a papelada."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Mexico has no national breed-specific legislation. Federal law does not ban or restrict any dog breed for import or ownership, and there is no official dangerous-dog list at the national level."
    fr: "Le Mexique n'a pas de législation nationale spécifique aux races. La loi fédérale n'interdit ni ne restreint aucune race de chien pour l'importation ou la détention, et il n'existe aucune liste officielle de chiens dangereux au niveau national."
    es: "México no tiene legislación nacional específica por razas. La ley federal no prohíbe ni restringe ninguna raza de perro para la importación o la tenencia, y no existe una lista oficial de perros peligrosos a nivel nacional."
    pt: "O México não tem legislação nacional específica por raça. A lei federal não proíbe nem restringe nenhuma raça de cachorro para importação ou posse, e não existe lista oficial de cachorros perigosos em nível nacional."
  cat1:
    en: "No banned category: there is no federal list of prohibited breeds, so no dog is refused entry to Mexico on the basis of its breed. Bringing in any breed is permitted provided the health-inspection rules are met."
    fr: "Aucune catégorie interdite : il n'existe pas de liste fédérale de races prohibées, donc aucun chien n'est refusé à l'entrée au Mexique en raison de sa race. L'importation de toute race est autorisée sous réserve du respect des règles d'inspection sanitaire."
    es: "Sin categoría prohibida: no existe una lista federal de razas prohibidas, por lo que a ningún perro se le niega la entrada a México por razón de su raza. Se permite introducir cualquier raza siempre que se cumplan las normas de inspección sanitaria."
    pt: "Nenhuma categoria proibida: não existe lista federal de raças proibidas, portanto nenhum cachorro tem a entrada no México recusada por causa da raça. É permitido trazer qualquer raça, desde que as regras de inspeção sanitária sejam cumpridas."
  cat2:
    en: "Local rules & responsible ownership: some municipalities or states may have their own ordinances (leashing, muzzling, insurance), so the owner is responsible for the dog's behaviour. Dogfighting and breeding, training or trading dogs for fights are prohibited under the Federal Penal Code (Art. 419 Bis)."
    fr: "Règles locales & détention responsable : certaines municipalités ou certains États peuvent avoir leurs propres arrêtés (laisse, muselière, assurance), le propriétaire étant responsable du comportement du chien. Les combats de chiens ainsi que l'élevage, le dressage ou le commerce de chiens à cette fin sont interdits par le Code pénal fédéral (art. 419 Bis)."
    es: "Normas locales y tenencia responsable: algunos municipios o estados pueden tener sus propias ordenanzas (correa, bozal, seguro), por lo que el propietario es responsable del comportamiento del perro. Las peleas de perros, así como la cría, el adiestramiento o el comercio de perros para peleas, están prohibidos por el Código Penal Federal (art. 419 Bis)."
    pt: "Regras locais e posse responsável: alguns municípios ou estados podem ter suas próprias normas (guia, focinheira, seguro), e o dono é responsável pelo comportamento do cachorro. As rinhas de cachorros, assim como a criação, o adestramento ou o comércio de cachorros para brigas, são proibidos pelo Código Penal Federal (art. 419 Bis)."
  note:
    en: "Because there is no national breed ban, focus on the health-inspection rules for entry. If you will stay in a specific city, check that municipality's local ordinances for any leash, muzzle or insurance requirements."
    fr: "Comme il n'y a pas d'interdiction nationale de race, concentre-toi sur les règles d'inspection sanitaire pour l'entrée. Si tu séjourne dans une ville précise, vérifie les arrêtés municipaux locaux pour d'éventuelles obligations de laisse, muselière ou assurance."
    es: "Como no hay prohibición nacional de razas, céntrate en las normas de inspección sanitaria para la entrada. Si vas a quedarte en una ciudad concreta, consulta las ordenanzas locales de ese municipio por si hay requisitos de correa, bozal o seguro."
    pt: "Como não há proibição nacional por raça, concentre-se nas regras de inspeção sanitária para a entrada. Se você vai ficar em uma cidade específica, consulte as normas locais desse município para eventuais exigências de guia, focinheira ou seguro."

checklist:
  - en: "Confirm your dog's origin and departure country (US/Canada vs. elsewhere)"
    fr: "Confirme le pays d'origine et de départ de ton chien (USA/Canada ou ailleurs)"
    es: "Confirma el país de origen y de salida de tu perro (EE. UU./Canadá u otro lugar)"
    pt: "Confirme o país de origem e de partida do seu cachorro (EUA/Canadá ou outro)"
  - en: "Certificate of Good Health (issued within 15 days) — only if arriving from a country other than the US/Canada"
    fr: "Certificat de Bonne Santé (établi dans les 15 jours) — uniquement si arrivée depuis un pays autre que USA/Canada"
    es: "Certificado de Buena Salud (expedido dentro de los 15 días) — solo si llegas de un país distinto de EE. UU./Canadá"
    pt: "Certificado de Boa Saúde (emitido nos últimos 15 dias) — somente se você chegar de um país que não seja EUA/Canadá"
  - en: "Rabies vaccination up to date — recommended for entry and usually required to return home"
    fr: "Vaccination antirabique à jour — recommandée à l'entrée et généralement exigée pour rentrer"
    es: "Vacunación antirrábica al día — recomendada para la entrada y por lo general obligatoria para regresar a casa"
    pt: "Vacinação antirrábica em dia — recomendada para a entrada e geralmente obrigatória para voltar para casa"
  - en: "Proof of internal & external deworming within the previous 6 months"
    fr: "Preuve de vermifugation interne & externe dans les 6 mois précédents"
    es: "Prueba de desparasitación interna y externa dentro de los 6 meses previos"
    pt: "Comprovante de vermifugação interna e externa nos 6 meses anteriores"
  - en: "Clean crate — no bedding, toys, treats or ruminant-based items inside"
    fr: "Caisse propre — sans litière, jouets, friandises ni articles à base de ruminant à l'intérieur"
    es: "Jaula limpia — sin cama, juguetes, premios ni artículos a base de rumiante en su interior"
    pt: "Caixa de transporte limpa — sem forração, brinquedos, petiscos nem itens à base de ruminante dentro"
