    status: { en: "Within the previous 6 months (on the certificate from other countries)", fr: "Dans les 6 mois précédents (sur le certificat depuis les autres pays)", es: "Dentro de los 6 meses previos (en el certificado desde otros países)", pt: "Nos 6 meses anteriores (no certificado quando se vem de outros países)" }
    cls: neutral
  - requirement: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
