# Country Entry Guide — Mexico (bilingual EN/FR).
# Mexico is NOT in the EU. This encodes Mexico's own SENASICA/SADER scheme.
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_mx
iso2: "MX"
name: { en: "Mexico", fr: "Mexique", es: "México", pt: "México" }
region: { en: "North America", fr: "Amérique du Nord", es: "América del Norte", pt: "América do Norte" }

# Round-trip layer: Mexico is an EU-listed third country (return needs a health certificate, no titer),
# but LEAVING Mexico requires a SENASICA export endorsement — the often-forgotten step.
regime: listed
domestic:
  intro:
    en: "Domestic flight in Mexico: no federal formality — in practice it is the airlines that impose the paperwork."
    fr: "Vol intérieur au Mexique : aucune formalité fédérale — en pratique, ce sont les compagnies qui imposent les documents."
    es: "Vuelo nacional en México: ningún trámite federal — en la práctica son las aerolíneas las que imponen los documentos."
    pt: "Voo doméstico no México: nenhuma formalidade federal — na prática, são as companhias aéreas que impõem os documentos."
  points:
    - en: "No federal rule requires rabies vaccination, a microchip or a sanitary certificate for a domestic flight, and SENASICA's certificate is not triggered for pet dogs."
      fr: "Aucune règle fédérale n'impose vaccination antirabique, puce ou certificat sanitaire pour un vol intérieur, et le certificat du SENASICA ne s'applique pas aux chiens de compagnie."
      es: "Ninguna norma federal exige vacuna antirrábica, microchip ni certificado sanitario para un vuelo nacional, y el certificado de SENASICA no aplica a perros de compañía."
      pt: "Nenhuma regra federal exige vacinação antirrábica, microchip ou certificado sanitário para um voo doméstico, e o certificado do SENASICA não se aplica a cachorros de estimação."
    - en: "Mexican carriers, however, commonly require a vaccination record plus a health certificate issued within about 5 days, with weight limits and long brachycephalic exclusion lists."
      fr: "Les compagnies mexicaines exigent en revanche couramment un carnet de vaccination et un certificat de santé de moins de 5 jours environ, avec limites de poids et longues listes d'exclusion de races brachycéphales."
      es: "Las aerolíneas mexicanas sí suelen exigir cartilla de vacunación y certificado de salud de unos 5 días, con límites de peso y largas listas de exclusión de razas braquicéfalas."
      pt: "As companhias aéreas mexicanas, porém, costumam exigir carteira de vacinação e um atestado de saúde com no máximo cerca de 5 dias, além de limites de peso e longas listas de exclusão de raças braquicefálicas."
exit:
  authority: SENASICA
  authorityUrl: https://www.gob.mx/senasica/documentos/viajas-a-la-union-europea
  intro:
    en: "Leaving Mexico with your dog needs a SENASICA export procedure — not just your dog's passport."
    fr: "Sortir du Mexique avec ton chien demande une démarche d'export SENASICA — pas seulement le passeport de ton chien."
    es: "Salir de México con tu perro requiere un trámite de exportación de SENASICA — no solo el pasaporte de tu perro."
    pt: "Sair do México com seu cachorro exige um procedimento de exportação do SENASICA — não apenas o passaporte do seu cachorro."
  steps:
    - timing: window
      text:
        en: "Request the SENASICA export health certificate in advance (about 3 business days)."
        fr: "Demande le certificat zoosanitaire d'exportation SENASICA en amont (environ 3 jours ouvrés)."
        es: "Solicita el certificado zoosanitario de exportación de SENASICA con antelación (unos 3 días hábiles)."
        pt: "Solicite com antecedência o certificado zoossanitário de exportação do SENASICA (cerca de 3 dias úteis)."
    - timing: window
      text:
        en: "Have it endorsed at the SENASICA airport office on departure day: physical exam of the dog, second stamp and signature."
        fr: "Fais-le endosser au bureau SENASICA de l'aéroport le jour du vol : examen du chien, 2ᵉ sceau et signature."
        es: "Hazlo validar en la oficina de SENASICA del aeropuerto el día del vuelo: examen del perro, segundo sello y firma."
        pt: "Peça o endosso no escritório do SENASICA no aeroporto no dia do embarque: exame físico do cachorro, segundo carimbo e assinatura."
  onSiteNote:
    en: "Arrange this during your stay, in Spanish; on departure day allow plenty of time at the airport."
    fr: "À organiser pendant ton séjour, en espagnol ; le jour du départ, prévois large à l'aéroport."
    es: "Organízalo durante tu estancia; el día de salida, prevé tiempo de sobra en el aeropuerto."
    pt: "Organize isso durante sua estadia, em espanhol; no dia da partida, chegue ao aeroporto com bastante antecedência."

hero:
  h1: { en: "Traveling to Mexico with your dog", fr: "Voyager au Mexique avec ton chien", es: "Viajar a México con tu perro", pt: "Viajar ao México com seu cachorro" }
  intro:
    en: >-
      Mexico is one of the easiest countries in the world to enter with a dog. In recent years
      SENASICA (the national animal-health authority, part of SADER) simplified the procedure: a
      healthy dog arriving from the United States or Canada no longer needs a health certificate or a
      rabies vaccination card to enter — it is simply inspected on arrival. Dogs coming from any other
      country still need a Certificate of Good Health issued shortly before travel. In every case your
      dog's crate must be clean, and there is no quarantine for a healthy animal. This guide explains
      each situation so you know exactly what to prepare before you book your flight — and reminds you
      that a rabies vaccination, though not always demanded at the Mexican border, remains strongly
      recommended and is usually required to bring your dog back home.
    fr: >-
      Le Mexique est l'un des pays les plus simples au monde où entrer avec un chien. Ces dernières
      années, le SENASICA (l'autorité sanitaire animale nationale, rattachée au SADER) a simplifié la
      procédure : un chien en bonne santé arrivant des États-Unis ou du Canada n'a plus besoin de
      certificat sanitaire ni de carnet de vaccination antirabique pour entrer — il est simplement
      inspecté à l'arrivée. Les chiens venant de tout autre pays doivent encore présenter un Certificat
      de Bonne Santé établi peu avant le voyage. Dans tous les cas, la caisse de ton chien doit être
      propre, et il n'y a pas de quarantaine pour un animal en bonne santé. Ce guide détaille chaque
      cas afin de savoir exactement quoi préparer avant de réserver ton vol — et rappelle que la
      vaccination antirabique, même si elle n'est pas toujours exigée à la frontière mexicaine, reste
      fortement recommandée et généralement obligatoire pour ramener ton chien chez toi.
    es: >-
      México es uno de los países más fáciles del mundo para entrar con un perro. En los últimos años,
      SENASICA (la autoridad nacional de sanidad animal, dependiente de SADER) simplificó el
      procedimiento: un perro sano que llega de Estados Unidos o Canadá ya no necesita un certificado
      sanitario ni una cartilla de vacunación antirrábica para entrar — simplemente se le inspecciona a
      la llegada. Los perros que llegan de cualquier otro país todavía necesitan un Certificado de Buena
      Salud expedido poco antes del viaje. En todos los casos, la jaula de tu perro debe estar
      limpia, y no hay cuarentena para un animal sano. Esta guía explica cada situación para que sepas
      exactamente qué preparar antes de reservar tu vuelo — y te recuerda que la vacunación antirrábica,
      aunque no siempre se exija en la frontera mexicana, sigue siendo muy recomendable y suele ser
      obligatoria para regresar con tu perro a casa.

    pt: "O México é um dos países mais fáceis do mundo para entrar com um cachorro. Nos últimos anos, o SENASICA (a autoridade nacional de saúde animal, ligada ao SADER) simplificou o procedimento: um cachorro saudável que chega dos Estados Unidos ou do Canadá não precisa mais de atestado de saúde nem de carteira de vacinação antirrábica para entrar — ele é simplesmente inspecionado na chegada. Os cachorros que vêm de qualquer outro país ainda precisam de um Certificado de Boa Saúde emitido pouco antes da viagem. Em todos os casos, a caixa de transporte do seu cachorro precisa estar limpa, e não há quarentena para um animal saudável. Este guia explica cada situação para que você saiba exatamente o que preparar antes de comprar a passagem — e lembra que a vacinação antirrábica, embora nem sempre exigida na fronteira mexicana, continua fortemente recomendada e costuma ser obrigatória para levar seu cachorro de volta para casa."
difficulty:
  level: easy
  label: { en: "Easy — inspection on arrival", fr: "Facile — inspection à l'arrivée", es: "Fácil — inspección a la llegada", pt: "Fácil — inspeção na chegada" }

prepTime:
  eu:
    en: "From the USA or Canada: essentially none — a healthy dog is just inspected on arrival, with no certificate or vaccination card required."
    fr: "Depuis les États-Unis ou le Canada : quasi rien — un chien en bonne santé est simplement inspecté à l'arrivée, sans certificat ni carnet de vaccination."
    es: "Desde EE. UU. o Canadá: prácticamente nada — un perro sano solo se inspecciona a la llegada, sin necesidad de certificado ni cartilla de vacunación."
    pt: "Dos EUA ou do Canadá: praticamente nenhuma — um cachorro saudável é apenas inspecionado na chegada, sem exigência de certificado nem de carteira de vacinação."
  listed:
    en: "From any other country: a few days to obtain a Certificate of Good Health, which must be issued within 15 days before travel."
    fr: "Depuis tout autre pays : quelques jours pour obtenir un Certificat de Bonne Santé, qui doit être établi dans les 15 jours avant le voyage."
    es: "Desde cualquier otro país: unos días para obtener un Certificado de Buena Salud, que debe expedirse dentro de los 15 días previos al viaje."
    pt: "De qualquer outro país: alguns dias para obter um Certificado de Boa Saúde, que precisa ser emitido nos 15 dias anteriores à viagem."
  nonListed:
    en: "Plan the rabies vaccination in advance: not always checked at the Mexican border, but recommended and usually required to re-enter your home country."
    fr: "Prévois la vaccination antirabique à l'avance : pas toujours contrôlée à la frontière mexicaine, mais recommandée et généralement exigée pour rentrer dans ton pays."
    es: "Planifica la vacunación antirrábica con antelación: no siempre se controla en la frontera mexicana, pero es recomendable y suele exigirse para volver a entrar en tu país de origen."
    pt: "Programe a vacinação antirrábica com antecedência: nem sempre é conferida na fronteira mexicana, mas é recomendada e costuma ser exigida para reentrar no seu país de origem."

