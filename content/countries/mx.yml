    cls: ok

notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro."
    pt: "Só um médico-veterinário pode confirmar o procedimento exato para o seu cachorro."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Mexico (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — le Mexique (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — México (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — o México (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — Mexico", fr: "Pays de destination — Mexique", es: "País de destino — México", pt: "País de destino — México" }
      text:
        en: "Mexico applies its own simplified SENASICA scheme: a healthy dog is inspected on arrival, needs no microchip and no rabies antibody test, and faces no quarantine."
        fr: "Le Mexique applique son propre régime SENASICA simplifié : un chien en bonne santé est inspecté à l'arrivée, sans puce ni titrage antirabique, et sans quarantaine."
        es: "México aplica su propio régimen simplificado de SENASICA: un perro sano se inspecciona a la llegada, no necesita microchip ni prueba de titulación de rabia, y no se enfrenta a cuarentena."
        pt: "O México aplica seu próprio esquema simplificado do SENASICA: um cachorro saudável é inspecionado na chegada, não precisa de microchip nem de teste sorológico antirrábico, e não enfrenta quarentena."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Arriving from the US or Canada means no health certificate at all; arriving from any other country means you must present a Certificate of Good Health issued within 15 days before travel."
        fr: "Arriver des États-Unis ou du Canada signifie aucun certificat sanitaire ; arriver de tout autre pays impose de présenter un Certificat de Bonne Santé établi dans les 15 jours avant le voyage."
        es: "Llegar de EE. UU. o Canadá significa que no se necesita ningún certificado sanitario; llegar de cualquier otro país significa que debes presentar un Certificado de Buena Salud expedido dentro de los 15 días previos al viaje."
        pt: "Chegar dos EUA ou do Canadá significa nenhum atestado de saúde; chegar de qualquer outro país significa que você precisa apresentar um Certificado de Boa Saúde emitido nos 15 dias anteriores à viagem."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "Your dog's real health history matters more than the last airport. It also shapes your return trip: most home countries demand a valid rabies vaccination to bring the dog back."
        fr: "L'historique sanitaire réel du chien compte plus que le dernier aéroport. Il détermine aussi ton retour : la plupart des pays d'origine exigent une vaccination antirabique valide pour ramener le chien."
        es: "El historial sanitario real de tu perro importa más que el último aeropuerto. También condiciona tu viaje de regreso: la mayoría de los países de origen exigen una vacunación antirrábica válida para traer de vuelta al perro."
        pt: "O histórico real de saúde do seu cachorro pesa mais do que o último aeroporto. Ele também define sua viagem de volta: a maioria dos países de origem exige vacinação antirrábica válida para trazer o cachorro de volta."
  note:
    en: "So read the requirements below as Mexico's framework, then confirm your dog's exact origin, history and return route with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre mexicain, puis confirme l'origine, l'historique et l'itinéraire de retour de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de México y luego confirma el origen, el historial y la ruta de regreso exactos de tu perro con tu veterinario."
    pt: "Leia então as exigências abaixo como o quadro mexicano, e depois confirme com seu veterinário a origem exata, o histórico e a rota de volta do seu cachorro."

