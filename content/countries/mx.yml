    cls: ok
  - requirement: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    status: { en: "Recommended — required on the certificate from countries other than the US/Canada", fr: "Recommandée — exigée sur le certificat depuis les pays autres que USA/Canada", es: "Recomendada — obligatoria en el certificado desde países distintos de EE. UU./Canadá", pt: "Recomendada — obrigatória no certificado quando se vem de países que não sejam EUA/Canadá" }
    cls: neutral
  - requirement: { en: "Rabies antibody test", fr: "Titrage antirabique", es: "Prueba de titulación de rabia", pt: "Teste sorológico antirrábico (titulação)" }
