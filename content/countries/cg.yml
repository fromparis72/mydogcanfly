# Country Entry Guide — Republic of the Congo / Congo-Brazzaville (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_cg
iso2: "CG"
name: { en: "Republic of the Congo", fr: "République du Congo", es: "República del Congo", pt: "República do Congo" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
exit:
  authority: Direction Générale de l'Élevage (DGE)
  authorityUrl: https://agriculture.gouv.cg
  intro:
    en: "Congo-Brazzaville is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Direction Générale de l'Élevage (DGE)."
    fr: "Le Congo-Brazzaville est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par la Direction Générale de l'Élevage (DGE)."
    es: "Congo-Brazzaville no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por la Direction Générale de l'Élevage (DGE)."
    pt: "O Congo-Brazzaville é um país não listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pela Direction Générale de l'Élevage (DGE)."
  steps:
    - timing: longlead
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Providenciar com antecedência o teste sorológico antirrábico (titulação): exame de sangue em laboratório aprovado pela UE, pelo menos 30 dias após a vacinação — um resultado válido é indispensável para voltar à UE e não pode ser resolvido de última hora."
    - timing: window
      text:
        en: "The DGE animal-health service is the competent authority endorsing the export health certificate before departure."
        fr: "Le service de santé animale de la DGE est l'autorité compétente qui vise le certificat sanitaire d'export avant le départ."
        es: "El servicio de sanidad animal de la DGE es la autoridad competente que refrenda el certificado sanitario de exportación antes de salir."
        pt: "O serviço de saúde animal da DGE é a autoridade competente que endossa o atestado de saúde de exportação antes da partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o cachorro já tinha um teste sorológico antirrábico (titulação) válido para a UE antes da partida, ele permanece válido por toda a vida enquanto a vacinação antirrábica estiver em dia — vale a pena verificar isso antes de viajar."

hero:
  h1: { en: "Traveling to the Republic of the Congo with your dog", fr: "Voyager en République du Congo avec ton chien", es: "Viajar a la República del Congo con tu perro", pt: "Viajar para a República do Congo com seu cachorro" }
  intro:
    en: >-
      The Republic of the Congo (Congo-Brazzaville) accepts pet dogs, but it publishes almost none of its
      own detail, so much of the exact procedure has to be confirmed directly with the authorities. The
      animal-health authority is the Ministry of Agriculture, Livestock and Fisheries (Ministère de
      l'Agriculture, de l'Élevage et de la Pêche) and its Directorate-General for Livestock (Direction
      Générale de l'Élevage), whose Animal Health Directorate (Direction de la Santé Animale) is the
      veterinary service. In practice your dog will need a valid rabies vaccination and an official
      international veterinary health certificate signed by the veterinary authority of the country of
      departure. The Republic of the Congo is listed by the US CDC as a high-risk country for dog rabies,
      so the rabies rule is central. Because so many specifics are simply not published, this guide clearly
      separates what an official source confirms from what remains unknown — always confirm the exact,
      current procedure with your vet and the Directorate-General for Livestock before you book.
    fr: >-
      La République du Congo (Congo-Brazzaville) accepte les chiens de compagnie, mais elle ne publie
      presque aucun détail propre : une grande partie de la procédure exacte doit être confirmée directement
      auprès des autorités. L'autorité sanitaire est le Ministère de l'Agriculture, de l'Élevage et de la
      Pêche et sa Direction Générale de l'Élevage, dont la Direction de la Santé Animale constitue le
      service vétérinaire. En pratique, ton chien aura besoin d'une vaccination antirabique valide et d'un
      certificat sanitaire vétérinaire international officiel signé par l'autorité vétérinaire du pays de
      départ. La République du Congo est classée par les CDC américains parmi les pays à haut risque de rage
      canine : la règle antirabique est donc centrale. De nombreux points n'étant tout simplement pas
      publiés, ce guide distingue clairement ce qu'une source officielle confirme de ce qui reste inconnu —
      confirme toujours la procédure exacte et à jour avec ton vétérinaire et la Direction Générale de
      l'Élevage avant de réserver.
    es: >-
      La República del Congo (Congo-Brazzaville) acepta perros de compañía, pero publica casi ningún
      detalle propio, por lo que gran parte del procedimiento exacto debe confirmarse directamente con las
      autoridades. La autoridad sanitaria es el Ministerio de Agricultura, Ganadería y Pesca (Ministère de
      l'Agriculture, de l'Élevage et de la Pêche) y su Dirección General de Ganadería (Direction Générale
      de l'Élevage), cuya Dirección de Sanidad Animal (Direction de la Santé Animale) es el servicio
      veterinario. En la práctica, tu perro necesitará una vacunación antirrábica válida y un certificado
      sanitario veterinario internacional oficial firmado por la autoridad veterinaria del país de salida.
      La República del Congo figura en la lista de los CDC de EE. UU. como país de alto riesgo de rabia
      canina, por lo que la norma antirrábica es central. Como muchos detalles simplemente no se publican,
      esta guía separa claramente lo que confirma una fuente oficial de lo que sigue siendo desconocido —
      confirma siempre el procedimiento exacto y actual con tu veterinario y la Dirección General de
      Ganadería antes de reservar.

    pt: "A República do Congo (Congo-Brazzaville) aceita cachorros de companhia, mas publica quase nenhum detalhe próprio, de modo que boa parte do procedimento exato precisa ser confirmada diretamente com as autoridades. A autoridade de saúde animal é o Ministério da Agricultura, Pecuária e Pesca (Ministère de l'Agriculture, de l'Élevage et de la Pêche) e sua Diretoria-Geral de Pecuária (Direction Générale de l'Élevage), cujo serviço veterinário é a Direction de la Santé Animale. Na prática, o cachorro precisará de uma vacinação antirrábica válida e de um atestado de saúde veterinário internacional oficial, assinado pela autoridade veterinária do país de partida. A República do Congo é classificada pelo CDC dos EUA como país de alto risco para raiva canina, por isso a regra da raiva é central. Como muitos detalhes simplesmente não são publicados, este guia separa claramente o que é confirmado por uma fonte oficial do que permanece não comunicado — confirmar sempre o procedimento exato e atual com o veterinário e com a Diretoria-Geral de Pecuária antes de reservar."
difficulty:
  level: difficult
  label: { en: "Difficult — high-risk rabies country and almost no published import detail", fr: "Difficile — pays à haut risque de rage et presque aucun détail d'importation publié", es: "Difícil — país de alto riesgo de rabia y casi ningún detalle de importación publicado", pt: "Difícil — país de alto risco de raiva e quase nenhum detalhe de importação publicado" }

prepTime:
  eu:
    en: "From the EU: the Republic of the Congo publishes no EU-specific model, so allow several weeks. Have the microchip and rabies vaccination in order, then an official EU vet issues and endorses an international veterinary health certificate close to departure, and confirm with the Directorate-General for Livestock whether an import authorization is needed for an accompanying pet."
    fr: "Depuis l'UE : la République du Congo ne publie pas de modèle propre à l'UE, prévois donc plusieurs semaines. Mets la puce et la vaccination antirabique en règle, puis un vétérinaire officiel de l'UE établit et vise un certificat sanitaire vétérinaire international peu avant le départ ; confirme auprès de la Direction Générale de l'Élevage si une autorisation d'importation est nécessaire pour un animal accompagné."
    es: "Desde la UE: la República del Congo no publica ningún modelo específico para la UE, así que reserva varias semanas. Ten el microchip y la vacunación antirrábica en regla y, después, un veterinario oficial de la UE expide y refrenda un certificado sanitario veterinario internacional poco antes de la salida; confirma con la Dirección General de Ganadería si se necesita una autorización de importación para una mascota acompañante."
    pt: "Da UE: a República do Congo não publica um modelo específico para a UE, portanto contar com várias semanas. Deixar o microchip e a vacinação antirrábica em dia; depois, um veterinário oficial da UE emite e endossa um atestado de saúde veterinário internacional perto da partida, e confirmar com a Diretoria-Geral de Pecuária se uma autorização de importação é necessária para um animal que viaja acompanhado."
  listed:
    en: "From the United States: USDA/APHIS publishes no dog or cat export certificate for the Republic of the Congo. APHIS advises that the importer apply for an import permit at the appropriate Congolese ministry, which will outline the requirements — allow several weeks and start with the Directorate-General for Livestock."
    fr: "Depuis les États-Unis : l'USDA/APHIS ne publie aucun certificat d'exportation de chiens ou de chats pour la République du Congo. L'APHIS conseille que l'importateur demande un permis d'importation auprès du ministère congolais compétent, qui précisera les exigences — prévois plusieurs semaines et commence par la Direction Générale de l'Élevage."
    es: "Desde Estados Unidos: el USDA/APHIS no publica ningún certificado de exportación de perros o gatos para la República del Congo. APHIS aconseja que el importador solicite un permiso de importación en el ministerio congoleño competente, que detallará los requisitos — reserva varias semanas y empieza por la Dirección General de Ganadería."
    pt: "Dos Estados Unidos: o USDA/APHIS não publica um certificado de exportação para cachorros ou gatos com destino à República do Congo. O APHIS orienta o importador a solicitar uma autorização de importação junto ao ministério congolês competente, que definirá as exigências — contar com várias semanas e começar pela Diretoria-Geral de Pecuária."
  nonListed:
    en: "From other origins: the same core elements apply — valid rabies vaccination and an official international veterinary certificate endorsed by the origin's authority, with likely veterinary formalities on arrival. Timelines and conditions are not published, so confirm directly before booking."
    fr: "Depuis d'autres origines : les mêmes éléments de base s'appliquent — vaccination antirabique valide et certificat vétérinaire international officiel visé par l'autorité d'origine, avec de probables formalités vétérinaires à l'arrivée. Les délais et conditions ne sont pas publiés ; confirme directement avant de réserver."
    es: "Desde otros orígenes: se aplican los mismos elementos básicos — vacunación antirrábica válida y un certificado veterinario internacional oficial refrendado por la autoridad de origen, con probables trámites veterinarios a la llegada. Los plazos y las condiciones no se publican, así que confírmalos directamente antes de reservar."
    pt: "De outras origens: aplicam-se os mesmos elementos essenciais — vacinação antirrábica válida e certificado veterinário internacional oficial endossado pela autoridade de origem, com formalidades veterinárias prováveis na chegada. Os prazos e as condições não são publicados, portanto confirmar diretamente antes de reservar."

