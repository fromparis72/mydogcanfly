notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly fornece informações gerais — não constitui aconselhamento veterinário nem jurídico."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog; the Republic of the Congo publishes almost nothing, so also confirm directly with the Directorate-General for Livestock (DGE)."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien ; la République du Congo ne publiant presque rien, confirme aussi directement auprès de la Direction Générale de l'Élevage (DGE)."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro; la República del Congo publica casi nada, así que confirma también directamente con la Dirección General de Ganadería (DGE)."
    pt: "Somente um médico-veterinário pode confirmar o procedimento exato para cada cachorro; a República do Congo publica quase nada, portanto também é preciso confirmar diretamente com a Diretoria-Geral de Pecuária (DGE)."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem de: país de origem, histórico de viagens anteriores, identificação, vacinas, itinerário e data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consultar sempre o médico-veterinário antes de reservar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do cachorro" }
  intro:
    en: "The exact documents depend on three things — the Republic of the Congo (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — la République du Congo (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — la República del Congo (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — a República do Congo (o destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Republic of the Congo", fr: "Pays de destination — République du Congo", es: "País de destino — República del Congo", pt: "País de destino — República do Congo" }
      text:
        en: "The Republic of the Congo requires, in practice, a valid rabies vaccination and an official international veterinary health certificate. Its Directorate-General for Livestock, through the Animal Health Directorate, is the veterinary authority. Many finer points (microchip standard, rabies timing, antibody test, minimum age, border process, quarantine) are not published, which is itself a planning factor."
        fr: "La République du Congo exige, en pratique, une vaccination antirabique valide et un certificat sanitaire vétérinaire international officiel. Sa Direction Générale de l'Élevage, à travers la Direction de la Santé Animale, est l'autorité vétérinaire. De nombreux points précis (norme de puce, délais de la rage, titrage, âge minimum, procédure frontalière, quarantaine) ne sont pas publiés, ce qui constitue en soi un facteur de préparation."
        es: "La República del Congo exige, en la práctica, una vacunación antirrábica válida y un certificado sanitario veterinario internacional oficial. Su Dirección General de Ganadería, a través de la Dirección de Sanidad Animal, es la autoridad veterinaria. Muchos puntos concretos (norma del microchip, plazos de la rabia, prueba de titulación, edad mínima, proceso fronterizo, cuarentena) no se publican, lo que constituye en sí mismo un factor de planificación."
        pt: "A República do Congo exige, na prática, uma vacinação antirrábica válida e um atestado de saúde veterinário internacional oficial. Sua Diretoria-Geral de Pecuária, por meio da Direction de la Santé Animale, é a autoridade veterinária. Muitos pontos mais específicos (padrão de microchip, calendário da raiva, teste sorológico, idade mínima, processo de fronteira, quarentena) não são publicados, o que em si é um fator a considerar no planejamento."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The country of departure decides which official certificate your vet uses and which veterinary authority endorses it. The Republic of the Congo publishes no country-specific model, and for the United States USDA/APHIS has no dog/cat certificate for it — so the departure country's own official international veterinary certificate, endorsed by its competent authority, is used, and the importer may need to obtain an import permit from the Congolese ministry first."
        fr: "Le pays de départ détermine le certificat officiel utilisé par ton vétérinaire et l'autorité vétérinaire qui le vise. La République du Congo ne publie aucun modèle propre à un pays, et pour les États-Unis l'USDA/APHIS ne dispose d'aucun certificat chiens/chats — c'est donc le certificat vétérinaire international officiel du pays de départ, visé par son autorité compétente, qui est utilisé, l'importateur pouvant devoir obtenir au préalable un permis d'importation auprès du ministère congolais."
        es: "El país de salida determina qué certificado oficial utiliza tu veterinario y qué autoridad veterinaria lo refrenda. La República del Congo no publica ningún modelo específico por país y, para Estados Unidos, el USDA/APHIS no dispone de certificado de perros/gatos — así que se utiliza el certificado veterinario internacional oficial del propio país de salida, refrendado por su autoridad competente, y el importador puede necesitar obtener antes un permiso de importación del ministerio congoleño."
        pt: "O país de partida determina qual certificado oficial o veterinário utiliza e qual autoridade veterinária o endossa. A República do Congo não publica um modelo específico por país, e para os Estados Unidos o USDA/APHIS não possui certificado para cachorros/gatos com destino a ela — portanto, usa-se o próprio certificado veterinário internacional oficial do país de partida, endossado pela sua autoridade competente, e o importador pode precisar antes obter uma autorização de importação junto ao ministério congolês."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde o cachorro esteve recentemente" }
      text:
        en: "A recent stay in a country with a poor animal-health status or an active disease-control measure can change what the Congolese veterinary services accept, because it is your dog's real origin and history that matter for a high-risk rabies destination, not only the last airport. Confirm your dog's history with the Directorate-General for Livestock."
        fr: "Un séjour récent dans un pays au statut sanitaire dégradé ou sous mesure active de lutte contre une maladie peut modifier ce que les services vétérinaires congolais acceptent, car c'est l'origine réelle et l'historique du chien qui comptent pour une destination à haut risque de rage, pas seulement le dernier aéroport. Confirme l'historique de ton chien auprès de la Direction Générale de l'Élevage."
        es: "Una estancia reciente en un país con un estatus sanitario deficiente o bajo una medida activa de control de enfermedades puede cambiar lo que aceptan los servicios veterinarios congoleños, porque lo que cuenta para un destino de alto riesgo de rabia es el origen y el historial reales de tu perro, no solo el último aeropuerto. Confirma el historial de tu perro con la Dirección General de Ganadería."
        pt: "Uma estadia recente em um país com situação sanitária animal desfavorável ou com medida ativa de controle de doenças pode mudar o que os serviços veterinários congoleses aceitam, pois o que importa para um destino de alto risco de raiva é a origem real e o histórico do cachorro, não apenas o último aeroporto. Confirmar o histórico do cachorro com a Diretoria-Geral de Pecuária."
  note:
    en: "So read the requirements below as the Republic of the Congo's general framework, then confirm your dog's exact origin, history and the current documents with your vet and the Directorate-General for Livestock before booking."
    fr: "Lis donc les exigences ci-dessous comme le cadre général congolais, puis confirme l'origine et l'historique exacts de ton chien ainsi que les documents en vigueur avec ton vétérinaire et la Direction Générale de l'Élevage avant de réserver."
    es: "Así que lee los requisitos siguientes como el marco general de la República del Congo y luego confirma el origen y el historial exactos de tu perro, así como los documentos vigentes, con tu veterinario y la Dirección General de Ganadería antes de reservar."
    pt: "Portanto, ler as exigências abaixo como o quadro geral da República do Congo e, em seguida, confirmar a origem exata, o histórico do cachorro e os documentos vigentes com o veterinário e com a Diretoria-Geral de Pecuária antes de reservar."

requirements:
  - item: { en: "Microchip (identification)", fr: "Puce électronique (identification)", es: "Microchip (identificación)", pt: "Microchip (identificação)" }
    required: { en: "Not published (Unknown)", fr: "Non publiée (Non communiqué)", es: "No publicado (Desconocido)", pt: "Não publicado (não informado)" }
    when: { en: "No official Congolese source specifies a microchip or an identification standard for importing a pet dog. The ISO 11784/11785 chip is the international norm and is strongly recommended so the animal can be matched to its certificate, but the Republic of the Congo does not publish it as a stand-alone obligation.", fr: "Aucune source officielle congolaise ne précise de puce ou de norme d'identification pour l'importation d'un chien de compagnie. La puce ISO 11784/11785 est la référence internationale et est fortement recommandée pour que l'animal corresponde à son certificat, mais la République du Congo ne la publie pas comme obligation autonome.", es: "Ninguna fuente oficial congoleña especifica un microchip ni una norma de identificación para importar un perro de compañía. El chip ISO 11784/11785 es la norma internacional y se recomienda encarecidamente para que el animal pueda vincularse a su certificado, pero la República del Congo no lo publica como obligación autónoma.", pt: "Nenhuma fonte oficial congolesa especifica um microchip ou um padrão de identificação para a importação de um cachorro de companhia. O chip ISO 11784/11785 é a norma internacional e é fortemente recomendado, para que o animal possa ser correspondido ao seu certificado, mas a República do Congo não o publica como uma obrigação autônoma." }
    exceptions: { en: "Unknown — confirm the required identification with the Directorate-General for Livestock.", fr: "Non communiqué — confirme l'identification requise auprès de la Direction Générale de l'Élevage.", es: "Desconocido — confirma la identificación requerida con la Dirección General de Ganadería.", pt: "Não comunicado — confirmar a identificação exigida com a Diretoria-Geral de Pecuária." }
    ref: { en: "No official published requirement found (DGE)", fr: "Aucune exigence officielle publiée trouvée (DGE)", es: "No se encontró ningún requisito oficial publicado (DGE)", pt: "Nenhuma exigência oficial publicada encontrada (DGE)" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required in practice; timing and validity unpublished", fr: "Requise en pratique ; délais et validité non publiés", es: "Obligatoria en la práctica; plazos y valide no publicados", pt: "Obrigatória na prática; calendário e validade não publicados" }
    when: { en: "The Republic of the Congo is listed by the US CDC as a high-risk country for dog rabies, so a valid rabies vaccination recorded by the vet is expected for import. The exact minimum waiting period after vaccination and the validity window are not published in any official Congolese model.", fr: "La République du Congo est classée par les CDC américains parmi les pays à haut risque de rage canine ; une vaccination antirabique valide consignée par le vétérinaire est donc attendue à l'importation. Le délai minimal exact après vaccination et la fenêtre de validité ne sont publiés dans aucun modèle officiel congolais.", es: "La República del Congo figura en la lista de los CDC de EE. UU. como país de alto riesgo de rabia canina, por lo que se espera una vacunación antirrábica válida registrada por el veterinario para la importación. El periodo mínimo exacto de espera tras la vacunación y la ventana de valide no se publican en ningún modelo oficial congoleño.", pt: "A República do Congo é classificada pelo CDC dos EUA como país de alto risco para raiva canina, por isso é esperada uma vacinação antirrábica válida, registrada pelo veterinário, para a importação. O período mínimo exato de carência após a vacinação e o prazo de validade não são publicados em nenhum modelo oficial congolês." }
    exceptions: { en: "Unknown — confirm the exact rabies timing with your vet and the Directorate-General for Livestock.", fr: "Non communiqué — confirme les délais exacts de la rage avec ton vétérinaire et la Direction Générale de l'Élevage.", es: "Desconocido — confirma los plazos exactos de la rabia con tu veterinario y la Dirección General de Ganadería.", pt: "Não comunicado — confirmar o calendário exato da raiva com o veterinário e com a Diretoria-Geral de Pecuária." }
    ref: { en: "US CDC — High-Risk Countries for Dog Rabies (Republic of the Congo listed); no published Congolese import model", fr: "CDC (É.-U.) — Pays à haut risque de rage canine (République du Congo listée) ; aucun modèle d'importation congolais publié", es: "CDC (EE. UU.) — Países de alto riesgo de rabia canina (República del Congo listada); no hay modelo de importación congoleño publicado", pt: "US CDC — High-Risk Countries for Dog Rabies (República do Congo listada); nenhum modelo de importação congolês publicado" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not published (Unknown)", fr: "Non publié (Non communiqué)", es: "No publicada (Desconocido)", pt: "Não publicado (não informado)" }
    when: { en: "No official Congolese source requires a rabies antibody test for importing a dog, and none excludes it either. Because nothing is published, treat it as unknown and confirm before travel.", fr: "Aucune source officielle congolaise n'exige de titrage des anticorps antirabiques pour l'importation d'un chien, et aucune ne l'exclut non plus. Rien n'étant publié, considère ce point comme non communiqué et confirme avant le voyage.", es: "Ninguna fuente oficial congoleña exige una prueba de titulación de rabia para importar un perro, y ninguna la excluye tampoco. Como no se publica nada, considéralo desconocido y confírmalo antes de viajar.", pt: "Nenhuma fonte oficial congolesa exige um teste sorológico antirrábico para a importação de um cachorro, e nenhuma o exclui tampouco. Como nada é publicado, tratar como não comunicado e confirmar antes da viagem." }
    exceptions: { en: "Unknown — a specific origin's authority could still request one; confirm with your vet.", fr: "Non communiqué — l'autorité d'une origine spécifique pourrait tout de même en demander un ; confirme avec ton vétérinaire.", es: "Desconocido — la autoridad de un origen concreto podría solicitarla igualmente; confírmalo con tu veterinario.", pt: "Não comunicado — a autoridade de uma origem específica ainda pode solicitá-lo; confirmar com o veterinário." }
    ref: { en: "No official published requirement found (DGE)", fr: "Aucune exigence officielle publiée trouvée (DGE)", es: "No se encontró ningún requisito oficial publicado (DGE)", pt: "Nenhuma exigência oficial publicada encontrada (DGE)" }
  - item: { en: "Official international veterinary health certificate", fr: "Certificat sanitaire vétérinaire international officiel", es: "Certificado sanitario veterinario internacional oficial", pt: "Atestado de saúde veterinário internacional oficial" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "An official international veterinary health certificate issued and endorsed by the veterinary authority of the country of departure must accompany the dog. The Republic of the Congo publishes no country-specific model, so the origin's own endorsed international certificate is used. French is acceptable, the Republic of the Congo being a francophone country.", fr: "Un certificat sanitaire vétérinaire international officiel établi et visé par l'autorité vétérinaire du pays de départ doit accompagner le chien. La République du Congo ne publie aucun modèle propre à un pays ; c'est donc le certificat international visé de l'origine qui est utilisé. Le français est accepté, la République du Congo étant un pays francophone.", es: "Un certificado sanitario veterinario internacional oficial expedido y refrendado por la autoridad veterinaria del país de salida debe acompañar al perro. La República del Congo no publica ningún modelo específico por país, así que se utiliza el propio certificado internacional refrendado del origen. El francés es aceptable, al ser la República del Congo un país francófono.", pt: "Um atestado de saúde veterinário internacional oficial, emitido e endossado pela autoridade veterinária do país de partida, deve acompanhar o cachorro. A República do Congo não publica um modelo específico por país, portanto usa-se o próprio certificado internacional endossado da origem. O francês é aceito, já que a República do Congo é um país francófono." }
    exceptions: { en: "None — an endorsed certificate should accompany every dog; confirm the exact wording accepted by the Republic of the Congo.", fr: "Aucune — un certificat visé doit accompagner chaque chien ; confirme la rédaction exacte acceptée par la République du Congo.", es: "Ninguna — un certificado refrendado debe acompañar a cada perro; confirma la redacción exacta que acepta la República del Congo.", pt: "Nenhuma — um certificado endossado deve acompanhar todo cachorro; confirmar o texto exato aceito pela República do Congo." }
    ref: { en: "USDA/APHIS — Export Live Animals to Republic of the Congo (Brazzaville) (import permit outlines requirements)", fr: "USDA/APHIS — Exportation d'animaux vivants vers la République du Congo (Brazzaville) (le permis d'importation précise les exigences)", es: "USDA/APHIS — Exportación de animales vivos a la República del Congo (Brazzaville) (el permiso de importación detalla los requisitos)", pt: "USDA/APHIS — Export Live Animals to Republic of the Congo (Brazzaville) (a autorização de importação define as exigências)" }
  - item: { en: "Parasite / tapeworm treatment", fr: "Traitement antiparasitaire / contre les ténias", es: "Tratamiento antiparasitario / contra la tenia", pt: "Tratamento antiparasitário / contra tênias" }
    required: { en: "Not published (Unknown)", fr: "Non publié (Non communiqué)", es: "No publicado (Desconocido)", pt: "Não publicado (não informado)" }
    when: { en: "No official Congolese source specifies an internal or external parasite or tapeworm treatment for importing a pet dog. A vet may still advise one as good practice.", fr: "Aucune source officielle congolaise ne précise de traitement antiparasitaire interne ou externe ni contre les ténias pour l'importation d'un chien de compagnie. Un vétérinaire peut néanmoins en conseiller un par bonne pratique.", es: "Ninguna fuente oficial congoleña especifica un tratamiento antiparasitario interno o externo ni contra la tenia para importar un perro de compañía. Un veterinario puede aconsejarlo igualmente como buena práctica.", pt: "Nenhuma fonte oficial congolesa especifica um tratamento antiparasitário interno ou externo ou contra tênias para a importação de um cachorro de companhia. Um veterinário ainda pode recomendá-lo como boa prática." }
    exceptions: { en: "Unknown.", fr: "Non communiqué.", es: "Desconocido.", pt: "Não informado." }
    ref: { en: "No official published requirement found (DGE)", fr: "Aucune exigence officielle publiée trouvée (DGE)", es: "No se encontró ningún requisito oficial publicado (DGE)", pt: "Nenhuma exigência oficial publicada encontrada (DGE)" }
  - item: { en: "Import authorization / advance approval", fr: "Autorisation d'importation / accord préalable", es: "Autorización de importación / aprobación previa", pt: "Autorização de importação / aprovação prévia" }
    required: { en: "Framework exists for trade animals; need for a personal pet unclear", fr: "Cadre existant pour les animaux commerciaux ; nécessité pour un animal personnel incertaine", es: "Existe un marco para animales comerciales; la necesidad para una mascota personal no está clara", pt: "Quadro existente para animais comerciais; necessidade para um cachorro de companhia particular não está clara" }
    when: { en: "The Ministry of Agriculture, Livestock and Fisheries regulates the import of animals and animal products, and USDA/APHIS advises applying for an import permit at the appropriate Congolese ministry. Published texts target trade in veterinary products and breeding livestock, so whether a traveller's accompanying pet needs an authorization is not clearly stated.", fr: "Le Ministère de l'Agriculture, de l'Élevage et de la Pêche réglemente l'importation d'animaux et de produits animaux, et l'USDA/APHIS conseille de demander un permis d'importation auprès du ministère congolais compétent. Les textes publiés visent le commerce de produits vétérinaires et d'animaux d'élevage ; la nécessité pour l'animal de compagnie accompagné d'un voyageur n'est donc pas clairement établie.", es: "El Ministerio de Agricultura, Ganadería y Pesca regula la importación de animales y productos animales, y el USDA/APHIS aconseja solicitar un permiso de importación en el ministerio congoleño competente. Los textos publicados se dirigen al comercio de productos veterinarios y de ganado de cría, por lo que no se indica con claridad si la mascota que acompaña a un viajero necesita una autorización.", pt: "O Ministério da Agricultura, Pecuária e Pesca regula a importação de animais e produtos animais, e o USDA/APHIS orienta a solicitar uma autorização de importação junto ao ministério congolês competente. Os textos publicados visam o comércio de produtos veterinários e de animais de criação, de modo que não fica claro se o cachorro de um viajante que o acompanha precisa de uma autorização." }
    exceptions: { en: "Unknown for personal pets — confirm with the Directorate-General for Livestock before travel.", fr: "Non communiqué pour les animaux personnels — confirme auprès de la Direction Générale de l'Élevage avant le voyage.", es: "Desconocido para mascotas personales — confirma con la Dirección General de Ganadería antes de viajar.", pt: "Não comunicado para animais de companhia particulares — confirmar com a Diretoria-Geral de Pecuária antes da viagem." }
    ref: { en: "USDA/APHIS — Export Live Animals to Republic of the Congo (Brazzaville); Ministry of Agriculture, Livestock & Fisheries (legal & regulatory framework)", fr: "USDA/APHIS — Exportation d'animaux vivants vers la République du Congo (Brazzaville) ; Ministère de l'Agriculture, de l'Élevage et de la Pêche (cadre légal et réglementaire)", es: "USDA/APHIS — Exportación de animales vivos a la República del Congo (Brazzaville); Ministerio de Agricultura, Ganadería y Pesca (marco legal y reglamentario)", pt: "USDA/APHIS — Export Live Animals to Republic of the Congo (Brazzaville); Ministério da Agricultura, Pecuária e Pesca (quadro legal e regulatório)" }
  - item: { en: "Border veterinary inspection", fr: "Inspection vétérinaire frontalière", es: "Inspección veterinaria fronteriza", pt: "Inspeção veterinária na fronteira" }
    required: { en: "Expected; exact process unpublished", fr: "Attendue ; procédure exacte non publiée", es: "Prevista; proceso exacto no publicado", pt: "Esperado; processo exato não publicado" }
    when: { en: "The Directorate-General for Livestock and its Animal Health Directorate are the competent veterinary authority, so an imported dog and its documents are expected to be presented to veterinary control on arrival. The exact steps, entry points and fees for a personal pet are not published.", fr: "La Direction Générale de l'Élevage et sa Direction de la Santé Animale sont l'autorité vétérinaire compétente ; un chien importé et ses documents sont donc censés être présentés au contrôle vétérinaire à l'arrivée. Les étapes exactes, les points d'entrée et les frais pour un animal de compagnie personnel ne sont pas publiés.", es: "La Dirección General de Ganadería y su Dirección de Sanidad Animal son la autoridad veterinaria competente, por lo que se espera que un perro importado y sus documentos se presenten al control veterinario a la llegada. Los pasos exactos, los puntos de entrada y las tasas para una mascota personal no se publican.", pt: "A Diretoria-Geral de Pecuária e sua Direction de la Santé Animale são a autoridade veterinária competente, por isso espera-se que um cachorro importado e seus documentos sejam apresentados ao controle veterinário na chegada. As etapas exatas, os pontos de entrada e as taxas para um cachorro de companhia particular não são publicados." }
    exceptions: { en: "Unknown — confirm the arrival procedure with the Directorate-General for Livestock.", fr: "Non communiqué — confirme la procédure d'arrivée auprès de la Direction Générale de l'Élevage.", es: "Desconocido — confirma el procedimiento de llegada con la Dirección General de Ganadería.", pt: "Não comunicado — confirmar o procedimento de chegada com a Diretoria-Geral de Pecuária." }
    ref: { en: "Directorate-General for Livestock (DGE) — Animal Health Directorate (competent veterinary authority)", fr: "Direction Générale de l'Élevage (DGE) — Direction de la Santé Animale (autorité vétérinaire compétente)", es: "Dirección General de Ganadería (DGE) — Dirección de Sanidad Animal (autoridad veterinaria competente)", pt: "Diretoria-Geral de Pecuária (DGE) — Direction de la Santé Animale (autoridade veterinária competente)" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Not published (Unknown)", fr: "Non publié (Non communiqué)", es: "No publicada (Desconocido)", pt: "Não publicado (não informado)" }
    when: { en: "No stand-alone minimum age is published. In practice a puppy must be old enough to be validly vaccinated against rabies, but the Republic of the Congo does not publish a specific age.", fr: "Aucun âge minimum autonome n'est publié. En pratique, un chiot doit être en âge d'être valablement vacciné contre la rage, mais la République du Congo ne publie pas d'âge spécifique.", es: "No se publica ninguna edad mínima autónoma. En la práctica, un cachorro debe tener la edad suficiente para ser vacunado válidamente contra la rabia, pero la República del Congo no publica una edad específica.", pt: "Nenhuma idade mínima autônoma é publicada. Na prática, o filhote deve ter idade suficiente para ser validamente vacinado contra a raiva, mas a República do Congo não publica uma idade específica." }
    exceptions: { en: "Unknown — confirm with your vet and the Directorate-General for Livestock.", fr: "Non communiqué — confirme avec ton vétérinaire et la Direction Générale de l'Élevage.", es: "Desconocido — confirma con tu veterinario y la Dirección General de Ganadería.", pt: "Não comunicado — confirmar com o veterinário e com a Diretoria-Geral de Pecuária." }
    ref: { en: "No official published minimum age (DGE)", fr: "Aucun âge minimum officiel publié (DGE)", es: "No hay edad mínima oficial publicada (DGE)", pt: "Nenhuma idade mínima oficial publicada (DGE)" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not published (Unknown)", fr: "Non publiée (Non communiqué)", es: "No publicada (Desconocido)", pt: "Não publicado (não informado)" }
    when: { en: "No official Congolese source specifies a routine quarantine for compliant pet dogs. A non-compliant animal may face veterinary measures at the border, but the details are not published.", fr: "Aucune source officielle congolaise ne précise de quarantaine de routine pour les chiens conformes. Un animal non conforme peut faire l'objet de mesures vétérinaires à la frontière, mais les modalités ne sont pas publiées.", es: "Ninguna fuente oficial congoleña especifica una cuarentena rutinaria para los perros que cumplen los requisitos. Un animal no conforme puede ser objeto de medidas veterinarias en la frontera, pero las modalidades no se publican.", pt: "Nenhuma fonte oficial congolesa especifica uma quarentena de rotina para cachorros de companhia em conformidade. Um animal em não conformidade pode enfrentar medidas veterinárias na fronteira, mas os detalhes não são publicados." }
    exceptions: { en: "Unknown.", fr: "Non communiqué.", es: "Desconocido.", pt: "Não informado." }
    ref: { en: "No official published quarantine rule (DGE)", fr: "Aucune règle de quarantaine officielle publiée (DGE)", es: "No hay norma de cuarentena oficial publicada (DGE)", pt: "Nenhuma regra de quarentena oficial publicada (DGE)" }
  - item: { en: "Banned / restricted breeds", fr: "Races interdites / restreintes", es: "Razas prohibidas / restringidas", pt: "Raças proibidas / restritas" }
    required: { en: "No published import ban found", fr: "Aucune interdiction d'importation publiée", es: "No se encontró ninguna prohibición de importación publicada", pt: "Nenhuma proibição de importação publicada foi encontrada" }
    when: { en: "No official Congolese breed-specific import ban was found. Entry appears to be controlled by health requirements and veterinary control, not by breed.", fr: "Aucune interdiction d'importation par race officielle congolaise n'a été trouvée. L'entrée semble encadrée par les exigences sanitaires et le contrôle vétérinaire, non par la race.", es: "No se encontró ninguna prohibición de importación congoleña específica por raza. La entrada parece estar controlada por los requisitos sanitarios y el control veterinario, no por la raza.", pt: "Nenhuma proibição de importação específica por raça foi encontrada em fontes oficiais congolesas. A entrada parece ser controlada por exigências sanitárias e controle veterinário, e não por raça." }
    exceptions: { en: "Unknown — no published list confirms or excludes any breed; verify with the Directorate-General for Livestock.", fr: "Non communiqué — aucune liste publiée ne confirme ni n'exclut de race ; vérifie auprès de la Direction Générale de l'Élevage.", es: "Desconocido — ninguna lista publicada confirma ni excluye ninguna raza; verifica con la Dirección General de Ganadería.", pt: "Não comunicado — nenhuma lista publicada confirma ou exclui qualquer raça; verificar com a Diretoria-Geral de Pecuária." }
    ref: { en: "No official published breed legislation found (DGE)", fr: "Aucune législation par race officielle publiée trouvée (DGE)", es: "No se encontró ninguna legislación oficial por raza publicada (DGE)", pt: "Nenhuma legislação oficial sobre raças publicada encontrada (DGE)" }

origin:
  eu:
    title: { en: "From the European Union", fr: "Depuis l'Union européenne", es: "Desde la Unión Europea", pt: "Da União Europeia" }
    body:
      en: "The Republic of the Congo is a non-EU third country and does not run the EU pet-passport scheme, and it publishes no EU-specific certificate model. In practice a dog leaving the EU needs a microchip, a valid rabies vaccination and an official international veterinary health certificate issued and endorsed by the EU country's competent veterinary authority close to departure. Because the exact EU→Congo requirements are not published, confirm them with your official vet and the Directorate-General for Livestock before you travel."
      fr: "La République du Congo est un pays tiers hors UE et n'applique pas le dispositif de passeport pour animal de compagnie de l'UE ; elle ne publie aucun modèle de certificat propre à l'UE. En pratique, un chien quittant l'UE a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire vétérinaire international officiel établi et visé par l'autorité vétérinaire compétente du pays de l'UE peu avant le départ. Les exigences exactes UE→Congo n'étant pas publiées, confirme-les avec ton vétérinaire officiel et la Direction Générale de l'Élevage avant de voyager."
      es: "La República del Congo es un país tercero fuera de la UE y no aplica el sistema de pasaporte europeo para mascotas, ni publica ningún modelo de certificado específico para la UE. En la práctica, un perro que sale de la UE necesita un microchip, una vacunación antirrábica válida y un certificado sanitario veterinario internacional oficial expedido y refrendado por la autoridad veterinaria competente del país de la UE poco antes de la salida. Como los requisitos exactos UE→Congo no se publican, confírmalos con tu veterinario oficial y la Dirección General de Ganadería antes de viajar."
      pt: "A República do Congo é um país terceiro fora da UE e não opera o esquema de passaporte europeu para animais de estimação, e não publica um modelo de certificado específico para a UE. Na prática, um cachorro que sai da UE precisa de um microchip, de uma vacinação antirrábica válida e de um atestado de saúde veterinário internacional oficial, emitido e endossado pela autoridade veterinária competente do país da UE perto da partida. Como as exigências exatas UE→Congo não são publicadas, confirmar com o veterinário oficial e com a Diretoria-Geral de Pecuária antes de viajar."
    cls: warn
  listed:
    title: { en: "From the United States — no published certificate", fr: "Depuis les États-Unis — aucun certificat publié", es: "Desde Estados Unidos — sin certificado publicado", pt: "Dos Estados Unidos — nenhum certificado publicado" }
    body:
      en: "USDA/APHIS publishes no dog or cat export certificate for the Republic of the Congo. For species whose requirements are not listed, APHIS advises that the importer apply for an import permit at the appropriate Congolese ministry, which will most likely outline the specific requirements. In practice a USDA-accredited vet would still issue an international veterinary health certificate for the dog, endorsed by USDA (the country accepts USDA digital endorsement through VEHCS), but the entry conditions must be confirmed with the Congolese authorities first."
      fr: "L'USDA/APHIS ne publie aucun certificat d'exportation de chiens ou de chats pour la République du Congo. Pour les espèces dont les exigences ne sont pas listées, l'APHIS conseille que l'importateur demande un permis d'importation auprès du ministère congolais compétent, qui précisera vraisemblablement les exigences. En pratique, un vétérinaire agréé USDA établirait tout de même un certificat sanitaire vétérinaire international pour le chien, visé par l'USDA (le pays accepte le visa numérique de l'USDA via VEHCS), mais les conditions d'entrée doivent d'abord être confirmées auprès des autorités congolaises."
      es: "El USDA/APHIS no publica ningún certificado de exportación de perros o gatos para la República del Congo. Para las especies cuyos requisitos no están listados, APHIS aconseja que el importador solicite un permiso de importación en el ministerio congoleño competente, que muy probablemente detallará los requisitos específicos. En la práctica, un veterinario acreditado por el USDA expediría igualmente un certificado sanitario veterinario internacional para el perro, refrendado por el USDA (el país acepta el refrendo digital del USDA a través de VEHCS), pero las condiciones de entrada deben confirmarse primero con las autoridades congoleñas."
      pt: "O USDA/APHIS não publica um certificado de exportação para cachorros ou gatos com destino à República do Congo. Para espécies cujas exigências não são listadas, o APHIS orienta o importador a solicitar uma autorização de importação junto ao ministério congolês competente, que provavelmente definirá as exigências específicas. Na prática, um veterinário credenciado pelo USDA ainda emitiria um atestado de saúde veterinário internacional para o cachorro, endossado pelo USDA (o país aceita o endosso digital do USDA por meio do VEHCS), mas as condições de entrada devem ser confirmadas antes com as autoridades congolesas."
    cls: warn
  nonListed:
    title: { en: "From other countries — general Congo framework", fr: "Depuis d'autres pays — cadre général congolais", es: "Desde otros países — marco general del Congo", pt: "De outros países — quadro geral do Congo" }
    body:
      en: "For other origins there is no publicly posted country-specific model. The general framework still applies: a valid rabies vaccination and an official international veterinary health certificate endorsed by the origin's veterinary authority, with veterinary control expected on arrival under the Directorate-General for Livestock, and a possible import authorization. Confirm the current requirements with the Directorate-General for Livestock."
      fr: "Pour les autres origines, aucun modèle propre au pays n'est publié. Le cadre général s'applique tout de même : vaccination antirabique valide et certificat sanitaire vétérinaire international officiel visé par l'autorité vétérinaire d'origine, avec un contrôle vétérinaire attendu à l'arrivée sous l'égide de la Direction Générale de l'Élevage, et une éventuelle autorisation d'importation. Confirme les exigences en vigueur auprès de la Direction Générale de l'Élevage."
      es: "Para otros orígenes no hay ningún modelo específico por país publicado. El marco general se aplica igualmente: una vacunación antirrábica válida y un certificado sanitario veterinario internacional oficial refrendado por la autoridad veterinaria de origen, con un control veterinario previsto a la llegada bajo la Dirección General de Ganadería, y una posible autorización de importación. Confirma los requisitos vigentes con la Dirección General de Ganadería."
      pt: "Para outras origens, não há um modelo específico por país publicado. O quadro geral continua a se aplicar: vacinação antirrábica válida e atestado de saúde veterinário internacional oficial endossado pela autoridade veterinária de origem, com controle veterinário esperado na chegada sob a Diretoria-Geral de Pecuária, e uma possível autorização de importação. Confirmar as exigências vigentes com a Diretoria-Geral de Pecuária."
    cls: neutral

arrival:
  intro:
    en: "What happens when your dog reaches the Republic of the Congo depends on your documents and on the veterinary control at the point of entry."
    fr: "Ce qui se passe à l'arrivée de ton chien en République du Congo dépend de tes documents et du contrôle vétérinaire au point d'entrée."
    es: "Lo que ocurre cuando tu perro llega a la República del Congo depende de tus documentos y del control veterinario en el punto de entrada."
    pt: "O que acontece quando o cachorro chega à República do Congo depende dos documentos apresentados e do controle veterinário no ponto de entrada."
  points:
    - en: "Be ready to present your dog for veterinary control at the border; the Directorate-General for Livestock and its Animal Health Directorate are the competent veterinary authority."
      fr: "Sois prêt à présenter ton chien au contrôle vétérinaire à la frontière ; la Direction Générale de l'Élevage et sa Direction de la Santé Animale sont l'autorité vétérinaire compétente."
      es: "Prepárate para presentar a tu perro al control veterinario en la frontera; la Dirección General de Ganadería y su Dirección de Sanidad Animal son la autoridad veterinaria competente."
      pt: "Estar preparado para apresentar o cachorro ao controle veterinário na fronteira; a Diretoria-Geral de Pecuária e sua Direction de la Santé Animale são a autoridade veterinária competente."
    - en: "Carry the originals: the official international veterinary health certificate, proof of rabies vaccination and any identification and import-authorization document."
      fr: "Munis-toi des originaux : le certificat sanitaire vétérinaire international officiel, la preuve de vaccination antirabique et tout document d'identification et d'autorisation d'importation."
      es: "Lleva los originales: el certificado sanitario veterinario internacional oficial, la prueba de vacunación antirrábica y cualquier documento de identificación y de autorización de importación."
      pt: "Levar os originais: o atestado de saúde veterinário internacional oficial, o comprovante de vacinação antirrábica e qualquer documento de identificação e de autorização de importação."
    - en: "Documents must be consistent — identification, vaccination and health statements should match across the certificate and the vaccination record."
      fr: "Les documents doivent être cohérents — l'identification, la vaccination et les mentions sanitaires doivent concorder entre le certificat et le carnet de vaccination."
      es: "Los documentos deben ser coherentes — la identificación, la vacunación y las menciones sanitarias deben coincidir entre el certificado y la cartilla de vacunación."
      pt: "Os documentos devem ser coerentes entre si — a identificação, a vacinação e as declarações de saúde devem corresponder entre o certificado e a caderneta de vacinação."
    - en: "If documents are missing, incomplete or invalid, the animal may face veterinary measures at the border; the exact consequences are not published, so avoid any gap in your paperwork."
      fr: "Si les documents manquent, sont incomplets ou invalides, l'animal peut faire l'objet de mesures vétérinaires à la frontière ; les conséquences exactes ne sont pas publiées, évite donc toute lacune dans ton dossier."
      es: "Si faltan documentos o están incompletos o no son válidos, el animal puede ser objeto de medidas veterinarias en la frontera; las consecuencias exactas no se publican, así que evita cualquier laguna en tu documentación."
      pt: "Se os documentos estiverem incompletos, ausentes ou inválidos, o animal pode enfrentar medidas veterinárias na fronteira; as consequências exatas não são publicadas, portanto é melhor evitar qualquer lacuna na documentação."
    - en: "Because the Republic of the Congo publishes almost nothing, confirm entry-point procedures with the Directorate-General for Livestock and your airline before departure."
      fr: "La République du Congo ne publiant presque rien, confirme les procédures au point d'entrée avec la Direction Générale de l'Élevage et ta compagnie aérienne avant le départ."
      es: "Como la República del Congo publica casi nada, confirma los procedimientos del punto de entrada con la Dirección General de Ganadería y tu aerolínea antes de la salida."
      pt: "Como a República do Congo publica quase nada, confirmar os procedimentos no ponto de entrada com a Diretoria-Geral de Pecuária e com a companhia aérea antes da partida."

travellerExperience: null

restrictedDogs:
  intro:
    en: "No official Congolese breed-specific import ban was found in published government sources. Entry appears to be controlled by veterinary health requirements and control, not by breed."
    fr: "Aucune interdiction d'importation par race officielle congolaise n'a été trouvée dans les sources gouvernementales publiées. L'entrée semble encadrée par les exigences sanitaires vétérinaires et le contrôle, non par la race."
    es: "No se encontró ninguna prohibición de importación congoleña específica por raza en las fuentes gubernamentales publicadas. La entrada parece estar controlada por los requisitos sanitarios veterinarios y el control, no por la raza."
    pt: "Nenhuma proibição de importação específica por raça foi encontrada em fontes governamentais publicadas congolesas. A entrada parece ser controlada por exigências sanitárias veterinárias e controle, e não por raça."
  cat1:
    en: "There is no published national list of prohibited or dangerous breeds for import. Absence of a published list is not the same as a guarantee — no official text confirms that every breed is admitted either."
    fr: "Il n'existe pas de liste nationale publiée de races interdites ou dangereuses à l'importation. L'absence de liste publiée ne vaut pas garantie — aucun texte officiel ne confirme non plus que toutes les races sont admises."
    es: "No existe una lista nacional publicada de razas prohibidas o peligrosas para la importación. La ausencia de una lista publicada no equivale a una garantía — ningún texto oficial confirma tampoco que se admita toda raza."
    pt: "Não existe uma lista nacional publicada de raças proibidas ou perigosas para importação. A ausência de uma lista publicada não é o mesmo que uma garantia — nenhum texto oficial confirma que todas as raças sejam admitidas."
  cat2:
    en: "No published 'permitted with conditions' category exists for particular breeds. Local municipal rules on keeping certain dogs, if any, are not documented in the official sources reviewed."
    fr: "Aucune catégorie « autorisée sous conditions » publiée n'existe pour des races particulières. D'éventuelles règles municipales locales sur la détention de certains chiens ne sont pas documentées dans les sources officielles consultées."
    es: "No existe ninguna categoría publicada de «permitida con condiciones» para razas concretas. Las eventuales normas municipales locales sobre la tenencia de ciertos perros no están documentadas en las fuentes oficiales consultadas."
    pt: "Não existe uma categoria publicada de \"permitido com condições\" para raças específicas. Regras municipais locais sobre a posse de determinados cachorros, se existirem, não estão documentadas nas fontes oficiais consultadas."
  note:
    en: "Because the position is unpublished rather than confirmed, verify your specific breed with the Directorate-General for Livestock before you travel, especially for types often restricted elsewhere."
    fr: "La situation étant non publiée plutôt que confirmée, vérifie ta race précise auprès de la Direction Générale de l'Élevage avant de voyager, surtout pour les types souvent restreints ailleurs."
    es: "Como la situación no está publicada más que confirmada, verifica tu raza concreta con la Dirección General de Ganadería antes de viajar, especialmente para los tipos que suelen estar restringidos en otros lugares."
    pt: "Como a posição não é publicada nem confirmada, verificar a raça específica com a Diretoria-Geral de Pecuária antes de viajar, especialmente para tipos frequentemente restritos em outros lugares."

checklist:
  - en: "Valid rabies vaccination, current and correctly recorded (dates and vaccine)"
    fr: "Vaccination antirabique valide, à jour et correctement consignée (dates et vaccin)"
    es: "Vacunación antirrábica válida, al día y correctamente registrada (fechas y vacuna)"
    pt: "Vacinação antirrábica válida, em dia e corretamente registrada (datas e vacina)"
  - en: "Identification in order (ISO microchip strongly recommended) matching every document"
    fr: "Identification en règle (puce ISO fortement recommandée) correspondant à chaque document"
    es: "Identificación en regla (microchip ISO muy recomendado) que coincida con cada documento"
    pt: "Identificação em ordem (microchip ISO fortemente recomendado) correspondente a todos os documentos"
  - en: "Official international veterinary health certificate issued and endorsed by the origin's veterinary authority"
    fr: "Certificat sanitaire vétérinaire international officiel établi et visé par l'autorité vétérinaire d'origine"
    es: "Certificado sanitario veterinario internacional oficial expedido y refrendado por la autoridad veterinaria de origen"
    pt: "Atestado de saúde veterinário internacional oficial, emitido e endossado pela autoridade veterinária de origem"
  - en: "Confirm with the Directorate-General for Livestock whether an import authorization applies to your accompanying pet"
    fr: "Confirme auprès de la Direction Générale de l'Élevage si une autorisation d'importation s'applique à ton animal accompagné"
    es: "Confirma con la Dirección General de Ganadería si una autorización de importación se aplica a tu mascota acompañante"
    pt: "Confirmar com a Diretoria-Geral de Pecuária se uma autorização de importação se aplica ao cachorro que viaja acompanhado"
  - en: "Original documents ready to present at veterinary control on arrival"
    fr: "Documents originaux prêts à présenter au contrôle vétérinaire à l'arrivée"
    es: "Documentos originales listos para presentar en el control veterinario a la llegada"
    pt: "Documentos originais prontos para apresentação no controle veterinário na chegada"
  - en: "Confirm any breed, quarantine, parasite-treatment, antibody-test or minimum-age point directly with the authorities (unpublished)"
    fr: "Confirme tout point de race, quarantaine, traitement antiparasitaire, titrage ou âge minimum directement avec les autorités (non publié)"
    es: "Confirma cualquier punto de raza, cuarentena, tratamiento antiparasitario, prueba de titulación o edad mínima directamente con las autoridades (no publicado)"
    pt: "Confirmar diretamente com as autoridades qualquer ponto sobre raça, quarentena, tratamento antiparasitário, teste sorológico ou idade mínima (não publicado)"
  - en: "Airline reservation confirming your dog's travel option and a suitable IATA crate"
    fr: "Réservation confirmant l'option de transport de ton chien et une caisse IATA adaptée"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y una jaula IATA adecuada"
    pt: "Reserva na companhia aérea confirmando a opção de viagem do cachorro e uma caixa de transporte adequada às normas IATA"

