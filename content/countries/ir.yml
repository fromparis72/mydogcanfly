hero:
  h1: { en: "Traveling to Iran with your dog", fr: "Voyager en Iran avec ton chien", es: "Viajar a Irán con tu perro", pt: "Viajar para o Irã com seu cachorro" }
  intro:
    en: >-
      Iran does not run an open, published pet-dog import scheme. Under the Iran Veterinary Organization
      Act, importing a live animal is lawful only "in agreement with the Ministry of Agriculture," and
      Iranian Customs (IRICA) lists cats, dogs and other pets among goods that may not be brought in
      "unless permission has been granted." In other words, a dog is a restricted, permission-only
      category — not a freely admissible pet — and prior authorisation from the Iran Veterinary
      Organization (IVO) is required before travel. There is no standardised, publicly documented
      procedure for bringing a pet dog into Iran: the U.S. export authority notes that there are no
      agreed animal trade protocols with Iran and that the importer must obtain an import permit that
      sets the conditions case by case. This page reports that position honestly. Where a specific rule
      (microchip, rabies timing, antibody test, certificate, entry point, quarantine) is not published
      by an official Iranian source, we mark it "Unknown" rather than guess.
    fr: >-
      L'Iran n'applique pas de régime ouvert et publié d'importation de chiens de compagnie. En vertu de
      la loi sur l'Organisation vétérinaire iranienne, l'importation d'un animal vivant n'est licite qu'«
      en accord avec le ministère de l'Agriculture », et la douane iranienne (IRICA) classe les chats,
      chiens et autres animaux de compagnie parmi les biens qui ne peuvent être introduits « sauf
      autorisation accordée ». Autrement dit, un chien relève d'une catégorie restreinte, soumise à
      autorisation — et non d'un animal librement admis : une autorisation préalable de l'Organisation
      vétérinaire iranienne (IVO) est requise avant le voyage. Il n'existe aucune procédure normalisée et
      publiquement documentée pour faire entrer un chien de compagnie en Iran : l'autorité d'exportation
      américaine indique qu'il n'existe aucun protocole commercial animalier convenu avec l'Iran et que
      l'importateur doit obtenir un permis d'importation fixant les conditions au cas par cas. Cette page
      rapporte honnêtement cette situation. Lorsqu'une règle précise (puce, délais de vaccination
      antirabique, titrage, certificat, point d'entrée, quarantaine) n'est pas publiée par une source
      officielle iranienne, nous indiquons « Non communiqué » plutôt que de deviner.
    es: >-
      Irán no aplica un régimen abierto y publicado de importación de perros de compañía. En virtud de la
      Ley de la Organización Veterinaria de Irán, importar un animal vivo solo es lícito «de acuerdo con
      el Ministerio de Agricultura», y la Aduana iraní (IRICA) incluye a gatos, perros y otras mascotas
      entre las mercancías que no pueden introducirse «salvo que se haya concedido permiso». En otras
      palabras, un perro es una categoría restringida, sujeta a permiso — no una mascota de libre
      admisión — y se requiere una autorización previa de la Organización Veterinaria de Irán (IVO) antes
      de viajar. No existe un procedimiento normalizado y documentado públicamente para traer un perro de
      compañía a Irán: la autoridad de exportación de Estados Unidos señala que no hay protocolos
      comerciales de animales acordados con Irán y que el importador debe obtener un permiso de
      importación que fija las condiciones caso por caso. Esta página informa de esa situación con
      honestidad. Cuando una norma concreta (microchip, plazos de la rabia, prueba de titulación,
      certificado, punto de entrada, cuarentena) no está publicada por una fuente oficial iraní, la
      marcamos como «No publicado» en lugar de suponerla.

    pt: "O Irã não tem um esquema de importação de cachorros de estimação aberto e publicado. Segundo a Lei da Organização Veterinária do Irã, importar um animal vivo só é legal \"em acordo com o Ministério da Agricultura\", e a Alfândega iraniana (IRICA) lista gatos, cachorros e outros animais de estimação entre os bens que não podem ser trazidos \"a menos que a permissão tenha sido concedida\". Em outras palavras, um cachorro é uma categoria restrita, sujeita a permissão — não um animal de estimação livremente admissível — e é exigida autorização prévia da Organização Veterinária do Irã (IVO) antes da viagem. Não existe um procedimento padronizado e publicamente documentado para trazer um cachorro de estimação para o Irã: a autoridade de exportação dos Estados Unidos observa que não há protocolos de comércio de animais acordados com o Irã e que o importador precisa obter uma autorização de importação que define as condições caso a caso. Esta página relata essa posição com honestidade. Quando uma norma específica (microchip, prazo da vacinação antirrábica, teste sorológico, atestado, ponto de entrada, quarentena) não é publicada por uma fonte oficial iraniana, nós a marcamos como \"Não comunicado\" em vez de arriscar um palpite."
