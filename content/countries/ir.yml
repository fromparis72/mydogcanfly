notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Iran treats pet dogs as a restricted, permission-only category: only the Iran Veterinary Organization (IVO) and the Ministry of Agriculture can authorise an import and set the exact conditions."
    fr: "L'Iran traite les chiens de compagnie comme une catégorie restreinte, soumise à autorisation : seuls l'Organisation vétérinaire iranienne (IVO) et le ministère de l'Agriculture peuvent autoriser une importation et en fixer les conditions exactes."
    es: "Irán trata a los perros de compañía como una categoría restringida, sujeta a permiso: solo la Organización Veterinaria de Irán (IVO) y el Ministerio de Agricultura pueden autorizar una importación y fijar las condiciones exactas."
    pt: "O Irã trata os cachorros de estimação como uma categoria restrita, sujeita a permissão: somente a Organização Veterinária do Irã (IVO) e o Ministério da Agricultura podem autorizar uma importação e definir as condições exatas."
  - en: "There is no standardised published procedure — do not assume a fixed microchip/rabies/certificate checklist. Obtain a written import permit and its conditions before you book any travel."
    fr: "Il n'existe aucune procédure normalisée publiée — ne présume pas d'une liste fixe puce/rage/certificat. Obtiens un permis d'importation écrit et ses conditions avant de réserver tout voyage."
    es: "No existe un procedimiento normalizado publicado — no des por hecho una lista fija de microchip/rabia/certificado. Obtén un permiso de importación por escrito y sus condiciones antes de reservar cualquier viaje."
    pt: "Não existe um procedimento padronizado publicado — não presuma uma lista fixa de exigências de microchip/vacinação antirrábica/atestado. Obtenha uma autorização de importação por escrito e suas condições antes de reservar qualquer viagem."
  - en: "Because the official conditions are not published, several requirements on this page are marked Unknown; confirm each directly with the IVO / Iranian Customs before travelling."
    fr: "Les conditions officielles n'étant pas publiées, plusieurs exigences de cette page sont indiquées « Non communiqué » ; confirme chacune directement auprès de l'IVO / de la douane iranienne avant de voyager."
    es: "Como las condiciones oficiales no están publicadas, varios requisitos de esta página están marcados como «No publicado»; confirma cada uno directamente con la IVO / la Aduana iraní antes de viajar."
    pt: "Como as condições oficiais não são publicadas, várias exigências nesta página estão marcadas como Não comunicado; confirme cada uma diretamente com a IVO / Alfândega iraniana antes de viajar."
  - en: "Requirements depend on: the destination (Iran), the country of departure, your dog's identification, vaccinations, travel history, itinerary and date — but for Iran the decisive step is obtaining prior official permission."
    fr: "Les exigences dépendent : de la destination (Iran), du pays de départ, de l'identification du chien, des vaccinations, de l'historique de voyage, de l'itinéraire et de la date — mais pour l'Iran, l'étape déterminante est l'obtention d'une autorisation officielle préalable."
    es: "Los requisitos dependen de: el destino (Irán), el país de salida, la identificación de tu perro, las vacunas, el historial de viajes, el itinerario y la fecha — pero para Irán el paso decisivo es obtener una autorización oficial previa."
    pt: "As exigências dependem do destino (Irã), do país de partida, da identificação do seu cachorro, das vacinas, do histórico de viagens, do itinerário e da data — mas, no caso do Irã, a etapa decisiva é obter a permissão oficial prévia."
