prepTime:
  eu:
    en: "No EU-style simplified route exists. Iran is outside the EU pet-travel system, so an EU dog still needs prior IVO/ministry permission; the timeline is Unknown because no procedure is published."
    fr: "Aucun parcours européen simplifié n'existe. L'Iran est hors du système européen de voyage des animaux : un chien de l'UE a tout de même besoin de l'autorisation préalable de l'IVO/du ministère ; le délai est non communiqué, faute de procédure publiée."
    es: "No existe una vía europea simplificada. Irán está fuera del sistema europeo de viaje de mascotas, por lo que un perro de la UE sigue necesitando el permiso previo de la IVO/del ministerio; el plazo es desconocido porque no hay procedimiento publicado."
    pt: "Não existe uma via simplificada nos moldes da UE. O Irã está fora do sistema europeu de viagens com animais de estimação, portanto um cachorro vindo da UE também precisa de permissão prévia da IVO/ministério; o prazo é Não comunicado porque nenhum procedimento é publicado."
  listed:
    en: "Coming from a low-rabies-risk country does not create an easier path. Prior permission is still required, and the processing time is Unknown — plan well ahead and request authorisation before booking."
    fr: "Venir d'un pays à faible risque rabique ne crée pas de voie plus simple. L'autorisation préalable reste exigée et le délai de traitement est non communiqué — anticipe largement et demande l'autorisation avant de réserver."
    es: "Venir de un país de bajo riesgo de rabia no crea una vía más fácil. Sigue siendo necesaria la autorización previa, y el tiempo de tramitación es desconocido — planifica con mucha antelación y solicita la autorización antes de reservar."
    pt: "Vir de um país de baixo risco de raiva não cria um caminho mais fácil. A permissão prévia continua sendo exigida, e o prazo de processamento é Não comunicado — planeje com bastante antecedência e solicite a autorização antes de reservar."
  nonListed:
    en: "For any other origin the same applies: no dog enters without prior IVO/ministry permission, and the conditions and timeframe are set case by case and are not published."
    fr: "Pour toute autre origine, c'est identique : aucun chien n'entre sans autorisation préalable de l'IVO/du ministère, et les conditions et délais sont fixés au cas par cas et non publiés."
    es: "Para cualquier otro origen se aplica lo mismo: ningún perro entra sin el permiso previo de la IVO/del ministerio, y las condiciones y los plazos se fijan caso por caso y no se publican."
    pt: "Para qualquer outra origem, aplica-se o mesmo: nenhum cachorro entra sem permissão prévia da IVO/ministério, e as condições e o prazo são definidos caso a caso e não são publicados."

