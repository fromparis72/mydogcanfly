factors:
  title: { en: "How your dog's entry to Iran is decided", fr: "Comment est décidée l'entrée de ton chien en Iran", es: "Cómo se decide la entrada de tu perro a Irán", pt: "Como é decidida a entrada do seu cachorro no Irã" }
  intro:
    en: "Entry normally depends on three things, but for Iran the destination rule dominates: a dog is a permission-only category, so nothing proceeds without prior IVO/ministry authorisation."
    fr: "L'entrée dépend normalement de trois éléments, mais pour l'Iran la règle de destination domine : un chien relève d'une catégorie soumise à autorisation, de sorte que rien ne se fait sans autorisation préalable de l'IVO/du ministère."
    es: "La entrada suele depender de tres factores, pero para Irán la regla de destino domina: un perro es una categoría sujeta a permiso, por lo que nada avanza sin la autorización previa de la IVO/del ministerio."
    pt: "A entrada normalmente depende de três fatores, mas, no caso do Irã, a regra do destino prevalece: um cachorro é uma categoria sujeita a permissão, portanto nada avança sem a autorização prévia da IVO/ministério."
  items:
    - stars: 5
      label: { en: "Country of destination — Iran", fr: "Pays de destination — Iran", es: "País de destino — Irán", pt: "País de destino — Irã" }
      text:
        en: "Iran is decisive. Its Veterinary Organization Act allows live-animal import only in agreement with the Ministry of Agriculture, and Customs lists dogs among goods barred unless permission is granted. There is no open scheme, so a prior written authorisation is the gate to everything else."
        fr: "L'Iran est déterminant. Sa loi sur l'Organisation vétérinaire n'autorise l'importation d'animaux vivants qu'en accord avec le ministère de l'Agriculture, et la douane classe les chiens parmi les biens interdits sauf autorisation accordée. Il n'existe aucun régime ouvert : une autorisation écrite préalable conditionne tout le reste."
        es: "Irán es decisivo. Su Ley de la Organización Veterinaria solo permite la importación de animales vivos de acuerdo con el Ministerio de Agricultura, y la Aduana incluye a los perros entre las mercancías vetadas salvo que se conceda permiso. No existe un régimen abierto, por lo que una autorización previa por escrito es la puerta a todo lo demás."
        pt: "O Irã é decisivo. Sua Lei da Organização Veterinária permite a importação de animais vivos somente em acordo com o Ministério da Agricultura, e a Alfândega lista os cachorros entre os bens proibidos, a menos que a permissão seja concedida. Não existe um esquema aberto, portanto uma autorização prévia por escrito é a porta de entrada para tudo o mais."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The departure country's veterinary authority would normally endorse an export health certificate. For Iran that certificate is only meaningful once an Iranian import permit exists and sets the conditions — the U.S. export authority confirms there is no agreed protocol and that the importer must first obtain that permit."
        fr: "L'autorité vétérinaire du pays de départ viserait normalement un certificat sanitaire d'exportation. Pour l'Iran, ce certificat n'a de sens qu'une fois qu'un permis d'importation iranien existe et en fixe les conditions — l'autorité d'exportation américaine confirme qu'il n'y a pas de protocole convenu et que l'importateur doit d'abord obtenir ce permis."
        es: "La autoridad veterinaria del país de salida normalmente refrendaría un certificado sanitario de exportación. Para Irán, ese certificado solo tiene sentido una vez que existe un permiso de importación iraní que fija las condiciones — la autoridad de exportación de Estados Unidos confirma que no hay protocolo acordado y que el importador debe obtener primero ese permiso."
        pt: "A autoridade veterinária do país de partida normalmente endossaria um atestado de saúde de exportação. No caso do Irã, esse atestado só tem sentido depois que existe uma autorização de importação iraniana que define as condições — a autoridade de exportação dos Estados Unidos confirma que não há protocolo acordado e que o importador precisa primeiro obter essa autorização."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "Rabies status and travel history usually shape the health conditions. Here they may influence what the IVO requires in a given permit, but because Iran publishes no standard protocol, their exact effect is Unknown and is decided by the authority case by case."
        fr: "Le statut rabique et l'historique de voyage déterminent habituellement les conditions sanitaires. Ici, ils peuvent influencer ce que l'IVO exige dans un permis donné, mais l'Iran ne publiant aucun protocole standard, leur effet exact est non communiqué et décidé par l'autorité au cas par cas."
        es: "La situación de rabia y el historial de viajes suelen determinar las condiciones sanitarias. Aquí pueden influir en lo que la IVO exija en un permiso concreto, pero como Irán no publica ningún protocolo estándar, su efecto exacto es desconocido y lo decide la autoridad caso por caso."
        pt: "A situação em relação à raiva e o histórico de viagens costumam moldar as condições sanitárias. Aqui, eles podem influenciar o que a IVO exige em uma determinada autorização, mas, como o Irã não publica um protocolo padrão, seu efeito exato é Não comunicado e é decidido pela autoridade caso a caso."
  note:
    en: "So treat this guide as an honest 'permission-first, conditions-unpublished' picture: secure written authorisation from the IVO/ministry before anything else, and confirm every health step directly with them."
    fr: "Considère donc ce guide comme une image honnête « autorisation d'abord, conditions non publiées » : obtiens une autorisation écrite de l'IVO/du ministère avant tout, et confirme chaque étape sanitaire directement auprès d'eux."
    es: "Así que trata esta guía como una imagen honesta de «primero el permiso, condiciones no publicadas»: consigue una autorización por escrito de la IVO/del ministerio antes que nada, y confirma cada paso sanitario directamente con ellos."
    pt: "Portanto, trate este guia como um retrato honesto de 'permissão em primeiro lugar, condições não publicadas': garanta a autorização por escrito da IVO/ministério antes de qualquer outra coisa e confirme cada etapa sanitária diretamente com eles."

