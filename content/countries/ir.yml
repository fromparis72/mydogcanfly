# Country Entry Guide — Iran (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
# IMPORTANT — HONEST OFFICIAL POSITION:
# Iran does NOT operate an open, published pet-dog import scheme. Two official facts frame this guide:
#  1) The Iran Veterinary Organization Act (ratified 1971) makes the import/export of live animals lawful
#     only "in agreement with the Ministry of Agriculture" (Article 7), with border quarantine officials
#     empowered to refuse, return or destroy animals that cannot be cleared (Article 8). Import of live
#     animals is therefore a controlled act requiring the Iran Veterinary Organization's (IVO) prior
#     agreement — not a right.
#  2) Iranian Customs (IRICA) classifies cats, dogs and other pets among goods that may not be brought in
#     "unless permission has been granted" — i.e. dogs are a restricted/permission-only category, not a
#     freely admissible one.
#  The U.S. official animal-export authority (USDA-APHIS) further states there are NO bilaterally agreed
#  animal trade protocols with Iran and that the importer must obtain an import permit from the relevant
#  Iranian ministry, which will outline the conditions case by case.
#  Consequence: there is a NARROW, conditional path (prior IVO/ministry permission), but no standardised,
#  publicly documented pet-dog procedure. The specific health conditions (microchip, rabies timing,
#  antibody test, certificate model, entry points, quarantine length) are NOT published in an accessible
#  official protocol, so they are marked "Unknown" rather than invented. Confidence is LOW.
