# Country Entry Guide — Chile (bilingual EN/FR).
# Chile is NOT in the EU. This encodes Chile's own SAG scheme (Servicio Agrícola y Ganadero),
# Resolución SAG N° 6.508/2021 and its modifications.
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_cl
iso2: "CL"
name: { en: "Chile", fr: "Chili", es: "Chile", pt: "Chile" }
region: { en: "South America", fr: "Amérique du Sud", es: "América del Sur", pt: "América do Sul" }


regime: listed
exit:
  authority: SAG
  authorityUrl: https://www.sag.gob.cl/tramites/solicitud-de-certificado-zoosanitario-de-exportacion-para-salir-de-chile-con-perros-y-gatos
  intro:
    en: "Chile is a listed country, so no rabies titer is needed to return — SAG issues the export zoosanitary certificate (CZE) for your dog."
    fr: "Le Chili est un pays listé : pas de titrage pour revenir — le SAG délivre le certificat zoosanitaire d'export (CZE) pour ton chien."
    es: "Chile es un país listado: no hace falta titulación para volver — el SAG emite el certificado zoosanitario de exportación (CZE) para tu perro."
    pt: "O Chile é um país listado, então não é preciso teste sorológico antirrábico para voltar — o SAG emite o certificado zoossanitário de exportação (CZE) do seu cachorro."
  steps:
    - timing: window
      scope: any
      text:
        en: "Apply on the SAG website with a private vet's health certificate (max 10 days old) plus vaccination records; SAG advises applying about 10 days ahead and processes it in roughly 3 business days."
        fr: "Fais la demande sur le site du SAG avec le certificat sanitaire d'un vétérinaire privé (10 jours max) et les preuves de vaccination ; le SAG conseille de s'y prendre ~10 jours avant, traitement en ~3 jours ouvrés."
        es: "Solicítalo en la web del SAG con el certificado sanitario de un veterinario privado (máx. 10 días) y los registros de vacunación; el SAG recomienda hacerlo ~10 días antes y lo tramita en ~3 días hábiles."
        pt: "Faça o pedido no site do SAG com um atestado de saúde de veterinário particular (com no máximo 10 dias) e a carteira de vacinação; o SAG recomenda pedir cerca de 10 dias antes e leva aproximadamente 3 dias úteis para processar."
  onSiteNote:
    en: "If your dog entered Chile on an EU pet passport, it can return to the EU on that passport without a CZE."
    fr: "Si ton chien est entré au Chili avec un passeport européen, il peut rentrer dans l'UE avec ce passeport, sans CZE."
    es: "Si tu perro entró en Chile con un pasaporte europeo, puede volver a la UE con ese pasaporte, sin CZE."
    pt: "Se o seu cachorro entrou no Chile com o passaporte europeu para animais de companhia, ele pode voltar à UE com esse mesmo passaporte, sem CZE."

hero:
  h1: { en: "Traveling to Chile with your dog", fr: "Voyager au Chili avec ton chien", es: "Viajar a Chile con tu perro", pt: "Viajar para o Chile com o seu cachorro" }
  intro:
    en: >-
      Chile welcomes dogs, and its entry rules are set by SAG (Servicio Agrícola y Ganadero), the
      national agricultural and livestock authority. Chile is not part of the EU pet-passport system;
      it runs its own scheme. For most origins your dog needs a single document — an Import Zoosanitary
      Certificate (CZI), also presented as an International Veterinary Certificate (CVI), issued by the
      official veterinary authority of the country you travel from within 10 days before entry. It must
      certify a clinical examination, permanent identification (microchip or tattoo), a valid rabies
      vaccination and internal and external antiparasitic treatment. Dogs coming from the European Union
      may instead travel on the EU pet passport. There is no kennel quarantine, but SAG asks that the
      dog stay confined at its destination address for 10 days after arrival. This guide explains exactly
      what to prepare, and the timing to respect, before you book your flight.
    fr: >-
      Le Chili accueille les chiens, et ses règles d'entrée sont fixées par le SAG (Servicio Agrícola y
      Ganadero), l'autorité agricole et d'élevage nationale. Le Chili ne fait pas partie du système du
      passeport européen ; il applique son propre dispositif. Pour la plupart des origines, ton chien a
      besoin d'un seul document — un Certificat Zoosanitaire d'Importation (CZI), présenté aussi comme
      Certificat Vétérinaire International (CVI), émis par l'autorité vétérinaire officielle du pays de
      départ dans les 10 jours précédant l'entrée. Il doit attester un examen clinique, une identification
      permanente (puce ou tatouage), une vaccination antirabique valide et un traitement antiparasitaire
      interne et externe. Les chiens venant de l'Union européenne peuvent voyager avec le passeport UE.
      Il n'y a pas de quarantaine en chenil, mais le SAG demande que le chien reste confiné à son adresse
      de destination pendant 10 jours après l'arrivée. Ce guide détaille exactement quoi préparer, et les
      délais à respecter, avant de réserver ton vol.
    es: >-
      Chile acoge a los perros, y sus normas de entrada las fija el SAG (Servicio Agrícola y Ganadero),
      la autoridad agrícola y ganadera nacional. Chile no forma parte del sistema del pasaporte europeo
      para mascotas; aplica su propio esquema. Para la mayoría de los orígenes tu perro necesita un único
      documento — un Certificado Zoosanitario de Importación (CZI), presentado también como Certificado
      Veterinario Internacional (CVI), emitido por la autoridad veterinaria oficial del país desde el que
      viajas dentro de los 10 días previos a la entrada. Debe certificar un examen clínico, una
      identificación permanente (microchip o tatuaje), una vacunación antirrábica válida y un tratamiento
      antiparasitario interno y externo. Los perros que llegan de la Unión Europea pueden viajar, en su
      lugar, con el pasaporte europeo para mascotas. No hay cuarentena en perrera, pero el SAG pide que el
      perro permanezca confinado en su dirección de destino durante 10 días tras la llegada. Esta guía
      explica exactamente qué preparar, y los plazos que debes respetar, antes de reservar tu vuelo.

    pt: "O Chile recebe bem os cachorros, e suas regras de entrada são definidas pelo SAG (Servicio Agrícola y Ganadero), a autoridade nacional agrícola e pecuária. O Chile não faz parte do sistema europeu de passaporte para animais de companhia; ele tem o seu próprio esquema. Para a maioria das origens, o seu cachorro precisa de um único documento — um Certificado Zoossanitário de Importação (CZI), também apresentado como Certificado Veterinário Internacional (CVI), emitido pela autoridade veterinária oficial do país de onde você viaja, dentro dos 10 dias anteriores à entrada. Ele deve atestar um exame clínico, a identificação permanente (microchip ou tatuagem), uma vacinação antirrábica válida e o tratamento antiparasitário interno e externo. Os cachorros vindos da União Europeia podem, em vez disso, viajar com o passaporte europeu para animais de companhia. Não há quarentena em canil, mas o SAG pede que o cachorro fique confinado no endereço de destino por 10 dias após a chegada. Este guia explica exatamente o que preparar, e os prazos a respeitar, antes de você comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Moderate — one official certificate, tight timing windows", fr: "Modéré — un certificat officiel, des délais serrés", es: "Moderado — un certificado oficial, con plazos ajustados", pt: "Moderada — um certificado oficial, prazos apertados" }

prepTime:
  eu:
    en: "From the EU on a pet passport: a few days to gather the clinical exam (within 10 days of travel), a valid rabies vaccination and antiparasitic treatment (5–30 days before entry)."
    fr: "Depuis l'UE avec un passeport : quelques jours pour réunir l'examen clinique (dans les 10 jours du voyage), une vaccination antirabique valide et le traitement antiparasitaire (5 à 30 jours avant l'entrée)."
    es: "Desde la UE con un pasaporte para mascotas: unos días para reunir el examen clínico (dentro de los 10 días previos al viaje), una vacunación antirrábica válida y el tratamiento antiparasitario (5–30 días antes de la entrada)."
    pt: "Vindo da UE com o passaporte europeu: alguns dias para reunir o exame clínico (nos 10 dias anteriores à viagem), uma vacinação antirrábica válida e o tratamento antiparasitário (5–30 dias antes da entrada)."
  listed:
    en: "From any other country: plan the Import Zoosanitary Certificate (CZI/CVI) issued by the origin's official veterinary authority within 10 days before entry — allow time to book the government endorsement."
    fr: "Depuis tout autre pays : prévois le Certificat Zoosanitaire d'Importation (CZI/CVI) émis par l'autorité vétérinaire officielle d'origine dans les 10 jours avant l'entrée — laisse du temps pour le visa officiel."
    es: "Desde cualquier otro país: prevé el Certificado Zoosanitario de Importación (CZI/CVI) emitido por la autoridad veterinaria oficial del origen dentro de los 10 días previos a la entrada — deja tiempo para gestionar el refrendo oficial."
    pt: "De qualquer outro país: planeje o Certificado Zoossanitário de Importação (CZI/CVI) emitido pela autoridade veterinária oficial de origem dentro dos 10 dias anteriores à entrada — reserve tempo para agendar o aval oficial."
  nonListed:
    en: "If the first rabies shot is still needed: allow ~3 weeks, as a primary (first-in-life) vaccination must be given at least 21 days before entry."
    fr: "Si la première vaccination reste à faire : prévois ~3 semaines, une primo-vaccination devant être faite au moins 21 jours avant l'entrée."
    es: "Si aún falta la primera vacuna antirrábica: prevé ~3 semanas, ya que una primovacunación (la primera de la vida) debe administrarse al menos 21 días antes de la entrada."
    pt: "Se a primeira dose da vacina antirrábica ainda estiver pendente: conte ~3 semanas, já que a vacinação primária (a primeira da vida) deve ser aplicada pelo menos 21 dias antes da entrada."

