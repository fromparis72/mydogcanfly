factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Chile (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — le Chili (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Chile (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — o Chile (o seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Chile", fr: "Pays de destination — Chili", es: "País de destino — Chile", pt: "País de destino — Chile" }
      text:
        en: "Chile applies its own SAG scheme (Resolución 6.508/2021): one Import Zoosanitary Certificate (CZI/CVI) covering a clinical exam, permanent identification, a valid rabies vaccination and antiparasitic treatment. No kennel quarantine, but a 10-day home confinement on arrival."
        fr: "Le Chili applique son propre régime SAG (Résolution 6.508/2021) : un Certificat Zoosanitaire d'Importation (CZI/CVI) couvrant un examen clinique, une identification permanente, une vaccination antirabique valide et un traitement antiparasitaire. Pas de quarantaine en chenil, mais un confinement à domicile de 10 jours à l'arrivée."
        es: "Chile aplica su propio esquema del SAG (Resolución 6.508/2021): un único Certificado Zoosanitario de Importación (CZI/CVI) que cubre un examen clínico, una identificación permanente, una vacunación antirrábica válida y un tratamiento antiparasitario. Sin cuarentena en perrera, pero con un confinamiento domiciliario de 10 días a la llegada."
        pt: "O Chile aplica o seu próprio esquema do SAG (Resolución 6.508/2021): um Certificado Zoossanitário de Importação (CZI/CVI) que cobre exame clínico, identificação permanente, vacinação antirrábica válida e tratamento antiparasitário. Sem quarentena em canil, mas com 10 dias de confinamento domiciliar na chegada."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The certificate must be issued, in Spanish and the country's official language, by the official veterinary authority of the country you depart from, within 10 days before entry. EU departures may use the EU pet passport instead. This timing drives your whole preparation."
        fr: "Le certificat doit être émis, en espagnol et dans la langue officielle du pays, par l'autorité vétérinaire officielle du pays de départ, dans les 10 jours avant l'entrée. Les départs de l'UE peuvent utiliser le passeport UE. Ces délais rythment toute ton préparation."
        es: "El certificado debe ser emitido, en español y en el idioma oficial del país, por la autoridad veterinaria oficial del país desde el que sales, dentro de los 10 días previos a la entrada. Las salidas desde la UE pueden usar el pasaporte europeo para mascotas. Estos plazos marcan toda tu preparación."
        pt: "O certificado deve ser emitido, em espanhol e no idioma oficial do país, pela autoridade veterinária oficial do país de onde você parte, dentro dos 10 dias anteriores à entrada. Quem parte da UE pode usar o passaporte europeu no lugar dele. Esse prazo condiciona toda a sua preparação."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "For Chilean residents making a short trip, the return route is simpler: a dog abroad for under 21 days (under 60 days from Argentina) may re-enter on a copy of the SAG export certificate plus proof of a valid rabies vaccination."
        fr: "Pour les résidents chiliens en court séjour, le retour est simplifié : un chien à l'étranger moins de 21 jours (moins de 60 jours depuis l'Argentine) peut rentrer avec une copie du certificat d'exportation du SAG et la preuve d'une vaccination antirabique valide."
        es: "Para los residentes chilenos que hacen un viaje corto, el regreso es más sencillo: un perro que ha estado en el extranjero menos de 21 días (menos de 60 días desde Argentina) puede reingresar con una copia del certificado de exportación del SAG y la prueba de una vacunación antirrábica válida."
        pt: "Para residentes no Chile em viagem curta, a volta é mais simples: um cachorro que ficou menos de 21 dias no exterior (menos de 60 dias no caso da Argentina) pode reentrar com uma cópia do certificado de exportação do SAG e o comprovante de vacinação antirrábica válida."
  note:
    en: "So read the requirements below as Chile's framework, then confirm your dog's exact origin and history with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre chilien, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Chile y luego confirma el origen y el historial exactos de tu perro con tu veterinario."
    pt: "Portanto, leia as exigências abaixo como o quadro geral do Chile e depois confirme com o seu veterinário a origem e o histórico exatos do seu cachorro."

requirements:
  - item: { en: "Identification (ISO microchip or tattoo)", fr: "Identification (puce ISO ou tatouage)", es: "Identificación (microchip ISO o tatuaje)", pt: "Identificação (microchip ISO ou tatuagem)" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "The dog must carry individual, permanent identification — a microchip compliant with ISO 11784/11785 or a legible tattoo. The ID number must match the one recorded on the veterinary certificate.", fr: "Le chien doit porter une identification individuelle et permanente — une puce conforme aux normes ISO 11784/11785 ou un tatouage lisible. Le numéro d'identification doit correspondre à celui inscrit sur le certificat vétérinaire.", es: "El perro debe llevar una identificación individual y permanente — un microchip conforme con las normas ISO 11784/11785 o un tatuaje legible. El número de identificación debe coincidir con el que figura en el certificado veterinario.", pt: "O cachorro deve ter identificação individual e permanente — um microchip em conformidade com a norma ISO 11784/11785 ou uma tatuagem legível. O número de identificação deve coincidir com o que consta do certificado veterinário." }
    exceptions: { en: "A tattoo is accepted as an alternative to a microchip, but a microchip is strongly advised (and required by most airlines).", fr: "Un tatouage est accepté comme alternative à la puce, mais une puce est fortement conseillée (et exigée par la plupart des compagnies).", es: "Se acepta un tatuaje como alternativa al microchip, pero se recomienda encarecidamente un microchip (y lo exigen la mayoría de las aerolíneas).", pt: "A tatuagem é aceita como alternativa ao microchip, mas o microchip é fortemente recomendado (e exigido pela maioria das companhias aéreas)." }
    ref: { en: "SAG — Res. 6.508/2021 (identification)", fr: "SAG — Rés. 6.508/2021 (identification)", es: "SAG — Res. 6.508/2021 (identificación)", pt: "SAG — Res. 6.508/2021 (identificação)" }
  - item: { en: "Clinical examination", fr: "Examen clinique", es: "Examen clínico", pt: "Exame clínico" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Carried out by a veterinarian within the 10 days before entry to Chile; the dog must show no clinical signs of infectious or parasitic disease.", fr: "Réalisé par un vétérinaire dans les 10 jours avant l'entrée au Chili ; le chien ne doit présenter aucun signe clinique de maladie infectieuse ou parasitaire.", es: "Realizado por un veterinario dentro de los 10 días previos a la entrada a Chile; el perro no debe presentar signos clínicos de enfermedad infecciosa ni parasitaria.", pt: "Realizado por um veterinário dentro dos 10 dias anteriores à entrada no Chile; o cachorro não pode apresentar sinais clínicos de doença infecciosa ou parasitária." }
    exceptions: { en: "Its content is embedded in the Import Zoosanitary Certificate (CZI/CVI).", fr: "Son contenu est intégré au Certificat Zoosanitaire d'Importation (CZI/CVI).", es: "Su contenido está integrado en el Certificado Zoosanitario de Importación (CZI/CVI).", pt: "O seu conteúdo já está incorporado ao Certificado Zoossanitário de Importação (CZI/CVI)." }
    ref: { en: "SAG — Res. 6.508/2021", fr: "SAG — Rés. 6.508/2021", es: "SAG — Res. 6.508/2021", pt: "SAG — Res. 6.508/2021" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "A primary (first-in-life) rabies vaccination — regardless of the dog's age — must be given at least 21 days before entry and remain within its validity period. For a non-primary vaccination, the last two doses must be certified.", fr: "Une primo-vaccination antirabique — quel que soit l'âge du chien — doit être faite au moins 21 jours avant l'entrée et rester dans sa période de validité. Pour une vaccination non primaire, les deux dernières doses doivent être certifiées.", es: "Una primovacunación antirrábica (la primera de la vida) — sea cual sea la edad del perro — debe administrarse al menos 21 días antes de la entrada y mantenerse dentro de su periodo de valide. Para una vacunación no primaria, deben certificarse las dos últimas dosis.", pt: "A vacinação antirrábica primária (a primeira da vida) — independentemente da idade do cachorro — deve ser aplicada pelo menos 21 dias antes da entrada e continuar dentro do prazo de validade. No caso de uma vacinação não primária, as duas últimas doses devem ser certificadas." }
    exceptions: { en: "If the last two doses are not documented, the dog is treated as newly (primary) vaccinated and the 21-day rule applies.", fr: "Si les deux dernières doses ne sont pas documentées, le chien est considéré comme primo-vacciné et la règle des 21 jours s'applique.", es: "Si las dos últimas dosis no están documentadas, el perro se considera recién vacunado (primovacunación) y se aplica la regla de los 21 días.", pt: "Se as duas últimas doses não estiverem documentadas, o cachorro é tratado como recém-vacinado (vacinação primária) e vale a regra dos 21 dias." }
    ref: { en: "SAG — Res. 6.508/2021 (rabies vaccination)", fr: "SAG — Rés. 6.508/2021 (vaccination antirabique)", es: "SAG — Res. 6.508/2021 (vacunación antirrábica)", pt: "SAG — Res. 6.508/2021 (vacinação antirrábica)" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not required (optional alternative)", fr: "Non requis (alternative facultative)", es: "No obligatoria (alternativa opcional)", pt: "Não obrigatório (alternativa opcional)" }
    when: { en: "SAG's published procedure accepts, as an alternative to the rabies-vaccination window, a rabies antibody test carried out between 3 and 24 months before travel.", fr: "La procédure publiée du SAG accepte, comme alternative à la fenêtre de vaccination antirabique, un titrage antirabique réalisé entre 3 et 24 mois avant le voyage.", es: "El procedimiento publicado del SAG acepta, como alternativa a la ventana de vacunación antirrábica, una prueba de titulación de rabia realizada entre 3 y 24 meses antes del viaje.", pt: "O procedimento publicado pelo SAG aceita, como alternativa ao prazo da vacinação antirrábica, um teste sorológico antirrábico (titulação) realizado entre 3 e 24 meses antes da viagem." }
    exceptions: { en: "It is not a mandatory additional test; most travellers rely on a valid rabies vaccination instead.", fr: "Ce n'est pas un test supplémentaire obligatoire ; la plupart des voyageurs s'appuient plutôt sur une vaccination antirabique valide.", es: "No es una prueba adicional obligatoria; la mayoría de los viajeros se apoyan más bien en una vacunación antirrábica válida.", pt: "Não é um exame adicional obrigatório; a maioria dos viajantes recorre a uma vacinação antirrábica válida." }
    ref: { en: "SAG — Autorización sanitaria para ingresar a Chile con perros y gatos", fr: "SAG — Autorización sanitaria para ingresar a Chile con perros y gatos", es: "SAG — Autorización sanitaria para ingresar a Chile con perros y gatos", pt: "SAG — Autorización sanitaria para ingresar a Chile con perros y gatos" }
  - item: { en: "Import Zoosanitary Certificate (CZI/CVI) or EU passport", fr: "Certificat Zoosanitaire d'Importation (CZI/CVI) ou passeport UE", es: "Certificado Zoosanitario de Importación (CZI/CVI) o pasaporte de la UE", pt: "Certificado Zoossanitário de Importação (CZI/CVI) ou passaporte europeu" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Issued by the official veterinary authority of the country of origin/departure, in Spanish and the country's official language, within 10 days before travel to Chile. Valid 10 days, extendable by up to 5 days depending on travel conditions.", fr: "Émis par l'autorité vétérinaire officielle du pays d'origine/départ, en espagnol et dans la langue officielle du pays, dans les 10 jours avant le voyage vers le Chili. Valable 10 jours, prorogeable jusqu'à 5 jours selon les conditions du voyage.", es: "Emitido por la autoridad veterinaria oficial del país de origen/salida, en español y en el idioma oficial del país, dentro de los 10 días previos al viaje a Chile. Válido 10 días, prorrogable hasta 5 días según las condiciones del viaje.", pt: "Emitido pela autoridade veterinária oficial do país de origem/partida, em espanhol e no idioma oficial do país, dentro dos 10 dias anteriores à viagem para o Chile. Válido por 10 dias, prorrogável por até 5 dias conforme as condições da viagem." }
    exceptions: { en: "Dogs from EU member countries may use the EU pet passport instead. The Chile–Argentina certificate can be issued digitally and presented as a QR code at the border.", fr: "Les chiens des pays membres de l'UE peuvent utiliser le passeport UE. Le certificat Chili–Argentine peut être émis numériquement et présenté sous forme de code QR à la frontière.", es: "Los perros de países miembros de la UE pueden usar el pasaporte europeo para mascotas. El certificado Chile–Argentina puede emitirse digitalmente y presentarse como código QR en la frontera.", pt: "Os cachorros vindos de países membros da UE podem usar o passaporte europeu no lugar dele. O certificado Chile–Argentina pode ser emitido digitalmente e apresentado como QR code na fronteira." }
    ref: { en: "SAG — Ingreso de perros, gatos y hurones mascotas", fr: "SAG — Ingreso de perros, gatos y hurones mascotas", es: "SAG — Ingreso de perros, gatos y hurones mascotas", pt: "SAG — Ingreso de perros, gatos y hurones mascotas" }
  - item: { en: "Antiparasitic treatment (internal & external)", fr: "Traitement antiparasitaire (interne & externe)", es: "Tratamiento antiparasitario (interno y externo)", pt: "Tratamento antiparasitário (interno e externo)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "A broad-spectrum internal and external antiparasitic treatment given between 5 and 30 days before entry, with a product approved in the country of origin at the manufacturer's recommended dose. The active ingredient, dose and date must appear on the certificate.", fr: "Un traitement antiparasitaire interne et externe à large spectre administré entre 5 et 30 jours avant l'entrée, avec un produit approuvé dans le pays d'origine à la dose recommandée par le fabricant. Le principe actif, la dose et la date doivent figurer sur le certificat.", es: "Un tratamiento antiparasitario interno y externo de amplio espectro administrado entre 5 y 30 días antes de la entrada, con un producto aprobado en el país de origen a la dosis recomendada por el fabricante. El principio activo, la dosis y la fecha deben figurar en el certificado.", pt: "Um tratamento antiparasitário interno e externo de amplo espectro aplicado entre 5 e 30 dias antes da entrada, com um produto aprovado no país de origem e na dose recomendada pelo fabricante. O princípio ativo, a dose e a data devem constar do certificado." }
    exceptions: { en: "—", fr: "—", es: "—", pt: "—" }
    ref: { en: "SAG — Res. 6.508/2021 (antiparasitic treatment)", fr: "SAG — Rés. 6.508/2021 (traitement antiparasitaire)", es: "SAG — Res. 6.508/2021 (tratamiento antiparasitario)", pt: "SAG — Res. 6.508/2021 (tratamento antiparasitário)" }
  - item: { en: "Advance import permit / notification", fr: "Permis d'importation / notification préalable", es: "Permiso de importación / notificación previa", pt: "Autorização prévia de importação / notificação" }
    required: { en: "Not required for dogs (accompanied pet)", fr: "Non requis pour les chiens (animal accompagné)", es: "No obligatorio para perros (mascota acompañada)", pt: "Não obrigatória para cachorros (animal acompanhado)" }
    when: { en: "For a dog travelling as an accompanied pet, no prior SAG permit is required — checks are done on arrival at the border post.", fr: "Pour un chien voyageant comme animal accompagné, aucun permis SAG préalable n'est requis — les contrôles ont lieu à l'arrivée au poste-frontière.", es: "Para un perro que viaja como mascota acompañada, no se requiere ningún permiso previo del SAG — los controles se realizan a la llegada en el puesto fronterizo.", pt: "Para um cachorro que viaja como animal de companhia acompanhado, não é preciso autorização prévia do SAG — a verificação é feita na chegada ao posto de fronteira." }
    exceptions: { en: "Ferrets require a DIPROREN internment authorisation; a dog shipped as unaccompanied cargo is an importation subject to customs processing.", fr: "Les furets exigent une autorisation d'internement DIPROREN ; un chien expédié en fret non accompagné constitue une internation soumise à formalité douanière.", es: "Los hurones requieren una autorización de internación DIPROREN; un perro enviado como carga no acompañada constituye una importación sujeta a trámite aduanero.", pt: "Os furões precisam de uma autorização de internação DIPROREN; um cachorro despachado como carga desacompanhada configura uma importação sujeita a trâmite aduaneiro." }
    ref: { en: "SAG — Ingreso de perros, gatos y hurones mascotas", fr: "SAG — Ingreso de perros, gatos y hurones mascotas", es: "SAG — Ingreso de perros, gatos y hurones mascotas", pt: "SAG — Ingreso de perros, gatos y hurones mascotas" }
  - item: { en: "Border check (SAG inspection)", fr: "Contrôle frontalier (inspection SAG)", es: "Control fronterizo (inspección del SAG)", pt: "Controle de fronteira (inspeção do SAG)" }
    required: { en: "Required on arrival", fr: "Requis à l'arrivée", es: "Obligatorio a la llegada", pt: "Obrigatória na chegada" }
    when: { en: "At an authorised Chilean border post, SAG verifies that the zoosanitary certificate, the EU passport or (for ferrets) the DIPROREN resolution meets the national sanitary requirements.", fr: "À un poste-frontière chilien habilité, le SAG vérifie que le certificat zoosanitaire, le passeport UE ou (pour les furets) la résolution DIPROREN respecte les exigences sanitaires nationales.", es: "En un puesto fronterizo chileno habilitado, el SAG verifica que el certificado zoosanitario, el pasaporte de la UE o (para los hurones) la resolución DIPROREN cumple los requisitos sanitarios nacionales.", pt: "Em um posto de fronteira chileno autorizado, o SAG verifica se o certificado zoossanitário, o passaporte europeu ou (no caso dos furões) a resolução DIPROREN atende às exigências sanitárias nacionais." }
    exceptions: { en: "If the documents are not presented or requirements are not met, SAG may apply whatever sanitary measures it considers appropriate.", fr: "Si les documents ne sont pas présentés ou que les exigences ne sont pas remplies, le SAG peut appliquer les mesures sanitaires qu'il juge appropriées.", es: "Si no se presentan los documentos o no se cumplen los requisitos, el SAG puede aplicar las medidas sanitarias que considere apropiadas.", pt: "Se os documentos não forem apresentados ou as exigências não forem cumpridas, o SAG pode aplicar as medidas sanitárias que considerar adequadas." }
    ref: { en: "SAG — Ingreso de perros, gatos y hurones mascotas", fr: "SAG — Ingreso de perros, gatos y hurones mascotas", es: "SAG — Ingreso de perros, gatos y hurones mascotas", pt: "SAG — Ingreso de perros, gatos y hurones mascotas" }
  - item: { en: "Post-arrival home confinement", fr: "Confinement à domicile à l'arrivée", es: "Confinamiento domiciliario tras la llegada", pt: "Confinamento domiciliar após a chegada" }
    required: { en: "Required (10 days)", fr: "Requis (10 jours)", es: "Obligatorio (10 días)", pt: "Obrigatório (10 dias)" }
    when: { en: "Once in Chile, the dog must remain confined at its destination address for a period of 10 days.", fr: "Une fois au Chili, le chien doit rester confiné à son adresse de destination pendant une période de 10 jours.", es: "Una vez en Chile, el perro debe permanecer confinado en su dirección de destino durante un periodo de 10 días.", pt: "Uma vez no Chile, o cachorro deve permanecer confinado no endereço de destino por um período de 10 dias." }
    exceptions: { en: "This is a home confinement, not a kennel quarantine; the destination address is listed on the certificate.", fr: "Il s'agit d'un confinement à domicile, non d'une quarantaine en chenil ; l'adresse de destination est indiquée sur le certificat.", es: "Se trata de un confinamiento domiciliario, no de una cuarentena en perrera; la dirección de destino figura en el certificado.", pt: "Trata-se de um confinamento domiciliar, não de uma quarentena em canil; o endereço de destino consta do certificado." }
    ref: { en: "SAG — Autorización sanitaria para ingresar a Chile con perros y gatos", fr: "SAG — Autorización sanitaria para ingresar a Chile con perros y gatos", es: "SAG — Autorización sanitaria para ingresar a Chile con perros y gatos", pt: "SAG — Autorización sanitaria para ingresar a Chile con perros y gatos" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "No specific SAG minimum", fr: "Aucun minimum SAG spécifique", es: "Sin mínimo específico del SAG", pt: "Sem mínimo específico do SAG" }
    when: { en: "SAG sets no explicit minimum age: rabies vaccination is required regardless of age, with the primary dose at least 21 days before entry.", fr: "Le SAG ne fixe pas d'âge minimum explicite : la vaccination antirabique est requise quel que soit l'âge, avec la primo-dose au moins 21 jours avant l'entrée.", es: "El SAG no fija una edad mínima explícita: la vacunación antirrábica es obligatoria sea cual sea la edad, con la dosis primaria al menos 21 días antes de la entrada.", pt: "O SAG não define uma idade mínima explícita: a vacinação antirrábica é obrigatória independentemente da idade, com a dose primária pelo menos 21 dias antes da entrada." }
    exceptions: { en: "Airline age rules and your home country's return rules may be stricter.", fr: "Les règles d'âge des compagnies et les règles de retour de ton pays peuvent être plus strictes.", es: "Las normas de edad de las aerolíneas y las normas de regreso de tu país pueden ser más estrictas.", pt: "As regras de idade da companhia aérea e as regras de retorno do seu país podem ser mais rígidas." }
    ref: { en: "SAG — Res. 6.508/2021", fr: "SAG — Rés. 6.508/2021", es: "SAG — Res. 6.508/2021", pt: "SAG — Res. 6.508/2021" }
  - item: { en: "Kennel quarantine", fr: "Quarantaine en chenil", es: "Cuarentena en perrera", pt: "Quarentena em canil" }
    required: { en: "Not required", fr: "Non requise", es: "No obligatoria", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "There is no compulsory kennel quarantine — only the 10-day home confinement above, unless requirements are unmet and SAG imposes sanitary measures.", fr: "Il n'y a pas de quarantaine obligatoire en chenil — seulement le confinement à domicile de 10 jours ci-dessus, sauf si les exigences ne sont pas remplies et que le SAG impose des mesures sanitaires.", es: "No hay cuarentena obligatoria en perrera — solo el confinamiento domiciliario de 10 días indicado arriba, salvo que no se cumplan los requisitos y el SAG imponga medidas sanitarias.", pt: "Não há quarentena obrigatória em canil — apenas o confinamento domiciliar de 10 dias descrito acima, a menos que as exigências não sejam cumpridas e o SAG imponha medidas sanitárias." }
    ref: { en: "SAG — Res. 6.508/2021", fr: "SAG — Rés. 6.508/2021", es: "SAG — Res. 6.508/2021", pt: "SAG — Res. 6.508/2021" }

origin:
  scheme: eu
  eu:
    title: { en: "From the European Union — EU pet passport", fr: "Depuis l'Union européenne — passeport UE", es: "Desde la Unión Europea — pasaporte europeo para mascotas", pt: "Da União Europeia — passaporte europeu para animais de companhia" }
    body:
      en: "Dogs coming from EU member countries may travel on the EU pet passport instead of an Import Zoosanitary Certificate. The underlying requirements are the same: a clinical examination within 10 days before entry, permanent identification (microchip or tattoo), a valid rabies vaccination (primary dose at least 21 days before entry) and internal & external antiparasitic treatment 5–30 days before entry. On arrival the dog stays confined at its destination address for 10 days."
      fr: "Les chiens venant de pays membres de l'UE peuvent voyager avec le passeport UE au lieu d'un Certificat Zoosanitaire d'Importation. Les exigences de fond sont identiques : examen clinique dans les 10 jours avant l'entrée, identification permanente (puce ou tatouage), vaccination antirabique valide (primo-dose au moins 21 jours avant l'entrée) et traitement antiparasitaire interne & externe 5 à 30 jours avant l'entrée. À l'arrivée, le chien reste confiné à son adresse de destination pendant 10 jours."
      es: "Los perros que llegan de países miembros de la UE pueden viajar con el pasaporte europeo para mascotas en lugar de un Certificado Zoosanitario de Importación. Los requisitos de fondo son los mismos: un examen clínico dentro de los 10 días previos a la entrada, una identificación permanente (microchip o tatuaje), una vacunación antirrábica válida (dosis primaria al menos 21 días antes de la entrada) y un tratamiento antiparasitario interno y externo 5–30 días antes de la entrada. A la llegada, el perro permanece confinado en su dirección de destino durante 10 días."
      pt: "Os cachorros vindos de países membros da UE podem viajar com o passaporte europeu para animais de companhia em vez do Certificado Zoossanitário de Importação. As exigências de fundo são as mesmas: exame clínico dentro dos 10 dias anteriores à entrada, identificação permanente (microchip ou tatuagem), vacinação antirrábica válida (dose primária pelo menos 21 dias antes da entrada) e tratamento antiparasitário interno e externo 5–30 dias antes da entrada. Na chegada, o cachorro fica confinado no endereço de destino por 10 dias."
    cls: ok
  listed:
    title: { en: "From any other country — Import Zoosanitary Certificate", fr: "Depuis tout autre pays — Certificat Zoosanitaire d'Importation", es: "Desde cualquier otro país — Certificado Zoosanitario de Importación", pt: "De qualquer outro país — Certificado Zoossanitário de Importação" }
    body:
      en: "From all non-EU origins the path is the same. Your dog needs an Import Zoosanitary Certificate (CZI), presented as an International Veterinary Certificate (CVI), issued by the official veterinary authority of the country you travel from, in Spanish and the country's official language, within 10 days before entry. It certifies the clinical exam, identification, rabies vaccination and antiparasitic treatment. The certificate is valid 10 days (extendable by up to 5). With Argentina it can be issued digitally and shown as a QR code."
      fr: "Depuis toutes les origines hors UE, le parcours est identique. Ton chien a besoin d'un Certificat Zoosanitaire d'Importation (CZI), présenté comme Certificat Vétérinaire International (CVI), émis par l'autorité vétérinaire officielle du pays de départ, en espagnol et dans la langue officielle du pays, dans les 10 jours avant l'entrée. Il atteste l'examen clinique, l'identification, la vaccination antirabique et le traitement antiparasitaire. Le certificat est valable 10 jours (prorogeable de 5). Avec l'Argentine, il peut être émis numériquement et présenté sous forme de code QR."
      es: "Desde todos los orígenes fuera de la UE el camino es el mismo. Tu perro necesita un Certificado Zoosanitario de Importación (CZI), presentado como Certificado Veterinario Internacional (CVI), emitido por la autoridad veterinaria oficial del país desde el que viajas, en español y en el idioma oficial del país, dentro de los 10 días previos a la entrada. Certifica el examen clínico, la identificación, la vacunación antirrábica y el tratamiento antiparasitario. El certificado es válido 10 días (prorrogable hasta 5). Con Argentina puede emitirse digitalmente y mostrarse como código QR."
      pt: "Para todas as origens fora da UE, o caminho é o mesmo. O seu cachorro precisa de um Certificado Zoossanitário de Importação (CZI), apresentado como Certificado Veterinário Internacional (CVI), emitido pela autoridade veterinária oficial do país de onde você viaja, em espanhol e no idioma oficial do país, dentro dos 10 dias anteriores à entrada. Ele atesta o exame clínico, a identificação, a vacinação antirrábica e o tratamento antiparasitário. O certificado é válido por 10 dias (prorrogável por até 5). Com a Argentina, ele pode ser emitido digitalmente e apresentado como QR code."
    cls: warn
  nonListed:
    title: { en: "Chilean residents returning & non-compliant arrivals", fr: "Résidents chiliens de retour & arrivées non conformes", es: "Residentes chilenos que regresan y llegadas no conformes", pt: "Residentes no Chile que voltam e chegadas fora das regras" }
    body:
      en: "A dog resident in Chile that travelled abroad for under 21 days (under 60 days from Argentina) may re-enter on a copy of the SAG export certificate (CZE) plus proof of a valid rabies vaccination, rather than a full foreign certificate. If a dog arrives without meeting the requirements, SAG may apply the sanitary measures it deems appropriate to protect the country's animal-health status; the resulting costs fall on the owner."
      fr: "Un chien résidant au Chili qui a voyagé à l'étranger moins de 21 jours (moins de 60 jours depuis l'Argentine) peut rentrer avec une copie du certificat d'exportation du SAG (CZE) et la preuve d'une vaccination antirabique valide, plutôt qu'un certificat étranger complet. Si un chien arrive sans remplir les exigences, le SAG peut appliquer les mesures sanitaires qu'il juge appropriées pour protéger le statut zoosanitaire du pays ; les frais qui en résultent sont à la charge du propriétaire."
      es: "Un perro residente en Chile que ha viajado al extranjero menos de 21 días (menos de 60 días desde Argentina) puede reingresar con una copia del certificado de exportación del SAG (CZE) y la prueba de una vacunación antirrábica válida, en lugar de un certificado extranjero completo. Si un perro llega sin cumplir los requisitos, el SAG puede aplicar las medidas sanitarias que considere apropiadas para proteger el estatus zoosanitario del país; los costes resultantes corren a cargo del propietario."
      pt: "Um cachorro residente no Chile que ficou menos de 21 dias no exterior (menos de 60 dias no caso da Argentina) pode reentrar com uma cópia do certificado de exportação do SAG (CZE) e o comprovante de vacinação antirrábica válida, em vez de um certificado estrangeiro completo. Se um cachorro chegar sem cumprir as exigências, o SAG pode aplicar as medidas sanitárias que julgar adequadas para proteger o status sanitário animal do país; os custos daí decorrentes ficam por conta do tutor."
    cls: warn

arrival:
  intro:
    en: "What happens when your dog reaches Chile depends on how it travels and its documents."
    fr: "Ce qui se passe à l'arrivée de ton chien au Chili dépend de son mode de voyage et de ses documents."
    es: "Lo que ocurre cuando tu perro llega a Chile depende de cómo viaje y de sus documentos."
    pt: "O que acontece quando o seu cachorro chega ao Chile depende de como ele viaja e dos seus documentos."
  points:
    - en: "At an authorised Chilean border post, SAG staff carry out a documentary and physical check of the zoosanitary certificate (or EU passport) and the dog's identification."
      fr: "À un poste-frontière chilien habilité, le personnel du SAG effectue un contrôle documentaire et physique du certificat zoosanitaire (ou passeport UE) et de l'identification du chien."
      es: "En un puesto fronterizo chileno habilitado, el personal del SAG realiza un control documental y físico del certificado zoosanitario (o pasaporte de la UE) y de la identificación del perro."
      pt: "Em um posto de fronteira chileno autorizado, os agentes do SAG fazem uma verificação documental e física do certificado zoossanitário (ou do passaporte europeu) e da identificação do cachorro."
    - en: "As an accompanied pet, no prior SAG import permit is needed; if the dog is shipped as unaccompanied cargo, the arrival is an importation subject to customs processing."
      fr: "En animal accompagné, aucun permis d'importation SAG préalable n'est nécessaire ; si le chien est expédié en fret non accompagné, l'arrivée constitue une internation soumise à formalité douanière."
      es: "Como mascota acompañada, no se necesita ningún permiso de importación previo del SAG; si el perro se envía como carga no acompañada, la llegada constituye una importación sujeta a trámite aduanero."
      pt: "Como animal de companhia acompanhado, não é preciso autorização prévia de importação do SAG; se o cachorro for despachado como carga desacompanhada, a chegada configura uma importação sujeita a trâmite aduaneiro."
    - en: "The certificate must be issued within 10 days before entry and is valid 10 days, extendable by up to 5 days depending on travel conditions."
      fr: "Le certificat doit être émis dans les 10 jours avant l'entrée et est valable 10 jours, prorogeable jusqu'à 5 jours selon les conditions du voyage."
      es: "El certificado debe emitirse dentro de los 10 días previos a la entrada y es válido 10 días, prorrogable hasta 5 días según las condiciones del viaje."
      pt: "O certificado deve ser emitido dentro dos 10 dias anteriores à entrada e é válido por 10 dias, prorrogável por até 5 dias conforme as condições da viagem."
    - en: "Once in Chile, the dog must remain confined at its destination address for 10 days; after entry, health rules set by the Ministry of Health also apply."
      fr: "Une fois au Chili, le chien doit rester confiné à son adresse de destination pendant 10 jours ; après l'entrée, les règles sanitaires du ministère de la Santé s'appliquent aussi."
      es: "Una vez en Chile, el perro debe permanecer confinado en su dirección de destino durante 10 días; tras la entrada, también se aplican las normas sanitarias fijadas por el Ministerio de Salud."
      pt: "Uma vez no Chile, o cachorro deve permanecer confinado no endereço de destino por 10 dias; após a entrada, também valem as regras sanitárias definidas pelo Ministério da Saúde."
    - en: "If documents are missing or requirements are not met, SAG may apply whatever sanitary measures it considers appropriate, at the owner's expense."
      fr: "Si les documents manquent ou que les exigences ne sont pas remplies, le SAG peut appliquer les mesures sanitaires qu'il juge appropriées, aux frais du propriétaire."
      es: "Si faltan documentos o no se cumplen los requisitos, el SAG puede aplicar las medidas sanitarias que considere apropiadas, a cargo del propietario."
      pt: "Se faltarem documentos ou as exigências não forem cumpridas, o SAG pode aplicar as medidas sanitárias que considerar adequadas, às custas do tutor."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Chile has no breed-specific import ban. No dog breed is refused entry on the basis of its breed, provided the SAG sanitary requirements are met. Chile does, however, regulate 'potentially dangerous' dogs for ownership under Law 21.020 (Responsible Pet Ownership, the 'Ley Cholito')."
    fr: "Le Chili n'a aucune interdiction d'importation liée à la race. Aucune race n'est refusée à l'entrée en raison de sa race, sous réserve du respect des exigences sanitaires du SAG. Le Chili réglemente toutefois les chiens « potentiellement dangereux » pour la détention au titre de la loi 21.020 (Tenencia Responsable de Mascotas, la « Ley Cholito »)."
    es: "Chile no tiene ninguna prohibición de importación por raza. No se rechaza la entrada a ninguna raza de perro por su raza, siempre que se cumplan los requisitos sanitarios del SAG. No obstante, Chile sí regula los perros «potencialmente peligrosos» para la tenencia en virtud de la Ley 21.020 (Tenencia Responsable de Mascotas, la «Ley Cholito»)."
    pt: "O Chile não tem proibição de importação por raça. Nenhuma raça de cachorro tem a entrada recusada por causa da raça, desde que as exigências sanitárias do SAG sejam cumpridas. O Chile, porém, regula a posse de cachorros 'potencialmente perigosos' pela Lei 21.020 (posse responsável de animais, a 'Ley Cholito')."
  cat1:
    en: "No banned category at entry: no breed is prohibited from entering Chile. Any healthy dog meeting the SAG requirements (certificate, identification, rabies vaccination, antiparasitic treatment) may be imported, regardless of breed. Note: hybrids crossing a domestic dog or cat with a wild species are prohibited from entry."
    fr: "Aucune catégorie interdite à l'entrée : aucune race n'est interdite d'entrée au Chili. Tout chien sain répondant aux exigences du SAG (certificat, identification, vaccination antirabique, traitement antiparasitaire) peut être importé, quelle que soit sa race. À noter : les hybrides issus du croisement d'un chien ou chat domestique avec une espèce sauvage sont interdits d'entrée."
    es: "Sin categoría prohibida a la entrada: ninguna raza tiene prohibida la entrada a Chile. Cualquier perro sano que cumpla los requisitos del SAG (certificado, identificación, vacunación antirrábica, tratamiento antiparasitario) puede importarse, sea cual sea su raza. Nota: los híbridos resultantes del cruce de un perro o gato doméstico con una especie salvaje tienen prohibida la entrada."
    pt: "Nenhuma categoria proibida na entrada: nenhuma raça está proibida de entrar no Chile. Qualquer cachorro saudável que cumpra as exigências do SAG (certificado, identificação, vacinação antirrábica, tratamento antiparasitário) pode ser importado, independentemente da raça. Atenção: os híbridos que cruzam um cachorro ou gato doméstico com uma espécie selvagem têm a entrada proibida."
  cat2:
    en: "Ownership rules for 'potentially dangerous' dogs: under Law 21.020 and its regulation, breeds such as Pit Bull, Dogo Argentino, Fila Brasileiro, Presa Canario, Presa Mallorquín, Rottweiler, Doberman, Bullmastiff and Tosa Inu (and their crosses) are classed as potentially dangerous. Owners must be over 18, register the dog, and use a muzzle, harness and leash in public. These are ownership obligations, not entry bans."
    fr: "Règles de détention des chiens « potentiellement dangereux » : au titre de la loi 21.020 et de son règlement, des races comme le Pit Bull, le Dogo Argentino, le Fila Brasileiro, le Presa Canario, le Presa Mallorquín, le Rottweiler, le Doberman, le Bullmastiff et le Tosa Inu (et leurs croisements) sont classées potentiellement dangereuses. Les propriétaires doivent avoir plus de 18 ans, enregistrer le chien et utiliser muselière, harnais et laisse en public. Ce sont des obligations de détention, pas des interdictions d'entrée."
    es: "Normas de tenencia de perros «potencialmente peligrosos»: en virtud de la Ley 21.020 y su reglamento, razas como Pit Bull, Dogo Argentino, Fila Brasileiro, Presa Canario, Presa Mallorquín, Rottweiler, Doberman, Bullmastiff y Tosa Inu (y sus cruces) se clasifican como potencialmente peligrosas. Los propietarios deben ser mayores de 18 años, registrar al perro y usar bozal, arnés y correa en público. Son obligaciones de tenencia, no prohibiciones de entrada."
    pt: "Regras de posse para cachorros 'potencialmente perigosos': pela Lei 21.020 e seu regulamento, raças como Pit Bull, Dogo Argentino, Fila Brasileiro, Presa Canario, Presa Mallorquín, Rottweiler, Doberman, Bullmastiff e Tosa Inu (e seus cruzamentos) são classificadas como potencialmente perigosas. Os tutores devem ter mais de 18 anos, registrar o cachorro e usar focinheira, peitoral e guia em espaços públicos. São obrigações de posse, não proibições de entrada."
  note:
    en: "Because there is no national breed ban at the border, focus on the SAG sanitary rules for entry. If you will live in Chile, check the Law 21.020 obligations for potentially dangerous breeds (registration on registratumascota.cl, muzzle, leash)."
    fr: "Comme il n'y a pas d'interdiction nationale de race à la frontière, concentre-toi sur les règles sanitaires du SAG pour l'entrée. Si tu vivez au Chili, vérifie les obligations de la loi 21.020 pour les races potentiellement dangereuses (enregistrement sur registratumascota.cl, muselière, laisse)."
    es: "Como no hay una prohibición nacional de razas en la frontera, céntrate en las normas sanitarias del SAG para la entrada. Si vas a vivir en Chile, consulta las obligaciones de la Ley 21.020 para las razas potencialmente peligrosas (registro en registratumascota.cl, bozal, correa)."
    pt: "Como não existe proibição nacional de raças na fronteira, concentre-se nas regras sanitárias do SAG para a entrada. Se você for morar no Chile, confira as obrigações da Lei 21.020 para as raças potencialmente perigosas (registro em registratumascota.cl, focinheira, guia)."

checklist:
  - en: "Import Zoosanitary Certificate (CZI/CVI) in Spanish, endorsed by the origin's official veterinary authority — or an EU pet passport for EU-origin dogs"
    fr: "Certificat Zoosanitaire d'Importation (CZI/CVI) en espagnol, visé par l'autorité vétérinaire officielle d'origine — ou un passeport UE pour les chiens d'origine UE"
    es: "Certificado Zoosanitario de Importación (CZI/CVI) en español, refrendado por la autoridad veterinaria oficial del origen — o un pasaporte europeo para mascotas para los perros de origen UE"
    pt: "Certificado Zoossanitário de Importação (CZI/CVI) em espanhol, avalizado pela autoridade veterinária oficial de origem — ou um passaporte europeu para animais de companhia se o cachorro vier da UE"
  - en: "Clinical examination by a vet within 10 days before entry (no signs of infectious or parasitic disease)"
    fr: "Examen clinique par un vétérinaire dans les 10 jours avant l'entrée (aucun signe de maladie infectieuse ou parasitaire)"
    es: "Examen clínico por un veterinario dentro de los 10 días previos a la entrada (sin signos de enfermedad infecciosa ni parasitaria)"
    pt: "Exame clínico por um veterinário dentro dos 10 dias anteriores à entrada (sem sinais de doença infecciosa ou parasitária)"
  - en: "Permanent identification: ISO 11784/11785 microchip (or tattoo) matching the certificate"
    fr: "Identification permanente : puce ISO 11784/11785 (ou tatouage) correspondant au certificat"
    es: "Identificación permanente: microchip ISO 11784/11785 (o tatuaje) que coincida con el certificado"
    pt: "Identificação permanente: microchip ISO 11784/11785 (ou tatuagem) coincidindo com o certificado"
  - en: "Valid rabies vaccination — primary dose at least 21 days before entry"
    fr: "Vaccination antirabique valide — primo-dose au moins 21 jours avant l'entrée"
    es: "Vacunación antirrábica válida — dosis primaria al menos 21 días antes de la entrada"
    pt: "Vacinação antirrábica válida — dose primária pelo menos 21 dias antes da entrada"
  - en: "Internal & external antiparasitic treatment 5–30 days before entry, with active ingredient, dose and date noted"
    fr: "Traitement antiparasitaire interne & externe 5 à 30 jours avant l'entrée, avec principe actif, dose et date indiqués"
    es: "Tratamiento antiparasitario interno y externo 5–30 días antes de la entrada, con el principio activo, la dosis y la fecha indicados"
    pt: "Tratamento antiparasitário interno e externo 5–30 dias antes da entrada, com princípio ativo, dose e data indicados"
  - en: "Check the certificate is used within its 10-day validity (extendable up to 5 days)"
    fr: "Vérifie que le certificat est utilisé dans sa validité de 10 jours (prorogeable jusqu'à 5 jours)"
    es: "Comprueba que el certificado se use dentro de su valide de 10 días (prorrogable hasta 5 días)"
    pt: "Verifique se o certificado é usado dentro da sua validade de 10 dias (prorrogável por até 5 dias)"
  - en: "Plan to keep the dog confined at its destination address for 10 days after arrival"
    fr: "Prévois de garder le chien confiné à son adresse de destination pendant 10 jours après l'arrivée"
    es: "Prevé mantener al perro confinado en su dirección de destino durante 10 días tras la llegada"
    pt: "Planeje manter o cachorro confinado no endereço de destino por 10 dias após a chegada"
  - en: "Airline reservation confirming your dog's travel option and a suitable travel crate if in the hold"
    fr: "Réservation confirmant l'option de transport de ton chien et une caisse de transport adaptée si en soute"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y una jaula de transporte adecuada si viaja en bodega"
    pt: "Reserva da companhia aérea confirmando a opção de viagem do seu cachorro e uma caixa de transporte adequada se ele for no porão"

