# Country Entry Guide — Russia (trilingual EN/FR/ES).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_ru
iso2: "RU"
name: { en: "Russia", fr: "Russie", es: "Rusia", pt: "Rússia" }
region: { en: "Europe (non-EU)", fr: "Europe (hors UE)", es: "Europa (fuera de la UE)", pt: "Europa (fora da UE)" }


regime: non_listed
exit:
  authority: Rosselkhoznadzor
  authorityUrl: https://fsvps.gov.ru
  intro:
    en: "Russia is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by Rosselkhoznadzor (FSVPS)."
    fr: "La Russie est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par le Rosselkhoznadzor (FSVPS)."
    es: "Rusia no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el Rosselkhoznadzor (FSVPS)."
    pt: "A Rússia é um país não listado: um teste sorológico antirrábico válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pelo Rosselkhoznadzor (FSVPS)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "The state veterinary service issues domestic certificate Form 1; at the border, Rosselkhoznadzor exchanges it free of charge for the international certificate Form 5a (valid 5 days; rabies vaccination required >21 days and <12 months before travel)."
        fr: "Le service vétérinaire d'État délivre le certificat national (formulaire 1) ; à la frontière, le Rosselkhoznadzor l'échange gratuitement contre le certificat international (formulaire 5a, valable 5 jours ; vaccination antirabique exigée entre 21 jours et 12 mois avant le voyage)."
        es: "El servicio veterinario estatal emite el certificado nacional (Formulario 1); en la frontera, Rosselkhoznadzor lo cambia gratis por el certificado internacional (Formulario 5a, válido 5 días; vacuna antirrábica exigida entre 21 días y 12 meses antes del viaje)."
        pt: "O serviço veterinário estatal emite o certificado nacional Formulário 1; na fronteira, o Rosselkhoznadzor o troca gratuitamente pelo certificado internacional Formulário 5a (válido por 5 dias; vacinação antirrábica aplicada há mais de 21 dias e menos de 12 meses antes da viagem)."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Russia with your dog", fr: "Voyager en Russie avec ton chien", es: "Viajar a Rusia con tu perro", pt: "Viajar para a Rússia com seu cachorro" }
  intro:
    en: >-
      Russia is not part of the EU: it applies its own rules through the Eurasian Economic Union
      (EAEU) and the Federal Service for Veterinary and Phytosanitary Surveillance (Rosselkhoznadzor).
      A dog travelling for personal use — up to two animals per owner — can enter without an import
      permit and without quarantine, provided it carries an international veterinary passport with a
      valid rabies vaccination and the other required shots, plus a clinical examination noted within
      14 days before departure. What you prepare still depends on your dog's country of departure and
      whether you travel with more than two animals. This guide explains the standard path and the
      cases where a Rosselkhoznadzor permit is needed, so you know what to organise before you fly.
    fr: >-
      La Russie ne fait pas partie de l'UE : elle applique ses propres règles via l'Union économique
      eurasiatique (UEEA) et le Service fédéral de surveillance vétérinaire et phytosanitaire
      (Rosselkhoznadzor). Un chien voyageant à titre personnel — jusqu'à deux animaux par propriétaire —
      peut entrer sans permis d'importation et sans quarantaine, à condition d'avoir un passeport
      vétérinaire international avec une vaccination antirabique valide et les autres vaccins exigés,
      ainsi qu'un examen clinique noté dans les 14 jours précédant le départ. Ce qu'il faut préparer
      dépend aussi du pays de départ et du nombre d'animaux. Ce guide détaille le parcours standard et
      les cas nécessitant une autorisation de Rosselkhoznadzor, pour savoir quoi organiser avant de partir.
    es: >-
      Rusia no forma parte de la UE: aplica sus propias normas a través de la Unión Económica Euroasiática
      (UEEA) y del Servicio Federal de Vigilancia Veterinaria y Fitosanitaria (Rosselkhoznadzor). Un perro
      que viaja a título personal — hasta dos animales por propietario — puede entrar sin permiso de
      importación y sin cuarentena, siempre que lleve un pasaporte veterinario internacional con una
      vacunación antirrábica válida y las demás vacunas exigidas, más un examen clínico anotado dentro de
      los 14 días previos a la salida. Lo que debes preparar depende también del país de salida de tu
      perro y de si viajas con más de dos animales. Esta guía explica el recorrido estándar y los casos en
      los que se necesita una autorización de Rosselkhoznadzor, para que sepas qué organizar antes de volar.

    pt: "A Rússia não faz parte da UE: ela aplica as próprias regras por meio da União Econômica Eurasiática (UEE) e do Serviço Federal de Vigilância Veterinária e Fitossanitária (Rosselkhoznadzor). Um cachorro que viaja para uso pessoal — até dois animais por dono — pode entrar sem autorização de importação e sem quarentena, desde que leve um passaporte veterinário internacional com vacinação antirrábica válida e as demais vacinas exigidas, além de um exame clínico registrado nos 14 dias anteriores à partida. O que você precisa preparar ainda depende do país de partida do seu cachorro e de você viajar ou não com mais de dois animais. Este guia explica o caminho padrão e os casos em que é preciso uma autorização do Rosselkhoznadzor, para você saber o que organizar antes de voar."
difficulty:
  level: moderate
  label: { en: "Moderate (vaccinations + veterinary passport)", fr: "Modéré (vaccins + passeport vétérinaire)", es: "Moderado (vacunas + pasaporte veterinario)", pt: "Moderado (vacinas + passaporte veterinário)" }

prepTime:
  eu:
    en: "From another EAEU country (Belarus, Kazakhstan, Armenia, Kyrgyzstan): a few days if the international passport and vaccinations are up to date."
    fr: "Depuis un autre pays de l'UEEA (Biélorussie, Kazakhstan, Arménie, Kirghizistan) : quelques jours si le passeport international et les vaccins sont à jour."
    es: "Desde otro país de la UEEA (Bielorrusia, Kazajistán, Armenia, Kirguistán): unos días si el pasaporte internacional y las vacunas están al día."
    pt: "De outro país da UEE (Belarus, Cazaquistão, Armênia, Quirguistão): alguns dias, se o passaporte internacional e as vacinas estiverem em dia."
  listed:
    en: "From any other country, up to 2 pets: about 3 weeks if the primary rabies shot is still needed (given at least 20 days before departure) plus the 14-day clinical exam."
    fr: "Depuis tout autre pays, jusqu'à 2 animaux : environ 3 semaines si la primo-vaccination antirabique reste à faire (au moins 20 jours avant le départ) plus l'examen clinique des 14 jours."
    es: "Desde cualquier otro país, hasta 2 mascotas: unas 3 semanas si aún falta la primovacunación antirrábica (administrada al menos 20 días antes de la salida) más el examen clínico de los 14 días."
    pt: "De qualquer outro país, até 2 animais: cerca de 3 semanas se ainda faltar a primovacinação antirrábica (aplicada no mínimo 20 dias antes da partida), mais o exame clínico dos 14 dias."
  nonListed:
    en: "More than 2 animals, unaccompanied or commercial import: several weeks — an annual Rosselkhoznadzor import permit (form No.1) must be obtained in advance."
    fr: "Plus de 2 animaux, sans accompagnateur ou import commercial : plusieurs semaines — un permis annuel d'importation Rosselkhoznadzor (formulaire n°1) doit être obtenu à l'avance."
    es: "Más de 2 animales, sin acompañante o importación comercial: varias semanas — hay que obtener con antelación un permiso anual de importación de Rosselkhoznadzor (formulario n.º 1)."
    pt: "Mais de 2 animais, viagem desacompanhada ou importação comercial: várias semanas — é preciso obter com antecedência uma autorização anual de importação do Rosselkhoznadzor (formulário nº 1)."

