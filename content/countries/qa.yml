    when: { en: "Animals are examined on arrival against the permit, microchip and health certificate at the point of entry.", fr: "Les animaux sont examinés à l'arrivée au regard du permis, de la puce et du certificat sanitaire au point d'entrée.", es: "Los animales se examinan a la llegada cotejando el permiso, el microchip y el certificado sanitario en el punto de entrada.", pt: "Os animais são examinados na chegada, no ponto de entrada, em confronto com a autorização, o microchip e o atestado de saúde." }
    exceptions: { en: "None.", fr: "Aucune.", es: "Ninguna.", pt: "Nenhuma." }
