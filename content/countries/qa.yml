# Country Entry Guide — Qatar (trilingual EN/FR/ES).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_qa
iso2: "QA"
name: { en: "Qatar", fr: "Qatar", es: "Catar", pt: "Catar" }
region: { en: "Middle East", fr: "Moyen-Orient", es: "Oriente Medio", pt: "Oriente Médio" }


regime: non_listed
exit:
  authority: Department of Animal Resources
  authorityUrl: https://portal.www.gov.qa
  intro:
    en: "Qatar is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export veterinary health certificate from the Department of Animal Resources."
    fr: "Le Qatar est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire vétérinaire d'export du Département des ressources animales."
    es: "Catar no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario veterinario de exportación del Departamento de Recursos Animales."
    pt: "O Catar não é um país listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um certificado veterinário de exportação emitido pelo Department of Animal Resources (departamento de recursos animais)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "Request the export veterinary health certificate via the Hukoomi e-government service with the travel health certificate, microchip and rabies records; the exit certificate is valid 15 days from issue."
        fr: "Demande le certificat sanitaire vétérinaire d'export via le service e-gouvernement Hukoomi avec le certificat de voyage, la puce et le carnet antirabique ; le certificat de sortie est valable 15 jours."
        es: "Solicita el certificado sanitario veterinario de exportación a través del servicio de gobierno electrónico Hukoomi con el certificado de viaje, el microchip y el registro antirrábico; el certificado de salida es válido 15 días."
        pt: "Solicite o certificado veterinário de exportação pelo serviço de governo eletrônico Hukoomi, apresentando o atestado de saúde de viagem, o microchip e o histórico de vacinação antirrábica; o certificado de saída vale 15 dias a partir da emissão."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Qatar with your dog", fr: "Voyager au Qatar avec ton chien", es: "Viajar a Catar con tu perro", pt: "Viajar para o Catar com seu cachorro" }
  intro:
    en: >-
      Qatar allows pet dogs, but entry runs through the country's own scheme, not the EU framework.
      Every dog needs an import permit obtained in advance from the Animal Resources Department of the
      Ministry of Municipality before it travels. On top of the permit, your dog must have an ISO
      microchip, a valid rabies vaccination, other core vaccinations and a government veterinary health
      certificate. Dogs coming from countries Qatar treats as higher-risk for rabies must also pass a
      rabies antibody test before travel. Personal import is limited to one pet per year, and permits are
      normally issued to residents. Certain dangerous breeds are banned. The exact path depends mainly on
      the country your dog is travelling from. This guide explains the permit, the tests, the age limits,
      the yearly quota and the banned breeds so you know what to prepare before you book.
    fr: >-
      Le Qatar admet les chiens, mais l'entrée passe par le dispositif propre au pays, pas par le cadre de
      l'UE. Chaque chien doit disposer d'un permis d'importation obtenu à l'avance auprès du Département des
      ressources animales du ministère de la Municipalité avant de voyager. Outre le permis, ton chien
      doit avoir une puce ISO, une vaccination antirabique valide, les autres vaccinations essentielles et
      un certificat vétérinaire officiel. Les chiens venant de pays que le Qatar considère à risque rabique
      plus élevé doivent aussi réussir un titrage des anticorps antirabiques avant le voyage. L'importation
      personnelle est limitée à un animal par an, et les permis sont normalement délivrés aux résidents.
      Certaines races dangereuses sont interdites. Le parcours exact dépend surtout du pays de départ. Ce
      guide détaille le permis, les tests, les âges minimums, le quota annuel et les races interdites pour
      savoir quoi préparer avant de réserver.
    es: >-
      Catar admite a los perros, pero la entrada se rige por el sistema propio del país, no por el marco de
      la UE. Cada perro necesita un permiso de importación obtenido con antelación ante el Departamento de
      Recursos Animales del Ministerio de Municipalidad antes de viajar. Además del permiso, tu perro debe
      tener un microchip ISO, una vacunación antirrábica válida, las demás vacunas básicas y un certificado
      sanitario veterinario oficial. Los perros procedentes de países que Catar considera de mayor riesgo
      de rabia también deben superar una prueba de titulación de rabia antes de viajar. La importación
      personal se limita a una mascota al año, y los permisos se expiden normalmente a residentes. Algunas
      razas peligrosas están prohibidas. El recorrido exacto depende sobre todo del país desde el que viaja
      tu perro. Esta guía explica el permiso, las pruebas, las edades mínimas, el cupo anual y las razas
      prohibidas para que sepas qué preparar antes de reservar.

    pt: "O Catar admite cachorros de estimação, mas a entrada segue o sistema próprio do país, e não o marco da UE. Todo cachorro precisa de uma autorização de importação obtida com antecedência junto ao Animal Resources Department (departamento de recursos animais) do Ministry of Municipality (o ministério da Municipalidade) antes de viajar. Além da autorização, seu cachorro precisa ter um microchip ISO, uma vacinação antirrábica válida, as demais vacinas essenciais e um certificado veterinário oficial. Cachorros vindos de países que o Catar considera de risco mais elevado para raiva também precisam passar por um teste sorológico antirrábico antes da viagem. A importação pessoal é limitada a um animal por ano, e as autorizações são normalmente emitidas para residentes. Algumas raças perigosas são proibidas. O percurso exato depende sobretudo do país de onde o cachorro parte. Este guia explica a autorização, os exames, os limites de idade, a cota anual e as raças proibidas para você saber o que preparar antes de reservar."
difficulty:
  level: moderate
  label: { en: "Moderate — advance import permit required", fr: "Modéré — permis d'importation préalable requis", es: "Moderado — se exige permiso de importación previo", pt: "Moderado — autorização de importação prévia obrigatória" }

prepTime:
  eu:
    en: "From a rabies-controlled origin: about 3–4 weeks — microchip, rabies vaccination valid 21 days after a first shot, core vaccinations, government health certificate and the import permit."
    fr: "Depuis une origine à rage contrôlée : environ 3–4 semaines — puce, vaccin antirabique valide 21 jours après une primo-vaccination, vaccinations essentielles, certificat officiel et permis d'importation."
    es: "Desde un origen con rabia controlada: unas 3–4 semanas — microchip, vacuna antirrábica válida 21 días después de la primovacunación, vacunas básicas, certificado sanitario oficial y el permiso de importación."
    pt: "De uma origem com raiva controlada: cerca de 3–4 semanas — microchip, vacinação antirrábica válida 21 dias após a primeira dose, vacinas essenciais, certificado veterinário oficial e a autorização de importação."
  listed:
    en: "From a higher-risk origin: add a rabies antibody test — plan several weeks to a few months for sampling, laboratory results and any waiting period before travel."
    fr: "Depuis une origine à risque plus élevé : ajoute un titrage antirabique — compte plusieurs semaines à quelques mois pour le prélèvement, les résultats de laboratoire et un éventuel délai avant le voyage."
    es: "Desde un origen de mayor riesgo: añade una prueba de titulación de rabia — cuenta con varias semanas a unos meses para la extracción, los resultados de laboratorio y un posible periodo de espera antes de viajar."
    pt: "De uma origem de risco mais elevado: acrescente um teste sorológico antirrábico (titulação) — conte de várias semanas a alguns meses para a coleta, os resultados do laboratório e um eventual período de espera antes da viagem."
  nonListed:
    en: "From an origin Qatar does not accept, or for a banned breed: import may be refused or require special approval from the authorities — timing is case-by-case and cannot be assumed."
    fr: "Depuis une origine non acceptée par le Qatar, ou pour une race interdite : l'importation peut être refusée ou soumise à une autorisation spéciale des autorités — les délais sont examinés au cas par cas."
    es: "Desde un origen que Catar no acepta, o para una raza prohibida: la importación puede ser denegada o requerir una autorización especial de las autoridades — los plazos se examinan caso por caso y no pueden darse por supuestos."
    pt: "De uma origem que o Catar não aceita, ou no caso de uma raça proibida: a importação pode ser recusada ou exigir aprovação especial das autoridades — os prazos são analisados caso a caso e não podem ser presumidos."

