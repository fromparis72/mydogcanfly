  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Qatar (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — le Qatar (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Catar (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — o Catar (seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Qatar", fr: "Pays de destination — Qatar", es: "País de destino — Catar", pt: "País de destino — Catar" }
      text:
        en: "Qatar runs its own scheme: an advance import permit from the Ministry of Municipality, an ISO microchip, a valid rabies vaccination, core vaccinations and a government health certificate are always required. Certain dangerous breeds are banned, and personal import is capped at one pet per year."
        fr: "Le Qatar applique son propre dispositif : permis d'importation préalable du ministère de la Municipalité, puce ISO, vaccination antirabique valide, vaccinations essentielles et certificat vétérinaire officiel toujours exigés. Certaines races dangereuses sont interdites, et l'importation personnelle est plafonnée à un animal par an."
        es: "Catar aplica su propio sistema: siempre se exigen un permiso de importación previo del Ministerio de Municipalidad, un microchip ISO, una vacunación antirrábica válida, las vacunas básicas y un certificado sanitario oficial. Algunas razas peligrosas están prohibidas, y la importación personal está limitada a una mascota al año."
        pt: "O Catar aplica um sistema próprio: autorização de importação obtida com antecedência junto ao Ministry of Municipality, microchip ISO, vacinação antirrábica válida, vacinas essenciais e atestado de saúde oficial são sempre obrigatórios. Algumas raças perigosas são proibidas, e a importação pessoal é limitada a um animal por ano."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Whether your dog leaves a rabies-controlled country or a country Qatar treats as higher-risk decides whether a rabies antibody test is required, and origins Qatar does not accept may block import altogether."
        fr: "Que ton chien parte d'un pays à rage contrôlée ou d'un pays que le Qatar considère à risque plus élevé détermine si un titrage antirabique est exigé, et les origines non acceptées par le Qatar peuvent bloquer l'importation."
        es: "Que tu perro salga de un país con rabia controlada o de un país que Catar considera de mayor riesgo determina si se exige una prueba de titulación de rabia, y los orígenes que Catar no acepta pueden bloquear la importación por completo."
        pt: "Se o seu cachorro parte de um país com raiva controlada ou de um país que o Catar considera de risco mais elevado é o que determina se o teste sorológico antirrábico é obrigatório, e as origens que o Catar não aceita podem bloquear a importação por completo."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay in a higher-risk country can trigger the antibody test even if you fly in from a low-risk country. Your dog's real origin and history count — not only the last airport."
        fr: "Un séjour récent dans un pays à risque plus élevé peut imposer le titrage même si tu arrives d'un pays à faible risque. C'est l'origine réelle et l'historique du chien qui comptent — pas seulement l'aéroport de destination finale."
        es: "Una estancia reciente en un país de mayor riesgo puede obligar a la prueba de titulación aunque llegues desde un país de bajo riesgo. Lo que cuenta es el origen y el historial reales de tu perro — no solo el último aeropuerto."
        pt: "Uma estadia recente em um país de risco mais elevado pode acionar a exigência do teste sorológico, mesmo que você chegue voando de um país de baixo risco. O que conta é a origem real e o histórico do seu cachorro — não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Qatar's framework, then confirm your dog's exact origin, rabies-risk status and history with your vet before applying for the permit."
    fr: "Lis donc les exigences ci-dessous comme le cadre qatari, puis confirme l'origine, le statut de risque rabique et l'historique exacts de ton chien avec ton vétérinaire avant de demander le permis."
    es: "Así que lee los requisitos siguientes como el marco de Catar y luego confirma con tu veterinario el origen, el nivel de riesgo de rabia y el historial exactos de tu perro antes de solicitar el permiso."
    pt: "Portanto, leia as exigências abaixo como o marco do Catar e, depois, confirme com o seu veterinário a origem exata do seu cachorro, o status de risco de raiva e o histórico antes de solicitar a autorização."

requirements:
  - item: { en: "Import permit (Animal Resources Dept.)", fr: "Permis d'importation (Dép. des ressources animales)", es: "Permiso de importación (Dpto. de Recursos Animales)", pt: "Autorização de importação (Animal Resources Dept.)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Applied for in advance to the Livestock / Animal Resources Department of the Ministry of Municipality, once all health terms are met; the permit is valid 30 days from issue.", fr: "Demandé à l'avance au Département de l'élevage / des ressources animales du ministère de la Municipalité, une fois toutes les conditions sanitaires remplies ; le permis est valable 30 jours à compter de la délivrance.", es: "Se solicita con antelación al Departamento de Ganadería / Recursos Animales del Ministerio de Municipalidad, una vez cumplidas todas las condiciones sanitarias; el permiso es válido 30 días desde su expedición.", pt: "Solicitada com antecedência ao Livestock / Animal Resources Department (departamento de pecuária e recursos animais) do Ministry of Municipality, depois de cumpridas todas as exigências sanitárias; a autorização vale 30 dias a partir da emissão." }
    exceptions: { en: "Permits are normally issued to residents; visitors during major events apply through the Hayya-card pet permit service.", fr: "Les permis sont normalement délivrés aux résidents ; les visiteurs lors de grands événements passent par le service de permis pour animaux des titulaires de la carte Hayya.", es: "Los permisos se expiden normalmente a residentes; los visitantes durante grandes eventos lo tramitan a través del servicio de permisos para mascotas de los titulares de la tarjeta Hayya.", pt: "As autorizações são normalmente emitidas para residentes; visitantes durante grandes eventos fazem o pedido pelo serviço de autorização para animais destinado aos titulares do cartão Hayya." }
    ref: { en: "Hukoomi — Apply for import permit for cats and dogs", fr: "Hukoomi — Demande de permis d'importation de chats et chiens", es: "Hukoomi — Solicitud de permiso de importación de gatos y perros", pt: "Hukoomi — Solicitação de autorização de importação de cães e gatos" }
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Permanent microchip compatible with international standards (ISO 11784/11785), implanted before the rabies vaccination; the chip number must match the health certificate.", fr: "Puce permanente conforme aux normes internationales (ISO 11784/11785), posée avant la vaccination antirabique ; le numéro de puce doit correspondre au certificat sanitaire.", es: "Microchip permanente conforme con las normas internacionales (ISO 11784/11785), implantado antes de la vacunación antirrábica; el número del chip debe coincidir con el del certificado sanitario.", pt: "Microchip permanente compatível com os padrões internacionais (ISO 11784/11785), implantado antes da vacinação antirrábica; o número do chip deve coincidir com o do atestado de saúde." }
    exceptions: { en: "None — identification is mandatory for every imported dog.", fr: "Aucune — l'identification est obligatoire pour tout chien importé.", es: "Ninguna — la identificación es obligatoria para todo perro importado.", pt: "Nenhuma — a identificação é obrigatória para todo cachorro importado." }
    ref: { en: "Hukoomi — Apply for import permit for cats and dogs", fr: "Hukoomi — Demande de permis d'importation de chats et chiens", es: "Hukoomi — Solicitud de permiso de importación de gatos y perros", pt: "Hukoomi — Solicitação de autorização de importação de cães e gatos" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Given at 12 weeks of age or older; for a first vaccination at least 21 days must pass before travel, and the vaccination must be in date.", fr: "Administrée à l'âge de 12 semaines ou plus ; pour une primo-vaccination, un délai d'au moins 21 jours est requis avant le voyage, et la vaccination doit être en cours de validité.", es: "Administrada a las 12 semanas de edad o más; para la primovacunación deben transcurrir al menos 21 días antes del viaje, y la vacunación debe estar vigente.", pt: "Aplicada a partir das 12 semanas de idade; no caso de uma primeira vacinação, devem transcorrer pelo menos 21 dias antes da viagem, e a vacinação precisa estar dentro da validade." }
    exceptions: { en: "The microchip must already be in place; otherwise the animal is re-vaccinated.", fr: "La puce doit déjà être posée ; sinon l'animal est revacciné.", es: "El microchip debe estar ya implantado; de lo contrario, se revacuna al animal.", pt: "O microchip já deve estar implantado; caso contrário, o animal é revacinado." }
    ref: { en: "Hukoomi — Apply for import permit for cats and dogs", fr: "Hukoomi — Demande de permis d'importation de chats et chiens", es: "Hukoomi — Solicitud de permiso de importación de gatos y perros", pt: "Hukoomi — Solicitação de autorização de importação de cães e gatos" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Required from origins Qatar treats as higher-risk for rabies: blood sampled after vaccination at an approved laboratory, showing a protective level (internationally at least 0.5 IU/ml).", fr: "Requis depuis les origines que le Qatar considère à risque rabique plus élevé : sang prélevé après la vaccination dans un laboratoire agréé, montrant un niveau protecteur (au moins 0,5 UI/ml au plan international).", es: "Se exige desde los orígenes que Catar considera de mayor riesgo de rabia: sangre extraída después de la vacunación en un laboratorio autorizado, con un nivel protector (al menos 0,5 UI/ml a nivel internacional).", pt: "Obrigatório para as origens que o Catar considera de risco mais elevado para raiva: sangue coletado após a vacinação em um laboratório aprovado, com nível protetor (internacionalmente, pelo menos 0,5 UI/ml)." }
    exceptions: { en: "Not required from rabies-controlled origins. The exact accepted origins and any waiting period are set by the Animal Resources Department — Unknown from published sources; confirm with the authority.", fr: "Non requis depuis les origines à rage contrôlée. Les origines acceptées exactes et un éventuel délai sont fixés par le Département des ressources animales — non communiqué dans les sources publiées ; à confirmer auprès de l'autorité.", es: "No se exige desde los orígenes con rabia controlada. Los orígenes aceptados exactos y cualquier periodo de espera los fija el Departamento de Recursos Animales — no consta en las fuentes publicadas; confírmalo con la autoridad.", pt: "Não obrigatório para origens com raiva controlada. As origens exatas aceitas e um eventual período de espera são definidos pelo Animal Resources Department — não consta nas fontes publicadas; confirme junto à autoridade." }
    ref: { en: "Animal Resources Dept. import health terms; Hukoomi", fr: "Conditions sanitaires d'import du Dép. des ressources animales ; Hukoomi", es: "Condiciones sanitarias de importación del Dpto. de Recursos Animales; Hukoomi", pt: "Exigências sanitárias de importação do Animal Resources Dept.; Hukoomi" }
  - item: { en: "Other (core) vaccinations", fr: "Autres vaccinations (essentielles)", es: "Otras vacunas (básicas)", pt: "Outras vacinas (essenciais)" }
    required: { en: "Required", fr: "Requises", es: "Obligatorias", pt: "Obrigatório" }
    when: { en: "Dogs must carry current core vaccinations against distemper, hepatitis, leptospirosis, parvovirus and parainfluenza, recorded in the vaccination book.", fr: "Les chiens doivent présenter des vaccinations essentielles à jour contre la maladie de Carré, l'hépatite, la leptospirose, la parvovirose et la parainfluenza, consignées au carnet de vaccination.", es: "Los perros deben tener al día las vacunas básicas contra el moquillo, la hepatitis, la leptospirosis, el parvovirus y la parainfluenza, consignadas en la cartilla de vacunación.", pt: "Os cachorros precisam ter em dia as vacinas essenciais contra cinomose, hepatite, leptospirose, parvovirose e parainfluenza, registradas na carteira de vacinação." }
    exceptions: { en: "None documented for dogs.", fr: "Aucune documentée pour les chiens.", es: "Ninguna documentada para los perros.", pt: "Nenhuma documentada para cachorros." }
    ref: { en: "Animal Resources Dept. import health terms", fr: "Conditions sanitaires d'import du Dép. des ressources animales", es: "Condiciones sanitarias de importación del Dpto. de Recursos Animales", pt: "Exigências sanitárias de importação do Animal Resources Dept." }
  - item: { en: "Government veterinary health certificate", fr: "Certificat vétérinaire officiel", es: "Certificado sanitario veterinario oficial", pt: "Atestado de saúde veterinário oficial" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Issued by the competent government veterinary authority of the exporting country shortly before travel; records the microchip, vaccinations and the dog's fitness to travel.", fr: "Délivré par l'autorité vétérinaire gouvernementale compétente du pays exportateur peu avant le voyage ; consigne la puce, les vaccinations et l'aptitude du chien au voyage.", es: "Expedido por la autoridad veterinaria gubernamental competente del país exportador poco antes del viaje; consigna el microchip, las vacunas y la aptitud del perro para viajar.", pt: "Emitido pela autoridade veterinária governamental competente do país exportador pouco antes da viagem; registra o microchip, as vacinas e a aptidão do cachorro para viajar." }
    exceptions: { en: "None — an official certificate must accompany every dog.", fr: "Aucune — un certificat officiel doit accompagner chaque chien.", es: "Ninguna — un certificado oficial debe acompañar a cada perro.", pt: "Nenhuma — um certificado oficial deve acompanhar cada cachorro." }
    ref: { en: "Hukoomi — Apply for import permit for cats and dogs", fr: "Hukoomi — Demande de permis d'importation de chats et chiens", es: "Hukoomi — Solicitud de permiso de importación de gatos y perros", pt: "Hukoomi — Solicitação de autorização de importação de cães e gatos" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
