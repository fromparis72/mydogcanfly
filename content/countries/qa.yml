    when: { en: "Import and possession of listed dangerous dog breeds is prohibited without a prior licence under Law No. 10 of 2019.", fr: "L'importation et la détention des races de chiens dangereux listées sont interdites sans licence préalable, au titre de la loi n° 10 de 2019.", es: "La importación y la tenencia de las razas de perros peligrosos listadas están prohibidas sin licencia previa, en virtud de la Ley n.º 10 de 2019.", pt: "A importação e a posse das raças de cachorro perigosas listadas são proibidas sem licença prévia, nos termos da Law No. 10 of 2019 (lei nº 10 de 2019)." }
    exceptions: { en: "A special dispensation from the Ministry of Interior may be sought for a proven family pet; without a licence, penalties include prison and fines.", fr: "Une dérogation spéciale du ministère de l'Intérieur peut être demandée pour un animal de compagnie familial avéré ; sans licence, les sanctions incluent prison et amendes.", es: "Puede solicitarse una dispensa especial del Ministerio del Interior para una mascota familiar acreditada; sin licencia, las sanciones incluyen prisión y multas.", pt: "É possível pedir uma dispensa especial ao Ministry of Interior (ministério do Interior) para um animal de estimação familiar comprovado; sem licença, as penas incluem prisão e multa." }
    ref: { en: "Law No. 10 of 2019 (possession of dangerous animals); MoECC", fr: "Loi n° 10 de 2019 (détention d'animaux dangereux) ; MoECC", es: "Ley n.º 10 de 2019 (tenencia de animales peligrosos); MoECC", pt: "Law No. 10 of 2019 (lei nº 10 de 2019, posse de animais perigosos); MoECC" }

origin:
  scheme: own
  eu:
    title: { en: "Rabies-controlled origin — no blood test", fr: "Origine à rage contrôlée — sans prise de sang", es: "Origen con rabia controlada — sin análisis de sangre", pt: "Origem com raiva controlada — sem exame de sangue" }
    body:
      en: "If your dog leaves a country Qatar treats as rabies-controlled, it needs the import permit from the Ministry of Municipality, an ISO microchip, a valid rabies vaccination, current core vaccinations and a government veterinary health certificate. No rabies antibody test is required. The dog must be at least 12 weeks old and identified before its rabies shot."
      fr: "Si ton chien part d'un pays que le Qatar considère à rage contrôlée, il lui faut le permis d'importation du ministère de la Municipalité, une puce ISO, une vaccination antirabique valide, les vaccinations essentielles à jour et un certificat vétérinaire officiel. Aucun titrage antirabique n'est requis. Le chien doit avoir au moins 12 semaines et être identifié avant son vaccin antirabique."
      es: "Si tu perro sale de un país que Catar considera con rabia controlada, necesita el permiso de importación del Ministerio de Municipalidad, un microchip ISO, una vacunación antirrábica válida, las vacunas básicas al día y un certificado sanitario veterinario oficial. No se exige prueba de titulación de rabia. El perro debe tener al menos 12 semanas y estar identificado antes de su vacuna antirrábica."
      pt: "Se o seu cachorro parte de um país que o Catar considera com raiva controlada, ele precisa da autorização de importação do Ministry of Municipality, de um microchip ISO, de uma vacinação antirrábica válida, das vacinas essenciais em dia e de um certificado veterinário oficial. Nenhum teste sorológico antirrábico é exigido. O cachorro precisa ter pelo menos 12 semanas de idade e estar identificado antes da vacina antirrábica."
    cls: ok
  listed:
    title: { en: "Higher-risk origin — antibody test required", fr: "Origine à risque plus élevé — titrage requis", es: "Origen de mayor riesgo — se exige prueba de titulación", pt: "Origem de risco mais elevado — teste sorológico obrigatório" }
    body:
      en: "From a country Qatar treats as higher-risk for rabies, add a rabies antibody test: blood sampled after vaccination at an approved laboratory, showing a protective level (internationally at least 0.5 IU/ml). The permit, microchip, vaccinations and government health certificate are all still required, and the practical minimum age rises to several months. The exact accepted origins and any waiting period are set by the Animal Resources Department."
      fr: "Depuis un pays que le Qatar considère à risque rabique plus élevé, ajoute un titrage antirabique : sang prélevé après la vaccination dans un laboratoire agréé, montrant un niveau protecteur (au moins 0,5 UI/ml au plan international). Le permis, la puce, les vaccinations et le certificat officiel restent tous requis, et l'âge minimum pratique monte à plusieurs mois. Les origines acceptées exactes et un éventuel délai sont fixés par le Département des ressources animales."
      es: "Desde un país que Catar considera de mayor riesgo de rabia, añade una prueba de titulación de rabia: sangre extraída después de la vacunación en un laboratorio autorizado, con un nivel protector (al menos 0,5 UI/ml a nivel internacional). El permiso, el microchip, las vacunas y el certificado sanitario oficial siguen siendo todos obligatorios, y la edad mínima práctica sube a varios meses. Los orígenes aceptados exactos y cualquier periodo de espera los fija el Departamento de Recursos Animales."
      pt: "De um país que o Catar considera de risco mais elevado para raiva, acrescente um teste sorológico antirrábico (titulação): sangue coletado após a vacinação em um laboratório aprovado, com nível protetor (internacionalmente, pelo menos 0,5 UI/ml). A autorização, o microchip, as vacinas e o certificado veterinário oficial continuam todos obrigatórios, e a idade mínima prática sobe para vários meses. As origens exatas aceitas e um eventual período de espera são definidos pelo Animal Resources Department."
    cls: warn
  nonListed:
    title: { en: "Origin not accepted, or banned breed", fr: "Origine non acceptée, ou race interdite", es: "Origen no aceptado, o raza prohibida", pt: "Origem não aceita, ou raça proibida" }
    body:
      en: "Qatar authorises imports only once its health terms are met, and origins it does not accept — or dogs of banned dangerous breeds — may be refused or require special approval. A banned breed needs a dispensation from the Ministry of Interior. Confirm your dog's origin and breed with the Animal Resources Department before making any plans."
      fr: "Le Qatar n'autorise l'importation qu'une fois ses conditions sanitaires remplies, et les origines non acceptées — ou les chiens de races dangereuses interdites — peuvent être refusés ou soumis à une autorisation spéciale. Une race interdite nécessite une dérogation du ministère de l'Intérieur. Vérifie l'origine et la race de ton chien auprès du Département des ressources animales avant tout projet."
      es: "Catar autoriza la importación solo una vez cumplidas sus condiciones sanitarias, y los orígenes que no acepta — o los perros de razas peligrosas prohibidas — pueden ser rechazados o requerir una autorización especial. Una raza prohibida necesita una dispensa del Ministerio del Interior. Confirma el origen y la raza de tu perro con el Departamento de Recursos Animales antes de hacer planes."
      pt: "O Catar só autoriza a importação depois de cumpridas as suas exigências sanitárias, e as origens que não aceita — ou os cachorros de raças perigosas proibidas — podem ser recusados ou exigir aprovação especial. Uma raça proibida precisa de uma dispensa do Ministry of Interior. Confirme a origem e a raça do seu cachorro junto ao Animal Resources Department antes de fazer qualquer plano."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Qatar depends on your permit and the country you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien au Qatar dépend de ton permis et du pays de départ."
    es: "Lo que ocurre cuando tu perro llega a Catar depende de tu permiso y del país desde el que hayas volado."
    pt: "O que acontece na chegada do seu cachorro ao Catar depende da sua autorização e do país de onde você voou."
  points:
    - en: "The import permit must be issued by the Ministry of Municipality before you travel and be still valid (30 days) on the day of entry."
      fr: "Le permis d'importation doit être délivré par le ministère de la Municipalité avant le voyage et être encore valide (30 jours) le jour de l'entrée."
      es: "El permiso de importación debe expedirlo el Ministerio de Municipalidad antes de viajar y seguir vigente (30 días) el día de la entrada."
      pt: "A autorização de importação precisa ser emitida pelo Ministry of Municipality antes da viagem e ainda estar válida (30 dias) no dia da entrada."
    - en: "Animals are examined at the point of entry against the permit, microchip and health certificate."
      fr: "Les animaux sont examinés au point d'entrée au regard du permis, de la puce et du certificat sanitaire."
      es: "Los animales se examinan en el punto de entrada cotejando el permiso, el microchip y el certificado sanitario."
      pt: "Os animais são examinados no ponto de entrada em confronto com a autorização, o microchip e o atestado de saúde."
    - en: "Carry original documents, including the government veterinary health certificate and vaccination book."
      fr: "Munis-toi des documents originaux, dont le certificat vétérinaire officiel et le carnet de vaccination."
      es: "Lleva los documentos originales, incluidos el certificado sanitario veterinario oficial y la cartilla de vacunación."
      pt: "Leve os documentos originais, incluindo o certificado veterinário oficial e a carteira de vacinação."
    - en: "If documents are missing or invalid, or the breed is banned without a licence, the animal may be held, refused entry or returned — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, ou si la race est interdite sans licence, l'animal peut être retenu, refusé ou renvoyé — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, o la raza está prohibida sin licencia, el animal puede ser retenido, rechazado o devuelto — a cargo del propietario."
      pt: "Se faltarem documentos ou eles forem inválidos, ou se a raça for proibida e não houver licença, o animal pode ser retido, ter a entrada recusada ou ser devolvido — às custas do tutor."
    - en: "Personal import is limited to one pet dog or cat per person per year."
      fr: "L'importation personnelle est limitée à un chien ou un chat par personne et par an."
      es: "La importación personal se limita a un perro o un gato por persona y año."
      pt: "A importação pessoal é limitada a um cachorro ou gato de estimação por pessoa por ano."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Qatar regulates dangerous animals under Law No. 10 of 2019 on the possession of dangerous animals, enforced by the Ministry of Environment and Climate Change (MoECC). The law classifies a list of dog breeds as dangerous and bans importing, exporting, trading, owning or walking them without a prior licence, on pain of prison and fines."
    fr: "Le Qatar réglemente les animaux dangereux au titre de la loi n° 10 de 2019 sur la détention d'animaux dangereux, appliquée par le ministère de l'Environnement et du Changement climatique (MoECC). La loi classe une liste de races de chiens comme dangereuses et interdit de les importer, exporter, vendre, détenir ou promener sans licence préalable, sous peine de prison et d'amendes."
    es: "Catar regula los animales peligrosos en virtud de la Ley n.º 10 de 2019 sobre la tenencia de animales peligrosos, aplicada por el Ministerio de Medio Ambiente y Cambio Climático (MoECC). La ley clasifica una lista de razas de perros como peligrosas y prohíbe importarlos, exportarlos, comercializarlos, tenerlos o pasearlos sin licencia previa, bajo pena de prisión y multas."
    pt: "O Catar regula os animais perigosos pela Law No. 10 of 2019 (lei nº 10 de 2019) sobre a posse de animais perigosos, aplicada pelo Ministry of Environment and Climate Change (MoECC, o ministério do Meio Ambiente e da Mudança Climática). A lei classifica uma lista de raças de cachorro como perigosas e proíbe importar, exportar, comercializar, possuir ou passear com elas sem licença prévia, sob pena de prisão e multa."
  cat1:
    en: "Banned dog breeds under the regulation include: Doberman, Rhodesian Ridgeback, American Staffordshire Terrier, American Pit Bull Terrier, Boston Terrier, German Pinscher, Staffordshire Terrier, Bull Terrier, Ca de Bou, Canary Dog (Presa Canario), Dogo Argentino, Brazilian Mastiff (Fila Brasileiro), Spanish Mastiff, Neapolitan Mastiff, Bulldog, Bullmastiff, Old English Mastiff, Dogue de Bordeaux, Boxer, Great Dane, Rottweiler, Shar Pei, Cane Corso, Kangal, Tibetan Mastiff, Caucasian Sheepdog, Ovcharka and Alpine Mastiff — 28 breeds in all, plus their crosses."
    fr: "Les races de chiens interdites au titre de la réglementation comprennent : Doberman, Rhodesian Ridgeback, American Staffordshire Terrier, American Pit Bull Terrier, Boston Terrier, Pinscher allemand, Staffordshire Terrier, Bull Terrier, Ca de Bou, Dogue des Canaries (Presa Canario), Dogo Argentino, Mâtin brésilien (Fila Brasileiro), Mâtin espagnol, Mâtin napolitain, Bouledogue, Bullmastiff, Vieux Mastiff anglais, Dogue de Bordeaux, Boxer, Dogue allemand, Rottweiler, Shar Pei, Cane Corso, Kangal, Mâtin tibétain, Berger du Caucase, Ovtcharka et Mâtin des Alpes — 28 races au total, ainsi que leurs croisements."
    es: "Las razas de perros prohibidas en virtud de la normativa incluyen: Doberman, Rhodesian Ridgeback, American Staffordshire Terrier, American Pit Bull Terrier, Boston Terrier, Pinscher alemán, Staffordshire Terrier, Bull Terrier, Ca de Bou, Presa Canario, Dogo Argentino, Mastín brasileño (Fila Brasileiro), Mastín español, Mastín napolitano, Bulldog, Bullmastiff, Mastín inglés antiguo, Dogo de Burdeos, Boxer, Gran danés, Rottweiler, Shar Pei, Cane Corso, Kangal, Mastín tibetano, Perro pastor del Cáucaso, Ovcharka y Mastín de los Alpes — 28 razas en total, además de sus cruces."
    pt: "As raças de cachorro proibidas pela regulamentação incluem: Doberman, Rhodesian Ridgeback, American Staffordshire Terrier, American Pit Bull Terrier, Boston Terrier, Pinscher Alemão, Staffordshire Terrier, Bull Terrier, Ca de Bou, Dogo Canário (Presa Canario), Dogo Argentino, Fila Brasileiro, Mastim Espanhol, Mastim Napolitano, Buldogue, Bullmastiff, Mastim Inglês (Old English Mastiff), Dogue de Bordeaux, Boxer, Dogue Alemão, Rottweiler, Shar Pei, Cane Corso, Kangal, Mastim Tibetano, Pastor do Cáucaso, Ovcharka e Mastim Alpino — 28 raças ao todo, além de seus cruzamentos."
  cat2:
    en: "There is no lighter 'permitted with conditions' category for these breeds at import: they are banned outright. A special dispensation from the Ministry of Interior may be sought to import a banned breed only as a proven family pet, subject to the authority's approval."
    fr: "Il n'existe pas de catégorie allégée « autorisée sous conditions » pour ces races à l'importation : elles sont purement interdites. Une dérogation spéciale du ministère de l'Intérieur peut être demandée pour importer une race interdite uniquement comme animal de compagnie familial avéré, sous réserve de l'accord de l'autorité."
    es: "No existe una categoría más flexible de «permitida con condiciones» para estas razas en la importación: están prohibidas por completo. Puede solicitarse una dispensa especial del Ministerio del Interior para importar una raza prohibida únicamente como mascota familiar acreditada, con la aprobación de la autoridad."
    pt: "Não existe uma categoria mais branda de \"permitido com condições\" para essas raças na importação: elas são proibidas de forma pura e simples. É possível pedir uma dispensa especial ao Ministry of Interior para importar uma raça proibida apenas como animal de estimação familiar comprovado, ficando a decisão a critério da autoridade."
  note:
    en: "Because a dog that resembles a listed breed risks refusal, confirm your dog's breed and any cross before applying for the permit. The dangerous-animals list can change; verify with the MoECC and the Animal Resources Department."
    fr: "Un chien ressemblant à une race listée risquant le refus, confirme la race de ton chien et tout croisement avant de demander le permis. La liste des animaux dangereux peut évoluer ; vérifie auprès du MoECC et du Département des ressources animales."
    es: "Como un perro que se parezca a una raza listada puede ser rechazado, confirma la raza de tu perro y cualquier cruce antes de solicitar el permiso. La lista de animales peligrosos puede cambiar; verifícalo con el MoECC y el Departamento de Recursos Animales."
    pt: "Como um cachorro que se pareça com uma das raças listadas corre o risco de ser recusado, confirme a raça do seu cachorro e eventuais cruzamentos antes de solicitar a autorização. A lista de animais perigosos pode mudar; verifique junto ao MoECC e ao Animal Resources Department."

