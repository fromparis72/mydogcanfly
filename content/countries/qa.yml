    when: { en: "A puppy must be at least 12 weeks old to be vaccinated against rabies; where an antibody test applies, the practical minimum age reaches several months.", fr: "Un chiot doit avoir au moins 12 semaines pour être vacciné contre la rage ; lorsqu'un titrage s'applique, l'âge minimum pratique atteint plusieurs mois.", es: "Un cachorro debe tener al menos 12 semanas para vacunarse contra la rabia; cuando se aplica una prueba de titulación, la edad mínima práctica llega a varios meses.", pt: "Um filhote precisa ter pelo menos 12 semanas de idade para ser vacinado contra a raiva; quando o teste sorológico se aplica, a idade mínima prática chega a vários meses." }
    exceptions: { en: "Younger puppies cannot meet the rabies requirements and cannot be imported.", fr: "Les chiots plus jeunes ne peuvent satisfaire les exigences antirabiques et ne peuvent être importés.", es: "Los cachorros más jóvenes no pueden cumplir los requisitos antirrábicos y no pueden importarse.", pt: "Filhotes mais novos não conseguem cumprir as exigências relativas à raiva e não podem ser importados." }
    ref: { en: "Animal Resources Dept. import health terms", fr: "Conditions sanitaires d'import du Dép. des ressources animales", es: "Condiciones sanitarias de importación del Dpto. de Recursos Animales", pt: "Exigências sanitárias de importação do Animal Resources Dept." }
  - item: { en: "Maximum pets per person per year", fr: "Nombre maximum d'animaux par personne et par an", es: "Número máximo de mascotas por persona y año", pt: "Número máximo de animais por pessoa por ano" }
    required: { en: "Limited", fr: "Limité", es: "Limitado", pt: "Limitado" }
    when: { en: "Personal import is limited to one pet dog or cat per person per year.", fr: "L'importation personnelle est limitée à un chien ou un chat par personne et par an.", es: "La importación personal se limita a un perro o un gato por persona y año.", pt: "A importação pessoal é limitada a um cachorro ou gato de estimação por pessoa por ano." }
    exceptions: { en: "Larger or commercial movements fall under separate rules, not personal import.", fr: "Les mouvements plus importants ou commerciaux relèvent de règles distinctes, non de l'importation personnelle.", es: "Los movimientos mayores o comerciales se rigen por normas distintas, no por la importación personal.", pt: "Movimentações maiores ou comerciais se enquadram em regras próprias, e não na importação pessoal." }
    ref: { en: "Animal Resources Dept. import conditions", fr: "Conditions d'importation du Dép. des ressources animales", es: "Condiciones de importación del Dpto. de Recursos Animales", pt: "Condições de importação do Animal Resources Dept." }
  - item: { en: "Border check / port examination", fr: "Contrôle frontalier / examen au port", es: "Control fronterizo / examen en el punto de entrada", pt: "Controle de fronteira / exame no ponto de entrada" }
