  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not routinely required", fr: "Non requise en routine", es: "No obligatoria de forma sistemática", pt: "Não obrigatória de forma rotineira" }
