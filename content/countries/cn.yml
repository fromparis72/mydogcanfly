# Country Entry Guide — China (mainland) (source of truth, bilingual EN/FR).
# China is NOT in the EU — this encodes China's own GACC pet-entry scheme.
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_cn
iso2: "CN"
name: { en: "China", fr: "Chine", es: "China", pt: "China" }
region: { en: "Asia", fr: "Asie", es: "Asia", pt: "Ásia" }


regime: non_listed
domestic:
  intro:
    en: "Domestic flight in China: this is the strictest domestic regime of all — a per-animal quarantine certificate is mandatory by law."
    fr: "Vol intérieur en Chine : c'est le régime domestique le plus strict qui soit — un certificat de quarantaine par animal est obligatoire par la loi."
    es: "Vuelo nacional en China: es el régimen nacional más estricto — un certificado de cuarentena por animal es obligatorio por ley."
    pt: "Voo doméstico na China: este é o regime interno mais rígido que existe — um certificado de quarentena por animal é obrigatório por lei."
  points:
    - en: "The Animal Epidemic Prevention Law requires a quarantine certificate for every animal moved by air; without it the carrier may not accept the dog."
      fr: "La loi sur la prévention des épizooties impose un certificat de quarantaine pour chaque animal transporté par avion ; sans lui, la compagnie n'a pas le droit d'accepter le chien."
      es: "La ley de prevención de epizootias exige un certificado de cuarentena por cada animal transportado en avión; sin él, la aerolínea no puede aceptar al perro."
      pt: "A Animal Epidemic Prevention Law (Lei de Prevenção de Epidemias Animais) exige um certificado de quarentena para cada animal transportado de avião; sem ele, a companhia aérea não pode aceitar o cachorro."
    - en: "The national protocol requires a valid rabies vaccination AND a passing rabies antibody titre test. Several provinces add their own conditions."
      fr: "Le protocole national exige une vaccination antirabique valide ET un titrage des anticorps antirabiques satisfaisant. Plusieurs provinces ajoutent leurs propres conditions."
      es: "El protocolo nacional exige una vacuna antirrábica válida Y una titulación de anticuerpos antirrábicos satisfactoria. Varias provincias añaden sus propias condiciones."
      pt: "O protocolo nacional exige uma vacinação antirrábica válida E um teste sorológico antirrábico (titulação) com resultado satisfatório. Várias províncias acrescentam as próprias condições."
    - en: "Most Chinese carriers take pets in the hold or as cargo only, not in the cabin."
      fr: "La plupart des compagnies chinoises n'acceptent les animaux qu'en soute ou en fret, pas en cabine."
      es: "La mayoría de aerolíneas chinas solo aceptan mascotas en bodega o carga, no en cabina."
      pt: "A maioria das companhias aéreas chinesas só aceita animais no porão ou como carga, não na cabine."
exit:
  authority: GACC
  authorityUrl: http://english.customs.gov.cn
  intro:
    en: "China is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an exit quarantine certificate from Customs (GACC)."
    fr: "La Chine est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat de quarantaine de sortie délivré par les douanes (GACC)."
    es: "China no está listada: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado de cuarentena de salida emitido por la Aduana (GACC)."
    pt: "A China é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um certificado de quarentena de saída emitido pela alfândega (GACC)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "GACC (Customs) at the exit port carries out the quarantine inspection and issues the exit health certificate; the dog must be microchipped and rabies-vaccinated between 30 days and 12 months before travel."
        fr: "La GACC (douanes) au point de sortie réalise l'inspection de quarantaine et délivre le certificat sanitaire de sortie ; le chien doit être pucé et vacciné contre la rage entre 30 jours et 12 mois avant le voyage."
        es: "La GACC (Aduana) en el puerto de salida realiza la inspección de cuarentena y emite el certificado sanitario de salida; el perro debe estar microchipado y vacunado contra la rabia entre 30 días y 12 meses antes del viaje."
        pt: "A GACC (alfândega) no porto de saída faz a inspeção de quarentena e emite o atestado de saúde de saída; o cachorro precisa estar com microchip e vacinado contra a raiva entre 30 dias e 12 meses antes da viagem."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to China with your dog", fr: "Voyager en Chine avec ton chien", es: "Viajar a China con tu perro", pt: "Viajar para a China com seu cachorro" }
  intro:
    en: >-
      Mainland China runs its own national pet-entry scheme through the General Administration of
      Customs (GACC) — it is not part of the EU system. Each traveller may bring only one dog (or one
      cat) per entry, and the dog needs an ISO microchip, a valid rabies vaccination and an official
      quarantine and vaccination certificate from the exit country. The key question is where your dog
      is coming from: dogs from GACC-designated countries or regions, and dogs from other countries
      carrying a valid rabies antibody test, are released after an on-site check, while dogs without a
      valid antibody test face 30 days of isolation quarantine on arrival. This guide explains each
      path so you know exactly what to prepare before you book your flight.
    fr: >-
      La Chine continentale applique son propre régime national d'entrée des animaux via
      l'Administration générale des douanes (GACC) — elle ne fait pas partie du système de l'UE. Chaque
      voyageur ne peut amener qu'un seul chien (ou un seul chat) par entrée, et le chien doit avoir une
      puce ISO, une vaccination antirabique valide et un certificat officiel de quarantaine et de
      vaccination du pays de départ. La question clé est la provenance : les chiens venant de pays ou
      régions désignés par la GACC, et ceux munis d'un titrage antirabique valide, sont libérés après un
      contrôle sur place, tandis que les chiens sans titrage valide subissent 30 jours de quarantaine à
      l'arrivée. Ce guide détaille chaque cas pour savoir quoi préparer avant de réserver ton vol.
    es: >-
      La China continental aplica su propio régimen nacional de entrada de animales a través de la
      Administración General de Aduanas (GACC) — no forma parte del sistema de la UE. Cada viajero solo
      puede llevar un perro (o un gato) por entrada, y el perro necesita un microchip ISO, una vacunación
      antirrábica válida y un certificado oficial de cuarentena y vacunación del país de salida. La
      cuestión clave es la procedencia: los perros que llegan de países o regiones designados por la
      GACC, y los perros de otros países que llevan una prueba de titulación de rabia válida, se liberan
      tras un control in situ, mientras que los perros sin una prueba de titulación válida se enfrentan a
      30 días de cuarentena de aislamiento a la llegada. Esta guía explica cada caso para que sepas
      exactamente qué preparar antes de reservar tu vuelo.

    pt: "A China continental aplica o seu próprio regime nacional de entrada de animais por meio da General Administration of Customs (GACC, a administração-geral das alfândegas) — ela não faz parte do sistema da UE. Cada viajante só pode levar um cachorro (ou um gato) por entrada, e o cachorro precisa de um microchip ISO, de uma vacinação antirrábica válida e de um certificado oficial de quarentena e vacinação do país de saída. A pergunta decisiva é de onde vem o seu cachorro: os cachorros que chegam de países ou regiões designados pela GACC, e os cachorros de outros países que levam um teste sorológico antirrábico válido, são liberados depois de uma inspeção no local, enquanto os cachorros sem teste sorológico válido enfrentam 30 dias de quarentena de isolamento na chegada. Este guia explica cada caminho para você saber exatamente o que preparar antes de comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Moderate — difficult without a rabies antibody test", fr: "Modérée — difficile sans titrage antirabique", es: "Moderada — difícil sin una prueba de titulación de rabia", pt: "Moderada — difícil sem teste sorológico antirrábico" }

prepTime:
  eu:
    en: "Designated country/region: a few weeks — microchip, valid rabies vaccination and an official exit certificate; no blood test and no isolation quarantine."
    fr: "Pays/région désigné : quelques semaines — puce, vaccination antirabique valide et certificat officiel de départ ; pas de prise de sang ni de quarantaine d'isolement."
    es: "País/región designado: unas semanas — microchip, vacunación antirrábica válida y un certificado oficial de salida; sin análisis de sangre ni cuarentena de aislamiento."
    pt: "País/região designado: algumas semanas — microchip, vacinação antirrábica válida e um certificado oficial de saída; sem coleta de sangue e sem quarentena de isolamento."
  listed:
    en: "Non-designated country with a rabies antibody test: about 1–3 months — allow time for the blood test at a GACC-designated laboratory (result ≥0.5 IU/ml)."
    fr: "Pays non désigné avec titrage antirabique : environ 1 à 3 mois — prévoir le délai du titrage dans un laboratoire agréé par la GACC (résultat ≥0,5 UI/ml)."
    es: "País no designado con una prueba de titulación de rabia: entre 1 y 3 meses aproximadamente — prevé el plazo de la prueba en un laboratorio autorizado por la GACC (resultado ≥0,5 UI/ml)."
    pt: "País não designado com teste sorológico antirrábico: cerca de 1 a 3 meses — reserve tempo para a coleta de sangue em um laboratório designado pela GACC (resultado ≥0,5 UI/ml)."
  nonListed:
    en: "No valid antibody test: add 30 days of isolation quarantine on arrival, at a port equipped with quarantine facilities, at the owner's expense."
    fr: "Sans titrage valide : ajoute 30 jours de quarantaine d'isolement à l'arrivée, dans un port doté d'installations de quarantaine, aux frais du propriétaire."
    es: "Sin una prueba de titulación válida: añade 30 días de cuarentena de aislamiento a la llegada, en un puerto dotado de instalaciones de cuarentena, a cargo del propietario."
    pt: "Sem teste sorológico válido: acrescente 30 dias de quarentena de isolamento na chegada, em um porto com instalações de quarentena, às custas do proprietário."

