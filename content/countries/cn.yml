  - requirement: { en: "Dogs allowed", fr: "Chiens admis", es: "Perros admitidos", pt: "Cachorros permitidos" }
    status: { en: "Yes — one pet per person per entry", fr: "Oui — un animal par personne et par entrée", es: "Sí — una mascota por persona y por entrada", pt: "Sim — um animal por pessoa e por entrada" }
    cls: ok
  - requirement: { en: "Microchip", fr: "Puce électronique", es: "Microchip", pt: "Microchip" }
    status: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    cls: warn
  - requirement: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    status: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    cls: warn
  - requirement: { en: "Rabies antibody test", fr: "Titrage antirabique", es: "Prueba de titulación de rabia", pt: "Teste sorológico antirrábico (titulação)" }
    status: { en: "Conditional — non-designated origins, to avoid quarantine", fr: "Conditionnel — origines non désignées, pour éviter la quarantaine", es: "Condicional — orígenes no designados, para evitar la cuarentena", pt: "Condicional — origens não designadas, para evitar a quarentena" }
    cls: neutral
  - requirement: { en: "Veterinary certificate", fr: "Certificat vétérinaire", es: "Certificado veterinario", pt: "Certificado veterinário" }
    status: { en: "Required — official quarantine & vaccination certificate", fr: "Requis — certificat officiel de quarantaine et de vaccination", es: "Obligatorio — certificado oficial de cuarentena y vacunación", pt: "Obrigatório — certificado oficial de quarentena e vacinação" }
    cls: warn
