    cls: neutral

notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro."
    pt: "Só um médico-veterinário pode confirmar o procedimento exato para o seu cachorro."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact procedure depends on three things — China (your destination) is only the first."
    fr: "La procédure exacte dépend de trois éléments — la Chine (ta destination) n'est que le premier."
    es: "El procedimiento exacto depende de tres factores — China (tu destino) es solo el primero."
    pt: "O procedimento exato depende de três coisas — a China (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — China", fr: "Pays de destination — Chine", es: "País de destino — China", pt: "País de destino — China" }
      text:
        en: "China applies the GACC scheme: one pet per person, an ISO microchip, a valid rabies vaccination and an official exit certificate are always required, and entry must be at a designated port."
        fr: "La Chine applique le régime GACC : un animal par personne, une puce ISO, une vaccination antirabique valide et un certificat officiel de départ toujours exigés, et l'entrée doit se faire par un port désigné."
        es: "China aplica el régimen de la GACC: una mascota por persona, un microchip ISO, una vacunación antirrábica válida y un certificado oficial de salida siempre obligatorios, y la entrada debe hacerse por un puerto designado."
        pt: "A China aplica o regime da GACC: um animal por pessoa, microchip ISO, vacinação antirrábica válida e certificado oficial de saída são sempre obrigatórios, e a entrada tem que ser por um porto designado."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Whether your dog leaves from a GACC-designated country/region or a non-designated one decides whether a rabies antibody test is needed to avoid the 30-day isolation quarantine."
        fr: "Que ton chien parte d'un pays/région désigné par la GACC ou non désigné détermine si un titrage antirabique est nécessaire pour éviter la quarantaine d'isolement de 30 jours."
        es: "Que tu perro salga de un país/región designado por la GACC o de uno no designado determina si se necesita una prueba de titulación de rabia para evitar la cuarentena de aislamiento de 30 días."
        pt: "Partir de um país/região designado pela GACC ou de um não designado é o que define se é preciso um teste sorológico antirrábico para evitar a quarentena de isolamento de 30 dias."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay or transit in a non-designated country can change your dog's classification, so its real origin and travel history matter — not only the last airport."
        fr: "Un séjour ou un transit récent dans un pays non désigné peut modifier le classement du chien : son origine réelle et son historique comptent — pas seulement l'aéroport de destination finale."
        es: "Una estancia o un tránsito reciente en un país no designado puede cambiar la clasificación de tu perro, por lo que importan su origen real y su historial de viajes — no solo el último aeropuerto."
        pt: "Uma estadia ou um trânsito recente em um país não designado pode mudar a classificação do seu cachorro: contam a origem real e o histórico de viagens dele — não só o último aeroporto."
  note:
    en: "So read the requirements below as China's framework, then confirm your dog's exact origin and history with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre chinois, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de China y luego confirma el origen y el historial exactos de tu perro con tu veterinario."
    pt: "Leia então as exigências abaixo como o quadro geral da China, e confirme com seu veterinário a origem e o histórico exatos do seu cachorro."

requirements:
  - item: { en: "One pet per person", fr: "Un animal par personne", es: "Una mascota por persona", pt: "Um animal por pessoa" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Limited to one dog or one cat per person per entry; more is treated as a commercial import.", fr: "Limité à un chien ou un chat par personne et par entrée ; au-delà, c'est un import commercial.", es: "Limitado a un perro o un gato por persona y por entrada; más allá, se considera una importación comercial.", pt: "Limitado a um cachorro ou um gato por pessoa e por entrada; acima disso, é tratado como importação comercial." }
    exceptions: { en: "Multiple pets require a licensed agent and different rules.", fr: "Plusieurs animaux nécessitent un agent agréé et des règles différentes.", es: "Varias mascotas requieren un agente autorizado y normas distintas.", pt: "Vários animais exigem um agente licenciado e seguem regras diferentes." }
    ref: { en: "GACC Announcement [2019] No. 5, Art. I", fr: "Annonce GACC [2019] n° 5, art. I", es: "Anuncio GACC [2019] n.º 5, art. I", pt: "Anúncio GACC [2019] nº 5, art. I" }
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "The pet must carry an electronic chip; an ISO 11784/11785 15-digit chip is the standard.", fr: "L'animal doit porter une puce électronique ; une puce ISO 11784/11785 à 15 chiffres est la norme.", es: "La mascota debe llevar un microchip electrónico; un microchip ISO 11784/11785 de 15 dígitos es la norma.", pt: "O animal precisa ter um chip eletrônico; o padrão é um chip ISO 11784/11785 de 15 dígitos." }
    exceptions: { en: "If the chip is not ISO-standard, bring a compatible scanner.", fr: "Si la puce n'est pas ISO, apporte un lecteur compatible.", es: "Si el microchip no es de norma ISO, lleva un lector compatible.", pt: "Se o chip não for do padrão ISO, leve um leitor compatível." }
    ref: { en: "GACC Announcement [2019] No. 5, Art. I", fr: "Annonce GACC [2019] n° 5, art. I", es: "Anuncio GACC [2019] n.º 5, art. I", pt: "Anúncio GACC [2019] nº 5, art. I" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Valid rabies vaccination attested by the exit country's official authority; China does not recognise multi-year vaccines.", fr: "Vaccination antirabique valide attestée par l'autorité officielle du pays de départ ; la Chine ne reconnaît pas les vaccins pluriannuels.", es: "Vacunación antirrábica válida acreditada por la autoridad oficial del país de salida; China no reconoce las vacunas plurianuales.", pt: "Vacinação antirrábica válida atestada pela autoridade oficial do país de saída; a China não reconhece vacinas plurianuais." }
    exceptions: { en: "Assistance dogs without a vaccination certificate may be vaccinated at a qualified institution on the carrier's application.", fr: "Un chien d'assistance sans certificat de vaccination peut être vacciné dans un établissement qualifié à la demande du convoyeur.", es: "Un perro de asistencia sin certificado de vacunación puede ser vacunado en un establecimiento cualificado a petición del acompañante.", pt: "Um cão de assistência sem certificado de vacinação pode ser vacinado em um estabelecimento qualificado a pedido do acompanhante." }
    ref: { en: "GACC Announcement [2019] No. 5, Art. I & III", fr: "Annonce GACC [2019] n° 5, art. I & III", es: "Anuncio GACC [2019] n.º 5, art. I y III", pt: "Anúncio GACC [2019] nº 5, art. I e III" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Non-designated origins: report from a GACC-designated laboratory with an antibody level above 0.5 IU/ml, to be exempt from the 30-day quarantine.", fr: "Origines non désignées : rapport d'un laboratoire agréé par la GACC avec un titrage supérieur à 0,5 UI/ml, pour être exempté de la quarantaine de 30 jours.", es: "Orígenes no designados: informe de un laboratorio autorizado por la GACC con un nivel de anticuerpos superior a 0,5 UI/ml, para quedar exento de la cuarentena de 30 días.", pt: "Origens não designadas: laudo de um laboratório designado pela GACC com nível de anticorpos acima de 0,5 UI/ml, para ficar isento da quarentena de 30 dias." }
    exceptions: { en: "Not required from GACC-designated countries or regions.", fr: "Non requis depuis les pays ou régions désignés par la GACC.", es: "No se exige desde los países o regiones designados por la GACC.", pt: "Não obrigatório para quem vem de países ou regiões designados pela GACC." }
    ref: { en: "GACC Announcement [2019] No. 5, Art. II(2)", fr: "Annonce GACC [2019] n° 5, art. II(2)", es: "Anuncio GACC [2019] n.º 5, art. II(2)", pt: "Anúncio GACC [2019] nº 5, art. II(2)" }
  - item: { en: "Official quarantine & vaccination certificate", fr: "Certificat officiel de quarantaine et de vaccination", es: "Certificado oficial de cuarentena y vacunación", pt: "Certificado oficial de quarentena e vacinação" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Issued by the official animal quarantine authority of the exit country or region; identifies the pet and its microchip.", fr: "Délivré par l'autorité officielle de quarantaine animale du pays ou de la région de départ ; identifie l'animal et sa puce.", es: "Emitido por la autoridad oficial de cuarentena animal del país o región de salida; identifica a la mascota y su microchip.", pt: "Emitido pela autoridade oficial de quarentena animal do país ou região de saída; identifica o animal e o microchip dele." }
    exceptions: { en: "Missing or invalid certificates lead to return or disposal of the pet.", fr: "Un certificat manquant ou invalide entraîne la réexpédition ou l'élimination de l'animal.", es: "Un certificado ausente o no válido conlleva la devolución o la eliminación de la mascota.", pt: "Certificado ausente ou inválido leva à devolução ou à eliminação do animal." }
    ref: { en: "GACC Announcement [2019] No. 5, Art. I & III", fr: "Annonce GACC [2019] n° 5, art. I & III", es: "Anuncio GACC [2019] n.º 5, art. I y III", pt: "Anúncio GACC [2019] nº 5, art. I e III" }
  - item: { en: "Import permit / advance notification", fr: "Permis d'import / notification préalable", es: "Permiso de importación / notificación previa", pt: "Autorização de importação / notificação prévia" }
    required: { en: "Generally not required", fr: "En général non requis", es: "En general no obligatorio", pt: "Em geral, não obrigatório" }
    when: { en: "No import permit for one accompanied pet on a short-term visa; unaccompanied or commercial imports have separate rules.", fr: "Aucun permis pour un animal accompagné sous visa court séjour ; les imports non accompagnés ou commerciaux relèvent de règles distinctes.", es: "No se necesita permiso de importación para una mascota acompañada con visado de corta duración; las importaciones no acompañadas o comerciales se rigen por normas distintas.", pt: "Nenhuma autorização de importação para um animal acompanhado com visto de curta duração; importações desacompanhadas ou comerciais seguem regras próprias." }
    exceptions: { en: "Some visa categories or agents may require additional documents.", fr: "Certaines catégories de visa ou agents peuvent exiger des documents supplémentaires.", es: "Algunas categorías de visado o agentes pueden exigir documentos adicionales.", pt: "Algumas categorias de visto ou alguns agentes podem exigir documentos adicionais." }
    ref: { en: "GACC Announcement [2019] No. 5", fr: "Annonce GACC [2019] n° 5", es: "Anuncio GACC [2019] n.º 5", pt: "Anúncio GACC [2019] nº 5" }
  - item: { en: "Designated port of entry", fr: "Port d'entrée désigné", es: "Puerto de entrada designado", pt: "Porto de entrada designado" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Any pet that may need isolation must enter through a port equipped with isolation and quarantine facilities (list set by GACC).", fr: "Tout animal susceptible d'isolement doit entrer par un port doté d'installations d'isolement et de quarantaine (liste fixée par la GACC).", es: "Toda mascota que pueda necesitar aislamiento debe entrar por un puerto dotado de instalaciones de aislamiento y cuarentena (lista fijada por la GACC).", pt: "Todo animal que possa precisar de isolamento tem que entrar por um porto com instalações de isolamento e quarentena (lista definida pela GACC)." }
    exceptions: { en: "Exempt pets may enter through other ports, but confirm the current GACC list.", fr: "Les animaux exemptés peuvent entrer par d'autres ports, mais vérifie la liste GACC en vigueur.", es: "Las mascotas exentas pueden entrar por otros puertos, pero verifica la lista vigente de la GACC.", pt: "Animais isentos podem entrar por outros portos, mas confirme a lista da GACC em vigor." }
    ref: { en: "GACC Announcement [2019] No. 5, Art. II & III", fr: "Annonce GACC [2019] n° 5, art. II & III", es: "Anuncio GACC [2019] n.º 5, art. II y III", pt: "Anúncio GACC [2019] nº 5, art. II e III" }
  - item: { en: "On-arrival quarantine", fr: "Quarantaine à l'arrivée", es: "Cuarentena a la llegada", pt: "Quarentena na chegada" }
    required: { en: "30 days unless exempt", fr: "30 jours sauf exemption", es: "30 días salvo exención", pt: "30 dias, salvo isenção" }
    when: { en: "30 days of isolation at a customs-designated facility (withholding period included), unless the pet qualifies for exemption.", fr: "30 jours d'isolement dans une installation désignée par la douane (période de rétention incluse), sauf si l'animal remplit les conditions d'exemption.", es: "30 días de aislamiento en una instalación designada por las aduanas (periodo de retención incluido), salvo que la mascota cumpla las condiciones de exención.", pt: "30 dias de isolamento em uma instalação designada pela alfândega (período de retenção incluído), a menos que o animal cumpra as condições de isenção." }
    exceptions: { en: "Exempt: designated-country pets, or non-designated pets with a valid antibody test, that pass the on-site quarantine; also qualified assistance dogs.", fr: "Exemptés : animaux de pays désignés, ou de pays non désignés avec titrage valide, qui passent la quarantaine sur place ; également les chiens d'assistance qualifiés.", es: "Exentos: las mascotas de países designados, o de países no designados con una prueba de titulación válida, que superan la cuarentena in situ; también los perros de asistencia cualificados.", pt: "Isentos: animais de países designados, ou de países não designados com teste sorológico válido, que passem na quarentena no local; também os cães de assistência qualificados." }
    ref: { en: "GACC Announcement [2019] No. 5, Art. II", fr: "Annonce GACC [2019] n° 5, art. II", es: "Anuncio GACC [2019] n.º 5, art. II", pt: "Anúncio GACC [2019] nº 5, art. II" }
  - item: { en: "Assistance dogs (guide / hearing / search-and-rescue)", fr: "Chiens d'assistance (guide / d'aide auditive / de sauvetage)", es: "Perros de asistencia (guía / de audición / de búsqueda y rescate)", pt: "Cães de assistência (guia / de audição / de busca e salvamento)" }
    required: { en: "Special path", fr: "Voie particulière", es: "Vía especial", pt: "Via especial" }
    when: { en: "May be exempt from isolation with a valid microchip plus user and professional-training certificates, on passing on-site quarantine.", fr: "Peuvent être exemptés d'isolement avec une puce valide plus les certificats d'utilisateur et de formation professionnelle, en passant la quarantaine sur place.", es: "Pueden quedar exentos de aislamiento con un microchip válido más los certificados de usuario y de formación profesional, al superar la cuarentena in situ.", pt: "Podem ficar isentos do isolamento com um microchip válido mais os certificados de usuário e de treinamento profissional, ao passarem na quarentena no local." }
    exceptions: { en: "Assistance dogs without a vaccination certificate may be vaccinated on arrival on application.", fr: "Un chien d'assistance sans certificat de vaccination peut être vacciné à l'arrivée sur demande.", es: "Un perro de asistencia sin certificado de vacunación puede ser vacunado a la llegada, previa solicitud.", pt: "Um cão de assistência sem certificado de vacinação pode ser vacinado na chegada, mediante pedido." }
    ref: { en: "GACC Announcement [2019] No. 5, Art. II(3) & III", fr: "Annonce GACC [2019] n° 5, art. II(3) & III", es: "Anuncio GACC [2019] n.º 5, art. II(3) y III", pt: "Anúncio GACC [2019] nº 5, art. II(3) e III" }
  - item: { en: "Parasite (tick / tapeworm) treatment", fr: "Traitement antiparasitaire (tiques / échinococcose)", es: "Tratamiento antiparasitario (garrapatas / tenia)", pt: "Tratamento antiparasitário (carrapatos / tênia)" }
    required: { en: "Recommended, not mandatory", fr: "Recommandé, non obligatoire", es: "Recomendado, no obligatorio", pt: "Recomendado, não obrigatório" }
    when: { en: "GACC does not mandate a tapeworm treatment; treating against ticks and worms before travel is good practice.", fr: "La GACC n'impose pas de traitement contre l'échinococcose ; traiter contre les tiques et les vers avant le voyage est une bonne pratique.", es: "La GACC no exige un tratamiento contra la tenia; tratar contra las garrapatas y los gusanos antes del viaje es una buena práctica.", pt: "A GACC não exige tratamento contra tênia; tratar contra carrapatos e vermes antes da viagem é uma boa prática." }
    exceptions: { en: "Confirm any additional treatments with your vet.", fr: "Confirme tout traitement supplémentaire avec ton vétérinaire.", es: "Confirma cualquier tratamiento adicional con tu veterinario.", pt: "Confirme com seu veterinário qualquer tratamento adicional." }
    ref: { en: "GACC Announcement [2019] No. 5", fr: "Annonce GACC [2019] n° 5", es: "Anuncio GACC [2019] n.º 5", pt: "Anúncio GACC [2019] nº 5" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Not specified", fr: "Non précisé", es: "No especificada", pt: "Não especificada" }
    when: { en: "GACC's announcement sets no explicit minimum age; a valid rabies vaccination is nonetheless required.", fr: "L'annonce GACC ne fixe pas d'âge minimum explicite ; une vaccination antirabique valide reste néanmoins exigée.", es: "El anuncio de la GACC no fija una edad mínima explícita; no obstante, se exige una vacunación antirrábica válida.", pt: "O anúncio da GACC não fixa idade mínima explícita; ainda assim, é exigida uma vacinação antirrábica válida." }
    exceptions: { en: "Unknown — confirm with the destination customs district for very young puppies.", fr: "Non communiqué — vérifier auprès du bureau de douane de destination pour les très jeunes chiots.", es: "Desconocido — verifícalo con la oficina de aduanas de destino para los cachorros muy jóvenes.", pt: "Não informado — verifique com a repartição aduaneira de destino no caso de filhotes muito novos." }
    ref: { en: "GACC Announcement [2019] No. 5", fr: "Annonce GACC [2019] n° 5", es: "Anuncio GACC [2019] n.º 5", pt: "Anúncio GACC [2019] nº 5" }

origin:
  scheme: own
  eu:
    title: { en: "Designated country/region — no isolation", fr: "Pays/région désigné — pas d'isolement", es: "País/región designado — sin aislamiento", pt: "País/região designado — sem isolamento" }
    body:
      en: "A dog coming from a GACC-designated country or region needs a valid electronic microchip, a valid rabies vaccination and the official quarantine and vaccination certificate from the exit authority. No rabies antibody test is required: if the dog passes the on-site quarantine at the port, it is released without the 30-day isolation. The list of designated countries/regions is set by GACC and can change — verify it before you travel."
      fr: "Un chien venant d'un pays ou d'une région désigné par la GACC a besoin d'une puce électronique valide, d'une vaccination antirabique valide et du certificat officiel de quarantaine et de vaccination de l'autorité de départ. Aucun titrage antirabique n'est exigé : si le chien passe la quarantaine sur place au port, il est libéré sans les 30 jours d'isolement. La liste des pays/régions désignés est fixée par la GACC et peut évoluer — vérifie-la avant de partir."
      es: "Un perro que llega de un país o región designado por la GACC necesita un microchip electrónico válido, una vacunación antirrábica válida y el certificado oficial de cuarentena y vacunación de la autoridad de salida. No se exige ninguna prueba de titulación de rabia: si el perro supera la cuarentena in situ en el puerto, se libera sin los 30 días de aislamiento. La lista de países/regiones designados la fija la GACC y puede cambiar — verifícala antes de viajar."
      pt: "Um cachorro que vem de um país ou região designado pela GACC precisa de um microchip eletrônico válido, de uma vacinação antirrábica válida e do certificado oficial de quarentena e vacinação da autoridade do país de saída. Nenhum teste sorológico antirrábico é exigido: se o cachorro passar na quarentena no local, no porto, ele é liberado sem os 30 dias de isolamento. A lista de países/regiões designados é definida pela GACC e pode mudar — confira antes de viajar."
    cls: ok
  listed:
    title: { en: "Non-designated + rabies antibody test", fr: "Non désigné + titrage antirabique", es: "No designado + prueba de titulación de rabia", pt: "Não designado + teste sorológico antirrábico" }
    body:
      en: "From a non-designated country, add a rabies antibody test: a report from a GACC-designated laboratory showing an antibody level above 0.5 IU/ml. With the microchip, valid rabies vaccination, official exit certificate and this test, and after passing the on-site quarantine, the dog is exempt from the 30-day isolation. Plan ahead: the blood test and its processing take time."
      fr: "Depuis un pays non désigné, ajoute un titrage antirabique : un rapport d'un laboratoire agréé par la GACC indiquant un titrage supérieur à 0,5 UI/ml. Avec la puce, la vaccination antirabique valide, le certificat officiel de départ et ce test, et après avoir passé la quarantaine sur place, le chien est exempté des 30 jours d'isolement. Anticipe : la prise de sang et son traitement prennent du temps."
      es: "Desde un país no designado, añade una prueba de titulación de rabia: un informe de un laboratorio autorizado por la GACC que indique un nivel de anticuerpos superior a 0,5 UI/ml. Con el microchip, la vacunación antirrábica válida, el certificado oficial de salida y esta prueba, y tras superar la cuarentena in situ, el perro queda exento de los 30 días de aislamiento. Anticípate: el análisis de sangre y su tramitación llevan tiempo."
      pt: "Vindo de um país não designado, acrescente um teste sorológico antirrábico: um laudo de laboratório designado pela GACC indicando um nível de anticorpos acima de 0,5 UI/ml. Com o microchip, a vacinação antirrábica válida, o certificado oficial de saída e esse teste, e depois de passar na quarentena no local, o cachorro fica isento dos 30 dias de isolamento. Antecipe-se: a coleta de sangue e o processamento levam tempo."
    cls: warn
  nonListed:
    title: { en: "No valid antibody test — 30-day quarantine", fr: "Sans titrage valide — quarantaine de 30 jours", es: "Sin prueba de titulación válida — cuarentena de 30 días", pt: "Sem teste sorológico válido — quarentena de 30 dias" }
    body:
      en: "A dog from a non-designated country without a valid rabies antibody test is placed in isolation quarantine for 30 days (withholding period included) at a customs-designated facility, and must enter through a port equipped with quarantine facilities. The owner bears all costs. If the quota, certificates or port conditions are not met, customs may return or dispose of the pet."
      fr: "Un chien venant d'un pays non désigné sans titrage antirabique valide est placé en quarantaine d'isolement pendant 30 jours (période de rétention incluse) dans une installation désignée par la douane, et doit entrer par un port doté d'installations de quarantaine. Le propriétaire en assume tous les frais. Si le quota, les certificats ou les conditions de port ne sont pas respectés, la douane peut réexpédier ou éliminer l'animal."
      es: "Un perro que llega de un país no designado sin una prueba de titulación de rabia válida es puesto en cuarentena de aislamiento durante 30 días (periodo de retención incluido) en una instalación designada por las aduanas, y debe entrar por un puerto dotado de instalaciones de cuarentena. El propietario asume todos los costes. Si no se cumplen el cupo, los certificados o las condiciones de puerto, las aduanas pueden devolver o eliminar a la mascota."
      pt: "Um cachorro vindo de um país não designado sem teste sorológico antirrábico válido é colocado em quarentena de isolamento por 30 dias (período de retenção incluído) em uma instalação designada pela alfândega, e precisa entrar por um porto com instalações de quarentena. O proprietário arca com todos os custos. Se a cota, os certificados ou as condições do porto não forem cumpridos, a alfândega pode devolver ou eliminar o animal."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches China depends on its classification and your documents."
    fr: "Ce qui se passe à l'arrivée de ton chien en Chine dépend de son classement et de tes documents."
    es: "Lo que ocurre cuando tu perro llega a China depende de su clasificación y de tus documentos."
    pt: "O que acontece quando seu cachorro chega à China depende da classificação dele e dos seus documentos."
  points:
    - en: "Enter through a port with isolation and quarantine facilities if your dog may need quarantine; the list of such ports is published by GACC."
      fr: "Entre par un port doté d'installations d'isolement et de quarantaine si ton chien peut nécessiter une quarantaine ; la liste de ces ports est publiée par la GACC."
      es: "Entra por un puerto con instalaciones de aislamiento y cuarentena si tu perro puede necesitar cuarentena; la lista de esos puertos la publica la GACC."
      pt: "Entre por um porto com instalações de isolamento e quarentena se o seu cachorro puder precisar de quarentena; a lista desses portos é publicada pela GACC."
    - en: "Declare the pet to Customs (red channel) and present the microchip, rabies vaccination certificate, official quarantine certificate and, if applicable, the rabies antibody test report."
      fr: "Déclare l'animal à la douane (couloir rouge) et présente la puce, le certificat de vaccination antirabique, le certificat officiel de quarantaine et, le cas échéant, le rapport de titrage antirabique."
      es: "Declara la mascota en la aduana (canal rojo) y presenta el microchip, el certificado de vacunación antirrábica, el certificado oficial de cuarentena y, si procede, el informe de la prueba de titulación de rabia."
      pt: "Declare o animal à alfândega (canal vermelho) e apresente o microchip, o certificado de vacinação antirrábica, o certificado oficial de quarentena e, se for o caso, o laudo do teste sorológico antirrábico."
    - en: "Customs carries out an on-site quarantine check; dogs that qualify for exemption are released, others are held for 30 days of isolation."
      fr: "La douane effectue un contrôle de quarantaine sur place ; les chiens éligibles à l'exemption sont libérés, les autres sont retenus 30 jours en isolement."
      es: "La aduana realiza un control de cuarentena in situ; los perros que reúnen las condiciones de exención se liberan, los demás quedan retenidos 30 días en aislamiento."
      pt: "A alfândega faz uma inspeção de quarentena no local; os cachorros que se enquadram na isenção são liberados, os demais ficam retidos 30 dias em isolamento."
    - en: "Only one dog or one cat per person is accepted; exceeding the quota triggers return or disposal of the extra pet."
      fr: "Un seul chien ou chat par personne est accepté ; dépasser le quota entraîne la réexpédition ou l'élimination de l'animal en trop."
      es: "Solo se acepta un perro o un gato por persona; superar el cupo conlleva la devolución o la eliminación de la mascota sobrante."
      pt: "Só é aceito um cachorro ou um gato por pessoa; passar da cota leva à devolução ou à eliminação do animal excedente."
    - en: "If certificates are missing or invalid, or the dog fails the on-site check, customs may return the pet within a set period or dispose of it — at the owner's expense."
      fr: "Si les certificats manquent ou sont invalides, ou si le chien échoue au contrôle sur place, la douane peut réexpédier l'animal dans un délai fixé ou l'éliminer — aux frais du propriétaire."
      es: "Si faltan certificados o no son válidos, o si el perro no supera el control in situ, las aduanas pueden devolver a la mascota en un plazo fijado o eliminarla — a cargo del propietario."
      pt: "Se faltarem certificados ou eles forem inválidos, ou se o cachorro não passar na inspeção no local, a alfândega pode devolver o animal dentro de um prazo fixado ou eliminá-lo — às custas do proprietário."

travellerExperience: null

restrictedDogs:
  intro:
    en: "China sets no national breed ban for importing pet dogs — dogs and cats are admitted as pets under customs rules. However, many Chinese cities restrict large or so-called 'fierce' dogs locally, so a dog you may legally import can still be barred from being kept in a given city."
    fr: "La Chine n'impose aucune interdiction nationale de race à l'importation — chiens et chats sont admis comme animaux de compagnie selon les règles douanières. Toutefois, de nombreuses villes chinoises restreignent localement les grands chiens ou chiens dits « féroces », de sorte qu'un chien légalement importable peut néanmoins être interdit de détention dans une ville donnée."
    es: "China no impone ninguna prohibición nacional de razas para la importación de perros de compañía — los perros y gatos se admiten como mascotas según las normas aduaneras. No obstante, muchas ciudades chinas restringen localmente a los perros grandes o llamados «feroces», de modo que un perro que puedes importar legalmente puede quedar, aun así, prohibido para su tenencia en una ciudad determinada."
    pt: "A China não impõe nenhuma proibição nacional de raças para a importação de cachorros de estimação — cães e gatos são admitidos como animais de estimação segundo as regras aduaneiras. No entanto, muitas cidades chinesas restringem localmente os cachorros grandes ou considerados “ferozes”, de modo que um cachorro que você pode importar legalmente ainda assim pode ser proibido de ser mantido em determinada cidade."
  cat1:
    en: "City-level bans: Beijing, for example, prohibits keeping dogs taller than about 35 cm at the shoulder in its central management districts and lists dozens of large breeds; Shanghai and Chengdu publish their own lists of restricted 'fierce' breeds (mastiff types, pit bull / Staffordshire types, Rottweiler and similar). These are local dog-keeping rules, not import rules."
    fr: "Interdictions au niveau des villes : Pékin, par exemple, interdit la détention de chiens de plus d'environ 35 cm au garrot dans ses districts centraux et liste des dizaines de grandes races ; Shanghai et Chengdu publient leurs propres listes de races « féroces » restreintes (types mastiff, type pit-bull / Staffordshire, Rottweiler et similaires). Ce sont des règles locales de détention, non des règles d'importation."
    es: "Prohibiciones a nivel de ciudad: Pekín, por ejemplo, prohíbe la tenencia de perros de más de unos 35 cm a la cruz en sus distritos centrales de gestión y enumera decenas de razas grandes; Shanghái y Chengdú publican sus propias listas de razas «feroces» restringidas (tipos mastín, tipo pit bull / Staffordshire, Rottweiler y similares). Son normas locales de tenencia, no normas de importación."
    pt: "Proibições municipais: Pequim, por exemplo, proíbe manter cachorros com mais de cerca de 35 cm de altura na cernelha nos seus distritos centrais de gestão e lista dezenas de raças grandes; Xangai e Chengdu publicam as próprias listas de raças “ferozes” restritas (tipos mastim, tipo pit bull / Staffordshire, Rottweiler e semelhantes). São regras locais de posse, não regras de importação."
  cat2:
    en: "These municipal lists vary from city to city and are updated periodically. Confirm the current rules with the local public-security bureau or dog-registration authority of your destination city before you travel."
    fr: "Ces listes municipales varient d'une ville à l'autre et sont mises à jour périodiquement. Vérifie les règles en vigueur auprès du bureau de la sécurité publique ou de l'autorité d'enregistrement canin de ta ville de destination avant de partir."
    es: "Estas listas municipales varían de una ciudad a otra y se actualizan periódicamente. Confirma las normas vigentes con la oficina local de seguridad pública o la autoridad de registro canino de tu ciudad de destino antes de viajar."
    pt: "Essas listas municipais variam de cidade para cidade e são atualizadas periodicamente. Confirme as regras em vigor com o órgão local de segurança pública ou com a autoridade de registro canino da sua cidade de destino antes de viajar."
  note:
    en: "A dog that clears customs may still be un-keepable in a particular city because of its breed or size. Always check the destination city's list, not only the national import scheme."
    fr: "Un chien qui passe la douane peut néanmoins être impossible à détenir dans une ville donnée en raison de sa race ou de sa taille. Vérifie toujours la liste de la ville de destination, pas seulement le régime national d'importation."
    es: "Un perro que pasa la aduana puede, aun así, resultar imposible de tener en una ciudad determinada por su raza o su tamaño. Verifica siempre la lista de la ciudad de destino, no solo el régimen nacional de importación."
    pt: "Um cachorro que passa pela alfândega ainda assim pode ser impossível de manter em determinada cidade por causa da raça ou do porte. Confira sempre a lista da cidade de destino, não só o regime nacional de importação."

checklist:
