# Country Entry Guide — Peru (trilingual EN/FR/ES).
# Peru is NOT in the EU. This encodes Peru's own SENASA scheme (Servicio Nacional de Sanidad Agraria).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_pe
iso2: "PE"
name: { en: "Peru", fr: "Pérou", es: "Perú", pt: "Peru" }
region: { en: "South America", fr: "Amérique du Sud", es: "América del Sur", pt: "América do Sul" }


regime: non_listed
exit:
  authority: SENASA
  authorityUrl: https://www.senasa.gob.pe/senasacontigo/senasa-viajas-con-tu-mascota-conoce-cuales-son-los-requisitos-sanitarios-para-ingresar-o-salir-de-peru/
  intro:
    en: "Peru is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export sanitary certificate from SENASA."
    fr: "Le Pérou est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export du SENASA."
    es: "Perú no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación del SENASA."
    pt: "O Peru é um país não listado, então um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um certificado sanitário de exportação do SENASA."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "Request the SENASA export certificate at least 72 hours before travel, with the destination's requirements, a current health certificate and vaccination record; SENASA inspects the dog before certifying."
        fr: "Demande le certificat d'export SENASA au moins 72 h avant le voyage, avec les exigences de destination, un certificat sanitaire à jour et le carnet de vaccination ; le SENASA examine le chien avant de certifier."
        es: "Solicita el certificado de exportación del SENASA al menos 72 horas antes del viaje, con los requisitos del destino, un certificado sanitario vigente y el registro de vacunación; el SENASA inspecciona al perro antes de certificar."
        pt: "Peça o certificado de exportação do SENASA pelo menos 72 horas antes da viagem, com as exigências do destino, um atestado de saúde em dia e a carteira de vacinação; o SENASA inspeciona o cachorro antes de certificar."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Peru with your dog", fr: "Voyager au Pérou avec ton chien", es: "Viajar a Perú con tu perro", pt: "Viajar para o Peru com o seu cachorro" }
  intro:
    en: >-
      Peru welcomes dogs, and its entry rules are the same for a personal pet arriving from almost
      anywhere. SENASA (Servicio Nacional de Sanidad Agraria, the national animal-health authority)
      asks for one core document: an original export health certificate issued by the official
      veterinary authority of the country you travel from. It must show current vaccinations —
      including rabies for a dog over three months old — and internal and external deworming done
      within 30 days before travel. There is no rabies antibody test and no general quarantine for a
      healthy pet; SENASA simply carries out a clinical inspection on arrival, mainly at Jorge Chávez
      International Airport in Lima. A dog travelling as accompanied baggage usually clears customs
      without paying import duties. This guide explains exactly what to prepare, and the timing to
      respect, before you book your flight.
    fr: >-
      Le Pérou accueille les chiens, et ses règles d'entrée sont identiques pour un animal de compagnie
      venant de presque partout. Le SENASA (Servicio Nacional de Sanidad Agraria, l'autorité sanitaire
      animale nationale) demande un document essentiel : un certificat sanitaire d'exportation original
      émis par l'autorité vétérinaire officielle du pays d'où tu voyages. Il doit attester des
      vaccinations à jour — dont la rage pour un chien de plus de trois mois — et un traitement
      antiparasitaire interne et externe réalisé dans les 30 jours avant le voyage. Il n'y a pas de
      titrage antirabique ni de quarantaine générale pour un animal en bonne santé ; le SENASA effectue
      simplement une inspection clinique à l'arrivée, principalement à l'aéroport international Jorge
      Chávez de Lima. Un chien voyageant en bagage accompagné passe généralement la douane sans payer de
      droits d'importation. Ce guide détaille quoi préparer, et les délais à respecter, avant de réserver.
    es: >-
      Perú acoge a los perros, y sus normas de entrada son las mismas para una mascota personal que
      llega desde casi cualquier lugar. El SENASA (Servicio Nacional de Sanidad Agraria, la autoridad
      nacional de sanidad animal) pide un documento esencial: un certificado sanitario de exportación
      original emitido por la autoridad veterinaria oficial del país desde el que viajas. Debe acreditar
      las vacunas al día — incluida la rabia para un perro de más de tres meses — y una desparasitación
      interna y externa realizada dentro de los 30 días previos al viaje. No hay prueba de titulación de
      rabia ni cuarentena general para una mascota sana; el SENASA simplemente realiza una inspección
      clínica a la llegada, principalmente en el Aeropuerto Internacional Jorge Chávez de Lima. Un perro
      que viaja como equipaje acompañado suele pasar la aduana sin pagar derechos de importación. Esta
      guía explica exactamente qué preparar, y los plazos que respetar, antes de reservar tu vuelo.

    pt: "O Peru recebe bem os cachorros, e suas regras de entrada são as mesmas para um animal de estimação que chega de quase qualquer lugar. O SENASA (Servicio Nacional de Sanidad Agraria, a autoridade nacional de saúde animal) pede um documento central: um atestado de saúde de exportação original, emitido pela autoridade veterinária oficial do país de onde você viaja. Ele deve trazer as vacinações em dia — inclusive a antirrábica para um cachorro com mais de três meses — e a vermifugação interna e externa feita nos 30 dias anteriores à viagem. Não há teste sorológico antirrábico nem quarentena geral para um animal saudável; o SENASA apenas faz uma inspeção clínica na chegada, principalmente no Aeroporto Internacional Jorge Chávez, em Lima. Um cachorro que viaja como bagagem acompanhada normalmente é liberado na alfândega sem pagar impostos de importação. Este guia explica exatamente o que preparar, e os prazos a respeitar, antes de você comprar a passagem."
difficulty:
  level: easy
  label: { en: "Easy — one uniform SENASA scheme for most origins", fr: "Facile — un régime SENASA uniforme pour la plupart des origines", es: "Fácil — un régimen SENASA uniforme para la mayoría de los orígenes", pt: "Fácil — um esquema único do SENASA para a maioria das origens" }

prepTime:
  eu:
    en: "Standard case: a few days to assemble the export health certificate once vaccinations are valid and deworming is done within 30 days before travel."
    fr: "Cas standard : quelques jours pour réunir le certificat sanitaire d'exportation une fois les vaccinations valides et le traitement antiparasitaire fait dans les 30 jours avant le voyage."
    es: "Caso estándar: unos días para reunir el certificado sanitario de exportación una vez que las vacunas son válidas y la desparasitación se ha hecho dentro de los 30 días previos al viaje."
    pt: "Caso padrão: alguns dias para montar o atestado de saúde de exportação, uma vez que as vacinações estejam válidas e a vermifugação tenha sido feita nos 30 dias anteriores à viagem."
  listed:
    en: "If the rabies shot is still needed: allow extra time, as rabies vaccination is mandatory from 3 months of age and must be valid at travel."
    fr: "Si la vaccination antirabique reste à faire : prévois du temps, la rage étant obligatoire dès 3 mois et devant être valide au voyage."
    es: "Si aún falta la vacuna antirrábica: prevé tiempo adicional, ya que la vacunación antirrábica es obligatoria desde los 3 meses de edad y debe ser válida en el momento del viaje."
    pt: "Se a vacina antirrábica ainda estiver pendente: conte um tempo a mais, já que a vacinação antirrábica é obrigatória a partir dos 3 meses de idade e precisa estar válida no dia da viagem."
  nonListed:
    en: "Non-compliant arrivals: if documents are missing, SENASA determines a sanitary measure on the spot, which can mean delays and costs — always prepare in advance."
    fr: "Arrivées non conformes : si des documents manquent, le SENASA fixe une mesure sanitaire sur place, avec délais et frais possibles — prépare toujours à l'avance."
    es: "Llegadas no conformes: si faltan documentos, el SENASA determina una medida sanitaria en el momento, lo que puede suponer demoras y costes — prepáralo siempre con antelación."
    pt: "Chegadas fora das regras: se faltarem documentos, o SENASA define na hora uma medida sanitária, o que pode significar atrasos e custos — prepare tudo sempre com antecedência."

