restrictedDogs:
  intro:
    en: "Thailand's Department of Livestock Development does not ban any dog breed from importation: no breed is prohibited from entering the country, and the import requirements are the same for every breed."
    fr: "Le Département du développement de l'élevage de Thaïlande n'interdit aucune race de chien à l'importation : aucune race n'est prohibée d'entrée, et les exigences d'importation sont identiques pour toutes les races."
    es: "El Department of Livestock Development de Tailandia no prohíbe la importación de ninguna raza de perro: ninguna raza tiene prohibida la entrada al país, y los requisitos de importación son los mismos para todas las razas."
    pt: "O Department of Livestock Development da Tailândia não proíbe a importação de nenhuma raça de cachorro: nenhuma raça está proibida de entrar no país, e as exigências de importação são as mesmas para todas as raças."
  cat1:
    en: "There is no national breed-specific import ban. Breeds restricted in some other countries (pit-bull types, Tosa, Rottweiler and similar) are not prohibited from entering Thailand by the DLD."
    fr: "Il n'existe aucune interdiction d'importation liée à la race au niveau national. Les races restreintes dans certains autres pays (types pit-bull, Tosa, Rottweiler et similaires) ne sont pas interdites d'entrée en Thaïlande par le DLD."
    es: "No existe ninguna prohibición nacional de importación por raza. Las razas restringidas en algunos otros países (tipos pit bull, Tosa, Rottweiler y similares) no tienen prohibida la entrada en Tailandia por el DLD."
    pt: "Não existe proibição nacional de importação por raça. As raças restritas em alguns outros países (tipos pit bull, Tosa, Rottweiler e semelhantes) não são proibidas de entrar na Tailândia pelo DLD."
  cat2:
    en: "Restrictions come instead from airlines and local rules: many carriers refuse or restrict snub-nosed (brachycephalic) breeds in the hold, and city ordinances (for example Bangkok's BMA) limit how many dogs a household or condominium may keep once resident. These are not import bans."
    fr: "Les restrictions proviennent plutôt des compagnies aériennes et des règles locales : de nombreux transporteurs refusent ou limitent les races brachycéphales (au nez court) en soute, et des arrêtés municipaux (par exemple la BMA de Bangkok) plafonnent le nombre de chiens qu'un foyer ou un condominium peut détenir une fois résident. Ce ne sont pas des interdictions d'importation."
    es: "Las restricciones proceden más bien de las aerolíneas y de las normas locales: muchas compañías rechazan o limitan las razas de hocico chato (braquicéfalas) en la bodega, y las ordenanzas municipales (por ejemplo la BMA de Bangkok) limitan cuántos perros puede tener un hogar o un condominio una vez residente. No son prohibiciones de importación."
    pt: "As restrições vêm, na verdade, das companhias aéreas e das regras locais: muitas transportadoras recusam ou restringem raças de focinho achatado (braquicefálicas) no porão, e normas municipais (por exemplo a BMA, de Bangkok) limitam quantos cachorros uma residência ou um condomínio pode manter depois que você se instala. Isso não são proibições de importação."
  note:
    en: "Because airline breed policies are stricter than Thai import law, confirm your dog's breed is accepted by your carrier before booking, and check local keeping rules for where you will live."
    fr: "Comme les politiques de race des compagnies aériennes sont plus strictes que la loi thaïlandaise d'importation, vérifie que la race de ton chien est acceptée par ton transporteur avant de réserver, et vérifie les règles locales de détention là où tu résideras."
    es: "Dado que las políticas de raza de las aerolíneas son más estrictas que la ley de importación tailandesa, confirma que tu aerolínea acepta la raza de tu perro antes de reservar, y comprueba las normas locales de tenencia del lugar donde vayas a vivir."
    pt: "Como as políticas de raça das companhias aéreas são mais rígidas que a lei tailandesa de importação, confirme que a raça do seu cachorro é aceita pela sua companhia aérea antes de reservar e verifique as regras locais de posse do lugar onde você vai morar."

checklist:
  - en: "Import permit applied for by email to the AQS (Form R1/1), 60-7 days before departure"
    fr: "Permis d'importation demandé par e-mail à l'AQS (formulaire R1/1), 60 à 7 jours avant le départ"
    es: "Permiso de importación solicitado por correo electrónico a la AQS (formulario R1/1), 60-7 días antes de la salida"
    pt: "Autorização de importação solicitada por e-mail à AQS (formulário R1/1), 60 a 7 dias antes da partida"
  - en: "ISO 11784/11785 microchip; number matches every document"
    fr: "Puce ISO 11784/11785 ; numéro correspondant à chaque document"
    es: "Microchip ISO 11784/11785; el número coincide con todos los documentos"
    pt: "Microchip ISO 11784/11785; número que coincide com todos os documentos"
  - en: "Valid rabies vaccination (dog ≥12 weeks at the shot; +21 days for a primary dose)"
    fr: "Vaccination antirabique valide (chien ≥12 semaines ; +21 jours pour une primo-dose)"
    es: "Vacunación antirrábica válida (perro ≥12 semanas en la vacuna; +21 días para una dosis primaria)"
    pt: "Vacinação antirrábica válida (cachorro ≥12 semanas na aplicação; +21 dias para uma dose primária)"
  - en: "Core vaccinations: distemper, hepatitis, parvovirus and leptospirosis (records in English)"
    fr: "Vaccins de base : Carré, hépatite, parvovirose et leptospirose (enregistrements en anglais)"
    es: "Vacunas básicas: moquillo, hepatitis, parvovirus y leptospirosis (registros en inglés)"
    pt: "Vacinas essenciais: cinomose, hepatite, parvovirose e leptospirose (registros em inglês)"
  - en: "Negative leptospirosis test within 30 days if no valid leptospirosis vaccine"
    fr: "Test leptospirose négatif dans les 30 jours si pas de vaccin leptospirose valide"
    es: "Prueba de leptospirosis negativa dentro de los 30 días si no hay una vacuna de leptospirosis válida"
    pt: "Teste de leptospirose negativo nos 30 dias anteriores se não houver vacina de leptospirose válida"
  - en: "Rabies antibody test only if the DLD requests it for your origin"
    fr: "Titrage antirabique uniquement si le DLD l'exige pour ton origine"
    es: "Prueba de titulación de rabia solo si el DLD la exige para tu origen"
    pt: "Teste sorológico antirrábico somente se o DLD exigir para a sua origem"
  - en: "Original government-endorsed health certificate (issued shortly before travel)"
    fr: "Certificat sanitaire officiel original visé (établi peu avant le voyage)"
    es: "Certificado sanitario oficial original refrendado (expedido poco antes del viaje)"
    pt: "Atestado de saúde oficial original endossado (emitido pouco antes da viagem)"
  - en: "Printed import permit and passport ready for the AQS; budget 500 baht per animal"
    fr: "Permis d'importation imprimé et passeport prêts pour l'AQS ; prévoir 500 bahts par animal"
    es: "Permiso de importación impreso y pasaporte listos para la AQS; presupuesta 500 bahts por animal"
    pt: "Autorização de importação impressa e passaporte prontos para a AQS; reserve 500 bahts por animal"
  - en: "compliant with the applicable requirements crate; confirm your dog's breed is accepted by the airline"
    fr: "Caisse conforme aux exigences applicables ; vérifie que la race de ton chien est acceptée par la compagnie"
    es: "Jaula conforme con la IATA; confirma que la aerolínea acepta la raza de tu perro"
    pt: "Caixa de transporte conforme a IATA; confirme que a raça do seu cachorro é aceita pela companhia aérea"

