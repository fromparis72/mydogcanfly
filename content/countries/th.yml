# Country Entry Guide — Thailand (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
# Thailand is NOT in the EU. It runs its own scheme via the Department of Livestock
# Development (DLD) and the Animal Quarantine Station (AQS) at each airport:
# an Import Permit must be applied for in advance (Form R1/1, 7-60 days before departure);
# ISO microchip -> rabies + core vaccinations (distemper, hepatitis, parvovirus, leptospirosis)
# -> government-endorsed health certificate issued shortly before travel -> on arrival the AQS
# issues a Notice of Import Approval (Form R-6) and an Import License (Form R-7), then Customs clearance.
# A rabies antibody test is not routine but may be requested for high-risk-rabies origins.
# The eu/listed/nonListed slots are repurposed to Thailand's practical paths:
# eu = compliant dog with valid booster vaccinations (fastest); listed = primary/lapsed vaccination
# (21-day wait + possible leptospirosis test); nonListed = high-rabies-risk origin or a
# non-compliant arrival (antibody test may be requested; detention/quarantine possible).
id: country_th
iso2: "TH"
name: { en: "Thailand", fr: "Thaïlande", es: "Tailandia", pt: "Tailândia" }
region: { en: "Asia", fr: "Asie", es: "Asia", pt: "Ásia" }


regime: non_listed
domestic:
  intro:
    en: "Domestic flight in Thailand: no national document is required for a pet dog — but a declared epidemic zone changes everything."
    fr: "Vol intérieur en Thaïlande : aucun document national n'est exigé pour un chien de compagnie — mais une zone d'épizootie déclarée change tout."
    es: "Vuelo nacional en Tailandia: no se exige ningún documento nacional para un perro de compañía — pero una zona epidémica declarada lo cambia todo."
    pt: "Voo doméstico na Tailândia: nenhum documento nacional é exigido para um cachorro de estimação — mas uma zona de epidemia declarada muda tudo."
  points:
    - en: "Dogs are deliberately absent from the list of species needing an inter-provincial movement licence, which covers livestock and poultry."
      fr: "Les chiens sont délibérément absents de la liste des espèces nécessitant une licence de mouvement interprovincial, qui vise le bétail et la volaille."
      es: "Los perros están deliberadamente ausentes de la lista de especies que necesitan licencia de movimiento interprovincial, que cubre ganado y aves."
      pt: "Os cachorros estão deliberadamente ausentes da lista de espécies que precisam de licença de trânsito interprovincial, que cobre o gado e as aves."
    - en: "But inside a declared epidemic or surveillance zone naming dogs, no one may move an animal in, out, through or within the zone without written permission from the responsible veterinarian, every single time. Rabies zones are declared routinely at sub-district level — check with the livestock office at your origin."
      fr: "Mais à l'intérieur d'une zone d'épizootie ou de surveillance déclarée visant les chiens, nul ne peut déplacer un animal vers, hors, à travers ou dans la zone sans autorisation écrite du vétérinaire responsable, à chaque fois. Des zones rabiques sont déclarées couramment au niveau des sous-districts — renseigne-toi auprès du bureau de l'élevage de ton point de départ."
      es: "Pero dentro de una zona epidémica o de vigilancia declarada que nombre a los perros, nadie puede mover un animal hacia, fuera, a través o dentro de la zona sin permiso escrito del veterinario responsable, cada vez. Las zonas de rabia se declaran habitualmente a nivel de subdistrito — consulta la oficina de ganadería de tu origen."
      pt: "Mas dentro de uma zona de epidemia ou de vigilância declarada que mencione cachorros, ninguém pode movimentar um animal para dentro, para fora, através ou dentro da zona sem autorização por escrito do veterinário responsável, e isso todas as vezes. Zonas de raiva são declaradas rotineiramente em nível de subdistrito — consulte o escritório de pecuária do seu local de origem."
    - en: "No Thai carrier is confirmed to allow a dog in the cabin: expect hold or cargo, a health certificate within 24 hours on some routes, and long banned-breed lists."
      fr: "Aucune compagnie thaïlandaise n'est confirmée comme autorisant le chien en cabine : prévois la soute ou le fret, un certificat de santé de moins de 24 heures sur certaines lignes, et de longues listes de races interdites."
      es: "Ninguna aerolínea tailandesa está confirmada como que permita perros en cabina: cuenta con bodega o carga, certificado de salud de menos de 24 horas en algunas rutas, y largas listas de razas prohibidas."
      pt: "Nenhuma companhia aérea tailandesa está confirmada como autorizando cachorro na cabine: conte com porão ou carga, um atestado de saúde emitido nas 24 horas anteriores em algumas rotas e longas listas de raças proibidas."
exit:
  authority: DLD (Department of Livestock Development)
  authorityUrl: https://www.dld.go.th
  intro:
    en: "Thailand is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus a DLD export licence and health certificate."
    fr: "La Thaïlande est un pays non listé : un titrage antirabique valide est obligatoire pour revenir dans l'UE — plus une licence d'export et un certificat sanitaire du DLD."
    es: "Tailandia no está listada: una titulación antirrábica válida es obligatoria para volver a la UE — más una licencia de exportación y un certificado sanitario del DLD."
    pt: "A Tailândia é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — mais uma licença de exportação e um atestado de saúde do DLD."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Make sure the rabies antibody titer is valid: blood sample taken at least 30 days after rabies vaccination, in an EU-approved lab (minimum export age 4 months)."
        fr: "Assure-toi que le titrage antirabique est valide : prise de sang au moins 30 jours après la vaccination antirabique, dans un labo agréé UE (âge minimum d'export : 4 mois)."
        es: "Asegúrate de que la titulación antirrábica sea válida: muestra de sangre tomada al menos 30 días tras la vacuna antirrábica, en un laboratorio aprobado por la UE (edad mínima de exportación: 4 meses)."
        pt: "Garanta que o teste sorológico antirrábico (titulação) esteja válido: coleta de sangue feita pelo menos 30 dias após a vacinação antirrábica, em um laboratório aprovado pela UE (idade mínima para exportação: 4 meses)."
    - timing: window
      scope: eu
      text:
        en: "Apply to the DLD for the export licence and EU health certificate, with the pre-export inspection done at the airport 48 hours before departure."
        fr: "Demande au DLD la licence d'export et le certificat sanitaire UE, avec l'inspection pré-export réalisée à l'aéroport 48 heures avant le départ."
        es: "Solicita al DLD la licencia de exportación y el certificado sanitario UE, con la inspección previa a la exportación realizada en el aeropuerto 48 horas antes de la salida."
        pt: "Solicite ao DLD a licença de exportação e o atestado de saúde da UE, com a inspeção pré-exportação feita no aeroporto 48 horas antes da partida."
    - timing: window
      scope: non_eu
      text:
        en: "Apply to the DLD for the export licence and health certificate, with the pre-export inspection done at the airport 48 hours before departure."
        fr: "Demande au DLD la licence d'export et le certificat sanitaire, avec l'inspection pré-export faite à l'aéroport 48 heures avant le départ."
        es: "Solicita al DLD la licencia de exportación y el certificado sanitario, con la inspección previa hecha en el aeropuerto 48 horas antes de la salida."
        pt: "Solicite ao DLD a licença de exportação e o certificado sanitário, com a inspeção pré-embarque feita no aeroporto 48 horas antes da partida."
  onSiteNote:
    en: "The titer is the trap — without a valid result your dog cannot re-enter the EU, and it can't be fixed at the last minute in Thailand."
    fr: "Le titrage est le piège — sans résultat valide, ton chien ne peut pas rentrer dans l'UE, et ça ne se rattrape pas à la dernière minute en Thaïlande."
    es: "La titulación es la trampa — sin un resultado válido tu perro no puede volver a la UE, y no se puede resolver a última hora en Tailandia."
    pt: "A titulação é a armadilha — sem um resultado válido o seu cachorro não pode voltar a entrar na UE, e isso não se resolve de última hora na Tailândia."

hero:
  h1: { en: "Traveling to Thailand with your dog", fr: "Voyager en Thaïlande avec ton chien", es: "Viajar a Tailandia con tu perro", pt: "Viajar para a Tailândia com o seu cachorro" }
  intro:
    en: >-
      Thailand welcomes dogs, but it runs its own import scheme through the Department of Livestock
      Development (DLD) — not the EU framework. The single most important step is to obtain an Import
      Permit before you fly: you apply by email to the Animal Quarantine Station (AQS) at the airport
      of entry between 60 and 7 days before departure, using application Form R1/1. Your dog needs an
      ISO microchip, a valid rabies vaccination and core vaccinations (distemper, hepatitis, parvovirus
      and leptospirosis), plus a government-endorsed veterinary health certificate issued shortly before
      travel. A rabies antibody test is not routinely required from rabies-controlled countries,
      but the DLD can request it for higher-risk origins. On arrival the AQS issues the Import License
      (Form R-7). Meet every condition and there is no quarantine.
    fr: >-
      La Thaïlande accueille les chiens, mais applique son propre régime d'importation via le Département
      du développement de l'élevage (DLD) — et non le cadre européen. L'étape la plus importante est
      d'obtenir un permis d'importation avant de partir : tu en fais la demande par e-mail auprès de
      la station de quarantaine animale (AQS) de l'aéroport d'entrée, entre 60 et 7 jours avant le
      départ, à l'aide du formulaire de demande R1/1. Ton chien a besoin d'une puce ISO, d'une
      vaccination antirabique valide et de vaccins de base (Carré, hépatite, parvovirose et leptospirose),
      ainsi que d'un certificat sanitaire vétérinaire visé par le gouvernement établi peu avant le voyage.
      Un titrage des anticorps antirabiques n'est pas exigé en routine depuis les pays à rage contrôlée,
      mais le DLD peut le demander pour les origines à risque plus élevé. À l'arrivée, l'AQS délivre la
      licence d'importation (formulaire R-7). Si toutes les conditions sont remplies, il n'y a pas de quarantaine.
    es: >-
      Tailandia acoge a los perros, pero aplica su propio régimen de importación a través del Department
      of Livestock Development (DLD) — y no el marco de la UE. El paso más importante es obtener un
      permiso de importación antes de volar: lo solicitas por correo electrónico a la estación de
      cuarentena animal (AQS) del aeropuerto de entrada, entre 60 y 7 días antes de la salida,
      mediante el formulario de solicitud R1/1. Tu perro necesita un microchip ISO, una vacunación
      antirrábica válida y las vacunas básicas (moquillo, hepatitis, parvovirus y leptospirosis), además
      de un certificado sanitario veterinario refrendado por el gobierno expedido poco antes del viaje.
      No se exige de forma rutinaria una prueba de titulación de rabia desde los países con rabia
      controlada, pero el DLD puede solicitarla para orígenes de mayor riesgo. A la llegada, la AQS
      expide la licencia de importación (formulario R-7). Si cumples todas las condiciones, no hay cuarentena.

    pt: "A Tailândia recebe cachorros, mas aplica o seu próprio regime de importação por meio do Department of Livestock Development (DLD) — e não o marco da UE. O passo mais importante é obter uma autorização de importação antes de voar: você faz o pedido por e-mail à Animal Quarantine Station (AQS) do aeroporto de entrada, entre 60 e 7 dias antes da partida, usando o formulário de solicitação R1/1. O seu cachorro precisa de um microchip ISO, de uma vacinação antirrábica válida e das vacinas essenciais (cinomose, hepatite, parvovirose e leptospirose), além de um certificado veterinário de saúde endossado pelo governo e emitido pouco antes da viagem. O teste sorológico antirrábico não é exigido de rotina para países com raiva controlada, mas o DLD pode solicitá-lo para origens de maior risco. Na chegada, a AQS emite a licença de importação (formulário R-7). Se todas as condições forem cumpridas, não há quarentena."
difficulty:
  level: moderate
  label: { en: "Moderate — an advance import permit is mandatory", fr: "Modéré — un permis d'importation préalable est obligatoire", es: "Moderado — es obligatorio un permiso de importación previo", pt: "Moderado — uma autorização de importação prévia é obrigatória" }

prepTime:
  eu:
    en: "Compliant dog (valid booster vaccinations): ~2-3 weeks — import permit (apply 60-7 days ahead), then a government health certificate issued shortly before travel; no 21-day wait."
    fr: "Chien conforme (rappels de vaccins valides) : ~2-3 semaines — permis d'importation (demande 60 à 7 jours avant), puis un certificat sanitaire officiel établi peu avant le voyage ; pas de délai de 21 jours."
    es: "Perro conforme (refuerzos de vacunas válidos): ~2-3 semanas — permiso de importación (solicita 60-7 días antes), luego un certificado sanitario oficial expedido poco antes del viaje; sin espera de 21 días."
    pt: "Cachorro em conformidade (reforços de vacina válidos): ~2-3 semanas — autorização de importação (peça de 60 a 7 dias antes), depois um atestado de saúde oficial emitido pouco antes da viagem; sem espera de 21 dias."
  listed:
    en: "Primary or lapsed vaccination: ~5-6 weeks — dog must be vaccinated at least 21 days before departure, plus a negative leptospirosis test if no valid leptospirosis vaccine."
    fr: "Vaccination primaire ou périmée : ~5-6 semaines — le chien doit être vacciné au moins 21 jours avant le départ, plus un test leptospirose négatif si le vaccin leptospirose n'est pas valide."
    es: "Vacunación primaria o caducada: ~5-6 semanas — el perro debe vacunarse al menos 21 días antes de la salida, más una prueba de leptospirosis negativa si no tiene una vacuna de leptospirosis válida."
    pt: "Vacinação primária ou vencida: ~5-6 semanas — o cachorro precisa ser vacinado pelo menos 21 dias antes da partida, mais um teste de leptospirose negativo se não houver vacina de leptospirose válida."
  nonListed:
    en: "High-rabies-risk origin or a non-compliant arrival: add a rabies antibody test if the DLD requests it (plan months ahead); non-compliant dogs may be detained/quarantined or returned at the owner's expense."
    fr: "Origine à risque rabique élevé ou arrivée non conforme : ajoute un titrage antirabique si le DLD le demande (prévois plusieurs mois) ; les chiens non conformes peuvent être retenus/mis en quarantaine ou renvoyés aux frais du propriétaire."
    es: "Origen de alto riesgo de rabia o llegada no conforme: añade una prueba de titulación de rabia si el DLD la solicita (planifica con meses de antelación); los perros no conformes pueden ser retenidos/puestos en cuarentena o devueltos a cargo del propietario."
    pt: "Origem de alto risco de raiva ou chegada fora de conformidade: acrescente um teste sorológico antirrábico se o DLD exigir (planeje com meses de antecedência); cachorros fora de conformidade podem ser retidos/colocados em quarentena ou devolvidos às custas do dono."

