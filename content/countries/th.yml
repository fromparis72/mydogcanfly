  - item: { en: "Import permit (DLD)", fr: "Permis d'importation (DLD)", es: "Permiso de importación (DLD)", pt: "Autorização de importação (DLD)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Apply by email to the AQS at the airport of entry between 60 and 7 days before departure, using Form R1/1 with passport copy, pet photo, flight itinerary, vaccination records (in English) and microchip certificate. Processing ~3-7 business days; permit valid 60 days.", fr: "Demande par e-mail à l'AQS de l'aéroport d'entrée, entre 60 et 7 jours avant le départ, via le formulaire R1/1 avec copie du passeport, photo de l'animal, itinéraire de vol, carnet de vaccination (en anglais) et certificat de puce. Traitement ~3-7 jours ouvrés ; permis valable 60 jours.", es: "Solicítalo por correo electrónico a la AQS del aeropuerto de entrada, entre 60 y 7 días antes de la salida, mediante el formulario R1/1 con copia del pasaporte, foto de la mascota, itinerario de vuelo, registros de vacunación (en inglés) y certificado del microchip. Tramitación ~3-7 días hábiles; permiso válido 60 días.", pt: "Faça o pedido por e-mail à AQS do aeroporto de entrada, entre 60 e 7 dias antes da partida, usando o formulário R1/1 com cópia do passaporte, foto do animal, itinerário do voo, carteira de vacinação (em inglês) e certificado do microchip. Processamento em ~3-7 dias úteis; autorização válida por 60 dias." }
    exceptions: { en: "The permit is not the import licence: it authorises the shipment. Some airlines require the permit before boarding.", fr: "Le permis n'est pas la licence d'importation : il autorise l'envoi. Certaines compagnies exigent le permis avant l'embarquement.", es: "El permiso no es la licencia de importación: autoriza el envío. Algunas aerolíneas exigen el permiso antes del embarque.", pt: "A autorização não é a licença de importação: ela autoriza o envio. Algumas companhias aéreas exigem a autorização antes do embarque." }
    ref: { en: "DLD — Importation of animals; Form R1/1", fr: "DLD — Importation des animaux ; formulaire R1/1", es: "DLD — Importación de animales; formulario R1/1", pt: "DLD — Importação de animais; formulário R1/1" }
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "ISO 11784/11785 microchip (15-digit code); the number must match every vaccination record and the health certificate.", fr: "Puce ISO 11784/11785 (code à 15 chiffres) ; le numéro doit correspondre à chaque enregistrement de vaccination et au certificat sanitaire.", es: "Microchip ISO 11784/11785 (código de 15 dígitos); el número debe coincidir con cada registro de vacunación y con el certificado sanitario.", pt: "Microchip ISO 11784/11785 (código de 15 dígitos); o número precisa coincidir com cada registro de vacinação e com o atestado de saúde." }
    exceptions: { en: "If the microchip number on the documents does not match the animal, entry can be refused.", fr: "Si le numéro de puce des documents ne correspond pas à l'animal, l'entrée peut être refusée.", es: "Si el número de microchip de los documentos no coincide con el animal, se puede denegar la entrada.", pt: "Se o número do microchip dos documentos não corresponder ao animal, a entrada pode ser recusada." }
    ref: { en: "DLD — Import requirements (microchip)", fr: "DLD — Exigences d'importation (puce)", es: "DLD — Requisitos de importación (microchip)", pt: "DLD — Exigências de importação (microchip)" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Dog at least 12 weeks (3 months / 84 days) old at vaccination. For a primary vaccination, wait at least 21 days before departure; a valid booster needs no waiting period if the previous record is attached.", fr: "Chien d'au moins 12 semaines (3 mois / 84 jours) à la vaccination. Pour une primo-vaccination, attends au moins 21 jours avant le départ ; un rappel valide n'impose aucun délai si l'enregistrement précédent est joint.", es: "Perro de al menos 12 semanas (3 meses / 84 días) en el momento de la vacunación. Para una primovacunación, espera al menos 21 días antes de la salida; un refuerzo válido no exige ningún plazo de espera si se adjunta el registro anterior.", pt: "Cachorro com pelo menos 12 semanas (3 meses / 84 dias) na data da vacinação. Para uma vacinação primária, espere pelo menos 21 dias antes da partida; um reforço válido não exige prazo de espera se o registro anterior for anexado." }
    exceptions: { en: "Vaccination records must be in English and show the veterinarian's name, licence number and signature.", fr: "Le carnet de vaccination doit être en anglais et indiquer le nom, le numéro de licence et la signature du vétérinaire.", es: "Los registros de vacunación deben estar en inglés e indicar el nombre, el número de licencia y la firma del veterinario.", pt: "A carteira de vacinação precisa estar em inglês e indicar o nome, o número de registro profissional e a assinatura do veterinário." }
    ref: { en: "DLD — Import requirements (rabies)", fr: "DLD — Exigences d'importation (rage)", es: "DLD — Requisitos de importación (rabia)", pt: "DLD — Exigências de importação (raiva)" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not routine — conditional", fr: "Pas de routine — conditionnel", es: "No rutinaria — condicional", pt: "Não é rotina — condicional" }
    when: { en: "Not routinely required from rabies-controlled countries (USA, Canada, UK, EU and others); the DLD reserves the right to request it, especially for dogs from high-rabies-risk origins.", fr: "Non exigé en routine depuis les pays à rage contrôlée (États-Unis, Canada, R.-Uni, UE…) ; le DLD se réserve le droit de l'exiger, surtout pour les chiens d'origines à risque rabique élevé.", es: "No se exige de forma rutinaria desde los países con rabia controlada (EE. UU., Canadá, R. Unido, UE…); el DLD se reserva el derecho de exigirla, sobre todo para perros de orígenes de alto riesgo de rabia.", pt: "Não é exigido de rotina para países com raiva controlada (EUA, Canadá, Reino Unido, UE e outros); o DLD reserva-se o direito de exigi-lo, sobretudo para cachorros vindos de origens de alto risco de raiva." }
    exceptions: { en: "Confirm with the AQS at your port of entry whether a titre applies to your dog's origin before you book.", fr: "Confirme auprès de l'AQS de ton point d'entrée si un titrage s'applique à l'origine de ton chien avant de réserver.", es: "Confirma con la AQS de tu punto de entrada si se aplica una titulación al origen de tu perro antes de reservar.", pt: "Confirme com a AQS do seu ponto de entrada se a titulação se aplica à origem do seu cachorro antes de reservar." }
    ref: { en: "DLD — Import requirements (rabies serology)", fr: "DLD — Exigences d'importation (sérologie rabique)", es: "DLD — Requisitos de importación (serología de rabia)", pt: "DLD — Exigências de importação (sorologia antirrábica)" }
  - item: { en: "Other vaccinations (dogs)", fr: "Autres vaccinations (chiens)", es: "Otras vacunas (perros)", pt: "Outras vacinas (cachorros)" }
    required: { en: "Required", fr: "Requises", es: "Obligatorias", pt: "Obrigatório" }
    when: { en: "Dogs must be vaccinated against canine distemper, canine hepatitis, canine parvovirus and leptospirosis, in addition to rabies; records in English.", fr: "Les chiens doivent être vaccinés contre la maladie de Carré, l'hépatite canine, la parvovirose canine et la leptospirose, en plus de la rage ; enregistrements en anglais.", es: "Los perros deben estar vacunados contra el moquillo canino, la hepatitis canina, el parvovirus canino y la leptospirosis, además de la rabia; registros en inglés.", pt: "Os cachorros precisam ser vacinados contra cinomose canina, hepatite canina, parvovirose canina e leptospirose, além da raiva; registros em inglês." }
    exceptions: { en: "For all primary vaccinations, allow at least 21 days before departure.", fr: "Pour toute primo-vaccination, prévois au moins 21 jours avant le départ.", es: "Para cualquier primovacunación, prevé al menos 21 días antes de la salida.", pt: "Para qualquer vacinação primária, conte pelo menos 21 dias antes da partida." }
    ref: { en: "DLD — Import requirements (vaccinations)", fr: "DLD — Exigences d'importation (vaccinations)", es: "DLD — Requisitos de importación (vacunas)", pt: "DLD — Exigências de importação (vacinas)" }
  - item: { en: "Leptospirosis test", fr: "Test leptospirose", es: "Prueba de leptospirosis", pt: "Teste de leptospirose" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "A negative leptospirosis test within 30 days before departure is required if the dog does not have a valid leptospirosis vaccine or does not meet the 21-day rule.", fr: "Un test leptospirose négatif dans les 30 jours avant le départ est requis si le chien n'a pas de vaccin leptospirose valide ou ne respecte pas la règle des 21 jours.", es: "Se exige una prueba de leptospirosis negativa dentro de los 30 días previos a la salida si el perro no tiene una vacuna de leptospirosis válida o no cumple la regla de los 21 días.", pt: "Um teste de leptospirose negativo feito nos 30 dias anteriores à partida é obrigatório se o cachorro não tiver vacina de leptospirose válida ou não cumprir a regra dos 21 dias." }
    exceptions: { en: "Not required for a dog with a valid leptospirosis vaccination.", fr: "Non requis pour un chien avec une vaccination leptospirose valide.", es: "No se exige para un perro con una vacunación de leptospirosis válida.", pt: "Não obrigatório para um cachorro com vacinação de leptospirose válida." }
    ref: { en: "DLD — Import requirements (leptospirosis)", fr: "DLD — Exigences d'importation (leptospirose)", es: "DLD — Requisitos de importación (leptospirosis)", pt: "DLD — Exigências de importação (leptospirose)" }
  - item: { en: "Government veterinary health certificate", fr: "Certificat sanitaire vétérinaire officiel", es: "Certificado sanitario veterinario oficial", pt: "Atestado de saúde veterinário oficial" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Official health certificate issued shortly before travel and endorsed/stamped by the exporting country's government veterinary authority; original only, in English. From the USA it is valid 10 days from USDA endorsement.", fr: "Certificat sanitaire officiel établi peu avant le voyage et visé/tamponné par l'autorité vétérinaire gouvernementale du pays d'export ; original uniquement, en anglais. Depuis les États-Unis, il est valable 10 jours après le visa USDA.", es: "Certificado sanitario oficial expedido poco antes del viaje y refrendado/sellado por la autoridad veterinaria gubernamental del país de exportación; solo original, en inglés. Desde EE. UU. es válido 10 días desde el refrendo del USDA.", pt: "Atestado de saúde oficial emitido pouco antes da viagem e endossado/carimbado pela autoridade veterinária governamental do país exportador; somente o original, em inglês. A partir dos EUA, ele vale 10 dias após o endosso do USDA." }
    exceptions: { en: "Electronic or copied certificates are not accepted; issue it inside the import permit's 60-day validity.", fr: "Les certificats électroniques ou copiés ne sont pas acceptés ; établissez-le dans la validité de 60 jours du permis d'importation.", es: "No se aceptan certificados electrónicos ni copias; expídelo dentro de la valide de 60 días del permiso de importación.", pt: "Certificados eletrônicos ou copiados não são aceitos; emita-o dentro do prazo de validade de 60 dias da autorização de importação." }
    ref: { en: "DLD — Official Health Certificate (endorsement)", fr: "DLD — Certificat sanitaire officiel (visa)", es: "DLD — Certificado sanitario oficial (refrendo)", pt: "DLD — Atestado de saúde oficial (endosso)" }
  - item: { en: "Import licence on arrival (Forms R-6 / R-7)", fr: "Licence d'importation à l'arrivée (formulaires R-6 / R-7)", es: "Licencia de importación a la llegada (formularios R-6 / R-7)", pt: "Licença de importação na chegada (formulários R-6 / R-7)" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "At the AQS on arrival the vet checks documents and the microchip, then issues a Notice of Import Approval (Form R-6) and the Import License (Form R-7). Fee 500 baht per animal; the licence is valid until the pet leaves Thailand.", fr: "À l'AQS à l'arrivée, le vétérinaire vérifie les documents et la puce, puis délivre un avis d'approbation (formulaire R-6) et la licence d'importation (formulaire R-7). Frais de 500 bahts par animal ; la licence est valable jusqu'au départ de l'animal de Thaïlande.", es: "En la AQS a la llegada, el veterinario revisa los documentos y el microchip, y luego expide un aviso de aprobación de importación (formulario R-6) y la licencia de importación (formulario R-7). Tasa de 500 bahts por animal; la licencia es válida hasta que la mascota sale de Tailandia.", pt: "Na AQS, na chegada, o veterinário confere os documentos e o microchip e depois emite um aviso de aprovação de importação (formulário R-6) e a licença de importação (formulário R-7). Taxa de 500 bahts por animal; a licença é válida até o animal deixar a Tailândia." }
    exceptions: { en: "Present the animal and Form R-7 to Customs at the Goods to Declare channel and pay any applicable duties.", fr: "Présente l'animal et le formulaire R-7 à la douane au canal « Goods to Declare » et acquittez les droits éventuels.", es: "Presenta el animal y el formulario R-7 en la aduana por el canal «Goods to Declare» y paga los derechos que correspondan.", pt: "Apresente o animal e o formulário R-7 à alfândega no canal « Goods to Declare » e pague os direitos que se apliquem." }
    ref: { en: "Thai Customs — Importing pets (Hand Carried), Form R.7", fr: "Douane thaïlandaise — Importation d'animaux (Hand Carried), formulaire R.7", es: "Aduanas de Tailandia — Importación de mascotas (Hand Carried), formulario R.7", pt: "Alfândega da Tailândia — Importação de animais (Hand Carried), formulário R.7" }
  - item: { en: "Number of pets per traveller", fr: "Nombre d'animaux par voyageur", es: "Número de mascotas por viajero", pt: "Número de animais por viajante" }
    required: { en: "Per-animal permit", fr: "Permis par animal", es: "Permiso por animal", pt: "Autorização por animal" }
    when: { en: "Each dog needs its own import permit, its own health certificate and a separate 500-baht import-licence fee.", fr: "Chaque chien nécessite son propre permis d'importation, son propre certificat sanitaire et des frais de licence de 500 bahts distincts.", es: "Cada perro necesita su propio permiso de importación, su propio certificado sanitario y una tasa de licencia de importación de 500 bahts aparte.", pt: "Cada cachorro precisa da sua própria autorização de importação, do seu próprio atestado de saúde e de uma taxa de licença de importação de 500 bahts à parte." }
    exceptions: { en: "The DLD documents reviewed do not publish a fixed maximum number of pets per traveller — confirm with the AQS at your port of entry.", fr: "Les documents du DLD consultés ne publient pas de nombre maximal fixe d'animaux par voyageur — confirme auprès de l'AQS de ton point d'entrée.", es: "Los documentos del DLD consultados no publican un número máximo fijo de mascotas por viajero — confírmalo con la AQS de tu punto de entrada.", pt: "Os documentos do DLD consultados não publicam um número máximo fixo de animais por viajante — confirme com a AQS do seu ponto de entrada." }
    ref: { en: "DLD — Import requirements; AQS", fr: "DLD — Exigences d'importation ; AQS", es: "DLD — Requisitos de importación; AQS", pt: "DLD — Exigências de importação; AQS" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "Effectively ≥4 months", fr: "En pratique ≥4 mois", es: "En la práctica ≥4 meses", pt: "Na prática, ≥4 meses" }
    when: { en: "The rabies vaccine is valid only from 12 weeks of age, with a 21-day wait for a primary dose; pets are generally accepted only from about 4 months old.", fr: "Le vaccin antirabique n'est valide qu'à partir de 12 semaines, avec un délai de 21 jours pour une primo-dose ; les animaux ne sont généralement admis qu'à partir d'environ 4 mois.", es: "La vacuna antirrábica solo es válida a partir de las 12 semanas de edad, con una espera de 21 días para una dosis primaria; las mascotas generalmente solo se admiten a partir de unos 4 meses de edad.", pt: "A vacina antirrábica só é válida a partir das 12 semanas de idade, com espera de 21 dias para uma dose primária; os animais em geral só são aceitos a partir de cerca de 4 meses." }
    exceptions: { en: "A rabies dose given before 12 weeks is not valid.", fr: "Une dose antirabique administrée avant 12 semaines n'est pas valide.", es: "Una dosis antirrábica administrada antes de las 12 semanas no es válida.", pt: "Uma dose antirrábica aplicada antes das 12 semanas não é válida." }
    ref: { en: "DLD — Import requirements (age)", fr: "DLD — Exigences d'importation (âge)", es: "DLD — Requisitos de importación (edad)", pt: "DLD — Exigências de importação (idade)" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not required if compliant", fr: "Non requise si conforme", es: "No obligatoria si se cumple", pt: "Não obrigatória se estiver tudo em conformidade" }
    when: { en: "Compliant dogs are released without quarantine; a quarantine officer may detain any animal (typically at least 30 days) for tests or treatment if a disease risk is suspected.", fr: "Les chiens conformes sont libérés sans quarantaine ; un agent de quarantaine peut retenir tout animal (généralement au moins 30 jours) pour tests ou traitement en cas de risque sanitaire suspecté.", es: "Los perros conformes se liberan sin cuarentena; un agente de cuarentena puede retener a cualquier animal (normalmente al menos 30 días) para pruebas o tratamiento si se sospecha un riesgo sanitario.", pt: "Os cachorros em conformidade são liberados sem quarentena; um agente de quarentena pode reter qualquer animal (normalmente por pelo menos 30 dias) para exames ou tratamento se houver suspeita de risco sanitário." }
    exceptions: { en: "If requirements are not met or the microchip does not match, the animal may be returned to the exporting country or detained — all costs borne by the importer.", fr: "Si les exigences ne sont pas remplies ou si la puce ne correspond pas, l'animal peut être renvoyé vers le pays d'export ou retenu — tous frais à la charge de l'importateur.", es: "Si no se cumplen los requisitos o el microchip no coincide, el animal puede ser devuelto al país de exportación o retenido — todos los costes a cargo del importador.", pt: "Se as exigências não forem cumpridas ou o microchip não corresponder, o animal pode ser devolvido ao país exportador ou retido — todos os custos por conta do importador." }
    ref: { en: "DLD — Import requirements (quarantine)", fr: "DLD — Exigences d'importation (quarantaine)", es: "DLD — Requisitos de importación (cuarentena)", pt: "DLD — Exigências de importação (quarentena)" }

origin:
  scheme: own
  eu:
    from: any
    title: { en: "Up-to-date dog (valid boosters) — fastest path", fr: "Chien à jour (rappels valides) — parcours le plus rapide", es: "Perro al día (refuerzos válidos) — la vía más rápida", pt: "Cachorro com vacinas em dia (reforços válidos) — caminho mais rápido" }
    body:
      en: "A dog whose rabies and core vaccinations are current on valid boosters follows the shortest path: apply for the DLD import permit (Form R1/1) 60 to 7 days before departure, then have an official government veterinarian issue and endorse the health certificate shortly before travel. No 21-day waiting period applies when the previous vaccination records are attached, and no quarantine is imposed if every condition is met."
      fr: "Un chien dont les vaccins antirabiques et de base sont à jour sur des rappels valides suit le parcours le plus court : demande le permis d'importation DLD (formulaire R1/1) 60 à 7 jours avant le départ, puis fais établir et viser le certificat sanitaire par un vétérinaire officiel peu avant le voyage. Aucun délai de 21 jours ne s'applique lorsque les enregistrements de vaccination précédents sont joints, et aucune quarantaine n'est imposée si toutes les conditions sont remplies."
      es: "Un perro cuyas vacunas antirrábica y básicas están al día con refuerzos válidos sigue la vía más corta: solicita el permiso de importación del DLD (formulario R1/1) de 60 a 7 días antes de la salida, y luego haz que un veterinario oficial del gobierno expida y refrende el certificado sanitario poco antes del viaje. No se aplica ningún plazo de espera de 21 días cuando se adjuntan los registros de vacunación anteriores, y no se impone cuarentena si se cumplen todas las condiciones."
      pt: "Um cachorro cujas vacinas antirrábica e essenciais estejam em dia com reforços válidos segue o caminho mais curto: peça a autorização de importação do DLD (formulário R1/1) de 60 a 7 dias antes da partida e depois peça a um veterinário oficial do governo que emita e endosse o atestado de saúde pouco antes da viagem. Nenhum prazo de espera de 21 dias se aplica quando os registros de vacinação anteriores são anexados, e nenhuma quarentena é imposta se todas as condições forem cumpridas."
    cls: ok
  listed:
    title: { en: "Primary or lapsed vaccination — 21-day wait", fr: "Vaccination primaire ou périmée — délai de 21 jours", es: "Vacunación primaria o caducada — espera de 21 días", pt: "Vacinação primária ou vencida — espera de 21 dias" }
    body:
      en: "If the rabies or core vaccinations are a first (primary) dose or have lapsed, the dog must be vaccinated at least 21 days before departure. If it has no valid leptospirosis vaccine, add a negative leptospirosis test within 30 days before departure. The import permit and endorsed health certificate are still required, and the dog must be at least 12 weeks old at vaccination."
      fr: "Si les vaccins antirabiques ou de base sont une première dose (primaire) ou périmés, le chien doit être vacciné au moins 21 jours avant le départ. S'il n'a pas de vaccin leptospirose valide, ajoute un test leptospirose négatif dans les 30 jours avant le départ. Le permis d'importation et le certificat sanitaire visé restent exigés, et le chien doit avoir au moins 12 semaines à la vaccination."
      es: "Si las vacunas antirrábica o básicas son una primera dosis (primaria) o han caducado, el perro debe vacunarse al menos 21 días antes de la salida. Si no tiene una vacuna de leptospirosis válida, añade una prueba de leptospirosis negativa dentro de los 30 días previos a la salida. El permiso de importación y el certificado sanitario refrendado siguen siendo obligatorios, y el perro debe tener al menos 12 semanas en el momento de la vacunación."
      pt: "Se a vacinação antirrábica ou as vacinas essenciais forem uma primeira dose (primária) ou estiverem vencidas, o cachorro precisa ser vacinado pelo menos 21 dias antes da partida. Se ele não tiver vacina de leptospirose válida, acrescente um teste de leptospirose negativo feito nos 30 dias anteriores à partida. A autorização de importação e o atestado de saúde endossado continuam obrigatórios, e o cachorro precisa ter pelo menos 12 semanas na data da vacinação."
    cls: warn
  nonListed:
    title: { en: "High-risk origin or non-compliant arrival", fr: "Origine à risque ou arrivée non conforme", es: "Origen de riesgo o llegada no conforme", pt: "Origem de alto risco ou chegada fora de conformidade" }
    body:
      en: "For a dog from a high-rabies-risk country, the DLD may additionally require a rabies antibody test — plan several extra months. A dog that arrives without a valid import permit, a matching microchip, or the required vaccinations and certificate can be detained for quarantine, returned to the exporting country, or held for tests and treatment, entirely at the owner's expense."
      fr: "Pour un chien venant d'un pays à risque rabique élevé, le DLD peut en plus exiger un titrage des anticorps antirabiques — prévois plusieurs mois supplémentaires. Un chien qui arrive sans permis d'importation valide, sans puce correspondante, ou sans les vaccinations et le certificat requis peut être placé en quarantaine, renvoyé vers le pays d'export, ou retenu pour tests et traitement, entièrement aux frais du propriétaire."
      es: "Para un perro procedente de un país de alto riesgo de rabia, el DLD puede exigir además una prueba de titulación de rabia — prevé varios meses adicionales. Un perro que llega sin un permiso de importación válido, sin un microchip coincidente, o sin las vacunas y el certificado requeridos puede ser retenido para cuarentena, devuelto al país de exportación, o retenido para pruebas y tratamiento, todo a cargo del propietario."
      pt: "Para um cachorro vindo de um país de alto risco de raiva, o DLD pode exigir ainda um teste sorológico antirrábico — planeje vários meses a mais. Um cachorro que chega sem autorização de importação válida, sem um microchip correspondente ou sem as vacinas e o certificado exigidos pode ser retido para quarentena, devolvido ao país exportador ou mantido para exames e tratamento, tudo às custas do dono."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Thailand depends on whether every condition was completed before departure."
    fr: "Ce qui se passe à l'arrivée de ton chien en Thaïlande dépend du fait que toutes les conditions aient été remplies avant le départ."
    es: "Lo que ocurre cuando tu perro llega a Tailandia depende de si se cumplieron todas las condiciones antes de la salida."
    pt: "O que acontece quando o seu cachorro chega à Tailândia depende de todas as condições terem sido cumpridas antes da partida."
  points:
    - en: "Dogs enter through airports with an Animal Quarantine Station (Suvarnabhumi, Don Mueang, Chiang Mai, Phuket, Samui and Krabi/Trang); hand-carried pets clear at the AQS next to baggage carousel #8 at Suvarnabhumi."
      fr: "Les chiens entrent par les aéroports dotés d'une station de quarantaine animale (Suvarnabhumi, Don Mueang, Chiang Mai, Phuket, Samui et Krabi/Trang) ; les animaux en cabine sont traités à l'AQS près du tapis à bagages n°8 à Suvarnabhumi."
      es: "Los perros entran por aeropuertos con una estación de cuarentena animal (Suvarnabhumi, Don Mueang, Chiang Mai, Phuket, Samui y Krabi/Trang); las mascotas en cabina se tramitan en la AQS junto a la cinta de equipajes n.º 8 en Suvarnabhumi."
      pt: "Os cachorros entram por aeroportos que têm uma Animal Quarantine Station (Suvarnabhumi, Don Mueang, Chiang Mai, Phuket, Samui e Krabi/Trang); os animais acompanhados (Hand Carried) são liberados na AQS ao lado da esteira de bagagem nº 8 em Suvarnabhumi."
    - en: "Present your passport, the original endorsed health certificate, vaccination records and the printed import permit to the AQS veterinary officer, who checks the documents and the microchip."
      fr: "Présente ton passeport, le certificat sanitaire original visé, le carnet de vaccination et le permis d'importation imprimé au vétérinaire de l'AQS, qui vérifie les documents et la puce."
      es: "Presenta tu pasaporte, el certificado sanitario original refrendado, los registros de vacunación y el permiso de importación impreso al veterinario de la AQS, que revisa los documentos y el microchip."
      pt: "Apresente o seu passaporte, o atestado de saúde original endossado, os registros de vacinação e a autorização de importação impressa ao agente veterinário da AQS, que confere os documentos e o microchip."
    - en: "The AQS then issues a Notice of Import Approval (Form R-6) and the Import License (Form R-7); a fee of 500 baht per animal is charged and a receipt provided."
      fr: "L'AQS délivre ensuite un avis d'approbation (formulaire R-6) et la licence d'importation (formulaire R-7) ; des frais de 500 bahts par animal sont perçus et un reçu remis."
      es: "La AQS expide entonces un aviso de aprobación de importación (formulario R-6) y la licencia de importación (formulario R-7); se cobra una tasa de 500 bahts por animal y se entrega un recibo."
      pt: "A AQS emite então um aviso de aprovação de importação (formulário R-6) e a licença de importação (formulário R-7); é cobrada uma taxa de 500 bahts por animal e entregue um recibo."
    - en: "Take the animal and Form R-7 to Customs at the Goods to Declare channel, pay any applicable duties or taxes, and keep the official receipt."
      fr: "Présente l'animal et le formulaire R-7 à la douane au canal « Goods to Declare », acquittez les droits ou taxes éventuels et conserve le reçu officiel."
      es: "Lleva el animal y el formulario R-7 a la aduana por el canal «Goods to Declare», paga los derechos o impuestos que correspondan y conserva el recibo oficial."
      pt: "Leve o animal e o formulário R-7 à alfândega no canal « Goods to Declare », pague os direitos ou impostos que se apliquem e guarde o recibo oficial."
    - en: "For pets shipped as air cargo, the AQS cargo office is open Monday to Friday only — plan your arrival on a working day."
      fr: "Pour les animaux expédiés en fret, le bureau AQS du terminal cargo n'ouvre que du lundi au vendredi — planifie ton arrivée un jour ouvré."
      es: "Para las mascotas enviadas como carga aérea, la oficina de la AQS en la terminal de carga solo abre de lunes a viernes — planifica tu llegada en un día hábil."
      pt: "Para animais enviados como carga aérea, o escritório de carga da AQS abre somente de segunda a sexta-feira — planeje a chegada em um dia útil."
    - en: "If documents are missing or invalid, or the microchip does not match, the animal may be returned to the exporting country or detained for quarantine, tests and treatment at the owner's expense."
      fr: "Si des documents manquent ou sont invalides, ou si la puce ne correspond pas, l'animal peut être renvoyé vers le pays d'export ou retenu pour quarantaine, tests et traitement aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, o el microchip no coincide, el animal puede ser devuelto al país de exportación o retenido para cuarentena, pruebas y tratamiento a cargo del propietario."
      pt: "Se faltarem documentos ou eles forem inválidos, ou se o microchip não corresponder, o animal pode ser devolvido ao país exportador ou retido para quarentena, exames e tratamento às custas do dono."

