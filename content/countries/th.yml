notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian and Thailand's Department of Livestock Development (DLD) can confirm the exact procedure for your individual dog."
    fr: "Seuls un vétérinaire et le Département du développement de l'élevage (DLD) de Thaïlande peuvent confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario y el Department of Livestock Development (DLD) de Tailandia pueden confirmar el procedimiento exacto para tu perro."
    pt: "Somente um veterinário e o Department of Livestock Development (DLD) da Tailândia podem confirmar o procedimento exato para o seu cachorro."
  - en: "The import permit must be obtained before departure — some airlines will not board a pet without it."
    fr: "Le permis d'importation doit être obtenu avant le départ — certaines compagnies n'embarqueront pas un animal sans lui."
    es: "El permiso de importación debe obtenerse antes de la salida — algunas aerolíneas no embarcarán a una mascota sin él."
    pt: "A autorização de importação precisa ser obtida antes da partida — algumas companhias aéreas não embarcam um animal sem ela."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact steps depend on three things — Thailand (your destination) is only the first."
    fr: "Les étapes exactes dépendent de trois éléments — la Thaïlande (ta destination) n'est que le premier."
    es: "Los pasos exactos dependen de tres factores — Tailandia (tu destino) es solo el primero."
    pt: "As etapas exatas dependem de três fatores — a Tailândia (o seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Thailand", fr: "Pays de destination — Thaïlande", es: "País de destino — Tailandia", pt: "País de destino — Tailândia" }
      text:
        en: "Thailand runs its own DLD scheme: an advance import permit (Form R1/1), an ISO microchip, a valid rabies vaccination, core vaccinations and a government-endorsed health certificate. It does not use the EU pet-passport system."
        fr: "La Thaïlande applique son propre régime DLD : permis d'importation préalable (formulaire R1/1), puce ISO, vaccination antirabique valide, vaccins de base et certificat sanitaire visé par le gouvernement. Elle n'utilise pas le passeport européen."
        es: "Tailandia aplica su propio régimen del DLD: permiso de importación previo (formulario R1/1), microchip ISO, vacunación antirrábica válida, vacunas básicas y certificado sanitario refrendado por el gobierno. No utiliza el sistema de pasaporte europeo para mascotas."
        pt: "A Tailândia aplica o seu próprio regime do DLD: uma autorização de importação prévia (formulário R1/1), um microchip ISO, uma vacinação antirrábica válida, as vacinas essenciais e um atestado de saúde endossado pelo governo. O país não usa o sistema de passaporte para animais da UE."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The exporting country decides whose official veterinary authority endorses your health certificate, and whether the DLD may request a rabies antibody test — routinely waived for rabies-controlled countries such as the USA, Canada and the UK."
        fr: "Le pays d'export détermine quelle autorité vétérinaire officielle vise ton certificat sanitaire, et si le DLD peut exiger un titrage antirabique — habituellement dispensé pour les pays à rage contrôlée comme les États-Unis, le Canada et le Royaume-Uni."
        es: "El país de exportación determina qué autoridad veterinaria oficial refrenda tu certificado sanitario, y si el DLD puede solicitar una prueba de titulación de rabia — normalmente dispensada para los países con rabia controlada como EE. UU., Canadá y el Reino Unido."
        pt: "O país exportador determina qual autoridade veterinária oficial endossa o seu atestado de saúde e se o DLD pode exigir um teste sorológico antirrábico — normalmente dispensado para países com raiva controlada, como EUA, Canadá e Reino Unido."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay in a high-rabies-risk country can prompt the DLD to require a rabies antibody test, and quarantine officers may detain any animal that raises a disease concern regardless of the last airport."
        fr: "Un séjour récent dans un pays à risque rabique élevé peut amener le DLD à exiger un titrage antirabique, et les agents de quarantaine peuvent retenir tout animal suscitant une inquiétude sanitaire, quel que soit le dernier aéroport."
        es: "Una estancia reciente en un país de alto riesgo de rabia puede llevar al DLD a exigir una prueba de titulación de rabia, y los agentes de cuarentena pueden retener a cualquier animal que suscite una preocupación sanitaria, sea cual sea el último aeropuerto."
        pt: "Uma estadia recente em um país de alto risco de raiva pode levar o DLD a exigir um teste sorológico antirrábico, e os agentes de quarentena podem reter qualquer animal que levante suspeita de doença, independentemente do último aeroporto."
  note:
    en: "So read the requirements below as Thailand's framework, then confirm your dog's exact origin, history and timeline with your vet and the DLD before you book."
    fr: "Lis donc les exigences ci-dessous comme le cadre thaïlandais, puis confirme l'origine, l'historique et le calendrier exacts de ton chien avec ton vétérinaire et le DLD avant de réserver."
    es: "Así que lee los requisitos siguientes como el marco de Tailandia y luego confirma el origen, el historial y el calendario exactos de tu perro con tu veterinario y el DLD antes de reservar."
    pt: "Portanto, leia as exigências abaixo como o marco da Tailândia e depois confirme a origem, o histórico e o cronograma exatos do seu cachorro com o seu veterinário e com o DLD antes de reservar."

