origin:
  eu:
    title: { en: "Simplified — pet passport", fr: "Simplifié — passeport", es: "Simplificado — pasaporte para mascotas", pt: "Simplificado — passaporte para animais" }
    body:
      en: "A dog coming from an EU country needs a pet passport (Swiss or EU — the two are mutually recognised) showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate and normally no border check. Up to five pets per person travel under the pet rules."
      fr: "Un chien venant d'un pays de l'UE a besoin d'un passeport (suisse ou européen — les deux sont mutuellement reconnus) mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire et normalement pas de contrôle frontalier. Jusqu'à cinq animaux par personne voyagent sous le régime des animaux de compagnie."
      es: "Un perro que llega de un país de la UE necesita un pasaporte para mascotas (suizo o europeo — ambos se reconocen mutuamente) que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario y normalmente sin control fronterizo. Hasta cinco mascotas por persona viajan bajo el régimen de animales de compañía."
      pt: "Um cachorro vindo de um país da UE precisa de um passaporte para animais (suíço ou europeu — os dois são mutuamente reconhecidos) que comprove microchip ISO válido e vacinação antirrábica em dia. Sem teste sorológico, sem certificado sanitário e, normalmente, sem controle de fronteira. Até cinco animais de estimação por pessoa viajam sob o regime de animais de companhia."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a low-rabies-risk third country (United States, Canada, United Kingdom and others on the FSVO list), your dog needs a microchip, a valid rabies vaccination and an FSVO animal health certificate endorsed by an official vet before departure. No antibody test is required. Enter by direct air via Basel, Geneva or Zurich and present the dog at the red customs channel."
      fr: "Depuis un pays tiers à faible risque rabique (États-Unis, Canada, Royaume-Uni… selon la liste OSAV), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire OSAV visé par un vétérinaire officiel avant le départ. Pas de titrage. Entre par vol direct via Bâle, Genève ou Zurich et présente le chien au canal rouge de la douane."
      es: "Desde un país tercero con bajo riesgo de rabia (Estados Unidos, Canadá, Reino Unido y otros de la lista de la OSAV), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal de la OSAV refrendado por un veterinario oficial antes de la salida. No se exige prueba de titulación. Entra por vuelo directo vía Basilea, Ginebra o Zúrich y presenta el perro en el canal rojo de aduanas."
      pt: "Vindo de um país terceiro de baixo risco de raiva (Estados Unidos, Canadá, Reino Unido e outros da lista do OSAV), seu cachorro precisa de microchip, vacinação antirrábica válida e certificado sanitário do OSAV endossado por um veterinário oficial antes da partida. Não é exigido teste sorológico. Entre por voo direto via Basileia, Genebra ou Zurique e apresente o cachorro no canal vermelho da alfândega."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait + import licence", fr: "Titrage + 3 mois d'attente + autorisation", es: "Prueba de titulación + espera de 3 meses + autorización", pt: "Teste sorológico + 3 meses de espera + autorização de importação" }
    body:
      en: "From a rabies-risk country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml, then a compulsory 3-month wait before entry. An FSVO import licence and an endorsed health certificate are also required, and dogs under 7 months old cannot enter from a high-rabies-risk country."
      fr: "Depuis un pays à risque rabique, ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml, puis un délai obligatoire de 3 mois avant l'entrée. Une autorisation d'importation OSAV et un certificat sanitaire visé sont également requis, et les chiens de moins de 7 mois ne peuvent pas entrer depuis un pays à haut risque rabique."
      es: "Desde un país con riesgo de rabia, añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml, y luego una espera obligatoria de 3 meses antes de la entrada. También se exigen una autorización de importación de la OSAV y un certificado sanitario refrendado, y los perros menores de 7 meses no pueden entrar desde un país de alto riesgo de rabia."
      pt: "Vindo de um país de risco de raiva, acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml e, em seguida, 3 meses obrigatórios de espera antes da entrada. Também são exigidos uma autorização de importação do OSAV e um certificado sanitário endossado, e cachorros com menos de 7 meses não podem entrar vindos de um país de alto risco de raiva."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Switzerland depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien en Suisse dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Suiza depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega à Suíça depende do lugar de onde você voou."
  points:
    - en: "From the EU: no systematic border check — keep the pet passport (Swiss or EU) with you."
      fr: "Depuis l'UE : pas de contrôle systématique — garde le passeport (suisse ou européen) sur toi."
      es: "Desde la UE: sin control fronterizo sistemático — lleva contigo el pasaporte para mascotas (suizo o europeo)."
      pt: "Da UE: sem controle sistemático de fronteira — leve o passaporte para animais (suíço ou europeu) com você."
    - en: "From a third country: entry is only via direct air transport through Basel, Geneva or Zurich airports."
      fr: "Depuis un pays tiers : l'entrée se fait uniquement par transport aérien direct via les aéroports de Bâle, Genève ou Zurich."
      es: "Desde un país tercero: la entrada solo se realiza por transporte aéreo directo a través de los aeropuertos de Basilea, Ginebra o Zúrich."
      pt: "De um país terceiro: a entrada só é possível por transporte aéreo direto pelos aeroportos de Basileia, Genebra ou Zurique."
    - en: "Present the dog at the red customs channel; customs and the border veterinary service check the animal on entry."
      fr: "Présente le chien au canal rouge de la douane ; la douane et le service vétérinaire de frontière contrôlent l'animal à l'entrée."
      es: "Presenta el perro en el canal rojo de aduanas; las aduanas y el servicio veterinario de frontera controlan al animal a la entrada."
      pt: "Apresente o cachorro no canal vermelho da alfândega; a alfândega e o serviço veterinário de fronteira conferem o animal na entrada."
    - en: "Declare the dog to customs; a purchased animal is duty-free but subject to 8.1% VAT on its value above the CHF 300 travellers' allowance."
      fr: "Déclare le chien à la douane ; un animal acheté est exempt de droits mais soumis à la TVA de 8,1 % sur sa valeur au-delà de la franchise voyageurs de 300 CHF."
      es: "Declara el perro en aduanas; un animal comprado está exento de derechos, pero sujeto al IVA del 8,1 % sobre su valor por encima de la franquicia para viajeros de 300 CHF."
      pt: "Declare o cachorro na alfândega; um animal comprado é isento de direitos aduaneiros, mas sujeito a 8,1% de IVA sobre o valor que ultrapassar a franquia de viajante de 300 francos suíços."
    - en: "If the animal does not meet the conditions or documents are incomplete, it is taken to the airport border veterinary office for further processing, at the owner's expense."
      fr: "Si l'animal ne remplit pas les conditions ou si les documents sont incomplets, il est conduit au poste vétérinaire de frontière de l'aéroport pour traitement, aux frais du propriétaire."
      es: "Si el animal no cumple las condiciones o los documentos están incompletos, es llevado al puesto veterinario de frontera del aeropuerto para su tramitación, a cargo del propietario."
      pt: "Se o animal não cumprir as condições ou se os documentos estiverem incompletos, ele é levado ao posto veterinário de fronteira do aeroporto para os procedimentos cabíveis, às custas do dono."
    - en: "Dogs with docked ears and/or tails are refused entry."
      fr: "Les chiens aux oreilles et/ou à la queue coupées sont refoulés à l'entrée."
      es: "A los perros con las orejas o la cola cortadas se les rechaza la entrada."
      pt: "Cachorros com as orelhas e/ou a cauda cortadas têm a entrada recusada."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Switzerland has no uniform national breed ban. Dangerous-dog rules are set by the cantons, so they differ across the country — several cantons ban or restrict certain breeds while others do not. Always check the rules of the destination canton before you travel."
    fr: "La Suisse n'a pas d'interdiction de race uniforme au niveau national. Les règles sur les chiens dangereux relèvent des cantons et varient donc d'un canton à l'autre — plusieurs cantons interdisent ou restreignent certaines races, d'autres non. Vérifie toujours les règles du canton de destination avant de voyager."
    es: "Suiza no tiene una prohibición de razas uniforme a nivel nacional. Las normas sobre perros peligrosos las fijan los cantones, por lo que difieren de un cantón a otro — varios cantones prohíben o restringen ciertas razas mientras que otros no. Comprueba siempre las normas del cantón de destino antes de viajar."
    pt: "A Suíça não tem uma proibição de raças uniforme em nível nacional. As regras sobre cachorros perigosos são definidas pelos cantões e, por isso, variam pelo país — vários cantões proíbem ou restringem certas raças, outros não. Verifique sempre as regras do cantão de destino antes de viajar."
  cat1:
    en: "Cantons with breed blacklists: Geneva, Valais and Ticino are among the strictest. Geneva prohibits ownership of breeds such as the American Staffordshire Terrier, Pit Bull, Rottweiler, Tosa, various Mastiffs and others; Valais bans around a dozen breeds (crosses included). A ban typically covers listed breeds and their crosses, and newcomers must generally obtain a cantonal exemption."
    fr: "Cantons avec listes de races interdites : Genève, le Valais et le Tessin figurent parmi les plus stricts. Genève interdit la détention de races comme l'American Staffordshire Terrier, le Pit Bull, le Rottweiler, le Tosa, divers Mastiffs et d'autres ; le Valais interdit une douzaine de races (croisements compris). Une interdiction vise en général les races listées et leurs croisements, et les nouveaux arrivants doivent généralement obtenir une dérogation cantonale."
    es: "Cantones con listas de razas prohibidas: Ginebra, Valais y Tesino están entre los más estrictos. Ginebra prohíbe la tenencia de razas como el American Staffordshire Terrier, el Pit Bull, el Rottweiler, el Tosa, varios Mastines y otras; Valais prohíbe alrededor de una docena de razas (cruces incluidos). Una prohibición suele abarcar las razas listadas y sus cruces, y los recién llegados generalmente deben obtener una excepción cantonal."
    pt: "Cantões com listas de raças proibidas: Genebra, Valais e Ticino estão entre os mais rígidos. Genebra proíbe a posse de raças como American Staffordshire Terrier, Pit Bull, Rottweiler, Tosa, vários mastins e outras; o Valais proíbe cerca de uma dúzia de raças (cruzamentos incluídos). A proibição costuma abranger as raças listadas e seus cruzamentos, e quem chega de fora precisa, em geral, obter uma isenção cantonal."
  cat2:
    en: "Permit/restriction cantons: many other cantons require an ownership permit, liability insurance, muzzle and lead in public, and/or a behavioural assessment for listed or large/powerful breeds instead of an outright ban. Requirements vary widely, so the same dog may be allowed in one canton and restricted in a neighbouring one."
    fr: "Cantons à permis/restrictions : de nombreux autres cantons exigent un permis de détention, une assurance responsabilité civile, la muselière et la laisse en public et/ou une évaluation comportementale pour les races listées ou puissantes, plutôt qu'une interdiction pure. Les exigences varient fortement : un même chien peut être admis dans un canton et restreint dans le canton voisin."
    es: "Cantones con permiso/restricciones: muchos otros cantones exigen un permiso de tenencia, un seguro de responsabilidad civil, bozal y correa en público o una evaluación del comportamiento para las razas listadas o grandes/potentes, en lugar de una prohibición absoluta. Los requisitos varían mucho, por lo que un mismo perro puede estar permitido en un cantón y restringido en el vecino."
    pt: "Cantões com autorização/restrições: muitos outros cantões exigem autorização de posse, seguro de responsabilidade civil, focinheira e guia em locais públicos e/ou uma avaliação comportamental para raças listadas ou de grande porte e força, em vez de uma proibição total. As exigências variam muito, então o mesmo cachorro pode ser permitido em um cantão e restrito no cantão vizinho."
  note:
    en: "There is no federal breed ban, so you must confirm the rules of the exact destination canton (and any canton you transit) with its cantonal veterinary office before booking. A separate federal rule applies to all cantons: dogs with docked ears and/or tails are banned from import."
    fr: "Il n'existe pas d'interdiction fédérale de race : confirme les règles du canton de destination exact (et de tout canton traversé) auprès de son service vétérinaire cantonal avant de réserver. Une règle fédérale distincte s'applique à tous les cantons : les chiens aux oreilles et/ou à la queue coupées sont interdits d'importation."
    es: "No existe una prohibición de razas federal, así que debes confirmar las normas del cantón de destino exacto (y de cualquier cantón que atravieses) con su servicio veterinario cantonal antes de reservar. Una norma federal aparte se aplica a todos los cantones: los perros con las orejas o la cola cortadas tienen prohibida la importación."
    pt: "Não existe proibição federal de raças, então você precisa confirmar as regras do cantão exato de destino (e de qualquer cantão de passagem) com o serviço veterinário cantonal antes de reservar. Uma regra federal separada vale para todos os cantões: cachorros com as orelhas e/ou a cauda cortadas estão proibidos de importação."

checklist:
  - en: "Microchip (ISO) implanted before the rabies vaccination"
    fr: "Puce (ISO) posée avant la vaccination antirabique"
    es: "Microchip (ISO) implantado antes de la vacunación antirrábica"
    pt: "Microchip (ISO) implantado antes da vacinação antirrábica"
  - en: "Valid rabies vaccination (dog ≥12 weeks at the shot, +21 days)"
    fr: "Vaccination antirabique valide (chien ≥12 semaines, +21 jours)"
    es: "Vacunación antirrábica válida (perro ≥12 semanas en la vacuna, +21 días)"
    pt: "Vacinação antirrábica válida (cachorro com ≥12 semanas na data da vacina, +21 dias)"
  - en: "Rabies antibody test — rabies-risk countries only (≥0.5 IU/ml, then 3-month wait)"
    fr: "Titrage antirabique — pays à risque rabique uniquement (≥0,5 UI/ml, puis 3 mois d'attente)"
    es: "Prueba de titulación de rabia — solo países con riesgo de rabia (≥0,5 UI/ml, y luego 3 meses de espera)"
    pt: "Teste sorológico antirrábico — apenas países de risco de raiva (≥0,5 UI/ml e depois 3 meses de espera)"
  - en: "Pet passport (EU origin) or FSVO health certificate (third-country origin)"
    fr: "Passeport (origine UE) ou certificat sanitaire OSAV (origine pays tiers)"
    es: "Pasaporte para mascotas (origen UE) o certificado sanitario de la OSAV (origen de país tercero)"
    pt: "Passaporte para animais (origem na UE) ou certificado sanitário do OSAV (origem em país terceiro)"
  - en: "FSVO import licence if arriving by air from a rabies-risk country"
    fr: "Autorisation d'importation OSAV si arrivée par avion depuis un pays à risque rabique"
    es: "Autorización de importación de la OSAV si llegas por avión desde un país con riesgo de rabia"
    pt: "Autorização de importação do OSAV se a chegada for de avião vinda de um país de risco de raiva"
  - en: "Plan entry via Basel, Geneva or Zurich airport for third-country arrivals"
    fr: "Prévois l'entrée via les aéroports de Bâle, Genève ou Zurich pour les arrivées pays tiers"
    es: "Prevé la entrada por el aeropuerto de Basilea, Ginebra o Zúrich para las llegadas de países terceros"
    pt: "Planeje a entrada pelo aeroporto de Basileia, Genebra ou Zurique nas chegadas de países terceiros"
  - en: "Airline reservation and suitable IATA crate if travelling in the hold"
    fr: "Réservation et caisse IATA adaptée si voyage en soute"
    es: "Reserva de la aerolínea y jaula IATA adecuada si viaja en bodega"
    pt: "Reserva na companhia aérea e caixa de transporte adequada às normas IATA se for viajar no porão"
  - en: "Check the destination canton's dangerous-dog rules; confirm your dog is not docked (banned from import)"
    fr: "Vérifie les règles du canton de destination sur les chiens dangereux ; confirme que ton chien n'est pas coupé (interdit d'import)"
    es: "Comprueba las normas del cantón de destino sobre perros peligrosos; confirma que tu perro no tiene orejas ni cola cortadas (importación prohibida)"
    pt: "Verifique as regras do cantão de destino sobre cachorros perigosos; confirme que seu cachorro não tem orelhas ou cauda cortadas (importação proibida)"

