# Country Entry Guide — Switzerland (bilingual EN/FR).
# Non-EU national scheme (FSVO / blv.admin.ch, Swiss customs FOCBS / bazg.admin.ch).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_ch
iso2: "CH"
name: { en: "Switzerland", fr: "Suisse", es: "Suiza", pt: "Suíça" }
region: { en: "Europe (non-EU)", fr: "Europe (hors UE)", es: "Europa (fuera de la UE)", pt: "Europa (fora da UE)" }


regime: eu

hero:
  h1: { en: "Traveling to Switzerland with your dog", fr: "Voyager en Suisse avec ton chien", es: "Viajar a Suiza con tu perro", pt: "Viajar para a Suíça com seu cachorro" }
  intro:
    en: >-
      Switzerland welcomes dogs, but what you need to prepare depends mainly on the country your dog is
      travelling from — not only on Switzerland itself. Switzerland is not an EU member; it runs its own
      national scheme through the Federal Food Safety and Veterinary Office (FSVO), closely aligned with
      EU pet-movement rules. An ISO microchip and a valid rabies vaccination are always required. A dog
      arriving from the EU simply needs a pet passport (Swiss or EU, which are mutually recognised). A dog
      from a low-rabies-risk third country (such as the United States, Canada or the United Kingdom) needs
      a health certificate but no blood test. A dog from a rabies-risk country faces the longest path,
      including a rabies antibody test, a three-month wait and an FSVO import licence. This guide explains
      each case so you know exactly what to prepare before you book your flight.
    fr: >-
      La Suisse accueille les chiens, mais ce qu'il faut préparer dépend surtout du pays d'où ton chien
      voyage — pas seulement de la Suisse. La Suisse n'est pas membre de l'UE ; elle applique son propre
      dispositif national via l'Office fédéral de la sécurité alimentaire et des affaires vétérinaires
      (OSAV), très proche des règles européennes de mouvement des animaux. Une puce ISO et une vaccination
      antirabique valide sont toujours exigées. Un chien arrivant de l'UE a simplement besoin d'un passeport
      (suisse ou européen, mutuellement reconnus). Un chien venant d'un pays tiers à faible risque rabique
      (États-Unis, Canada, Royaume-Uni…) a besoin d'un certificat sanitaire mais pas de prise de sang. Un
      chien venant d'un pays à risque rabique suit le parcours le plus long, avec titrage antirabique, délai
      de trois mois et autorisation d'importation de l'OSAV. Ce guide détaille chaque cas pour savoir quoi
      préparer avant de réserver ton vol.
    es: >-
      Suiza acoge a los perros, pero lo que debes preparar depende sobre todo del país desde el que viaja
      tu perro — no solo de Suiza. Suiza no es miembro de la UE; aplica su propio sistema nacional a través
      de la Oficina Federal de Seguridad Alimentaria y Asuntos Veterinarios (OSAV), muy alineado con las
      normas europeas de movimiento de animales de compañía. Siempre se exigen un microchip ISO y una
      vacunación antirrábica válida. Un perro que llega de la UE solo necesita un pasaporte para mascotas
      (suizo o europeo, mutuamente reconocidos). Un perro procedente de un país tercero con bajo riesgo de
      rabia (como Estados Unidos, Canadá o el Reino Unido) necesita un certificado sanitario, pero no un
      análisis de sangre. Un perro procedente de un país con riesgo de rabia se enfrenta al camino más
      largo, que incluye una prueba de titulación de rabia, una espera de tres meses y una autorización de
      importación de la OSAV. Esta guía explica cada caso para que sepas exactamente qué preparar antes de
      reservar tu vuelo.

    pt: "A Suíça recebe bem os cachorros, mas o que você precisa preparar depende principalmente do país de onde seu cachorro parte — e não só da Suíça em si. A Suíça não é membro da UE; ela aplica seu próprio regime nacional, conduzido pelo Departamento Federal de Segurança Alimentar e Assuntos Veterinários (OSAV/BLV) e alinhado de perto com as regras europeias de circulação de animais de estimação. Microchip ISO e vacinação antirrábica válida são sempre obrigatórios. Um cachorro que chega da UE precisa apenas de um passaporte para animais (suíço ou europeu, mutuamente reconhecidos). Um cachorro vindo de um país terceiro de baixo risco de raiva (como Estados Unidos, Canadá ou Reino Unido) precisa de um certificado sanitário, mas não de exame de sangue. Um cachorro vindo de um país de risco de raiva enfrenta o caminho mais longo, com teste sorológico antirrábico, três meses de espera e autorização de importação do OSAV. Este guia explica cada caso para você saber exatamente o que preparar antes de comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Easy to difficult (depends on origin)", fr: "Facile à difficile (selon l'origine)", es: "De fácil a difícil (según el origen)", pt: "De fácil a difícil (depende da origem)" }

prepTime:
  eu:
    en: "A few days if the passport is up to date, up to ~3 weeks if the first rabies shot is still needed."
    fr: "Quelques jours si le passeport est à jour, jusqu'à ~3 semaines si la première vaccination reste à faire."
    es: "Unos días si el pasaporte está al día, hasta ~3 semanas si aún falta la primera vacuna antirrábica."
    pt: "Alguns dias se o passaporte estiver em dia, até cerca de 3 semanas se ainda faltar a primeira vacina antirrábica."
  listed:
    en: "~3–4 weeks: 21-day wait after the rabies shot, plus a health certificate from a low-rabies-risk country."
    fr: "~3–4 semaines : délai de 21 jours après le vaccin, plus un certificat sanitaire depuis un pays à faible risque rabique."
    es: "~3–4 semanas: espera de 21 días tras la vacuna antirrábica, más un certificado sanitario desde un país con bajo riesgo de rabia."
    pt: "Cerca de 3 a 4 semanas: 21 dias de espera depois da vacina antirrábica, mais um certificado sanitário emitido em um país de baixo risco de raiva."
  nonListed:
    en: "~4–7 months: antibody test at least 30 days after vaccination, a 3-month wait, plus an FSVO import licence."
    fr: "~4–7 mois : titrage au moins 30 jours après le vaccin, délai de 3 mois, plus une autorisation d'importation OSAV."
    es: "~4–7 meses: prueba de titulación al menos 30 días después de la vacuna, una espera de 3 meses, más una autorización de importación de la OSAV."
    pt: "Cerca de 4 a 7 meses: teste sorológico no mínimo 30 dias após a vacinação, 3 meses de espera e ainda uma autorização de importação do OSAV."

