    cls: ok

notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro."
    pt: "Só um médico-veterinário pode confirmar o procedimento exato para o seu cachorro."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Switzerland (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — la Suisse (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Suiza (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — a Suíça (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — Switzerland", fr: "Pays de destination — Suisse", es: "País de destino — Suiza", pt: "País de destino — Suíça" }
      text:
        en: "Switzerland applies its own FSVO scheme, aligned with EU rules: an ISO microchip and a valid rabies vaccination are always required, and no tapeworm treatment is needed to enter Switzerland."
        fr: "La Suisse applique son propre dispositif OSAV, aligné sur les règles UE : puce ISO et vaccination antirabique valide toujours exigées, et aucun traitement contre l'échinococcose n'est requis pour entrer en Suisse."
        es: "Suiza aplica su propio sistema de la OSAV, alineado con las normas de la UE: siempre se exigen un microchip ISO y una vacunación antirrábica válida, y no se necesita tratamiento contra la tenia para entrar en Suiza."
        pt: "A Suíça aplica seu próprio regime do OSAV, alinhado com as regras da UE: microchip ISO e vacinação antirrábica válida são sempre obrigatórios, e nenhum tratamento contra a tênia é exigido para entrar na Suíça."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Whether your dog leaves from the EU, a low-rabies-risk third country or a rabies-risk country decides whether an antibody test, a health certificate and an import licence are required."
        fr: "Que ton chien parte de l'UE, d'un pays tiers à faible risque rabique ou d'un pays à risque rabique détermine si un titrage, un certificat sanitaire et une autorisation d'importation sont exigés."
        es: "Que tu perro salga de la UE, de un país tercero con bajo riesgo de rabia o de un país con riesgo de rabia determina si se exigen una prueba de titulación, un certificado sanitario y una autorización de importación."
        pt: "Partir da UE, de um país terceiro de baixo risco de raiva ou de um país de risco de raiva é o que define se o teste sorológico, o certificado sanitário e a autorização de importação são exigidos."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay in a rabies-risk country can trigger an antibody test even if you fly in from a low-risk country. It is your dog's real origin and history that count — not only the last airport."
        fr: "Un séjour récent dans un pays à risque rabique peut imposer un titrage même si tu arrives d'un pays à faible risque. C'est l'origine réelle et l'historique du chien qui comptent — pas seulement l'aéroport de destination finale."
        es: "Una estancia reciente en un país con riesgo de rabia puede obligar a una prueba de titulación aunque llegues desde un país de bajo riesgo. Lo que cuenta es el origen y el historial reales de tu perro — no solo el último aeropuerto."
        pt: "Uma estadia recente em um país de risco de raiva pode obrigar ao teste sorológico mesmo que você chegue de um país de baixo risco. O que conta é a origem real e o histórico do seu cachorro — não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Switzerland's framework, then confirm your dog's exact origin and history with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre suisse, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Suiza y luego confirma el origen y el historial exactos de tu perro con tu veterinario."
    pt: "Então leia as exigências abaixo como o quadro suíço e depois confirme com seu veterinário a origem e o histórico exatos do seu cachorro."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Must be implanted before the rabies vaccination.", fr: "Doit être posée avant la vaccination antirabique.", es: "Debe implantarse antes de la vacunación antirrábica.", pt: "Deve ser implantado antes da vacinação antirrábica." }
    exceptions: { en: "A tattoo is accepted only if it can be proven it was done before 3 July 2011.", fr: "Un tatouage n'est accepté que s'il peut être prouvé qu'il est antérieur au 3 juillet 2011.", es: "Un tatuaje solo se acepta si se puede demostrar que se hizo antes del 3 de julio de 2011.", pt: "Uma tatuagem só é aceita se for possível provar que foi feita antes de 3 de julho de 2011." }
    ref: { en: "IETPO (SR 916.443.14); FSVO blv.admin.ch", fr: "OITE-AC (RS 916.443.14) ; OSAV blv.admin.ch", es: "OITE-AC (RS 916.443.14); OSAV blv.admin.ch", pt: "OITE-AC (RS 916.443.14); OSAV blv.admin.ch" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Dog at least 12 weeks old at the shot; valid from 21 days after the primary vaccination.", fr: "Chien d'au moins 12 semaines ; valide 21 jours après la primo-vaccination.", es: "Perro de al menos 12 semanas en el momento de la vacuna; válida a partir de los 21 días de la primovacunación.", pt: "Cachorro com pelo menos 12 semanas na data da vacina; válida a partir de 21 dias após a primovacinação." }
    exceptions: { en: "The microchip must already be in place; no waiting period for an early booster.", fr: "La puce doit déjà être posée ; pas de délai pour un rappel effectué avant échéance.", es: "El microchip debe estar ya implantado; sin periodo de espera para un refuerzo hecho antes del vencimiento.", pt: "O microchip já deve estar implantado; sem prazo de espera para um reforço aplicado antes do vencimento." }
    ref: { en: "FSVO blv.admin.ch; IETPO", fr: "OSAV blv.admin.ch ; OITE-AC", es: "OSAV blv.admin.ch; OITE-AC", pt: "OSAV blv.admin.ch; OITE-AC" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Rabies-risk countries only: blood ≥30 days after vaccination, result ≥0.5 IU/ml, then a 3-month wait before entry.", fr: "Pays à risque rabique : sang ≥30 jours après le vaccin, résultat ≥0,5 UI/ml, puis délai de 3 mois avant l'entrée.", es: "Solo países con riesgo de rabia: sangre ≥30 días tras la vacuna, resultado ≥0,5 UI/ml, y luego una espera de 3 meses antes de la entrada.", pt: "Apenas países de risco de raiva: sangue coletado ≥30 dias após a vacinação, resultado ≥0,5 UI/ml e, depois, 3 meses de espera antes da entrada." }
    exceptions: { en: "Not required from the EU or from low-rabies-risk countries (US, Canada, UK, and others on the FSVO list).", fr: "Non requis depuis l'UE ou les pays à faible risque rabique (USA, Canada, RU… selon la liste OSAV).", es: "No se exige desde la UE ni desde países con bajo riesgo de rabia (EE. UU., Canadá, RU y otros de la lista de la OSAV).", pt: "Não é exigido a partir da UE nem de países de baixo risco de raiva (EUA, Canadá, Reino Unido e outros da lista do OSAV)." }
    ref: { en: "FSVO — list of rabies-risk countries; IETPO", fr: "OSAV — liste des pays à risque rabique ; OITE-AC", es: "OSAV — lista de países con riesgo de rabia; OITE-AC", pt: "OSAV — lista dos países de risco de raiva; OITE-AC" }
  - item: { en: "Pet passport (Swiss or EU)", fr: "Passeport (suisse ou européen)", es: "Pasaporte para mascotas (suizo o europeo)", pt: "Passaporte para animais (suíço ou europeu)" }
    required: { en: "EU origins", fr: "Origines UE", es: "Orígenes de la UE", pt: "Origens na UE" }
    when: { en: "Records the microchip and rabies vaccination; the Swiss and EU passports are mutually recognised.", fr: "Consigne la puce et la vaccination ; les passeports suisse et européen sont mutuellement reconnus.", es: "Registra el microchip y la vacunación antirrábica; los pasaportes suizo y europeo se reconocen mutuamente.", pt: "Registra o microchip e a vacinação antirrábica; os passaportes suíço e europeu são mutuamente reconhecidos." }
    exceptions: { en: "Replaced by a health certificate for third-country origins.", fr: "Remplacé par un certificat sanitaire pour les origines pays tiers.", es: "Se sustituye por un certificado sanitario para orígenes de países terceros.", pt: "Substituído por um certificado sanitário nas origens de países terceiros." }
    ref: { en: "FSVO blv.admin.ch", fr: "OSAV blv.admin.ch", es: "OSAV blv.admin.ch", pt: "OSAV blv.admin.ch" }
  - item: { en: "Animal health certificate", fr: "Certificat sanitaire", es: "Certificado sanitario animal", pt: "Atestado de saúde animal" }
    required: { en: "Third-country origins", fr: "Origines pays tiers", es: "Orígenes de países terceros", pt: "Origens de países terceiros" }
    when: { en: "Issued/endorsed by an official vet before departure; FSVO certificate template for non-commercial pet movements.", fr: "Établi/visé par un vétérinaire officiel avant départ ; modèle de certificat OSAV pour mouvements non commerciaux.", es: "Expedido/refrendado por un veterinario oficial antes de la salida; modelo de certificado de la OSAV para movimientos no comerciales.", pt: "Emitido/endossado por um veterinário oficial antes da partida; modelo de certificado do OSAV para movimentações não comerciais de animais de estimação." }
    exceptions: { en: "Not needed for EU origins (pet passport instead).", fr: "Inutile pour les origines UE (passeport à la place).", es: "No necesario para orígenes de la UE (en su lugar, el pasaporte para mascotas).", pt: "Desnecessário nas origens da UE (o passaporte para animais faz esse papel)." }
    ref: { en: "FSVO — health certificate for pets", fr: "OSAV — certificat sanitaire pour animaux de compagnie", es: "OSAV — certificado sanitario para animales de compañía", pt: "OSAV — certificado sanitário para animais de estimação" }
  - item: { en: "Tapeworm (Echinococcus) treatment", fr: "Traitement échinococcose", es: "Tratamiento contra la tenia (Echinococcus)", pt: "Tratamento contra a tênia (Echinococcus)" }
    required: { en: "Not required", fr: "Non requis", es: "No obligatorio", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Switzerland does not require Echinococcus treatment on entry.", fr: "La Suisse n'exige pas de traitement contre l'échinococcose à l'entrée.", es: "Suiza no exige tratamiento contra Echinococcus a la entrada.", pt: "A Suíça não exige tratamento contra Echinococcus na entrada." }
    ref: { en: "FSVO blv.admin.ch", fr: "OSAV blv.admin.ch", es: "OSAV blv.admin.ch", pt: "OSAV blv.admin.ch" }
  - item: { en: "Import licence / customs declaration", fr: "Autorisation d'import / déclaration en douane", es: "Autorización de importación / declaración en aduana", pt: "Autorização de importação / declaração aduaneira" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "FSVO import licence for dogs from rabies-risk countries by air; declare the dog to customs and pay 8.1% VAT on its value above the CHF 300 travellers' allowance.", fr: "Autorisation d'import OSAV pour les chiens de pays à risque rabique par avion ; déclare le chien à la douane et paie la TVA de 8,1 % sur sa valeur au-delà de la franchise voyageurs de 300 CHF.", es: "Autorización de importación de la OSAV para los perros procedentes de países con riesgo de rabia por vía aérea; declara el perro en aduanas y paga el IVA del 8,1 % sobre su valor por encima de la franquicia para viajeros de 300 CHF.", pt: "Autorização de importação do OSAV para cachorros que chegam de avião de países de risco de raiva; declare o cachorro na alfândega e pague 8,1% de IVA sobre o valor que ultrapassar a franquia de viajante de 300 francos suíços." }
    exceptions: { en: "No import licence for entry from the EU or from low-rabies-risk countries.", fr: "Pas d'autorisation d'import pour une entrée depuis l'UE ou un pays à faible risque rabique.", es: "Sin autorización de importación para la entrada desde la UE o desde un país con bajo riesgo de rabia.", pt: "Sem autorização de importação para a entrada a partir da UE ou de países de baixo risco de raiva." }
    ref: { en: "FOCBS bazg.admin.ch; FSVO", fr: "OFDF bazg.admin.ch ; OSAV", es: "OFDF bazg.admin.ch; OSAV", pt: "OFDF bazg.admin.ch; OSAV" }
  - item: { en: "Border check (documents & identity)", fr: "Contrôle frontalier (documents & identité)", es: "Control fronterizo (documentos e identidad)", pt: "Controle de fronteira (documentos e identidade)" }
    required: { en: "Third-country arrivals", fr: "Arrivées pays tiers", es: "Llegadas de países terceros", pt: "Chegadas de países terceiros" }
    when: { en: "From a third country, enter by direct air via Basel, Geneva or Zurich and present the dog at the red customs channel.", fr: "Depuis un pays tiers, entre par vol direct via Bâle, Genève ou Zurich et présente le chien au canal rouge de la douane.", es: "Desde un país tercero, entra por vuelo directo vía Basilea, Ginebra o Zúrich y presenta el perro en el canal rojo de aduanas.", pt: "Vindo de um país terceiro, entre por voo direto via Basileia, Genebra ou Zurique e apresente o cachorro no canal vermelho da alfândega." }
    exceptions: { en: "No systematic check for arrivals from the EU — keep the pet passport with you.", fr: "Pas de contrôle systématique pour les arrivées de l'UE — garde le passeport sur toi.", es: "Sin control sistemático para las llegadas desde la UE — lleva contigo el pasaporte para mascotas.", pt: "Sem controle sistemático nas chegadas da UE — leve o passaporte para animais com você." }
