    exceptions: { en: "No systematic check for intra-EU arrivals.", fr: "Pas de contrôle systématique pour les arrivées intra-UE.", es: "Sin control sistemático para las llegadas intracomunitarias.", pt: "Sem controle sistemático para as chegadas de dentro da UE." }
