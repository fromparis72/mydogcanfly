restrictedDogs:
  intro:
    en: "Bulgaria has no national breed-specific dangerous-dog ban. There is no list of prohibited breeds; the Animal Protection Act and the Veterinary Medical Activity Act rely on an owner-responsibility model rather than on the dog's breed."
    fr: "La Bulgarie n'a aucune interdiction nationale de chiens dangereux fondée sur la race. Il n'existe pas de liste de races interdites ; la Loi sur la protection des animaux et la Loi sur l'activité vétérinaire reposent sur un modèle de responsabilité du propriétaire plutôt que sur la race du chien."
    es: "Bulgaria no tiene ninguna prohibición nacional de perros peligrosos basada en la raza. No existe una lista de razas prohibidas; la Ley de Protección de los Animales y la Ley de Actividad Médico-Veterinaria se basan en un modelo de responsabilidad del propietario en lugar de en la raza del perro."
    pt: "A Bulgária não tem nenhuma proibição nacional de cachorros perigosos baseada na raça. Não existe lista de raças proibidas; a Lei de Proteção dos Animais (Zakon za zashtita na zhivotnite) e a Lei da Atividade Médico-Veterinária adotam um modelo de responsabilidade do dono, e não um critério de raça."
  cat1:
    en: "No breed is banned from import or ownership on the basis of its type. Bulgarian law regulates individual dogs shown to be aggressive or dangerous, together with responsible-ownership duties, instead of outlawing specific breeds."
    fr: "Aucune race n'est interdite d'importation ou de détention en raison de son type. La loi bulgare encadre les chiens individuellement reconnus agressifs ou dangereux, avec des obligations de détention responsable, plutôt que de proscrire des races précises."
    es: "Ninguna raza está prohibida para la importación o la tenencia en función de su tipo. La ley búlgara regula los perros reconocidos individualmente como agresivos o peligrosos, junto con obligaciones de tenencia responsable, en lugar de proscribir razas concretas."
    pt: "Nenhuma raça é proibida de importação ou de posse por causa do seu tipo. A lei búlgara regula os cachorros que se mostrem individualmente agressivos ou perigosos, junto com os deveres de posse responsável, em vez de proibir raças específicas."
  cat2:
    en: "Owners must register their dog and meet general obligations (leash in public, and a muzzle where required, for example on public transport). Individual municipalities may add local rules, so obligations can vary from one town to another."
    fr: "Les propriétaires doivent enregistrer leur chien et respecter des obligations générales (laisse dans l'espace public, et muselière si requise, par exemple dans les transports en commun). Chaque commune peut ajouter des règles locales, si bien que les obligations varient d'une ville à l'autre."
    es: "Los propietarios deben registrar a su perro y cumplir con obligaciones generales (correa en la vía pública, y bozal cuando sea necesario, por ejemplo en el transporte público). Cada municipio puede añadir normas locales, por lo que las obligaciones pueden variar de una ciudad a otra."
    pt: "Os donos precisam registrar o cachorro e cumprir obrigações gerais (guia em local público e focinheira onde for exigido, por exemplo no transporte público). Cada município pode acrescentar regras locais, então as obrigações mudam de cidade para cidade."
  note:
    en: "Because there is no national breed ban, no dog is refused entry for its breed alone. Check the municipal rules of your destination town and confirm current local requirements before travelling."
    fr: "Comme il n'y a pas d'interdiction nationale de race, aucun chien n'est refusé à l'entrée pour sa seule race. Vérifie les règles municipales de ta ville de destination et confirme les obligations locales en vigueur avant de voyager."
    es: "Como no hay una prohibición nacional de razas, no se rechaza la entrada de ningún perro solo por su raza. Consulta las normas municipales de tu ciudad de destino y confirma los requisitos locales en vigor antes de viajar."
    pt: "Como não há proibição nacional por raça, nenhum cachorro tem a entrada recusada apenas pela raça. Consulte as regras municipais da cidade de destino e confirme as exigências locais em vigor antes de viajar."

