origin:
  scheme: eu
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate and normally no border check."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire et normalement pas de contrôle frontalier."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario y normalmente sin control fronterizo."
      pt: "Um cachorro vindo de outro país da UE precisa de um passaporte europeu que comprove um microchip ISO válido e uma vacinação antirrábica em dia. Sem teste sorológico, sem certificado sanitário e, normalmente, sem controle de fronteira."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Switzerland, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination and an EU animal health certificate endorsed by an official vet before departure. No antibody test is required; present yourself to customs at a travellers' point of entry."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Suisse, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire européen visé par un vétérinaire officiel avant le départ. Pas de titrage ; présente-toi à la douane à un point d'entrée voyageurs."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Suiza, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal de la UE refrendado por un veterinario oficial antes de la salida. No se exige prueba de titulación; preséntate ante las aduanas en un punto de entrada de viajeros."
      pt: "Vindo de um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Suíça, Japão, Austrália e outros), seu cachorro precisa de microchip, vacinação antirrábica válida e certificado sanitário europeu endossado por um veterinário oficial antes da partida. Não é exigido teste sorológico; apresente-se à alfândega em um ponto de entrada de viajantes."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-designated laboratory, then a compulsory 3-month wait before entry. An endorsed EU animal health certificate is also required."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen visé est également requis."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exige un certificado sanitario animal de la UE refrendado."
      pt: "Vindo de um país não listado (de risco), acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório designado pela UE, e depois 3 meses obrigatórios de espera antes da entrada. Também é exigido um certificado sanitário europeu endossado."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Bulgaria depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien en Bulgarie dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Bulgaria depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega à Bulgária depende do país de onde você veio."
  points:
    - from: eu
      en: "From another EU country: no systematic border check — keep the EU pet passport with you."
      fr: "Depuis un autre pays de l'UE : pas de contrôle systématique — garde le passeport européen sur toi."
      es: "Desde otro país de la UE: sin control fronterizo sistemático — lleva contigo el pasaporte europeo."
      pt: "De outro país da UE: sem controle de fronteira sistemático — leve o passaporte europeu com você."
    - from: non_eu
      en: "From outside the EU: enter via a designated travellers' point of entry and present yourself spontaneously to Bulgarian customs for documentary and identity checks."
      fr: "Depuis hors UE : entre par un point d'entrée voyageurs désigné et présente-toi spontanément à la douane bulgare pour les contrôles documentaires et d'identité."
      es: "Desde fuera de la UE: entra por un punto de entrada de viajeros designado y preséntate espontáneamente ante las aduanas búlgaras para los controles documentales y de identidad."
      pt: "De fora da UE: entre por um ponto de entrada de viajantes designado e apresente-se espontaneamente à alfândega búlgara para as conferências documental e de identidade."
    - en: "No import permit is issued and no prior appointment with customs is needed for non-commercial pet movements."
      fr: "Aucun permis d'import n'est délivré et aucun rendez-vous préalable avec la douane n'est nécessaire pour le mouvement non commercial des animaux de compagnie."
      es: "No se expide ningún permiso de importación ni se necesita cita previa con las aduanas para el movimiento no comercial de animales de compañía."
      pt: "Não é emitida autorização de importação e não é preciso agendamento prévio com a alfândega para a circulação não comercial de animais de companhia."
    - en: "Carry original documents (not copies); the Bulgarian Food Safety Agency (BFSA/BABH) is the competent veterinary authority."
      fr: "Munis-toi des documents originaux (pas de copies) ; l'Agence bulgare de sécurité des aliments (BABH/BFSA) est l'autorité vétérinaire compétente."
      es: "Lleva los documentos originales (no copias); la Agencia Búlgara de Seguridad Alimentaria (BFSA/BABH) es la autoridad veterinaria competente."
      pt: "Leve os documentos originais (não cópias); a BFSA/BABH (Agência Búlgara de Segurança Alimentar) é a autoridade veterinária competente."
    - en: "If documents are missing or invalid, authorities may order re-export, quarantine or other measures — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, les autorités peuvent ordonner réexpédition, quarantaine ou autres mesures — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, las autoridades pueden ordenar la reexpedición, la cuarentena u otras medidas — a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, as autoridades podem determinar a reexportação, a quarentena ou outras medidas — às custas do dono."

