# Country Entry Guide — Gabon (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_ga
iso2: "GA"
name: { en: "Gabon", fr: "Gabon", es: "Gabón", pt: "Gabão" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
exit:
  authority: Direction Générale de l'Élevage
  authorityUrl: https://www.agriculture.gouv.ga
  intro:
    en: "Gabon is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Direction Générale de l'Élevage (veterinary services)."
    fr: "Le Gabon est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par la Direction Générale de l'Élevage (services vétérinaires)."
    es: "Gabón no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por la Direction Générale de l'Élevage (servicios veterinarios)."
    pt: "O Gabão é um país não listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pela Direction Générale de l'Élevage (serviços veterinários)."
  steps:
    - timing: longlead
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Providenciar com antecedência o teste sorológico antirrábico (titulação): exame de sangue em laboratório aprovado pela UE, pelo menos 30 dias após a vacinação — um resultado válido é indispensável para voltar à UE e não pode ser resolvido de última hora."
    - timing: window
      text:
        en: "The ministry's livestock and veterinary directorate endorses the export health certificate before departure."
        fr: "La direction de l'élevage et des services vétérinaires du ministère vise le certificat sanitaire d'export avant le départ."
        es: "La dirección de ganadería y servicios veterinarios del ministerio refrenda el certificado sanitario de exportación antes de salir."
        pt: "A diretoria de pecuária e veterinária do ministério endossa o atestado de saúde de exportação antes da partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o cachorro já tinha um teste sorológico antirrábico (titulação) válido para a UE antes da partida, ele permanece válido por toda a vida enquanto a vacinação antirrábica estiver em dia — vale a pena verificar isso antes de viajar."

hero:
  h1: { en: "Traveling to Gabon with your dog", fr: "Voyager au Gabon avec ton chien", es: "Viajar a Gabón con tu perro", pt: "Viajar para o Gabão com seu cachorro" }
  intro:
    en: >-
      Gabon accepts pet dogs, but it publishes very little of its own detail, so much of the exact
      procedure has to be confirmed directly with the authorities. The animal-health authority is the
      Ministry of Agriculture, Livestock and Rural Development and its Directorate-General for Livestock
      (Direction Générale de l'Élevage — the veterinary services), while the Gabonese Food Safety Agency
      (Agence Gabonaise de Sécurité Alimentaire, AGASA) controls sanitary imports and runs the border
      inspection posts. In practice your dog will need a valid rabies vaccination and an official
      international veterinary health certificate signed by the veterinary authority of the country of
      departure, and Gabon operates an import-authorization system for animals. Gabon lies in a
      rabies-affected region, so the rabies rule is central. Because so many specifics are simply not
      published, this guide clearly separates what an official source confirms from what remains unknown —
      always confirm the exact, current procedure with your vet, the Directorate-General for Livestock and
      AGASA before you book.
    fr: >-
      Le Gabon accepte les chiens de compagnie, mais il publie très peu de détails propres : une grande
      partie de la procédure exacte doit être confirmée directement auprès des autorités. L'autorité
      sanitaire est le Ministère de l'Agriculture, de l'Élevage et du Développement Rural et sa Direction
      Générale de l'Élevage (les services vétérinaires), tandis que l'Agence Gabonaise de Sécurité
      Alimentaire (AGASA) contrôle les importations sanitaires et exploite les postes d'inspection
      frontaliers. En pratique, ton chien aura besoin d'une vaccination antirabique valide et d'un
      certificat sanitaire vétérinaire international officiel signé par l'autorité vétérinaire du pays de
      départ, et le Gabon applique un système d'autorisation d'importation pour les animaux. Le Gabon se
      situe dans une région touchée par la rage : la règle antirabique est donc centrale. De nombreux
      points n'étant tout simplement pas publiés, ce guide distingue clairement ce qu'une source officielle
      confirme de ce qui reste inconnu — confirme toujours la procédure exacte et à jour avec ton
      vétérinaire, la Direction Générale de l'Élevage et l'AGASA avant de réserver.
    es: >-
      Gabón acepta a los perros de compañía, pero publica muy pocos detalles propios, por lo que gran
      parte del procedimiento exacto debe confirmarse directamente con las autoridades. La autoridad
      sanitaria animal es el Ministerio de Agricultura, Ganadería y Desarrollo Rural y su Dirección
      General de Ganadería (Direction Générale de l'Élevage — los servicios veterinarios), mientras que
      la Agencia Gabonesa de Seguridad Alimentaria (Agence Gabonaise de Sécurité Alimentaire, AGASA)
      controla las importaciones sanitarias y gestiona los puestos de inspección fronterizos. En la
      práctica, tu perro necesitará una vacunación antirrábica válida y un certificado sanitario
      veterinario internacional oficial firmado por la autoridad veterinaria del país de salida, y Gabón
      aplica un sistema de autorización de importación para los animales. Gabón se sitúa en una región
      afectada por la rabia, por lo que la norma antirrábica es central. Como muchos detalles simplemente
      no están publicados, esta guía separa con claridad lo que una fuente oficial confirma de lo que
      sigue siendo desconocido — confirma siempre el procedimiento exacto y actualizado con tu
      veterinario, la Dirección General de Ganadería y la AGASA antes de reservar.

    pt: "O Gabão aceita cachorros de companhia, mas publica muito poucos detalhes próprios, de modo que boa parte do procedimento exato precisa ser confirmada diretamente com as autoridades. A autoridade de saúde animal é o Ministério da Agricultura, Pecuária e Desenvolvimento Rural e sua Diretoria-Geral de Pecuária (Direction Générale de l'Élevage — os serviços veterinários), enquanto a Agência Gabonesa de Segurança Alimentar (Agence Gabonaise de Sécurité Alimentaire, AGASA) controla as importações sanitárias e administra os postos de inspeção de fronteira. Na prática, o cachorro precisará de uma vacinação antirrábica válida e de um atestado de saúde veterinário internacional oficial, assinado pela autoridade veterinária do país de partida, e o Gabão opera um sistema de autorização de importação para animais. O Gabão está numa região afetada pela raiva, por isso a regra da raiva é central. Como muitos detalhes simplesmente não são publicados, este guia separa claramente o que é confirmado por uma fonte oficial do que permanece não comunicado — confirmar sempre o procedimento exato e atual com o veterinário, com a Diretoria-Geral de Pecuária e com a AGASA antes de reservar."
difficulty:
  level: difficult
  label: { en: "Difficult — import authorization framework and very little published detail", fr: "Difficile — cadre d'autorisation d'importation et très peu de détails publiés", es: "Difícil — marco de autorización de importación y muy pocos detalles publicados", pt: "Difícil — quadro de autorização de importação e muito poucos detalhes publicados" }

prepTime:
  eu:
    en: "From the EU: Gabon publishes no EU-specific model, so allow several weeks. Have the microchip and rabies vaccination in order, then an official EU vet issues and endorses an international veterinary health certificate close to departure, and confirm with AGASA whether an import authorization is needed for an accompanying pet."
    fr: "Depuis l'UE : le Gabon ne publie pas de modèle propre à l'UE, prévois donc plusieurs semaines. Mets la puce et la vaccination antirabique en règle, puis un vétérinaire officiel de l'UE établit et vise un certificat sanitaire vétérinaire international peu avant le départ ; confirme auprès de l'AGASA si une autorisation d'importation est nécessaire pour un animal accompagné."
    es: "Desde la UE: Gabón no publica un modelo específico para la UE, así que reserva varias semanas. Ten en regla el microchip y la vacunación antirrábica; después, un veterinario oficial de la UE expide y refrenda un certificado sanitario veterinario internacional poco antes de la salida, y confirma con la AGASA si se necesita una autorización de importación para una mascota acompañada."
    pt: "Da UE: o Gabão não publica um modelo específico para a UE, portanto contar com várias semanas. Deixar o microchip e a vacinação antirrábica em dia; depois, um veterinário oficial da UE emite e endossa um atestado de saúde veterinário internacional perto da partida, e confirmar com a AGASA se uma autorização de importação é necessária para um animal que viaja acompanhado."
  listed:
    en: "From the United States: USDA/APHIS publishes no dog or cat export certificate for Gabon. APHIS advises that the importer apply for an import permit at the appropriate Gabonese ministry, which will outline the requirements — allow several weeks and start with the Directorate-General for Livestock and AGASA."
    fr: "Depuis les États-Unis : l'USDA/APHIS ne publie aucun certificat d'exportation de chiens ou de chats pour le Gabon. L'APHIS conseille que l'importateur demande un permis d'importation auprès du ministère gabonais compétent, qui précisera les exigences — prévois plusieurs semaines et commence par la Direction Générale de l'Élevage et l'AGASA."
    es: "Desde Estados Unidos: el USDA/APHIS no publica ningún certificado de exportación de perros o gatos para Gabón. El APHIS aconseja que el importador solicite un permiso de importación al ministerio gabonés competente, que detallará los requisitos — reserva varias semanas y empieza por la Dirección General de Ganadería y la AGASA."
    pt: "Dos Estados Unidos: o USDA/APHIS não publica um certificado de exportação para cachorros ou gatos com destino ao Gabão. O APHIS orienta o importador a solicitar uma autorização de importação junto ao ministério gabonês competente, que definirá as exigências — contar com várias semanas e começar pela Diretoria-Geral de Pecuária e pela AGASA."
  nonListed:
    en: "From other origins: the same core elements apply — valid rabies vaccination, an official international veterinary certificate endorsed by the origin's authority, and a likely AGASA import authorization plus border inspection. Timelines and conditions are not published, so confirm directly before booking."
    fr: "Depuis d'autres origines : les mêmes éléments de base s'appliquent — vaccination antirabique valide, certificat vétérinaire international officiel visé par l'autorité d'origine, et probable autorisation d'importation de l'AGASA avec inspection frontalière. Les délais et conditions ne sont pas publiés ; confirme directement avant de réserver."
    es: "Desde otros orígenes: se aplican los mismos elementos básicos — vacunación antirrábica válida, un certificado veterinario internacional oficial refrendado por la autoridad de origen y una probable autorización de importación de la AGASA más la inspección fronteriza. Los plazos y las condiciones no están publicados, así que confirma directamente antes de reservar."
    pt: "De outras origens: aplicam-se os mesmos elementos essenciais — vacinação antirrábica válida, certificado veterinário internacional oficial endossado pela autoridade de origem, e provável autorização de importação da AGASA, além de inspeção de fronteira. Os prazos e as condições não são publicados, portanto confirmar diretamente antes de reservar."

