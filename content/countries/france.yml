    exceptions: { en: "Puppies under 12 weeks cannot be vaccinated, so cannot enter from outside the EU; an imported dog must also have at least one adult tooth.", fr: "Un chiot de moins de 12 semaines ne peut être vacciné, donc ne peut entrer depuis hors UE ; un chien importé doit aussi avoir au moins une dent d'adulte.", es: "Un cachorro de menos de 12 semanas no puede vacunarse, por lo que no puede entrar desde fuera de la UE; un perro importado también debe tener al menos un diente de adulto.", pt: "Filhotes com menos de 12 semanas não podem ser vacinados e, por isso, não podem entrar vindos de fora da UE; um cachorro importado também precisa ter pelo menos um dente definitivo." }
