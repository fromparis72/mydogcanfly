origin:
  scheme: eu
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate and normally no border check."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire et normalement pas de contrôle frontalier."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario y normalmente sin control fronterizo."
      pt: "Um cachorro vindo de outro país da UE precisa de um passaporte europeu que comprove um microchip ISO válido e uma vacinação antirrábica em dia. Sem teste sorológico, sem certificado sanitário e, normalmente, sem controle de fronteira."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Switzerland, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination and an EU animal health certificate endorsed by an official vet before departure. No antibody test is required; present yourself to customs at a travellers' point of entry."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Suisse, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire européen visé par un vétérinaire officiel avant le départ. Pas de titrage ; présente-toi à la douane à un point d'entrée voyageurs."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Suiza, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal de la UE refrendado por un veterinario oficial antes de la salida. No se exige prueba de titulación; preséntate ante la aduana en un punto de entrada de viajeros."
      pt: "Vindo de um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Suíça, Japão, Austrália e outros), seu cachorro precisa de microchip, vacinação antirrábica válida e certificado sanitário europeu endossado por um veterinário oficial antes da partida. Não é exigido teste sorológico; apresente-se à alfândega em um ponto de entrada de viajantes."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-designated laboratory, then a compulsory 3-month wait before entry. An endorsed EU animal health certificate is also required."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen visé est également requis."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exige un certificado sanitario animal de la UE refrendado."
      pt: "Vindo de um país não listado (de risco), acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório designado pela UE, e depois 3 meses obrigatórios de espera antes da entrada. Também é exigido um certificado sanitário europeu endossado."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches France depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien en France dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Francia depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega à França depende de onde você partiu."
  points:
    - from: eu
      en: "From another EU country: no systematic border check — keep the EU pet passport with you."
      fr: "Depuis un autre pays de l'UE : pas de contrôle systématique — garde le passeport européen sur toi."
      es: "Desde otro país de la UE: sin control fronterizo sistemático — lleva contigo el pasaporte europeo."
      pt: "De outro país da UE: sem controle de fronteira sistemático — leve o passaporte europeu com você."
    - from: non_eu
      en: "From outside the EU: enter via a designated travellers' point of entry and present yourself spontaneously to French customs for documentary and identity checks."
      fr: "Depuis hors UE : entre par un point d'entrée voyageurs désigné et présente-toi spontanément à la douane française pour les contrôles documentaires et d'identité."
      es: "Desde fuera de la UE: entra por un punto de entrada de viajeros designado y preséntate espontáneamente ante la aduana francesa para los controles documentales y de identidad."
      pt: "De fora da UE: entre por um ponto de entrada de viajantes designado e apresente-se espontaneamente à alfândega francesa para o controle dos documentos e da identidade."
    - en: "No import permit is issued and no prior appointment with customs is needed."
      fr: "Aucun permis d'import n'est délivré et aucun rendez-vous préalable avec la douane n'est nécessaire."
      es: "No se expide ningún permiso de importación ni se necesita cita previa con la aduana."
      pt: "Não é emitida autorização de importação e não é preciso agendamento prévio com a alfândega."
    - en: "Carry original documents (not copies), in French, bilingual or officially translated."
      fr: "Munis-toi des documents originaux (pas de copies), en français, bilingues ou traduits officiellement."
      es: "Lleva los documentos originales (no copias), en francés, bilingües o traducidos oficialmente."
      pt: "Leve os documentos originais (não cópias), em francês, bilíngues ou com tradução oficial."
    - en: "If documents are missing or invalid, customs may order re-export, quarantine or, in the worst case, euthanasia — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, la douane peut ordonner réexpédition, quarantaine ou, au pire, euthanasie — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, la aduana puede ordenar la reexpedición, la cuarentena o, en el peor de los casos, la eutanasia — a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, a alfândega pode determinar a reexportação, a quarentena ou, na pior das hipóteses, a eutanásia — às custas do dono."
    - en: "Category 1 dogs are refused entry, including in transit."
      fr: "Les chiens de catégorie 1 sont refusés à l'entrée, y compris en transit."
      es: "Los perros de categoría 1 tienen la entrada denegada, incluso en tránsito."
      pt: "Os cachorros de categoria 1 têm a entrada recusada, inclusive em trânsito."

travellerExperience: null

restrictedDogs:
  intro:
    en: "France regulates dangerous dogs under the 1999 law (loi n° 99-5), splitting them into two categories by morphology. Only a vet's assessment can categorise a dog."
    fr: "La France réglemente les chiens dangereux (loi n° 99-5 de 1999) en deux catégories selon la morphologie. Seule une évaluation vétérinaire peut catégoriser un chien."
    es: "Francia regula los perros peligrosos mediante la ley de 1999 (loi n° 99-5), dividiéndolos en dos categorías según la morfología. Solo una evaluación veterinaria puede categorizar a un perro."
    pt: "A França regula os cachorros perigosos pela lei de 1999 (loi n° 99-5), que os divide em duas categorias segundo a morfologia. Só a avaliação de um veterinário pode categorizar um cachorro."
  cat1:
    en: "Attack dogs (chiens d'attaque): pit-bull / American Staffordshire type without pedigree, Mastiff (boerbull) type and Tosa without pedigree. Import into France is prohibited — including simple transit — under Article L211-15 of the Rural Code, punishable by up to 6 months in prison and a €15,000 fine."
    fr: "Chiens d'attaque : type pit-bull / American Staffordshire sans pedigree, type mastiff (boerbull) et Tosa sans pedigree. L'importation en France est interdite — y compris le simple transit — selon l'article L211-15 du Code rural, passible de 6 mois de prison et 15 000 € d'amende."
    es: "Perros de ataque (chiens d'attaque): tipo pit-bull / American Staffordshire sin pedigrí, tipo mastín (boerbull) y Tosa sin pedigrí. La importación en Francia está prohibida — incluido el simple tránsito — según el artículo L211-15 del Code rural, con una pena de hasta 6 meses de prisión y una multa de 15 000 €."
    pt: "Cachorros de ataque (chiens d'attaque): tipo pit bull / American Staffordshire sem pedigree, tipo Mastiff (boerbull) e Tosa sem pedigree. A importação para a França é proibida — inclusive o simples trânsito — pelo artigo L211-15 do Código Rural, punível com até 6 meses de prisão e multa de 15 000 €."
  cat2:
    en: "Guard and defence dogs (chiens de garde et de défense): pedigree American Staffordshire Terrier, Rottweiler (with or without pedigree) and pedigree Tosa. Import is allowed, but the owner must meet France's dangerous-dog rules: ownership permit, third-party insurance, muzzle and lead in public, and a behavioural assessment."
    fr: "Chiens de garde et de défense : American Staffordshire Terrier avec pedigree, Rottweiler (avec ou sans pedigree) et Tosa avec pedigree. L'importation est autorisée, mais le propriétaire doit respecter la réglementation des chiens dangereux : permis de détention, assurance responsabilité civile, muselière et laisse en public, et évaluation comportementale."
    es: "Perros de guarda y defensa (chiens de garde et de défense): American Staffordshire Terrier con pedigrí, Rottweiler (con o sin pedigrí) y Tosa con pedigrí. Se permite la importación, pero el propietario debe cumplir la normativa francesa de perros peligrosos: permiso de tenencia, seguro de responsabilidad civil, bozal y correa en la vía pública, y una evaluación del comportamiento."
    pt: "Cachorros de guarda e de defesa (chiens de garde et de défense): American Staffordshire Terrier com pedigree, Rottweiler (com ou sem pedigree) e Tosa com pedigree. A importação é permitida, mas o dono precisa cumprir as regras francesas sobre cachorros perigosos: licença de posse, seguro de responsabilidade civil, focinheira e guia em locais públicos e avaliação comportamental."
  note:
    en: "A dog that merely resembles a listed breed is not automatically categorised — only a veterinary morphology assessment decides. For Category 2 formalities, contact the French Ministry of the Interior."
    fr: "Un chien qui ressemble simplement à une race listée n'est pas automatiquement catégorisé — seule une évaluation morphologique vétérinaire tranche. Pour les formalités de catégorie 2, contacte le ministère de l'Intérieur."
    es: "Un perro que simplemente se parece a una raza listada no se categoriza automáticamente — solo lo decide una evaluación morfológica veterinaria. Para los trámites de categoría 2, ponte en contacto con el Ministerio del Interior francés."
    pt: "Um cachorro que apenas se parece com uma raça listada não é automaticamente categorizado — só uma avaliação morfológica feita por veterinário decide. Para as formalidades da categoria 2, entre em contato com o Ministério do Interior francês."

