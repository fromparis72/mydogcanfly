# Country Entry Guide — France (source of truth, bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_fr
iso2: "FR"
name: { en: "France", fr: "France", es: "Francia", pt: "França" }
region: { en: "Europe (EU)", fr: "Europe (UE)", es: "Europa (UE)", pt: "Europa (UE)" }


regime: eu
domestic:
  intro:
    en: "Domestic flight within France: no border is crossed, so no import formality applies — no EU pet passport, no rabies titer, no entry certificate."
    fr: "Vol intérieur en France : aucune frontière n'est franchie, donc aucune formalité d'import ne s'applique — ni passeport européen, ni titrage, ni certificat d'entrée."
    es: "Vuelo nacional en Francia: no se cruza ninguna frontera, así que no se aplica ningún trámite de importación — ni pasaporte europeo, ni titulación, ni certificado de entrada."
    pt: "Voo doméstico dentro da França: nenhuma fronteira é cruzada, então não se aplica nenhuma formalidade de importação — nem passaporte europeu para animais, nem teste sorológico antirrábico, nem certificado de entrada."
  points:
    - en: "Identification (ISO microchip or tattoo, registered with I-CAD) is mandatory before the age of 4 months — a legal obligation independent of any travel."
      fr: "L'identification (puce ISO ou tatouage, enregistrée à l'I-CAD) est obligatoire avant l'âge de 4 mois — une obligation légale indépendante du voyage."
      es: "La identificación (microchip ISO o tatuaje, registrada en I-CAD) es obligatoria antes de los 4 meses — obligación legal, independiente del viaje."
      pt: "A identificação (microchip ISO ou tatuagem, registrada no I-CAD) é obrigatória antes dos 4 meses de idade — obrigação legal, independente de qualquer viagem."
    - en: "Rabies vaccination is not required by law for domestic travel: that obligation was repealed in January 2008. Exception: category 1 and 2 dogs, for which it is part of the ownership permit."
      fr: "La vaccination antirabique n'est pas exigée par la loi pour un trajet intérieur : cette obligation a été abrogée en janvier 2008. Exception : les chiens de catégorie 1 et 2, pour lesquels elle fait partie du permis de détention."
      es: "La vacuna antirrábica no es exigida por ley para un trayecto nacional: esa obligación fue derogada en enero de 2008. Excepción: perros de categoría 1 y 2, donde forma parte del permiso de tenencia."
      pt: "A vacinação antirrábica não é exigida por lei em viagens dentro do país: essa obrigação foi revogada em janeiro de 2008. Exceção: os cachorros de categoria 1 e 2, para os quais ela faz parte da licença de posse."
    - en: "The airline may still impose its own conditions (a recent health certificate, a minimum age): these are commercial rules with no regulatory force — check with your carrier."
      fr: "La compagnie peut toutefois imposer ses propres conditions (certificat de bonne santé récent, âge minimum) : ce sont des règles commerciales, sans caractère réglementaire — vérifie auprès d'elle."
      es: "La aerolínea puede imponer sus propias condiciones (certificado de buena salud reciente, edad mínima): son reglas comerciales, sin carácter reglamentario — consúltalo con ella."
      pt: "A companhia aérea ainda pode impor suas próprias condições (atestado de saúde recente, idade mínima): são regras comerciais, sem força regulamentar — confirme com a sua companhia."
    - en: "Category 1 dogs are banned from public transport, and Corsica counts as ordinary mainland travel (its separate regime was repealed in 2008)."
      fr: "Les chiens de catégorie 1 sont interdits dans les transports publics, et la Corse relève du territoire métropolitain ordinaire (son régime distinct a été abrogé en 2008)."
      es: "Los perros de categoría 1 tienen prohibido el transporte público, y Córcega se considera territorio metropolitano ordinario (su régimen aparte fue derogado en 2008)."
      pt: "Os cachorros de categoria 1 são proibidos no transporte público, e a Córsega conta como viagem comum dentro do território metropolitano (seu regime à parte foi revogado em 2008)."
  territories:
    - name: { en: "French Guiana", fr: "Guyane", es: "Guayana Francesa", pt: "Guiana Francesa" }
      note:
        en: "The exception: rabies vaccination IS mandatory in both directions (vampire-bat rabies is enzootic), and the dog must be identified beforehand."
        fr: "L'exception : la vaccination antirabique EST obligatoire dans les deux sens (la rage des chauves-souris y est enzootique), et le chien doit être identifié au préalable."
        es: "La excepción: la vacuna antirrábica SÍ es obligatoria en ambos sentidos (la rabia de los murciélagos es enzoótica) y el perro debe estar identificado previamente."
        pt: "A exceção: a vacinação antirrábica É obrigatória nos dois sentidos (a raiva transmitida por morcegos-vampiros é enzoótica) e o cachorro precisa estar identificado previamente."
      url: https://agriculture.gouv.fr/les-principaux-textes-reglementaires-sur-la-rage
    - name: { en: "Guadeloupe", fr: "Guadeloupe", es: "Guadalupe", pt: "Guadalupe" }
      note:
        en: "Identification and a minimum age of 8 weeks; no rabies vaccination required from mainland France. Category 1 dogs are banned."
        fr: "Identification et âge minimum de 8 semaines ; pas de vaccination antirabique exigée depuis la métropole. Les chiens de catégorie 1 sont interdits."
        es: "Identificación y edad mínima de 8 semanas; sin vacuna antirrábica desde la Francia metropolitana. Los perros de categoría 1 están prohibidos."
        pt: "Identificação e idade mínima de 8 semanas; nenhuma vacinação antirrábica exigida a partir da França metropolitana. Os cachorros de categoria 1 são proibidos."
      url: https://daaf.guadeloupe.agriculture.gouv.fr/conditions-sanitaires-d-arrivee-et-de-depart-des-animaux-de-compagnie-en-a1383.html
    - name: { en: "Réunion", fr: "La Réunion", es: "Reunión", pt: "Reunião" }
      note:
        en: "Treated as a movement within national territory, not an import: no particular sanitary condition is required."
        fr: "Considéré comme un mouvement sur le territoire national et non comme une importation : aucune disposition sanitaire particulière n'est requise."
        es: "Se considera un movimiento dentro del territorio nacional, no una importación: no se exige ninguna disposición sanitaria particular."
        pt: "Tratado como deslocamento dentro do território nacional, e não como importação: nenhuma condição sanitária específica é exigida."
      url: https://daaf.reunion.agriculture.gouv.fr/introduction-d-animaux-de-compagnie-a-la-reunion-conditions-particulieres-a332.html
    - name: { en: "Mayotte", fr: "Mayotte", es: "Mayotte", pt: "Mayotte" }
      note:
        en: "Identification and a European pet passport; no rabies vaccination or titer required from mainland France."
        fr: "Identification et passeport européen ; ni vaccination antirabique ni titrage exigés depuis la métropole."
        es: "Identificación y pasaporte europeo; sin vacuna antirrábica ni titulación desde la Francia metropolitana."
        pt: "Identificação e passaporte europeu para animais; nem vacinação antirrábica nem teste sorológico antirrábico exigidos a partir da França metropolitana."
      url: https://daaf.mayotte.agriculture.gouv.fr/IMG/pdf/note_anmx_compagnie_vf.pdf
    - name: { en: "Martinique", fr: "Martinique", es: "Martinica", pt: "Martinica" }
      note:
        en: "No conditions are published by the local authority for arrivals from mainland France — confirm directly with the DAAF before booking."
        fr: "Aucune condition n'est publiée par l'autorité locale pour une arrivée depuis la métropole — confirme directement auprès de la DAAF avant de réserver."
        es: "La autoridad local no publica condiciones para llegadas desde la Francia metropolitana — confírmalo directamente con la DAAF antes de reservar."
        pt: "A autoridade local não publica nenhuma condição para chegadas vindas da França metropolitana — confirme diretamente com a DAAF antes de reservar."
      url: https://daaf.martinique.agriculture.gouv.fr/voyager-avec-son-animal-de-compagnie-a195.html

hero:
  h1: { en: "Traveling to France with your dog", fr: "Voyager en France avec ton chien", es: "Viajar a Francia con tu perro", pt: "Viajar à França com seu cachorro" }
  intro:
    en: >-
      France welcomes dogs, but what you need to prepare depends mainly on the country your dog is
      travelling from — not only on France itself. As an EU member, France applies the EU pet-movement
      rules: an ISO microchip and a valid rabies vaccination are always required. A dog coming from
      another EU country simply needs an EU pet passport. A dog from a listed non-EU country (such as
      the United States, Canada or the United Kingdom) needs an EU animal health certificate but no
      blood test. A dog from a non-listed country faces the longest path, including a rabies antibody test and a three-month wait. This guide explains each case so you know exactly what to
      prepare before you book your flight.
    fr: >-
      La France accueille les chiens, mais ce qu'il faut préparer dépend surtout du pays d'où ton
      chien voyage — pas seulement de la France. En tant qu'État membre de l'UE, la France applique les
      règles européennes de mouvement des animaux : une puce ISO et une vaccination antirabique valide
      sont toujours exigées. Un chien venant d'un autre pays de l'UE a simplement besoin d'un passeport
      européen. Un chien en provenance d'un pays tiers listé (États-Unis, Canada, Royaume-Uni…) a besoin
      d'un certificat sanitaire européen mais pas de prise de sang. Un chien venant d'un pays non listé
      suit le parcours le plus long, avec un titrage antirabique et un délai de trois mois. Ce guide
      détaille chaque cas pour savoir exactement quoi préparer avant de réserver ton vol.
    es: >-
      Francia acoge a los perros, pero lo que debes preparar depende sobre todo del país desde el que
      viaja tu perro — no solo de Francia. Como Estado miembro de la UE, Francia aplica las normas
      europeas de movimiento de animales de compañía: siempre se exigen un microchip ISO y una
      vacunación antirrábica válida. Un perro que llega de otro país de la UE solo necesita un pasaporte
      europeo para mascotas. Un perro procedente de un país tercero listado (como Estados Unidos, Canadá
      o el Reino Unido) necesita un certificado sanitario animal de la UE, pero no una prueba de sangre. Un
      perro de un país no listado se enfrenta al camino más largo, que incluye una prueba de titulación
      de anticuerpos contra la rabia y una espera de tres meses. Esta guía explica cada caso para que
      sepas exactamente qué preparar antes de reservar tu vuelo.

    pt: "A França recebe bem os cachorros, mas o que você precisa preparar depende principalmente do país de onde seu cachorro parte — e não só da França. Como membro da União Europeia, a França aplica as regras europeias de circulação de animais de estimação: microchip ISO e vacinação antirrábica válida são sempre obrigatórios. Um cachorro vindo de outro país da UE precisa apenas do passaporte europeu para animais. Um cachorro vindo de um país listado fora da UE (como Estados Unidos, Canadá ou Reino Unido) precisa de um certificado sanitário europeu, mas não de exame de sangue. Um cachorro vindo de um país não listado enfrenta o caminho mais longo, com teste sorológico antirrábico e três meses de espera. Este guia explica cada caso para você saber exatamente o que preparar antes de comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Easy to difficult (depends on origin)", fr: "Facile à difficile (selon l'origine)", es: "De fácil a difícil (según el origen)", pt: "De fácil a difícil (depende da origem)" }

prepTime:
  eu:
    en: "A few days if the passport is up to date, up to ~3 weeks if the first rabies shot is still needed."
    fr: "Quelques jours si le passeport est à jour, jusqu'à ~3 semaines si la première vaccination reste à faire."
    es: "Unos días si el pasaporte está al día, hasta ~3 semanas si aún falta la primera vacuna antirrábica."
    pt: "Alguns dias se o passaporte estiver em dia, até cerca de 3 semanas se ainda faltar a primeira vacina antirrábica."
  listed:
    en: "~3–4 weeks: 21-day wait after the rabies shot, plus a health certificate valid 10 days."
    fr: "~3–4 semaines : délai de 21 jours après le vaccin, plus un certificat sanitaire valable 10 jours."
    es: "~3–4 semanas: espera de 21 días tras la vacuna antirrábica, más un certificado sanitario válido 10 días."
    pt: "Cerca de 3 a 4 semanas: 21 dias de espera depois da vacina antirrábica, mais um certificado sanitário válido por 10 dias."
  nonListed:
    en: "~4–7 months: antibody test at least 30 days after vaccination, then a compulsory 3-month wait."
    fr: "~4–7 mois : titrage au moins 30 jours après le vaccin, puis un délai obligatoire de 3 mois."
    es: "~4–7 meses: prueba de titulación al menos 30 días después de la vacuna, y luego una espera obligatoria de 3 meses."
    pt: "Cerca de 4 a 7 meses: teste sorológico no mínimo 30 dias depois da vacinação, seguido de 3 meses obrigatórios de espera."

