# Country Entry Guide — Sri Lanka (trilingual EN/FR/ES).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
# Sri Lanka is NOT in the EU. It runs its own national scheme through the Department of
# Animal Production and Health (DAPH) under the Animal Diseases Act No. 59 of 1992.
# An import permit from the Director General, DAPH must be applied for online (Google Form)
# at least 2 weeks before arrival; ISO microchip -> rabies + core vaccinations (distemper,
# parvovirus, infectious hepatitis, leptospirosis) -> negative blood tests for leishmaniasis,
# heartworm antigen and heartworm microfilaria (within 1 month of departure) -> ecto/endo
# parasite treatment -> International Veterinary Health Certificate issued within 10 days of
# export -> quarantine inspection at Katunayake (BIA) -> 30-day home quarantine.
# No rabies antibody test is required by DAPH. No national breed-import ban exists.
# The eu/listed/nonListed slots are repurposed to Sri Lanka's practical paths:
# eu = compliant dog from a country recognised free of the tested diseases (fewest blood tests);
# listed = standard case, full 3-test blood panel required; nonListed = young puppy,
# lapsed vaccination, non-compliant arrival or 3+ animals (extra permit / additional quarantine).
id: country_lk
iso2: "LK"
name: { en: "Sri Lanka", fr: "Sri Lanka", es: "Sri Lanka", pt: "Sri Lanka" }
region: { en: "South Asia", fr: "Asie du Sud", es: "Asia del Sur", pt: "Ásia do Sul" }


regime: non_listed
exit:
  authority: DAPH
  authorityUrl: http://www.daph.gov.lk
  intro:
    en: "Sri Lanka is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Department of Animal Production and Health (DAPH)."
    fr: "Le Sri Lanka est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par le Department of Animal Production and Health (DAPH)."
    es: "Sri Lanka no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el Department of Animal Production and Health (DAPH)."
    pt: "O Sri Lanka é um país não listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para retornar à UE — além de um atestado de saúde de exportação endossado pelo Department of Animal Production and Health (DAPH)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "DAPH veterinary/quarantine officers issue and endorse the international export health certificate before departure."
        fr: "Les agents vétérinaires/de quarantaine du DAPH délivrent et visent le certificat sanitaire d'export international avant le départ."
        es: "Los oficiales veterinarios/de cuarentena del DAPH emiten y refrendan el certificado sanitario de exportación internacional antes de salir."
        pt: "Os veterinários/agentes de quarentena do DAPH emitem e endossam o atestado de saúde internacional de exportação antes da partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Sri Lanka with your dog", fr: "Voyager au Sri Lanka avec ton chien", es: "Viajar a Sri Lanka con tu perro", pt: "Viajar para o Sri Lanka com seu cachorro" }
  intro:
    en: >-
      Sri Lanka welcomes pet dogs, but it runs its own national import scheme through the Department of
      Animal Production and Health (DAPH) — not the EU framework. Under the Animal Diseases Act No. 59 of
      1992, you must first obtain an import permit from the Director General of DAPH, applied for online at
      least two weeks before arrival. Your dog needs an ISO microchip, up-to-date rabies and core
      vaccinations (canine distemper, parvovirus, infectious hepatitis and leptospirosis), negative blood
      tests for leishmaniasis and heartworm, a parasite treatment, and an International Veterinary Health
      Certificate issued by the exporting country's government veterinary authority within ten days of
      export. On arrival, your dog is inspected by animal quarantine officers at the airport and then kept
      under a 30-day home quarantine. Sri Lanka does not require a rabies antibody test. What you must
      prepare depends on your dog's country of origin and travel history, so read this guide before booking.
    fr: >-
      Le Sri Lanka accueille les chiens de compagnie, mais applique son propre régime d'importation via le
      Department of Animal Production and Health (DAPH) — et non le cadre européen. En vertu de l'Animal
      Diseases Act n° 59 de 1992, tu dois d'abord obtenir un permis d'importation auprès du Directeur
      général du DAPH, à demander en ligne au moins deux semaines avant l'arrivée. Ton chien a besoin
      d'une puce ISO, de vaccinations à jour contre la rage et les maladies de base (maladie de Carré,
      parvovirose, hépatite contagieuse et leptospirose), de tests sanguins négatifs pour la leishmaniose
      et la dirofilariose, d'un traitement antiparasitaire, et d'un certificat vétérinaire international
      délivré par l'autorité vétérinaire gouvernementale du pays d'export dans les dix jours avant l'export.
      À l'arrivée, le chien est inspecté par les agents de quarantaine à l'aéroport puis placé en quarantaine
      à domicile pendant 30 jours. Le Sri Lanka n'exige pas de titrage antirabique. Ce que tu dois
      préparer dépend de l'origine et de l'historique de ton chien : lis ce guide avant de réserver.
    es: >-
      Sri Lanka acoge a los perros de compañía, pero aplica su propio régimen nacional de importación a
      través del Department of Animal Production and Health (DAPH) — no el marco europeo. En virtud de la
      Animal Diseases Act n.º 59 de 1992, primero debes obtener un permiso de importación del Director
      General del DAPH, solicitado en línea al menos dos semanas antes de la llegada. Tu perro necesita un
      microchip ISO, vacunas antirrábica y básicas al día (moquillo canino, parvovirus, hepatitis
      infecciosa y leptospirosis), pruebas de sangre negativas para leishmaniasis y dirofilariosis (gusano
      del corazón), un tratamiento antiparasitario, y un Certificado Veterinario Internacional expedido por
      la autoridad veterinaria gubernamental del país exportador dentro de los diez días previos a la
      exportación. A la llegada, tu perro es inspeccionado por los agentes de cuarentena animal en el
      aeropuerto y luego se mantiene en cuarentena domiciliaria de 30 días. Sri Lanka no exige una prueba de
      titulación de rabia. Lo que debes preparar depende del país de origen y del historial de viajes de tu
      perro, así que lee esta guía antes de reservar.

    pt: "O Sri Lanka recebe cachorros de estimação, mas aplica seu próprio esquema nacional de importação por meio do Department of Animal Production and Health (DAPH) — e não o marco da UE. Pelo Animal Diseases Act No. 59 of 1992, você precisa primeiro obter uma autorização de importação junto ao Director General do DAPH, solicitada on-line pelo menos duas semanas antes da chegada. Seu cachorro precisa de um microchip ISO, vacinação antirrábica e vacinas essenciais em dia (cinomose canina, parvovirose, hepatite infecciosa e leptospirose), exames de sangue negativos para leishmaniose e dirofilariose, um tratamento antiparasitário, e um International Veterinary Health Certificate emitido pela autoridade veterinária governamental do país exportador dentro de dez dias antes da exportação. Na chegada, o seu cachorro é inspecionado por agentes de quarentena animal no aeroporto e depois mantido em quarentena domiciliar de 30 dias. O Sri Lanka não exige um teste sorológico antirrábico. O que você precisa preparar depende do país de origem do seu cachorro e do histórico de viagens, então leia este guia antes de reservar."
difficulty:
  level: difficult
  label: { en: "Difficult — import permit, blood-test panel and 30-day home quarantine", fr: "Difficile — permis d'importation, panel de tests sanguins et quarantaine à domicile de 30 jours", es: "Difícil — permiso de importación, panel de análisis de sangre y cuarentena domiciliaria de 30 días", pt: "Difícil — autorização de importação, painel de exames de sangue e quarentena domiciliar de 30 dias" }

prepTime:
  eu:
    en: "Compliant dog from a country recognised free of the tested diseases: ~3–4 weeks — import permit (apply ≥2 weeks before arrival), up-to-date vaccinations, parasite treatment and a health certificate issued within 10 days of export; some or all blood tests waived."
    fr: "Chien conforme venant d'un pays reconnu indemne des maladies testées : ~3 à 4 semaines — permis d'importation (demande ≥2 semaines avant l'arrivée), vaccins à jour, traitement antiparasitaire et certificat sanitaire établi dans les 10 jours avant l'export ; tout ou partie des tests sanguins levés."
    es: "Perro conforme procedente de un país reconocido libre de las enfermedades analizadas: ~3–4 semanas — permiso de importación (solicítalo ≥2 semanas antes de la llegada), vacunas al día, tratamiento antiparasitario y un certificado sanitario expedido dentro de los 10 días previos a la exportación; se eximen algunos o todos los análisis de sangre."
    pt: "Cachorro em conformidade vindo de um país reconhecido como livre das doenças testadas: cerca de 3 a 4 semanas — autorização de importação (solicitada ≥2 semanas antes da chegada), vacinas em dia, tratamento antiparasitário e um atestado de saúde emitido dentro de 10 dias antes da exportação; alguns ou todos os exames de sangue dispensados."
  listed:
    en: "Standard case (full blood panel): ~1–2 months — allow time for negative leishmaniasis and heartworm tests (done within one month of departure) plus the permit, vaccinations, parasite treatment and health certificate."
    fr: "Cas standard (panel sanguin complet) : ~1 à 2 mois — prévois le temps des tests négatifs leishmaniose et dirofilariose (réalisés dans le mois avant le départ), plus le permis, les vaccins, le traitement antiparasitaire et le certificat sanitaire."
    es: "Caso estándar (panel de sangre completo): ~1–2 meses — reserva tiempo para las pruebas negativas de leishmaniasis y dirofilariosis (realizadas dentro del mes anterior a la salida), además del permiso, las vacunas, el tratamiento antiparasitario y el certificado sanitario."
    pt: "Caso padrão (painel completo de exames de sangue): cerca de 1 a 2 meses — reserve tempo para os exames negativos de leishmaniose e dirofilariose (feitos dentro de um mês antes da partida), além da autorização, das vacinas, do tratamento antiparasitário e do atestado de saúde."
  nonListed:
    en: "Young puppy, lapsed vaccination, 3+ animals or a non-compliant arrival: plan several extra weeks — a 3+ animal import needs a separate Import and Export Control permit, and non-compliant dogs risk additional quarantine, return or other legal action."
    fr: "Jeune chiot, vaccination périmée, 3 animaux ou plus, ou arrivée non conforme : prévois plusieurs semaines de plus — un import de 3 animaux ou plus exige un permis distinct du Département du contrôle des importations/exportations, et un chien non conforme risque quarantaine supplémentaire, renvoi ou autres poursuites."
    es: "Cachorro joven, vacunación caducada, 3 o más animales o una llegada no conforme: prevé varias semanas adicionales — la importación de 3 o más animales requiere un permiso independiente del Departamento de Control de Importaciones y Exportaciones, y los perros no conformes se arriesgan a cuarentena adicional, devolución u otras medidas legales."
    pt: "Filhote jovem, vacinação vencida, 3 ou mais animais ou chegada em não conformidade: planeje várias semanas extras — a importação de 3 ou mais animais exige uma autorização separada do Import and Export Control, e cachorros em não conformidade correm o risco de quarentena adicional, devolução ou outras medidas legais."

