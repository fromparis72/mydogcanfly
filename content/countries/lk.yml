restrictedDogs:
  intro:
    en: "Sri Lanka's Department of Animal Production and Health does not publish a breed-specific import ban: the veterinary health requirements for importing dogs apply to all breeds equally, and no breed is named as prohibited from entering the country."
    fr: "Le Department of Animal Production and Health du Sri Lanka ne publie pas d'interdiction d'importation liée à la race : les exigences sanitaires vétérinaires pour l'importation des chiens s'appliquent de la même façon à toutes les races, et aucune race n'est désignée comme interdite d'entrée."
    es: "El Department of Animal Production and Health de Sri Lanka no publica ninguna prohibición de importación específica por raza: los requisitos sanitarios veterinarios para la importación de perros se aplican por igual a todas las razas, y ninguna raza figura como prohibida de entrar en el país."
    pt: "O Department of Animal Production and Health do Sri Lanka não publica uma proibição de importação por raça: as exigências sanitárias veterinárias para a importação de cachorros se aplicam igualmente a todas as raças, e nenhuma raça é citada como proibida de entrar no país."
  cat1:
    en: "There is no national breed-specific import ban. Breeds restricted in some other countries (pit-bull types, Tosa, Rottweiler and similar) are not, in the reviewed DAPH documents, prohibited from being imported into Sri Lanka."
    fr: "Il n'existe aucune interdiction d'importation liée à la race au niveau national. Les races restreintes dans certains autres pays (types pit-bull, Tosa, Rottweiler et similaires) ne sont pas, dans les documents DAPH consultés, interdites d'importation au Sri Lanka."
    es: "No existe ninguna prohibición nacional de importación específica por raza. Las razas restringidas en algunos otros países (tipos pit-bull, Tosa, Rottweiler y similares) no están prohibidas para su importación a Sri Lanka en los documentos del DAPH consultados."
    pt: "Não há uma proibição nacional de importação por raça. Raças restritas em alguns outros países (tipos pit-bull, Tosa, Rottweiler e semelhantes) não são, nos documentos do DAPH analisados, proibidas de serem importadas para o Sri Lanka."
  cat2:
    en: "Restrictions come instead from airline policies: many carriers refuse or restrict snub-nosed (brachycephalic) breeds in the hold and may set their own breed rules. These are not Sri Lankan import bans. Sri Lanka's national animal legislation (the Animal Diseases Act and the older cruelty ordinance) addresses disease control and welfare, not breed bans."
    fr: "Les restrictions proviennent plutôt des politiques des compagnies aériennes : de nombreux transporteurs refusent ou limitent les races brachycéphales (au nez court) en soute et peuvent fixer leurs propres règles de race. Ce ne sont pas des interdictions d'importation sri-lankaises. La législation animale nationale (l'Animal Diseases Act et l'ancienne ordonnance sur la cruauté) traite de la lutte contre les maladies et du bien-être, pas d'interdictions de races."
    es: "Las restricciones provienen más bien de las políticas de las aerolíneas: muchas compañías rechazan o restringen las razas de nariz chata (braquicéfalas) en la bodega y pueden fijar sus propias normas de raza. No se trata de prohibiciones de importación de Sri Lanka. La legislación animal nacional de Sri Lanka (la Animal Diseases Act y la antigua ordenanza sobre crueldad) trata del control de enfermedades y el bienestar, no de prohibiciones de raza."
    pt: "As restrições vêm, em vez disso, das políticas das companhias aéreas: muitas recusam ou restringem raças de focinho achatado (braquicefálicas) no porão e podem estabelecer suas próprias regras de raça. Essas não são proibições de importação do Sri Lanka. A legislação animal nacional do Sri Lanka (o Animal Diseases Act e a antiga ordenança de crueldade) trata do controle de doenças e do bem-estar, não de proibições por raça."
  note:
    en: "Because airline breed policies are stricter than Sri Lankan import law, confirm your dog's breed is accepted by your carrier before booking, and re-check DAPH for any future change to the breed rules."
    fr: "Comme les politiques de race des compagnies aériennes sont plus strictes que la loi sri-lankaise d'importation, vérifie que la race de ton chien est acceptée par ton transporteur avant de réserver, et revérifiez auprès du DAPH toute évolution future des règles de race."
    es: "Como las políticas de raza de las aerolíneas son más estrictas que la ley de importación de Sri Lanka, confirma que tu aerolínea acepta la raza de tu perro antes de reservar, y vuelve a consultar al DAPH ante cualquier cambio futuro en las normas de raza."
    pt: "Como as políticas de raça das companhias aéreas são mais rígidas do que a lei de importação do Sri Lanka, confirme que a raça do seu cachorro é aceita pela sua companhia aérea antes de reservar, e verifique novamente o DAPH para qualquer mudança futura nas regras de raça."

checklist:
  - en: "DAPH import permit applied for online (Google Form) at least 2 weeks before arrival"
    fr: "Permis d'importation DAPH demandé en ligne (formulaire Google) au moins 2 semaines avant l'arrivée"
    es: "Permiso de importación del DAPH solicitado en línea (formulario Google) al menos 2 semanas antes de la llegada"
    pt: "Autorização de importação do DAPH solicitada on-line (formulário Google) pelo menos 2 semanas antes da chegada"
  - en: "ISO-compliant microchip; number on every vaccination record and blood-test report"
    fr: "Puce conforme ISO ; numéro sur chaque carnet de vaccination et rapport de test sanguin"
    es: "Microchip conforme a la norma ISO; número en cada carnet de vacunación e informe de análisis de sangre"
    pt: "Microchip em conformidade com a ISO; número em todo registro de vacinação e laudo de exame de sangue"
  - en: "Rabies vaccination up to date, with valid records"
    fr: "Vaccination antirabique à jour, avec carnet valide"
    es: "Vacunación antirrábica al día, con carnet válido"
    pt: "Vacinação antirrábica em dia, com registros válidos"
  - en: "Core vaccinations up to date: distemper, parvovirus, infectious hepatitis, leptospirosis"
    fr: "Vaccins de base à jour : Carré, parvovirose, hépatite contagieuse, leptospirose"
    es: "Vacunas básicas al día: moquillo, parvovirus, hepatitis infecciosa, leptospirosis"
    pt: "Vacinas essenciais em dia: cinomose, parvovirose, hepatite infecciosa, leptospirose"
  - en: "Negative blood tests for leishmaniasis and heartworm (antigen & microfilaria), within 1 month of departure"
    fr: "Tests sanguins négatifs pour la leishmaniose et la dirofilariose (antigène et microfilaires), dans le mois avant le départ"
    es: "Análisis de sangre negativos para leishmaniasis y dirofilariosis (antígeno y microfilaria), dentro del mes anterior a la salida"
    pt: "Exames de sangue negativos para leishmaniose e dirofilariose (antígeno e microfilária), dentro de 1 mês antes da partida"
  - en: "Parasite treatment (external & internal) certified by a registered vet, within 7 days before travel"
    fr: "Traitement antiparasitaire (externe et interne) certifié par un vétérinaire enregistré, dans les 7 jours avant le voyage"
    es: "Tratamiento antiparasitario (externo e interno) certificado por un veterinario registrado, dentro de los 7 días previos al viaje"
    pt: "Tratamento antiparasitário (externo e interno) certificado por um veterinário registrado, dentro de 7 dias antes da viagem"
  - en: "Original International Veterinary Health Certificate issued within 10 days of export"
    fr: "Certificat vétérinaire international original délivré dans les 10 jours avant l'export"
    es: "Certificado Veterinario Internacional original expedido dentro de los 10 días previos a la exportación"
    pt: "International Veterinary Health Certificate original emitido dentro de 10 dias antes da exportação"
  - en: "Separate Import and Export Control permit if importing 3 or more animals"
    fr: "Permis distinct du contrôle des importations/exportations si 3 animaux ou plus"
    es: "Permiso independiente de Control de Importaciones y Exportaciones si se importan 3 o más animales"
    pt: "Autorização separada do Import and Export Control se importar 3 ou mais animais"
  - en: "Airport quarantine office notified before departure (aqokatunayake@gmail.com); budget LKR 950 on arrival"
    fr: "Bureau de quarantaine de l'aéroport prévenu avant le départ (aqokatunayake@gmail.com) ; prévoir 950 LKR à l'arrivée"
    es: "Oficina de cuarentena del aeropuerto notificada antes de la salida (aqokatunayake@gmail.com); prevé 950 LKR a la llegada"
    pt: "Escritório de quarentena do aeroporto notificado antes da partida (aqokatunayake@gmail.com); reserve LKR 950 para a chegada"
  - en: "Plan for a 30-day home quarantine after arrival; crate that meets the applicable requirements; confirm your breed with the airline"
    fr: "Prévoir une quarantaine à domicile de 30 jours après l'arrivée ; caisse conforme aux exigences applicables ; vérifier ta race auprès de la compagnie"
    es: "Prevé una cuarentena domiciliaria de 30 días tras la llegada; jaula conforme a IATA; confirma la raza con la aerolínea"
    pt: "Planeje uma quarentena domiciliar de 30 dias após a chegada; caixa de transporte em conformidade com a IATA; confirme a raça do seu cachorro com a companhia aérea"

