notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian and Sri Lanka's Department of Animal Production and Health (DAPH) can confirm the exact procedure for your individual dog."
    fr: "Seuls un vétérinaire et le Department of Animal Production and Health (DAPH) du Sri Lanka peuvent confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario y el Department of Animal Production and Health (DAPH) de Sri Lanka pueden confirmar el procedimiento exacto para tu perro."
    pt: "Só um veterinário e o Department of Animal Production and Health (DAPH) do Sri Lanka podem confirmar o procedimento exato para o seu cachorro."
  - en: "The DAPH import permit must be obtained before departure — apply online at least two weeks before arrival."
    fr: "Le permis d'importation du DAPH doit être obtenu avant le départ — demande en ligne au moins deux semaines avant l'arrivée."
    es: "El permiso de importación del DAPH debe obtenerse antes de la salida — solicítalo en línea al menos dos semanas antes de la llegada."
    pt: "A autorização de importação do DAPH precisa ser obtida antes da partida — solicite on-line pelo menos duas semanas antes da chegada."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact steps depend on three things — Sri Lanka (your destination) is only the first."
    fr: "Les étapes exactes dépendent de trois éléments — le Sri Lanka (ta destination) n'est que le premier."
    es: "Los pasos exactos dependen de tres factores — Sri Lanka (tu destino) es solo el primero."
    pt: "As etapas exatas dependem de três fatores — o Sri Lanka (seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Sri Lanka", fr: "Pays de destination — Sri Lanka", es: "País de destino — Sri Lanka", pt: "País de destino — Sri Lanka" }
      text:
        en: "Sri Lanka runs its own DAPH scheme under the Animal Diseases Act No. 59 of 1992: an advance import permit, an ISO microchip, up-to-date rabies and core vaccinations, negative blood tests, a parasite treatment, an International Veterinary Health Certificate and a 30-day home quarantine. It does not use the EU pet-passport system."
        fr: "Le Sri Lanka applique son propre régime DAPH au titre de l'Animal Diseases Act n° 59 de 1992 : permis d'importation préalable, puce ISO, vaccins antirabique et de base à jour, tests sanguins négatifs, traitement antiparasitaire, certificat vétérinaire international et quarantaine à domicile de 30 jours. Il n'utilise pas le passeport européen."
        es: "Sri Lanka aplica su propio régimen del DAPH conforme a la Animal Diseases Act n.º 59 de 1992: un permiso de importación previo, un microchip ISO, vacunas antirrábica y básicas al día, análisis de sangre negativos, un tratamiento antiparasitario, un Certificado Veterinario Internacional y una cuarentena domiciliaria de 30 días. No utiliza el sistema de pasaporte europeo para mascotas."
        pt: "O Sri Lanka aplica seu próprio esquema do DAPH sob o Animal Diseases Act No. 59 of 1992: uma autorização de importação prévia, um microchip ISO, vacinação antirrábica e vacinas essenciais em dia, exames de sangue negativos, um tratamento antiparasitário, um International Veterinary Health Certificate e uma quarentena domiciliar de 30 dias. O país não usa o sistema de passaporte para animais de estimação da UE."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The exporting country's government veterinary authority must issue and endorse the health certificate. It also decides which blood tests you need: if the exporting country is officially recognised free of leishmaniasis or heartworm, testing for that disease is not required."
        fr: "L'autorité vétérinaire gouvernementale du pays d'export doit établir et viser le certificat sanitaire. Elle détermine aussi les tests sanguins nécessaires : si le pays d'export est officiellement reconnu indemne de leishmaniose ou de dirofilariose, le test correspondant n'est pas exigé."
        es: "La autoridad veterinaria gubernamental del país exportador debe expedir y refrendar el certificado sanitario. También determina qué análisis de sangre necesitas: si el país exportador está oficialmente reconocido como libre de leishmaniasis o dirofilariosis, no se exige el análisis de esa enfermedad."
        pt: "A autoridade veterinária governamental do país exportador precisa emitir e endossar o atestado de saúde. Ela também determina quais exames de sangue você precisa: se o país exportador for oficialmente reconhecido como livre de leishmaniose ou dirofilariose, o exame para essa doença não é exigido."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "Your dog's disease exposure and vaccination history shape the blood-test panel and the certificate wording, and quarantine officers may impose additional quarantine if an animal raises a health concern on arrival — regardless of the last airport."
        fr: "L'exposition aux maladies et l'historique de vaccination de ton chien déterminent le panel de tests sanguins et le libellé du certificat, et les agents de quarantaine peuvent imposer une quarantaine supplémentaire si un animal suscite une inquiétude sanitaire à l'arrivée — quel que soit le dernier aéroport."
        es: "La exposición a enfermedades y el historial de vacunación de tu perro determinan el panel de análisis de sangre y el redactado del certificado, y los agentes de cuarentena pueden imponer cuarentena adicional si un animal genera una preocupación sanitaria a la llegada — independientemente del último aeropuerto."
        pt: "A exposição a doenças e o histórico de vacinação do seu cachorro determinam o painel de exames de sangue e o texto do certificado, e os agentes de quarentena podem impor quarentena adicional se um animal levantar alguma preocupação de saúde na chegada — independentemente do último aeroporto."
  note:
    en: "So read the requirements below as Sri Lanka's framework, then confirm your dog's exact origin, history and timeline with your vet and DAPH before you book."
    fr: "Lis donc les exigences ci-dessous comme le cadre sri-lankais, puis confirme l'origine, l'historique et le calendrier exacts de ton chien avec ton vétérinaire et le DAPH avant de réserver."
    es: "Así que lee los requisitos siguientes como el marco de Sri Lanka y luego confirma el origen, el historial y el calendario exactos de tu perro con tu veterinario y el DAPH antes de reservar."
    pt: "Portanto, leia as exigências abaixo como o marco do Sri Lanka e depois confirme com o seu veterinário e o DAPH a origem, o histórico e o cronograma exatos do seu cachorro antes de reservar."

