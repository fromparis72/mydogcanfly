# Country Entry Guide — Ireland (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_ie
iso2: "IE"
name: { en: "Ireland", fr: "Irlande", es: "Irlanda", pt: "Irlanda" }
region: { en: "Europe (EU)", fr: "Europe (UE)", es: "Europa (UE)", pt: "Europa (UE)" }


regime: eu

hero:
  h1: { en: "Traveling to Ireland with your dog", fr: "Voyager en Irlande avec ton chien", es: "Viajar a Irlanda con tu perro", pt: "Viajar para a Irlanda com seu cachorro" }
  intro:
    en: >-
      Ireland welcomes dogs, but what you need to prepare depends mainly on the country your dog is
      travelling from — not only on Ireland itself. As an EU member, Ireland applies the EU pet-movement
      rules: an ISO microchip and a valid rabies vaccination are always required. A dog coming from
      another EU country simply needs an EU pet passport; a dog from a listed non-EU country (such as
      the United States, Canada or Great Britain) needs an EU animal health certificate but no blood
      test; a dog from a non-listed country faces the longest path, including a rabies antibody test and
      a three-month wait. Ireland adds one extra step almost every dog must complete: a tapeworm
      treatment given by a vet shortly before arrival. This guide explains each case so you know exactly
      what to prepare before you book your flight.
    fr: >-
      L'Irlande accueille les chiens, mais ce qu'il faut préparer dépend surtout du pays d'où ton
      chien voyage — pas seulement de l'Irlande. En tant qu'État membre de l'UE, l'Irlande applique les
      règles européennes de mouvement des animaux : une puce ISO et une vaccination antirabique valide
      sont toujours exigées. Un chien venant d'un autre pays de l'UE a simplement besoin d'un passeport
      européen ; un chien en provenance d'un pays tiers listé (États-Unis, Canada, Grande-Bretagne…) a
      besoin d'un certificat sanitaire européen mais pas de prise de sang ; un chien venant d'un pays non
      listé suit le parcours le plus long, avec un titrage antirabique et un délai de trois mois.
      L'Irlande ajoute une étape que presque tous les chiens doivent accomplir : un traitement contre le
      ténia administré par un vétérinaire peu avant l'arrivée. Ce guide détaille chaque cas pour savoir
      exactement quoi préparer avant de réserver ton vol.
    es: >-
      Irlanda acoge a los perros, pero lo que debes preparar depende sobre todo del país desde el que
      viaja tu perro — no solo de Irlanda. Como Estado miembro de la UE, Irlanda aplica las normas
      europeas de movimiento de animales de compañía: siempre se exigen un microchip ISO y una
      vacunación antirrábica válida. Un perro que llega de otro país de la UE solo necesita un pasaporte
      europeo para mascotas; un perro procedente de un país tercero listado (como Estados Unidos, Canadá
      o Gran Bretaña) necesita un certificado sanitario europeo, pero no una prueba de sangre; un perro
      de un país no listado se enfrenta al camino más largo, que incluye una prueba de titulación de
      rabia y una espera de tres meses. Irlanda añade un paso adicional que casi todos los perros deben
      completar: un tratamiento contra la tenia administrado por un veterinario poco antes de la llegada.
      Esta guía explica cada caso para que sepas exactamente qué preparar antes de reservar tu vuelo.

    pt: "A Irlanda recebe bem os cachorros, mas o que você precisa preparar depende principalmente do país de onde seu cachorro parte — e não só da Irlanda em si. Como membro da União Europeia, a Irlanda aplica as regras europeias de circulação de animais de estimação: microchip ISO e vacinação antirrábica válida são sempre obrigatórios. Um cachorro vindo de outro país da UE precisa apenas do passaporte europeu para animais; um cachorro vindo de um país listado fora da UE (como Estados Unidos, Canadá ou Grã-Bretanha) precisa de um certificado sanitário europeu, mas não de exame de sangue; um cachorro vindo de um país não listado enfrenta o caminho mais longo, com teste sorológico antirrábico e três meses de espera. A Irlanda acrescenta uma etapa a mais que quase todo cachorro precisa cumprir: um tratamento contra a tênia aplicado por um veterinário pouco antes da chegada. Este guia explica cada caso para você saber exatamente o que preparar antes de comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Easy to difficult (depends on origin)", fr: "Facile à difficile (selon l'origine)", es: "De fácil a difícil (según el origen)", pt: "De fácil a difícil (depende da origem)" }

prepTime:
  eu:
    en: "A few days if the passport is up to date — plus a vet-recorded tapeworm treatment 24–120 hours before arrival."
    fr: "Quelques jours si le passeport est à jour — plus un traitement contre le ténia consigné par le vétérinaire 24 à 120 heures avant l'arrivée."
    es: "Unos días si el pasaporte está al día — más un tratamiento contra la tenia registrado por el veterinario 24–120 horas antes de la llegada."
    pt: "Alguns dias se o passaporte estiver em dia — mais um tratamento contra a tênia registrado pelo veterinário de 24 a 120 horas antes da chegada."
  listed:
    en: "~3–4 weeks: 21-day wait after the rabies shot, a health certificate valid 10 days, plus the tapeworm treatment and advance notice."
    fr: "~3–4 semaines : délai de 21 jours après le vaccin, certificat sanitaire valable 10 jours, plus le traitement contre le ténia et une notification préalable."
    es: "~3–4 semanas: espera de 21 días tras la vacuna antirrábica, un certificado sanitario válido 10 días, más el tratamiento contra la tenia y la notificación previa."
    pt: "Cerca de 3 a 4 semanas: 21 dias de espera depois da vacina antirrábica, certificado sanitário válido por 10 dias, mais o tratamento contra a tênia e a notificação prévia."
  nonListed:
    en: "~4–7 months: antibody test at least 30 days after vaccination, then a compulsory 3-month wait, plus the tapeworm treatment and advance notice."
    fr: "~4–7 mois : titrage au moins 30 jours après le vaccin, puis un délai obligatoire de 3 mois, plus le traitement contre le ténia et une notification préalable."
    es: "~4–7 meses: prueba de titulación al menos 30 días después de la vacuna, luego una espera obligatoria de 3 meses, más el tratamiento contra la tenia y la notificación previa."
    pt: "Cerca de 4 a 7 meses: teste sorológico no mínimo 30 dias depois da vacinação, seguido de 3 meses obrigatórios de espera, mais o tratamento contra a tênia e a notificação prévia."

