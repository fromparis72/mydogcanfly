notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro."
    pt: "Só um médico-veterinário pode confirmar o procedimento exato para o seu cachorro."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Ireland (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — l'Irlande (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Irlanda (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — a Irlanda (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — Ireland", fr: "Pays de destination — Irlande", es: "País de destino — Irlanda", pt: "País de destino — Irlanda" }
      text:
        en: "Ireland applies the EU pet-movement framework: an ISO microchip and a valid rabies vaccination are always required. Ireland is also one of the few countries that require a tapeworm treatment before arrival."
        fr: "L'Irlande applique le cadre européen : puce ISO et vaccination antirabique valide toujours exigées. L'Irlande fait aussi partie des rares pays qui exigent un traitement contre le ténia avant l'arrivée."
        es: "Irlanda aplica el marco europeo de movimiento de animales: siempre se exigen un microchip ISO y una vacunación antirrábica válida. Irlanda es además uno de los pocos países que exigen un tratamiento contra la tenia antes de la llegada."
        pt: "A Irlanda aplica o quadro europeu de circulação de animais de estimação: microchip ISO e vacinação antirrábica válida são sempre obrigatórios. A Irlanda também é um dos poucos países que exigem tratamento contra a tênia antes da chegada."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Whether your dog leaves from an EU country, a listed non-EU country or a non-listed country decides whether an antibody test, a health certificate and advance notice are required."
        fr: "Que ton chien parte d'un pays de l'UE, d'un pays tiers listé ou d'un pays non listé détermine si un titrage, un certificat sanitaire et une notification préalable sont exigés."
        es: "Que tu perro salga de un país de la UE, de un país tercero listado o de un país no listado determina si se exigen una prueba de titulación, un certificado sanitario y una notificación previa."
        pt: "Partir de um país da UE, de um país listado fora da UE ou de um país não listado é o que define se o teste sorológico, o certificado sanitário e a notificação prévia são exigidos."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "Ireland judges entry on where the dog is actually travelling from, not where it was born or usually lives. A recent stay in a rabies-risk country can trigger an antibody test even if you fly in from an exempt country."
        fr: "L'Irlande juge l'entrée selon le pays d'où le chien voyage réellement, pas son pays de naissance ou de résidence habituelle. Un séjour récent dans un pays à risque rabique peut imposer un titrage même si tu arrives d'un pays exempté."
        es: "Irlanda evalúa la entrada según el país desde el que el perro viaja realmente, no según dónde nació o reside habitualmente. Una estancia reciente en un país con riesgo de rabia puede obligar a una prueba de titulación aunque llegues desde un país exento."
        pt: "A Irlanda avalia a entrada pelo país de onde o cachorro realmente viaja, e não por onde ele nasceu ou mora normalmente. Uma estadia recente em um país de risco de raiva pode acionar a exigência do teste sorológico mesmo que você chegue de um país isento."
  note:
    en: "So read the requirements below as Ireland's framework, then confirm your dog's exact origin and history with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre irlandais, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Irlanda y luego confirma el origen y el historial exactos de tu perro con tu veterinario."
    pt: "Leia então as exigências abaixo como o quadro irlandês, e confirme com seu veterinário a origem e o histórico exatos do seu cachorro."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Must be implanted before the rabies vaccination; readable to ISO standard 11785 (bring a scanner if not).", fr: "Doit être posée avant la vaccination antirabique ; lisible selon la norme ISO 11785 (apporte un lecteur sinon).", es: "Debe implantarse antes de la vacunación antirrábica; legible según la norma ISO 11785 (lleva un lector si no lo es).", pt: "Deve ser implantado antes da vacinação antirrábica; legível conforme a norma ISO 11785 (leve um leitor se não for)." }
    exceptions: { en: "If the microchip cannot be read on arrival, the dog may be quarantined or refused entry.", fr: "Si la puce ne peut être lue à l'arrivée, le chien peut être placé en quarantaine ou refusé.", es: "Si el microchip no puede leerse a la llegada, el perro puede ser puesto en cuarentena o rechazado en la entrada.", pt: "Se o microchip não puder ser lido na chegada, o cachorro pode ser colocado em quarentena ou ter a entrada recusada." }
    ref: { en: "EU Reg. 576/2013; gov.ie / DAFM", fr: "Règl. UE 576/2013 ; gov.ie / DAFM", es: "Regl. UE 576/2013; gov.ie / DAFM", pt: "Regulamento UE 576/2013; gov.ie / DAFM" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Dog at least 12 weeks old at the shot, given after the microchip; valid from at least 21 days after the primary vaccination.", fr: "Chien d'au moins 12 semaines au vaccin, administré après la puce ; valide au moins 21 jours après la primo-vaccination.", es: "Perro de al menos 12 semanas en el momento de la vacuna, administrada después del microchip; válida a partir de al menos 21 días de la primovacunación.", pt: "Cachorro com pelo menos 12 semanas na data da vacina, aplicada depois do microchip; válida a partir de no mínimo 21 dias após a primovacinação." }
    exceptions: { en: "1- or 3-year vaccines accepted; no waiting period for in-date boosters if there was no break in cover.", fr: "Vaccins de 1 ou 3 ans acceptés ; pas de délai pour un rappel à jour sans rupture de couverture.", es: "Se aceptan vacunas de 1 o 3 años; sin periodo de espera para refuerzos en vigor si no hubo interrupción de la cobertura.", pt: "Vacinas de 1 ou 3 anos são aceitas; sem prazo de espera para reforços em dia, se não houve interrupção da cobertura." }
    ref: { en: "EU Reg. 576/2013, Annex III; gov.ie / DAFM", fr: "Règl. UE 576/2013, annexe III ; gov.ie / DAFM", es: "Regl. UE 576/2013, anexo III; gov.ie / DAFM", pt: "Regulamento UE 576/2013, anexo III; gov.ie / DAFM" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Non-listed origins only: blood ≥30 days after vaccination, ≥3 months before entry, result ≥0.5 IU/ml, EU-designated lab.", fr: "Pays non listés : sang ≥30 jours après le vaccin, ≥3 mois avant l'entrée, résultat ≥0,5 UI/ml, labo agréé UE.", es: "Solo orígenes no listados: sangre ≥30 días tras la vacuna, ≥3 meses antes de la entrada, resultado ≥0,5 UI/ml, laboratorio autorizado por la UE.", pt: "Apenas para origens não listadas: sangue coletado ≥30 dias após a vacinação e ≥3 meses antes da entrada, resultado ≥0,5 UI/ml, em laboratório designado pela UE." }
    exceptions: { en: "Not required from the EU or from listed countries (US, Canada, Great Britain, Switzerland, Japan, Australia…).", fr: "Non requis depuis l'UE ou les pays listés (USA, Canada, Grande-Bretagne, Suisse, Japon, Australie…).", es: "No se exige desde la UE ni desde países listados (EE. UU., Canadá, Gran Bretaña, Suiza, Japón, Australia…).", pt: "Não exigido para quem vem da UE ou de países listados (EUA, Canadá, Grã-Bretanha, Suíça, Japão, Austrália…)." }
    ref: { en: "EU Reg. 2020/692; gov.ie / DAFM", fr: "Règl. UE 2020/692 ; gov.ie / DAFM", es: "Regl. UE 2020/692; gov.ie / DAFM", pt: "Regulamento UE 2020/692; gov.ie / DAFM" }
  - item: { en: "EU pet passport", fr: "Passeport européen", es: "Pasaporte europeo para mascotas", pt: "Passaporte europeu para animais" }
    required: { en: "EU origins", fr: "Origines UE", es: "Orígenes de la UE", pt: "Origens na UE" }
    when: { en: "Issued by an EU vet; records the microchip, rabies vaccination and the tapeworm treatment.", fr: "Délivré par un vétérinaire de l'UE ; consigne la puce, la vaccination et le traitement contre le ténia.", es: "Expedido por un veterinario de la UE; registra el microchip, la vacunación antirrábica y el tratamiento contra la tenia.", pt: "Emitido por um veterinário da UE; registra o microchip, a vacinação antirrábica e o tratamento contra a tênia." }
    exceptions: { en: "Ireland also accepts passports from Northern Ireland, Norway, Switzerland, Andorra, Monaco, San Marino, and a few other listed European territories.", fr: "L'Irlande accepte aussi les passeports d'Irlande du Nord, de Norvège, de Suisse, d'Andorre, de Monaco, de Saint-Marin et de quelques autres territoires européens listés.", es: "Irlanda también acepta los pasaportes de Irlanda del Norte, Noruega, Suiza, Andorra, Mónaco, San Marino y algunos otros territorios europeos listados.", pt: "A Irlanda também aceita passaportes da Irlanda do Norte, da Noruega, da Suíça, de Andorra, de Mônaco, de San Marino e de alguns outros territórios europeus listados." }
    ref: { en: "EU Reg. 577/2013; gov.ie / DAFM", fr: "Règl. UE 577/2013 ; gov.ie / DAFM", es: "Regl. UE 577/2013; gov.ie / DAFM", pt: "Regulamento UE 577/2013; gov.ie / DAFM" }
  - item: { en: "EU animal health certificate", fr: "Certificat sanitaire UE", es: "Certificado sanitario animal de la UE", pt: "Certificado sanitário europeu" }
    required: { en: "Non-EU origins", fr: "Origines hors UE", es: "Orígenes fuera de la UE", pt: "Origens fora da UE" }
    when: { en: "Completed by a vet and endorsed by an official (State) vet within 10 days of arrival in the EU; valid then up to 6 months for onward EU travel.", fr: "Rempli par un vétérinaire et visé par un vétérinaire officiel (d'État) dans les 10 jours de l'arrivée dans l'UE ; valable ensuite jusqu'à 6 mois pour circuler dans l'UE.", es: "Cumplimentado por un veterinario y refrendado por un veterinario oficial (del Estado) en los 10 días previos a la llegada a la UE; válido luego hasta 6 meses para circular por la UE.", pt: "Preenchido por um veterinário e endossado por um veterinário oficial (do Estado) nos 10 dias anteriores à chegada à UE; depois, válido por até 6 meses para circular pela UE." }
    exceptions: { en: "Not needed for EU origins (passport instead).", fr: "Inutile pour les origines UE (passeport à la place).", es: "No necesario para orígenes de la UE (en su lugar, el pasaporte).", pt: "Não é necessário para origens na UE (usa-se o passaporte)." }
    ref: { en: "EU Reg. 577/2013, Annex IV; gov.ie / DAFM", fr: "Règl. UE 577/2013, annexe IV ; gov.ie / DAFM", es: "Regl. UE 577/2013, anexo IV; gov.ie / DAFM", pt: "Regulamento UE 577/2013, anexo IV; gov.ie / DAFM" }
  - item: { en: "Tapeworm (Echinococcus) treatment", fr: "Traitement échinococcose (ténia)", es: "Tratamiento contra la tenia (Echinococcus)", pt: "Tratamento contra a tênia (Echinococcus)" }
    required: { en: "Required (dogs)", fr: "Requis (chiens)", es: "Obligatorio (perros)", pt: "Obrigatório (cachorros)" }
    when: { en: "A vet must treat the dog with a praziquantel product no less than 24 hours and no more than 120 hours before arrival, recorded in the passport or health certificate.", fr: "Un vétérinaire doit traiter le chien avec un produit à base de praziquantel entre 24 et 120 heures avant l'arrivée, avec consignation dans le passeport ou le certificat sanitaire.", es: "Un veterinario debe tratar al perro con un producto a base de praziquantel entre 24 y 120 horas antes de la llegada, registrándolo en el pasaporte o en el certificado sanitario.", pt: "Um veterinário precisa tratar o cachorro com um produto à base de praziquantel no mínimo 24 horas e no máximo 120 horas antes da chegada, com registro no passaporte ou no certificado sanitário." }
    exceptions: { en: "Not required only when the dog travels directly from Finland, Malta, Norway or Northern Ireland. Does not apply to cats or ferrets.", fr: "Non requis uniquement si le chien voyage directement depuis la Finlande, Malte, la Norvège ou l'Irlande du Nord. Ne concerne pas les chats ni les furets.", es: "No obligatorio solo cuando el perro viaja directamente desde Finlandia, Malta, Noruega o Irlanda del Norte. No se aplica a gatos ni hurones.", pt: "Só deixa de ser obrigatório quando o cachorro viaja diretamente da Finlândia, de Malta, da Noruega ou da Irlanda do Norte. Não se aplica a gatos nem a furões." }
    ref: { en: "EU Reg. 1152/2011; gov.ie / DAFM", fr: "Règl. UE 1152/2011 ; gov.ie / DAFM", es: "Regl. UE 1152/2011; gov.ie / DAFM", pt: "Regulamento UE 1152/2011; gov.ie / DAFM" }
  - item: { en: "Advance notification / compliance check", fr: "Notification préalable / contrôle de conformité", es: "Notificación previa / control de conformidad", pt: "Notificação prévia / controle de conformidade" }
    required: { en: "Non-EU origins", fr: "Origines hors UE", es: "Orígenes fuera de la UE", pt: "Origens fora da UE" }
    when: { en: "From outside the EU you must give advance notice and book a compliance check on arrival through the DAFM Advance Notice portal.", fr: "Depuis hors UE, tu dois donner un préavis et réserver un contrôle de conformité à l'arrivée via le portail de préavis de la DAFM.", es: "Desde fuera de la UE debes dar una notificación previa y reservar un control de conformidad a la llegada a través del portal de notificación previa de la DAFM.", pt: "Vindo de fora da UE, você precisa fazer a notificação prévia e agendar o controle de conformidade na chegada pelo portal Advance Notice do DAFM." }
    exceptions: { en: "No booking needed for EU/passport arrivals, but spot checks may still occur; a fee applies to most non-EU checks (free from Great Britain and for assistance dogs).", fr: "Aucune réservation pour les arrivées UE/passeport, mais des contrôles inopinés restent possibles ; des frais s'appliquent à la plupart des contrôles hors UE (gratuits depuis la Grande-Bretagne et pour les chiens d'assistance).", es: "No hace falta reserva para las llegadas UE/con pasaporte, pero pueden producirse controles aleatorios; se aplica una tasa a la mayoría de los controles de fuera de la UE (gratuitos desde Gran Bretaña y para perros de asistencia).", pt: "Não é preciso agendar para as chegadas da UE/com passaporte, mas ainda pode haver fiscalização por amostragem; a maioria dos controles vindos de fora da UE é paga (gratuitos a partir da Grã-Bretanha e para cães de assistência)." }
    ref: { en: "SI 141/2020; gov.ie / DAFM", fr: "SI 141/2020 ; gov.ie / DAFM", es: "SI 141/2020; gov.ie / DAFM", pt: "SI 141/2020; gov.ie / DAFM" }
  - item: { en: "Border check & points of entry", fr: "Contrôle frontalier & points d'entrée", es: "Control fronterizo y puntos de entrada", pt: "Controle de fronteira e pontos de entrada" }
    required: { en: "Non-EU arrivals", fr: "Arrivées hors UE", es: "Llegadas de fuera de la UE", pt: "Chegadas de fora da UE" }
    when: { en: "Pets from outside the EU may only enter via Cork Airport, Dublin Airport, Shannon Airport, Dublin Port, the Port of Cork (Ringaskiddy) or Rosslare Europort.", fr: "Les animaux hors UE ne peuvent entrer que par les aéroports de Cork, Dublin, Shannon, le port de Dublin, le port de Cork (Ringaskiddy) ou Rosslare Europort.", es: "Las mascotas de fuera de la UE solo pueden entrar por el aeropuerto de Cork, el aeropuerto de Dublín, el aeropuerto de Shannon, el puerto de Dublín, el puerto de Cork (Ringaskiddy) o Rosslare Europort.", pt: "Animais de estimação vindos de fora da UE só podem entrar pelo aeroporto de Cork, pelo aeroporto de Dublin, pelo aeroporto de Shannon, pelo porto de Dublin, pelo porto de Cork (Ringaskiddy) ou por Rosslare Europort." }
    exceptions: { en: "No systematic check for intra-EU arrivals; keep original documents on you.", fr: "Pas de contrôle systématique pour les arrivées intra-UE ; garde les documents originaux sur toi.", es: "Sin control sistemático para las llegadas intracomunitarias; lleva contigo los documentos originales.", pt: "Sem controle sistemático para as chegadas de dentro da UE; leve os documentos originais com você." }
    ref: { en: "gov.ie / DAFM — Pet Travel", fr: "gov.ie / DAFM — Voyage animaux", es: "gov.ie / DAFM — Viaje de animales", pt: "gov.ie / DAFM — Viagens com animais" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "Effectively ≥15 weeks", fr: "En pratique ≥15 semaines", es: "En la práctica ≥15 semanas", pt: "Na prática, ≥15 semanas" }
    when: { en: "12-week rabies shot + 21-day wait (listed); about 7 months from a non-listed country.", fr: "Vaccin à 12 semaines + 21 jours (pays listé) ; environ 7 mois depuis un pays non listé.", es: "Vacuna a las 12 semanas + espera de 21 días (país listado); unos 7 meses desde un país no listado.", pt: "Vacina antirrábica às 12 semanas + 21 dias de espera (país listado); cerca de 7 meses vindo de um país não listado." }
    exceptions: { en: "Puppies under 12 weeks cannot be vaccinated, so cannot enter from outside the EU.", fr: "Un chiot de moins de 12 semaines ne peut être vacciné, donc ne peut entrer depuis hors UE.", es: "Los cachorros menores de 12 semanas no pueden vacunarse, por lo que no pueden entrar desde fuera de la UE.", pt: "Filhotes com menos de 12 semanas não podem ser vacinados e, portanto, não podem entrar vindos de fora da UE." }
    ref: { en: "EU Reg. 576/2013; gov.ie / DAFM", fr: "Règl. UE 576/2013 ; gov.ie / DAFM", es: "Regl. UE 576/2013; gov.ie / DAFM", pt: "Regulamento UE 576/2013; gov.ie / DAFM" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not required", fr: "Non requise", es: "No obligatoria", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Only if rules are breached — a non-compliant dog may be refused entry or placed in quarantine under official control at the owner's expense.", fr: "Uniquement en cas de non-conformité — un chien non conforme peut être refusé ou placé en quarantaine sous contrôle officiel aux frais du propriétaire.", es: "Solo en caso de incumplimiento — un perro no conforme puede ser rechazado en la entrada o puesto en cuarentena bajo control oficial a cargo del propietario.", pt: "Somente em caso de descumprimento das regras — um cachorro fora das exigências pode ter a entrada recusada ou ser colocado em quarentena sob controle oficial, às custas do dono." }
    ref: { en: "SI 141/2020, Reg. 12(7)", fr: "SI 141/2020, art. 12(7)", es: "SI 141/2020, art. 12(7)", pt: "SI 141/2020, art. 12(7)" }

origin:
  eu:
    title: { en: "Simplified — EU pet passport (+ tapeworm)", fr: "Simplifié — passeport européen (+ ténia)", es: "Simplificado — pasaporte europeo (+ tenia)", pt: "Simplificado — passaporte europeu para animais (+ tênia)" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test and no health certificate — but a vet must still give the tapeworm treatment 24–120 hours before arrival and record it in the passport. Normally no booked border check, though spot checks can happen."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage ni de certificat sanitaire — mais un vétérinaire doit administrer le traitement contre le ténia 24 à 120 heures avant l'arrivée et le consigner dans le passeport. Normalement pas de contrôle réservé, mais des contrôles inopinés restent possibles."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación ni certificado sanitario — pero un veterinario debe administrar igualmente el tratamiento contra la tenia entre 24 y 120 horas antes de la llegada y registrarlo en el pasaporte. Normalmente sin control fronterizo reservado, aunque pueden producirse controles aleatorios."
      pt: "Um cachorro vindo de outro país da UE precisa de um passaporte europeu que comprove um microchip ISO válido e uma vacinação antirrábica em dia. Sem teste sorológico e sem certificado sanitário — mas um veterinário ainda precisa aplicar o tratamento contra a tênia de 24 a 120 horas antes da chegada e registrá-lo no passaporte. Normalmente não há controle de fronteira agendado, embora possa haver fiscalização por amostragem."
    cls: ok
  listed:
    title: { en: "Health certificate + tapeworm, no blood test", fr: "Certificat sanitaire + ténia, sans prise de sang", es: "Certificado sanitario + tenia, sin análisis de sangre", pt: "Certificado sanitário + tênia, sem exame de sangue" }
    body:
      en: "From a listed non-EU country (United States, Canada, Great Britain, Switzerland, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination, an EU animal health certificate endorsed by an official vet, and the tapeworm treatment before arrival. No antibody test is required. You must give advance notice and book a compliance check at one of Ireland's designated points of entry."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Grande-Bretagne, Suisse, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide, d'un certificat sanitaire européen visé par un vétérinaire officiel, et du traitement contre le ténia avant l'arrivée. Pas de titrage. Tu dois donner un préavis et réserver un contrôle de conformité dans l'un des points d'entrée désignés d'Irlande."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Gran Bretaña, Suiza, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida, un certificado sanitario animal de la UE refrendado por un veterinario oficial, y el tratamiento contra la tenia antes de la llegada. No se exige prueba de titulación. Debes dar una notificación previa y reservar un control de conformidad en uno de los puntos de entrada designados de Irlanda."
      pt: "Vindo de um país listado fora da UE (Estados Unidos, Canadá, Grã-Bretanha, Suíça, Japão, Austrália e outros), seu cachorro precisa de microchip, vacinação antirrábica válida, certificado sanitário europeu endossado por um veterinário oficial e o tratamento contra a tênia antes da chegada. Não é exigido teste sorológico. Você precisa fazer a notificação prévia e agendar o controle de conformidade em um dos pontos de entrada designados da Irlanda."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait + tapeworm", fr: "Titrage + 3 mois d'attente + ténia", es: "Prueba de titulación + espera de 3 meses + tenia", pt: "Teste sorológico + 3 meses de espera + tênia" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-designated laboratory, then a compulsory 3-month wait before entry. An endorsed EU animal health certificate, the tapeworm treatment and advance notice with a booked compliance check are also required."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen visé, le traitement contre le ténia et un préavis avec contrôle de conformité réservé sont également requis."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exigen un certificado sanitario animal de la UE refrendado, el tratamiento contra la tenia y una notificación previa con control de conformidad reservado."
      pt: "Vindo de um país não listado (de risco), acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório designado pela UE, e depois 3 meses obrigatórios de espera antes da entrada. Também são exigidos um certificado sanitário europeu endossado, o tratamento contra a tênia e a notificação prévia com controle de conformidade agendado."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Ireland depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien en Irlande dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Irlanda depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega à Irlanda depende de onde você embarcou."
  points:
    - en: "From another EU country: no booked border check — keep the EU pet passport with you, with the tapeworm treatment recorded, as spot checks may occur."
      fr: "Depuis un autre pays de l'UE : pas de contrôle réservé — garde le passeport européen sur toi, avec le traitement contre le ténia consigné, car des contrôles inopinés sont possibles."
      es: "Desde otro país de la UE: sin control fronterizo reservado — lleva contigo el pasaporte europeo, con el tratamiento contra la tenia registrado, ya que pueden producirse controles aleatorios."
      pt: "De outro país da UE: sem controle de fronteira agendado — leve com você o passaporte europeu, com o tratamento contra a tênia registrado, porque pode haver fiscalização por amostragem."
    - en: "From outside the EU: enter only via Cork Airport, Dublin Airport, Shannon Airport, Dublin Port, the Port of Cork (Ringaskiddy) or Rosslare Europort, and undergo the compliance check booked in advance before leaving the arrivals area."
      fr: "Depuis hors UE : entre uniquement par les aéroports de Cork, Dublin, Shannon, le port de Dublin, le port de Cork (Ringaskiddy) ou Rosslare Europort, et passe le contrôle de conformité réservé à l'avance avant de quitter la zone d'arrivée."
      es: "Desde fuera de la UE: entra únicamente por el aeropuerto de Cork, el aeropuerto de Dublín, el aeropuerto de Shannon, el puerto de Dublín, el puerto de Cork (Ringaskiddy) o Rosslare Europort, y pasa el control de conformidad reservado con antelación antes de salir de la zona de llegadas."
      pt: "De fora da UE: entre somente pelo aeroporto de Cork, pelo aeroporto de Dublin, pelo aeroporto de Shannon, pelo porto de Dublin, pelo porto de Cork (Ringaskiddy) ou por Rosslare Europort, e passe pelo controle de conformidade agendado com antecedência antes de sair da área de desembarque."
    - en: "A fee applies to most non-EU compliance checks; checks are free from Great Britain and for accredited assistance/guide dogs."
      fr: "Des frais s'appliquent à la plupart des contrôles hors UE ; ils sont gratuits depuis la Grande-Bretagne et pour les chiens d'assistance/guides accrédités."
      es: "Se aplica una tasa a la mayoría de los controles de conformidad de fuera de la UE; los controles son gratuitos desde Gran Bretaña y para los perros de asistencia/guía acreditados."
      pt: "A maioria dos controles de conformidade vindos de fora da UE é paga; os controles são gratuitos a partir da Grã-Bretanha e para cães de assistência/cães-guia credenciados."
    - en: "Carry original documents, not copies. If importing a pet from outside the EU you may owe customs duty and VAT unless you claim Transfer of Residence relief (Revenue)."
      fr: "Munis-toi des documents originaux, pas de copies. En cas d'importation depuis hors UE, des droits de douane et la TVA peuvent être dus, sauf exonération pour transfert de résidence (Revenue)."
      es: "Lleva los documentos originales, no copias. Si importas una mascota desde fuera de la UE, es posible que debas pagar derechos de aduana e IVA, salvo que solicites la exención por traslado de residencia (Revenue)."
      pt: "Leve os documentos originais, não cópias. Ao importar um animal de estimação de fora da UE, você pode ter de pagar direitos aduaneiros e IVA, a menos que solicite a isenção por transferência de residência (Revenue)."
    - en: "If documents are missing or invalid — including a missing tapeworm treatment — the dog may be refused entry or placed in quarantine under official control, at the owner's expense."
      fr: "Si les documents manquent ou sont invalides — y compris un traitement contre le ténia manquant — le chien peut être refusé ou placé en quarantaine sous contrôle officiel, aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos — incluido un tratamiento contra la tenia ausente — el perro puede ser rechazado en la entrada o puesto en cuarentena bajo control oficial, a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos — inclusive se faltar o tratamento contra a tênia — o cachorro pode ter a entrada recusada ou ser colocado em quarentena sob controle oficial, às custas do dono."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Ireland does not ban any breed and imposes no breed-based import restriction. Instead, the Control of Dogs Regulations 1998 place extra control rules on eleven breeds/types when they are in a public place. This is a public-safety control, not an entry ban."
    fr: "L'Irlande n'interdit aucune race et n'impose aucune restriction d'importation fondée sur la race. En revanche, les Control of Dogs Regulations 1998 imposent des règles de contrôle supplémentaires à onze races/types lorsqu'ils sont dans un lieu public. Il s'agit d'un contrôle de sécurité publique, pas d'une interdiction d'entrée."
    es: "Irlanda no prohíbe ninguna raza ni impone ninguna restricción de importación basada en la raza. En su lugar, las Control of Dogs Regulations 1998 imponen normas de control adicionales a once razas/tipos cuando están en un lugar público. Se trata de un control de seguridad pública, no de una prohibición de entrada."
    pt: "A Irlanda não proíbe nenhuma raça e não impõe restrição de importação baseada na raça. Em vez disso, as Control of Dogs Regulations 1998 (regulamento irlandês de controle de cachorros) impõem regras de controle adicionais a onze raças/tipos quando eles estão em local público. É um controle de segurança pública, não uma proibição de entrada."
  cat1:
    en: "Restricted breeds/types: American Pit Bull Terrier, Bull Mastiff, Doberman Pinscher, English Bull Terrier, German Shepherd (Alsatian), Japanese Akita, Japanese Tosa, Rhodesian Ridgeback, Rottweiler, Staffordshire Bull Terrier, and any Ban Dog (Bandog) — plus every strain or cross of these. In a public place such a dog must be securely muzzled, kept on a strong leash or chain no longer than 2 metres, and led by a person over 16 capable of controlling it. It must also wear a collar with the owner's name and address."
    fr: "Races/types restreints : American Pit Bull Terrier, Bull Mastiff, Dobermann, English Bull Terrier, Berger allemand (Alsatian), Akita japonais, Tosa japonais, Rhodesian Ridgeback, Rottweiler, Staffordshire Bull Terrier, et tout Ban Dog (Bandog) — ainsi que tout croisement de ces types. Dans un lieu public, un tel chien doit être muselé, tenu par une laisse ou chaîne solide de 2 mètres maximum, et mené par une personne de plus de 16 ans capable de le maîtriser. Il doit aussi porter un collier avec le nom et l'adresse du propriétaire."
    es: "Razas/tipos restringidos: American Pit Bull Terrier, Bull Mastiff, Doberman Pinscher, English Bull Terrier, Pastor Alemán (Alsatian), Akita japonés, Tosa japonés, Rhodesian Ridgeback, Rottweiler, Staffordshire Bull Terrier, y cualquier Ban Dog (Bandog) — además de cualquier variedad o cruce de estos. En un lugar público, un perro así debe llevar bozal de forma segura, ir sujeto con una correa o cadena resistente de 2 metros como máximo, y ser conducido por una persona mayor de 16 años capaz de controlarlo. También debe llevar un collar con el nombre y la dirección del propietario."
    pt: "Raças/tipos restritos: American Pit Bull Terrier, Bull Mastiff, Doberman Pinscher, English Bull Terrier, Pastor Alemão (Alsatian), Akita japonês, Tosa japonês, Rhodesian Ridgeback, Rottweiler, Staffordshire Bull Terrier e qualquer Ban Dog (Bandog) — além de toda linhagem ou cruzamento desses. Em local público, um cachorro assim precisa estar com focinheira bem presa, preso a uma guia ou corrente resistente de no máximo 2 metros e conduzido por uma pessoa com mais de 16 anos capaz de controlá-lo. Também precisa usar uma coleira com o nome e o endereço do dono."
  cat2:
    en: "These are control obligations, not an import ban: a restricted-breed dog may still enter and live in Ireland if it meets the normal EU pet-travel requirements. Exemptions from the muzzle/leash rules apply only to certain official working dogs (Garda, Defence Forces, port/airport police, Customs) and to bona fide rescue and guide dogs on duty."
    fr: "Ce sont des obligations de contrôle, pas une interdiction d'importation : un chien de race restreinte peut entrer et vivre en Irlande s'il remplit les conditions normales de voyage UE. Les exemptions aux règles de muselière/laisse ne concernent que certains chiens de travail officiels (Garda, forces de défense, police portuaire/aéroportuaire, Douanes) et les chiens de sauvetage et guides en service."
    es: "Son obligaciones de control, no una prohibición de importación: un perro de raza restringida puede entrar y vivir en Irlanda si cumple los requisitos normales de viaje de mascotas de la UE. Las exenciones de las normas de bozal/correa se aplican solo a determinados perros de trabajo oficiales (Garda, Fuerzas de Defensa, policía portuaria/aeroportuaria, aduanas) y a los perros de rescate y guía de buena fe en servicio."
    pt: "São obrigações de controle, não uma proibição de importação: um cachorro de raça restrita pode entrar e viver na Irlanda se cumprir as exigências normais de viagem de animais na UE. As isenções das regras de focinheira/guia valem apenas para certos cães de trabalho oficiais (Garda, Forças de Defesa, polícia portuária/aeroportuária, alfândega) e para cães de resgate e cães-guia legítimos em serviço."
  note:
    en: "Confirm your dog's breed/type against the 1998 list and be ready to comply with the muzzle, leash and handler rules in public. There is no separate import permit tied to breed."
    fr: "Vérifie la race/le type de ton chien au regard de la liste de 1998 et sois prêt à respecter les règles de muselière, de laisse et de maître dans les lieux publics. Aucun permis d'importation distinct n'est lié à la race."
    es: "Confirma la raza/el tipo de tu perro con respecto a la lista de 1998 y prepárate para cumplir las normas de bozal, correa y guía en público. No existe un permiso de importación aparte vinculado a la raza."
    pt: "Confira a raça/o tipo do seu cachorro na lista de 1998 e esteja pronto para cumprir as regras de focinheira, guia e condutor em local público. Não existe licença de importação separada ligada à raça."

checklist:
  - en: "Microchip (ISO 11785) implanted before the rabies vaccination"
    fr: "Puce (ISO 11785) posée avant la vaccination antirabique"
    es: "Microchip (ISO 11785) implantado antes de la vacunación antirrábica"
    pt: "Microchip (ISO 11785) implantado antes da vacinação antirrábica"
  - en: "Valid rabies vaccination (dog ≥12 weeks at the shot, +21 days)"
    fr: "Vaccination antirabique valide (chien ≥12 semaines, +21 jours)"
    es: "Vacunación antirrábica válida (perro ≥12 semanas en la vacuna, +21 días)"
    pt: "Vacinação antirrábica válida (cachorro com ≥12 semanas na data da vacina, +21 dias)"
  - en: "Rabies antibody test — non-listed countries only"
    fr: "Titrage antirabique — pays non listés uniquement"
    es: "Prueba de titulación de rabia — solo países no listados"
    pt: "Teste sorológico antirrábico — apenas para países não listados"
  - en: "EU pet passport (EU origin) or endorsed EU health certificate (non-EU origin)"
    fr: "Passeport européen (origine UE) ou certificat sanitaire UE visé (hors UE)"
    es: "Pasaporte europeo (origen UE) o certificado sanitario UE refrendado (origen fuera de la UE)"
    pt: "Passaporte europeu (origem na UE) ou certificado sanitário europeu endossado (origem fora da UE)"
  - en: "Tapeworm (praziquantel) treatment by a vet 24–120 hours before arrival, recorded"
    fr: "Traitement contre le ténia (praziquantel) par un vétérinaire 24 à 120 heures avant l'arrivée, consigné"
    es: "Tratamiento contra la tenia (praziquantel) por un veterinario 24–120 horas antes de la llegada, registrado"
    pt: "Tratamento contra a tênia (praziquantel) aplicado por um veterinário de 24 a 120 horas antes da chegada, com registro"
  - en: "Advance notice + booked compliance check if arriving from outside the EU"
    fr: "Préavis + contrôle de conformité réservé si arrivée depuis hors UE"
    es: "Notificación previa + control de conformidad reservado si llegas desde fuera de la UE"
    pt: "Notificação prévia + controle de conformidade agendado se a chegada for de fora da UE"
  - en: "Original documents (not copies); airline reservation and suitable IATA crate if in the hold"
    fr: "Documents originaux (pas de copies) ; réservation aérienne et caisse IATA adaptée si voyage en soute"
    es: "Documentos originales (no copias); reserva de la aerolínea y jaula IATA adecuada si viaja en bodega"
    pt: "Documentos originais (não cópias); reserva na companhia aérea e caixa de transporte IATA adequada se for no porão"
  - en: "If a restricted breed, plan for muzzle, ≤2 m leash and a handler over 16 in public"
    fr: "Si race restreinte, prévois muselière, laisse ≤2 m et un maître de plus de 16 ans en public"
    es: "Si es una raza restringida, prevé bozal, correa ≤2 m y un guía mayor de 16 años en público"
    pt: "Se for raça restrita, prepare focinheira, guia de ≤2 m e um condutor com mais de 16 anos em local público"

