restrictedDogs:
  intro:
    en: "No official Cape Verde instrument banning or restricting the import of specific dog breeds was found in the sources reviewed. This absence is not proof that no rule exists — it means the point is not published in the official material available, so it is marked Unknown."
    fr: "Aucun instrument officiel cap-verdien interdisant ou restreignant l'importation de races précises de chiens n'a été trouvé dans les sources examinées. Cette absence ne prouve pas qu'aucune règle n'existe — elle signifie que le point n'est pas publié dans le matériel officiel disponible, et il est donc marqué « Non communiqué »."
    es: "No se encontró ningún instrumento oficial caboverdiano que prohíba o restrinja la importación de razas de perros concretas en las fuentes consultadas. Esta ausencia no prueba que no exista ninguna norma — significa que el punto no está publicado en el material oficial disponible, por lo que figura como Desconocido."
    pt: "Não foi encontrado, nas fontes consultadas, nenhum instrumento oficial cabo-verdiano que proíba ou restrinja a importação de raças específicas de cachorros. Essa ausência não prova que não exista regra — significa que o ponto não está publicado no material oficial disponível e, por isso, é assinalado como Não informado."
  cat1:
    en: "Restricted or 'potentially dangerous' breed categories: Unknown. No published Cape Verde list of restricted breeds for import was identified."
    fr: "Catégories de races restreintes ou « potentiellement dangereuses » : Non communiqué. Aucune liste cap-verdienne publiée de races restreintes à l'importation n'a été identifiée."
    es: "Categorías de razas restringidas o «potencialmente peligrosas»: Desconocido. No se identificó ninguna lista caboverdiana publicada de razas restringidas para la importación."
    pt: "Categorias de raças restritas ou «potencialmente perigosas»: Não informado. Não foi identificada qualquer lista cabo-verdiana publicada de raças restritas à importação."
  cat2:
    en: "Behaviour-based 'dangerous dog' import rules: Unknown. The available sources do not describe an individual assessment or ban tied to a dog's behaviour for import."
    fr: "Règles d'importation « chien dangereux » fondées sur le comportement : Non communiqué. Les sources disponibles ne décrivent pas d'évaluation individuelle ni d'interdiction liée au comportement pour l'importation."
    es: "Normas de importación de «perro peligroso» basadas en el comportamiento: Desconocido. Las fuentes disponibles no describen una evaluación individual ni una prohibición ligada al comportamiento del perro para la importación."
    pt: "Regras de importação de «cachorros perigosos» baseadas no comportamento: Não informado. As fontes disponíveis não descrevem qualquer avaliação individual nem proibição associada ao comportamento do cachorro para efeitos de importação."
  note:
    en: "Before travelling with a dog that could be seen as a guard or fighting type, ask the Cape Verde veterinary authority or a consular post directly whether any breed restriction applies. Do not assume there is none simply because none is published here."
    fr: "Avant de voyager avec un chien pouvant être perçu comme un type de garde ou de combat, demande directement à l'autorité vétérinaire cap-verdienne ou à un poste consulaire si une restriction de race s'applique. Ne présume pas l'absence de règle du seul fait qu'aucune n'est publiée ici."
    es: "Antes de viajar con un perro que pueda percibirse como de tipo guarda o pelea, pregunta directamente a la autoridad veterinaria caboverdiana o a un puesto consular si se aplica alguna restricción por raza. No des por hecho que no existe ninguna solo porque aquí no se publique ninguna."
    pt: "Antes de viajar com um cachorro que possa ser visto como de tipo guarda ou de combate, importa perguntar diretamente à autoridade veterinária cabo-verdiana ou a um posto consular se se aplica alguma restrição de raça. Não se deve presumir a ausência de regra apenas porque aqui não consta nenhuma."

checklist:
  - en: "Prior authorisation / entry attestation arranged through a Cape Verde consular post or the veterinary services"
    fr: "Autorisation préalable / attestation d'entrée organisée via un poste consulaire cap-verdien ou les services vétérinaires"
    es: "Autorización previa / certificación de entrada gestionada a través de un puesto consular de Cabo Verde o de los servicios veterinarios"
    pt: "Autorização prévia / atestado de entrada tratados junto de um posto consular de Cabo Verde ou dos serviços veterinários"
  - en: "Valid rabies vaccination (WOAH standard) given at least 30 days before entry"
    fr: "Vaccination antirabique valide (norme OMSA) réalisée au moins 30 jours avant l'entrée"
    es: "Vacunación antirrábica válida (norma OMSA) administrada al menos 30 días antes de la entrada"
    pt: "Vacinação antirrábica válida (norma WOAH) administrada pelo menos 30 dias antes da entrada"
  - en: "Other core vaccinations: distemper, parvovirus, leptospirosis, infectious hepatitis"
    fr: "Autres vaccinations essentielles : Carré, parvovirose, leptospirose, hépatite infectieuse"
    es: "Otras vacunaciones básicas: moquillo, parvovirus, leptospirosis, hepatitis infecciosa"
    pt: "Outras vacinações essenciais: cinomose, parvovirose, leptospirose, hepatite infecciosa"
  - en: "Internal and external parasite treatment with officially authorised products (date recorded)"
    fr: "Traitement antiparasitaire interne et externe avec des produits officiellement autorisés (date consignée)"
    es: "Tratamiento contra parásitos internos y externos con productos oficialmente autorizados (fecha registrada)"
    pt: "Tratamento antiparasitário interno e externo com produtos oficialmente autorizados (com a data anotada)"
  - en: "International veterinary health certificate (WOAH model) issued by the official veterinary authority of origin"
    fr: "Certificat sanitaire vétérinaire international (modèle OMSA) délivré par l'autorité vétérinaire officielle d'origine"
    es: "Certificado sanitario veterinario internacional (modelo OMSA) expedido por la autoridad veterinaria oficial de origen"
    pt: "Certificado sanitário veterinário internacional (modelo WOAH) emitido pela autoridade veterinária oficial de origem"
  - en: "Vaccination booklet and original documents ready for veterinary inspection on arrival"
    fr: "Carnet de vaccination et documents originaux prêts pour l'inspection vétérinaire à l'arrivée"
    es: "Cartilla de vacunación y documentos originales listos para la inspección veterinaria a la llegada"
    pt: "Boletim de vacinação e documentos originais prontos para a inspeção veterinária na chegada"
  - en: "ISO microchip (not mandatory but recommended, and often required for return travel)"
    fr: "Puce ISO (non obligatoire mais recommandée, et souvent exigée pour le voyage retour)"
    es: "Microchip ISO (no obligatorio pero recomendado, y a menudo exigido para el viaje de regreso)"
    pt: "Microchip ISO (não obrigatório, mas recomendado e muitas vezes exigido na viagem de retorno)"
  - en: "Confirm the Unknown points (antibody test, quarantine, breeds, entry points) with the Cape Verde veterinary authority before booking"
    fr: "Confirme les points « Non communiqué » (titrage, quarantaine, races, points d'entrée) auprès de l'autorité vétérinaire cap-verdienne avant de réserver"
    es: "Confirma los puntos Desconocido (prueba de titulación, cuarentena, razas, puntos de entrada) con la autoridad veterinaria caboverdiana antes de reservar"
    pt: "Confirmar os pontos «Não informado» (teste sorológico, quarentena, raças, pontos de entrada) junto da autoridade veterinária cabo-verdiana antes de reservar"
  - en: "Airline reservation confirming your dog's travel option and a suitable IATA crate"
    fr: "Réservation confirmant l'option de transport de ton chien et une caisse IATA adaptée"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y una jaula IATA adecuada"
    pt: "Reserva na companhia aérea confirmando a opção de viagem do cachorro e uma caixa de transporte adequada às normas IATA"

