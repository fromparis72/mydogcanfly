notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly fornece informações gerais — não constitui aconselhamento veterinário nem jurídico."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro."
    pt: "Só um médico-veterinário pode confirmar o procedimento exato para cada cachorro."
  - en: "Cape Verde publishes limited official detail; several points are marked Unknown and must be confirmed directly with the Cape Verde veterinary authority or a consular post before travel."
    fr: "Le Cap-Vert publie peu de détails officiels ; plusieurs points sont marqués « Non communiqué » et doivent être confirmés directement auprès de l'autorité vétérinaire cap-verdienne ou d'un poste consulaire avant le voyage."
    es: "Cabo Verde publica pocos detalles oficiales; varios puntos figuran como Desconocido y deben confirmarse directamente con la autoridad veterinaria caboverdiana o un puesto consular antes de viajar."
    pt: "Cabo Verde publica poucos detalhes oficiais; vários pontos figuram como Não informado e devem ser confirmados diretamente junto da autoridade veterinária cabo-verdiana ou de um posto consular antes da viagem."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem de: país de origem, histórico de viagens anteriores, identificação, vacinas, itinerário e data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consultar sempre o médico-veterinário antes de reservar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do cão" }
  intro:
    en: "The exact documents depend on three things — Cape Verde (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — le Cap-Vert (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Cabo Verde (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — Cabo Verde (o destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Cape Verde", fr: "Pays de destination — Cap-Vert", es: "País de destino — Cabo Verde", pt: "País de destino — Cabo Verde" }
      text:
        en: "Cape Verde runs its own veterinary scheme outside the EU framework: a valid rabies vaccination given at least 30 days before entry, other core vaccinations, internal and external parasite treatment, and an official international veterinary certificate are the published conditions. Prior authorisation is arranged before travel."
        fr: "Le Cap-Vert applique son propre dispositif vétérinaire, hors cadre UE : une vaccination antirabique valide réalisée au moins 30 jours avant l'entrée, d'autres vaccinations essentielles, un traitement antiparasitaire interne et externe et un certificat vétérinaire international officiel constituent les conditions publiées. Une autorisation préalable est organisée avant le voyage."
        es: "Cabo Verde aplica su propio sistema veterinario fuera del marco de la UE: una vacunación antirrábica válida administrada al menos 30 días antes de la entrada, otras vacunaciones básicas, un tratamiento contra parásitos internos y externos y un certificado veterinario internacional oficial son las condiciones publicadas. La autorización previa se gestiona antes del viaje."
        pt: "Cabo Verde aplica um regime veterinário próprio, fora do quadro da UE: as condições publicadas são uma vacinação antirrábica válida administrada pelo menos 30 dias antes da entrada, outras vacinações essenciais, um tratamento antiparasitário interno e externo e um certificado veterinário internacional oficial. A autorização prévia é tratada antes da viagem."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The official veterinary authority of your country of departure is the one that issues and endorses the international health certificate, and prior authorisation is requested through the Cape Verde consular post covering that country. From the EU, your dog travels on the strength of that endorsed certificate, not an EU pet passport."
        fr: "L'autorité vétérinaire officielle de ton pays de départ est celle qui établit et vise le certificat sanitaire international, et l'autorisation préalable se demande auprès du poste consulaire cap-verdien compétent pour ce pays. Depuis l'UE, ton chien voyage sur la base de ce certificat visé, et non d'un passeport européen."
        es: "La autoridad veterinaria oficial de tu país de salida es la que expide y refrenda el certificado sanitario internacional, y la autorización previa se solicita a través del puesto consular de Cabo Verde competente para ese país. Desde la UE, tu perro viaja sobre la base de ese certificado refrendado, no de un pasaporte europeo."
        pt: "É a autoridade veterinária oficial do país de partida que emite e endossa o certificado sanitário internacional, e a autorização prévia pede-se junto do posto consular de Cabo Verde competente para esse país. A partir da UE, o cachorro viaja com base nesse certificado endossado, e não com o passaporte europeu para animais de companhia."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde o cachorro esteve recentemente" }
      text:
        en: "Cape Verde does not publish a detailed rule on prior residence or a rabies-risk-country list, but travel history can affect what the origin authority is willing to certify and how the rabies requirement is applied. Confirm your dog's real history with the Cape Verde veterinary authority — not only the last airport."
        fr: "Le Cap-Vert ne publie pas de règle détaillée sur les séjours antérieurs ni de liste de pays à risque rabique, mais l'historique de voyage peut influer sur ce que l'autorité d'origine accepte de certifier et sur l'application de l'exigence antirabique. Confirme l'historique réel de ton chien auprès de l'autorité vétérinaire cap-verdienne — pas seulement l'aéroport de départ."
        es: "Cabo Verde no publica una norma detallada sobre la residencia previa ni una lista de países con riesgo de rabia, pero el historial de viajes puede influir en lo que la autoridad de origen esté dispuesta a certificar y en cómo se aplica el requisito antirrábico. Confirma el historial real de tu perro con la autoridad veterinaria caboverdiana — no solo el último aeropuerto."
        pt: "Cabo Verde não publica uma regra detalhada sobre estadias anteriores nem uma lista de países de risco de raiva, mas o histórico de viagens pode influir naquilo que a autoridade de origem aceita certificar e na forma como a exigência antirrábica é aplicada. Convém confirmar o histórico real do cachorro junto da autoridade veterinária cabo-verdiana — e não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Cape Verde's framework, then confirm your dog's exact origin and history — and the points marked Unknown — with the veterinary authority before booking."
    fr: "Lis donc les exigences ci-dessous comme le cadre cap-verdien, puis confirme l'origine et l'historique exacts de ton chien — ainsi que les points « Non communiqué » — auprès de l'autorité vétérinaire avant de réserver."
    es: "Así que lee los requisitos siguientes como el marco de Cabo Verde y luego confirma el origen y el historial exactos de tu perro — así como los puntos marcados como Desconocido — con la autoridad veterinaria antes de reservar."
    pt: "As exigências abaixo devem, portanto, ser lidas como o quadro cabo-verdiano; depois, importa confirmar a origem e o histórico exatos do cachorro — bem como os pontos assinalados como Não informado — junto da autoridade veterinária antes de reservar."

requirements:
  - item: { en: "Prior authorisation", fr: "Autorisation préalable", es: "Autorización previa", pt: "Autorização prévia" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Before travel, documents proving the dog's vaccinations and fitness to travel are submitted to a Cape Verde consular post (or the national veterinary services) so an entry attestation is issued.", fr: "Avant le voyage, les documents prouvant les vaccinations du chien et son aptitude au voyage sont soumis à un poste consulaire cap-verdien (ou aux services vétérinaires nationaux) afin qu'une attestation d'entrée soit délivrée.", es: "Antes del viaje, los documentos que acreditan las vacunaciones del perro y su aptitud para viajar se presentan a un puesto consular de Cabo Verde (o a los servicios veterinarios nacionales) para que se expida una certificación de entrada.", pt: "Antes da viagem, os documentos que comprovam as vacinações do cachorro e a sua aptidão para viajar são apresentados a um posto consular de Cabo Verde (ou aos serviços veterinários nacionais) para que seja emitido um atestado de entrada." }
    exceptions: { en: "None published — importing an animal requires authorisation from the veterinary/phytosanitary service of the Ministry of Agriculture and Environment.", fr: "Aucune publiée — l'importation d'un animal exige l'autorisation du service vétérinaire/phytosanitaire du Ministère de l'Agriculture et de l'Environnement.", es: "Ninguna publicada — la importación de un animal exige la autorización del servicio veterinario/fitosanitario del Ministerio de Agricultura y Medio Ambiente.", pt: "Nenhuma publicada — a importação de um animal exige a autorização do serviço veterinário/fitossanitário do Ministério da Agricultura e Ambiente." }
    ref: { en: "Embassy of Cape Verde — Travelling with animals", fr: "Ambassade du Cap-Vert — Voyager avec des animaux", es: "Embajada de Cabo Verde — Viajar con animales", pt: "Embaixada de Cabo Verde — Viagem com animais" }
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Not mandatory", fr: "Non obligatoire", es: "No obligatorio", pt: "Não obrigatório" }
    when: { en: "The published conditions state a microchip is not compulsory. An ISO 11784/11785 microchip is still strongly recommended so the animal can be reliably matched to its certificate and vaccination record.", fr: "Les conditions publiées indiquent que la puce n'est pas obligatoire. Une puce ISO 11784/11785 reste fortement recommandée pour relier de façon fiable l'animal à son certificat et à son carnet de vaccination.", es: "Las condiciones publicadas indican que el microchip no es obligatorio. Un microchip ISO 11784/11785 sigue siendo muy recomendable para poder vincular de forma fiable al animal con su certificado y su cartilla de vacunación.", pt: "As condições publicadas indicam que o microchip não é obrigatório. Ainda assim, um microchip ISO 11784/11785 é vivamente recomendado, para que o animal possa ser associado com segurança ao seu certificado e ao seu boletim de vacinação." }
    exceptions: { en: "Requirements may differ for onward travel or return to your home country, which often require an ISO microchip.", fr: "Les exigences peuvent différer pour un voyage ultérieur ou un retour dans ton pays, qui imposent souvent une puce ISO.", es: "Los requisitos pueden diferir para un viaje posterior o el regreso a tu país, que suelen exigir un microchip ISO.", pt: "As exigências podem ser diferentes para a continuação da viagem ou para o retorno ao país de residência, que muitas vezes impõem um microchip ISO." }
    ref: { en: "Embassy of Cape Verde — Travelling with animals ('Chip não obrigatório')", fr: "Ambassade du Cap-Vert — Voyager avec des animaux (« Chip não obrigatório »)", es: "Embajada de Cabo Verde — Viajar con animales (« Chip não obrigatório »)", pt: "Embaixada de Cabo Verde — Viagem com animais («Chip não obrigatório»)" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "A valid rabies vaccination meeting WOAH (World Organisation for Animal Health) standards, carried out at least 30 days before entry into Cape Verde.", fr: "Une vaccination antirabique valide conforme aux exigences de l'OMSA (Organisation mondiale de la santé animale), réalisée au moins 30 jours avant l'entrée au Cap-Vert.", es: "Una vacunación antirrábica válida conforme a las normas de la OMSA (Organización Mundial de Sanidad Animal), administrada al menos 30 días antes de la entrada a Cabo Verde.", pt: "Uma vacinação antirrábica válida, conforme as normas da WOAH (Organização Mundial da Saúde Animal), realizada pelo menos 30 dias antes da entrada em Cabo Verde." }
    exceptions: { en: "None published. A puppy must be old enough to be validly vaccinated and then wait 30 days.", fr: "Aucune publiée. Un chiot doit être en âge d'être valablement vacciné, puis respecter le délai de 30 jours.", es: "Ninguna publicada. Un cachorro debe tener la edad suficiente para ser vacunado válidamente y luego esperar 30 días.", pt: "Nenhuma publicada. O filhote deve ter idade suficiente para ser validamente vacinado e cumprir depois o prazo de 30 dias." }
    ref: { en: "Embassy of Cape Verde — Travelling with animals", fr: "Ambassade du Cap-Vert — Voyager avec des animaux", es: "Embajada de Cabo Verde — Viajar con animales", pt: "Embaixada de Cabo Verde — Viagem com animais" }
  - item: { en: "Other core vaccinations", fr: "Autres vaccinations essentielles", es: "Otras vacunaciones básicas", pt: "Outras vacinações essenciais" }
    required: { en: "Required", fr: "Requises", es: "Obligatorias", pt: "Obrigatório" }
    when: { en: "Vaccination against distemper, parvovirus, leptospirosis and infectious (canine) hepatitis, in addition to rabies.", fr: "Vaccination contre la maladie de Carré (esgana), la parvovirose, la leptospirose et l'hépatite infectieuse (canine), en plus de la rage.", es: "Vacunación contra el moquillo, el parvovirus, la leptospirosis y la hepatitis infecciosa (canina), además de la rabia.", pt: "Vacinação contra a cinomose (esgana), a parvovirose, a leptospirose e a hepatite infecciosa canina, além da raiva." }
    exceptions: { en: "None published.", fr: "Aucune publiée.", es: "Ninguna publicada.", pt: "Nenhuma publicada." }
    ref: { en: "Embassy of Cape Verde — Travelling with animals", fr: "Ambassade du Cap-Vert — Voyager avec des animaux", es: "Embajada de Cabo Verde — Viajar con animales", pt: "Embaixada de Cabo Verde — Viagem com animais" }
  - item: { en: "Internal & external parasite treatment", fr: "Traitement antiparasitaire interne et externe", es: "Tratamiento contra parásitos internos y externos", pt: "Tratamento antiparasitário interno e externo" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Internal and external deworming/antiparasitic treatment with officially authorised active substances; the treatment date is recorded on the documentation.", fr: "Vermifugation/traitement antiparasitaire interne et externe avec des substances actives officiellement autorisées ; la date du traitement est consignée sur les documents.", es: "Desparasitación/tratamiento antiparasitario interno y externo con sustancias activas oficialmente autorizadas; la fecha del tratamiento se registra en la documentación.", pt: "Desparasitação/tratamento antiparasitário interno e externo com substâncias ativas oficialmente autorizadas; a data do tratamento fica consignada na documentação." }
    exceptions: { en: "None published.", fr: "Aucune publiée.", es: "Ninguna publicada.", pt: "Nenhuma publicada." }
    ref: { en: "Embassy of Cape Verde — Travelling with animals", fr: "Ambassade du Cap-Vert — Voyager avec des animaux", es: "Embajada de Cabo Verde — Viajar con animales", pt: "Embaixada de Cabo Verde — Viagem com animais" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not in published conditions", fr: "Absent des conditions publiées", es: "No figura en las condiciones publicadas", pt: "Não consta das condições publicadas" }
    when: { en: "The published Cape Verde sanitary conditions do not list a rabies antibody test. Whether one may be requested in specific cases is not stated officially — confirm with the veterinary authority.", fr: "Les conditions sanitaires cap-verdiennes publiées ne mentionnent pas de titrage antirabique. La possibilité qu'il soit demandé dans certains cas n'est pas indiquée officiellement — à confirmer auprès de l'autorité vétérinaire.", es: "Las condiciones sanitarias publicadas de Cabo Verde no incluyen una prueba de titulación de rabia. Si puede solicitarse en casos concretos no se indica oficialmente — confírmalo con la autoridad veterinaria.", pt: "As condições sanitárias publicadas por Cabo Verde não incluem qualquer teste sorológico antirrábico. Não é indicado oficialmente se ele pode ser exigido em casos específicos — importa confirmar junto da autoridade veterinária." }
    exceptions: { en: "Unknown — not addressed in the available official sources.", fr: "Non communiqué — non traité dans les sources officielles disponibles.", es: "Desconocido — no se aborda en las fuentes oficiales disponibles.", pt: "Não informado — não é abordado nas fontes oficiais disponíveis." }
    ref: { en: "Embassy of Cape Verde — Travelling with animals (no antibody test listed)", fr: "Ambassade du Cap-Vert — Voyager avec des animaux (aucun titrage listé)", es: "Embajada de Cabo Verde — Viajar con animales (no se lista prueba de titulación)", pt: "Embaixada de Cabo Verde — Viagem com animais (sem menção a teste sorológico)" }
  - item: { en: "International veterinary health certificate", fr: "Certificat sanitaire vétérinaire international", es: "Certificado sanitario veterinario internacional", pt: "Certificado sanitário veterinário internacional" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "A valid official health certificate issued by the Official Veterinary Authority of the country of origin, following the WOAH international model, together with the vaccination booklet.", fr: "Un certificat sanitaire officiel valide délivré par l'Autorité vétérinaire officielle du pays d'origine, selon le modèle international de l'OMSA, accompagné du carnet de vaccination.", es: "Un certificado sanitario oficial válido expedido por la Autoridad Veterinaria Oficial del país de origen, según el modelo internacional de la OMSA, junto con la cartilla de vacunación.", pt: "Um atestado de saúde oficial válido, emitido pela Autoridade Veterinária Oficial do país de origem, segundo o modelo internacional da WOAH, acompanhado do boletim de vacinação." }
    exceptions: { en: "None published — an official certificate must accompany the dog.", fr: "Aucune publiée — un certificat officiel doit accompagner le chien.", es: "Ninguna publicada — un certificado oficial debe acompañar al perro.", pt: "Nenhuma publicada — um certificado oficial deve acompanhar o cachorro." }
    ref: { en: "Embassy of Cape Verde — Travelling with animals", fr: "Ambassade du Cap-Vert — Voyager avec des animaux", es: "Embajada de Cabo Verde — Viajar con animales", pt: "Embaixada de Cabo Verde — Viagem com animais" }
  - item: { en: "Airport / border veterinary inspection", fr: "Inspection vétérinaire à l'aéroport / à la frontière", es: "Inspección veterinaria en el aeropuerto / en la frontera", pt: "Inspeção veterinária no aeroporto / na fronteira" }
    required: { en: "Expected", fr: "Attendue", es: "Prevista", pt: "Prevista" }
    when: { en: "Present your dog and its original documents to the veterinary/sanitary authorities on arrival. Cape Verde does not publish a detailed border procedure, but veterinary control on import is part of its animal-health legislation.", fr: "Présente ton chien et ses documents originaux aux autorités vétérinaires/sanitaires à l'arrivée. Le Cap-Vert ne publie pas de procédure frontalière détaillée, mais le contrôle vétérinaire à l'importation relève de sa législation de santé animale.", es: "Presenta a tu perro y sus documentos originales a las autoridades veterinarias/sanitarias a la llegada. Cabo Verde no publica un procedimiento fronterizo detallado, pero el control veterinario en la importación forma parte de su legislación de sanidad animal.", pt: "Na chegada, o cachorro e os seus documentos originais devem ser apresentados às autoridades veterinárias/sanitárias. Cabo Verde não publica um procedimento fronteiriço detalhado, mas a fiscalização veterinária à importação faz parte da sua legislação de sanidade animal." }
    exceptions: { en: "Exact points of entry and inspection fees are not published — Unknown.", fr: "Les points d'entrée exacts et les frais d'inspection ne sont pas publiés — Non communiqué.", es: "Los puntos de entrada exactos y las tasas de inspección no se publican — Desconocido.", pt: "Os pontos de entrada exatos e as taxas de inspeção não são publicados — Não informado." }
    ref: { en: "Decreto Regulamentar 12/2020 (animal-health police); Embassy of Cape Verde", fr: "Décret réglementaire 12/2020 (police sanitaire animale) ; Ambassade du Cap-Vert", es: "Decreto Regulamentar 12/2020 (policía sanitaria animal); Embajada de Cabo Verde", pt: "Decreto Regulamentar 12/2020 (polícia sanitária animal); Embaixada de Cabo Verde" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Linked to rabies vaccination", fr: "Lié à la vaccination antirabique", es: "Vinculada a la vacunación antirrábica", pt: "Ligada à vacinação antirrábica" }
    when: { en: "No stand-alone minimum age is published. In practice a puppy must be old enough to be validly vaccinated against rabies and then observe the 30-day pre-entry interval.", fr: "Aucun âge minimum distinct n'est publié. En pratique, un chiot doit être en âge d'être valablement vacciné contre la rage, puis respecter le délai de 30 jours avant l'entrée.", es: "No se publica ninguna edad mínima autónoma. En la práctica, un cachorro debe tener la edad suficiente para ser vacunado válidamente contra la rabia y luego observar el intervalo de 30 días previos a la entrada.", pt: "Não é publicada nenhuma idade mínima independente. Na prática, o filhote deve ter idade suficiente para ser validamente vacinado contra a raiva e cumprir depois o prazo de 30 dias antes da entrada." }
    exceptions: { en: "Unknown — not separately addressed in official sources.", fr: "Non communiqué — non traité séparément dans les sources officielles.", es: "Desconocido — no se aborda por separado en las fuentes oficiales.", pt: "Não informado — não é tratado separadamente nas fontes oficiais." }
    ref: { en: "Embassy of Cape Verde — Travelling with animals (rabies vaccination)", fr: "Ambassade du Cap-Vert — Voyager avec des animaux (vaccination antirabique)", es: "Embajada de Cabo Verde — Viajar con animales (vacunación antirrábica)", pt: "Embaixada de Cabo Verde — Viagem com animais (vacinação antirrábica)" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Unknown", fr: "Non communiqué", es: "Desconocido", pt: "Não comunicado" }
    when: { en: "The available official sources do not state whether quarantine applies to compliant pet dogs. Confirm with the Cape Verde veterinary authority before travel.", fr: "Les sources officielles disponibles n'indiquent pas si une quarantaine s'applique aux chiens de compagnie conformes. À confirmer auprès de l'autorité vétérinaire cap-verdienne avant le voyage.", es: "Las fuentes oficiales disponibles no indican si la cuarentena se aplica a los perros de compañía que cumplen los requisitos. Confírmalo con la autoridad veterinaria caboverdiana antes de viajar.", pt: "As fontes oficiais disponíveis não indicam se a quarentena se aplica a cachorros de companhia em conformidade. Importa confirmar junto da autoridade veterinária cabo-verdiana antes da viagem." }
    exceptions: { en: "Non-compliant animals may be refused or held under veterinary control under the animal-health legislation.", fr: "Les animaux non conformes peuvent être refusés ou placés sous contrôle vétérinaire au titre de la législation de santé animale.", es: "Los animales no conformes pueden ser rechazados o retenidos bajo control veterinario en virtud de la legislación de sanidad animal.", pt: "Ao abrigo da legislação de sanidade animal, os animais não conformes podem ser recusados ou retidos sob fiscalização veterinária." }
    ref: { en: "Decreto Regulamentar 12/2020 (animal-health police)", fr: "Décret réglementaire 12/2020 (police sanitaire animale)", es: "Decreto Regulamentar 12/2020 (policía sanitaria animal)", pt: "Decreto Regulamentar 12/2020 (polícia sanitária animal)" }
  - item: { en: "Restricted / banned breeds", fr: "Races restreintes / interdites", es: "Razas restringidas / prohibidas", pt: "Raças restritas / proibidas" }
    required: { en: "Unknown", fr: "Non communiqué", es: "Desconocido", pt: "Não comunicado" }
    when: { en: "No official Cape Verde breed-import ban or dangerous-dog import list is published in the sources reviewed. This does not guarantee there is none — verify with the veterinary authority.", fr: "Aucune interdiction officielle cap-verdienne d'importation par race ni liste de chiens dangereux à l'importation n'est publiée dans les sources examinées. Cela ne garantit pas l'absence de règle — à vérifier auprès de l'autorité vétérinaire.", es: "No se publica ninguna prohibición oficial caboverdiana de importación por raza ni lista de perros peligrosos a la importación en las fuentes consultadas. Esto no garantiza que no exista ninguna — verifícalo con la autoridad veterinaria.", pt: "Nas fontes consultadas não consta qualquer proibição oficial cabo-verdiana de importação por raça nem lista de cachorros perigosos para efeitos de importação. Isso não garante que não exista — importa verificar junto da autoridade veterinária." }
    exceptions: { en: "Unknown.", fr: "Non communiqué.", es: "Desconocido.", pt: "Não informado." }
    ref: { en: "No published breed-import instrument found", fr: "Aucun instrument publié d'interdiction par race trouvé", es: "No se encontró ningún instrumento publicado de importación por raza", pt: "Nenhum instrumento publicado sobre importação por raça" }

origin:
  eu:
    title: { en: "From the European Union — international certificate", fr: "Depuis l'Union européenne — certificat international", es: "Desde la Unión Europea — certificado internacional", pt: "A partir da União Europeia — certificado internacional" }
    body:
      en: "Cape Verde is outside the EU, so an EU pet passport is not the entry document. From an EU country, your official (state) veterinarian issues the international veterinary health certificate on the WOAH model. Your dog needs a valid rabies vaccination given at least 30 days before entry, the other core vaccinations (distemper, parvovirus, leptospirosis, infectious hepatitis), internal and external parasite treatment, and prior authorisation obtained through the Cape Verde consular post. A microchip is not compulsory but is recommended."
      fr: "Le Cap-Vert est hors UE : le passeport européen n'est donc pas le document d'entrée. Depuis un pays de l'UE, ton vétérinaire officiel (d'État) établit le certificat sanitaire vétérinaire international sur le modèle OMSA. Ton chien a besoin d'une vaccination antirabique valide réalisée au moins 30 jours avant l'entrée, des autres vaccinations essentielles (Carré, parvovirose, leptospirose, hépatite infectieuse), d'un traitement antiparasitaire interne et externe et de l'autorisation préalable obtenue auprès du poste consulaire cap-verdien. La puce n'est pas obligatoire mais recommandée."
      es: "Cabo Verde está fuera de la UE, así que el pasaporte europeo no es el documento de entrada. Desde un país de la UE, tu veterinario oficial (estatal) expide el certificado sanitario veterinario internacional según el modelo de la OMSA. Tu perro necesita una vacunación antirrábica válida administrada al menos 30 días antes de la entrada, las demás vacunaciones básicas (moquillo, parvovirus, leptospirosis, hepatitis infecciosa), un tratamiento contra parásitos internos y externos y la autorización previa obtenida a través del puesto consular de Cabo Verde. El microchip no es obligatorio, pero se recomienda."
      pt: "Cabo Verde está fora da UE e, por isso, o passaporte europeu para animais de companhia não é o documento de entrada. A partir de um país da UE, é o veterinário oficial (do Estado) que emite o certificado sanitário veterinário internacional segundo o modelo da WOAH. O cachorro precisa de uma vacinação antirrábica válida administrada pelo menos 30 dias antes da entrada, das outras vacinações essenciais (cinomose, parvovirose, leptospirose, hepatite infecciosa), de um tratamento antiparasitário interno e externo e da autorização prévia obtida junto do posto consular de Cabo Verde. O microchip não é obrigatório, mas é recomendado."
    cls: warn
  listed:
    title: { en: "From another non-EU country — same scheme", fr: "Depuis un autre pays hors UE — même dispositif", es: "Desde otro país fuera de la UE — el mismo sistema", pt: "A partir de outro país fora da UE — o mesmo regime" }
    body:
      en: "Cape Verde does not publish a 'listed third country' category. From any non-EU country the same conditions apply: identification documents, valid rabies vaccination (≥30 days before entry), the other core vaccinations, parasite treatment and an official international veterinary certificate issued by that country's veterinary authority, plus prior authorisation. The USDA APHIS pet-travel site has no dedicated Cape Verde page, so US travellers should work with a USDA-accredited veterinarian and confirm the current conditions with a Cape Verde consular post."
      fr: "Le Cap-Vert ne publie pas de catégorie « pays tiers listé ». Depuis tout pays hors UE, les mêmes conditions s'appliquent : documents d'identification, vaccination antirabique valide (≥30 jours avant l'entrée), autres vaccinations essentielles, traitement antiparasitaire et certificat vétérinaire international officiel délivré par l'autorité vétérinaire de ce pays, plus l'autorisation préalable. Le site de voyage animalier de l'USDA APHIS n'a pas de page dédiée au Cap-Vert : les voyageurs américains doivent passer par un vétérinaire agréé USDA et confirmer les conditions en vigueur auprès d'un poste consulaire cap-verdien."
      es: "Cabo Verde no publica una categoría de «país tercero listado». Desde cualquier país fuera de la UE se aplican las mismas condiciones: documentos de identificación, vacunación antirrábica válida (≥30 días antes de la entrada), las demás vacunaciones básicas, tratamiento antiparasitario y un certificado veterinario internacional oficial expedido por la autoridad veterinaria de ese país, además de la autorización previa. El sitio de viajes de mascotas del USDA APHIS no tiene una página dedicada a Cabo Verde, por lo que los viajeros estadounidenses deben trabajar con un veterinario acreditado por el USDA y confirmar las condiciones vigentes con un puesto consular de Cabo Verde."
      pt: "Cabo Verde não publica qualquer categoria de «país terceiro listado». A partir de qualquer país fora da UE aplicam-se as mesmas condições: documentos de identificação, vacinação antirrábica válida (≥30 dias antes da entrada), as outras vacinações essenciais, tratamento antiparasitário e um certificado veterinário internacional oficial emitido pela autoridade veterinária desse país, além da autorização prévia. O site de viagem com animais do USDA APHIS não tem página dedicada a Cabo Verde e, por isso, quem parte dos Estados Unidos deve recorrer a um veterinário credenciado pelo USDA e confirmar as condições em vigor junto de um posto consular de Cabo Verde."
    cls: warn
  nonListed:
    title: { en: "At-risk origins — confirm case by case", fr: "Origines à risque — confirmer au cas par cas", es: "Orígenes de riesgo — confirmar caso por caso", pt: "Origens de risco — confirmar caso a caso" }
    body:
      en: "Cape Verde does not publish a specific procedure (such as a rabies antibody test and waiting period) for dogs coming from higher-risk countries. Because the official detail is limited, a dog with a recent stay in a rabies-risk area should have its case confirmed directly with the Cape Verde veterinary authority before travel — the origin authority may add conditions when it issues the certificate. Treat this path as Unknown until confirmed."
      fr: "Le Cap-Vert ne publie pas de procédure spécifique (comme un titrage antirabique et un délai d'attente) pour les chiens venant de pays à risque plus élevé. La documentation officielle étant limitée, un chien ayant récemment séjourné dans une zone à risque rabique devrait faire confirmer son cas directement auprès de l'autorité vétérinaire cap-verdienne avant le voyage — l'autorité d'origine peut ajouter des conditions lors de l'émission du certificat. Considère ce parcours comme « Non communiqué » tant qu'il n'est pas confirmé."
      es: "Cabo Verde no publica un procedimiento específico (como una prueba de titulación de rabia y un periodo de espera) para los perros procedentes de países de mayor riesgo. Como el detalle oficial es limitado, un perro con una estancia reciente en una zona con riesgo de rabia debería tener su caso confirmado directamente con la autoridad veterinaria caboverdiana antes de viajar — la autoridad de origen puede añadir condiciones al expedir el certificado. Considera esta vía como Desconocido hasta que se confirme."
      pt: "Cabo Verde não publica um procedimento específico (como um teste sorológico antirrábico e um período de espera) para cachorros provenientes de países de risco mais elevado. Como o detalhe oficial é limitado, no caso de um cachorro com estadia recente numa zona de risco de raiva convém confirmar a situação diretamente junto da autoridade veterinária cabo-verdiana antes da viagem — a autoridade de origem pode acrescentar condições ao emitir o certificado. Enquanto não houver confirmação, este percurso deve ser considerado Não informado."
    cls: neutral

arrival:
  intro:
    en: "What happens when your dog reaches Cape Verde depends on your documents and the veterinary control at the point of entry."
    fr: "Ce qui se passe à l'arrivée de ton chien au Cap-Vert dépend de tes documents et du contrôle vétérinaire au point d'entrée."
    es: "Lo que ocurre cuando tu perro llega a Cabo Verde depende de tus documentos y del control veterinario en el punto de entrada."
    pt: "O que acontece quando o cachorro chega a Cabo Verde depende dos documentos apresentados e da fiscalização veterinária no ponto de entrada."
  points:
    - en: "Carry the originals: the international veterinary health certificate, the vaccination booklet (rabies plus distemper, parvovirus, leptospirosis, infectious hepatitis) and proof of the parasite treatment."
      fr: "Munis-toi des originaux : le certificat sanitaire vétérinaire international, le carnet de vaccination (rage plus Carré, parvovirose, leptospirose, hépatite infectieuse) et la preuve du traitement antiparasitaire."
      es: "Lleva los originales: el certificado sanitario veterinario internacional, la cartilla de vacunación (rabia más moquillo, parvovirus, leptospirosis, hepatitis infecciosa) y la prueba del tratamiento antiparasitario."
      pt: "Levar os originais: o certificado sanitário veterinário internacional, o boletim de vacinação (raiva, além de cinomose, parvovirose, leptospirose e hepatite infecciosa) e a prova do tratamento antiparasitário."
    - en: "Have your prior-authorisation / entry attestation ready, arranged before travel through the Cape Verde consular post or veterinary services."
      fr: "Ayez à disposition ton autorisation préalable / attestation d'entrée, organisée avant le voyage auprès du poste consulaire cap-verdien ou des services vétérinaires."
      es: "Ten a mano tu autorización previa / certificación de entrada, gestionada antes del viaje a través del puesto consular de Cabo Verde o de los servicios veterinarios."
      pt: "Ter à mão a autorização prévia / o atestado de entrada, tratados antes da viagem junto do posto consular de Cabo Verde ou dos serviços veterinários."
    - en: "Present your dog to the veterinary/sanitary authorities on arrival. The exact points of entry, inspection procedure and any fees are not published officially — Unknown."
      fr: "Présente ton chien aux autorités vétérinaires/sanitaires à l'arrivée. Les points d'entrée exacts, la procédure d'inspection et d'éventuels frais ne sont pas publiés officiellement — Non communiqué."
      es: "Presenta a tu perro a las autoridades veterinarias/sanitarias a la llegada. Los puntos de entrada exactos, el procedimiento de inspección y las posibles tasas no se publican oficialmente — Desconocido."
      pt: "Apresentar o cachorro às autoridades veterinárias/sanitárias na chegada. Os pontos de entrada exatos, o procedimento de inspeção e eventuais taxas não são publicados oficialmente — Não informado."
    - en: "If documents are missing, incomplete or invalid, the animal-health legislation allows the authorities to refuse the animal or place it under veterinary control — potentially at the owner's expense."
      fr: "Si les documents manquent, sont incomplets ou invalides, la législation de santé animale permet aux autorités de refuser l'animal ou de le placer sous contrôle vétérinaire — potentiellement aux frais du propriétaire."
      es: "Si faltan documentos o están incompletos o no son válidos, la legislación de sanidad animal permite a las autoridades rechazar al animal o colocarlo bajo control veterinario — potencialmente a cargo del propietario."
      pt: "Se faltarem documentos ou se estes estiverem incompletos ou inválidos, a legislação de sanidade animal permite que as autoridades recusem o animal ou o coloquem sob fiscalização veterinária — podendo os custos ficar a cargo do proprietário."
    - en: "Because several points are Unknown, confirm the current arrival procedure with the Cape Verde veterinary authority or a consular post shortly before you travel."
      fr: "Plusieurs points étant « Non communiqué », confirme la procédure d'arrivée en vigueur auprès de l'autorité vétérinaire cap-verdienne ou d'un poste consulaire peu avant ton voyage."
      es: "Como varios puntos figuran como Desconocido, confirma el procedimiento de llegada vigente con la autoridad veterinaria caboverdiana o un puesto consular poco antes de viajar."
      pt: "Como vários pontos figuram como Não informado, convém confirmar o procedimento de chegada em vigor junto da autoridade veterinária cabo-verdiana ou de um posto consular pouco antes da viagem."

