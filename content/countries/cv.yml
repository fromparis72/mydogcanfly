# Country Entry Guide — Cape Verde / Cabo Verde (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_cv
iso2: "CV"
name: { en: "Cape Verde", fr: "Cap-Vert", es: "Cabo Verde", pt: "Cabo Verde" }
region: { en: "Africa (Atlantic islands)", fr: "Afrique (îles de l'Atlantique)", es: "África (islas del Atlántico)", pt: "África (ilhas do Atlântico)" }


regime: non_listed
exit:
  authority: DGASP
  authorityUrl: https://maa.gov.cv/
  intro:
    en: "Cape Verde is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Direção-Geral da Agricultura, Silvicultura e Pecuária (DGASP)."
    fr: "Le Cap-Vert est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par la Direção-Geral da Agricultura, Silvicultura e Pecuária (DGASP)."
    es: "Cabo Verde no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por la Direção-Geral da Agricultura, Silvicultura e Pecuária (DGASP)."
    pt: "Cabo Verde é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para regressar à UE — além de um atestado de saúde de exportação endossado pela Direção-Geral da Agricultura, Silvicultura e Pecuária (DGASP)."
  steps:
    - timing: longlead
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipar o teste sorológico antirrábico (titulação): análise de sangue num laboratório aprovado pela UE, pelo menos 30 dias depois da vacinação — um resultado válido é indispensável para reentrar na UE e não se resolve à última hora."
    - timing: window
      text:
        en: "DGASP is the competent veterinary authority for the sanitary regime governing animal export."
        fr: "La DGASP est l'autorité vétérinaire compétente pour le régime sanitaire régissant l'export des animaux."
        es: "La DGASP es la autoridad veterinaria competente para el régimen sanitario que rige la exportación de animales."
        pt: "A DGASP é a autoridade veterinária competente para o regime sanitário que rege a exportação de animais."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o cachorro já tinha um teste sorológico antirrábico (titulação) válido para a UE antes da partida, este permanece válido para toda a vida enquanto a vacinação antirrábica estiver em dia — convém verificar antes de viajar."

hero:
  h1: { en: "Traveling to Cape Verde with your dog", fr: "Voyager au Cap-Vert avec ton chien", es: "Viajar a Cabo Verde con tu perro", pt: "Viajar para Cabo Verde com o cachorro" }
  intro:
    en: >-
      Cape Verde (officially Cabo Verde) is an Atlantic island nation outside the European Union, so it does not
      apply the EU pet-passport framework. Bringing a dog runs through the country's own veterinary
      scheme, overseen by the Ministry of Agriculture and Environment (Ministério da Agricultura e
      Ambiente). The published sanitary conditions ask for a valid rabies vaccination given at least
      30 days before entry, several other core vaccinations, internal and external parasite treatment,
      and an official international veterinary health certificate issued by the veterinary authority of
      the country of origin. Prior authorisation is arranged before travel through a Cape Verde
      consular post or the veterinary services. Cape Verde publishes relatively little detail online,
      so several points — including any quarantine, blood-test or breed rules — are simply not stated
      officially and are marked Unknown here. This guide sets out what the official sources do confirm,
      so you know what to prepare and what still to verify before you book your flight.
    fr: >-
      Le Cap-Vert est un archipel de l'Atlantique situé hors de l'Union européenne : il
      n'applique donc pas le cadre du passeport européen. L'entrée d'un chien passe par le dispositif
      vétérinaire propre au pays, sous l'autorité du Ministère de l'Agriculture et de l'Environnement
      (Ministério da Agricultura e Ambiente). Les conditions sanitaires publiées exigent une
      vaccination antirabique valide réalisée au moins 30 jours avant l'entrée, plusieurs autres
      vaccinations essentielles, un traitement antiparasitaire interne et externe, et un certificat
      sanitaire vétérinaire international officiel délivré par l'autorité vétérinaire du pays d'origine.
      Une autorisation préalable est organisée avant le voyage auprès d'un poste consulaire cap-verdien
      ou des services vétérinaires. Le Cap-Vert publie relativement peu de détails en ligne : plusieurs
      points — dont une éventuelle quarantaine, un titrage ou des règles de races — ne sont pas indiqués
      officiellement et sont marqués « Non communiqué » ici. Ce guide expose ce que les sources
      officielles confirment, pour savoir quoi préparer et quoi vérifier avant de réserver ton vol.
    es: >-
      Cabo Verde es un país insular atlántico situado fuera de la Unión Europea, por lo que no aplica el
      marco del pasaporte europeo. Traer un perro se rige por el sistema veterinario propio del país,
      supervisado por el Ministerio de Agricultura y Medio Ambiente (Ministério da Agricultura e
      Ambiente). Las condiciones sanitarias publicadas exigen una vacunación antirrábica válida
      administrada al menos 30 días antes de la entrada, varias otras vacunaciones básicas, un
      tratamiento contra parásitos internos y externos y un certificado sanitario veterinario
      internacional oficial expedido por la autoridad veterinaria del país de origen. La autorización
      previa se gestiona antes del viaje a través de un puesto consular de Cabo Verde o de los servicios
      veterinarios. Cabo Verde publica relativamente pocos detalles en línea, por lo que varios puntos —
      incluidas una eventual cuarentena, una prueba de sangre o normas de razas — simplemente no se
      indican de forma oficial y aquí figuran como Desconocido. Esta guía expone lo que las fuentes
      oficiales sí confirman, para que sepas qué preparar y qué verificar aún antes de reservar tu vuelo.

    pt: "Cabo Verde (oficialmente República de Cabo Verde) é um país insular do Atlântico situado fora da União Europeia e, por isso, não aplica o quadro do passaporte europeu para animais de companhia. A entrada de um cachorro segue o regime veterinário próprio do país, sob a tutela do Ministério da Agricultura e Ambiente. As condições sanitárias publicadas exigem uma vacinação antirrábica válida, administrada pelo menos 30 dias antes da entrada, várias outras vacinações essenciais, tratamento antiparasitário interno e externo e um certificado sanitário veterinário internacional oficial emitido pela autoridade veterinária do país de origem. A autorização prévia é tratada antes da viagem junto de um posto consular de Cabo Verde ou dos serviços veterinários. Cabo Verde publica relativamente poucos detalhes online e, por isso, vários pontos — entre eles uma eventual quarentena, um exame de sangue ou regras de raças — não são indicados oficialmente e figuram aqui como Não informado. Este guia expõe o que as fontes oficiais confirmam, para se saber o que preparar e o que ainda é preciso verificar antes de reservar o voo."
difficulty:
  level: moderate
  label: { en: "Moderate — official certificate and prior authorisation", fr: "Modéré — certificat officiel et autorisation préalable", es: "Moderado — certificado oficial y autorización previa", pt: "Moderada — certificado oficial e autorização prévia" }

prepTime:
  eu:
    en: "From the EU: a few days if identification, vaccinations and deworming are already in order — but the rabies vaccination must have been given at least 30 days before entry, and the official certificate is issued close to departure."
    fr: "Depuis l'UE : quelques jours si l'identification, les vaccinations et la vermifugation sont déjà en règle — mais la vaccination antirabique doit dater d'au moins 30 jours avant l'entrée, et le certificat officiel est établi peu avant le départ."
    es: "Desde la UE: unos días si la identificación, las vacunaciones y la desparasitación ya están en regla — pero la vacunación antirrábica debe haberse administrado al menos 30 días antes de la entrada, y el certificado oficial se expide poco antes de la salida."
    pt: "A partir da UE: alguns dias, se a identificação, as vacinações e a desparasitação já estiverem em ordem — mas a vacinação antirrábica deve ter sido administrada pelo menos 30 dias antes da entrada, e o certificado oficial é emitido pouco antes da partida."
  listed:
    en: "From another non-EU country: same single Cape Verde scheme. Allow about 4–5 weeks if the first rabies shot is still needed, so the 30-day pre-entry interval can be met."
    fr: "Depuis un autre pays hors UE : même dispositif unique cap-verdien. Prévois environ 4 à 5 semaines s'il faut encore faire le premier vaccin antirabique, afin de respecter le délai de 30 jours avant l'entrée."
    es: "Desde otro país fuera de la UE: el mismo sistema único de Cabo Verde. Reserva unas 4 o 5 semanas si aún falta la primera vacuna antirrábica, para poder cumplir el intervalo de 30 días previos a la entrada."
    pt: "A partir de outro país fora da UE: o mesmo regime único de Cabo Verde. Convém prever cerca de 4 a 5 semanas se ainda faltar a primeira dose antirrábica, de modo a cumprir o intervalo de 30 dias antes da entrada."
  nonListed:
    en: "Cape Verde does not publish a separate listed / non-listed distinction. Timing is driven by the 30-day post-vaccination interval and by obtaining prior authorisation and the endorsed certificate."
    fr: "Le Cap-Vert ne publie pas de distinction pays listé / non listé. Les délais dépendent du délai de 30 jours après vaccination et de l'obtention de l'autorisation préalable et du certificat visé."
    es: "Cabo Verde no publica una distinción aparte entre país listado y no listado. Los plazos vienen determinados por el intervalo de 30 días tras la vacunación y por la obtención de la autorización previa y del certificado refrendado."
    pt: "Cabo Verde não publica uma distinção à parte entre país listado e não listado. Os prazos dependem do intervalo de 30 dias após a vacinação e da obtenção da autorização prévia e do certificado endossado."

