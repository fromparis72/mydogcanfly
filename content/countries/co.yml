# Country Entry Guide — Colombia (bilingual EN/FR).
# Colombia is NOT in the EU. This encodes Colombia's own ICA (Instituto Colombiano Agropecuario) scheme:
# a Sanitary Inspection Certificate (CIS) issued on arrival, after online registration and payment via SISPAP.
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_co
iso2: "CO"
name: { en: "Colombia", fr: "Colombie", es: "Colombia", pt: "Colômbia" }
region: { en: "South America", fr: "Amérique du Sud", es: "América del Sur", pt: "América do Sul" }


regime: non_listed
domestic:
  intro:
    en: "Domestic flight in Colombia: no import formality, but aviation rules require a vaccination record."
    fr: "Vol intérieur en Colombie : aucune formalité d'import, mais la réglementation aérienne impose un carnet de vaccination."
    es: "Vuelo nacional en Colombia: ningún trámite de importación, pero la normativa aérea exige una cartilla de vacunación."
    pt: "Voo doméstico na Colômbia: nenhuma formalidade de importação, mas as regras da aviação exigem uma carteira de vacinação."
  points:
    - en: "Aviation regulation RAC 3 requires a vaccination card or certificate signed by a vet, with their professional registration number."
      fr: "Le règlement aérien RAC 3 impose un carnet ou certificat de vaccination signé par un vétérinaire, avec son numéro d'inscription professionnelle."
      es: "El reglamento aéreo RAC 3 exige un carné o certificado de vacunación firmado por un veterinario, con su número de matrícula profesional."
      pt: "O regulamento aéreo RAC 3 exige uma carteira ou um certificado de vacinação assinado por um veterinário, com o número de registro profissional dele."
    - en: "ICA states explicitly that its CIS sanitary inspection certificate is NOT required to move dogs and cats within the country."
      fr: "L'ICA précise explicitement que son certificat d'inspection sanitaire (CIS) n'est PAS requis pour déplacer chiens et chats à l'intérieur du pays."
      es: "El ICA precisa explícitamente que su certificado de inspección sanitaria (CIS) NO se requiere para mover perros y gatos dentro del país."
      pt: "O ICA afirma explicitamente que o seu certificado de inspeção sanitária (CIS) NÃO é exigido para deslocar cachorros e gatos dentro do país."
    - en: "Whatever the airline asks for (health certificate, vaccination record, breed or crate rules) is its own commercial policy, not a legal requirement — check with your carrier."
      fr: "Ce que la compagnie demande (certificat de santé, carnet de vaccination, règles de race ou de caisse) relève de sa politique commerciale, pas d'une obligation légale — vérifie auprès d'elle."
      es: "Lo que pida la aerolínea (certificado de salud, cartilla de vacunación, reglas de raza o jaula) es su política comercial, no una obligación legal — consúltalo con ella."
      pt: "Tudo o que a companhia aérea pedir (atestado de saúde, carteira de vacinação, regras de raça ou de caixa de transporte) é política comercial dela, não exigência legal — confirme com a sua companhia."
exit:
  authority: ICA
  authorityUrl: https://www.ica.gov.co/importacion-y-exportacion/otros-procedimientos/requisitos-para-importar-mascotas/salida-de-perros-y-gatos-desde-colombia
  intro:
    en: "Colombia is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus a sanitary inspection certificate (CIS) issued by ICA at the airport."
    fr: "La Colombie est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat d'inspection sanitaire (CIS) délivré par l'ICA à l'aéroport."
    es: "Colombia no está listada: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado de inspección sanitaria (CIS) emitido por el ICA en el aeropuerto."
    pt: "A Colômbia é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um certificado de inspeção sanitária (CIS) emitido pelo ICA no aeroporto."
  steps:
    - timing: longlead
      scope: any
      text:
        en: "Plan the rabies titer early: per ICA, the blood sample must be taken at least 1 month after vaccination and 3 months before travel (minimum age about 7 months)."
        fr: "Planifie le titrage tôt : selon l'ICA, la prise de sang doit être faite au moins 1 mois après la vaccination et 3 mois avant le voyage (âge minimum ~7 mois)."
        es: "Planifica pronto la titulación: según el ICA, la muestra de sangre debe tomarse al menos 1 mes tras la vacuna y 3 meses antes del viaje (edad mínima ~7 meses)."
        pt: "Planeje o teste sorológico antirrábico (titulação) com antecedência: segundo o ICA, a coleta de sangue deve ser feita pelo menos 1 mês após a vacinação e 3 meses antes da viagem (idade mínima de cerca de 7 meses)."
    - timing: window
      scope: any
      text:
        en: "Register and request the ICA inspection up to 3 days before travel; an inspection is done about 24h before departure at the ICA airport office, then the CIS is issued."
        fr: "Inscris-toi et demande l'inspection ICA jusqu'à 3 jours avant le voyage ; une inspection est réalisée ~24 h avant le départ au bureau ICA de l'aéroport, puis le CIS est délivré."
        es: "Regístrate y solicita la inspección del ICA hasta 3 días antes del viaje; se realiza una inspección ~24 h antes de la salida en la oficina del ICA en el aeropuerto y luego se emite el CIS."
        pt: "Registre-se e solicite a inspeção do ICA até 3 dias antes da viagem; a inspeção é feita cerca de 24h antes da partida no escritório do ICA no aeroporto, e então o CIS é emitido."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Colombia with your dog", fr: "Voyager en Colombie avec ton chien", es: "Viajar a Colombia con tu perro", pt: "Viajar para a Colômbia com o seu cachorro" }
  intro:
    en: >-
      Colombia welcomes dogs, and it runs one uniform national scheme managed by the ICA (Instituto
      Colombiano Agropecuario), the official animal-health authority. There is no EU pet passport here:
      the key document is a Sanitary Inspection Certificate (CIS) that the ICA issues at the airport,
      seaport or land border when you arrive. Before you travel you register online and pay, then carry an
      official veterinary health certificate from your country of origin (issued within 10 days), proof of
      a valid rabies vaccination and several other canine vaccinations, and evidence of internal and
      external parasite treatment. Colombia asks for no rabies antibody test and no routine quarantine for
      a compliant, healthy pet. One important warning: Colombian law bans the import of certain
      pit-bull-type and "potentially dangerous" breeds. This guide explains exactly what to prepare, and
      when, before you book your flight.
    fr: >-
      La Colombie accueille les chiens et applique un régime national uniforme géré par l'ICA (Instituto
      Colombiano Agropecuario), l'autorité sanitaire animale officielle. Pas de passeport européen ici :
      le document clé est un Certificat d'Inspection Sanitaire (CIS) que l'ICA délivre à l'aéroport, au
      port ou au poste-frontière à ton arrivée. Avant de partir, tu t'enregistres en ligne et
      réglez le service, puis tu présente un certificat vétérinaire officiel du pays d'origine (émis
      dans les 10 jours), la preuve d'une vaccination antirabique valide et de plusieurs autres
      vaccinations canines, ainsi qu'un traitement antiparasitaire interne et externe. La Colombie
      n'exige ni titrage antirabique ni quarantaine de routine pour un animal conforme et en bonne santé.
      Un avertissement important : la loi colombienne interdit l'importation de certaines races de type
      pit-bull et « potentiellement dangereuses ». Ce guide détaille exactement quoi préparer, et quand,
      avant de réserver ton vol.
    es: >-
      Colombia acoge a los perros y aplica un único régimen nacional uniforme gestionado por el ICA
      (Instituto Colombiano Agropecuario), la autoridad sanitaria animal oficial. Aquí no hay pasaporte
      europeo para mascotas: el documento clave es un Certificado de Inspección Sanitaria (CIS) que el
      ICA expide en el aeropuerto, el puerto o el paso fronterizo terrestre cuando llegas. Antes de
      viajar te registras en línea y pagas, y luego llevas un certificado sanitario veterinario oficial
      de tu país de origen (emitido dentro de los 10 días), la prueba de una vacunación antirrábica
      válida y de varias otras vacunas caninas, y la constancia de un tratamiento antiparasitario interno
      y externo. Colombia no exige ninguna prueba de titulación de rabia ni cuarentena de rutina para una
      mascota conforme y sana. Una advertencia importante: la ley colombiana prohíbe la importación de
      ciertas razas de tipo pit bull y «potencialmente peligrosas». Esta guía explica exactamente qué
      preparar, y cuándo, antes de reservar tu vuelo.

    pt: "A Colômbia recebe bem os cachorros e aplica um único regime nacional uniforme, gerido pelo ICA (Instituto Colombiano Agropecuario), a autoridade oficial de saúde animal. Aqui não existe passaporte europeu para animais de companhia: o documento-chave é um Certificado de Inspeção Sanitária (CIS) que o ICA emite no aeroporto, no porto ou na fronteira terrestre quando você chega. Antes de viajar, você se registra on-line e paga; depois, leva um certificado veterinário oficial de saúde do seu país de origem (emitido nos 10 dias anteriores), o comprovante de uma vacinação antirrábica válida e de várias outras vacinas caninas, e a comprovação do tratamento antiparasitário interno e externo. A Colômbia não exige teste sorológico antirrábico (titulação) nem quarentena de rotina para um animal em conformidade e saudável. Um aviso importante: a lei colombiana proíbe a importação de certas raças do tipo pit bull e “potencialmente perigosas”. Este guia explica exatamente o que preparar, e quando, antes de você comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Moderate — one uniform scheme, but several vaccinations and a breed import ban", fr: "Modéré — un régime uniforme, mais plusieurs vaccins et une interdiction d'importation de races", es: "Moderado — un régimen uniforme, pero varias vacunas y una prohibición de importación de razas", pt: "Moderada — um regime uniforme, mas com várias vacinas e uma proibição de importação por raça" }

prepTime:
  eu:
    en: "Standard case: a few days to assemble the documents once the vaccinations are valid — the official health certificate must be issued within 10 calendar days before entry, and you register and pay the CIS online beforehand."
    fr: "Cas standard : quelques jours pour réunir les documents une fois les vaccinations valides — le certificat de santé officiel doit être émis dans les 10 jours calendaires avant l'entrée, et tu enregistre et paie le CIS en ligne au préalable."
    es: "Caso estándar: unos días para reunir los documentos una vez que las vacunas son válidas — el certificado sanitario oficial debe emitirse dentro de los 10 días naturales previos a la entrada, y registras y pagas el CIS en línea de antemano."
    pt: "Caso padrão: alguns dias para reunir os documentos assim que as vacinas estiverem válidas — o atestado de saúde oficial deve ser emitido nos 10 dias corridos anteriores à entrada, e você se registra e paga o CIS on-line antes disso."
  listed:
    en: "If the first rabies shot is still needed: plan ~3 weeks, as a primary rabies vaccination must be given at least 21 days before the shipment date. Minimum entry age is 15 weeks."
    fr: "Si la première vaccination antirabique reste à faire : prévois ~3 semaines, une primo-vaccination antirabique devant être faite au moins 21 jours avant la date d'embarquement. L'âge minimum d'entrée est de 15 semaines."
    es: "Si aún falta la primera vacuna antirrábica: prevé ~3 semanas, ya que una primovacunación antirrábica debe administrarse al menos 21 días antes de la fecha de embarque. La edad mínima de entrada es de 15 semanas."
    pt: "Se a primeira dose da vacina antirrábica ainda estiver pendente: conte ~3 semanas, já que a vacinação antirrábica primária deve ser aplicada pelo menos 21 dias antes da data do embarque. A idade mínima para entrar é de 15 semanas."
  nonListed:
    en: "Special cases: if rabies vaccination is not available in the origin country (home quarantine + vaccination in Colombia), or your dog is a restricted breed, allow much more time — some breeds cannot enter at all."
    fr: "Cas particuliers : si la vaccination antirabique n'existe pas dans le pays d'origine (quarantaine domiciliaire + vaccination en Colombie), ou si ton chien est d'une race restreinte, prévois beaucoup plus de temps — certaines races ne peuvent pas entrer du tout."
    es: "Casos particulares: si la vacunación antirrábica no existe en el país de origen (cuarentena domiciliaria + vacunación en Colombia), o si tu perro es de una raza restringida, prevé mucho más tiempo — algunas razas no pueden entrar en absoluto."
    pt: "Casos especiais: se a vacinação antirrábica não estiver disponível no país de origem (quarentena domiciliar + vacinação na Colômbia), ou se o seu cachorro for de uma raça restrita, conte com muito mais tempo — algumas raças não podem entrar de jeito nenhum."

