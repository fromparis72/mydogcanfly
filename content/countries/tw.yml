# Country Entry Guide — Taiwan (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_tw
iso2: "TW"
name: { en: "Taiwan", fr: "Taïwan", es: "Taiwán", pt: "Taiwan" }
region: { en: "Asia", fr: "Asie", es: "Asia", pt: "Ásia" }


regime: listed
domestic:
  intro:
    en: "Domestic flight in Taiwan: nothing is required within the main island, but the outlying islands of Kinmen and Matsu are a real internal border."
    fr: "Vol intérieur à Taïwan : rien n'est exigé sur l'île principale, mais les îles de Kinmen et Matsu constituent une véritable frontière intérieure."
    es: "Vuelo nacional en Taiwán: nada se exige en la isla principal, pero las islas de Kinmen y Matsu son una verdadera frontera interior."
    pt: "Voo doméstico em Taiwan: nada é exigido dentro da ilha principal, mas as ilhas periféricas de Kinmen e Matsu são uma verdadeira fronteira interna."
  points:
    - en: "Pet registration with an implanted microchip and annual rabies vaccination are compulsory as ownership duties."
      fr: "L'enregistrement de l'animal avec puce implantée et la vaccination antirabique annuelle sont obligatoires au titre des devoirs du détenteur."
      es: "El registro de la mascota con microchip implantado y la vacuna antirrábica anual son obligatorios como deberes del propietario."
      pt: "O registro do animal de estimação com microchip implantado e a vacinação antirrábica anual são obrigações compulsórias da posse."
    - en: "Within Taiwan proper, including Penghu, no movement document is required."
      fr: "Sur Taïwan proprement dit, Penghu compris, aucun document de mouvement n'est requis."
      es: "En Taiwán propiamente dicho, incluido Penghu, no se exige documento de movimiento."
      pt: "Dentro de Taiwan propriamente dito, incluindo Penghu, nenhum documento de deslocamento é exigido."
    - en: "Whatever the airline asks for (health certificate, vaccination record, breed or crate rules) is its own commercial policy, not a legal requirement — check with your carrier."
      fr: "Ce que la compagnie demande (certificat de santé, carnet de vaccination, règles de race ou de caisse) relève de sa politique commerciale, pas d'une obligation légale — vérifie auprès d'elle."
      es: "Lo que pida la aerolínea (certificado de salud, cartilla de vacunación, reglas de raza o jaula) es su política comercial, no una obligación legal — consúltalo con ella."
      pt: "Tudo o que a companhia aérea pedir (atestado de saúde, carteira de vacinação, regras de raça ou de caixa de transporte) é política comercial dela, não exigência legal — confirme com a sua companhia."
  territories:
    - name: { en: "Kinmen and Matsu", fr: "Kinmen et Matsu", es: "Kinmen y Matsu", pt: "Kinmen e Matsu" }
      note:
        en: "Dogs moving in either direction between Taiwan proper and these islands must be inspected: pet registration dated at least 30 days before, and rabies vaccination at least 7 days before arrival and under a year old. Documents are filed before departure and the animal is presented on arrival."
        fr: "Les chiens circulant dans un sens comme dans l'autre entre Taïwan et ces îles doivent être inspectés : enregistrement datant d'au moins 30 jours, et vaccination antirabique d'au moins 7 jours avant l'arrivée et de moins d'un an. Les documents se déposent avant le départ et l'animal est présenté à l'arrivée."
        es: "Los perros que se muevan en cualquier sentido entre Taiwán y estas islas deben ser inspeccionados: registro con al menos 30 días de antigüedad, y vacuna antirrábica de al menos 7 días antes de la llegada y de menos de un año. Los documentos se presentan antes de salir y el animal se presenta a la llegada."
        pt: "Cachorros que se deslocam em qualquer direção entre Taiwan propriamente dito e essas ilhas devem ser inspecionados: registro do animal datado de pelo menos 30 dias antes, e vacinação antirrábica de pelo menos 7 dias antes da chegada e com menos de um ano. Os documentos são apresentados antes da partida e o animal é apresentado na chegada."
      url: https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=M0130014
exit:
  authority: APHIA
  authorityUrl: https://www.aphia.gov.tw/en/ws.php?id=14261
  intro:
    en: "Taiwan is a listed country, so no rabies titer is needed to return to the EU — APHIA (formerly BAPHIQ) inspects your dog and issues the export certificate."
    fr: "Taïwan est un pays listé : pas de titrage pour rentrer dans l'UE — l'APHIA (ex-BAPHIQ) inspecte ton chien et délivre le certificat d'export."
    es: "Taiwán es un país listado: no hace falta titulación para volver a la UE — la APHIA (antes BAPHIQ) inspecciona a tu perro y emite el certificado de exportación."
    pt: "Taiwan é um país listado, portanto nenhum teste sorológico antirrábico é necessário para voltar à UE — a APHIA (antiga BAPHIQ) inspeciona o seu cachorro e emite o certificado de exportação."
  steps:
    - timing: window
      scope: any
      text:
        en: "Obtain the destination's health-certificate form and file an export-quarantine application at an APHIA branch office; APHIA advises submitting it at least about a week before shipment, then inspects the dog and endorses the certificate."
        fr: "Procure-toi le formulaire de certificat sanitaire de la destination et dépose une demande de quarantaine d'export à un bureau APHIA ; l'APHIA conseille de le faire au moins une semaine avant, puis inspecte le chien et vise le certificat."
        es: "Consigue el formulario de certificado sanitario del destino y presenta una solicitud de cuarentena de exportación en una oficina de la APHIA; la APHIA recomienda hacerlo al menos una semana antes, luego inspecciona al perro y refrenda el certificado."
        pt: "Obtenha o formulário de atestado de saúde do destino e apresente uma solicitação de quarentena de exportação em uma filial da APHIA; a APHIA recomenda apresentá-la pelo menos cerca de uma semana antes do envio, e então inspeciona o cachorro e endossa o atestado."
  onSiteNote:
    en: "Confirm the specific EU member-state requirements too — APHIA certifies to the destination country's designated form."
    fr: "Vérifie aussi les exigences propres à l'État membre UE de destination — l'APHIA certifie selon le formulaire désigné par le pays d'arrivée."
    es: "Confirma también los requisitos del Estado miembro de la UE de destino — la APHIA certifica según el formulario designado por el país de llegada."
    pt: "Confirme também as exigências específicas do Estado-membro da UE de destino — a APHIA certifica de acordo com o formulário designado do país de destino."

hero:
  h1: { en: "Traveling to Taiwan with your dog", fr: "Voyager à Taïwan avec ton chien", es: "Viajar a Taiwán con tu perro", pt: "Viajar para Taiwan com seu cachorro" }
  intro:
    en: >-
      Taiwan welcomes dogs, but it runs its own strict, rabies-focused entry scheme managed by the
      Animal and Plant Health Inspection Agency (APHIA). What you must prepare depends mainly on
      whether your dog is coming from a country Taiwan recognises as rabies-free (such as Japan, the
      United Kingdom, Australia or Singapore) or from a rabies-infected country — which is how most of
      the world is classified. Every dog needs an ISO microchip, an inactivated rabies vaccination and
      an import permit applied for in advance. Dogs from rabies-infected countries also need a rabies
      antibody test and, in most cases, a post-arrival quarantine at a designated facility. This guide
      explains each path so you know exactly what to prepare before you book your flight.
    fr: >-
      Taïwan accueille les chiens, mais applique son propre régime d'entrée strict, centré sur la rage
      et géré par l'Animal and Plant Health Inspection Agency (APHIA). Ce qu'il faut préparer dépend
      surtout de l'origine : un pays reconnu par Taïwan comme indemne de rage (Japon, Royaume-Uni,
      Australie, Singapour…) ou un pays infecté par la rage — statut de la plupart des pays du monde.
      Tout chien a besoin d'une puce ISO, d'une vaccination antirabique inactivée et d'un permis
      d'importation demandé à l'avance. Les chiens venant d'un pays infecté doivent aussi passer un
      test sérologique antirabique (titrage) et, le plus souvent, une quarantaine à l'arrivée dans un
      centre désigné. Ce guide détaille chaque cas pour savoir quoi préparer avant de réserver.
    es: >-
      Taiwán acoge a los perros, pero aplica su propio régimen de entrada estricto, centrado en la rabia
      y gestionado por la Animal and Plant Health Inspection Agency (APHIA). Lo que debes preparar depende
      sobre todo de si tu perro llega de un país que Taiwán reconoce como libre de rabia (como Japón, el
      Reino Unido, Australia o Singapur) o de un país infectado por la rabia — que es como se clasifica la
      mayor parte del mundo. Todo perro necesita un microchip ISO, una vacunación antirrábica inactivada y
      un permiso de importación solicitado con antelación. Los perros procedentes de países infectados por
      la rabia también necesitan una prueba de titulación de rabia y, en la mayoría de los casos, una
      cuarentena tras la llegada en un centro designado. Esta guía explica cada caso para que sepas
      exactamente qué preparar antes de reservar tu vuelo.

    pt: "Taiwan recebe cachorros, mas aplica o próprio esquema rigoroso, centrado na raiva, administrado pela Animal and Plant Health Inspection Agency (APHIA). O que você precisa preparar depende principalmente de o seu cachorro vir de um país que Taiwan reconhece como livre de raiva (como Japão, Reino Unido, Austrália ou Cingapura) ou de um país infectado por raiva — que é como a maior parte do mundo é classificada. Todo cachorro precisa de um microchip ISO, uma vacinação antirrábica inativada e uma autorização de importação solicitada com antecedência. Cachorros vindos de países infectados por raiva também precisam de um teste sorológico antirrábico e, na maioria dos casos, de uma quarentena após a chegada em uma instalação designada. Este guia explica cada caminho para você saber exatamente o que preparar antes de reservar o seu voo."
difficulty:
  level: difficult
  label: { en: "Difficult — import permit, antibody test and quarantine", fr: "Difficile — permis, titrage et quarantaine", es: "Difícil — permiso de importación, prueba de titulación y cuarentena", pt: "Difícil — autorização de importação, teste sorológico e quarentena" }

prepTime:
  eu:
    en: "From a rabies-free country: ~1 month if already resident — inactivated rabies shot 30 days to 1 year before entry, permit filed at least 20 days ahead, no antibody test and no quarantine."
    fr: "Depuis un pays indemne : ~1 mois si déjà résident — vaccin antirabique inactivé 30 jours à 1 an avant l'entrée, permis déposé au moins 20 jours avant, sans titrage ni quarantaine."
    es: "Desde un país libre de rabia: ~1 mes si ya eres residente — vacuna antirrábica inactivada de 30 días a 1 año antes de la entrada, permiso presentado al menos 20 días antes, sin prueba de titulación ni cuarentena."
    pt: "De um país livre de raiva: cerca de 1 mês se já for residente — vacina antirrábica inativada de 30 dias a 1 ano antes da entrada, autorização solicitada com pelo menos 20 dias de antecedência, sem teste sorológico e sem quarentena."
  listed:
    en: "From a rabies-infected country, standard path: ~4 months — antibody test blood drawn at least 90 days before entry, then a minimum 7-day quarantine at a designated facility."
    fr: "Depuis un pays infecté, voie standard : ~4 mois — sang du titrage prélevé au moins 90 jours avant l'entrée, puis une quarantaine minimale de 7 jours dans un centre désigné."
    es: "Desde un país infectado por la rabia, vía estándar: ~4 meses — sangre de la prueba de titulación extraída al menos 90 días antes de la entrada, y luego una cuarentena mínima de 7 días en un centro designado."
    pt: "De um país infectado por raiva, caminho padrão: cerca de 4 meses — coleta de sangue para o teste sorológico feita pelo menos 90 dias antes da entrada, seguida de uma quarentena mínima de 7 dias em uma instalação designada."
  nonListed:
    en: "From a rabies-infected country, quarantine-waiver path: ~6–7 months — antibody test blood drawn 180 days to 1 year before entry and the permit filed at least 120 days ahead."
    fr: "Depuis un pays infecté, voie avec dispense de quarantaine : ~6–7 mois — sang du titrage prélevé 180 jours à 1 an avant l'entrée et permis déposé au moins 120 jours avant."
    es: "Desde un país infectado por la rabia, vía con exención de cuarentena: ~6–7 meses — sangre de la prueba de titulación extraída de 180 días a 1 año antes de la entrada y permiso presentado al menos 120 días antes."
    pt: "De um país infectado por raiva, caminho com isenção de quarentena: cerca de 6 a 7 meses — coleta de sangue para o teste sorológico feita de 180 dias a 1 ano antes da entrada e autorização solicitada com pelo menos 120 dias de antecedência."

