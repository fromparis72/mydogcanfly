notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro."
    pt: "Só um médico-veterinário pode confirmar o procedimento exato para o seu cachorro."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Taiwan (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — Taïwan (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Taiwán (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — Taiwan (seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Taiwan", fr: "Pays de destination — Taïwan", es: "País de destino — Taiwán", pt: "País de destino — Taiwan" }
      text:
        en: "Taiwan applies its own APHIA scheme: an ISO microchip, an inactivated rabies vaccination and an advance import permit are always required, and modified-live rabies vaccines are never accepted."
        fr: "Taïwan applique son propre régime APHIA : puce ISO, vaccination antirabique inactivée et permis d'importation à l'avance toujours exigés ; les vaccins antirabiques vivants atténués ne sont jamais acceptés."
        es: "Taiwán aplica su propio régimen de la APHIA: siempre se exigen un microchip ISO, una vacunación antirrábica inactivada y un permiso de importación previo, y nunca se aceptan vacunas antirrábicas vivas atenuadas."
        pt: "Taiwan aplica o próprio esquema da APHIA: um microchip ISO, uma vacinação antirrábica inativada e uma autorização de importação prévia são sempre exigidos, e vacinas antirrábicas de vírus vivo modificado nunca são aceitas."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Whether your dog leaves from a country Taiwan recognises as rabies-free or from a rabies-infected country decides whether a rabies antibody test and a post-arrival quarantine are required."
        fr: "Que ton chien parte d'un pays reconnu indemne de rage par Taïwan ou d'un pays infecté détermine si un titrage antirabique et une quarantaine à l'arrivée sont exigés."
        es: "Que tu perro salga de un país que Taiwán reconoce como libre de rabia o de un país infectado por la rabia determina si se exigen una prueba de titulación de rabia y una cuarentena tras la llegada."
        pt: "O fato de o seu cachorro partir de um país que Taiwan reconhece como livre de raiva ou de um país infectado por raiva determina se um teste sorológico antirrábico e uma quarentena após a chegada são exigidos."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A stay in or transit through a rabies-infected country can cancel the rabies-free treatment even if you fly in from an exempt country. It is your dog's real origin and history that count — not only the last airport."
        fr: "Un séjour ou un transit par un pays infecté peut annuler le traitement « indemne » même si tu arrives d'un pays exempté. C'est l'origine réelle et l'historique du chien qui comptent — pas seulement l'aéroport de destination finale."
        es: "Una estancia o un tránsito por un país infectado por la rabia puede anular el trato de país libre de rabia aunque llegues desde un país exento. Lo que cuenta es el origen y el historial reales de tu perro — no solo el último aeropuerto."
        pt: "Uma estadia em, ou trânsito por, um país infectado por raiva pode anular o tratamento de país livre de raiva, mesmo que você chegue voando de um país isento. O que conta é a origem real e o histórico do seu cachorro — não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Taiwan's framework, then confirm your dog's exact origin and history with your vet and the APHIA branch office at your port of entry."
    fr: "Lis donc les exigences ci-dessous comme le cadre taïwanais, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire et l'antenne APHIA de ton point d'entrée."
    es: "Así que lee los requisitos siguientes como el marco de Taiwán y luego confirma el origen y el historial exactos de tu perro con tu veterinario y la oficina regional de la APHIA de tu punto de entrada."
    pt: "Portanto, leia as exigências abaixo como o regime de Taiwan e depois confirme a origem exata e o histórico do seu cachorro com o seu veterinário e a filial da APHIA no seu ponto de entrada."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Must be implanted and readable before the rabies vaccination and blood test.", fr: "Doit être posée et lisible avant la vaccination antirabique et la prise de sang.", es: "Debe implantarse y ser legible antes de la vacunación antirrábica y la prueba de sangre.", pt: "Deve ser implantado e legível antes da vacinação antirrábica e do exame de sangue." }
    exceptions: { en: "Ensure the microchip can be scanned and is functional on arrival.", fr: "Assure-toi que la puce est lisible et fonctionnelle à l'arrivée.", es: "Asegúrate de que el microchip se pueda escanear y funcione a la llegada.", pt: "Certifique-se de que o microchip pode ser lido e está funcional na chegada." }
    ref: { en: "APHIA — Quarantine Requirements for the Importation of Dogs and Cats", fr: "APHIA — Conditions de quarantaine à l'importation des chiens et chats", es: "APHIA — Requisitos de cuarentena para la importación de perros y gatos", pt: "APHIA — Exigências de Quarentena para a Importação de Cachorros e Gatos" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Inactivated (killed) vaccine only, given 30 days to 1 year before entry; dog at least 90 days old at vaccination.", fr: "Vaccin inactivé (tué) uniquement, administré 30 jours à 1 an avant l'entrée ; chien d'au moins 90 jours à la vaccination.", es: "Solo vacuna inactivada (muerta), administrada de 30 días a 1 año antes de la entrada; perro de al menos 90 días en el momento de la vacunación.", pt: "Somente vacina inativada (morta), aplicada de 30 dias a 1 ano antes da entrada; cachorro com pelo menos 90 dias de idade na vacinação." }
    exceptions: { en: "Modified-live (MLV) rabies vaccines are not accepted, even those approved by the USDA.", fr: "Les vaccins antirabiques vivants atténués (MLV) ne sont pas acceptés, même approuvés par l'USDA.", es: "Las vacunas antirrábicas vivas atenuadas (MLV) no se aceptan, ni siquiera las aprobadas por el USDA.", pt: "Vacinas antirrábicas de vírus vivo modificado (MLV) não são aceitas, mesmo as aprovadas pelo USDA." }
    ref: { en: "APHIA — Quarantine Requirements for the Importation of Dogs and Cats", fr: "APHIA — Conditions de quarantaine à l'importation des chiens et chats", es: "APHIA — Requisitos de cuarentena para la importación de perros y gatos", pt: "APHIA — Exigências de Quarentena para a Importação de Cachorros e Gatos" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Rabies-infected origins only: tested at a WOAH reference or APHIA-designated lab, result ≥0.5 IU/ml, blood sampled at least 90 days before entry (180 days to 1 year to qualify for a quarantine waiver).", fr: "Origines infectées uniquement : analysé dans un labo de référence OMSA ou désigné par l'APHIA, résultat ≥0,5 UI/ml, sang prélevé au moins 90 jours avant l'entrée (180 jours à 1 an pour ouvrir droit à une dispense de quarantaine).", es: "Solo orígenes infectados: analizada en un laboratorio de referencia de la WOAH o designado por la APHIA, resultado ≥0,5 UI/ml, sangre extraída al menos 90 días antes de la entrada (de 180 días a 1 año para tener derecho a una exención de cuarentena).", pt: "Apenas para origens infectadas por raiva: testado em um laboratório de referência da WOAH ou designado pela APHIA, resultado ≥0,5 UI/ml, sangue coletado pelo menos 90 dias antes da entrada (de 180 dias a 1 ano para se qualificar para a isenção de quarentena)." }
    exceptions: { en: "Not required from countries/zones Taiwan recognises as rabies-free (Japan, UK, Australia, New Zealand, Singapore, Sweden, Iceland, Norway, Estonia, Czech Republic, plus Hawaii and Guam). Blood cannot be sampled in Taiwan.", fr: "Non requis depuis les pays/zones reconnus indemnes par Taïwan (Japon, Royaume-Uni, Australie, Nouvelle-Zélande, Singapour, Suède, Islande, Norvège, Estonie, Tchéquie, ainsi qu'Hawaï et Guam). Le sang ne peut être prélevé à Taïwan.", es: "No se exige desde países/zonas que Taiwán reconoce como libres de rabia (Japón, Reino Unido, Australia, Nueva Zelanda, Singapur, Suecia, Islandia, Noruega, Estonia, República Checa, además de Hawái y Guam). La sangre no puede extraerse en Taiwán.", pt: "Não exigido de países/zonas que Taiwan reconhece como livres de raiva (Japão, Reino Unido, Austrália, Nova Zelândia, Cingapura, Suécia, Islândia, Noruega, Estônia, República Tcheca, além do Havaí e Guam). O sangue não pode ser coletado em Taiwan." }
    ref: { en: "APHIA — Quarantine Requirements; FAQ (2026-03-10)", fr: "APHIA — Conditions de quarantaine ; FAQ (2026-03-10)", es: "APHIA — Requisitos de cuarentena; preguntas frecuentes (2026-03-10)", pt: "APHIA — Exigências de Quarentena; Perguntas Frequentes (10/03/2026)" }
  - item: { en: "Import permit", fr: "Permis d'importation", es: "Permiso de importación", pt: "Autorização de importação" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Apply online at least 20 days before entry (at least 120 days if seeking a quarantine waiver); the permit is free.", fr: "Demande en ligne au moins 20 jours avant l'entrée (au moins 120 jours pour une dispense de quarantaine) ; le permis est gratuit.", es: "Solicítalo en línea al menos 20 días antes de la entrada (al menos 120 días si buscas una exención de cuarentena); el permiso es gratuito.", pt: "Solicite on-line pelo menos 20 dias antes da entrada (pelo menos 120 dias se buscar isenção de quarentena); a autorização é gratuita." }
    exceptions: { en: "Arriving without an import permit means the dog is re-exported or destroyed.", fr: "Arriver sans permis d'importation signifie que le chien est réexpédié ou euthanasié.", es: "Llegar sin permiso de importación significa que el perro es reexportado o sacrificado.", pt: "Chegar sem uma autorização de importação significa que o cachorro é reexportado ou destruído." }
    ref: { en: "APHIA — Online Application System for Dog/Cat Import Permit", fr: "APHIA — Système de demande en ligne du permis d'importation chien/chat", es: "APHIA — Sistema de solicitud en línea del permiso de importación de perros/gatos", pt: "APHIA — Sistema de Solicitação On-line de Autorização de Importação de Cachorros/Gatos" }
  - item: { en: "Veterinary (health) certificate", fr: "Certificat vétérinaire (sanitaire)", es: "Certificado veterinario (sanitario)", pt: "Atestado (de saúde) veterinário" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Original certificate from the exporting country's government veterinary authority: APHIA Form 001 (rabies-free) or Form 002 (rabies-infected), in Chinese or English.", fr: "Certificat original de l'autorité vétérinaire gouvernementale du pays d'exportation : formulaire APHIA 001 (indemne) ou 002 (infecté), en chinois ou anglais.", es: "Certificado original de la autoridad veterinaria gubernamental del país exportador: formulario APHIA 001 (libre de rabia) o 002 (infectado por la rabia), en chino o inglés.", pt: "Certificado original da autoridade veterinária governamental do país exportador: Formulário APHIA 001 (livre de raiva) ou Formulário 002 (infectado por raiva), em chinês ou inglês." }
    exceptions: { en: "Without the original certificate the dog is re-exported or destroyed.", fr: "Sans le certificat original, le chien est réexpédié ou euthanasié.", es: "Sin el certificado original, el perro es reexportado o sacrificado.", pt: "Sem o certificado original, o cachorro é reexportado ou destruído." }
    ref: { en: "APHIA Form 001 / Form 002 — Veterinary Certificate for the Export of Dogs/Cats to Taiwan", fr: "Formulaire APHIA 001 / 002 — Certificat vétérinaire d'exportation vers Taïwan", es: "Formulario APHIA 001 / Formulario 002 — Certificado veterinario para la exportación de perros/gatos a Taiwán", pt: "Formulário APHIA 001 / Formulário 002 — Certificado Veterinário para a Exportação de Cachorros/Gatos para Taiwan" }
  - item: { en: "Post-entry quarantine", fr: "Quarantaine à l'arrivée", es: "Cuarentena tras la entrada", pt: "Quarentena após a entrada" }
    required: { en: "Required (rabies-infected origins)", fr: "Requise (origines infectées)", es: "Obligatoria (orígenes infectados por la rabia)", pt: "Obrigatória (origens infectadas por raiva)" }
    when: { en: "Minimum 7 days at a designated quarantine facility; the space is reserved when the import permit is issued.", fr: "Minimum 7 jours dans un centre de quarantaine désigné ; la place est réservée dès la délivrance du permis.", es: "Mínimo 7 días en un centro de cuarentena designado; la plaza se reserva al expedirse el permiso de importación.", pt: "Mínimo de 7 dias em uma instalação de quarentena designada; a vaga é reservada quando a autorização de importação é emitida." }
    exceptions: { en: "Waivable under strict conditions (early antibody test + advance filing, or direct lab reporting); not required from rabies-free countries.", fr: "Dispensable sous conditions strictes (titrage précoce + dépôt anticipé, ou transmission directe du labo) ; non requise depuis les pays indemnes.", es: "Se puede eximir bajo condiciones estrictas (prueba de titulación temprana + presentación anticipada, o notificación directa del laboratorio); no se exige desde países libres de rabia.", pt: "Pode ser dispensada sob condições rigorosas (teste sorológico antecipado + solicitação com antecedência, ou envio direto do laudo pelo laboratório); não exigida de países livres de raiva." }
    ref: { en: "APHIA — Quarantine Requirements for the Importation of Dogs and Cats", fr: "APHIA — Conditions de quarantaine à l'importation des chiens et chats", es: "APHIA — Requisitos de cuarentena para la importación de perros y gatos", pt: "APHIA — Exigências de Quarentena para a Importação de Cachorros e Gatos" }
  - item: { en: "Advance quarantine reservation", fr: "Réservation anticipée de la quarantaine", es: "Reserva anticipada de la cuarentena", pt: "Reserva antecipada de quarentena" }
    required: { en: "Included in the permit", fr: "Incluse dans le permis", es: "Incluida en el permiso", pt: "Incluída na autorização" }
    when: { en: "No separate booking — issuance of the import permit confirms the reserved quarantine space; check availability in the online system.", fr: "Pas de réservation séparée — la délivrance du permis confirme la place réservée ; consulte les disponibilités dans le système en ligne.", es: "Sin reserva aparte — la expedición del permiso de importación confirma la plaza de cuarentena reservada; consulta la disponibilidad en el sistema en línea.", pt: "Sem reserva separada — a emissão da autorização de importação confirma a vaga de quarentena reservada; verifique a disponibilidade no sistema on-line." }
    exceptions: { en: "Any change of date or port of entry must be applied for at least 10 days ahead.", fr: "Tout changement de date ou de point d'entrée doit être demandé au moins 10 jours avant.", es: "Cualquier cambio de fecha o de punto de entrada debe solicitarse al menos 10 días antes.", pt: "Qualquer alteração de data ou de ponto de entrada deve ser solicitada com pelo menos 10 dias de antecedência." }
    ref: { en: "APHIA — FAQ, Quarantine Requirements (2026-03-10)", fr: "APHIA — FAQ, conditions de quarantaine (2026-03-10)", es: "APHIA — Preguntas frecuentes, requisitos de cuarentena (2026-03-10)", pt: "APHIA — Perguntas Frequentes, Exigências de Quarentena (10/03/2026)" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "At least 90 days", fr: "Au moins 90 jours", es: "Al menos 90 días", pt: "Pelo menos 90 dias" }
    when: { en: "Dog must be at least 90 days old to be shipped and at vaccination; in practice older because of the waiting periods.", fr: "Le chien doit avoir au moins 90 jours pour être expédié et à la vaccination ; en pratique plus âgé du fait des délais.", es: "El perro debe tener al menos 90 días para ser enviado y en el momento de la vacunación; en la práctica es mayor debido a los períodos de espera.", pt: "O cachorro deve ter pelo menos 90 dias de idade para ser transportado e na vacinação; na prática, mais velho por causa dos períodos de espera." }
    exceptions: { en: "Puppies under 90 days cannot be vaccinated, so cannot be imported.", fr: "Un chiot de moins de 90 jours ne peut être vacciné, donc ne peut être importé.", es: "Un cachorro de menos de 90 días no puede vacunarse, por lo que no puede importarse.", pt: "Filhotes com menos de 90 dias não podem ser vacinados e, portanto, não podem ser importados." }
    ref: { en: "APHIA — Quarantine Requirements for the Importation of Dogs and Cats", fr: "APHIA — Conditions de quarantaine à l'importation des chiens et chats", es: "APHIA — Requisitos de cuarentena para la importación de perros y gatos", pt: "APHIA — Exigências de Quarentena para a Importação de Cachorros e Gatos" }
  - item: { en: "Prohibited breeds", fr: "Races interdites", es: "Razas prohibidas", pt: "Raças proibidas" }
    required: { en: "Import banned", fr: "Importation interdite", es: "Importación prohibida", pt: "Importação proibida" }
    when: { en: "American Pit Bull Terrier, American Pit Bull and American Staffordshire Terrier cannot be imported or bred.", fr: "American Pit Bull Terrier, American Pit Bull et American Staffordshire Terrier ne peuvent être importés ni élevés.", es: "El American Pit Bull Terrier, el American Pit Bull y el American Staffordshire Terrier no pueden importarse ni criarse.", pt: "American Pit Bull Terrier, American Pit Bull e American Staffordshire Terrier não podem ser importados nem criados." }
    exceptions: { en: "Ban effective 1 March 2022 (Ministry of Agriculture).", fr: "Interdiction en vigueur depuis le 1er mars 2022 (ministère de l'Agriculture).", es: "Prohibición en vigor desde el 1 de marzo de 2022 (Ministerio de Agricultura).", pt: "Proibição em vigor desde 1º de março de 2022 (Ministério da Agricultura)." }
    ref: { en: "Ministry of Agriculture — Announcement GL000084", fr: "Ministère de l'Agriculture — Avis GL000084", es: "Ministerio de Agricultura — Anuncio GL000084", pt: "Ministério da Agricultura — Comunicado GL000084" }

origin:
  scheme: own
  eu:
    from: [jp, gb, au, nz, sg, se, is, no, ee, cz]
    title: { en: "From a rabies-free country or zone", fr: "Depuis un pays ou une zone indemne de rage", es: "Desde un país o zona libre de rabia", pt: "De um país ou zona livre de raiva" }
    body:
      en: "If your dog comes from a country/zone Taiwan recognises as rabies-free (Japan, United Kingdom, Australia, New Zealand, Singapore, Sweden, Iceland, Norway excluding Svalbard, Estonia, Czech Republic, and Hawaii and Guam), it needs an ISO microchip, an inactivated rabies vaccination and an advance import permit. The dog must also have been kept in that rabies-free country continuously for at least 180 days (or since birth if under 180 days old). No antibody test and no quarantine are required."
      fr: "Si ton chien vient d'un pays/zone reconnu indemne par Taïwan (Japon, Royaume-Uni, Australie, Nouvelle-Zélande, Singapour, Suède, Islande, Norvège hors Svalbard, Estonie, Tchéquie, ainsi qu'Hawaï et Guam), il lui faut une puce ISO, une vaccination antirabique inactivée et un permis d'importation à l'avance. Le chien doit aussi avoir séjourné dans ce pays indemne de façon continue pendant au moins 180 jours (ou depuis la naissance s'il a moins de 180 jours). Ni titrage ni quarantaine ne sont exigés."
      es: "Si tu perro procede de un país/zona que Taiwán reconoce como libre de rabia (Japón, Reino Unido, Australia, Nueva Zelanda, Singapur, Suecia, Islandia, Noruega excepto Svalbard, Estonia, República Checa, así como Hawái y Guam), necesita un microchip ISO, una vacunación antirrábica inactivada y un permiso de importación previo. El perro también debe haber permanecido en ese país libre de rabia de forma continua durante al menos 180 días (o desde el nacimiento si tiene menos de 180 días). No se exigen prueba de titulación ni cuarentena."
      pt: "Se o seu cachorro vem de um país/zona que Taiwan reconhece como livre de raiva (Japão, Reino Unido, Austrália, Nova Zelândia, Cingapura, Suécia, Islândia, Noruega excluindo Svalbard, Estônia, República Tcheca, além do Havaí e Guam), ele precisa de um microchip ISO, uma vacinação antirrábica inativada e uma autorização de importação prévia. O cachorro também deve ter permanecido nesse país livre de raiva continuamente por pelo menos 180 dias (ou desde o nascimento, se tiver menos de 180 dias). Nenhum teste sorológico e nenhuma quarentena são exigidos."
    cls: ok
  listed:
    from_except: [jp, gb, au, nz, sg, se, is, no, ee, cz]
    title: { en: "From a rabies-infected country — standard (7-day quarantine)", fr: "Depuis un pays infecté — voie standard (quarantaine de 7 jours)", es: "Desde un país infectado por la rabia — vía estándar (cuarentena de 7 días)", pt: "De um país infectado por raiva — padrão (quarentena de 7 dias)" }
    body:
      en: "Most of the world is classified as rabies-infected. Your dog needs a microchip, an inactivated rabies vaccination, an advance import permit and a rabies antibody test (≥0.5 IU/ml) at a WOAH reference or APHIA-designated laboratory, with blood drawn at least 90 days before entry. On arrival the dog undergoes a minimum 7-day quarantine at a designated facility, with the space reserved through the permit."
      fr: "La plupart des pays sont classés infectés par la rage. Ton chien a besoin d'une puce, d'une vaccination antirabique inactivée, d'un permis d'importation à l'avance et d'un titrage antirabique (≥0,5 UI/ml) dans un labo de référence OMSA ou désigné par l'APHIA, avec un sang prélevé au moins 90 jours avant l'entrée. À l'arrivée, le chien subit une quarantaine d'au moins 7 jours dans un centre désigné, la place étant réservée via le permis."
      es: "La mayor parte del mundo está clasificada como infectada por la rabia. Tu perro necesita un microchip, una vacunación antirrábica inactivada, un permiso de importación previo y una prueba de titulación de rabia (≥0,5 UI/ml) en un laboratorio de referencia de la WOAH o designado por la APHIA, con la sangre extraída al menos 90 días antes de la entrada. A la llegada, el perro pasa una cuarentena mínima de 7 días en un centro designado, con la plaza reservada a través del permiso."
      pt: "A maior parte do mundo é classificada como infectada por raiva. O seu cachorro precisa de um microchip, uma vacinação antirrábica inativada, uma autorização de importação prévia e um teste sorológico antirrábico (≥0,5 UI/ml) em um laboratório de referência da WOAH ou designado pela APHIA, com sangue coletado pelo menos 90 dias antes da entrada. Na chegada, o cachorro passa por uma quarentena mínima de 7 dias em uma instalação designada, com a vaga reservada pela autorização."
    cls: warn
  nonListed:
    title: { en: "From a rabies-infected country — quarantine waiver", fr: "Depuis un pays infecté — dispense de quarantaine", es: "Desde un país infectado por la rabia — exención de cuarentena", pt: "De um país infectado por raiva — isenção de quarentena" }
    body:
      en: "The 7-day quarantine can be waived only if the antibody-test blood was drawn 180 days to 1 year before entry and either the permit is filed at least 120 days ahead, or the testing laboratory / exporting authority sends the report directly to APHIA. A dog re-entering within 1 year of a passed pre-export Taiwan test is also exempt. All other conditions (microchip, inactivated vaccine, import permit, official certificate) still apply."
      fr: "La quarantaine de 7 jours n'est dispensée que si le sang du titrage a été prélevé 180 jours à 1 an avant l'entrée et si, soit le permis est déposé au moins 120 jours avant, soit le laboratoire d'analyse / l'autorité d'exportation transmet le rapport directement à l'APHIA. Un chien revenant dans l'année suivant un test taïwanais réussi avant l'export est aussi exempté. Toutes les autres conditions (puce, vaccin inactivé, permis, certificat officiel) restent applicables."
      es: "La cuarentena de 7 días solo puede eximirse si la sangre de la prueba de titulación se extrajo de 180 días a 1 año antes de la entrada y, o bien el permiso se presenta al menos 120 días antes, o bien el laboratorio de análisis / la autoridad exportadora envía el informe directamente a la APHIA. También está exento un perro que vuelve a entrar dentro de 1 año tras superar una prueba taiwanesa previa a la exportación. Todas las demás condiciones (microchip, vacuna inactivada, permiso de importación, certificado oficial) siguen aplicándose."
      pt: "A quarentena de 7 dias só pode ser dispensada se o sangue do teste sorológico tiver sido coletado de 180 dias a 1 ano antes da entrada e a autorização for solicitada com pelo menos 120 dias de antecedência, ou o laboratório de teste / a autoridade exportadora enviar o laudo diretamente à APHIA. Um cachorro que reentra dentro de 1 ano após um teste de Taiwan pré-exportação aprovado também é isento. Todas as demais condições (microchip, vacina inativada, autorização de importação, certificado oficial) continuam se aplicando."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Taiwan depends on its origin and on the documents you present at the port of entry."
    fr: "Ce qui se passe à l'arrivée de ton chien à Taïwan dépend de son origine et des documents présentés au point d'entrée."
    es: "Lo que ocurre cuando tu perro llega a Taiwán depende de su origen y de los documentos que presentes en el punto de entrada."
    pt: "O que acontece quando o seu cachorro chega a Taiwan depende da sua origem e dos documentos que você apresenta no ponto de entrada."
  points:
    - en: "Apply for the import permit online (pet-epermit.aphia.gov.tw) at least 20 days before travel — 120 days if you want to waive the quarantine."
      fr: "Demande le permis d'importation en ligne (pet-epermit.aphia.gov.tw) au moins 20 jours avant le voyage — 120 jours pour dispenser de la quarantaine."
      es: "Solicita el permiso de importación en línea (pet-epermit.aphia.gov.tw) al menos 20 días antes del viaje — 120 días si quieres eximir la cuarentena."
      pt: "Solicite a autorização de importação on-line (pet-epermit.aphia.gov.tw) pelo menos 20 dias antes da viagem — 120 dias se você quiser dispensar a quarentena."
    - en: "On arrival, submit the original export veterinary certificate, a copy of the import permit, and the airway bill (cargo) or customs declaration (accompanied) at the animal quarantine counter."
      fr: "À l'arrivée, présente le certificat vétérinaire d'exportation original, une copie du permis et la lettre de transport aérien (fret) ou la déclaration en douane (accompagné) au guichet de quarantaine animale."
      es: "A la llegada, entrega el certificado veterinario de exportación original, una copia del permiso de importación y la carta de porte aéreo (carga) o la declaración de aduanas (acompañado) en el mostrador de cuarentena animal."
      pt: "Na chegada, apresente o certificado veterinário de exportação original, uma cópia da autorização de importação e o conhecimento aéreo (carga) ou a declaração alfandegária (acompanhado) no balcão de quarentena animal."
    # Le complément exact de la liste des pays/zones que Taïwan reconnaît indemnes de rage,
    # celle-là même qui qualifie le premier cas d'origine de cette fiche. Sans elle, un voyageur
    # parti de Tokyo lisait une quarantaine de sept jours qui ne le concerne pas.
    - from_except: [jp, gb, au, nz, sg, se, is, no, ee, cz]
      en: "Dogs from rabies-infected countries are transported to a designated quarantine facility (e.g. near Taoyuan or Kaohsiung) for a minimum 7-day quarantine; the owner pays transport and quarantine costs."
      fr: "Les chiens venant de pays infectés sont transportés vers un centre de quarantaine désigné (près de Taoyuan ou Kaohsiung) pour une quarantaine minimale de 7 jours ; le propriétaire paie le transport et la quarantaine."
      es: "Los perros procedentes de países infectados por la rabia son transportados a un centro de cuarentena designado (p. ej. cerca de Taoyuan o Kaohsiung) para una cuarentena mínima de 7 días; el propietario paga el transporte y los costes de cuarentena."
      pt: "Cachorros vindos de países infectados por raiva são transportados para uma instalação de quarentena designada (por exemplo, perto de Taoyuan ou Kaohsiung) para uma quarentena mínima de 7 dias; o dono paga os custos de transporte e quarentena."
    - en: "A computer processing fee (NTD 100) and other fees are payable in cash in New Taiwan Dollars on arrival."
      fr: "Des frais de traitement informatique (100 NTD) et d'autres frais sont payables en espèces en dollars taïwanais à l'arrivée."
      es: "A la llegada se abonan en efectivo, en nuevos dólares taiwaneses, una tasa de tramitación informática (100 NTD) y otras tasas."
      pt: "Uma taxa de processamento informatizado (NTD 100) e outras taxas são pagas em dinheiro, em dólares novos de Taiwan, na chegada."
    - en: "A dog arriving without an import permit, or without the original export veterinary certificate, is re-exported or destroyed at the owner's expense."
      fr: "Un chien arrivant sans permis d'importation, ou sans le certificat vétérinaire d'exportation original, est réexpédié ou euthanasié aux frais du propriétaire."
      es: "Un perro que llega sin permiso de importación, o sin el certificado veterinario de exportación original, es reexportado o sacrificado a cargo del propietario."
      pt: "Um cachorro que chega sem autorização de importação, ou sem o certificado veterinário de exportação original, é reexportado ou destruído às custas do dono."
    - en: "Prohibited breeds (American Pit Bull Terrier, American Pit Bull, American Staffordshire Terrier) are refused import."
      fr: "Les races interdites (American Pit Bull Terrier, American Pit Bull, American Staffordshire Terrier) sont refusées à l'importation."
      es: "Las razas prohibidas (American Pit Bull Terrier, American Pit Bull, American Staffordshire Terrier) tienen la importación denegada."
      pt: "Raças proibidas (American Pit Bull Terrier, American Pit Bull, American Staffordshire Terrier) têm a importação recusada."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Taiwan does not operate a graded dangerous-dog category system like some European countries; instead the Ministry of Agriculture bans specific pit-bull-type breeds from import and breeding."
    fr: "Taïwan n'applique pas un système de catégories de chiens dangereux comme certains pays européens ; le ministère de l'Agriculture interdit plutôt certaines races de type pit-bull à l'importation et à l'élevage."
    es: "Taiwán no aplica un sistema graduado de categorías de perros peligrosos como algunos países europeos; en su lugar, el Ministerio de Agricultura prohíbe la importación y la cría de determinadas razas de tipo pit-bull."
    pt: "Taiwan não opera um sistema de categorias graduadas de cães perigosos como alguns países europeus; em vez disso, o Ministério da Agricultura proíbe a importação e a criação de raças específicas do tipo pit bull."
  cat1:
    en: "Prohibited breeds: the American Pit Bull Terrier, American Pit Bull and American Staffordshire Terrier cannot be imported into or bred in Taiwan. The ban has applied since 1 March 2022 under a Ministry of Agriculture announcement (formerly Council of Agriculture)."
    fr: "Races interdites : l'American Pit Bull Terrier, l'American Pit Bull et l'American Staffordshire Terrier ne peuvent être importés ni élevés à Taïwan. L'interdiction s'applique depuis le 1er mars 2022 selon un avis du ministère de l'Agriculture (ex-Council of Agriculture)."
    es: "Razas prohibidas: el American Pit Bull Terrier, el American Pit Bull y el American Staffordshire Terrier no pueden importarse ni criarse en Taiwán. La prohibición se aplica desde el 1 de marzo de 2022 según un anuncio del Ministerio de Agricultura (antes Council of Agriculture)."
    pt: "Raças proibidas: o American Pit Bull Terrier, o American Pit Bull e o American Staffordshire Terrier não podem ser importados para Taiwan nem criados no país. A proibição está em vigor desde 1º de março de 2022, segundo um comunicado do Ministério da Agricultura (antigo Conselho de Agricultura)."
  cat2:
    en: "No other dog breeds are banned from import for entry-quarantine purposes. Ownership of a controlled dog within Taiwan may carry separate local muzzle-and-leash rules, which are outside the import scheme."
    fr: "Aucune autre race de chien n'est interdite à l'importation au titre de la quarantaine d'entrée. La détention d'un chien réglementé à Taïwan peut relever de règles locales distinctes (muselière et laisse), hors du régime d'importation."
    es: "Ninguna otra raza de perro está prohibida para la importación a efectos de la cuarentena de entrada. La tenencia de un perro regulado dentro de Taiwán puede estar sujeta a normas locales aparte (bozal y correa), ajenas al régimen de importación."
    pt: "Nenhuma outra raça de cachorro é proibida para importação para fins de quarentena de entrada. A posse de um cachorro controlado dentro de Taiwan pode envolver normas locais separadas de focinheira e coleira, que ficam fora do regime de importação."
  note:
    en: "Bengal (leopard) cats have separate hybrid-generation rules, but these do not affect dogs. Confirm your dog's breed status with the APHIA branch office at your intended port of entry before booking."
    fr: "Les chats Bengal (léopard) relèvent de règles distinctes selon la génération d'hybridation, sans effet sur les chiens. Confirme le statut de la race de ton chien auprès de l'antenne APHIA de ton point d'entrée avant de réserver."
    es: "Los gatos Bengala (leopardo) están sujetos a normas aparte según la generación de hibridación, pero estas no afectan a los perros. Confirma el estado de raza de tu perro con la oficina regional de la APHIA de tu punto de entrada previsto antes de reservar."
    pt: "Gatos Bengal (leopardo) têm normas separadas sobre geração híbrida, mas elas não afetam cachorros. Confirme a situação da raça do seu cachorro com a filial da APHIA no ponto de entrada pretendido antes de reservar."

checklist:
  - en: "Microchip (ISO) implanted and readable before vaccination and testing"
    fr: "Puce (ISO) posée et lisible avant vaccination et titrage"
    es: "Microchip (ISO) implantado y legible antes de la vacunación y la prueba"
    pt: "Microchip (ISO) implantado e legível antes da vacinação e dos exames"
  - en: "Inactivated rabies vaccination (dog ≥90 days old, 30 days to 1 year before entry)"
    fr: "Vaccination antirabique inactivée (chien ≥90 jours, 30 jours à 1 an avant l'entrée)"
    es: "Vacunación antirrábica inactivada (perro ≥90 días, de 30 días a 1 año antes de la entrada)"
    pt: "Vacinação antirrábica inativada (cachorro com ≥90 dias de idade, de 30 dias a 1 ano antes da entrada)"
  - en: "Rabies antibody test ≥0.5 IU/ml at a WOAH/APHIA lab — rabies-infected countries only"
    fr: "Titrage antirabique ≥0,5 UI/ml dans un labo OMSA/APHIA — pays infectés uniquement"
    es: "Prueba de titulación de rabia ≥0,5 UI/ml en un laboratorio WOAH/APHIA — solo países infectados por la rabia"
    pt: "Teste sorológico antirrábico ≥0,5 UI/ml em laboratório WOAH/APHIA — apenas para países infectados por raiva"
  - en: "Import permit applied for online (≥20 days ahead; ≥120 days for a quarantine waiver)"
    fr: "Permis d'importation demandé en ligne (≥20 jours avant ; ≥120 jours pour une dispense)"
    es: "Permiso de importación solicitado en línea (≥20 días antes; ≥120 días para una exención de cuarentena)"
    pt: "Autorização de importação solicitada on-line (≥20 dias de antecedência; ≥120 dias para isenção de quarentena)"
  - en: "Original export veterinary certificate (APHIA Form 001 or 002)"
    fr: "Certificat vétérinaire d'exportation original (formulaire APHIA 001 ou 002)"
    es: "Certificado veterinario de exportación original (formulario APHIA 001 o 002)"
    pt: "Certificado veterinário de exportação original (Formulário APHIA 001 ou 002)"
  - en: "Quarantine space confirmed through the permit (rabies-infected origins)"
    fr: "Place de quarantaine confirmée via le permis (origines infectées)"
    es: "Plaza de cuarentena confirmada a través del permiso (orígenes infectados por la rabia)"
    pt: "Vaga de quarentena confirmada pela autorização (origens infectadas por raiva)"
  - en: "Airline reservation confirming your dog's travel option and IATA crate"
    fr: "Réservation confirmant l'option de transport et caisse IATA de ton chien"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y la jaula IATA"
    pt: "Reserva na companhia aérea confirmando a opção de viagem do cachorro e caixa de transporte IATA"
  - en: "Confirm your dog is not a prohibited pit-bull-type breed"
    fr: "Vérifie que ton chien n'est pas d'une race de type pit-bull interdite"
    es: "Confirma que tu perro no es de una raza de tipo pit-bull prohibida"
    pt: "Confirme que o seu cachorro não é de uma raça proibida do tipo pit bull"

