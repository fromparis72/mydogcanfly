notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro."
    pt: "Só um médico-veterinário pode confirmar o procedimento exato para o seu cachorro."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
  - en: "Border crossing points and procedures may be temporarily adjusted; confirm the current list of entry points and requirements with the State Service and Ukrainian Customs before travelling."
    fr: "Les points de passage frontaliers et les procédures peuvent être temporairement ajustés ; confirme la liste actuelle des points d'entrée et les exigences auprès du Service d'État et de la Douane ukrainienne avant de voyager."
    es: "Los pasos fronterizos y los procedimientos pueden ajustarse temporalmente; confirma la lista actual de puntos de entrada y los requisitos con el Servicio Estatal y la Aduana ucraniana antes de viajar."
    pt: "Os pontos de passagem de fronteira e os procedimentos podem ser ajustados temporariamente; confirme a lista atual de pontos de entrada e as exigências com o State Service e a alfândega ucraniana antes de viajar."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Ukraine (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — l'Ukraine (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Ucrania (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — a Ucrânia (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — Ukraine", fr: "Pays de destination — Ukraine", es: "País de destino — Ucrania", pt: "País de destino — Ucrânia" }
      text:
        en: "Ukraine applies its own national rules: an ISO microchip, a valid rabies vaccination, a rabies antibody titration and an international veterinary certificate are the backbone of entry."
        fr: "L'Ukraine applique ses propres règles nationales : puce ISO, vaccination antirabique valide, titrage antirabique et certificat vétérinaire international constituent le socle de l'entrée."
        es: "Ucrania aplica sus propias normas nacionales: un microchip ISO, una vacunación antirrábica válida, una prueba de titulación de rabia y un certificado veterinario internacional son la columna vertebral de la entrada."
        pt: "A Ucrânia aplica as próprias regras nacionais: microchip ISO, vacinação antirrábica válida, teste sorológico antirrábico (titulação) e certificado veterinário internacional são a espinha dorsal da entrada."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The departure country decides which official model certificate is issued and how the paperwork is endorsed before travel; it can also affect the vaccination and titration timeline."
        fr: "Le pays de départ détermine le modèle de certificat officiel délivré et la façon dont les documents sont visés avant le voyage ; il influence aussi le calendrier vaccination-titrage."
        es: "El país de salida decide qué modelo de certificado oficial se expide y cómo se refrenda la documentación antes del viaje; también puede afectar al calendario de la vacunación y la titulación."
        pt: "O país de partida define qual modelo oficial de certificado é emitido e como a documentação é endossada antes da viagem; ele também pode afetar o calendário da vacinação e da titulação."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay in a rabies-risk country weighs on the titration requirement and the pre-entry waiting period. It is your dog's real origin and history that count — not only the last airport."
        fr: "Un séjour récent dans un pays à risque rabique pèse sur l'exigence de titrage et le délai avant l'entrée. C'est l'origine réelle et l'historique du chien qui comptent — pas seulement l'aéroport de destination finale."
        es: "Una estancia reciente en un país con riesgo de rabia influye en el requisito de titulación y en el periodo de espera antes de la entrada. Lo que cuenta es el origen y el historial reales de tu perro — no solo el último aeropuerto."
        pt: "Uma estadia recente em um país de risco de raiva pesa na exigência de titulação e no período de espera antes da entrada. O que conta é a origem e o histórico reais do seu cachorro — não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Ukraine's framework, then confirm your dog's exact origin and history with your vet and the State Service."
    fr: "Lis donc les exigences ci-dessous comme le cadre ukrainien, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire et le Service d'État."
    es: "Así que lee los requisitos siguientes como el marco de Ucrania y luego confirma el origen y el historial exactos de tu perro con tu veterinario y el Servicio Estatal."
    pt: "Então leia as exigências abaixo como o quadro geral da Ucrânia e depois confirme a origem exata e o histórico do seu cachorro com o seu veterinário e o State Service."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Must be implanted before the rabies vaccination; ISO 11784/11785 compliant.", fr: "Doit être posée avant la vaccination antirabique ; conforme ISO 11784/11785.", es: "Debe implantarse antes de la vacunación antirrábica; conforme con ISO 11784/11785.", pt: "Precisa ser implantado antes da vacinação antirrábica; em conformidade com a ISO 11784/11785." }
    exceptions: { en: "A legible tattoo is accepted only if applied before 3 July 2011.", fr: "Un tatouage lisible n'est accepté que s'il est antérieur au 3 juillet 2011.", es: "Un tatuaje legible solo se acepta si se hizo antes del 3 de julio de 2011.", pt: "Uma tatuagem legível só é aceita se tiver sido feita antes de 3 de julho de 2011." }
    ref: { en: "Derzhprodspozhyvsluzhba (dpss.gov.ua)", fr: "Derjprodspojivsloujba (dpss.gov.ua)", es: "Derzhprodspozhyvsluzhba (dpss.gov.ua)", pt: "Derzhprodspozhyvsluzhba (dpss.gov.ua)" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Dog at least 12 weeks old; microchip must already be in place; if only a primary vaccination, wait at least 21 days before travel.", fr: "Chien d'au moins 12 semaines ; la puce doit déjà être posée ; en cas de primo-vaccination seule, attendre au moins 21 jours avant le voyage.", es: "Perro de al menos 12 semanas; el microchip debe estar ya implantado; si solo hay una primovacunación, espera al menos 21 días antes del viaje.", pt: "Cachorro com pelo menos 12 semanas de idade; o microchip já deve estar implantado; se for apenas uma primovacinação, espere no mínimo 21 dias antes da viagem." }
    exceptions: { en: "Dogs under 12 weeks must not be vaccinated and cannot meet the entry conditions.", fr: "Un chien de moins de 12 semaines ne peut être vacciné et ne peut remplir les conditions d'entrée.", es: "Los perros de menos de 12 semanas no deben vacunarse y no pueden cumplir las condiciones de entrada.", pt: "Cachorros com menos de 12 semanas não devem ser vacinados e não conseguem cumprir as condições de entrada." }
    ref: { en: "dpss.gov.ua; USDA APHIS (US→Ukraine)", fr: "dpss.gov.ua ; USDA APHIS (USA→Ukraine)", es: "dpss.gov.ua; USDA APHIS (EE. UU.→Ucrania)", pt: "dpss.gov.ua; USDA APHIS (EUA→Ucrânia)" }
  - item: { en: "Rabies antibody test (titration)", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Required", fr: "Requis", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Blood sampled ≥30 days after vaccination and more than 3 months before entry; result ≥0.5 IU/ml at an EU-approved laboratory; stays valid while vaccination is kept current.", fr: "Sang prélevé ≥30 jours après le vaccin et plus de 3 mois avant l'entrée ; résultat ≥0,5 UI/ml dans un laboratoire agréé UE ; reste valable tant que la vaccination est maintenue à jour.", es: "Sangre extraída ≥30 días después de la vacuna y más de 3 meses antes de la entrada; resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE; sigue siendo válida mientras se mantenga al día la vacunación.", pt: "Sangue coletado ≥30 dias depois da vacinação e mais de 3 meses antes da entrada; resultado ≥0,5 UI/ml em laboratório aprovado pela UE; continua válido enquanto a vacinação for mantida em dia." }
    exceptions: { en: "Whether Ukraine exempts specific rabies-free origins from the titration is not clearly published (Unknown) — confirm with the State Service.", fr: "L'exemption de titrage pour certaines origines indemnes de rage n'est pas clairement publiée (non communiqué) — à confirmer auprès du Service d'État.", es: "No está claramente publicado si Ucrania exime de la titulación a determinados orígenes libres de rabia (no comunicado) — confírmalo con el Servicio Estatal.", pt: "Não está claramente publicado se a Ucrânia dispensa da titulação certas origens livres de raiva (Desconhecido) — confirme com o State Service." }
    ref: { en: "dpss.gov.ua; USDA APHIS (US→Ukraine)", fr: "dpss.gov.ua ; USDA APHIS (USA→Ukraine)", es: "dpss.gov.ua; USDA APHIS (EE. UU.→Ucrania)", pt: "dpss.gov.ua; USDA APHIS (EUA→Ucrânia)" }
  - item: { en: "International veterinary certificate", fr: "Certificat vétérinaire international", es: "Certificado veterinario internacional", pt: "Certificado veterinário internacional" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Issued/endorsed by an official (state) veterinarian of the exporting country before departure; records the microchip, vaccination and titration.", fr: "Établi/visé par un vétérinaire officiel (d'État) du pays d'export avant le départ ; consigne la puce, la vaccination et le titrage.", es: "Expedido/refrendado por un veterinario oficial (estatal) del país exportador antes de la salida; registra el microchip, la vacunación y la titulación.", pt: "Emitido/endossado por um veterinário oficial (do Estado) do país exportador antes da partida; registra o microchip, a vacinação e a titulação." }
    exceptions: { en: "There is no EU pet-passport shortcut when entering Ukraine.", fr: "Aucun raccourci par passeport européen pour entrer en Ukraine.", es: "No hay ningún atajo por pasaporte europeo para entrar en Ucrania.", pt: "Não existe atalho pelo passaporte europeu para animais de estimação na entrada na Ucrânia." }
    ref: { en: "dpss.gov.ua", fr: "dpss.gov.ua", es: "dpss.gov.ua", pt: "dpss.gov.ua" }
  - item: { en: "Tapeworm (Echinococcus) treatment", fr: "Traitement échinococcose", es: "Tratamiento contra la tenia (Echinococcus)", pt: "Tratamento contra a tênia (Echinococcus)" }
    required: { en: "Not specified", fr: "Non précisé", es: "No especificado", pt: "Não especificada" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "No tapeworm treatment is set out as a Ukrainian entry condition in the official sources reviewed (Unknown).", fr: "Aucun traitement contre l'échinococcose n'est prévu comme condition d'entrée ukrainienne dans les sources officielles consultées (non communiqué).", es: "No se establece ningún tratamiento contra la tenia como condición de entrada en Ucrania en las fuentes oficiales consultadas (no comunicado).", pt: "Nenhum tratamento contra tênia aparece como condição de entrada na Ucrânia nas fontes oficiais consultadas (Desconhecido)." }
    ref: { en: "dpss.gov.ua", fr: "dpss.gov.ua", es: "dpss.gov.ua", pt: "dpss.gov.ua" }
  - item: { en: "Advance notification / import permit", fr: "Notification préalable / permis d'import", es: "Notificación previa / permiso de importación", pt: "Notificação prévia / autorização de importação" }
    required: { en: "Not required (non-commercial)", fr: "Non requis (non commercial)", es: "No obligatorio (no comercial)", pt: "Não obrigatório (não comercial)" }
    when: { en: "A movement without sale or transfer of ownership, up to 5 animals, is treated as non-commercial and needs no import permit.", fr: "Un mouvement sans vente ni transfert de propriété, jusqu'à 5 animaux, est traité comme non commercial et ne nécessite aucun permis d'import.", es: "Un movimiento sin venta ni transferencia de propiedad, de hasta 5 animales, se trata como no comercial y no necesita permiso de importación.", pt: "Um deslocamento sem venda nem transferência de propriedade, com até 5 animais, é tratado como não comercial e não exige licença de importação." }
    exceptions: { en: "Commercial imports or larger numbers follow separate veterinary import procedures.", fr: "Les importations commerciales ou en plus grand nombre suivent des procédures d'importation vétérinaires distinctes.", es: "Las importaciones comerciales o en mayor número siguen procedimientos de importación veterinarios distintos.", pt: "Importações comerciais ou quantidades maiores seguem procedimentos veterinários de importação separados." }
    ref: { en: "dpss.gov.ua; customs.gov.ua", fr: "dpss.gov.ua ; customs.gov.ua", es: "dpss.gov.ua; customs.gov.ua", pt: "dpss.gov.ua; customs.gov.ua" }
  - item: { en: "Customs declaration", fr: "Déclaration douanière", es: "Declaración aduanera", pt: "Declaração aduaneira" }
    required: { en: "At the border", fr: "À la frontière", es: "En la frontera", pt: "Na fronteira" }
    when: { en: "Up to 3 mammals accompanying a traveller may be brought as personal belongings without customs duties; present the animal and documents to customs.", fr: "Jusqu'à 3 mammifères accompagnant un voyageur peuvent être introduits comme effets personnels sans droits de douane ; présente l'animal et les documents à la douane.", es: "Hasta 3 mamíferos que acompañen a un viajero pueden introducirse como efectos personales sin derechos de aduana; presenta el animal y los documentos en la aduana.", pt: "Até 3 mamíferos acompanhando um viajante podem ser trazidos como bens pessoais, sem impostos aduaneiros; apresente o animal e os documentos à alfândega." }
    exceptions: { en: "Above the duty-free personal allowance, ordinary customs rules apply.", fr: "Au-delà de la franchise personnelle, les règles douanières ordinaires s'appliquent.", es: "Por encima de la franquicia personal, se aplican las normas aduaneras ordinarias.", pt: "Acima da franquia pessoal isenta de impostos, valem as regras aduaneiras comuns." }
    ref: { en: "customs.gov.ua", fr: "customs.gov.ua", es: "customs.gov.ua", pt: "customs.gov.ua" }
  - item: { en: "Border veterinary check", fr: "Contrôle vétérinaire frontalier", es: "Control veterinario fronterizo", pt: "Controle veterinário de fronteira" }
    required: { en: "At entry", fr: "À l'entrée", es: "En la entrada", pt: "Na entrada" }
    when: { en: "Documentary and identity checks by the state border veterinary inspector at a designated entry point.", fr: "Contrôles documentaires et d'identité par l'inspecteur vétérinaire d'État frontalier à un point d'entrée désigné.", es: "Controles documentales y de identidad por el inspector veterinario estatal de frontera en un punto de entrada designado.", pt: "Conferência de documentos e de identidade pelo inspetor veterinário estatal de fronteira em um ponto de entrada designado." }
    exceptions: { en: "Missing or invalid documents can lead to refusal or return of the animal.", fr: "Des documents manquants ou invalides peuvent entraîner le refus ou le renvoi de l'animal.", es: "Documentos que falten o no sean válidos pueden provocar la denegación o la devolución del animal.", pt: "Documentos faltando ou inválidos podem levar à recusa ou à devolução do animal." }
    ref: { en: "dpss.gov.ua; customs.gov.ua", fr: "dpss.gov.ua ; customs.gov.ua", es: "dpss.gov.ua; customs.gov.ua", pt: "dpss.gov.ua; customs.gov.ua" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "Effectively older", fr: "En pratique plus âgé", es: "En la práctica mayor", pt: "Na prática, mais velhos" }
    when: { en: "The 12-week vaccination, then the titration and its multi-month wait, push the realistic entry age to roughly 7 months.", fr: "La vaccination à 12 semaines, puis le titrage et son délai de plusieurs mois, portent l'âge réaliste d'entrée à environ 7 mois.", es: "La vacunación a las 12 semanas, y luego la titulación y su espera de varios meses, elevan la edad realista de entrada a unos 7 meses.", pt: "A vacinação às 12 semanas, depois a titulação e a espera de vários meses que ela impõe, empurram a idade realista de entrada para cerca de 7 meses." }
    exceptions: { en: "Unvaccinated puppies under 12 weeks cannot meet the conditions.", fr: "Un chiot non vacciné de moins de 12 semaines ne peut remplir les conditions.", es: "Los cachorros sin vacunar menores de 12 semanas no pueden cumplir las condiciones.", pt: "Filhotes não vacinados com menos de 12 semanas não conseguem cumprir as condições." }
    ref: { en: "dpss.gov.ua; USDA APHIS (US→Ukraine)", fr: "dpss.gov.ua ; USDA APHIS (USA→Ukraine)", es: "dpss.gov.ua; USDA APHIS (EE. UU.→Ucrania)", pt: "dpss.gov.ua; USDA APHIS (EUA→Ucrânia)" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not required", fr: "Non requise", es: "No obligatoria", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
