    ref: { en: "dpss.gov.ua", fr: "dpss.gov.ua", es: "dpss.gov.ua", pt: "dpss.gov.ua" }

origin:
  scheme: eu
  eu:
    title: { en: "From the EU / a rabies-controlled country", fr: "Depuis l'UE / un pays à rage contrôlée", es: "Desde la UE / un país con rabia controlada", pt: "Da UE / de um país com raiva controlada" }
    body:
      en: "A dog from an EU or rabies-controlled country needs an ISO microchip, a valid rabies vaccination, an international veterinary certificate and, under Ukraine's rules, a rabies antibody titration (≥0.5 IU/ml, EU-approved lab). The EU pet passport alone is not a shortcut for entering Ukraine."
      fr: "Un chien venant de l'UE ou d'un pays à rage contrôlée a besoin d'une puce ISO, d'une vaccination antirabique valide, d'un certificat vétérinaire international et, selon les règles ukrainiennes, d'un titrage antirabique (≥0,5 UI/ml, labo agréé UE). Le passeport européen seul n'est pas un raccourci pour entrer en Ukraine."
      es: "Un perro procedente de la UE o de un país con rabia controlada necesita un microchip ISO, una vacunación antirrábica válida, un certificado veterinario internacional y, según las normas ucranianas, una prueba de titulación de rabia (≥0,5 UI/ml, laboratorio autorizado por la UE). El pasaporte europeo por sí solo no es un atajo para entrar en Ucrania."
      pt: "Um cachorro vindo da UE ou de um país com raiva controlada precisa de microchip ISO, vacinação antirrábica válida, certificado veterinário internacional e, pelas regras da Ucrânia, de um teste sorológico antirrábico (titulação ≥0,5 UI/ml, laboratório aprovado pela UE). O passaporte europeu para animais de estimação, sozinho, não é atalho para entrar na Ucrânia."
    cls: warn
  listed:
    title: { en: "From another rabies-controlled country", fr: "Depuis un autre pays à rage contrôlée", es: "Desde otro país con rabia controlada", pt: "De outro país com raiva controlada" }
    body:
      en: "The core is the same — microchip, valid rabies vaccination, international veterinary certificate endorsed by an official vet, and a rabies antibody titration. Plan the timeline around the blood test and its waiting period before entry."
      fr: "Le socle est identique — puce, vaccination antirabique valide, certificat vétérinaire international visé par un vétérinaire officiel, et titrage antirabique. Prévois le calendrier autour de la prise de sang et de son délai avant l'entrée."
      es: "El núcleo es el mismo — microchip, vacunación antirrábica válida, certificado veterinario internacional refrendado por un veterinario oficial, y una prueba de titulación de rabia. Planifica el calendario en torno al análisis de sangre y su periodo de espera antes de la entrada."
      pt: "O núcleo é o mesmo — microchip, vacinação antirrábica válida, certificado veterinário internacional endossado por um veterinário oficial e teste sorológico antirrábico (titulação). Planeje o calendário em torno da coleta de sangue e do período de espera antes da entrada."
    cls: warn
  nonListed:
    title: { en: "From a rabies-risk country", fr: "Depuis un pays à risque rabique", es: "Desde un país con riesgo de rabia", pt: "De um país de risco de raiva" }
    body:
      en: "From a rabies-risk country, follow the full path: microchip, rabies vaccination, blood drawn at least 30 days later, an antibody result ≥0.5 IU/ml at an EU-approved laboratory, then the pre-entry waiting period, plus the endorsed international veterinary certificate."
      fr: "Depuis un pays à risque rabique, suis le parcours complet : puce, vaccination antirabique, sang prélevé au moins 30 jours après, résultat de titrage ≥0,5 UI/ml dans un laboratoire agréé UE, puis le délai avant l'entrée, ainsi que le certificat vétérinaire international visé."
      es: "Desde un país con riesgo de rabia, sigue el recorrido completo: microchip, vacunación antirrábica, sangre extraída al menos 30 días después, un resultado de anticuerpos ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego el periodo de espera antes de la entrada, además del certificado veterinario internacional refrendado."
      pt: "Vindo de um país de risco de raiva, siga o caminho completo: microchip, vacinação antirrábica, sangue coletado no mínimo 30 dias depois, resultado sorológico ≥0,5 UI/ml em laboratório aprovado pela UE, depois o período de espera antes da entrada, além do certificado veterinário internacional endossado."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Ukraine depends on your entry point and documents."
    fr: "Ce qui se passe à l'arrivée de ton chien en Ukraine dépend de ton point d'entrée et de tes documents."
    es: "Lo que ocurre cuando tu perro llega a Ucrania depende de tu punto de entrada y de tus documentos."
    pt: "O que acontece quando seu cachorro chega à Ucrânia depende do seu ponto de entrada e dos documentos."
  points:
    - en: "Enter via a designated crossing point and present your dog to the state border veterinary inspector for documentary and identity checks."
      fr: "Entre par un point de passage désigné et présente ton chien à l'inspecteur vétérinaire d'État frontalier pour les contrôles documentaires et d'identité."
      es: "Entra por un punto de paso designado y presenta a tu perro al inspector veterinario estatal de frontera para los controles documentales y de identidad."
      pt: "Entre por um ponto de passagem designado e apresente seu cachorro ao inspetor veterinário estatal de fronteira para a conferência de documentos e de identidade."
    - en: "Up to 3 mammals travelling with their owner are handled as non-commercial personal belongings, without customs duties; still declare them to customs."
      fr: "Jusqu'à 3 mammifères voyageant avec leur propriétaire sont traités comme effets personnels non commerciaux, sans droits de douane ; déclare-les tout de même à la douane."
      es: "Hasta 3 mamíferos que viajan con su propietario se tratan como efectos personales no comerciales, sin derechos de aduana; aun así, decláralos en la aduana."
      pt: "Até 3 mamíferos que viajam com o dono são tratados como bens pessoais não comerciais, sem impostos aduaneiros; ainda assim, declare-os à alfândega."
    - en: "Carry the original international veterinary certificate and the laboratory report of the rabies antibody test — not copies."
      fr: "Munis-toi de l'original du certificat vétérinaire international et du rapport de laboratoire du titrage antirabique — pas de copies."
      es: "Lleva el original del certificado veterinario internacional y el informe de laboratorio de la prueba de titulación de rabia — no copias."
      pt: "Leve o certificado veterinário internacional original e o laudo de laboratório do teste sorológico antirrábico — não cópias."
    - en: "If documents are missing or invalid, the animal may be refused entry or returned at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, l'animal peut être refusé à l'entrée ou renvoyé aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, el animal puede ser rechazado a la entrada o devuelto a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, o animal pode ter a entrada recusada ou ser devolvido às custas do dono."
    - en: "Border crossing points and procedures may be temporarily adjusted; confirm the current entry points and requirements with the State Service and Ukrainian Customs before you travel."
      fr: "Les points de passage et les procédures peuvent être temporairement ajustés ; confirme les points d'entrée et exigences actuels auprès du Service d'État et de la Douane ukrainienne avant de voyager."
      es: "Los pasos fronterizos y los procedimientos pueden ajustarse temporalmente; confirma los puntos de entrada y los requisitos actuales con el Servicio Estatal y la Aduana ucraniana antes de viajar."
      pt: "Os pontos de passagem de fronteira e os procedimentos podem ser ajustados temporariamente; confirme os pontos de entrada e as exigências atuais com o State Service e a alfândega ucraniana antes de viajar."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Ukraine regulates dangerous dog breeds under Cabinet of Ministers Resolution No. 1164 of 10 November 2021 (\"Some issues regarding dangerous dog breeds\"). The rules govern keeping and walking such dogs inside Ukraine; the official sources reviewed do not set out an import ban on these breeds."
    fr: "L'Ukraine réglemente les races de chiens dangereuses par la résolution du Cabinet des ministres n° 1164 du 10 novembre 2021 (« Certaines questions relatives aux races de chiens dangereuses »). Les règles encadrent la détention et la promenade de ces chiens en Ukraine ; les sources officielles consultées ne prévoient pas d'interdiction d'importation de ces races."
    es: "Ucrania regula las razas de perros peligrosas mediante la Resolución del Consejo de Ministros n.º 1164, de 10 de noviembre de 2021 («Algunas cuestiones relativas a las razas de perros peligrosas»). Las normas rigen la tenencia y el paseo de estos perros dentro de Ucrania; las fuentes oficiales consultadas no establecen una prohibición de importación de estas razas."
    pt: "A Ucrânia regula as raças de cachorro perigosas pela Resolução do Gabinete de Ministros nº 1164, de 10 de novembro de 2021 (“Algumas questões relativas às raças de cachorro perigosas”). As regras tratam da posse e do passeio desses cachorros dentro da Ucrânia; as fontes oficiais consultadas não estabelecem proibição de importação dessas raças."
  cat1:
    en: "The resolution approves a list of dangerous dog breeds (more than 50 breeds, and crossbreeds of the listed breeds). Owners in Ukraine must hold compulsory third-party liability insurance, and such dogs may be walked in public only muzzled and on a lead."
    fr: "La résolution approuve une liste de races de chiens dangereuses (plus de 50 races, ainsi que les croisements des races listées). Les propriétaires en Ukraine doivent souscrire une assurance responsabilité civile obligatoire, et ces chiens ne peuvent être promenés en public que muselés et tenus en laisse."
    es: "La resolución aprueba una lista de razas de perros peligrosas (más de 50 razas, así como los cruces de las razas listadas). Los propietarios en Ucrania deben contratar un seguro de responsabilidad civil obligatorio, y estos perros solo pueden pasearse en público con bozal y con correa."
    pt: "A resolução aprova uma lista de raças de cachorro perigosas (mais de 50 raças, além dos cruzamentos das raças listadas). Os donos na Ucrânia precisam ter seguro obrigatório de responsabilidade civil contra terceiros, e esses cachorros só podem passear em local público com focinheira e guia."
  cat2:
    en: "Ukraine does not operate a second breed category and, in the official sources reviewed, does not prohibit these breeds from entering the country. Entry follows the standard veterinary requirements, while the ownership conditions above apply once in Ukraine."
    fr: "L'Ukraine n'applique pas de seconde catégorie de races et, dans les sources officielles consultées, n'interdit pas l'entrée de ces races. L'entrée suit les exigences vétérinaires standard, tandis que les conditions de détention ci-dessus s'appliquent une fois en Ukraine."
    es: "Ucrania no aplica una segunda categoría de razas y, en las fuentes oficiales consultadas, no prohíbe la entrada de estas razas en el país. La entrada sigue los requisitos veterinarios estándar, mientras que las condiciones de tenencia anteriores se aplican una vez en Ucrania."
    pt: "A Ucrânia não tem uma segunda categoria de raças e, nas fontes oficiais consultadas, não proíbe a entrada dessas raças no país. A entrada segue as exigências veterinárias padrão, enquanto as condições de posse acima passam a valer assim que você estiver na Ucrânia."
  note:
    en: "For the exact list and the current insurance and walking obligations, consult Resolution No. 1164 and the State Service before you travel."
    fr: "Pour la liste exacte et les obligations actuelles d'assurance et de promenade, consulte la résolution n° 1164 et le Service d'État avant de voyager."
    es: "Para la lista exacta y las obligaciones actuales de seguro y de paseo, consulta la Resolución n.º 1164 y el Servicio Estatal antes de viajar."
    pt: "Para a lista exata e as obrigações atuais de seguro e de passeio, consulte a Resolução nº 1164 e o State Service antes de viajar."

