# Country Entry Guide — Ukraine (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_ua
iso2: "UA"
name: { en: "Ukraine", fr: "Ukraine", es: "Ucrania", pt: "Ucrânia" }
region: { en: "Europe (non-EU)", fr: "Europe (hors UE)", es: "Europa (fuera de la UE)", pt: "Europa (fora da UE)" }


regime: non_listed
exit:
  authority: Derzhprodspozhyvsluzhba
  authorityUrl: https://dpss.gov.ua/en
  intro:
    en: "Ukraine is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the State Service for Food Safety and Consumer Protection."
    fr: "L'Ukraine est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par le Service d'État pour la sécurité alimentaire et la protection des consommateurs."
    es: "Ucrania no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el Servicio Estatal de Seguridad Alimentaria y Protección al Consumidor."
    pt: "A Ucrânia é um país não listado: um teste sorológico antirrábico válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pelo State Service for Food Safety and Consumer Protection."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "The State Service's border-control department issues the international veterinary certificate for pets at border inspection posts and airports before departure."
        fr: "Le département de contrôle aux frontières du Service d'État délivre le certificat vétérinaire international pour les animaux aux postes d'inspection frontaliers et aéroports avant le départ."
        es: "El departamento de control fronterizo del Servicio Estatal emite el certificado veterinario internacional para mascotas en los puestos de inspección fronteriza y aeropuertos antes de salir."
        pt: "O departamento de controle de fronteira do State Service emite o certificado veterinário internacional para animais de estimação nos postos de inspeção de fronteira e nos aeroportos antes da partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Ukraine with your dog", fr: "Voyager en Ukraine avec ton chien", es: "Viajar a Ucrania con tu perro", pt: "Viajar para a Ucrânia com seu cachorro" }
  intro:
    en: >-
      Ukraine is not an EU member and applies its own national veterinary rules to a dog entering the
      country. Whatever the country of departure, the core is the same: an ISO microchip, a valid rabies
      vaccination and an international veterinary certificate issued by an official vet before travel. In
      addition, Ukraine's rules call for a rabies antibody (titration) test analysed by an EU-approved
      laboratory, which introduces a waiting period before entry. Customs treats a small number of pets
      travelling with their owner as a non-commercial movement, with no import permit. This guide explains
      what to prepare — but because the fine detail depends on your dog's origin and history, always
      confirm the exact procedure with the State Service (Derzhprodspozhyvsluzhba) and your vet before you
      book.
    fr: >-
      L'Ukraine n'est pas membre de l'UE et applique ses propres règles vétérinaires nationales à un chien
      qui entre dans le pays. Quel que soit le pays de départ, le socle est le même : une puce ISO, une
      vaccination antirabique valide et un certificat vétérinaire international établi par un vétérinaire
      officiel avant le voyage. En plus, les règles ukrainiennes prévoient un titrage des anticorps
      antirabiques analysé par un laboratoire agréé par l'UE, ce qui impose un délai d'attente avant
      l'entrée. La douane traite un petit nombre d'animaux voyageant avec leur propriétaire comme un
      mouvement non commercial, sans permis d'importation. Ce guide explique quoi préparer — mais comme le
      détail dépend de l'origine et de l'historique de ton chien, confirme toujours la procédure exacte
      auprès du Service d'État (Derzhprodspozhyvsluzhba) et de ton vétérinaire avant de réserver.
    es: >-
      Ucrania no es miembro de la UE y aplica sus propias normas veterinarias nacionales a un perro que
      entra en el país. Sea cual sea el país de salida, el núcleo es el mismo: un microchip ISO, una
      vacunación antirrábica válida y un certificado veterinario internacional expedido por un veterinario
      oficial antes del viaje. Además, las normas ucranianas exigen una prueba de titulación de anticuerpos
      contra la rabia analizada por un laboratorio autorizado por la UE, lo que introduce un periodo de
      espera antes de la entrada. La aduana trata a un pequeño número de mascotas que viajan con su
      propietario como un movimiento no comercial, sin permiso de importación. Esta guía explica qué
      preparar — pero como el detalle depende del origen y del historial de tu perro, confirma siempre el
      procedimiento exacto con el Servicio Estatal (Derzhprodspozhyvsluzhba) y tu veterinario antes de
      reservar.

    pt: "A Ucrânia não é membro da UE e aplica as próprias regras veterinárias nacionais a um cachorro que entra no país. Seja qual for o país de partida, o núcleo é o mesmo: microchip ISO, vacinação antirrábica válida e certificado veterinário internacional emitido por um veterinário oficial antes da viagem. Além disso, as regras ucranianas exigem um teste sorológico antirrábico (titulação) analisado por um laboratório aprovado pela UE, o que impõe um período de espera antes da entrada. A alfândega trata um número pequeno de animais de estimação que viajam com o dono como circulação não comercial, sem licença de importação. Este guia explica o que preparar — mas, como os detalhes dependem da origem e do histórico do seu cachorro, confirme sempre o procedimento exato com o State Service (Derzhprodspozhyvsluzhba) e com o seu veterinário antes de reservar."
difficulty:
  level: moderate
  label: { en: "Moderate — antibody test usually required", fr: "Modéré — titrage généralement exigé", es: "Moderado — prueba de titulación generalmente exigida", pt: "Moderada — teste sorológico geralmente obrigatório" }

prepTime:
  eu:
    en: "From an EU / rabies-controlled origin: a few days if a valid antibody titer already exists, otherwise plan ~3–4 months for the titration and its waiting period."
    fr: "Depuis une origine UE / à rage contrôlée : quelques jours si un titrage valide existe déjà, sinon prévoir ~3–4 mois pour le titrage et son délai."
    es: "Desde un origen de la UE / con rabia controlada: unos días si ya existe una titulación de anticuerpos válida, de lo contrario prevé ~3–4 meses para la prueba de titulación y su periodo de espera."
    pt: "De origem UE / país com raiva controlada: alguns dias se já existir um teste sorológico válido; caso contrário, conte com cerca de 3–4 meses para a titulação e o período de espera."
  listed:
    en: "From another rabies-controlled country: about 3–4 months if a rabies antibody test still has to be carried out before entry."
    fr: "Depuis un autre pays à rage contrôlée : environ 3–4 mois s'il faut encore réaliser le titrage antirabique avant l'entrée."
    es: "Desde otro país con rabia controlada: unos 3–4 meses si aún hay que realizar la prueba de titulación de rabia antes de la entrada."
    pt: "De outro país com raiva controlada: cerca de 3–4 meses se ainda for preciso fazer o teste sorológico antirrábico antes da entrada."
  nonListed:
    en: "From a rabies-risk country: ~4+ months — vaccinate, wait ~30 days, run the titration in an EU-approved lab, then observe the pre-entry waiting period."
    fr: "Depuis un pays à risque rabique : ~4 mois et plus — vacciner, attendre ~30 jours, réaliser le titrage en labo agréé UE, puis respecter le délai avant l'entrée."
    es: "Desde un país con riesgo de rabia: ~4 meses o más — vacunar, esperar ~30 días, realizar la prueba de titulación en un laboratorio autorizado por la UE, y luego respetar el periodo de espera antes de la entrada."
    pt: "De um país de risco de raiva: ~4+ meses — vacinar, esperar ~30 dias, fazer a titulação em laboratório aprovado pela UE e depois cumprir o período de espera antes da entrada."

