# Country Entry Guide — New Zealand (source of truth, bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_nz
iso2: "NZ"
name: { en: "New Zealand", fr: "Nouvelle-Zélande", es: "Nueva Zelanda", pt: "Nova Zelândia" }
region: { en: "Oceania", fr: "Océanie", es: "Oceanía", pt: "Oceania" }


regime: island_strict
domestic:
  intro:
    en: "Domestic flight in New Zealand: nothing is required to fly, including between the North and South Islands."
    fr: "Vol intérieur en Nouvelle-Zélande : rien n'est exigé pour voler, y compris entre l'île du Nord et l'île du Sud."
    es: "Vuelo nacional en Nueva Zelanda: no se exige nada para volar, tampoco entre la Isla Norte y la Isla Sur."
    pt: "Voo doméstico na Nova Zelândia: nada é exigido para voar, inclusive entre a Ilha Norte e a Ilha Sul."
  points:
    - en: "New Zealand has never had a case of rabies, so no rabies vaccination applies. Microchipping is legally required for dog registration, but it is not a boarding condition, and no health certificate or permit exists for internal movement."
      fr: "La Nouvelle-Zélande n'a jamais connu de cas de rage, aucune vaccination antirabique ne s'applique donc. La puce est légalement requise pour l'enregistrement du chien, mais ce n'est pas une condition d'embarquement, et aucun certificat ni permis n'existe pour un mouvement interne."
      es: "Nueva Zelanda nunca ha tenido un caso de rabia, así que no aplica vacuna antirrábica. El microchip es legalmente obligatorio para registrar al perro, pero no es condición de embarque, y no existe certificado ni permiso para el movimiento interno."
      pt: "A Nova Zelândia nunca teve um caso de raiva, então não há vacinação antirrábica a cumprir. O microchip é exigido por lei para o registro do cachorro, mas não é condição de embarque, e não existe atestado de saúde nem autorização para o deslocamento interno."
    - en: "The real restriction is at destination: dogs are banned from conservation land and national parks without written approval, and a dog found there may be seized. Some areas require a permit obtained days in advance."
      fr: "La vraie restriction est à destination : les chiens sont interdits sur les terres de conservation et dans les parcs nationaux sans autorisation écrite, et un chien qui s'y trouve peut être saisi. Certaines zones exigent un permis obtenu plusieurs jours à l'avance."
      es: "La verdadera restricción está en destino: los perros están prohibidos en tierras de conservación y parques nacionales sin autorización escrita, y un perro allí puede ser incautado. Algunas zonas exigen un permiso obtenido días antes."
      pt: "A verdadeira restrição está no destino: os cachorros são proibidos em terras de conservação e em parques nacionais sem autorização por escrito, e um cachorro encontrado ali pode ser apreendido. Algumas áreas exigem uma autorização obtida com dias de antecedência."
    - en: "One national carrier takes pets in the hold with no vaccination or vet document requested at all, while another refuses animals entirely."
      fr: "Une compagnie nationale accepte les animaux en soute sans exiger la moindre vaccination ni document vétérinaire, tandis qu'une autre les refuse totalement."
      es: "Una aerolínea nacional acepta mascotas en bodega sin exigir vacuna ni documento veterinario alguno, mientras que otra los rechaza por completo."
      pt: "Uma companhia aérea nacional aceita animais de estimação no porão sem exigir nenhuma vacinação nem documento veterinário, enquanto outra recusa animais por completo."
exit:
  authority: MPI (Nouvelle-Zélande)
  authorityUrl: https://www.mpi.govt.nz/take-or-send-from-nz/pets-leaving-nz/information-for-vets
  intro:
    en: "Leaving New Zealand with your dog needs an export certificate from an MPI Official Veterinarian (plus an Animal Welfare Export Certificate for flights over 6 hours)."
    fr: "Sortir de Nouvelle-Zélande avec ton chien demande un certificat d'export d'un vétérinaire officiel du MPI (plus un Animal Welfare Export Certificate pour les vols de plus de 6 heures)."
    es: "Salir de Nueva Zelanda con tu perro requiere un certificado de exportación de un veterinario oficial del MPI (más un Animal Welfare Export Certificate para vuelos de más de 6 horas)."
    pt: "Sair da Nova Zelândia com seu cachorro exige um certificado de exportação emitido por um MPI Official Veterinarian (veterinário oficial do MPI), mais um Animal Welfare Export Certificate para voos de mais de 6 horas."
  steps:
    - timing: window
      scope: any
      text:
        en: "Only certain MPI-authorised vets can sign the export certificate; requirements follow the destination's OMAR."
        fr: "Seuls certains vétérinaires agréés MPI peuvent signer le certificat d'export ; les exigences suivent l'OMAR de la destination."
        es: "Solo ciertos veterinarios autorizados por MPI pueden firmar el certificado de exportación; los requisitos siguen el OMAR del destino."
        pt: "Só alguns veterinários autorizados pelo MPI podem assinar o certificado de exportação; as exigências seguem o OMAR do destino."
  onSiteNote:
    en: "Plan with an MPI-authorised vet during your stay; long-haul flights add an animal-welfare certificate."
    fr: "Prévois avec un vétérinaire agréé MPI pendant ton séjour ; les vols long-courriers ajoutent un certificat de bien-être animal."
    es: "Planifica con un veterinario autorizado por MPI durante tu estancia; los vuelos de larga distancia añaden un certificado de bienestar animal."
    pt: "Planeje com um veterinário autorizado pelo MPI durante sua estadia; voos de longa distância acrescentam um certificado de bem-estar animal."

hero:
  h1: { en: "Traveling to New Zealand with your dog", fr: "Voyager en Nouvelle-Zélande avec ton chien", es: "Viajar a Nueva Zelanda con tu perro", pt: "Viajar para a Nova Zelândia com seu cachorro" }
  intro:
    en: >-
      New Zealand welcomes dogs, but as a rabies-free island nation it runs one of the strictest
      biosecurity schemes in the world — set by the Ministry for Primary Industries (MPI), not the
      EU. Dogs can only be imported from countries MPI has approved, grouped into three categories by
      rabies status. Every dog except those from Australia needs an import permit, and almost every
      dog must spend a minimum of 10 days in an MPI-approved quarantine facility on arrival. Dogs from
      rabies-controlled countries also need a rabies antibody blood test and several parasite and
      disease treatments. A few breeds are banned from import outright. This guide explains each
      category so you know exactly what to prepare — usually several months — before you book.
    fr: >-
      La Nouvelle-Zélande accueille les chiens, mais en tant qu'île indemne de rage elle applique l'un
      des régimes de biosécurité les plus stricts au monde — fixé par le Ministry for Primary
      Industries (MPI), pas par l'UE. Un chien ne peut être importé que depuis un pays approuvé par le
      MPI, répartis en trois catégories selon le statut rabique. Tout chien, sauf ceux venant
      d'Australie, exige un permis d'importation, et presque tous doivent passer au minimum 10 jours
      dans un centre de quarantaine agréé par le MPI à l'arrivée. Les chiens venant de pays où la rage
      est contrôlée doivent aussi subir un titrage antirabique et plusieurs traitements antiparasitaires
      et sanitaires. Certaines races sont interdites d'importation. Ce guide détaille chaque catégorie
      pour savoir exactement quoi préparer — souvent plusieurs mois — avant de réserver.
    es: >-
      Nueva Zelanda acoge a los perros, pero como país insular libre de rabia aplica uno de los
      regímenes de bioseguridad más estrictos del mundo — fijado por el Ministry for Primary Industries
      (MPI), no por la UE. Los perros solo pueden importarse desde países aprobados por el MPI, agrupados
      en tres categorías según el estatus de rabia. Todo perro, salvo los procedentes de Australia,
      necesita un permiso de importación, y casi todos deben pasar un mínimo de 10 días en un centro de
      cuarentena aprobado por el MPI a la llegada. Los perros procedentes de países con rabia controlada
      también necesitan una prueba de titulación de anticuerpos contra la rabia y varios tratamientos
      antiparasitarios y de enfermedades. Algunas razas están totalmente prohibidas para la importación.
      Esta guía explica cada categoría para que sepas exactamente qué preparar — normalmente varios
      meses — antes de reservar.

    pt: "A Nova Zelândia recebe cachorros, mas, como país insular livre de raiva, aplica um dos regimes de biossegurança mais rigorosos do mundo — definido pelo Ministry for Primary Industries (MPI), não pela UE. Os cachorros só podem ser importados de países aprovados pelo MPI, divididos em três categorias conforme a situação da raiva. Todo cachorro, exceto os que vêm da Austrália, precisa de uma autorização de importação, e quase todos precisam passar no mínimo 10 dias em uma unidade de quarentena aprovada pelo MPI na chegada. Os cachorros vindos de países onde a raiva é controlada também precisam de um teste sorológico antirrábico e de vários tratamentos antiparasitários e de doenças. Algumas raças são totalmente proibidas de importação. Este guia explica cada categoria para você saber exatamente o que preparar — normalmente vários meses — antes de comprar a passagem."
difficulty:
  level: difficult
  label: { en: "Difficult — permit, tests and quarantine required", fr: "Difficile — permis, tests et quarantaine exigés", es: "Difícil — se exigen permiso, pruebas y cuarentena", pt: "Difícil — exige autorização, exames e quarentena" }

prepTime:
  eu:
    en: "Category 1 (Australia): the simplest path — no import permit and no quarantine, but the dog must still meet all treatment and certification rules before travel."
    fr: "Catégorie 1 (Australie) : le parcours le plus simple — pas de permis d'importation ni de quarantaine, mais le chien doit remplir toutes les règles de traitement et de certification avant le départ."
    es: "Categoría 1 (Australia): la ruta más sencilla — sin permiso de importación ni cuarentena, pero el perro debe cumplir igualmente todas las normas de tratamiento y certificación antes del viaje."
    pt: "Categoria 1 (Austrália): o caminho mais simples — sem autorização de importação e sem quarentena, mas o cachorro ainda precisa cumprir todas as regras de tratamento e certificação antes da viagem."
  listed:
    en: "Category 2 (rabies-free countries): allow several weeks to a couple of months — import permit (apply ≥30 working days ahead), treatments, certification and a minimum 10-day quarantine."
    fr: "Catégorie 2 (pays indemnes de rage) : prévois plusieurs semaines à quelques mois — permis d'importation (demande ≥30 jours ouvrés à l'avance), traitements, certification et quarantaine minimale de 10 jours."
    es: "Categoría 2 (países libres de rabia): prevé de varias semanas a un par de meses — permiso de importación (solicítalo ≥30 días hábiles antes), tratamientos, certificación y una cuarentena mínima de 10 días."
    pt: "Categoria 2 (países livres de raiva): reserve de algumas semanas a alguns meses — autorização de importação (solicite com ≥30 dias úteis de antecedência), tratamentos, certificação e quarentena mínima de 10 dias."
  nonListed:
    en: "Category 3 (rabies absent/well-controlled): several months — rabies vaccination and antibody test with a waiting period, multiple disease tests and treatments, permit and 10-day quarantine."
    fr: "Catégorie 3 (rage absente/bien maîtrisée) : plusieurs mois — vaccination et titrage antirabiques avec délai d'attente, multiples tests et traitements, permis et quarantaine de 10 jours."
    es: "Categoría 3 (rabia ausente/bien controlada): varios meses — vacunación antirrábica y prueba de titulación con período de espera, múltiples pruebas y tratamientos de enfermedades, permiso y cuarentena de 10 días."
    pt: "Categoria 3 (raiva ausente/bem controlada): vários meses — vacinação antirrábica e teste sorológico com período de espera, vários exames e tratamentos de doenças, autorização e quarentena de 10 dias."

