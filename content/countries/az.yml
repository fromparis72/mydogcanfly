restrictedDogs:
  intro:
    en: "No breed-specific import ban for dogs is published in an accessible official Azerbaijani source. Azerbaijan regulates the keeping of dogs, cats and other pets in residential areas through Cabinet of Ministers Decision No.38 of 9 March 2011, but that instrument governs keeping and handling rather than a customs breed ban."
    fr: "Aucune interdiction d'importation visant une race de chien n'est publiée dans une source officielle azerbaïdjanaise accessible. L'Azerbaïdjan encadre la détention des chiens, chats et autres animaux dans les zones résidentielles par la décision du Cabinet des ministres n°38 du 9 mars 2011, mais ce texte régit la détention et la maîtrise plutôt qu'une interdiction douanière de race."
    es: "No hay ninguna prohibición de importación específica por raza de perros publicada en una fuente oficial azerbaiyana accesible. Azerbaiyán regula la tenencia de perros, gatos y otras mascotas en zonas residenciales mediante la Decisión del Gabinete de Ministros n.º 38 del 9 de marzo de 2011, pero ese instrumento rige la tenencia y el manejo más que una prohibición aduanera de razas."
    pt: "Nenhuma proibição de importação por raça de cachorro é publicada em fonte oficial acessível do Azerbaijão. O Azerbaijão regula a posse de cachorros, gatos e outros animais de estimação em áreas residenciais por meio da Decisão do Gabinete de Ministros nº 38, de 9 de março de 2011, mas esse instrumento rege a posse e o manejo, e não uma proibição alfandegária por raça."
  cat1:
    en: "Prohibited breeds: no official Azerbaijani list of banned or prohibited-entry dog breeds was located. Treat any breed-ban claim from non-official sites as unverified until confirmed by AQTA."
    fr: "Races interdites : aucune liste officielle azerbaïdjanaise de races de chiens interdites ou d'entrée prohibée n'a été localisée. Considère toute affirmation d'interdiction de race issue de sites non officiels comme non vérifiée tant qu'elle n'est pas confirmée par l'AQTA."
    es: "Razas prohibidas: no se localizó ninguna lista oficial azerbaiyana de razas de perros prohibidas o de entrada vetada. Considera no verificada cualquier afirmación de prohibición de razas procedente de sitios no oficiales hasta que AQTA la confirme."
    pt: "Raças proibidas: nenhuma lista oficial do Azerbaijão de raças de cachorros banidas ou com entrada proibida foi localizada. Trate qualquer alegação de proibição de raça vinda de sites não oficiais como não verificada até que seja confirmada pela AQTA."
  cat2:
    en: "Handling and keeping: Decision No.38 sets out how dogs, cats and other pets must be kept in residential areas and the owner's responsibilities. Any dangerous-dog handling obligations derive from that keeping framework, not from an import prohibition."
    fr: "Détention et maîtrise : la décision n°38 fixe les modalités de détention des chiens, chats et autres animaux en zone résidentielle et les responsabilités du propriétaire. Toute obligation de maîtrise des chiens dangereux découle de ce cadre de détention, non d'une interdiction d'importation."
    es: "Manejo y tenencia: la Decisión n.º 38 establece cómo deben tenerse los perros, gatos y otras mascotas en zonas residenciales y las responsabilidades del propietario. Cualquier obligación de manejo de perros peligrosos deriva de ese marco de tenencia, no de una prohibición de importación."
    pt: "Manejo e posse: a Decisão nº 38 estabelece como cachorros, gatos e outros animais de estimação devem ser mantidos em áreas residenciais e as responsabilidades do dono. Qualquer obrigação de manejo de cachorros perigosos deriva desse marco de posse, e não de uma proibição de importação."
  note:
    en: "Only the official law and AQTA guidance are authoritative. Confirm your dog's breed status and any handling rules before you travel."
    fr: "Seuls la loi officielle et les indications de l'AQTA font foi. Confirme le statut de race de ton chien et les éventuelles règles de maîtrise avant de voyager."
    es: "Solo la ley oficial y las indicaciones de AQTA tienen valor autoritativo. Confirma el estatus de raza de tu perro y cualquier norma de manejo antes de viajar."
    pt: "Só a lei oficial e as orientações da AQTA têm valor vinculante. Confirme a situação da raça do seu cachorro e qualquer regra de manejo antes de viajar."

checklist:
  - en: "International veterinary health certificate, endorsed by the exporting country's official authority"
    fr: "Certificat sanitaire vétérinaire international, visé par l'autorité officielle du pays exportateur"
    es: "Certificado sanitario veterinario internacional, refrendado por la autoridad oficial del país exportador"
    pt: "Atestado de saúde veterinário internacional, endossado pela autoridade oficial do país exportador"
  - en: "Valid rabies vaccination recorded on the certificate and passport"
    fr: "Vaccination antirabique valide consignée sur le certificat et le passeport"
    es: "Vacunación antirrábica válida registrada en el certificado y el pasaporte"
    pt: "Vacinação antirrábica válida registrada no certificado e no passaporte"
  - en: "Veterinary passport (AQTA form, or an accepted international veterinary passport)"
    fr: "Passeport vétérinaire (modèle AQTA, ou passeport vétérinaire international accepté)"
    es: "Pasaporte veterinario (modelo AQTA, o un pasaporte veterinario internacional aceptado)"
    pt: "Passaporte veterinário (modelo AQTA, ou um passaporte veterinário internacional aceito)"
  - en: "Microchip strongly advisable (ISO 11784/11785) even though AQTA does not publish a rule"
    fr: "Puce fortement conseillée (ISO 11784/11785) même si l'AQTA ne publie pas de règle"
    es: "Microchip muy recomendable (ISO 11784/11785) aunque AQTA no publique una norma"
    pt: "Microchip fortemente recomendado (ISO 11784/11785), mesmo que a AQTA não publique uma regra"
  - en: "Contact AQTA in advance to confirm microchip, antibody test, minimum age and any prior notice"
    fr: "Contacte l'AQTA à l'avance pour confirmer puce, titrage, âge minimum et notification préalable"
    es: "Contacta con AQTA con antelación para confirmar microchip, prueba de titulación, edad mínima y cualquier notificación previa"
    pt: "Contate a AQTA com antecedência para confirmar microchip, teste sorológico, idade mínima e qualquer aviso prévio"
  - en: "Enter via a crossing point with state veterinary control; present originals, not copies"
    fr: "Entre par un point de passage avec contrôle vétérinaire d'État ; présente des originaux, pas des copies"
    es: "Entra por un punto de paso con control veterinario estatal; presenta originales, no copias"
    pt: "Entre por um posto de passagem com controle veterinário estatal; apresente originais, não cópias"
  - en: "Translation of documents where they are not in Azerbaijani, Russian or English"
    fr: "Traduction des documents s'ils ne sont ni en azerbaïdjanais, ni en russe, ni en anglais"
    es: "Traducción de los documentos cuando no estén en azerbaiyano, ruso o inglés"
    pt: "Tradução dos documentos quando eles não estiverem em azerbaijano, russo ou inglês"
  - en: "Suitable IATA travel crate if the dog flies in the hold"
    fr: "Caisse de transport IATA adaptée si le chien voyage en soute"
    es: "Jaula de viaje IATA adecuada si el perro viaja en bodega"
    pt: "Caixa de transporte adequada às normas IATA se o cachorro for viajar no porão"

