factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Azerbaijan (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — l'Azerbaïdjan (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Azerbaiyán (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — o Azerbaijão (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — Azerbaijan", fr: "Pays de destination — Azerbaïdjan", es: "País de destino — Azerbaiyán", pt: "País de destino — Azerbaijão" }
      text:
        en: "Azerbaijan applies its own national veterinary scheme (not EU, not EAEU). A dog is a good under state veterinary control: it needs an official international veterinary health certificate and is checked at a border veterinary control point. AQTA is the competent authority and has approved a national veterinary passport form for pets."
        fr: "L'Azerbaïdjan applique son propre régime vétérinaire national (ni UE, ni UEEA). Un chien est une marchandise sous contrôle vétérinaire d'État : il lui faut un certificat sanitaire vétérinaire international officiel et il est contrôlé à un poste vétérinaire frontalier. L'AQTA est l'autorité compétente et a approuvé un modèle national de passeport vétérinaire pour animaux."
        es: "Azerbaiyán aplica su propio régimen veterinario nacional (ni UE, ni UEEA). Un perro es una mercancía bajo control veterinario estatal: necesita un certificado sanitario veterinario internacional oficial y se controla en un puesto de control veterinario fronterizo. AQTA es la autoridad competente y ha aprobado un modelo nacional de pasaporte veterinario para mascotas."
        pt: "O Azerbaijão aplica seu próprio regime veterinário nacional (nem UE, nem UEE). Um cachorro é uma mercadoria sob controle veterinário estatal: ele precisa de um atestado de saúde veterinário internacional oficial e é conferido em um posto de controle veterinário de fronteira. A AQTA é a autoridade competente e aprovou um modelo nacional de passaporte veterinário para animais de estimação."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The certificate must be issued and endorsed by the official veterinary authority of the country you fly from, attesting your dog's health and vaccinations. The exporting authority's own export rules for Azerbaijan (and whether they publish a model certificate) shape what you can obtain and how long it takes."
        fr: "Le certificat doit être établi et visé par l'autorité vétérinaire officielle du pays d'où tu pars, attestant la santé et les vaccinations de ton chien. Les règles d'exportation de cette autorité vers l'Azerbaïdjan (et l'existence d'un certificat modèle) déterminent ce que tu peux obtenir et les délais."
        es: "El certificado debe ser expedido y refrendado por la autoridad veterinaria oficial del país desde el que vuelas, acreditando la salud y las vacunas de tu perro. Las propias normas de exportación de esa autoridad hacia Azerbaiyán (y si publican un certificado modelo) determinan lo que puedes obtener y cuánto tarda."
        pt: "O certificado precisa ser emitido e endossado pela autoridade veterinária oficial do país de onde você parte, atestando a saúde e as vacinas do seu cachorro. As próprias regras de exportação dessa autoridade para o Azerbaijão (e se ela publica um certificado modelo) determinam o que você consegue obter e quanto tempo leva."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "The rabies and disease situation of your dog's real origin and recent stays matters to Azerbaijan's veterinary service. A route through a rabies-controlled country, and complete vaccination records, reduce the risk of additional conditions being imposed at the border."
        fr: "La situation rabique et sanitaire de l'origine réelle du chien et de ses séjours récents importe au service vétérinaire azerbaïdjanais. Un itinéraire par un pays où la rage est maîtrisée, et des carnets de vaccination complets, réduisent le risque de conditions supplémentaires à la frontière."
        es: "La situación de la rabia y las enfermedades del origen real de tu perro y de sus estancias recientes importa al servicio veterinario de Azerbaiyán. Una ruta a través de un país con la rabia controlada, y un carné de vacunación completo, reducen el riesgo de que se impongan condiciones adicionales en la frontera."
        pt: "A situação da raiva e de outras doenças na origem real do seu cachorro e em suas estadias recentes importa para o serviço veterinário do Azerbaijão. Uma rota por um país com a raiva controlada, e uma carteira de vacinação completa, reduzem o risco de condições adicionais serem impostas na fronteira."
  note:
    en: "So read the requirements below as Azerbaijan's framework, then confirm your dog's exact origin, documents and any current conditions with your vet and with AQTA."
    fr: "Lis donc les exigences ci-dessous comme le cadre azerbaïdjanais, puis confirme l'origine exacte, les documents et les conditions en vigueur de ton chien avec ton vétérinaire et l'AQTA."
    es: "Así que lee los requisitos siguientes como el marco de Azerbaiyán y luego confirma el origen exacto, los documentos y cualquier condición vigente de tu perro con tu veterinario y con AQTA."
    pt: "Leia então as exigências abaixo como o quadro geral do Azerbaijão, e confirme com seu veterinário e com a AQTA a origem exata, os documentos e as condições vigentes para o seu cachorro."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Not officially published", fr: "Non communiqué", es: "No publicado oficialmente", pt: "Não publicado oficialmente" }
    when: { en: "AQTA does not publish an openly accessible rule stating whether an ISO 11784/11785 microchip is mandatory for a pet dog. A microchip is internationally standard and strongly advisable; confirm the current requirement with AQTA.", fr: "L'AQTA ne publie pas de règle librement accessible indiquant si une puce ISO 11784/11785 est obligatoire pour un chien de compagnie. La puce est une norme internationale fortement conseillée ; confirme l'exigence en vigueur auprès de l'AQTA.", es: "AQTA no publica una norma de acceso abierto que indique si un microchip ISO 11784/11785 es obligatorio para un perro de compañía. El microchip es un estándar internacional muy recomendable; confirma el requisito vigente con AQTA.", pt: "A AQTA não publica uma regra de acesso aberto informando se um microchip ISO 11784/11785 é obrigatório para um cachorro de companhia. O microchip é um padrão internacional fortemente recomendado; confirme a exigência vigente com a AQTA." }
    exceptions: { en: "Unknown — not specified in an accessible official source.", fr: "Non communiqué — non précisé dans une source officielle accessible.", es: "No comunicado — no se especifica en una fuente oficial accesible.", pt: "Não comunicado — não especificado em fonte oficial acessível." }
    ref: { en: "AQTA (afsa.gov.az) — no published microchip rule located", fr: "AQTA (afsa.gov.az) — aucune règle publiée sur la puce localisée", es: "AQTA (afsa.gov.az) — no se localizó ninguna norma publicada sobre el microchip", pt: "AQTA (afsa.gov.az) — nenhuma regra publicada sobre microchip foi localizada" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "A dog is a good under state veterinary control; a valid rabies vaccination is recorded on the international veterinary health certificate and on the AQTA veterinary passport. The exact timing (interval before travel) and minimum age are not published in an accessible AQTA document.", fr: "Un chien est une marchandise sous contrôle vétérinaire d'État ; une vaccination antirabique valide est consignée sur le certificat sanitaire vétérinaire international et sur le passeport vétérinaire AQTA. Le calendrier exact (délai avant le voyage) et l'âge minimum ne sont pas publiés dans un document AQTA accessible.", es: "Un perro es una mercancía bajo control veterinario estatal; una vacunación antirrábica válida se registra en el certificado sanitario veterinario internacional y en el pasaporte veterinario de AQTA. El calendario exacto (intervalo antes del viaje) y la edad mínima no están publicados en un documento de AQTA accesible.", pt: "Um cachorro é uma mercadoria sob controle veterinário estatal; uma vacinação antirrábica válida é registrada no atestado de saúde veterinário internacional e no passaporte veterinário da AQTA. O prazo exato (intervalo antes da viagem) e a idade mínima não são publicados em documento acessível da AQTA." }
    exceptions: { en: "Timing and puppy rules: Unknown — confirm with AQTA.", fr: "Calendrier et règles pour chiots : non communiqué — à confirmer auprès de l'AQTA.", es: "Calendario y normas para cachorros: no comunicado — a confirmar con AQTA.", pt: "Prazo e regras para filhotes: não comunicado — confirme com a AQTA." }
    ref: { en: "Cabinet Decision No.66 (21.04.2009), state veterinary-control import rules; AQTA veterinary passport form", fr: "Décision du Cabinet n°66 (21.04.2009), règles d'import sous contrôle vétérinaire d'État ; modèle de passeport vétérinaire AQTA", es: "Decisión del Gabinete n.º 66 (21.04.2009), normas de importación bajo control veterinario estatal; modelo de pasaporte veterinario de AQTA", pt: "Decisão do Gabinete de Ministros nº 66 (21.04.2009), regras de importação sob controle veterinário estatal; modelo de passaporte veterinário da AQTA" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not published as required", fr: "Non publié comme requis", es: "No publicada como obligatoria", pt: "Não publicado como obrigatório" }
    when: { en: "No openly accessible AQTA document requires a rabies antibody test for pet dogs entering Azerbaijan. Do not assume it is either required or waived — confirm with AQTA, especially from higher-risk origins.", fr: "Aucun document AQTA librement accessible n'exige un titrage antirabique pour les chiens de compagnie entrant en Azerbaïdjan. Ne présume ni son exigence ni sa dispense — confirme auprès de l'AQTA, surtout depuis des origines à risque plus élevé.", es: "Ningún documento de AQTA de acceso abierto exige una prueba de titulación de rabia para los perros de compañía que entran en Azerbaiyán. No des por hecho ni que se exige ni que se dispensa — confírmalo con AQTA, sobre todo desde orígenes de mayor riesgo.", pt: "Nenhum documento de acesso aberto da AQTA exige um teste sorológico antirrábico para cachorros de companhia que entram no Azerbaijão. Não presuma que ele seja exigido nem dispensado — confirme com a AQTA, especialmente vindo de origens de risco mais alto." }
    exceptions: { en: "Unknown — not specified in an accessible official source.", fr: "Non communiqué — non précisé dans une source officielle accessible.", es: "No comunicado — no se especifica en una fuente oficial accesible.", pt: "Não comunicado — não especificado em fonte oficial acessível." }
    ref: { en: "AQTA (afsa.gov.az) — no published antibody-test requirement located", fr: "AQTA (afsa.gov.az) — aucune exigence de titrage publiée localisée", es: "AQTA (afsa.gov.az) — no se localizó ninguna exigencia de prueba de titulación publicada", pt: "AQTA (afsa.gov.az) — nenhuma exigência de teste sorológico publicada foi localizada" }
  - item: { en: "Veterinary passport (AQTA-approved form)", fr: "Passeport vétérinaire (modèle approuvé AQTA)", es: "Pasaporte veterinario (modelo aprobado por AQTA)", pt: "Passaporte veterinário (modelo aprovado pela AQTA)" }
    required: { en: "Required for pets", fr: "Requis pour les animaux", es: "Obligatorio para mascotas", pt: "Obrigatório para animais de estimação" }
    when: { en: "AQTA has approved an official veterinary passport form for dogs, cats and other pets, issued by AQTA regional branches and used to record identity, vaccinations and treatments. An existing international veterinary passport is generally accepted for movement.", fr: "L'AQTA a approuvé un modèle officiel de passeport vétérinaire pour chiens, chats et autres animaux, délivré par les antennes régionales de l'AQTA et servant à consigner l'identité, les vaccinations et les traitements. Un passeport vétérinaire international existant est généralement accepté pour la circulation.", es: "AQTA ha aprobado un modelo oficial de pasaporte veterinario para perros, gatos y otras mascotas, expedido por las oficinas regionales de AQTA y utilizado para registrar la identidad, las vacunas y los tratamientos. Un pasaporte veterinario internacional existente se acepta generalmente para el desplazamiento.", pt: "A AQTA aprovou um modelo oficial de passaporte veterinário para cachorros, gatos e outros animais de estimação, emitido pelas filiais regionais da AQTA e usado para registrar identidade, vacinas e tratamentos. Um passaporte veterinário internacional já existente é geralmente aceito para a movimentação." }
    exceptions: { en: "A foreign international veterinary passport may substitute; confirm acceptance with AQTA.", fr: "Un passeport vétérinaire international étranger peut se substituer ; confirme son acceptation auprès de l'AQTA.", es: "Un pasaporte veterinario internacional extranjero puede sustituirlo; confirma su aceptación con AQTA.", pt: "Um passaporte veterinário internacional estrangeiro pode substituí-lo; confirme a aceitação com a AQTA." }
    ref: { en: "AQTA — approved veterinary passport form for dogs/cats/pets (sample form published)", fr: "AQTA — modèle de passeport vétérinaire approuvé pour chiens/chats/animaux (modèle publié)", es: "AQTA — modelo aprobado de pasaporte veterinario para perros/gatos/mascotas (modelo publicado)", pt: "AQTA — modelo aprovado de passaporte veterinário para cachorros/gatos/animais de estimação (modelo publicado)" }
  - item: { en: "International veterinary health certificate", fr: "Certificat sanitaire vétérinaire international", es: "Certificado sanitario veterinario internacional", pt: "Atestado de saúde veterinário internacional" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "An international veterinary certificate must accompany the animal, issued and endorsed by the official veterinary authority of the exporting country and presented at the border veterinary control point on arrival in Azerbaijan.", fr: "Un certificat vétérinaire international doit accompagner l'animal, établi et visé par l'autorité vétérinaire officielle du pays exportateur et présenté au poste de contrôle vétérinaire frontalier à l'arrivée en Azerbaïdjan.", es: "Un certificado veterinario internacional debe acompañar al animal, expedido y refrendado por la autoridad veterinaria oficial del país exportador y presentado en el puesto de control veterinario fronterizo a la llegada a Azerbaiyán.", pt: "Um certificado veterinário internacional deve acompanhar o animal, emitido e endossado pela autoridade veterinária oficial do país exportador e apresentado no posto de controle veterinário de fronteira na chegada ao Azerbaijão." }
    exceptions: { en: "Model certificate and validity period: not published in an accessible AQTA document — confirm with AQTA and your exporting authority.", fr: "Certificat modèle et durée de validité : non publiés dans un document AQTA accessible — à confirmer auprès de l'AQTA et de ton autorité exportatrice.", es: "Certificado modelo y periodo de valide: no publicados en un documento de AQTA accesible — a confirmar con AQTA y con tu autoridad exportadora.", pt: "Certificado modelo e período de validade: não publicados em documento acessível da AQTA — confirme com a AQTA e com a autoridade exportadora do seu país." }
    ref: { en: "Cabinet Decision No.66 (21.04.2009), state veterinary-control import rules; Cabinet Decision No.38 (09.03.2011) on keeping/moving pets", fr: "Décision du Cabinet n°66 (21.04.2009), règles d'import sous contrôle vétérinaire d'État ; Décision n°38 (09.03.2011) sur la détention/le déplacement des animaux", es: "Decisión del Gabinete n.º 66 (21.04.2009), normas de importación bajo control veterinario estatal; Decisión del Gabinete n.º 38 (09.03.2011) sobre la tenencia/el desplazamiento de mascotas", pt: "Decisão do Gabinete de Ministros nº 66 (21.04.2009), regras de importação sob controle veterinário estatal; Decisão do Gabinete de Ministros nº 38 (09.03.2011) sobre a posse/circulação de animais de estimação" }
  - item: { en: "Tapeworm / parasite treatment", fr: "Traitement antiparasitaire / échinococcose", es: "Tratamiento contra la tenia / antiparasitario", pt: "Tratamento contra a tênia / antiparasitário" }
    required: { en: "Not officially published", fr: "Non communiqué", es: "No publicado oficialmente", pt: "Não publicado oficialmente" }
    when: { en: "No openly accessible AQTA document specifies a compulsory tapeworm or parasite treatment for pet dogs. Confirm with AQTA whether any treatment must be recorded on the certificate.", fr: "Aucun document AQTA librement accessible ne précise un traitement obligatoire contre l'échinococcose ou les parasites pour les chiens de compagnie. Vérifie auprès de l'AQTA si un traitement doit figurer sur le certificat.", es: "Ningún documento de AQTA de acceso abierto especifica un tratamiento obligatorio contra la tenia o los parásitos para los perros de compañía. Confirma con AQTA si algún tratamiento debe constar en el certificado.", pt: "Nenhum documento de acesso aberto da AQTA especifica um tratamento obrigatório contra a tênia ou antiparasitário para cachorros de companhia. Confirme com a AQTA se algum tratamento precisa ser registrado no certificado." }
    exceptions: { en: "Unknown — not specified in an accessible official source.", fr: "Non communiqué — non précisé dans une source officielle accessible.", es: "No comunicado — no se especifica en una fuente oficial accesible.", pt: "Não comunicado — não especificado em fonte oficial acessível." }
    ref: { en: "AQTA (afsa.gov.az) — no published parasite-treatment requirement located", fr: "AQTA (afsa.gov.az) — aucune exigence de traitement antiparasitaire publiée localisée", es: "AQTA (afsa.gov.az) — no se localizó ninguna exigencia de tratamiento antiparasitario publicada", pt: "AQTA (afsa.gov.az) — nenhuma exigência de tratamento antiparasitário publicada foi localizada" }
  - item: { en: "Advance notification / import permit", fr: "Notification préalable / permis d'import", es: "Notificación previa / permiso de importación", pt: "Notificação prévia / autorização de importação" }
    required: { en: "Not officially published", fr: "Non communiqué", es: "No publicado oficialmente", pt: "Não publicado oficialmente" }
    when: { en: "Goods under state veterinary control are subject to organised border veterinary control. Whether a personal pet dog accompanying its owner needs a prior permit or advance notification is not stated in an accessible AQTA document; informing the border veterinary service in advance is prudent.", fr: "Les marchandises sous contrôle vétérinaire d'État sont soumises à un contrôle vétérinaire frontalier organisé. L'obligation, pour un chien de compagnie accompagnant son propriétaire, d'un permis préalable ou d'une notification préalable n'est pas précisée dans un document AQTA accessible ; prévenir le service vétérinaire frontalier à l'avance est prudent.", es: "Las mercancías bajo control veterinario estatal están sujetas a un control veterinario fronterizo organizado. Si un perro de compañía personal que acompaña a su propietario necesita un permiso previo o una notificación previa no se indica en un documento de AQTA accesible; informar con antelación al servicio veterinario fronterizo es prudente.", pt: "Mercadorias sob controle veterinário estatal ficam sujeitas a um controle veterinário de fronteira organizado. Se um cachorro de companhia pessoal que acompanha seu dono precisa de autorização prévia ou notificação prévia não é indicado em documento acessível da AQTA; é prudente avisar com antecedência o serviço veterinário de fronteira." }
    exceptions: { en: "Unknown for accompanied personal pets — confirm with AQTA.", fr: "Non communiqué pour les animaux personnels accompagnés — à confirmer auprès de l'AQTA.", es: "No comunicado para las mascotas personales acompañadas — a confirmar con AQTA.", pt: "Não comunicado para animais de estimação pessoais acompanhados — confirme com a AQTA." }
    ref: { en: "Cabinet Decision No.66 (21.04.2009), state veterinary-control import rules", fr: "Décision du Cabinet n°66 (21.04.2009), règles d'import sous contrôle vétérinaire d'État", es: "Decisión del Gabinete n.º 66 (21.04.2009), normas de importación bajo control veterinario estatal", pt: "Decisão do Gabinete de Ministros nº 66 (21.04.2009), regras de importação sob controle veterinário estatal" }
  - item: { en: "Border veterinary control", fr: "Contrôle vétérinaire frontalier", es: "Control veterinario fronterizo", pt: "Controle veterinário de fronteira" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "On arrival, the animal and its documents are presented to the state border veterinary control service, which verifies the international veterinary certificate and the animal's health before entry is allowed.", fr: "À l'arrivée, l'animal et ses documents sont présentés au service vétérinaire frontalier d'État, qui vérifie le certificat vétérinaire international et l'état de santé de l'animal avant d'autoriser l'entrée.", es: "A la llegada, el animal y sus documentos se presentan al servicio estatal de control veterinario fronterizo, que verifica el certificado veterinario internacional y la salud del animal antes de permitir la entrada.", pt: "Na chegada, o animal e seus documentos são apresentados ao serviço estatal de controle veterinário de fronteira, que verifica o certificado veterinário internacional e a saúde do animal antes de autorizar a entrada." }
    exceptions: { en: "Enter through a crossing point that operates veterinary control; the customs declaration is handled by the State Customs Committee.", fr: "Entre par un point de passage assurant le contrôle vétérinaire ; la déclaration douanière relève du Comité d'État des douanes.", es: "Entra por un punto de paso que disponga de control veterinario; la declaración de aduanas la gestiona el Comité Estatal de Aduanas.", pt: "Entre por um posto de passagem que opere controle veterinário; a declaração alfandegária é tratada pelo Comitê Estatal de Alfândegas." }
    ref: { en: "Cabinet Decision No.66 (21.04.2009); State Customs Committee (customs.gov.az)", fr: "Décision du Cabinet n°66 (21.04.2009) ; Comité d'État des douanes (customs.gov.az)", es: "Decisión del Gabinete n.º 66 (21.04.2009); Comité Estatal de Aduanas (customs.gov.az)", pt: "Decisão do Gabinete de Ministros nº 66 (21.04.2009); Comitê Estatal de Alfândegas (customs.gov.az)" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Conditional / not published for accompanied pets", fr: "Conditionnelle / non communiquée pour les animaux accompagnés", es: "Condicional / no publicada para las mascotas acompañadas", pt: "Condicional / não publicado para animais de estimação acompanhados" }
    when: { en: "The general state veterinary-control rules provide for quarantine and diagnostic measures where an animal's health or documents raise concern. Whether a compliant accompanied pet dog is exempt is not stated in an accessible AQTA document.", fr: "Les règles générales de contrôle vétérinaire d'État prévoient quarantaine et mesures diagnostiques lorsque la santé ou les documents d'un animal posent problème. L'exemption d'un chien de compagnie conforme et accompagné n'est pas précisée dans un document AQTA accessible.", es: "Las normas generales de control veterinario estatal prevén cuarentena y medidas de diagnóstico cuando la salud o los documentos de un animal generan preocupación. Si un perro de compañía conforme y acompañado está exento no se indica en un documento de AQTA accesible.", pt: "As regras gerais de controle veterinário estatal preveem quarentena e medidas de diagnóstico quando a saúde ou os documentos de um animal levantam dúvidas. Se um cachorro de companhia acompanhado e em conformidade fica isento não é indicado em documento acessível da AQTA." }
    exceptions: { en: "Unknown for compliant accompanied pets — confirm with AQTA.", fr: "Non communiqué pour les animaux conformes accompagnés — à confirmer auprès de l'AQTA.", es: "No comunicado para las mascotas conformes acompañadas — a confirmar con AQTA.", pt: "Não comunicado para animais de estimação acompanhados e em conformidade — confirme com a AQTA." }
    ref: { en: "Cabinet Decision No.66 (21.04.2009), state veterinary-control import rules", fr: "Décision du Cabinet n°66 (21.04.2009), règles d'import sous contrôle vétérinaire d'État", es: "Decisión del Gabinete n.º 66 (21.04.2009), normas de importación bajo control veterinario estatal", pt: "Decisão do Gabinete de Ministros nº 66 (21.04.2009), regras de importação sob controle veterinário estatal" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "Not officially published", fr: "Non communiqué", es: "No publicado oficialmente", pt: "Não publicado oficialmente" }
    when: { en: "No accessible AQTA document sets a minimum entry age for puppies or the conditions for unvaccinated young animals. Confirm with AQTA before travelling with a puppy.", fr: "Aucun document AQTA accessible ne fixe d'âge minimum d'entrée pour les chiots ni les conditions pour les jeunes animaux non vaccinés. Confirme auprès de l'AQTA avant de voyager avec un chiot.", es: "Ningún documento de AQTA accesible fija una edad mínima de entrada para los cachorros ni las condiciones para los animales jóvenes sin vacunar. Confirma con AQTA antes de viajar con un cachorro.", pt: "Nenhum documento acessível da AQTA fixa uma idade mínima de entrada para filhotes nem as condições para animais jovens não vacinados. Confirme com a AQTA antes de viajar com um filhote." }
    exceptions: { en: "Unknown — not specified in an accessible official source.", fr: "Non communiqué — non précisé dans une source officielle accessible.", es: "No comunicado — no se especifica en una fuente oficial accesible.", pt: "Não comunicado — não especificado em fonte oficial acessível." }
    ref: { en: "AQTA (afsa.gov.az) — no published minimum-age rule located", fr: "AQTA (afsa.gov.az) — aucune règle d'âge minimum publiée localisée", es: "AQTA (afsa.gov.az) — no se localizó ninguna norma de edad mínima publicada", pt: "AQTA (afsa.gov.az) — nenhuma regra de idade mínima publicada foi localizada" }

origin:
  eu:
    title: { en: "From the EU or a country with a recognised certificate system", fr: "Depuis l'UE ou un pays au système de certification reconnu", es: "Desde la UE o un país con un sistema de certificación reconocido", pt: "Da UE ou de um país com sistema de certificação reconhecido" }
    body:
      en: "Azerbaijan does not run an EU-style listed/non-listed system, and an EU pet passport alone does not govern entry. From the EU or any country whose official veterinary authority can issue and endorse an international veterinary health certificate for export to Azerbaijan, prepare that certificate with up-to-date rabies vaccination recorded, plus the animal's identity and vaccination records. Confirm the current model and conditions with AQTA and your exporting authority."
      fr: "L'Azerbaïdjan n'applique pas de système listé/non listé à l'européenne, et un passeport UE seul ne régit pas l'entrée. Depuis l'UE ou tout pays dont l'autorité vétérinaire officielle peut établir et viser un certificat sanitaire vétérinaire international pour l'export vers l'Azerbaïdjan, prépare ce certificat avec la vaccination antirabique à jour consignée, ainsi que l'identité et les carnets de vaccination. Confirme le modèle et les conditions en vigueur auprès de l'AQTA et de ton autorité exportatrice."
      es: "Azerbaiyán no aplica un sistema de países listados/no listados al estilo de la UE, y un pasaporte europeo para mascotas por sí solo no rige la entrada. Desde la UE o cualquier país cuya autoridad veterinaria oficial pueda expedir y refrendar un certificado sanitario veterinario internacional para la exportación a Azerbaiyán, prepara ese certificado con la vacunación antirrábica al día registrada, junto con la identidad y el carné de vacunación del animal. Confirma el modelo y las condiciones vigentes con AQTA y con tu autoridad exportadora."
      pt: "O Azerbaijão não tem um sistema de países listados/não listados como o da UE, e um passaporte europeu para animais sozinho não determina a entrada. Vindo da UE ou de qualquer país cuja autoridade veterinária oficial possa emitir e endossar um atestado de saúde veterinário internacional para exportação ao Azerbaijão, prepare esse certificado com a vacinação antirrábica em dia registrada, além da identidade e da carteira de vacinação do animal. Confirme o modelo e as condições vigentes com a AQTA e com a autoridade exportadora do seu país."
    cls: ok
  listed:
    title: { en: "Standard case — accompanied personal pet", fr: "Cas standard — animal personnel accompagné", es: "Caso estándar — mascota personal acompañada", pt: "Caso padrão — animal de estimação pessoal acompanhado" }
    body:
      en: "A dog travelling with its owner for personal, non-commercial use enters under Azerbaijan's state veterinary-control framework: an endorsed international veterinary certificate, a valid rabies vaccination on record, and presentation to the border veterinary service. Because AQTA does not publish a consumer pet-import checklist, contact AQTA in advance to confirm the exact documents, any microchip expectation and whether prior notice is needed."
      fr: "Un chien voyageant avec son propriétaire à titre personnel et non commercial entre dans le cadre du contrôle vétérinaire d'État azerbaïdjanais : certificat vétérinaire international visé, vaccination antirabique valide consignée, et présentation au service vétérinaire frontalier. L'AQTA ne publiant pas de check-list grand public, contacte-la à l'avance pour confirmer les documents exacts, une éventuelle attente de puce et la nécessité d'une notification préalable."
      es: "Un perro que viaja con su propietario para uso personal y no comercial entra en el marco del control veterinario estatal de Azerbaiyán: certificado veterinario internacional refrendado, vacunación antirrábica válida registrada y presentación al servicio veterinario fronterizo. Como AQTA no publica una lista de comprobación para el público sobre la importación de mascotas, contacta con AQTA con antelación para confirmar los documentos exactos, cualquier expectativa de microchip y si se necesita notificación previa."
      pt: "Um cachorro que viaja com seu dono para uso pessoal e não comercial entra sob o marco de controle veterinário estatal do Azerbaijão: certificado veterinário internacional endossado, vacinação antirrábica válida registrada e apresentação ao serviço veterinário de fronteira. Como a AQTA não publica uma lista de exigências voltada ao público para a importação de animais, contate a AQTA com antecedência para confirmar os documentos exatos, qualquer expectativa quanto ao microchip e se é preciso aviso prévio."
    cls: warn
  nonListed:
    title: { en: "From a higher-risk origin or needing coordination", fr: "Depuis une origine à risque plus élevé ou nécessitant une coordination", es: "Desde un origen de mayor riesgo o que requiere coordinación", pt: "De uma origem de risco mais alto ou que exige coordenação" }
    body:
      en: "From an origin with a less favourable rabies/disease status, or where the exporting authority cannot readily endorse a certificate for Azerbaijan, expect the veterinary service to apply additional scrutiny and possibly quarantine or diagnostic measures under the general veterinary-control rules. Coordinate with AQTA well ahead of travel; the exact conditions for such cases are not published openly."
      fr: "Depuis une origine au statut rabique/sanitaire moins favorable, ou lorsque l'autorité exportatrice ne peut viser facilement un certificat pour l'Azerbaïdjan, attends-toi à un examen renforcé du service vétérinaire, voire à une quarantaine ou des mesures diagnostiques au titre des règles générales de contrôle vétérinaire. Coordonnez avec l'AQTA bien avant le départ ; les conditions exactes de ces cas ne sont pas publiées ouvertement."
      es: "Desde un origen con un estatus de rabia/enfermedades menos favorable, o cuando la autoridad exportadora no pueda refrendar fácilmente un certificado para Azerbaiyán, espera que el servicio veterinario aplique un examen reforzado y posiblemente cuarentena o medidas de diagnóstico en virtud de las normas generales de control veterinario. Coordina con AQTA bastante antes del viaje; las condiciones exactas de tales casos no se publican abiertamente."
      pt: "De uma origem com situação de raiva/doenças menos favorável, ou quando a autoridade exportadora não consegue endossar facilmente um certificado para o Azerbaijão, espere que o serviço veterinário aplique um exame mais rigoroso e, possivelmente, quarentena ou medidas de diagnóstico conforme as regras gerais de controle veterinário. Coordene com a AQTA bem antes da viagem; as condições exatas para esses casos não são publicadas abertamente."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Azerbaijan depends on its documents and the border veterinary check."
    fr: "Ce qui se passe à l'arrivée de ton chien en Azerbaïdjan dépend de ses documents et du contrôle vétérinaire frontalier."
    es: "Lo que ocurre cuando tu perro llega a Azerbaiyán depende de sus documentos y del control veterinario fronterizo."
    pt: "O que acontece quando seu cachorro chega ao Azerbaijão depende dos documentos dele e da conferência veterinária de fronteira."
  points:
    - en: "Enter through a crossing point that operates state veterinary control and present the international veterinary certificate and the animal's passport."
      fr: "Entre par un point de passage assurant le contrôle vétérinaire d'État et présente le certificat vétérinaire international et le passeport de l'animal."
      es: "Entra por un punto de paso que disponga de control veterinario estatal y presenta el certificado veterinario internacional y el pasaporte del animal."
      pt: "Entre por um posto de passagem que opere controle veterinário estatal e apresente o certificado veterinário internacional e o passaporte do animal."
    - en: "The border veterinary service checks the certificate, the recorded vaccinations and the animal's clinical condition before releasing it."
      fr: "Le service vétérinaire frontalier vérifie le certificat, les vaccinations consignées et l'état clinique de l'animal avant de le libérer."
      es: "El servicio veterinario fronterizo comprueba el certificado, las vacunas registradas y el estado clínico del animal antes de liberarlo."
      pt: "O serviço veterinário de fronteira confere o certificado, as vacinas registradas e o estado clínico do animal antes de liberá-lo."
    - en: "The customs formalities for the accompanying passenger are handled by the State Customs Committee."
      fr: "Les formalités douanières pour le voyageur accompagnant relèvent du Comité d'État des douanes."
      es: "Las formalidades aduaneras del pasajero acompañante las gestiona el Comité Estatal de Aduanas."
      pt: "As formalidades alfandegárias do passageiro acompanhante são tratadas pelo Comitê Estatal de Alfândegas."
    - en: "Carry original documents, not copies; a translation is advisable where they are not in Azerbaijani, Russian or English."
      fr: "Munis-toi des originaux, pas de copies ; une traduction est conseillée s'ils ne sont ni en azerbaïdjanais, ni en russe, ni en anglais."
      es: "Lleva los documentos originales, no copias; es aconsejable una traducción cuando no estén en azerbaiyano, ruso o inglés."
      pt: "Leve os documentos originais, não cópias; recomenda-se uma tradução quando eles não estiverem em azerbaijano, russo ou inglês."
    - en: "If documents are missing or invalid, the veterinary service may apply quarantine, diagnostic measures, return or refusal under the general veterinary-control rules."
      fr: "Si les documents manquent ou sont invalides, le service vétérinaire peut appliquer quarantaine, mesures diagnostiques, réexpédition ou refus au titre des règles générales de contrôle vétérinaire."
      es: "Si faltan documentos o no son válidos, el servicio veterinario puede aplicar cuarentena, medidas de diagnóstico, devolución o denegación en virtud de las normas generales de control veterinario."
      pt: "Se faltarem documentos ou eles não forem válidos, o serviço veterinário pode aplicar quarentena, medidas de diagnóstico, devolução ou recusa conforme as regras gerais de controle veterinário."
    - en: "Because several parameters are unpublished, informing AQTA of your arrival details in advance reduces the risk of surprises at the border."
      fr: "Plusieurs paramètres n'étant pas publiés, informer l'AQTA de tes modalités d'arrivée à l'avance réduit le risque de mauvaises surprises à la frontière."
      es: "Como varios parámetros no están publicados, informar a AQTA de los detalles de tu llegada con antelación reduce el riesgo de sorpresas en la frontera."
      pt: "Como vários parâmetros não são publicados, avisar a AQTA sobre os detalhes da sua chegada com antecedência reduz o risco de surpresas na fronteira."

