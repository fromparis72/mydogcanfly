# Country Entry Guide — Azerbaijan / Azərbaycan (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_az
iso2: "AZ"
name: { en: "Azerbaijan", fr: "Azerbaïdjan", es: "Azerbaiyán", pt: "Azerbaijão" }
region: { en: "Western Asia (South Caucasus)", fr: "Asie occidentale (Caucase du Sud)", es: "Asia occidental (Cáucaso Sur)", pt: "Ásia Ocidental (Cáucaso Sul)" }


regime: non_listed
exit:
  authority: AFSA
  authorityUrl: https://afsa.gov.az/en
  intro:
    en: "Azerbaijan is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Food Safety Agency (AFSA)."
    fr: "L'Azerbaïdjan est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par la Food Safety Agency (AFSA)."
    es: "Azerbaiyán no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por la Food Safety Agency (AFSA)."
    pt: "O Azerbaijão é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pela Agência de Segurança Alimentar (AFSA)."
  steps:
    - timing: longlead
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      text:
        en: "AFSA is the state authority that issues the international veterinary certificate for animals leaving Azerbaijan, via its export one-stop-shop."
        fr: "L'AFSA est l'autorité d'État qui délivre le certificat vétérinaire international pour les animaux quittant l'Azerbaïdjan, via son guichet unique d'export."
        es: "La AFSA es la autoridad estatal que emite el certificado veterinario internacional para los animales que salen de Azerbaiyán, a través de su ventanilla única de exportación."
        pt: "A AFSA é a autoridade estatal que emite o certificado veterinário internacional para os animais que saem do Azerbaijão, por meio da sua janela única de exportação."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Azerbaijan with your dog", fr: "Voyager en Azerbaïdjan avec ton chien", es: "Viajar a Azerbaiyán con tu perro", pt: "Viajar para o Azerbaijão com seu cachorro" }
  intro:
    en: >-
      Azerbaijan is not part of the EU and is not a member of the Eurasian Economic Union (EAEU): it
      applies its own national scheme through the Azerbaijan Food Safety Agency (AQTA / AFSA), the
      country's competent veterinary authority, and the State Customs Committee. A dog is treated as a
      good under state veterinary control, so it must travel with an official international veterinary
      health certificate and be presented at a border veterinary control point on arrival. AQTA has also
      approved a national veterinary passport form for dogs, cats and other pets. What you prepare
      depends heavily on your dog's country of departure and travel history. Several key parameters
      (microchip, exact rabies-vaccination timing, any antibody test, minimum age) are not published in
      an openly accessible AQTA document, so this guide flags them clearly and directs you to confirm the
      current requirements with AQTA before you book.
    fr: >-
      L'Azerbaïdjan ne fait pas partie de l'UE et n'est pas membre de l'Union économique eurasiatique
      (UEEA) : il applique son propre régime national via l'Agence de sécurité alimentaire d'Azerbaïdjan
      (AQTA / AFSA), autorité vétérinaire compétente du pays, et le Comité d'État des douanes. Un chien
      est considéré comme une marchandise sous contrôle vétérinaire d'État : il doit voyager avec un
      certificat sanitaire vétérinaire international officiel et être présenté à un poste de contrôle
      vétérinaire frontalier à l'arrivée. L'AQTA a également approuvé un modèle national de passeport
      vétérinaire pour les chiens, chats et autres animaux de compagnie. Ce qu'il faut préparer dépend
      fortement du pays de départ et de l'historique de voyage. Plusieurs paramètres clés (puce, calendrier
      exact de la vaccination antirabique, éventuel titrage, âge minimum) ne sont pas publiés dans un
      document AQTA librement accessible ; ce guide les signale et tu invite à confirmer les exigences
      en vigueur auprès de l'AQTA avant de réserver.
    es: >-
      Azerbaiyán no forma parte de la UE ni es miembro de la Unión Económica Euroasiática (UEEA):
      aplica su propio régimen nacional a través de la Agencia de Seguridad Alimentaria de Azerbaiyán
      (AQTA / AFSA), la autoridad veterinaria competente del país, y el Comité Estatal de Aduanas. Un
      perro se considera una mercancía bajo control veterinario estatal, por lo que debe viajar con un
      certificado sanitario veterinario internacional oficial y presentarse en un puesto de control
      veterinario fronterizo a la llegada. AQTA también ha aprobado un modelo nacional de pasaporte
      veterinario para perros, gatos y otras mascotas. Lo que debes preparar depende en gran medida del
      país de salida de tu perro y de su historial de viajes. Varios parámetros clave (microchip,
      calendario exacto de la vacunación antirrábica, cualquier prueba de titulación, edad mínima) no
      están publicados en un documento de AQTA de acceso abierto, por lo que esta guía los señala
      claramente y te invita a confirmar los requisitos vigentes con AQTA antes de reservar.

    pt: "O Azerbaijão não faz parte da UE nem é membro da União Econômica Eurasiática (UEE): ele aplica seu próprio regime nacional por meio da Agência de Segurança Alimentar do Azerbaijão (AQTA/AFSA), a autoridade veterinária competente do país, e do Comitê Estatal de Alfândegas. Um cachorro é tratado como mercadoria sob controle veterinário estatal, então precisa viajar com um atestado de saúde veterinário internacional oficial e ser apresentado em um posto de controle veterinário de fronteira na chegada. A AQTA também aprovou um modelo nacional de passaporte veterinário para cachorros, gatos e outros animais de estimação. O que você precisa preparar depende muito do país de partida e do histórico de viagens do seu cachorro. Vários parâmetros-chave (microchip, prazo exato da vacinação antirrábica, eventual teste sorológico, idade mínima) não são publicados em nenhum documento da AQTA de acesso aberto, então este guia os sinaliza claramente e orienta você a confirmar as exigências vigentes com a AQTA antes de reservar."
difficulty:
  level: moderate
  label: { en: "Moderate (state veterinary control; some parameters not officially published)", fr: "Modéré (contrôle vétérinaire d'État ; certains paramètres non publiés)", es: "Moderado (control veterinario estatal; algunos parámetros no publicados oficialmente)", pt: "Moderado (controle veterinário estatal; alguns parâmetros não publicados oficialmente)" }

prepTime:
  eu:
    en: "From a country with a recognised veterinary certificate system and up-to-date vaccinations: allow a few weeks to obtain and have the official veterinary health certificate endorsed by the exporting country's competent authority."
    fr: "Depuis un pays disposant d'un système reconnu de certification vétérinaire et vaccins à jour : compte quelques semaines pour obtenir et faire viser le certificat sanitaire vétérinaire officiel par l'autorité compétente du pays exportateur."
    es: "Desde un país con un sistema reconocido de certificación veterinaria y vacunas al día: cuenta con unas semanas para obtener y hacer refrendar el certificado sanitario veterinario oficial por la autoridad competente del país exportador."
    pt: "De um país com sistema reconhecido de certificação veterinária e vacinas em dia: conte algumas semanas para obter e fazer endossar o atestado de saúde veterinário oficial junto à autoridade competente do país exportador."
  listed:
    en: "Standard case — one pet dog accompanying its owner for personal use: several weeks to arrange the certificate and confirm the exact conditions with AQTA, as AQTA does not publish a consumer-facing pet-import checklist."
    fr: "Cas standard — un chien de compagnie accompagnant son propriétaire à titre personnel : plusieurs semaines pour préparer le certificat et confirmer les conditions exactes auprès de l'AQTA, qui ne publie pas de check-list grand public pour l'import d'animaux."
    es: "Caso estándar — un perro de compañía que acompaña a su propietario para uso personal: varias semanas para preparar el certificado y confirmar las condiciones exactas con AQTA, ya que AQTA no publica una lista de comprobación para el público sobre la importación de mascotas."
    pt: "Caso padrão — um cachorro de companhia acompanhando seu dono para uso pessoal: várias semanas para providenciar o certificado e confirmar as condições exatas com a AQTA, já que a AQTA não publica uma lista de exigências voltada ao público para a importação de animais."
  nonListed:
    en: "From a higher-risk origin, or where advance coordination is needed: potentially longer — contact AQTA in advance to confirm whether prior notification, additional tests or specific conditions apply to your route."
    fr: "Depuis une origine à risque plus élevé, ou si une coordination préalable est nécessaire : potentiellement plus long — contacte l'AQTA à l'avance pour vérifier si une notification préalable, des tests supplémentaires ou des conditions spécifiques s'appliquent à ton itinéraire."
    es: "Desde un origen de mayor riesgo, o cuando se necesita coordinación previa: potencialmente más largo — contacta con AQTA con antelación para comprobar si a tu ruta se le aplican una notificación previa, pruebas adicionales o condiciones específicas."
    pt: "De uma origem de risco mais alto, ou quando é preciso coordenação prévia: potencialmente mais longo — contate a AQTA com antecedência para confirmar se notificação prévia, exames adicionais ou condições específicas se aplicam à sua rota."

