# Country Entry Guide — Cambodia (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
# Cambodia is NOT in the EU. It runs its own national scheme under the Law on Animal Health
# and Production, administered by the General Directorate of Animal Health and Production
# (GDAHP) of the Ministry of Agriculture, Forestry and Fisheries (MAFF): a MAFF/GDAHP import
# permission/licence must be obtained in advance -> an official veterinary/sanitary certificate
# is issued by the exporting country's competent authority -> the animal is inspected by the
# GDAHP animal-health checkpoint at the international airport of entry, alongside customs.
# There are NO animal quarantine stations in Cambodia — only animal checkpoints (WOAH/GDAHP).
# Cambodia is rabies-endemic (WOAH/WHO) and publishes very little pet-specific, stable guidance:
# microchip, exact rabies timing, antibody test, parasite treatment and minimum age are NOT
# published in a verifiable official source and are marked Unknown / Non communiqué below.
# Legal basis: Law on Animal Health and Production (Royal Decree NS/RK/0116/003);
# Sub-Decree No.16 (13 March 2003) on Sanitary Inspection of Animals and Animal Products;
# Prakas/Notification No.178 (18 May 2009); Notification No.3525 on requirements for importing
# live animals, meat and animal products. The eu/listed/nonListed slots are repurposed to
# Cambodia's origin-risk tiers: eu = compliant dog from a low-risk origin (standard path);
# listed = rabies-endemic / higher-risk origin (extra documentation and checks likely);
# nonListed = origin affected by a listed animal infectious disease (import prohibited).
id: country_kh
iso2: "KH"
name: { en: "Cambodia", fr: "Cambodge", es: "Camboya", pt: "Camboja" }
region: { en: "Asia", fr: "Asie", es: "Asia", pt: "Ásia" }


regime: non_listed
exit:
  authority: GDAHP
  authorityUrl: https://maff.gov.kh
  intro:
    en: "Cambodia is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the General Directorate of Animal Health and Production (GDAHP)."
    fr: "Le Cambodge est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par la General Directorate of Animal Health and Production (GDAHP)."
    es: "Camboya no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por la General Directorate of Animal Health and Production (GDAHP)."
    pt: "O Camboja é um país não listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para retornar à UE — além de um atestado de saúde de exportação endossado pela General Directorate of Animal Health and Production (GDAHP)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "GDAHP veterinary officers issue and endorse the export health certificate; apply before booking travel."
        fr: "Les vétérinaires officiels de la GDAHP délivrent et visent le certificat sanitaire d'export ; fais la demande avant de réserver le voyage."
        es: "Los veterinarios oficiales de la GDAHP emiten y refrendan el certificado sanitario de exportación; solicítalo antes de reservar el viaje."
        pt: "Os veterinários oficiais da GDAHP emitem e endossam o atestado de saúde de exportação; solicite antes de reservar a viagem."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Cambodia with your dog", fr: "Voyager au Cambodge avec ton chien", es: "Viajar a Camboya con tu perro", pt: "Viajar para o Camboja com seu cachorro" }
  intro:
    en: >-
      Cambodia allows dogs to enter, but it runs its own national scheme under the Law on Animal
      Health and Production — not the EU framework. Imports are administered by the General
      Directorate of Animal Health and Production (GDAHP) of the Ministry of Agriculture, Forestry
      and Fisheries (MAFF). In principle you must obtain an advance import permission/licence from
      MAFF through the GDAHP, travel with an official veterinary (sanitary) certificate issued by
      the competent authority of the exporting country, and present your dog to the GDAHP
      animal-health checkpoint at the international airport of entry, alongside customs. There are
      no animal quarantine stations in Cambodia — only animal checkpoints. Cambodia is a
      rabies-endemic country and publishes little detailed, stable pet-specific guidance, so several
      points (microchip, exact rabies timing, parasite treatment, minimum age) must be confirmed
      directly with the GDAHP and a veterinarian before you book.
    fr: >-
      Le Cambodge autorise l'entrée des chiens, mais applique son propre régime national au titre
      de la loi sur la santé et la production animales — et non le cadre européen. Les importations
      sont gérées par la Direction générale de la santé et de la production animales (GDAHP) du
      Ministère de l'Agriculture, des Forêts et de la Pêche (MAFF). En principe, tu dois obtenir
      au préalable une autorisation/licence d'importation du MAFF via la GDAHP, voyager avec un
      certificat vétérinaire (sanitaire) officiel délivré par l'autorité compétente du pays d'export,
      et présenter ton chien au point de contrôle sanitaire animal de la GDAHP à l'aéroport
      international d'entrée, en même temps qu'à la douane. Il n'existe pas de stations de quarantaine
      animale au Cambodge — seulement des points de contrôle animaliers. Le Cambodge est un pays
      d'endémie rabique et publie peu d'informations détaillées et stables propres aux animaux de
      compagnie ; plusieurs points (puce, délai exact de vaccination antirabique, traitement
      antiparasitaire, âge minimum) doivent être confirmés directement auprès de la GDAHP et d'un
      vétérinaire avant de réserver.
    es: >-
      Camboya permite la entrada de perros, pero aplica su propio régimen nacional en virtud de la
      Ley de Sanidad y Producción Animal — no el marco de la UE. Las importaciones las gestiona la
      Dirección General de Sanidad y Producción Animal (GDAHP) del Ministerio de Agricultura,
      Bosques y Pesca (MAFF). En principio, debes obtener con antelación un permiso/licencia de
      importación del MAFF a través de la GDAHP, viajar con un certificado veterinario (sanitario)
      oficial expedido por la autoridad competente del país exportador, y presentar a tu perro en el
      punto de control sanitario animal de la GDAHP en el aeropuerto internacional de entrada, junto
      con la aduana. No existen estaciones de cuarentena animal en Camboya — solo puntos de control
      animal. Camboya es un país de endemia rábica y publica pocas orientaciones detalladas y
      estables específicas para mascotas, por lo que varios puntos (microchip, plazo exacto de la
      vacunación antirrábica, tratamiento antiparasitario, edad mínima) deben confirmarse
      directamente con la GDAHP y un veterinario antes de reservar.

    pt: "O Camboja permite a entrada de cachorros, mas aplica seu próprio esquema nacional sob a Law on Animal Health and Production — e não o marco da UE. As importações são administradas pela General Directorate of Animal Health and Production (GDAHP), do Ministry of Agriculture, Forestry and Fisheries (MAFF). Em princípio, você precisa obter uma permissão/licença de importação prévia junto ao MAFF, por meio da GDAHP, viajar com um certificado veterinário (sanitário) oficial emitido pela autoridade competente do país exportador, e apresentar o seu cachorro ao posto de controle sanitário animal da GDAHP no aeroporto internacional de entrada, junto com a alfândega. Não há estações de quarentena animal no Camboja — apenas postos de controle animal. O Camboja é um país endêmico de raiva e publica pouca orientação detalhada e estável específica para animais de estimação, portanto vários pontos (microchip, momento exato da vacinação antirrábica, tratamento antiparasitário, idade mínima) precisam ser confirmados diretamente com a GDAHP e um veterinário antes de você reservar."
difficulty:
  level: difficult
  label: { en: "Difficult — advance MAFF/GDAHP permission and limited published guidance", fr: "Difficile — autorisation préalable MAFF/GDAHP et peu d'informations publiées", es: "Difícil — permiso previo de MAFF/GDAHP y orientación publicada limitada", pt: "Difícil — permissão prévia do MAFF/GDAHP e orientação publicada limitada" }

prepTime:
  eu:
    en: "Compliant dog from a low-risk origin: plan several weeks — request MAFF/GDAHP import permission in advance, then obtain an official veterinary (sanitary) certificate from the exporting authority shortly before travel. Exact lead times are not published; confirm with the GDAHP."
    fr: "Chien conforme depuis une origine à faible risque : prévois plusieurs semaines — demande au préalable l'autorisation d'importation MAFF/GDAHP, puis obtiens un certificat vétérinaire (sanitaire) officiel de l'autorité d'export peu avant le voyage. Les délais exacts ne sont pas publiés ; confirme avec la GDAHP."
    es: "Perro conforme desde un origen de bajo riesgo: prevé varias semanas — solicita con antelación el permiso de importación MAFF/GDAHP y luego obtén un certificado veterinario (sanitario) oficial de la autoridad exportadora poco antes del viaje. Los plazos exactos no están publicados; confírmalos con la GDAHP."
    pt: "Cachorro em conformidade vindo de uma origem de baixo risco: planeje várias semanas — solicite a permissão de importação do MAFF/GDAHP com antecedência, depois obtenha um certificado veterinário (sanitário) oficial da autoridade exportadora pouco antes da viagem. Os prazos exatos não são publicados; confirme com a GDAHP."
  listed:
    en: "Rabies-endemic or higher-risk origin: allow extra time — additional documentation, sampling or checks may be requested at the airport animal-health checkpoint. Exact requirements are not published; confirm with the GDAHP before booking."
    fr: "Origine d'endémie rabique ou à risque plus élevé : prévois du temps supplémentaire — documents, prélèvements ou contrôles additionnels possibles au point de contrôle sanitaire de l'aéroport. Les exigences exactes ne sont pas publiées ; confirme avec la GDAHP avant de réserver."
    es: "Origen de endemia rábica o de mayor riesgo: prevé tiempo adicional — pueden solicitarse documentos, muestras o controles adicionales en el punto de control sanitario del aeropuerto. Los requisitos exactos no están publicados; confírmalos con la GDAHP antes de reservar."
    pt: "Origem endêmica de raiva ou de risco mais alto: reserve tempo extra — documentação adicional, coleta de amostras ou verificações podem ser solicitadas no posto de controle sanitário animal do aeroporto. As exigências exatas não são publicadas; confirme com a GDAHP antes de reservar."
  nonListed:
    en: "Prohibited origin: a dog from a country affected by a listed animal infectious disease cannot be imported at all — no timeline applies."
    fr: "Origine interdite : un chien venant d'un pays touché par une maladie animale infectieuse répertoriée ne peut pas être importé — aucun délai ne s'applique."
    es: "Origen prohibido: un perro procedente de un país afectado por una enfermedad animal infecciosa incluida en la lista no puede importarse en absoluto — no se aplica ningún plazo."
    pt: "Origem proibida: um cachorro vindo de um país afetado por uma doença infecciosa animal listada não pode ser importado de forma alguma — nenhum prazo se aplica."

