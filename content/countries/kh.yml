notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian and Cambodia's General Directorate of Animal Health and Production (GDAHP) can confirm the exact procedure for your individual dog."
    fr: "Seuls un vétérinaire et la Direction générale de la santé et de la production animales (GDAHP) du Cambodge peuvent confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario y la Dirección General de Sanidad y Producción Animal (GDAHP) de Camboya pueden confirmar el procedimiento exacto para tu perro."
    pt: "Só um veterinário e a General Directorate of Animal Health and Production (GDAHP) do Camboja podem confirmar o procedimento exato para o seu cachorro."
  - en: "Cambodia publishes little stable, pet-specific guidance: obtain MAFF/GDAHP import permission and confirm current requirements in writing before you book."
    fr: "Le Cambodge publie peu d'informations stables propres aux animaux de compagnie : obtiens l'autorisation d'importation MAFF/GDAHP et confirme les exigences en vigueur par écrit avant de réserver."
    es: "Camboya publica poca orientación estable específica para mascotas: obtén el permiso de importación MAFF/GDAHP y confirma por escrito los requisitos vigentes antes de reservar."
    pt: "O Camboja publica pouca orientação estável e específica para animais de estimação: obtenha a permissão de importação do MAFF/GDAHP e confirme por escrito as exigências atuais antes de reservar."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
