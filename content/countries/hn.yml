# Country Entry Guide — Honduras (bilingual EN/FR).
# Honduras is NOT in the EU. This encodes Honduras' own SENASA scheme.
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_hn
iso2: "HN"
name: { en: "Honduras", fr: "Honduras", es: "Honduras", pt: "Honduras" }
region: { en: "Central America", fr: "Amérique centrale", es: "América Central", pt: "América Central" }


regime: non_listed
exit:
  authority: SENASA
  authorityUrl: https://senasa.gob.hn/exportacion-de-animales-vivos/
  intro:
    en: "Honduras is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by SENASA (SAG)."
    fr: "Le Honduras est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par le SENASA (SAG)."
    es: "Honduras no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el SENASA (SAG)."
    pt: "Honduras é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação visado pelo SENASA (SAG)."
  steps:
    - timing: longlead
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      text:
        en: "Register on SENASA's online export platform (SECEH) and submit the export certificate request; SENASA reviews, approves and issues it (dedicated EU pet instructions are published)."
        fr: "Inscris-toi sur la plateforme d'export en ligne du SENASA (SECEH) et dépose la demande de certificat ; le SENASA l'examine, l'approuve et le délivre (instructions UE dédiées publiées)."
        es: "Regístrate en la plataforma de exportación en línea del SENASA (SECEH) y presenta la solicitud del certificado; el SENASA lo revisa, aprueba y emite (hay instrucciones específicas para la UE)."
        pt: "Cadastre-se na plataforma de exportação on-line do SENASA (SECEH) e envie o pedido de certificado de exportação; o SENASA analisa, aprova e emite o documento (há instruções específicas publicadas para animais de estimação com destino à UE)."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Honduras with your dog", fr: "Voyager au Honduras avec ton chien", es: "Viajar a Honduras con tu perro", pt: "Viajar para Honduras com seu cachorro" }
  intro:
    en: >-
      Honduras welcomes dogs, and its rules are handled by its own animal-health authority — the
      National Service for Agri-Food Health and Safety (SENASA, Servicio Nacional de Sanidad e
      Inocuidad Agroalimentaria), part of the Secretariat of Agriculture and Livestock (SAG), not the
      EU pet-passport system. A dog travelling with its owner needs an official export veterinary
      certificate issued in the country of departure, together with an up-to-date vaccination card
      showing current vaccines. When only one or two pets travel at a time, no advance SENASA import
      permit is required: the documents are presented to the quarantine authority at the customs point
      of entry, where a SENASA officer inspects the animal and charges a fixed inspection fee. What you
      must prepare still depends on your dog's country of departure and recent history, because the
      export certificate is issued by the veterinary authority of that country. This guide explains what
      to prepare before you book your flight.
    fr: >-
      Le Honduras accueille les chiens, et ses règles relèvent de sa propre autorité sanitaire animale —
      le Service national de santé et de sécurité agroalimentaires (SENASA, Servicio Nacional de Sanidad
      e Inocuidad Agroalimentaria), rattaché au Secrétariat de l'Agriculture et de l'Élevage (SAG), et
      non du système du passeport européen. Un chien voyageant avec son propriétaire a besoin d'un
      certificat vétérinaire officiel d'exportation établi dans le pays de départ, accompagné d'une
      cartilla de vaccination à jour indiquant des vaccins en cours de validité. Lorsque seuls un ou deux
      animaux voyagent à la fois, aucun permis d'importation préalable du SENASA n'est exigé : les
      documents sont présentés à l'autorité de quarantaine au poste de douane d'entrée, où un agent du
      SENASA inspecte l'animal et perçoit des frais d'inspection fixes. Ce qu'il faut préparer dépend tout
      de même du pays de départ et de l'historique récent du chien, car le certificat d'exportation est
      délivré par l'autorité vétérinaire de ce pays. Ce guide détaille quoi préparer avant de réserver.
    es: >-
      Honduras acoge a los perros, y sus normas las gestiona su propia autoridad de sanidad animal — el
      Servicio Nacional de Sanidad e Inocuidad Agroalimentaria (SENASA), dependiente de la Secretaría de
      Agricultura y Ganadería (SAG), y no el sistema del pasaporte europeo para mascotas. Un perro que
      viaja con su propietario necesita un certificado veterinario oficial de exportación expedido en el
      país de salida, junto con una cartilla de vacunación al día que muestre vacunas vigentes. Cuando
      solo viajan uno o dos animales a la vez, no se exige un permiso de importación previo del SENASA:
      los documentos se presentan a la autoridad de cuarentena en el punto aduanero de entrada, donde un
      agente del SENASA inspecciona al animal y cobra una tasa de inspección fija. Lo que debes preparar
      depende igualmente del país de salida y del historial reciente de tu perro, porque el certificado
      de exportación lo expide la autoridad veterinaria de ese país. Esta guía explica qué preparar antes
      de reservar tu vuelo.

    pt: "Honduras recebe cachorros, e suas regras são conduzidas pela própria autoridade de saúde animal do país — o Serviço Nacional de Sanidade e Inocuidade Agroalimentar (SENASA, Servicio Nacional de Sanidad e Inocuidad Agroalimentaria), vinculado à Secretaria de Agricultura e Pecuária (SAG), e não o sistema do passaporte europeu para animais. Um cachorro que viaja com o dono precisa de um certificado veterinário oficial de exportação emitido no país de partida, junto com uma carteira de vacinação em dia mostrando vacinas vigentes. Quando viajam apenas um ou dois animais por vez, nenhuma autorização de importação prévia do SENASA é exigida: os documentos são apresentados à autoridade de quarentena no ponto aduaneiro de entrada, onde um agente do SENASA inspeciona o animal e cobra uma taxa de inspeção fixa. O que você tem de preparar também depende do país de partida e do histórico recente do seu cachorro, porque o certificado de exportação é emitido pela autoridade veterinária desse país. Este guia explica o que preparar antes de você reservar o voo."
difficulty:
  level: easy
  label: { en: "Easy — one export certificate, no prior permit for one or two pets", fr: "Facile — un certificat d'exportation, sans permis préalable pour un ou deux animaux", es: "Fácil — un certificado de exportación, sin permiso previo para uno o dos animales", pt: "Fácil — um certificado de exportação, sem autorização prévia para um ou dois animais" }

prepTime:
  eu:
    en: "A few days if the vaccination card is already up to date — you mainly need an official export veterinary certificate from the country of departure plus the current vaccination card."
    fr: "Quelques jours si la cartilla de vaccination est déjà à jour — il faut surtout un certificat vétérinaire officiel d'exportation du pays de départ et la cartilla de vaccination en cours de validité."
    es: "Unos días si la cartilla de vacunación ya está al día — sobre todo necesitas un certificado veterinario oficial de exportación del país de salida y la cartilla de vacunación vigente."
    pt: "Alguns dias se a carteira de vacinação já estiver em dia — você precisa basicamente de um certificado veterinário oficial de exportação do país de partida e da carteira de vacinação vigente."
  listed:
    en: "From the United States: allow time for a USDA-accredited veterinarian to prepare the export health certificate and the vaccination record; APHIS endorsement is not required by Honduras for pets."
    fr: "Depuis les États-Unis : prévois du temps pour qu'un vétérinaire agréé USDA établisse le certificat sanitaire d'exportation et le carnet de vaccination ; le visa de l'APHIS n'est pas exigé par le Honduras pour les animaux de compagnie."
    es: "Desde Estados Unidos: prevé tiempo para que un veterinario acreditado por el USDA prepare el certificado sanitario de exportación y el registro de vacunación; Honduras no exige el refrendo de APHIS para las mascotas."
    pt: "Dos Estados Unidos: reserve tempo para que um veterinário credenciado pelo USDA prepare o atestado de saúde de exportação e o registro de vacinação; Honduras não exige o endosso do APHIS para animais de estimação."
  nonListed:
    en: "Longer if three or more pets travel together: you then need a SENASA Zoosanitary Import Permit and a fiduciary-quarantine certificate before arrival, requested through the SENASA import platform."
    fr: "Plus long si trois animaux ou plus voyagent ensemble : il faut alors un Permis zoosanitaire d'importation du SENASA et une attestation de quarantaine fiduciaire avant l'arrivée, demandés via la plateforme d'importation du SENASA."
    es: "Más largo si viajan juntos tres animales o más: entonces necesitas un Permiso Zoosanitario de Importación del SENASA y un certificado de cuarentena fiduciaria antes de la llegada, solicitados a través de la plataforma de importación del SENASA."
    pt: "Mais longo se viajarem três animais ou mais juntos: aí você precisa de uma Autorização Zoossanitária de Importação do SENASA e de um certificado de quarentena fiduciária antes da chegada, solicitados pela plataforma de importação do SENASA."

