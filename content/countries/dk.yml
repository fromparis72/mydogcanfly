origin:
  scheme: eu
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate and normally no border check. Countries on EU terms (Norway, Switzerland, Iceland, Andorra, San Marino, Monaco, Liechtenstein, Vatican, Faroe Islands, Gibraltar, Greenland) follow the same simplified route."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire et normalement pas de contrôle frontalier. Les pays sous conditions UE (Norvège, Suisse, Islande, Andorre, Saint-Marin, Monaco, Liechtenstein, Vatican, Îles Féroé, Gibraltar, Groenland) suivent le même parcours simplifié."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario y normalmente sin control fronterizo. Los países en condiciones equivalentes a la UE (Noruega, Suiza, Islandia, Andorra, San Marino, Mónaco, Liechtenstein, Vaticano, Islas Feroe, Gibraltar, Groenlandia) siguen la misma vía simplificada."
      pt: "Um cachorro vindo de outro país da UE precisa de um passaporte europeu para animais que comprove um microchip ISO válido e uma vacinação antirrábica em dia. Sem teste sorológico, sem certificado sanitário e, normalmente, sem controle de fronteira. Os países em condições equivalentes às da UE (Noruega, Suíça, Islândia, Andorra, San Marino, Mônaco, Liechtenstein, Vaticano, Ilhas Faroé, Gibraltar, Groenlândia) seguem a mesma via simplificada."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination and an EU animal health certificate endorsed by the official vet of the country of dispatch. No antibody test is required; enter through a Danish travellers' point of entry (Copenhagen, Billund or Aalborg airport)."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire européen visé par le vétérinaire officiel du pays d'expédition. Pas de titrage ; entre par un point d'entrée voyageurs danois (aéroport de Copenhague, Billund ou Aalborg)."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal de la UE refrendado por el veterinario oficial del país de expedición. No se exige prueba de titulación; entra por un punto de entrada de viajeros danés (aeropuerto de Copenhague, Billund o Aalborg)."
      pt: "Vindo de um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Japão, Austrália e outros), seu cachorro precisa de microchip, vacinação antirrábica válida e certificado sanitário europeu endossado pelo veterinário oficial do país de expedição. Não é exigido teste sorológico; entre por um ponto de entrada de viajantes dinamarquês (aeroporto de Copenhague, Billund ou Aalborg)."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-approved laboratory, then a compulsory 3-month wait before entry. An endorsed EU animal health certificate is also required, and entry must be through a Danish travellers' point of entry."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen visé est également requis, et l'entrée doit se faire par un point d'entrée voyageurs danois."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exige un certificado sanitario animal de la UE refrendado, y la entrada debe hacerse por un punto de entrada de viajeros danés."
      pt: "Vindo de um país não listado (de risco), acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório aprovado pela UE e, depois, 3 meses obrigatórios de espera antes da entrada. Também é exigido um certificado sanitário europeu endossado, e a entrada precisa ser feita por um ponto de entrada de viajantes dinamarquês."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Denmark depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien au Danemark dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Dinamarca depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega à Dinamarca depende de onde você embarcou."
  points:
    - from: eu
      en: "From another EU country: no systematic border check — keep the EU pet passport with you."
      fr: "Depuis un autre pays de l'UE : pas de contrôle systématique — garde le passeport européen sur toi."
      es: "Desde otro país de la UE: sin control fronterizo sistemático — lleva contigo el pasaporte europeo."
      pt: "De outro país da UE: sem controle de fronteira sistemático — leve o passaporte europeu com você."
    - from: non_eu
      en: "From outside the EU: enter only through Copenhagen (Kastrup), Billund or Aalborg airport, where customs check identity and documents on behalf of the Veterinary and Food Administration."
      fr: "Depuis hors UE : entre uniquement par l'aéroport de Copenhague (Kastrup), Billund ou Aalborg, où la douane contrôle identité et documents pour le compte de l'administration vétérinaire et alimentaire."
      es: "Desde fuera de la UE: entra únicamente por el aeropuerto de Copenhague (Kastrup), Billund o Aalborg, donde la aduana comprueba la identidad y los documentos por cuenta de la Administración Veterinaria y Alimentaria."
      pt: "Vindo de fora da UE: entre apenas pelo aeroporto de Copenhague (Kastrup), Billund ou Aalborg, onde a alfândega confere identidade e documentos em nome da Administração Veterinária e Alimentar."
    - en: "Entering from a non-EU country through any other airport or port is illegal; checks in Denmark are free of charge."
      fr: "Entrer depuis un pays hors UE par tout autre aéroport ou port est illégal ; les contrôles au Danemark sont gratuits."
      es: "Entrar desde un país de fuera de la UE por cualquier otro aeropuerto o puerto es ilegal; los controles en Dinamarca son gratuitos."
      pt: "Entrar vindo de um país fora da UE por qualquer outro aeroporto ou porto é ilegal; os controles na Dinamarca são gratuitos."
    - en: "Notifying the point of entry at least 24 hours before arrival makes the check easier."
      fr: "Prévenir le point d'entrée au moins 24 heures avant l'arrivée facilite le contrôle."
      es: "Avisar al punto de entrada al menos 24 horas antes de la llegada facilita el control."
      pt: "Avisar o ponto de entrada com pelo menos 24 horas de antecedência facilita o controle."
    - en: "If documents are missing or invalid, the authorities may order re-export, quarantine or, in the worst case, euthanasia — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, les autorités peuvent ordonner réexpédition, quarantaine ou, au pire, euthanasie — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, las autoridades pueden ordenar la reexpedición, la cuarentena o, en el peor de los casos, la eutanasia — a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, as autoridades podem determinar a reexportação, a quarentena ou, na pior das hipóteses, a eutanásia — às custas do dono."
    - en: "Any of the 13 banned breeds (or a cross) is refused entry, unless covered by the pre-2010 transitional rules; only transit without unnecessary stops is tolerated."
      fr: "Toute race parmi les 13 interdites (ou un croisement) est refusée à l'entrée, sauf si elle relève des règles transitoires antérieures à 2010 ; seul le transit sans arrêt inutile est toléré."
      es: "Cualquiera de las 13 razas prohibidas (o un cruce) es rechazada a la entrada, salvo que quede cubierta por las normas transitorias anteriores a 2010; solo se tolera el tránsito sin paradas innecesarias."
      pt: "Qualquer uma das 13 raças proibidas (ou um cruzamento) tem a entrada recusada, a não ser que esteja coberta pelas regras transitórias anteriores a 2010; só se tolera o trânsito sem paradas desnecessárias."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Denmark uses a banned-breed model under the Danish Act on Dogs (Hundeloven). Rather than permitting listed breeds under conditions, it prohibits 13 breeds outright. The ban applies to tourists and residents alike, and only a pedigree or descent evidence — not appearance — can prove a dog is not one of them."
    fr: "Le Danemark applique un modèle d'interdiction de races au titre de la loi danoise sur les chiens (Hundeloven). Plutôt que d'autoriser des races listées sous conditions, il interdit purement 13 races. L'interdiction vise aussi bien les touristes que les résidents, et seul un pedigree ou une preuve de filiation — pas l'apparence — peut établir qu'un chien n'en fait pas partie."
    es: "Dinamarca aplica un modelo de prohibición de razas en virtud de la Ley danesa sobre perros (Hundeloven). En lugar de permitir razas listadas bajo condiciones, prohíbe directamente 13 razas. La prohibición se aplica por igual a turistas y residentes, y solo un pedigrí o una prueba de filiación — no la apariencia — puede demostrar que un perro no es una de ellas."
    pt: "A Dinamarca adota um modelo de proibição de raças previsto na lei dinamarquesa sobre cães (Hundeloven). Em vez de permitir raças listadas sob condições, ela proíbe pura e simplesmente 13 raças. A proibição vale igualmente para turistas e residentes, e só um pedigree ou uma prova de ascendência — não a aparência — pode comprovar que um cachorro não é uma delas."
  cat1:
    en: "Prohibited breeds (import, keeping and breeding banned, crosses included, no exemption): 1) Pit Bull Terrier, 2) Tosa Inu, 3) American Staffordshire Terrier, 4) Fila Brasileiro, 5) Dogo Argentino, 6) American Bulldog, 7) Boerboel, 8) Kangal, 9) Central Asian Shepherd Dog (Ovtcharka), 10) Caucasian Shepherd Dog (Ovtcharka), 11) South Russian Shepherd Dog (Ovtcharka), 12) Tornjak, 13) Sarplaninac. Bringing one of these dogs into Denmark is prohibited under the Act on Dogs, §§1 a-b."
    fr: "Races interdites (importation, détention et élevage interdits, croisements inclus, sans dérogation) : 1) Pit Bull Terrier, 2) Tosa Inu, 3) American Staffordshire Terrier, 4) Fila Brasileiro, 5) Dogo Argentino, 6) American Bulldog, 7) Boerboel, 8) Kangal, 9) Berger d'Asie centrale (Ovtcharka), 10) Berger du Caucase (Ovtcharka), 11) Berger de Russie méridionale (Ovtcharka), 12) Tornjak, 13) Sarplaninac. Faire entrer l'un de ces chiens au Danemark est interdit au titre de la loi sur les chiens, §§1 a-b."
    es: "Razas prohibidas (importación, tenencia y cría prohibidas, cruces incluidos, sin excepción): 1) Pit Bull Terrier, 2) Tosa Inu, 3) American Staffordshire Terrier, 4) Fila Brasileiro, 5) Dogo Argentino, 6) American Bulldog, 7) Boerboel, 8) Kangal, 9) Perro pastor de Asia Central (Ovtcharka), 10) Perro pastor del Cáucaso (Ovtcharka), 11) Perro pastor de Rusia meridional (Ovtcharka), 12) Tornjak, 13) Sarplaninac. Introducir uno de estos perros en Dinamarca está prohibido en virtud de la Ley sobre perros, §§1 a-b."
    pt: "Raças proibidas (importação, posse e criação proibidas, cruzamentos incluídos, sem exceção): 1) Pit Bull Terrier, 2) Tosa Inu, 3) American Staffordshire Terrier, 4) Fila Brasileiro, 5) Dogo Argentino, 6) American Bulldog, 7) Boerboel, 8) Kangal, 9) Central Asian Shepherd Dog (Ovtcharka), 10) Caucasian Shepherd Dog (Ovtcharka), 11) South Russian Shepherd Dog (Ovtcharka), 12) Tornjak, 13) Sarplaninac. Levar um desses cachorros para a Dinamarca é proibido pela lei sobre cães, §§1 a-b."
  cat2:
    en: "Denmark has no permissive second category: there is no ownership permit or muzzle scheme that allows a banned breed to be imported normally. The only exceptions are transitional — a dog acquired before 17 March 2010 may be kept and brought in (on a lead ≤2 m and muzzled in public), but this never applies to Pit Bull Terrier or Tosa Inu, banned since 1991. A banned breed may transit Denmark only if it does not leave the vehicle except for brief necessary stops and there are no unnecessary stops."
    fr: "Le Danemark n'a pas de seconde catégorie permissive : il n'existe pas de permis de détention ou de régime de muselière autorisant l'importation normale d'une race interdite. Les seules exceptions sont transitoires — un chien acquis avant le 17 mars 2010 peut être détenu et introduit (laisse ≤2 m et muselière en public), mais jamais le Pit Bull Terrier ni le Tosa Inu, interdits depuis 1991. Une race interdite ne peut transiter par le Danemark que si elle ne quitte pas le véhicule, hormis de brefs arrêts nécessaires, et sans arrêt inutile."
    es: "Dinamarca no tiene una segunda categoría permisiva: no existe ningún permiso de tenencia ni régimen de bozal que permita importar normalmente una raza prohibida. Las únicas excepciones son transitorias — un perro adquirido antes del 17 de marzo de 2010 puede tenerse e introducirse (con correa ≤2 m y bozal en la vía pública), pero esto nunca se aplica al Pit Bull Terrier ni al Tosa Inu, prohibidos desde 1991. Una raza prohibida solo puede transitar por Dinamarca si no sale del vehículo salvo para breves paradas necesarias y sin paradas innecesarias."
    pt: "A Dinamarca não tem uma segunda categoria permissiva: não existe licença de posse nem regime de focinheira que permita importar normalmente uma raça proibida. As únicas exceções são transitórias — um cachorro adquirido antes de 17 de março de 2010 pode ser mantido e levado ao país (com guia de ≤2 m e focinheira em público), mas isso nunca vale para o Pit Bull Terrier nem para o Tosa Inu, proibidos desde 1991. Uma raça proibida só pode transitar pela Dinamarca se não sair do veículo, salvo em breves paradas necessárias, e sem nenhuma parada desnecessária."
  note:
    en: "If your dog resembles one of the 13 breeds, carry documentation of its breed and, for a pre-2010 dog, proof of the acquisition date. For any doubt, contact the Danish Veterinary, Food, Agriculture and Fisheries Agency (Fødevarestyrelsen)."
    fr: "Si ton chien ressemble à l'une des 13 races, munis-toi d'une preuve de sa race et, pour un chien antérieur à 2010, d'une preuve de la date d'acquisition. En cas de doute, contacte l'Administration vétérinaire, alimentaire, agricole et de la pêche (Fødevarestyrelsen)."
    es: "Si tu perro se parece a una de las 13 razas, lleva documentación de su raza y, para un perro anterior a 2010, una prueba de la fecha de adquisición. En caso de duda, contacta con la Administración Veterinaria, Alimentaria, Agrícola y de Pesca (Fødevarestyrelsen)."
    pt: "Se seu cachorro se parece com uma das 13 raças, leve a documentação da raça dele e, no caso de um cachorro anterior a 2010, o comprovante da data de aquisição. Em caso de dúvida, entre em contato com a Agência Veterinária, Alimentar, Agrícola e de Pesca da Dinamarca (Fødevarestyrelsen)."

checklist:
  - en: "Confirm your dog is not one of the 13 banned breeds (or a cross)"
    fr: "Vérifie que ton chien n'est pas l'une des 13 races interdites (ni un croisement)"
    es: "Confirma que tu perro no es una de las 13 razas prohibidas (ni un cruce)"
    pt: "Confirme que seu cachorro não é uma das 13 raças proibidas (nem um cruzamento)"
  - en: "Microchip (ISO) implanted before the rabies vaccination"
    fr: "Puce (ISO) posée avant la vaccination antirabique"
    es: "Microchip (ISO) implantado antes de la vacunación antirrábica"
    pt: "Microchip (ISO) implantado antes da vacinação antirrábica"
  - en: "Valid rabies vaccination (dog ≥12 weeks at the shot, +21 days)"
    fr: "Vaccination antirabique valide (chien ≥12 semaines, +21 jours)"
    es: "Vacunación antirrábica válida (perro ≥12 semanas en la vacuna, +21 días)"
    pt: "Vacinação antirrábica válida (cachorro com ≥12 semanas na data da vacina, +21 dias)"
  - en: "Rabies antibody test — non-listed countries only"
    fr: "Titrage antirabique — pays non listés uniquement"
    es: "Prueba de titulación de rabia — solo países no listados"
    pt: "Teste sorológico antirrábico — apenas para países não listados"
  - en: "EU pet passport (EU origin) or endorsed EU health certificate (non-EU origin)"
    fr: "Passeport européen (origine UE) ou certificat sanitaire UE visé (hors UE)"
    es: "Pasaporte europeo (origen UE) o certificado sanitario UE refrendado (origen fuera de la UE)"
    pt: "Passaporte europeu (origem na UE) ou certificado sanitário europeu endossado (origem fora da UE)"
  - en: "Enter via Copenhagen, Billund or Aalborg airport if arriving from outside the EU"
    fr: "Entrer par l'aéroport de Copenhague, Billund ou Aalborg si arrivée hors UE"
    es: "Entra por el aeropuerto de Copenhague, Billund o Aalborg si llegas desde fuera de la UE"
    pt: "Entrar pelo aeroporto de Copenhague, Billund ou Aalborg se a chegada for de fora da UE"
  - en: "Register in the Danish Dog Register if the stay exceeds 4 weeks"
    fr: "Inscription au Registre danois des chiens si le séjour dépasse 4 semaines"
    es: "Inscríbete en el Registro danés de perros si la estancia supera las 4 semanas"
    pt: "Inscrever o cachorro no Registro Dinamarquês de Cães se a estadia passar de 4 semanas"
  - en: "Suitable travel crate if travelling in the hold"
    fr: "Caisse de transport adaptée si voyage en soute"
    es: "Jaula de transporte adecuada si viaja en bodega"
    pt: "Caixa de transporte se a viagem for no porão"

