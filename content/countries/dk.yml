notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro."
    pt: "Só um médico-veterinário pode confirmar o procedimento exato para o seu cachorro."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Denmark (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — le Danemark (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Dinamarca (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — a Dinamarca (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — Denmark", fr: "Pays de destination — Danemark", es: "País de destino — Dinamarca", pt: "País de destino — Dinamarca" }
      text:
        en: "Denmark applies the EU pet-movement framework: an ISO microchip and a valid rabies vaccination are always required, and no tapeworm treatment is needed. Denmark also bans 13 dog breeds and their crosses from entry."
        fr: "Le Danemark applique le cadre européen : puce ISO et vaccination antirabique valide toujours exigées, et aucun traitement contre l'échinococcose n'est requis. Le Danemark interdit aussi l'entrée de 13 races de chiens et de leurs croisements."
        es: "Dinamarca aplica el marco europeo de movimiento de animales: siempre se exigen un microchip ISO y una vacunación antirrábica válida, y no se necesita tratamiento contra la tenia. Dinamarca también prohíbe la entrada de 13 razas de perros y sus cruces."
        pt: "A Dinamarca aplica o quadro europeu de circulação de animais de estimação: microchip ISO e vacinação antirrábica válida são sempre obrigatórios, e nenhum tratamento contra a tênia é exigido. A Dinamarca também proíbe a entrada de 13 raças de cachorros e de seus cruzamentos."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Whether your dog leaves from an EU country, a listed non-EU country or a non-listed country decides whether an antibody test and a health certificate are required."
        fr: "Que ton chien parte d'un pays de l'UE, d'un pays tiers listé ou d'un pays non listé détermine si un titrage et un certificat sanitaire sont exigés."
        es: "Que tu perro salga de un país de la UE, de un país tercero listado o de un país no listado determina si se exigen una prueba de titulación y un certificado sanitario."
        pt: "Partir de um país da UE, de um país listado fora da UE ou de um país não listado é o que define se o teste sorológico e o certificado sanitário são exigidos."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay in a rabies-risk country can trigger an antibody test even if you fly in from an exempt country. It is your dog's real origin and history that count — not only the last airport."
        fr: "Un séjour récent dans un pays à risque rabique peut imposer un titrage même si tu arrives d'un pays exempté. C'est l'origine réelle et l'historique du chien qui comptent — pas seulement l'aéroport de destination finale."
        es: "Una estancia reciente en un país con riesgo de rabia puede obligar a una prueba de titulación aunque llegues desde un país exento. Lo que cuenta es el origen y el historial reales de tu perro — no solo el último aeropuerto."
        pt: "Uma estadia recente em um país de risco de raiva pode acionar a exigência do teste sorológico mesmo que você chegue de um país isento. O que conta é a origem e o histórico reais do seu cachorro — não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Denmark's framework, then confirm your dog's exact origin, history and breed with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre danois, puis confirme l'origine, l'historique et la race exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Dinamarca y luego confirma el origen, el historial y la raza exactos de tu perro con tu veterinario."
    pt: "Leia então as exigências abaixo como o quadro dinamarquês, e confirme com seu veterinário a origem, o histórico e a raça exatos do seu cachorro."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Must be implanted before the rabies vaccination; ISO 11784/11785 (HDX or FDX-B).", fr: "Doit être posée avant la vaccination antirabique ; ISO 11784/11785 (HDX ou FDX-B).", es: "Debe implantarse antes de la vacunación antirrábica; ISO 11784/11785 (HDX o FDX-B).", pt: "Deve ser implantado antes da vacinação antirrábica; ISO 11784/11785 (HDX ou FDX-B)." }
    exceptions: { en: "A legible tattoo is accepted only if done before 3 July 2011.", fr: "Un tatouage lisible n'est accepté que s'il est antérieur au 3 juillet 2011.", es: "Un tatuaje legible solo se acepta si se hizo antes del 3 de julio de 2011.", pt: "Uma tatuagem legível só é aceita se tiver sido feita antes de 3 de julho de 2011." }
    ref: { en: "EU Reg. 576/2013; foedevarestyrelsen.dk", fr: "Règl. UE 576/2013 ; foedevarestyrelsen.dk", es: "Regl. UE 576/2013; foedevarestyrelsen.dk", pt: "Regulamento UE 576/2013; foedevarestyrelsen.dk" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Dog at least 12 weeks old at the shot; valid from 21 days after the primary vaccination.", fr: "Chien d'au moins 12 semaines ; valide 21 jours après la primo-vaccination.", es: "Perro de al menos 12 semanas en el momento de la vacuna; válida a partir de los 21 días de la primovacunación.", pt: "Cachorro com pelo menos 12 semanas na data da vacina; válida a partir de 21 dias após a primovacinação." }
    exceptions: { en: "The microchip must already be in place; no exemption from a valid rabies vaccination is possible.", fr: "La puce doit déjà être posée ; aucune dérogation à une vaccination antirabique valide n'est possible.", es: "El microchip debe estar ya implantado; no es posible ninguna excepción a una vacunación antirrábica válida.", pt: "O microchip já deve estar implantado; não existe nenhuma dispensa da vacinação antirrábica válida." }
    ref: { en: "EU Reg. 2020/688, Annex VII", fr: "Règl. UE 2020/688, annexe VII", es: "Regl. UE 2020/688, anexo VII", pt: "Regulamento UE 2020/688, anexo VII" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Non-listed origins only: blood ≥30 days after vaccination, ≥3 months before entry, result ≥0.5 IU/ml, EU-approved lab.", fr: "Pays non listés : sang ≥30 jours après le vaccin, ≥3 mois avant l'entrée, résultat ≥0,5 UI/ml, labo agréé UE.", es: "Solo orígenes no listados: sangre ≥30 días tras la vacuna, ≥3 meses antes de la entrada, resultado ≥0,5 UI/ml, laboratorio autorizado por la UE.", pt: "Apenas origens não listadas: sangue ≥30 dias após a vacinação, ≥3 meses antes da entrada, resultado ≥0,5 UI/ml, laboratório aprovado pela UE." }
    exceptions: { en: "Not required from the EU or from listed countries (US, Canada, UK, Switzerland, Japan, Australia…).", fr: "Non requis depuis l'UE ou les pays listés (USA, Canada, RU, Suisse, Japon, Australie…).", es: "No se exige desde la UE ni desde países listados (EE. UU., Canadá, RU, Suiza, Japón, Australia…).", pt: "Não exigido para quem vem da UE ou de países listados (EUA, Canadá, Reino Unido, Suíça, Japão, Austrália…)." }
    ref: { en: "EU Reg. 2020/692; foedevarestyrelsen.dk", fr: "Règl. UE 2020/692 ; foedevarestyrelsen.dk", es: "Regl. UE 2020/692; foedevarestyrelsen.dk", pt: "Regulamento UE 2020/692; foedevarestyrelsen.dk" }
  - item: { en: "EU pet passport", fr: "Passeport européen", es: "Pasaporte europeo para mascotas", pt: "Passaporte europeu para animais" }
    required: { en: "EU origins", fr: "Origines UE", es: "Orígenes de la UE", pt: "Origens na UE" }
    when: { en: "Issued by an EU vet; records the microchip and rabies vaccination.", fr: "Délivré par un vétérinaire de l'UE ; consigne la puce et la vaccination.", es: "Expedido por un veterinario de la UE; registra el microchip y la vacunación antirrábica.", pt: "Emitido por um veterinário da UE; registra o microchip e a vacinação antirrábica." }
    exceptions: { en: "Replaced by an animal health certificate for non-EU origins.", fr: "Remplacé par un certificat sanitaire pour les origines hors UE.", es: "Se sustituye por un certificado sanitario para orígenes fuera de la UE.", pt: "Substituído por um certificado sanitário quando a origem é de fora da UE." }
    ref: { en: "EU Reg. 577/2013; foedevarestyrelsen.dk", fr: "Règl. UE 577/2013 ; foedevarestyrelsen.dk", es: "Regl. UE 577/2013; foedevarestyrelsen.dk", pt: "Regulamento UE 577/2013; foedevarestyrelsen.dk" }
  - item: { en: "EU animal health certificate", fr: "Certificat sanitaire UE", es: "Certificado sanitario animal de la UE", pt: "Certificado sanitário europeu" }
    required: { en: "Non-EU origins", fr: "Origines hors UE", es: "Orígenes fuera de la UE", pt: "Origens fora da UE" }
    when: { en: "Issued/endorsed by the official vet of the country of dispatch before departure.", fr: "Établi/visé par le vétérinaire officiel du pays d'expédition avant départ.", es: "Expedido/refrendado por el veterinario oficial del país de expedición antes de la salida.", pt: "Emitido/endossado pelo veterinário oficial do país de expedição antes da partida." }
    exceptions: { en: "Not needed for EU origins (EU pet passport instead).", fr: "Inutile pour les origines UE (passeport européen à la place).", es: "No necesario para orígenes de la UE (en su lugar, el pasaporte europeo para mascotas).", pt: "Não é necessário para origens na UE (usa-se o passaporte europeu para animais)." }
    ref: { en: "EU Reg. 577/2013; foedevarestyrelsen.dk", fr: "Règl. UE 577/2013 ; foedevarestyrelsen.dk", es: "Regl. UE 577/2013; foedevarestyrelsen.dk", pt: "Regulamento UE 577/2013; foedevarestyrelsen.dk" }
  - item: { en: "Tapeworm (Echinococcus) treatment", fr: "Traitement échinococcose", es: "Tratamiento contra la tenia (Echinococcus)", pt: "Tratamento contra a tênia (Echinococcus)" }
    required: { en: "Not required", fr: "Non requis", es: "No obligatorio", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Only Finland, Ireland, Malta, N. Ireland and Norway require it — not Denmark.", fr: "Seuls la Finlande, l'Irlande, Malte, l'Irlande du Nord et la Norvège l'exigent — pas le Danemark.", es: "Solo lo exigen Finlandia, Irlanda, Malta, Irlanda del Norte y Noruega — no Dinamarca.", pt: "Só a Finlândia, a Irlanda, Malta, a Irlanda do Norte e a Noruega exigem — a Dinamarca não." }
    ref: { en: "European Commission — pet travel", fr: "Commission européenne — voyage animaux", es: "Comisión Europea — viaje de animales", pt: "Comissão Europeia — viagens com animais de estimação" }
  - item: { en: "Banned dog breeds", fr: "Races de chiens interdites", es: "Razas de perros prohibidas", pt: "Raças de cachorros proibidas" }
    required: { en: "13 breeds prohibited", fr: "13 races interdites", es: "13 razas prohibidas", pt: "13 raças proibidas" }
    when: { en: "Keeping, breeding and import of the 13 listed breeds and their crosses is prohibited; no exemption is possible.", fr: "La détention, l'élevage et l'importation des 13 races listées et de leurs croisements sont interdits ; aucune dérogation n'est possible.", es: "La tenencia, la cría y la importación de las 13 razas listadas y sus cruces están prohibidas; no es posible ninguna excepción.", pt: "A posse, a criação e a importação das 13 raças listadas e de seus cruzamentos são proibidas; nenhuma exceção é possível." }
    exceptions: { en: "Dogs acquired before 17 March 2010 may enter under transitional rules (lead ≤2 m and muzzle in public); this never covers Pit Bull Terrier or Tosa Inu.", fr: "Les chiens acquis avant le 17 mars 2010 peuvent entrer selon les règles transitoires (laisse ≤2 m et muselière en public) ; jamais le Pit Bull Terrier ni le Tosa Inu.", es: "Los perros adquiridos antes del 17 de marzo de 2010 pueden entrar según las normas transitorias (correa ≤2 m y bozal en la vía pública); esto nunca cubre al Pit Bull Terrier ni al Tosa Inu.", pt: "Cachorros adquiridos antes de 17 de março de 2010 podem entrar segundo as regras transitórias (guia de ≤2 m e focinheira em público); isso nunca vale para o Pit Bull Terrier nem para o Tosa Inu." }
    ref: { en: "Danish Act on Dogs (Hundeloven), §§1 a-b", fr: "Loi danoise sur les chiens (Hundeloven), §§1 a-b", es: "Ley danesa sobre perros (Hundeloven), §§1 a-b", pt: "Lei dinamarquesa sobre cães (Hundeloven), §§1 a-b" }
  - item: { en: "Danish Dog Register", fr: "Registre danois des chiens", es: "Registro danés de perros", pt: "Registro Dinamarquês de Cães" }
    required: { en: "Stays over 4 weeks", fr: "Séjours de plus de 4 semaines", es: "Estancias de más de 4 semanas", pt: "Estadias de mais de 4 semanas" }
    when: { en: "The dog must be registered in the Danish Dog Register within 4 weeks of arrival if the stay exceeds 4 weeks.", fr: "Le chien doit être inscrit au Registre danois des chiens dans les 4 semaines suivant l'arrivée si le séjour dépasse 4 semaines.", es: "El perro debe inscribirse en el Registro danés de perros dentro de las 4 semanas siguientes a la llegada si la estancia supera las 4 semanas.", pt: "O cachorro precisa ser inscrito no Registro Dinamarquês de Cães em até 4 semanas após a chegada, se a estadia passar de 4 semanas." }
    exceptions: { en: "Short holiday stays under 4 weeks are not concerned.", fr: "Les séjours de vacances de moins de 4 semaines ne sont pas concernés.", es: "Las estancias vacacionales de menos de 4 semanas no están afectadas.", pt: "Estadias curtas de férias, com menos de 4 semanas, não são afetadas." }
    ref: { en: "foedevarestyrelsen.dk; hunderegister.dk", fr: "foedevarestyrelsen.dk ; hunderegister.dk", es: "foedevarestyrelsen.dk; hunderegister.dk", pt: "foedevarestyrelsen.dk; hunderegister.dk" }
  - item: { en: "Border check (travellers' point of entry)", fr: "Contrôle frontalier (point d'entrée voyageurs)", es: "Control fronterizo (punto de entrada de viajeros)", pt: "Controle de fronteira (ponto de entrada de viajantes)" }
    required: { en: "Non-EU arrivals", fr: "Arrivées hors UE", es: "Llegadas de fuera de la UE", pt: "Chegadas de fora da UE" }
    when: { en: "Enter via Copenhagen (Kastrup), Billund or Aalborg airport; identity and documents are checked (free of charge).", fr: "Entrer par l'aéroport de Copenhague (Kastrup), Billund ou Aalborg ; identité et documents contrôlés (gratuitement).", es: "Entra por el aeropuerto de Copenhague (Kastrup), Billund o Aalborg; se comprueban la identidad y los documentos (de forma gratuita).", pt: "Entre pelo aeroporto de Copenhague (Kastrup), Billund ou Aalborg; identidade e documentos são conferidos (gratuitamente)." }
    exceptions: { en: "No systematic check for intra-EU arrivals or from Andorra, Iceland, Norway, Switzerland and other EU-terms countries.", fr: "Pas de contrôle systématique pour les arrivées intra-UE ou depuis Andorre, Islande, Norvège, Suisse et autres pays sous conditions UE.", es: "Sin control sistemático para las llegadas intracomunitarias o desde Andorra, Islandia, Noruega, Suiza y otros países en condiciones equivalentes a la UE.", pt: "Sem controle sistemático para chegadas de dentro da UE ou vindas de Andorra, Islândia, Noruega, Suíça e outros países em condições equivalentes às da UE." }
    ref: { en: "foedevarestyrelsen.dk (points of entry)", fr: "foedevarestyrelsen.dk (points d'entrée)", es: "foedevarestyrelsen.dk (puntos de entrada)", pt: "foedevarestyrelsen.dk (pontos de entrada)" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "Effectively ≥15 weeks", fr: "En pratique ≥15 semaines", es: "En la práctica ≥15 semanas", pt: "Na prática, ≥15 semanas" }
