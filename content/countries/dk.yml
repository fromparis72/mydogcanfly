    exceptions: { en: "Puppies under 12 weeks cannot be vaccinated, so cannot enter from outside the EU.", fr: "Un chiot de moins de 12 semaines ne peut être vacciné, donc ne peut entrer depuis hors UE.", es: "Un cachorro de menos de 12 semanas no puede vacunarse, por lo que no puede entrar desde fuera de la UE.", pt: "Filhotes com menos de 12 semanas não podem ser vacinados e, portanto, não podem entrar vindos de fora da UE." }
    ref: { en: "EU Reg. 2020/688; foedevarestyrelsen.dk", fr: "Règl. UE 2020/688 ; foedevarestyrelsen.dk", es: "Regl. UE 2020/688; foedevarestyrelsen.dk", pt: "Regulamento UE 2020/688; foedevarestyrelsen.dk" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
