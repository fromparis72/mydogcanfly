  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — the U.S. (your destination) is only the first, and your dog's travel history matters most."
    fr: "Les documents exacts dépendent de trois éléments — les États-Unis (ta destination) ne sont que le premier, et l'historique de voyage du chien compte le plus."
    es: "Los documentos exactos dependen de tres factores — Estados Unidos (tu destino) es solo el primero, y lo que más cuenta es el historial de viajes de tu perro."
    pt: "Os documentos exatos dependem de três coisas — os EUA (seu destino) são apenas a primeira, e o histórico de viagens do seu cachorro é o que mais pesa."
  items:
    - stars: 5
      label: { en: "Country of destination — United States", fr: "Pays de destination — États-Unis", es: "País de destino — Estados Unidos", pt: "País de destino — Estados Unidos" }
      text:
        en: "The U.S. runs its own CDC scheme (not the EU passport): every dog must be at least 6 months old, microchipped, appear healthy, and have a CDC Dog Import Form receipt."
        fr: "Les États-Unis appliquent leur propre dispositif CDC (pas le passeport UE) : tout chien doit avoir au moins 6 mois, être pucé, paraître sain et disposer d'un reçu du CDC Dog Import Form."
        es: "Estados Unidos aplica su propio dispositivo del CDC (no el pasaporte de la UE): todo perro debe tener al menos 6 meses, llevar microchip, parecer sano y disponer de un recibo del formulario de importación de perros del CDC."
        pt: "Os EUA têm o próprio esquema do CDC (não o passaporte europeu): todo cachorro precisa ter pelo menos 6 meses de idade, microchip, parecer saudável e ter o comprovante do CDC Dog Import Form."
    - stars: 5
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "Whether the dog has been in a high-risk country for dog rabies in the 6 months before entry is decisive: it triggers rabies vaccination, a serology titer or quarantine, and arrival at an approved facility."
        fr: "Le fait que le chien ait séjourné dans un pays à haut risque de rage canine durant les 6 mois précédant l'entrée est décisif : il impose vaccination, titrage sérologique ou quarantaine, et arrivée dans un établissement agréé."
        es: "Que el perro haya estado en un país de alto riesgo de rabia canina en los 6 meses previos a la entrada es decisivo: obliga a la vacunación antirrábica, a una prueba de titulación serológica o a una cuarentena, y a la llegada a un establecimiento autorizado."
        pt: "O fato de o cachorro ter estado ou não em um país de alto risco para raiva canina nos 6 meses anteriores à entrada é decisivo: é isso que aciona a vacinação antirrábica, o teste sorológico ou a quarentena, e a chegada em um estabelecimento aprovado."
    - stars: 4
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The departure country matters mostly through the CDC Dog Import Form (which lists it) and possible USDA screwworm/FMD rules; the high-risk history, not just the last airport, drives the heavy requirements."
        fr: "Le pays de départ compte surtout via le CDC Dog Import Form (qui le mentionne) et d'éventuelles règles USDA (lucilie/fièvre aphteuse) ; c'est l'historique à haut risque, pas seulement le dernier aéroport, qui déclenche les exigences lourdes."
        es: "El país de salida cuenta sobre todo a través del formulario de importación de perros del CDC (que lo indica) y de posibles normas del USDA sobre gusano barrenador / fiebre aftosa; son los antecedentes de alto riesgo, y no solo el último aeropuerto, los que activan los requisitos más exigentes."
        pt: "O país de partida importa sobretudo por causa do CDC Dog Import Form (que o menciona) e de eventuais regras do USDA sobre bicheira (screwworm) e febre aftosa; são os antecedentes de alto risco, e não apenas o último aeroporto, que acionam as exigências mais pesadas."
  note:
    en: "So read the requirements below as the U.S. federal framework, then confirm your dog's exact travel history and any state rules with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre fédéral américain, puis confirme l'historique exact de ton chien et les règles d'État éventuelles avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco federal de Estados Unidos y luego confirma el historial de viajes exacto de tu perro y las posibles normas estatales con tu veterinario."
    pt: "Leia então as exigências abaixo como o quadro federal dos EUA, e confirme com seu veterinário o histórico de viagens exato do seu cachorro e as eventuais regras estaduais."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "For all dogs; must be readable by a universal scanner and implanted before the rabies vaccination, and listed on every form.", fr: "Pour tous les chiens ; lisible par un scanner universel, posée avant la vaccination antirabique et indiquée sur chaque formulaire.", es: "Para todos los perros; debe ser legible por un escáner universal e implantado antes de la vacunación antirrábica, y figurar en cada formulario.", pt: "Para todos os cachorros; deve ser legível por um leitor universal, implantado antes da vacinação antirrábica e informado em todos os formulários." }
    exceptions: { en: "No tattoo alternative; if the microchip is placed after vaccination, the vaccine is treated as invalid.", fr: "Pas d'alternative par tatouage ; si la puce est posée après le vaccin, la vaccination est considérée comme invalide.", es: "No hay alternativa mediante tatuaje; si el microchip se implanta después de la vacuna, la vacunación se considera no válida.", pt: "Não há alternativa por tatuagem; se o microchip for implantado depois da vacina, a vacinação é considerada inválida." }
    ref: { en: "CDC — Bringing a Dog into the U.S. (Aug 1, 2024)", fr: "CDC — Bringing a Dog into the U.S. (1 août 2024)", es: "CDC — Bringing a Dog into the U.S. (1 de agosto de 2024)", pt: "CDC — Bringing a Dog into the U.S. (1º de agosto de 2024)" }
  - item: { en: "Minimum age", fr: "Âge minimum", es: "Edad mínima", pt: "Idade mínima" }
    required: { en: "At least 6 months", fr: "Au moins 6 mois", es: "Al menos 6 meses", pt: "Pelo menos 6 meses" }
    when: { en: "The dog must be 6 months or older at the time of entry or return to the U.S.", fr: "Le chien doit avoir 6 mois ou plus au moment de l'entrée ou du retour aux États-Unis.", es: "El perro debe tener 6 meses o más en el momento de la entrada o del regreso a Estados Unidos.", pt: "O cachorro precisa ter 6 meses ou mais no momento da entrada ou do retorno aos EUA." }
    exceptions: { en: "No exception — puppies under 6 months cannot be imported.", fr: "Aucune exception — les chiots de moins de 6 mois ne peuvent pas être importés.", es: "Sin excepción — los cachorros menores de 6 meses no pueden importarse.", pt: "Sem exceção — filhotes com menos de 6 meses não podem ser importados." }
    ref: { en: "CDC — Bringing a Dog into the U.S.", fr: "CDC — Bringing a Dog into the U.S.", es: "CDC — Bringing a Dog into the U.S.", pt: "CDC — Bringing a Dog into the U.S." }
  - item: { en: "CDC Dog Import Form", fr: "CDC Dog Import Form", es: "Formulario de importación de perros del CDC", pt: "CDC Dog Import Form" }
    required: { en: "Required for all dogs", fr: "Requis pour tous les chiens", es: "Obligatorio para todos los perros", pt: "Obrigatório para todos os cachorros" }
    when: { en: "Complete the free online form; the emailed receipt (print or phone) is shown to the airline and CBP. Valid for a single entry on the listed arrival date; low-risk receipts can be reused up to 6 months.", fr: "Remplir le formulaire en ligne gratuit ; le reçu envoyé par e-mail (imprimé ou sur téléphone) est présenté à la compagnie et au CBP. Valable pour une entrée à la date d'arrivée indiquée ; les reçus faible risque sont réutilisables jusqu'à 6 mois.", es: "Rellena el formulario gratuito en línea; el recibo enviado por correo electrónico (impreso o en el teléfono) se muestra a la aerolínea y al CBP. Válido para una sola entrada en la fecha de llegada indicada; los recibos de bajo riesgo pueden reutilizarse hasta 6 meses.", pt: "Preencha o formulário on-line gratuito; o comprovante enviado por e-mail (impresso ou no celular) é apresentado à companhia aérea e ao CBP. Vale para uma única entrada na data de chegada indicada; comprovantes de baixo risco podem ser reutilizados por até 6 meses." }
    exceptions: { en: "None — every dog needs its own form; a new form is required if travel date or arrival port changes.", fr: "Aucune — chaque chien a son propre formulaire ; un nouveau formulaire est requis si la date ou le port d'arrivée change.", es: "Ninguna — cada perro necesita su propio formulario; se requiere un nuevo formulario si cambia la fecha del viaje o el puerto de llegada.", pt: "Nenhuma — cada cachorro precisa do próprio formulário; é preciso um novo formulário se a data da viagem ou o ponto de chegada mudar." }
    ref: { en: "CDC Dog Import Form (survey.1cdp.cdc.gov)", fr: "CDC Dog Import Form (survey.1cdp.cdc.gov)", es: "CDC Dog Import Form (survey.1cdp.cdc.gov)", pt: "CDC Dog Import Form (survey.1cdp.cdc.gov)" }
  - item: { en: "Appears healthy on arrival", fr: "Paraît en bonne santé à l'arrivée", es: "Parece sano a la llegada", pt: "Parece saudável na chegada" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Dogs are inspected at the port of entry; a sick or injured dog may face further exam, testing or treatment at the owner's expense.", fr: "Les chiens sont inspectés au point d'entrée ; un chien malade ou blessé peut subir examen, tests ou traitement complémentaires aux frais du propriétaire.", es: "Los perros son inspeccionados en el punto de entrada; un perro enfermo o herido puede ser sometido a exámenes, pruebas o tratamientos adicionales a cargo del propietario.", pt: "Os cachorros são inspecionados no ponto de entrada; um cachorro doente ou machucado pode passar por exame, testes ou tratamento adicionais às custas do dono." }
    exceptions: { en: "A dog showing evidence of a zoonotic disease may be denied entry.", fr: "Un chien présentant des signes de maladie zoonotique peut se voir refuser l'entrée.", es: "A un perro que muestre indicios de una enfermedad zoonótica se le puede denegar la entrada.", pt: "Um cachorro que apresente sinais de doença zoonótica pode ter a entrada negada." }
    ref: { en: "CDC — dog importation requirements", fr: "CDC — exigences d'importation des chiens", es: "CDC — requisitos de importación de perros", pt: "CDC — exigências de importação de cachorros" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required from high-risk countries", fr: "Requise depuis les pays à haut risque", es: "Obligatoria desde países de alto riesgo", pt: "Obrigatória vindo de países de alto risco" }
    when: { en: "Dogs that have been in a high-risk country in the past 6 months must be vaccinated; first shot at ≥12 weeks (84 days) old and, for high-risk dogs, at least 28 days before entry.", fr: "Les chiens ayant séjourné dans un pays à haut risque durant les 6 derniers mois doivent être vaccinés ; primo-vaccin à ≥12 semaines (84 jours) et, pour ces chiens, au moins 28 jours avant l'entrée.", es: "Los perros que han estado en un país de alto riesgo en los últimos 6 meses deben estar vacunados; primera vacuna con ≥12 semanas (84 días) de edad y, para los perros de alto riesgo, al menos 28 días antes de la entrada.", pt: "Os cachorros que estiveram em um país de alto risco nos últimos 6 meses precisam estar vacinados; primeira dose a partir de ≥12 semanas (84 dias) de idade e, para esses cachorros, pelo menos 28 dias antes da entrada." }
    exceptions: { en: "Not required by CDC from rabies-free/low-risk countries (though strongly recommended). An unvaccinated dog from a high-risk country is refused entry.", fr: "Non exigée par les CDC depuis les pays indemnes/à faible risque (mais fortement recommandée). Un chien non vacciné venant d'un pays à haut risque est refoulé.", es: "El CDC no la exige desde países libres de rabia o de bajo riesgo (aunque se recomienda encarecidamente). A un perro sin vacunar procedente de un país de alto riesgo se le deniega la entrada.", pt: "Não é exigida pelo CDC vindo de países livres de raiva ou de baixo risco (embora seja fortemente recomendada). Um cachorro não vacinado vindo de um país de alto risco tem a entrada recusada." }
    ref: { en: "CDC — high-risk countries requirements", fr: "CDC — exigences pays à haut risque", es: "CDC — requisitos para países de alto riesgo", pt: "CDC — exigências para países de alto risco" }
  - item: { en: "Rabies serology titer", fr: "Titrage sérologique antirabique", es: "Prueba de titulación serológica de rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Foreign-vaccinated dogs from high-risk countries: blood drawn ≥30 days after the first valid vaccination and ≥28 days before entry, tested by a CDC-approved laboratory.", fr: "Chiens vaccinés à l'étranger depuis un pays à haut risque : sang prélevé ≥30 jours après la première vaccination valide et ≥28 jours avant l'entrée, analysé par un laboratoire agréé CDC.", es: "Perros vacunados en el extranjero desde países de alto riesgo: sangre extraída ≥30 días después de la primera vacunación válida y ≥28 días antes de la entrada, analizada por un laboratorio autorizado por el CDC.", pt: "Cachorros vacinados no exterior vindos de países de alto risco: sangue coletado ≥30 dias após a primeira vacinação válida e ≥28 dias antes da entrada, analisado por um laboratório aprovado pelo CDC." }
    exceptions: { en: "Without a valid titer, the dog must instead be quarantined 28 days at a CDC-registered facility. Not required from rabies-free/low-risk countries.", fr: "Sans titrage valide, le chien doit être mis en quarantaine 28 jours dans un établissement enregistré CDC. Non requis depuis les pays indemnes/à faible risque.", es: "Sin una prueba de titulación válida, el perro debe pasar en su lugar 28 días de cuarentena en un establecimiento registrado por el CDC. No se exige desde países libres de rabia o de bajo riesgo.", pt: "Sem titulação válida, o cachorro precisa cumprir 28 dias de quarentena em um estabelecimento registrado pelo CDC. Não é exigida vindo de países livres de raiva ou de baixo risco." }
    ref: { en: "CDC — foreign-vaccinated dogs from high-risk countries", fr: "CDC — chiens vaccinés à l'étranger, pays à haut risque", es: "CDC — perros vacunados en el extranjero, países de alto riesgo", pt: "CDC — cachorros vacinados no exterior, países de alto risco" }
  - item: { en: "Certification of U.S.-issued Rabies Vaccination", fr: "Certification of U.S.-issued Rabies Vaccination", es: "Certification of U.S.-issued Rabies Vaccination", pt: "Certification of U.S.-issued Rabies Vaccination" }
    required: { en: "U.S.-vaccinated dogs from high-risk countries", fr: "Chiens vaccinés aux USA depuis un pays à haut risque", es: "Perros vacunados en EE. UU. desde países de alto riesgo", pt: "Cachorros vacinados nos EUA vindos de países de alto risco" }
    when: { en: "Completed by a USDA-accredited vet and endorsed by USDA before the dog leaves the U.S.; reusable while the rabies vaccine remains valid.", fr: "Établie par un vétérinaire accrédité USDA et visée par l'USDA avant le départ des USA ; réutilisable tant que le vaccin reste valide.", es: "Cumplimentada por un veterinario acreditado por el USDA y refrendada por el USDA antes de que el perro salga de EE. UU.; reutilizable mientras la vacuna antirrábica siga siendo válida.", pt: "Preenchida por um veterinário credenciado pelo USDA e endossada pelo USDA antes de o cachorro sair dos EUA; reutilizável enquanto a vacina antirrábica continuar válida." }
    exceptions: { en: "A USDA-endorsed export health certificate issued no later than 31 July 2025 may be used instead if it meets CDC criteria.", fr: "Un certificat sanitaire d'export visé par l'USDA délivré au plus tard le 31 juillet 2025 peut le remplacer s'il répond aux critères CDC.", es: "Un certificado sanitario de exportación refrendado por el USDA emitido a más tardar el 31 de julio de 2025 puede utilizarse en su lugar si cumple los criterios del CDC.", pt: "Um atestado de saúde de exportação endossado pelo USDA emitido até 31 de julho de 2025 pode ser usado no lugar dela, se atender aos critérios do CDC." }
    ref: { en: "CDC — U.S.-vaccinated dogs from high-risk countries", fr: "CDC — chiens vaccinés aux USA, pays à haut risque", es: "CDC — perros vacunados en EE. UU., países de alto riesgo", pt: "CDC — cachorros vacinados nos EUA, países de alto risco" }
  - item: { en: "Certification of Foreign Rabies Vaccination and Microchip", fr: "Certification of Foreign Rabies Vaccination and Microchip", es: "Certification of Foreign Rabies Vaccination and Microchip", pt: "Certification of Foreign Rabies Vaccination and Microchip" }
    required: { en: "Foreign-vaccinated dogs from high-risk countries", fr: "Chiens vaccinés à l'étranger depuis un pays à haut risque", es: "Perros vacunados en el extranjero desde países de alto riesgo", pt: "Cachorros vacinados no exterior vindos de países de alto risco" }
    when: { en: "Completed by the dog's vet and endorsed by an official government vet in the exporting country; issued no more than 30 days before travel, single use.", fr: "Établie par le vétérinaire du chien et visée par un vétérinaire officiel du gouvernement du pays exportateur ; délivrée au plus 30 jours avant le voyage, à usage unique.", es: "Cumplimentada por el veterinario del perro y refrendada por un veterinario oficial del gobierno del país exportador; emitida como máximo 30 días antes del viaje, de un solo uso.", pt: "Preenchida pelo veterinário do cachorro e endossada por um veterinário oficial do governo do país exportador; emitida no máximo 30 dias antes da viagem, de uso único." }
    exceptions: { en: "Documents must be in English or have a certified English translation.", fr: "Les documents doivent être en anglais ou accompagnés d'une traduction certifiée en anglais.", es: "Los documentos deben estar en inglés o llevar una traducción certificada al inglés.", pt: "Os documentos precisam estar em inglês ou vir com tradução certificada para o inglês." }
    ref: { en: "CDC — foreign-vaccinated dogs from high-risk countries", fr: "CDC — chiens vaccinés à l'étranger, pays à haut risque", es: "CDC — perros vacunados en el extranjero, países de alto riesgo", pt: "CDC — cachorros vacinados no exterior, países de alto risco" }
  - item: { en: "Reservation at a CDC-registered animal care facility", fr: "Réservation dans un établissement de soins agréé CDC", es: "Reserva en un establecimiento de cuidado animal registrado por el CDC", pt: "Reserva em um estabelecimento de cuidado animal registrado pelo CDC" }
    required: { en: "Foreign-vaccinated dogs from high-risk countries", fr: "Chiens vaccinés à l'étranger depuis un pays à haut risque", es: "Perros vacunados en el extranjero desde países de alto riesgo", pt: "Cachorros vacinados no exterior vindos de países de alto risco" }
    when: { en: "Must be booked before travel for examination and revaccination; the dog must arrive by air at the airport where that facility is located.", fr: "À réserver avant le voyage pour examen et revaccination ; le chien doit arriver par avion à l'aéroport où se trouve l'établissement.", es: "Debe reservarse antes del viaje para el examen y la revacunación; el perro debe llegar por vía aérea al aeropuerto donde se encuentra ese establecimiento.", pt: "Precisa ser feita antes da viagem, para exame e revacinação; o cachorro deve chegar de avião ao aeroporto onde fica esse estabelecimento." }
    exceptions: { en: "If there is no valid serology titer, the reservation must also include a 28-day quarantine. Service dogs arriving by sea are exempt from the reservation.", fr: "Sans titrage valide, la réservation doit inclure une quarantaine de 28 jours. Les chiens d'assistance arrivant par voie maritime en sont dispensés.", es: "Si no hay una prueba de titulación serológica válida, la reserva debe incluir además una cuarentena de 28 días. Los perros de asistencia que llegan por vía marítima están exentos de la reserva.", pt: "Se não houver teste sorológico válido, a reserva precisa incluir também uma quarentena de 28 dias. Os cães de assistência que chegam por via marítima estão dispensados da reserva." }
    ref: { en: "CDC — CDC-registered animal care facilities", fr: "CDC — établissements de soins enregistrés CDC", es: "CDC — establecimientos de cuidado animal registrados por el CDC", pt: "CDC — estabelecimentos de cuidado animal registrados pelo CDC" }
  - item: { en: "USDA rules — screwworm / FMD countries", fr: "Règles USDA — pays lucilie / fièvre aphteuse", es: "Normas del USDA — países con gusano barrenador / fiebre aftosa", pt: "Regras do USDA — países com bicheira (screwworm) / febre aftosa" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "From a screwworm-affected country a government-vet certificate (inspection within 5 days) is required; from an FMD-affected country the dog must be bathed and kept from livestock for 5 days.", fr: "Depuis un pays touché par la lucilie, un certificat d'un vétérinaire officiel (inspection dans les 5 jours) est requis ; depuis un pays touché par la fièvre aphteuse, le chien doit être lavé et tenu à l'écart du bétail 5 jours.", es: "Desde un país afectado por el gusano barrenador se requiere un certificado de un veterinario oficial (inspección en un plazo de 5 días); desde un país afectado por la fiebre aftosa, el perro debe bañarse y mantenerse alejado del ganado durante 5 días.", pt: "Vindo de um país afetado pela bicheira (screwworm), é exigido um certificado de veterinário oficial (inspeção nos 5 dias anteriores); vindo de um país afetado pela febre aftosa, o cachorro precisa ser banhado e mantido longe do gado por 5 dias." }
    exceptions: { en: "Commercial (resale/adoption) imports carry additional USDA Animal Care requirements.", fr: "Les importations commerciales (revente/adoption) impliquent des exigences supplémentaires de l'USDA Animal Care.", es: "Las importaciones comerciales (reventa/adopción) conllevan requisitos adicionales del USDA Animal Care.", pt: "As importações comerciais (revenda/adoção) têm exigências adicionais do USDA Animal Care." }
    ref: { en: "USDA APHIS — Bring a Pet Dog into the U.S.", fr: "USDA APHIS — Bring a Pet Dog into the U.S.", es: "USDA APHIS — Bring a Pet Dog into the U.S.", pt: "USDA APHIS — Bring a Pet Dog into the U.S." }
  - item: { en: "Port of entry", fr: "Point d'entrée", es: "Punto de entrada", pt: "Ponto de entrada" }
    required: { en: "Depends on origin", fr: "Selon l'origine", es: "Según el origen", pt: "Depende da origem" }
    when: { en: "Low-risk dogs: any airport, seaport or land border matching the form. High-risk foreign-vaccinated dogs: only the airport with their reserved CDC-registered facility.", fr: "Chiens faible risque : tout aéroport, port ou frontière terrestre correspondant au formulaire. Chiens vaccinés à l'étranger à haut risque : uniquement l'aéroport de l'établissement CDC réservé.", es: "Perros de bajo riesgo: cualquier aeropuerto, puerto marítimo o frontera terrestre que coincida con el formulario. Perros de alto riesgo vacunados en el extranjero: solo el aeropuerto de su establecimiento registrado por el CDC reservado.", pt: "Cachorros de baixo risco: qualquer aeroporto, porto marítimo ou fronteira terrestre que corresponda ao formulário. Cachorros de alto risco vacinados no exterior: apenas o aeroporto do estabelecimento registrado pelo CDC que foi reservado." }
    exceptions: { en: "The arrival location must match the CDC Dog Import Form receipt.", fr: "Le lieu d'arrivée doit correspondre au reçu du CDC Dog Import Form.", es: "El lugar de llegada debe coincidir con el recibo del formulario de importación de perros del CDC.", pt: "O local de chegada precisa coincidir com o comprovante do CDC Dog Import Form." }
    ref: { en: "CDC — dog importation requirements", fr: "CDC — exigences d'importation des chiens", es: "CDC — requisitos de importación de perros", pt: "CDC — exigências de importação de cachorros" }
  - item: { en: "State-level requirements", fr: "Exigences au niveau des États", es: "Requisitos a nivel estatal", pt: "Exigências estaduais" }
    required: { en: "May apply", fr: "Peuvent s'appliquer", es: "Pueden aplicarse", pt: "Podem se aplicar" }
    when: { en: "Individual states or territories may add requirements (e.g., a veterinary health certificate); check the destination state's animal entry rules.", fr: "Les États ou territoires peuvent ajouter des exigences (p. ex. certificat sanitaire vétérinaire) ; vérifie les règles d'entrée animale de l'État de destination.", es: "Cada estado o territorio puede añadir requisitos (p. ej., un certificado sanitario veterinario); consulta las normas de entrada de animales del estado de destino.", pt: "Cada estado ou território pode acrescentar exigências (por exemplo, um atestado de saúde veterinário); consulte as regras de entrada de animais do estado de destino." }
    exceptions: { en: "Federal CDC/USDA rules always apply on top of any state rule.", fr: "Les règles fédérales CDC/USDA s'appliquent toujours en plus de toute règle d'État.", es: "Las normas federales del CDC/USDA se aplican siempre además de cualquier norma estatal.", pt: "As regras federais do CDC/USDA se aplicam sempre, além de qualquer regra estadual." }
    ref: { en: "USDA APHIS — State and Territory Animal Entry Requirements", fr: "USDA APHIS — exigences d'entrée animale par État", es: "USDA APHIS — requisitos de entrada de animales por estado y territorio", pt: "USDA APHIS — exigências de entrada de animais por estado e território" }

origin:
  eu:
    title: { en: "Simplest — from a rabies-free or low-risk country", fr: "Le plus simple — depuis un pays indemne ou à faible risque", es: "Lo más sencillo — desde un país libre de rabia o de bajo riesgo", pt: "O mais simples — de um país livre de raiva ou de baixo risco" }
    body:
      en: "If your dog has been only in dog-rabies-free or low-risk countries in the 6 months before entry, the only form needed is the CDC Dog Import Form receipt. The dog must also be at least 6 months old, microchipped and appear healthy. It can arrive at any airport, seaport or land border crossing that matches the form. A country not on CDC's high-risk list counts as low-risk."
      fr: "Si ton chien n'a séjourné que dans des pays indemnes ou à faible risque de rage canine durant les 6 mois précédant l'entrée, le seul document requis est le reçu du CDC Dog Import Form. Le chien doit aussi avoir au moins 6 mois, être pucé et paraître sain. Il peut arriver par tout aéroport, port ou frontière terrestre correspondant au formulaire. Un pays absent de la liste CDC des pays à haut risque est considéré à faible risque."
      es: "Si tu perro solo ha estado en países libres de rabia canina o de bajo riesgo en los 6 meses previos a la entrada, el único documento necesario es el recibo del formulario de importación de perros del CDC. El perro también debe tener al menos 6 meses, llevar microchip y parecer sano. Puede llegar por cualquier aeropuerto, puerto marítimo o paso fronterizo terrestre que coincida con el formulario. Un país que no figure en la lista de alto riesgo del CDC se considera de bajo riesgo."
      pt: "Se seu cachorro esteve apenas em países livres de raiva canina ou de baixo risco nos 6 meses anteriores à entrada, o único documento necessário é o comprovante do CDC Dog Import Form. O cachorro também precisa ter pelo menos 6 meses de idade, microchip e parecer saudável. Ele pode chegar por qualquer aeroporto, porto marítimo ou passagem de fronteira terrestre que corresponda ao formulário. Um país que não esteja na lista de alto risco do CDC conta como de baixo risco."
    cls: ok
  listed:
    title: { en: "U.S.-vaccinated dog returning from a high-risk country", fr: "Chien vacciné aux USA revenant d'un pays à haut risque", es: "Perro vacunado en EE. UU. que regresa de un país de alto riesgo", pt: "Cachorro vacinado nos EUA voltando de um país de alto risco" }
    body:
      en: "If your dog was vaccinated against rabies in the U.S. and has been in a high-risk country in the last 6 months, you need two documents: the CDC Dog Import Form receipt and a Certification of U.S.-issued Rabies Vaccination completed by a USDA-accredited vet and endorsed by USDA before the dog left the U.S. With these, the dog can enter at any port matching the form — no titer or quarantine."
      fr: "Si ton chien a été vacciné contre la rage aux États-Unis et a séjourné dans un pays à haut risque durant les 6 derniers mois, il faut deux documents : le reçu du CDC Dog Import Form et une Certification of U.S.-issued Rabies Vaccination établie par un vétérinaire accrédité USDA et visée par l'USDA avant le départ des États-Unis. Ainsi, le chien peut entrer par tout point d'entrée correspondant au formulaire — sans titrage ni quarantaine."
      es: "Si tu perro fue vacunado contra la rabia en Estados Unidos y ha estado en un país de alto riesgo en los últimos 6 meses, necesitas dos documentos: el recibo del formulario de importación de perros del CDC y una Certification of U.S.-issued Rabies Vaccination cumplimentada por un veterinario acreditado por el USDA y refrendada por el USDA antes de que el perro saliera de Estados Unidos. Con ellos, el perro puede entrar por cualquier punto de entrada que coincida con el formulario — sin prueba de titulación ni cuarentena."
      pt: "Se seu cachorro foi vacinado contra a raiva nos EUA e esteve em um país de alto risco nos últimos 6 meses, você precisa de dois documentos: o comprovante do CDC Dog Import Form e uma Certification of U.S.-issued Rabies Vaccination preenchida por um veterinário credenciado pelo USDA e endossada pelo USDA antes de o cachorro sair dos EUA. Com eles, o cachorro pode entrar por qualquer ponto que corresponda ao formulário — sem titulação nem quarentena."
    cls: warn
  nonListed:
    title: { en: "Foreign-vaccinated dog from a high-risk country", fr: "Chien vacciné à l'étranger depuis un pays à haut risque", es: "Perro vacunado en el extranjero desde un país de alto riesgo", pt: "Cachorro vacinado no exterior vindo de um país de alto risco" }
    body:
      en: "This is the strictest path. The dog needs a Certification of Foreign Rabies Vaccination and Microchip (endorsed by an official government vet), a valid rabies serology titer from a CDC-approved lab, a reservation at a CDC-registered animal care facility, and it must arrive by air at that facility's airport. Without a valid titer, a 28-day quarantine at the facility is required. An unvaccinated dog from a high-risk country is refused entry."
      fr: "C'est le parcours le plus strict. Le chien a besoin d'une Certification of Foreign Rabies Vaccination and Microchip (visée par un vétérinaire officiel), d'un titrage sérologique valide d'un laboratoire agréé CDC, d'une réservation dans un établissement de soins agréé CDC, et il doit arriver par avion à l'aéroport de cet établissement. Sans titrage valide, une quarantaine de 28 jours y est imposée. Un chien non vacciné venant d'un pays à haut risque est refoulé."
      es: "Este es el camino más estricto. El perro necesita una Certification of Foreign Rabies Vaccination and Microchip (refrendada por un veterinario oficial del gobierno), una prueba de titulación serológica de rabia válida de un laboratorio autorizado por el CDC, una reserva en un establecimiento de cuidado animal registrado por el CDC, y debe llegar por vía aérea al aeropuerto de ese establecimiento. Sin una prueba de titulación válida, se impone una cuarentena de 28 días en el establecimiento. A un perro sin vacunar procedente de un país de alto riesgo se le deniega la entrada."
      pt: "Este é o caminho mais rigoroso. O cachorro precisa de uma Certification of Foreign Rabies Vaccination and Microchip (endossada por um veterinário oficial do governo), de um teste sorológico antirrábico válido feito em laboratório aprovado pelo CDC, de uma reserva em um estabelecimento de cuidado animal registrado pelo CDC, e precisa chegar de avião ao aeroporto desse estabelecimento. Sem titulação válida, é obrigatória uma quarentena de 28 dias no estabelecimento. Um cachorro não vacinado vindo de um país de alto risco tem a entrada recusada."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches the U.S. depends on its 6-month travel history."
    fr: "Ce qui se passe à l'arrivée de ton chien aux États-Unis dépend de son historique de voyage sur 6 mois."
    es: "Lo que ocurre cuando tu perro llega a Estados Unidos depende de su historial de viajes de los últimos 6 meses."
    pt: "O que acontece quando seu cachorro chega aos EUA depende do histórico de viagens dos 6 meses anteriores."
  points:
    - en: "Every dog is checked by U.S. Customs and Border Protection (CBP); have the CDC Dog Import Form receipt ready on paper or phone."
      fr: "Chaque chien est contrôlé par les douanes américaines (CBP) ; ayez le reçu du CDC Dog Import Form prêt sur papier ou téléphone."
      es: "Todos los perros son controlados por la Oficina de Aduanas y Protección Fronteriza de EE. UU. (CBP); ten a mano el recibo del formulario de importación de perros del CDC en papel o en el teléfono."
      pt: "Todo cachorro é conferido pelo U.S. Customs and Border Protection (CBP); tenha o comprovante do CDC Dog Import Form à mão, impresso ou no celular."
    - en: "From a rabies-free or low-risk country, the dog may enter at any airport, seaport or land border matching the form."
      fr: "Depuis un pays indemne ou à faible risque, le chien peut entrer par tout aéroport, port ou frontière terrestre correspondant au formulaire."
      es: "Desde un país libre de rabia o de bajo riesgo, el perro puede entrar por cualquier aeropuerto, puerto marítimo o frontera terrestre que coincida con el formulario."
      pt: "Vindo de um país livre de raiva ou de baixo risco, o cachorro pode entrar por qualquer aeroporto, porto marítimo ou fronteira terrestre que corresponda ao formulário."
    - en: "A foreign-vaccinated dog from a high-risk country must arrive by air at the airport of its reserved CDC-registered facility, and cannot take a domestic connection until released."
      fr: "Un chien vacciné à l'étranger venant d'un pays à haut risque doit arriver par avion à l'aéroport de l'établissement CDC réservé, et ne peut prendre de correspondance intérieure avant sa libération."
      es: "Un perro vacunado en el extranjero procedente de un país de alto riesgo debe llegar por vía aérea al aeropuerto de su establecimiento registrado por el CDC reservado, y no puede tomar una conexión nacional hasta que sea liberado."
      pt: "Um cachorro vacinado no exterior vindo de um país de alto risco precisa chegar de avião ao aeroporto do estabelecimento registrado pelo CDC que ele reservou, e não pode pegar uma conexão doméstica antes de ser liberado."
    - en: "Carry original, government-endorsed documents; forms must be in English or have a certified English translation."
      fr: "Munis-toi des documents originaux visés par l'autorité ; les formulaires doivent être en anglais ou accompagnés d'une traduction certifiée en anglais."
      es: "Lleva los documentos originales refrendados por la autoridad; los formularios deben estar en inglés o llevar una traducción certificada al inglés."
      pt: "Leve os documentos originais endossados pelo governo; os formulários precisam estar em inglês ou vir com tradução certificada para o inglês."
    - en: "If documents are missing or invalid, or the dog appears ill, entry can be delayed, denied, or the dog returned at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, ou si le chien paraît malade, l'entrée peut être retardée, refusée, ou le chien réexpédié aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, o si el perro parece enfermo, la entrada puede retrasarse, denegarse o el perro puede ser devuelto a cargo del propietario."
      pt: "Se faltarem documentos ou eles forem inválidos, ou se o cachorro parecer doente, a entrada pode ser atrasada ou negada, ou o cachorro pode ser devolvido às custas do dono."
    - en: "Check your destination state's own animal entry rules, which can add a health certificate or other conditions."
      fr: "Vérifie les règles d'entrée animale propres à l'État de destination, qui peuvent ajouter un certificat sanitaire ou d'autres conditions."
      es: "Consulta las normas de entrada de animales propias del estado de destino, que pueden añadir un certificado sanitario u otras condiciones."
      pt: "Confira as regras próprias de entrada de animais do seu estado de destino, que podem acrescentar um atestado de saúde ou outras condições."

travellerExperience: null

restrictedDogs:
  intro:
    en: "There is no U.S. federal ban on any dog breed. CDC and USDA rules are about rabies and animal health, not breed. Breed restrictions, where they exist, are set by individual states, counties or cities."
    fr: "Il n'existe aucune interdiction fédérale américaine visant une race de chien. Les règles des CDC et de l'USDA concernent la rage et la santé animale, pas la race. Les restrictions de race, quand elles existent, sont fixées par les États, comtés ou villes."
    es: "No existe ninguna prohibición federal estadounidense contra ninguna raza de perro. Las normas del CDC y del USDA se refieren a la rabia y la salud animal, no a la raza. Las restricciones por raza, cuando existen, las fijan cada estado, condado o ciudad."
    pt: "Não existe nos EUA nenhuma proibição federal a raças de cachorro. As regras do CDC e do USDA tratam de raiva e de saúde animal, não de raça. As restrições por raça, onde existem, são definidas por estados, condados ou cidades."
  cat1:
    en: "Federal level: no breed is prohibited from entering the United States. Any healthy dog meeting the CDC and USDA requirements may be imported regardless of breed or type."
    fr: "Niveau fédéral : aucune race n'est interdite d'entrée aux États-Unis. Tout chien sain répondant aux exigences des CDC et de l'USDA peut être importé, quelle que soit sa race ou son type."
    es: "Nivel federal: ninguna raza tiene prohibida la entrada a Estados Unidos. Cualquier perro sano que cumpla los requisitos del CDC y del USDA puede importarse independientemente de su raza o tipo."
    pt: "Nível federal: nenhuma raça está proibida de entrar nos Estados Unidos. Qualquer cachorro saudável que atenda às exigências do CDC e do USDA pode ser importado, independentemente da raça ou do tipo."
  cat2:
    en: "State and local level: some states, counties or municipalities have breed-specific legislation (for example rules affecting 'pit bull'-type dogs) covering ownership, housing or insurance. These vary widely and can affect where you can live or travel with the dog after entry."
    fr: "Niveau État et local : certains États, comtés ou municipalités appliquent une législation spécifique à la race (par exemple des règles visant les chiens de type « pit bull ») portant sur la détention, le logement ou l'assurance. Elles varient fortement et peuvent influer sur l'endroit où vivre ou voyager avec le chien après l'entrée."
    es: "Nivel estatal y local: algunos estados, condados o municipios tienen legislación específica por raza (por ejemplo, normas que afectan a los perros de tipo «pit bull») sobre la tenencia, la vivienda o el seguro. Estas varían mucho y pueden influir en dónde puedes vivir o viajar con el perro tras la entrada."
    pt: "Nível estadual e local: alguns estados, condados ou municípios têm legislação específica por raça (por exemplo, regras que afetam cachorros do tipo 'pit bull') sobre posse, moradia ou seguro. Elas variam muito e podem influenciar onde você poderá morar ou viajar com o cachorro depois da entrada."
  note:
    en: "Before travelling, check the specific breed rules of your destination state and city, and of any state you will pass through."
    fr: "Avant de voyager, vérifie les règles de race spécifiques de l'État et de la ville de destination, ainsi que de tout État traversé."
    es: "Antes de viajar, consulta las normas específicas por raza del estado y la ciudad de destino, así como de cualquier estado por el que vayas a pasar."
    pt: "Antes de viajar, confira as regras específicas de raça do estado e da cidade de destino, e de qualquer estado por onde você vai passar."

checklist:
  - en: "Dog at least 6 months old at entry"
    fr: "Chien d'au moins 6 mois à l'entrée"
    es: "Perro de al menos 6 meses en el momento de la entrada"
    pt: "Cachorro com pelo menos 6 meses de idade na entrada"
  - en: "Microchip (ISO / universal-scanner readable) implanted before any rabies vaccination"
    fr: "Puce (ISO / lisible par scanner universel) posée avant toute vaccination antirabique"
    es: "Microchip (ISO / legible por escáner universal) implantado antes de cualquier vacunación antirrábica"
    pt: "Microchip (ISO / legível por leitor universal) implantado antes de qualquer vacinação antirrábica"
  - en: "CDC Dog Import Form completed online — keep the emailed receipt (all dogs)"
    fr: "CDC Dog Import Form rempli en ligne — conserve le reçu reçu par e-mail (tous les chiens)"
    es: "Formulario de importación de perros del CDC rellenado en línea — guarda el recibo enviado por correo electrónico (todos los perros)"
    pt: "CDC Dog Import Form preenchido on-line — guarde o comprovante recebido por e-mail (todos os cachorros)"
  - en: "Rabies vaccination if the dog has been in a high-risk country in the last 6 months"
    fr: "Vaccination antirabique si le chien a séjourné dans un pays à haut risque ces 6 derniers mois"
    es: "Vacunación antirrábica si el perro ha estado en un país de alto riesgo en los últimos 6 meses"
    pt: "Vacinação antirrábica se o cachorro esteve em um país de alto risco nos últimos 6 meses"
  - en: "High-risk, U.S.-vaccinated: USDA-endorsed Certification of U.S.-issued Rabies Vaccination before departure"
    fr: "Haut risque, vacciné aux USA : Certification of U.S.-issued Rabies Vaccination visée USDA avant le départ"
    es: "Alto riesgo, vacunado en EE. UU.: Certification of U.S.-issued Rabies Vaccination refrendada por el USDA antes de la salida"
    pt: "Alto risco, vacinado nos EUA: Certification of U.S.-issued Rabies Vaccination endossada pelo USDA antes da partida"
  - en: "High-risk, foreign-vaccinated: serology titer (CDC-approved lab) or 28-day quarantine + facility reservation"
    fr: "Haut risque, vacciné à l'étranger : titrage sérologique (labo agréé CDC) ou quarantaine 28 jours + réservation d'établissement"
    es: "Alto riesgo, vacunado en el extranjero: prueba de titulación serológica (laboratorio autorizado por el CDC) o cuarentena de 28 días + reserva en un establecimiento"
    pt: "Alto risco, vacinado no exterior: teste sorológico (laboratório aprovado pelo CDC) ou quarentena de 28 dias + reserva em um estabelecimento"
  - en: "Documents in English or with a certified English translation"
    fr: "Documents en anglais ou avec traduction certifiée en anglais"
    es: "Documentos en inglés o con una traducción certificada al inglés"
    pt: "Documentos em inglês ou com tradução certificada para o inglês"
  - en: "Check your destination state's entry rules and any local breed legislation"
    fr: "Vérifie les règles d'entrée de l'État de destination et toute législation locale sur les races"
    es: "Consulta las normas de entrada del estado de destino y cualquier legislación local sobre razas"
    pt: "Confira as regras de entrada do seu estado de destino e a eventual legislação local sobre raças"
  - en: "Airline reservation and suitable IATA crate if travelling in the hold"
    fr: "Réservation compagnie et caisse IATA adaptée si voyage en soute"
    es: "Reserva de la aerolínea y jaula IATA adecuada si viaja en bodega"
    pt: "Reserva na companhia aérea e caixa de transporte adequada às normas IATA se for viajar no porão"

