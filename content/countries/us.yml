# Country Entry Guide — United States (source of truth, bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_us
iso2: "US"
name: { en: "United States", fr: "États-Unis", es: "Estados Unidos", pt: "Estados Unidos" }
region: { en: "North America", fr: "Amérique du Nord", es: "América del Norte", pt: "América do Norte" }


regime: listed
domestic:
  intro:
    en: "Domestic US flight: the CDC dog rules do not apply — they govern entry into the United States, not travel between states. No CDC Dog Import Form is needed."
    fr: "Vol intérieur aux États-Unis : les règles du CDC ne s'appliquent pas — elles régissent l'entrée sur le territoire, pas les trajets entre États. Aucun CDC Dog Import Form n'est requis."
    es: "Vuelo nacional en EE. UU.: las normas del CDC no se aplican — rigen la entrada al país, no los viajes entre estados. No se necesita el CDC Dog Import Form."
    pt: "Voo doméstico nos EUA: as regras do CDC para cachorros não se aplicam — elas regem a entrada nos Estados Unidos, não as viagens entre estados. Não é preciso o CDC Dog Import Form."
  points:
    - en: "No federal requirement: APHIS does not regulate the interstate movement of pets by their owners."
      fr: "Aucune exigence fédérale : l'APHIS ne réglemente pas le déplacement d'animaux de compagnie entre États par leur propriétaire."
      es: "Ningún requisito federal: APHIS no regula el movimiento interestatal de mascotas por sus propietarios."
      pt: "Nenhuma exigência federal: o APHIS não regulamenta o transporte interestadual de animais de estimação feito pelos próprios donos."
    - en: "The destination state sets the rules — commonly an up-to-date rabies vaccination and a veterinary certificate (CVI), but this varies widely from state to state. Check the one you are flying to."
      fr: "C'est l'État d'arrivée qui fixe les règles — souvent une vaccination antirabique à jour et un certificat vétérinaire (CVI), mais cela varie fortement d'un État à l'autre. Vérifie celui où tu atterris."
      es: "El estado de destino fija las reglas — a menudo vacuna antirrábica al día y certificado veterinario (CVI), pero varía mucho según el estado. Comprueba el de tu llegada."
      pt: "Quem define as regras é o estado de destino — em geral vacinação antirrábica em dia e um certificado veterinário (CVI), mas isso varia muito de estado para estado. Confira o estado para onde você vai voar."
    - en: "The airline applies its own conditions (a recent health certificate, vaccination, breed and crate rules): commercial policy, not a government requirement."
      fr: "La compagnie applique ses propres conditions (certificat de santé récent, vaccination, règles de race et de caisse) : politique commerciale, et non une obligation gouvernementale."
      es: "La aerolínea aplica sus propias condiciones (certificado de salud reciente, vacunación, reglas de raza y jaula): política comercial, no una obligación gubernamental."
      pt: "A companhia aérea aplica as próprias condições (atestado de saúde recente, vacinação, regras de raça e de caixa de transporte): é política comercial, não exigência do governo."
  territories:
    - name: { en: "Hawaii", fr: "Hawaï", es: "Hawái", pt: "Havaí" }
      note:
        en: "The big exception: Hawaii is rabies-free and applies its quarantine law in full even from the mainland — microchip, two rabies vaccinations more than 30 days apart, a FAVN titer of at least 0.5 IU/ml from an approved lab, arrival between 30 days and 36 months after the sample, plus a health certificate and tick treatment within 14 days. Fall short and the dog is quarantined for up to 120 days."
        fr: "La grande exception : Hawaï est indemne de rage et applique sa loi de quarantaine en totalité, même depuis le continent — puce, deux vaccinations antirabiques espacées de plus de 30 jours, titrage FAVN d'au moins 0,5 UI/ml en laboratoire agréé, arrivée entre 30 jours et 36 mois après le prélèvement, plus certificat de santé et traitement antitiques dans les 14 jours. À défaut, le chien est mis en quarantaine jusqu'à 120 jours."
        es: "La gran excepción: Hawái está libre de rabia y aplica su ley de cuarentena por completo, incluso desde el continente — microchip, dos vacunas antirrábicas separadas más de 30 días, titulación FAVN de al menos 0,5 UI/ml en laboratorio aprobado, llegada entre 30 días y 36 meses tras la muestra, más certificado de salud y tratamiento antigarrapatas en los 14 días. Si falta algo, cuarentena de hasta 120 días."
        pt: "A grande exceção: o Havaí é livre de raiva e aplica integralmente sua lei de quarentena, mesmo em voos vindos do continente — microchip, duas vacinações antirrábicas com mais de 30 dias de intervalo, titulação FAVN de pelo menos 0,5 UI/ml feita em laboratório aprovado, chegada entre 30 dias e 36 meses após a coleta, além de atestado de saúde e tratamento contra carrapatos nos 14 dias anteriores. Se algo faltar, o cachorro fica em quarentena por até 120 dias."
      url: https://dab.hawaii.gov/ai/aqs/aqs-info/
exit:
  authority: USDA APHIS
  authorityUrl: https://www.aphis.usda.gov/pet-travel/us-to-another-country-export/pet-travel-us-france
  intro:
    en: "The US is a listed country, so no rabies titer is needed to come back — but your dog needs an EU health certificate issued by a USDA-accredited vet and endorsed by USDA APHIS."
    fr: "Les États-Unis sont un pays listé : pas de titrage antirabique pour revenir — mais ton chien a besoin d'un certificat sanitaire UE établi par un vétérinaire agréé USDA et endossé par l'USDA APHIS."
    es: "Estados Unidos es un país listado: no hace falta titulación antirrábica para volver — pero tu perro necesita un certificado sanitario UE emitido por un veterinario acreditado por el USDA y refrendado por el USDA APHIS."
    pt: "Os EUA são um país listado, então não é preciso teste sorológico antirrábico para voltar — mas seu cachorro precisa de um atestado de saúde da UE emitido por um veterinário credenciado pelo USDA e endossado pelo USDA APHIS."
  steps:
    - timing: window
      text:
        en: "Have a USDA-accredited vet complete the EU health certificate, then get it endorsed by USDA APHIS (submitted via VEHCS, then ink-signed and embossed)."
        fr: "Fais remplir le certificat sanitaire UE par un vétérinaire agréé USDA, puis fais-le endosser par l'USDA APHIS (soumis via VEHCS, puis signé à l'encre et embossé)."
        es: "Haz que un veterinario acreditado por el USDA rellene el certificado sanitario UE y luego hazlo refrendar por el USDA APHIS (enviado por VEHCS, firmado en tinta y con sello en relieve)."
        pt: "Peça a um veterinário credenciado pelo USDA que preencha o atestado de saúde da UE e depois obtenha o endosso do USDA APHIS (envio pelo VEHCS, seguido de assinatura em tinta e selo em relevo)."
    - timing: window
      text:
        en: "The certificate is valid for a short window (about 10 days before EU entry) — time the vet visit and endorsement close to your flight."
        fr: "Le certificat n'est valable qu'une courte fenêtre (environ 10 jours avant l'entrée dans l'UE) — cale la visite véto et l'endossement juste avant ton vol."
        es: "El certificado solo vale una ventana corta (unos 10 días antes de entrar en la UE) — programa la visita veterinaria y el refrendo cerca de tu vuelo."
        pt: "O certificado vale por uma janela curta (cerca de 10 dias antes da entrada na UE) — programe a consulta veterinária e o endosso para perto do seu voo."
  onSiteNote:
    en: "A new EU certificate model will apply from 1 October 2026; USDA endorsement can take time, so don't leave it to the last day."
    fr: "Un nouveau modèle de certificat UE s'appliquera à partir du 1er octobre 2026 ; l'endossement USDA peut prendre du temps, ne t'y prends pas au dernier jour."
    es: "Desde el 1 de octubre de 2026 se aplicará un nuevo modelo de certificado UE; el refrendo del USDA puede tardar, así que no lo dejes para el último día."
    pt: "Um novo modelo de certificado da UE passa a valer em 1º de outubro de 2026; o endosso do USDA pode demorar, então não deixe para o último dia."

hero:
  h1: { en: "Traveling to the United States with your dog", fr: "Voyager aux États-Unis avec ton chien", es: "Viajar a Estados Unidos con tu perro", pt: "Viajar aos Estados Unidos com seu cachorro" }
  intro:
    en: >-
      The United States welcomes dogs, but what you must prepare depends mainly on where your dog has
      physically been in the last six months — not only on the country you are flying from. The U.S. is
      not part of the EU pet-passport system; it runs its own scheme led by the CDC, with rules that
      changed on 1 August 2024. Every dog must be at least 6 months old, microchipped, appear healthy,
      and have a CDC Dog Import Form receipt. If your dog has been only in dog-rabies-free or low-risk
      countries, that receipt is essentially all you need. If it has been in a high-risk country for dog
      rabies, expect rabies vaccination plus a valid rabies serology (titer) or quarantine, and arrival
      at an approved facility. This guide explains each case before you book.
    fr: >-
      Les États-Unis accueillent les chiens, mais ce qu'il faut préparer dépend surtout des pays où ton
      chien a réellement séjourné ces six derniers mois — pas seulement du pays de départ. Les États-Unis
      ne font pas partie du système du passeport européen ; ils appliquent leur propre dispositif piloté
      par les CDC, dont les règles ont changé le 1er août 2024. Tout chien doit avoir au moins 6 mois,
      être pucé, paraître en bonne santé et disposer d'un reçu du CDC Dog Import Form. Si le chien n'a
      séjourné que dans des pays indemnes ou à faible risque de rage canine, ce reçu suffit pour
      l'essentiel. S'il a séjourné dans un pays à haut risque, prévois vaccination antirabique plus un
      titrage sérologique valide ou une quarantaine, et une arrivée dans un établissement agréé. Ce guide
      détaille chaque cas avant de réserver.
    es: >-
      Estados Unidos acoge a los perros, pero lo que debes preparar depende sobre todo de dónde ha estado
      físicamente tu perro en los últimos seis meses — no solo del país desde el que vuelas. Estados Unidos
      no forma parte del sistema del pasaporte europeo para mascotas; aplica su propio dispositivo dirigido
      por el CDC, con normas que cambiaron el 1 de agosto de 2024. Todo perro debe tener al menos 6 meses,
      llevar microchip, parecer sano y disponer de un recibo del formulario de importación de perros del CDC.
      Si tu perro solo ha estado en países libres de rabia canina o de bajo riesgo, ese recibo es prácticamente
      todo lo que necesitas. Si ha estado en un país de alto riesgo de rabia canina, cuenta con una vacunación
      antirrábica más una prueba de titulación de rabia válida o una cuarentena, y una llegada a un
      establecimiento autorizado. Esta guía explica cada caso antes de que reserves.

    pt: "Os Estados Unidos recebem bem os cachorros, mas o que você precisa preparar depende principalmente dos lugares onde seu cachorro esteve fisicamente nos últimos seis meses — e não apenas do país de onde você embarca. Os EUA não fazem parte do sistema de passaporte para animais da União Europeia; eles têm o próprio esquema, conduzido pelo CDC, com regras que mudaram em 1º de agosto de 2024. Todo cachorro precisa ter pelo menos 6 meses de idade, microchip, parecer saudável e ter o comprovante do CDC Dog Import Form. Se seu cachorro esteve apenas em países livres de raiva canina ou de baixo risco, esse comprovante é praticamente tudo de que você precisa. Se ele esteve em um país de alto risco para raiva canina, conte com vacinação antirrábica mais um teste sorológico antirrábico (titulação) válido ou quarentena, e chegada em um estabelecimento aprovado. Este guia explica cada caso antes de você comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Moderate — simple from most countries, strict from high-risk ones", fr: "Modéré — simple depuis la plupart des pays, strict depuis les pays à haut risque", es: "Moderado — sencillo desde la mayoría de países, estricto desde los de alto riesgo", pt: "Moderado — simples vindo da maioria dos países, rigoroso vindo dos de alto risco" }

prepTime:
  eu:
    en: "From a dog-rabies-free or low-risk country: minutes — the free CDC Dog Import Form can be filled out on the day of travel (recommended a few days ahead)."
    fr: "Depuis un pays indemne ou à faible risque : quelques minutes — le CDC Dog Import Form gratuit peut être rempli le jour du départ (recommandé quelques jours avant)."
    es: "Desde un país libre de rabia canina o de bajo riesgo: minutos — el formulario de importación de perros del CDC, que es gratuito, puede rellenarse el mismo día del viaje (se recomienda unos días antes)."
    pt: "De um país livre de raiva canina ou de baixo risco: minutos — o CDC Dog Import Form, gratuito, pode ser preenchido no próprio dia da viagem (o ideal é fazer alguns dias antes)."
  listed:
    en: "U.S.-vaccinated dog returning from a high-risk country: ~1 month — a USDA-endorsed Certification of U.S.-issued Rabies Vaccination must be done before departure."
    fr: "Chien vacciné aux USA revenant d'un pays à haut risque : ~1 mois — une Certification of U.S.-issued Rabies Vaccination visée par l'USDA doit être établie avant le départ."
    es: "Perro vacunado en EE. UU. que regresa de un país de alto riesgo: ~1 mes — debe emitirse antes de la salida una Certification of U.S.-issued Rabies Vaccination refrendada por el USDA."
    pt: "Cachorro vacinado nos EUA voltando de um país de alto risco: ~1 mês — a Certification of U.S.-issued Rabies Vaccination endossada pelo USDA precisa ser feita antes da partida."
  nonListed:
    en: "Foreign-vaccinated dog from a high-risk country: ~1–2 months — vaccination, a serology titer (blood ≥30 days after the shot, ≥28 days before entry) and a facility reservation; longer if quarantined."
    fr: "Chien vacciné à l'étranger depuis un pays à haut risque : ~1–2 mois — vaccination, titrage sérologique (sang ≥30 jours après le vaccin, ≥28 jours avant l'entrée) et réservation en établissement ; plus long en cas de quarantaine."
    es: "Perro vacunado en el extranjero desde un país de alto riesgo: ~1–2 meses — vacunación, una prueba de titulación (sangre ≥30 días después de la vacuna, ≥28 días antes de la entrada) y una reserva en un establecimiento; más largo en caso de cuarentena."
    pt: "Cachorro vacinado no exterior vindo de um país de alto risco: ~1–2 meses — vacinação, teste sorológico (coleta de sangue ≥30 dias após a dose e ≥28 dias antes da entrada) e reserva em um estabelecimento; mais tempo se houver quarentena."

