# Country Entry Guide — Canada (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_ca
iso2: "CA"
name: { en: "Canada", fr: "Canada", es: "Canadá", pt: "Canadá" }
region: { en: "North America", fr: "Amérique du Nord", es: "América del Norte", pt: "América do Norte" }


regime: listed
domestic:
  intro:
    en: "Domestic flight in Canada: no federal or provincial formality — the paperwork you may be asked for is the airline's."
    fr: "Vol intérieur au Canada : aucune formalité fédérale ni provinciale — les documents éventuellement demandés sont ceux de la compagnie."
    es: "Vuelo nacional en Canadá: ningún trámite federal ni provincial — los documentos que puedan pedirte son de la aerolínea."
    pt: "Voo doméstico no Canadá: nenhuma formalidade federal ou provincial — os documentos que podem ser pedidos são os da companhia aérea."
  points:
    - en: "There are no interprovincial rabies vaccination requirements, no microchip obligation and no health certificate for domestic arrival. Newfoundland's old entry restriction was repealed in 2012."
      fr: "Il n'existe aucune exigence interprovinciale de vaccination antirabique, aucune obligation de puce ni certificat sanitaire à l'arrivée. L'ancienne restriction d'entrée de Terre-Neuve a été abrogée en 2012."
      es: "No existe ningún requisito interprovincial de vacuna antirrábica, ninguna obligación de microchip ni certificado sanitario a la llegada. La antigua restricción de entrada de Terranova fue derogada en 2012."
      pt: "Não existe nenhuma exigência interprovincial de vacinação antirrábica, nenhuma obrigação de microchip nem atestado de saúde na chegada doméstica. A antiga restrição de entrada de Terra Nova foi revogada em 2012."
    - en: "Ontario does require every dog over 3 months living there to be vaccinated against rabies — an ownership duty, checked by public health, not at the airport."
      fr: "L'Ontario exige toutefois que tout chien de plus de 3 mois y résidant soit vacciné contre la rage — une obligation de détention, contrôlée par la santé publique, pas à l'aéroport."
      es: "Ontario sí exige que todo perro de más de 3 meses que resida allí esté vacunado contra la rabia — un deber de tenencia, controlado por salud pública, no en el aeropuerto."
      pt: "Ontário exige, sim, que todo cachorro com mais de 3 meses que more na província seja vacinado contra a raiva — é um dever de quem tem o animal, fiscalizado pela saúde pública, não no aeroporto."
    - en: "The real constraints are carrier embargoes: brachycephalic bans, winter holiday blackouts on hold carriage, and cold-weather refusals on northern routes."
      fr: "Les vraies contraintes sont les embargos des compagnies : interdictions des races brachycéphales, blocages de la soute pendant les fêtes, et refus par grand froid sur les liaisons nordiques."
      es: "Las verdaderas limitaciones son los embargos de las aerolíneas: prohibiciones de razas braquicéfalas, bloqueos de bodega en fiestas y rechazos por frío en rutas del norte."
      pt: "As verdadeiras restrições vêm dos embargos das companhias aéreas: proibição de raças braquicefálicas, bloqueio do transporte no porão nas festas de fim de ano e recusas por frio intenso nas rotas do norte."
exit:
  authority: CFIA
  authorityUrl: https://inspection.canada.ca/en/animal-health/terrestrial-animals/exports/pets/eu-non-commercial
  intro:
    en: "Canada is a listed country, so no rabies titer is needed to return — but the EU health certificate signed by your vet must be endorsed by a CFIA official veterinarian before you leave Canada."
    fr: "Le Canada est un pays listé : pas de titrage pour revenir — mais le certificat sanitaire UE signé par ton vétérinaire doit être endossé par un vétérinaire officiel de la CFIA avant de quitter le Canada."
    es: "Canadá es un país listado: no hace falta titulación para volver — pero el certificado sanitario UE firmado por tu veterinario debe ser refrendado por un veterinario oficial de la CFIA antes de salir de Canadá."
    pt: "O Canadá é um país listado, então não é preciso teste sorológico antirrábico para voltar — mas o atestado de saúde da UE assinado pelo seu veterinário precisa ser endossado por um veterinário oficial da CFIA antes de você sair do Canadá."
  steps:
    - timing: window
      text:
        en: "A licensed vet completes and signs the EU non-commercial health certificate; book an appointment to have it endorsed by a CFIA Animal Health Office before departure (CFIA cannot endorse once the dog has left)."
        fr: "Un vétérinaire accrédité remplit et signe le certificat sanitaire UE non commercial ; prends rendez-vous pour le faire endosser par un bureau vétérinaire de la CFIA avant le départ (la CFIA ne peut plus l'endosser une fois le chien parti)."
        es: "Un veterinario acreditado rellena y firma el certificado sanitario UE no comercial; pide cita para que lo refrende una oficina veterinaria de la CFIA antes de salir (la CFIA no puede refrendarlo una vez que el perro se ha ido)."
        pt: "Um veterinário credenciado preenche e assina o atestado de saúde não comercial da UE; agende o endosso em um escritório veterinário da CFIA (CFIA Animal Health Office) antes da partida (a CFIA não pode endossar depois que o cachorro já saiu)."
  onSiteNote:
    en: "For Finland, Ireland, Malta or Norway, a tapeworm (Echinococcus) treatment must be given and recorded 24–120 hours before EU entry, before the CFIA endorsement."
    fr: "Pour la Finlande, l'Irlande, Malte ou la Norvège, un traitement contre le ténia (échinocoque) doit être administré et enregistré 24 à 120 h avant l'entrée dans l'UE, avant l'endossement CFIA."
    es: "Para Finlandia, Irlanda, Malta o Noruega, debe administrarse y registrarse un tratamiento contra la tenia (equinococo) 24–120 h antes de entrar en la UE, antes del refrendo de la CFIA."
    pt: "Para Finlândia, Irlanda, Malta ou Noruega, é preciso aplicar e registrar um tratamento contra a tênia (Echinococcus) de 24 a 120 horas antes da entrada na UE, antes do endosso da CFIA."

hero:
  h1: { en: "Traveling to Canada with your dog", fr: "Voyager au Canada avec ton chien", es: "Viajar a Canadá con tu perro", pt: "Viajar ao Canadá com seu cachorro" }
  intro:
    en: >-
      Canada welcomes dogs, and for a personal pet the process is refreshingly simple: it runs its own
      scheme through the Canadian Food Inspection Agency (CFIA), not the EU pet-passport system. For most
      travellers the single core requirement is a valid rabies vaccination certificate, issued in English
      or French by a licensed veterinarian, that clearly identifies your dog and shows it is currently
      vaccinated. There is no antibody test, no waiting period and no post-import quarantine for a
      personal pet from most countries. What changes depends on where your dog is coming from: a dog from
      a CFIA-recognised rabies-free country has an even lighter path, while commercial imports and dogs
      from countries at high risk for dog rabies face stricter, permit-based rules. This guide explains
      each case so you know exactly what to prepare before you book your flight.
    fr: >-
      Le Canada accueille les chiens et, pour un animal de compagnie personnel, la démarche est simple :
      il applique son propre régime via l'Agence canadienne d'inspection des aliments (ACIA), et non le
      passeport européen. Pour la plupart des voyageurs, l'unique exigence essentielle est un certificat
      de vaccination antirabique valide, délivré en anglais ou en français par un vétérinaire agréé,
      identifiant clairement le chien et montrant qu'il est vacciné à jour. Pas de titrage, pas de délai
      d'attente et aucune quarantaine à l'arrivée pour un animal personnel venant de la plupart des pays.
      Ce qui change dépend de la provenance : un chien issu d'un pays reconnu indemne de rage par l'ACIA
      suit un parcours encore plus léger, tandis que les importations commerciales et les chiens
      provenant de pays à haut risque de rage canine relèvent de règles plus strictes, soumises à permis.
      Ce guide détaille chaque cas pour savoir exactement quoi préparer avant de réserver ton vol.
    es: >-
      Canadá acoge a los perros y, para una mascota personal, el trámite es sorprendentemente sencillo:
      aplica su propio régimen a través de la Agencia Canadiense de Inspección de Alimentos (CFIA), y no
      el sistema del pasaporte europeo para mascotas. Para la mayoría de los viajeros, el único requisito
      esencial es un certificado de vacunación antirrábica válido, expedido en inglés o francés por un
      veterinario autorizado, que identifique claramente a tu perro y muestre que está vacunado al día.
      No hay prueba de titulación, ni periodo de espera ni cuarentena a la llegada para una mascota
      personal procedente de la mayoría de los países. Lo que cambia depende de la procedencia: un perro
      de un país reconocido como libre de rabia por la CFIA sigue un camino aún más ligero, mientras que
      las importaciones comerciales y los perros procedentes de países de alto riesgo de rabia canina se
      rigen por normas más estrictas, sujetas a permiso. Esta guía explica cada caso para que sepas
      exactamente qué preparar antes de reservar tu vuelo.

    pt: "O Canadá recebe bem os cachorros e, para um animal de estimação pessoal, o processo é surpreendentemente simples: o país aplica o próprio regime por meio da Canadian Food Inspection Agency (CFIA), e não o sistema do passaporte europeu para animais. Para a maioria dos viajantes, a única exigência essencial é um certificado de vacinação antirrábica válido, emitido em inglês ou francês por um veterinário credenciado, que identifique claramente seu cachorro e mostre que ele está com a vacina em dia. Não há teste sorológico antirrábico, nem período de espera, nem quarentena na chegada para um animal de estimação pessoal vindo da maioria dos países. O que muda depende da procedência: um cachorro que vem de um país reconhecido pela CFIA como livre de raiva segue um caminho ainda mais leve, enquanto as importações comerciais e os cachorros vindos de países de alto risco de raiva canina se enquadram em regras mais rígidas, sujeitas a autorização. Este guia detalha cada caso para você saber exatamente o que preparar antes de comprar a passagem."
difficulty:
  level: easy
  label: { en: "Easy for a personal pet (rabies vaccination certificate)", fr: "Facile pour un animal personnel (certificat de vaccination antirabique)", es: "Fácil para una mascota personal (certificado de vacunación antirrábica)", pt: "Fácil para um animal de estimação pessoal (certificado de vacinação antirrábica)" }

prepTime:
  eu:
    en: "From a rabies-free country: often just the time to get a vet certificate — a certificate of freedom from rabies (dog resident there 6 months) is enough, or a valid rabies vaccination. No waiting period and no quarantine."
    fr: "Depuis un pays indemne de rage : souvent le seul temps d'obtenir un certificat vétérinaire — un certificat attestant l'absence de rage (chien résidant 6 mois) suffit, ou une vaccination antirabique valide. Aucun délai d'attente ni quarantaine."
    es: "Desde un país libre de rabia: a menudo solo el tiempo de obtener un certificado veterinario — basta con un certificado que acredite la ausencia de rabia (perro residente allí 6 meses), o una vacunación antirrábica válida. Sin periodo de espera ni cuarentena."
    pt: "Vindo de um país livre de raiva: em geral, só o tempo de conseguir um certificado veterinário — basta um certificado de ausência de raiva (com o cachorro residindo lá há 6 meses) ou uma vacinação antirrábica válida. Sem período de espera e sem quarentena."
  listed:
    en: "From most countries (including the United States and Mexico): just the time to get a valid rabies vaccination from your vet. Canada sets no minimum wait after the shot, no antibody test and no quarantine for a personal pet."
    fr: "Depuis la plupart des pays (dont les États-Unis et le Mexique) : le temps d'obtenir une vaccination antirabique valide chez ton vétérinaire. Le Canada n'impose aucun délai après le vaccin, aucun titrage et aucune quarantaine pour un animal personnel."
    es: "Desde la mayoría de los países (incluidos Estados Unidos y México): solo el tiempo de obtener una vacunación antirrábica válida de tu veterinario. Canadá no impone ninguna espera mínima tras la vacuna, ni prueba de titulación ni cuarentena para una mascota personal."
    pt: "Vindo da maioria dos países (inclusive Estados Unidos e México): só o tempo de conseguir uma vacinação antirrábica válida com seu veterinário. O Canadá não impõe prazo mínimo de espera depois da vacina, nem teste sorológico antirrábico, nem quarentena para um animal de estimação pessoal."
  nonListed:
    en: "Commercial imports, unaccompanied puppies and high-risk-rabies countries: longer and case-by-case. Commercial dogs need an import permit, which is no longer issued for countries at high risk for dog rabies (since 28 September 2022)."
    fr: "Importations commerciales, chiots non accompagnés et pays à haut risque de rage : plus long et au cas par cas. Les chiens commerciaux exigent un permis d'importation, qui n'est plus délivré pour les pays à haut risque de rage canine (depuis le 28 septembre 2022)."
    es: "Importaciones comerciales, cachorros no acompañados y países de alto riesgo de rabia: más largo y caso por caso. Los perros comerciales necesitan un permiso de importación, que ya no se expide para los países de alto riesgo de rabia canina (desde el 28 de septiembre de 2022)."
    pt: "Importações comerciais, filhotes desacompanhados e países de alto risco de raiva: mais demorado e caso a caso. Cachorros comerciais precisam de uma autorização de importação, que não é mais emitida para países de alto risco de raiva canina (desde 28 de setembro de 2022)."

