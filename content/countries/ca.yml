  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Canada (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — le Canada (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Canadá (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — o Canadá (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — Canada", fr: "Pays de destination — Canada", es: "País de destino — Canadá", pt: "País de destino — Canadá" }
      text:
        en: "Canada applies the CFIA import scheme: for a personal pet the core requirement is a valid rabies vaccination certificate. No microchip is required by the CFIA, there is no antibody test and no post-import quarantine."
        fr: "Le Canada applique le régime d'importation de l'ACIA : pour un animal personnel, l'exigence essentielle est un certificat de vaccination antirabique valide. Aucune puce n'est exigée par l'ACIA, ni titrage ni quarantaine à l'arrivée."
        es: "Canadá aplica el régimen de importación de la CFIA: para una mascota personal, el requisito esencial es un certificado de vacunación antirrábica válido. La CFIA no exige microchip, ni hay prueba de titulación ni cuarentena a la llegada."
        pt: "O Canadá aplica o regime de importação da CFIA: para um animal de estimação pessoal, a exigência central é um certificado de vacinação antirrábica válido. A CFIA não exige microchip, não há teste sorológico antirrábico nem quarentena na chegada."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Whether your dog comes from a CFIA rabies-free country, from any other (rabies-present) country, or is a commercial import from a high-risk-rabies country decides how light or how strict the paperwork is."
        fr: "Que ton chien vienne d'un pays indemne de rage reconnu par l'ACIA, de tout autre pays (à rage présente), ou soit une importation commerciale d'un pays à haut risque de rage détermine la légèreté ou la sévérité des formalités."
        es: "Que tu perro venga de un país libre de rabia reconocido por la CFIA, de cualquier otro país (con rabia presente), o sea una importación comercial de un país de alto riesgo de rabia determina lo ligeros o lo estrictos que son los trámites."
        pt: "Se o seu cachorro vem de um país reconhecido pela CFIA como livre de raiva, de qualquer outro país (com presença de raiva), ou se é uma importação comercial de um país de alto risco de raiva: é isso que define se a papelada será leve ou rígida."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "The rabies-free path requires your dog to have lived in the rabies-free country for the six months before travel (or since birth). A recent stay elsewhere can move you to the standard vaccination route — real history counts, not only the last airport."
        fr: "Le parcours indemne de rage exige que le chien ait vécu dans le pays indemne pendant les six mois avant le voyage (ou depuis sa naissance). Un séjour récent ailleurs peut tu faire basculer vers la voie standard de la vaccination — c'est l'historique réel qui compte, pas seulement l'aéroport de destination finale."
        es: "La vía libre de rabia exige que tu perro haya vivido en el país libre de rabia durante los seis meses previos al viaje (o desde su nacimiento). Una estancia reciente en otro lugar puede hacerte pasar a la vía estándar de la vacunación — cuenta el historial real, no solo el último aeropuerto."
        pt: "O caminho do país livre de raiva exige que seu cachorro tenha morado nesse país nos seis meses anteriores à viagem (ou desde o nascimento). Uma estadia recente em outro lugar pode levar você para a rota padrão da vacinação — o que conta é o histórico real, não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Canada's framework, then confirm your dog's exact origin and history with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre canadien, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Canadá y luego confirma el origen y el historial exactos de tu perro con tu veterinario."
    pt: "Leia então as exigências abaixo como o quadro geral do Canadá, e confirme com seu veterinário a origem e o histórico exatos do seu cachorro."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Not required", fr: "Non requise", es: "No obligatorio", pt: "Não obrigatório" }
    when: { en: "The CFIA does not require a microchip to import a personal pet dog; the dog must simply be clearly identifiable on its rabies certificate.", fr: "L'ACIA n'exige pas de puce pour importer un chien de compagnie personnel ; le chien doit simplement être clairement identifiable sur son certificat antirabique.", es: "La CFIA no exige microchip para importar un perro de compañía personal; el perro simplemente debe ser claramente identificable en su certificado antirrábico.", pt: "A CFIA não exige microchip para importar um cachorro de estimação pessoal; o cachorro só precisa estar claramente identificável no seu certificado antirrábico." }
    exceptions: { en: "A microchip is still strongly recommended and may be required by your airline or by the country you are leaving.", fr: "Une puce reste fortement recommandée et peut être exigée par ta compagnie aérienne ou par le pays de départ.", es: "Un microchip sigue siendo muy recomendable y puede ser exigido por tu aerolínea o por el país del que sales.", pt: "Mesmo assim, o microchip é fortemente recomendado e pode ser exigido pela sua companhia aérea ou pelo país de onde você sai." }
    ref: { en: "CFIA — Import Reference Document, Part III, s.2 (Domestic dogs)", fr: "ACIA — Document de référence sur l'importation, partie III, art. 2 (Chiens domestiques)", es: "CFIA — Documento de referencia sobre la importación, parte III, art. 2 (Perros domésticos)", pt: "CFIA — Documento de referência sobre importação, parte III, art. 2 (cachorros domésticos)" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required from most countries", fr: "Requise depuis la plupart des pays", es: "Obligatoria desde la mayoría de los países", pt: "Obrigatória vindo da maioria dos países" }
    when: { en: "A valid rabies vaccination certificate in English or French, issued by a licensed vet, that clearly identifies the dog and shows it is currently vaccinated. Dogs cannot be effectively vaccinated before 12 weeks of age.", fr: "Un certificat de vaccination antirabique valide en anglais ou en français, délivré par un vétérinaire agréé, identifiant clairement le chien et montrant qu'il est vacciné à jour. Un chien ne peut être vacciné efficacement avant l'âge de 12 semaines.", es: "Un certificado de vacunación antirrábica válido en inglés o francés, expedido por un veterinario autorizado, que identifique claramente al perro y muestre que está vacunado al día. Los perros no pueden vacunarse eficazmente antes de las 12 semanas de edad.", pt: "Um certificado de vacinação antirrábica válido, em inglês ou francês, emitido por um veterinário credenciado, que identifique claramente o cachorro e mostre que ele está com a vacina em dia. Um cachorro não pode ser vacinado de forma eficaz antes das 12 semanas de idade." }
    exceptions: { en: "Not required for a dog under 3 months of age, nor from a designated rabies-free country (freedom certificate instead), nor if a valid antibody test is provided.", fr: "Non requise pour un chien de moins de 3 mois, ni depuis un pays désigné indemne de rage (certificat d'absence de rage à la place), ni si un titrage valide est fourni.", es: "No obligatoria para un perro de menos de 3 meses, ni desde un país designado como libre de rabia (certificado de ausencia de rabia en su lugar), ni si se aporta una prueba de titulación válida.", pt: "Não é exigida para um cachorro com menos de 3 meses de idade, nem vindo de um país designado como livre de raiva (nesse caso, o certificado de ausência de raiva), nem se for apresentado um teste sorológico antirrábico válido." }
    ref: { en: "CFIA — Import Reference Document, s.2(1)(c) & 2(2)(a)", fr: "ACIA — Document de référence sur l'importation, art. 2(1)c) et 2(2)a)", es: "CFIA — Documento de referencia sobre la importación, art. 2(1)(c) y 2(2)(a)", pt: "CFIA — Documento de referência sobre importação, art. 2(1)(c) e 2(2)(a)" }
  - item: { en: "Rabies antibody test (RNATT)", fr: "Titrage des anticorps antirabiques (RNATT)", es: "Prueba de titulación de anticuerpos contra la rabia (RNATT)", pt: "Teste sorológico antirrábico (RNATT)" }
    required: { en: "Optional alternative", fr: "Alternative facultative", es: "Alternativa opcional", pt: "Alternativa opcional" }
    when: { en: "Accepted in place of a vaccination certificate: antibody-test result of at least 0.5 IU/ml, taken at least 30 days (rabies-free origin) or 3–4 weeks (other origins) after vaccination; the lab report must identify the dog and accompany it.", fr: "Accepté à la place d'un certificat de vaccination : titre d'au moins 0,5 UI/ml, prélevé au moins 30 jours (origine indemne) ou 3 à 4 semaines (autres origines) après le vaccin ; le rapport de labo doit identifier le chien et l'accompagner.", es: "Aceptada en lugar de un certificado de vacunación: resultado de la prueba de titulación de al menos 0,5 UI/ml, tomado al menos 30 días (origen libre de rabia) o 3–4 semanas (otros orígenes) después de la vacunación; el informe del laboratorio debe identificar al perro y acompañarlo.", pt: "Aceito no lugar de um certificado de vacinação: resultado do teste sorológico de pelo menos 0,5 UI/ml, com coleta feita no mínimo 30 dias (origem livre de raiva) ou 3 a 4 semanas (outras origens) depois da vacinação; o laudo do laboratório deve identificar o cachorro e acompanhá-lo." }
    exceptions: { en: "Not mandatory — a valid rabies vaccination certificate is the usual and simplest route.", fr: "Non obligatoire — un certificat de vaccination antirabique valide reste la voie habituelle et la plus simple.", es: "No obligatoria — un certificado de vacunación antirrábica válido sigue siendo la vía habitual y más sencilla.", pt: "Não é obrigatório — um certificado de vacinação antirrábica válido continua sendo o caminho habitual e mais simples." }
    ref: { en: "CFIA — Import Reference Document, s.2(1)(d) & 2(2)(b)", fr: "ACIA — Document de référence sur l'importation, art. 2(1)d) et 2(2)b)", es: "CFIA — Documento de referencia sobre la importación, art. 2(1)(d) y 2(2)(b)", pt: "CFIA — Documento de referência sobre importação, art. 2(1)(d) e 2(2)(b)" }
  - item: { en: "Rabies-free country certificate", fr: "Certificat de pays indemne de rage", es: "Certificado de país libre de rabia", pt: "Certificado de país livre de raiva" }
    required: { en: "Rabies-free origins (option)", fr: "Origines indemnes (option)", es: "Orígenes libres de rabia (opción)", pt: "Origens livres de raiva (opção)" }
    when: { en: "For dogs from a CFIA-recognised rabies-free country: a vet certificate showing rabies has not existed there for the previous 6 months and the dog has lived there for those 6 months (or since birth).", fr: "Pour les chiens issus d'un pays reconnu indemne de rage par l'ACIA : un certificat vétérinaire montrant l'absence de rage durant les 6 mois précédents et que le chien y a vécu ces 6 mois (ou depuis sa naissance).", es: "Para los perros procedentes de un país reconocido como libre de rabia por la CFIA: un certificado veterinario que muestre que allí no ha habido rabia durante los 6 meses anteriores y que el perro ha vivido allí esos 6 meses (o desde su nacimiento).", pt: "Para cachorros vindos de um país reconhecido pela CFIA como livre de raiva: um certificado veterinário atestando que não houve raiva no país nos 6 meses anteriores e que o cachorro morou lá durante esses 6 meses (ou desde o nascimento)." }
    exceptions: { en: "Only for the designated countries: Australia, Fiji, Finland, Iceland, Ireland, Japan, New Zealand, Sweden and the United Kingdom.", fr: "Uniquement pour les pays désignés : Australie, Fidji, Finlande, Islande, Irlande, Japon, Nouvelle-Zélande, Suède et Royaume-Uni.", es: "Solo para los países designados: Australia, Fiyi, Finlandia, Islandia, Irlanda, Japón, Nueva Zelanda, Suecia y el Reino Unido.", pt: "Apenas para os países designados: Austrália, Fiji, Finlândia, Islândia, Irlanda, Japão, Nova Zelândia, Suécia e Reino Unido." }
    ref: { en: "CFIA — Countries recognized as rabies free; Import Reference Document s.2(1)(a)", fr: "ACIA — Pays reconnus indemnes de rage ; Document de référence art. 2(1)a)", es: "CFIA — Países reconocidos como libres de rabia; Documento de referencia art. 2(1)(a)", pt: "CFIA — Países reconhecidos como livres de raiva; Documento de referência art. 2(1)(a)" }
  - item: { en: "Veterinary health certificate (unaccompanied puppies)", fr: "Certificat sanitaire vétérinaire (chiots non accompagnés)", es: "Certificado sanitario veterinario (cachorros no acompañados)", pt: "Certificado veterinário de saúde (filhotes desacompanhados)" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "A pet dog under 8 months not accompanied by its owner also needs a vet certificate: examined, at least 8 weeks old, free of disease, vaccinated for distemper/hepatitis/parvovirus/parainfluenza, imported within 72 hours of the exam.", fr: "Un chien de moins de 8 mois non accompagné de son propriétaire exige aussi un certificat vétérinaire : examiné, âgé d'au moins 8 semaines, exempt de maladie, vacciné contre maladie de Carré/hépatite/parvovirose/parainfluenza, importé dans les 72 heures suivant l'examen.", es: "Un perro de compañía de menos de 8 meses no acompañado de su propietario necesita también un certificado veterinario: examinado, de al menos 8 semanas, libre de enfermedad, vacunado contra moquillo/hepatitis/parvovirus/parainfluenza, importado dentro de las 72 horas siguientes al examen.", pt: "Um cachorro de estimação com menos de 8 meses que não esteja acompanhado do dono também precisa de um certificado veterinário: examinado, com pelo menos 8 semanas de vida, livre de doenças, vacinado contra cinomose/hepatite/parvovirose/parainfluenza e importado dentro de 72 horas após o exame." }
    exceptions: { en: "Not needed for a pet dog accompanied by its owner — the rabies certificate is then the main document.", fr: "Inutile pour un chien accompagné de son propriétaire — le certificat antirabique est alors le document principal.", es: "No necesario para un perro de compañía acompañado de su propietario — el certificado antirrábico es entonces el documento principal.", pt: "Não é necessário para um cachorro de estimação acompanhado do dono — nesse caso, o certificado antirrábico é o documento principal." }
    ref: { en: "CFIA — Import Reference Document, s.2(4)", fr: "ACIA — Document de référence sur l'importation, art. 2(4)", es: "CFIA — Documento de referencia sobre la importación, art. 2(4)", pt: "CFIA — Documento de referência sobre importação, art. 2(4)" }
  - item: { en: "Tapeworm (Echinococcus) treatment", fr: "Traitement contre le ténia (Echinococcus)", es: "Tratamiento contra la tenia (Echinococcus)", pt: "Tratamento contra a tênia (Echinococcus)" }
    required: { en: "Not required", fr: "Non requis", es: "No obligatorio", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Canada does not require any tapeworm or echinococcus treatment for a dog to enter.", fr: "Le Canada n'exige aucun traitement contre le ténia ou l'échinococcose pour l'entrée d'un chien.", es: "Canadá no exige ningún tratamiento contra la tenia o el equinococo para la entrada de un perro.", pt: "O Canadá não exige nenhum tratamento contra a tênia ou a equinococose para a entrada de um cachorro." }
    ref: { en: "CFIA — Bringing animals to Canada: pets", fr: "ACIA — Importation d'animaux au Canada : animaux de compagnie", es: "CFIA — Importación de animales a Canadá: animales de compañía", pt: "CFIA — Importação de animais para o Canadá: animais de estimação" }
  - item: { en: "Advance notification / import permit", fr: "Notification préalable / permis d'importation", es: "Notificación previa / permiso de importación", pt: "Notificação prévia / autorização de importação" }
    required: { en: "Personal: no; commercial: permit", fr: "Personnel : non ; commercial : permis", es: "Personal: no; comercial: permiso", pt: "Pessoal: não; comercial: autorização" }
    when: { en: "No permit or prior notice is needed for a personal pet. Commercial dogs (for resale, adoption, fostering, breeding, show or research) require an import permit and stricter conditions.", fr: "Aucun permis ni avis préalable pour un animal personnel. Les chiens commerciaux (revente, adoption, placement, élevage, exposition ou recherche) exigent un permis d'importation et des conditions plus strictes.", es: "No se necesita permiso ni aviso previo para una mascota personal. Los perros comerciales (para reventa, adopción, acogida, cría, exposición o investigación) requieren un permiso de importación y condiciones más estrictas.", pt: "Não é preciso autorização nem aviso prévio para um animal de estimação pessoal. Cachorros comerciais (para revenda, adoção, lar temporário, criação, exposição ou pesquisa) exigem uma autorização de importação e condições mais rígidas." }
    exceptions: { en: "Since 28 September 2022, commercial dogs from countries at high risk for dog rabies are prohibited and permits are no longer issued.", fr: "Depuis le 28 septembre 2022, les chiens commerciaux issus de pays à haut risque de rage canine sont interdits et les permis ne sont plus délivrés.", es: "Desde el 28 de septiembre de 2022, los perros comerciales procedentes de países de alto riesgo de rabia canina están prohibidos y ya no se expiden permisos.", pt: "Desde 28 de setembro de 2022, cachorros comerciais vindos de países de alto risco de raiva canina estão proibidos e as autorizações não são mais emitidas." }
    ref: { en: "CFIA — Notice to industry (2022-06-28); Health of Animals Regs 12(1)(a)", fr: "ACIA — Avis à l'industrie (2022-06-28) ; Règl. sur la santé des animaux 12(1)a)", es: "CFIA — Aviso a la industria (2022-06-28); Reglamento sobre la salud de los animales 12(1)(a)", pt: "CFIA — Aviso à indústria (2022-06-28); Health of Animals Regs 12(1)(a)" }
  - item: { en: "Border check (declare your dog)", fr: "Contrôle frontalier (déclarer ton chien)", es: "Control fronterizo (declarar a tu perro)", pt: "Controle de fronteira (declarar seu cachorro)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Declare your dog to the Canada Border Services Agency (CBSA) at the port of entry. CBSA inspects on behalf of the CFIA and may refer the dog to a CFIA veterinarian.", fr: "Déclare ton chien à l'Agence des services frontaliers du Canada (ASFC) au point d'entrée. L'ASFC inspecte pour le compte de l'ACIA et peut renvoyer le chien à un vétérinaire de l'ACIA.", es: "Declara a tu perro ante la Agencia de Servicios Fronterizos de Canadá (CBSA) en el punto de entrada. La CBSA inspecciona en nombre de la CFIA y puede derivar al perro a un veterinario de la CFIA.", pt: "Declare seu cachorro à Canada Border Services Agency (CBSA) no ponto de entrada. A CBSA fiscaliza em nome da CFIA e pode encaminhar o cachorro a um veterinário da CFIA." }
    exceptions: { en: "None — always present the dog and its documents at the border.", fr: "Aucune — présente toujours le chien et ses documents à la frontière.", es: "Ninguna — presenta siempre al perro y sus documentos en la frontera.", pt: "Nenhuma — apresente sempre o cachorro e os documentos dele na fronteira." }
    ref: { en: "CFIA — Roles and responsibilities (CBSA / CFIA)", fr: "ACIA — Rôles et responsabilités (ASFC / ACIA)", es: "CFIA — Funciones y responsabilidades (CBSA / CFIA)", pt: "CFIA — Funções e responsabilidades (CBSA / CFIA)" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "Age-dependent", fr: "Selon l'âge", es: "Según la edad", pt: "Depende da idade" }
    when: { en: "Under 3 months: no rabies vaccination or certification required. Effective rabies vaccination is only possible from 12 weeks. Unaccompanied pets under 8 months need the extra vet certificate above.", fr: "Moins de 3 mois : aucune vaccination ni certification antirabique requise. La vaccination antirabique efficace n'est possible qu'à partir de 12 semaines. Les animaux non accompagnés de moins de 8 mois exigent le certificat vétérinaire supplémentaire ci-dessus.", es: "Menos de 3 meses: no se requiere vacunación ni certificación antirrábica. La vacunación antirrábica eficaz solo es posible a partir de las 12 semanas. Las mascotas no acompañadas de menos de 8 meses necesitan el certificado veterinario adicional indicado arriba.", pt: "Com menos de 3 meses: não se exige vacinação nem certificação antirrábica. A vacinação antirrábica só é eficaz a partir das 12 semanas. Animais desacompanhados com menos de 8 meses precisam do certificado veterinário adicional indicado acima." }
    exceptions: { en: "Commercial dogs under 8 months may only be imported under a permit (and not at all from high-risk-rabies countries).", fr: "Les chiens commerciaux de moins de 8 mois ne peuvent être importés que sous permis (et pas du tout depuis les pays à haut risque de rage).", es: "Los perros comerciales de menos de 8 meses solo pueden importarse con un permiso (y en absoluto desde países de alto riesgo de rabia).", pt: "Cachorros comerciais com menos de 8 meses só podem ser importados com autorização (e de jeito nenhum vindos de países de alto risco de raiva)." }
    ref: { en: "CFIA — Import Reference Document, s.2 (notes) & 2(7)", fr: "ACIA — Document de référence sur l'importation, art. 2 (notes) et 2(7)", es: "CFIA — Documento de referencia sobre la importación, art. 2 (notas) y 2(7)", pt: "CFIA — Documento de referência sobre importação, art. 2 (notas) e 2(7)" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not required", fr: "Non requise", es: "No obligatoria", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Pet dogs from any country are not subject to post-import quarantine. A non-compliant dog may instead be ordered removed from Canada at the owner's expense.", fr: "Les chiens de compagnie de tout pays ne sont soumis à aucune quarantaine à l'arrivée. Un chien non conforme peut au contraire faire l'objet d'un ordre de retrait du Canada aux frais du propriétaire.", es: "Los perros de compañía de cualquier país no están sujetos a cuarentena a la llegada. En cambio, se puede ordenar que un perro no conforme sea retirado de Canadá a cargo del propietario.", pt: "Cachorros de estimação de qualquer país não ficam em quarentena na chegada. Em vez disso, um cachorro fora das exigências pode receber ordem de saída do Canadá, às custas do dono." }
    ref: { en: "CFIA — Import Reference Document, s.2 (note) & Part IV", fr: "ACIA — Document de référence sur l'importation, art. 2 (note) et partie IV", es: "CFIA — Documento de referencia sobre la importación, art. 2 (nota) y parte IV", pt: "CFIA — Documento de referência sobre importação, art. 2 (nota) e parte IV" }

origin:
  eu:
    title: { en: "From a rabies-free country — simplest path", fr: "Depuis un pays indemne de rage — parcours le plus simple", es: "Desde un país libre de rabia — el camino más simple", pt: "De um país livre de raiva — o caminho mais simples" }
    body:
      en: "From a CFIA-recognised rabies-free country (Australia, Fiji, Finland, Iceland, Ireland, Japan, New Zealand, Sweden or the United Kingdom), a dog 8 months or older can enter with a vet certificate showing the country has been rabies-free for the previous 6 months and the dog lived there those 6 months (or since birth). A valid rabies vaccination certificate or an antibody test are also accepted. No quarantine."
      fr: "Depuis un pays reconnu indemne de rage par l'ACIA (Australie, Fidji, Finlande, Islande, Irlande, Japon, Nouvelle-Zélande, Suède ou Royaume-Uni), un chien de 8 mois ou plus peut entrer avec un certificat vétérinaire attestant l'absence de rage durant les 6 mois précédents et que le chien y a vécu ces 6 mois (ou depuis sa naissance). Un certificat de vaccination antirabique valide ou un titrage sont aussi acceptés. Aucune quarantaine."
      es: "Desde un país reconocido como libre de rabia por la CFIA (Australia, Fiyi, Finlandia, Islandia, Irlanda, Japón, Nueva Zelanda, Suecia o el Reino Unido), un perro de 8 meses o más puede entrar con un certificado veterinario que acredite que el país ha estado libre de rabia durante los 6 meses anteriores y que el perro vivió allí esos 6 meses (o desde su nacimiento). También se aceptan un certificado de vacunación antirrábica válido o una prueba de titulación. Sin cuarentena."
      pt: "Vindo de um país reconhecido pela CFIA como livre de raiva (Austrália, Fiji, Finlândia, Islândia, Irlanda, Japão, Nova Zelândia, Suécia ou Reino Unido), um cachorro de 8 meses ou mais pode entrar com um certificado veterinário atestando que o país esteve livre de raiva nos 6 meses anteriores e que o cachorro morou lá durante esses 6 meses (ou desde o nascimento). Um certificado de vacinação antirrábica válido ou um teste sorológico antirrábico também são aceitos. Sem quarentena."
    cls: ok
  listed:
    title: { en: "From most countries — a valid rabies vaccination certificate", fr: "Depuis la plupart des pays — un certificat de vaccination antirabique valide", es: "Desde la mayoría de los países — un certificado de vacunación antirrábica válido", pt: "Da maioria dos países — um certificado de vacinação antirrábica válido" }
    body:
      en: "From any other (rabies-present) country, including the United States and Mexico, a personal pet dog needs only a valid rabies vaccination certificate in English or French, issued by a licensed vet, that clearly identifies the dog and shows it is currently vaccinated. No antibody test, no waiting period and no quarantine. Simply declare the dog to the CBSA at the border."
      fr: "Depuis tout autre pays (à rage présente), y compris les États-Unis et le Mexique, un chien de compagnie personnel n'a besoin que d'un certificat de vaccination antirabique valide en anglais ou en français, délivré par un vétérinaire agréé, identifiant clairement le chien et montrant qu'il est vacciné à jour. Pas de titrage, pas de délai d'attente et aucune quarantaine. Il suffit de déclarer le chien à l'ASFC à la frontière."
      es: "Desde cualquier otro país (con rabia presente), incluidos Estados Unidos y México, un perro de compañía personal solo necesita un certificado de vacunación antirrábica válido en inglés o francés, expedido por un veterinario autorizado, que identifique claramente al perro y muestre que está vacunado al día. Sin prueba de titulación, sin periodo de espera y sin cuarentena. Basta con declarar al perro ante la CBSA en la frontera."
      pt: "De qualquer outro país (com presença de raiva), inclusive Estados Unidos e México, um cachorro de estimação pessoal precisa apenas de um certificado de vacinação antirrábica válido, em inglês ou francês, emitido por um veterinário credenciado, que identifique claramente o cachorro e mostre que ele está com a vacina em dia. Sem teste sorológico antirrábico, sem período de espera e sem quarentena. Basta declarar o cachorro à CBSA na fronteira."
    cls: warn
  nonListed:
    title: { en: "Commercial imports & high-risk-rabies countries", fr: "Importations commerciales et pays à haut risque de rage", es: "Importaciones comerciales y países de alto riesgo de rabia", pt: "Importações comerciais e países de alto risco de raiva" }
    body:
      en: "Commercial dogs (for resale, adoption, fostering, breeding, show or research) face stricter, permit-based rules, and commercial dogs under 8 months need a permit. Since 28 September 2022, the entry of commercial dogs from countries at high risk for dog rabies is prohibited and permits are no longer issued. A personal pet is not affected by this ban, but if it arrives without a valid rabies certificate a CFIA inspector can order it vaccinated at the owner's expense."
      fr: "Les chiens commerciaux (revente, adoption, placement, élevage, exposition ou recherche) relèvent de règles plus strictes soumises à permis, et les chiens commerciaux de moins de 8 mois exigent un permis. Depuis le 28 septembre 2022, l'entrée de chiens commerciaux depuis les pays à haut risque de rage canine est interdite et les permis ne sont plus délivrés. Un animal personnel n'est pas concerné par cette interdiction, mais s'il arrive sans certificat antirabique valide, un inspecteur de l'ACIA peut ordonner sa vaccination aux frais du propriétaire."
      es: "Los perros comerciales (para reventa, adopción, acogida, cría, exposición o investigación) se rigen por normas más estrictas sujetas a permiso, y los perros comerciales de menos de 8 meses necesitan un permiso. Desde el 28 de septiembre de 2022, la entrada de perros comerciales desde países de alto riesgo de rabia canina está prohibida y ya no se expiden permisos. Una mascota personal no se ve afectada por esta prohibición, pero si llega sin un certificado antirrábico válido, un inspector de la CFIA puede ordenar su vacunación a cargo del propietario."
      pt: "Cachorros comerciais (para revenda, adoção, lar temporário, criação, exposição ou pesquisa) se enquadram em regras mais rígidas, sujeitas a autorização, e cachorros comerciais com menos de 8 meses precisam de autorização. Desde 28 de setembro de 2022, a entrada de cachorros comerciais vindos de países de alto risco de raiva canina está proibida e as autorizações não são mais emitidas. Um animal de estimação pessoal não é atingido por essa proibição, mas, se chegar sem um certificado antirrábico válido, um inspetor da CFIA pode determinar a vacinação dele às custas do dono."
    cls: no

arrival:
  intro:
    en: "When your dog reaches Canada, you declare it at the border and its documents are checked."
    fr: "À l'arrivée de ton chien au Canada, tu le déclare à la frontière et ses documents sont contrôlés."
    es: "Cuando tu perro llega a Canadá, lo declaras en la frontera y se revisan sus documentos."
    pt: "Quando seu cachorro chega ao Canadá, você o declara na fronteira e os documentos dele são conferidos."
  points:
    - en: "Declare your dog to the Canada Border Services Agency (CBSA) at the port of entry."
      fr: "Déclare ton chien à l'Agence des services frontaliers du Canada (ASFC) au point d'entrée."
      es: "Declara a tu perro ante la Agencia de Servicios Fronterizos de Canadá (CBSA) en el punto de entrada."
      pt: "Declare seu cachorro à Canada Border Services Agency (CBSA) no ponto de entrada."
    - en: "CBSA inspects on behalf of the CFIA and may refer the dog to a CFIA veterinarian for further inspection."
      fr: "L'ASFC inspecte pour le compte de l'ACIA et peut renvoyer le chien à un vétérinaire de l'ACIA pour un contrôle plus poussé."
      es: "La CBSA inspecciona en nombre de la CFIA y puede derivar al perro a un veterinario de la CFIA para una inspección más exhaustiva."
      pt: "A CBSA fiscaliza em nome da CFIA e pode encaminhar o cachorro a um veterinário da CFIA para uma inspeção mais detalhada."
    - en: "Carry the original rabies vaccination certificate (in English or French) that clearly identifies your dog; keep printed and digital copies of all records."
      fr: "Munis-toi du certificat original de vaccination antirabique (en anglais ou en français) identifiant clairement ton chien ; conserve des copies papier et numériques de tous les documents."
      es: "Lleva el certificado original de vacunación antirrábica (en inglés o francés) que identifique claramente a tu perro; conserva copias impresas y digitales de todos los documentos."
      pt: "Leve o certificado de vacinação antirrábica original (em inglês ou francês) que identifique claramente seu cachorro; guarde cópias impressas e digitais de todos os documentos."
    - en: "Pet dogs from any country are not placed in post-import quarantine."
      fr: "Les chiens de compagnie de tout pays ne sont pas placés en quarantaine à l'arrivée."
      es: "Los perros de compañía de cualquier país no se someten a cuarentena a la llegada."
      pt: "Cachorros de estimação de qualquer país não são colocados em quarentena na chegada."
    - en: "If the dog arrives without a valid rabies certificate, an inspector may order it vaccinated at the owner's expense."
      fr: "Si le chien arrive sans certificat antirabique valide, un inspecteur peut ordonner sa vaccination aux frais du propriétaire."
      es: "Si el perro llega sin un certificado antirrábico válido, un inspector puede ordenar su vacunación a cargo del propietario."
      pt: "Se o cachorro chegar sem um certificado antirrábico válido, um inspetor pode determinar a vacinação dele às custas do dono."
    - en: "If import requirements are not met, the dog may be ordered removed from Canada, and fines or legal action may follow."
      fr: "Si les exigences d'importation ne sont pas respectées, le chien peut faire l'objet d'un ordre de retrait du Canada, avec d'éventuelles amendes ou poursuites."
      es: "Si no se cumplen los requisitos de importación, se puede ordenar que el perro sea retirado de Canadá, y pueden derivarse multas o acciones legales."
      pt: "Se as exigências de importação não forem cumpridas, o cachorro pode receber ordem de saída do Canadá, com possibilidade de multas ou ação judicial."

