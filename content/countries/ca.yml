restrictedDogs:
  intro:
    en: "Canada has no federal breed ban. The CFIA's import requirements are the same for every dog regardless of breed. Breed-specific rules, where they exist, are set by provinces, territories and municipalities — so a dog that is legal to import into Canada may still be restricted at your destination."
    fr: "Le Canada n'a aucune interdiction de race au niveau fédéral. Les exigences d'importation de l'ACIA sont identiques pour tout chien, quelle que soit sa race. Les règles propres à certaines races, lorsqu'elles existent, sont fixées par les provinces, les territoires et les municipalités — un chien légalement importable au Canada peut donc rester restreint à destination."
    es: "Canadá no tiene ninguna prohibición de razas a nivel federal. Los requisitos de importación de la CFIA son los mismos para todos los perros, sea cual sea su raza. Las normas propias de ciertas razas, cuando existen, las fijan las provincias, los territorios y los municipios — por lo que un perro que es legal importar a Canadá puede seguir estando restringido en tu destino."
    pt: "O Canadá não tem proibição federal de raças. As exigências de importação da CFIA são as mesmas para todos os cachorros, seja qual for a raça. As regras específicas por raça, quando existem, são definidas por províncias, territórios e municípios — ou seja, um cachorro que pode ser legalmente importado para o Canadá ainda pode sofrer restrição no seu destino."
  cat1:
    en: "Federal level: there is no breed-specific import prohibition. CFIA import rules (rabies certificate, age, purpose) apply identically to all breeds; no breed is banned from entering Canada as a personal pet."
    fr: "Niveau fédéral : aucune interdiction d'importation propre à une race. Les règles de l'ACIA (certificat antirabique, âge, but) s'appliquent de façon identique à toutes les races ; aucune race n'est interdite d'entrée au Canada comme animal personnel."
    es: "Nivel federal: no hay ninguna prohibición de importación propia de una raza. Las normas de importación de la CFIA (certificado antirrábico, edad, finalidad) se aplican de forma idéntica a todas las razas; ninguna raza está prohibida de entrar en Canadá como mascota personal."
    pt: "Nível federal: não existe proibição de importação por raça. As regras de importação da CFIA (certificado antirrábico, idade, finalidade) valem igualmente para todas as raças; nenhuma raça está proibida de entrar no Canadá como animal de estimação pessoal."
  cat2:
    en: "Provincial / municipal level: Ontario bans 'pit bulls' under the Dog Owners' Liability Act — defined as the American Pit Bull Terrier, Staffordshire Bull Terrier, American Staffordshire Terrier and any dog substantially similar in appearance. Bringing such a dog into Ontario is prohibited. Some municipalities elsewhere in Canada also have their own breed-specific bylaws."
    fr: "Niveau provincial / municipal : l'Ontario interdit les « pit bulls » en vertu du Dog Owners' Liability Act — définis comme l'American Pit Bull Terrier, le Staffordshire Bull Terrier, l'American Staffordshire Terrier et tout chien d'apparence sensiblement similaire. Faire entrer un tel chien en Ontario est interdit. Certaines municipalités ailleurs au Canada ont aussi leurs propres arrêtés visant des races précises."
    es: "Nivel provincial / municipal: Ontario prohíbe los «pit bulls» en virtud del Dog Owners' Liability Act — definidos como el American Pit Bull Terrier, el Staffordshire Bull Terrier, el American Staffordshire Terrier y cualquier perro de apariencia sustancialmente similar. Introducir un perro así en Ontario está prohibido. Algunos municipios de otras partes de Canadá también tienen sus propias ordenanzas dirigidas a razas concretas."
    pt: "Nível provincial/municipal: Ontário proíbe os 'pit bulls' pela Dog Owners' Liability Act — definidos como American Pit Bull Terrier, Staffordshire Bull Terrier, American Staffordshire Terrier e qualquer cachorro de aparência substancialmente semelhante. É proibido levar um cachorro desses para Ontário. Alguns municípios em outras partes do Canadá também têm seus próprios regulamentos específicos por raça."
  note:
    en: "Always check the rules of the province, territory and city where your dog will actually stay before you travel. Federal admissibility does not override a provincial or municipal breed restriction."
    fr: "Vérifie toujours les règles de la province, du territoire et de la ville où ton chien séjournera réellement avant de voyager. L'admissibilité fédérale ne l'emporte pas sur une restriction de race provinciale ou municipale."
    es: "Consulta siempre las normas de la provincia, el territorio y la ciudad donde tu perro vaya a estar realmente antes de viajar. La admisibilidad federal no prevalece sobre una restricción de raza provincial o municipal."
    pt: "Antes de viajar, verifique sempre as regras da província, do território e da cidade onde seu cachorro vai realmente ficar. A admissibilidade federal não anula uma restrição de raça provincial ou municipal."

checklist:
  - en: "Valid rabies vaccination certificate (English or French) that clearly identifies your dog"
    fr: "Certificat de vaccination antirabique valide (anglais ou français) identifiant clairement ton chien"
    es: "Certificado de vacunación antirrábica válido (inglés o francés) que identifique claramente a tu perro"
    pt: "Certificado de vacinação antirrábica válido (inglês ou francês) que identifique claramente seu cachorro"
  - en: "Check whether you are coming from a CFIA-recognised rabies-free country"
    fr: "Vérifie si tu viens d'un pays reconnu indemne de rage par l'ACIA"
    es: "Comprueba si vienes de un país reconocido como libre de rabia por la CFIA"
    pt: "Verifique se você vem de um país reconhecido pela CFIA como livre de raiva"
  - en: "Rabies antibody test (RNATT ≥0.5 IU/ml) only if used in place of vaccination"
    fr: "Titrage antirabique (RNATT ≥0,5 UI/ml) seulement s'il remplace la vaccination"
    es: "Prueba de titulación de rabia (RNATT ≥0,5 UI/ml) solo si sustituye a la vacunación"
    pt: "Teste sorológico antirrábico (RNATT ≥0,5 UI/ml) apenas se substituir a vacinação"
  - en: "Puppy under 3 months: no rabies certificate needed, but confirm your airline's rules"
    fr: "Chiot de moins de 3 mois : aucun certificat antirabique requis, mais vérifie les règles de la compagnie aérienne"
    es: "Cachorro de menos de 3 meses: no se necesita certificado antirrábico, pero confirma las normas de tu aerolínea"
    pt: "Filhote com menos de 3 meses: nenhum certificado antirrábico exigido, mas confirme as regras da sua companhia aérea"
  - en: "Unaccompanied puppy under 8 months: extra vet health certificate (exam within 72 h)"
    fr: "Chiot non accompagné de moins de 8 mois : certificat sanitaire vétérinaire supplémentaire (examen dans les 72 h)"
    es: "Cachorro no acompañado de menos de 8 meses: certificado sanitario veterinario adicional (examen dentro de las 72 h)"
    pt: "Filhote desacompanhado com menos de 8 meses: certificado veterinário de saúde adicional (exame no máximo 72 h antes)"
  - en: "Declare your dog to the CBSA at the border"
    fr: "Déclare ton chien à l'ASFC à la frontière"
    es: "Declara a tu perro ante la CBSA en la frontera"
    pt: "Declare seu cachorro à CBSA na fronteira"
  - en: "Suitable IATA crate if travelling in the hold"
    fr: "Caisse IATA adaptée si voyage en soute"
    es: "Jaula adecuada conforme a la IATA si viaja en bodega"
    pt: "Caixa de transporte adequada à IATA se a viagem for no porão"
  - en: "Check destination province/city breed bylaws (e.g. Ontario pit bull ban)"
    fr: "Vérifie les arrêtés de race de la province/ville de destination (p. ex. l'interdiction des pit bulls en Ontario)"
    es: "Consulta las ordenanzas sobre razas de la provincia/ciudad de destino (p. ej. la prohibición de pit bulls en Ontario)"
    pt: "Consulte os regulamentos de raça da província/cidade de destino (p. ex. a proibição de pit bulls em Ontário)"

