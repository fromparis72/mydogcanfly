    exceptions: { en: "Puppies under 3 months, unvaccinated, may enter only with prior ANSVSA approval and under strict conditions.", fr: "Un chiot de moins de 3 mois, non vacciné, ne peut entrer qu'avec l'accord préalable de l'ANSVSA et sous conditions strictes.", es: "Un cachorro de menos de 3 meses, sin vacunar, solo puede entrar con la autorización previa de la ANSVSA y bajo condiciones estrictas.", pt: "Filhotes com menos de 3 meses, não vacinados, só podem entrar com autorização prévia da ANSVSA e sob condições estritas." }
