origin:
  scheme: eu
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate and normally no border check."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire et normalement pas de contrôle frontalier."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario y normalmente sin control fronterizo."
      pt: "Um cachorro vindo de outro país da UE precisa de um passaporte europeu que comprove um microchip ISO válido e uma vacinação antirrábica em dia. Sem teste sorológico, sem certificado sanitário e, normalmente, sem controle de fronteira."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Switzerland, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination and an EU animal health certificate endorsed by an official vet before departure. No antibody test is required; enter Romania via a designated travellers' point of entry and present yourself to the authorities there."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Suisse, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire européen visé par un vétérinaire officiel avant le départ. Pas de titrage ; entre en Roumanie par un point d'entrée voyageurs désigné et présente-toi aux autorités sur place."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Suiza, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal de la UE refrendado por un veterinario oficial antes de la salida. No se exige prueba de titulación; entra en Rumanía por un punto de entrada de viajeros designado y preséntate allí ante las autoridades."
      pt: "Vindo de um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Suíça, Japão, Austrália e outros), seu cachorro precisa de microchip, vacinação antirrábica válida e certificado sanitário europeu endossado por um veterinário oficial antes da partida. Não é exigido teste sorológico; entre na Romênia por um ponto de entrada de viajantes designado e apresente-se ali às autoridades."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-designated laboratory, then a compulsory 3-month wait before entry. An endorsed EU animal health certificate is also required."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen visé est également requis."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exige un certificado sanitario animal de la UE refrendado."
      pt: "Vindo de um país não listado (de risco), acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório designado pela UE, e depois 3 meses obrigatórios de espera antes da entrada. Também é exigido um certificado sanitário europeu endossado."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Romania depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien en Roumanie dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Rumanía depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega à Romênia depende do país de onde você veio."
  points:
    - from: eu
      en: "From another EU country: no systematic border check — keep the EU pet passport with you."
      fr: "Depuis un autre pays de l'UE : pas de contrôle systématique — garde le passeport européen sur toi."
      es: "Desde otro país de la UE: sin control fronterizo sistemático — lleva contigo el pasaporte europeo."
      pt: "De outro país da UE: sem controle de fronteira sistemático — leve o passaporte europeu com você."
    - from: non_eu
      en: "From outside the EU: enter via a designated travellers' point of entry and present yourself to the veterinary and customs authorities for documentary and identity checks."
      fr: "Depuis hors UE : entre par un point d'entrée voyageurs désigné et présente-toi aux autorités vétérinaires et douanières pour les contrôles documentaires et d'identité."
      es: "Desde fuera de la UE: entra por un punto de entrada de viajeros designado y preséntate ante las autoridades veterinarias y aduaneras para los controles documentales y de identidad."
      pt: "De fora da UE: entre por um ponto de entrada de viajantes designado e apresente-se às autoridades veterinárias e aduaneiras para as conferências documental e de identidade."
    - en: "For a vaccinated adult dog, no import permit is issued and no prior appointment is needed; puppies under 3 months require prior ANSVSA approval."
      fr: "Pour un chien adulte vacciné, aucun permis d'import n'est délivré et aucun rendez-vous préalable n'est nécessaire ; les chiots de moins de 3 mois nécessitent l'accord préalable de l'ANSVSA."
      es: "Para un perro adulto vacunado, no se expide permiso de importación ni se necesita cita previa; los cachorros de menos de 3 meses requieren la autorización previa de la ANSVSA."
      pt: "Para um cachorro adulto vacinado, nenhuma autorização de importação é emitida e não é preciso agendamento prévio; filhotes com menos de 3 meses precisam de autorização prévia da ANSVSA."
    - en: "Carry original documents (not copies); a certificate in a language other than Romanian should be officially translated."
      fr: "Munis-toi des documents originaux (pas de copies) ; un certificat dans une autre langue que le roumain doit être traduit officiellement."
      es: "Lleva los documentos originales (no copias); un certificado en un idioma que no sea el rumano debe traducirse oficialmente."
      pt: "Leve os documentos originais (não cópias); um certificado em idioma que não seja o romeno deve ser traduzido oficialmente."
    - en: "If documents are missing or invalid, authorities may order re-export, quarantine or, in the worst case, euthanasia — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, les autorités peuvent ordonner réexpédition, quarantaine ou, au pire, euthanasie — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, las autoridades pueden ordenar la reexpedición, la cuarentena o, en el peor de los casos, la eutanasia — a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, as autoridades podem determinar a reexportação, a quarentena ou, na pior das hipóteses, a eutanásia — às custas do dono."
    - en: "Category I dogs (Pit Bull, Boerbull, Bandog types and crosses) are banned from import — do not attempt to bring one in, including in transit."
      fr: "Les chiens de catégorie I (types Pit Bull, Boerbull, Bandog et croisements) sont interdits d'importation — n'essaie pas d'en faire entrer un, y compris en transit."
      es: "Los perros de categoría I (tipos Pit Bull, Boerbull, Bandog y cruces) están prohibidos para la importación — no intentes introducir uno, ni siquiera en tránsito."
      pt: "Cachorros de categoria I (tipos Pit Bull, Boerbull, Bandog e cruzamentos) são proibidos de importação — não tente trazer um, nem mesmo em trânsito."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Romania regulates dangerous dogs under Emergency Ordinance OUG 55/2002 (approved and amended by Law 60/2003), which splits them into two categories. Animal protection is further governed by Law 205/2004. Category assessment is made by the Romanian Kennel Association (AChR)."
    fr: "La Roumanie réglemente les chiens dangereux par l'ordonnance d'urgence OUG 55/2002 (approuvée et modifiée par la loi 60/2003), qui les répartit en deux catégories. La protection animale est en outre régie par la loi 205/2004. L'évaluation de la catégorie est réalisée par l'Association Cynologique Roumaine (AChR)."
    es: "Rumanía regula los perros peligrosos mediante la Ordenanza de Urgencia OUG 55/2002 (aprobada y modificada por la Ley 60/2003), que los divide en dos categorías. La protección animal se rige además por la Ley 205/2004. La evaluación de la categoría la realiza la Asociación Canina Rumana (AChR)."
    pt: "A Romênia regula os cachorros perigosos pela ordonanță de urgență (ordenança de urgência) OUG 55/2002, aprovada e alterada pela Lei 60/2003, que os divide em duas categorias. A proteção animal é regida ainda pela Lei 205/2004. A avaliação da categoria é feita pela Asociația Chinologică Română (AChR), a associação canina romena."
  cat1:
    en: "Category I — fighting and attack dogs assimilated by morphology to Pit Bull, Boerbull (Boerboel) and Bandog types and their crosses. Their import and sale are prohibited: bringing one into Romania is a criminal offence punishable by imprisonment and confiscation (OUG 55/2002 art. 8 and 13). Existing Category I dogs must be neutered, covered by third-party liability insurance, and muzzled and leashed on public roads; they are banned from public premises and public transport."
    fr: "Catégorie I — chiens de combat et d'attaque assimilés par morphologie aux types Pit Bull, Boerbull (Boerboel) et Bandog et leurs croisements. Leur importation et leur vente sont interdites : en faire entrer un en Roumanie est une infraction pénale passible d'emprisonnement et de confiscation (OUG 55/2002 art. 8 et 13). Les chiens de catégorie I déjà détenus doivent être stérilisés, couverts par une assurance responsabilité civile, et muselés et tenus en laisse sur la voie publique ; ils sont interdits dans les lieux publics et les transports en commun."
    es: "Categoría I — perros de pelea y de ataque asimilados por su morfología a los tipos Pit Bull, Boerbull (Boerboel) y Bandog y sus cruces. Su importación y venta están prohibidas: introducir uno en Rumanía es un delito penal castigado con prisión y confiscación (OUG 55/2002 art. 8 y 13). Los perros de categoría I ya existentes deben estar esterilizados, cubiertos por un seguro de responsabilidad civil, y con bozal y correa en la vía pública; tienen prohibido el acceso a locales públicos y al transporte público."
    pt: "Categoria I — cachorros de briga e de ataque equiparados pela morfologia aos tipos Pit Bull, Boerbull (Boerboel) e Bandog e seus cruzamentos. A importação e a venda deles são proibidas: levar um para a Romênia é crime, punível com prisão e confisco (OUG 55/2002, art. 8 e 13). Os cachorros de categoria I já existentes precisam ser castrados, cobertos por um seguro de responsabilidade civil e andar de focinheira e guia na via pública; eles são proibidos em locais públicos e no transporte público."
  cat2:
    en: "Category II — American Staffordshire Terrier, Tosa, Rottweiler, Dogo Argentino, Mastino Napoletano, Fila Brasileiro, Mastiff, Caucasian Shepherd, Cane Corso and their crosses. Import is allowed, but the owner must be at least 18, register the dog with the Romanian Kennel Association, declare it to the local police (identification, rabies vaccination), and keep it muzzled and on a lead in public places."
    fr: "Catégorie II — American Staffordshire Terrier, Tosa, Rottweiler, Dogo Argentino, Mastino Napoletano, Fila Brasileiro, Mastiff, Berger du Caucase, Cane Corso et leurs croisements. L'importation est autorisée, mais le propriétaire doit avoir au moins 18 ans, enregistrer le chien auprès de l'Association Cynologique Roumaine, le déclarer à la police locale (identification, vaccination antirabique) et le tenir muselé et en laisse dans les lieux publics."
    es: "Categoría II — American Staffordshire Terrier, Tosa, Rottweiler, Dogo Argentino, Mastino Napoletano, Fila Brasileiro, Mastín, Perro pastor del Cáucaso, Cane Corso y sus cruces. La importación está permitida, pero el propietario debe tener al menos 18 años, registrar al perro en la Asociación Canina Rumana, declararlo a la policía local (identificación, vacunación antirrábica) y mantenerlo con bozal y correa en los lugares públicos."
    pt: "Categoria II — American Staffordshire Terrier, Tosa, Rottweiler, Dogo Argentino, Mastino Napoletano, Fila Brasileiro, Mastiff, pastor do Cáucaso, Cane Corso e seus cruzamentos. A importação é permitida, mas o dono precisa ter pelo menos 18 anos, registrar o cachorro na Asociația Chinologică Română (associação canina romena), declará-lo à polícia local (identificação, vacinação antirrábica) e mantê-lo de focinheira e na guia em locais públicos."
  note:
    en: "Beyond the two categories, breeds such as the German Shepherd, Belgian Malinois, Dobermann, Presa Canario, Central Asian Shepherd, Komondor, Kuvasz and Giant Schnauzer and their crosses must also wear a muzzle and lead in public. Only an AChR assessment decides a dog's category — confirm your dog's status before travelling."
    fr: "Au-delà des deux catégories, des races comme le Berger allemand, le Malinois, le Dobermann, le Dogue des Canaries (Presa Canario), le Berger d'Asie centrale, le Komondor, le Kuvasz et le Schnauzer géant et leurs croisements doivent aussi porter muselière et laisse en public. Seule une évaluation de l'AChR tranche la catégorie d'un chien — confirme le statut de ton chien avant de voyager."
    es: "Más allá de las dos categorías, razas como el Pastor Alemán, el Malinois belga, el Dóberman, el Presa Canario, el Pastor de Asia Central, el Komondor, el Kuvasz y el Schnauzer gigante y sus cruces también deben llevar bozal y correa en público. Solo una evaluación de la AChR decide la categoría de un perro — confirma el estatus de tu perro antes de viajar."
    pt: "Além das duas categorias, raças como o pastor-alemão, o malinois belga, o dobermann, o Presa Canario, o pastor da Ásia Central, o komondor, o kuvasz e o schnauzer gigante e seus cruzamentos também precisam usar focinheira e guia em público. Só uma avaliação da AChR define a categoria de um cachorro — confirme a situação do seu cachorro antes de viajar."

