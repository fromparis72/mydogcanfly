# Country Entry Guide — Ethiopia (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_et
iso2: "ET"
name: { en: "Ethiopia", fr: "Éthiopie", es: "Etiopía", pt: "Etiópia" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
exit:
  authority: Ministry of Agriculture
  authorityUrl: http://moa.gov.et/
  intro:
    en: "Ethiopia is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Ministry of Agriculture's Animal Health Regulatory Directorate."
    fr: "L'Éthiopie est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par la Direction de la réglementation de la santé animale du ministère de l'Agriculture."
    es: "Etiopía no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por la Dirección Reguladora de Sanidad Animal del Ministerio de Agricultura."
    pt: "A Etiópia é um país não listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pela Diretoria Reguladora de Saúde Animal do Ministério da Agricultura."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Providenciar com antecedência o teste sorológico antirrábico (titulação): exame de sangue em laboratório aprovado pela UE, pelo menos 30 dias após a vacinação — um resultado válido é indispensável para voltar à UE e não pode ser resolvido de última hora."
    - timing: window
      scope: any
      text:
        en: "The Ministry of Agriculture's Animal Health Regulatory Directorate regulates live-animal export and issues the veterinary certificate before departure."
        fr: "La Direction de la réglementation de la santé animale du ministère de l'Agriculture régule l'export d'animaux vivants et délivre le certificat vétérinaire avant le départ."
        es: "La Dirección Reguladora de Sanidad Animal del Ministerio de Agricultura regula la exportación de animales vivos y emite el certificado veterinario antes de salir."
        pt: "A Diretoria Reguladora de Saúde Animal do Ministério da Agricultura regula a exportação de animais vivos e emite o certificado veterinário antes da partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o cachorro já tinha um teste sorológico antirrábico (titulação) válido para a UE antes da partida, ele permanece válido por toda a vida enquanto a vacinação antirrábica estiver em dia — vale a pena verificar isso antes de viajar."

hero:
  h1: { en: "Traveling to Ethiopia with your dog", fr: "Voyager en Éthiopie avec ton chien", es: "Viajar a Etiopía con tu perro", pt: "Viajar para a Etiópia com seu cachorro" }
  intro:
    en: >-
      Ethiopia is not an EU country, and entry for a dog is controlled by its own veterinary
      authority — the Ethiopian Agricultural Authority (EAA), the Animal Regulatory Sector under the
      Ministry of Agriculture. The central rule is clear: live animals may not be imported without an
      import permit obtained in advance from the Ethiopian authority, and the dog must be accompanied
      by an official veterinary health certificate issued by the competent (government) veterinary
      authority of the country of departure. What is unusual about Ethiopia is that the detailed pet
      conditions are not published in a public checklist: USDA APHIS confirms that the specific
      requirements for pets are "not known" and directs travellers to obtain the ministry import
      permit, which itself sets out the exact conditions for your dog. Rabies is endemic in Ethiopia,
      so a rabies vaccination will almost certainly be part of those conditions, but the precise timing,
      microchip, blood-test and quarantine rules are decided on your permit. This guide explains what is
      officially confirmed, and flags clearly what remains unpublished, so you know what to ask before
      you book.
    fr: >-
      L'Éthiopie n'est pas un pays de l'UE, et l'entrée d'un chien est contrôlée par sa propre autorité
      vétérinaire — l'Ethiopian Agricultural Authority (EAA), secteur de réglementation animale rattaché
      au ministère de l'Agriculture. La règle centrale est claire : aucun animal vivant ne peut être
      importé sans un permis d'importation obtenu à l'avance auprès de l'autorité éthiopienne, et le
      chien doit être accompagné d'un certificat vétérinaire officiel délivré par l'autorité vétérinaire
      compétente (gouvernementale) du pays de départ. La particularité de l'Éthiopie est que le détail
      des conditions applicables aux animaux de compagnie n'est pas publié dans une liste publique :
      l'USDA APHIS confirme que les exigences spécifiques aux animaux de compagnie sont « non connues »
      et renvoie les voyageurs vers le permis d'importation du ministère, qui fixe lui-même les
      conditions exactes pour ton chien. La rage est endémique en Éthiopie : une vaccination
      antirabique fera donc très probablement partie de ces conditions, mais le calendrier précis, la
      puce, le test sanguin et les règles de quarantaine sont fixés sur ton permis. Ce guide indique
      ce qui est officiellement confirmé et signale clairement ce qui reste non publié, pour savoir quoi
      demander avant de réserver.
    es: >-
      Etiopía no es un país de la UE, y la entrada de un perro está controlada por su propia autoridad
      veterinaria — la Ethiopian Agricultural Authority (EAA), el Sector de Regulación Animal adscrito
      al Ministerio de Agricultura. La regla central es clara: no se pueden importar animales vivos sin
      un permiso de importación obtenido por adelantado ante la autoridad etíope, y el perro debe ir
      acompañado de un certificado sanitario veterinario oficial expedido por la autoridad veterinaria
      competente (gubernamental) del país de salida. Lo peculiar de Etiopía es que las condiciones
      detalladas para las mascotas no se publican en una lista pública: USDA APHIS confirma que los
      requisitos específicos para las mascotas son "no conocidos" y remite a los viajeros a obtener el
      permiso de importación del ministerio, que fija por sí mismo las condiciones exactas para tu
      perro. La rabia es endémica en Etiopía, por lo que una vacunación antirrábica formará casi con
      seguridad parte de esas condiciones, pero el calendario preciso, el microchip, el análisis de
      sangre y las normas de cuarentena se deciden en tu permiso. Esta guía explica lo que está
      oficialmente confirmado y señala con claridad lo que sigue sin publicarse, para que sepas qué
      preguntar antes de reservar.

    pt: "A Etiópia não é um país da UE, e a entrada de um cachorro é controlada pela sua própria autoridade veterinária — a Ethiopian Agricultural Authority (EAA), o setor de regulação animal do Ministério da Agricultura. A regra central é clara: animais vivos não podem ser importados sem uma autorização de importação obtida com antecedência junto à autoridade etíope, e o cachorro deve estar acompanhado de um atestado de saúde veterinário oficial, emitido pela autoridade veterinária competente (governamental) do país de partida. O que é incomum na Etiópia é que as condições detalhadas para animais de companhia não são publicadas em uma lista pública: o USDA APHIS confirma que as exigências específicas para animais de companhia \"não são conhecidas\" e orienta os viajantes a obter a autorização de importação do ministério, que por sua vez define as condições exatas para o cachorro. A raiva é endêmica na Etiópia, por isso uma vacinação antirrábica quase certamente fará parte dessas condições, mas as regras precisas de calendário, microchip, exame de sangue e quarentena são decididas na autorização. Este guia explica o que é oficialmente confirmado e assinala claramente o que permanece não comunicado, para que você saiba o que perguntar antes de reservar."
difficulty:
  level: difficult
  label: { en: "Difficult — mandatory import permit, few published specifics", fr: "Difficile — permis d'importation obligatoire, peu de détails publiés", es: "Difícil — permiso de importación obligatorio, pocos detalles publicados", pt: "Difícil — autorização de importação obrigatória, poucos detalhes publicados" }

prepTime:
  eu:
    en: "From Europe: no EU-passport shortcut. Allow well ahead of travel to obtain the EAA import permit and an official government-vet health certificate; the permit sets the exact conditions, so start early and confirm the timeline with the authority."
    fr: "Depuis l'Europe : aucun raccourci « passeport UE ». Prévois largement avant le départ pour obtenir le permis d'importation de l'EAA et un certificat sanitaire officiel du vétérinaire gouvernemental ; le permis fixe les conditions exactes, alors anticipe et confirme le calendrier avec l'autorité."
    es: "Desde Europa: no hay atajo de pasaporte de la UE. Prevé mucho tiempo antes del viaje para obtener el permiso de importación de la EAA y un certificado sanitario oficial del veterinario gubernamental; el permiso fija las condiciones exactas, así que empieza pronto y confirma el calendario con la autoridad."
    pt: "Da Europa: nenhum atalho pelo passaporte europeu. Providenciar com bastante antecedência a autorização de importação da EAA e um atestado de saúde veterinário governamental oficial; a autorização define as condições exatas, portanto começar cedo e confirmar o prazo com a autoridade."
  listed:
    en: "Ethiopia does not publish a listed-country / origin-tiering scheme for pet entry. The same import-permit and health-certificate process applies; plan around the permit, not around an origin list."
    fr: "L'Éthiopie ne publie pas de schéma de pays « listés » ni de classement par origine pour l'entrée des animaux. Le même processus de permis et de certificat s'applique ; organise-toi autour du permis, pas d'une liste d'origine."
    es: "Etiopía no publica un esquema de países listados ni de clasificación por origen para la entrada de mascotas. Se aplica el mismo proceso de permiso de importación y certificado sanitario; organízate en torno al permiso, no a una lista de orígenes."
    pt: "A Etiópia não publica um esquema de países listados / categorização por origem para a entrada de animais de companhia. Aplica-se o mesmo processo de autorização de importação e atestado de saúde; planejar em função da autorização, e não de uma lista de origens."
  nonListed:
    en: "From any origin: the exact steps depend on the conditions written on your EAA import permit. Because published detail is limited, confirm each requirement directly with the authority before booking."
    fr: "Depuis toute origine : les étapes exactes dépendent des conditions inscrites sur ton permis d'importation EAA. Le détail publié étant limité, confirme chaque exigence directement auprès de l'autorité avant de réserver."
    es: "Desde cualquier origen: los pasos exactos dependen de las condiciones escritas en tu permiso de importación de la EAA. Como el detalle publicado es limitado, confirma cada requisito directamente con la autoridad antes de reservar."
    pt: "De qualquer origem: as etapas exatas dependem das condições indicadas na autorização de importação da EAA. Como o detalhamento publicado é limitado, confirmar cada exigência diretamente com a autoridade antes de reservar."

