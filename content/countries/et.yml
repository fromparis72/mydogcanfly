restrictedDogs:
  intro:
    en: "Entry into Ethiopia is controlled through the import permit and veterinary requirements, not through breed. We located no official Ethiopian breed-specific import ban or dangerous-dog register."
    fr: "L'entrée en Éthiopie est encadrée par le permis d'importation et les exigences vétérinaires, non par la race. Nous n'avons localisé aucune interdiction d'importation par race ni registre de chiens dangereux officiel éthiopien."
    es: "La entrada en Etiopía se controla mediante el permiso de importación y los requisitos veterinarios, no por raza. No localizamos ninguna prohibición de importación por raza ni registro de perros peligrosos oficial etíope."
    pt: "A entrada na Etiópia é controlada por meio da autorização de importação e das exigências veterinárias, e não por raça. Não foi localizado nenhum registro oficial etíope de proibição de importação por raça ou de cachorros perigosos."
  cat1:
    en: "No prohibited-breed list found: official Ethiopian sources do not name banned breeds for import. A compliant dog of any breed should be importable once the permit and health certificate are in order — but confirm, as absence of a published list is not a guarantee."
    fr: "Aucune liste de races interdites trouvée : les sources officielles éthiopiennes ne nomment pas de races interdites à l'importation. Un chien conforme, quelle que soit sa race, devrait pouvoir être importé dès lors que le permis et le certificat sanitaire sont en règle — mais vérifie, car l'absence de liste publiée n'est pas une garantie."
    es: "No se encontró lista de razas prohibidas: las fuentes oficiales etíopes no nombran razas prohibidas para la importación. Un perro conforme, de cualquier raza, debería poder importarse una vez que el permiso y el certificado sanitario estén en regla — pero confírmalo, ya que la ausencia de una lista publicada no es una garantía."
    pt: "Nenhuma lista de raças proibidas encontrada: as fontes oficiais etíopes não nomeiam raças proibidas para importação. Um cachorro em conformidade de qualquer raça deveria poder ser importado uma vez que a autorização e o atestado de saúde estejam em ordem — mas convém confirmar, já que a ausência de uma lista publicada não é uma garantia."
  cat2:
    en: "No licence-category breed scheme found: we found no official Ethiopian tier of breeds requiring a special permit to import. Any such national rule would be enforced by the authority and should be checked directly before travel."
    fr: "Aucun régime de races sous licence trouvé : nous n'avons trouvé aucune catégorie officielle éthiopienne de races nécessitant un permis spécial à l'importation. Une telle règle nationale serait appliquée par l'autorité et doit être vérifiée directement avant le voyage."
    es: "No se encontró ningún régimen de razas con licencia: no hallamos ninguna categoría oficial etíope de razas que requieran un permiso especial para importar. Cualquier norma nacional de ese tipo la aplicaría la autoridad y debe comprobarse directamente antes de viajar."
    pt: "Nenhum esquema de categoria de licença por raça encontrado: não foi encontrada nenhuma categoria oficial etíope de raças que exija uma autorização especial para importação. Qualquer regra nacional desse tipo seria aplicada pela autoridade e deve ser verificada diretamente antes da viagem."
  note:
    en: "Because national rules can change and are not fully published online, verify the current breed and import conditions directly with the Ethiopian Agricultural Authority before you travel."
    fr: "Les règles nationales pouvant évoluer et n'étant pas entièrement publiées en ligne, vérifie les conditions de race et d'importation à jour directement auprès de l'Ethiopian Agricultural Authority avant de voyager."
    es: "Como las normas nacionales pueden cambiar y no están totalmente publicadas en línea, verifica las condiciones de raza e importación actuales directamente con la Ethiopian Agricultural Authority antes de viajar."
    pt: "Como as regras nacionais podem mudar e não estão totalmente publicadas on-line, verificar diretamente com a Ethiopian Agricultural Authority as condições vigentes de raça e importação antes de viajar."

checklist:
  - en: "Apply for the EAA import permit well before travel (state origin, transport, arrival date, transit countries, port of entry)"
    fr: "Demande le permis d'importation EAA bien avant le voyage (précise origine, transport, date d'arrivée, pays traversés, point d'entrée)"
    es: "Solicita el permiso de importación de la EAA bastante antes del viaje (indica origen, transporte, fecha de llegada, países en tránsito, punto de entrada)"
    pt: "Solicitar a autorização de importação da EAA com bastante antecedência (indicando origem, transporte, data de chegada, países de trânsito e ponto de entrada)"
  - en: "Ask the EAA for the exact vaccination, identification and certificate conditions for your dog"
    fr: "Demande à l'EAA les conditions exactes de vaccination, d'identification et de certificat pour ton chien"
    es: "Pide a la EAA las condiciones exactas de vacunación, identificación y certificado para tu perro"
    pt: "Perguntar à EAA as condições exatas de vacinação, identificação e certificado para o cachorro"
  - en: "Obtain an official veterinary health certificate endorsed by your country's government veterinary authority"
    fr: "Obtiens un certificat vétérinaire officiel visé par l'autorité vétérinaire gouvernementale de ton pays"
    es: "Obtén un certificado sanitario veterinario oficial refrendado por la autoridad veterinaria gubernamental de tu país"
    pt: "Obter um atestado de saúde veterinário oficial endossado pela autoridade veterinária governamental do país de partida"
  - en: "Confirm rabies-vaccination timing (Ethiopia is rabies-endemic) and whether a blood test is asked for"
    fr: "Confirme le calendrier de la vaccination antirabique (rage endémique en Éthiopie) et si un titrage est demandé"
    es: "Confirma el calendario de la vacunación antirrábica (Etiopía es endémica de rabia) y si se solicita un análisis de sangre"
    pt: "Confirmar o calendário da vacinação antirrábica (a Etiópia tem raiva endêmica) e se um exame de sangue é solicitado"
  - en: "Consider an ISO 11784/11785 microchip for identification and check it with the EAA"
    fr: "Envisagez une puce ISO 11784/11785 pour l'identification et vérifie-la auprès de l'EAA"
    es: "Considera un microchip ISO 11784/11785 para la identificación y compruébalo con la EAA"
    pt: "Considerar um microchip ISO 11784/11785 para identificação e confirmá-lo com a EAA"
  - en: "Carry original permit and certificates to present at the port of entry (not copies)"
    fr: "Munis-toi du permis et des certificats originaux à présenter au point d'entrée (pas de copies)"
    es: "Lleva el permiso y los certificados originales para presentarlos en el punto de entrada (no copias)"
    pt: "Levar a autorização e os certificados originais para apresentar no ponto de entrada (não cópias)"
  - en: "Airline reservation and a suitable travel crate if travelling in the hold"
    fr: "Réservation et caisse de transport adaptée si voyage en soute"
    es: "Reserva de la aerolínea y una jaula de transporte adecuada si viaja en bodega"
    pt: "Reserva na companhia aérea e caixa de transporte adequada à IATA em caso de viagem no porão"
  - en: "Verify current breed rules with the EAA before booking"
    fr: "Vérifie les règles de race à jour auprès de l'EAA avant de réserver"
    es: "Verifica las normas de razas actuales con la EAA antes de reservar"
    pt: "Verificar as regras de raça vigentes com a EAA antes de reservar"

