# Country Entry Guide — Panama (source of truth, bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_pa
iso2: "PA"
name: { en: "Panama", fr: "Panama", es: "Panamá", pt: "Panamá" }
region: { en: "Central America", fr: "Amérique centrale", es: "América Central", pt: "América Central" }


regime: non_listed
exit:
  authority: MIDA / DECA
  authorityUrl: https://mida.gob.pa/direcciones/deca/exportacion-de-animales-menores/
  intro:
    en: "Panama is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by MIDA (Dirección de Cuarentena Agropecuaria, DECA)."
    fr: "Le Panama est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par le MIDA (Dirección de Cuarentena Agropecuaria, DECA)."
    es: "Panamá no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el MIDA (Dirección de Cuarentena Agropecuaria, DECA)."
    pt: "O Panamá é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação visado pelo MIDA (Dirección de Cuarentena Agropecuaria, DECA)."
  steps:
    - timing: longlead
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      text:
        en: "MIDA, through DECA, issues the export phytozoosanitary licence (requested online via SITERPA) from a private vet's good-health certificate dated within 72h."
        fr: "Le MIDA, via la DECA, délivre la licence phytozoosanitaire d'export (demandée en ligne via SITERPA) à partir d'un certificat de bonne santé de moins de 72 h."
        es: "El MIDA, a través de la DECA, emite la licencia fitozoosanitaria de exportación (solicitada en línea vía SITERPA) a partir de un certificado de buena salud de menos de 72 h."
        pt: "O MIDA, por meio da DECA, emite a licença fitozoossanitária de exportação (solicitada on-line pelo SITERPA) a partir de um atestado de boa saúde de um veterinário particular emitido há no máximo 72 h."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Panama with your dog", fr: "Voyager au Panama avec ton chien", es: "Viajar a Panamá con tu perro", pt: "Viajar ao Panamá com seu cachorro" }
  intro:
    en: >-
      Panama welcomes dogs, but it runs its own national scheme — not the EU pet-passport system. Two
      authorities share control: the Ministry of Agricultural Development (MIDA), through its Executive
      Directorate of Agricultural Quarantine, and the Ministry of Health (MINSA), through its Zoonosis
      Control Department. Every dog needs an official Export Zoosanitary Certificate from the departure
      country, apostilled or consularized and no more than 30 days old, a veterinary good-health
      certificate, and up-to-date vaccinations (rabies plus distemper, hepatitis, leptospirosis and
      parvovirus). You must notify the authorities 3 to 5 working days before arrival, and Panama operates
      a home-quarantine system that can require keeping your dog at your residence for up to 40 days. What
      you must prepare still depends on your dog's departure country and history, because the certificate
      must confirm it is healthy and correctly vaccinated. This guide explains each step before you book.
    fr: >-
      Le Panama accueille les chiens, mais applique son propre dispositif national — pas le système du
      passeport européen. Deux autorités se partagent le contrôle : le ministère du Développement
      agricole (MIDA), via sa Direction exécutive de la quarantaine agricole, et le ministère de la Santé
      (MINSA), via son département de contrôle des zoonoses. Tout chien doit disposer d'un certificat
      zoosanitaire d'exportation officiel du pays de départ, apostillé ou consularisé et daté de 30 jours
      au maximum, d'un certificat vétérinaire de bonne santé, et de vaccinations à jour (rage plus maladie
      de Carré, hépatite, leptospirose et parvovirose). Tu dois prévenir les autorités 3 à 5 jours
      ouvrables avant l'arrivée, et le Panama applique un système de quarantaine à domicile pouvant imposer
      de garder le chien à ton résidence jusqu'à 40 jours. Ce qu'il faut préparer dépend aussi du pays de
      départ et de l'historique du chien, car le certificat doit confirmer qu'il est sain et correctement
      vacciné. Ce guide détaille chaque étape avant de réserver.
    es: >-
      Panamá acoge a los perros, pero aplica su propio esquema nacional — no el sistema del pasaporte
      europeo para mascotas. Dos autoridades comparten el control: el Ministerio de Desarrollo
      Agropecuario (MIDA), a través de su Dirección Ejecutiva de Cuarentena Agropecuaria, y el Ministerio
      de Salud (MINSA), a través de su Departamento de Control de Zoonosis. Todo perro necesita un
      Certificado Zoosanitario de Exportación oficial del país de salida, apostillado o consularizado y con
      una antigüedad no mayor a 30 días, un certificado veterinario de buena salud y vacunas al día (rabia
      más moquillo, hepatitis, leptospirosis y parvovirus). Debes notificar a las autoridades de 3 a 5 días
      hábiles antes de la llegada, y Panamá aplica un sistema de cuarentena domiciliaria que puede exigir
      mantener a tu perro en tu residencia hasta 40 días. Lo que debes preparar también depende del país de
      salida y del historial de tu perro, porque el certificado debe confirmar que está sano y
      correctamente vacunado. Esta guía explica cada paso antes de que reserves.

    pt: "O Panamá recebe cachorros, mas aplica seu próprio esquema nacional — não o sistema do passaporte europeu para animais. Duas autoridades dividem o controle: o Ministério do Desenvolvimento Agropecuário (MIDA), por meio da sua Direção Executiva de Quarentena Agropecuária, e o Ministério da Saúde (MINSA), por meio do seu Departamento de Controle de Zoonoses. Todo cachorro precisa de um Certificado Zoossanitário de Exportação oficial do país de partida, apostilado ou consularizado e emitido há no máximo 30 dias, de um atestado veterinário de boa saúde e de vacinas em dia (raiva, mais cinomose, hepatite, leptospirose e parvovirose). Você precisa avisar as autoridades de 3 a 5 dias úteis antes da chegada, e o Panamá aplica um sistema de quarentena domiciliar que pode exigir manter o cachorro na sua residência por até 40 dias. O que você tem de preparar também depende do país de partida e do histórico do seu cachorro, porque o certificado precisa confirmar que ele está saudável e corretamente vacinado. Este guia explica cada etapa antes de você reservar."
difficulty:
  level: moderate
  label: { en: "Moderate — legalized certificate, prior notice and a home-quarantine system", fr: "Modéré — certificat légalisé, notification préalable et système de quarantaine à domicile", es: "Moderado — certificado legalizado, notificación previa y un sistema de cuarentena domiciliaria", pt: "Moderada — certificado legalizado, aviso prévio e sistema de quarentena domiciliar" }

prepTime:
  eu:
    en: "A few days if the rabies and core vaccines are already valid — but allow time to have the Export Zoosanitary Certificate apostilled or consularized (valid 30 days) and to notify MINSA 3–5 working days before arrival."
    fr: "Quelques jours si la rage et les vaccins de base sont déjà valides — mais prévois du temps pour faire apostiller ou consulariser le certificat zoosanitaire d'exportation (valable 30 jours) et pour prévenir le MINSA 3 à 5 jours ouvrables avant l'arrivée."
    es: "Unos días si la rabia y las vacunas de base ya son válidas — pero prevé tiempo para apostillar o consularizar el Certificado Zoosanitario de Exportación (válido 30 días) y para notificar al MINSA de 3 a 5 días hábiles antes de la llegada."
    pt: "Alguns dias se a vacina antirrábica e as vacinas essenciais já estiverem válidas — mas reserve tempo para apostilar ou consularizar o Certificado Zoossanitário de Exportação (válido por 30 dias) e para avisar o MINSA de 3 a 5 dias úteis antes da chegada."
  listed:
    en: "~1 month if a first rabies shot is still needed: it must be given from 3 months of age and at least 30 days before travel, so a first-time-vaccinated dog is about 4 months old at travel."
    fr: "~1 mois si une première vaccination antirabique reste à faire : elle doit être administrée dès 3 mois d'âge et au moins 30 jours avant le départ ; un chien primo-vacciné a donc environ 4 mois au voyage."
    es: "~1 mes si aún falta la primera vacuna antirrábica: debe aplicarse a partir de los 3 meses de edad y al menos 30 días antes del viaje, por lo que un perro vacunado por primera vez tiene unos 4 meses al viajar."
    pt: "~1 mês se ainda faltar a primeira dose antirrábica: ela só pode ser aplicada a partir dos 3 meses de idade e no mínimo 30 dias antes da viagem, então um cachorro vacinado pela primeira vez tem cerca de 4 meses na data da viagem."
  nonListed:
    en: "Plan for the home-quarantine step: MINSA can require the dog to be kept at your residence for up to 40 days after arrival, with a B/.130 fee paid in cash."
    fr: "Prévois l'étape de quarantaine à domicile : le MINSA peut imposer de garder le chien à ton résidence jusqu'à 40 jours après l'arrivée, avec des frais de 130 B/. payés en espèces."
    es: "Prevé la etapa de cuarentena domiciliaria: el MINSA puede exigir mantener al perro en tu residencia hasta 40 días después de la llegada, con una tarifa de B/.130 pagada en efectivo."
    pt: "Conte com a etapa de quarentena domiciliar: o MINSA pode exigir que o cachorro fique na sua residência por até 40 dias depois da chegada, com uma taxa de B/.130 paga em dinheiro."

