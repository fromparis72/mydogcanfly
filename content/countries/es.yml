origin:
  scheme: eu
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate and normally no border check. Andorra, Switzerland, Norway, Northern Ireland and the other territories treated as equivalent to the EU follow this same simplified route."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire et normalement pas de contrôle frontalier. Andorre, la Suisse, la Norvège, l'Irlande du Nord et les autres territoires assimilés à l'UE suivent ce même parcours simplifié."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario y normalmente sin control fronterizo. Andorra, Suiza, Noruega, Irlanda del Norte y los demás territorios asimilados a la UE siguen esta misma vía simplificada."
      pt: "Um cachorro vindo de outro país da UE precisa de um passaporte europeu que comprove um microchip ISO válido e uma vacinação antirrábica em dia. Sem teste sorológico, sem certificado sanitário e, normalmente, sem controle de fronteira. Andorra, Suíça, Noruega, Irlanda do Norte e os demais territórios equiparados à UE seguem essa mesma via simplificada."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Switzerland, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination and an EU animal health certificate signed by an official vet before departure and presented at least in Spanish. No antibody test is required; enter via an authorised travellers' point of entry and declare yourself to the Guardia Civil / customs."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Suisse, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire européen signé par un vétérinaire officiel avant le départ et présenté au moins en espagnol. Pas de titrage ; entre par un point d'entrée voyageurs autorisé et déclare-toi à la Guardia Civil / douane."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Suiza, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal de la UE firmado por un veterinario oficial antes de la salida y presentado al menos en español. No se exige prueba de titulación; entra por un punto de entrada de viajeros autorizado y preséntate ante la Guardia Civil / aduanas."
      pt: "Vindo de um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Suíça, Japão, Austrália e outros), seu cachorro precisa de microchip, vacinação antirrábica válida e um certificado sanitário europeu assinado por um veterinário oficial antes da partida e apresentado pelo menos em espanhol. Não é exigido teste sorológico; entre por um ponto de entrada de viajantes autorizado e apresente-se à Guardia Civil / alfândega."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-designated laboratory, then a compulsory 3-month wait before entry. A signed EU animal health certificate (in Spanish) plus a certified copy of the identification and vaccination records are also required."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen signé (en espagnol) et une copie certifiée des données d'identification et de vaccination sont également requis."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exigen un certificado sanitario animal de la UE firmado (en español) y una copia certificada de los registros de identificación y vacunación."
      pt: "Vindo de um país não listado (de risco), acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório designado pela UE, e depois 3 meses obrigatórios de espera antes da entrada. Também são exigidos um certificado sanitário europeu assinado (em espanhol) e uma cópia autenticada dos registros de identificação e vacinação."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Spain depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien en Espagne dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a España depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega à Espanha depende de onde você embarcou."
  points:
    - from: eu
      en: "From another EU country: no systematic border check — keep the EU pet passport with you."
      fr: "Depuis un autre pays de l'UE : pas de contrôle systématique — garde le passeport européen sur toi."
      es: "Desde otro país de la UE: sin control fronterizo sistemático — lleva contigo el pasaporte europeo."
      pt: "De outro país da UE: sem controle de fronteira sistemático — leve o passaporte europeu com você."
    - from: non_eu
      en: "From outside the EU: enter via an authorised travellers' point of entry (PEV) and declare yourself to the Guardia Civil / customs for documentary and identity (microchip) checks."
      fr: "Depuis hors UE : entre par un point d'entrée voyageurs autorisé (PEV) et déclare-toi à la Guardia Civil / douane pour les contrôles documentaires et d'identité (lecture de la puce)."
      es: "Desde fuera de la UE: entra por un punto de entrada de viajeros autorizado (PEV) y preséntate ante la Guardia Civil / aduanas para los controles documentales y de identidad (lectura del microchip)."
      pt: "De fora da UE: entre por um ponto de entrada de viajantes autorizado (PEV) e apresente-se à Guardia Civil / alfândega para os controles documental e de identidade (leitura do microchip)."
    - en: "Entering with a pet through a customs post that is not an authorised entry point is not permitted and can lead to the animal being sent back."
      fr: "Entrer avec un animal par un poste douanier qui n'est pas un point d'entrée autorisé est interdit et peut entraîner le renvoi de l'animal."
      es: "Entrar con una mascota por un puesto aduanero que no sea un punto de entrada autorizado no está permitido y puede provocar la devolución del animal."
      pt: "Entrar com um animal de estimação por um posto alfandegário que não seja um ponto de entrada autorizado não é permitido e pode levar à devolução do animal."
    - en: "No import permit is issued and no prior appointment with customs is needed."
      fr: "Aucun permis d'import n'est délivré et aucun rendez-vous préalable avec la douane n'est nécessaire."
      es: "No se expide ningún permiso de importación ni se necesita cita previa con la aduana."
      pt: "Não é emitida autorização de importação e não é preciso agendamento prévio com a alfândega."
    - en: "Carry the original documents (not copies); the health certificate must be presented at least in Spanish."
      fr: "Munis-toi des documents originaux (pas de copies) ; le certificat sanitaire doit être présenté au moins en espagnol."
      es: "Lleva los documentos originales (no copias); el certificado sanitario debe presentarse al menos en español."
      pt: "Leve os documentos originais (não cópias); o certificado sanitário deve ser apresentado pelo menos em espanhol."
    - en: "If documents are missing or invalid, authorities may order quarantine, re-export or, in the worst case, euthanasia — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, les autorités peuvent ordonner quarantaine, réexpédition ou, au pire, euthanasie — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, las autoridades pueden ordenar la cuarentena, la reexpedición o, en el peor de los casos, la eutanasia — a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, as autoridades podem determinar quarentena, reexportação ou, na pior das hipóteses, eutanásia — às custas do dono."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Spain regulates potentially dangerous dogs (perros potencialmente peligrosos, PPP) under Law 50/1999 and Royal Decree 287/2002. Unlike France, PPP dogs are not banned from import: they may enter and be kept, but the owner must hold a PPP licence. The 2023 Animal Welfare Law (Ley 7/2023) kept the PPP regime in force; a proposal to replace breed-based classification with an individual behaviour assessment was not included in the final text and awaits regulatory development."
    fr: "L'Espagne réglemente les chiens potentiellement dangereux (perros potencialmente peligrosos, PPP) via la loi 50/1999 et le décret royal 287/2002. Contrairement à la France, les chiens PPP ne sont pas interdits d'importation : ils peuvent entrer et être détenus, mais le propriétaire doit posséder une licence PPP. La loi de bien-être animal de 2023 (Ley 7/2023) a maintenu le régime PPP ; la proposition de remplacer la classification par race par une évaluation comportementale individuelle n'a pas été retenue dans le texte final et reste à développer par règlement."
    es: "España regula los perros potencialmente peligrosos (PPP) mediante la Ley 50/1999 y el Real Decreto 287/2002. A diferencia de Francia, los perros PPP no están prohibidos para la importación: pueden entrar y tenerse, pero el propietario debe disponer de una licencia PPP. La Ley de Bienestar Animal de 2023 (Ley 7/2023) mantuvo en vigor el régimen PPP; la propuesta de sustituir la clasificación por razas por una evaluación individual del comportamiento no se incluyó en el texto final y queda pendiente de desarrollo reglamentario."
    pt: "A Espanha regulamenta os cachorros potencialmente perigosos (perros potencialmente peligrosos, PPP) pela Lei 50/1999 e pelo Real Decreto 287/2002. Ao contrário da França, os cachorros PPP não têm a importação proibida: podem entrar e ser mantidos, mas o dono precisa ter uma licença PPP. A Lei de Bem-Estar Animal de 2023 (Ley 7/2023) manteve o regime PPP em vigor; a proposta de substituir a classificação por raça por uma avaliação individual do comportamento não entrou no texto final e aguarda regulamentação."
  cat1:
    en: "Listed breeds (Annex I): Pit Bull Terrier, Staffordshire Bull Terrier, American Staffordshire Terrier, Rottweiler, Dogo Argentino, Fila Brasileiro, Tosa Inu and Akita Inu, plus their crosses. Dogs whose morphology matches the Annex II characteristics are also treated as PPP. Some autonomous communities add further breeds (e.g. Dogo de Burdeos, Mastín Napolitano, Presa Canario, Bullmastiff, Dóberman)."
    fr: "Races listées (annexe I) : Pit Bull Terrier, Staffordshire Bull Terrier, American Staffordshire Terrier, Rottweiler, Dogo Argentino, Fila Brasileiro, Tosa Inu et Akita Inu, ainsi que leurs croisements. Les chiens dont la morphologie correspond aux caractéristiques de l'annexe II sont aussi considérés comme PPP. Certaines communautés autonomes ajoutent d'autres races (ex. Dogue de Bordeaux, Mâtin napolitain, Dogue des Canaries, Bullmastiff, Dobermann)."
    es: "Razas listadas (anexo I): Pit Bull Terrier, Staffordshire Bull Terrier, American Staffordshire Terrier, Rottweiler, Dogo Argentino, Fila Brasileiro, Tosa Inu y Akita Inu, además de sus cruces. Los perros cuya morfología coincida con las características del anexo II también se consideran PPP. Algunas comunidades autónomas añaden más razas (p. ej. Dogo de Burdeos, Mastín Napolitano, Presa Canario, Bullmastiff, Dóberman)."
    pt: "Raças listadas (anexo I): Pit Bull Terrier, Staffordshire Bull Terrier, American Staffordshire Terrier, Rottweiler, Dogo Argentino, Fila Brasileiro, Tosa Inu e Akita Inu, além de seus cruzamentos. Cachorros cuja morfologia corresponda às características do anexo II também são tratados como PPP. Algumas comunidades autônomas acrescentam outras raças (por exemplo, Dogo de Burdeos, Mastín Napolitano, Presa Canario, Bullmastiff, Dóberman)."
  cat2:
    en: "Keeping a PPP dog requires a licence (licencia) from the town hall (ayuntamiento) of the owner's municipality: proof of age (18+), no relevant criminal record, a psychological/physical aptitude certificate, and civil-liability insurance. In public the dog must wear a muzzle and be on a non-extendable lead ≤2 m, and it must be registered in the municipal PPP register. Import is allowed provided these conditions are met."
    fr: "Détenir un chien PPP exige une licence (licencia) délivrée par la mairie (ayuntamiento) de la commune de résidence : justificatif de majorité (18 ans), absence de casier judiciaire pertinent, certificat d'aptitude psychologique/physique et assurance responsabilité civile. En public, le chien doit porter une muselière et une laisse non extensible ≤2 m, et être inscrit au registre municipal PPP. L'importation est autorisée sous réserve de respecter ces conditions."
    es: "Tener un perro PPP requiere una licencia del ayuntamiento del municipio del propietario: acreditar la mayoría de edad (18 años), carecer de antecedentes penales relevantes, un certificado de aptitud psicológica/física y un seguro de responsabilidad civil. En la vía pública el perro debe llevar bozal y una correa no extensible ≤2 m, y debe estar inscrito en el registro municipal de PPP. La importación se permite siempre que se cumplan estas condiciones."
    pt: "Ter um cachorro PPP exige uma licença (licencia) da prefeitura (ayuntamiento) do município do dono: comprovação de maioridade (18 anos ou mais), ausência de antecedentes criminais relevantes, um certificado de aptidão psicológica/física e um seguro de responsabilidade civil. Em local público, o cachorro deve usar focinheira e guia não extensível ≤2 m, e precisa estar inscrito no registro municipal de PPP. A importação é permitida desde que essas condições sejam cumpridas."
  note:
    en: "PPP rules are largely enforced at municipal and autonomous-community level, so the exact licence steps and any extended breed list vary by region. Confirm the requirements with the destination town hall before you travel."
    fr: "La réglementation PPP est surtout appliquée au niveau municipal et des communautés autonomes ; les démarches exactes de licence et toute liste de races élargie varient donc selon la région. Confirme les exigences auprès de la mairie de destination avant de voyager."
    es: "Las normas PPP se aplican en gran medida a nivel municipal y de comunidad autónoma, por lo que los trámites exactos de la licencia y cualquier lista ampliada de razas varían según la región. Confirma los requisitos con el ayuntamiento de destino antes de viajar."
    pt: "As regras de PPP são aplicadas em grande parte no nível municipal e das comunidades autônomas, então os passos exatos da licença e qualquer lista ampliada de raças variam conforme a região. Confirme as exigências com a prefeitura de destino antes de viajar."

