notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly fornece informações gerais — não constitui aconselhamento veterinário nem jurídico."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog, and the DGSV of Burkina Faso sets the exact conditions, including whether an import authorization is required for your pet."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien, et la DGSV du Burkina Faso fixe les conditions exactes, y compris la nécessité d'une autorisation d'importation pour ton animal."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro, y la DGSV de Burkina Faso fija las condiciones exactas, incluido si se requiere una autorización de importación para tu mascota."
    pt: "Somente um médico-veterinário pode confirmar o procedimento exato para cada cachorro, e a DGSV do Burkina Faso define as condições exatas, incluindo se uma autorização de importação é exigida para o seu cachorro."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem de: país de origem, histórico de viagens anteriores, identificação, vacinas, itinerário e data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consultar sempre o médico-veterinário antes de reservar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do cachorro" }
  intro:
    en: "The exact documents depend on three things — Burkina Faso (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — le Burkina Faso (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Burkina Faso (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — o Burkina Faso (o destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Burkina Faso", fr: "Pays de destination — Burkina Faso", es: "País de destino — Burkina Faso", pt: "País de destino — Burkina Faso" }
      text:
        en: "Burkina Faso runs its own DGSV scheme: a valid rabies vaccination, an international veterinary health certificate and a veterinary check on arrival are the core requirements, and the importation of live animals is subject to prior authorization delivered after the DGSV's technical opinion. There is no EU-style pet passport route."
        fr: "Le Burkina Faso applique son propre dispositif DGSV : une vaccination antirabique valide, un certificat vétérinaire international et un contrôle vétérinaire à l'arrivée constituent les exigences de base, et l'importation d'animaux vivants est soumise à une autorisation préalable délivrée après avis technique de la DGSV. Il n'existe pas de voie « passeport » de l'UE."
        es: "Burkina Faso aplica su propio sistema de la DGSV: una vacunación antirrábica válida, un certificado veterinario internacional y un control veterinario a la llegada son los requisitos básicos, y la importación de animales vivos está sujeta a una autorización previa expedida tras el dictamen técnico de la DGSV. No existe una vía de tipo «pasaporte» de la UE."
        pt: "O Burkina Faso segue seu próprio esquema pela DGSV: uma vacinação antirrábica válida, um atestado de saúde veterinário internacional e uma verificação veterinária na chegada são as exigências centrais, e a importação de animais vivos está sujeita a autorização prévia, concedida após parecer técnico da DGSV. Não existe uma via de passaporte para animais de estimação nos moldes europeus."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The country of departure decides which certificate model your official vet uses and how the rabies vaccination is documented. For the United States, USDA/APHIS publishes the exact bilingual Burkina Faso certificate; other origins use their own official model confirmed by the government veterinary authority."
        fr: "Le pays de départ détermine le modèle de certificat que ton vétérinaire officiel utilise et la manière dont la vaccination antirabique est documentée. Pour les États-Unis, l'USDA/APHIS publie le certificat bilingue exact pour le Burkina Faso ; les autres origines utilisent leur propre modèle officiel validé par l'autorité vétérinaire gouvernementale."
        es: "El país de salida determina qué modelo de certificado utiliza tu veterinario oficial y cómo se documenta la vacunación antirrábica. Para Estados Unidos, USDA/APHIS publica el certificado bilingüe exacto para Burkina Faso; otros orígenes usan su propio modelo oficial validado por la autoridad veterinaria gubernamental."
        pt: "O país de partida determina qual modelo de certificado o veterinário oficial utiliza e como a vacinação antirrábica é documentada. Para os Estados Unidos, o USDA/APHIS publica o certificado bilíngue exato para o Burkina Faso; outras origens utilizam seu próprio modelo oficial, confirmado pela autoridade veterinária governamental."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde o cachorro esteve recentemente" }
      text:
        en: "The dog must come from an area not quarantined for rabies and not have been exposed to rabies. A recent stay in a country with active rabies control measures can therefore matter, not only the last airport you fly from. Burkina Faso is itself rabies-endemic, which matters for any later return to the EU."
        fr: "Le chien doit provenir d'une zone non placée en quarantaine pour la rage et ne pas avoir été exposé à la rage. Un séjour récent dans un pays soumis à des mesures actives de lutte contre la rage peut donc compter, pas seulement le dernier aéroport de départ. Le Burkina Faso étant lui-même à rage endémique, cela compte pour un éventuel retour ultérieur vers l'UE."
        es: "El perro debe proceder de una zona no puesta en cuarentena por rabia y no haber estado expuesto a la rabia. Una estancia reciente en un país con medidas activas de control de la rabia puede, por tanto, importar, no solo el último aeropuerto del que salgas. Burkina Faso es a su vez de rabia endémica, lo que importa para un eventual regreso posterior a la UE."
        pt: "O cachorro deve vir de uma área não colocada em quarentena por raiva e não ter sido exposto à raiva. Uma estadia recente em um país com medidas ativas de controle da raiva pode, portanto, ser relevante — não apenas o último aeroporto de onde ele partiu. O próprio Burkina Faso tem raiva endêmica, o que é relevante para um eventual retorno à UE."
  note:
    en: "So read the requirements below as Burkina Faso's framework, then confirm your dog's exact origin, history and documents with your vet and the DGSV before booking."
    fr: "Lis donc les exigences ci-dessous comme le cadre burkinabè, puis confirme l'origine, l'historique et les documents exacts de ton chien avec ton vétérinaire et la DGSV avant de réserver."
    es: "Así que lee los requisitos siguientes como el marco de Burkina Faso y luego confirma el origen, el historial y los documentos exactos de tu perro con tu veterinario y la DGSV antes de reservar."
    pt: "Portanto, ler as exigências abaixo como o quadro geral do Burkina Faso e, em seguida, confirmar a origem exata, o histórico e os documentos do cachorro com o veterinário e a DGSV antes de reservar."

