# Country Entry Guide — Burkina Faso (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_bf
iso2: "BF"
name: { en: "Burkina Faso", fr: "Burkina Faso", es: "Burkina Faso", pt: "Burkina Faso" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
exit:
  authority: DGSV
  authorityUrl: https://www.agriculture.bf
  intro:
    en: "Burkina Faso is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Direction Générale des Services Vétérinaires (DGSV)."
    fr: "Le Burkina Faso est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par la Direction Générale des Services Vétérinaires (DGSV)."
    es: "Burkina Faso no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por la Direction Générale des Services Vétérinaires (DGSV)."
    pt: "O Burkina Faso é um país não listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pela Direction Générale des Services Vétérinaires (DGSV)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Providenciar com antecedência o teste sorológico antirrábico (titulação): exame de sangue em laboratório aprovado pela UE, pelo menos 30 dias após a vacinação — um resultado válido é indispensável para voltar à UE e não pode ser resolvido de última hora."
    - timing: window
      scope: any
      text:
        en: "The DGSV, through its animal-health service, endorses the export health certificate before departure."
        fr: "La DGSV, via sa direction de la santé animale, vise le certificat sanitaire d'export avant le départ."
        es: "La DGSV, a través de su servicio de sanidad animal, refrenda el certificado sanitario de exportación antes de salir."
        pt: "A DGSV, por meio do seu serviço de saúde animal, endossa o atestado de saúde de exportação antes da partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o cachorro já tinha um teste sorológico antirrábico (titulação) válido para a UE antes da partida, ele permanece válido por toda a vida enquanto a vacinação antirrábica estiver em dia — vale a pena verificar isso antes de viajar."

hero:
  h1: { en: "Traveling to Burkina Faso with your dog", fr: "Voyager au Burkina Faso avec ton chien", es: "Viajar a Burkina Faso con tu perro", pt: "Viajar para o Burkina Faso com seu cachorro" }
  intro:
    en: >-
      Burkina Faso admits pet dogs, but entry runs through the country's own scheme managed by the
      Direction Générale des Services Vétérinaires (DGSV) of the Ministère de l'Agriculture, de l'Eau,
      des Ressources Animales et Halieutiques (MAERAH), not the EU framework. Burkina Faso is
      landlocked and rabies-endemic, so the rabies rule is central: every dog needs a valid rabies
      vaccination and an international veterinary health certificate certifying that it is healthy and
      comes from an area not quarantined for rabies. The country also subjects the importation of live
      animals to prior authorization delivered after the technical opinion of the DGSV. Documents and
      the animal are checked by the veterinary services on arrival (in practice at Ouagadougou's
      international airport or at a land border). Because the exact procedure for a personal pet is not
      fully published online, several details below are marked "Unknown" — confirm them directly with
      the DGSV before you book your flight.
    fr: >-
      Le Burkina Faso admet les chiens, mais l'entrée passe par le dispositif propre au pays, géré par
      la Direction Générale des Services Vétérinaires (DGSV) du Ministère de l'Agriculture, de l'Eau,
      des Ressources Animales et Halieutiques (MAERAH), et non par le cadre de l'UE. Le Burkina Faso est
      un pays enclavé où la rage est endémique : la règle antirabique est donc centrale — chaque chien
      doit disposer d'une vaccination antirabique valide et d'un certificat vétérinaire international
      attestant qu'il est en bonne santé et provient d'une zone non placée en quarantaine pour la rage.
      Le pays soumet en outre l'importation d'animaux vivants à une autorisation préalable délivrée
      après avis technique de la DGSV. Les documents et l'animal sont contrôlés par les services
      vétérinaires à l'arrivée (en pratique à l'aéroport international de Ouagadougou ou à une frontière
      terrestre). La procédure exacte pour un animal de compagnie personnel n'étant pas entièrement
      publiée en ligne, plusieurs détails ci-dessous sont marqués « Non communiqué » — confirme-les
      directement auprès de la DGSV avant de réserver ton vol.
    es: >-
      Burkina Faso admite perros, pero la entrada se rige por el sistema propio del país, gestionado por
      la Direction Générale des Services Vétérinaires (DGSV) del Ministère de l'Agriculture, de l'Eau,
      des Ressources Animales et Halieutiques (MAERAH), y no por el marco de la UE. Burkina Faso es un
      país sin salida al mar y con rabia endémica, por lo que la norma antirrábica es central: cada perro
      necesita una vacunación antirrábica válida y un certificado veterinario internacional que acredite
      que está sano y que procede de una zona no puesta en cuarentena por rabia. El país somete además la
      importación de animales vivos a una autorización previa expedida tras el dictamen técnico de la
      DGSV. Los documentos y el animal son controlados por los servicios veterinarios a la llegada (en la
      práctica, en el aeropuerto internacional de Uagadugú o en una frontera terrestre). Como el
      procedimiento exacto para una mascota personal no está publicado por completo en internet, varios
      detalles a continuación están marcados como «No comunicado» — confírmalos directamente con la DGSV
      antes de reservar tu vuelo.

    pt: "O Burkina Faso admite cachorros de companhia, mas a entrada segue um esquema próprio do país, administrado pela Direction Générale des Services Vétérinaires (DGSV) do Ministère de l'Agriculture, de l'Eau, des Ressources Animales et Halieutiques (MAERAH), e não o modelo europeu. O Burkina Faso não tem litoral e tem raiva endêmica, por isso a regra da raiva é central: todo cachorro precisa de uma vacinação antirrábica válida e de um atestado de saúde veterinário internacional que certifique que ele está saudável e vem de uma área não colocada em quarentena por raiva. O país também sujeita a importação de animais vivos a uma autorização prévia, concedida após parecer técnico da DGSV. Os documentos e o animal são verificados pelos serviços veterinários na chegada (na prática, no aeroporto internacional de Uagadugu ou em uma fronteira terrestre). Como o procedimento exato para um cachorro de companhia particular não está totalmente publicado on-line, vários detalhes abaixo estão marcados como \"Não comunicado\" — confirmar diretamente com a DGSV antes de reservar o voo."
difficulty:
  level: moderate
  label: { en: "Moderate — veterinary certificate + prior import authorization for live animals; several details unpublished", fr: "Modéré — certificat vétérinaire + autorisation préalable pour animaux vivants ; plusieurs détails non publiés", es: "Moderado — certificado veterinario + autorización previa de importación para animales vivos; varios detalles sin publicar", pt: "Moderado — certificado veterinário + autorização de importação prévia para animais vivos; vários detalhes não publicados" }

prepTime:
  eu:
    en: "From the EU: allow a few weeks. Identification and rabies vaccination should already be in order; then confirm the import authorization requirement with the DGSV and have an official vet issue the international veterinary certificate close to departure."
    fr: "Depuis l'UE : prévois quelques semaines. L'identification et la vaccination antirabique doivent déjà être en règle ; confirme ensuite l'exigence d'autorisation d'importation auprès de la DGSV et fais établir le certificat vétérinaire international par un vétérinaire officiel peu avant le départ."
    es: "Desde la UE: cuenta con unas semanas. La identificación y la vacunación antirrábica deben estar ya en regla; luego confirma el requisito de autorización de importación con la DGSV y haz que un veterinario oficial expida el certificado veterinario internacional poco antes de la salida."
    pt: "Da UE: contar com algumas semanas. A identificação e a vacinação antirrábica já devem estar em dia; depois, confirmar a exigência de autorização de importação junto da DGSV e providenciar que um veterinário oficial emita o certificado veterinário internacional perto da partida."
  listed:
    en: "From the United States and other third countries: similar timing. USDA/APHIS publishes the exact bilingual (French/English) veterinary health certificate for Burkina Faso, endorsed by APHIS and valid 30 days; allow at least 21 days if the rabies vaccination is a primary dose or has lapsed."
    fr: "Depuis les États-Unis et d'autres pays tiers : délais comparables. L'USDA/APHIS publie le certificat vétérinaire bilingue (français/anglais) exact pour le Burkina Faso, visé par l'APHIS et valable 30 jours ; prévois au moins 21 jours si la vaccination antirabique est une primovaccination ou a expiré."
    es: "Desde Estados Unidos y otros países terceros: plazos similares. USDA/APHIS publica el certificado veterinario bilingüe (francés/inglés) exacto para Burkina Faso, refrendado por APHIS y válido 30 días; cuenta con al menos 21 días si la vacunación antirrábica es una dosis primaria o ha caducado."
    pt: "Dos Estados Unidos e de outros países terceiros: prazo semelhante. O USDA/APHIS publica o atestado de saúde veterinário bilíngue (francês/inglês) exato para o Burkina Faso, endossado pela APHIS e válido por 30 dias; contar com pelo menos 21 dias se a vacinação antirrábica for uma primeira dose ou estiver vencida."
  nonListed:
    en: "From a rabies-endemic or other origin: the same core steps apply — current rabies vaccination and an international veterinary certificate, with the dog coming from an area not quarantined for rabies. Confirm the import-authorization procedure and any additional condition directly with the DGSV before booking."
    fr: "Depuis une origine où la rage est endémique ou toute autre origine : les mêmes étapes de base s'appliquent — vaccination antirabique à jour et certificat vétérinaire international, le chien provenant d'une zone non placée en quarantaine pour la rage. Confirme la procédure d'autorisation d'importation et toute condition supplémentaire directement auprès de la DGSV avant de réserver."
    es: "Desde un origen con rabia endémica u otro origen: se aplican los mismos pasos básicos — vacunación antirrábica al día y certificado veterinario internacional, con el perro procedente de una zona no puesta en cuarentena por rabia. Confirma el procedimiento de autorización de importación y cualquier condición adicional directamente con la DGSV antes de reservar."
    pt: "De uma origem de raiva endêmica ou outra: aplicam-se as mesmas etapas essenciais — vacinação antirrábica em dia e certificado veterinário internacional, com o cachorro proveniente de uma área não colocada em quarentena por raiva. Confirmar o procedimento de autorização de importação e qualquer condição adicional diretamente junto da DGSV antes de reservar."

