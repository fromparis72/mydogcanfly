# Country Entry Guide — Benin / Bénin (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_bj
iso2: "BJ"
name: { en: "Benin", fr: "Bénin", es: "Benín", pt: "Benim" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
exit:
  authority: Direction de l'Élevage (MAEP)
  authorityUrl: https://agriculture.gouv.bj
  intro:
    en: "Benin is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the veterinary services of the Direction de l'Élevage (MAEP)."
    fr: "Le Bénin est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par les services vétérinaires de la Direction de l'Élevage (MAEP)."
    es: "Benín no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por los servicios veterinarios de la Direction de l'Élevage (MAEP)."
    pt: "O Benim é um país não listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pelos serviços veterinários da Direction de l'Élevage (MAEP)."
  steps:
    - timing: longlead
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Providenciar com antecedência o teste sorológico antirrábico (titulação): exame de sangue em laboratório aprovado pela UE, pelo menos 30 dias após a vacinação — um resultado válido é indispensável para voltar à UE e não pode ser resolvido de última hora."
    - timing: window
      text:
        en: "The veterinary services within the Ministry of Agriculture's Direction de l'Élevage issue and endorse the export health certificate before departure."
        fr: "Les services vétérinaires de la Direction de l'Élevage du ministère de l'Agriculture délivrent et visent le certificat sanitaire d'export avant le départ."
        es: "Los servicios veterinarios de la Direction de l'Élevage del Ministerio de Agricultura emiten y refrendan el certificado sanitario de exportación antes de salir."
        pt: "Os serviços veterinários da Direction de l'Élevage, do Ministério da Agricultura, emitem e endossam o atestado de saúde de exportação antes da partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o cachorro já tinha um teste sorológico antirrábico (titulação) válido para a UE antes da partida, ele permanece válido por toda a vida enquanto a vacinação antirrábica estiver em dia — vale a pena verificar isso antes de viajar."

hero:
  h1: { en: "Traveling to Benin with your dog", fr: "Voyager au Bénin avec ton chien", es: "Viajar a Benín con tu perro", pt: "Viajar para o Benim com seu cachorro" }
  intro:
    en: >-
      Benin welcomes pet dogs, but entry runs through the country's own scheme managed by the
      Direction de l'Élevage (Directorate of Livestock) of the Ministère de l'Agriculture, de
      l'Élevage et de la Pêche (MAEP), not the EU framework. To bring a dog in, a written request
      must be addressed in advance to the Director of Livestock, and the animal must arrive with an
      international sanitary (veterinary) certificate from the country of origin. On arrival, the dog
      is presented to the veterinary services (Service Santé Animale) for sanitary control. Benin is a
      rabies-endemic country and its own veterinary services run a canine rabies-vaccination programme,
      so a valid rabies vaccination is central to the origin-country certificate. Several finer points —
      microchip, exact rabies-vaccination timing, antibody testing, parasite treatment, breed rules —
      are not published in Benin's official sources, so this guide states plainly what is documented and
      flags the rest as "unknown," to be confirmed directly with the Direction de l'Élevage before you book.
    fr: >-
      Le Bénin accueille les chiens, mais l'entrée passe par le dispositif propre au pays, géré par la
      Direction de l'Élevage du Ministère de l'Agriculture, de l'Élevage et de la Pêche (MAEP), et non
      par le cadre de l'UE. Pour faire entrer un chien, une demande écrite doit être adressée à l'avance
      au Directeur de l'Élevage, et l'animal doit arriver muni d'un certificat sanitaire (vétérinaire)
      international du pays d'origine. À l'arrivée, le chien est présenté aux services vétérinaires
      (Service Santé Animale) pour le contrôle sanitaire. Le Bénin est un pays où la rage est endémique
      et ses propres services vétérinaires assurent un programme de vaccination antirabique des chiens :
      une vaccination antirabique valide est donc au cœur du certificat du pays d'origine. Plusieurs
      points de détail — puce, calendrier exact de la vaccination antirabique, titrage, traitement
      antiparasitaire, règles de race — ne sont pas publiés dans les sources officielles béninoises ; ce
      guide indique clairement ce qui est documenté et signale le reste comme « non communiqué », à
      confirmer directement auprès de la Direction de l'Élevage avant de réserver.
    es: >-
      Benín acoge a los perros, pero la entrada se rige por el sistema propio del país, gestionado por la
      Direction de l'Élevage (Dirección de Ganadería) del Ministère de l'Agriculture, de l'Élevage et de
      la Pêche (MAEP), y no por el marco de la UE. Para hacer entrar un perro, debe dirigirse con
      antelación una solicitud escrita al Director de Ganadería, y el animal debe llegar con un
      certificado sanitario (veterinario) internacional del país de origen. A la llegada, el perro se
      presenta a los servicios veterinarios (Service Santé Animale) para el control sanitario. Benín es un
      país con rabia endémica y sus propios servicios veterinarios llevan a cabo un programa de
      vacunación antirrábica canina, por lo que una vacunación antirrábica válida es central en el
      certificado del país de origen. Varios puntos de detalle — microchip, calendario exacto de la
      vacunación antirrábica, prueba de titulación, tratamiento antiparasitario, normas de raza — no se
      publican en las fuentes oficiales beninesas, así que esta guía indica con claridad lo que está
      documentado y señala el resto como «no comunicado», a confirmar directamente con la Direction de
      l'Élevage antes de reservar.

    pt: "O Benim recebe cachorros de companhia, mas a entrada segue um esquema próprio do país, administrado pela Direction de l'Élevage (Diretoria de Pecuária) do Ministère de l'Agriculture, de l'Élevage et de la Pêche (MAEP), e não o modelo europeu. Para levar um cachorro, é preciso endereçar com antecedência um pedido por escrito ao Diretor de Pecuária, e o animal deve chegar com um certificado sanitário (veterinário) internacional do país de origem. Na chegada, o cachorro é apresentado aos serviços veterinários (Service Santé Animale) para controle sanitário. O Benim é um país de raiva endêmica e seus próprios serviços veterinários mantêm um programa de vacinação antirrábica canina, por isso uma vacinação antirrábica válida é central no certificado do país de origem. Vários pontos mais específicos — microchip, calendário exato da vacinação antirrábica, teste sorológico, tratamento antiparasitário, regras de raça — não são publicados nas fontes oficiais do Benim, por isso este guia expõe claramente o que está documentado e assinala o restante como \"não comunicado\", a confirmar diretamente junto da Direction de l'Élevage antes de reservar."
difficulty:
  level: moderate
  label: { en: "Moderate — advance written request to the Directorate of Livestock + origin sanitary certificate", fr: "Modéré — demande écrite préalable à la Direction de l'Élevage + certificat sanitaire d'origine", es: "Moderado — solicitud escrita previa a la Dirección de Ganadería + certificado sanitario de origen", pt: "Moderado — pedido por escrito antecipado à Diretoria de Pecuária + certificado sanitário de origem" }

prepTime:
  eu:
    en: "From the EU: allow a few weeks. Identification and rabies vaccination should already be in order; then address a written request to the Director of Livestock (Direction de l'Élevage) and have your official vet issue the international sanitary certificate close to departure. Exact timing windows are not published by Benin — confirm with the Direction de l'Élevage."
    fr: "Depuis l'UE : prévois quelques semaines. L'identification et la vaccination antirabique doivent déjà être en règle ; adresse ensuite une demande écrite au Directeur de l'Élevage (Direction de l'Élevage) et fais établir le certificat sanitaire international par ton vétérinaire officiel peu avant le départ. Les délais exacts ne sont pas publiés par le Bénin — à confirmer auprès de la Direction de l'Élevage."
    es: "Desde la UE: cuenta con unas semanas. La identificación y la vacunación antirrábica deben estar ya en regla; luego dirige una solicitud escrita al Director de Ganadería (Direction de l'Élevage) y haz que tu veterinario oficial expida el certificado sanitario internacional poco antes de la salida. Los plazos exactos no son publicados por Benín — confírmalos con la Direction de l'Élevage."
    pt: "Da UE: contar com algumas semanas. A identificação e a vacinação antirrábica já devem estar em dia; depois, endereçar um pedido por escrito ao Diretor de Pecuária (Direction de l'Élevage) e providenciar que o veterinário oficial emita o certificado sanitário internacional perto da partida. Os prazos exatos não são publicados pelo Benim — confirmar junto da Direction de l'Élevage."
  listed:
    en: "From the United States and other third countries: APHIS does not publish dog requirements for Benin (only cattle certificates are listed) and directs owners to obtain an import permit from the destination ministry. Plan to apply to the Direction de l'Élevage yourself and to carry an origin-country veterinary certificate."
    fr: "Depuis les États-Unis et d'autres pays tiers : l'APHIS ne publie pas d'exigences pour les chiens vers le Bénin (seuls des certificats bovins sont listés) et renvoie les propriétaires vers le ministère de destination pour obtenir un permis d'importation. Prévois de faire toi-même la demande à la Direction de l'Élevage et d'emporter un certificat vétérinaire du pays d'origine."
    es: "Desde Estados Unidos y otros países terceros: APHIS no publica requisitos para perros hacia Benín (solo se listan certificados bovinos) y remite a los propietarios al ministerio de destino para obtener un permiso de importación. Prevé presentar tú mismo la solicitud a la Direction de l'Élevage y llevar un certificado veterinario del país de origen."
    pt: "Dos Estados Unidos e de outros países terceiros: o APHIS não publica exigências para cachorros com destino ao Benim (apenas certificados para bovinos são listados) e orienta os proprietários a obter uma autorização de importação junto ao ministério de destino. É preciso solicitar diretamente à Direction de l'Élevage e levar um certificado veterinário do país de origem."
  nonListed:
    en: "From a rabies-endemic or other origin: the same core steps apply — advance written request to the Direction de l'Élevage and an origin-country sanitary certificate, with the animal presented on arrival. Because so much detail is unpublished, confirm every condition directly with the Direction de l'Élevage before booking."
    fr: "Depuis une origine où la rage est endémique ou toute autre origine : les mêmes étapes de base s'appliquent — demande écrite préalable à la Direction de l'Élevage et certificat sanitaire du pays d'origine, l'animal étant présenté à l'arrivée. Beaucoup de détails n'étant pas publiés, confirme chaque condition directement auprès de la Direction de l'Élevage avant de réserver."
    es: "Desde un origen con rabia endémica u otro origen: se aplican los mismos pasos básicos — solicitud escrita previa a la Direction de l'Élevage y un certificado sanitario del país de origen, con el animal presentado a la llegada. Como muchos detalles no están publicados, confirma cada condición directamente con la Direction de l'Élevage antes de reservar."
    pt: "De uma origem de raiva endêmica ou outra: aplicam-se as mesmas etapas essenciais — pedido por escrito antecipado à Direction de l'Élevage e certificado sanitário do país de origem, com o animal apresentado na chegada. Como muitos detalhes não são publicados, confirmar cada condição diretamente junto da Direction de l'Élevage antes de reservar."

