  - item: { en: "Advance written request to the Director of Livestock", fr: "Demande écrite préalable au Directeur de l'Élevage", es: "Solicitud escrita previa al Director de Ganadería", pt: "Pedido por escrito antecipado ao Diretor de Pecuária" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "A written request (demande écrite) is addressed to the Director of Livestock (Direction de l'Élevage, MAEP). The file is deposited at the Service Santé Animale in Cotonou (Akpakpa), and the animal is then presented. Processing time is stated as 48 hours; a fee of 10,000 FCFA per dog applies for the sanitary control and international certificate.", fr: "Une demande écrite est adressée au Directeur de l'Élevage (Direction de l'Élevage, MAEP). Le dossier est déposé au Service Santé Animale à Cotonou (Akpakpa), puis l'animal est présenté. Le délai indiqué est de 48 heures ; une redevance de 10 000 FCFA par chien s'applique pour le contrôle sanitaire et le certificat international.", es: "Se dirige una solicitud escrita (demande écrite) al Director de Ganadería (Direction de l'Élevage, MAEP). El expediente se deposita en el Service Santé Animale en Cotonú (Akpakpa) y, a continuación, se presenta el animal. El plazo indicado es de 48 horas; se aplica una tasa de 10 000 FCFA por perro para el control sanitario y el certificado internacional.", pt: "Um pedido por escrito (demande écrite) é endereçado ao Diretor de Pecuária (Direction de l'Élevage, MAEP). O processo é depositado no Service Santé Animale em Cotonou (Akpakpa), e o animal é então apresentado. O prazo de processamento indicado é de 48 horas; aplica-se uma taxa de 10.000 FCFA por cachorro para o controle sanitário e o certificado internacional." }
    exceptions: { en: "None documented — no dog should travel without the request being handled by the Direction de l'Élevage.", fr: "Aucune documentée — aucun chien ne devrait voyager sans que la demande soit traitée par la Direction de l'Élevage.", es: "Ninguna documentada — ningún perro debería viajar sin que la solicitud sea tramitada por la Direction de l'Élevage.", pt: "Nenhuma documentada — nenhum cachorro deve viajar sem que o pedido seja processado pela Direction de l'Élevage." }
    ref: { en: "CatIS (gouv.bj) — Direction de l'Élevage service PS00501; Arrêté N°045/MAEP/MEF/... du 15 février 2008 (redevances des services vétérinaires)", fr: "CatIS (gouv.bj) — service PS00501 de la Direction de l'Élevage ; Arrêté N°045/MAEP/MEF/... du 15 février 2008 (redevances des services vétérinaires)", es: "CatIS (gouv.bj) — servicio PS00501 de la Direction de l'Élevage; Arrêté N°045/MAEP/MEF/... du 15 février 2008 (tasas de los servicios veterinarios)", pt: "CatIS (gouv.bj) — Direction de l'Élevage, serviço PS00501; Arrêté N°045/MAEP/MEF/... du 15 février 2008 (redevances des services vétérinaires)" }
  - item: { en: "International sanitary / veterinary certificate (origin country)", fr: "Certificat sanitaire / vétérinaire international (pays d'origine)", es: "Certificado sanitario / veterinario internacional (país de origen)", pt: "Certificado sanitário / veterinário internacional (país de origem)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "For an import, a sanitary certificate from the country of origin must accompany the animal. Benin does not publish its own certificate model, so it is issued by an official vet of the departure country using that country's official export certificate; French is the working language of the administration. Present it with the animal at the Direction de l'Élevage.", fr: "Pour une importation, un certificat sanitaire du pays d'origine doit accompagner l'animal. Le Bénin ne publie pas de modèle propre : il est établi par un vétérinaire officiel du pays de départ selon le certificat d'exportation officiel de ce pays ; le français est la langue de travail de l'administration. Présente-le avec l'animal à la Direction de l'Élevage.", es: "Para una importación, un certificado sanitario del país de origen debe acompañar al animal. Benín no publica un modelo propio, así que lo expide un veterinario oficial del país de salida según el certificado de exportación oficial de ese país; el francés es la lengua de trabajo de la administración. Preséntalo con el animal en la Direction de l'Élevage.", pt: "Para uma importação, um certificado sanitário do país de origem deve acompanhar o animal. O Benim não publica um modelo de certificado próprio, de modo que ele é emitido por um veterinário oficial do país de partida, usando o certificado de exportação oficial desse país; o francês é o idioma de trabalho da administração. Apresentá-lo com o animal junto à Direction de l'Élevage." }
    exceptions: { en: "None — an official origin certificate must accompany the dog.", fr: "Aucune — un certificat officiel d'origine doit accompagner le chien.", es: "Ninguna — un certificado oficial de origen debe acompañar al perro.", pt: "Nenhuma — um certificado de origem oficial deve acompanhar o cachorro." }
    ref: { en: "CatIS (gouv.bj) — Direction de l'Élevage service PS00501 (required documents: certificat sanitaire du pays d'origine)", fr: "CatIS (gouv.bj) — service PS00501 de la Direction de l'Élevage (pièces exigées : certificat sanitaire du pays d'origine)", es: "CatIS (gouv.bj) — servicio PS00501 de la Direction de l'Élevage (documentos exigidos: certificat sanitaire du pays d'origine)", pt: "CatIS (gouv.bj) — Direction de l'Élevage, serviço PS00501 (documentos exigidos: certificat sanitaire du pays d'origine)" }
  - item: { en: "Identification (microchip)", fr: "Identification (puce électronique)", es: "Identificación (microchip)", pt: "Identificação (microchip)" }
    required: { en: "Not published (recommended)", fr: "Non communiqué (recommandée)", es: "No comunicado (recomendado)", pt: "Não publicado (recomendado)" }
    when: { en: "Benin's official sources do not publish a stand-alone microchip obligation for pet dogs. An ISO 11784/11785 microchip is nonetheless strongly recommended so the dog's identity matches its origin-country certificate, and it is needed for any later return to the EU.", fr: "Les sources officielles béninoises ne publient pas d'obligation autonome de puce pour les chiens de compagnie. Une puce ISO 11784/11785 est néanmoins fortement recommandée pour que l'identité du chien corresponde à son certificat du pays d'origine, et elle est nécessaire pour un éventuel retour ultérieur vers l'UE.", es: "Las fuentes oficiales beninesas no publican una obligación autónoma de microchip para los perros de compañía. No obstante, se recomienda encarecidamente un microchip ISO 11784/11785 para que la identidad del perro coincida con su certificado del país de origen, y es necesario para un eventual regreso posterior a la UE.", pt: "As fontes oficiais do Benim não publicam uma obrigação autônoma de microchip para cachorros de companhia. Ainda assim, um microchip ISO 11784/11785 é fortemente recomendado, para que a identidade do cachorro corresponda ao certificado do país de origem, e ele é necessário para um eventual retorno à UE." }
    exceptions: { en: "Where a microchip is present it must match the certificate and vaccination record.", fr: "Lorsqu'une puce est présente, elle doit correspondre au certificat et au carnet de vaccination.", es: "Cuando hay un microchip, debe coincidir con el certificado y la cartilla de vacunación.", pt: "Caso haja um microchip, ele deve corresponder ao certificado e à caderneta de vacinação." }
    ref: { en: "No microchip rule found in official Benin sources (CatIS / Direction de l'Élevage)", fr: "Aucune règle de puce trouvée dans les sources officielles béninoises (CatIS / Direction de l'Élevage)", es: "No se ha encontrado ninguna norma de microchip en las fuentes oficiales beninesas (CatIS / Direction de l'Élevage)", pt: "Nenhuma regra de microchip encontrada nas fontes oficiais do Benim (CatIS / Direction de l'Élevage)" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required via the origin certificate", fr: "Requise via le certificat d'origine", es: "Obligatoria a través del certificado de origen", pt: "Obrigatória via certificado de origem" }
    when: { en: "Benin is rabies-endemic and its veterinary services run a canine rabies-vaccination programme, so a valid rabies vaccination is expected as part of the origin-country sanitary certificate. Benin does not itself publish the exact validity window (e.g. minimum days before travel and maximum age of the vaccination), so confirm the timing with the Direction de l'Élevage and your official vet.", fr: "Le Bénin est endémique pour la rage et ses services vétérinaires assurent un programme de vaccination antirabique des chiens : une vaccination antirabique valide est donc attendue dans le cadre du certificat sanitaire du pays d'origine. Le Bénin ne publie pas lui-même la fenêtre de validité exacte (par ex. délai minimal avant le voyage et ancienneté maximale de la vaccination) ; confirme les délais auprès de la Direction de l'Élevage et de ton vétérinaire officiel.", es: "Benín es de rabia endémica y sus servicios veterinarios llevan a cabo un programa de vacunación antirrábica canina, por lo que se espera una vacunación antirrábica válida como parte del certificado sanitario del país de origen. Benín no publica por sí mismo la ventana de valide exacta (por ejemplo, plazo mínimo antes del viaje y antigüedad máxima de la vacunación), así que confirma los plazos con la Direction de l'Élevage y con tu veterinario oficial.", pt: "O Benim tem raiva endêmica e seus serviços veterinários mantêm um programa de vacinação antirrábica canina, por isso uma vacinação antirrábica válida é esperada como parte do certificado sanitário do país de origem. O Benim não publica o prazo exato de validade (por exemplo, dias mínimos antes da viagem e idade máxima da vacinação), portanto confirmar o calendário com a Direction de l'Élevage e com o veterinário oficial." }
    exceptions: { en: "A dog too young to be validly vaccinated against rabies cannot meet the requirement.", fr: "Un chien trop jeune pour être valablement vacciné contre la rage ne peut satisfaire l'exigence.", es: "Un perro demasiado joven para ser válidamente vacunado contra la rabia no puede cumplir el requisito.", pt: "Um cachorro jovem demais para ser validamente vacinado contra a raiva não pode cumprir essa exigência." }
    ref: { en: "CatIS (gouv.bj) — Direction de l'Élevage rabies-vaccination service (rage canine); exact import timing not published", fr: "CatIS (gouv.bj) — service de vaccination antirabique de la Direction de l'Élevage (rage canine) ; délais d'importation exacts non publiés", es: "CatIS (gouv.bj) — servicio de vacunación antirrábica de la Direction de l'Élevage (rage canine); plazos de importación exactos no publicados", pt: "CatIS (gouv.bj) — Direction de l'Élevage, serviço de vacinação antirrábica (rage canine); calendário exato de importação não publicado" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not in published Benin rules", fr: "Non prévu par les règles béninoises publiées", es: "No prevista en las normas beninesas publicadas", pt: "Não consta nas regras publicadas do Benim" }
    when: { en: "No rabies antibody test is set out in Benin's published entry documents for a pet dog; the origin-country sanitary certificate and a valid rabies vaccination are what is checked. (A rabies antibody test may still be relevant for a later return to the EU, because Benin is rabies-endemic.)", fr: "Aucun titrage des anticorps antirabiques n'est prévu par les documents d'entrée béninois publiés pour un chien de compagnie ; ce sont le certificat sanitaire du pays d'origine et une vaccination antirabique valide qui sont contrôlés. (Un titrage peut toutefois rester pertinent pour un retour ultérieur vers l'UE, le Bénin étant à rage endémique.)", es: "No se prevé ninguna prueba de titulación de anticuerpos contra la rabia en los documentos de entrada beninenses publicados para un perro de compañía; lo que se comprueba es el certificado sanitario del país de origen y una vacunación antirrábica válida. (Una prueba de titulación puede, no obstante, seguir siendo relevante para un regreso posterior a la UE, ya que Benín es de rabia endémica.)", pt: "Nenhum teste sorológico antirrábico é estabelecido nos documentos de entrada publicados pelo Benim para um cachorro de companhia; o que é verificado é o certificado sanitário do país de origem e a vacinação antirrábica em dia. (Um teste sorológico antirrábico ainda pode ser relevante para um eventual retorno à UE, pois o Benim tem raiva endêmica.)" }
    exceptions: { en: "Unknown for special cases — confirm with the Direction de l'Élevage, as conditions can differ by the dog's origin and rabies history.", fr: "Non communiqué pour les cas particuliers — à confirmer auprès de la Direction de l'Élevage, les conditions pouvant varier selon l'origine et l'historique rabique du chien.", es: "No comunicado para casos particulares — confírmalo con la Direction de l'Élevage, ya que las condiciones pueden variar según el origen y el historial antirrábico del perro.", pt: "Não comunicado para casos especiais — confirmar junto da Direction de l'Élevage, pois as condições podem variar conforme a origem e o histórico de raiva do cachorro." }
    ref: { en: "No antibody-test requirement found in official Benin sources (CatIS / Direction de l'Élevage)", fr: "Aucune exigence de titrage trouvée dans les sources officielles béninoises (CatIS / Direction de l'Élevage)", es: "No se ha encontrado ninguna exigencia de prueba de titulación en las fuentes oficiales beninesas (CatIS / Direction de l'Élevage)", pt: "Nenhuma exigência de teste sorológico encontrada nas fontes oficiais do Benim (CatIS / Direction de l'Élevage)" }
  - item: { en: "Parasite / tapeworm treatment", fr: "Traitement antiparasitaire / échinocoque", es: "Tratamiento antiparasitario / contra la tenia", pt: "Tratamento antiparasitário / contra tênias" }
    required: { en: "Not published", fr: "Non communiqué", es: "No comunicado", pt: "Não publicado" }
    when: { en: "No mandatory internal or external parasite treatment for pet dogs is published in Benin's official sources. A vet may still recommend it as good practice.", fr: "Aucun traitement antiparasitaire interne ou externe obligatoire pour les chiens de compagnie n'est publié dans les sources officielles béninoises. Un vétérinaire peut néanmoins le recommander comme bonne pratique.", es: "No se publica ningún tratamiento antiparasitario interno o externo obligatorio para los perros de compañía en las fuentes oficiales beninesas. Un veterinario puede, no obstante, recomendarlo como buena práctica.", pt: "Nenhum tratamento antiparasitário interno ou externo obrigatório para cachorros de companhia é publicado nas fontes oficiais do Benim. Um veterinário ainda pode recomendá-lo como boa prática." }
    exceptions: { en: "Unknown — confirm any requirement with the Direction de l'Élevage.", fr: "Non communiqué — confirme toute exigence auprès de la Direction de l'Élevage.", es: "No comunicado — confirma cualquier requisito con la Direction de l'Élevage.", pt: "Não comunicado — confirmar qualquer exigência junto da Direction de l'Élevage." }
    ref: { en: "No parasite-treatment rule found in official Benin sources (CatIS / Direction de l'Élevage)", fr: "Aucune règle de traitement antiparasitaire trouvée dans les sources officielles béninoises (CatIS / Direction de l'Élevage)", es: "No se ha encontrado ninguna norma de tratamiento antiparasitario en las fuentes oficiales beninesas (CatIS / Direction de l'Élevage)", pt: "Nenhuma regra de tratamento antiparasitário encontrada nas fontes oficiais do Benim (CatIS / Direction de l'Élevage)" }
  - item: { en: "Sanitary control on arrival (presentation of the animal)", fr: "Contrôle sanitaire à l'arrivée (présentation de l'animal)", es: "Control sanitario a la llegada (presentación del animal)", pt: "Controle sanitário na chegada (apresentação do animal)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "The Direction de l'Élevage carries out a sanitary control of imported live animals, including pets, and the animal must be presented. A sanitary transit tax / clearance ('laisser-passer sanitaire') is also levied at the borders by the same directorate. Pets normally arrive by air at Cotonou (Cadjèhoun) international airport.", fr: "La Direction de l'Élevage effectue un contrôle sanitaire des animaux vivants importés, y compris les animaux de compagnie, et l'animal doit être présenté. Une taxe de transit / un laisser-passer sanitaire est également perçu aux frontières par la même direction. Les animaux de compagnie arrivent normalement par avion à l'aéroport international de Cotonou (Cadjèhoun).", es: "La Direction de l'Élevage lleva a cabo un control sanitario de los animales vivos importados, incluidas las mascotas, y el animal debe ser presentado. La misma dirección percibe también en las fronteras una tasa de tránsito / un salvoconducto sanitario («laisser-passer sanitaire»). Las mascotas llegan normalmente por avión al aeropuerto internacional de Cotonú (Cadjèhoun).", pt: "A Direction de l'Élevage realiza um controle sanitário dos animais vivos importados, incluindo animais de companhia, e o animal deve ser apresentado. Uma taxa de trânsito sanitário / liberação ('laisser-passer sanitaire') também é cobrada nas fronteiras pela mesma diretoria. Os animais de companhia normalmente chegam por via aérea ao aeroporto internacional de Cotonou (Cadjèhoun)." }
    exceptions: { en: "Exact airport steps and fees for a personal pet are not published in detail; confirm with the Direction de l'Élevage.", fr: "Les étapes et frais exacts à l'aéroport pour un animal de compagnie personnel ne sont pas publiés en détail ; à confirmer auprès de la Direction de l'Élevage.", es: "Los pasos y tasas exactos en el aeropuerto para una mascota personal no se publican en detalle; confírmalos con la Direction de l'Élevage.", pt: "As etapas exatas no aeroporto e as taxas para um cachorro de companhia particular não são publicadas em detalhe; confirmar junto da Direction de l'Élevage." }
    ref: { en: "CatIS (gouv.bj) — Direction de l'Élevage services PS00501 (sanitary control) and PS00510 (transit tax / laisser-passer sanitaire)", fr: "CatIS (gouv.bj) — services PS00501 (contrôle sanitaire) et PS00510 (taxe de transit / laisser-passer sanitaire) de la Direction de l'Élevage", es: "CatIS (gouv.bj) — servicios PS00501 (control sanitario) y PS00510 (tasa de tránsito / laisser-passer sanitaire) de la Direction de l'Élevage", pt: "CatIS (gouv.bj) — Direction de l'Élevage, serviços PS00501 (controle sanitário) e PS00510 (taxa de trânsito / laisser-passer sanitaire)" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Not published (linked to rabies vaccination)", fr: "Non communiqué (lié à la vaccination antirabique)", es: "No comunicada (vinculada a la vacunación antirrábica)", pt: "Não publicado (vinculado à vacinação antirrábica)" }
    when: { en: "No stand-alone minimum age is published by Benin. In practice a puppy must be old enough to be validly vaccinated against rabies and to meet the origin-country certificate.", fr: "Aucun âge minimum distinct n'est publié par le Bénin. En pratique, un chiot doit être en âge d'être valablement vacciné contre la rage et de satisfaire au certificat du pays d'origine.", es: "Benín no publica una edad mínima aparte. En la práctica, un cachorro debe tener edad suficiente para ser válidamente vacunado contra la rabia y para cumplir el certificado del país de origen.", pt: "Nenhuma idade mínima autônoma é publicada pelo Benim. Na prática, o filhote deve ter idade suficiente para ser validamente vacinado contra a raiva e atender ao certificado do país de origem." }
    exceptions: { en: "A puppy too young to be vaccinated against rabies cannot meet the requirement.", fr: "Un chiot trop jeune pour être vacciné contre la rage ne peut satisfaire l'exigence.", es: "Un cachorro demasiado joven para ser vacunado contra la rabia no puede cumplir el requisito.", pt: "Um filhote jovem demais para ser vacinado contra a raiva não pode cumprir essa exigência." }
    ref: { en: "No minimum-age rule found in official Benin sources (CatIS / Direction de l'Élevage)", fr: "Aucune règle d'âge minimum trouvée dans les sources officielles béninoises (CatIS / Direction de l'Élevage)", es: "No se ha encontrado ninguna norma de edad mínima en las fuentes oficiales beninesas (CatIS / Direction de l'Élevage)", pt: "Nenhuma regra de idade mínima encontrada nas fontes oficiais do Benim (CatIS / Direction de l'Élevage)" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not specified", fr: "Non prévue", es: "No prevista", pt: "Não especificada" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "No quarantine is set out in the official Benin documents for a compliant pet dog; non-compliant animals may be held under veterinary control at the border.", fr: "Aucune quarantaine n'est prévue dans les documents officiels béninois pour un chien de compagnie conforme ; les animaux non conformes peuvent être placés sous contrôle vétérinaire à la frontière.", es: "No se prevé ninguna cuarentena en los documentos oficiales beninenses para un perro de compañía conforme; los animales no conformes pueden quedar bajo control veterinario en la frontera.", pt: "Nenhuma quarentena é estabelecida nos documentos oficiais do Benim para um cachorro de companhia em conformidade; animais em não conformidade podem ficar retidos sob controle veterinário na fronteira." }
    ref: { en: "No quarantine requirement found in official Benin sources (CatIS / Direction de l'Élevage)", fr: "Aucune exigence de quarantaine trouvée dans les sources officielles béninoises (CatIS / Direction de l'Élevage)", es: "No se ha encontrado ninguna exigencia de cuarentena en las fuentes oficiales beninesas (CatIS / Direction de l'Élevage)", pt: "Nenhuma exigência de quarentena encontrada nas fontes oficiais do Benim (CatIS / Direction de l'Élevage)" }
  - item: { en: "Banned / restricted breeds", fr: "Races interdites / restreintes", es: "Razas prohibidas / restringidas", pt: "Raças proibidas / restritas" }
    required: { en: "No published import ban", fr: "Aucune interdiction d'importation publiée", es: "Sin prohibición de importación publicada", pt: "Nenhuma proibição de importação publicada" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "No national breed-specific import ban for dogs was found in official Benin sources. Confirm current rules with the Direction de l'Élevage, as national legislation can change.", fr: "Aucune interdiction d'importation nationale par race de chien n'a été trouvée dans les sources officielles béninoises. Vérifie les règles en vigueur auprès de la Direction de l'Élevage, la législation nationale pouvant évoluer.", es: "No se ha encontrado ninguna prohibición nacional de importación por raza de perro en las fuentes oficiales beninesas. Confirma las normas en vigor con la Direction de l'Élevage, ya que la legislación nacional puede cambiar.", pt: "Nenhuma proibição nacional de importação específica por raça para cachorros foi encontrada nas fontes oficiais do Benim. Confirmar as regras vigentes junto da Direction de l'Élevage, já que a legislação nacional pode mudar." }
    ref: { en: "No breed-specific import legislation found in official Benin sources (CatIS / Direction de l'Élevage)", fr: "Aucune législation d'importation par race trouvée dans les sources officielles béninoises (CatIS / Direction de l'Élevage)", es: "No se ha encontrado legislación de importación por raza en las fuentes oficiales beninesas (CatIS / Direction de l'Élevage)", pt: "Nenhuma legislação de importação específica por raça encontrada nas fontes oficiais do Benim (CatIS / Direction de l'Élevage)" }

origin:
  eu:
    title: { en: "From the European Union", fr: "Depuis l'Union européenne", es: "Desde la Unión Europea", pt: "Da União Europeia" }
    body:
      en: "For a dog leaving the EU, there is no EU pet-passport shortcut into Benin. You still address a written request to the Director of Livestock (Direction de l'Élevage) and travel with an international sanitary certificate issued by an official vet of the country of origin, covering identification, a valid rabies vaccination and clinical health. French is the working language of the Beninese administration, so a French-language certificate is convenient. The animal is presented for sanitary control on arrival."
      fr: "Pour un chien quittant l'UE, il n'existe pas de raccourci « passeport UE » vers le Bénin. Tu adresse tout de même une demande écrite au Directeur de l'Élevage (Direction de l'Élevage) et voyage avec un certificat sanitaire international établi par un vétérinaire officiel du pays d'origine, couvrant l'identification, une vaccination antirabique valide et l'état clinique. Le français étant la langue de travail de l'administration béninoise, un certificat en français est commode. L'animal est présenté pour le contrôle sanitaire à l'arrivée."
      es: "Para un perro que sale de la UE, no existe un atajo de «pasaporte de la UE» hacia Benín. Aun así, diriges una solicitud escrita al Director de Ganadería (Direction de l'Élevage) y viajas con un certificado sanitario internacional expedido por un veterinario oficial del país de origen, que cubre la identificación, una vacunación antirrábica válida y el estado clínico. Como el francés es la lengua de trabajo de la administración beninesa, un certificado en francés resulta cómodo. El animal se presenta para el control sanitario a la llegada."
      pt: "Para um cachorro que sai da UE, não existe atalho pelo passaporte europeu para animais de estimação rumo ao Benim. Ainda é preciso endereçar um pedido por escrito ao Diretor de Pecuária (Direction de l'Élevage) e viajar com um certificado sanitário internacional emitido por um veterinário oficial do país de origem, cobrindo identificação, vacinação antirrábica em dia e saúde clínica. O francês é o idioma de trabalho da administração beninense, por isso um certificado em francês é conveniente. O animal é apresentado para controle sanitário na chegada."
    cls: warn
  listed:
    title: { en: "From the United States & other third countries", fr: "Depuis les États-Unis et autres pays tiers", es: "Desde Estados Unidos y otros países terceros", pt: "Dos Estados Unidos e de outros países terceiros" }
    body:
      en: "APHIS does not publish dog requirements for Benin: its live-animal-export page lists only cattle certificates and states that, for a species not listed, 'the requirements for that species are not known,' advising the importer to obtain an import permit from the destination ministry. In practice that means addressing the Direction de l'Élevage yourself and carrying an origin-country veterinary certificate (from the US, issued by a USDA-accredited vet and endorsed by APHIS). Other third countries follow the same logic."
      fr: "L'APHIS ne publie pas d'exigences pour les chiens vers le Bénin : sa page d'exportation d'animaux vivants ne liste que des certificats bovins et indique que, pour une espèce non listée, « les exigences ne sont pas connues », conseillant à l'importateur d'obtenir un permis d'importation auprès du ministère de destination. Concrètement, il faut s'adresser soi-même à la Direction de l'Élevage et emporter un certificat vétérinaire du pays d'origine (depuis les USA, établi par un vétérinaire agréé USDA et visé par l'APHIS). Les autres pays tiers suivent la même logique."
      es: "APHIS no publica requisitos para perros hacia Benín: su página de exportación de animales vivos solo lista certificados bovinos e indica que, para una especie no listada, «los requisitos para esa especie no se conocen», aconsejando al importador obtener un permiso de importación del ministerio de destino. En la práctica, eso significa dirigirte tú mismo a la Direction de l'Élevage y llevar un certificado veterinario del país de origen (desde EE. UU., expedido por un veterinario acreditado por el USDA y refrendado por APHIS). Otros países terceros siguen la misma lógica."
      pt: "O APHIS não publica exigências para cachorros com destino ao Benim: sua página de exportação de animais vivos lista apenas certificados para bovinos e declara que, para uma espécie não listada, 'as exigências para essa espécie não são conhecidas', orientando o importador a obter uma autorização de importação junto ao ministério de destino. Na prática, isso significa endereçar o pedido diretamente à Direction de l'Élevage e levar um certificado veterinário do país de origem (dos EUA, emitido por um veterinário credenciado pelo USDA e endossado pela APHIS). Outros países terceiros seguem a mesma lógica."
    cls: warn
  nonListed:
    title: { en: "From a rabies-endemic or other origin", fr: "Depuis une origine endémique pour la rage ou autre", es: "Desde un origen con rabia endémica u otro", pt: "De uma origem de raiva endêmica ou outra" }
    body:
      en: "The core process does not change: an advance written request to the Direction de l'Élevage and an international sanitary certificate from the country of origin, with the dog presented for control on arrival. Because Benin is itself rabies-endemic, the veterinary authorities focus on the rabies status attested by the origin certificate. Since much of the fine detail is unpublished, confirm every additional condition directly with the Direction de l'Élevage before you travel."
      fr: "Le processus de base ne change pas : une demande écrite préalable à la Direction de l'Élevage et un certificat sanitaire international du pays d'origine, le chien étant présenté pour le contrôle à l'arrivée. Le Bénin étant lui-même endémique pour la rage, les autorités vétérinaires se concentrent sur le statut rabique attesté par le certificat d'origine. Beaucoup de détails n'étant pas publiés, confirme chaque condition supplémentaire directement auprès de la Direction de l'Élevage avant de voyager."
      es: "El proceso básico no cambia: una solicitud escrita previa a la Direction de l'Élevage y un certificado sanitario internacional del país de origen, con el perro presentado para el control a la llegada. Como Benín es a su vez de rabia endémica, las autoridades veterinarias se centran en el estado antirrábico acreditado por el certificado de origen. Como gran parte del detalle fino no está publicado, confirma cada condición adicional directamente con la Direction de l'Élevage antes de viajar."
      pt: "O processo essencial não muda: pedido por escrito antecipado à Direction de l'Élevage e certificado sanitário internacional do país de origem, com o cachorro apresentado para controle na chegada. Como o próprio Benim tem raiva endêmica, as autoridades veterinárias se concentram no status de raiva atestado pelo certificado de origem. Como muitos detalhes não são publicados, confirmar cada condição adicional diretamente junto da Direction de l'Élevage antes de viajar."
    cls: neutral

arrival:
  intro:
    en: "What happens when your dog reaches Benin depends on the request you filed and the documents you carry."
    fr: "Ce qui se passe à l'arrivée de ton chien au Bénin dépend de la demande que tu as déposée et des documents que tu présente."
    es: "Lo que ocurre cuando tu perro llega a Benín depende de la solicitud que hayas presentado y de los documentos que lleves."
    pt: "O que acontece quando o cachorro chega ao Benim depende do pedido apresentado e dos documentos levados."
  points:
    - en: "Your dog is presented to the veterinary services of the Direction de l'Élevage (Service Santé Animale) for sanitary control; pets normally arrive by air at Cotonou (Cadjèhoun) international airport."
      fr: "Ton chien est présenté aux services vétérinaires de la Direction de l'Élevage (Service Santé Animale) pour le contrôle sanitaire ; les animaux de compagnie arrivent normalement par avion à l'aéroport international de Cotonou (Cadjèhoun)."
      es: "Tu perro se presenta a los servicios veterinarios de la Direction de l'Élevage (Service Santé Animale) para el control sanitario; las mascotas llegan normalmente por avión al aeropuerto internacional de Cotonú (Cadjèhoun)."
      pt: "O cachorro é apresentado aos serviços veterinários da Direction de l'Élevage (Service Santé Animale) para controle sanitário; os animais de companhia normalmente chegam por via aérea ao aeroporto internacional de Cotonou (Cadjèhoun)."
    - en: "Carry the originals: the international sanitary certificate from the country of origin and the rabies vaccination record, together with proof of your written request to the Director of Livestock."
      fr: "Munis-toi des originaux : le certificat sanitaire international du pays d'origine et le carnet de vaccination antirabique, ainsi que la preuve de ta demande écrite au Directeur de l'Élevage."
      es: "Lleva los originales: el certificado sanitario internacional del país de origen y la cartilla de vacunación antirrábica, junto con la prueba de tu solicitud escrita al Director de Ganadería."
      pt: "Levar os originais: o certificado sanitário internacional do país de origem e a caderneta de vacinação antirrábica, junto com a prova do pedido por escrito ao Diretor de Pecuária."
    - en: "A sanitary control fee (10,000 FCFA per dog) and a border transit tax / 'laisser-passer sanitaire' are levied by the Direction de l'Élevage."
      fr: "Une redevance de contrôle sanitaire (10 000 FCFA par chien) et une taxe de transit frontalière / « laisser-passer sanitaire » sont perçues par la Direction de l'Élevage."
      es: "La Direction de l'Élevage percibe una tasa de control sanitario (10 000 FCFA por perro) y una tasa de tránsito fronterizo / «laisser-passer sanitaire»."
      pt: "Uma taxa de controle sanitário (10.000 FCFA por cachorro) e uma taxa de trânsito de fronteira / 'laisser-passer sanitaire' são cobradas pela Direction de l'Élevage."
    - en: "Documents must be consistent — identification, vaccination and health statements must match across the certificate and the vaccination record."
      fr: "Les documents doivent être cohérents — l'identification, la vaccination et les mentions sanitaires doivent concorder entre le certificat et le carnet de vaccination."
      es: "Los documentos deben ser coherentes — la identificación, la vacunación y las declaraciones sanitarias deben coincidir entre el certificado y la cartilla de vacunación."
      pt: "Os documentos devem ser coerentes entre si — a identificação, a vacinação e as declarações de saúde devem corresponder entre o certificado e a caderneta de vacinação."
    - en: "If documents are missing, invalid or inconsistent, the animal may be refused, returned or held under veterinary control at the owner's expense. Exact airport steps for a personal pet are not published — confirm with the Direction de l'Élevage."
      fr: "Si les documents manquent, sont invalides ou incohérents, l'animal peut être refusé, renvoyé ou placé sous contrôle vétérinaire aux frais du propriétaire. Les étapes exactes à l'aéroport pour un animal de compagnie personnel ne sont pas publiées — à confirmer auprès de la Direction de l'Élevage."
      es: "Si faltan documentos, no son válidos o son incoherentes, el animal puede ser rechazado, devuelto o retenido bajo control veterinario a cargo del propietario. Los pasos exactos en el aeropuerto para una mascota personal no se publican — confírmalos con la Direction de l'Élevage."
      pt: "Se os documentos estiverem incompletos, inválidos ou inconsistentes, o animal pode ser recusado, devolvido ou retido sob controle veterinário às custas do proprietário. As etapas exatas no aeroporto para um cachorro de companhia particular não são publicadas — confirmar junto da Direction de l'Élevage."

travellerExperience: null

restrictedDogs:
  intro:
    en: "No national breed-specific import ban for dogs was found in the official sources of the Direction de l'Élevage or the MAEP. Entry to Benin is controlled through the written request, the origin-country sanitary certificate and the sanitary control, not through a published list of prohibited breeds."
    fr: "Aucune interdiction d'importation nationale par race de chien n'a été trouvée dans les sources officielles de la Direction de l'Élevage ou du MAEP. L'entrée au Bénin est encadrée par la demande écrite, le certificat sanitaire du pays d'origine et le contrôle sanitaire, non par une liste publiée de races interdites."
    es: "No se ha encontrado ninguna prohibición nacional de importación por raza de perro en las fuentes oficiales de la Direction de l'Élevage ni del MAEP. La entrada a Benín se regula mediante la solicitud escrita, el certificado sanitario del país de origen y el control sanitario, no mediante una lista publicada de razas prohibidas."
    pt: "Nenhuma proibição nacional de importação específica por raça para cachorros foi encontrada nas fontes oficiais da Direction de l'Élevage ou do MAEP. A entrada no Benim é controlada por meio do pedido por escrito, do certificado sanitário do país de origem e do controle sanitário, e não por uma lista publicada de raças proibidas."
  cat1:
    en: "No official list of prohibited dog breeds and no national breed-specific import ban was located in Direction de l'Élevage / MAEP publications. This is the absence of a published rule, not a confirmation that any breed is guaranteed admissible."
    fr: "Aucune liste officielle de races de chiens interdites ni interdiction d'importation nationale par race n'a été trouvée dans les publications de la Direction de l'Élevage / du MAEP. Il s'agit de l'absence d'une règle publiée, non d'une confirmation qu'une race serait garantie admissible."
    es: "No se ha localizado ninguna lista oficial de razas de perros prohibidas ni ninguna prohibición nacional de importación por raza en las publicaciones de la Direction de l'Élevage / del MAEP. Se trata de la ausencia de una norma publicada, no de una confirmación de que alguna raza esté garantizada como admisible."
    pt: "Nenhuma lista oficial de raças de cachorros proibidas e nenhuma proibição nacional de importação específica por raça foram localizadas nas publicações da Direction de l'Élevage / MAEP. Trata-se da ausência de uma regra publicada, não da confirmação de que qualquer raça tenha entrada garantida."
  cat2:
    en: "Because national legislation can change and local rules may exist, confirm the status of your specific breed with the Direction de l'Élevage before you travel, especially for guard or fighting-type dogs."
    fr: "La législation nationale pouvant évoluer et des règles locales pouvant exister, confirme le statut de ta race précise auprès de la Direction de l'Élevage avant de voyager, en particulier pour les chiens de garde ou de type combat."
    es: "Como la legislación nacional puede cambiar y pueden existir normas locales, confirma la situación de tu raza concreta con la Direction de l'Élevage antes de viajar, especialmente para los perros de guarda o de tipo de pelea."
    pt: "Como a legislação nacional pode mudar e podem existir regras locais, confirmar a situação da raça específica junto da Direction de l'Élevage antes de viajar, especialmente para cachorros de guarda ou de tipo combate."
  note:
    en: "Treat any breed question as unresolved until the Direction de l'Élevage confirms it in writing."
    fr: "Considère toute question de race comme non tranchée tant que la Direction de l'Élevage ne l'a pas confirmée par écrit."
    es: "Considera cualquier cuestión de raza como no resuelta hasta que la Direction de l'Élevage la confirme por escrito."
    pt: "Tratar qualquer dúvida sobre raça como não resolvida até que a Direction de l'Élevage confirme por escrito."

checklist:
  - en: "Address a written request to the Director of Livestock (Direction de l'Élevage, MAEP) before travel"
    fr: "Adresse une demande écrite au Directeur de l'Élevage (Direction de l'Élevage, MAEP) avant le voyage"
    es: "Dirige una solicitud escrita al Director de Ganadería (Direction de l'Élevage, MAEP) antes del viaje"
    pt: "Endereçar um pedido por escrito ao Diretor de Pecuária (Direction de l'Élevage, MAEP) antes da viagem"
  - en: "Valid rabies vaccination, current and correctly recorded (confirm the exact timing with the Direction de l'Élevage)"
    fr: "Vaccination antirabique valide, à jour et correctement consignée (confirme le calendrier exact auprès de la Direction de l'Élevage)"
    es: "Vacunación antirrábica válida, al día y correctamente registrada (confirma el calendario exacto con la Direction de l'Élevage)"
    pt: "Vacinação antirrábica válida, em dia e corretamente registrada (confirmar o calendário exato junto da Direction de l'Élevage)"
  - en: "Identification recorded (ISO microchip recommended) and matching all documents"
    fr: "Identification consignée (puce ISO recommandée) et concordant avec tous les documents"
    es: "Identificación registrada (microchip ISO recomendado) y que coincida con todos los documentos"
    pt: "Identificação registrada (microchip ISO recomendado) e correspondente a todos os documentos"
  - en: "International sanitary/veterinary certificate from an official vet of the country of origin (French is convenient)"
    fr: "Certificat sanitaire/vétérinaire international d'un vétérinaire officiel du pays d'origine (le français est commode)"
    es: "Certificado sanitario/veterinario internacional de un veterinario oficial del país de origen (el francés resulta cómodo)"
    pt: "Certificado sanitário/veterinário internacional emitido por um veterinário oficial do país de origem (o francês é conveniente)"
  - en: "From the US: origin certificate issued by a USDA-accredited vet and endorsed by APHIS (no APHIS dog model exists for Benin)"
    fr: "Depuis les USA : certificat d'origine établi par un vétérinaire agréé USDA et visé par l'APHIS (aucun modèle chien APHIS n'existe pour le Bénin)"
    es: "Desde EE. UU.: certificado de origen expedido por un veterinario acreditado por el USDA y refrendado por APHIS (no existe un modelo canino de APHIS para Benín)"
    pt: "Dos EUA: certificado de origem emitido por um veterinário credenciado pelo USDA e endossado pela APHIS (não existe modelo APHIS para cachorros com destino ao Benim)"
  - en: "Original documents ready for the sanitary control at Cotonou airport; expect a 10,000 FCFA/dog fee and a border transit tax"
    fr: "Documents originaux prêts pour le contrôle sanitaire à l'aéroport de Cotonou ; prévois une redevance de 10 000 FCFA/chien et une taxe de transit frontalière"
    es: "Documentos originales listos para el control sanitario en el aeropuerto de Cotonú; cuenta con una tasa de 10 000 FCFA/perro y una tasa de tránsito fronterizo"
    pt: "Documentos originais prontos para o controle sanitário no aeroporto de Cotonou; prever uma taxa de 10.000 FCFA por cachorro e uma taxa de trânsito de fronteira"
  - en: "Confirm any breed, minimum age or additional condition with the Direction de l'Élevage before booking"
    fr: "Confirme toute question de race, d'âge minimum ou condition supplémentaire auprès de la Direction de l'Élevage avant de réserver"
    es: "Confirma cualquier cuestión de raza, edad mínima o condición adicional con la Direction de l'Élevage antes de reservar"
    pt: "Confirmar qualquer condição de raça, idade mínima ou adicional junto da Direction de l'Élevage antes de reservar"
  - en: "Airline reservation confirming your dog's travel option and suitable IATA crate"
    fr: "Réservation confirmant l'option de transport de ton chien et caisse IATA adaptée"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y jaula IATA adecuada"
    pt: "Reserva na companhia aérea confirmando a opção de transporte do seu cachorro e caixa de transporte adequada às normas da IATA"

