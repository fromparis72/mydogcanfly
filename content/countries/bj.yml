notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly fornece informações gerais — não constitui aconselhamento veterinário nem jurídico."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog, and the Direction de l'Élevage (MAEP) confirms the exact conditions when it processes your request."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien, et la Direction de l'Élevage (MAEP) confirme les conditions exactes lors du traitement de ta demande."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro, y la Direction de l'Élevage (MAEP) confirma las condiciones exactas cuando tramita tu solicitud."
    pt: "Somente um médico-veterinário pode confirmar o procedimento exato para cada cachorro, e a Direction de l'Élevage (MAEP) confirma as condições exatas ao processar o pedido."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem de: país de origem, histórico de viagens anteriores, identificação, vacinas, itinerário e data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consultar sempre o médico-veterinário antes de reservar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do cachorro" }
  intro:
    en: "The exact documents depend on three things — Benin (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — le Bénin (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Benín (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — o Benim (o destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Benin", fr: "Pays de destination — Bénin", es: "País de destino — Benín", pt: "País de destino — Benim" }
      text:
        en: "Benin runs its own scheme through the Direction de l'Élevage (MAEP): a written request addressed in advance to the Director of Livestock, an international sanitary certificate from the country of origin, and presentation of the animal for sanitary control are the documented core requirements. There is no EU-style pet passport route."
        fr: "Le Bénin applique son propre dispositif via la Direction de l'Élevage (MAEP) : une demande écrite adressée à l'avance au Directeur de l'Élevage, un certificat sanitaire international du pays d'origine et la présentation de l'animal pour le contrôle sanitaire constituent les exigences de base documentées. Il n'existe pas de voie « passeport » de l'UE."
        es: "Benín aplica su propio sistema a través de la Direction de l'Élevage (MAEP): una solicitud escrita dirigida con antelación al Director de Ganadería, un certificado sanitario internacional del país de origen y la presentación del animal para el control sanitario son los requisitos básicos documentados. No existe una vía de tipo «pasaporte» de la UE."
        pt: "O Benim segue seu próprio esquema pela Direction de l'Élevage (MAEP): um pedido por escrito endereçado com antecedência ao Diretor de Pecuária, um certificado sanitário internacional do país de origem e a apresentação do animal para controle sanitário são as exigências centrais documentadas. Não existe uma via de passaporte para animais de estimação nos moldes europeus."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The country of departure decides which certificate model your official vet uses and how the rabies vaccination is documented. Benin requires the origin-country sanitary certificate but does not publish its own model, so the content follows your departure country's official export certificate for dogs, endorsed by its veterinary authority."
        fr: "Le pays de départ détermine le modèle de certificat qu'utilise ton vétérinaire officiel et la manière dont la vaccination antirabique est documentée. Le Bénin exige le certificat sanitaire du pays d'origine mais ne publie pas de modèle propre ; le contenu suit donc le certificat d'exportation officiel pour chiens de ton pays de départ, visé par son autorité vétérinaire."
        es: "El país de salida determina qué modelo de certificado utiliza tu veterinario oficial y cómo se documenta la vacunación antirrábica. Benín exige el certificado sanitario del país de origen pero no publica un modelo propio, así que el contenido sigue el certificado de exportación oficial para perros de tu país de salida, refrendado por su autoridad veterinaria."
        pt: "O país de partida determina qual modelo de certificado o veterinário oficial utiliza e como a vacinação antirrábica é documentada. O Benim exige o certificado sanitário do país de origem, mas não publica um modelo próprio, de modo que o conteúdo segue o certificado oficial de exportação para cachorros do país de partida, endossado pela sua autoridade veterinária."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde o cachorro esteve recentemente" }
      text:
        en: "Your dog's rabies history and recent country of residence matter to the veterinary services, not only the last airport. Benin is itself rabies-endemic, so its services focus on the rabies status attested by the origin certificate; a recent stay in a higher-risk country can affect what the Direction de l'Élevage asks for."
        fr: "L'historique antirabique et le pays de résidence récent de ton chien comptent pour les services vétérinaires, pas seulement le dernier aéroport de départ. Le Bénin étant lui-même endémique pour la rage, ses services se concentrent sur le statut rabique attesté par le certificat d'origine ; un séjour récent dans un pays à risque plus élevé peut influer sur ce que demande la Direction de l'Élevage."
        es: "El historial antirrábico y el país de residencia reciente de tu perro importan a los servicios veterinarios, no solo el último aeropuerto. Benín es a su vez de rabia endémica, así que sus servicios se centran en el estado antirrábico acreditado por el certificado de origen; una estancia reciente en un país de mayor riesgo puede influir en lo que pida la Direction de l'Élevage."
        pt: "O histórico de raiva do cachorro e o país de residência recente importam para os serviços veterinários, não apenas o último aeroporto. O próprio Benim tem raiva endêmica, por isso os seus serviços se concentram no status de raiva atestado pelo certificado de origem; uma estadia recente em um país de risco mais elevado pode afetar o que a Direction de l'Élevage exige."
  note:
    en: "So read the requirements below as Benin's framework, then confirm your dog's exact origin, history and documents with your vet and the Direction de l'Élevage before booking."
    fr: "Lis donc les exigences ci-dessous comme le cadre béninois, puis confirme l'origine, l'historique et les documents exacts de ton chien avec ton vétérinaire et la Direction de l'Élevage avant de réserver."
    es: "Así que lee los requisitos siguientes como el marco de Benín y luego confirma el origen, el historial y los documentos exactos de tu perro con tu veterinario y la Direction de l'Élevage antes de reservar."
    pt: "Portanto, ler as exigências abaixo como o quadro geral do Benim e, em seguida, confirmar a origem exata, o histórico e os documentos do cachorro com o veterinário e a Direction de l'Élevage antes de reservar."

