# Country Entry Guide — Moldova (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_md
iso2: "MD"
name: { en: "Moldova", fr: "Moldavie", es: "Moldavia", pt: "Moldávia" }
region: { en: "Europe (non-EU)", fr: "Europe (hors UE)", es: "Europa (fuera de la UE)", pt: "Europa (fora da UE)" }


regime: non_listed
exit:
  authority: ANSA
  authorityUrl: https://ansa.gov.md
  intro:
    en: "Moldova is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the National Food Safety Agency (ANSA)."
    fr: "La Moldavie est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par l'Agence nationale de sécurité alimentaire (ANSA)."
    es: "Moldavia no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por la Agencia Nacional de Seguridad Alimentaria (ANSA)."
    pt: "A Moldávia é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pela Agência Nacional de Segurança Alimentar (ANSA)."
  steps:
    - timing: longlead
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      text:
        en: "ANSA is the competent authority for animal health and border inspection; its state veterinarian issues and endorses the export veterinary health certificate."
        fr: "L'ANSA est l'autorité compétente pour la santé animale et le contrôle aux frontières ; son vétérinaire d'État délivre et vise le certificat sanitaire vétérinaire d'export."
        es: "La ANSA es la autoridad competente para la sanidad animal y la inspección fronteriza; su veterinario estatal emite y refrenda el certificado sanitario veterinario de exportación."
        pt: "A ANSA é a autoridade competente para a saúde animal e a inspeção de fronteira; o veterinário estatal dela emite e endossa o atestado de saúde veterinário de exportação."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Moldova with your dog", fr: "Voyager en Moldavie avec ton chien", es: "Viajar a Moldavia con tu perro", pt: "Viajar para a Moldávia com seu cachorro" }
  intro:
    en: >-
      Moldova welcomes dogs, but it is not an EU member, so it applies its own national rules rather than
      the EU pet passport system. The National Food Safety Agency (ANSA) requires that a dog entering the
      country be identified with an ISO microchip fitted before the rabies vaccination, be vaccinated
      against rabies, carry an international veterinary certificate and a pet passport, and — according to
      ANSA's published guidance — show a rabies antibody titration of at least 0.5 IU/ml. At the border,
      the dog must be declared in writing and cross only through a post equipped with an ANSA border
      inspection point, including Chișinău International Airport. This guide explains what to prepare,
      but always confirm the exact procedure for your dog's origin with your veterinarian and with ANSA.
    fr: >-
      La Moldavie accueille les chiens, mais elle n'est pas membre de l'UE : elle applique donc ses propres
      règles nationales et non le passeport européen. L'Agence nationale pour la sécurité alimentaire
      (ANSA) exige qu'un chien entrant dans le pays soit identifié par une puce ISO posée avant la
      vaccination antirabique, soit vacciné contre la rage, soit muni d'un certificat vétérinaire
      international et d'un passeport, et — selon le guide publié par l'ANSA — présente un titrage des
      anticorps antirabiques d'au moins 0,5 UI/ml. À la frontière, le chien doit être déclaré par écrit
      et ne passer que par un poste doté d'un point d'inspection frontalier de l'ANSA, dont l'aéroport
      international de Chișinău. Ce guide explique quoi préparer, mais confirme toujours la procédure
      exacte selon l'origine de ton chien avec ton vétérinaire et l'ANSA.
    es: >-
      Moldavia acoge a los perros, pero no es miembro de la UE, por lo que aplica sus propias normas
      nacionales en lugar del sistema del pasaporte europeo para mascotas. La Agencia Nacional de
      Seguridad Alimentaria (ANSA) exige que un perro que entra en el país esté identificado con un
      microchip ISO colocado antes de la vacunación antirrábica, esté vacunado contra la rabia, lleve un
      certificado veterinario internacional y un pasaporte para mascotas y — según la guía publicada por
      la ANSA — presente una titulación de anticuerpos contra la rabia de al menos 0,5 UI/ml. En la
      frontera, el perro debe declararse por escrito y cruzar solo por un puesto dotado de un punto de
      inspección fronteriza de la ANSA, incluido el Aeropuerto Internacional de Chișinău. Esta guía
      explica qué preparar, pero confirma siempre el procedimiento exacto según el origen de tu perro con
      tu veterinario y con la ANSA.

    pt: "A Moldávia recebe bem os cachorros, mas não é membro da UE, então aplica suas próprias regras nacionais em vez do sistema de passaporte europeu para animais. A Agência Nacional de Segurança Alimentar (ANSA) exige que um cachorro que entra no país esteja identificado com um microchip ISO implantado antes da vacinação antirrábica, esteja vacinado contra a raiva, leve um certificado veterinário internacional e um passaporte para animais e — segundo as orientações publicadas pela ANSA — apresente uma titulação de anticorpos antirrábicos de pelo menos 0,5 UI/ml. Na fronteira, o cachorro precisa ser declarado por escrito e cruzar apenas por um posto equipado com um ponto de inspeção de fronteira da ANSA, incluindo o Aeroporto Internacional de Chișinău. Este guia explica o que preparar, mas sempre confirme o procedimento exato para a origem do seu cachorro com seu veterinário e com a ANSA."
difficulty:
  level: moderate
  label: { en: "Moderate — antibody test usually needed", fr: "Modéré — titrage généralement requis", es: "Moderado — normalmente se necesita una prueba de titulación", pt: "Moderado — o teste sorológico costuma ser necessário" }

prepTime:
  eu:
    en: "From the EU / low-rabies-risk countries: a few days if microchip, rabies vaccination and (where required) a valid titration are already in order."
    fr: "Depuis l'UE / pays à faible risque rabique : quelques jours si puce, vaccin antirabique et (si exigé) titrage valide sont déjà en règle."
    es: "Desde la UE / países de bajo riesgo de rabia: unos días si el microchip, la vacunación antirrábica y (cuando se exija) una titulación válida ya están en regla."
    pt: "Da UE / países de baixo risco de raiva: alguns dias, se o microchip, a vacinação antirrábica e (quando exigida) a titulação válida já estiverem em ordem."
  listed:
    en: "From other countries with a favourable rabies situation: allow a few weeks to obtain and endorse the international veterinary certificate."
    fr: "Depuis d'autres pays à situation rabique favorable : prévoir quelques semaines pour obtenir et faire viser le certificat vétérinaire international."
    es: "Desde otros países con una situación de rabia favorable: prevé unas semanas para obtener y refrendar el certificado veterinario internacional."
    pt: "De outros países com situação favorável em relação à raiva: reserve algumas semanas para obter e endossar o certificado veterinário internacional."
  nonListed:
    en: "From a rabies-risk country: ~3–4 months minimum — the antibody titration must be at least 3 months (and at most 24 months) before departure."
    fr: "Depuis un pays à risque rabique : ~3–4 mois minimum — le titrage doit dater d'au moins 3 mois (et de 24 mois au plus) avant le départ."
    es: "Desde un país con riesgo de rabia: ~3–4 meses como mínimo — la titulación de anticuerpos debe realizarse al menos 3 meses (y como máximo 24 meses) antes de la salida."
    pt: "De um país de risco de raiva: ~3–4 meses no mínimo — a titulação de anticorpos precisa ser feita pelo menos 3 meses (e no máximo 24 meses) antes da partida."

