origin:
  eu:
    title: { en: "From the EU / low-rabies-risk countries", fr: "Depuis l'UE / pays à faible risque rabique", es: "Desde la UE / países de bajo riesgo de rabia", pt: "Da UE / países de baixo risco de raiva" }
    body:
      en: "A dog arriving from the EU or another low-rabies-risk country needs an ISO microchip fitted before vaccination, a valid rabies vaccination, an international veterinary certificate and a pet passport. ANSA's guidance also lists a rabies antibody titration (≥0.5 IU/ml); confirm with ANSA whether it applies to your specific origin."
      fr: "Un chien arrivant de l'UE ou d'un autre pays à faible risque rabique a besoin d'une puce ISO posée avant le vaccin, d'une vaccination antirabique valide, d'un certificat vétérinaire international et d'un passeport. Le guide de l'ANSA mentionne aussi un titrage antirabique (≥0,5 UI/ml) ; vérifie auprès de l'ANSA s'il s'applique à ton origine."
      es: "Un perro que llega de la UE o de otro país de bajo riesgo de rabia necesita un microchip ISO colocado antes de la vacuna, una vacunación antirrábica válida, un certificado veterinario internacional y un pasaporte para mascotas. La guía de la ANSA también menciona una titulación de anticuerpos contra la rabia (≥0,5 UI/ml); confirma con la ANSA si se aplica a tu origen concreto."
      pt: "Um cachorro vindo da UE ou de outro país de baixo risco de raiva precisa de um microchip ISO implantado antes da vacinação, de vacinação antirrábica válida, de certificado veterinário internacional e de passaporte para animais. As orientações da ANSA também listam uma titulação de anticorpos antirrábicos (≥0,5 UI/ml); confirme com a ANSA se ela se aplica à sua origem específica."
    cls: ok
  listed:
    title: { en: "From other favourable-rabies countries", fr: "Depuis d'autres pays à situation rabique favorable", es: "Desde otros países con una situación de rabia favorable", pt: "De outros países com situação favorável em relação à raiva" }
    body:
      en: "The same baseline applies: microchip, rabies vaccination, international veterinary certificate and passport, with a rabies antibody titration recorded on the certificate. Allow time to have the certificate issued and endorsed by an official vet before travel."
      fr: "La même base s'applique : puce, vaccination antirabique, certificat vétérinaire international et passeport, avec un titrage antirabique consigné sur le certificat. Prévois le temps de faire établir et viser le certificat par un vétérinaire officiel avant le départ."
      es: "Se aplica la misma base: microchip, vacunación antirrábica, certificado veterinario internacional y pasaporte, con una titulación de anticuerpos contra la rabia registrada en el certificado. Prevé tiempo para que un veterinario oficial expida y refrende el certificado antes del viaje."
      pt: "A mesma base se aplica: microchip, vacinação antirrábica, certificado veterinário internacional e passaporte, com uma titulação de anticorpos antirrábicos registrada no certificado. Reserve tempo para que o certificado seja emitido e endossado por um veterinário oficial antes da viagem."
    cls: warn
  nonListed:
    title: { en: "From a rabies-risk country", fr: "Depuis un pays à risque rabique", es: "Desde un país con riesgo de rabia", pt: "De um país de risco de raiva" }
    body:
      en: "The rabies antibody titration is the critical step: a positive result of at least 0.5 IU/ml, drawn at least 3 months (and at most 24 months) before dispatch. Plan several months ahead, keep the vaccination valid throughout, and carry the endorsed international veterinary certificate and passport."
      fr: "Le titrage des anticorps antirabiques est l'étape critique : résultat positif d'au moins 0,5 UI/ml, prélevé au moins 3 mois (et au plus 24 mois) avant l'expédition. Prévois plusieurs mois, maintiens la vaccination valide tout du long, et munis-toi du certificat vétérinaire international visé et du passeport."
      es: "La titulación de anticuerpos contra la rabia es el paso crítico: un resultado positivo de al menos 0,5 UI/ml, extraído al menos 3 meses (y como máximo 24 meses) antes del envío. Planifica con varios meses de antelación, mantén la vacunación válida durante todo el proceso y lleva el certificado veterinario internacional refrendado y el pasaporte."
      pt: "A titulação de anticorpos antirrábicos é a etapa crítica: um resultado positivo de pelo menos 0,5 UI/ml, coletado pelo menos 3 meses (e no máximo 24 meses) antes do despacho. Planeje com vários meses de antecedência, mantenha a vacinação válida durante todo o processo e leve o certificado veterinário internacional endossado e o passaporte."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Moldova takes place at a border crossing equipped with an ANSA inspection point."
    fr: "Ce qui se passe à l'arrivée de ton chien en Moldavie a lieu à un poste frontière doté d'un point d'inspection de l'ANSA."
    es: "Lo que ocurre cuando tu perro llega a Moldavia tiene lugar en un paso fronterizo dotado de un punto de inspección de la ANSA."
    pt: "O que acontece quando seu cachorro chega à Moldávia se passa em um posto de fronteira equipado com um ponto de inspeção da ANSA."
  points:
    - en: "The pet must be declared in writing and is subject to customs and veterinary control at the border."
      fr: "L'animal doit être déclaré par écrit et est soumis au contrôle douanier et vétérinaire à la frontière."
      es: "La mascota debe declararse por escrito y está sujeta al control aduanero y veterinario en la frontera."
      pt: "O animal precisa ser declarado por escrito e fica sujeito ao controle alfandegário e veterinário na fronteira."
    - en: "Cross only through a post with an ANSA border inspection point — including Chișinău International Airport, Leușeni, Sculeni, Giurgiulești, Criva and others."
      fr: "Ne passe que par un poste doté d'un point d'inspection frontalier ANSA — dont l'aéroport international de Chișinău, Leușeni, Sculeni, Giurgiulești, Criva et autres."
      es: "Cruza solo por un puesto dotado de un punto de inspección fronteriza de la ANSA — incluidos el Aeropuerto Internacional de Chișinău, Leușeni, Sculeni, Giurgiulești, Criva y otros."
      pt: "Cruze apenas por um posto com ponto de inspeção de fronteira da ANSA — incluindo o Aeroporto Internacional de Chișinău, Leușeni, Sculeni, Giurgiulești, Criva e outros."
    - en: "Contact the official vet at the inspection point, present the pet's identification documents and make the animal available for checks."
      fr: "Contacte le vétérinaire officiel au point d'inspection, présente les documents d'identification de l'animal et mets-le à disposition pour les contrôles."
      es: "Ponte en contacto con el veterinario oficial en el punto de inspección, presenta los documentos de identificación de la mascota y pon al animal a disposición para los controles."
      pt: "Entre em contato com o veterinário oficial no ponto de inspeção, apresente os documentos de identificação do animal e deixe-o disponível para conferência."
    - en: "Movement is permitted only on the basis of a valid veterinary certificate; customs authorise the crossing after the ANSA check."
      fr: "La circulation n'est autorisée que sur la base d'un certificat vétérinaire valide ; la douane autorise le passage après le contrôle de l'ANSA."
      es: "El movimiento solo se permite sobre la base de un certificado veterinario válido; la aduana autoriza el cruce tras el control de la ANSA."
      pt: "A movimentação só é permitida com base em um certificado veterinário válido; a alfândega autoriza a passagem depois do controle da ANSA."
    - en: "A maximum of five pets may accompany the owner in a single non-commercial movement."
      fr: "Cinq animaux au maximum peuvent accompagner le propriétaire lors d'une seule circulation non commerciale."
      es: "Un máximo de cinco mascotas puede acompañar al propietario en un único movimiento no comercial."
      pt: "No máximo cinco animais podem acompanhar o dono em um único movimento não comercial."
    - en: "Carry original documents; if papers are missing or invalid, entry can be refused or the animal held at the border."
      fr: "Munis-toi des documents originaux ; si les papiers manquent ou sont invalides, l'entrée peut être refusée ou l'animal retenu à la frontière."
      es: "Lleva los documentos originales; si faltan documentos o no son válidos, se puede denegar la entrada o retener al animal en la frontera."
      pt: "Leve os documentos originais; se faltarem documentos ou eles não forem válidos, a entrada pode ser recusada ou o animal retido na fronteira."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Moldova currently publishes no breed-specific import ban for dogs entering the country. However, a new pet-protection law introduces breed restrictions from 2027 — plan ahead if you own a listed breed."
    fr: "La Moldavie ne publie actuellement aucune interdiction d'importation propre à certaines races. Toutefois, une nouvelle loi sur la protection des animaux introduit des restrictions de races à partir de 2027 — anticipe si tu détiens une race listée."
    es: "Moldavia no publica actualmente ninguna prohibición de importación basada en la raza para los perros que entran en el país. Sin embargo, una nueva ley de protección de mascotas introduce restricciones de razas a partir de 2027 — planifica con antelación si tienes una raza listada."
    pt: "Atualmente, a Moldávia não publica nenhuma proibição de importação por raça para cachorros que entram no país. No entanto, uma nova lei de proteção de animais de estimação introduz restrições por raça a partir de 2027 — planeje-se com antecedência se você tem uma raça listada."
  cat1:
    en: "Under Law No. 256/2025 on the protection of pets (in force September 2027), the breeding, import and purchase of certain potentially dangerous breeds will be banned. ANSA lists: Akbash, Alapaha Blue Blood Bulldog, American Bandog, American Pit Bull Terrier, Bullmastiff, Bully Kutta, Campeiro Bulldog, Caucasian Shepherd Dog, Gull Dong, Wolfdog and wolfdog hybrids."
    fr: "Selon la loi n° 256/2025 sur la protection des animaux de compagnie (en vigueur en septembre 2027), l'élevage, l'importation et l'achat de certaines races potentiellement dangereuses seront interdits. L'ANSA cite : Akbash, Alapaha Blue Blood Bulldog, American Bandog, American Pit Bull Terrier, Bullmastiff, Bully Kutta, Campeiro Bulldog, berger du Caucase, Gull Dong, chien-loup et hybrides de chien-loup."
    es: "Conforme a la Ley n.º 256/2025 sobre la protección de las mascotas (en vigor en septiembre de 2027), se prohibirán la cría, la importación y la compra de determinadas razas potencialmente peligrosas. La ANSA cita: Akbash, Alapaha Blue Blood Bulldog, American Bandog, American Pit Bull Terrier, Bullmastiff, Bully Kutta, Campeiro Bulldog, pastor del Cáucaso, Gull Dong, perro lobo e híbridos de perro lobo."
    pt: "Segundo a Lei nº 256/2025 sobre a proteção de animais de estimação (em vigor a partir de setembro de 2027), a criação, a importação e a compra de certas raças potencialmente perigosas serão proibidas. A ANSA lista: Akbash, Alapaha Blue Blood Bulldog, American Bandog, American Pit Bull Terrier, Bullmastiff, Bully Kutta, Campeiro Bulldog, Pastor do Cáucaso, Gull Dong, cachorro-lobo e híbridos de cachorro-lobo."
  cat2:
    en: "Dogs of these breeds already owned by residents may stay with their owners provided they are neutered/sterilised to prevent reproduction. No other national category of restricted dog is published for import today."
    fr: "Les chiens de ces races déjà détenus par des résidents peuvent rester avec leurs propriétaires à condition d'être stérilisés pour empêcher la reproduction. Aucune autre catégorie nationale de chien réglementé à l'import n'est publiée aujourd'hui."
    es: "Los perros de estas razas ya en poder de residentes pueden permanecer con sus propietarios siempre que estén castrados/esterilizados para impedir la reproducción. Hoy en día no se publica ninguna otra categoría nacional de perro restringido para la importación."
    pt: "Cachorros dessas raças já pertencentes a residentes podem continuar com seus donos, desde que sejam castrados/esterilizados para impedir a reprodução. Nenhuma outra categoria nacional de cachorro restrito é publicada para importação atualmente."
  note:
    en: "Because this ban takes effect in 2027 and its import scope is still being detailed, confirm the current position with ANSA before travelling with a listed breed."
    fr: "Cette interdiction prenant effet en 2027 et sa portée à l'import étant encore précisée, confirme la situation actuelle auprès de l'ANSA avant de voyager avec une race listée."
    es: "Como esta prohibición entra en vigor en 2027 y su alcance para la importación aún se está detallando, confirma la situación actual con la ANSA antes de viajar con una raza listada."
    pt: "Como essa proibição entra em vigor em 2027 e seu alcance para a importação ainda está sendo detalhado, confirme a posição atual com a ANSA antes de viajar com uma raça listada."

