factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Moldova (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — la Moldavie (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Moldavia (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — a Moldávia (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — Moldova", fr: "Pays de destination — Moldavie", es: "País de destino — Moldavia", pt: "País de destino — Moldávia" }
      text:
        en: "Moldova is outside the EU and applies its own norm (Government Decision 660/2022): an ISO microchip fitted before vaccination, a valid rabies vaccination, an international veterinary certificate and a pet passport are the baseline for entry."
        fr: "La Moldavie est hors UE et applique sa propre norme (Décision gouvernementale 660/2022) : puce ISO posée avant la vaccination, vaccination antirabique valide, certificat vétérinaire international et passeport constituent la base pour entrer."
        es: "Moldavia está fuera de la UE y aplica su propia norma (Decisión Gubernamental 660/2022): un microchip ISO colocado antes de la vacunación, una vacunación antirrábica válida, un certificado veterinario internacional y un pasaporte para mascotas son la base para entrar."
        pt: "A Moldávia está fora da UE e aplica sua própria norma (Decisão Governamental 660/2022): microchip ISO implantado antes da vacinação, vacinação antirrábica válida, certificado veterinário internacional e passaporte para animais são a base para a entrada."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The origin's rabies situation decides how strict the file is. ANSA's guidance calls for a rabies antibody titration (≥0.5 IU/ml); for rabies-risk origins this test and its timing are the critical, slow step."
        fr: "La situation rabique du pays d'origine détermine la sévérité du dossier. Le guide de l'ANSA demande un titrage des anticorps antirabiques (≥0,5 UI/ml) ; pour les origines à risque, ce test et son calendrier sont l'étape critique et lente."
        es: "La situación de rabia del origen determina lo estricto que es el expediente. La guía de la ANSA exige una titulación de anticuerpos contra la rabia (≥0,5 UI/ml); para los orígenes con riesgo de rabia, esta prueba y su calendario son el paso crítico y lento."
        pt: "A situação da raiva na origem determina o rigor do processo. As orientações da ANSA pedem uma titulação de anticorpos antirrábicos (≥0,5 UI/ml); para origens de risco de raiva, esse exame e seu prazo são a etapa crítica e mais demorada."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay in a rabies-risk country can trigger the antibody test even if you fly in from a lower-risk country. It is your dog's real origin and history that count — not only the last airport."
        fr: "Un séjour récent dans un pays à risque rabique peut imposer le titrage même si tu arrives d'un pays à moindre risque. C'est l'origine réelle et l'historique du chien qui comptent — pas seulement l'aéroport de destination finale."
        es: "Una estancia reciente en un país con riesgo de rabia puede obligar a la prueba de titulación aunque llegues desde un país de menor riesgo. Lo que cuenta es el origen y el historial reales de tu perro — no solo el último aeropuerto."
        pt: "Uma estadia recente em um país de risco de raiva pode acionar o teste sorológico mesmo que você chegue de um país de risco menor. O que conta é a origem real e o histórico do seu cachorro — não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Moldova's framework, then confirm your dog's exact origin and history with your vet and with ANSA."
    fr: "Lis donc les exigences ci-dessous comme le cadre moldave, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire et l'ANSA."
    es: "Así que lee los requisitos siguientes como el marco de Moldavia y luego confirma el origen y el historial exactos de tu perro con tu veterinario y con la ANSA."
    pt: "Leia então as exigências abaixo como o quadro geral da Moldávia, e confirme com seu veterinário e com a ANSA a origem e o histórico exatos do seu cachorro."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Transponder compliant with ISO 11784/11785; must be implanted before the rabies vaccination.", fr: "Transpondeur conforme ISO 11784/11785 ; doit être posé avant la vaccination antirabique.", es: "Transpondedor conforme con la norma ISO 11784/11785; debe implantarse antes de la vacunación antirrábica.", pt: "Transponder em conformidade com a norma ISO 11784/11785; deve ser implantado antes da vacinação antirrábica." }
    exceptions: { en: "If the chip is fitted after vaccination, the dog must be re-vaccinated.", fr: "Si la puce est posée après le vaccin, le chien doit être revacciné.", es: "Si el chip se coloca después de la vacuna, el perro debe ser revacunado.", pt: "Se o microchip for implantado depois da vacinação, o cachorro precisa ser revacinado." }
    ref: { en: "HG 839/2009; HG 660/2022; ANSA guide", fr: "HG 839/2009 ; HG 660/2022 ; guide ANSA", es: "HG 839/2009; HG 660/2022; guía de la ANSA", pt: "HG 839/2009; HG 660/2022; guia da ANSA" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Valid vaccination recorded in the certificate/passport (identification, vaccine and validity dates).", fr: "Vaccination valide consignée dans le certificat/passeport (identification, dates de vaccin et de validité).", es: "Vacunación válida registrada en el certificado/pasaporte (identificación, fechas de la vacuna y de valide).", pt: "Vacinação válida registrada no certificado/passaporte (identificação, datas da vacina e de validade)." }
    exceptions: { en: "The microchip must already be in place before the shot.", fr: "La puce doit déjà être posée avant l'injection.", es: "El microchip debe estar ya implantado antes de la inyección.", pt: "O microchip já precisa estar implantado antes da vacina." }
    ref: { en: "HG 660/2022; ANSA guide", fr: "HG 660/2022 ; guide ANSA", es: "HG 660/2022; guía de la ANSA", pt: "HG 660/2022; guia da ANSA" }
  - item: { en: "Rabies antibody test (titration)", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Required per ANSA guidance", fr: "Requis selon le guide ANSA", es: "Obligatoria según la guía de la ANSA", pt: "Obrigatório segundo as orientações da ANSA" }
    when: { en: "Positive antibody test ≥0.5 IU/ml, performed at most 24 months and at least 3 months before dispatch; result valid 4 months or until the rabies vaccination expires.", fr: "Titre positif ≥0,5 UI/ml, réalisé au plus 24 mois et au moins 3 mois avant l'expédition ; résultat valable 4 mois ou jusqu'à expiration de la vaccination.", es: "Prueba de anticuerpos positiva ≥0,5 UI/ml, realizada como máximo 24 meses y al menos 3 meses antes del envío; resultado válido 4 meses o hasta que caduque la vacunación antirrábica.", pt: "Teste sorológico positivo ≥0,5 UI/ml, feito no máximo 24 meses e no mínimo 3 meses antes do despacho; resultado válido por 4 meses ou até a vacinação antirrábica vencer." }
    exceptions: { en: "Under HG 660/2022 (EU-aligned) extra rabies safeguards apply chiefly to origins with an unfavourable rabies situation — confirm scope with ANSA.", fr: "Selon la HG 660/2022 (alignée UE), les garanties rabiques renforcées visent surtout les origines à situation rabique défavorable — confirme la portée auprès de l'ANSA.", es: "Conforme a la HG 660/2022 (alineada con la UE), las garantías reforzadas contra la rabia se aplican sobre todo a orígenes con una situación de rabia desfavorable — confirma el alcance con la ANSA.", pt: "Segundo a HG 660/2022 (alinhada com a UE), salvaguardas extras contra a raiva se aplicam principalmente a origens com situação desfavorável em relação à raiva — confirme o alcance com a ANSA." }
    ref: { en: "HG 839/2009, Ch. 1; ANSA guide", fr: "HG 839/2009, chap. 1 ; guide ANSA", es: "HG 839/2009, cap. 1; guía de la ANSA", pt: "HG 839/2009, cap. 1; guia da ANSA" }
  - item: { en: "International veterinary certificate", fr: "Certificat vétérinaire international", es: "Certificado veterinario internacional", pt: "Certificado veterinário internacional" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Issued by an official veterinarian; states the animal's identification, the vaccination and the antibody-test result.", fr: "Établi par un vétérinaire officiel ; mentionne l'identification de l'animal, la vaccination et le résultat du titrage.", es: "Expedido por un veterinario oficial; indica la identificación del animal, la vacunación y el resultado de la prueba de titulación.", pt: "Emitido por um veterinário oficial; indica a identificação do animal, a vacinação e o resultado do teste sorológico." }
    exceptions: { en: "An EU-type pet passport is accepted for a pet re-entering the EU, not as a substitute for the Moldovan entry file.", fr: "Un passeport de type UE est admis pour un animal réentrant dans l'UE, mais ne remplace pas le dossier d'entrée moldave.", es: "Un pasaporte de tipo UE se acepta para una mascota que reingresa en la UE, pero no como sustituto del expediente de entrada moldavo.", pt: "Um passaporte para animais do tipo UE é aceito para um animal que retorna à UE, mas não como substituto do processo de entrada moldavo." }
    ref: { en: "HG 660/2022; Serviciul Vamal", fr: "HG 660/2022 ; Service des douanes", es: "HG 660/2022; Serviciul Vamal (Aduanas)", pt: "HG 660/2022; Serviciul Vamal (Alfândega)" }
  - item: { en: "Pet passport (international movement)", fr: "Passeport (circulation internationale)", es: "Pasaporte para mascotas (movimiento internacional)", pt: "Passaporte para animais (movimento internacional)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Passport for international movement of pets accompanying the animal.", fr: "Passeport pour la circulation internationale des animaux de compagnie accompagnant l'animal.", es: "Pasaporte para el movimiento internacional de mascotas que acompaña al animal.", pt: "Passaporte para o movimento internacional de animais de estimação que acompanha o animal." }
    exceptions: { en: "None published.", fr: "Aucune publiée.", es: "Ninguna publicada.", pt: "Nenhuma publicada." }
    ref: { en: "HG 839/2009, Ch. 1; ANSA guide", fr: "HG 839/2009, chap. 1 ; guide ANSA", es: "HG 839/2009, cap. 1; guía de la ANSA", pt: "HG 839/2009, cap. 1; guia da ANSA" }
  - item: { en: "Tapeworm (Echinococcus) treatment", fr: "Traitement échinococcose", es: "Tratamiento contra la tenia (Echinococcus)", pt: "Tratamento contra a tênia (Echinococcus)" }
    required: { en: "Not published", fr: "Non publié", es: "No publicado", pt: "Não publicado" }
