    when: { en: "In practice the dog must be old enough to be vaccinated against rabies (usually ≥12 weeks) and, where required, to complete the antibody test and waiting period.", fr: "En pratique, le chien doit être en âge d'être vacciné contre la rage (généralement ≥12 semaines) et, si exigé, d'effectuer le titrage et le délai d'attente.", es: "En la práctica, el perro debe tener edad suficiente para ser vacunado contra la rabia (generalmente ≥12 semanas) y, cuando se exija, para completar la prueba de titulación y el periodo de espera.", pt: "Na prática, o cachorro precisa ter idade suficiente para ser vacinado contra a raiva (geralmente ≥12 semanas) e, quando exigido, para completar o teste sorológico e o período de espera." }
