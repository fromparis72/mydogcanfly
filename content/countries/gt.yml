# Country Entry Guide — Guatemala (bilingual EN/FR).
# Guatemala is NOT in the EU. This encodes Guatemala's own MAGA/VISAR scheme.
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_gt
iso2: "GT"
name: { en: "Guatemala", fr: "Guatemala", es: "Guatemala", pt: "Guatemala" }
region: { en: "Central America", fr: "Amérique centrale", es: "América Central", pt: "América Central" }


regime: non_listed
exit:
  authority: MAGA / VISAR
  authorityUrl: https://visar.maga.gob.gt/
  intro:
    en: "Guatemala is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by MAGA/VISAR."
    fr: "Le Guatemala est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par le MAGA/VISAR."
    es: "Guatemala no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el MAGA/VISAR."
    pt: "A Guatemala é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação visado pelo MAGA/VISAR."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "MAGA/VISAR issues the international export zoosanitary certificate from a private vet's health certificate and rabies record (rabies applied at least 1 month before travel)."
        fr: "Le MAGA/VISAR délivre le certificat zoosanitaire international d'export à partir du certificat sanitaire d'un vétérinaire privé et du carnet antirabique (rage appliquée au moins 1 mois avant)."
        es: "El MAGA/VISAR emite el certificado zoosanitario internacional de exportación a partir del certificado sanitario de un veterinario privado y el registro antirrábico (rabia aplicada al menos 1 mes antes)."
        pt: "O MAGA/VISAR emite o certificado zoossanitário internacional de exportação a partir do atestado de saúde de um veterinário particular e do registro da vacinação antirrábica (raiva aplicada no mínimo 1 mês antes da viagem)."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Guatemala with your dog", fr: "Voyager au Guatemala avec ton chien", es: "Viajar a Guatemala con tu perro", pt: "Viajar para a Guatemala com seu cachorro" }
  intro:
    en: >-
      Guatemala welcomes dogs, and its rules are handled by its own animal-health authority — the
      Directorate of Animal Health of VISAR (Viceministerio de Sanidad Agropecuaria y Regulaciones),
      part of the Ministry of Agriculture, Livestock and Food (MAGA), not the EU pet-passport system.
      A dog travelling with its owner from any country needs a veterinary health certificate issued in
      the country of departure, together with a vaccination record that includes a rabies vaccination
      and internal and external parasite treatment. No prior MAGA import permit is required for a dog
      or cat kept as a personal pet — the documents are presented to a SEPA-MAGA inspector at the
      border, who charges a physical-inspection fee. What exactly you must prepare still depends on your
      dog's country of departure and recent history, because the certificate must confirm the animal is
      healthy and free of disease. This guide explains what to prepare before you book your flight.
    fr: >-
      Le Guatemala accueille les chiens, et ses règles relèvent de sa propre autorité sanitaire animale —
      la Direction de la santé animale du VISAR (Viceministerio de Sanidad Agropecuaria y Regulaciones),
      rattaché au Ministère de l'Agriculture, de l'Élevage et de l'Alimentation (MAGA), et non du système
      du passeport européen. Un chien voyageant avec son propriétaire depuis n'importe quel pays a besoin
      d'un certificat sanitaire vétérinaire établi dans le pays de départ, accompagné d'un carnet de
      vaccination incluant une vaccination antirabique et un traitement antiparasitaire interne et externe.
      Aucun permis d'importation préalable du MAGA n'est exigé pour un chien ou un chat de compagnie — les
      documents sont présentés à un inspecteur SEPA-MAGA à la frontière, qui perçoit des frais d'inspection
      physique. Ce qu'il faut préparer dépend tout de même du pays de départ et de l'historique récent du
      chien, car le certificat doit confirmer que l'animal est en bonne santé et indemne de maladie. Ce
      guide détaille quoi préparer avant de réserver ton vol.
    es: >-
      Guatemala acoge a los perros, y sus normas dependen de su propia autoridad sanitaria animal — la
      Dirección de Sanidad Animal del VISAR (Viceministerio de Sanidad Agropecuaria y Regulaciones),
      adscrita al Ministerio de Agricultura, Ganadería y Alimentación (MAGA), y no del sistema del
      pasaporte europeo. Un perro que viaja con su propietario desde cualquier país necesita un certificado
      sanitario veterinario expedido en el país de salida, junto con una cartilla de vacunación que incluya
      una vacunación antirrábica y un tratamiento antiparasitario interno y externo. No se exige ningún
      permiso de importación previo del MAGA para un perro o gato de compañía — los documentos se presentan
      a un inspector SEPA-MAGA en la frontera, que cobra una tasa de inspección física. Lo que debes
      preparar exactamente depende igualmente del país de salida y del historial reciente del perro, ya que
      el certificado debe confirmar que el animal está sano y libre de enfermedad. Esta guía explica qué
      preparar antes de reservar tu vuelo.

    pt: "A Guatemala recebe cachorros, e suas regras são conduzidas pela própria autoridade de saúde animal do país — a Direção de Saúde Animal do VISAR (Viceministerio de Sanidad Agropecuaria y Regulaciones), órgão do Ministério da Agricultura, Pecuária e Alimentação (MAGA) —, e não pelo sistema do passaporte europeu para animais. Um cachorro que viaja com seu dono, venha do país que for, precisa de um atestado de saúde veterinário emitido no país de partida, junto com uma carteira de vacinação que inclua a vacinação antirrábica e o tratamento contra parasitas internos e externos. Não é preciso autorização de importação prévia do MAGA para um cachorro ou gato mantido como animal de estimação pessoal — os documentos são apresentados a um inspetor do SEPA-MAGA na fronteira, que cobra uma taxa de inspeção física. O que exatamente você tem de preparar também depende do país de partida e do histórico recente do seu cachorro, porque o certificado precisa confirmar que o animal está saudável e livre de doenças. Este guia explica o que preparar antes de você reservar o voo."
difficulty:
  level: easy
  label: { en: "Easy — one health certificate, no prior permit for personal pets", fr: "Facile — un certificat sanitaire, sans permis préalable pour les animaux de compagnie", es: "Fácil — un certificado sanitario, sin permiso previo para mascotas personales", pt: "Fácil — um atestado de saúde, sem autorização prévia para animais de estimação pessoais" }

prepTime:
  eu:
    en: "A few days if the rabies vaccine is already valid — you mainly need a veterinary health certificate from the country of departure plus the up-to-date vaccination record."
    fr: "Quelques jours si le vaccin antirabique est déjà valide — il faut surtout un certificat sanitaire vétérinaire du pays de départ et le carnet de vaccination à jour."
    es: "Unos días si la vacuna antirrábica ya es válida — necesitas sobre todo un certificado sanitario veterinario del país de salida y la cartilla de vacunación al día."
    pt: "Alguns dias se a vacina antirrábica já estiver válida — você precisa basicamente de um atestado de saúde veterinário do país de partida e da carteira de vacinação em dia."
  listed:
    en: "From the United States: allow time to complete the bilateral export health certificate (available on the VISAR site) or to prepare the vaccination card showing vaccines applied 1 month to 1 year before travel."
    fr: "Depuis les États-Unis : prévois du temps pour compléter le certificat sanitaire d'exportation bilatéral (disponible sur le site du VISAR) ou pour préparer le carné de vaccination indiquant des vaccins appliqués entre 1 mois et 1 an avant le voyage."
    es: "Desde Estados Unidos: prevé tiempo para completar el certificado sanitario de exportación bilateral (disponible en el sitio del VISAR) o para preparar la cartilla de vacunación que muestre vacunas aplicadas entre 1 mes y 1 año antes del viaje."
    pt: "Dos Estados Unidos: reserve tempo para preencher o atestado de saúde de exportação bilateral (disponível no site do VISAR) ou para preparar a carteira de vacinação mostrando vacinas aplicadas de 1 mês a 1 ano antes da viagem."
  nonListed:
    en: "~1 month if a rabies shot is still needed: the vaccination record must show vaccines applied no less than 1 month and no more than 1 year before travel."
    fr: "~1 mois si une vaccination antirabique reste à faire : le carnet doit indiquer des vaccins appliqués au moins 1 mois et au plus 1 an avant le voyage."
    es: "~1 mes si aún falta una vacuna antirrábica: la cartilla de vacunación debe mostrar vacunas aplicadas no menos de 1 mes y no más de 1 año antes del viaje."
    pt: "~1 mês se ainda faltar uma dose antirrábica: a carteira de vacinação precisa mostrar vacinas aplicadas no mínimo 1 mês e no máximo 1 ano antes da viagem."

