# Country Entry Guide — Maldives (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
# IMPORTANT: The Maldives PROHIBITS the importation of dogs. This is stated explicitly on the
# official Maldives Customs "Prohibited & Restricted Items for import" pages (both the personal-use
# and the importers versions): "Note: the import of dogs and dangerous animals are strictly
# prohibited." Import of most other pets is allowed only with a veterinary health certificate, but
# dogs are banned outright. No official service-dog / guide-dog / assistance-dog exception is
# published by Maldives Customs — that exception status is therefore left as Unknown, not invented.
# There is no legal import procedure for a dog, so the requirements/origin/arrival blocks describe
# the prohibition honestly rather than a (non-existent) admission process.
id: country_mv
iso2: "MV"
name: { en: "Maldives", fr: "Maldives", es: "Maldivas", pt: "Maldivas" }
region: { en: "South Asia", fr: "Asie du Sud", es: "Asia del Sur", pt: "Ásia do Sul" }


regime: non_listed

hero:
  h1: { en: "Traveling to the Maldives with your dog", fr: "Voyager aux Maldives avec ton chien", es: "Viajar a las Maldivas con tu perro", pt: "Viajar para as Maldivas com seu cachorro" }
  intro:
    en: >-
      The Maldives does not allow you to bring a pet dog into the country. The official Maldives Customs
      list of prohibited and restricted items for import states plainly that, while other animals may be
      imported with a veterinary health certificate confirming they are free of infectious or contagious
      disease, "the import of dogs and dangerous animals are strictly prohibited." There is no published
      admission procedure, quarantine route or permit that would let a dog enter — the ban applies
      regardless of the dog's breed, country of origin, vaccination status or travel history, and it
      applies to residents and visitors alike. Maldives Customs does not publish any exception for
      service, guide or assistance dogs, so you should not assume one exists. This page exists to give
      you an honest, sourced answer: a dog cannot be imported into the Maldives, and you will need to
      make separate arrangements for your dog before you travel.
    fr: >-
      Les Maldives n'autorisent pas l'entrée d'un chien de compagnie sur leur territoire. La liste
      officielle des articles interdits et réglementés à l'importation des douanes maldiviennes indique
      clairement que, si d'autres animaux peuvent être importés avec un certificat sanitaire vétérinaire
      attestant l'absence de maladie infectieuse ou contagieuse, « l'importation de chiens et d'animaux
      dangereux est strictement interdite ». Aucune procédure d'admission, voie de quarantaine ou permis
      publié ne permet à un chien d'entrer — l'interdiction s'applique quels que soient la race, le pays
      d'origine, le statut vaccinal ou l'historique de voyage du chien, et vaut autant pour les résidents
      que pour les visiteurs. Les douanes maldiviennes ne publient aucune exception pour les chiens
      d'assistance, guides ou de service : ne présume donc pas qu'il en existe une. Cette page tu donne
      une réponse honnête et sourcée : un chien ne peut pas être importé aux Maldives, et tu devras
      prévoir une autre solution pour ton chien avant de voyager.
    es: >-
      Las Maldivas no te permiten introducir un perro de compañía en el país. La lista oficial de artículos
      prohibidos y restringidos a la importación de la Aduana de las Maldivas indica claramente que, si bien
      otros animales pueden importarse con un certificado sanitario veterinario que acredite que están
      libres de enfermedad infecciosa o contagiosa, «la importación de perros y animales peligrosos está
      estrictamente prohibida». No existe ningún procedimiento de admisión, vía de cuarentena ni permiso
      publicado que permita entrar a un perro — la prohibición se aplica sea cual sea la raza, el país de
      origen, el estatus de vacunación o el historial de viajes del perro, y se aplica por igual a
      residentes y visitantes. La Aduana de las Maldivas no publica ninguna excepción para perros de
      servicio, guía o de asistencia, así que no debes suponer que exista una. Esta página existe para
      darte una respuesta honesta y con fuentes: un perro no puede importarse a las Maldivas, y tendrás que
      buscar una solución aparte para tu perro antes de viajar.

    pt: "As Maldivas não permitem que você leve um cachorro de estimação para o país. A lista oficial da Maldives Customs de itens proibidos e restritos para importação declara claramente que, embora outros animais possam ser importados com um atestado de saúde veterinário que confirme que estão livres de doenças infecciosas ou contagiosas, \"a importação de cachorros e animais perigosos é estritamente proibida\". Não existe procedimento de admissão, rota de quarentena ou autorização publicados que permitam a entrada de um cachorro — a proibição se aplica independentemente da raça do cachorro, do país de origem, da situação vacinal ou do histórico de viagens, e vale tanto para residentes quanto para visitantes. A Maldives Customs não publica nenhuma exceção para cães de serviço, de guia ou de assistência, então você não deve presumir que exista uma. Esta página existe para dar a você uma resposta honesta e fundamentada em fontes: um cachorro não pode ser importado para as Maldivas, e você precisará fazer providências separadas para o seu cachorro antes de viajar."
difficulty:
  level: difficult
  label: { en: "Prohibited — dogs cannot be imported into the Maldives", fr: "Interdit — les chiens ne peuvent pas être importés aux Maldives", es: "Prohibido — los perros no pueden importarse a las Maldivas", pt: "Proibido — cachorros não podem ser importados para as Maldivas" }

