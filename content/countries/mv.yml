notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "The Maldives officially prohibits the import of dogs; only Maldives Customs and the relevant Maldivian authorities can confirm your specific situation."
    fr: "Les Maldives interdisent officiellement l'importation de chiens ; seules les douanes maldiviennes et les autorités maldiviennes compétentes peuvent confirmer ta situation particulière."
    es: "Las Maldivas prohíben oficialmente la importación de perros; solo la Aduana de las Maldivas y las autoridades maldivas competentes pueden confirmar tu situación concreta."
    pt: "As Maldivas proíbem oficialmente a importação de cachorros; só a Maldives Customs e as autoridades maldivas competentes podem confirmar a sua situação específica."
  - en: "Because dogs are banned, there is no procedure to prepare — do not rely on microchip, vaccination or quarantine steps to gain entry for a dog."
    fr: "Les chiens étant interdits, il n'y a aucune procédure à préparer — ne compte pas sur des étapes de puçage, vaccination ou quarantaine pour faire entrer un chien."
    es: "Como los perros están prohibidos, no hay ningún procedimiento que preparar — no cuentes con pasos de microchip, vacunación o cuarentena para lograr la entrada de un perro."
    pt: "Como os cachorros são banidos, não há procedimento a preparar — não conte com etapas de microchip, vacinação ou quarentena para conseguir a entrada de um cachorro."
  - en: "If you believe a narrow exception (for example an assistance dog) might apply, contact Maldives Customs directly and in advance for a written decision — do not assume it is allowed."
    fr: "Si tu pense qu'une exception étroite (par exemple un chien d'assistance) pourrait s'appliquer, contacte directement et à l'avance les douanes maldiviennes pour une décision écrite — ne présume pas que c'est autorisé."
    es: "Si crees que podría aplicarse una excepción concreta (por ejemplo un perro de asistencia), contacta directamente y con antelación con la Aduana de las Maldivas para obtener una decisión por escrito — no supongas que está permitido."
    pt: "Se você acredita que uma exceção pontual (por exemplo, um cão de assistência) possa se aplicar, entre em contato diretamente com a Maldives Customs, com antecedência, para obter uma decisão por escrito — não presuma que é permitido."
  - en: "Requirements and prohibitions depend on: the destination (Maldives), the country of departure, your dog's identification, vaccinations, travel history, itinerary and date — but for the Maldives the destination rule alone (a ban) is decisive for dogs."
    fr: "Les exigences et interdictions dépendent : de la destination (Maldives), du pays de départ, de l'identification du chien, des vaccinations, de l'historique de voyage, de l'itinéraire et de la date — mais pour les Maldives, la règle de destination à elle seule (une interdiction) est déterminante pour les chiens."
    es: "Los requisitos y prohibiciones dependen de: el destino (Maldivas), el país de salida, la identificación de tu perro, las vacunas, el historial de viajes, el itinerario y la fecha — pero para las Maldivas la regla de destino por sí sola (una prohibición) es decisiva para los perros."
    pt: "As exigências e proibições dependem: do destino (Maldivas), do país de partida, da identificação, das vacinas, do histórico de viagens, do itinerário e da data do seu cachorro — mas, no caso das Maldivas, a regra do destino sozinha (uma proibição) já é decisiva para cachorros."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "Why your dog cannot enter the Maldives", fr: "Pourquoi ton chien ne peut pas entrer aux Maldives", es: "Por qué tu perro no puede entrar en las Maldivas", pt: "Por que o seu cachorro não pode entrar nas Maldivas" }
  intro:
    en: "Entry requirements normally depend on three things, but for the Maldives the destination rule is an outright ban on dogs, so the other two factors cannot change the outcome."
    fr: "Les formalités d'entrée dépendent normalement de trois éléments, mais pour les Maldives la règle de destination est une interdiction pure et simple des chiens, de sorte que les deux autres facteurs ne peuvent pas changer le résultat."
    es: "Los requisitos de entrada dependen normalmente de tres factores, pero para las Maldivas la regla de destino es una prohibición total de perros, de modo que los otros dos factores no pueden cambiar el resultado."
    pt: "As exigências de entrada normalmente dependem de três fatores, mas, no caso das Maldivas, a regra do destino é uma proibição total para cachorros, de modo que os outros dois fatores não conseguem mudar o resultado."
  items:
    - stars: 5
      label: { en: "Country of destination — Maldives", fr: "Pays de destination — Maldives", es: "País de destino — Maldivas", pt: "País de destino — Maldivas" }
      text:
        en: "The Maldives is decisive: its official Customs prohibited-items list states that the import of dogs and dangerous animals is strictly prohibited. This ban overrides every other consideration, so no amount of documentation makes a dog admissible."
        fr: "Les Maldives sont déterminantes : leur liste douanière officielle des articles interdits indique que l'importation de chiens et d'animaux dangereux est strictement interdite. Cette interdiction prime sur toute autre considération : aucun document ne rend un chien admissible."
        es: "Las Maldivas son decisivas: su lista oficial de artículos prohibidos de la Aduana indica que la importación de perros y animales peligrosos está estrictamente prohibida. Esta prohibición prevalece sobre cualquier otra consideración, así que ninguna cantidad de documentación hace admisible a un perro."
        pt: "As Maldivas são decisivas: a lista oficial de itens proibidos da alfândega declara que a importação de cachorros e animais perigosos é estritamente proibida. Essa proibição se sobrepõe a qualquer outra consideração, de modo que nenhuma quantidade de documentação torna um cachorro admissível."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Normally the departure country's veterinary authority endorses a health certificate. Here it makes no difference: the certificate that lets other animals in does not lift the ban on dogs, and no exporting country is exempt from it."
        fr: "Normalement, l'autorité vétérinaire du pays de départ vise un certificat sanitaire. Ici, cela ne change rien : le certificat qui permet l'entrée d'autres animaux ne lève pas l'interdiction des chiens, et aucun pays d'export n'en est exempté."
        es: "Normalmente la autoridad veterinaria del país de salida refrenda un certificado sanitario. Aquí no cambia nada: el certificado que permite la entrada de otros animales no levanta la prohibición de perros, y ningún país exportador está exento de ella."
        pt: "Normalmente, a autoridade veterinária do país de partida endossa um atestado de saúde. Aqui isso não faz diferença: o certificado que permite a entrada de outros animais não suspende a proibição para cachorros, e nenhum país exportador está isento dela."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "Travel history, rabies-free status or vaccination record would matter for a country that admits dogs. For the Maldives they are irrelevant to the import question, because the ban applies to all dogs regardless of origin or history."
        fr: "L'historique de voyage, le statut indemne de rage ou le carnet de vaccination compteraient pour un pays qui admet les chiens. Pour les Maldives, ils sont sans incidence sur la question de l'importation, car l'interdiction s'applique à tous les chiens quels que soient l'origine ou l'historique."
        es: "El historial de viajes, el estatus libre de rabia o la cartilla de vacunación importarían para un país que admite perros. Para las Maldivas son irrelevantes para la cuestión de la importación, porque la prohibición se aplica a todos los perros sea cual sea su origen o historial."
        pt: "O histórico de viagens, a situação de país livre de raiva ou o registro de vacinação importariam para um país que admite cachorros. Para as Maldivas, eles são irrelevantes para a questão da importação, porque a proibição se aplica a todos os cachorros, independentemente da origem ou do histórico."
  note:
    en: "So read this guide as a clear 'no' for dogs: the destination rule alone is decisive, and you should plan alternative care for your dog rather than a Maldivian import procedure."
    fr: "Lis donc ce guide comme un « non » clair pour les chiens : la règle de destination à elle seule est déterminante, et tu dois prévoir une solution de garde pour ton chien plutôt qu'une procédure d'importation maldivienne."
    es: "Así que lee esta guía como un «no» claro para los perros: la regla de destino por sí sola es decisiva, y debes planificar un cuidado alternativo para tu perro en lugar de un procedimiento de importación maldivo."
    pt: "Portanto, leia este guia como um 'não' claro para cachorros: a regra do destino, sozinha, já é decisiva, e você deve planejar cuidados alternativos para o seu cachorro, em vez de um procedimento de importação maldivo."

