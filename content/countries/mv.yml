    ref: { en: "Maldives Customs — Prohibited & Restricted Items for import", fr: "Douanes maldiviennes — Articles interdits et réglementés à l'importation", es: "Aduana de las Maldivas — Artículos prohibidos y restringidos a la importación", pt: "Maldives Customs — itens proibidos e restritos para importação" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not applicable", fr: "Sans objet", es: "No aplica", pt: "Não aplicável" }
    when: { en: "No antibody test is published for dogs because there is no dog-import procedure.", fr: "Aucun titrage n'est publié pour les chiens, faute de procédure d'importation de chien.", es: "No se publica ninguna prueba de titulación para los perros porque no existe un procedimiento de importación de perros.", pt: "Nenhum teste sorológico é publicado para cachorros, porque não existe procedimento de importação de cachorros." }
    exceptions: { en: "—", fr: "—", es: "—", pt: "—" }
    ref: { en: "Maldives Customs — Prohibited & Restricted Items for import", fr: "Douanes maldiviennes — Articles interdits et réglementés à l'importation", es: "Aduana de las Maldivas — Artículos prohibidos y restringidos a la importación", pt: "Maldives Customs — itens proibidos e restritos para importação" }
  - item: { en: "Veterinary health certificate", fr: "Certificat sanitaire vétérinaire", es: "Certificado sanitario veterinario", pt: "Atestado de saúde veterinário" }
    required: { en: "Does not lift the dog ban", fr: "Ne lève pas l'interdiction des chiens", es: "No levanta la prohibición de perros", pt: "Não suspende a proibição para cachorros" }
    when: { en: "For animals that ARE permitted, Maldives Customs requires a health certificate from an authorised veterinarian confirming the animal is free from infectious or contagious diseases. This requirement applies to admissible animals only and does not create an entry route for dogs, which remain prohibited.", fr: "Pour les animaux QUI sont autorisés, les douanes maldiviennes exigent un certificat d'un vétérinaire agréé attestant que l'animal est exempt de maladies infectieuses ou contagieuses. Cette exigence ne vaut que pour les animaux admissibles et ne crée aucune voie d'entrée pour les chiens, qui restent interdits.", es: "Para los animales que SÍ están permitidos, la Aduana de las Maldivas exige un certificado de un veterinario autorizado que acredite que el animal está libre de enfermedades infecciosas o contagiosas. Este requisito se aplica únicamente a los animales admisibles y no crea ninguna vía de entrada para los perros, que siguen prohibidos.", pt: "Para os animais que SÃO permitidos, a Maldives Customs exige um atestado de saúde de um veterinário autorizado confirmando que o animal está livre de doenças infecciosas ou contagiosas. Essa exigência se aplica apenas a animais admissíveis e não cria uma via de entrada para cachorros, que permanecem proibidos." }
    exceptions: { en: "The dog prohibition is stated as a Note directly alongside this animal health-certificate requirement.", fr: "L'interdiction des chiens figure sous forme de Note directement à côté de cette exigence de certificat sanitaire animal.", es: "La prohibición de perros figura como una Nota directamente junto a este requisito de certificado sanitario animal.", pt: "A proibição para cachorros é declarada em uma nota diretamente ao lado dessa exigência de atestado de saúde animal." }
    ref: { en: "Maldives Customs — Prohibited & Restricted Items for import (animal health certificate + dog prohibition note)", fr: "Douanes maldiviennes — Articles interdits et réglementés à l'importation (certificat sanitaire animal + note d'interdiction des chiens)", es: "Aduana de las Maldivas — Artículos prohibidos y restringidos a la importación (certificado sanitario animal + nota de prohibición de perros)", pt: "Maldives Customs — itens proibidos e restritos para importação (atestado de saúde animal + nota de proibição para cachorros)" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "No route for dogs", fr: "Aucune voie pour les chiens", es: "Ninguna vía para los perros", pt: "Nenhuma rota para cachorros" }
    when: { en: "No quarantine facility or procedure is published that would allow a dog to be held and then admitted, because dogs cannot be imported.", fr: "Aucune installation ou procédure de quarantaine publiée ne permettrait de garder puis d'admettre un chien, celui-ci ne pouvant être importé.", es: "No se publica ninguna instalación ni procedimiento de cuarentena que permita retener y luego admitir a un perro, ya que los perros no pueden importarse.", pt: "Nenhuma instalação ou procedimento de quarentena é publicado que permitiria reter um cachorro e depois admiti-lo, porque cachorros não podem ser importados." }
    exceptions: { en: "—", fr: "—", es: "—", pt: "—" }
    ref: { en: "Maldives Customs — Prohibited & Restricted Items for import", fr: "Douanes maldiviennes — Articles interdits et réglementés à l'importation", es: "Aduana de las Maldivas — Artículos prohibidos y restringidos a la importación", pt: "Maldives Customs — itens proibidos e restritos para importação" }
  - item: { en: "Enforcement on arrival", fr: "Application à l'arrivée", es: "Aplicación a la llegada", pt: "Fiscalização na chegada" }
    required: { en: "Applies", fr: "S'applique", es: "Se aplica", pt: "Aplica-se" }
    when: { en: "Prohibited goods are defined by Maldives Customs as goods that are banned completely. A dog presented for import falls under this prohibition and would not be cleared into the country.", fr: "Les marchandises interdites sont définies par les douanes maldiviennes comme des biens totalement bannis. Un chien présenté à l'importation relève de cette interdiction et ne serait pas admis dans le pays.", es: "La Aduana de las Maldivas define las mercancías prohibidas como bienes totalmente vetados. Un perro presentado a la importación queda comprendido en esta prohibición y no sería despachado para entrar en el país.", pt: "Mercadorias proibidas são definidas pela Maldives Customs como mercadorias completamente banidas. Um cachorro apresentado para importação se enquadra nessa proibição e não seria liberado para entrar no país." }
    exceptions: { en: "The consequences of attempting to import a prohibited animal (penalties, return, disposal) are not detailed in the reviewed Customs pages — confirm with Maldives Customs. Do not attempt import.", fr: "Les conséquences d'une tentative d'importation d'un animal interdit (sanctions, renvoi, sort de l'animal) ne sont pas détaillées dans les pages douanières consultées — à confirmer auprès des douanes maldiviennes. Ne tentez pas l'importation.", es: "Las consecuencias de intentar importar un animal prohibido (sanciones, devolución, destino del animal) no se detallan en las páginas aduaneras consultadas — confírmalo con la Aduana de las Maldivas. No intentes la importación.", pt: "As consequências de tentar importar um animal proibido (penalidades, devolução, destinação) não são detalhadas nas páginas da alfândega analisadas — confirme com a Maldives Customs. Não tente a importação." }
    ref: { en: "Maldives Customs — Prohibited & Restricted Items (definition of prohibited goods)", fr: "Douanes maldiviennes — Articles interdits et réglementés (définition des marchandises interdites)", es: "Aduana de las Maldivas — Artículos prohibidos y restringidos (definición de mercancías prohibidas)", pt: "Maldives Customs — itens proibidos e restritos (definição de mercadorias proibidas)" }
  - item: { en: "Service / assistance / guide dog exception", fr: "Exception chien d'assistance / de service / guide", es: "Excepción para perro de servicio / de asistencia / guía", pt: "Exceção para cães de serviço / assistência / guia" }
    required: { en: "Unknown", fr: "Non communiqué", es: "No comunicado", pt: "Não comunicado" }
    when: { en: "Maldives Customs publishes no assistance-dog, guide-dog or service-dog exception to the prohibition. Its existence is Unknown and must not be assumed.", fr: "Les douanes maldiviennes ne publient aucune exception pour chien d'assistance, chien guide ou chien de service à l'interdiction. Son existence est non communiquée et ne doit pas être présumée.", es: "La Aduana de las Maldivas no publica ninguna excepción a la prohibición para perro de asistencia, perro guía o perro de servicio. Su existencia es No comunicado y no debe presumirse.", pt: "A Maldives Customs não publica nenhuma exceção à proibição para cães de assistência, de guia ou de serviço. Sua existência é desconhecida e não deve ser presumida." }
    exceptions: { en: "If you have a documented need, request a written ruling from Maldives Customs well before any travel.", fr: "Si tu as un besoin documenté, demande une décision écrite aux douanes maldiviennes bien avant tout voyage.", es: "Si tienes una necesidad documentada, solicita una decisión por escrito a la Aduana de las Maldivas mucho antes de cualquier viaje.", pt: "Se você tiver uma necessidade documentada, solicite uma decisão por escrito da Maldives Customs bem antes de qualquer viagem." }
    ref: { en: "Maldives Customs — Prohibited & Restricted Items for import (no exception published)", fr: "Douanes maldiviennes — Articles interdits et réglementés à l'importation (aucune exception publiée)", es: "Aduana de las Maldivas — Artículos prohibidos y restringidos a la importación (ninguna excepción publicada)", pt: "Maldives Customs — itens proibidos e restritos para importação (nenhuma exceção publicada)" }

origin:
  scheme: eu
  eu:
    title: { en: "Dog from an EU country", fr: "Chien venant d'un pays de l'UE", es: "Perro procedente de un país de la UE", pt: "Cachorro vindo de um país da UE" }
    body:
      en: "There is no simplified EU route into the Maldives. The Maldives is not part of the EU pet-travel system and does not recognise the EU pet passport for entry. A dog coming from an EU member state is still covered by the outright ban — it cannot be imported, whatever its microchip, EU passport, rabies vaccination or antibody-test status."
      fr: "Il n'existe aucun parcours européen simplifié vers les Maldives. Les Maldives ne font pas partie du système européen de voyage des animaux et ne reconnaissent pas le passeport européen pour l'entrée. Un chien venant d'un État membre de l'UE reste couvert par l'interdiction totale — il ne peut pas être importé, quels que soient sa puce, son passeport européen, sa vaccination antirabique ou son titrage."
      es: "No existe ninguna vía europea simplificada hacia las Maldivas. Las Maldivas no forman parte del sistema europeo de viaje de mascotas y no reconocen el pasaporte europeo para mascotas para la entrada. Un perro que llega de un Estado miembro de la UE sigue estando cubierto por la prohibición total — no puede importarse, sean cuales sean su microchip, su pasaporte europeo, su vacunación antirrábica o su prueba de titulación."
      pt: "Não existe uma via simplificada da UE para as Maldivas. As Maldivas não fazem parte do sistema de viagem de animais de estimação da UE e não reconhecem o passaporte de animal de estimação da UE para entrada. Um cachorro vindo de um estado membro da UE ainda assim é abrangido pela proibição total — ele não pode ser importado, qualquer que seja o seu microchip, passaporte da UE, vacinação antirrábica ou situação do teste sorológico."
    cls: no
  listed:
    title: { en: "Dog from a rabies-controlled / listed country", fr: "Chien venant d'un pays à rage contrôlée / listé", es: "Perro procedente de un país con rabia controlada / listado", pt: "Cachorro vindo de um país listado / com controle de raiva" }
    body:
      en: "Coming from a country with a strong rabies-control record does not help either. The Maldives does not operate a listed-country scheme for dogs, and the prohibition is not tied to rabies status. A well-documented dog from a low-risk country is still refused, because the ban is categorical."
      fr: "Venir d'un pays au bon bilan de lutte contre la rage n'aide pas davantage. Les Maldives n'appliquent pas de régime de pays listés pour les chiens, et l'interdiction n'est pas liée au statut rabique. Un chien bien documenté venant d'un pays à faible risque est tout de même refusé, l'interdiction étant catégorique."
      es: "Venir de un país con un buen historial de control de la rabia tampoco ayuda. Las Maldivas no aplican un régimen de países listados para perros, y la prohibición no está ligada al estatus de rabia. Un perro bien documentado procedente de un país de bajo riesgo también es rechazado, porque la prohibición es categórica."
      pt: "Vir de um país com um forte histórico de controle da raiva também não ajuda. As Maldivas não operam um esquema de países listados para cachorros, e a proibição não está ligada à situação da raiva. Um cachorro bem documentado, vindo de um país de baixo risco, ainda assim é recusado, porque a proibição é categórica."
    cls: no
  nonListed:
    title: { en: "Dog from any other country", fr: "Chien venant de tout autre pays", es: "Perro procedente de cualquier otro país", pt: "Cachorro vindo de qualquer outro país" }
    body:
      en: "The usual non-listed procedure (antibody test, waiting period, endorsed certificate, quarantine) does not exist for dogs entering the Maldives, because dogs are prohibited from the outset. No combination of tests, permits or waiting periods opens a legal path. Plan for your dog to remain outside the Maldives."
      fr: "La procédure habituelle des pays non listés (titrage, délai d'attente, certificat visé, quarantaine) n'existe pas pour les chiens à destination des Maldives, ceux-ci étant interdits d'emblée. Aucune combinaison de tests, de permis ou de délais n'ouvre de voie légale. Prévois que ton chien reste hors des Maldives."
      es: "El procedimiento habitual de país no listado (prueba de titulación, período de espera, certificado refrendado, cuarentena) no existe para los perros que entran en las Maldivas, ya que los perros están prohibidos de entrada. Ninguna combinación de pruebas, permisos o períodos de espera abre una vía legal. Prevé que tu perro permanezca fuera de las Maldivas."
      pt: "O procedimento usual para países não listados (teste sorológico, período de espera, certificado endossado, quarentena) não existe para cachorros que entram nas Maldivas, porque os cachorros são proibidos desde o início. Nenhuma combinação de exames, autorizações ou períodos de espera abre um caminho legal. Planeje que o seu cachorro permaneça fora das Maldivas."
    cls: no

arrival:
  intro:
    en: "Because dogs are prohibited, there is no arrival clearance process for a pet dog — the relevant fact is that a dog will not be admitted."
    fr: "Les chiens étant interdits, il n'existe aucun processus de dédouanement à l'arrivée pour un chien de compagnie — le point essentiel est qu'un chien ne sera pas admis."
    es: "Como los perros están prohibidos, no existe ningún proceso de despacho a la llegada para un perro de compañía — el hecho relevante es que un perro no será admitido."
    pt: "Como os cachorros são proibidos, não há processo de liberação na chegada para um cachorro de estimação — o fato relevante é que um cachorro não será admitido."
  points:
    - en: "Maldives Customs classifies dogs among goods that are 'banned completely', so a dog presented at the border falls under a full import prohibition."
      fr: "Les douanes maldiviennes classent les chiens parmi les biens « totalement bannis » ; un chien présenté à la frontière relève donc d'une interdiction totale d'importation."
      es: "La Aduana de las Maldivas clasifica a los perros entre los bienes «totalmente vetados», por lo que un perro presentado en la frontera queda comprendido en una prohibición total de importación."
      pt: "A Maldives Customs classifica os cachorros entre as mercadorias 'completamente banidas', portanto um cachorro apresentado na fronteira se enquadra em uma proibição total de importação."
    - en: "Other animals may be cleared only with a veterinary health certificate confirming freedom from infectious or contagious disease — but this route is explicitly not open to dogs."
      fr: "D'autres animaux ne peuvent être admis qu'avec un certificat sanitaire vétérinaire attestant l'absence de maladie infectieuse ou contagieuse — mais cette voie n'est explicitement pas ouverte aux chiens."
      es: "Otros animales solo pueden despacharse con un certificado sanitario veterinario que acredite la ausencia de enfermedad infecciosa o contagiosa — pero esta vía explícitamente no está abierta a los perros."
      pt: "Outros animais só podem ser liberados com um atestado de saúde veterinário confirmando que estão livres de doenças infecciosas ou contagiosas — mas essa via está explicitamente fechada para cachorros."
    - en: "The reviewed Customs pages do not detail the penalties or the handling of a dog brought in breach of the ban; do not attempt to import a dog, and contact Maldives Customs in advance if you have any doubt about your situation."
      fr: "Les pages douanières consultées ne détaillent pas les sanctions ni le sort d'un chien introduit en violation de l'interdiction ; ne tentez pas d'importer un chien et contacte à l'avance les douanes maldiviennes en cas de doute sur ta situation."
      es: "Las páginas aduaneras consultadas no detallan las sanciones ni el destino de un perro introducido en incumplimiento de la prohibición; no intentes importar un perro y contacta con antelación con la Aduana de las Maldivas si tienes cualquier duda sobre tu situación."
      pt: "As páginas da alfândega analisadas não detalham as penalidades ou o tratamento de um cachorro trazido em violação da proibição; não tente importar um cachorro, e entre em contato com a Maldives Customs com antecedência se tiver qualquer dúvida sobre a sua situação."
    - en: "Any claimed exception (for example an assistance dog) is Unknown and would need explicit, prior written confirmation from Maldives Customs — it cannot be relied upon at the border."
      fr: "Toute exception alléguée (par exemple un chien d'assistance) est non communiquée et nécessiterait une confirmation écrite explicite et préalable des douanes maldiviennes — on ne peut s'y fier à la frontière."
      es: "Cualquier excepción alegada (por ejemplo un perro de asistencia) es No comunicado y necesitaría una confirmación por escrito explícita y previa de la Aduana de las Maldivas — no se puede confiar en ella en la frontera."
      pt: "Qualquer exceção alegada (por exemplo, um cão de assistência) é desconhecida e precisaria de confirmação explícita e prévia por escrito da Maldives Customs — não se pode contar com ela na fronteira."

travellerExperience: null

restrictedDogs:
  intro:
    en: "The Maldives does not operate a breed-by-breed import scheme, because no dog of any breed may be imported. The prohibition is on dogs as a whole, not on specific breeds, so there is no 'category 1 / category 2' dangerous-dog classification for import purposes."
    fr: "Les Maldives n'appliquent pas de régime d'importation race par race, puisqu'aucun chien, quelle que soit sa race, ne peut être importé. L'interdiction porte sur les chiens dans leur ensemble, et non sur des races précises : il n'existe donc pas de classification « catégorie 1 / catégorie 2 » de chiens dangereux à des fins d'importation."
    es: "Las Maldivas no aplican un régimen de importación raza por raza, ya que no puede importarse ningún perro de ninguna raza. La prohibición recae sobre los perros en su conjunto, no sobre razas concretas, por lo que no existe una clasificación de perro peligroso «categoría 1 / categoría 2» a efectos de importación."
    pt: "As Maldivas não operam um esquema de importação raça por raça, porque nenhum cachorro de qualquer raça pode ser importado. A proibição recai sobre os cachorros como um todo, não sobre raças específicas, portanto não há classificação de cães perigosos em 'categoria 1 / categoria 2' para fins de importação."
  cat1:
    en: "All breeds are affected equally. Maldives Customs bans the import of dogs and 'dangerous animals' together; every breed of dog, from the smallest companion dog to large guarding breeds, is covered by the same ban."
    fr: "Toutes les races sont concernées de la même manière. Les douanes maldiviennes interdisent ensemble l'importation des chiens et des « animaux dangereux » ; toutes les races de chiens, du plus petit chien de compagnie aux grandes races de garde, relèvent de la même interdiction."
    es: "Todas las razas se ven afectadas por igual. La Aduana de las Maldivas prohíbe conjuntamente la importación de perros y «animales peligrosos»; todas las razas de perro, desde el perro de compañía más pequeño hasta las grandes razas de guarda, quedan cubiertas por la misma prohibición."
    pt: "Todas as raças são afetadas igualmente. A Maldives Customs bane a importação de cachorros e de 'animais perigosos' juntos; toda raça de cachorro, do menor cão de companhia às grandes raças de guarda, é abrangida pela mesma proibição."
  cat2:
    en: "No breed is exempt. There is no 'accepted breeds' list, because the prohibition is categorical rather than breed-specific. Airline breed policies (for example on snub-nosed breeds) are a separate matter and do not override or soften the Maldivian import ban."
    fr: "Aucune race n'est exemptée. Il n'existe pas de liste de « races acceptées », l'interdiction étant catégorique et non liée à la race. Les politiques de race des compagnies aériennes (par exemple sur les races au nez court) sont une question distincte et ne modifient ni n'atténuent l'interdiction d'importation maldivienne."
    es: "Ninguna raza está exenta. No existe una lista de «razas aceptadas», ya que la prohibición es categórica y no específica por raza. Las políticas de razas de las aerolíneas (por ejemplo sobre las razas braquicéfalas) son una cuestión aparte y no anulan ni suavizan la prohibición de importación maldiva."
    pt: "Nenhuma raça está isenta. Não há uma lista de 'raças aceitas', porque a proibição é categórica, e não específica por raça. As políticas de raça das companhias aéreas (por exemplo, para raças de focinho achatado) são uma questão separada e não anulam nem suavizam a proibição de importação maldiva."
  note:
    en: "In short: this is a country-wide ban on importing dogs, not a restricted-breed law. Do not read the ban as applying only to certain breeds."
    fr: "En bref : il s'agit d'une interdiction nationale d'importer des chiens, et non d'une loi sur les races réglementées. Ne lis pas l'interdiction comme ne visant que certaines races."
    es: "En resumen: se trata de una prohibición nacional de importar perros, no de una ley de razas restringidas. No interpretes la prohibición como aplicable solo a ciertas razas."
    pt: "Em resumo: esta é uma proibição em todo o país sobre a importação de cachorros, e não uma lei de raças restritas. Não interprete a proibição como aplicável apenas a certas raças."

checklist:
  - en: "Understand that a pet dog cannot be legally imported into the Maldives — the import of dogs is strictly prohibited"
    fr: "Comprenez qu'un chien de compagnie ne peut pas être importé légalement aux Maldives — l'importation de chiens est strictement interdite"
    es: "Ten claro que un perro de compañía no puede importarse legalmente a las Maldivas — la importación de perros está estrictamente prohibida"
    pt: "Entenda que um cachorro de estimação não pode ser legalmente importado para as Maldivas — a importação de cachorros é estritamente proibida"
  - en: "Do not book travel assuming microchip, rabies vaccination or quarantine will make your dog admissible — they will not"
    fr: "Ne réserve pas de voyage en supposant que puce, vaccination antirabique ou quarantaine rendront ton chien admissible — ce ne sera pas le cas"
    es: "No reserves el viaje suponiendo que el microchip, la vacunación antirrábica o la cuarentena harán admisible a tu perro — no será así"
    pt: "Não reserve uma viagem presumindo que microchip, vacinação antirrábica ou quarentena tornarão o seu cachorro admissível — eles não tornarão"
  - en: "Arrange alternative care for your dog (trusted carer, boarding, or leaving the dog in your home country) before you travel"
    fr: "Organise une solution de garde pour ton chien (personne de confiance, pension, ou maintien dans ton pays d'origine) avant de partir"
    es: "Organiza un cuidado alternativo para tu perro (persona de confianza, residencia, o dejar al perro en tu país de origen) antes de viajar"
    pt: "Providencie cuidados alternativos para o seu cachorro (cuidador de confiança, hospedagem, ou deixar o cachorro no seu país de origem) antes de viajar"
  - en: "If you think a narrow exception (e.g. an assistance dog) could apply, request a written ruling from Maldives Customs well in advance — do not assume approval"
    fr: "Si tu pense qu'une exception étroite (p. ex. chien d'assistance) pourrait s'appliquer, demande une décision écrite aux douanes maldiviennes bien à l'avance — ne présume pas l'accord"
    es: "Si crees que podría aplicarse una excepción concreta (p. ej. un perro de asistencia), solicita una decisión por escrito a la Aduana de las Maldivas con mucha antelación — no des por hecho la aprobación"
    pt: "Se você acha que uma exceção pontual (por exemplo, um cão de assistência) pode se aplicar, solicite uma decisão por escrito da Maldives Customs com bastante antecedência — não presuma aprovação"
  - en: "Verify the current prohibited-items rules directly on the Maldives Customs website before you rely on them"
    fr: "Vérifie les règles actuelles sur les articles interdits directement sur le site des douanes maldiviennes avant de toi y fier"
    es: "Verifica las normas actuales sobre artículos prohibidos directamente en el sitio web de la Aduana de las Maldivas antes de confiar en ellas"
    pt: "Verifique as regras atuais de itens proibidos diretamente no site da Maldives Customs antes de contar com elas"
  - en: "Never attempt to bring a dog in undeclared — dogs fall under goods that are 'banned completely'"
    fr: "Ne tentez jamais d'introduire un chien sans le déclarer — les chiens relèvent des biens « totalement bannis »"
    es: "Nunca intentes introducir un perro sin declararlo — los perros están comprendidos entre los bienes «totalmente vetados»"
    pt: "Nunca tente trazer um cachorro sem declarar — cachorros se enquadram nas mercadorias 'completamente banidas'"

