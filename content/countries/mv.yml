    en: "Not applicable — there is no legal path to import a dog into the Maldives, so no preparation time will make entry possible. Plan instead for your dog to stay elsewhere."
    fr: "Sans objet — il n'existe aucune voie légale pour importer un chien aux Maldives ; aucun délai de préparation ne rendra l'entrée possible. Prévois plutôt une solution de garde ailleurs pour ton chien."
    es: "No aplica — no existe ninguna vía legal para importar un perro a las Maldivas, por lo que ningún tiempo de preparación hará posible la entrada. En su lugar, prevé que tu perro se quede en otro lugar."
    pt: "Não aplicável — não existe um caminho legal para importar um cachorro para as Maldivas, portanto nenhum tempo de preparação tornará a entrada possível. Planeje, em vez disso, que o seu cachorro fique em outro lugar."
  listed:
    en: "Not applicable — the prohibition applies to dogs from every country, whatever their vaccination or travel history."
    fr: "Sans objet — l'interdiction s'applique aux chiens de tous les pays, quel que soit leur statut vaccinal ou leur historique de voyage."
    es: "No aplica — la prohibición se aplica a los perros de todos los países, sea cual sea su estatus de vacunación o su historial de viajes."
    pt: "Não aplicável — a proibição se aplica a cachorros de qualquer país, qualquer que seja o histórico de vacinação ou de viagens."
  nonListed:
    en: "Not applicable — no permit, quarantine or waiting period is published because dogs are banned outright."
    fr: "Sans objet — aucun permis, quarantaine ni délai d'attente n'est publié, l'importation de chiens étant purement et simplement interdite."
    es: "No aplica — no se publica ningún permiso, cuarentena ni período de espera porque los perros están totalmente prohibidos."
    pt: "Não aplicável — nenhuma autorização, quarentena ou período de espera é publicado, porque os cachorros são banidos por completo."

