notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro."
    pt: "Só um médico-veterinário pode confirmar o procedimento exato para o seu cachorro."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Cuba (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — Cuba (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Cuba (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — Cuba (o seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Cuba", fr: "Pays de destination — Cuba", es: "País de destino — Cuba", pt: "País de destino — Cuba" }
      text:
        en: "Cuba runs a certificate-based scheme through CENASA: a veterinary health certificate with rabies-vaccination details is always required, the dog is inspected at the border, and a release certificate is issued before entry. No EU pet passport is used."
        fr: "Cuba applique un dispositif fondé sur un certificat via le CENASA : un certificat sanitaire vétérinaire mentionnant la vaccination antirabique est toujours exigé, le chien est inspecté à la frontière et un certificat de libération est délivré avant l'entrée. Aucun passeport européen n'est utilisé."
        es: "Cuba aplica un sistema basado en un certificado a través del CENASA: siempre se exige un certificado sanitario veterinario con los datos de la vacunación antirrábica, se inspecciona al perro en la frontera y se expide un certificado de liberación antes de la entrada. No se utiliza el pasaporte europeo para mascotas."
        pt: "Cuba aplica um sistema baseado em certificado, conduzido pelo CENASA: um atestado de saúde veterinário com os dados da vacinação antirrábica é sempre obrigatório, o cachorro é inspecionado na fronteira e um certificado de liberação é emitido antes da entrada. O passaporte europeu para animais de companhia não é utilizado."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The certificate is issued by the official veterinary authority of the departure country and must confirm the dog is clinically healthy. The Cuban border vet takes the departure country's health status into account when exempting the animal from quarantine."
        fr: "Le certificat est établi par l'autorité vétérinaire officielle du pays de départ et doit confirmer que le chien est cliniquement sain. Le vétérinaire cubain de frontière tient compte du statut sanitaire du pays de départ pour exempter l'animal de quarantaine."
        es: "El certificado lo expide la autoridad veterinaria oficial del país de salida y debe confirmar que el perro está clínicamente sano. El veterinario cubano de frontera tiene en cuenta el estado sanitario del país de salida a la hora de eximir al animal de la cuarentena."
        pt: "O certificado é emitido pela autoridade veterinária oficial do país de partida e deve confirmar que o cachorro está clinicamente saudável. O veterinário de fronteira cubano leva em conta a situação sanitária do país de partida ao dispensar o animal da quarentena."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "Your dog's real age and rabies history determine whether its vaccination is valid for the trip, and shape your return: staying over 30 days means processing a Cuban export certificate before you leave again."
        fr: "L'âge réel et l'historique antirabique du chien déterminent si sa vaccination est valide pour le voyage, et conditionnent le retour : au-delà de 30 jours, il faut traiter un certificat d'exportation cubain avant de repartir."
        es: "La edad real y el historial de rabia de tu perro determinan si su vacunación es válida para el viaje y condicionan tu regreso: quedarte más de 30 días implica tramitar un certificado de exportación cubano antes de salir de nuevo."
        pt: "A idade real do seu cachorro e o histórico de vacinação antirrábica determinam se a vacinação é válida para a viagem e moldam o seu retorno: ficar mais de 30 dias significa ter de tramitar um certificado cubano de exportação antes de sair de novo."
  note:
    en: "So read the requirements below as Cuba's framework, then confirm your dog's exact origin, age and history with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre cubain, puis confirme l'origine, l'âge et l'historique exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Cuba y luego confirma el origen, la edad y el historial exactos de tu perro con tu veterinario."
    pt: "Portanto, leia os requisitos abaixo como o marco regulatório de Cuba e depois confirme com o seu veterinário a origem, a idade e o histórico exatos do seu cachorro."

requirements:
  - item: { en: "Identification (tag, tattoo or microchip)", fr: "Identification (chapa, tatouage ou puce)", es: "Identificación (chapa, tatuaje o microchip)", pt: "Identificação (placa, tatuagem ou microchip)" }
    required: { en: "Required on the certificate; no microchip mandated", fr: "Requise sur le certificat ; puce non imposée", es: "Obligatoria en el certificado; no se exige microchip", pt: "Obrigatória no certificado; microchip não exigido" }
    when: { en: "The health certificate must carry the animal's identification. Cuba's official requirements accept a tag (chapilla), tattoo or microchip; an ISO microchip is not specifically mandated for entry into Cuba.", fr: "Le certificat sanitaire doit porter l'identification de l'animal. Les exigences officielles cubaines acceptent une chapa (chapilla), un tatouage ou une puce ; une puce ISO n'est pas spécifiquement imposée pour l'entrée à Cuba.", es: "El certificado sanitario debe llevar la identificación del animal. Los requisitos oficiales cubanos aceptan una chapa (chapilla), un tatuaje o un microchip; no se exige específicamente un microchip ISO para la entrada a Cuba.", pt: "O atestado de saúde deve conter a identificação do animal. Os requisitos oficiais cubanos aceitam uma placa (chapilla), uma tatuagem ou um microchip; um microchip ISO não é especificamente exigido para a entrada em Cuba." }
    exceptions: { en: "A microchip is still recommended and is required by most airlines and for the return trip to the EU or the US.", fr: "Une puce reste recommandée et est exigée par la plupart des compagnies et pour le retour vers l'UE ou les États-Unis.", es: "Un microchip sigue siendo recomendable y lo exigen la mayoría de las aerolíneas y para el viaje de regreso a la UE o a EE. UU.", pt: "Mesmo assim, o microchip é recomendado e é exigido pela maioria das companhias aéreas e para a viagem de volta à UE ou aos EUA." }
    ref: { en: "MINAG/CENASA — import and export of pets; Argentina SENASA — Cuba destination requirements", fr: "MINAG/CENASA — importation et exportation d'animaux ; SENASA Argentine — exigences destination Cuba", es: "MINAG/CENASA — importación y exportación de mascotas; SENASA Argentina — requisitos de destino Cuba", pt: "MINAG/CENASA — importação e exportação de animais de companhia; SENASA Argentina — requisitos de destino Cuba" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "The certificate must record the rabies vaccination: vaccine type/brand, dose, date applied, validity and lot number. The vaccination must be current for the trip.", fr: "Le certificat doit consigner la vaccination antirabique : type/marque du vaccin, dose, date d'administration, validité et numéro de lot. La vaccination doit être en cours de validité pour le voyage.", es: "El certificado debe registrar la vacunación antirrábica: tipo/marca de la vacuna, dosis, fecha de aplicación, vigencia y número de lote. La vacunación debe estar vigente para el viaje.", pt: "O certificado deve registrar a vacinação antirrábica: tipo/marca da vacina, dose, data de aplicação, validade e número do lote. A vacinação precisa estar em dia na data da viagem." }
    exceptions: { en: "Animals under 3 months of age cannot yet be vaccinated against rabies; where they are permitted to travel, the age is recorded on the certificate.", fr: "Les animaux de moins de 3 mois ne peuvent pas encore être vaccinés contre la rage ; lorsqu'ils sont autorisés à voyager, l'âge est consigné sur le certificat.", es: "Los animales menores de 3 meses aún no pueden vacunarse contra la rabia; cuando se les permite viajar, la edad se registra en el certificado.", pt: "Animais com menos de 3 meses de idade ainda não podem ser vacinados contra a raiva; quando têm permissão para viajar, a idade é registrada no certificado." }
    ref: { en: "Granma/CENASA — import-export procedure for pets (2022); MINAG — export requirements update", fr: "Granma/CENASA — procédure d'importation-exportation des animaux (2022) ; MINAG — mise à jour des exigences d'exportation", es: "Granma/CENASA — procedimiento de importación-exportación de mascotas (2022); MINAG — actualización de los requisitos de exportación", pt: "Granma/CENASA — procedimento de importação-exportação de animais de companhia (2022); MINAG — atualização dos requisitos de exportação" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Effectively ~4 months for a first-time-vaccinated dog", fr: "En pratique ~4 mois pour un chien primo-vacciné", es: "En la práctica ~4 meses para un perro con primovacunación", pt: "Na prática, ~4 meses para um cachorro primovacinado" }
    when: { en: "The first rabies dose is given from 3 months (90 days) of age and immunity builds after ~30 days, so a first-time-vaccinated dog is about 4 months old at travel.", fr: "La première dose antirabique s'administre à partir de 3 mois (90 jours) et l'immunité s'installe après ~30 jours ; un chien primo-vacciné a donc environ 4 mois au voyage.", es: "La primera dosis antirrábica se administra a partir de los 3 meses (90 días) de edad y la inmunidad se establece tras ~30 días, por lo que un perro con primovacunación tiene unos 4 meses en el momento del viaje.", pt: "A primeira dose antirrábica é aplicada a partir dos 3 meses (90 dias) de idade e a imunidade se estabelece depois de ~30 dias, então um cachorro primovacinado tem cerca de 4 meses na viagem." }
    exceptions: { en: "Some official veterinary authorities allow puppies under 3 months to travel without rabies vaccination; the certificate must state the age. Airline age rules may be stricter.", fr: "Certaines autorités vétérinaires officielles autorisent les chiots de moins de 3 mois à voyager sans vaccination antirabique ; le certificat doit indiquer l'âge. Les règles d'âge des compagnies peuvent être plus strictes.", es: "Algunas autoridades veterinarias oficiales permiten que los cachorros menores de 3 meses viajen sin vacunación antirrábica; el certificado debe indicar la edad. Las normas de edad de las aerolíneas pueden ser más estrictas.", pt: "Algumas autoridades veterinárias oficiais permitem que filhotes com menos de 3 meses viajem sem vacinação antirrábica; o certificado deve indicar a idade. As regras de idade das companhias aéreas podem ser mais rígidas." }
    ref: { en: "MINAG/CENASA — export requirements update; Argentina SENASA — Cuba destination requirements", fr: "MINAG/CENASA — mise à jour des exigences d'exportation ; SENASA Argentine — exigences destination Cuba", es: "MINAG/CENASA — actualización de los requisitos de exportación; SENASA Argentina — requisitos de destino Cuba", pt: "MINAG/CENASA — atualização dos requisitos de exportação; SENASA Argentina — requisitos de destino Cuba" }
  - item: { en: "General health & parasite condition", fr: "État de santé & parasites", es: "Estado de salud y parásitos", pt: "Estado geral de saúde e parasitas" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "The certificate must state the animal's general health and any preventive vaccinations and deworming. At inspection the dog must be healthy, with no fresh or healing wounds and free of external parasites.", fr: "Le certificat doit indiquer l'état de santé général de l'animal ainsi que les vaccinations préventives et la vermifugation. À l'inspection, le chien doit être sain, sans plaies fraîches ou en cicatrisation et exempt de parasites externes.", es: "El certificado debe indicar el estado de salud general del animal y cualquier vacunación preventiva y desparasitación. En la inspección, el perro debe estar sano, sin heridas frescas o en cicatrización y libre de parásitos externos.", pt: "O certificado deve declarar o estado geral de saúde do animal e as vacinas preventivas e a vermifugação. Na inspeção, o cachorro deve estar saudável, sem feridas recentes ou em cicatrização e livre de parasitas externos." }
    exceptions: { en: "Cuba does not publish a specific tapeworm (Echinococcus) treatment window for entry.", fr: "Cuba ne publie pas de délai spécifique de traitement contre l'échinococcose pour l'entrée.", es: "Cuba no publica un plazo específico de tratamiento contra la tenia (Echinococcus) para la entrada.", pt: "Cuba não publica um prazo específico de tratamento contra tênias (Echinococcus) para a entrada." }
    ref: { en: "MINAG/CENASA — export requirements update; Granma/CENASA — procedure (2022)", fr: "MINAG/CENASA — mise à jour des exigences d'exportation ; Granma/CENASA — procédure (2022)", es: "MINAG/CENASA — actualización de los requisitos de exportación; Granma/CENASA — procedimiento (2022)", pt: "MINAG/CENASA — atualização dos requisitos de exportação; Granma/CENASA — procedimento (2022)" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not required", fr: "Non requis", es: "No obligatoria", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Cuba's published requirements to import a dog do not include a rabies antibody test. (Cuba requires an antibody test only for its own residents exporting dogs to the EU or the US.)", fr: "Les exigences publiées par Cuba pour importer un chien ne comprennent pas de titrage antirabique. (Cuba n'exige un titrage que pour ses propres résidents exportant un chien vers l'UE ou les États-Unis.)", es: "Los requisitos publicados por Cuba para importar un perro no incluyen una prueba de titulación de rabia. (Cuba solo exige una prueba de titulación a sus propios residentes que exportan perros a la UE o a EE. UU.)", pt: "Os requisitos publicados por Cuba para importar um cachorro não incluem teste sorológico antirrábico. (Cuba exige o teste sorológico apenas dos seus próprios residentes que exportam cachorros para a UE ou os EUA.)" }
    ref: { en: "MINAG/CENASA — import and export of pets; Argentina SENASA — Cuba destination requirements", fr: "MINAG/CENASA — importation et exportation d'animaux ; SENASA Argentine — exigences destination Cuba", es: "MINAG/CENASA — importación y exportación de mascotas; SENASA Argentina — requisitos de destino Cuba", pt: "MINAG/CENASA — importação e exportação de animais de companhia; SENASA Argentina — requisitos de destino Cuba" }
  - item: { en: "International veterinary health certificate", fr: "Certificat sanitaire vétérinaire international", es: "Certificado sanitario veterinario internacional", pt: "Atestado de saúde veterinário internacional" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Issued by the official veterinary authority of the departure country in the name of the person travelling with the animal. It records species, breed, name, age, sex, colour, identification, general health, deworming/vaccinations and the rabies-vaccination data.", fr: "Établi par l'autorité vétérinaire officielle du pays de départ au nom de la personne voyageant avec l'animal. Il consigne espèce, race, nom, âge, sexe, couleur, identification, état de santé général, vermifugation/vaccinations et les données de la vaccination antirabique.", es: "Expedido por la autoridad veterinaria oficial del país de salida a nombre de la persona que viaja con el animal. Registra especie, raza, nombre, edad, sexo, color, identificación, estado de salud general, desparasitación/vacunaciones y los datos de la vacunación antirrábica.", pt: "Emitido pela autoridade veterinária oficial do país de partida em nome da pessoa que viaja com o animal. Registra espécie, raça, nome, idade, sexo, cor, identificação, estado geral de saúde, vermifugação/vacinas e os dados da vacinação antirrábica." }
    exceptions: { en: "Reference authorities give the certificate about 10 days' validity for entry checks; some Cuban consulates abroad have required consular legalisation — confirm with the Cuban consulate in your country before travel.", fr: "Les autorités de référence accordent au certificat une validité d'environ 10 jours pour les contrôles à l'entrée ; certains consulats cubains à l'étranger ont exigé une légalisation consulaire — vérifie auprès du consulat cubain de ton pays avant le voyage.", es: "Las autoridades de referencia otorgan al certificado unos 10 días de valide para los controles de entrada; algunos consulados cubanos en el extranjero han exigido la legalización consular — confírmalo con el consulado cubano de tu país antes de viajar.", pt: "As autoridades de referência atribuem ao certificado uma validade de cerca de 10 dias para o controle de entrada; alguns consulados cubanos no exterior já exigiram legalização consular — confirme com o consulado de Cuba no seu país antes de viajar." }
    ref: { en: "Granma/CENASA — procedure (2022); Argentina SENASA — Cuba destination requirements", fr: "Granma/CENASA — procédure (2022) ; SENASA Argentine — exigences destination Cuba", es: "Granma/CENASA — procedimiento (2022); SENASA Argentina — requisitos de destino Cuba", pt: "Granma/CENASA — procedimento (2022); SENASA Argentina — requisitos de destino Cuba" }
  - item: { en: "Import authorization / permit", fr: "Autorisation / permis d'importation", es: "Autorización / permiso de importación", pt: "Autorização / permissão de importação" }
    required: { en: "No prior permit", fr: "Pas de permis préalable", es: "Sin permiso previo", pt: "Sem autorização prévia" }
    when: { en: "No advance import permit is described for a personal pet. The Border Veterinary Service authorises entry at the port or airport after reviewing the certificate and inspecting the animal.", fr: "Aucun permis d'importation préalable n'est décrit pour un animal de compagnie. Le Service vétérinaire de frontière autorise l'entrée au port ou à l'aéroport après examen du certificat et inspection de l'animal.", es: "No se describe ningún permiso de importación previo para una mascota personal. El Servicio Veterinario de Frontera autoriza la entrada en el puerto o el aeropuerto tras revisar el certificado e inspeccionar al animal.", pt: "Nenhuma autorização de importação prévia é descrita para um animal de companhia particular. O Serviço Veterinário de Fronteira autoriza a entrada no porto ou no aeroporto depois de analisar o certificado e inspecionar o animal." }
    exceptions: { en: "Only dogs and cats are recognised as pets for this procedure.", fr: "Seuls les chiens et les chats sont reconnus comme animaux de compagnie pour cette procédure.", es: "Solo los perros y los gatos se reconocen como mascotas para este procedimiento.", pt: "Apenas cachorros e gatos são reconhecidos como animais de companhia nesse procedimento." }
    ref: { en: "MINAG/CENASA — import and export of pets; Granma/CENASA — procedure (2022)", fr: "MINAG/CENASA — importation et exportation d'animaux ; Granma/CENASA — procédure (2022)", es: "MINAG/CENASA — importación y exportación de mascotas; Granma/CENASA — procedimiento (2022)", pt: "MINAG/CENASA — importação e exportação de animais de companhia; Granma/CENASA — procedimento (2022)" }
  - item: { en: "Arrival veterinary inspection & release certificate", fr: "Inspection vétérinaire à l'arrivée & certificat de libération", es: "Inspección veterinaria a la llegada y certificado de liberación", pt: "Inspeção veterinária na chegada e certificado de liberação" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Border Veterinary Service vets at the international airport physically inspect the dog and check the certificate. If the health documents and physical exam show a healthy animal, a release certificate (Certificado de Liberación) is issued authorising entry.", fr: "Les vétérinaires du Service vétérinaire de frontière à l'aéroport international inspectent physiquement le chien et vérifient le certificat. Si les documents sanitaires et l'examen physique montrent un animal sain, un certificat de libération (Certificado de Liberación) est délivré autorisant l'entrée.", es: "Los veterinarios del Servicio Veterinario de Frontera en el aeropuerto internacional inspeccionan físicamente al perro y revisan el certificado. Si los documentos sanitarios y el examen físico muestran un animal sano, se expide un certificado de liberación (Certificado de Liberación) que autoriza la entrada.", pt: "Os veterinários do Serviço Veterinário de Fronteira no aeroporto internacional inspecionam fisicamente o cachorro e conferem o certificado. Se os documentos sanitários e o exame físico mostrarem um animal saudável, é emitido um certificado de liberação (Certificado de Liberación) autorizando a entrada." }
    exceptions: { en: "Whether Cuba charges a veterinary inspection fee on arrival, and its amount, is not published in a stable official source — Unknown / confirm at the airport.", fr: "L'existence et le montant d'une éventuelle redevance d'inspection vétérinaire à l'arrivée à Cuba ne sont pas publiés dans une source officielle stable — Non communiqué / à confirmer à l'aéroport.", es: "Si Cuba cobra una tasa de inspección veterinaria a la llegada, y su importe, no se publica en una fuente oficial estable — Desconocido / confírmalo en el aeropuerto.", pt: "Se Cuba cobra uma taxa de inspeção veterinária na chegada, e de quanto ela seria, não está publicado em fonte oficial estável — Desconhecido / confirme no aeroporto." }
    ref: { en: "MINAG/CENASA — import and export of pets; Granma/CENASA — procedure (2022)", fr: "MINAG/CENASA — importation et exportation d'animaux ; Granma/CENASA — procédure (2022)", es: "MINAG/CENASA — importación y exportación de mascotas; Granma/CENASA — procedimiento (2022)", pt: "MINAG/CENASA — importação e exportação de animais de companhia; Granma/CENASA — procedimento (2022)" }
  - item: { en: "Follow-up home visit", fr: "Visite à domicile de suivi", es: "Visita domiciliaria de seguimiento", pt: "Visita domiciliar de acompanhamento" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "The residence or lodging address is recorded on arrival. Municipal animal-health specialists carry out a home visit within 15 days to verify the dog's health matches the certificate, as routine epidemiological surveillance.", fr: "L'adresse de résidence ou d'hébergement est consignée à l'arrivée. Des spécialistes municipaux de la santé animale effectuent une visite à domicile dans les 15 jours pour vérifier que l'état du chien correspond au certificat, au titre de la surveillance épidémiologique de routine.", es: "La dirección de residencia o alojamiento se registra a la llegada. Especialistas municipales de sanidad animal realizan una visita domiciliaria dentro de los 15 días para verificar que el estado del perro coincide con el certificado, como vigilancia epidemiológica rutinaria.", pt: "O endereço de residência ou hospedagem é registrado na chegada. Especialistas municipais de sanidade animal fazem uma visita domiciliar em até 15 dias para verificar se a saúde do cachorro corresponde ao certificado, como vigilância epidemiológica de rotina." }
    exceptions: { en: "—", fr: "—", es: "—", pt: "—" }
    ref: { en: "Granma/CENASA — procedure (2022)", fr: "Granma/CENASA — procédure (2022)", es: "Granma/CENASA — procedimiento (2022)", pt: "Granma/CENASA — procedimento (2022)" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not routine", fr: "Non systématique", es: "No rutinaria", pt: "Não sistemática" }
    when: { en: "The border vet may exempt a healthy, well-documented dog from quarantine, taking into account the certificate, the animal's condition and the country of origin.", fr: "Le vétérinaire de frontière peut exempter de quarantaine un chien sain et bien documenté, compte tenu du certificat, de l'état de l'animal et du pays d'origine.", es: "El veterinario de frontera puede eximir de la cuarentena a un perro sano y bien documentado, teniendo en cuenta el certificado, el estado del animal y el país de origen.", pt: "O veterinário de fronteira pode dispensar da quarentena um cachorro saudável e bem documentado, levando em conta o certificado, o estado do animal e o país de origem." }
    exceptions: { en: "There is no published fixed quarantine period for a compliant pet; a non-compliant or unhealthy animal may be held.", fr: "Aucune durée de quarantaine fixe n'est publiée pour un animal conforme ; un animal non conforme ou malade peut être retenu.", es: "No se publica un periodo de cuarentena fijo para una mascota que cumple los requisitos; un animal no conforme o enfermo puede quedar retenido.", pt: "Não há período fixo de quarentena publicado para um animal de companhia em conformidade; um animal fora das regras ou doente pode ficar retido." }
    ref: { en: "MINAG/CENASA — import and export of pets", fr: "MINAG/CENASA — importation et exportation d'animaux", es: "MINAG/CENASA — importación y exportación de mascotas", pt: "MINAG/CENASA — importação e exportação de animais de companhia" }

origin:
  scheme: own
  eu:
    from: any
    title: { en: "Standard — a pet travelling with its owner", fr: "Standard — un animal voyageant avec son propriétaire", es: "Estándar — una mascota que viaja con su dueño", pt: "Padrão — um animal de companhia viajando com o dono" }
    body:
      en: "A dog accompanying its owner needs a veterinary health certificate from the official veterinary authority of the departure country, showing the animal's identification, general health and rabies-vaccination details (vaccine, date, validity, lot). No EU pet passport is used and no prior import permit is required. On arrival, the Border Veterinary Service inspects the dog and, if all is in order, issues a release certificate authorising entry. A home visit follows within 15 days."
      fr: "Un chien accompagnant son propriétaire a besoin d'un certificat sanitaire vétérinaire de l'autorité vétérinaire officielle du pays de départ, indiquant l'identification de l'animal, son état de santé général et les données de la vaccination antirabique (vaccin, date, validité, lot). Aucun passeport européen n'est utilisé et aucun permis d'importation préalable n'est requis. À l'arrivée, le Service vétérinaire de frontière inspecte le chien et, si tout est en règle, délivre un certificat de libération autorisant l'entrée. Une visite à domicile suit dans les 15 jours."
      es: "Un perro que acompaña a su dueño necesita un certificado sanitario veterinario de la autoridad veterinaria oficial del país de salida, que muestre la identificación del animal, su estado de salud general y los datos de la vacunación antirrábica (vacuna, fecha, vigencia, lote). No se utiliza pasaporte europeo para mascotas ni se exige permiso de importación previo. A la llegada, el Servicio Veterinario de Frontera inspecciona al perro y, si todo está en regla, expide un certificado de liberación que autoriza la entrada. Una visita domiciliaria se realiza dentro de los 15 días."
      pt: "Um cachorro que acompanha o dono precisa de um atestado de saúde veterinário da autoridade veterinária oficial do país de partida, mostrando a identificação do animal, o estado geral de saúde e os dados da vacinação antirrábica (vacina, data, validade, lote). O passaporte europeu para animais de companhia não é utilizado e nenhuma autorização de importação prévia é exigida. Na chegada, o Serviço Veterinário de Fronteira inspeciona o cachorro e, se estiver tudo em ordem, emite um certificado de liberação autorizando a entrada. Uma visita domiciliar acontece em até 15 dias."
    cls: ok
  listed:
    title: { en: "Puppies and first-time vaccination", fr: "Chiots et primo-vaccination", es: "Cachorros y primovacunación", pt: "Filhotes e primeira vacinação" }
    body:
      en: "A dog cannot be vaccinated against rabies before 3 months (90 days), and immunity builds after about 30 days, so a first-time-vaccinated dog is roughly 4 months old at travel. The certificate must show the rabies-vaccination data and the dog's age. Some official veterinary authorities allow puppies under 3 months to travel without rabies vaccination, with the age recorded — but airline rules and your home country's return rules may be stricter, so confirm both."
      fr: "Un chien ne peut être vacciné contre la rage avant 3 mois (90 jours), et l'immunité s'installe après environ 30 jours ; un chien primo-vacciné a donc environ 4 mois au voyage. Le certificat doit indiquer les données de la vaccination antirabique et l'âge du chien. Certaines autorités vétérinaires officielles autorisent les chiots de moins de 3 mois à voyager sans vaccination antirabique, l'âge étant consigné — mais les règles des compagnies et de retour de ton pays peuvent être plus strictes ; vérifie les deux."
      es: "Un perro no puede vacunarse contra la rabia antes de los 3 meses (90 días), y la inmunidad se establece tras unos 30 días, por lo que un perro con primovacunación tiene unos 4 meses en el momento del viaje. El certificado debe mostrar los datos de la vacunación antirrábica y la edad del perro. Algunas autoridades veterinarias oficiales permiten que los cachorros menores de 3 meses viajen sin vacunación antirrábica, con la edad registrada — pero las normas de las aerolíneas y las de regreso de tu país pueden ser más estrictas, así que confirma ambas."
      pt: "Um cachorro não pode ser vacinado contra a raiva antes dos 3 meses (90 dias), e a imunidade se estabelece depois de cerca de 30 dias, então um cachorro primovacinado tem por volta de 4 meses na viagem. O certificado deve mostrar os dados da vacinação antirrábica e a idade do cachorro. Algumas autoridades veterinárias oficiais permitem que filhotes com menos de 3 meses viajem sem vacinação antirrábica, com a idade registrada — mas as regras da companhia aérea e as regras de retorno do seu país podem ser mais rígidas, então confirme as duas."
    cls: warn
  nonListed:
    title: { en: "Stays over 30 days & the return trip", fr: "Séjours de plus de 30 jours & voyage de retour", es: "Estancias de más de 30 días y el viaje de regreso", pt: "Estadias de mais de 30 dias e a viagem de volta" }
    body:
      en: "If your dog returns to its country of origin within 30 days of arrival, the same certificate can serve for the exit. If the stay in Cuba exceeds 30 days, you must process a Cuban export certificate at a provincial quarantine clinic of the animal-health system, endorsed by CENASA. Exports to the EU or the US require additional steps (microchip, rabies antibody test and, for the US, a CDC authorization) — plan these well ahead if Cuba is a stop on a longer journey."
      fr: "Si ton chien retourne dans son pays d'origine dans les 30 jours suivant l'arrivée, le même certificat peut servir pour la sortie. Si le séjour à Cuba dépasse 30 jours, tu dois traiter un certificat d'exportation cubain dans une clinique de quarantaine provinciale du système de santé animale, visé par le CENASA. Les exportations vers l'UE ou les États-Unis exigent des étapes supplémentaires (puce, titrage antirabique et, pour les États-Unis, une autorisation du CDC) — anticipe si Cuba est une étape d'un voyage plus long."
      es: "Si tu perro regresa a su país de origen dentro de los 30 días posteriores a la llegada, el mismo certificado puede servir para la salida. Si la estancia en Cuba supera los 30 días, debes tramitar un certificado de exportación cubano en una clínica de cuarentena provincial del sistema de sanidad animal, refrendado por el CENASA. Las exportaciones a la UE o a EE. UU. requieren pasos adicionales (microchip, prueba de titulación de rabia y, para EE. UU., una autorización de los CDC) — planifícalos con mucha antelación si Cuba es una escala de un viaje más largo."
      pt: "Se o seu cachorro voltar ao país de origem em até 30 dias após a chegada, o mesmo certificado pode servir para a saída. Se a estadia em Cuba passar de 30 dias, você precisa tramitar um certificado cubano de exportação em uma clínica provincial de quarentena do sistema de sanidade animal, endossado pelo CENASA. Exportações para a UE ou os EUA exigem etapas adicionais (microchip, teste sorológico antirrábico e, para os EUA, uma autorização do CDC) — planeje isso com bastante antecedência se Cuba for uma parada de uma viagem mais longa."
    cls: warn

arrival:
  intro:
    en: "What happens when your dog reaches Cuba depends on whether its documents are complete and the animal is healthy."
    fr: "Ce qui se passe à l'arrivée de ton chien à Cuba dépend de la complétude de ses documents et de son état de santé."
    es: "Lo que ocurre cuando tu perro llega a Cuba depende de si sus documentos están completos y de si el animal está sano."
    pt: "O que acontece quando o seu cachorro chega a Cuba depende de os documentos estarem completos e de o animal estar saudável."
  points:
    - en: "At the international airport, the Border Veterinary Service checks the health certificate and physically inspects the dog against the details recorded on it."
      fr: "À l'aéroport international, le Service vétérinaire de frontière vérifie le certificat sanitaire et inspecte physiquement le chien au regard des données qui y figurent."
      es: "En el aeropuerto internacional, el Servicio Veterinario de Frontera revisa el certificado sanitario e inspecciona físicamente al perro cotejándolo con los datos que figuran en él."
      pt: "No aeroporto internacional, o Serviço Veterinário de Fronteira confere o atestado de saúde e inspeciona fisicamente o cachorro, comparando-o com os dados registrados no documento."
    - en: "If the papers and the physical exam show a healthy animal, a release certificate (Certificado de Liberación) is issued and the dog may enter."
      fr: "Si les documents et l'examen physique montrent un animal sain, un certificat de libération (Certificado de Liberación) est délivré et le chien peut entrer."
      es: "Si los documentos y el examen físico muestran un animal sano, se expide un certificado de liberación (Certificado de Liberación) y el perro puede entrar."
      pt: "Se os documentos e o exame físico mostrarem um animal saudável, é emitido um certificado de liberação (Certificado de Liberación) e o cachorro pode entrar."
    - en: "Your residence or lodging address in Cuba is recorded for a follow-up home visit within 15 days by municipal animal-health specialists."
      fr: "Ton adresse de résidence ou d'hébergement à Cuba est consignée pour une visite à domicile de suivi dans les 15 jours par des spécialistes municipaux de la santé animale."
      es: "Tu dirección de residencia o alojamiento en Cuba se registra para una visita domiciliaria de seguimiento dentro de los 15 días por parte de especialistas municipales de sanidad animal."
      pt: "O seu endereço de residência ou hospedagem em Cuba é registrado para uma visita domiciliar de acompanhamento em até 15 dias, feita por especialistas municipais de sanidade animal."
    - en: "A healthy, well-documented dog is normally exempted from quarantine; an unhealthy or undocumented animal may be held."
      fr: "Un chien sain et bien documenté est normalement exempté de quarantaine ; un animal malade ou non documenté peut être retenu."
      es: "Un perro sano y bien documentado normalmente queda exento de cuarentena; un animal enfermo o sin documentación puede quedar retenido."
      pt: "Um cachorro saudável e bem documentado normalmente é dispensado da quarentena; um animal doente ou sem documentação pode ficar retido."
    - en: "Carry the original certificate (not a copy). Whether a veterinary inspection fee is charged on arrival is not published officially — be prepared to confirm it at the airport."
      fr: "Munis-toi du certificat original (pas d'une copie). L'existence d'une redevance d'inspection vétérinaire à l'arrivée n'est pas publiée officiellement — sois prêt à la vérifier à l'aéroport."
      es: "Lleva el certificado original (no una copia). Si se cobra una tasa de inspección veterinaria a la llegada no se publica oficialmente — prepárate para confirmarlo en el aeropuerto."
      pt: "Leve o certificado original (não uma cópia). Se há cobrança de taxa de inspeção veterinária na chegada não está publicado oficialmente — esteja preparado para confirmar no aeroporto."
    - en: "Airlines have their own crate, breed and booking rules — confirm them separately before you fly."
      fr: "Les compagnies ont leurs propres règles de caisse, de race et de réservation — vérifie-les séparément avant de voler."
      es: "Las aerolíneas tienen sus propias normas de jaula, raza y reserva — confírmalas por separado antes de volar."
      pt: "As companhias aéreas têm as próprias regras de caixa de transporte, raça e reserva — confirme-as separadamente antes de voar."

