# Country Entry Guide — Cuba (bilingual EN/FR).
# Cuba is NOT in the EU. This encodes Cuba's own CENASA / border veterinary scheme.
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_cu
iso2: "CU"
name: { en: "Cuba", fr: "Cuba", es: "Cuba", pt: "Cuba" }
region: { en: "Caribbean", fr: "Caraïbes", es: "Caribe", pt: "Caribe" }


regime: non_listed
exit:
  authority: IMV
  authorityUrl: https://www.minag.gob.cu/noticias/sobre-la-importacion-y-exportacion-de-mascotas-perros-y-gatos/
  intro:
    en: "Cuba is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Instituto de Medicina Veterinaria (IMV)."
    fr: "Cuba est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par l'Instituto de Medicina Veterinaria (IMV)."
    es: "Cuba no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el Instituto de Medicina Veterinaria (IMV)."
    pt: "Cuba é um país não listado, então uma titulação de anticorpos antirrábicos válida é obrigatória para voltar à UE — além de um atestado de saúde de exportação endossado pelo Instituto de Medicina Veterinaria (IMV)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "The IMV (Havana quarantine clinic or provincial offices) issues the official export zoosanitary certificate after a clinical inspection."
        fr: "L'IMV (clinique de quarantaine de La Havane ou bureaux provinciaux) délivre le certificat zoosanitaire d'export officiel après inspection clinique."
        es: "El IMV (clínica de cuarentena de La Habana u oficinas provinciales) emite el certificado zoosanitario de exportación oficial tras una inspección clínica."
        pt: "O IMV (clínica de quarentena de Havana ou escritórios provinciais) emite o certificado zoossanitário oficial de exportação após uma inspeção clínica."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Cuba with your dog", fr: "Voyager à Cuba avec ton chien", es: "Viajar a Cuba con tu perro", pt: "Viajar para Cuba com o seu cachorro" }
  intro:
    en: >-
      Cuba welcomes dogs, but it runs its own scheme through the National Centre for Animal Health
      (CENASA) and the Ministry of Agriculture (MINAG), not the EU pet-passport system. Only dogs and
      cats are recognised as pets. Your dog must travel with a veterinary health certificate issued by
      the official veterinary authority of the country of departure, and the rabies vaccination details
      must appear on it. On arrival, the Border Veterinary Service inspects the dog at the airport and,
      if the animal is healthy and the papers are in order, issues a release certificate authorising
      entry — usually with no quarantine. A follow-up home visit is carried out within 15 days as part
      of routine epidemiological surveillance. What exactly you must prepare still depends on your dog's
      country of departure, its age and its rabies history. This guide explains what to organise before
      you book your flight.
    fr: >-
      Cuba accueille les chiens, mais applique son propre dispositif via le Centre national de santé
      animale (CENASA) et le ministère de l'Agriculture (MINAG), et non le système du passeport
      européen. Seuls les chiens et les chats sont reconnus comme animaux de compagnie. Ton chien doit
      voyager avec un certificat sanitaire vétérinaire établi par l'autorité vétérinaire officielle du
      pays de départ, sur lequel doivent figurer les données de la vaccination antirabique. À l'arrivée,
      le Service vétérinaire de frontière inspecte le chien à l'aéroport et, si l'animal est sain et les
      documents en règle, délivre un certificat de libération autorisant l'entrée — généralement sans
      quarantaine. Une visite à domicile est réalisée dans les 15 jours au titre de la surveillance
      épidémiologique de routine. Ce qu'il faut préparer dépend tout de même du pays de départ, de l'âge
      du chien et de son historique antirabique. Ce guide détaille quoi organiser avant de réserver.
    es: >-
      Cuba acoge a los perros, pero aplica su propio sistema a través del Centro Nacional de Sanidad
      Animal (CENASA) y el Ministerio de la Agricultura (MINAG), y no el sistema del pasaporte europeo.
      Solo se reconocen como mascotas los perros y los gatos. Tu perro debe viajar con un certificado
      sanitario veterinario expedido por la autoridad veterinaria oficial del país de salida, en el que
      deben figurar los datos de la vacunación antirrábica. A la llegada, el Servicio Veterinario de
      Frontera inspecciona al perro en el aeropuerto y, si el animal está sano y los documentos están en
      regla, expide un certificado de liberación que autoriza la entrada — normalmente sin cuarentena. Se
      realiza una visita domiciliaria de seguimiento dentro de los 15 días como parte de la vigilancia
      epidemiológica rutinaria. Lo que exactamente debas preparar depende igualmente del país de salida
      del perro, de su edad y de su historial de rabia. Esta guía explica qué organizar antes de reservar
      tu vuelo.

    pt: "Cuba recebe cachorros, mas aplica o seu próprio sistema, conduzido pelo Centro Nacional de Sanidad Animal (CENASA) e pelo Ministério da Agricultura (MINAG), e não o sistema do passaporte europeu para animais de companhia. Apenas cachorros e gatos são reconhecidos como animais de companhia. O seu cachorro precisa viajar com um atestado de saúde veterinário emitido pela autoridade veterinária oficial do país de partida, e os dados da vacinação antirrábica precisam constar nele. Na chegada, o Serviço Veterinário de Fronteira inspeciona o cachorro no aeroporto e, se o animal estiver saudável e os documentos em ordem, emite um certificado de liberação que autoriza a entrada — normalmente sem quarentena. Uma visita domiciliar de acompanhamento é feita em até 15 dias, como vigilância epidemiológica de rotina. O que exatamente você precisa preparar ainda depende do país de partida do seu cachorro, da idade dele e do histórico de vacinação antirrábica. Este guia explica o que organizar antes de comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Moderate — health certificate, arrival inspection and a follow-up home visit", fr: "Modéré — certificat sanitaire, inspection à l'arrivée et visite à domicile", es: "Moderado — certificado sanitario, inspección a la llegada y visita domiciliaria de seguimiento", pt: "Moderado — atestado de saúde, inspeção na chegada e visita domiciliar de acompanhamento" }

prepTime:
  eu:
    en: "A few days if the rabies vaccine is already valid — the departure-country veterinary health certificate is generally issued shortly before travel (about 10 days' validity for entry checks)."
    fr: "Quelques jours si le vaccin antirabique est déjà valide — le certificat sanitaire vétérinaire du pays de départ est généralement établi peu avant le voyage (validité d'environ 10 jours pour les contrôles à l'entrée)."
    es: "Unos días si la vacuna antirrábica ya está vigente — el certificado sanitario veterinario del país de salida se expide generalmente poco antes del viaje (unos 10 días de valide para los controles de entrada)."
    pt: "Alguns dias se a vacina antirrábica já estiver válida — o atestado de saúde veterinário do país de partida costuma ser emitido pouco antes da viagem (validade de cerca de 10 dias para o controle de entrada)."
  listed:
    en: "About a month if a first rabies shot is still needed: the first dose is given from 3 months of age and immunity builds after ~30 days, so a first-time-vaccinated dog is roughly 4 months old at travel."
    fr: "Environ un mois si une première vaccination antirabique reste à faire : la première dose s'administre à partir de 3 mois et l'immunité s'installe après ~30 jours ; un chien primo-vacciné a donc environ 4 mois au voyage."
    es: "Alrededor de un mes si aún falta la primera vacuna antirrábica: la primera dosis se administra a partir de los 3 meses de edad y la inmunidad se establece tras ~30 días, por lo que un perro con primovacunación tiene unos 4 meses en el momento del viaje."
    pt: "Cerca de um mês se ainda faltar a primeira dose antirrábica: a primeira dose é aplicada a partir dos 3 meses de idade e a imunidade se estabelece depois de ~30 dias, então um cachorro primovacinado tem por volta de 4 meses na viagem."
  nonListed:
    en: "Plan ahead if you will stay over 30 days: leaving Cuba again requires a Cuban export certificate processed at a provincial quarantine clinic and CENASA."
    fr: "Anticipe si tu séjourne plus de 30 jours : ressortir de Cuba exige un certificat d'exportation cubain traité dans une clinique de quarantaine provinciale et au CENASA."
    es: "Anticípate si vas a quedarte más de 30 días: salir de nuevo de Cuba requiere un certificado de exportación cubano tramitado en una clínica de cuarentena provincial y en el CENASA."
    pt: "Planeje com antecedência se você for ficar mais de 30 dias: sair de Cuba de novo exige um certificado cubano de exportação tramitado em uma clínica provincial de quarentena e no CENASA."

