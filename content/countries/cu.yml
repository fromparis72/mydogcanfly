restrictedDogs:
  intro:
    en: "Cuba has no published breed-specific import ban. Reference official veterinary authorities list no restriction on dog breeds considered dangerous for entry into Cuba."
    fr: "Cuba n'a aucune interdiction d'importation visant une race publiée. Les autorités vétérinaires officielles de référence n'indiquent aucune restriction sur les races de chiens considérées dangereuses pour l'entrée à Cuba."
    es: "Cuba no tiene ninguna prohibición de importación por raza publicada. Las autoridades veterinarias oficiales de referencia no indican ninguna restricción sobre las razas de perros consideradas peligrosas para la entrada a Cuba."
    pt: "Cuba não tem nenhuma proibição de importação publicada por raça. As autoridades veterinárias oficiais de referência não listam nenhuma restrição a raças de cachorro consideradas perigosas para a entrada em Cuba."
  cat1:
    en: "No banned category: no dog breed is recorded as prohibited from entering Cuba. Any dog meeting the health-certificate, rabies-vaccination and arrival-inspection requirements may be imported regardless of breed."
    fr: "Aucune catégorie interdite : aucune race de chien n'est enregistrée comme interdite d'entrée à Cuba. Tout chien répondant aux exigences (certificat sanitaire, vaccination antirabique, inspection à l'arrivée) peut être importé, quelle que soit sa race."
    es: "Sin categoría prohibida: ninguna raza de perro figura como prohibida para la entrada a Cuba. Cualquier perro que cumpla los requisitos de certificado sanitario, vacunación antirrábica e inspección a la llegada puede importarse independientemente de la raza."
    pt: "Nenhuma categoria proibida: nenhuma raça de cachorro consta como proibida de entrar em Cuba. Qualquer cachorro que cumpra os requisitos de atestado de saúde, vacinação antirrábica e inspeção na chegada pode ser importado, seja qual for a raça."
  cat2:
    en: "No dangerous-breed list: reference authorities note that breed-based restrictions are 'not contemplated to date' for Cuba. If this changes, the restriction would be published by the Cuban veterinary authority — check before travel."
    fr: "Aucune liste de races dangereuses : les autorités de référence notent que les restrictions par race ne sont « pas prévues à ce jour » pour Cuba. En cas de changement, la restriction serait publiée par l'autorité vétérinaire cubaine — vérifie avant de voyager."
    es: "Sin lista de razas peligrosas: las autoridades de referencia señalan que las restricciones por raza «no están contempladas hasta la fecha» para Cuba. Si esto cambia, la restricción la publicaría la autoridad veterinaria cubana — compruébalo antes de viajar."
    pt: "Sem lista de raças perigosas: as autoridades de referência observam que restrições por raça 'não estão contempladas até o momento' em Cuba. Se isso mudar, a restrição seria publicada pela autoridade veterinária cubana — confira antes de viajar."
  note:
    en: "Because there is no national breed ban, focus on the health certificate and arrival inspection. Confirm your airline's own breed and crate policy before booking."
    fr: "Comme il n'existe pas d'interdiction nationale de race, concentre-toi sur le certificat sanitaire et l'inspection à l'arrivée. Vérifie la politique de race et de caisse de ta compagnie avant de réserver."
    es: "Como no existe una prohibición nacional por raza, céntrate en el certificado sanitario y la inspección a la llegada. Confirma la política de razas y jaula de tu aerolínea antes de reservar."
    pt: "Como não existe proibição nacional por raça, concentre-se no atestado de saúde e na inspeção de chegada. Confirme a política de raças e de caixa de transporte da sua companhia aérea antes de reservar."

checklist:
  - en: "Veterinary health certificate from the departure country's official authority, in your name"
    fr: "Certificat sanitaire vétérinaire de l'autorité officielle du pays de départ, à ton nom"
    es: "Certificado sanitario veterinario de la autoridad oficial del país de salida, a tu nombre"
    pt: "Atestado de saúde veterinário da autoridade oficial do país de partida, em seu nome"
  - en: "Rabies vaccination recorded (vaccine type/brand, dose, date, validity, lot number)"
    fr: "Vaccination antirabique consignée (type/marque du vaccin, dose, date, validité, numéro de lot)"
    es: "Vacunación antirrábica registrada (tipo/marca de la vacuna, dosis, fecha, vigencia, número de lote)"
    pt: "Vacinação antirrábica registrada (tipo/marca da vacina, dose, data, validade, número do lote)"
  - en: "Animal identification on the certificate (tag, tattoo or microchip — microchip advised for the return)"
    fr: "Identification de l'animal sur le certificat (chapa, tatouage ou puce — puce conseillée pour le retour)"
    es: "Identificación del animal en el certificado (chapa, tatuaje o microchip — microchip recomendado para el regreso)"
    pt: "Identificação do animal no certificado (placa, tatuagem ou microchip — microchip recomendado para a volta)"
  - en: "Dog clinically healthy, no fresh wounds, free of external parasites"
    fr: "Chien cliniquement sain, sans plaies fraîches, exempt de parasites externes"
    es: "Perro clínicamente sano, sin heridas frescas, libre de parásitos externos"
    pt: "Cachorro clinicamente saudável, sem feridas recentes, livre de parasitas externos"
  - en: "Original documents carried with you (not copies)"
    fr: "Documents originaux transportés avec toi (pas de copies)"
    es: "Documentos originales que lleves contigo (no copias)"
    pt: "Documentos originais levados com você (não cópias)"
  - en: "Check whether the Cuban consulate in your country requires certificate legalisation"
    fr: "Vérifie si le consulat cubain de ton pays exige une légalisation du certificat"
    es: "Comprueba si el consulado cubano de tu país exige la legalización del certificado"
    pt: "Verifique se o consulado de Cuba no seu país exige a legalização do certificado"
  - en: "Note your Cuban residence/lodging address for the 15-day follow-up visit"
    fr: "Note ton adresse de résidence/hébergement à Cuba pour la visite de suivi à 15 jours"
    es: "Anota tu dirección de residencia/alojamiento en Cuba para la visita de seguimiento a los 15 días"
    pt: "Anote o seu endereço de residência/hospedagem em Cuba para a visita de acompanhamento em 15 dias"
  - en: "If staying over 30 days, plan the Cuban export certificate for the return"
    fr: "En cas de séjour de plus de 30 jours, planifie le certificat d'exportation cubain pour le retour"
    es: "Si te quedas más de 30 días, planifica el certificado de exportación cubano para el regreso"
    pt: "Se for ficar mais de 30 dias, planeje o certificado cubano de exportação para a volta"
  - en: "Airline reservation and suitable IATA crate if travelling in the hold"
    fr: "Réservation compagnie et caisse IATA adaptée si voyage en soute"
    es: "Reserva de la aerolínea y jaula IATA adecuada si viaja en bodega"
    pt: "Reserva na companhia aérea e caixa de transporte adequada às normas IATA se for viajar no porão"

