# Country Entry Guide — Saudi Arabia (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_sa
iso2: "SA"
name: { en: "Saudi Arabia", fr: "Arabie saoudite", es: "Arabia Saudí", pt: "Arábia Saudita" }
region: { en: "Middle East", fr: "Moyen-Orient", es: "Oriente Medio", pt: "Oriente Médio" }


regime: non_listed
domestic:
  intro:
    en: "Domestic flight in Saudi Arabia: no domestic movement rule is published — the quarantine framework covers import, export and transit only."
    fr: "Vol intérieur en Arabie saoudite : aucune règle de mouvement intérieur n'est publiée — le cadre de quarantaine ne couvre que l'import, l'export et le transit."
    es: "Vuelo nacional en Arabia Saudí: no se publica ninguna regla de movimiento nacional — el marco de cuarentena solo cubre importación, exportación y tránsito."
    pt: "Voo doméstico na Arábia Saudita: nenhuma norma para deslocamento doméstico é publicada — o regime de quarentena cobre apenas importação, exportação e trânsito."
  points:
    - en: "No document is required by the State for a domestic flight."
      fr: "Aucun document n'est exigé par l'État pour un vol intérieur."
      es: "El Estado no exige ningún documento para un vuelo nacional."
      pt: "Nenhum documento é exigido pelo Estado para um voo doméstico."
    - en: "Aviation regulation only obliges carriers to publish their animal rules; acceptance is left entirely to them. One national carrier takes small dogs in the cabin, another refuses animals altogether."
      fr: "La réglementation aérienne oblige seulement les compagnies à publier leurs règles animaux ; l'acceptation leur est entièrement laissée. Une compagnie nationale accepte les petits chiens en cabine, une autre refuse tout animal."
      es: "La normativa aérea solo obliga a las aerolíneas a publicar sus reglas de animales; la aceptación queda enteramente en sus manos. Una aerolínea nacional acepta perros pequeños en cabina, otra rechaza todo animal."
      pt: "A regulamentação de aviação apenas obriga as companhias aéreas a publicar as próprias normas para animais; a aceitação fica inteiramente a critério delas. Uma companhia nacional aceita cachorros pequenos na cabine, outra recusa animais por completo."
    - en: "Assistance animals travel free on domestic flights with a letter from the competent authority."
      fr: "Les animaux d'assistance voyagent gratuitement sur les vols intérieurs avec une attestation de l'autorité compétente."
      es: "Los animales de asistencia viajan gratis en vuelos nacionales con una carta de la autoridad competente."
      pt: "Animais de assistência viajam gratuitamente em voos domésticos com uma carta da autoridade competente."
exit:
  authority: MEWA
  authorityUrl: https://www.mewa.gov.sa
  intro:
    en: "Saudi Arabia is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus a MEWA export health certificate."
    fr: "L'Arabie saoudite est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export MEWA."
    es: "Arabia Saudí no está listada: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación de MEWA."
    pt: "A Arábia Saudita não é um país listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação da MEWA."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "Apply through MEWA's online platform Anaam; a certificate from a MEWA-accredited clinic is approved at the MEWA branch after clinical and lab examination, and the export permission is valid 30 days."
        fr: "Fais la demande sur la plateforme en ligne Anaam du MEWA ; un certificat d'une clinique agréée MEWA est validé au bureau MEWA après examen clinique et de laboratoire, et l'autorisation d'export est valable 30 jours."
        es: "Solicítalo en la plataforma en línea Anaam de MEWA; un certificado de una clínica acreditada por MEWA se aprueba en la oficina de MEWA tras examen clínico y de laboratorio, y el permiso de exportación es válido 30 días."
        pt: "Solicite pela plataforma on-line da MEWA, a Anaam; um atestado de uma clínica credenciada pela MEWA é aprovado na filial da MEWA após exame clínico e laboratorial, e a autorização de exportação é válida por 30 dias."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Saudi Arabia with your dog", fr: "Voyager en Arabie saoudite avec ton chien", es: "Viajar a Arabia Saudí con tu perro", pt: "Viajar para a Arábia Saudita com seu cachorro" }
  intro:
    en: >-
      Saudi Arabia does not run the EU pet-travel framework — it applies its own scheme through the
      Ministry of Environment, Water and Agriculture (MEWA) and its Anaam electronic platform. Importantly,
      dogs are not freely admitted: MEWA's guidance limits dog import to hunting, guarding and guide dogs
      for people with disabilities, and pets cannot be brought in on a tourist visa. Every dog needs an
      import permit obtained in advance through Anaam before it travels, plus an ISO microchip, a valid
      rabies vaccination (with at least six months of validity remaining), other vaccinations and an
      official government veterinary health certificate. Several dangerous breeds are barred. This guide
      explains the permit, the documents, the age and quantity limits, and the breed rules so you know
      exactly what to prepare — and whether import is possible at all — before you book.
    fr: >-
      L'Arabie saoudite n'applique pas le cadre européen — elle a son propre dispositif, géré par le
      ministère de l'Environnement, de l'Eau et de l'Agriculture (MEWA) via sa plateforme électronique
      Anaam. Point important : les chiens ne sont pas librement admis. Les consignes du MEWA limitent
      l'importation de chiens à la chasse, au gardiennage et aux chiens guides pour personnes handicapées,
      et un animal ne peut pas entrer sous visa touristique. Chaque chien doit disposer d'un permis
      d'importation obtenu à l'avance via Anaam avant de voyager, ainsi que d'une puce ISO, d'une
      vaccination antirabique valide (avec au moins six mois de validité restante), d'autres vaccinations
      et d'un certificat vétérinaire officiel. Plusieurs races dangereuses sont interdites. Ce guide
      détaille le permis, les documents, les limites d'âge et de nombre, et les règles de race pour savoir
      quoi préparer — et si l'importation est même possible — avant de réserver.
    es: >-
      Arabia Saudí no aplica el marco europeo de viaje de mascotas — utiliza su propio sistema a través
      del Ministerio de Medio Ambiente, Agua y Agricultura (MEWA) y su plataforma electrónica Anaam. Es
      importante saber que los perros no se admiten libremente: las directrices del MEWA limitan la
      importación de perros a la caza, la guarda y los perros guía para personas con discapacidad, y las
      mascotas no pueden entrar con un visado de turista. Cada perro necesita un permiso de importación
      obtenido con antelación a través de Anaam antes de viajar, además de un microchip ISO, una
      vacunación antirrábica válida (con al menos seis meses de valide restante), otras vacunaciones y un
      certificado sanitario veterinario oficial del gobierno. Varias razas peligrosas están prohibidas.
      Esta guía explica el permiso, los documentos, los límites de edad y de cantidad, y las normas sobre
      razas para que sepas exactamente qué preparar — y si la importación es siquiera posible — antes de
      reservar.

    pt: "A Arábia Saudita não utiliza o regime europeu de viagens com animais de estimação — aplica o próprio sistema, por meio do Ministério do Meio Ambiente, Água e Agricultura (MEWA) e da sua plataforma eletrônica Anaam. É importante notar que os cachorros não são admitidos livremente: as orientações da MEWA limitam a importação de cachorros aos de caça, de guarda e cães-guia para pessoas com deficiência, e animais de estimação não podem ser trazidos com visto de turista. Todo cachorro precisa de uma autorização de importação obtida com antecedência pela Anaam antes de viajar, além de um microchip ISO, uma vacinação antirrábica válida (com pelo menos seis meses de validade restante), outras vacinas e um atestado de saúde veterinário oficial do governo. Várias raças perigosas são proibidas. Este guia explica a autorização, os documentos, os limites de idade e de quantidade, e as normas de raça para você saber exatamente o que preparar — e se a importação é sequer possível — antes de reservar."
difficulty:
  level: moderate
  label: { en: "Moderate — advance MEWA permit, dogs admitted only for specific uses", fr: "Modéré — permis MEWA préalable, chiens admis pour usages précis", es: "Moderado — permiso previo del MEWA, perros admitidos solo para usos específicos", pt: "Moderado — autorização da MEWA obrigatória com antecedência, cachorros admitidos apenas para usos específicos" }

prepTime:
  eu:
    en: "Once the microchip, an in-date rabies vaccination (≥6 months validity left) and the health certificate are ready, the Anaam import permit is issued for a 30-day window — plan several weeks overall."
    fr: "Une fois la puce, une vaccination antirabique à jour (≥6 mois de validité restante) et le certificat sanitaire prêts, le permis Anaam est délivré pour une fenêtre de 30 jours — compte plusieurs semaines au total."
    es: "Una vez listos el microchip, una vacunación antirrábica en vigor (≥6 meses de valide restante) y el certificado sanitario, el permiso de importación Anaam se expide con una vigencia de 30 días — prevé varias semanas en total."
    pt: "Depois que o microchip, uma vacinação antirrábica em dia (com ≥6 meses de validade restante) e o atestado de saúde estiverem prontos, a autorização de importação da Anaam é emitida com uma janela de 30 dias — planeje várias semanas no total."
  listed:
    en: "Import is allowed only from the countries shown as permitted on the Anaam platform; check your dog's origin against that list before making any plans."
    fr: "L'importation n'est autorisée que depuis les pays affichés comme autorisés sur la plateforme Anaam ; vérifie l'origine de ton chien sur cette liste avant tout projet."
    es: "La importación solo se permite desde los países que figuran como autorizados en la plataforma Anaam; comprueba el origen de tu perro en esa lista antes de hacer cualquier plan."
    pt: "A importação só é permitida de países mostrados como autorizados na plataforma Anaam; verifique a origem do seu cachorro nessa lista antes de fazer qualquer plano."
  nonListed:
    en: "From a country not permitted on Anaam, or on a tourist visa, import is refused — timing cannot be assumed and eligibility must be confirmed first."
    fr: "Depuis un pays non autorisé sur Anaam, ou sous visa touristique, l'importation est refusée — les délais ne peuvent être présumés et l'éligibilité doit d'abord être confirmée."
    es: "Desde un país no autorizado en Anaam, o con un visado de turista, la importación se deniega — los plazos no pueden darse por supuestos y primero hay que confirmar la elegibilidad."
    pt: "De um país não autorizado na Anaam, ou com visto de turista, a importação é recusada — o prazo não pode ser presumido e a elegibilidade precisa ser confirmada antes."

