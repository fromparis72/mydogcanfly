# Country Entry Guide — Angola (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_ao
iso2: "AO"
name: { en: "Angola", fr: "Angola", es: "Angola", pt: "Angola" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
exit:
  authority: ISV
  authorityUrl: https://minagrif.gov.ao/
  intro:
    en: "Angola is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Instituto dos Serviços de Veterinária (ISV)."
    fr: "L'Angola est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par l'Instituto dos Serviços de Veterinária (ISV)."
    es: "Angola no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el Instituto dos Serviços de Veterinária (ISV)."
    pt: "Angola é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para regressar à UE — além de um atestado de saúde de exportação endossado pelo Instituto dos Serviços de Veterinária (ISV)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipar o teste sorológico antirrábico (titulação): análise de sangue num laboratório aprovado pela UE, pelo menos 30 dias depois da vacinação — um resultado válido é indispensável para reentrar na UE e não se resolve à última hora."
    - timing: window
      scope: any
      text:
        en: "The ISV (veterinary public-health service) issues the certificate of origin and health and sets the norms for exporting animals."
        fr: "L'ISV (service de santé publique vétérinaire) délivre le certificat d'origine et de santé et fixe les normes d'export des animaux."
        es: "El ISV (servicio de salud pública veterinaria) emite el certificado de origen y salud y fija las normas para exportar animales."
        pt: "O ISV (serviço de saúde pública veterinária) emite o certificado de origem e de sanidade e fixa as normas de exportação de animais."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o cachorro já tinha um teste sorológico antirrábico (titulação) válido para a UE antes da partida, este permanece válido para toda a vida enquanto a vacinação antirrábica estiver em dia — convém verificar antes de viajar."

hero:
  h1: { en: "Traveling to Angola with your dog", fr: "Voyager en Angola avec ton chien", es: "Viajar a Angola con tu perro", pt: "Viajar para Angola com o seu cachorro" }
  intro:
    en: >-
      Angola admits pet dogs, but it publishes very little detail about the exact entry procedure. The
      competent authority is the Instituto dos Serviços de Veterinária (ISV), under the Ministério da
      Agricultura e Florestas (MINAGRIF); customs clearance is handled by the Administração Geral
      Tributária (AGT). Angola is a rabies-endemic country and is officially classified as high-risk for
      dog rabies, so a valid rabies vaccination and an official veterinary health certificate from your
      origin country are the practical baseline, and animals are inspected on arrival. Because Angola is
      not part of the EU pet framework and does not publish a public dog-import checklist, several exact
      conditions — microchip standard, vaccination timing, any antibody test, parasite treatment,
      minimum age and quarantine — are not officially documented. This guide sets out what is confirmed
      from official sources and flags clearly what you must verify directly with the ISV before you book.
    fr: >-
      L'Angola admet les chiens de compagnie, mais publie très peu de détails sur la procédure d'entrée
      exacte. L'autorité compétente est l'Instituto dos Serviços de Veterinária (ISV), rattaché au
      Ministério da Agricultura e Florestas (MINAGRIF) ; le dedouanement relève de l'Administração Geral
      Tributária (AGT). L'Angola est un pays d'endémie rabique, officiellement classé à haut risque de
      rage canine : une vaccination antirabique valide et un certificat vétérinaire officiel du pays
      d'origine constituent donc la base pratique, et les animaux sont inspectés à l'arrivée. Comme
      l'Angola n'appartient pas au cadre européen et ne publie pas de liste d'exigences pour les chiens,
      plusieurs conditions exactes — norme de puce, calendrier vaccinal, éventuel test d'anticorps,
      traitement antiparasitaire, âge minimum et quarantaine — ne sont pas documentées officiellement. Ce
      guide expose ce qui est confirmé par des sources officielles et signale clairement ce que tu dois
      vérifier directement auprès de l'ISV avant de réserver.
    es: >-
      Angola admite a los perros de compañía, pero publica muy pocos detalles sobre el procedimiento de
      entrada exacto. La autoridad competente es el Instituto dos Serviços de Veterinária (ISV), dependiente
      del Ministério da Agricultura e Florestas (MINAGRIF); el despacho de aduanas corre a cargo de la
      Administração Geral Tributária (AGT). Angola es un país con rabia endémica y está clasificado
      oficialmente como de alto riesgo de rabia canina, por lo que una vacunación antirrábica válida y un
      certificado sanitario veterinario oficial de tu país de origen constituyen la base práctica, y los
      animales se inspeccionan a la llegada. Como Angola no forma parte del marco europeo para mascotas y no
      publica una lista de requisitos para la importación de perros, varias condiciones exactas — norma de
      microchip, calendario de vacunación, posible prueba de anticuerpos, tratamiento antiparasitario, edad
      mínima y cuarentena — no están documentadas oficialmente. Esta guía expone lo que está confirmado por
      fuentes oficiales y señala claramente lo que debes verificar directamente con el ISV antes de reservar.

    pt: "Angola admite cachorros de companhia, mas publica muito poucos detalhes sobre o procedimento exato de entrada. A autoridade competente é o Instituto dos Serviços de Veterinária (ISV), tutelado pelo Ministério da Agricultura e Florestas (MINAGRIF); o desembaraço aduaneiro cabe à Administração Geral Tributária (AGT). Angola é um país de raiva endémica e está oficialmente classificado como de alto risco de raiva canina, pelo que uma vacinação antirrábica válida e um atestado de saúde veterinário oficial do país de origem constituem a base prática, e os animais são inspecionados à chegada. Como Angola não integra o quadro europeu para animais de companhia e não publica uma lista pública de exigências para a importação de cachorros, várias condições exatas — norma do microchip, calendário de vacinação, eventual teste sorológico, tratamento antiparasitário, idade mínima e quarentena — não estão documentadas oficialmente. Este guia expõe o que está confirmado por fontes oficiais e assinala com clareza o que deve ser verificado diretamente junto do ISV antes de reservar."
difficulty:
  level: difficult
  label: { en: "Difficult — few published rules, confirm with ISV", fr: "Difficile — peu de règles publiées, à confirmer auprès de l'ISV", es: "Difícil — pocas normas publicadas, confirma con el ISV", pt: "Difícil — poucas regras publicadas, confirmar junto do ISV" }

prepTime:
  eu:
    en: "From Europe: allow several weeks and confirm the exact steps with the ISV first — a rabies vaccination and an official, embassy-legalised veterinary certificate are the pacing items. Exact lead time is not officially published."
    fr: "Depuis l'Europe : prévoir plusieurs semaines et confirmer d'abord les étapes exactes auprès de l'ISV — la vaccination antirabique et un certificat vétérinaire officiel légalisé par l'ambassade rythment le calendrier. Le délai exact n'est pas publié officiellement."
    es: "Desde Europa: calcula varias semanas y confirma primero los pasos exactos con el ISV — la vacunación antirrábica y un certificado veterinario oficial legalizado por la embajada marcan el ritmo del calendario. El plazo exacto no se publica oficialmente."
    pt: "Da Europa: contar com várias semanas e confirmar primeiro as etapas exatas junto do ISV — a vacinação antirrábica e um certificado veterinário oficial legalizado pela embaixada marcam o ritmo do calendário. O prazo exato não é publicado oficialmente."
  listed:
    en: "From a rabies-controlled country (US, Canada, Gulf states…): similar — a valid rabies vaccination and an endorsed veterinary certificate. No official Angolan timetable is published; plan ahead and check with the ISV."
    fr: "Depuis un pays à rage maîtrisée (USA, Canada, pays du Golfe…) : similaire — vaccination antirabique valide et certificat vétérinaire visé. Aucun calendrier angolais officiel n'est publié ; anticipe et vérifie auprès de l'ISV."
    es: "Desde un país con rabia controlada (EE. UU., Canadá, países del Golfo…): similar — una vacunación antirrábica válida y un certificado veterinario refrendado. No se publica ningún calendario angoleño oficial; planifica con antelación y consúltalo con el ISV."
    pt: "De um país com raiva controlada (EUA, Canadá, países do Golfo…): situação semelhante — vacinação antirrábica válida e certificado veterinário endossado. Não existe calendário angolano oficial publicado; convém organizar tudo com antecedência e confirmar junto do ISV."
  nonListed:
    en: "From another high-rabies-risk country: same baseline, but expect closer scrutiny on arrival. Any additional test or waiting period is not officially published — confirm with the ISV before travel."
    fr: "Depuis un autre pays à haut risque rabique : même base, mais contrôle renforcé à l'arrivée. Tout test ou délai supplémentaire n'est pas publié officiellement — à confirmer auprès de l'ISV avant le voyage."
    es: "Desde otro país de alto riesgo de rabia: la misma base, pero espera un control más riguroso a la llegada. Cualquier prueba o periodo de espera adicional no se publica oficialmente — confírmalo con el ISV antes de viajar."
    pt: "De outro país de alto risco de raiva: a mesma base, mas com uma verificação mais rigorosa à chegada. Qualquer teste ou prazo adicional não é publicado oficialmente — confirmar junto do ISV antes da viagem."

