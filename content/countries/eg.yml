    required: { en: "Not required", fr: "Non requis", es: "No obligatoria", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Egypt does not require a rabies antibody (titer) test to enter from any country.", fr: "L'Égypte n'exige pas de titrage antirabique pour entrer, quel que soit le pays d'origine.", es: "Egipto no exige una prueba de titulación de rabia para entrar desde ningún país.", pt: "O Egito não exige teste sorológico antirrábico (titulação) para entrar, seja qual for o país de origem." }
    ref: { en: "Embassy of Egypt (Washington) — Bringing Pets", fr: "Ambassade d'Égypte (Washington) — Bringing Pets", es: "Embajada de Egipto (Washington) — Bringing Pets", pt: "Embaixada do Egito (Washington) — Bringing Pets" }
  - item: { en: "Other core vaccinations", fr: "Autres vaccinations de base", es: "Otras vacunas básicas", pt: "Outras vacinações essenciais" }
    required: { en: "Required for dogs", fr: "Requises pour les chiens", es: "Obligatorias para perros", pt: "Obrigatórias para cachorros" }
    when: { en: "Distemper, hepatitis, parvovirus and parainfluenza, according to the origin country's disease status.", fr: "Maladie de Carré, hépatite, parvovirose et parainfluenza, selon la situation sanitaire du pays d'origine.", es: "Moquillo, hepatitis, parvovirus y parainfluenza, según la situación sanitaria del país de origen.", pt: "Cinomose, hepatite, parvovirose e parainfluenza, conforme a situação sanitária do país de origem." }
    exceptions: { en: "Recorded in the vaccination booklet and reflected on the health certificate.", fr: "Consignées dans le carnet de vaccination et reprises sur le certificat sanitaire.", es: "Registradas en la cartilla de vacunación y reflejadas en el certificado sanitario.", pt: "Registradas na carteira de vacinação e refletidas no atestado de saúde." }
    ref: { en: "GOVS import requirements", fr: "Exigences d'importation GOVS", es: "Requisitos de importación de la GOVS", pt: "Exigências de importação da GOVS" }
  - item: { en: "Official veterinary health certificate", fr: "Certificat vétérinaire officiel", es: "Certificado sanitario veterinario oficial", pt: "Certificado veterinário oficial" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "International/export health certificate completed by a licensed vet just before travel and endorsed by the origin country's official (government) veterinary authority.", fr: "Certificat sanitaire international/export établi par un vétérinaire agréé juste avant le voyage et visé par l'autorité vétérinaire officielle (gouvernementale) du pays d'origine.", es: "Certificado sanitario internacional/de exportación cumplimentado por un veterinario autorizado justo antes del viaje y refrendado por la autoridad veterinaria oficial (gubernamental) del país de origen.", pt: "Atestado de saúde internacional/de exportação preenchido por um veterinário habilitado pouco antes da viagem e endossado pela autoridade veterinária oficial (governamental) do país de origem." }
    exceptions: { en: "Short validity (about 10–14 days) and must still be valid on arrival; it must state the dog is healthy and not from a rabies-restricted area.", fr: "Validité courte (environ 10–14 jours) et doit être encore valable à l'arrivée ; il doit attester que le chien est sain et ne provient pas d'une zone sous restriction rabique.", es: "Valide corta (unos 10–14 días) y debe seguir siendo válido a la llegada; debe indicar que el perro está sano y no procede de una zona bajo restricción por rabia.", pt: "Validade curta (cerca de 10–14 dias) e deve continuar válido na chegada; deve declarar que o cachorro está saudável e não vem de uma área sob restrição por raiva." }
    ref: { en: "GOVS; USDA APHIS Egypt health certificate", fr: "GOVS ; certificat sanitaire Égypte USDA APHIS", es: "GOVS; certificado sanitario Egipto USDA APHIS", pt: "GOVS; atestado de saúde Egito USDA APHIS" }
  - item: { en: "Internal & external parasite treatment", fr: "Traitement antiparasitaire interne & externe", es: "Tratamiento antiparasitario interno y externo", pt: "Tratamento antiparasitário interno e externo" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Endo- and ecto-parasite treatment by a licensed vet shortly before departure.", fr: "Traitement endo- et ecto-parasitaire par un vétérinaire agréé peu avant le départ.", es: "Tratamiento contra endo- y ectoparásitos por un veterinario autorizado poco antes de la salida.", pt: "Tratamento contra endo e ectoparasitas por um veterinário habilitado pouco antes da partida." }
    exceptions: { en: "Recorded on veterinary documents; treatment typically considered valid for a few days.", fr: "Consigné sur les documents vétérinaires ; traitement généralement considéré valable quelques jours.", es: "Registrado en los documentos veterinarios; el tratamiento suele considerarse válido durante unos días.", pt: "Registrado nos documentos veterinários; o tratamento costuma ser considerado válido por alguns dias." }
    ref: { en: "GOVS import requirements", fr: "Exigences d'importation GOVS", es: "Requisitos de importación de la GOVS", pt: "Exigências de importação da GOVS" }
  - item: { en: "Import approval / advance notification", fr: "Autorisation d'importation / notification préalable", es: "Autorización de importación / notificación previa", pt: "Autorização de importação / notificação prévia" }
    required: { en: "Conditional", fr: "Conditionnelle", es: "Condicional", pt: "Condicional" }
    when: { en: "Usually not required for a personal pet dog, but GOVS may request prior import approval in some cases.", fr: "En général non requise pour un chien de compagnie personnel, mais la GOVS peut demander une autorisation d'importation préalable dans certains cas.", es: "Normalmente no obligatoria para un perro de compañía personal, pero la GOVS puede solicitar una autorización de importación previa en algunos casos.", pt: "Em geral não é exigida para um cachorro de estimação pessoal, mas a GOVS pode solicitar uma autorização de importação prévia em alguns casos." }
    exceptions: { en: "Confirm with the airline and GOVS before travel, especially for multiple animals or commercial import.", fr: "À confirmer avec la compagnie et la GOVS avant le voyage, surtout pour plusieurs animaux ou une importation commerciale.", es: "Confírmalo con la aerolínea y la GOVS antes del viaje, sobre todo en caso de varios animales o de importación comercial.", pt: "Confirme com a companhia aérea e com a GOVS antes da viagem, sobretudo no caso de vários animais ou de importação comercial." }
    ref: { en: "GOVS (Ministry of Agriculture)", fr: "GOVS (ministère de l'Agriculture)", es: "GOVS (Ministerio de Agricultura)", pt: "GOVS (Ministério da Agricultura)" }
  - item: { en: "Arrival veterinary inspection", fr: "Inspection vétérinaire à l'arrivée", es: "Inspección veterinaria a la llegada", pt: "Inspeção veterinária na chegada" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "GOVS veterinary quarantine officers inspect every arriving dog at the airport and check the documents.", fr: "Les agents de la quarantaine vétérinaire GOVS inspectent chaque chien à l'arrivée à l'aéroport et vérifient les documents.", es: "Los agentes de cuarentena veterinaria de la GOVS inspeccionan a cada perro que llega al aeropuerto y comprueban los documentos.", pt: "Os agentes da quarentena veterinária da GOVS inspecionam cada cachorro que chega ao aeroporto e conferem os documentos." }
    exceptions: { en: "If the dog shows signs of contagious disease, further examination or a short quarantine may be imposed.", fr: "Si le chien présente des signes de maladie contagieuse, un examen complémentaire ou une courte quarantaine peut être imposé.", es: "Si el perro muestra signos de enfermedad contagiosa, puede imponerse un examen adicional o una cuarentena breve.", pt: "Se o cachorro apresentar sinais de doença contagiosa, pode ser imposto um exame adicional ou uma quarentena curta." }
    ref: { en: "GOVS Veterinary Quarantine (WOAH)", fr: "Quarantaine vétérinaire GOVS (WOAH)", es: "Cuarentena veterinaria de la GOVS (WOAH)", pt: "Quarentena veterinária GOVS (WOAH)" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "At least 4 months", fr: "Au moins 4 mois", es: "Al menos 4 meses", pt: "Pelo menos 4 meses" }
    when: { en: "A puppy cannot travel on its mother's vaccination; it needs its own valid rabies shot (from 12 weeks) plus the 30-day wait.", fr: "Un chiot ne peut voyager sous la vaccination de sa mère ; il lui faut sa propre vaccination antirabique valide (dès 12 semaines) plus le délai de 30 jours.", es: "Un cachorro no puede viajar con la vacunación de su madre; necesita su propia vacuna antirrábica válida (desde las 12 semanas) más la espera de 30 días.", pt: "Um filhote não pode viajar sob a vacinação da mãe; ele precisa da própria vacinação antirrábica válida (a partir das 12 semanas) mais a espera de 30 dias." }
    exceptions: { en: "In practice this makes the minimum travelling age about 4 months.", fr: "En pratique, l'âge minimum pour voyager est donc d'environ 4 mois.", es: "En la práctica, esto hace que la edad mínima para viajar sea de unos 4 meses.", pt: "Na prática, isso faz com que a idade mínima para viajar seja de cerca de 4 meses." }
    ref: { en: "GOVS import requirements", fr: "Exigences d'importation GOVS", es: "Requisitos de importación de la GOVS", pt: "Exigências de importação da GOVS" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not routine", fr: "Pas systématique", es: "No sistemática", pt: "Não sistemática" }
    when: { en: "No automatic quarantine when documents are complete and the dog is healthy on inspection.", fr: "Pas de quarantaine automatique si les documents sont complets et le chien sain à l'inspection.", es: "Sin cuarentena automática si los documentos están completos y el perro está sano en la inspección.", pt: "Nenhuma quarentena automática quando os documentos estão completos e o cachorro está saudável na inspeção." }
    exceptions: { en: "A quarantine of up to about 15 days may be imposed if disease is suspected or paperwork is deficient.", fr: "Une quarantaine pouvant aller jusqu'à ~15 jours peut être imposée en cas de suspicion de maladie ou de documents incomplets.", es: "Puede imponerse una cuarentena de hasta unos 15 días si se sospecha enfermedad o la documentación es deficiente.", pt: "Uma quarentena de até cerca de 15 dias pode ser imposta em caso de suspeita de doença ou de documentação incompleta." }
    ref: { en: "GOVS Veterinary Quarantine (WOAH)", fr: "Quarantaine vétérinaire GOVS (WOAH)", es: "Cuarentena veterinaria de la GOVS (WOAH)", pt: "Quarentena veterinária GOVS (WOAH)" }

origin:
  scheme: eu
  eu:
    title: { en: "From Europe / the EU", fr: "Depuis l'Europe / l'UE", es: "Desde Europa / la UE", pt: "Da Europa / da UE" }
    body:
      en: "There is no EU pet-passport shortcut into Egypt: the EU passport is not an Egyptian document. A dog from Europe needs a valid rabies vaccination (at least 30 days old), the core dog vaccinations, parasite treatment and an official international veterinary health certificate endorsed by the government vet before departure. No antibody test is required."
      fr: "Aucun raccourci « passeport européen » pour entrer en Égypte : le passeport UE n'est pas un document égyptien. Un chien venant d'Europe a besoin d'une vaccination antirabique valide (d'au moins 30 jours), des vaccinations canines de base, d'un traitement antiparasitaire et d'un certificat vétérinaire international officiel visé par le vétérinaire gouvernemental avant le départ. Aucun titrage n'est requis."
      es: "No hay ningún atajo de pasaporte europeo para mascotas para entrar en Egipto: el pasaporte de la UE no es un documento egipcio. Un perro procedente de Europa necesita una vacunación antirrábica válida (de al menos 30 días), las vacunas caninas básicas, tratamiento antiparasitario y un certificado sanitario veterinario internacional oficial refrendado por el veterinario gubernamental antes de la salida. No se exige prueba de titulación."
      pt: "Não existe atalho de «passaporte europeu para animais» para entrar no Egito: o passaporte da UE não é um documento egípcio. Um cachorro vindo da Europa precisa de vacinação antirrábica válida (com pelo menos 30 dias), das vacinas caninas básicas, de tratamento antiparasitário e de um certificado veterinário internacional oficial endossado pelo veterinário governamental antes da partida. Nenhum teste sorológico é exigido."
    cls: warn
  listed:
    title: { en: "From a rabies-controlled country", fr: "Depuis un pays à rage maîtrisée", es: "Desde un país con la rabia controlada", pt: "De um país com a raiva controlada" }
    body:
      en: "From countries with a controlled rabies situation (United States, Canada, Gulf states, most of Europe and others), the base scheme applies: microchip (recommended), valid rabies vaccination, core vaccinations, parasite treatment and an endorsed health certificate. No blood test, and normally no quarantine on arrival if the dog is healthy and documents are in order."
      fr: "Depuis les pays à situation rabique maîtrisée (États-Unis, Canada, pays du Golfe, la plupart de l'Europe, etc.), le schéma de base s'applique : puce (recommandée), vaccination antirabique valide, vaccinations de base, traitement antiparasitaire et certificat sanitaire visé. Pas de prise de sang, et normalement pas de quarantaine à l'arrivée si le chien est sain et les documents en règle."
      es: "Desde países con una situación de rabia controlada (Estados Unidos, Canadá, países del Golfo, la mayor parte de Europa y otros), se aplica el esquema básico: microchip (recomendado), vacunación antirrábica válida, vacunas básicas, tratamiento antiparasitario y un certificado sanitario refrendado. Sin análisis de sangre y, normalmente, sin cuarentena a la llegada si el perro está sano y los documentos en regla."
      pt: "Nos países com situação de raiva controlada (Estados Unidos, Canadá, países do Golfo, a maior parte da Europa e outros), aplica-se o esquema básico: microchip (recomendado), vacinação antirrábica válida, vacinas básicas, tratamento antiparasitário e um atestado de saúde endossado. Nenhuma coleta de sangue e, normalmente, nenhuma quarentena na chegada se o cachorro estiver saudável e a documentação em ordem."
    cls: warn
  nonListed:
    title: { en: "From a high-rabies-risk country", fr: "Depuis un pays à haut risque rabique", es: "Desde un país con alto riesgo de rabia", pt: "De um país de alto risco de raiva" }
    body:
      en: "Egypt does not add a mandatory antibody test even for high-risk origins, but the health certificate must confirm the dog is not from an area under rabies restriction and has not been exposed to rabies. Dogs from a rabies-quarantined zone may be refused or held for examination. Expect closer scrutiny at the airport and keep original documents ready."
      fr: "L'Égypte n'ajoute pas de titrage obligatoire, même pour les origines à haut risque, mais le certificat sanitaire doit confirmer que le chien ne provient pas d'une zone sous restriction rabique et n'a pas été exposé à la rage. Un chien venant d'une zone sous quarantaine rabique peut être refusé ou retenu pour examen. Attends-toi à un contrôle renforcé à l'aéroport et garde les documents originaux prêts."
      es: "Egipto no añade una prueba de titulación obligatoria ni siquiera para orígenes de alto riesgo, pero el certificado sanitario debe confirmar que el perro no procede de una zona bajo restricción por rabia y que no ha estado expuesto a la rabia. Los perros procedentes de una zona bajo cuarentena por rabia pueden ser rechazados o retenidos para examen. Espera un control más estricto en el aeropuerto y ten listos los documentos originales."
      pt: "O Egito não acrescenta um teste sorológico obrigatório nem mesmo para origens de alto risco, mas o atestado de saúde deve confirmar que o cachorro não vem de uma área sob restrição por raiva e não foi exposto à raiva. Cachorros vindos de uma zona sob quarentena por raiva podem ser recusados ou retidos para exame. Espere um controle mais rigoroso no aeroporto e mantenha os documentos originais à mão."
    cls: no

arrival:
  intro:
    en: "When your dog reaches Egypt, GOVS veterinary quarantine handles the check at the airport."
    fr: "À l'arrivée de ton chien en Égypte, la quarantaine vétérinaire GOVS effectue le contrôle à l'aéroport."
    es: "Cuando tu perro llega a Egipto, la cuarentena veterinaria de la GOVS se encarga del control en el aeropuerto."
    pt: "Quando o seu cachorro chega ao Egito, é a quarentena veterinária da GOVS que faz a conferência no aeroporto."
  points:
    - en: "GOVS is the sole authority that inspects arriving pets and issues/clears veterinary documents at ports of entry."
      fr: "La GOVS est la seule autorité qui inspecte les animaux à l'arrivée et valide les documents vétérinaires aux points d'entrée."
      es: "La GOVS es la única autoridad que inspecciona a las mascotas que llegan y expide/tramita los documentos veterinarios en los puntos de entrada."
      pt: "A GOVS é a única autoridade que inspeciona os animais de estimação que chegam e emite/libera os documentos veterinários nos pontos de entrada."
    - en: "Present the original vaccination booklet, microchip record and the endorsed health certificate — carry originals, not copies."
      fr: "Présente le carnet de vaccination original, le justificatif de puce et le certificat sanitaire visé — munis-toi des originaux, pas de copies."
      es: "Presenta la cartilla de vacunación original, el registro del microchip y el certificado sanitario refrendado — lleva los originales, no copias."
      pt: "Apresente a carteira de vacinação original, o comprovante do microchip e o atestado de saúde endossado — leve os originais, não cópias."
    - en: "The dog must be free of signs of contagious disease at inspection; a healthy dog with complete papers is normally cleared without quarantine."
      fr: "Le chien ne doit présenter aucun signe de maladie contagieuse à l'inspection ; un chien sain avec des papiers complets passe normalement sans quarantaine."
      es: "El perro no debe presentar signos de enfermedad contagiosa en la inspección; un perro sano con los papeles completos suele pasar sin cuarentena."
      pt: "O cachorro deve estar sem sinais de doença contagiosa na inspeção; um cachorro saudável com a documentação completa normalmente é liberado sem quarentena."
    - en: "Arrive on a weekday during office hours where possible, to ensure timely clearance through customs and the on-duty state vet."
      fr: "Arrive si possible en semaine et pendant les heures de bureau, pour un dédouanement rapide auprès de la douane et du vétérinaire d'État de service."
      es: "Llega, si es posible, en día laborable y en horario de oficina, para asegurar un despacho ágil en aduanas y con el veterinario oficial de guardia."
      pt: "Chegue, sempre que possível, em um dia útil e no horário comercial, para garantir a liberação em tempo pela alfândega e pelo veterinário oficial de plantão."
    - en: "If documents are missing or the dog looks unwell, GOVS may order further examination, a short quarantine (up to ~15 days), or refuse entry."
      fr: "Si les documents manquent ou si le chien semble malade, la GOVS peut ordonner un examen complémentaire, une courte quarantaine (jusqu'à ~15 jours) ou refuser l'entrée."
      es: "Si faltan documentos o el perro parece enfermo, la GOVS puede ordenar un examen adicional, una cuarentena breve (hasta ~15 días) o denegar la entrada."
      pt: "Se faltarem documentos ou se o cachorro parecer doente, a GOVS pode determinar um exame adicional, uma quarentena curta (até ~15 dias) ou recusar a entrada."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Egypt regulates dangerous dogs under Law 29/2023 on the possession of dangerous animals and dogs, enforced by GOVS. The list of prohibited breeds was later narrowed by ministerial decree, splitting affected breeds into an outright-banned group and a licence-required group."
    fr: "L'Égypte réglemente les chiens dangereux par la loi 29/2023 sur la détention d'animaux et de chiens dangereux, appliquée par la GOVS. La liste des races interdites a ensuite été réduite par décret ministériel, séparant les races concernées en un groupe totalement interdit et un groupe soumis à licence."
    es: "Egipto regula los perros peligrosos mediante la Ley 29/2023 sobre la tenencia de animales y perros peligrosos, aplicada por la GOVS. La lista de razas prohibidas se redujo después mediante decreto ministerial, dividiendo las razas afectadas en un grupo totalmente prohibido y un grupo que requiere licencia."
    pt: "O Egito regulamenta os cachorros perigosos pela Lei 29/2023 sobre a posse de animais e cachorros perigosos, aplicada pela GOVS. A lista de raças proibidas foi depois reduzida por decreto ministerial, dividindo as raças afetadas em um grupo totalmente proibido e um grupo que exige licença."
  cat1:
    en: "Banned breeds: a 2024 ministerial decree (Official Gazette) narrowed the prohibited list to three breeds — the Fila Brasileiro (Brazilian Mastiff), the South African Boerboel, and the Presa Canario (Dogo Canario). These may not be kept or imported."
    fr: "Races interdites : un décret ministériel de 2024 (Journal officiel) a réduit la liste interdite à trois races — le Fila Brasileiro (mastiff brésilien), le Boerboel sud-africain et le Presa Canario (Dogo Canario). Ces races ne peuvent être ni détenues ni importées."
    es: "Razas prohibidas: un decreto ministerial de 2024 (Boletín Oficial) redujo la lista prohibida a tres razas — el Fila Brasileiro (mastín brasileño), el Boerboel sudafricano y el Presa Canario (Dogo Canario). No pueden tenerse ni importarse."
    pt: "Raças proibidas: um decreto ministerial de 2024 (Diário Oficial) reduziu a lista de proibições a três raças — o Fila Brasileiro (mastim brasileiro), o Boerboel sul-africano e o Presa Canario (Dogo Canario). Elas não podem ser mantidas nem importadas."
  cat2:
    en: "Licence-required (restricted) breeds: around 16 breeds — including the pit bull, Rottweiler, German Shepherd, boxer, husky, Caucasian Shepherd, bullmastiff, Doberman, Alaskan Malamute, Great Dane, Akita, American Bully, Alabai (Central Asian Shepherd), Cane Corso, Dogo Argentino and Tosa Inu — are allowed only under a government safety/licensing process, and may be confiscated if not licensed. Confirm current status with GOVS before travelling."
    fr: "Races sous licence (restreintes) : une seizaine de races — dont le pit-bull, le Rottweiler, le berger allemand, le boxer, le husky, le berger du Caucase, le bullmastiff, le doberman, le malamute d'Alaska, le dogue allemand, l'akita, l'American Bully, l'alabai (berger d'Asie centrale), le cane corso, le dogue argentin et le tosa — ne sont admises que dans le cadre d'une procédure gouvernementale de sécurité/licence, et peuvent être confisquées faute de licence. Vérifie le statut à jour auprès de la GOVS avant de voyager."
    es: "Razas restringidas (con licencia): alrededor de 16 razas — entre ellas el pit bull, el Rottweiler, el pastor alemán, el bóxer, el husky, el pastor del Cáucaso, el bullmastiff, el dóberman, el malamute de Alaska, el gran danés, el akita, el American Bully, el alabai (pastor de Asia Central), el cane corso, el dogo argentino y el tosa inu — solo se admiten mediante un proceso gubernamental de seguridad/licencia, y pueden ser confiscadas si no tienen licencia. Confirma el estado actual con la GOVS antes de viajar."
    pt: "Raças que exigem licença (restritas): cerca de 16 raças — incluindo pit bull, rottweiler, pastor-alemão, boxer, husky, pastor-do-cáucaso, bullmastiff, doberman, malamute-do-alasca, dogue alemão, akita, american bully, alabai (pastor-da-ásia-central), cane corso, dogo argentino e tosa inu — só são permitidas mediante um processo governamental de segurança/licenciamento, e podem ser confiscadas se não estiverem licenciadas. Confirme a situação atual com a GOVS antes de viajar."
  note:
    en: "Breed rules have changed repeatedly since 2023; before booking, verify the current banned and licence-required lists directly with GOVS or an Egyptian consulate, as the exact breeds can be updated by decree."
    fr: "Les règles de races ont changé plusieurs fois depuis 2023 ; avant de réserver, vérifie les listes à jour des races interdites et sous licence directement auprès de la GOVS ou d'un consulat égyptien, car les races exactes peuvent être modifiées par décret."
    es: "Las normas sobre razas han cambiado varias veces desde 2023; antes de reservar, verifica las listas actuales de razas prohibidas y con licencia directamente con la GOVS o un consulado egipcio, ya que las razas exactas pueden actualizarse por decreto."
    pt: "As regras sobre raças mudaram várias vezes desde 2023; antes de reservar, verifique as listas atuais de raças proibidas e de raças que exigem licença diretamente com a GOVS ou com um consulado egípcio, pois as raças exatas podem ser atualizadas por decreto."

checklist:
  - en: "ISO microchip (recommended) implanted before the rabies vaccination"
    fr: "Puce ISO (recommandée) posée avant la vaccination antirabique"
    es: "Microchip ISO (recomendado) implantado antes de la vacunación antirrábica"
    pt: "Microchip ISO (recomendado) implantado antes da vacinação antirrábica"
