# Country Entry Guide — Egypt (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_eg
iso2: "EG"
name: { en: "Egypt", fr: "Égypte", es: "Egipto", pt: "Egito" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
domestic:
  intro:
    en: "Domestic flight in Egypt: no travel certificate is required, but owning a dog requires a licence and several common breeds are classed as dangerous."
    fr: "Vol intérieur en Égypte : aucun certificat de voyage n'est exigé, mais détenir un chien requiert une licence et plusieurs races courantes sont classées dangereuses."
    es: "Vuelo nacional en Egipto: no se exige certificado de viaje, pero tener un perro requiere licencia y varias razas comunes se clasifican como peligrosas."
    pt: "Voo doméstico no Egito: nenhum certificado de viagem é exigido, mas ter um cachorro exige uma licença e várias raças comuns são classificadas como perigosas."
  points:
    - en: "Rabies vaccination is a general legal obligation, and keeping a dog requires a possession licence from the veterinary services. Identification is by numbered collar tag, not microchip."
      fr: "La vaccination antirabique est une obligation légale générale, et détenir un chien exige une licence de possession délivrée par les services vétérinaires. L'identification se fait par médaille numérotée, pas par puce."
      es: "La vacuna antirrábica es una obligación legal general, y tener un perro exige una licencia de posesión de los servicios veterinarios. La identificación es por chapa numerada, no por microchip."
      pt: "A vacinação antirrábica é uma obrigação legal geral, e manter um cachorro exige uma licença de posse emitida pelos serviços veterinários. A identificação é feita por plaqueta numerada na coleira, não por microchip."
    - en: "The law treats transporting an animal from one place to another as 'circulation', and breeds listed as dangerous — German Shepherd, Rottweiler, Boxer, Husky, Doberman among others — may not circulate without a licence. Confirm your breed's status before booking."
      fr: "La loi assimile le transport d'un animal d'un lieu à un autre à une « circulation », et les races classées dangereuses — berger allemand, rottweiler, boxer, husky, doberman notamment — ne peuvent circuler sans licence. Vérifie le statut de ta race avant de réserver."
      es: "La ley asimila transportar un animal de un lugar a otro a «circulación», y las razas clasificadas como peligrosas — pastor alemán, rottweiler, bóxer, husky, doberman entre otras — no pueden circular sin licencia. Verifica el estatus de tu raza antes de reservar."
      pt: "A lei trata o transporte de um animal de um lugar a outro como «circulação», e as raças listadas como perigosas — pastor-alemão, rottweiler, boxer, husky, doberman, entre outras — não podem circular sem licença. Confirme a situação da sua raça antes de reservar."
    - en: "Whatever the airline asks for (health certificate, vaccination record, breed or crate rules) is its own commercial policy, not a legal requirement — check with your carrier."
      fr: "Ce que la compagnie demande (certificat de santé, carnet de vaccination, règles de race ou de caisse) relève de sa politique commerciale, pas d'une obligation légale — vérifie auprès d'elle."
      es: "Lo que pida la aerolínea (certificado de salud, cartilla de vacunación, reglas de raza o jaula) es su política comercial, no una obligación legal — consúltalo con ella."
      pt: "Tudo o que a companhia aérea pedir (atestado de saúde, carteira de vacinação, regras de raça ou de caixa de transporte) é política comercial dela, não exigência legal — confirme com a sua companhia."
exit:
  authority: GOVS
  authorityUrl: https://www.govs.gov.eg
  intro:
    en: "Egypt is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus a health certificate endorsed by the General Organization for Veterinary Services (GOVS)."
    fr: "L'Égypte est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire visé par l'Organisation générale des services vétérinaires (GOVS)."
    es: "Egipto no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario refrendado por la Organización General de Servicios Veterinarios (GOVS)."
    pt: "O Egito é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde endossado pela General Organization for Veterinary Services (GOVS)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: eu
      text:
        en: "GOVS veterinary quarantine endorses the EU entry health certificate at the port before departure — a private-vet certificate alone is not enough."
        fr: "La quarantaine vétérinaire de la GOVS vise le certificat sanitaire d'entrée UE au port avant le départ — un certificat de vétérinaire privé seul ne suffit pas."
        es: "La cuarentena veterinaria de la GOVS refrenda el certificado sanitario de entrada a la UE en el puerto antes de salir — un certificado de veterinario privado por sí solo no basta."
        pt: "A quarentena veterinária da GOVS endossa o atestado de saúde de entrada na UE no porto antes da partida — um certificado de veterinário particular sozinho não basta."
    - timing: window
      scope: non_eu
      text:
        en: "GOVS veterinary quarantine endorses the health certificate at the port before departure — a private-vet certificate alone is not enough."
        fr: "La quarantaine vétérinaire du GOVS vise le certificat sanitaire au port avant le départ — un certificat de vétérinaire privé seul ne suffit pas."
        es: "La cuarentena veterinaria del GOVS valida el certificado sanitario en el puerto antes de la salida — un certificado de veterinario privado por sí solo no basta."
        pt: "A quarentena veterinária do GOVS endossa o certificado sanitário no porto antes da partida — só o certificado de um veterinário particular não basta."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Egypt with your dog", fr: "Voyager en Égypte avec ton chien", es: "Viajar a Egipto con tu perro", pt: "Viajar para o Egito com o seu cachorro" }
  intro:
    en: >-
      Egypt welcomes pet dogs, and its entry rules are set by its own veterinary authority — the
      General Organization for Veterinary Services (GOVS), part of the Ministry of Agriculture and
      Land Reclamation — not by the EU framework. The core requirements are the same wherever you fly
      from: a valid rabies vaccination, an official international veterinary health certificate issued
      shortly before departure, and a veterinary inspection on arrival. A microchip is recommended for
      identification. Good news for many travellers: Egypt does not require a rabies antibody (blood)
      test to enter from any country. What changes with your origin is mainly the disease situation of
      your departure country, which the health certificate must reflect. This guide explains exactly
      what to prepare before you book your flight.
    fr: >-
      L'Égypte accueille les chiens de compagnie, et ses règles d'entrée sont fixées par sa propre
      autorité vétérinaire — la General Organization for Veterinary Services (GOVS), rattachée au
      ministère de l'Agriculture et de la Mise en valeur des terres — et non par le cadre européen.
      Les exigences de base sont les mêmes quel que soit le pays de départ : une vaccination
      antirabique valide, un certificat vétérinaire international officiel établi peu avant le départ,
      et une inspection vétérinaire à l'arrivée. Une puce électronique est recommandée pour
      l'identification. Bonne nouvelle : l'Égypte n'exige pas de test de titrage (prise de sang)
      antirabique pour entrer, quel que soit le pays d'origine. Ce qui change selon l'origine, c'est
      surtout la situation sanitaire du pays de départ, que le certificat doit refléter. Ce guide
      détaille exactement quoi préparer avant de réserver ton vol.
    es: >-
      Egipto acoge a los perros de compañía, y sus normas de entrada las fija su propia autoridad
      veterinaria — la General Organization for Veterinary Services (GOVS), adscrita al Ministerio de
      Agricultura y Recuperación de Tierras — y no el marco de la UE. Los requisitos básicos son los
      mismos sea cual sea el país de salida: una vacunación antirrábica válida, un certificado
      sanitario veterinario internacional oficial expedido poco antes de la salida, y una inspección
      veterinaria a la llegada. Se recomienda un microchip para la identificación. Buena noticia para
      muchos viajeros: Egipto no exige una prueba de titulación de rabia (análisis de sangre) para
      entrar desde ningún país. Lo que cambia según el origen es sobre todo la situación sanitaria de
      tu país de salida, que el certificado sanitario debe reflejar. Esta guía explica exactamente qué
      preparar antes de reservar tu vuelo.

    pt: "O Egito acolhe cachorros de estimação, e suas regras de entrada são definidas pela sua própria autoridade veterinária — a General Organization for Veterinary Services (GOVS), vinculada ao Ministério da Agricultura e da Recuperação de Terras — e não pelo marco da UE. As exigências básicas são as mesmas, seja qual for o país de partida: uma vacinação antirrábica válida, um certificado veterinário internacional oficial emitido pouco antes da partida e uma inspeção veterinária na chegada. Um microchip é recomendado para a identificação. Boa notícia para muitos viajantes: o Egito não exige teste sorológico antirrábico (coleta de sangue) para entrar, seja qual for o país de origem. O que muda conforme a origem é sobretudo a situação sanitária do país de partida, que o atestado de saúde deve refletir. Este guia explica exatamente o que preparar antes de você reservar o seu voo."
difficulty:
  level: moderate
  label: { en: "Moderate — clear rules, careful timing", fr: "Modérée — règles claires, calendrier à respecter", es: "Moderada — reglas claras, calendario cuidadoso", pt: "Moderado — regras claras, prazos a planejar com cuidado" }

prepTime:
  eu:
    en: "~4–5 weeks from Europe: rabies shot must be at least 30 days old, plus a health certificate issued within ~10–14 days of travel."
    fr: "~4–5 semaines depuis l'Europe : le vaccin antirabique doit dater d'au moins 30 jours, plus un certificat sanitaire établi dans les ~10–14 jours avant le voyage."
    es: "~4–5 semanas desde Europa: la vacuna antirrábica debe tener al menos 30 días, más un certificado sanitario expedido dentro de los ~10–14 días previos al viaje."
    pt: "~4–5 semanas a partir da Europa: a vacina antirrábica deve ter pelo menos 30 dias, mais um atestado de saúde emitido no prazo de ~10–14 dias antes da viagem."
  listed:
    en: "~4–5 weeks from a rabies-controlled country: same 30-day post-vaccination wait and a short-validity health certificate."
    fr: "~4–5 semaines depuis un pays à rage maîtrisée : même délai de 30 jours après le vaccin et un certificat sanitaire à validité courte."
    es: "~4–5 semanas desde un país con la rabia controlada: la misma espera de 30 días tras la vacuna y un certificado sanitario de valide corta."
    pt: "~4–5 semanas a partir de um país com a raiva controlada: a mesma espera de 30 dias após a vacinação e um atestado de saúde de validade curta."
  nonListed:
    en: "~4–6 weeks from a high-rabies-risk country: same base steps, but dogs from areas under rabies restriction may face extra checks or refusal."
    fr: "~4–6 semaines depuis un pays à haut risque rabique : mêmes étapes de base, mais un chien venant d'une zone sous restriction rabique peut subir des contrôles supplémentaires ou un refus."
    es: "~4–6 semanas desde un país con alto riesgo de rabia: los mismos pasos básicos, pero los perros procedentes de zonas bajo restricción por rabia pueden sufrir controles adicionales o el rechazo."
    pt: "~4–6 semanas a partir de um país de alto risco de raiva: as mesmas etapas básicas, mas cachorros vindos de áreas sob restrição por raiva podem enfrentar controles adicionais ou recusa."

