    exceptions: { en: "First rabies shot may be given from 12 weeks of age; puppies must be at least 4 months old to travel.", fr: "La primo-vaccination peut être faite dès 12 semaines ; un chiot doit avoir au moins 4 mois pour voyager.", es: "La primera vacuna antirrábica puede administrarse a partir de las 12 semanas; los cachorros deben tener al menos 4 meses para viajar.", pt: "A primeira dose antirrábica pode ser aplicada a partir das 12 semanas de idade; filhotes devem ter pelo menos 4 meses para viajar." }
