  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Egypt (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — l'Égypte (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Egipto (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — o Egito (o seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Egypt", fr: "Pays de destination — Égypte", es: "País de destino — Egipto", pt: "País de destino — Egito" }
      text:
        en: "Egypt applies its own GOVS scheme: a valid rabies vaccination and an official international veterinary health certificate are always required, and every dog is inspected on arrival. No rabies antibody test is required."
        fr: "L'Égypte applique son propre schéma GOVS : une vaccination antirabique valide et un certificat vétérinaire international officiel sont toujours exigés, et chaque chien est inspecté à l'arrivée. Aucun titrage antirabique n'est requis."
        es: "Egipto aplica su propio esquema de la GOVS: siempre se exigen una vacunación antirrábica válida y un certificado sanitario veterinario internacional oficial, y todo perro es inspeccionado a la llegada. No se exige prueba de titulación de rabia."
        pt: "O Egito aplica o seu próprio esquema da GOVS: uma vacinação antirrábica válida e um certificado veterinário internacional oficial são sempre exigidos, e todo cachorro é inspecionado na chegada. Nenhum teste sorológico antirrábico é exigido."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The health certificate must confirm your dog does not come from an area under rabies restriction. The disease status of your departure country shapes what the official vet must certify."
        fr: "Le certificat sanitaire doit confirmer que ton chien ne provient pas d'une zone sous restriction rabique. La situation sanitaire du pays de départ détermine ce que le vétérinaire officiel doit certifier."
        es: "El certificado sanitario debe confirmar que tu perro no procede de una zona bajo restricción por rabia. La situación sanitaria de tu país de salida determina lo que el veterinario oficial debe certificar."
        pt: "O atestado de saúde deve confirmar que o seu cachorro não vem de uma área sob restrição por raiva. A situação sanitária do seu país de partida determina o que o veterinário oficial deve certificar."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay in a rabies-quarantined or high-risk area can trigger extra scrutiny at the airport. It is your dog's real origin and history that count — not only the last airport."
        fr: "Un séjour récent dans une zone sous quarantaine rabique ou à haut risque peut entraîner un contrôle renforcé à l'aéroport. C'est l'origine réelle et l'historique du chien qui comptent — pas seulement l'aéroport de destination finale."
        es: "Una estancia reciente en una zona bajo cuarentena por rabia o de alto riesgo puede provocar un control reforzado en el aeropuerto. Lo que cuenta es el origen y el historial reales de tu perro — no solo el último aeropuerto."
        pt: "Uma estadia recente em uma área sob quarentena por raiva ou de alto risco pode gerar um controle reforçado no aeroporto. O que conta é a origem real e o histórico do seu cachorro — não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Egypt's framework, then confirm your dog's exact origin and history with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre égyptien, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Egipto y luego confirma el origen y el historial exactos de tu perro con tu veterinario."
    pt: "Portanto, leia as exigências abaixo como o marco egípcio e depois confirme com o seu veterinário a origem e o histórico exatos do seu cachorro."

requirements:
