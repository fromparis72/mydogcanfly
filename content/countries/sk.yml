origin:
  scheme: eu
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate and normally no border check."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire et normalement pas de contrôle frontalier."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario y normalmente sin control fronterizo."
      pt: "Um cachorro vindo de outro país da UE precisa de um passaporte europeu que comprove um microchip ISO válido e uma vacinação antirrábica em dia. Sem teste sorológico, sem certificado sanitário e, normalmente, sem controle de fronteira."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Switzerland, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination and an EU animal health certificate endorsed by an official vet before departure. No antibody test is required; enter via a travellers' point of entry and contact the authority present for the check."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Suisse, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire européen visé par un vétérinaire officiel avant le départ. Pas de titrage ; entre par un point d'entrée voyageurs et contacte l'autorité présente pour le contrôle."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Suiza, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal de la UE refrendado por un veterinario oficial antes de la salida. No se exige prueba de titulación; entra por un punto de entrada de viajeros y contacta con la autoridad presente para el control."
      pt: "Vindo de um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Suíça, Japão, Austrália e outros), seu cachorro precisa de microchip, vacinação antirrábica válida e um certificado sanitário europeu endossado por um veterinário oficial antes da partida. Não é exigido teste sorológico; entre por um ponto de entrada de viajantes e procure a autoridade presente para o controle."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-designated laboratory, then a compulsory 3-month wait before entry. An endorsed EU animal health certificate is also required."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen visé est également requis."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exige un certificado sanitario animal de la UE refrendado."
      pt: "Vindo de um país não listado (de risco), acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório designado pela UE, e depois 3 meses obrigatórios de espera antes da entrada. Também é exigido um certificado sanitário europeu endossado."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Slovakia depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien en Slovaquie dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Eslovaquia depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega à Eslováquia depende do país de onde você veio."
  points:
    - from: eu
      en: "From another EU country: no systematic border check — keep the EU pet passport with you."
      fr: "Depuis un autre pays de l'UE : pas de contrôle systématique — garde le passeport européen sur toi."
      es: "Desde otro país de la UE: sin control fronterizo sistemático — lleva contigo el pasaporte europeo."
      pt: "De outro país da UE: sem controle de fronteira sistemático — leve o passaporte europeu com você."
    - from: non_eu
      en: "From outside the EU: enter via a designated travellers' point of entry and contact the competent authority (veterinary/customs) present for the documentary and identity check."
      fr: "Depuis hors UE : entre par un point d'entrée voyageurs désigné et contacte l'autorité compétente (vétérinaire/douane) présente pour le contrôle documentaire et d'identité."
      es: "Desde fuera de la UE: entra por un punto de entrada de viajeros designado y contacta con la autoridad competente (veterinaria/aduanas) presente para el control documental y de identidad."
      pt: "De fora da UE: entre por um ponto de entrada de viajantes designado e procure a autoridade competente presente (serviço veterinário ou alfândega) para o controle documental e de identidade."
    - en: "No import permit is issued and no prior appointment is needed for a non-commercial pet."
      fr: "Aucun permis d'import n'est délivré et aucun rendez-vous préalable n'est nécessaire pour un animal de compagnie non commercial."
      es: "No se expide ningún permiso de importación ni se necesita cita previa para una mascota no comercial."
      pt: "Não é emitida nenhuma autorização de importação e não é preciso agendamento prévio para um animal de estimação não comercial."
    - en: "Carry the original documents (not copies); an official Slovak translation may be requested if they are in another language."
      fr: "Munis-toi des documents originaux (pas de copies) ; une traduction officielle en slovaque peut être exigée s'ils sont dans une autre langue."
      es: "Lleva los documentos originales (no copias); puede exigirse una traducción oficial al eslovaco si están en otro idioma."
      pt: "Leve os documentos originais (não cópias); uma tradução oficial para o eslovaco pode ser exigida se eles estiverem em outro idioma."
    - en: "If documents are missing or invalid, authorities may refuse entry, order quarantine at the owner's expense or, in the worst case, euthanasia."
      fr: "Si les documents manquent ou sont invalides, les autorités peuvent refuser l'entrée, ordonner une quarantaine aux frais du propriétaire ou, au pire, l'euthanasie."
      es: "Si faltan documentos o no son válidos, las autoridades pueden denegar la entrada, ordenar la cuarentena a cargo del propietario o, en el peor de los casos, la eutanasia."
      pt: "Se faltarem documentos ou eles não forem válidos, as autoridades podem recusar a entrada, determinar a quarentena às custas do dono ou, na pior das hipóteses, a eutanásia."
    - en: "Slovakia sets no breed-based entry restriction, so no dog is refused entry on breed grounds alone."
      fr: "La Slovaquie n'impose aucune restriction d'entrée liée à la race ; aucun chien n'est donc refusé à l'entrée pour ce seul motif."
      es: "Eslovaquia no impone ninguna restricción de entrada basada en la raza, por lo que ningún perro es rechazado a la entrada solo por su raza."
      pt: "A Eslováquia não impõe nenhuma restrição de entrada baseada na raça, então nenhum cachorro tem a entrada recusada só por causa da raça."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Slovakia sets no breed-specific import ban: the State Veterinary and Food Administration (ŠVPS SR) states plainly that Slovakia has no special requirements for particular breeds and that entry conditions do not differ by breed. There is also no restriction on dogs with cropped ears or docked tails entering Slovakia. Breed rules are a matter of owner responsibility under national law, not an entry barrier."
    fr: "La Slovaquie n'impose aucune interdiction d'importation liée à la race : l'administration vétérinaire et alimentaire d'État (ŠVPS SR) indique clairement qu'elle n'a aucune exigence particulière selon les races et que les conditions d'entrée ne diffèrent pas selon la race. Aucune restriction ne s'applique non plus aux chiens aux oreilles ou à la queue coupées. Les règles de race relèvent de la responsabilité du propriétaire selon le droit national, et non d'une barrière à l'entrée."
    es: "Eslovaquia no impone ninguna prohibición de importación por raza: la Administración Estatal Veterinaria y Alimentaria (ŠVPS SR) indica claramente que Eslovaquia no tiene requisitos especiales para razas concretas y que las condiciones de entrada no varían según la raza. Tampoco hay restricción para la entrada en Eslovaquia de perros con orejas o cola cortadas. Las normas sobre razas son una cuestión de responsabilidad del propietario conforme al derecho nacional, no una barrera de entrada."
    pt: "A Eslováquia não impõe nenhuma proibição de importação específica por raça: a Administração Estatal Veterinária e Alimentar (ŠVPS SR — Štátna veterinárna a potravinová správa) afirma claramente que a Eslováquia não tem exigências especiais para determinadas raças e que as condições de entrada não variam conforme a raça. Também não há restrição à entrada na Eslováquia de cachorros com orelhas cortadas ou cauda amputada. As regras sobre raças são matéria de responsabilidade do dono na legislação nacional, e não uma barreira de entrada."
  cat1:
    en: "No prohibited breeds for entry. Unlike some EU countries, Slovakia keeps no list of banned or 'category 1' breeds and imposes no import ban, muzzle-at-the-border or permit requirement tied to a dog's breed. Wolf-type crosses, bull-type terriers and molossers may enter under the ordinary EU pet-movement rules."
    fr: "Aucune race interdite à l'entrée. Contrairement à certains pays de l'UE, la Slovaquie ne tient aucune liste de races interdites ou de « catégorie 1 » et n'impose ni interdiction d'importation, ni muselière à la frontière, ni permis liés à la race d'un chien. Les croisements de type loup, les terriers de type bull et les molosses peuvent entrer selon les règles européennes ordinaires de mouvement des animaux."
    es: "Ninguna raza prohibida para la entrada. A diferencia de algunos países de la UE, Eslovaquia no mantiene ninguna lista de razas prohibidas o de «categoría 1» ni impone prohibición de importación, bozal en la frontera o permiso ligado a la raza de un perro. Los cruces de tipo lobo, los terriers de tipo bull y los molosos pueden entrar según las normas europeas ordinarias de movimiento de animales."
    pt: "Nenhuma raça proibida na entrada. Ao contrário de alguns países da UE, a Eslováquia não mantém lista de raças banidas ou de “categoria 1” e não impõe proibição de importação, focinheira na fronteira nem exigência de autorização vinculada à raça do cachorro. Cruzamentos do tipo lobo, terriers do tipo bull e molossos podem entrar segundo as regras europeias comuns de circulação de animais de estimação."
  cat2:
    en: "Behaviour-based 'dangerous dog' rules (domestic). Under Act No. 282/2002 on keeping dogs, a 'dangerous dog' (nebezpečný pes) is any dog that has bitten or injured a person unprovoked — this is defined by behaviour, not by breed. All dogs kept in Slovakia for more than 90 days must be registered with the municipality, which issues an ID tag noting whether the dog is 'dangerous'; a dangerous dog must be led by an adult and muzzled in public. These are ownership rules for residents, not entry requirements for visitors."
    fr: "Règles « chien dangereux » fondées sur le comportement (droit interne). Selon la loi n° 282/2002 sur la détention des chiens, un « chien dangereux » (nebezpečný pes) est tout chien ayant mordu ou blessé une personne sans provocation — défini par le comportement, non par la race. Tout chien détenu en Slovaquie plus de 90 jours doit être enregistré auprès de la commune, qui délivre une médaille indiquant si le chien est « dangereux » ; un chien dangereux doit être tenu par un adulte et muselé en public. Ce sont des règles de détention pour les résidents, pas des conditions d'entrée pour les visiteurs."
    es: "Normas de «perro peligroso» basadas en el comportamiento (derecho interno). Según la Ley n.º 282/2002 sobre la tenencia de perros, un «perro peligroso» (nebezpečný pes) es todo perro que haya mordido o herido a una persona sin provocación — se define por el comportamiento, no por la raza. Todo perro que permanezca en Eslovaquia más de 90 días debe inscribirse en el municipio, que expide una chapa de identificación que indica si el perro es «peligroso»; un perro peligroso debe ir conducido por un adulto y con bozal en público. Son normas de tenencia para los residentes, no requisitos de entrada para los visitantes."
    pt: "Regras de “cachorro perigoso” baseadas no comportamento (âmbito interno). Segundo a Lei nº 282/2002 sobre a posse de cachorros, “cachorro perigoso” (nebezpečný pes) é todo cachorro que mordeu ou feriu uma pessoa sem provocação — a definição vem do comportamento, não da raça. Todo cachorro mantido na Eslováquia por mais de 90 dias precisa ser registrado no município, que emite uma plaqueta de identificação indicando se o cachorro é “perigoso”; um cachorro perigoso deve ser conduzido por um adulto e usar focinheira em público. Essas são regras de posse para residentes, não exigências de entrada para visitantes."
  note:
    en: "If your dog merely resembles a breed some other countries restrict, that has no bearing on entering Slovakia. If you plan to reside in Slovakia, ask your municipality about dog registration. For transit through neighbouring countries, check each country's own breed rules separately."
    fr: "Si ton chien ressemble simplement à une race que d'autres pays restreignent, cela n'a aucune incidence sur l'entrée en Slovaquie. Si tu compte résider en Slovaquie, renseigne-toi auprès de ton commune sur l'enregistrement du chien. Pour un transit par les pays voisins, vérifie séparément les règles de race de chaque pays."
    es: "Si tu perro simplemente se parece a una raza que otros países restringen, eso no tiene ninguna incidencia en la entrada en Eslovaquia. Si piensas residir en Eslovaquia, infórmate en tu municipio sobre el registro del perro. Para un tránsito por los países vecinos, comprueba por separado las normas sobre razas de cada país."
    pt: "Se seu cachorro apenas se parece com uma raça restrita em alguns outros países, isso não tem nenhum efeito sobre a entrada na Eslováquia. Se você pretende morar na Eslováquia, informe-se no seu município sobre o registro do cachorro. Para o trânsito por países vizinhos, verifique separadamente as regras de raça de cada país."

