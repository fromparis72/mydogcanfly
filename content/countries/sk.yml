# Country Entry Guide — Slovakia (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_sk
iso2: "SK"
name: { en: "Slovakia", fr: "Slovaquie", es: "Eslovaquia", pt: "Eslováquia" }
region: { en: "Europe (EU)", fr: "Europe (UE)", es: "Europa (UE)", pt: "Europa (UE)" }


regime: eu

hero:
  h1: { en: "Traveling to Slovakia with your dog", fr: "Voyager en Slovaquie avec ton chien", es: "Viajar a Eslovaquia con tu perro", pt: "Viajar para a Eslováquia com seu cachorro" }
  intro:
    en: >-
      Slovakia welcomes dogs, but what you need to prepare depends mainly on the country your dog is
      travelling from — not only on Slovakia itself. As an EU member, Slovakia applies the EU
      pet-movement rules: an ISO microchip and a valid rabies vaccination are always required. A dog
      coming from another EU country simply needs an EU pet passport. A dog from a listed non-EU
      country (such as the United States, Canada or the United Kingdom) needs an EU animal health
      certificate but no blood test. A dog from a non-listed country faces the longest path, including
      a rabies antibody test and a three-month wait. This guide explains each case so you know exactly
      what to prepare before you book your flight.
    fr: >-
      La Slovaquie accueille les chiens, mais ce qu'il faut préparer dépend surtout du pays d'où ton
      chien voyage — pas seulement de la Slovaquie. En tant qu'État membre de l'UE, la Slovaquie
      applique les règles européennes de mouvement des animaux : une puce ISO et une vaccination
      antirabique valide sont toujours exigées. Un chien venant d'un autre pays de l'UE a simplement
      besoin d'un passeport européen. Un chien en provenance d'un pays tiers listé (États-Unis, Canada,
      Royaume-Uni…) a besoin d'un certificat sanitaire européen mais pas de prise de sang. Un chien
      venant d'un pays non listé suit le parcours le plus long, avec un titrage antirabique et un délai
      de trois mois. Ce guide détaille chaque cas pour savoir exactement quoi préparer avant de
      réserver ton vol.
    es: >-
      Eslovaquia acoge a los perros, pero lo que debes preparar depende sobre todo del país desde el
      que viaja tu perro — no solo de Eslovaquia. Como Estado miembro de la UE, Eslovaquia aplica las
      normas europeas de movimiento de animales de compañía: siempre se exigen un microchip ISO y una
      vacunación antirrábica válida. Un perro que llega de otro país de la UE solo necesita un pasaporte
      europeo para mascotas. Un perro procedente de un país tercero listado (como Estados Unidos, Canadá
      o el Reino Unido) necesita un certificado sanitario europeo, pero no una prueba de sangre. Un
      perro de un país no listado se enfrenta al camino más largo, que incluye una prueba de titulación
      de rabia y una espera de tres meses. Esta guía explica cada caso para que sepas exactamente qué
      preparar antes de reservar tu vuelo.

    pt: "A Eslováquia recebe bem os cachorros, mas o que você precisa preparar depende principalmente do país de onde seu cachorro parte — e não só da Eslováquia em si. Como membro da União Europeia, a Eslováquia aplica as regras europeias de circulação de animais de estimação: microchip ISO e vacinação antirrábica válida são sempre obrigatórios. Um cachorro vindo de outro país da UE precisa apenas do passaporte europeu para animais. Um cachorro vindo de um país listado fora da UE (como Estados Unidos, Canadá ou Reino Unido) precisa de um certificado sanitário europeu, mas não de exame de sangue. Um cachorro vindo de um país não listado enfrenta o caminho mais longo, com teste sorológico antirrábico e uma espera de três meses. Este guia explica cada caso para você saber exatamente o que preparar antes de comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Easy to difficult (depends on origin)", fr: "Facile à difficile (selon l'origine)", es: "De fácil a difícil (según el origen)", pt: "De fácil a difícil (depende da origem)" }

prepTime:
  eu:
    en: "A few days if the passport is up to date, up to ~3 weeks if the first rabies shot is still needed."
    fr: "Quelques jours si le passeport est à jour, jusqu'à ~3 semaines si la première vaccination reste à faire."
    es: "Unos días si el pasaporte está al día, hasta ~3 semanas si aún falta la primera vacuna antirrábica."
    pt: "Alguns dias se o passaporte estiver em dia, até cerca de 3 semanas se ainda faltar a primeira vacina antirrábica."
  listed:
    en: "~3–4 weeks: 21-day wait after the rabies shot, plus a health certificate valid 10 days."
    fr: "~3–4 semaines : délai de 21 jours après le vaccin, plus un certificat sanitaire valable 10 jours."
    es: "~3–4 semanas: espera de 21 días tras la vacuna antirrábica, más un certificado sanitario válido 10 días."
    pt: "Cerca de 3 a 4 semanas: 21 dias de espera depois da vacina antirrábica, mais um certificado sanitário válido por 10 dias."
  nonListed:
    en: "~4–7 months: antibody test at least 30 days after vaccination, then a compulsory 3-month wait."
    fr: "~4–7 mois : titrage au moins 30 jours après le vaccin, puis un délai obligatoire de 3 mois."
    es: "~4–7 meses: prueba de titulación al menos 30 días después de la vacuna, y luego una espera obligatoria de 3 meses."
    pt: "Cerca de 4 a 7 meses: teste sorológico no mínimo 30 dias depois da vacinação, seguido de 3 meses obrigatórios de espera."

