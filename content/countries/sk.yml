    when: { en: "12-week rabies shot + 21-day wait (listed); about 7 months from a non-listed country.", fr: "Vaccin à 12 semaines + 21 jours (pays listé) ; environ 7 mois depuis un pays non listé.", es: "Vacuna a las 12 semanas + espera de 21 días (país listado); unos 7 meses desde un país no listado.", pt: "Vacina antirrábica às 12 semanas + 21 dias de espera (país listado); cerca de 7 meses vindo de um país não listado." }
    exceptions: { en: "Slovakia does NOT apply the young-animal exemption: a puppy cannot enter from a third country without a valid rabies vaccination.", fr: "La Slovaquie N'APPLIQUE PAS la dérogation pour jeunes animaux : un chiot ne peut entrer depuis un pays tiers sans vaccination antirabique valide.", es: "Eslovaquia NO aplica la exención para animales jóvenes: un cachorro no puede entrar desde un país tercero sin una vacunación antirrábica válida.", pt: "A Eslováquia NÃO aplica a isenção para animais jovens: um filhote não pode entrar vindo de um país terceiro sem vacinação antirrábica válida." }
    ref: { en: "EU Reg. 576/2013, Art. 11; svps.sk", fr: "Règl. UE 576/2013, art. 11 ; svps.sk", es: "Regl. UE 576/2013, art. 11; svps.sk", pt: "Regulamento UE 576/2013, art. 11; svps.sk" }
