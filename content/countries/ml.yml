    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Mali publishes little about pet import, so only a veterinarian and the DNSV can confirm the exact, current procedure for your individual dog."
    fr: "Le Mali publie peu sur l'importation d'animaux ; seuls un vétérinaire et la DNSV peuvent confirmer la procédure exacte et à jour pour ton chien."
    es: "Malí publica poco sobre la importación de mascotas, así que solo un veterinario y la DNSV pueden confirmar el procedimiento exacto y actual para tu perro."
