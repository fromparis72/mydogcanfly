# Country Entry Guide — Mali (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_ml
iso2: "ML"
name: { en: "Mali", fr: "Mali", es: "Malí", pt: "Mali" }
region: { en: "West Africa", fr: "Afrique de l'Ouest", es: "África Occidental", pt: "África Ocidental" }


regime: non_listed

hero:
  h1: { en: "Traveling to Mali with your dog", fr: "Voyager au Mali avec ton chien", es: "Viajar a Malí con tu perro", pt: "Viajar para o Mali com seu cachorro" }
  intro:
    en: >-
      Mali admits pet dogs, but it publishes very little about the exact procedure, so this guide sticks
      strictly to what official sources confirm. Mali is not part of the EU framework: animal health is
      overseen by the Direction Nationale des Services Vétérinaires (DNSV), the national veterinary
      authority under the ministry responsible for livestock. The clearest documented requirement is an
      official international veterinary certificate: the United States and Mali use a bilingual
      (English/French) export health certificate, valid for 30 days after issuance, on which a
      government-accredited vet certifies that the dog was inspected, appears free of infectious disease
      including rabies, comes from an area not quarantined for rabies, and has a valid rabies vaccination.
      Beyond that, Mali does not publish a detailed pet-import scheme online, so several points — advance
      import permit, quarantine, minimum age, breed rules — are simply not published and are marked
      Unknown here rather than guessed. This guide explains what is confirmed and what must be verified
      directly with the DNSV or a Malian embassy before you book.
    fr: >-
      Le Mali admet les chiens de compagnie, mais publie très peu de détails sur la procédure exacte ; ce
      guide s'en tient donc strictement à ce que confirment les sources officielles. Le Mali ne relève pas
      du cadre de l'UE : la santé animale est supervisée par la Direction Nationale des Services
      Vétérinaires (DNSV), autorité vétérinaire nationale rattachée au ministère chargé de l'élevage.
      L'exigence la mieux documentée est un certificat vétérinaire international officiel : les États-Unis
      et le Mali utilisent un certificat sanitaire d'exportation bilingue (anglais/français), valable
      30 jours après sa délivrance, sur lequel un vétérinaire accrédité certifie que le chien a été
      inspecté, semble exempt de maladie infectieuse y compris la rage, provient d'une zone non mise en
      quarantaine pour la rage et dispose d'une vaccination antirabique valide. Au-delà, le Mali ne publie
      pas de dispositif détaillé d'importation en ligne : plusieurs points — permis d'importation
      préalable, quarantaine, âge minimum, règles de race — ne sont tout simplement pas publiés et sont
      indiqués « Non communiqué » ici plutôt que devinés. Ce guide détaille ce qui est confirmé et ce qui
      doit être vérifié directement auprès de la DNSV ou d'une ambassade du Mali avant de réserver.
    es: >-
      Malí admite perros de compañía, pero publica muy poco sobre el procedimiento exacto, por lo que esta
      guía se ciñe estrictamente a lo que confirman las fuentes oficiales. Malí no forma parte del marco de
      la UE: la sanidad animal está supervisada por la Direction Nationale des Services Vétérinaires
      (DNSV), la autoridad veterinaria nacional dependiente del ministerio responsable de la ganadería. El
      requisito mejor documentado es un certificado veterinario internacional oficial: Estados Unidos y
      Malí utilizan un certificado sanitario de exportación bilingüe (inglés/francés), válido 30 días tras
      su expedición, en el que un veterinario acreditado por el gobierno certifica que el perro fue
      inspeccionado, parece libre de enfermedad infecciosa incluida la rabia, procede de una zona no puesta
      en cuarentena por rabia y dispone de una vacunación antirrábica válida. Más allá de eso, Malí no
      publica en línea un régimen detallado de importación, por lo que varios puntos — permiso de
      importación previo, cuarentena, edad mínima, normas de razas — simplemente no están publicados y aquí
      se marcan como No comunicado en lugar de suponerlos. Esta guía explica lo que está confirmado y lo que
      debe verificarse directamente con la DNSV o una embajada de Malí antes de reservar.

    pt: "O Mali admite cachorros de estimação, mas publica muito pouco sobre o procedimento exato, portanto este guia se atém estritamente ao que as fontes oficiais confirmam. O Mali não faz parte do quadro da UE: a saúde animal é supervisionada pela Direction Nationale des Services Vétérinaires (DNSV), a autoridade veterinária nacional sob o ministério responsável pela pecuária. A exigência mais claramente documentada é um certificado veterinário internacional oficial: os Estados Unidos e o Mali usam um atestado de saúde de exportação bilíngue (inglês/francês), válido por 30 dias após a emissão, no qual um veterinário credenciado pelo governo certifica que o cachorro foi inspecionado, parece livre de doença infecciosa, incluindo raiva, vem de uma área não colocada em quarentena por raiva, e tem uma vacinação antirrábica válida. Além disso, o Mali não publica on-line um esquema detalhado de importação de animais de estimação, portanto vários pontos — autorização de importação prévia, quarentena, idade mínima, regras de raça — simplesmente não são publicados e estão marcados aqui como não comunicado em vez de presumidos. Este guia explica o que está confirmado e o que deve ser verificado diretamente com a DNSV ou com uma embaixada maliana antes de reservar."
difficulty:
  level: moderate
  label: { en: "Moderate — official veterinary certificate + rabies; several rules unpublished", fr: "Modéré — certificat vétérinaire officiel + rage ; plusieurs règles non publiées", es: "Moderado — certificado veterinario oficial + rabia; varias normas no publicadas", pt: "Moderada — certificado veterinário oficial + raiva; várias regras não publicadas" }

prepTime:
  eu:
    en: "From the EU: allow one to two weeks if identification and rabies vaccination are already valid — an official vet issues the international veterinary certificate close to departure. Allow more time to confirm any additional conditions with the DNSV, since Mali does not publish a full procedure."
    fr: "Depuis l'UE : prévois une à deux semaines si l'identification et la vaccination antirabique sont déjà valides — un vétérinaire officiel établit le certificat vétérinaire international peu avant le départ. Prévois davantage de temps pour confirmer toute condition supplémentaire auprès de la DNSV, le Mali ne publiant pas de procédure complète."
    es: "Desde la UE: prevé una o dos semanas si la identificación y la vacunación antirrábica ya son válidas — un veterinario oficial expide el certificado veterinario internacional poco antes de la salida. Prevé más tiempo para confirmar cualquier condición adicional con la DNSV, ya que Malí no publica un procedimiento completo."
    pt: "Da UE: reserve de uma a duas semanas se a identificação e a vacinação antirrábica já estiverem válidas — um veterinário oficial emite o certificado veterinário internacional perto da partida. Reserve mais tempo para confirmar com a DNSV quaisquer condições adicionais, já que o Mali não publica um procedimento completo."
  listed:
    en: "From the United States: allow time to visit a USDA-accredited veterinarian and obtain USDA endorsement of the bilingual export certificate (valid 30 days after issuance). If the first rabies shot is still needed, plan roughly 3 weeks because vaccination must precede the certificate."
    fr: "Depuis les États-Unis : prévois le temps de consulter un vétérinaire accrédité USDA et d'obtenir l'endossement USDA du certificat d'exportation bilingue (valable 30 jours après délivrance). S'il faut encore faire le premier vaccin antirabique, prévois environ 3 semaines, la vaccination devant précéder le certificat."
    es: "Desde Estados Unidos: prevé tiempo para acudir a un veterinario acreditado por el USDA y obtener el refrendo del USDA del certificado de exportación bilingüe (válido 30 días tras la expedición). Si aún falta la primera vacuna antirrábica, planifica unas 3 semanas, ya que la vacunación debe preceder al certificado."
    pt: "Dos Estados Unidos: reserve tempo para visitar um veterinário credenciado pela USDA e obter o endosso da USDA no certificado bilíngue de exportação (válido por 30 dias após a emissão). Se a primeira dose da vacina antirrábica ainda for necessária, planeje cerca de 3 semanas, pois a vacinação deve preceder o certificado."
  nonListed:
    en: "Whatever the origin, the limiting steps are the rabies vaccination itself and issuing the official veterinary certificate shortly before departure. Because Mali publishes little, contact the DNSV or a Malian embassy early to confirm whether an advance import permit or any extra condition applies."
    fr: "Quelle que soit l'origine, les étapes limitantes sont la vaccination antirabique elle-même et l'établissement du certificat vétérinaire officiel peu avant le départ. Le Mali publiant peu, contacte tôt la DNSV ou une ambassade du Mali pour confirmer si un permis d'importation préalable ou toute condition supplémentaire s'applique."
    es: "Sea cual sea el origen, los pasos que marcan el ritmo son la propia vacunación antirrábica y la expedición del certificado veterinario oficial poco antes de la salida. Como Malí publica poco, contacta pronto con la DNSV o una embajada de Malí para confirmar si aplica un permiso de importación previo o cualquier condición adicional."
    pt: "Seja qual for a origem, as etapas limitantes são a própria vacinação antirrábica e a emissão do certificado veterinário oficial pouco antes da partida. Como o Mali publica pouco, entre em contato com a DNSV ou com uma embaixada maliana com antecedência para confirmar se é exigida uma autorização de importação prévia ou qualquer condição extra."

