origin:
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate and normally no border check."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire et normalement pas de contrôle frontalier."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario y normalmente sin control fronterizo."
      pt: "Um cachorro vindo de outro país da UE precisa de um passaporte europeu que comprove um microchip ISO válido e uma vacinação antirrábica em dia. Sem teste sorológico, sem certificado sanitário e, normalmente, sem controle de fronteira."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Switzerland, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination and an EU animal health certificate endorsed by an official vet before departure. No antibody test is required; you enter the EU through a designated border control post (Schiphol)."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Suisse, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire européen visé par un vétérinaire officiel avant le départ. Pas de titrage ; tu entre dans l'UE par un poste de contrôle frontalier désigné (Schiphol)."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Suiza, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal de la UE refrendado por un veterinario oficial antes de la salida. No se exige prueba de titulación; entras en la UE por un puesto de control fronterizo designado (Schiphol)."
      pt: "Vindo de um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Suíça, Japão, Austrália e outros), seu cachorro precisa de microchip, vacinação antirrábica válida e um certificado sanitário europeu endossado por um veterinário oficial antes da partida. Não é exigido teste sorológico; você entra na UE por um posto de controle de fronteira designado (Schiphol)."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-designated laboratory, then a compulsory 3-month wait before entry. An endorsed EU animal health certificate is also required."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen visé est également requis."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exige un certificado sanitario animal de la UE refrendado."
      pt: "Vindo de um país não listado (de risco), acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório designado pela UE, e depois 3 meses obrigatórios de espera antes da entrada. Também é exigido um certificado sanitário europeu endossado."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches the Netherlands depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien aux Pays-Bas dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a los Países Bajos depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega aos Países Baixos depende de onde você embarcou."
  points:
    - en: "From another EU country: no systematic border check — keep the EU pet passport with you."
      fr: "Depuis un autre pays de l'UE : pas de contrôle systématique — garde le passeport européen sur toi."
      es: "Desde otro país de la UE: sin control fronterizo sistemático — lleva contigo el pasaporte europeo."
      pt: "De outro país da UE: sem controle de fronteira sistemático — leve o passaporte europeu com você."
    - en: "From outside the EU: you must enter via a designated border control post — Amsterdam Schiphol Airport — for documentary and identity checks."
      fr: "Depuis hors UE : tu dois entrer par un poste de contrôle frontalier désigné — l'aéroport d'Amsterdam-Schiphol — pour les contrôles documentaires et d'identité."
      es: "Desde fuera de la UE: debes entrar por un puesto de control fronterizo designado — el aeropuerto de Ámsterdam-Schiphol — para los controles documentales y de identidad."
      pt: "De fora da UE: você precisa entrar por um posto de controle de fronteira designado — o aeroporto de Amsterdã-Schiphol — para os controles documental e de identidade."
    - en: "For a non-commercial trip with your own dog, no import permit is issued and no prior appointment is needed."
      fr: "Pour un voyage non commercial avec ton propre chien, aucun permis d'import n'est délivré et aucun rendez-vous préalable n'est nécessaire."
      es: "Para un viaje no comercial con tu propio perro, no se expide ningún permiso de importación ni se necesita cita previa."
      pt: "Para uma viagem não comercial com seu próprio cachorro, nenhuma autorização de importação é emitida e não é preciso agendamento prévio."
    - en: "Carry the original documents (not copies); the NVWA accepts documents in Dutch or English."
      fr: "Munis-toi des documents originaux (pas de copies) ; la NVWA accepte les documents en néerlandais ou en anglais."
      es: "Lleva los documentos originales (no copias); la NVWA acepta documentos en neerlandés o en inglés."
      pt: "Leve os documentos originais (não cópias); a NVWA aceita documentos em neerlandês ou em inglês."
    - en: "If documents are missing or invalid, authorities may order re-export, quarantine or, in the worst case, euthanasia — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, les autorités peuvent ordonner réexpédition, quarantaine ou, au pire, euthanasie — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, las autoridades pueden ordenar la reexpedición, la cuarentena o, en el peor de los casos, la eutanasia — a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, as autoridades podem determinar a reexportação, a quarentena ou, na pior das hipóteses, a eutanásia — às custas do dono."
    - en: "Dogs imported into the Netherlands must be registered in the national dog database within a set period after arrival."
      fr: "Les chiens importés aux Pays-Bas doivent être enregistrés dans la base nationale des chiens dans un délai fixé après l'arrivée."
      es: "Los perros importados a los Países Bajos deben inscribirse en la base de datos nacional de perros dentro de un plazo determinado tras la llegada."
      pt: "Cachorros importados para os Países Baixos precisam ser registrados na base de dados nacional de cachorros dentro de um prazo determinado após a chegada."

travellerExperience: null

restrictedDogs:
  intro:
    en: "The Netherlands has no national breed ban. The old breed-specific regulation (Regeling agressieve dieren, RAD) was repealed with effect from 1 January 2009, because it did not reduce bite incidents. No dog breed is currently prohibited from entering or being kept in the Netherlands."
    fr: "Les Pays-Bas n'ont pas d'interdiction nationale de race. L'ancienne réglementation par race (Regeling agressieve dieren, RAD) a été abrogée à compter du 1er janvier 2009, car elle n'avait pas réduit les morsures. Aucune race de chien n'est actuellement interdite d'entrée ou de détention aux Pays-Bas."
    es: "Los Países Bajos no tienen ninguna prohibición nacional de razas. La antigua normativa por razas (Regeling agressieve dieren, RAD) fue derogada con efecto desde el 1 de enero de 2009, porque no redujo los incidentes de mordeduras. Actualmente ninguna raza de perro está prohibida para entrar o tenerse en los Países Bajos."
    pt: "Os Países Baixos não têm proibição nacional de raças. A antiga regulamentação por raça (Regeling agressieve dieren, RAD) foi revogada com efeito a partir de 1º de janeiro de 2009, porque não reduziu os incidentes de mordida. Atualmente nenhuma raça de cachorro está proibida de entrar ou de ser mantida nos Países Baixos."
  cat1:
    en: "Current legal status: since the RAD repeal there is no breed-specific import restriction. Types once targeted (pit bull, American Staffordshire, Rottweiler and similar) may be brought in like any other dog, provided the EU microchip, rabies and certificate rules are met. Aggressive behaviour is handled case by case, not by breed."
    fr: "Statut juridique actuel : depuis l'abrogation du RAD, aucune restriction d'importation par race. Les types autrefois visés (pit-bull, American Staffordshire, Rottweiler et similaires) peuvent être introduits comme tout autre chien, sous réserve des règles UE (puce, rage, certificat). Le comportement agressif est traité au cas par cas, pas par race."
    es: "Situación jurídica actual: desde la derogación del RAD no hay ninguna restricción de importación por raza. Los tipos antaño señalados (pit bull, American Staffordshire, Rottweiler y similares) pueden introducirse como cualquier otro perro, siempre que se cumplan las normas de la UE sobre microchip, rabia y certificado. El comportamiento agresivo se trata caso por caso, no por raza."
    pt: "Situação jurídica atual: desde a revogação do RAD não há restrição de importação por raça. Os tipos antes visados (pit bull, American Staffordshire, Rottweiler e similares) podem ser trazidos como qualquer outro cachorro, desde que sejam cumpridas as regras da UE sobre microchip, raiva e certificado. O comportamento agressivo é tratado caso a caso, não por raça."
  cat2:
    en: "Proposed (not in force): the government's 2023 anti-bite plan discusses stricter rules for 'high-risk' dogs — for example allowing certain powerful types only with a pedigree — plus a national bite-reporting point and a mandatory owner course. An earlier advisory 'high-risk dogs' list is no longer valid. None of this is enacted law yet; check the latest position before travelling."
    fr: "Proposé (non en vigueur) : le plan gouvernemental 2023 contre les morsures évoque des règles plus strictes pour les chiens « à haut risque » — par exemple n'autoriser certains types puissants qu'avec un pedigree — ainsi qu'un point national de signalement des morsures et un cours obligatoire pour propriétaires. Une ancienne liste indicative de « chiens à haut risque » n'est plus valable. Rien de cela n'est encore une loi ; vérifie la situation la plus récente avant de voyager."
    es: "Propuesto (no en vigor): el plan gubernamental de 2023 contra las mordeduras plantea normas más estrictas para los perros «de alto riesgo» — por ejemplo, permitir ciertos tipos poderosos solo con pedigrí — además de un punto nacional de notificación de mordeduras y un curso obligatorio para propietarios. Una anterior lista orientativa de «perros de alto riesgo» ya no es válida. Nada de esto es todavía ley en vigor; comprueba la situación más reciente antes de viajar."
    pt: "Proposto (não está em vigor): o plano do governo de 2023 contra as mordidas discute regras mais rígidas para cachorros “de alto risco” — por exemplo, permitir certos tipos possantes apenas com pedigree — além de um ponto nacional de notificação de mordidas e um curso obrigatório para donos. Uma antiga lista consultiva de “cachorros de alto risco” não é mais válida. Nada disso é lei em vigor ainda; verifique a situação mais recente antes de viajar."
  note:
    en: "Local authorities can still impose muzzle or leash orders on an individual dog after a bite incident. For the current national position, consult Rijksoverheid and the NVWA. Documents may be in Dutch or English."
    fr: "Les autorités locales peuvent encore imposer muselière ou laisse à un chien après une morsure. Pour la position nationale actuelle, consulte Rijksoverheid et la NVWA. Les documents peuvent être en néerlandais ou en anglais."
    es: "Las autoridades locales aún pueden imponer el uso de bozal o correa a un perro concreto tras un incidente de mordedura. Para conocer la posición nacional actual, consulta Rijksoverheid y la NVWA. Los documentos pueden estar en neerlandés o en inglés."
    pt: "As autoridades locais ainda podem impor focinheira ou guia a um cachorro específico depois de um incidente de mordida. Para conhecer a posição nacional atual, consulte a Rijksoverheid e a NVWA. Os documentos podem estar em neerlandês ou em inglês."

