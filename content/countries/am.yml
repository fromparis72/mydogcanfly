  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Armenia (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — l'Arménie (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Armenia (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — a Armênia (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — Armenia", fr: "Pays de destination — Arménie", es: "País de destino — Armenia", pt: "País de destino — Armênia" }
      text:
        en: "Armenia applies the EAEU common veterinary requirements: a valid rabies vaccination and a set of other vaccinations for dogs (distemper, hepatitis/adenovirus type 1, parvovirus, adenovirus type 2, leptospirosis), with an official veterinary health certificate issued after a clinical examination within 5 days of departure. Up to five dogs and/or cats per traveller enter under the personal-use scheme."
        fr: "L'Arménie applique les exigences vétérinaires communes de l'UEEA : vaccination antirabique valide et une série d'autres vaccins pour les chiens (Carré, hépatite/adénovirus de type 1, parvovirose, adénovirus de type 2, leptospirose), avec un certificat sanitaire vétérinaire officiel établi après un examen clinique dans les 5 jours avant le départ. Jusqu'à cinq chiens et/ou chats par voyageur entrent au titre du régime personnel."
        es: "Armenia aplica los requisitos veterinarios comunes de la UEEA: una vacunación antirrábica válida y una serie de otras vacunas para los perros (moquillo, hepatitis/adenovirus de tipo 1, parvovirus, adenovirus de tipo 2, leptospirosis), con un certificado sanitario veterinario oficial expedido tras un examen clínico en los 5 días previos a la salida. Hasta cinco perros y/o gatos por viajero entran bajo el régimen de uso personal."
        pt: "A Armênia aplica as exigências veterinárias comuns da UEE: são exigidas a vacinação antirrábica válida e um conjunto de outras vacinas para cachorros (cinomose, hepatite/adenovírus tipo 1, parvovírus, adenovírus tipo 2, leptospirose), além de um atestado de saúde veterinário oficial emitido após um exame clínico feito nos 5 dias anteriores à partida. Até cinco cachorros e/ou gatos por viajante entram pelo regime de uso pessoal."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Coming from another EAEU country lets your dog move on its veterinary passport with valid vaccinations. From any other country the same core rules apply for up to five pets; more animals, or a commercial movement, fall outside the personal-travel scheme and trigger additional formalities."
        fr: "En provenance d'un autre pays de l'UEEA, ton chien circule avec son passeport vétérinaire à jour. Depuis tout autre pays, les mêmes règles de base s'appliquent jusqu'à cinq animaux ; un nombre supérieur, ou un mouvement commercial, sortent du régime voyageur et déclenchent des formalités supplémentaires."
        es: "Al venir de otro país de la UEEA, tu perro se desplaza con su pasaporte veterinario y las vacunas al día. Desde cualquier otro país se aplican las mismas normas básicas hasta cinco mascotas; un número mayor, o un movimiento comercial, quedan fuera del régimen de viajero y activan trámites adicionales."
        pt: "Vir de outro país da UEE permite que seu cachorro viaje apenas com o passaporte veterinário com as vacinas em dia. De qualquer outro país, as mesmas regras básicas valem para até cinco animais; mais animais, ou um movimento comercial, ficam fora do regime de viajante e geram formalidades adicionais."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "Armenia does not run an EU-style listed/non-listed system, but the rabies situation of your dog's real origin matters: keep proof of an in-date vaccination and, where a multi-year vaccine is used, evidence that immunity is still maintained (a laboratory result of at least 0.5 IU/ml is accepted when the vaccine's validity has lapsed)."
        fr: "L'Arménie n'applique pas de système listé/non listé à l'européenne, mais la situation rabique de l'origine réelle du chien compte : conserve la preuve d'une vaccination à jour et, en cas de vaccin pluriannuel, la preuve du maintien de l'immunité (un résultat de laboratoire d'au moins 0,5 UI/ml est accepté si la validité du vaccin a expiré)."
        es: "Armenia no aplica un sistema de listados/no listados al estilo de la UE, pero la situación rábica del origen real de tu perro importa: conserva la prueba de una vacunación vigente y, cuando se use una vacuna plurianual, la evidencia de que la inmunidad se mantiene (se acepta un resultado de laboratorio de al menos 0,5 UI/ml cuando la valide de la vacuna ha caducado)."
        pt: "A Armênia não tem um sistema de países listados/não listados como o da UE, mas a situação da raiva na origem real do seu cachorro conta: guarde a comprovação de uma vacinação em dia e, quando for usada uma vacina plurianual, a evidência de que a imunidade ainda está mantida (aceita-se um resultado de laboratório de pelo menos 0,5 UI/ml quando a validade da vacina tiver expirado)."
  note:
    en: "So read the requirements below as Armenia's EAEU framework, then confirm your dog's exact origin, number of animals and history with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre UEEA de l'Arménie, puis confirme l'origine exacte, le nombre d'animaux et l'historique de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de la UEEA de Armenia y luego confirma el origen exacto, el número de animales y el historial de tu perro con tu veterinario."
    pt: "Leia então as exigências abaixo como o quadro da UEE aplicado pela Armênia, e confirme com seu veterinário a origem exata, o número de animais e o histórico do seu cachorro."

requirements:
  - item: { en: "Microchip / identification", fr: "Puce / identification", es: "Microchip / identificación", pt: "Microchip / identificação" }
    required: { en: "Recommended", fr: "Recommandée", es: "Recomendado", pt: "Recomendado" }
    when: { en: "The EAEU does not require identification for personal pets (the identification box on the certificate is left blank); an ISO 11784/11785 microchip or a legible tattoo, cross-referenced by the vet, is strongly advised.", fr: "L'UEEA n'exige pas d'identification pour les animaux personnels (la case d'identification du certificat est laissée vide) ; une puce ISO 11784/11785 ou un tatouage lisible, référencé par le vétérinaire, est fortement conseillé.", es: "La UEEA no exige identificación para las mascotas personales (la casilla de identificación del certificado se deja en blanco); se recomienda encarecidamente un microchip ISO 11784/11785 o un tatuaje legible, cotejado por el veterinario.", pt: "A UEE não exige identificação para animais de uso pessoal (o campo de identificação do certificado fica em branco); recomenda-se fortemente um microchip ISO 11784/11785 ou uma tatuagem legível, conferida pelo veterinário." }
    exceptions: { en: "A microchip is recommended for return travel and for entry to many other countries, which do require it.", fr: "Une puce est recommandée pour le voyage retour et pour l'entrée dans de nombreux autres pays qui, eux, l'exigent.", es: "Se recomienda un microchip para el viaje de vuelta y para la entrada en muchos otros países que sí lo exigen.", pt: "Recomenda-se um microchip para a viagem de volta e para a entrada em muitos outros países que, esses sim, o exigem." }
    ref: { en: "EAEU Form for fur-bearing animals, rabbits, dogs and cats, sec.2.4 (APHIS guidance); EAEU Decision No.317, ch.15", fr: "Formulaire UEEA pour animaux à fourrure, lapins, chiens et chats, sect.2.4 (guide APHIS) ; Décision UEEA n°317, ch.15", es: "Formulario UEEA para animales de peletería, conejos, perros y gatos, secc.2.4 (guía APHIS); Decisión UEEA n.º 317, cap.15", pt: "Formulário da UEE para animais de pele, coelhos, cachorros e gatos, seç. 2.4 (orientação da APHIS); Decisão nº 317 da UEE, cap. 15" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Dogs over 3 months must be vaccinated against rabies within the last 12 months. If the vaccine's validity has lapsed, revaccinate and wait more than 20 days before travel.", fr: "Les chiens de plus de 3 mois doivent être vaccinés contre la rage dans les 12 derniers mois. Si la validité du vaccin a expiré, revacciner et attendre plus de 20 jours avant le voyage.", es: "Los perros de más de 3 meses deben estar vacunados contra la rabia en los últimos 12 meses. Si la valide de la vacuna ha caducado, revacuna y espera más de 20 días antes de viajar.", pt: "Cachorros com mais de 3 meses precisam estar vacinados contra a raiva nos últimos 12 meses. Se a validade da vacina tiver expirado, revacine e espere mais de 20 dias antes da viagem." }
    exceptions: { en: "Dogs under 3 months are not required to be vaccinated against rabies. A multi-year vaccine whose validity has not lapsed does not need repeating.", fr: "Les chiens de moins de 3 mois ne sont pas tenus d'être vaccinés contre la rage. Un vaccin pluriannuel encore valide n'a pas à être refait.", es: "Los perros de menos de 3 meses no están obligados a estar vacunados contra la rabia. Una vacuna plurianual cuya valide no haya caducado no necesita repetirse.", pt: "Cachorros com menos de 3 meses não são obrigados a ser vacinados contra a raiva. Uma vacina plurianual cuja validade não tenha expirado não precisa ser repetida." }
    ref: { en: "EAEU common veterinary requirements, ch.15 (Decision No.317), sec.2.2; APHIS guidance", fr: "Exigences vétérinaires communes UEEA, ch.15 (Décision n°317), sect.2.2 ; guide APHIS", es: "Requisitos veterinarios comunes de la UEEA, cap.15 (Decisión n.º 317), secc.2.2; guía APHIS", pt: "Exigências veterinárias comuns da UEE, cap. 15 (Decisão nº 317), seç. 2.2; orientação da APHIS" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not required in general", fr: "Non requis en général", es: "No obligatoria en general", pt: "Em geral, não obrigatório" }
    when: { en: "No blood titration is required for a standard, in-date rabies vaccination.", fr: "Aucun titrage sanguin n'est requis pour une vaccination antirabique standard et à jour.", es: "No se exige ninguna titulación en sangre para una vacunación antirrábica estándar y vigente.", pt: "Nenhuma titulação sanguínea é exigida para uma vacinação antirrábica padrão e em dia." }
    exceptions: { en: "It serves only as an alternative when the vaccine's validity has lapsed: a laboratory result of at least 0.5 IU/ml within 12 months of travel is then accepted instead of revaccination.", fr: "Il ne sert que d'alternative en cas d'expiration du vaccin : un résultat de laboratoire d'au moins 0,5 UI/ml dans les 12 mois avant le voyage est alors accepté à la place d'une revaccination.", es: "Solo sirve como alternativa cuando la valide de la vacuna ha caducado: se acepta entonces un resultado de laboratorio de al menos 0,5 UI/ml en los 12 meses previos al viaje en lugar de una revacunación.", pt: "Ela só serve como alternativa quando a validade da vacina tiver expirado: nesse caso, aceita-se um resultado de laboratório de pelo menos 0,5 UI/ml dentro dos 12 meses anteriores à viagem, em vez da revacinação." }
    ref: { en: "EAEU common veterinary requirements, ch.15 (Decision No.317), sec.2.2; APHIS guidance", fr: "Exigences vétérinaires communes UEEA, ch.15 (Décision n°317), sect.2.2 ; guide APHIS", es: "Requisitos veterinarios comunes de la UEEA, cap.15 (Decisión n.º 317), secc.2.2; guía APHIS", pt: "Exigências veterinárias comuns da UEE, cap. 15 (Decisão nº 317), seç. 2.2; orientação da APHIS" }
  - item: { en: "Other vaccinations (dogs)", fr: "Autres vaccins (chiens)", es: "Otras vacunas (perros)", pt: "Outras vacinas (cachorros)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorias", pt: "Obrigatório" }
    when: { en: "Dogs must be vaccinated more than 20 days and less than 12 months before travel against distemper, hepatitis (adenovirus type 1), parvovirus, adenovirus type 2 and leptospirosis.", fr: "Les chiens doivent être vaccinés plus de 20 jours et moins de 12 mois avant le voyage contre la maladie de Carré, l'hépatite (adénovirus de type 1), la parvovirose, l'adénovirus de type 2 et la leptospirose.", es: "Los perros deben estar vacunados más de 20 días y menos de 12 meses antes del viaje contra el moquillo, la hepatitis (adenovirus de tipo 1), el parvovirus, el adenovirus de tipo 2 y la leptospirosis.", pt: "Os cachorros precisam ser vacinados entre mais de 20 dias e menos de 12 meses antes da viagem contra cinomose, hepatite (adenovírus tipo 1), parvovírus, adenovírus tipo 2 e leptospirose." }
    exceptions: { en: "Leptospirosis vaccination may be replaced by a registered prophylactic treatment (e.g. dihydrostreptomycin). A valid multi-year record does not need repeating.", fr: "La vaccination contre la leptospirose peut être remplacée par un traitement prophylactique enregistré (ex. dihydrostreptomycine). Un enregistrement pluriannuel valide n'a pas à être refait.", es: "La vacunación contra la leptospirosis puede sustituirse por un tratamiento profiláctico registrado (p. ej. dihidroestreptomicina). Un registro plurianual válido no necesita repetirse.", pt: "A vacinação contra leptospirose pode ser substituída por um tratamento profilático registrado (por exemplo, di-hidroestreptomicina). Um registro plurianual válido não precisa ser repetido." }
    ref: { en: "EAEU common veterinary requirements, ch.15 (Decision No.317), sec.2.2; APHIS guidance", fr: "Exigences vétérinaires communes UEEA, ch.15 (Décision n°317), sect.2.2 ; guide APHIS", es: "Requisitos veterinarios comunes de la UEEA, cap.15 (Decisión n.º 317), secc.2.2; guía APHIS", pt: "Exigências veterinárias comuns da UEE, cap. 15 (Decisão nº 317), seç. 2.2; orientação da APHIS" }
  - item: { en: "Veterinary certificate (EAEU / international)", fr: "Certificat vétérinaire (UEEA / international)", es: "Certificado veterinario (UEEA / internacional)", pt: "Certificado veterinário (UEE / internacional)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "An official veterinary health certificate issued by the state veterinary service of the country of departure, after a clinical examination within 5 days of travel. From third countries the EAEU-format international veterinary certificate is used; within the EAEU, movement relies on the veterinary passport / EAEU veterinary certificate (Form No.1).", fr: "Un certificat sanitaire vétérinaire officiel délivré par le service vétérinaire d'État du pays de départ, après un examen clinique dans les 5 jours avant le voyage. Depuis les pays tiers, le certificat vétérinaire international au format UEEA est utilisé ; au sein de l'UEEA, le mouvement repose sur le passeport vétérinaire / certificat vétérinaire UEEA (formulaire n°1).", es: "Un certificado sanitario veterinario oficial expedido por el servicio veterinario estatal del país de salida, tras un examen clínico en los 5 días previos al viaje. Desde terceros países se utiliza el certificado veterinario internacional en formato UEEA; dentro de la UEEA, el movimiento se basa en el pasaporte veterinario / certificado veterinario UEEA (formulario n.º 1).", pt: "Um atestado de saúde veterinário oficial emitido pelo serviço veterinário estatal do país de partida, após um exame clínico feito nos 5 dias anteriores à viagem. Vindo de países terceiros, usa-se o certificado veterinário internacional no formato da UEE; dentro da UEE, a circulação se baseia no passaporte veterinário / certificado veterinário da UEE (Formulário nº 1)." }
    exceptions: { en: "A separate certificate is drawn up for each animal; at the Armenian border it is checked and, where required, re-registered by the state veterinary service.", fr: "Un certificat distinct est établi pour chaque animal ; à la frontière arménienne, il est vérifié et, si nécessaire, réenregistré par le service vétérinaire d'État.", es: "Se elabora un certificado independiente para cada animal; en la frontera armenia se comprueba y, cuando es necesario, lo vuelve a registrar el servicio veterinario estatal.", pt: "Um certificado separado é emitido para cada animal; na fronteira armênia, ele é conferido e, quando necessário, reregistrado pelo serviço veterinário estatal." }
    ref: { en: "EAEU common veterinary requirements, ch.15 (Decision No.317); Food Safety Inspection Body (snund.am), import/export", fr: "Exigences vétérinaires communes UEEA, ch.15 (Décision n°317) ; Organe d'inspection de la sécurité alimentaire (snund.am), import/export", es: "Requisitos veterinarios comunes de la UEEA, cap.15 (Decisión n.º 317); Organismo de Inspección de la Seguridad Alimentaria (snund.am), importación/exportación", pt: "Exigências veterinárias comuns da UEE, cap. 15 (Decisão nº 317); Serviço de Inspeção de Segurança Alimentar (snund.am), importação/exportação" }
  - item: { en: "Parasite treatment", fr: "Traitement antiparasitaire", es: "Tratamiento antiparasitario", pt: "Tratamento antiparasitário" }
    required: { en: "Not mandatory", fr: "Non obligatoire", es: "No obligatorio", pt: "Não obrigatório" }
    when: { en: "Deworming and other treatments are not a mandatory EAEU import condition; the certificate has an optional section, and any treatment given before export is recorded there.", fr: "Le vermifuge et autres traitements ne sont pas une condition d'importation obligatoire de l'UEEA ; le certificat comporte une section facultative, et tout traitement administré avant l'export y est noté.", es: "La desparasitación y otros tratamientos no son una condición de importación obligatoria de la UEEA; el certificado tiene una sección opcional, y cualquier tratamiento administrado antes de la exportación se registra ahí.", pt: "A desverminação e outros tratamentos não são uma condição obrigatória de importação da UEE; o certificado tem uma seção opcional, na qual é registrado qualquer tratamento aplicado antes da exportação." }
    exceptions: { en: "This optional section (sec.2.3) is completed only if additional veterinary treatments were given; otherwise it is left blank.", fr: "Cette section facultative (sect.2.3) n'est remplie que si des traitements vétérinaires supplémentaires ont été administrés ; sinon elle reste vide.", es: "Esta sección opcional (secc.2.3) solo se cumplimenta si se administraron tratamientos veterinarios adicionales; de lo contrario, se deja en blanco.", pt: "Essa seção opcional (seç. 2.3) só é preenchida se tratamentos veterinários adicionais tiverem sido aplicados; caso contrário, fica em branco." }
    ref: { en: "EAEU Form for fur-bearing animals, rabbits, dogs and cats, sec.2.3 (APHIS guidance)", fr: "Formulaire UEEA pour animaux à fourrure, lapins, chiens et chats, sect.2.3 (guide APHIS)", es: "Formulario UEEA para animales de peletería, conejos, perros y gatos, secc.2.3 (guía APHIS)", pt: "Formulário da UEE para animais de pele, coelhos, cachorros e gatos, seç. 2.3 (orientação da APHIS)" }
  - item: { en: "Import permit / advance notification", fr: "Permis d'importation / notification préalable", es: "Permiso de importación / notificación previa", pt: "Autorização de importação / notificação prévia" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Not required when importing up to 5 dogs and cats in total for personal needs, accompanied by an endorsed veterinary health certificate. Additional permissions apply for more than 5 animals or a commercial consignment.", fr: "Non requis pour l'importation de 5 chiens et chats maximum au total à titre personnel, accompagnés d'un certificat sanitaire vétérinaire visé. Des autorisations supplémentaires s'appliquent pour plus de 5 animaux ou un envoi commercial.", es: "No se exige al importar hasta 5 perros y gatos en total para necesidades personales, acompañados de un certificado sanitario veterinario refrendado. Se aplican autorizaciones adicionales para más de 5 animales o un envío comercial.", pt: "Não exigida ao importar até 5 cachorros e gatos no total para fins pessoais, acompanhados de um atestado de saúde veterinário endossado. Autorizações adicionais se aplicam para mais de 5 animais ou uma remessa comercial." }
    exceptions: { en: "For consignments outside the personal scheme, confirm the procedure with the Food Safety Inspection Body before travel.", fr: "Pour les envois hors du régime personnel, confirme la procédure auprès de l'Organe d'inspection de la sécurité alimentaire avant le voyage.", es: "Para los envíos fuera del régimen personal, confirma el procedimiento con el Organismo de Inspección de la Seguridad Alimentaria antes de viajar.", pt: "Para remessas fora do regime pessoal, confirme o procedimento com o Serviço de Inspeção de Segurança Alimentar antes de viajar." }
    ref: { en: "APHIS Pet Travel US–Armenia (max 5 pets, no permit/quarantine); Food Safety Inspection Body (snund.am)", fr: "APHIS voyage animaux É.-U.–Arménie (5 animaux max, sans permis/quarantaine) ; Organe d'inspection de la sécurité alimentaire (snund.am)", es: "APHIS Viaje de mascotas EE. UU.–Armenia (máx. 5 mascotas, sin permiso/cuarentena); Organismo de Inspección de la Seguridad Alimentaria (snund.am)", pt: "APHIS Pet Travel EUA–Armênia (máx. 5 animais, sem autorização/quarentena); Serviço de Inspeção de Segurança Alimentar (snund.am)" }
  - item: { en: "Border / airport veterinary control", fr: "Contrôle vétérinaire à la frontière / aéroport", es: "Control veterinario en la frontera / aeropuerto", pt: "Controle veterinário de fronteira / aeroporto" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Enter through a checkpoint operating state veterinary control (e.g. Zvartnots International Airport); present the certificate and vaccination records to the state veterinary service.", fr: "Entre par un point de passage assurant le contrôle vétérinaire d'État (ex. aéroport international de Zvartnots) ; présente le certificat et les preuves de vaccination au service vétérinaire d'État.", es: "Entra por un punto de paso que realice el control veterinario estatal (p. ej. el Aeropuerto Internacional de Zvartnots); presenta el certificado y los registros de vacunación al servicio veterinario estatal.", pt: "Entre por um posto que opere controle veterinário estatal (por exemplo, o Aeroporto Internacional de Zvartnots); apresente o certificado e a carteira de vacinação ao serviço veterinário estatal." }
    exceptions: { en: "Border veterinary control is run by the Food Safety Inspection Body of the Republic of Armenia.", fr: "Le contrôle vétérinaire frontalier est assuré par l'Organe d'inspection de la sécurité alimentaire de la République d'Arménie.", es: "El control veterinario fronterizo lo realiza el Organismo de Inspección de la Seguridad Alimentaria de la República de Armenia.", pt: "O controle veterinário de fronteira é conduzido pelo Serviço de Inspeção de Segurança Alimentar da República da Armênia." }
    ref: { en: "Food Safety Inspection Body (snund.am), border control; gov.am — Food Safety Inspectorate", fr: "Organe d'inspection de la sécurité alimentaire (snund.am), contrôle frontalier ; gov.am — Inspection de la sécurité alimentaire", es: "Organismo de Inspección de la Seguridad Alimentaria (snund.am), control fronterizo; gov.am — Inspección de la Seguridad Alimentaria", pt: "Serviço de Inspeção de Segurança Alimentar (snund.am), controle de fronteira; gov.am — Inspetoria de Segurança Alimentar" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Dogs under 3 months are not required to be vaccinated against rabies under the EAEU rules and may travel with the other conditions met.", fr: "Les chiens de moins de 3 mois ne sont pas tenus d'être vaccinés contre la rage selon les règles UEEA et peuvent voyager si les autres conditions sont remplies.", es: "Los perros de menos de 3 meses no están obligados a estar vacunados contra la rabia según las normas de la UEEA y pueden viajar si se cumplen las demás condiciones.", pt: "Cachorros com menos de 3 meses não são obrigados a ser vacinados contra a raiva pelas regras da UEE e podem viajar se as demais condições forem cumpridas." }
    exceptions: { en: "Once a dog is over 3 months, the rabies shot (more than 20 days before departure if newly given) governs the earliest travel date. Any airline age minimum applies separately.", fr: "Dès que le chien a plus de 3 mois, le vaccin antirabique (plus de 20 jours avant le départ si nouvellement fait) détermine la première date de voyage possible. Un âge minimum de la compagnie aérienne s'applique séparément.", es: "En cuanto el perro supera los 3 meses, la vacuna antirrábica (más de 20 días antes de la salida si es reciente) determina la primera fecha de viaje posible. Cualquier edad mínima de la aerolínea se aplica por separado.", pt: "Assim que o cachorro passa dos 3 meses, é a vacina antirrábica (aplicada há mais de 20 dias antes da partida, se recente) que determina a data mais cedo em que dá para viajar. Qualquer idade mínima exigida pela companhia aérea vale à parte." }
    ref: { en: "EAEU common veterinary requirements, ch.15 (Decision No.317), sec.2.2; APHIS guidance", fr: "Exigences vétérinaires communes UEEA, ch.15 (Décision n°317), sect.2.2 ; guide APHIS", es: "Requisitos veterinarios comunes de la UEEA, cap.15 (Decisión n.º 317), secc.2.2; guía APHIS", pt: "Exigências veterinárias comuns da UEE, cap. 15 (Decisão nº 317), seç. 2.2; orientação da APHIS" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not required", fr: "Non requise", es: "No obligatoria", pt: "Não obrigatório" }
    when: { en: "No import quarantine for up to 5 dogs and cats in total travelling with the owner, accompanied by a veterinary health certificate stating the animals were examined within 5 days of travel.", fr: "Aucune quarantaine à l'import pour 5 chiens et chats maximum au total voyageant avec le propriétaire, accompagnés d'un certificat sanitaire vétérinaire indiquant que les animaux ont été examinés dans les 5 jours avant le voyage.", es: "No hay cuarentena de importación para hasta 5 perros y gatos en total que viajen con el propietario, acompañados de un certificado sanitario veterinario que indique que los animales fueron examinados en los 5 días previos al viaje.", pt: "Sem quarentena de importação para até 5 cachorros e gatos no total que viajam com o dono, acompanhados de um atestado de saúde veterinário que declare que os animais foram examinados nos 5 dias anteriores à viagem." }
    exceptions: { en: "For consignments outside the personal scheme, additional conditions may apply; confirm with the Food Safety Inspection Body.", fr: "Pour les envois hors du régime personnel, des conditions supplémentaires peuvent s'appliquer ; confirme auprès de l'Organe d'inspection de la sécurité alimentaire.", es: "Para los envíos fuera del régimen personal pueden aplicarse condiciones adicionales; confírmalo con el Organismo de Inspección de la Seguridad Alimentaria.", pt: "Para remessas fora do regime pessoal, condições adicionais podem se aplicar; confirme com o Serviço de Inspeção de Segurança Alimentar." }
    ref: { en: "APHIS Pet Travel US–Armenia (EAEU Form, sec.2.2); EAEU Decision No.317, ch.15", fr: "APHIS voyage animaux É.-U.–Arménie (formulaire UEEA, sect.2.2) ; Décision UEEA n°317, ch.15", es: "APHIS Viaje de mascotas EE. UU.–Armenia (formulario UEEA, secc.2.2); Decisión UEEA n.º 317, cap.15", pt: "APHIS Pet Travel EUA–Armênia (Formulário da UEE, seç. 2.2); Decisão nº 317 da UEE, cap. 15" }

origin:
  scheme: own
  eu:
    from: [by, kz, kg, ru]
    title: { en: "From another EAEU country", fr: "Depuis un autre pays de l'UEEA", es: "Desde otro país de la UEEA", pt: "De outro país da UEE" }
    body:
      en: "A dog coming from another Eurasian Economic Union country (Russia, Belarus, Kazakhstan, Kyrgyzstan) moves on its veterinary passport showing valid rabies and other required vaccinations, and the EAEU veterinary certificate for interstate movement. No import permit and no quarantine for up to five pets travelling with the owner for personal needs."
      fr: "Un chien venant d'un autre pays de l'Union économique eurasiatique (Russie, Biélorussie, Kazakhstan, Kirghizistan) circule avec son passeport vétérinaire mentionnant la rage et les autres vaccins exigés à jour, et le certificat vétérinaire UEEA pour les mouvements entre États. Pas de permis ni de quarantaine pour cinq animaux maximum voyageant avec le propriétaire à titre personnel."
      es: "Un perro que viene de otro país de la Unión Económica Euroasiática (Rusia, Bielorrusia, Kazajistán, Kirguistán) se desplaza con su pasaporte veterinario que acredita la rabia y las demás vacunas exigidas al día, y el certificado veterinario UEEA para el movimiento entre Estados. Sin permiso de importación ni cuarentena para hasta cinco mascotas que viajen con el propietario por necesidades personales."
      pt: "Um cachorro vindo de outro país da União Econômica Eurasiática (Rússia, Belarus, Cazaquistão, Quirguistão) viaja com seu passaporte veterinário mostrando a vacinação antirrábica e as demais vacinas exigidas em dia, e o certificado veterinário da UEE para movimentação entre Estados. Sem autorização de importação e sem quarentena para até cinco animais que viajam com o dono para fins pessoais."
    cls: ok
  listed:
    from_except: [by, kz, kg, ru]
    title: { en: "From any other country — up to 5 pets", fr: "Depuis tout autre pays — jusqu'à 5 animaux", es: "Desde cualquier otro país — hasta 5 mascotas", pt: "De qualquer outro país — até 5 animais" }
    body:
      en: "From a non-EAEU country, up to five dogs and cats in total for personal use enter without an import permit and without quarantine, accompanied by the owner and an official veterinary health certificate from the country of departure's state veterinary service, issued after a clinical exam within 5 days of travel, with valid vaccinations. Present yourself to the state veterinary service at the airport or border checkpoint, where the certificate is checked."
      fr: "Depuis un pays hors UEEA, cinq chiens et chats maximum au total à titre personnel entrent sans permis d'importation ni quarantaine, accompagnés du propriétaire et d'un certificat sanitaire vétérinaire officiel du service vétérinaire d'État du pays de départ, établi après un examen clinique dans les 5 jours avant le voyage, avec vaccins valides. Présente-toi au service vétérinaire d'État à l'aéroport ou au poste frontière, où le certificat est vérifié."
      es: "Desde un país fuera de la UEEA, hasta cinco perros y gatos en total para uso personal entran sin permiso de importación ni cuarentena, acompañados por el propietario y con un certificado sanitario veterinario oficial del servicio veterinario estatal del país de salida, expedido tras un examen clínico en los 5 días previos al viaje, con las vacunas al día. Preséntate ante el servicio veterinario estatal en el aeropuerto o el paso fronterizo, donde se comprueba el certificado."
      pt: "Vindo de um país fora da UEE, até cinco cachorros e gatos no total para uso pessoal entram sem autorização de importação e sem quarentena, acompanhados pelo dono e por um atestado de saúde veterinário oficial do serviço veterinário estatal do país de partida, emitido após um exame clínico feito nos 5 dias anteriores à viagem, com as vacinas em dia. Apresente-se ao serviço veterinário estatal no aeroporto ou no posto de fronteira, onde o certificado é conferido."
    cls: warn
  nonListed:
    title: { en: "More than 5 animals / commercial import", fr: "Plus de 5 animaux / import commercial", es: "Más de 5 animales / importación comercial", pt: "Mais de 5 animais / importação comercial" }
    body:
      en: "For more than five animals in total, or a commercial import, the movement falls outside the personal-travel scheme: additional formalities and permissions apply, and you should confirm the exact procedure with the Food Safety Inspection Body in advance. The same core vaccination requirements and the veterinary certificate remain mandatory for each animal."
      fr: "Pour plus de cinq animaux au total, ou un import commercial, le mouvement sort du régime voyageur : des formalités et autorisations supplémentaires s'appliquent, et il convient de confirmer la procédure exacte auprès de l'Organe d'inspection de la sécurité alimentaire à l'avance. Les mêmes exigences vaccinales de base et le certificat vétérinaire restent obligatoires pour chaque animal."
      es: "Para más de cinco animales en total, o una importación comercial, el movimiento queda fuera del régimen de viajero: se aplican trámites y autorizaciones adicionales, y conviene confirmar el procedimiento exacto con el Organismo de Inspección de la Seguridad Alimentaria con antelación. Los mismos requisitos básicos de vacunación y el certificado veterinario siguen siendo obligatorios para cada animal."
      pt: "Para mais de cinco animais no total, ou uma importação comercial, a movimentação fica fora do regime de viajante: aplicam-se formalidades e autorizações adicionais, e você deve confirmar o procedimento exato com o Serviço de Inspeção de Segurança Alimentar com antecedência. As mesmas exigências básicas de vacinação e o certificado veterinário continuam obrigatórios para cada animal."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Armenia depends on where you flew from and how many animals you bring."
    fr: "Ce qui se passe à l'arrivée de ton chien en Arménie dépend de ton lieu de départ et du nombre d'animaux."
    es: "Lo que ocurre cuando tu perro llega a Armenia depende del lugar desde el que hayas volado y de cuántos animales lleves."
    pt: "O que acontece quando seu cachorro chega à Armênia depende de onde você partiu e de quantos animais você leva."
  points:
    - en: "Enter through a checkpoint that operates state veterinary control (e.g. Zvartnots International Airport in Yerevan), run by the Food Safety Inspection Body."
      fr: "Entre par un point de passage assurant le contrôle vétérinaire d'État (ex. aéroport international de Zvartnots à Erevan), géré par l'Organe d'inspection de la sécurité alimentaire."
      es: "Entra por un punto de paso que realice el control veterinario estatal (p. ej. el Aeropuerto Internacional de Zvartnots en Ereván), gestionado por el Organismo de Inspección de la Seguridad Alimentaria."
      pt: "Entre por um posto que opere controle veterinário estatal (por exemplo, o Aeroporto Internacional de Zvartnots, em Erevã), conduzido pelo Serviço de Inspeção de Segurança Alimentar."
    - en: "Present the veterinary health certificate and vaccination records to the state veterinary service; a separate certificate is shown for each animal."
      fr: "Présente le certificat sanitaire vétérinaire et les preuves de vaccination au service vétérinaire d'État ; un certificat distinct est présenté pour chaque animal."
      es: "Presenta el certificado sanitario veterinario y los registros de vacunación al servicio veterinario estatal; se muestra un certificado independiente por cada animal."
      pt: "Apresente o atestado de saúde veterinário e a carteira de vacinação ao serviço veterinário estatal; um certificado separado é mostrado para cada animal."
    - en: "For up to 5 dogs and cats in total travelling with you for personal needs, no import permit and no quarantine are required."
      fr: "Pour 5 chiens et chats maximum au total voyageant avec toi à titre personnel, aucun permis d'importation ni quarantaine ne sont exigés."
      es: "Para hasta 5 perros y gatos en total que viajen contigo por necesidades personales, no se exigen permiso de importación ni cuarentena."
      pt: "Para até 5 cachorros e gatos no total que viajam com você para fins pessoais, nenhuma autorização de importação nem quarentena são exigidas."
    - en: "For more than 5 animals or a commercial import, the movement falls outside the personal scheme and additional formalities apply."
      fr: "Pour plus de 5 animaux ou un import commercial, le mouvement sort du régime personnel et des formalités supplémentaires s'appliquent."
      es: "Para más de 5 animales o una importación comercial, el movimiento queda fuera del régimen personal y se aplican trámites adicionales."
      pt: "Para mais de 5 animais ou uma importação comercial, a movimentação fica fora do regime pessoal e formalidades adicionais se aplicam."
    - en: "Carry original documents; where they are not in Armenian, Russian or English, an official translation is recommended."
      fr: "Munis-toi des documents originaux ; s'ils ne sont ni en arménien, ni en russe, ni en anglais, une traduction officielle est recommandée."
      es: "Lleva los documentos originales; si no están en armenio, ruso o inglés, se recomienda una traducción oficial."
      pt: "Leve os documentos originais; quando eles não estiverem em armênio, russo ou inglês, recomenda-se uma tradução oficial."
    - en: "If vaccinations or documents are missing or invalid, entry can be refused, or the animal quarantined or returned at the owner's expense."
      fr: "Si les vaccins ou documents manquent ou sont invalides, l'entrée peut être refusée, ou l'animal mis en quarantaine ou réexpédié aux frais du propriétaire."
      es: "Si faltan vacunas o documentos, o no son válidos, la entrada puede denegarse, o el animal puede ser puesto en cuarentena o devuelto a cargo del propietario."
      pt: "Se faltarem vacinas ou documentos, ou se eles não forem válidos, a entrada pode ser recusada, ou o animal colocado em quarentena ou devolvido às custas do dono."

