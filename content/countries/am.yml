# Country Entry Guide — Armenia (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_am
iso2: "AM"
name: { en: "Armenia", fr: "Arménie", es: "Armenia", pt: "Armênia" }
region: { en: "Caucasus (non-EU)", fr: "Caucase (hors UE)", es: "Cáucaso (fuera de la UE)", pt: "Cáucaso (fora da UE)" }


regime: non_listed
exit:
  authority: FSIB
  authorityUrl: https://snund.am/en
  intro:
    en: "Armenia is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Food Safety Inspection Body (FSIB)."
    fr: "L'Arménie est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par le Food Safety Inspection Body (FSIB)."
    es: "Armenia no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el Food Safety Inspection Body (FSIB)."
    pt: "A Armênia é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pelo Serviço de Inspeção de Segurança Alimentar (FSIB)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "A state vet issues the domestic certificate (Form 1) before travel, and the FSIB airport service exchanges it for the international veterinary certificate (Form 5a) on departure."
        fr: "Un vétérinaire d'État délivre le certificat national (formulaire 1) avant le voyage, et le service aéroportuaire du FSIB l'échange contre le certificat vétérinaire international (formulaire 5a) au départ."
        es: "Un veterinario estatal emite el certificado nacional (Formulario 1) antes del viaje, y el servicio aeroportuario del FSIB lo cambia por el certificado veterinario internacional (Formulario 5a) al salir."
        pt: "Um veterinário estatal emite o certificado nacional (Formulário 1) antes da viagem, e o serviço aeroportuário do FSIB o troca pelo certificado veterinário internacional (Formulário 5a) na partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Armenia with your dog", fr: "Voyager en Arménie avec ton chien", es: "Viajar a Armenia con tu perro", pt: "Viajar para a Armênia com seu cachorro" }
  intro:
    en: >-
      Armenia is not part of the EU: it is a member of the Eurasian Economic Union (EAEU) and applies
      the Union's common veterinary requirements, enforced at the border by the Food Safety Inspection
      Body (snund.am), which runs the state veterinary service. A dog travelling for personal use — up to
      five dogs and cats in total per traveller — can enter without an import permit and without quarantine,
      provided it carries a valid rabies vaccination, the other vaccinations required for dogs, and an
      official veterinary health certificate from the state veterinary service of the country of departure,
      issued after a clinical examination within five days of travel. What you must prepare still depends on
      your dog's country of departure and how many animals you bring. This guide explains the standard EAEU
      path and the cases where extra formalities apply, so you know what to organise before you fly.
    fr: >-
      L'Arménie ne fait pas partie de l'UE : elle est membre de l'Union économique eurasiatique (UEEA) et
      applique les exigences vétérinaires communes de l'Union, mises en œuvre à la frontière par l'Organe
      d'inspection de la sécurité alimentaire (snund.am), qui gère le service vétérinaire d'État. Un chien
      voyageant à titre personnel — jusqu'à cinq chiens et chats au total par voyageur — peut entrer sans
      permis d'importation et sans quarantaine, à condition d'avoir une vaccination antirabique valide, les
      autres vaccins exigés pour les chiens, et un certificat sanitaire vétérinaire officiel du service
      vétérinaire d'État du pays de départ, établi après un examen clinique dans les cinq jours précédant le
      voyage. Ce qu'il faut préparer dépend aussi du pays de départ et du nombre d'animaux. Ce guide détaille
      le parcours standard UEEA et les cas de formalités supplémentaires, pour savoir quoi organiser avant de partir.
    es: >-
      Armenia no forma parte de la UE: es miembro de la Unión Económica Euroasiática (UEEA) y aplica los
      requisitos veterinarios comunes de la Unión, que se hacen cumplir en la frontera el Organismo de
      Inspección de la Seguridad Alimentaria (snund.am), que gestiona el servicio veterinario estatal. Un
      perro que viaja con fines personales — hasta cinco perros y gatos en total por viajero — puede entrar
      sin permiso de importación y sin cuarentena, siempre que lleve una vacunación antirrábica válida, las
      demás vacunas exigidas para los perros y un certificado sanitario veterinario oficial del servicio
      veterinario estatal del país de salida, expedido tras un examen clínico en los cinco días previos al
      viaje. Lo que debes preparar depende además del país de salida de tu perro y de cuántos animales
      lleves. Esta guía explica el recorrido estándar de la UEEA y los casos en que se aplican trámites
      adicionales, para que sepas qué organizar antes de volar.

    pt: "A Armênia não faz parte da UE: ela é membro da União Econômica Eurasiática (UEE) e aplica as exigências veterinárias comuns da União, fiscalizadas na fronteira pelo Serviço de Inspeção de Segurança Alimentar (snund.am), que administra o serviço veterinário estatal. Um cachorro que viaja para uso pessoal — até cinco cachorros e gatos no total por viajante — pode entrar sem autorização de importação e sem quarentena, desde que leve uma vacinação antirrábica válida, as demais vacinas exigidas para cachorros e um atestado de saúde veterinário oficial do serviço veterinário estatal do país de partida, emitido após um exame clínico feito nos cinco dias anteriores à viagem. O que você precisa preparar ainda depende do país de partida do seu cachorro e de quantos animais você leva. Este guia explica o caminho padrão da UEE e os casos em que se aplicam formalidades extras, para você saber o que organizar antes de voar."
difficulty:
  level: moderate
  label: { en: "Moderate (vaccinations + veterinary certificate)", fr: "Modéré (vaccins + certificat vétérinaire)", es: "Moderado (vacunas + certificado veterinario)", pt: "Moderado (vacinas + certificado veterinário)" }

prepTime:
  eu:
    en: "From another EAEU country (Russia, Belarus, Kazakhstan, Kyrgyzstan): a few days if the vaccinations are up to date and recorded in the veterinary passport."
    fr: "Depuis un autre pays de l'UEEA (Russie, Biélorussie, Kazakhstan, Kirghizistan) : quelques jours si les vaccins sont à jour et consignés dans le passeport vétérinaire."
    es: "Desde otro país de la UEEA (Rusia, Bielorrusia, Kazajistán, Kirguistán): unos días si las vacunas están al día y registradas en el pasaporte veterinario."
    pt: "De outro país da UEE (Rússia, Belarus, Cazaquistão, Quirguistão): alguns dias, se as vacinas estiverem em dia e registradas no passaporte veterinário."
  listed:
    en: "From any other country, up to 5 pets: about 3 weeks if the primary rabies shot and the other dog vaccinations are still needed (given more than 20 days before departure), plus the clinical exam and health certificate issued within 5 days of travel."
    fr: "Depuis tout autre pays, jusqu'à 5 animaux : environ 3 semaines si la primo-vaccination antirabique et les autres vaccins du chien restent à faire (plus de 20 jours avant le départ), plus l'examen clinique et le certificat sanitaire établis dans les 5 jours avant le voyage."
    es: "Desde cualquier otro país, hasta 5 mascotas: unas 3 semanas si aún faltan la primovacunación antirrábica y las demás vacunas del perro (administradas más de 20 días antes de la salida), más el examen clínico y el certificado sanitario expedidos en los 5 días previos al viaje."
    pt: "De qualquer outro país, até 5 animais: cerca de 3 semanas se ainda faltarem a primovacinação antirrábica e as demais vacinas do cachorro (aplicadas mais de 20 dias antes da partida), mais o exame clínico e o atestado de saúde emitidos nos 5 dias anteriores à viagem."
  nonListed:
    en: "More than 5 animals or a commercial import: several weeks — additional formalities and permissions apply beyond the personal-travel scheme; confirm the procedure with the Food Safety Inspection Body in advance."
    fr: "Plus de 5 animaux ou import commercial : plusieurs semaines — des formalités et autorisations supplémentaires s'appliquent au-delà du régime voyageur ; confirme la procédure auprès de l'Organe d'inspection de la sécurité alimentaire à l'avance."
    es: "Más de 5 animales o una importación comercial: varias semanas — se aplican trámites y autorizaciones adicionales más allá del régimen de viajero; confirma el procedimiento con el Organismo de Inspección de la Seguridad Alimentaria con antelación."
    pt: "Mais de 5 animais ou importação comercial: várias semanas — formalidades e autorizações adicionais se aplicam além do regime de viajante; confirme o procedimento com o Serviço de Inspeção de Segurança Alimentar com antecedência."

