restrictedDogs:
  intro:
    en: "No official breed-specific import ban for dogs was identified in Armenian government or EAEU sources at the verification date. The standard EAEU procedure applies to all dogs regardless of breed. A comprehensive national animal-treatment law was under development, so keeping and identification rules inside the country may change — only the enacted official text would be authoritative."
    fr: "Aucune interdiction d'importation visant une race de chien n'a été identifiée dans les sources gouvernementales arméniennes ou de l'UEEA à la date de vérification. La procédure standard de l'UEEA s'applique à tous les chiens, quelle que soit la race. Une loi nationale globale sur le traitement des animaux était en préparation ; les règles de détention et d'identification dans le pays peuvent donc évoluer — seul le texte officiel adopté ferait foi."
    es: "No se identificó ninguna prohibición oficial de importación por raza de perro en las fuentes gubernamentales armenias o de la UEEA en la fecha de verificación. El procedimiento estándar de la UEEA se aplica a todos los perros, sea cual sea su raza. Estaba en preparación una ley nacional integral sobre el trato a los animales, por lo que las normas de tenencia e identificación dentro del país pueden cambiar — solo el texto oficial promulgado tendría valor vinculante."
    pt: "Nenhuma proibição oficial de importação por raça de cachorro foi identificada em fontes governamentais armênias ou da UEE na data da verificação. O procedimento padrão da UEE se aplica a todos os cachorros, independentemente da raça. Uma lei nacional abrangente sobre o tratamento de animais estava em preparação, então as regras de posse e identificação dentro do país podem mudar — só o texto oficial promulgado teria valor vinculante."
  cat1:
    en: "No published list of prohibited or dangerous breeds under Armenian law was found in official sources. If your dog is a breed restricted in other countries, confirm its status directly with the Food Safety Inspection Body before you travel."
    fr: "Aucune liste publiée de races interdites ou dangereuses au titre de la loi arménienne n'a été trouvée dans les sources officielles. Si ton chien est d'une race restreinte dans d'autres pays, confirme son statut directement auprès de l'Organe d'inspection de la sécurité alimentaire avant de voyager."
    es: "No se encontró en las fuentes oficiales ninguna lista publicada de razas prohibidas o peligrosas conforme a la legislación armenia. Si tu perro es de una raza restringida en otros países, confirma su situación directamente con el Organismo de Inspección de la Seguridad Alimentaria antes de viajar."
    pt: "Nenhuma lista publicada de raças proibidas ou perigosas segundo a lei armênia foi encontrada em fontes oficiais. Se o seu cachorro for de uma raça restrita em outros países, confirme a situação dele diretamente com o Serviço de Inspeção de Segurança Alimentar antes de viajar."
  cat2:
    en: "Because no breed ban is documented, the deciding factors for entry are the veterinary requirements (rabies and other vaccinations, health certificate) rather than the breed. This is an absence of documented restriction, not a guarantee — verify before booking."
    fr: "En l'absence d'interdiction de race documentée, les facteurs déterminants pour l'entrée sont les exigences vétérinaires (rage et autres vaccins, certificat sanitaire) plutôt que la race. Il s'agit d'une absence de restriction documentée, non d'une garantie — vérifie avant de réserver."
    es: "Como no hay ninguna prohibición de razas documentada, los factores determinantes para la entrada son los requisitos veterinarios (rabia y otras vacunas, certificado sanitario) y no la raza. Se trata de una ausencia de restricción documentada, no de una garantía — verifícalo antes de reservar."
    pt: "Como nenhuma proibição de raça está documentada, os fatores decisivos para a entrada são as exigências veterinárias (raiva e demais vacinas, atestado de saúde), e não a raça. Isso é uma ausência de restrição documentada, não uma garantia — verifique antes de reservar."
  note:
    en: "Requirements can change and local keeping rules may exist. Only official Armenian legislation is authoritative — confirm your dog's status before you travel."
    fr: "Les exigences peuvent changer et des règles locales de détention peuvent exister. Seule la législation arménienne officielle fait foi — confirme le statut de ton chien avant de voyager."
    es: "Los requisitos pueden cambiar y pueden existir normas locales de tenencia. Solo la legislación armenia oficial tiene valor vinculante — confirma la situación de tu perro antes de viajar."
    pt: "As exigências podem mudar e podem existir regras locais de posse. Só a legislação armênia oficial tem valor vinculante — confirme a situação do seu cachorro antes de viajar."

checklist:
  - en: "Veterinary passport or record identifying the dog and its vaccinations"
    fr: "Passeport ou carnet vétérinaire identifiant le chien et ses vaccinations"
    es: "Pasaporte o cartilla veterinaria que identifique al perro y sus vacunas"
    pt: "Passaporte ou carteira veterinária identificando o cachorro e suas vacinas"
  - en: "Valid rabies vaccination (dogs over 3 months; revaccinate and wait >20 days if lapsed)"
    fr: "Vaccination antirabique valide (chiens de plus de 3 mois ; revacciner et attendre >20 jours si expirée)"
    es: "Vacunación antirrábica válida (perros de más de 3 meses; revacuna y espera >20 días si ha caducado)"
    pt: "Vacinação antirrábica válida (cachorros com mais de 3 meses; revacine e espere >20 dias se estiver vencida)"
  - en: "Other required dog vaccinations: distemper, hepatitis, parvovirus, adenovirus type 2, leptospirosis"
    fr: "Autres vaccins exigés pour le chien : Carré, hépatite, parvovirose, adénovirus de type 2, leptospirose"
    es: "Otras vacunas exigidas para el perro: moquillo, hepatitis, parvovirus, adenovirus de tipo 2, leptospirosis"
    pt: "Outras vacinas obrigatórias para cachorros: cinomose, hepatite, parvovírus, adenovírus tipo 2, leptospirose"
  - en: "Official veterinary health certificate from the country of departure, issued after a clinical exam within 5 days of travel"
    fr: "Certificat sanitaire vétérinaire officiel du pays de départ, établi après un examen clinique dans les 5 jours avant le voyage"
    es: "Certificado sanitario veterinario oficial del país de salida, expedido tras un examen clínico en los 5 días previos al viaje"
    pt: "Atestado de saúde veterinário oficial do país de partida, emitido após um exame clínico feito nos 5 dias anteriores à viagem"
  - en: "ISO 11784/11785 microchip or legible tattoo recommended (identification not required by the EAEU)"
    fr: "Puce ISO 11784/11785 ou tatouage lisible recommandé (identification non exigée par l'UEEA)"
    es: "Microchip ISO 11784/11785 o tatuaje legible recomendado (identificación no exigida por la UEEA)"
    pt: "Microchip ISO 11784/11785 ou tatuagem legível recomendado (identificação não exigida pela UEE)"
  - en: "Documents for each animal separately (up to 5 dogs and cats in total per traveller)"
    fr: "Documents distincts pour chaque animal (jusqu'à 5 chiens et chats au total par voyageur)"
    es: "Documentos independientes para cada animal (hasta 5 perros y gatos en total por viajero)"
    pt: "Documentos separados para cada animal (até 5 cachorros e gatos no total por viajante)"
  - en: "Documents in Armenian, Russian or English, or with an official translation"
    fr: "Documents en arménien, russe ou anglais, ou avec une traduction officielle"
    es: "Documentos en armenio, ruso o inglés, o con una traducción oficial"
    pt: "Documentos em armênio, russo ou inglês, ou com tradução oficial"
  - en: "Enter via a checkpoint with veterinary control (e.g. Zvartnots Airport); suitable travel crate if travelling in the hold"
    fr: "Entrée par un point de passage avec contrôle vétérinaire (ex. aéroport de Zvartnots) ; caisse de transport adaptée si voyage en soute"
    es: "Entra por un punto de paso con control veterinario (p. ej. el aeropuerto de Zvartnots); jaula adecuada conforme a los requisitos aplicables si viaja en bodega"
    pt: "Entre por um posto com controle veterinário (por exemplo, o Aeroporto de Zvartnots); caixa de transporte adequada às normas IATA se for viajar no porão"

