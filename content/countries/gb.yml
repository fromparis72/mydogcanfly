    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "A pet may be put into quarantine for up to 4 months, or refused entry (if travelling by sea), if the rules are not followed.", fr: "Un animal peut être placé en quarantaine jusqu'à 4 mois, ou refusé à l'entrée (voyage par mer), si les règles ne sont pas respectées.", es: "Una mascota puede ser puesta en cuarentena hasta 4 meses, o se le puede denegar la entrada (si viaja por mar), si no se cumplen las normas.", pt: "O animal pode ficar em quarentena por até 4 meses, ou ter a entrada recusada (em viagem por mar), se as regras não forem cumpridas." }
    ref: { en: "GOV.UK — Bring your pet to Great Britain (What you need to do)", fr: "GOV.UK — Bring your pet to Great Britain (What you need to do)", es: "GOV.UK — Bring your pet to Great Britain (What you need to do)", pt: "GOV.UK — Levar seu animal de estimação para a Grã-Bretanha (o que fazer)" }

origin:
  eu:
    title: { en: "From the EU — travel document, no blood test", fr: "Depuis l'UE — document de voyage, sans prise de sang", es: "Desde la UE — documento de viaje, sin análisis de sangre", pt: "Da UE — documento de viagem, sem teste sorológico" }
    body:
      en: "From an EU country, your dog needs a microchip, a valid rabies vaccination (21-day wait) and one accepted document: an EU pet passport, a GB animal health certificate used within 6 months, or a Great Britain pet health certificate. A tapeworm treatment 24–120 hours before arrival is compulsory, and you must use an approved route. No blood test is required."
      fr: "Depuis un pays de l'UE, ton chien a besoin d'une puce, d'une vaccination antirabique valide (délai de 21 jours) et d'un document accepté : passeport européen, AHC britannique utilisé dans les 6 mois, ou certificat sanitaire britannique. Un traitement contre le ténia 24 à 120 heures avant l'arrivée est obligatoire, et tu dois emprunter un itinéraire approuvé. Aucune prise de sang n'est exigée."
      es: "Desde un país de la UE, tu perro necesita un microchip, una vacunación antirrábica válida (espera de 21 días) y un documento aceptado: un pasaporte europeo para mascotas, un AHC de GB usado dentro de los 6 meses, o un certificado sanitario para mascotas de Gran Bretaña. Un tratamiento contra la tenia 24–120 horas antes de la llegada es obligatorio, y debes usar una ruta aprobada. No se exige ningún análisis de sangre."
      pt: "Vindo de um país da UE, seu cachorro precisa de microchip, vacinação antirrábica válida (espera de 21 dias) e um documento aceito: passaporte europeu para animais, um animal health certificate britânico usado dentro de 6 meses ou o Great Britain pet health certificate. O tratamento contra a tênia de 24 a 120 horas antes da chegada é obrigatório, e você precisa usar uma rota aprovada. Nenhum teste sorológico é exigido."
    cls: ok
  listed:
    title: { en: "From a listed country — GB certificate, no blood test", fr: "Depuis un pays listé — certificat GB, sans prise de sang", es: "Desde un país listado — certificado GB, sin análisis de sangre", pt: "De um país listado — certificado GB, sem teste sorológico" }
    body:
      en: "From a listed country (such as the United States, Canada, Australia, Japan or Switzerland), your dog needs a microchip, a valid rabies vaccination and a Great Britain pet health certificate completed by an official vet. The compulsory tapeworm treatment and an approved route still apply. No rabies blood test is required."
      fr: "Depuis un pays listé (États-Unis, Canada, Australie, Japon, Suisse…), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire britannique complété par un vétérinaire officiel. Le traitement contre le ténia obligatoire et un itinéraire approuvé restent exigés. Aucune prise de sang antirabique n'est requise."
      es: "Desde un país listado (como Estados Unidos, Canadá, Australia, Japón o Suiza), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario para mascotas de Gran Bretaña cumplimentado por un veterinario oficial. El tratamiento obligatorio contra la tenia y una ruta aprobada siguen siendo exigidos. No se exige ninguna prueba de titulación de rabia."
      pt: "Vindo de um país listado (como Estados Unidos, Canadá, Austrália, Japão ou Suíça), seu cachorro precisa de microchip, vacinação antirrábica válida e do Great Britain pet health certificate preenchido por um veterinário oficial. O tratamento obrigatório contra a tênia e a rota aprovada continuam valendo. Nenhum teste sorológico antirrábico é exigido."
    cls: warn
  nonListed:
    title: { en: "From an unlisted country — blood test + 3-month wait", fr: "Depuis un pays non listé — prise de sang + 3 mois d'attente", es: "Desde un país no listado — prueba de titulación + espera de 3 meses", pt: "De um país não listado — teste sorológico + 3 meses de espera" }
    body:
      en: "From an unlisted country, add a rabies blood test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-approved laboratory, then a compulsory 3-month wait from the sampling date before travel. A Great Britain pet health certificate, the tapeworm treatment and an approved route are also required."
      fr: "Depuis un pays non listé, ajoute une prise de sang antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis délai obligatoire de 3 mois à compter du prélèvement avant le voyage. Un certificat sanitaire britannique, le traitement contre le ténia et un itinéraire approuvé sont également requis."
      es: "Desde un país no listado, añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses desde la fecha de la extracción antes de viajar. También se exigen un certificado sanitario para mascotas de Gran Bretaña, el tratamiento contra la tenia y una ruta aprobada."
      pt: "Vindo de um país não listado, acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias depois da vacinação, resultado igual ou superior a 0,5 UI/ml em laboratório aprovado pela UE, seguido de 3 meses obrigatórios de espera a contar da data da coleta antes da viagem. Também são exigidos o Great Britain pet health certificate, o tratamento contra a tênia e uma rota aprovada."
    cls: no

arrival:
  intro:
    en: "When your dog reaches Great Britain, its microchip and documents are checked; pets may also be checked before boarding by sea or Eurotunnel."
    fr: "À l'arrivée en Grande-Bretagne, la puce et les documents de ton chien sont contrôlés ; les animaux peuvent aussi être contrôlés avant l'embarquement par mer ou Eurotunnel."
    es: "Cuando tu perro llega a Gran Bretaña, se comprueban su microchip y sus documentos; las mascotas también pueden ser controladas antes de embarcar por mar o por Eurotunnel."
    pt: "Quando seu cachorro chega à Grã-Bretanha, o microchip e os documentos são conferidos; os animais também podem ser conferidos antes do embarque por mar ou pelo Eurotunnel."
  points:
    - en: "Checks confirm the microchip, rabies vaccination, travel document and the recorded tapeworm treatment (date and time)."
      fr: "Les contrôles vérifient la puce, la vaccination antirabique, le document de voyage et le traitement contre le ténia consigné (date et heure)."
      es: "Los controles verifican el microchip, la vacunación antirrábica, el documento de viaje y el tratamiento contra la tenia registrado (fecha y hora)."
      pt: "A conferência verifica o microchip, a vacinação antirrábica, o documento de viagem e o registro do tratamento contra a tênia (data e hora)."
    - en: "You must arrive on an approved route and operator, except when travelling within the UK or from Ireland."
      fr: "Tu dois arriver par un itinéraire et un opérateur approuvés, sauf pour un trajet au sein du R.-U. ou depuis l'Irlande."
      es: "Debes llegar por una ruta y un operador aprobados, salvo en un trayecto dentro del R. U. o desde Irlanda."
      pt: "Você precisa chegar por uma rota aprovada e uma transportadora autorizada, exceto em viagens dentro do Reino Unido ou vindas da Irlanda."
    - en: "Entering from outside the EU, your pet must clear customs before you collect it — an agent, travel company or airline can usually do this for you."
      fr: "En provenance hors UE, ton animal doit passer la douane avant que tu puissiez le récupérer — un agent, une compagnie de voyage ou la compagnie aérienne peut le faire pour toi."
      es: "Al llegar desde fuera de la UE, tu mascota debe pasar la aduana antes de que puedas recogerla — un agente, una empresa de viajes o la aerolínea suele poder hacerlo por ti."
      pt: "Vindo de fora da UE, seu animal precisa passar pela alfândega antes de você retirá-lo — em geral um despachante, uma agência de viagens ou a companhia aérea pode cuidar disso para você."
    - en: "If documents are missing or the dog was not properly prepared, it may be put into quarantine for up to 4 months or refused entry (by sea) — at the owner's expense."
      fr: "Si les documents manquent ou si le chien n'a pas été correctement préparé, il peut être placé en quarantaine jusqu'à 4 mois ou refusé à l'entrée (par mer) — aux frais du propriétaire."
      es: "Si faltan documentos o el perro no ha sido preparado correctamente, puede ser puesto en cuarentena hasta 4 meses o se le puede denegar la entrada (por mar) — a cargo del propietario."
      pt: "Se faltarem documentos ou se o cachorro não tiver sido preparado corretamente, ele pode ficar em quarentena por até 4 meses ou ter a entrada recusada (por mar) — às custas do proprietário."
    - en: "If the microchip cannot be read on arrival, the pet can be refused entry or quarantined, and the whole preparation may have to be repeated."
      fr: "Si la puce ne peut être lue à l'arrivée, l'animal peut être refusé ou mis en quarantaine, et toute la préparation peut devoir être refaite."
      es: "Si el microchip no puede leerse a la llegada, se puede denegar la entrada a la mascota o ponerla en cuarentena, y quizá haya que repetir toda la preparación."
      pt: "Se o microchip não puder ser lido na chegada, o animal pode ter a entrada recusada ou ficar em quarentena, e talvez seja preciso refazer toda a preparação."
    - en: "Banned types of dog are refused entry unless they already hold a valid Certificate of Exemption."
      fr: "Les types de chiens interdits sont refusés à l'entrée, sauf s'ils détiennent déjà un certificat d'exemption valide."
      es: "A los tipos de perro prohibidos se les deniega la entrada, salvo que ya dispongan de un certificado de exención válido."
      pt: "Os tipos de cachorro proibidos têm a entrada recusada, a não ser que já tenham um Certificate of Exemption (certificado de isenção) válido."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Great Britain does not use a permissive category system. Under the Dangerous Dogs Act 1991, certain types of dog are simply banned, and importing a banned type into Great Britain is illegal. Whether a dog is a banned type depends on what it looks like, not its breed name or pedigree."
    fr: "La Grande-Bretagne n'utilise pas de système de catégories permissives. En vertu du Dangerous Dogs Act 1991, certains types de chiens sont purement interdits, et importer un type interdit en Grande-Bretagne est illégal. Le caractère interdit dépend de l'apparence du chien, pas de son nom de race ni de son pedigree."
    es: "Gran Bretaña no utiliza un sistema de categorías permisivas. En virtud del Dangerous Dogs Act 1991, ciertos tipos de perro están simplemente prohibidos, e importar un tipo prohibido a Gran Bretaña es ilegal. Que un perro sea de un tipo prohibido depende de su apariencia, no del nombre de su raza ni de su pedigrí."
    pt: "A Grã-Bretanha não usa um sistema de categorias permissivas. Pelo Dangerous Dogs Act 1991 (lei sobre cachorros perigosos), certos tipos de cachorro são simplesmente proibidos, e importar um tipo proibido para a Grã-Bretanha é ilegal. Ser ou não um tipo proibido depende da aparência do cachorro, e não do nome da raça nem do pedigree."
  cat1:
    en: "Banned types (prohibited): Pit Bull Terrier, Japanese Tosa, Dogo Argentino, Fila Brasileiro and the XL Bully (added in 2023–2024). You cannot bring these into Great Britain unless the dog already holds a valid Certificate of Exemption. Owning a banned type unlawfully can mean an unlimited fine, up to 6 months in prison and destruction of the dog."
    fr: "Types interdits (prohibés) : Pit Bull Terrier, Tosa japonais, Dogo Argentino, Fila Brasileiro et l'XL Bully (ajouté en 2023–2024). Tu ne pouvez pas les faire entrer en Grande-Bretagne sauf si le chien détient déjà un certificat d'exemption valide. Détenir illégalement un type interdit peut entraîner une amende illimitée, jusqu'à 6 mois de prison et l'euthanasie du chien."
    es: "Tipos prohibidos: Pit Bull Terrier, Tosa japonés, Dogo Argentino, Fila Brasileiro y el XL Bully (añadido en 2023–2024). No puedes traerlos a Gran Bretaña salvo que el perro ya disponga de un certificado de exención válido. Tener ilegalmente un tipo prohibido puede acarrear una multa ilimitada, hasta 6 meses de prisión y el sacrificio del perro."
    pt: "Tipos proibidos: Pit Bull Terrier, Tosa Japonês, Dogo Argentino, Fila Brasileiro e o XL Bully (incluído em 2023–2024). Você não pode levá-los para a Grã-Bretanha, a não ser que o cachorro já tenha um Certificate of Exemption válido. Ter ilegalmente um tipo proibido pode custar multa sem limite de valor, até 6 meses de prisão e a eutanásia do cachorro."
  cat2:
    en: "There is no permissive second category: Great Britain uses a banned-type model, not the two-tier approach seen in some EU countries. The only route to keep a banned-type dog is an individual Certificate of Exemption, granted for the life of the dog (typically via a court's Contingent Destruction Order) with strict conditions — neutering, microchipping, muzzle and lead in public, and secure containment."
    fr: "Il n'existe pas de seconde catégorie permissive : la Grande-Bretagne applique un modèle de types interdits, et non l'approche à deux niveaux de certains pays de l'UE. La seule voie pour garder un chien de type interdit est un certificat d'exemption individuel, valable à vie (généralement via une ordonnance de destruction conditionnelle du tribunal) avec des conditions strictes : stérilisation, puçage, muselière et laisse en public, et détention sécurisée."
    es: "No existe una segunda categoría permisiva: Gran Bretaña aplica un modelo de tipos prohibidos, y no el enfoque de dos niveles que se ve en algunos países de la UE. La única vía para tener un perro de un tipo prohibido es un certificado de exención individual, concedido de por vida (normalmente mediante una orden judicial de destrucción condicional) con condiciones estrictas: esterilización, microchip, bozal y correa en público, y contención segura."
    pt: "Não existe uma segunda categoria permissiva: a Grã-Bretanha usa um modelo de tipos proibidos, e não a abordagem em dois níveis de alguns países da UE. A única forma de ficar com um cachorro de tipo proibido é um Certificate of Exemption individual, concedido para toda a vida do cachorro (em geral por meio de uma Contingent Destruction Order do tribunal), com condições rígidas: castração, microchip, focinheira e guia em público e contenção segura."
  note:
    en: "A dog that resembles a banned type may be treated as banned; it is the owner's responsibility to prove a dog is not a banned type. Exemption certificates are managed by the Index of Exempted Dogs (Defra); do not travel with a banned-type dog without confirming its legal status first."
    fr: "Un chien qui ressemble à un type interdit peut être traité comme tel ; il revient au propriétaire de prouver qu'un chien n'est pas d'un type interdit. Les certificats d'exemption sont gérés par l'Index of Exempted Dogs (Defra) ; ne voyage pas avec un chien de type interdit sans avoir d'abord confirmé son statut légal."
    es: "Un perro que se parezca a un tipo prohibido puede ser tratado como tal; corresponde al propietario demostrar que un perro no es de un tipo prohibido. Los certificados de exención los gestiona el Index of Exempted Dogs (Defra); no viajes con un perro de un tipo prohibido sin confirmar antes su situación legal."
    pt: "Um cachorro que se pareça com um tipo proibido pode ser tratado como proibido; cabe ao proprietário provar que o cachorro não é de um tipo proibido. Os certificados de isenção são administrados pelo Index of Exempted Dogs (Defra); não viaje com um cachorro de tipo proibido sem antes confirmar a situação legal dele."

checklist:
  - en: "Microchip (ISO 11784/11785) implanted before or with the rabies vaccination"
    fr: "Puce (ISO 11784/11785) posée avant ou avec la vaccination antirabique"
    es: "Microchip (ISO 11784/11785) implantado antes de la vacunación antirrábica o junto con ella"
    pt: "Microchip (ISO 11784/11785) implantado antes da vacinação antirrábica ou junto com ela"
  - en: "Valid rabies vaccination (dog ≥12 weeks at the shot, +21 days before travel)"
    fr: "Vaccination antirabique valide (chien ≥12 semaines, +21 jours avant le voyage)"
    es: "Vacunación antirrábica válida (perro ≥12 semanas en la vacuna, +21 días antes del viaje)"
    pt: "Vacinação antirrábica válida (cachorro com 12 semanas ou mais na aplicação, +21 dias antes da viagem)"
  - en: "Rabies blood test + 3-month wait — unlisted countries only"
    fr: "Prise de sang antirabique + 3 mois d'attente — pays non listés uniquement"
    es: "Prueba de titulación de rabia + espera de 3 meses — solo países no listados"
    pt: "Teste sorológico antirrábico + 3 meses de espera — apenas países não listados"
  - en: "Travel document: EU pet passport, GB animal health certificate, or Great Britain pet health certificate"
    fr: "Document de voyage : passeport européen, AHC britannique ou certificat sanitaire britannique"
    es: "Documento de viaje: pasaporte europeo para mascotas, certificado sanitario animal de GB o certificado sanitario para mascotas de Gran Bretaña"
    pt: "Documento de viagem: passaporte europeu para animais, animal health certificate britânico ou Great Britain pet health certificate"
  - en: "Vet tapeworm treatment recorded 24–120 hours before arrival"
    fr: "Traitement contre le ténia par le vétérinaire, consigné 24 à 120 heures avant l'arrivée"
    es: "Tratamiento contra la tenia por el veterinario, registrado 24–120 horas antes de la llegada"
    pt: "Tratamento contra a tênia aplicado pelo veterinário e registrado de 24 a 120 horas antes da chegada"
  - en: "Book an approved air, sea or rail route and operator"
    fr: "Réserve un itinéraire et un opérateur air/mer/rail approuvés"
    es: "Reserva una ruta y un operador aéreos, marítimos o ferroviarios aprobados"
    pt: "Reserve uma rota aprovada e uma transportadora autorizada, por via aérea, marítima ou ferroviária"
  - en: "Completed pet travel declaration (non-commercial movement)"
    fr: "Déclaration de voyage remplie (mouvement non commercial)"
    es: "Declaración de viaje de la mascota cumplimentada (movimiento no comercial)"
    pt: "Declaração de viagem do animal preenchida (movimentação não comercial)"
  - en: "Confirm your dog is not a banned type (Pit Bull Terrier, Japanese Tosa, Dogo Argentino, Fila Brasileiro, XL Bully)"
    fr: "Vérifie que ton chien n'est pas d'un type interdit (Pit Bull Terrier, Tosa japonais, Dogo Argentino, Fila Brasileiro, XL Bully)"
    es: "Confirma que tu perro no es de un tipo prohibido (Pit Bull Terrier, Tosa japonés, Dogo Argentino, Fila Brasileiro, XL Bully)"
    pt: "Confirme que seu cachorro não é de um tipo proibido (Pit Bull Terrier, Tosa Japonês, Dogo Argentino, Fila Brasileiro, XL Bully)"

