# Country Entry Guide — United Kingdom / Great Britain (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_gb
iso2: "GB"
name: { en: "United Kingdom", fr: "Royaume-Uni", es: "Reino Unido", pt: "Reino Unido" }
region: { en: "Europe (non-EU)", fr: "Europe (hors UE)", es: "Europa (fuera de la UE)", pt: "Europa (fora da UE)" }


regime: island_controlled
exit:
  authority: GOV.UK / APHA
  authorityUrl: https://www.gov.uk/taking-your-pet-abroad/getting-an-animal-health-certificate
  intro:
    en: "Leaving the UK for the EU, your dog needs an Animal Health Certificate (AHC) from an APHA-authorised Official Veterinarian — the GB pet passport is no longer valid for the EU."
    fr: "Pour sortir du Royaume-Uni vers l'UE, ton chien a besoin d'un Animal Health Certificate (AHC) établi par un vétérinaire officiel agréé APHA — le passeport britannique n'est plus valable pour l'UE."
    es: "Para salir del Reino Unido hacia la UE, tu perro necesita un Animal Health Certificate (AHC) de un veterinario oficial autorizado por APHA — el pasaporte británico ya no es válido para la UE."
    pt: "Para sair do Reino Unido rumo à UE, seu cachorro precisa de um Animal Health Certificate (AHC) emitido por um veterinário oficial autorizado pela APHA — o passaporte britânico para animais não vale mais para a UE."
  steps:
    - timing: window
      text:
        en: "See an APHA Official Veterinarian to get the AHC — valid for 10 days of travel."
        fr: "Consulte un vétérinaire officiel agréé APHA pour obtenir l'AHC — valable 10 jours pour voyager."
        es: "Acude a un veterinario oficial autorizado por APHA para obtener el AHC — válido 10 días para viajar."
        pt: "Procure um veterinário oficial autorizado pela APHA para obter o AHC — válido por 10 dias para viajar."
    - timing: before
      text:
        en: "Travel via an approved route/operator, microchip and rabies vaccination up to date."
        fr: "Voyage par une voie/opérateur agréé, puce et vaccin antirabique à jour."
        es: "Viaja por una vía/operador autorizado, con microchip y vacuna antirrábica al día."
        pt: "Viaje por uma rota aprovada / transportadora autorizada, com microchip e vacinação antirrábica em dia."
  onSiteNote:
    en: "Book the vet during your stay — a new AHC is needed for each trip."
    fr: "Prends rendez-vous chez le vétérinaire pendant ton séjour — un nouvel AHC est requis à chaque voyage."
    es: "Reserva el veterinario durante tu estancia — se necesita un AHC nuevo para cada viaje."
    pt: "Marque o veterinário durante sua estadia — é preciso um novo AHC a cada viagem."

hero:
  h1: { en: "Traveling to Great Britain with your dog", fr: "Voyager en Grande-Bretagne avec ton chien", es: "Viajar a Gran Bretaña con tu perro", pt: "Viajar para a Grã-Bretanha com seu cachorro" }
  intro:
    en: >-
      Great Britain (England, Wales and Scotland) welcomes dogs, but it is no longer in the EU and runs
      its own scheme — "Bring your pet dog, cat or ferret to Great Britain" — not the EU pet passport
      system. An ISO microchip and a valid rabies vaccination are always required, and — unlike most EU
      countries — a vet-administered tapeworm treatment is compulsory for every dog before arrival. You
      must also travel on an approved route. What else you need depends on where you are coming from: a
      dog from the EU or a listed country needs a travel document but no blood test, while a dog from an
      unlisted country also needs a rabies blood test and a three-month wait. This guide explains each
      case so you know exactly what to prepare before you book. Northern Ireland is not covered by this
      scheme: it stays inside the EU pet travel area and applies its own rules, so check it separately.
      Since 4 June 2025 a Great Britain resident needs a free Northern Ireland Pet Travel Document to
      bring a dog there, and anyone flying from Great Britain must tell DAERA at least 10 working days
      before departure — see the Northern Ireland sources at the bottom of this page.
    fr: >-
      La Grande-Bretagne (Angleterre, Pays de Galles et Écosse) accueille les chiens, mais elle n'est
      plus dans l'UE et applique son propre régime — « Bring your pet dog, cat or ferret to Great
      Britain » — et non le passeport européen. Une puce ISO et une vaccination antirabique valide sont
      toujours exigées et — contrairement à la plupart des pays de l'UE — un traitement contre le ténia
      administré par un vétérinaire est obligatoire pour chaque chien avant l'arrivée. Tu dois aussi
      voyager par un itinéraire approuvé. Le reste dépend de ton provenance : un chien venant de l'UE
      ou d'un pays listé a besoin d'un document de voyage mais pas de prise de sang, tandis qu'un chien
      venant d'un pays non listé doit aussi passer une prise de sang antirabique et attendre trois mois.
      Ce guide détaille chaque cas pour savoir exactement quoi préparer avant de réserver. L'Irlande du
      Nord n'est pas couverte par ce régime : elle reste dans l'espace européen de circulation des
      animaux de compagnie et applique ses propres règles, à consulter séparément. Depuis le 4 juin
      2025, un résident de Grande-Bretagne doit obtenir un Northern Ireland Pet Travel Document gratuit
      pour y emmener son chien, et tout vol au départ de la Grande-Bretagne impose de prévenir le DAERA
      au moins 10 jours ouvrés avant le départ — voir les sources Irlande du Nord en bas de page.
    es: >-
      Gran Bretaña (Inglaterra, Gales y Escocia) acoge a los perros, pero ya no forma parte de la UE y
      aplica su propio régimen — "Bring your pet dog, cat or ferret to Great Britain" — y no el sistema
      de pasaporte europeo para mascotas. Siempre se exigen un microchip ISO y una vacunación
      antirrábica válida y — a diferencia de la mayoría de los países de la UE — un tratamiento contra la
      tenia administrado por un veterinario es obligatorio para cada perro antes de la llegada. También
      debes viajar por una ruta aprobada. Lo demás depende del país del que vengas: un perro de la UE o
      de un país listado necesita un documento de viaje, pero no un análisis de sangre, mientras que un
      perro de un país no listado necesita además una prueba de titulación de rabia y una espera de tres
      meses. Esta guía explica cada caso para que sepas exactamente qué preparar antes de reservar.
      Irlanda del Norte no está cubierta por este régimen: sigue dentro del espacio europeo de
      circulación de mascotas y aplica sus propias normas, así que consúltala por separado. Desde el 4
      de junio de 2025, un residente de Gran Bretaña necesita un Northern Ireland Pet Travel Document
      gratuito para llevar allí a su perro, y todo vuelo desde Gran Bretaña obliga a avisar al DAERA con
      al menos 10 días hábiles de antelación — consulta las fuentes sobre Irlanda del Norte al final.

    pt: "A Grã-Bretanha (Inglaterra, País de Gales e Escócia) recebe bem os cachorros, mas não faz mais parte da UE e aplica o próprio regime — “Bring your pet dog, cat or ferret to Great Britain” —, e não o sistema europeu de passaporte para animais. Microchip ISO e vacinação antirrábica válida são sempre obrigatórios e — ao contrário da maioria dos países da UE — o tratamento contra a tênia (Echinococcus) aplicado por um veterinário é obrigatório para todo cachorro antes da chegada. Você também precisa viajar por uma rota aprovada. O resto depende de onde você vem: um cachorro que parte da UE ou de um país listado precisa de um documento de viagem, mas não de teste sorológico, enquanto um cachorro vindo de um país não listado precisa também do teste sorológico antirrábico e de três meses de espera. Este guia explica cada caso para você saber exatamente o que preparar antes de comprar a passagem. A Irlanda do Norte não é coberta por esse regime: ela continua dentro do espaço europeu de circulação de animais de estimação e aplica as próprias regras, então consulte-a à parte. Desde 4 de junho de 2025, quem mora na Grã-Bretanha precisa de um Northern Ireland Pet Travel Document gratuito para levar um cachorro até lá, e quem voa a partir da Grã-Bretanha precisa avisar o DAERA com pelo menos 10 dias úteis de antecedência — veja as fontes sobre a Irlanda do Norte no fim desta página."
difficulty:
  level: moderate
  label: { en: "Moderate — tapeworm treatment always required", fr: "Modéré — traitement contre le ténia toujours requis", es: "Moderado — tratamiento contra la tenia siempre obligatorio", pt: "Moderado — tratamento contra a tênia sempre obrigatório" }

prepTime:
  eu:
    en: "From the EU: a few days if microchip and rabies are up to date; add the tapeworm treatment 24–120 hours before arrival. Allow ~3 weeks if the first rabies shot is still needed (21-day wait)."
    fr: "Depuis l'UE : quelques jours si puce et rage sont à jour ; ajoute le traitement contre le ténia 24 à 120 heures avant l'arrivée. Compte ~3 semaines si la première vaccination reste à faire (délai de 21 jours)."
    es: "Desde la UE: unos días si el microchip y la rabia están al día; añade el tratamiento contra la tenia 24–120 horas antes de la llegada. Cuenta ~3 semanas si aún falta la primera vacuna antirrábica (espera de 21 días)."
    pt: "Da UE: alguns dias se o microchip e a vacina antirrábica estiverem em dia; acrescente o tratamento contra a tênia de 24 a 120 horas antes da chegada. Conte cerca de 3 semanas se ainda faltar a primeira dose antirrábica (espera de 21 dias)."
  listed:
    en: "From a listed country: ~3–4 weeks — microchip, rabies with a 21-day wait, a Great Britain pet health certificate, and the tapeworm treatment 24–120 hours before arrival. No blood test."
    fr: "Depuis un pays listé : ~3–4 semaines — puce, rage avec délai de 21 jours, certificat sanitaire britannique et traitement contre le ténia 24 à 120 heures avant l'arrivée. Pas de prise de sang."
    es: "Desde un país listado: ~3–4 semanas — microchip, rabia con una espera de 21 días, un certificado sanitario para mascotas de Gran Bretaña y el tratamiento contra la tenia 24–120 horas antes de la llegada. Sin análisis de sangre."
    pt: "De um país listado: cerca de 3 a 4 semanas — microchip, vacina antirrábica com espera de 21 dias, o Great Britain pet health certificate e o tratamento contra a tênia de 24 a 120 horas antes da chegada. Sem teste sorológico."
  nonListed:
    en: "From an unlisted country: ~4 months+ — add a rabies blood test taken at least 30 days after vaccination, then a compulsory 3-month wait before travel, plus the tapeworm treatment before arrival."
    fr: "Depuis un pays non listé : ~4 mois et plus — ajoute une prise de sang antirabique au moins 30 jours après le vaccin, puis un délai obligatoire de 3 mois avant le départ, plus le traitement contre le ténia avant l'arrivée."
    es: "Desde un país no listado: ~4 meses o más — añade una prueba de titulación de rabia tomada al menos 30 días después de la vacuna, y luego una espera obligatoria de 3 meses antes de viajar, más el tratamiento contra la tenia antes de la llegada."
    pt: "De um país não listado: cerca de 4 meses ou mais — acrescente um teste sorológico antirrábico coletado no mínimo 30 dias depois da vacinação, seguido de 3 meses obrigatórios de espera antes da viagem, além do tratamento contra a tênia antes da chegada."

