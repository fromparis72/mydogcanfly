factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Great Britain (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — la Grande-Bretagne (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Gran Bretaña (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — a Grã-Bretanha (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — Great Britain", fr: "Pays de destination — Grande-Bretagne", es: "País de destino — Gran Bretaña", pt: "País de destino — Grã-Bretanha" }
      text:
        en: "Great Britain applies its own scheme: an ISO microchip and a valid rabies vaccination are always required, a compulsory tapeworm treatment applies to every dog, and you must use an approved travel route."
        fr: "La Grande-Bretagne applique son propre régime : puce ISO et vaccination antirabique valide toujours exigées, traitement contre le ténia obligatoire pour chaque chien, et itinéraire de voyage approuvé obligatoire."
        es: "Gran Bretaña aplica su propio régimen: siempre se exigen un microchip ISO y una vacunación antirrábica válida, un tratamiento contra la tenia obligatorio para cada perro, y debes usar una ruta de viaje aprobada."
        pt: "A Grã-Bretanha aplica o próprio regime: microchip ISO e vacinação antirrábica válida são sempre obrigatórios, o tratamento contra a tênia (Echinococcus) é obrigatório para todo cachorro e você precisa usar uma rota de viagem aprovada."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Whether your dog leaves from the EU, a listed country or an unlisted country decides which travel document you need and whether a rabies blood test plus a three-month wait are required."
        fr: "Que ton chien parte de l'UE, d'un pays listé ou d'un pays non listé détermine le document de voyage nécessaire et l'obligation ou non d'une prise de sang antirabique suivie d'un délai de trois mois."
        es: "Que tu perro salga de la UE, de un país listado o de un país no listado determina qué documento de viaje necesitas y si se exigen una prueba de titulación de rabia y una espera de tres meses."
        pt: "Partir da UE, de um país listado ou de um país não listado é o que define qual documento de viagem você precisa e se o teste sorológico antirrábico e a espera de três meses são exigidos."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay in an unlisted, rabies-risk country can trigger the blood test even if you fly in from a listed country. It is your dog's real origin and history that count — not only the last airport."
        fr: "Un séjour récent dans un pays non listé à risque rabique peut imposer la prise de sang même si tu arrives d'un pays listé. C'est l'origine réelle et l'historique du chien qui comptent — pas seulement l'aéroport de destination finale."
        es: "Una estancia reciente en un país no listado con riesgo de rabia puede obligar a la prueba de titulación aunque llegues desde un país listado. Lo que cuenta es el origen y el historial reales de tu perro — no solo el último aeropuerto."
        pt: "Uma estadia recente em um país não listado, de risco de raiva, pode acionar a exigência do teste sorológico mesmo que você chegue de um país listado. O que conta é a origem e o histórico reais do seu cachorro — não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Great Britain's framework, then confirm your dog's exact origin and history with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre britannique, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Gran Bretaña y luego confirma el origen y el historial exactos de tu perro con tu veterinario."
    pt: "Leia então as exigências abaixo como o quadro geral da Grã-Bretanha e confirme com seu veterinário a origem e o histórico exatos do seu cachorro."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Must be implanted before, or at the same time as, the rabies vaccination; must meet ISO 11784/11785.", fr: "Doit être posée avant, ou en même temps que, la vaccination antirabique ; doit être conforme à l'ISO 11784/11785.", es: "Debe implantarse antes de la vacunación antirrábica, o al mismo tiempo; debe cumplir la norma ISO 11784/11785.", pt: "Precisa ser implantado antes da vacinação antirrábica, ou no mesmo momento; deve atender à norma ISO 11784/11785." }
    exceptions: { en: "A clearly legible tattoo is accepted only if done on or before 3 July 2011 and before vaccination.", fr: "Un tatouage clairement lisible n'est accepté que s'il est antérieur ou égal au 3 juillet 2011 et fait avant la vaccination.", es: "Un tatuaje claramente legible solo se acepta si se hizo el 3 de julio de 2011 o antes, y antes de la vacunación.", pt: "Uma tatuagem claramente legível só é aceita se tiver sido feita em 3 de julho de 2011 ou antes, e antes da vacinação." }
    ref: { en: "GOV.UK — Bring your pet to Great Britain (Microchip)", fr: "GOV.UK — Bring your pet to Great Britain (Microchip)", es: "GOV.UK — Bring your pet to Great Britain (Microchip)", pt: "GOV.UK — Levar seu animal de estimação para a Grã-Bretanha (microchip)" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Microchip first; wait at least 21 full days after the first vaccination (or the last of the primary course) before travelling.", fr: "Puce d'abord ; attends au moins 21 jours pleins après la première vaccination (ou la dernière de la primo-vaccination) avant de voyager.", es: "Primero el microchip; espera al menos 21 días completos después de la primera vacunación (o la última de la primovacunación) antes de viajar.", pt: "Primeiro o microchip; espere no mínimo 21 dias completos depois da primeira vacinação (ou da última dose da primovacinação) antes de viajar." }
    exceptions: { en: "If the microchip was implanted after the vaccination, the dog must be vaccinated again.", fr: "Si la puce a été posée après le vaccin, le chien doit être revacciné.", es: "Si el microchip se implantó después de la vacuna, hay que volver a vacunar al perro.", pt: "Se o microchip foi implantado depois da vacinação, o cachorro precisa ser vacinado de novo." }
    ref: { en: "GOV.UK — Rabies vaccination and boosters", fr: "GOV.UK — Rabies vaccination and boosters", es: "GOV.UK — Rabies vaccination and boosters", pt: "GOV.UK — Vacinação antirrábica e reforços" }
  - item: { en: "Rabies blood test", fr: "Prise de sang antirabique", es: "Prueba de titulación de rabia", pt: "Teste sorológico antirrábico" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Unlisted origins only: blood taken ≥30 days after vaccination, result ≥0.5 IU/ml at an EU-approved lab, then a 3-month wait from the sampling date before travel.", fr: "Pays non listés : sang prélevé ≥30 jours après le vaccin, résultat ≥0,5 UI/ml dans un labo agréé UE, puis délai de 3 mois à compter du prélèvement avant le voyage.", es: "Solo orígenes no listados: sangre extraída ≥30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera de 3 meses desde la fecha de la extracción antes de viajar.", pt: "Apenas para origens não listadas: sangue coletado 30 dias ou mais depois da vacinação, resultado igual ou superior a 0,5 UI/ml em laboratório aprovado pela UE, seguido de 3 meses de espera a contar da data da coleta antes da viagem." }
    exceptions: { en: "Not required from the EU or from listed countries; the 3-month wait is waived if the pet was vaccinated and blood tested in the EU before travelling to an unlisted country.", fr: "Non requis depuis l'UE ou les pays listés ; le délai de 3 mois est levé si l'animal a été vacciné et testé dans l'UE avant de se rendre dans un pays non listé.", es: "No se exige desde la UE ni desde países listados; la espera de 3 meses se suprime si la mascota fue vacunada y analizada en la UE antes de viajar a un país no listado.", pt: "Não é exigido para quem vem da UE ou de países listados; os 3 meses de espera são dispensados se o animal foi vacinado e testado na UE antes de viajar para um país não listado." }
    ref: { en: "GOV.UK — Blood tests for rabies", fr: "GOV.UK — Blood tests for rabies", es: "GOV.UK — Blood tests for rabies", pt: "GOV.UK — Testes sorológicos antirrábicos" }
  - item: { en: "EU pet passport", fr: "Passeport européen", es: "Pasaporte europeo para mascotas", pt: "Passaporte europeu para animais" }
    required: { en: "Accepted document", fr: "Document accepté", es: "Documento aceptado", pt: "Documento aceito" }
    when: { en: "A pet passport issued in an EU country (or certain other countries) is accepted for entry from the EU; it records the microchip, rabies vaccination and tapeworm treatment.", fr: "Un passeport délivré dans un pays de l'UE (ou certains autres pays) est accepté à l'entrée depuis l'UE ; il consigne la puce, la vaccination antirabique et le traitement contre le ténia.", es: "Un pasaporte para mascotas expedido en un país de la UE (o en algunos otros países) se acepta para entrar desde la UE; registra el microchip, la vacunación antirrábica y el tratamiento contra la tenia.", pt: "Um passaporte para animais emitido em um país da UE (ou em alguns outros países) é aceito na entrada vindo da UE; ele registra o microchip, a vacinação antirrábica e o tratamento contra a tênia." }
    exceptions: { en: "GB-issued pet passports are only valid if issued before 1 January 2021.", fr: "Les passeports délivrés en GB ne sont valides que s'ils ont été émis avant le 1er janvier 2021.", es: "Los pasaportes para mascotas expedidos en GB solo son válidos si se emitieron antes del 1 de enero de 2021.", pt: "Os passaportes emitidos na Grã-Bretanha só valem se tiverem sido emitidos antes de 1º de janeiro de 2021." }
    ref: { en: "GOV.UK — Which pet travel document you need", fr: "GOV.UK — Which pet travel document you need", es: "GOV.UK — Which pet travel document you need", pt: "GOV.UK — Qual documento de viagem você precisa" }
  - item: { en: "Animal health certificate (AHC)", fr: "Certificat sanitaire animal (AHC)", es: "Certificado sanitario animal (AHC)", pt: "Animal health certificate (AHC) — certificado sanitário" }
    required: { en: "Accepted document", fr: "Document accepté", es: "Documento aceptado", pt: "Documento aceito" }
    when: { en: "A GB-issued AHC used within 6 months is accepted for entry from the EU and some listed countries.", fr: "Un AHC délivré en GB et utilisé dans les 6 mois est accepté à l'entrée depuis l'UE et certains pays listés.", es: "Un AHC expedido en GB y usado dentro de los 6 meses se acepta para entrar desde la UE y algunos países listados.", pt: "Um AHC emitido na Grã-Bretanha e usado dentro de 6 meses é aceito na entrada vindo da UE e de alguns países listados." }
    exceptions: { en: "Replaced by a Great Britain pet health certificate for most non-EU / listed origins.", fr: "Remplacé par un certificat sanitaire britannique pour la plupart des origines hors UE / listées.", es: "Se sustituye por un certificado sanitario para mascotas de Gran Bretaña para la mayoría de los orígenes fuera de la UE / listados.", pt: "Substituído pelo Great Britain pet health certificate (certificado sanitário britânico) na maioria das origens fora da UE / listadas." }
    ref: { en: "GOV.UK — Animal health certificate (AHC)", fr: "GOV.UK — Animal health certificate (AHC)", es: "GOV.UK — Animal health certificate (AHC)", pt: "GOV.UK — Animal health certificate (AHC)" }
  - item: { en: "Great Britain pet health certificate", fr: "Certificat sanitaire britannique (GB)", es: "Certificado sanitario para mascotas de Gran Bretaña", pt: "Great Britain pet health certificate (certificado sanitário britânico)" }
    required: { en: "Required for most non-EU origins", fr: "Requis pour la plupart des origines hors UE", es: "Obligatorio para la mayoría de los orígenes fuera de la UE", pt: "Obrigatório para a maioria das origens fora da UE" }
    when: { en: "Needed to enter from listed and unlisted countries; issued/completed by an official vet before travel.", fr: "Nécessaire pour entrer depuis les pays listés et non listés ; établi/complété par un vétérinaire officiel avant le voyage.", es: "Necesario para entrar desde países listados y no listados; expedido/cumplimentado por un veterinario oficial antes del viaje.", pt: "Necessário para entrar vindo de países listados e não listados; emitido e preenchido por um veterinário oficial antes da viagem." }
    exceptions: { en: "Not needed from Northern Ireland, the Channel Islands or the Isle of Man.", fr: "Inutile depuis l'Irlande du Nord, les îles Anglo-Normandes ou l'île de Man.", es: "No necesario desde Irlanda del Norte, las Islas del Canal ni la Isla de Man.", pt: "Não é necessário vindo da Irlanda do Norte, das Ilhas do Canal ou da Ilha de Man." }
    ref: { en: "GOV.UK — Great Britain pet health certificate", fr: "GOV.UK — Great Britain pet health certificate", es: "GOV.UK — Great Britain pet health certificate", pt: "GOV.UK — Great Britain pet health certificate" }
  - item: { en: "Tapeworm (Echinococcus) treatment", fr: "Traitement contre le ténia (Echinococcus)", es: "Tratamiento contra la tenia (Echinococcus)", pt: "Tratamento contra a tênia (Echinococcus)" }
    required: { en: "Required for dogs", fr: "Requis pour les chiens", es: "Obligatorio para perros", pt: "Obrigatórias para cachorros" }
    when: { en: "Given by a vet no less than 24 hours and no more than 120 hours (5 days) before arrival; must contain praziquantel or an equivalent and be recorded (date, time, product) in the travel document.", fr: "Administré par un vétérinaire au moins 24 heures et au plus 120 heures (5 jours) avant l'arrivée ; doit contenir du praziquantel ou un équivalent et être consigné (date, heure, produit) dans le document de voyage.", es: "Administrado por un veterinario no menos de 24 horas y no más de 120 horas (5 días) antes de la llegada; debe contener praziquantel o un equivalente y quedar registrado (fecha, hora, producto) en el documento de viaje.", pt: "Aplicado por um veterinário no mínimo 24 horas e no máximo 120 horas (5 dias) antes da chegada; precisa conter praziquantel ou equivalente e ser registrado (data, hora, produto) no documento de viagem." }
    exceptions: { en: "Not required when coming directly from Finland, Ireland, Northern Ireland, Malta or Norway.", fr: "Non requis en provenance directe de la Finlande, l'Irlande, l'Irlande du Nord, Malte ou la Norvège.", es: "No obligatorio cuando se llega directamente de Finlandia, Irlanda, Irlanda del Norte, Malta o Noruega.", pt: "Não é exigido para quem vem diretamente da Finlândia, da Irlanda, da Irlanda do Norte, de Malta ou da Noruega." }
    ref: { en: "GOV.UK — Tapeworm treatment for dogs", fr: "GOV.UK — Tapeworm treatment for dogs", es: "GOV.UK — Tapeworm treatment for dogs", pt: "GOV.UK — Tratamento contra a tênia para cachorros" }
  - item: { en: "Approved travel route", fr: "Itinéraire de voyage approuvé", es: "Ruta de viaje aprobada", pt: "Rota de viagem aprovada" }
    required: { en: "Required", fr: "Requis", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "You must enter on an approved air, sea or rail route and operator; by plane, pets travel as cargo unless on a charter flight or an assistance dog.", fr: "Tu dois entrer par un itinéraire et un opérateur air/mer/rail approuvés ; en avion, les animaux voyagent en fret sauf vol charter ou chien d'assistance.", es: "Debes entrar por una ruta y un operador aéreos, marítimos o ferroviarios aprobados; en avión, las mascotas viajan como carga, salvo en vuelo chárter o perro de asistencia.", pt: "Você precisa entrar por uma rota aprovada e uma transportadora autorizada, por via aérea, marítima ou ferroviária; de avião, os animais de estimação viajam como carga — não podem ir na cabine —, salvo em voo fretado ou se for cão de assistência." }
    exceptions: { en: "Not required for travel within the UK or from Ireland.", fr: "Non requis pour un trajet au sein du R.-U. ou depuis l'Irlande.", es: "No obligatoria para un trayecto dentro del R. U. o desde Irlanda.", pt: "Não é exigida em viagens dentro do Reino Unido ou vindas da Irlanda." }
    ref: { en: "GOV.UK — Travel routes for pets", fr: "GOV.UK — Travel routes for pets", es: "GOV.UK — Travel routes for pets", pt: "GOV.UK — Rotas de viagem para animais de estimação" }
  - item: { en: "Owner declaration (non-commercial)", fr: "Déclaration du propriétaire (non commercial)", es: "Declaración del propietario (no comercial)", pt: "Declaração do proprietário (não comercial)" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Complete a pet travel declaration confirming you will not sell or transfer ownership of the pet.", fr: "Remplis une déclaration de voyage confirmant que tu ne vendrez ni ne céderez la propriété de l'animal.", es: "Cumplimenta una declaración de viaje de la mascota confirmando que no venderás ni cederás la propiedad del animal.", pt: "Preencha uma declaração de viagem confirmando que você não vai vender nem transferir a propriedade do animal." }
    exceptions: { en: "Commercial movements or rehoming follow the stricter Balai rules instead.", fr: "Les mouvements commerciaux ou les cessions relèvent des règles Balai, plus strictes.", es: "Los movimientos comerciales o las cesiones se rigen en cambio por las normas Balai, más estrictas.", pt: "Movimentações comerciais ou doações para um novo lar seguem, em vez disso, as regras Balai, mais rígidas." }
    ref: { en: "GOV.UK — Pet travel declaration", fr: "GOV.UK — Pet travel declaration", es: "GOV.UK — Pet travel declaration", pt: "GOV.UK — Declaração de viagem do animal de estimação" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "Effectively ≥15 weeks", fr: "En pratique ≥15 semaines", es: "En la práctica ≥15 semanas", pt: "Na prática, ≥15 semanas" }
    when: { en: "Rabies vaccine cannot be given before 12 weeks, then a 21-day wait applies (about 4 months from an unlisted country after the blood test and wait).", fr: "Le vaccin antirabique ne peut être fait avant 12 semaines, puis un délai de 21 jours s'applique (environ 4 mois depuis un pays non listé après la prise de sang et le délai).", es: "La vacuna antirrábica no puede administrarse antes de las 12 semanas, y luego se aplica una espera de 21 días (unos 4 meses desde un país no listado tras la prueba de titulación y la espera).", pt: "A vacina antirrábica não pode ser aplicada antes das 12 semanas e, depois, vale a espera de 21 dias (cerca de 4 meses vindo de um país não listado, somando o teste sorológico e a espera)." }
    exceptions: { en: "Unvaccinated young puppies cannot meet the rabies rule and so cannot enter under this scheme.", fr: "Un jeune chiot non vacciné ne peut satisfaire la règle antirabique et ne peut donc entrer via ce régime.", es: "Un cachorro joven sin vacunar no puede cumplir la norma antirrábica y, por tanto, no puede entrar por este régimen.", pt: "Filhotes novos e não vacinados não conseguem cumprir a regra da raiva e, portanto, não podem entrar por esse regime." }
    ref: { en: "GOV.UK — Rabies vaccination and boosters", fr: "GOV.UK — Rabies vaccination and boosters", es: "GOV.UK — Rabies vaccination and boosters", pt: "GOV.UK — Vacinação antirrábica e reforços" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
