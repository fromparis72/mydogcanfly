origin:
  scheme: eu
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate and no systematic border check — only non-discriminatory documentary and identity spot checks by customs or veterinary inspectors."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire et pas de contrôle frontalier systématique — seulement des contrôles documentaires et d'identité ponctuels et non discriminatoires par la douane ou les inspecteurs vétérinaires."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario y sin control fronterizo sistemático — solo controles documentales y de identidad puntuales y no discriminatorios por parte de la aduana o los inspectores veterinarios."
      pt: "Um cachorro que vem de outro país da UE precisa de um passaporte europeu para animais que comprove um microchip ISO válido e uma vacinação antirrábica em dia. Sem teste sorológico antirrábico, sem certificado sanitário e sem controle sistemático na fronteira — apenas conferências documentais e de identidade pontuais e não discriminatórias feitas pela alfândega ou por inspetores veterinários."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Switzerland, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination and an EU animal health certificate endorsed by an official vet before departure. No antibody test is required; enter via a designated travellers' point of entry where customs run a documentary and identity check."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Suisse, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire européen visé par un vétérinaire officiel avant le départ. Pas de titrage ; entre par un point d'entrée voyageurs désigné où la douane effectue un contrôle documentaire et d'identité."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Suiza, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal de la UE refrendado por un veterinario oficial antes de la salida. No se exige prueba de titulación; entra por un punto de entrada de viajeros designado donde la aduana realiza un control documental y de identidad."
      pt: "De um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Suíça, Japão, Austrália e outros), o seu cachorro precisa de microchip, vacinação antirrábica válida e certificado sanitário europeu visado por um veterinário oficial antes da partida. Não é exigido teste sorológico antirrábico; entre por um ponto de entrada designado para viajantes, onde a alfândega faz a conferência documental e de identidade."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-approved laboratory, then a compulsory 3-month wait before entry. An endorsed EU animal health certificate is also required, and entry must be through a designated point of entry."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen visé est également requis, et l'entrée doit se faire par un point d'entrée désigné."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exige un certificado sanitario animal de la UE refrendado, y la entrada debe realizarse por un punto de entrada designado."
      pt: "De um país não listado (de risco), acrescente um teste sorológico antirrábico: sangue coletado pelo menos 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório aprovado pela UE e, depois, uma espera obrigatória de 3 meses antes da entrada. Também é exigido um certificado sanitário europeu visado, e a entrada precisa ser feita por um ponto de entrada designado."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Croatia depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien en Croatie dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Croacia depende del lugar desde el que hayas volado."
    pt: "O que acontece quando o seu cachorro chega à Croácia depende do lugar de onde você voou."
  points:
    - from: eu
      en: "From another EU country: no systematic border check — keep the EU pet passport with you for possible spot checks."
      fr: "Depuis un autre pays de l'UE : pas de contrôle systématique — garde le passeport européen sur toi pour d'éventuels contrôles ponctuels."
      es: "Desde otro país de la UE: sin control fronterizo sistemático — lleva contigo el pasaporte europeo por si hay controles puntuales."
      pt: "De outro país da UE: sem controle sistemático na fronteira — leve o passaporte europeu para animais com você para eventuais conferências pontuais."
    - from: non_eu
      en: "From outside the EU: enter via a designated travellers' point of entry (listed in Official Gazette 53/23) where customs officers run the documentary and identity check."
      fr: "Depuis hors UE : entre par un point d'entrée voyageurs désigné (listé au Journal officiel 53/23) où les douaniers effectuent le contrôle documentaire et d'identité."
      es: "Desde fuera de la UE: entra por un punto de entrada de viajeros designado (listado en el Boletín Oficial 53/23) donde los agentes de aduanas realizan el control documental y de identidad."
      pt: "De fora da UE: entre por um ponto de entrada designado para viajantes (listado no Diário Oficial 53/23), onde os agentes da alfândega fazem a conferência documental e de identidade."
    - en: "Present the identification document (EU pet passport or EU animal health certificate) and a written statement that the dog is not intended for sale or transfer of ownership."
      fr: "Présente le document d'identification (passeport européen ou certificat sanitaire UE) et une déclaration écrite attestant que le chien n'est pas destiné à la vente ou au transfert de propriété."
      es: "Presenta el documento de identificación (pasaporte europeo o certificado sanitario animal de la UE) y una declaración escrita de que el perro no está destinado a la venta ni al traspaso de propiedad."
      pt: "Apresente o documento de identificação (passaporte europeu para animais ou certificado sanitário europeu) e uma declaração escrita de que o cachorro não se destina à venda nem à transferência de propriedade."
    - en: "Carry original documents (not copies); an official translation may be requested if they are not in Croatian or English."
      fr: "Munis-toi des documents originaux (pas de copies) ; une traduction officielle peut être exigée s'ils ne sont pas en croate ou en anglais."
      es: "Lleva los documentos originales (no copias); puede solicitarse una traducción oficial si no están en croata o en inglés."
      pt: "Leve os documentos originais (não cópias); pode ser exigida uma tradução oficial se eles não estiverem em croata ou inglês."
    - en: "If documents are missing or invalid, entry is refused: the dog may be returned to the country of departure, placed in quarantine until conditions are met, or, as a last resort, put down — all at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, l'entrée est refusée : le chien peut être renvoyé au pays de départ, placé en quarantaine jusqu'à régularisation ou, en dernier recours, euthanasié — le tout aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, se deniega la entrada: el perro puede ser devuelto al país de salida, puesto en cuarentena hasta que se cumplan las condiciones o, como último recurso, sacrificado — todo a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, a entrada é recusada: o cachorro pode ser devolvido ao país de partida, colocado em quarentena até que as condições sejam cumpridas ou, em último caso, sacrificado — tudo às custas do tutor."
    - en: "Bull-terrier-type dogs without an FCI pedigree are refused entry, including in transit and for a temporary stay."
      fr: "Les chiens de type bull-terrier sans pedigree FCI sont refusés à l'entrée, y compris en transit et pour un séjour temporaire."
      es: "Los perros de tipo bull terrier sin pedigrí FCI tienen la entrada denegada, incluso en tránsito y para una estancia temporal."
      pt: "Cachorros do tipo bull terrier sem pedigree FCI têm a entrada recusada, inclusive em trânsito e para estadia temporária."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Croatia regulates dangerous dogs under the Ordinance on Dangerous Dogs (Official Gazette 117/08) and the Animal Protection Act (Official Gazette 102/17, 32/19). The rules focus on bull-terrier-type dogs and turn on whether the dog has a recognised FCI pedigree."
    fr: "La Croatie réglemente les chiens dangereux par le Règlement sur les chiens dangereux (Journal officiel 117/08) et la Loi sur la protection des animaux (Journal officiel 102/17, 32/19). Les règles ciblent les chiens de type bull-terrier et dépendent de la possession ou non d'un pedigree FCI reconnu."
    es: "Croacia regula los perros peligrosos mediante la Ordenanza sobre Perros Peligrosos (Boletín Oficial 117/08) y la Ley de Protección de los Animales (Boletín Oficial 102/17, 32/19). Las normas se centran en los perros de tipo bull terrier y dependen de si el perro tiene un pedigrí FCI reconocido."
    pt: "A Croácia regula os cachorros perigosos por meio do Regulamento sobre Cachorros Perigosos (Ordinance on Dangerous Dogs, Diário Oficial 117/08) e da Lei de Proteção Animal (Animal Protection Act, Diário Oficial 102/17, 32/19). As regras se concentram nos cachorros do tipo bull terrier e dependem de o cachorro ter ou não um pedigree FCI reconhecido."
  cat1:
    en: "Banned from entry: any bull-terrier-type dog (Staffordshire Bull Terrier, American Staffordshire Terrier, Bull Terrier, Miniature Bull Terrier) and its crossbreeds that does not come from controlled breeding registered with the FCI is legally deemed a 'pit bull terrier' and a dangerous dog. Article 11 of the Ordinance forbids its transit, entry and temporary stay in Croatia."
    fr: "Interdits d'entrée : tout chien de type bull-terrier (Staffordshire Bull Terrier, American Staffordshire Terrier, Bull Terrier, Bull Terrier miniature) et ses croisements ne provenant pas d'un élevage contrôlé enregistré à la FCI est juridiquement considéré comme un « pit-bull terrier » et un chien dangereux. L'article 11 du Règlement interdit son transit, son entrée et son séjour temporaire en Croatie."
    es: "Prohibidos para la entrada: todo perro de tipo bull terrier (Staffordshire Bull Terrier, American Staffordshire Terrier, Bull Terrier, Bull Terrier Miniatura) y sus cruces que no proceda de una cría controlada registrada en la FCI se considera legalmente un «pit bull terrier» y un perro peligroso. El artículo 11 de la Ordenanza prohíbe su tránsito, entrada y estancia temporal en Croacia."
    pt: "Proibidos de entrar: qualquer cachorro do tipo bull terrier (Staffordshire Bull Terrier, American Staffordshire Terrier, Bull Terrier, Bull Terrier Miniatura) e seus cruzamentos que não venha de criação controlada registrada na FCI é legalmente considerado um “pit bull terrier” e um cachorro perigoso. O artigo 11 do Regulamento proíbe seu trânsito, sua entrada e sua estadia temporária na Croácia."
  cat2:
    en: "Allowed with proof: the same bull-terrier-type breeds may enter if controlled breeding is evidenced by a pedigree issued by the kennel club of an FCI-member country (for foreign dogs). There are no entry barriers for all other breeds and their crossbreeds."
    fr: "Autorisés sur preuve : les mêmes races de type bull-terrier peuvent entrer si l'élevage contrôlé est attesté par un pedigree délivré par le club canin d'un pays membre de la FCI (pour les chiens étrangers). Il n'existe aucune barrière d'entrée pour toutes les autres races et leurs croisements."
    es: "Permitidos con prueba: las mismas razas de tipo bull terrier pueden entrar si la cría controlada se acredita con un pedigrí expedido por el club canino de un país miembro de la FCI (para perros extranjeros). No existe ninguna barrera de entrada para las demás razas y sus cruces."
    pt: "Permitidos com comprovação: as mesmas raças do tipo bull terrier podem entrar se a criação controlada for comprovada por um pedigree emitido pelo clube canino de um país membro da FCI (para cachorros estrangeiros). Não há nenhuma barreira de entrada para todas as demais raças e seus cruzamentos."
  note:
    en: "Because categorisation depends on the pedigree, carry the original FCI pedigree if your dog is a Staffordshire Bull Terrier, American Staffordshire Terrier, Bull Terrier or Miniature Bull Terrier. Without it, the dog can be refused at the border."
    fr: "La catégorisation dépendant du pedigree, munis-toi du pedigree FCI original si ton chien est un Staffordshire Bull Terrier, un American Staffordshire Terrier, un Bull Terrier ou un Bull Terrier miniature. À défaut, le chien peut être refusé à la frontière."
    es: "Como la categorización depende del pedigrí, lleva el pedigrí FCI original si tu perro es un Staffordshire Bull Terrier, American Staffordshire Terrier, Bull Terrier o Bull Terrier Miniatura. Sin él, el perro puede ser rechazado en la frontera."
    pt: "Como a classificação depende do pedigree, leve o pedigree FCI original se o seu cachorro for um Staffordshire Bull Terrier, American Staffordshire Terrier, Bull Terrier ou Bull Terrier Miniatura. Sem ele, o cachorro pode ser recusado na fronteira."

