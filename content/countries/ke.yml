restrictedDogs:
  intro:
    en: "Kenya's published import conditions control entry through the import permit and health requirements, not through breed. There is no national breed-specific import ban in the DVS import conditions."
    fr: "Les conditions d'importation publiées du Kenya encadrent l'entrée par le permis d'importation et les exigences sanitaires, non par la race. Il n'existe pas d'interdiction d'importation nationale par race dans les conditions d'importation de la DVS."
    es: "Las condiciones de importación publicadas de Kenia controlan la entrada mediante el permiso de importación y los requisitos sanitarios, no por la raza. No existe una prohibición nacional de importación por raza en las condiciones de importación de la DVS."
    pt: "As condições de importação publicadas pelo Quênia controlam a entrada por meio da autorização de importação e das exigências sanitárias, não pela raça. Não há proibição nacional de importação por raça nas condições de importação da DVS."
  cat1:
    en: "No prohibited-breed list: Kenya's import conditions do not name banned breeds. A compliant dog of any breed can be imported once the permit, rabies vaccination and health certificates are in order."
    fr: "Pas de liste de races interdites : les conditions d'importation du Kenya ne nomment aucune race prohibée. Un chien conforme, quelle que soit sa race, peut être importé dès lors que le permis, la vaccination antirabique et les certificats sanitaires sont en règle."
    es: "Sin lista de razas prohibidas: las condiciones de importación de Kenia no mencionan razas prohibidas. Un perro conforme de cualquier raza puede importarse una vez que el permiso, la vacunación antirrábica y los certificados sanitarios están en regla."
    pt: "Nenhuma lista de raças proibidas: as condições de importação do Quênia não citam raças banidas. Um cachorro de qualquer raça, em conformidade, pode ser importado desde que a autorização, a vacinação antirrábica e os atestados de saúde estejam em ordem."
  cat2:
    en: "Kenya has general animal-welfare legislation (including the Prevention of Cruelty to Animals Act), but these are welfare rules, not breed import bans. We found no official breed-specific import restriction to report."
    fr: "Le Kenya dispose d'une législation générale de protection animale (dont le Prevention of Cruelty to Animals Act), mais il s'agit de règles de bien-être, non d'interdictions d'importation par race. Nous n'avons trouvé aucune restriction d'importation officielle par race à signaler."
    es: "Kenia dispone de legislación general de bienestar animal (incluida la Prevention of Cruelty to Animals Act), pero se trata de normas de bienestar, no de prohibiciones de importación por raza. No hemos encontrado ninguna restricción de importación oficial por raza que señalar."
    pt: "O Quênia tem uma legislação geral de bem-estar animal (incluindo o Prevention of Cruelty to Animals Act), mas são regras de bem-estar, não proibições de importação por raça. Não encontramos nenhuma restrição oficial de importação por raça a relatar."
  note:
    en: "Because national rules can change, verify the current breed and import conditions directly with the Directorate of Veterinary Services before you travel."
    fr: "Les règles nationales pouvant évoluer, vérifie les conditions de race et d'importation à jour directement auprès de la Directorate of Veterinary Services avant de voyager."
    es: "Como las normas nacionales pueden cambiar, verifica las condiciones de raza e importación vigentes directamente con la Directorate of Veterinary Services antes de viajar."
    pt: "Como as regras nacionais podem mudar, verifique as condições atuais de raça e importação diretamente com a Directorate of Veterinary Services antes de viajar."

checklist:
  - en: "Apply for the DVS import permit (or via a Kenyan mission) well before travel"
    fr: "Demande le permis d'importation DVS (ou via une mission kényane) bien avant le voyage"
    es: "Solicita el permiso de importación de la DVS (o a través de una misión keniana) con bastante antelación al viaje"
    pt: "Solicite a autorização de importação da DVS (ou por meio de uma missão queniana) bem antes da viagem"
  - en: "ISO microchip (recommended) implanted before the rabies vaccination"
    fr: "Puce ISO (recommandée) posée avant la vaccination antirabique"
    es: "Microchip ISO (recomendado) implantado antes de la vacunación antirrábica"
    pt: "Microchip ISO (recomendado) implantado antes da vacinação antirrábica"
  - en: "Valid rabies vaccination certificate (vaccine at least 1 month old, within validity)"
    fr: "Certificat de vaccination antirabique valide (vaccin d'au moins 1 mois, dans la validité)"
    es: "Certificado de vacunación antirrábica válido (vacuna de al menos 1 mes, dentro de la valide)"
    pt: "Certificado de vacinação antirrábica válido (vacina com pelo menos 1 mês, dentro da validade)"
  - en: "Government-vet certificate (no rabies within 30 miles) if the rabies shot is under 6 months old"
    fr: "Certificat vétérinaire gouvernemental (pas de rage dans un rayon de 30 miles) si le vaccin a moins de 6 mois"
    es: "Certificado veterinario gubernamental (sin rabia en un radio de 30 millas) si la vacuna antirrábica tiene menos de 6 meses"
    pt: "Certificado de veterinário governamental (nenhuma raiva em um raio de 30 milhas) se a vacina antirrábica tiver menos de 6 meses"
  - en: "Veterinary surgeon's health certificate signed within 5 days of departure"
    fr: "Certificat sanitaire de vétérinaire signé dans les 5 jours avant le départ"
    es: "Certificado sanitario de cirujano veterinario firmado en los 5 días previos a la salida"
    pt: "Atestado de saúde do cirurgião veterinário assinado em até 5 dias antes da partida"
  - en: "Carrier isolation certificate from the aircraft/ship captain"
    fr: "Certificat d'isolement du transporteur signé par le commandant de l'aéronef/du navire"
    es: "Certificado de aislamiento del transportista firmado por el capitán de la aeronave/el barco"
    pt: "Certificado de isolamento da transportadora, emitido pelo capitão da aeronave/navio"
  - en: "Original permit and certificates to present at the port of entry"
    fr: "Permis et certificats originaux à présenter au point d'entrée"
    es: "Permiso y certificados originales para presentar en el punto de entrada"
    pt: "Autorização e certificados originais para apresentar no ponto de entrada"
  - en: "Airline reservation and suitable travel crate if travelling in the hold"
    fr: "Réservation et caisse de transport adaptée si voyage en soute"
    es: "Reserva de la aerolínea y jaula de transporte adecuada si viaja en bodega"
    pt: "Reserva na companhia aérea e caixa de transporte adequada às normas IATA em caso de viagem no porão"

