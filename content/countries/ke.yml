regime: non_listed
domestic:
  intro:
    en: "Domestic flight in Kenya: no national travel rule for dogs, but rabies control areas and county licensing can apply."
    fr: "Vol intérieur au Kenya : aucune règle nationale de voyage pour les chiens, mais les zones de contrôle de la rage et les licences de comté peuvent s'appliquer."
    es: "Vuelo nacional en Kenia: ninguna regla nacional de viaje para perros, pero pueden aplicarse zonas de control de la rabia y licencias de condado."
    pt: "Voo doméstico no Quênia: não há regra nacional de viagem para cachorros, mas áreas de controle de raiva e o licenciamento do condado podem se aplicar."
  points:
    - en: "The national livestock movement permit does not cover dogs. But moving a dog into or out of a declared rabies control area requires prior written permission from a veterinary officer."
      fr: "Le permis national de mouvement du bétail ne couvre pas les chiens. En revanche, faire entrer ou sortir un chien d'une zone déclarée de contrôle de la rage exige l'autorisation écrite préalable d'un vétérinaire officiel."
      es: "El permiso nacional de movimiento de ganado no cubre a los perros. En cambio, sacar o meter un perro de una zona declarada de control de la rabia exige autorización escrita previa de un veterinario oficial."
      pt: "A autorização nacional de movimentação de gado não cobre cachorros. Mas mover um cachorro para dentro ou fora de uma área declarada de controle de raiva exige permissão prévia por escrito de um agente veterinário."
    - en: "Dog licensing is devolved to counties: in Nairobi, a licence is required to keep a dog and a rabies vaccination certificate is part of the application. Rules elsewhere vary."
      fr: "L'octroi de licences pour chiens relève des comtés : à Nairobi, une licence est requise pour détenir un chien et un certificat de vaccination antirabique fait partie du dossier. Les règles diffèrent ailleurs."
      es: "Las licencias para perros dependen de los condados: en Nairobi se exige licencia para tener un perro y un certificado de vacuna antirrábica forma parte de la solicitud. Las reglas varían en otros lugares."
      pt: "O licenciamento de cachorros é descentralizado para os condados: em Nairóbi, é exigida uma licença para manter um cachorro, e um certificado de vacinação antirrábica faz parte da solicitação. As regras variam em outros lugares."
    - en: "Several Kenyan carriers refuse pets outright or take them only as cargo — confirm before booking."
      fr: "Plusieurs compagnies kényanes refusent purement et simplement les animaux ou ne les acceptent qu'en fret — confirme avant de réserver."
      es: "Varias aerolíneas keniatas rechazan las mascotas o solo las aceptan como carga — confírmalo antes de reservar."
      pt: "Várias companhias aéreas quenianas recusam animais de estimação de forma direta ou só os aceitam como carga — confirme antes de reservar."
exit:
  authority: DVS
  authorityUrl: https://kilimo.go.ke/dvs-2/
  intro:
    en: "Kenya is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Directorate of Veterinary Services (DVS)."
    fr: "Le Kenya est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par la Direction des services vétérinaires (DVS)."
    es: "Kenia no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por la Dirección de Servicios Veterinarios (DVS)."
    pt: "O Quênia é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pela Directorate of Veterinary Services (DVS)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "A DVS-approved veterinarian examines your dog and issues the health certificate, and the DVS issues the export permit authorising departure."
        fr: "Un vétérinaire agréé par la DVS examine ton chien et délivre le certificat sanitaire, et la DVS délivre le permis d'export autorisant le départ."
        es: "Un veterinario aprobado por la DVS examina a tu perro y emite el certificado sanitario, y la DVS emite el permiso de exportación que autoriza la salida."
        pt: "Um veterinário aprovado pela DVS examina seu cachorro e emite o atestado de saúde, e a DVS emite a autorização de exportação que permite a partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Kenya with your dog", fr: "Voyager au Kenya avec ton chien", es: "Viajar a Kenia con tu perro", pt: "Viajar para o Quênia com seu cachorro" }
  intro:
    en: >-
      Kenya welcomes pet dogs, but entry is controlled by its own veterinary authority — the
      Directorate of Veterinary Services (DVS), part of the Ministry of Agriculture and Livestock
      Development — under the Animal Diseases Act (Cap. 364) and the Rabies Act (Cap. 365). No dog
      may arrive without an import permit obtained in advance from the DVS or a Kenyan diplomatic
      mission. Every dog needs a valid rabies vaccination certificate and a veterinary surgeon's
      certificate, signed no more than five days before departure, confirming the dog is free of
      clinical signs of any contagious or infectious disease. Kenya's published conditions do not
      require a rabies antibody test. What changes with your origin is mainly whether an extra
      government-vet certificate is needed and whether your country is on Kenya's short list of
      exempted rabies-free countries. This guide explains each step before you book your flight.
    fr: >-
      Le Kenya accueille les chiens de compagnie, mais l'entrée est contrôlée par sa propre autorité
      vétérinaire — la Directorate of Veterinary Services (DVS), rattachée au ministère de
      l'Agriculture et du Développement de l'élevage — au titre de l'Animal Diseases Act (Cap. 364) et
      du Rabies Act (Cap. 365). Aucun chien ne peut arriver sans un permis d'importation obtenu à
      l'avance auprès de la DVS ou d'une mission diplomatique kényane. Chaque chien doit disposer d'un
      certificat de vaccination antirabique valide et d'un certificat de vétérinaire, signé au plus
      cinq jours avant le départ, attestant l'absence de signes cliniques de maladie contagieuse ou
      infectieuse. Les conditions publiées par le Kenya n'exigent pas de titrage antirabique. Ce qui
      change selon l'origine, c'est surtout la nécessité d'un certificat vétérinaire gouvernemental
      supplémentaire et l'appartenance de ton pays à la courte liste de pays indemnes de rage
      exemptés. Ce guide détaille chaque étape avant de réserver ton vol.
    es: >-
      Kenia acoge a los perros de compañía, pero la entrada está controlada por su propia autoridad
      veterinaria — la Directorate of Veterinary Services (DVS), parte del Ministerio de Agricultura y
      Desarrollo Ganadero — en virtud de la Animal Diseases Act (Cap. 364) y la Rabies Act (Cap. 365).
      Ningún perro puede llegar sin un permiso de importación obtenido con antelación en la DVS o en
      una misión diplomática de Kenia. Todo perro necesita un certificado de vacunación antirrábica
      válido y un certificado de un cirujano veterinario, firmado como máximo cinco días antes de la
      salida, que confirme que el perro está libre de signos clínicos de cualquier enfermedad
      contagiosa o infecciosa. Las condiciones publicadas por Kenia no exigen una prueba de titulación
      de rabia. Lo que cambia según tu origen es sobre todo si se necesita un certificado veterinario
      gubernamental adicional y si tu país está en la breve lista de países indemnes de rabia exentos
      de Kenia. Esta guía explica cada paso antes de reservar tu vuelo.

    pt: "O Quênia recebe bem cachorros de estimação, mas a entrada é controlada por sua própria autoridade veterinária — a Directorate of Veterinary Services (DVS), parte do Ministério da Agricultura e Desenvolvimento Pecuário — segundo o Animal Diseases Act (Cap. 364) e o Rabies Act (Cap. 365). Nenhum cachorro pode chegar sem uma autorização de importação obtida com antecedência junto à DVS ou a uma missão diplomática queniana. Todo cachorro precisa de um certificado de vacinação antirrábica válido e de um certificado de um cirurgião veterinário, assinado no máximo cinco dias antes da partida, confirmando que o cachorro está livre de sinais clínicos de qualquer doença contagiosa ou infecciosa. As condições publicadas pelo Quênia não exigem um teste sorológico antirrábico. O que muda conforme a origem é principalmente se é necessário um certificado extra de veterinário governamental e se o seu país está na pequena lista queniana de países isentos por serem livres de raiva. Este guia explica cada etapa antes de você reservar seu voo."
difficulty:
  level: moderate
  label: { en: "Moderate — import permit and precise timing", fr: "Modérée — permis d'importation et calendrier précis", es: "Moderada — permiso de importación y calendario preciso", pt: "Moderada — autorização de importação e prazos precisos" }

prepTime:
  eu:
    en: "From Europe: allow ~4–6 weeks for the import permit, a rabies vaccination at least one month old and a vet certificate signed within 5 days of departure."
    fr: "Depuis l'Europe : prévoir ~4 à 6 semaines pour le permis, une vaccination antirabique d'au moins un mois et un certificat vétérinaire signé dans les 5 jours avant le départ."
    es: "Desde Europa: prevé ~4-6 semanas para el permiso de importación, una vacunación antirrábica de al menos un mes y un certificado veterinario firmado en los 5 días previos a la salida."
    pt: "Da Europa: reserve ~4 a 6 semanas para a autorização de importação, uma vacinação antirrábica com pelo menos um mês e um certificado veterinário assinado em até 5 dias antes da partida."
  listed:
    en: "From an exempted rabies-free country (Australia, Ireland, New Zealand, Norway, Sweden, UK): ~3–5 weeks — permit and health certificate, with the rabies-certificate condition waived."
    fr: "Depuis un pays indemne de rage exempté (Australie, Irlande, Nouvelle-Zélande, Norvège, Suède, Royaume-Uni) : ~3 à 5 semaines — permis et certificat sanitaire, la condition de certificat rabique étant levée."
    es: "Desde un país indemne de rabia exento (Australia, Irlanda, Nueva Zelanda, Noruega, Suecia, Reino Unido): ~3-5 semanas — permiso y certificado sanitario, sin la condición del certificado antirrábico."
    pt: "De um país isento livre de raiva (Austrália, Irlanda, Nova Zelândia, Noruega, Suécia, Reino Unido): ~3 a 5 semanas — autorização e atestado de saúde, com a condição do certificado antirrábico dispensada."
  nonListed:
    en: "From all other origins: ~4–8 weeks — add a government-vet certificate (no rabies within 30 miles of origin) if the rabies shot is under 6 months old, and mind the quarantine risk."
    fr: "Depuis toute autre origine : ~4 à 8 semaines — ajoute un certificat vétérinaire gouvernemental (pas de rage dans un rayon de 30 miles de l'origine) si le vaccin a moins de 6 mois, et attention au risque de quarantaine."
    es: "Desde cualquier otro origen: ~4-8 semanas — añade un certificado veterinario gubernamental (sin rabia en un radio de 30 millas del origen) si la vacuna antirrábica tiene menos de 6 meses, y ten en cuenta el riesgo de cuarentena."
    pt: "De todas as outras origens: ~4 a 8 semanas — acrescente um certificado de veterinário governamental (nenhum caso de raiva em um raio de 30 milhas da origem) se a vacina antirrábica tiver menos de 6 meses, e atenção ao risco de quarentena."

