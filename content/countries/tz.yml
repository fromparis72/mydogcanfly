# Country Entry Guide — Tanzania (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_tz
iso2: "TZ"
name: { en: "Tanzania", fr: "Tanzanie", es: "Tanzania", pt: "Tanzânia" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
exit:
  authority: Veterinary Services (DVS)
  authorityUrl: https://mifugouvuvi.go.tz/
  intro:
    en: "Tanzania is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Veterinary Services (Ministry of Livestock and Fisheries)."
    fr: "La Tanzanie est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par les Services vétérinaires (ministère de l'Élevage et de la Pêche)."
    es: "Tanzania no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por los Servicios Veterinarios (Ministerio de Ganadería y Pesca)."
    pt: "A Tanzânia não é um país listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para retornar à UE — além de um certificado veterinário de exportação endossado pelos Veterinary Services (Ministry of Livestock and Fisheries)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico (titulação): exame de sangue em um laboratório aprovado pela UE, pelo menos 30 dias após a vacinação — um resultado válido é essencial para retornar à UE e não pode ser resolvido de última hora."
    - timing: window
      scope: any
      text:
        en: "After a licensed vet's exam and health certificate, the Ministry's Veterinary Services issue the export certificate authorising departure."
        fr: "Après l'examen et le certificat d'un vétérinaire agréé, les Services vétérinaires du ministère délivrent le certificat d'export autorisant le départ."
        es: "Tras el examen y el certificado de un veterinario autorizado, los Servicios Veterinarios del ministerio emiten el certificado de exportación que autoriza la salida."
        pt: "Depois do exame e do atestado de saúde de um veterinário licenciado, os Veterinary Services do ministério emitem o certificado de exportação que autoriza a partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico (titulação) da UE válido antes de sair, ele continua válido por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Tanzania with your dog", fr: "Voyager en Tanzanie avec ton chien", es: "Viajar a Tanzania con tu perro", pt: "Viajar para a Tanzânia com seu cachorro" }
  intro:
    en: >-
      Tanzania welcomes pet dogs, but entry is controlled by its own veterinary authority — the
      Directorate of Veterinary Services within the Ministry of Livestock and Fisheries — under the
      Animal Diseases Act and the Animal Ordinance (Cap. 156). No dog may arrive without an import
      permit obtained in advance from the Director of Veterinary Services. Every dog needs a valid
      rabies vaccination and a sanitary (veterinary health) certificate signed by a qualified
      veterinary surgeon in the country of export. Tanzania is not an EU country and does not
      recognise the EU pet passport as an entry document. Its published conditions do not list a
      rabies antibody test. What mainly changes with your origin is the endorsement path for your
      health certificate; the core Tanzanian requirements — permit, rabies vaccination and
      certificate — apply to every dog. This guide explains each step before you book your flight.
    fr: >-
      La Tanzanie accueille les chiens de compagnie, mais l'entrée est contrôlée par sa propre
      autorité vétérinaire — la Directorate of Veterinary Services au sein du ministère de l'Élevage
      et de la Pêche — au titre de l'Animal Diseases Act et de l'Animal Ordinance (Cap. 156). Aucun
      chien ne peut arriver sans un permis d'importation obtenu à l'avance auprès du Director of
      Veterinary Services. Chaque chien doit disposer d'une vaccination antirabique valide et d'un
      certificat sanitaire (certificat vétérinaire) signé par un vétérinaire qualifié du pays
      d'export. La Tanzanie n'est pas un pays de l'UE et ne reconnaît pas le passeport européen comme
      document d'entrée. Ses conditions publiées ne mentionnent pas de titrage antirabique. Ce qui
      change surtout selon l'origine, c'est le circuit de visa du certificat sanitaire ; les
      exigences tanzaniennes de base — permis, vaccination et certificat — s'appliquent à tout chien.
      Ce guide détaille chaque étape avant de réserver ton vol.
    es: >-
      Tanzania acoge a los perros de compañía, pero la entrada está controlada por su propia
      autoridad veterinaria — la Directorate of Veterinary Services, dentro del Ministry of Livestock
      and Fisheries — al amparo del Animal Diseases Act y del Animal Ordinance (Cap. 156). Ningún
      perro puede llegar sin un permiso de importación obtenido con antelación del Director of
      Veterinary Services. Todo perro necesita una vacunación antirrábica válida y un certificado
      sanitario (certificado veterinario) firmado por un veterinario cualificado del país de
      exportación. Tanzania no es un país de la UE y no reconoce el pasaporte europeo para mascotas
      como documento de entrada. Sus condiciones publicadas no incluyen una prueba de titulación de
      rabia. Lo que cambia sobre todo según el origen es el circuito de refrendo de tu certificado
      sanitario; los requisitos básicos de Tanzania — permiso, vacunación antirrábica y certificado —
      se aplican a todos los perros. Esta guía explica cada paso antes de que reserves tu vuelo.

    pt: "A Tanzânia recebe bem os cachorros de estimação, mas a entrada é controlada pela sua própria autoridade veterinária — a Directorate of Veterinary Services, dentro do Ministry of Livestock and Fisheries — segundo o Animal Diseases Act e o Animal Ordinance (Cap. 156). Nenhum cachorro pode chegar sem uma autorização de importação obtida com antecedência junto ao Director of Veterinary Services. Todo cachorro precisa de uma vacinação antirrábica válida e de um certificado sanitário (atestado de saúde veterinário) assinado por um médico-veterinário qualificado no país de exportação. A Tanzânia não é um país da UE e não reconhece o passaporte europeu para animais de estimação como documento de entrada. Suas condições publicadas não incluem um teste sorológico antirrábico. O que muda principalmente conforme a sua origem é o caminho de endosso do seu certificado veterinário; as exigências centrais da Tanzânia — autorização, vacinação antirrábica e certificado — se aplicam a todo cachorro. Este guia explica cada etapa antes de você reservar o seu voo."
difficulty:
  level: moderate
  label: { en: "Moderate — advance import permit and health certificate", fr: "Modérée — permis d'importation préalable et certificat sanitaire", es: "Moderada — permiso de importación previo y certificado sanitario", pt: "Moderado — exige autorização de importação prévia e certificado veterinário" }

prepTime:
  eu:
    en: "From Europe: allow ~4–6 weeks for the import permit from the Director of Veterinary Services, a rabies vaccination at least one month old and a veterinary health certificate before departure."
    fr: "Depuis l'Europe : prévoir ~4 à 6 semaines pour le permis du Director of Veterinary Services, une vaccination antirabique d'au moins un mois et un certificat sanitaire vétérinaire avant le départ."
    es: "Desde Europa: prevé ~4–6 semanas para el permiso de importación del Director of Veterinary Services, una vacunación antirrábica de al menos un mes y un certificado sanitario veterinario antes de la salida."
    pt: "Da Europa: reserve cerca de 4 a 6 semanas para a autorização de importação do Director of Veterinary Services, uma vacinação antirrábica com pelo menos um mês e um certificado veterinário antes da partida."
  listed:
    en: "From other non-EU countries: ~4–6 weeks — the same core steps (import permit, rabies vaccination, veterinary health certificate), with the certificate endorsed by your national veterinary authority."
    fr: "Depuis d'autres pays hors UE : ~4 à 6 semaines — mêmes étapes de base (permis, vaccination antirabique, certificat sanitaire), le certificat étant visé par ton autorité vétérinaire nationale."
    es: "Desde otros países fuera de la UE: ~4–6 semanas — los mismos pasos básicos (permiso de importación, vacunación antirrábica, certificado sanitario veterinario), con el certificado refrendado por tu autoridad veterinaria nacional."
    pt: "De outros países fora da UE: cerca de 4 a 6 semanas — as mesmas etapas básicas (autorização de importação, vacinação antirrábica, certificado veterinário), com o certificado endossado pela sua autoridade veterinária nacional."
  nonListed:
    en: "From all origins: Tanzania applies the same import-permit and certificate requirements; allow extra time so the rabies vaccination is at least one month old and the permit is issued before travel."
    fr: "Depuis toute origine : la Tanzanie applique les mêmes exigences de permis et de certificat ; prévois une marge pour que le vaccin ait au moins un mois et que le permis soit délivré avant le voyage."
    es: "Desde cualquier origen: Tanzania aplica los mismos requisitos de permiso de importación y certificado; deja tiempo extra para que la vacunación antirrábica tenga al menos un mes y el permiso se emita antes del viaje."
    pt: "De todas as origens: a Tanzânia aplica as mesmas exigências de autorização de importação e certificado; reserve tempo extra para que a vacinação antirrábica tenha pelo menos um mês e a autorização seja emitida antes da viagem."

