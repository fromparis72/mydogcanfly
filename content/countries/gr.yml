origin:
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate and normally no border check."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire et normalement pas de contrôle frontalier."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario y normalmente sin control fronterizo."
      pt: "Um cachorro vindo de outro país da UE precisa de um passaporte europeu que comprove um microchip ISO válido e uma vacinação antirrábica em dia. Sem teste sorológico, sem certificado sanitário e, normalmente, sem controle de fronteira."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Switzerland, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination and an EU animal health certificate endorsed by an official vet before departure. No antibody test is required; present yourself to the competent authorities at a travellers' point of entry."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Suisse, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire européen visé par un vétérinaire officiel avant le départ. Pas de titrage ; présente-toi aux autorités compétentes à un point d'entrée voyageurs."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Suiza, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal de la UE refrendado por un veterinario oficial antes de la salida. No se exige prueba de titulación; preséntate ante las autoridades competentes en un punto de entrada de viajeros."
      pt: "Vindo de um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Suíça, Japão, Austrália e outros), seu cachorro precisa de microchip, vacinação antirrábica válida e certificado sanitário europeu endossado por um veterinário oficial antes da partida. Não é exigido teste sorológico; apresente-se às autoridades competentes em um ponto de entrada de viajantes."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-designated laboratory, then a compulsory 3-month wait before entry. An endorsed EU animal health certificate is also required."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen visé est également requis."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exige un certificado sanitario animal de la UE refrendado."
      pt: "Vindo de um país não listado (de risco), acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório designado pela UE, e depois 3 meses obrigatórios de espera antes da entrada. Também é exigido um certificado sanitário europeu endossado."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Greece depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien en Grèce dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Grecia depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega à Grécia depende de onde você embarcou."
  points:
    - en: "From another EU country: no systematic border check — keep the EU pet passport with you."
      fr: "Depuis un autre pays de l'UE : pas de contrôle systématique — garde le passeport européen sur toi."
      es: "Desde otro país de la UE: sin control fronterizo sistemático — lleva contigo el pasaporte europeo."
      pt: "De outro país da UE: sem controle de fronteira sistemático — leve o passaporte europeu com você."
    - en: "From outside the EU: enter via a designated travellers' point of entry and present yourself to the competent Greek authorities (customs / veterinary service) for documentary and identity checks."
      fr: "Depuis hors UE : entre par un point d'entrée voyageurs désigné et présente-toi aux autorités grecques compétentes (douane / service vétérinaire) pour les contrôles documentaires et d'identité."
      es: "Desde fuera de la UE: entra por un punto de entrada de viajeros designado y preséntate ante las autoridades griegas competentes (aduana / servicio veterinario) para los controles documentales y de identidad."
      pt: "De fora da UE: entre por um ponto de entrada de viajantes designado e apresente-se às autoridades gregas competentes (alfândega / serviço veterinário) para os controles documentais e de identidade."
    - en: "No import permit is issued and no prior appointment is needed for a pet dog travelling with its owner."
      fr: "Aucun permis d'import n'est délivré et aucun rendez-vous préalable n'est nécessaire pour un chien de compagnie voyageant avec son propriétaire."
      es: "No se expide ningún permiso de importación ni se necesita cita previa para un perro de compañía que viaja con su propietario."
      pt: "Não é emitida nenhuma licença de importação e não é preciso agendamento prévio para um cachorro de estimação que viaja com seu dono."
    - en: "Carry original documents (not copies), in Greek and/or English or officially translated."
      fr: "Munis-toi des documents originaux (pas de copies), en grec et/ou en anglais ou traduits officiellement."
      es: "Lleva los documentos originales (no copias), en griego o inglés, o traducidos oficialmente."
      pt: "Leve os documentos originais (não cópias), em grego e/ou inglês, ou com tradução oficial."
    - en: "If documents are missing or invalid, the authorities may order re-export, quarantine or other measures — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, les autorités peuvent ordonner réexpédition, quarantaine ou d'autres mesures — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, las autoridades pueden ordenar la reexpedición, la cuarentena u otras medidas — a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, as autoridades podem determinar a reexportação, a quarentena ou outras medidas — às custas do dono."
    - en: "Greece has no breed-based import ban, so no dog is refused entry on the basis of its breed."
      fr: "La Grèce n'applique aucune interdiction d'importation fondée sur la race ; aucun chien n'est donc refusé à l'entrée en raison de sa race."
      es: "Grecia no aplica ninguna prohibición de importación basada en la raza, por lo que a ningún perro se le niega la entrada por su raza."
      pt: "A Grécia não tem proibição de importação baseada na raça, então nenhum cachorro tem a entrada recusada por causa da raça."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Greece has no breed-specific dangerous-dog ban and publishes no list of prohibited breeds. Dog ownership is governed by the animal-welfare law (Law 4830/2021, Project Argos), which defines a dangerous animal by behaviour, not by breed."
    fr: "La Grèce n'applique aucune interdiction visant des races de chiens dangereux et ne publie aucune liste de races interdites. La détention de chiens est régie par la loi sur le bien-être animal (loi 4830/2021, « Projet Argos »), qui définit un animal dangereux par le comportement, non par la race."
    es: "Grecia no aplica ninguna prohibición de perros peligrosos por raza ni publica ninguna lista de razas prohibidas. La tenencia de perros se rige por la ley de bienestar animal (Ley 4830/2021, «Proyecto Argos»), que define a un animal peligroso por el comportamiento, no por la raza."
    pt: "A Grécia não aplica nenhuma proibição de raças de cachorros perigosos e não publica nenhuma lista de raças proibidas. A posse de cachorros é regida pela lei de bem-estar animal (Lei 4830/2021, «Projeto Argos»), que define um animal perigoso pelo comportamento, e não pela raça."
  cat1:
    en: "No breed categories exist. Under Law 4830/2021 a 'dangerous animal' is one that repeatedly shows unprovoked, unwarranted aggression toward people or other animals — an individual behavioural assessment, never an automatic breed label. There is no equivalent of a banned breed list, and no breed is prohibited from entering or being kept in Greece."
    fr: "Aucune catégorie de race n'existe. Selon la loi 4830/2021, un « animal dangereux » est celui qui manifeste de façon répétée une agressivité non provoquée et injustifiée envers des personnes ou d'autres animaux — une évaluation comportementale individuelle, jamais une étiquette automatique liée à la race. Il n'existe aucune liste de races interdites, et aucune race n'est interdite d'entrée ou de détention en Grèce."
    es: "No existen categorías por raza. Según la Ley 4830/2021, un «animal peligroso» es aquel que muestra de forma repetida una agresividad no provocada e injustificada hacia personas u otros animales — una evaluación individual del comportamiento, nunca una etiqueta automática ligada a la raza. No existe ninguna lista de razas prohibidas, y ninguna raza tiene prohibida la entrada o la tenencia en Grecia."
    pt: "Não existe nenhuma categoria por raça. Segundo a Lei 4830/2021, «animal perigoso» é aquele que demonstra de forma repetida uma agressividade não provocada e injustificada contra pessoas ou outros animais — uma avaliação individual do comportamento, nunca um rótulo automático ligado à raça. Não existe nada equivalente a uma lista de raças proibidas, e nenhuma raça está proibida de entrar ou de ser mantida na Grécia."
  cat2:
    en: "Owner obligations apply to every dog: an ISO microchip, registration in the National Companion Animal Registry (EMZS) with the owner's details and a DNA sample, sterilisation or DNA registration, and keeping the dog on a lead in public spaces. If a dog is officially assessed as dangerous, its owner faces stricter keeping conditions set by the competent authority."
    fr: "Des obligations pour le propriétaire s'appliquent à tout chien : puce ISO, enregistrement au Registre national des animaux de compagnie (EMZS) avec les coordonnées du propriétaire et un échantillon d'ADN, stérilisation ou enregistrement de l'ADN, et tenue en laisse dans les espaces publics. Si un chien est officiellement évalué comme dangereux, son propriétaire est soumis à des conditions de détention plus strictes fixées par l'autorité compétente."
    es: "Se aplican obligaciones al propietario para todo perro: un microchip ISO, la inscripción en el Registro Nacional de Animales de Compañía (EMZS) con los datos del propietario y una muestra de ADN, la esterilización o el registro del ADN, y mantener al perro con correa en los espacios públicos. Si un perro es evaluado oficialmente como peligroso, su propietario queda sujeto a condiciones de tenencia más estrictas fijadas por la autoridad competente."
    pt: "As obrigações do dono valem para todos os cachorros: microchip ISO, inscrição no Registro Nacional de Animais de Companhia (EMZS) com os dados do dono e uma amostra de DNA, castração ou registro do DNA, e manter o cachorro na guia em espaços públicos. Se um cachorro for oficialmente avaliado como perigoso, seu dono fica sujeito a condições de manutenção mais rígidas fixadas pela autoridade competente."
  note:
    en: "Because Greece regulates behaviour rather than breed, plan around the owner obligations of Law 4830/2021 (microchip, registration, DNA, leashing) rather than a breed list. For registry and enforcement questions, contact the Greek Ministry of the Interior."
    fr: "La Grèce réglementant le comportement plutôt que la race, prépare-toi autour des obligations du propriétaire prévues par la loi 4830/2021 (puce, enregistrement, ADN, laisse) plutôt qu'autour d'une liste de races. Pour les questions de registre et d'application, contacte le ministère grec de l'Intérieur."
    es: "Como Grecia regula el comportamiento y no la raza, prepárate en torno a las obligaciones del propietario previstas por la Ley 4830/2021 (microchip, registro, ADN, correa) en lugar de una lista de razas. Para cuestiones de registro y aplicación, contacta con el Ministerio del Interior griego."
    pt: "Como a Grécia regula o comportamento e não a raça, planeje-se pelas obrigações do dono previstas na Lei 4830/2021 (microchip, registro, DNA, guia) e não por uma lista de raças. Para questões de registro e de fiscalização, procure o Ministério do Interior da Grécia."

