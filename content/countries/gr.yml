    ref: { en: "EU Reg. 576/2013; minagric.gr", fr: "Règl. UE 576/2013 ; minagric.gr", es: "Regl. UE 576/2013; minagric.gr", pt: "Regulamento UE 576/2013; minagric.gr" }
