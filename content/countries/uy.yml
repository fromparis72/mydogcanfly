    fr: "Règles officielles MGAP/DGSG pour faire entrer un chien en Uruguay : Certificat Vétérinaire International ou passeport refrendé, puce ISO. Sourcé et daté."
    es: "Normas oficiales del MGAP/DGSG para traer un perro a Uruguay: Certificado Veterinario Internacional o pasaporte refrendado, microchip ISO. Con fuentes y fecha."
