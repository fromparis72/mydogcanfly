# Country Entry Guide — Uruguay (bilingual EN/FR).
# Uruguay is NOT in the EU. This encodes Uruguay's own MGAP / DGSG scheme (Mercosur Res. GMC 17/15):
# an International Veterinary Certificate (CVI) or endorsed official passport, presented at the border,
# with mandatory microchip (Res. 273/2018), rabies vaccination, Praziquantel deworming and — for some
# origins — a negative Leishmaniosis test. Uruguay is rabies-free.
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_uy
iso2: "UY"
name: { en: "Uruguay", fr: "Uruguay", es: "Uruguay", pt: "Uruguai" }
region: { en: "South America", fr: "Amérique du Sud", es: "América del Sur", pt: "América do Sul" }


regime: non_listed
exit:
  authority: MGAP / DGSG
  authorityUrl: https://www.gub.uy/tramites/solicitud-egreso-mascotas-uruguay
  intro:
    en: "Uruguay is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by MGAP (Dirección General de Servicios Ganaderos)."
    fr: "L'Uruguay est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par le MGAP (Dirección General de Servicios Ganaderos)."
    es: "Uruguay no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el MGAP (Dirección General de Servicios Ganaderos)."
    pt: "O Uruguai é um país não listado, então o teste sorológico antirrábico válido é obrigatório para voltar à União Europeia — além de um atestado de saúde de exportação endossado pelo MGAP (Dirección General de Servicios Ganaderos)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "The international veterinary certificate (CVI) is issued by MGAP at an Animal Health office, from a health certificate by an MGAP-accredited vet dated within 10 days."
        fr: "Le certificat vétérinaire international (CVI) est délivré par le MGAP dans un bureau de santé animale, à partir d'un certificat d'un vétérinaire agréé MGAP de moins de 10 jours."
        es: "El certificado veterinario internacional (CVI) lo emite el MGAP en una oficina de sanidad animal, a partir de un certificado de un veterinario acreditado por el MGAP de menos de 10 días."
        pt: "O certificado veterinário internacional (CVI) é emitido pelo MGAP em um escritório de Saúde Animal, a partir de um atestado de saúde feito por veterinário credenciado pelo MGAP nos 10 dias anteriores."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Uruguay with your dog", fr: "Voyager en Uruguay avec ton chien", es: "Viajar a Uruguay con tu perro", pt: "Viajar ao Uruguai com seu cachorro" }
  intro:
    en: >-
      Uruguay welcomes dogs, and it runs one uniform national scheme managed by the MGAP (Ministerio de
      Ganadería, Agricultura y Pesca) through its animal-health authority, the DGSG. There is no EU pet
      passport here: the key document is an International Veterinary Certificate (CVI) issued, signed and
      stamped by the official veterinary authority of your country of origin under Mercosur Resolution GMC
      17/15 — or a current official passport endorsed by that same authority. Your dog must carry an ISO
      microchip, a valid rabies vaccination, a clinical examination, and internal and external parasite
      treatment (the internal product must contain praziquantel). Dogs from countries not declared free of
      Leishmaniosis must also show a recent negative test. Uruguay is officially rabies-free, asks for no
      rabies antibody test and no routine quarantine, and simply inspects your dog at the border. This
      guide explains exactly what to prepare, and when, before you book your flight.
    fr: >-
      L'Uruguay accueille les chiens et applique un régime national uniforme géré par le MGAP (Ministerio
      de Ganadería, Agricultura y Pesca) via son autorité sanitaire animale, la DGSG. Pas de passeport
      européen ici : le document clé est un Certificat Vétérinaire International (CVI) émis, signé et scellé
      par l'autorité vétérinaire officielle de ton pays d'origine selon la Résolution Mercosur GMC 17/15 —
      ou un passeport officiel en cours de validité refrendé par cette même autorité. Ton chien doit
      porter une puce ISO, une vaccination antirabique valide, un examen clinique, et un traitement
      antiparasitaire interne et externe (le produit interne doit contenir du praziquantel). Les chiens
      venant de pays non déclarés indemnes de Leishmaniose doivent aussi présenter un test négatif récent.
      L'Uruguay est officiellement indemne de rage, n'exige aucun titrage antirabique ni quarantaine de
      routine, et inspecte simplement ton chien à la frontière. Ce guide détaille exactement quoi
      préparer, et quand, avant de réserver ton vol.
    es: >-
      Uruguay acoge a los perros y aplica un único esquema nacional uniforme gestionado por el MGAP
      (Ministerio de Ganadería, Agricultura y Pesca) a través de su autoridad de sanidad animal, la DGSG.
      Aquí no hay pasaporte europeo para mascotas: el documento clave es un Certificado Veterinario
      Internacional (CVI) emitido, firmado y sellado por la autoridad veterinaria oficial de tu país de
      origen conforme a la Resolución Mercosur GMC 17/15 — o un pasaporte oficial vigente refrendado por
      esa misma autoridad. Tu perro debe llevar un microchip ISO, una vacunación antirrábica válida, un
      examen clínico y un tratamiento antiparasitario interno y externo (el producto interno debe contener
      praziquantel). Los perros procedentes de países no declarados libres de Leishmaniosis también deben
      presentar una prueba negativa reciente. Uruguay está oficialmente libre de rabia, no pide ninguna
      prueba de titulación de rabia ni cuarentena de rutina, y simplemente inspecciona a tu perro en la
      frontera. Esta guía explica exactamente qué preparar, y cuándo, antes de reservar tu vuelo.

    pt: "O Uruguai recebe bem os cachorros e aplica um único procedimento nacional, gerido pelo MGAP (Ministerio de Ganadería, Agricultura y Pesca) por meio de sua autoridade de saúde animal, a DGSG. Aqui não existe passaporte europeu para animais: o documento central é um Certificado Veterinário Internacional (CVI) emitido, assinado e carimbado pela autoridade veterinária oficial do seu país de origem, conforme a Resolución GMC 17/15 do Mercosul — ou um passaporte oficial dentro da validade endossado por essa mesma autoridade. Seu cachorro precisa ter microchip ISO, vacinação antirrábica válida, exame clínico e tratamento contra parasitas internos e externos (o produto interno deve conter praziquantel). Cachorros vindos de países que não se declaram livres de Leishmaniose também precisam apresentar um teste negativo recente. O Uruguai é oficialmente livre de raiva, não pede teste sorológico antirrábico nem quarentena de rotina, e simplesmente inspeciona seu cachorro na fronteira. Este guia explica exatamente o que preparar, e quando, antes de comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Moderate — one uniform scheme, but microchip, praziquantel and a Leishmaniosis test for some origins", fr: "Modéré — un régime uniforme, mais puce, praziquantel et test de Leishmaniose pour certaines origines", es: "Moderado — un esquema uniforme, pero microchip, praziquantel y una prueba de Leishmaniosis para algunos orígenes", pt: "Moderado — um único procedimento, mas com microchip, praziquantel e teste de Leishmaniose para algumas origens" }

prepTime:
  eu:
    en: "Standard case: a few days to assemble the CVI once vaccination and microchip are in place — the clinical exam is done within 10 days before the CVI, and deworming within 15 days before it."
    fr: "Cas standard : quelques jours pour réunir le CVI une fois la vaccination et la puce en place — l'examen clinique est fait dans les 10 jours avant le CVI, et la vermifugation dans les 15 jours avant."
    es: "Caso estándar: unos días para reunir el CVI una vez que la vacunación y el microchip están en regla — el examen clínico se hace dentro de los 10 días previos al CVI, y la desparasitación dentro de los 15 días previos."
    pt: "Caso padrão: alguns dias para montar o CVI quando a vacinação e o microchip já estão em ordem — o exame clínico é feito nos 10 dias anteriores ao CVI, e a vermifugação nos 15 dias anteriores a ele."
  listed:
    en: "If the first rabies shot is still needed: plan ~3 weeks, as a primary vaccination must be given at least 21 days before entry. A dog from an OMSA-recognised rabies-free country/zone may enter without it if the CVI states this."
    fr: "Si la première vaccination reste à faire : prévois ~3 semaines, une primo-vaccination devant être faite au moins 21 jours avant l'entrée. Un chien d'un pays/zone reconnu indemne de rage par l'OMSA peut entrer sans elle si le CVI le mentionne."
    es: "Si aún falta poner la primera vacuna antirrábica: prevé ~3 semanas, ya que la primovacunación debe aplicarse al menos 21 días antes de la entrada. Un perro procedente de un país/zona reconocido como libre de rabia por la OMSA puede entrar sin ella si el CVI así lo indica."
    pt: "Se ainda faltar a primeira dose antirrábica: conte cerca de 3 semanas, já que a primovacinação precisa ser aplicada no mínimo 21 dias antes da entrada. Um cachorro vindo de país ou zona reconhecido como livre de raiva pela OMSA pode entrar sem ela se o CVI atestar isso."
  nonListed:
    en: "From a country not declared free of Leishmaniosis: allow up to 60 days, as a negative Leishmaniosis test must be dated within the 60 days before entry. Puppies under 3 months need extra certification."
    fr: "Depuis un pays non déclaré indemne de Leishmaniose : prévois jusqu'à 60 jours, un test négatif de Leishmaniose devant dater des 60 jours avant l'entrée. Les chiots de moins de 3 mois nécessitent une certification supplémentaire."
    es: "Desde un país no declarado libre de Leishmaniosis: prevé hasta 60 días, ya que la prueba negativa de Leishmaniosis debe estar fechada dentro de los 60 días previos a la entrada. Los cachorros de menos de 3 meses necesitan una certificación adicional."
    pt: "Vindo de um país que não se declara livre de Leishmaniose: reserve até 60 dias, já que o teste negativo de Leishmaniose precisa ter data dentro dos 60 dias anteriores à entrada. Filhotes com menos de 3 meses precisam de certificação extra."

