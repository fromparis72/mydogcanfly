# Country Entry Guide — Japan (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
# Japan is NOT in the EU. It runs its own scheme via the Animal Quarantine Service (AQS/MAFF):
# microchip -> two rabies vaccinations -> rabies antibody test (>=0.5 IU/ml) -> 180-day wait
# -> advance notification (>=40 days) -> pre-export clinical inspection -> government certificate
# -> import inspection on arrival. The eu/listed/nonListed slots are repurposed to Japan's tiers:
# eu = designated (rabies-free) regions; listed = non-designated regions with requirements completed;
# nonListed = non-designated regions arriving non-compliant (detention quarantine up to 180 days).
id: country_jp
iso2: "JP"
name: { en: "Japan", fr: "Japon", es: "Japón", pt: "Japão" }
region: { en: "Asia", fr: "Asie", es: "Asia", pt: "Ásia" }


regime: island_strict
domestic:
  intro:
    en: "Domestic flight in Japan: no quarantine or certificate for internal travel — animal quarantine applies only to international movement."
    fr: "Vol intérieur au Japon : aucune quarantaine ni certificat pour un trajet interne — la quarantaine animale ne concerne que l'international."
    es: "Vuelo nacional en Japón: ninguna cuarentena ni certificado para un trayecto interno — la cuarentena animal solo afecta a lo internacional."
    pt: "Voo doméstico no Japão: nenhuma quarentena nem certificado para trajetos internos — a quarentena animal só se aplica à movimentação internacional."
  points:
    - en: "Every dog over 91 days must be registered and vaccinated against rabies annually — an ownership duty under the Rabies Prevention Act, independent of travel. Japan is rabies-free, so there is no internal zoning."
      fr: "Tout chien de plus de 91 jours doit être enregistré et vacciné contre la rage chaque année — une obligation de détention, indépendante du voyage. Le Japon est indemne de rage, il n'existe donc aucun zonage interne."
      es: "Todo perro de más de 91 días debe estar registrado y vacunado contra la rabia anualmente — un deber de tenencia, independiente del viaje. Japón está libre de rabia, por lo que no hay zonificación interna."
      pt: "Todo cachorro com mais de 91 dias precisa ser registrado e vacinado contra a raiva todos os anos — um dever de quem tem o animal, previsto na Rabies Prevention Act (Lei de Prevenção da Raiva), independente de viagem. O Japão é livre de raiva, então não existe zoneamento interno."
    - en: "Japanese carriers take pets in the hold only, never in the cabin, check the rabies record, and refuse snub-nosed breeds during the warm months."
      fr: "Les compagnies japonaises n'acceptent les animaux qu'en soute, jamais en cabine, vérifient le carnet antirabique et refusent les races à nez court pendant les mois chauds."
      es: "Las aerolíneas japonesas solo aceptan mascotas en bodega, nunca en cabina, comprueban la cartilla antirrábica y rechazan razas chatas durante los meses cálidos."
      pt: "As companhias aéreas japonesas só aceitam animais no porão, nunca na cabine, conferem a carteira de vacinação antirrábica e recusam raças de focinho achatado nos meses quentes."
exit:
  authority: AQS (Japon)
  authorityUrl: https://www.maff.go.jp/aqs/english/animal/dog/export.html
  intro:
    en: "Leaving Japan with your dog needs an export quarantine certificate from the Animal Quarantine Service (AQS) — apply at least 10 days ahead."
    fr: "Sortir du Japon avec ton chien demande un certificat de quarantaine d'export de l'Animal Quarantine Service (AQS) — dépose la demande au moins 10 jours avant."
    es: "Salir de Japón con tu perro requiere un certificado de cuarentena de exportación del Animal Quarantine Service (AQS) — solicítalo al menos 10 días antes."
    pt: "Sair do Japão com seu cachorro exige um certificado de quarentena de exportação do Animal Quarantine Service (AQS) — faça o pedido com pelo menos 10 dias de antecedência."
  steps:
    - timing: before
      scope: any
      text:
        en: "Apply for export inspection to the AQS at least 10 days before, with the destination's entry documents attached."
        fr: "Demande l'inspection d'export à l'AQS au moins 10 jours avant, avec les documents d'entrée de la destination joints."
        es: "Solicita la inspección de exportación al AQS al menos 10 días antes, adjuntando los documentos de entrada del destino."
        pt: "Peça a inspeção de exportação ao AQS com pelo menos 10 dias de antecedência, anexando os documentos de entrada do destino."
    - timing: window
      scope: any
      text:
        en: "On departure day, the airport AQS office inspects the dog and issues the English export certificate (about 30–60 minutes)."
        fr: "Le jour du départ, le bureau AQS de l'aéroport inspecte le chien et délivre le certificat d'export en anglais (environ 30 à 60 minutes)."
        es: "El día de salida, la oficina del AQS del aeropuerto inspecciona al perro y emite el certificado de exportación en inglés (unos 30–60 minutos)."
        pt: "No dia da partida, o escritório do AQS no aeroporto inspeciona o cachorro e emite o certificado de exportação em inglês (cerca de 30 a 60 minutos)."
  onSiteNote:
    en: "An ISO microchip is required; airport AQS offices operate 8:30–16:30."
    fr: "Une puce ISO est exigée ; les bureaux AQS des aéroports ouvrent de 8h30 à 16h30."
    es: "Se requiere un microchip ISO; las oficinas del AQS en los aeropuertos abren de 8:30 a 16:30."
    pt: "É obrigatório um microchip ISO; os escritórios do AQS nos aeroportos funcionam das 8h30 às 16h30."

hero:
  h1: { en: "Traveling to Japan with your dog", fr: "Voyager au Japon avec ton chien", es: "Viajar a Japón con tu perro", pt: "Viajar para o Japão com seu cachorro" }
  intro:
    en: >-
      Japan welcomes dogs, but it applies one of the world's strictest rabies-control schemes — not the
      EU framework. For almost every country, the process is long and cannot be rushed: an ISO microchip,
      then at least two rabies vaccinations, a rabies antibody test at a designated laboratory,
      and a compulsory 180-day waiting period after the blood is drawn before your dog may arrive. You
      must also notify the Animal Quarantine Service (AQS) at least 40 days before arrival. Only a short
      list of rabies-free "designated regions" (Iceland, Australia, New Zealand, Fiji, Hawaii and Guam)
      follows a simpler path. If every condition is met, quarantine on arrival is under 12 hours;
      if not, your dog can be detained for up to 180 days. Start at least seven months ahead.
    fr: >-
      Le Japon accueille les chiens, mais applique l'un des régimes antirabiques les plus stricts au monde
      — pas le cadre européen. Pour presque tous les pays, la procédure est longue et ne se précipite pas :
      une puce ISO, puis au moins deux vaccinations antirabiques, un test de titrage des anticorps dans un
      laboratoire agréé, et un délai d'attente obligatoire de 180 jours après la prise de sang avant que
      ton chien puisse arriver. Tu dois aussi notifier le Service de quarantaine animale (AQS) au moins
      40 jours avant l'arrivée. Seule une courte liste de « régions désignées » indemnes de rage (Islande,
      Australie, Nouvelle-Zélande, Fidji, Hawaï et Guam) suit un parcours simplifié. Si toutes les
      conditions sont remplies, la quarantaine à l'arrivée dure moins de 12 heures ; sinon, ton chien
      peut être retenu jusqu'à 180 jours. Commence au moins sept mois à l'avance.
    es: >-
      Japón acoge a los perros, pero aplica uno de los regímenes de control de la rabia más estrictos del
      mundo — no el marco de la UE. Para casi todos los países, el proceso es largo y no se puede acelerar:
      un microchip ISO, luego al menos dos vacunaciones antirrábicas, una prueba de titulación de
      anticuerpos contra la rabia en un laboratorio designado, y un periodo de espera obligatorio de 180
      días tras la extracción de sangre antes de que tu perro pueda llegar. También debes notificar al
      Servicio de Cuarentena Animal (AQS) al menos 40 días antes de la llegada. Solo una lista corta de
      «regiones designadas» indemnes de rabia (Islandia, Australia, Nueva Zelanda, Fiyi, Hawái y Guam)
      sigue un camino más simple. Si se cumplen todas las condiciones, la cuarentena a la llegada dura
      menos de 12 horas; si no, tu perro puede quedar retenido hasta 180 días. Empieza con al menos siete
      meses de antelación.

    pt: "O Japão recebe bem os cachorros, mas aplica um dos regimes de controle da raiva mais rígidos do mundo — e não o quadro europeu. Para quase todos os países, o processo é longo e não dá para acelerar: um microchip ISO, depois pelo menos duas vacinações antirrábicas, um teste sorológico antirrábico em laboratório designado e um período de espera obrigatório de 180 dias após a coleta de sangue antes que seu cachorro possa chegar. Você também precisa notificar o Animal Quarantine Service (AQS) com pelo menos 40 dias de antecedência da chegada. Só uma lista curta de “regiões designadas” livres de raiva (Islândia, Austrália, Nova Zelândia, Fiji, Havaí e Guam) segue um caminho mais simples. Se todas as condições forem cumpridas, a quarentena na chegada dura menos de 12 horas; se não, seu cachorro pode ficar retido por até 180 dias. Comece com pelo menos sete meses de antecedência."
difficulty:
  level: difficult
  label: { en: "Difficult — long lead time and a fixed 180-day wait", fr: "Difficile — longue anticipation et délai fixe de 180 jours", es: "Difícil — mucha antelación y una espera fija de 180 días", pt: "Difícil — muita antecedência e espera fixa de 180 dias" }

prepTime:
  eu:
    en: "Designated rabies-free regions: a few weeks — microchip, residence proof, government certificate, and the 40-day advance notification."
    fr: "Régions désignées indemnes de rage : quelques semaines — puce, preuve de résidence, certificat officiel et notification préalable de 40 jours."
    es: "Regiones designadas indemnes de rabia: unas semanas — microchip, prueba de residencia, certificado oficial y la notificación previa de 40 días."
    pt: "Regiões designadas livres de raiva: algumas semanas — microchip, comprovante de residência, certificado oficial e a notificação prévia de 40 dias."
  listed:
    en: "All other regions (requirements completed): ~7+ months — two rabies shots 30 days apart, antibody test, then a compulsory 180-day wait before arrival."
    fr: "Toutes les autres régions (exigences remplies) : ~7+ mois — deux vaccins à 30 jours d'écart, titrage, puis un délai obligatoire de 180 jours avant l'arrivée."
    es: "Todas las demás regiones (requisitos completados): ~7 meses o más — dos vacunas antirrábicas con 30 días de diferencia, prueba de titulación y luego una espera obligatoria de 180 días antes de la llegada."
    pt: "Todas as demais regiões (exigências cumpridas): ~7 meses ou mais — duas vacinas antirrábicas com 30 dias de intervalo, teste sorológico e, depois, uma espera obrigatória de 180 dias antes da chegada."
  nonListed:
    en: "All other regions (arriving non-compliant): detention quarantine in Japan for the missing days, up to 180 days, at the owner's expense."
    fr: "Toutes les autres régions (arrivée non conforme) : quarantaine en détention au Japon pour les jours manquants, jusqu'à 180 jours, aux frais du propriétaire."
    es: "Todas las demás regiones (llegada sin cumplir los requisitos): cuarentena en detención en Japón durante los días que falten, hasta 180 días, a cargo del propietario."
    pt: "Todas as demais regiões (chegada fora de conformidade): quarentena em detenção no Japão pelos dias que faltarem, até 180 dias, às custas do proprietário."

