# Country Entry Guide — Guinea / Guinée (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_gn
iso2: "GN"
name: { en: "Guinea (Guinée)", fr: "Guinée", es: "Guinea (Guinée)", pt: "Guiné (Guinée)" }
region: { en: "West Africa", fr: "Afrique de l'Ouest", es: "África Occidental", pt: "África Ocidental" }


regime: non_listed
exit:
  authority: DNSV
  authorityUrl: https://magel.gov.gn
  intro:
    en: "Guinea is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Direction Nationale des Services Vétérinaires (DNSV)."
    fr: "La Guinée est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par la Direction Nationale des Services Vétérinaires (DNSV)."
    es: "Guinea no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por la Direction Nationale des Services Vétérinaires (DNSV)."
    pt: "A Guiné é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pela Direction Nationale des Services Vétérinaires (DNSV)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "The DNSV is the competent authority that issues and endorses the export health certificate before departure."
        fr: "La DNSV est l'autorité compétente qui délivre et vise le certificat sanitaire d'export avant le départ."
        es: "La DNSV es la autoridad competente que emite y refrenda el certificado sanitario de exportación antes de salir."
        pt: "A DNSV é a autoridade competente que emite e endossa o atestado de saúde de exportação antes da partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Guinea with your dog", fr: "Voyager en Guinée avec ton chien", es: "Viajar a Guinea con tu perro", pt: "Viajar para a Guiné com seu cachorro" }
  intro:
    en: >-
      Guinea admits pet dogs, but it publishes very little about the exact pet-import procedure, so this
      guide sticks strictly to what official sources confirm. Guinea is not part of the EU framework:
      animal health is overseen by the Direction Nationale des Services Vétérinaires (DNSV), under the
      Ministère de l'Agriculture et de l'Élevage. The clearest published rules come from the national
      livestock code (Loi L/2018/026/AN): every live animal imported into Guinea — including by air — is
      subject to a veterinary health inspection before customs clearance, and the code sets specific dog
      rules. "Attack" dogs (first category) are banned from import, while "guard and defence" dogs (second
      category) are admitted with muzzle-and-leash conditions. An international veterinary health
      certificate is required (the United States uses APHIS-endorsed certification). Guinea is
      rabies-endemic, so a valid rabies vaccination is expected in practice. Several operational points —
      a prior import permit, exact rabies timing, quarantine practice, minimum age — are not published and
      are marked Unknown here rather than guessed. Verify everything with the DNSV before you book.
    fr: >-
      La Guinée admet les chiens de compagnie, mais publie très peu de détails sur la procédure exacte
      d'importation ; ce guide s'en tient donc strictement à ce que confirment les sources officielles. La
      Guinée ne relève pas du cadre de l'UE : la santé animale est supervisée par la Direction Nationale
      des Services Vétérinaires (DNSV), rattachée au Ministère de l'Agriculture et de l'Élevage. Les règles
      les mieux publiées proviennent du code de l'élevage (Loi L/2018/026/AN) : tout animal vivant importé
      en Guinée — y compris par voie aérienne — est soumis à un contrôle sanitaire vétérinaire avant
      dédouanement, et le code fixe des règles propres aux chiens. Les chiens d'attaque (première catégorie)
      sont interdits d'importation, tandis que les chiens de garde et de défense (deuxième catégorie) sont
      admis avec obligation de muselière et de laisse. Un certificat vétérinaire international est requis
      (les États-Unis utilisent une certification endossée par l'APHIS). La Guinée est un pays à rage
      endémique : une vaccination antirabique valide est donc attendue en pratique. Plusieurs points
      opérationnels — permis d'importation préalable, délais exacts de vaccination, pratique de la
      quarantaine, âge minimum — ne sont pas publiés et sont indiqués « Non communiqué » ici plutôt que
      devinés. Vérifie tout auprès de la DNSV avant de réserver.
    es: >-
      Guinea admite perros de compañía, pero publica muy pocos detalles sobre el procedimiento exacto de
      importación, así que esta guía se ciñe estrictamente a lo que confirman las fuentes oficiales. Guinea
      no forma parte del marco de la UE: la sanidad animal está a cargo de la Direction Nationale des
      Services Vétérinaires (DNSV), dependiente del Ministère de l'Agriculture et de l'Élevage. Las normas
      mejor publicadas provienen del código ganadero nacional (Loi L/2018/026/AN): todo animal vivo
      importado a Guinea — incluso por vía aérea — está sujeto a una inspección sanitaria veterinaria antes
      del despacho de aduanas, y el código fija normas propias para los perros. Los perros de «ataque»
      (primera categoría) están prohibidos para la importación, mientras que los perros de «guardia y
      defensa» (segunda categoría) se admiten con condiciones de bozal y correa. Se exige un certificado
      sanitario veterinario internacional (Estados Unidos usa una certificación refrendada por la APHIS).
      Guinea es un país con rabia endémica, por lo que en la práctica se espera una vacunación antirrábica
      válida. Varios puntos operativos — un permiso de importación previo, los plazos exactos de la vacuna,
      la práctica de la cuarentena, la edad mínima — no están publicados y aquí se marcan como Desconocido
      en lugar de suponerse. Verifica todo con la DNSV antes de reservar.

    pt: "A Guiné admite cachorros de estimação, mas publica muito pouco sobre o procedimento exato de importação de animais de estimação, portanto este guia se atém estritamente ao que as fontes oficiais confirmam. A Guiné não faz parte do quadro da UE: a saúde animal é supervisionada pela Direction Nationale des Services Vétérinaires (DNSV), sob o Ministère de l'Agriculture et de l'Élevage. As regras mais claras publicadas vêm do código nacional de pecuária (Loi L/2018/026/AN): todo animal vivo importado para a Guiné — inclusive por via aérea — está sujeito a uma inspeção veterinária sanitária antes do desembaraço aduaneiro, e o código estabelece regras específicas para cachorros. Cachorros de 'ataque' (primeira categoria) são proibidos de importação, enquanto cachorros de 'guarda e defesa' (segunda categoria) são admitidos com condições de focinheira e coleira. É exigido um atestado de saúde veterinário internacional (os Estados Unidos usam certificação endossada pela APHIS). A Guiné tem raiva endêmica, portanto uma vacinação antirrábica válida é esperada na prática. Vários pontos operacionais — uma autorização de importação prévia, o prazo exato da raiva, a prática de quarentena, a idade mínima — não são publicados e estão marcados aqui como não comunicado em vez de presumidos. Verifique tudo com a DNSV antes de reservar."
difficulty:
  level: moderate
  label: { en: "Moderate — veterinary inspection + rabies; attack-type dogs banned; several rules unpublished", fr: "Modéré — contrôle vétérinaire + rage ; chiens d'attaque interdits ; plusieurs règles non publiées", es: "Moderado — inspección veterinaria + rabia; perros de tipo ataque prohibidos; varias normas no publicadas", pt: "Moderada — inspeção veterinária + raiva; cachorros do tipo ataque proibidos; várias regras não publicadas" }

prepTime:
  eu:
    en: "From the EU: allow one to two weeks if identification and rabies vaccination are already valid — an official vet issues the international veterinary certificate close to departure. Allow more time to confirm any prior import permit or extra condition with the DNSV, since Guinea does not publish a full pet-import procedure."
    fr: "Depuis l'UE : prévois une à deux semaines si l'identification et la vaccination antirabique sont déjà valides — un vétérinaire officiel établit le certificat vétérinaire international peu avant le départ. Prévois davantage de temps pour confirmer tout permis d'importation préalable ou condition supplémentaire auprès de la DNSV, la Guinée ne publiant pas de procédure complète."
    es: "Desde la UE: prevé una o dos semanas si la identificación y la vacunación antirrábica ya son válidas — un veterinario oficial expide el certificado veterinario internacional poco antes de la salida. Reserva más tiempo para confirmar con la DNSV cualquier permiso de importación previo o condición adicional, ya que Guinea no publica un procedimiento completo de importación de mascotas."
    pt: "Da UE: reserve de uma a duas semanas se a identificação e a vacinação antirrábica já estiverem válidas — um veterinário oficial emite o certificado veterinário internacional perto da partida. Reserve mais tempo para confirmar com a DNSV qualquer autorização de importação prévia ou condição extra, já que a Guiné não publica um procedimento completo de importação de animais de estimação."
  listed:
    en: "From the United States: allow time to visit a USDA-accredited veterinarian and obtain APHIS endorsement of the international health certificate through the VEHCS system. If the first rabies shot is still needed, plan roughly 3 weeks because vaccination must precede the certificate."
    fr: "Depuis les États-Unis : prévois le temps de consulter un vétérinaire accrédité USDA et d'obtenir l'endossement APHIS du certificat sanitaire international via le système VEHCS. S'il faut encore faire le premier vaccin antirabique, prévois environ 3 semaines, la vaccination devant précéder le certificat."
    es: "Desde Estados Unidos: prevé tiempo para acudir a un veterinario acreditado por el USDA y obtener el refrendo de la APHIS del certificado sanitario internacional a través del sistema VEHCS. Si aún falta la primera vacuna antirrábica, calcula unas 3 semanas, ya que la vacunación debe preceder al certificado."
    pt: "Dos Estados Unidos: reserve tempo para visitar um veterinário credenciado pela USDA e obter o endosso da APHIS no atestado de saúde internacional pelo sistema VEHCS. Se a primeira dose da vacina antirrábica ainda for necessária, planeje cerca de 3 semanas, pois a vacinação deve preceder o certificado."
  nonListed:
    en: "Whatever the origin, the limiting steps are the rabies vaccination itself and issuing the international veterinary certificate shortly before departure. Because Guinea publishes little, contact the DNSV early to confirm whether a prior import permit applies and to check that your dog's breed is not in the banned first category."
    fr: "Quelle que soit l'origine, les étapes limitantes sont la vaccination antirabique elle-même et l'établissement du certificat vétérinaire international peu avant le départ. La Guinée publiant peu, contacte tôt la DNSV pour confirmer si un permis d'importation préalable s'applique et vérifier que la race de ton chien ne relève pas de la première catégorie interdite."
    es: "Sea cual sea el origen, los pasos que marcan los plazos son la propia vacunación antirrábica y la expedición del certificado veterinario internacional poco antes de la salida. Como Guinea publica poco, contacta pronto con la DNSV para confirmar si se aplica un permiso de importación previo y comprobar que la raza de tu perro no está en la primera categoría prohibida."
    pt: "Seja qual for a origem, as etapas limitantes são a própria vacinação antirrábica e a emissão do certificado veterinário internacional pouco antes da partida. Como a Guiné publica pouco, entre em contato com a DNSV com antecedência para confirmar se é exigida uma autorização de importação prévia e para verificar que a raça do seu cachorro não está na primeira categoria proibida."

