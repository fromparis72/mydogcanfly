factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Guinea (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — la Guinée (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Guinea (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — a Guiné (seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Guinea", fr: "Pays de destination — Guinée", es: "País de destino — Guinea", pt: "País de destino — Guiné" }
      text:
        en: "Guinea sits outside the EU framework and its animal health is overseen by the Direction Nationale des Services Vétérinaires (DNSV). The national livestock code requires a veterinary health inspection before customs clearance for every imported animal, and bans 'attack' (first-category) dogs from import while admitting 'guard and defence' (second-category) dogs under conditions. An international veterinary certificate is required. A prior import permit, exact rabies timing, quarantine practice and minimum age are unpublished and must be confirmed directly with the DNSV."
        fr: "La Guinée se situe hors du cadre de l'UE et sa santé animale est supervisée par la Direction Nationale des Services Vétérinaires (DNSV). Le code de l'élevage impose un contrôle sanitaire vétérinaire avant dédouanement pour tout animal importé, et interdit à l'importation les chiens d'attaque (première catégorie) tout en admettant sous conditions les chiens de garde et de défense (deuxième catégorie). Un certificat vétérinaire international est requis. Un permis d'importation préalable, les délais exacts de vaccination, la pratique de quarantaine et l'âge minimum ne sont pas publiés et doivent être confirmés directement auprès de la DNSV."
        es: "Guinea queda fuera del marco de la UE y su sanidad animal está a cargo de la Direction Nationale des Services Vétérinaires (DNSV). El código ganadero nacional exige una inspección sanitaria veterinaria antes del despacho de aduanas para todo animal importado, y prohíbe la importación de perros de «ataque» (primera categoría) admitiendo bajo condiciones los perros de «guardia y defensa» (segunda categoría). Se exige un certificado veterinario internacional. Un permiso de importación previo, los plazos exactos de la vacuna, la práctica de la cuarentena y la edad mínima no están publicados y deben confirmarse directamente con la DNSV."
        pt: "A Guiné está fora do quadro da UE, e sua saúde animal é supervisionada pela Direction Nationale des Services Vétérinaires (DNSV). O código nacional de pecuária exige uma inspeção veterinária sanitária antes do desembaraço aduaneiro para todo animal importado, e proíbe a importação de cachorros de 'ataque' (primeira categoria), admitindo cachorros de 'guarda e defesa' (segunda categoria) sob condições. É exigido um certificado veterinário internacional. Uma autorização de importação prévia, o prazo exato da raiva, a prática de quarentena e a idade mínima não são publicados e devem ser confirmados diretamente com a DNSV."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The international veterinary certificate is issued by a government-accredited vet in the country of departure, using that country's official model. For the United States, APHIS endorses an international health certificate through the VEHCS system, and CDC rules apply to dogs that have recently been in a high-risk rabies country. The country of departure decides who signs your certificate and shapes the rabies-vaccination evidence Guinea's services expect."
        fr: "Le certificat vétérinaire international est établi par un vétérinaire accrédité du pays de départ, selon le modèle officiel de ce pays. Pour les États-Unis, l'APHIS endosse un certificat sanitaire international via le système VEHCS, et les règles des CDC s'appliquent aux chiens ayant récemment séjourné dans un pays à haut risque rabique. Le pays de départ détermine qui signe ton certificat et conditionne les preuves de vaccination antirabique attendues par les services guinéens."
        es: "El certificado veterinario internacional lo expide un veterinario acreditado por el gobierno del país de salida, usando el modelo oficial de ese país. Para Estados Unidos, la APHIS refrenda un certificado sanitario internacional a través del sistema VEHCS, y las normas de los CDC se aplican a los perros que han estado recientemente en un país de alto riesgo de rabia. El país de salida determina quién firma tu certificado y condiciona las pruebas de vacunación antirrábica que esperan los servicios guineanos."
        pt: "O certificado veterinário internacional é emitido por um veterinário credenciado pelo governo no país de partida, usando o modelo oficial desse país. Para os Estados Unidos, a APHIS endossa um atestado de saúde internacional pelo sistema VEHCS, e as regras do CDC se aplicam a cachorros que estiveram recentemente em um país de alto risco de raiva. O país de partida, portanto, determina quem assina seu certificado e molda as comprovações de vacinação antirrábica que os serviços da Guiné esperam."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "Your dog's rabies history and recent country of residence matter to the veterinary services, not only the last airport. A stay in a rabies-risk country can affect the evidence required. Note that Guinea is itself a rabies-endemic country, treated by the EU as a non-listed (unfavourable) third country and by CDC as high-risk for dog rabies, which matters for any later return to the EU or the United States."
        fr: "L'historique antirabique et le pays de résidence récent de ton chien comptent pour les services vétérinaires, pas seulement l'aéroport final. Un séjour dans un pays à risque rabique peut influer sur les preuves exigées. Note que la Guinée est elle-même un pays à rage endémique, traité par l'UE comme un pays tiers non listé (situation défavorable) et par les CDC comme à haut risque pour la rage canine, ce qui compte pour un éventuel retour ultérieur vers l'UE ou les États-Unis."
        es: "El historial antirrábico y el país de residencia reciente de tu perro importan para los servicios veterinarios, no solo el último aeropuerto. Una estancia en un país con riesgo de rabia puede afectar a las pruebas exigidas. Ten en cuenta que Guinea es en sí misma un país con rabia endémica, tratado por la UE como un país tercero no listado (situación desfavorable) y por los CDC como de alto riesgo para la rabia canina, lo que importa para un posible regreso posterior a la UE o a Estados Unidos."
        pt: "O histórico de raiva do seu cachorro e o país de residência recente importam para os serviços veterinários, não apenas o último aeroporto. Uma estadia em um país de risco de raiva pode afetar as comprovações exigidas. Observe que a própria Guiné é um país com raiva endêmica, tratado pela UE como país terceiro não listado (desfavorável) e pelo CDC como de alto risco para raiva canina, o que importa para uma eventual volta à UE ou aos Estados Unidos."
  note:
    en: "So read the requirements below as the confirmed core, then verify the unpublished points and your dog's exact origin, breed, length of stay and history with your vet and the DNSV before booking."
    fr: "Lis donc les exigences ci-dessous comme le socle confirmé, puis vérifie les points non publiés ainsi que l'origine, la race, la durée du séjour et l'historique exacts de ton chien auprès de ton vétérinaire et de la DNSV avant de réserver."
    es: "Así que lee los requisitos siguientes como el núcleo confirmado y luego verifica los puntos no publicados, así como el origen, la raza, la duración de la estancia y el historial exactos de tu perro con tu veterinario y la DNSV antes de reservar."
    pt: "Portanto, leia as exigências abaixo como o núcleo confirmado, e depois verifique os pontos não publicados e a origem exata, a raça, o tempo de estadia e o histórico do seu cachorro com seu veterinário e com a DNSV antes de reservar."

requirements:
  - item: { en: "Prior import permit", fr: "Permis d'importation préalable", es: "Permiso de importación previo", pt: "Autorização de importação prévia" }
    required: { en: "Not published", fr: "Non communiqué", es: "No publicado", pt: "Não publicado" }
    when: { en: "Guinea's livestock code sets the customs veterinary control but leaves the detailed conditions to be fixed by regulation ('par voie réglementaire'), and those implementing texts are not published online. This is an absence of published rule, not a confirmation that no permit exists — confirm directly with the DNSV before travel.", fr: "Le code de l'élevage guinéen prévoit le contrôle vétérinaire au dédouanement mais renvoie les conditions détaillées à des textes réglementaires (« par voie réglementaire »), non publiés en ligne. C'est une absence de règle publiée, non une confirmation qu'aucun permis n'existe — à confirmer directement auprès de la DNSV avant le voyage.", es: "El código ganadero guineano prevé el control veterinario en el despacho de aduanas, pero remite las condiciones detalladas a textos reglamentarios («par voie réglementaire»), no publicados en línea. Es una ausencia de norma publicada, no una confirmación de que no exista permiso — confírmalo directamente con la DNSV antes de viajar.", pt: "O código de pecuária da Guiné estabelece o controle veterinário aduaneiro, mas deixa as condições detalhadas para serem fixadas por regulamento ('par voie réglementaire'), e esses textos de aplicação não são publicados on-line. Isso é a ausência de uma regra publicada, não a confirmação de que nenhuma autorização existe — confirme diretamente com a DNSV antes de viajar." }
    exceptions: { en: "Unknown — the DNSV may set conditions case by case.", fr: "Non communiqué — la DNSV peut fixer des conditions au cas par cas.", es: "Desconocido — la DNSV puede fijar condiciones caso por caso.", pt: "Não comunicado — a DNSV pode definir condições caso a caso." }
    ref: { en: "Loi L/2018/026/AN — Code de l'élevage (Art. 41–43, conditions defined by regulation); no published pet-import permit", fr: "Loi L/2018/026/AN — Code de l'élevage (art. 41–43, conditions définies par voie réglementaire) ; aucun permis d'importation d'animaux publié", es: "Loi L/2018/026/AN — Code de l'élevage (art. 41–43, condiciones definidas por vía reglamentaria); ningún permiso de importación de animales publicado", pt: "Loi L/2018/026/AN — Code de l'élevage (Art. 41–43, condições definidas por regulamento); nenhuma autorização de importação de animais de estimação publicada" }
  - item: { en: "Identification (microchip)", fr: "Identification (puce)", es: "Identificación (microchip)", pt: "Identificação (microchip)" }
    required: { en: "ISO microchip recommended; not clearly mandated for pets", fr: "Puce ISO recommandée ; non clairement imposée pour les animaux de compagnie", es: "Microchip ISO recomendado; no claramente obligatorio para mascotas", pt: "Microchip ISO recomendado; não claramente obrigatório para animais de estimação" }
    when: { en: "The livestock code makes animal identification a public service and obligatory for livestock and any identifiable species, by a procedure approved by the minister, but does not publish a stand-alone microchip rule for pet dogs. An ISO 11784/11785 microchip is the practical standard and is needed for a later return to the EU; the certificate records the dog's identification.", fr: "Le code de l'élevage fait de l'identification un service public, obligatoire pour le bétail et toute espèce identifiable, selon un procédé agréé par le ministre, mais ne publie pas de règle spécifique de puce pour les chiens de compagnie. Une puce ISO 11784/11785 est le standard en pratique et nécessaire pour un retour ultérieur vers l'UE ; le certificat consigne l'identification du chien.", es: "El código ganadero hace de la identificación un servicio público, obligatorio para el ganado y toda especie identificable, mediante un procedimiento aprobado por el ministro, pero no publica una norma específica de microchip para los perros de compañía. Un microchip ISO 11784/11785 es el estándar en la práctica y es necesario para un regreso posterior a la UE; el certificado registra la identificación del perro.", pt: "O código de pecuária torna a identificação animal um serviço público e obrigatório para o gado e qualquer espécie identificável, por um procedimento aprovado pelo ministro, mas não publica uma regra isolada de microchip para cachorros de estimação. Um microchip ISO 11784/11785 é o padrão prático e é necessário para uma eventual volta à UE; o certificado registra a identificação do cachorro." }
    exceptions: { en: "Confirm with the DNSV what identification it accepts for an imported pet dog.", fr: "Confirme auprès de la DNSV l'identification acceptée pour un chien de compagnie importé.", es: "Confirma con la DNSV qué identificación acepta para un perro de compañía importado.", pt: "Confirme com a DNSV qual identificação ela aceita para um cachorro de estimação importado." }
    ref: { en: "Loi L/2018/026/AN — Code de l'élevage (Art. 5–6, identification); no separate pet microchip rule published", fr: "Loi L/2018/026/AN — Code de l'élevage (art. 5–6, identification) ; aucune règle distincte de puce pour animaux de compagnie publiée", es: "Loi L/2018/026/AN — Code de l'élevage (art. 5–6, identificación); ninguna norma específica de microchip para mascotas publicada", pt: "Loi L/2018/026/AN — Code de l'élevage (Art. 5–6, identificação); nenhuma regra separada de microchip para animais de estimação publicada" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required in practice (valid)", fr: "Requise en pratique (valide)", es: "Obligatoria en la práctica (válida)", pt: "Obrigatória na prática (válida)" }
    when: { en: "Guinea is rabies-endemic, so a current rabies vaccination is expected and is certified on the international veterinary health certificate. Where it is a primary vaccination, allow it to take effect before travel (commonly at least 21 days). Guinea does not publish a pet-specific rabies timing, so confirm the exact window with your official vet and the DNSV.", fr: "La Guinée est à rage endémique : une vaccination antirabique à jour est donc attendue et attestée sur le certificat vétérinaire international. S'il s'agit d'une primo-vaccination, laisse-la produire ses effets avant le voyage (souvent au moins 21 jours). La Guinée ne publie pas de délai antirabique propre aux animaux de compagnie ; confirme la fenêtre exacte avec ton vétérinaire officiel et la DNSV.", es: "Guinea tiene rabia endémica, por lo que se espera una vacunación antirrábica en vigor, que se certifica en el certificado sanitario veterinario internacional. Cuando se trate de una primovacunación, deja que surta efecto antes del viaje (a menudo al menos 21 días). Guinea no publica un plazo antirrábico propio de las mascotas; confirma la ventana exacta con tu veterinario oficial y la DNSV.", pt: "A Guiné tem raiva endêmica, portanto é esperada uma vacinação antirrábica em dia, certificada no atestado de saúde veterinário internacional. Quando se tratar de uma primovacinação, deixe-a fazer efeito antes da viagem (geralmente pelo menos 21 dias). A Guiné não publica um prazo de raiva específico para animais de estimação, portanto confirme a janela exata com seu veterinário oficial e com a DNSV." }
    exceptions: { en: "A dog too young to be validly vaccinated cannot meet the rabies requirement.", fr: "Un chien trop jeune pour être valablement vacciné ne peut satisfaire l'exigence antirabique.", es: "Un perro demasiado joven para vacunarse válidamente no puede cumplir el requisito antirrábico.", pt: "Um cachorro jovem demais para ser validamente vacinado não pode cumprir a exigência relativa à raiva." }
    ref: { en: "USDA APHIS — Pet Travel US to Guinea (international health certificate); Guinea rabies-endemic (CDC high-risk list)", fr: "USDA APHIS — Voyage d'animaux vers la Guinée (certificat sanitaire international) ; Guinée à rage endémique (liste haut risque des CDC)", es: "USDA APHIS — Viaje de animales de EE. UU. a Guinea (certificado sanitario internacional); Guinea con rabia endémica (lista de alto riesgo de los CDC)", pt: "USDA APHIS — Pet Travel US to Guinea (atestado de saúde internacional); Guiné com raiva endêmica (lista de alto risco do CDC)" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not published", fr: "Non prévu", es: "No prevista", pt: "Não publicado" }
    when: { en: "Guinea's published entry requirements for personal pets do not include a rabies antibody test for import into the country. (A rabies antibody test may still be relevant for a later return to the EU, because Guinea is rabies-endemic and non-listed.)", fr: "Les exigences d'entrée publiées pour les animaux personnels n'incluent pas de titrage antirabique pour l'importation en Guinée. (Un titrage peut toutefois rester pertinent pour un retour ultérieur vers l'UE, la Guinée étant à rage endémique et non listée.)", es: "Los requisitos de entrada publicados para mascotas personales no incluyen una prueba de titulación de rabia para la importación al país. (Una prueba de titulación puede seguir siendo pertinente para un regreso posterior a la UE, ya que Guinea tiene rabia endémica y no está listada.)", pt: "As exigências de entrada publicadas pela Guiné para animais de estimação pessoais não incluem um teste sorológico antirrábico (titulação) para a importação no país. (Um teste sorológico antirrábico ainda pode ser relevante para uma volta futura à UE, pois a Guiné tem raiva endêmica e é um país não listado.)" }
    exceptions: { en: "Unknown for special cases — confirm with the DNSV, as conditions can differ by the dog's origin and rabies history.", fr: "Non communiqué pour les cas particuliers — à confirmer auprès de la DNSV, les conditions pouvant varier selon l'origine et l'historique rabique du chien.", es: "Desconocido para casos particulares — confírmalo con la DNSV, ya que las condiciones pueden variar según el origen y el historial antirrábico del perro.", pt: "Não comunicado para casos especiais — confirme com a DNSV, pois as condições podem variar conforme a origem e o histórico de raiva do cachorro." }
    ref: { en: "No published Guinean antibody-test requirement; USDA APHIS — Pet Travel US to Guinea", fr: "Aucun titrage guinéen publié ; USDA APHIS — Voyage d'animaux vers la Guinée", es: "Ningún requisito guineano de prueba de titulación publicado; USDA APHIS — Viaje de animales de EE. UU. a Guinea", pt: "Nenhuma exigência guineense de teste sorológico publicada; USDA APHIS — Pet Travel US to Guinea" }
  - item: { en: "International veterinary health certificate", fr: "Certificat vétérinaire international", es: "Certificado sanitario veterinario internacional", pt: "Atestado de saúde veterinário internacional" }
    required: { en: "Required (original)", fr: "Requis (original)", es: "Obligatorio (original)", pt: "Obrigatório (original)" }
    when: { en: "An official international veterinary health certificate must accompany the dog. From the United States, a USDA-accredited veterinarian issues the international health certificate and APHIS endorses it through the VEHCS system (a printed paper copy must travel with the dog). French is acceptable, as Guinea is francophone. The certificate documents the dog's identification, clinical health and rabies vaccination.", fr: "Un certificat vétérinaire international officiel doit accompagner le chien. Depuis les États-Unis, un vétérinaire accrédité USDA établit le certificat sanitaire international et l'APHIS l'endosse via le système VEHCS (une copie papier imprimée doit voyager avec le chien). Le français est accepté, la Guinée étant francophone. Le certificat documente l'identification, l'état clinique et la vaccination antirabique du chien.", es: "Un certificado sanitario veterinario internacional oficial debe acompañar al perro. Desde Estados Unidos, un veterinario acreditado por el USDA expide el certificado sanitario internacional y la APHIS lo refrenda a través del sistema VEHCS (una copia impresa en papel debe viajar con el perro). Se acepta el francés, ya que Guinea es francófona. El certificado documenta la identificación, el estado clínico y la vacunación antirrábica del perro.", pt: "Um atestado de saúde veterinário internacional oficial deve acompanhar o cachorro. A partir dos Estados Unidos, um veterinário credenciado pela USDA emite o atestado de saúde internacional, e a APHIS o endossa pelo sistema VEHCS (uma cópia impressa em papel deve viajar com o cachorro). O francês é aceito, já que a Guiné é francófona. O certificado documenta a identificação do cachorro, sua saúde clínica e a vacinação antirrábica." }
    exceptions: { en: "None — an original official certificate must accompany every dog.", fr: "Aucune — un certificat officiel original doit accompagner chaque chien.", es: "Ninguna — un certificado oficial original debe acompañar a cada perro.", pt: "Nenhuma — um certificado oficial original deve acompanhar todo cachorro." }
    ref: { en: "USDA APHIS — Pet Travel US to Guinea (international health certificate, VEHCS)", fr: "USDA APHIS — Voyage d'animaux vers la Guinée (certificat sanitaire international, VEHCS)", es: "USDA APHIS — Viaje de animales de EE. UU. a Guinea (certificado sanitario internacional, VEHCS)", pt: "USDA APHIS — Pet Travel US to Guinea (atestado de saúde internacional, VEHCS)" }
  - item: { en: "Parasite / tapeworm treatment", fr: "Traitement antiparasitaire / échinocoque", es: "Tratamiento antiparasitario / contra la tenia", pt: "Tratamento antiparasitário / contra tênias" }
    required: { en: "Not published as mandatory", fr: "Non prévu comme obligatoire", es: "No previsto como obligatorio", pt: "Não publicado como obrigatório" }
    when: { en: "Guinea does not publish a mandatory internal or external parasite treatment for personal pet dogs at import. A vet may still recommend antiparasitic treatment as good practice.", fr: "La Guinée ne publie pas de traitement antiparasitaire interne ou externe obligatoire pour les chiens de compagnie personnels à l'importation. Un vétérinaire peut néanmoins recommander un traitement antiparasitaire par bonne pratique.", es: "Guinea no publica un tratamiento antiparasitario interno o externo obligatorio para los perros de compañía personales en la importación. Un veterinario puede recomendar de todos modos un tratamiento antiparasitario como buena práctica.", pt: "A Guiné não publica um tratamento antiparasitário interno ou externo obrigatório para cachorros de estimação pessoais na importação. Um veterinário ainda pode recomendar tratamento antiparasitário como boa prática." }
    exceptions: { en: "Unknown — confirm any requirement with the DNSV.", fr: "Non communiqué — confirme toute exigence auprès de la DNSV.", es: "Desconocido — confirma cualquier requisito con la DNSV.", pt: "Não comunicado — confirme qualquer exigência com a DNSV." }
    ref: { en: "No published Guinean parasite-treatment requirement for personal pets", fr: "Aucune exigence guinéenne publiée de traitement antiparasitaire pour animaux personnels", es: "Ningún requisito guineano publicado de tratamiento antiparasitario para mascotas personales", pt: "Nenhuma exigência guineense de tratamento antiparasitário publicada para animais de estimação pessoais" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Not published (linked to rabies)", fr: "Non communiqué (lié à la rage)", es: "No publicada (ligada a la rabia)", pt: "Não publicado (vinculado à raiva)" }
    when: { en: "Guinea does not publish a stand-alone minimum age. In practice, a puppy must be old enough to be validly vaccinated against rabies (commonly about 3 months / 12 weeks) with the vaccination effective before travel.", fr: "La Guinée ne publie pas d'âge minimum distinct. En pratique, un chiot doit être en âge d'être valablement vacciné contre la rage (souvent environ 3 mois / 12 semaines), la vaccination devant produire ses effets avant le voyage.", es: "Guinea no publica una edad mínima independiente. En la práctica, un cachorro debe tener edad suficiente para vacunarse válidamente contra la rabia (a menudo unos 3 meses / 12 semanas), con la vacunación en efecto antes del viaje.", pt: "A Guiné não publica uma idade mínima isolada. Na prática, um filhote precisa ter idade suficiente para ser validamente vacinado contra a raiva (geralmente cerca de 3 meses / 12 semanas), com a vacinação em vigor antes da viagem." }
    exceptions: { en: "Puppies too young to be vaccinated cannot meet the rabies requirement — confirm with the DNSV.", fr: "Les chiots trop jeunes pour être vaccinés ne peuvent satisfaire l'exigence antirabique — à confirmer auprès de la DNSV.", es: "Los cachorros demasiado jóvenes para vacunarse no pueden cumplir el requisito antirrábico — confírmalo con la DNSV.", pt: "Filhotes jovens demais para serem vacinados não podem cumprir a exigência relativa à raiva — confirme com a DNSV." }
    ref: { en: "Derived from the rabies-vaccination requirement; no separate Guinean minimum-age rule published", fr: "Déduit de l'exigence de vaccination antirabique ; aucun âge minimum guinéen distinct publié", es: "Derivada del requisito de vacunación antirrábica; ninguna norma guineana de edad mínima independiente publicada", pt: "Derivada da exigência de vacinação antirrábica; nenhuma regra guineense separada de idade mínima publicada" }
  - item: { en: "Border / airport veterinary inspection & customs", fr: "Contrôle vétérinaire frontalier / aéroportuaire et douane", es: "Inspección veterinaria en frontera / aeropuerto y aduanas", pt: "Inspeção veterinária de fronteira/aeroporto e alfândega" }
    required: { en: "Required (before customs clearance)", fr: "Requis (avant dédouanement)", es: "Obligatoria (antes del despacho de aduanas)", pt: "Obrigatória (antes do desembaraço aduaneiro)" }
    when: { en: "Under the livestock code, every live animal presented for import into Guinea — by land, rail, river, sea or air — is subject to a veterinary health inspection before customs clearance, carried out by the veterinary services of the ministry in charge of livestock (DNSV) or a state-mandated vet. Carry all originals and be ready to present them on arrival.", fr: "En vertu du code de l'élevage, tout animal vivant présenté à l'importation en Guinée — par voie terrestre, ferroviaire, fluviale, maritime ou aérienne — est soumis à un contrôle sanitaire vétérinaire avant dédouanement, assuré par les services vétérinaires du ministère en charge de l'élevage (DNSV) ou un vétérinaire mandaté par l'État. Garde tous les originaux et sois prêt à les présenter à l'arrivée.", es: "Según el código ganadero, todo animal vivo presentado para su importación a Guinea — por vía terrestre, ferroviaria, fluvial, marítima o aérea — está sujeto a una inspección sanitaria veterinaria antes del despacho de aduanas, realizada por los servicios veterinarios del ministerio a cargo de la ganadería (DNSV) o un veterinario mandatado por el Estado. Lleva todos los originales y prepárate para presentarlos a la llegada.", pt: "Segundo o código de pecuária, todo animal vivo apresentado para importação na Guiné — por via terrestre, ferroviária, fluvial, marítima ou aérea — está sujeito a uma inspeção veterinária sanitária antes do desembaraço aduaneiro, realizada pelos serviços veterinários do ministério responsável pela pecuária (DNSV) ou por um veterinário mandatado pelo Estado. Leve todos os originais e esteja pronto para apresentá-los na chegada." }
    exceptions: { en: "The exact airport fees and steps for a personal pet are not published; confirm with the DNSV.", fr: "Les frais et étapes exacts à l'aéroport pour un animal de compagnie ne sont pas publiés ; à confirmer auprès de la DNSV.", es: "Las tasas y los pasos exactos en el aeropuerto para una mascota personal no están publicados; confírmalo con la DNSV.", pt: "As taxas e etapas exatas do aeroporto para um animal de estimação pessoal não são publicadas; confirme com a DNSV." }
    ref: { en: "Loi L/2018/026/AN — Code de l'élevage (Art. 41–42, veterinary control at import)", fr: "Loi L/2018/026/AN — Code de l'élevage (art. 41–42, contrôle vétérinaire à l'importation)", es: "Loi L/2018/026/AN — Code de l'élevage (art. 41–42, control veterinario en la importación)", pt: "Loi L/2018/026/AN — Code de l'élevage (Art. 41–42, controle veterinário na importação)" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Possible outcome; not routine", fr: "Résultat possible ; non systématique", es: "Posible resultado; no sistemática", pt: "Possível resultado; não sistemática" }
    when: { en: "The livestock code lists quarantine ('mise en quarantaine') as one possible result of the border veterinary control, alongside entry, conditional entry, refusal, and seizure/destruction. No routine quarantine for a compliant personal pet dog is published, but the veterinary services can order it — most often for a non-compliant or suspect animal.", fr: "Le code de l'élevage cite la mise en quarantaine parmi les résultats possibles du contrôle vétérinaire frontalier, aux côtés de l'entrée, de l'entrée sous conditions, du refoulement et de la saisie/destruction. Aucune quarantaine de routine pour un chien de compagnie conforme n'est publiée, mais les services vétérinaires peuvent l'imposer — le plus souvent pour un animal non conforme ou suspect.", es: "El código ganadero cita la cuarentena («mise en quarantaine») entre los posibles resultados del control veterinario fronterizo, junto a la entrada, la entrada bajo condiciones, la denegación y la incautación/destrucción. No se publica ninguna cuarentena de rutina para un perro de compañía conforme, pero los servicios veterinarios pueden imponerla — sobre todo para un animal no conforme o sospechoso.", pt: "O código de pecuária lista a quarentena ('mise en quarantaine') como um dos possíveis resultados do controle veterinário de fronteira, ao lado da entrada, entrada condicional, recusa e apreensão/destruição. Nenhuma quarentena sistemática é publicada para um cachorro de estimação pessoal em conformidade, mas os serviços veterinários podem determiná-la — na maioria das vezes para um animal em não conformidade ou suspeito." }
    exceptions: { en: "Non-compliant animals may be refused, returned, quarantined or, at worst, seized and destroyed under the code.", fr: "Les animaux non conformes peuvent être refoulés, renvoyés, mis en quarantaine ou, au pire, saisis et détruits en vertu du code.", es: "Los animales no conformes pueden ser rechazados, devueltos, puestos en cuarentena o, en el peor de los casos, incautados y destruidos en virtud del código.", pt: "Animais em não conformidade podem ser recusados, devolvidos, colocados em quarentena ou, na pior das hipóteses, apreendidos e destruídos, segundo o código." }
    ref: { en: "Loi L/2018/026/AN — Code de l'élevage (Art. 42, results of veterinary control)", fr: "Loi L/2018/026/AN — Code de l'élevage (art. 42, résultats du contrôle vétérinaire)", es: "Loi L/2018/026/AN — Code de l'élevage (art. 42, resultados del control veterinario)", pt: "Loi L/2018/026/AN — Code de l'élevage (Art. 42, resultados do controle veterinário)" }
  - item: { en: "Banned / restricted breeds", fr: "Races interdites / restreintes", es: "Razas prohibidas / restringidas", pt: "Raças proibidas / restritas" }
    required: { en: "Attack-type (first-category) dogs banned from import", fr: "Chiens d'attaque (1re catégorie) interdits d'importation", es: "Perros de tipo ataque (1.ª categoría) prohibidos para la importación", pt: "Cachorros do tipo ataque (primeira categoria) proibidos de importação" }
    when: { en: "The livestock code classifies dogs 'liable to be particularly dangerous' into two categories. First-category 'attack' dogs are prohibited from import or introduction into Guinea (save an exceptional general-interest derogation). Second-category 'guard and defence' dogs are admitted, but must be kept muzzled and leashed with restricted access to public places and transport. The precise list of breeds in each category is set by a joint order of the interior and livestock ministers, which we did not find published.", fr: "Le code de l'élevage classe les chiens « susceptibles d'être particulièrement dangereux » en deux catégories. Les chiens d'attaque (première catégorie) sont interdits d'importation ou d'introduction en Guinée (sauf dérogation exceptionnelle d'intérêt général). Les chiens de garde et de défense (deuxième catégorie) sont admis, mais doivent être tenus en muselière et en laisse, avec accès restreint aux lieux publics et aux transports. La liste précise des races de chaque catégorie est fixée par un arrêté conjoint des ministres de l'intérieur et de l'élevage, que nous n'avons pas trouvé publié.", es: "El código ganadero clasifica a los perros «susceptibles de ser particularmente peligrosos» en dos categorías. Los perros de «ataque» (primera categoría) están prohibidos para la importación o introducción en Guinea (salvo una excepción de interés general). Los perros de «guardia y defensa» (segunda categoría) se admiten, pero deben mantenerse con bozal y correa, con acceso restringido a los lugares públicos y al transporte. La lista precisa de razas de cada categoría se fija mediante una orden conjunta de los ministros del interior y de la ganadería, que no hemos encontrado publicada.", pt: "O código de pecuária classifica os cachorros 'suscetíveis de serem particularmente perigosos' em duas categorias. Cachorros de 'ataque' de primeira categoria são proibidos de importação ou introdução na Guiné (salvo derrogação excepcional de interesse geral). Cachorros de 'guarda e defesa' de segunda categoria são admitidos, mas devem usar focinheira e coleira, com acesso restrito a locais públicos e transporte. A lista precisa de raças de cada categoria é definida por uma portaria conjunta dos ministérios do Interior e da Pecuária, que não encontramos publicada." }
    exceptions: { en: "Confirm your dog's breed and any cross with the DNSV before travel, since the detailed breed list is not published.", fr: "Confirme la race de ton chien et tout croisement auprès de la DNSV avant de voyager, la liste détaillée des races n'étant pas publiée.", es: "Confirma la raza de tu perro y cualquier cruce con la DNSV antes de viajar, ya que la lista detallada de razas no está publicada.", pt: "Confirme a raça do seu cachorro e qualquer cruzamento com a DNSV antes de viajar, já que a lista detalhada de raças não é publicada." }
    ref: { en: "Loi L/2018/026/AN — Code de l'élevage (Art. 148–152, dangerous-dog categories; import ban for first category)", fr: "Loi L/2018/026/AN — Code de l'élevage (art. 148–152, catégories de chiens dangereux ; interdiction d'import de la 1re catégorie)", es: "Loi L/2018/026/AN — Code de l'élevage (art. 148–152, categorías de perros peligrosos; prohibición de importación de la 1.ª categoría)", pt: "Loi L/2018/026/AN — Code de l'élevage (Art. 148–152, categorias de cachorros perigosos; proibição de importação para a primeira categoria)" }

origin:
  scheme: eu
  eu:
    title: { en: "From the European Union", fr: "Depuis l'Union européenne", es: "Desde la Unión Europea", pt: "Da União Europeia" }
    body:
      en: "For a dog leaving the EU, have an official EU vet issue an international veterinary health certificate close to departure. Your dog needs a permanent identification (an ISO microchip in practice) and a valid rabies vaccination recorded in the passport / vaccination booklet. No rabies antibody test is published for entry into Guinea. Because Guinea publishes little, confirm with the DNSV whether a prior import permit applies and check your dog's breed is not in the banned first category. On arrival, the veterinary services inspect the dog and its documents before customs clearance."
      fr: "Pour un chien quittant l'UE, fais établir un certificat vétérinaire international par un vétérinaire officiel de l'UE peu avant le départ. Ton chien a besoin d'une identification permanente (une puce ISO en pratique) et d'une vaccination antirabique valide consignée dans le passeport / carnet de vaccination. Aucun titrage antirabique n'est publié pour l'entrée en Guinée. La Guinée publiant peu, confirme auprès de la DNSV si un permis d'importation préalable s'applique et vérifie que la race de ton chien ne relève pas de la première catégorie interdite. À l'arrivée, les services vétérinaires contrôlent le chien et ses documents avant dédouanement."
      es: "Para un perro que sale de la UE, haz que un veterinario oficial de la UE expida un certificado sanitario veterinario internacional poco antes de la salida. Tu perro necesita una identificación permanente (un microchip ISO en la práctica) y una vacunación antirrábica válida registrada en el pasaporte / cartilla de vacunación. No se publica ninguna prueba de titulación de rabia para la entrada en Guinea. Como Guinea publica poco, confirma con la DNSV si se aplica un permiso de importación previo y comprueba que la raza de tu perro no está en la primera categoría prohibida. A la llegada, los servicios veterinarios inspeccionan al perro y sus documentos antes del despacho de aduanas."
      pt: "Para um cachorro que sai da UE, peça a um veterinário oficial da UE para emitir um atestado de saúde veterinário internacional perto da partida. Seu cachorro precisa de uma identificação permanente (um microchip ISO na prática) e de uma vacinação antirrábica válida registrada no passaporte / carteira de vacinação. Nenhum teste sorológico antirrábico é publicado para a entrada na Guiné. Como a Guiné publica pouco, confirme com a DNSV se é exigida uma autorização de importação prévia e verifique que a raça do seu cachorro não está na primeira categoria proibida. Na chegada, os serviços veterinários inspecionam o cachorro e seus documentos antes do desembaraço aduaneiro."
    cls: warn
  listed:
    title: { en: "From the United States & other third countries", fr: "Depuis les États-Unis et autres pays tiers", es: "Desde Estados Unidos y otros países terceros", pt: "Dos Estados Unidos e de outros países terceiros" }
    body:
      en: "From a non-EU country, the core is the same: a permanent identification, a valid rabies vaccination and an original international veterinary health certificate issued by a government-accredited vet close to departure. From the United States, a USDA-accredited vet issues the international health certificate and APHIS endorses it through VEHCS; a printed copy must accompany the dog. CDC rules also apply to dogs recently in a high-risk rabies country. Use your own country's official export model where you travel from elsewhere, and confirm any additional Guinean condition with the DNSV."
      fr: "Depuis un pays hors UE, le socle est identique : une identification permanente, une vaccination antirabique valide et l'original d'un certificat vétérinaire international établi par un vétérinaire accrédité peu avant le départ. Depuis les États-Unis, un vétérinaire accrédité USDA établit le certificat sanitaire international et l'APHIS l'endosse via VEHCS ; une copie imprimée doit accompagner le chien. Les règles des CDC s'appliquent aussi aux chiens ayant récemment séjourné dans un pays à haut risque rabique. Utilise le modèle d'exportation officiel de ton propre pays si tu voyages d'ailleurs, et confirme toute condition guinéenne supplémentaire auprès de la DNSV."
      es: "Desde un país fuera de la UE, el núcleo es el mismo: una identificación permanente, una vacunación antirrábica válida y el original de un certificado sanitario veterinario internacional expedido por un veterinario acreditado por el gobierno poco antes de la salida. Desde Estados Unidos, un veterinario acreditado por el USDA expide el certificado sanitario internacional y la APHIS lo refrenda a través de VEHCS; una copia impresa debe acompañar al perro. Las normas de los CDC también se aplican a los perros que han estado recientemente en un país de alto riesgo de rabia. Usa el modelo de exportación oficial de tu propio país si viajas desde otro lugar, y confirma cualquier condición guineana adicional con la DNSV."
      pt: "Vindo de um país fora da UE, o núcleo é o mesmo: uma identificação permanente, uma vacinação antirrábica válida e um atestado de saúde veterinário internacional original emitido por um veterinário credenciado pelo governo perto da partida. A partir dos Estados Unidos, um veterinário credenciado pela USDA emite o atestado de saúde internacional, e a APHIS o endossa pelo VEHCS; uma cópia impressa deve acompanhar o cachorro. As regras do CDC também se aplicam a cachorros que estiveram recentemente em um país de alto risco de raiva. Use o modelo oficial de exportação do seu próprio país se viajar de outro lugar, e confirme qualquer condição guineense adicional com a DNSV."
    cls: warn
  nonListed:
    title: { en: "Rabies history & special cases", fr: "Historique rabique et cas particuliers", es: "Historial antirrábico y casos particulares", pt: "Histórico de raiva e casos particulares" }
    body:
      en: "Guinea does not publish a separate at-risk-country track or a rabies antibody test for personal pets entering the country, but the DNSV can attach conditions based on the dog's origin and rabies history, and the border veterinary control can order conditional entry or quarantine. If your dog has stayed in a high-risk country, confirm directly with the DNSV what evidence will be required. Because Guinea is itself rabies-endemic and treated by the EU as non-listed and by CDC as high-risk, plan the rabies antibody test now if you intend to bring the dog back into the EU later, and check current CDC rules for a return to the United States."
      fr: "La Guinée ne publie pas de parcours distinct pour les pays à risque ni de titrage antirabique pour les animaux personnels entrant dans le pays, mais la DNSV peut assortir l'entrée de conditions selon l'origine et l'historique rabique du chien, et le contrôle vétérinaire frontalier peut décider d'une entrée sous conditions ou d'une quarantaine. Si ton chien a séjourné dans un pays à haut risque, confirme directement auprès de la DNSV les preuves exigées. La Guinée étant elle-même à rage endémique, traitée par l'UE comme non listée et par les CDC comme à haut risque, prévois dès maintenant le titrage antirabique si tu compte ramener le chien dans l'UE plus tard, et vérifie les règles en vigueur des CDC pour un retour aux États-Unis."
      es: "Guinea no publica un itinerario específico para países de riesgo ni una prueba de titulación de rabia para las mascotas personales que entran en el país, pero la DNSV puede imponer condiciones según el origen y el historial antirrábico del perro, y el control veterinario fronterizo puede decidir una entrada bajo condiciones o una cuarentena. Si tu perro ha estado en un país de alto riesgo, confirma directamente con la DNSV qué pruebas se exigirán. Como Guinea tiene rabia endémica y es tratada por la UE como no listada y por los CDC como de alto riesgo, prevé ya la prueba de titulación de rabia si piensas traer al perro de vuelta a la UE más adelante, y consulta las normas vigentes de los CDC para un regreso a Estados Unidos."
      pt: "A Guiné não publica uma via separada para países de risco nem um teste sorológico antirrábico para animais de estimação pessoais que entram no país, mas a DNSV pode acrescentar condições com base na origem e no histórico de raiva do cachorro, e o controle veterinário de fronteira pode determinar entrada condicional ou quarentena. Se seu cachorro esteve em um país de alto risco, confirme diretamente com a DNSV quais comprovações serão exigidas. Como a própria Guiné tem raiva endêmica e é tratada pela UE como não listada e pelo CDC como de alto risco, planeje já o teste sorológico antirrábico (titulação) se pretende levar o cachorro de volta à UE mais tarde, e verifique as regras atuais do CDC para uma volta aos Estados Unidos."
    cls: neutral

arrival:
  intro:
    en: "What happens when your dog reaches Guinea is anchored by the livestock code's veterinary control before customs clearance, but the exact airport steps are not published — prepare a complete, valid document set."
    fr: "Ce qui se passe à l'arrivée de ton chien en Guinée repose sur le contrôle vétérinaire du code de l'élevage avant dédouanement, mais les étapes exactes à l'aéroport ne sont pas publiées — prépare un dossier complet et valide."
    es: "Lo que ocurre cuando tu perro llega a Guinea se apoya en el control veterinario del código ganadero antes del despacho de aduanas, pero los pasos exactos en el aeropuerto no están publicados — prepara un expediente completo y válido."
    pt: "O que acontece quando seu cachorro chega à Guiné se baseia no controle veterinário do código de pecuária antes do desembaraço aduaneiro, mas as etapas exatas do aeroporto não são publicadas — prepare um conjunto completo e válido de documentos."
  points:
    - en: "Every live animal imported into Guinea is subject to a veterinary health inspection before customs clearance, carried out by the veterinary services (DNSV) or a state-mandated vet — including at the airport."
      fr: "Tout animal vivant importé en Guinée est soumis à un contrôle sanitaire vétérinaire avant dédouanement, assuré par les services vétérinaires (DNSV) ou un vétérinaire mandaté par l'État — y compris à l'aéroport."
      es: "Todo animal vivo importado a Guinea está sujeto a una inspección sanitaria veterinaria antes del despacho de aduanas, realizada por los servicios veterinarios (DNSV) o un veterinario mandatado por el Estado — también en el aeropuerto."
      pt: "Todo animal vivo importado para a Guiné está sujeito a uma inspeção veterinária sanitária antes do desembaraço aduaneiro, realizada pelos serviços veterinários (DNSV) ou por um veterinário mandatado pelo Estado — inclusive no aeroporto."
    - en: "Present the originals: the international veterinary health certificate, proof of identification and proof of a valid rabies vaccination."
      fr: "Présente les originaux : le certificat vétérinaire international, la preuve d'identification et la preuve d'une vaccination antirabique valide."
      es: "Presenta los originales: el certificado sanitario veterinario internacional, la prueba de identificación y la prueba de una vacunación antirrábica válida."
      pt: "Apresente os originais: o atestado de saúde veterinário internacional, a comprovação de identificação e a comprovação da vacinação antirrábica válida."
    - en: "The control can result in entry, conditional entry, quarantine, refusal (refoulement) or, for a non-compliant or suspect animal, seizure and destruction — so documents must be complete and consistent."
      fr: "Le contrôle peut aboutir à l'entrée, l'entrée sous conditions, la quarantaine, le refoulement ou, pour un animal non conforme ou suspect, la saisie et la destruction — les documents doivent donc être complets et cohérents."
      es: "El control puede dar lugar a la entrada, la entrada bajo condiciones, la cuarentena, la denegación (refoulement) o, para un animal no conforme o sospechoso, la incautación y la destrucción — por lo que los documentos deben ser completos y coherentes."
      pt: "O controle pode resultar em entrada, entrada condicional, quarentena, recusa (refoulement) ou, para um animal em não conformidade ou suspeito, apreensão e destruição — portanto os documentos devem estar completos e coerentes."
    - en: "Attack-type (first-category) dogs are banned from import; guard/defence (second-category) dogs must be muzzled and leashed."
      fr: "Les chiens d'attaque (première catégorie) sont interdits d'importation ; les chiens de garde et de défense (deuxième catégorie) doivent être muselés et tenus en laisse."
      es: "Los perros de tipo ataque (primera categoría) están prohibidos para la importación; los perros de guardia y defensa (segunda categoría) deben llevar bozal y correa."
      pt: "Cachorros do tipo ataque (primeira categoria) são proibidos de importação; cachorros de guarda/defesa (segunda categoria) devem usar focinheira e coleira."
    - en: "Because the exact airport procedure and any fees are not published, confirm the arrival formalities with the DNSV before you travel, and carry a full set of originals throughout the journey."
      fr: "La procédure exacte à l'aéroport et les éventuels frais n'étant pas publiés, confirme les formalités d'arrivée auprès de la DNSV avant de voyager, et garde un jeu complet d'originaux durant tout le trajet."
      es: "Como el procedimiento exacto en el aeropuerto y las posibles tasas no están publicados, confirma los trámites de llegada con la DNSV antes de viajar, y lleva un juego completo de originales durante todo el trayecto."
      pt: "Como o procedimento exato do aeroporto e eventuais taxas não são publicados, confirme as formalidades de chegada com a DNSV antes de viajar, e leve um conjunto completo de originais durante toda a viagem."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Unlike many neighbouring countries, Guinea does publish a breed-related rule. The national livestock code (Loi L/2018/026/AN) categorises dogs 'liable to be particularly dangerous' and controls their import."
    fr: "Contrairement à de nombreux pays voisins, la Guinée publie une règle liée aux races. Le code de l'élevage (Loi L/2018/026/AN) catégorise les chiens « susceptibles d'être particulièrement dangereux » et encadre leur importation."
    es: "A diferencia de muchos países vecinos, Guinea sí publica una norma relacionada con las razas. El código ganadero (Loi L/2018/026/AN) clasifica a los perros «susceptibles de ser particularmente peligrosos» y regula su importación."
    pt: "Diferentemente de muitos países vizinhos, a Guiné publica uma regra relacionada a raças. O código nacional de pecuária (Loi L/2018/026/AN) categoriza os cachorros 'suscetíveis de serem particularmente perigosos' e controla sua importação."
  cat1:
    en: "First category — 'attack' dogs (chiens d'attaque): prohibited from import or introduction into Guinea. The ban may be waived only exceptionally, for live animals in the general interest. If your dog could fall in this category, it cannot be imported as an ordinary pet — confirm with the DNSV before making any plan."
    fr: "Première catégorie — chiens d'attaque : interdits d'importation ou d'introduction en Guinée. L'interdiction ne peut être levée qu'à titre exceptionnel, pour des animaux vivants dans un but d'intérêt général. Si ton chien pourrait relever de cette catégorie, il ne peut être importé comme animal de compagnie ordinaire — confirme auprès de la DNSV avant tout projet."
    es: "Primera categoría — perros de «ataque» (chiens d'attaque): prohibidos para la importación o introducción en Guinea. La prohibición solo puede levantarse de forma excepcional, para animales vivos en aras del interés general. Si tu perro pudiera pertenecer a esta categoría, no puede importarse como mascota ordinaria — confírmalo con la DNSV antes de hacer cualquier plan."
    pt: "Primeira categoria — cachorros de 'ataque' (chiens d'attaque): proibidos de importação ou introdução na Guiné. A proibição só pode ser dispensada excepcionalmente, para animais vivos de interesse geral. Se o seu cachorro puder se enquadrar nessa categoria, ele não pode ser importado como um animal de estimação comum — confirme com a DNSV antes de fazer qualquer plano."
  cat2:
    en: "Second category — 'guard and defence' dogs (chiens de garde et de défense): admitted, but must be kept muzzled and on a leash, with restricted access to public places, premises open to the public and public transport. The exact breed list for each category is set by a joint order of the interior and livestock ministers, which we did not find published."
    fr: "Deuxième catégorie — chiens de garde et de défense : admis, mais devant être tenus en muselière et en laisse, avec accès restreint aux lieux publics, locaux ouverts au public et transports en commun. La liste exacte des races de chaque catégorie est fixée par un arrêté conjoint des ministres de l'intérieur et de l'élevage, que nous n'avons pas trouvé publié."
    es: "Segunda categoría — perros de «guardia y defensa» (chiens de garde et de défense): admitidos, pero deben mantenerse con bozal y correa, con acceso restringido a los lugares públicos, locales abiertos al público y transporte público. La lista exacta de razas de cada categoría se fija mediante una orden conjunta de los ministros del interior y de la ganadería, que no hemos encontrado publicada."
    pt: "Segunda categoria — cachorros de 'guarda e defesa' (chiens de garde et de défense): admitidos, mas devem usar focinheira e coleira, com acesso restrito a locais públicos, estabelecimentos abertos ao público e transporte público. A lista exata de raças de cada categoria é definida por uma portaria conjunta dos ministérios do Interior e da Pecuária, que não encontramos publicada."
  note:
    en: "Because the detailed breed list is not published and rules can change, confirm your dog's breed and any cross with the DNSV in writing before you travel."
    fr: "La liste détaillée des races n'étant pas publiée et les règles pouvant évoluer, confirme la race de ton chien et tout croisement auprès de la DNSV par écrit avant de voyager."
    es: "Como la lista detallada de razas no está publicada y las normas pueden cambiar, confirma por escrito la raza de tu perro y cualquier cruce con la DNSV antes de viajar."
    pt: "Como a lista detalhada de raças não é publicada e as regras podem mudar, confirme por escrito a raça do seu cachorro e qualquer cruzamento com a DNSV antes de viajar."

checklist:
  - en: "Confirm with the DNSV whether a prior import permit or any extra condition applies (Guinea publishes little)"
    fr: "Confirme auprès de la DNSV si un permis d'importation préalable ou une condition supplémentaire s'applique (la Guinée publie peu)"
    es: "Confirma con la DNSV si se aplica un permiso de importación previo o alguna condición adicional (Guinea publica poco)"
    pt: "Confirme com a DNSV se é exigida uma autorização de importação prévia ou qualquer condição extra (a Guiné publica pouco)"
  - en: "Check your dog's breed is not a banned first-category 'attack' dog; second-category dogs need muzzle and leash"
    fr: "Vérifie que la race de ton chien n'est pas un chien d'attaque de 1re catégorie interdit ; les chiens de 2e catégorie exigent muselière et laisse"
    es: "Comprueba que la raza de tu perro no es un perro de «ataque» de 1.ª categoría prohibido; los perros de 2.ª categoría necesitan bozal y correa"
    pt: "Verifique que a raça do seu cachorro não é um cachorro de 'ataque' de primeira categoria proibido; cachorros de segunda categoria precisam de focinheira e coleira"
  - en: "Permanent identification (ISO microchip recommended) placed before the rabies vaccination"
    fr: "Identification permanente (puce ISO recommandée) posée avant la vaccination antirabique"
    es: "Identificación permanente (microchip ISO recomendado) implantada antes de la vacunación antirrábica"
    pt: "Identificação permanente (microchip ISO recomendado) implantada antes da vacinação antirrábica"
  - en: "Valid rabies vaccination recorded with date, vaccine, batch and validity (primary shot to take effect before travel)"
    fr: "Vaccination antirabique valide consignée avec date, vaccin, lot et validité (primo-vaccination produisant ses effets avant le voyage)"
    es: "Vacunación antirrábica válida registrada con fecha, vacuna, lote y valide (la primovacunación debe surtir efecto antes del viaje)"
    pt: "Vacinação antirrábica válida registrada com data, vacina, lote e validade (a primovacinação deve fazer efeito antes da viagem)"
  - en: "Original international veterinary health certificate issued shortly before departure (from the US: APHIS-endorsed via VEHCS, printed copy carried)"
    fr: "Original du certificat vétérinaire international établi peu avant le départ (depuis les USA : endossé par l'APHIS via VEHCS, copie imprimée emportée)"
    es: "Certificado sanitario veterinario internacional original expedido poco antes de la salida (desde EE. UU.: refrendado por la APHIS vía VEHCS, con copia impresa)"
    pt: "Atestado de saúde veterinário internacional original emitido pouco antes da partida (dos EUA: endossado pela APHIS via VEHCS, cópia impressa levada)"
  - en: "Up-to-date vaccination records carried with you"
    fr: "Preuves de vaccination à jour emportées avec toi"
    es: "Registros de vacunación al día que lleves contigo"
    pt: "Registros de vacinação atualizados levados com você"
  - en: "Original documents ready for the veterinary inspection before customs clearance at the airport"
    fr: "Documents originaux prêts pour le contrôle vétérinaire avant dédouanement à l'aéroport"
    es: "Documentos originales listos para la inspección veterinaria antes del despacho de aduanas en el aeropuerto"
    pt: "Documentos originais prontos para a inspeção veterinária antes do desembaraço aduaneiro no aeroporto"
  - en: "If you will return to the EU or the US, plan the rabies antibody test / CDC rules (Guinea is rabies-endemic and non-listed)"
    fr: "Si tu rentre dans l'UE ou aux USA, prévois le titrage antirabique / les règles des CDC (la Guinée est à rage endémique et non listée)"
    es: "Si vas a regresar a la UE o a EE. UU., prevé la prueba de titulación de rabia / las normas de los CDC (Guinea tiene rabia endémica y no está listada)"
    pt: "Se você for voltar à UE ou aos EUA, planeje o teste sorológico antirrábico (titulação) / as regras do CDC (a Guiné tem raiva endêmica e é não listada)"
  - en: "Airline reservation confirming your dog's travel option and suitable travel crate"
    fr: "Réservation confirmant l'option de transport de ton chien et caisse de transport adaptée"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y jaula de transporte adecuada"
    pt: "Reserva na companhia aérea confirmando a opção de transporte do seu cachorro e caixa de transporte adequada às normas da IATA"

