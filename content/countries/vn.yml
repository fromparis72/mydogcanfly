# Country Entry Guide — Vietnam (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
# Vietnam is NOT in the EU. It runs its own scheme via the Department of Animal Health (Cục Thú y / DAH):
# rabies vaccination -> international veterinary health certificate -> advance quarantine registration
# with the DAH -> entry via a designated international airport with a border quarantine station ->
# quarantine inspection on arrival. Microchip is recommended, not mandatory under Vietnamese law.
# Legal basis: Law on Animal Health 2015; Decree 35/2016/ND-CP; Circular 25/2016/TT-BNNPTNT.
# No rabies antibody test is published in Vietnam's scheme. The eu/listed/nonListed slots are
# repurposed to Vietnam's origin-risk tiers: eu = standard compliant import from a disease-free
# origin; listed = higher-risk origin with extended on-arrival quarantine; nonListed = origin
# affected by notifiable diseases (import prohibited under Decree 35/2016).
id: country_vn
iso2: "VN"
name: { en: "Vietnam", fr: "Vietnam", es: "Vietnam", pt: "Vietnã" }
region: { en: "Asia", fr: "Asie", es: "Asia", pt: "Ásia" }


regime: non_listed
domestic:
  intro:
    en: "Domestic flight in Vietnam: crossing a provincial boundary requires a veterinary quarantine certificate — there is no exemption for pets."
    fr: "Vol intérieur au Vietnam : franchir une limite provinciale impose un certificat de quarantaine vétérinaire — il n'existe aucune exemption pour les animaux de compagnie."
    es: "Vuelo nacional en Vietnam: cruzar un límite provincial exige un certificado de cuarentena veterinaria — no hay exención para mascotas."
    pt: "Voo doméstico no Vietnã: cruzar uma fronteira provincial exige um certificado de quarentena veterinária — não há isenção para animais de estimação."
  points:
    - en: "Dogs are expressly listed among the animals needing a quarantine certificate to leave a province, issued by the provincial veterinary authority. The 'two pets' exemption people cite applies to crossing an international border, not domestic travel."
      fr: "Les chiens figurent expressément parmi les animaux nécessitant un certificat de quarantaine pour quitter une province, délivré par l'autorité vétérinaire provinciale. L'exemption « deux animaux » souvent citée concerne le passage d'une frontière internationale, pas un trajet intérieur."
      es: "Los perros figuran expresamente entre los animales que necesitan certificado de cuarentena para salir de una provincia, emitido por la autoridad veterinaria provincial. La exención de «dos mascotas» que se cita se refiere a cruzar una frontera internacional, no a un viaje nacional."
      pt: "Os cachorros estão expressamente listados entre os animais que precisam de um certificado de quarentena para sair de uma província, emitido pela autoridade veterinária provincial. A isenção de 'dois animais de estimação' que as pessoas citam se aplica ao cruzamento de uma fronteira internacional, não a viagens domésticas."
    - en: "A vaccinated dog from a disease-free area is processed faster (about one working day) than an unvaccinated one, which triggers lab testing."
      fr: "Un chien vacciné venant d'une zone indemne est traité plus vite (environ un jour ouvré) qu'un chien non vacciné, qui déclenche des analyses de laboratoire."
      es: "Un perro vacunado procedente de una zona libre se tramita más rápido (aproximadamente un día hábil) que uno sin vacunar, que activa análisis de laboratorio."
      pt: "Um cachorro vacinado, vindo de uma área livre de doenças, é processado mais rápido (cerca de um dia útil) do que um não vacinado, o que aciona exames laboratoriais."
    - en: "Where a rabies outbreak zone is declared, moving dogs in or out is suspended entirely — check the situation at your departure province before booking."
      fr: "Là où une zone d'épizootie rabique est déclarée, tout mouvement de chiens y est suspendu dans les deux sens — vérifie la situation de ta province de départ avant de réserver."
      es: "Donde se declara una zona de brote de rabia, el movimiento de perros queda suspendido en ambos sentidos — comprueba la situación de tu provincia de salida antes de reservar."
      pt: "Onde uma zona de surto de raiva é declarada, o deslocamento de cachorros para dentro ou para fora é totalmente suspenso — verifique a situação na sua província de partida antes de reservar."
exit:
  authority: DAH
  authorityUrl: https://cucthuy.gov.vn/en
  intro:
    en: "Vietnam is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export quarantine certificate from the Department of Animal Health (DAH)."
    fr: "Le Vietnam est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat de quarantaine d'export du Département de la santé animale (DAH)."
    es: "Vietnam no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado de cuarentena de exportación del Departamento de Salud Animal (DAH)."
    pt: "O Vietnã não é um país listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um certificado de quarentena de exportação do Department of Animal Health (DAH)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "The DAH, through its regional sub-departments and border quarantine stations, inspects the dog and issues the export health certificate before departure."
        fr: "Le DAH, via ses sous-directions régionales et postes de quarantaine frontaliers, inspecte le chien et délivre le certificat sanitaire d'export avant le départ."
        es: "El DAH, a través de sus subdepartamentos regionales y estaciones de cuarentena fronteriza, inspecciona al perro y emite el certificado sanitario de exportación antes de salir."
        pt: "O DAH, por meio de suas subdivisões regionais e postos de quarentena de fronteira, inspeciona o cachorro e emite o atestado de saúde de exportação antes da partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Vietnam with your dog", fr: "Voyager au Vietnam avec ton chien", es: "Viajar a Vietnam con tu perro", pt: "Viajar para o Vietnã com seu cachorro" }
  intro:
    en: >-
      Vietnam welcomes dogs, but it applies its own national scheme through the Department of Animal
      Health (Cục Thú y) — not the EU framework. What you need depends mainly on the country your dog
      is travelling from. In every case your dog needs a valid rabies vaccination and an international
      veterinary health certificate from the exporting country's official authority, and you must
      register the import for quarantine with the Department of Animal Health before you leave. A
      microchip is not compulsory under Vietnamese law but is strongly recommended and often required
      by airlines. Every dog is inspected by the border animal quarantine service on arrival at a
      designated international airport. This guide explains what to prepare so your dog can clear
      quarantine smoothly.
    fr: >-
      Le Vietnam accueille les chiens, mais applique son propre régime national via le Département de
      la santé animale (Cục Thú y) — pas le cadre européen. Ce qu'il faut préparer dépend surtout du
      pays d'où ton chien voyage. Dans tous les cas, ton chien a besoin d'une vaccination
      antirabique valide et d'un certificat vétérinaire international délivré par l'autorité officielle
      du pays d'export, et tu dois enregistrer l'import pour la quarantaine auprès du Département de
      la santé animale avant de partir. La puce n'est pas obligatoire selon la loi vietnamienne mais
      est fortement recommandée et souvent exigée par les compagnies aériennes. Chaque chien est
      inspecté par le service de quarantaine animale à l'arrivée dans un aéroport international désigné.
      Ce guide détaille quoi préparer pour que ton chien passe la quarantaine sans encombre.
    es: >-
      Vietnam acoge a los perros, pero aplica su propio régimen nacional a través del Departamento de
      Sanidad Animal (Cục Thú y) — no el marco europeo. Lo que necesitas depende sobre todo del país
      desde el que viaja tu perro. En todos los casos, tu perro necesita una vacunación antirrábica
      válida y un certificado veterinario internacional de la autoridad oficial del país exportador, y
      debes registrar la importación para la cuarentena ante el Departamento de Sanidad Animal antes de
      salir. El microchip no es obligatorio según la ley vietnamita, pero se recomienda encarecidamente
      y a menudo lo exigen las aerolíneas. Cada perro es inspeccionado por el servicio de cuarentena
      animal en la frontera a su llegada a un aeropuerto internacional designado. Esta guía explica qué
      preparar para que tu perro supere la cuarentena sin problemas.

    pt: "O Vietnã recebe cachorros, mas aplica o próprio sistema nacional por meio do Department of Animal Health (Cục Thú y) — e não o regime da UE. O que você precisa depende principalmente do país de onde o seu cachorro está viajando. Em todos os casos, o seu cachorro precisa de uma vacinação antirrábica válida e de um atestado de saúde veterinário internacional da autoridade oficial do país exportador, e você precisa registrar a importação para quarentena junto ao Department of Animal Health antes de partir. O microchip não é obrigatório pela lei vietnamita, mas é fortemente recomendado e muitas vezes exigido pelas companhias aéreas. Todo cachorro é inspecionado pelo serviço de quarentena animal de fronteira na chegada a um aeroporto internacional designado. Este guia explica o que preparar para que o seu cachorro passe pela quarentena sem contratempos."
difficulty:
  level: moderate
  label: { en: "Moderate — advance registration and quarantine inspection", fr: "Modéré — enregistrement préalable et inspection en quarantaine", es: "Moderado — registro previo e inspección en cuarentena", pt: "Moderado — registro prévio e inspeção de quarentena" }

prepTime:
  eu:
    en: "Standard path from a disease-free origin: ~4–6 weeks — rabies shot at least 30 days before entry, health certificate 7–10 days before departure, DAH quarantine approval within 5 working days."
    fr: "Parcours standard depuis une origine indemne : ~4–6 semaines — vaccin antirabique au moins 30 jours avant l'entrée, certificat sanitaire 7–10 jours avant le départ, accord de quarantaine de la DAH sous 5 jours ouvrés."
    es: "Camino estándar desde un origen libre de enfermedad: ~4–6 semanas — vacuna antirrábica al menos 30 días antes de la entrada, certificado sanitario 7–10 días antes de la salida, aprobación de cuarentena de la DAH en un plazo de 5 días hábiles."
    pt: "Caminho padrão de uma origem livre de doenças: cerca de 4 a 6 semanas — vacina antirrábica pelo menos 30 dias antes da entrada, atestado de saúde de 7 a 10 dias antes da partida, aprovação da quarentena do DAH em até 5 dias úteis."
  listed:
    en: "Higher-risk origin: add on-arrival quarantine that can last up to 45 days depending on the disease risk and any sampling or testing required."
    fr: "Origine à risque plus élevé : ajoute une quarantaine à l'arrivée pouvant durer jusqu'à 45 jours selon le risque sanitaire et les prélèvements ou tests éventuels."
    es: "Origen de mayor riesgo: añade una cuarentena a la llegada que puede durar hasta 45 días según el riesgo sanitario y las muestras o pruebas necesarias."
    pt: "Origem de maior risco: acrescente a quarentena na chegada, que pode durar até 45 dias, dependendo do risco de doença e de qualquer coleta de amostra ou exame exigido."
  nonListed:
    en: "Prohibited origin: a dog from a country affected by Vietnam's notifiable diseases cannot be imported at all — no timeline applies."
    fr: "Origine interdite : un chien venant d'un pays touché par les maladies à déclaration obligatoire du Vietnam ne peut pas être importé — aucun délai ne s'applique."
    es: "Origen prohibido: un perro de un país afectado por las enfermedades de declaración obligatoria de Vietnam no puede importarse en absoluto — no se aplica ningún plazo."
    pt: "Origem proibida: um cachorro vindo de um país afetado pelas doenças de notificação obrigatória do Vietnã não pode ser importado de forma alguma — nenhum prazo se aplica."

