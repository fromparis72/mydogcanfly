notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian and the Department of Animal Health (Cục Thú y) can confirm the exact procedure for your individual dog."
    fr: "Seuls un vétérinaire et le Département de la santé animale (Cục Thú y) peuvent confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario y el Departamento de Sanidad Animal (Cục Thú y) pueden confirmar el procedimiento exacto para tu perro."
    pt: "Somente um veterinário e o Department of Animal Health (Cục Thú y) podem confirmar o procedimento exato para o seu cachorro."
  - en: "Register the import for quarantine with the Department of Animal Health before departure — approval normally takes up to 5 working days."
    fr: "Enregistre l'import pour la quarantaine auprès du Département de la santé animale avant le départ — l'accord prend normalement jusqu'à 5 jours ouvrés."
    es: "Registra la importación para la cuarentena ante el Departamento de Sanidad Animal antes de la salida — la aprobación normalmente tarda hasta 5 días hábiles."
    pt: "Registre a importação para quarentena junto ao Department of Animal Health antes da partida — a aprovação normalmente leva até 5 dias úteis."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact steps depend on three things — Vietnam (your destination) is only the first."
    fr: "Les étapes exactes dépendent de trois éléments — le Vietnam (ta destination) n'est que le premier."
    es: "Los pasos exactos dependen de tres factores — Vietnam (tu destino) es solo el primero."
    pt: "As etapas exatas dependem de três fatores — o Vietnã (seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Vietnam", fr: "Pays de destination — Vietnam", es: "País de destino — Vietnam", pt: "País de destino — Vietnã" }
      text:
        en: "Vietnam runs its own scheme through the Department of Animal Health: a valid rabies vaccination, an international veterinary health certificate, advance quarantine registration and inspection on arrival. A microchip is recommended but not compulsory, and no EU pet passport is used."
        fr: "Le Vietnam applique son propre régime via le Département de la santé animale : vaccination antirabique valide, certificat vétérinaire international, enregistrement préalable en quarantaine et inspection à l'arrivée. La puce est recommandée mais non obligatoire, et aucun passeport européen n'est utilisé."
        es: "Vietnam aplica su propio régimen a través del Departamento de Sanidad Animal: una vacunación antirrábica válida, un certificado veterinario internacional, un registro previo de cuarentena e inspección a la llegada. El microchip se recomienda, pero no es obligatorio, y no se utiliza ningún pasaporte europeo para mascotas."
        pt: "O Vietnã aplica o próprio sistema por meio do Department of Animal Health: uma vacinação antirrábica válida, um atestado de saúde veterinário internacional, registro de quarentena prévio e inspeção na chegada. Um microchip é recomendado, mas não obrigatório, e nenhum passaporte europeu para animais de estimação é utilizado."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The disease status of the departure country decides whether import is allowed at all: dogs from countries affected by Vietnam's notifiable diseases are prohibited. A higher-risk origin can also mean a longer on-arrival quarantine."
        fr: "Le statut sanitaire du pays de départ détermine si l'import est autorisé : les chiens venant de pays touchés par les maladies à déclaration obligatoire du Vietnam sont interdits. Une origine à risque plus élevé peut aussi entraîner une quarantaine plus longue à l'arrivée."
        es: "El estatus sanitario del país de salida determina si la importación está permitida siquiera: los perros procedentes de países afectados por las enfermedades de declaración obligatoria de Vietnam están prohibidos. Un origen de mayor riesgo también puede implicar una cuarentena más larga a la llegada."
        pt: "A situação sanitária do país de partida determina se a importação é sequer permitida: cachorros vindos de países afetados pelas doenças de notificação obrigatória do Vietnã são proibidos. Uma origem de maior risco também pode significar uma quarentena mais longa na chegada."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay in a higher-risk country can affect the quarantine decision or trigger sampling and testing on arrival, even if you fly in from elsewhere. It is your dog's real origin and history that count."
        fr: "Un séjour récent dans un pays à risque plus élevé peut influer sur la décision de quarantaine ou déclencher prélèvements et tests à l'arrivée, même si tu arrives d'ailleurs. C'est l'origine réelle et l'historique du chien qui comptent."
        es: "Una estancia reciente en un país de mayor riesgo puede afectar a la decisión de cuarentena o provocar la toma de muestras y pruebas a la llegada, aunque llegues desde otro lugar. Lo que cuenta es el origen y el historial reales de tu perro."
        pt: "Uma estadia recente em um país de maior risco pode afetar a decisão sobre a quarentena ou acionar coleta de amostras e exames na chegada, mesmo que você chegue voando de outro lugar. O que conta é a origem real e o histórico do seu cachorro."
  note:
    en: "So read the requirements below as Vietnam's framework, then confirm your dog's exact origin and history with your vet and the Department of Animal Health."
    fr: "Lis donc les exigences ci-dessous comme le cadre vietnamien, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire et le Département de la santé animale."
    es: "Así que lee los requisitos siguientes como el marco de Vietnam y luego confirma el origen y el historial exactos de tu perro con tu veterinario y el Departamento de Sanidad Animal."
    pt: "Portanto, leia as exigências abaixo como o regime do Vietnã e depois confirme a origem exata e o histórico do seu cachorro com o seu veterinário e o Department of Animal Health."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Recommended", fr: "Recommandée", es: "Recomendado", pt: "Recomendado" }
    when: { en: "ISO 11784/11785 (15-digit); the microchip number must match the rabies and health certificates.", fr: "ISO 11784/11785 (15 chiffres) ; le numéro de puce doit correspondre aux certificats de rage et sanitaire.", es: "ISO 11784/11785 (15 dígitos); el número de microchip debe coincidir con los certificados de rabia y sanitario.", pt: "ISO 11784/11785 (15 dígitos); o número do microchip deve coincidir com os atestados antirrábico e de saúde." }
    exceptions: { en: "Not mandatory under Vietnamese law, but many airlines and exporting countries require it and it links the dog to its documents.", fr: "Non obligatoire selon la loi vietnamienne, mais exigée par de nombreuses compagnies et pays d'export ; elle relie le chien à ses documents.", es: "No es obligatorio según la ley vietnamita, pero muchas aerolíneas y países exportadores lo exigen y vincula al perro con sus documentos.", pt: "Não obrigatório pela lei vietnamita, mas muitas companhias aéreas e países exportadores o exigem, e ele vincula o cachorro aos seus documentos." }
    ref: { en: "Circular 25/2016/TT-BNNPTNT; Vietnam DAH", fr: "Circulaire 25/2016/TT-BNNPTNT ; DAH Vietnam", es: "Circular 25/2016/TT-BNNPTNT; DAH de Vietnam", pt: "Circular 25/2016/TT-BNNPTNT; DAH do Vietnã" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Administered at least 30 days and no more than 12 months before entry; certificate stating date, vaccine type, batch number and validity period.", fr: "Administrée au moins 30 jours et au plus 12 mois avant l'entrée ; certificat indiquant date, type de vaccin, numéro de lot et période de validité.", es: "Administrada al menos 30 días y no más de 12 meses antes de la entrada; certificado que indique la fecha, el tipo de vacuna, el número de lote y el periodo de valide.", pt: "Aplicada pelo menos 30 dias e no máximo 12 meses antes da entrada; certificado indicando a data, o tipo de vacina, o número do lote e o período de validade." }
    exceptions: { en: "A dog vaccinated less than 30 days before entry does not meet the requirement.", fr: "Un chien vacciné moins de 30 jours avant l'entrée ne satisfait pas l'exigence.", es: "Un perro vacunado menos de 30 días antes de la entrada no cumple el requisito.", pt: "Um cachorro vacinado há menos de 30 dias da entrada não cumpre a exigência." }
    ref: { en: "Vietnam DAH; USDA APHIS — Vietnam certificate", fr: "DAH Vietnam ; USDA APHIS — certificat Vietnam", es: "DAH de Vietnam; USDA APHIS — certificado de Vietnam", pt: "DAH do Vietnã; USDA APHIS — atestado para o Vietnã" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not required", fr: "Non requis", es: "No obligatoria", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "No rabies antibody test is published in Vietnam's import scheme for dogs.", fr: "Aucun titrage antirabique n'est publié dans le régime d'importation vietnamien pour les chiens.", es: "No se publica ninguna prueba de titulación de rabia en el régimen de importación de Vietnam para perros.", pt: "Nenhum teste sorológico antirrábico é publicado no regime de importação de cachorros do Vietnã." }
    ref: { en: "Vietnam DAH; Circular 25/2016/TT-BNNPTNT", fr: "DAH Vietnam ; Circulaire 25/2016/TT-BNNPTNT", es: "DAH de Vietnam; Circular 25/2016/TT-BNNPTNT", pt: "DAH do Vietnã; Circular 25/2016/TT-BNNPTNT" }
  - item: { en: "International veterinary health certificate", fr: "Certificat vétérinaire international", es: "Certificado veterinario internacional", pt: "Atestado de saúde veterinário internacional" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Issued by the competent veterinary authority of the exporting country certifying the dog is healthy and fit to export; typically valid 7–10 days before departure.", fr: "Délivré par l'autorité vétérinaire compétente du pays d'export attestant que le chien est en bonne santé et apte à l'export ; généralement valable 7–10 jours avant le départ.", es: "Expedido por la autoridad veterinaria competente del país exportador que certifique que el perro está sano y apto para la exportación; normalmente válido 7–10 días antes de la salida.", pt: "Emitido pela autoridade veterinária competente do país exportador, atestando que o cachorro está saudável e apto para exportação; normalmente válido de 7 a 10 dias antes da partida." }
    exceptions: { en: "Documents must be translated into English or Vietnamese for the Vietnamese authorities.", fr: "Les documents doivent être traduits en anglais ou en vietnamien pour les autorités vietnamiennes.", es: "Los documentos deben traducirse al inglés o al vietnamita para las autoridades vietnamitas.", pt: "Os documentos devem ser traduzidos para inglês ou vietnamita para as autoridades vietnamitas." }
    ref: { en: "Circular 25/2016/TT-BNNPTNT; USDA APHIS — Vietnam certificate", fr: "Circulaire 25/2016/TT-BNNPTNT ; USDA APHIS — certificat Vietnam", es: "Circular 25/2016/TT-BNNPTNT; USDA APHIS — certificado de Vietnam", pt: "Circular 25/2016/TT-BNNPTNT; USDA APHIS — atestado para o Vietnã" }
  - item: { en: "Advance quarantine registration (DAH)", fr: "Enregistrement préalable en quarantaine (DAH)", es: "Registro previo de cuarentena (DAH)", pt: "Registro de quarentena prévio (DAH)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Before departure, submit a quarantine registration dossier (Form 19, Appendix V of Circular 25) to the Department of Animal Health via the National Single Window portal or by post; approval within 5 working days.", fr: "Avant le départ, dépose un dossier d'enregistrement de quarantaine (formulaire 19, annexe V de la circulaire 25) auprès du Département de la santé animale via le portail Guichet unique national ou par courrier ; accord sous 5 jours ouvrés.", es: "Antes de la salida, presenta un expediente de registro de cuarentena (formulario 19, anexo V de la Circular 25) ante el Departamento de Sanidad Animal a través del portal de Ventanilla Única Nacional o por correo postal; aprobación en un plazo de 5 días hábiles.", pt: "Antes da partida, apresente um processo de registro de quarentena (Formulário 19, Anexo V da Circular 25) ao Department of Animal Health pelo portal National Single Window ou pelo correio; aprovação em até 5 dias úteis." }
    exceptions: { en: "The approval is sent to the applicant and to the quarantine authority at the port of entry.", fr: "L'accord est envoyé au demandeur et à l'autorité de quarantaine du point d'entrée.", es: "La aprobación se envía al solicitante y a la autoridad de cuarentena del punto de entrada.", pt: "A aprovação é enviada ao solicitante e à autoridade de quarentena no ponto de entrada." }
    ref: { en: "Circular 25/2016/TT-BNNPTNT, Form 19", fr: "Circulaire 25/2016/TT-BNNPTNT, formulaire 19", es: "Circular 25/2016/TT-BNNPTNT, formulario 19", pt: "Circular 25/2016/TT-BNNPTNT, Formulário 19" }
  - item: { en: "Import permit", fr: "Permis d'importation", es: "Permiso de importación", pt: "Autorização de importação" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "A foreign national may bring up to two pets without an import permit; a permit is required to import more than two.", fr: "Un ressortissant étranger peut amener jusqu'à deux animaux sans permis d'import ; un permis est requis au-delà de deux.", es: "Un ciudadano extranjero puede traer hasta dos mascotas sin permiso de importación; se requiere un permiso para importar más de dos.", pt: "Um estrangeiro pode trazer até dois animais de estimação sem autorização de importação; uma autorização é exigida para importar mais de dois." }
    exceptions: { en: "The two-pet allowance is per person and only for household pets not on the prohibited list.", fr: "La franchise de deux animaux est par personne et uniquement pour des animaux de compagnie non inscrits sur la liste des interdictions.", es: "La franquicia de dos mascotas es por persona y solo para animales de compañía que no figuren en la lista de prohibiciones.", pt: "O limite de dois animais de estimação é por pessoa e vale apenas para animais domésticos que não estejam na lista de proibidos." }
    ref: { en: "Circular 25/2016/TT-BNNPTNT, Article 10", fr: "Circulaire 25/2016/TT-BNNPTNT, article 10", es: "Circular 25/2016/TT-BNNPTNT, artículo 10", pt: "Circular 25/2016/TT-BNNPTNT, artigo 10" }
  - item: { en: "Designated port of entry", fr: "Point d'entrée désigné", es: "Punto de entrada designado", pt: "Porto de entrada designado" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Enter via an international airport with a border animal quarantine station (Nội Bài/Hanoi, Tân Sơn Nhất/Ho Chi Minh City, Đà Nẵng).", fr: "Entre par un aéroport international doté d'une station de quarantaine animale frontalière (Nội Bài/Hanoï, Tân Sơn Nhất/Hô Chi Minh-Ville, Đà Nẵng).", es: "Entra por un aeropuerto internacional con una estación fronteriza de cuarentena animal (Nội Bài/Hanói, Tân Sơn Nhất/Ciudad Ho Chi Minh, Đà Nẵng).", pt: "Entre por um aeroporto internacional com posto de quarentena animal de fronteira (Nội Bài/Hanói, Tân Sơn Nhất/Cidade de Ho Chi Minh, Đà Nẵng)." }
    exceptions: { en: "Notify the quarantine station of your arrival in advance to avoid delays outside office hours.", fr: "Préviens la station de quarantaine de ton arrivée à l'avance pour éviter les retards hors heures ouvrables.", es: "Avisa a la estación de cuarentena de tu llegada con antelación para evitar retrasos fuera del horario de oficina.", pt: "Avise o posto de quarentena da sua chegada com antecedência para evitar atrasos fora do horário de expediente." }
    ref: { en: "Vietnam DAH; Vietnam Customs", fr: "DAH Vietnam ; Douane vietnamienne", es: "DAH de Vietnam; Aduanas de Vietnam", pt: "DAH do Vietnã; Alfândega do Vietnã" }
  - item: { en: "Quarantine inspection on arrival", fr: "Inspection en quarantaine à l'arrivée", es: "Inspección de cuarentena a la llegada", pt: "Inspeção de quarentena na chegada" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "The border quarantine officer verifies identity and documents and carries out a clinical health check; supervision may last up to 45 days depending on disease risk and testing.", fr: "L'agent de quarantaine frontalier vérifie l'identité et les documents et réalise un examen clinique ; la surveillance peut durer jusqu'à 45 jours selon le risque sanitaire et les tests.", es: "El agente de cuarentena fronterizo verifica la identidad y los documentos y realiza un examen clínico de salud; la supervisión puede durar hasta 45 días según el riesgo sanitario y las pruebas.", pt: "O agente de quarentena de fronteira verifica a identidade e os documentos e realiza um exame clínico de saúde; a supervisão pode durar até 45 dias, dependendo do risco de doença e dos exames." }
    exceptions: { en: "If the dossier is valid and the dog is healthy, a veterinary certificate is issued and the pet is released.", fr: "Si le dossier est valide et le chien en bonne santé, un certificat vétérinaire est délivré et l'animal est libéré.", es: "Si el expediente es válido y el perro está sano, se expide un certificado veterinario y se libera a la mascota.", pt: "Se o processo estiver válido e o cachorro estiver saudável, um certificado veterinário é emitido e o animal é liberado." }
    ref: { en: "Circular 25/2016/TT-BNNPTNT; Vietnam DAH", fr: "Circulaire 25/2016/TT-BNNPTNT ; DAH Vietnam", es: "Circular 25/2016/TT-BNNPTNT; DAH de Vietnam", pt: "Circular 25/2016/TT-BNNPTNT; DAH do Vietnã" }
  - item: { en: "Prohibited origins", fr: "Origines interdites", es: "Orígenes prohibidos", pt: "Origens proibidas" }
    required: { en: "Blocking", fr: "Bloquant", es: "Bloqueante", pt: "Bloqueio" }
    when: { en: "Animals from countries or territories affected by Vietnam's notifiable diseases, or by zoonotic or emerging disease agents, are prohibited from import.", fr: "Les animaux venant de pays ou territoires touchés par les maladies à déclaration obligatoire du Vietnam, ou par des agents zoonotiques ou émergents, sont interdits d'import.", es: "Los animales procedentes de países o territorios afectados por las enfermedades de declaración obligatoria de Vietnam, o por agentes patógenos zoonóticos o emergentes, tienen prohibida la importación.", pt: "Animais vindos de países ou territórios afetados pelas doenças de notificação obrigatória do Vietnã, ou por agentes de doenças zoonóticas ou emergentes, têm a importação proibida." }
    exceptions: { en: "—", fr: "—", es: "—", pt: "—" }
    ref: { en: "Decree 35/2016/ND-CP, Article 9.2", fr: "Décret 35/2016/ND-CP, article 9.2", es: "Decreto 35/2016/ND-CP, artículo 9.2", pt: "Decreto 35/2016/ND-CP, artigo 9.2" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "Old enough to be vaccinated", fr: "En âge d'être vacciné", es: "Con edad suficiente para ser vacunado", pt: "Idade suficiente para ser vacinado" }
    when: { en: "The rabies vaccination must be given at least 30 days before entry, so the puppy must be old enough to have completed a valid rabies vaccination.", fr: "La vaccination antirabique doit être faite au moins 30 jours avant l'entrée ; le chiot doit donc être en âge d'avoir une vaccination antirabique valide.", es: "La vacunación antirrábica debe administrarse al menos 30 días antes de la entrada, por lo que el cachorro debe tener edad suficiente para haber completado una vacunación antirrábica válida.", pt: "A vacinação antirrábica deve ser aplicada pelo menos 30 dias antes da entrada, portanto o filhote deve ter idade suficiente para ter completado uma vacinação antirrábica válida." }
    exceptions: { en: "Vietnam does not publish a separate fixed minimum age; the rabies-vaccine timing governs in practice.", fr: "Le Vietnam ne publie pas d'âge minimum fixe distinct ; le calendrier du vaccin antirabique prévaut en pratique.", es: "Vietnam no publica una edad mínima fija aparte; en la práctica prevalece el calendario de la vacuna antirrábica.", pt: "O Vietnã não publica uma idade mínima fixa separada; na prática, o prazo da vacina antirrábica é o que rege." }
    ref: { en: "Vietnam DAH; Circular 25/2016/TT-BNNPTNT", fr: "DAH Vietnam ; Circulaire 25/2016/TT-BNNPTNT", es: "DAH de Vietnam; Circular 25/2016/TT-BNNPTNT", pt: "DAH do Vietnã; Circular 25/2016/TT-BNNPTNT" }

origin:
  scheme: own
  eu:
    title: { en: "Standard path — compliant import", fr: "Parcours standard — import conforme", es: "Camino estándar — importación conforme", pt: "Caminho padrão — importação em conformidade" }
    body:
      en: "From a disease-free origin the process is straightforward: a valid rabies vaccination (given at least 30 days and no more than 12 months before entry), an international veterinary health certificate from the exporting country's official authority, and advance quarantine registration with the Department of Animal Health. A microchip is recommended. On arrival the dog is inspected by the border quarantine service and, if healthy with a valid dossier, is cleared."
      fr: "Depuis une origine indemne, la procédure est simple : une vaccination antirabique valide (faite au moins 30 jours et au plus 12 mois avant l'entrée), un certificat vétérinaire international de l'autorité officielle du pays d'export, et un enregistrement préalable en quarantaine auprès du Département de la santé animale. Une puce est recommandée. À l'arrivée, le chien est inspecté par le service de quarantaine frontalier et, s'il est sain avec un dossier valide, il est libéré."
      es: "Desde un origen libre de enfermedad, el proceso es sencillo: una vacunación antirrábica válida (administrada al menos 30 días y no más de 12 meses antes de la entrada), un certificado veterinario internacional de la autoridad oficial del país exportador y un registro previo de cuarentena ante el Departamento de Sanidad Animal. Se recomienda un microchip. A la llegada, el perro es inspeccionado por el servicio de cuarentena fronterizo y, si está sano y con un expediente válido, queda liberado."
      pt: "De uma origem livre de doenças, o processo é simples: uma vacinação antirrábica válida (aplicada pelo menos 30 dias e no máximo 12 meses antes da entrada), um atestado de saúde veterinário internacional da autoridade oficial do país exportador, e registro de quarentena prévio junto ao Department of Animal Health. Um microchip é recomendado. Na chegada, o cachorro é inspecionado pelo serviço de quarentena de fronteira e, se estiver saudável e com o processo válido, é liberado."
    cls: ok
  listed:
    title: { en: "Higher-risk origin — extended quarantine", fr: "Origine à risque — quarantaine prolongée", es: "Origen de mayor riesgo — cuarentena prolongada", pt: "Origem de maior risco — quarentena estendida" }
    body:
      en: "From an origin with a higher disease risk, the same documents are required but the on-arrival quarantine can be longer — supervision may last up to 45 days, and the quarantine service may take samples or run tests before issuing the veterinary certificate. Register early and confirm the expected quarantine duration with the Department of Animal Health."
      fr: "Depuis une origine à risque sanitaire plus élevé, les mêmes documents sont exigés mais la quarantaine à l'arrivée peut être plus longue — la surveillance peut durer jusqu'à 45 jours, et le service de quarantaine peut effectuer des prélèvements ou des tests avant de délivrer le certificat vétérinaire. Enregistre tôt et confirme la durée prévue de quarantaine auprès du Département de la santé animale."
      es: "Desde un origen con mayor riesgo sanitario, se exigen los mismos documentos, pero la cuarentena a la llegada puede ser más larga — la supervisión puede durar hasta 45 días, y el servicio de cuarentena puede tomar muestras o realizar pruebas antes de expedir el certificado veterinario. Regístrate pronto y confirma la duración prevista de la cuarentena con el Departamento de Sanidad Animal."
      pt: "De uma origem com maior risco de doença, os mesmos documentos são exigidos, mas a quarentena na chegada pode ser mais longa — a supervisão pode durar até 45 dias, e o serviço de quarentena pode coletar amostras ou realizar exames antes de emitir o certificado veterinário. Registre-se com antecedência e confirme a duração prevista da quarentena com o Department of Animal Health."
    cls: warn
  nonListed:
    title: { en: "Prohibited origin — import refused", fr: "Origine interdite — import refusé", es: "Origen prohibido — importación denegada", pt: "Origem proibida — importação recusada" }
    body:
      en: "A dog coming from a country or territory affected by one of Vietnam's notifiable animal diseases, or by a zoonotic or emerging disease agent that could spread to Vietnamese livestock or endanger public health, is prohibited from import under Decree 35/2016/ND-CP. In that case the dog cannot enter, whatever the documents. Confirm your dog's origin against Vietnam's current disease list before travelling."
      fr: "Un chien venant d'un pays ou territoire touché par une des maladies animales à déclaration obligatoire du Vietnam, ou par un agent zoonotique ou émergent susceptible de se propager au cheptel vietnamien ou de menacer la santé publique, est interdit d'import selon le décret 35/2016/ND-CP. Dans ce cas, le chien ne peut pas entrer, quels que soient les documents. Vérifie l'origine de ton chien au regard de la liste des maladies en vigueur au Vietnam avant de voyager."
      es: "Un perro procedente de un país o territorio afectado por una de las enfermedades animales de declaración obligatoria de Vietnam, o por un agente patógeno zoonótico o emergente que pudiera propagarse a la ganadería vietnamita o poner en peligro la salud pública, tiene prohibida la importación en virtud del Decreto 35/2016/ND-CP. En ese caso, el perro no puede entrar, sean cuales sean los documentos. Confirma el origen de tu perro con la lista de enfermedades vigente de Vietnam antes de viajar."
      pt: "Um cachorro vindo de um país ou território afetado por uma das doenças animais de notificação obrigatória do Vietnã, ou por um agente de doença zoonótica ou emergente que possa se espalhar para o rebanho vietnamita ou colocar em risco a saúde pública, tem a importação proibida pelo Decreto 35/2016/ND-CP. Nesse caso, o cachorro não pode entrar, independentemente dos documentos. Confirme a origem do seu cachorro em relação à lista de doenças atual do Vietnã antes de viajar."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Vietnam depends on your dossier and on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien au Vietnam dépend de ton dossier et de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Vietnam depende de tu expediente y del lugar desde el que hayas volado."
    pt: "O que acontece quando o seu cachorro chega ao Vietnã depende do seu processo e de onde você voou."
  points:
    - en: "Enter only through an international airport with a border animal quarantine station (Nội Bài/Hanoi, Tân Sơn Nhất/Ho Chi Minh City, Đà Nẵng)."
      fr: "Entre uniquement par un aéroport international doté d'une station de quarantaine animale (Nội Bài/Hanoï, Tân Sơn Nhất/Hô Chi Minh-Ville, Đà Nẵng)."
      es: "Entra únicamente por un aeropuerto internacional con una estación fronteriza de cuarentena animal (Nội Bài/Hanói, Tân Sơn Nhất/Ciudad Ho Chi Minh, Đà Nẵng)."
      pt: "Entre somente por um aeroporto internacional com posto de quarentena animal de fronteira (Nội Bài/Hanói, Tân Sơn Nhất/Cidade de Ho Chi Minh, Đà Nẵng)."
    - en: "After immigration, collect your dog from the special baggage area and report to the border animal quarantine authority at the airport."
      fr: "Après l'immigration, récupère ton chien à la zone des bagages spéciaux et présente-toi à l'autorité de quarantaine animale de l'aéroport."
      es: "Tras el control de inmigración, recoge a tu perro en la zona de equipaje especial y preséntate ante la autoridad fronteriza de cuarentena animal del aeropuerto."
      pt: "Depois da imigração, retire o seu cachorro na área de bagagem especial e apresente-se à autoridade de quarentena animal de fronteira no aeroporto."
    - en: "The officer verifies identity (including microchip if present), examines the quarantine dossier and carries out a clinical health check."
      fr: "L'agent vérifie l'identité (y compris la puce si présente), examine le dossier de quarantaine et réalise un examen clinique."
      es: "El agente verifica la identidad (incluido el microchip si lo hay), examina el expediente de cuarentena y realiza un examen clínico de salud."
      pt: "O agente verifica a identidade (incluindo o microchip, se houver), examina o processo de quarentena e realiza um exame clínico de saúde."
    - en: "If the dossier is valid and the dog is healthy, a veterinary certificate is issued and the dog is released; supervision may last up to 45 days depending on disease risk and testing."
      fr: "Si le dossier est valide et le chien sain, un certificat vétérinaire est délivré et le chien est libéré ; la surveillance peut durer jusqu'à 45 jours selon le risque sanitaire et les tests."
      es: "Si el expediente es válido y el perro está sano, se expide un certificado veterinario y se libera al perro; la supervisión puede durar hasta 45 días según el riesgo sanitario y las pruebas."
      pt: "Se o processo estiver válido e o cachorro estiver saudável, um certificado veterinário é emitido e o cachorro é liberado; a supervisão pode durar até 45 dias, dependendo do risco de doença e dos exames."
    - en: "Carry original documents translated into English or Vietnamese, and pay any quarantine fees due."
      fr: "Munis-toi des documents originaux traduits en anglais ou en vietnamien, et réglez les frais de quarantaine dus."
      es: "Lleva los documentos originales traducidos al inglés o al vietnamita, y paga las tasas de cuarentena que correspondan."
      pt: "Leve os documentos originais traduzidos para inglês ou vietnamita, e pague as taxas de quarentena devidas."
    - en: "A dog from a prohibited origin, or one that shows signs of infectious disease or lacks a valid dossier, may be refused entry, held for testing, returned or subjected to further quarantine."
      fr: "Un chien d'origine interdite, ou présentant des signes de maladie infectieuse ou sans dossier valide, peut être refusé, retenu pour tests, renvoyé ou soumis à une quarantaine supplémentaire."
      es: "Un perro de un origen prohibido, o que muestre signos de enfermedad infecciosa o carezca de un expediente válido, puede ser rechazado a la entrada, retenido para pruebas, devuelto o sometido a una cuarentena adicional."
      pt: "Um cachorro vindo de uma origem proibida, ou que apresente sinais de doença infecciosa ou não tenha um processo válido, pode ter a entrada recusada, ser retido para exames, devolvido ou submetido a quarentena adicional."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Vietnam has no national breed-specific import ban: entry requirements are the same for every breed, provided the dog is not from a prohibited (disease-affected) origin. Import restrictions are based on the origin country's disease status, not on the breed."
    fr: "Le Vietnam n'a aucune interdiction d'importation nationale liée à la race : les exigences d'entrée sont identiques pour toutes les races, à condition que le chien ne vienne pas d'une origine interdite (touchée par une maladie). Les restrictions d'import reposent sur le statut sanitaire du pays d'origine, pas sur la race."
    es: "Vietnam no tiene ninguna prohibición de importación nacional por raza: los requisitos de entrada son los mismos para todas las razas, siempre que el perro no proceda de un origen prohibido (afectado por una enfermedad). Las restricciones de importación se basan en el estatus sanitario del país de origen, no en la raza."
    pt: "O Vietnã não tem proibição nacional de importação específica por raça: as exigências de entrada são as mesmas para qualquer raça, desde que o cachorro não venha de uma origem proibida (afetada por doença). As restrições de importação se baseiam na situação sanitária do país de origem, não na raça."
  cat1:
    en: "There is no national list of banned or 'dangerous' breeds at import. Breeds restricted in some other countries (pit-bull types, Tosa, Rottweiler, etc.) are not prohibited from entering Vietnam on the basis of breed."
    fr: "Il n'existe aucune liste nationale de races interdites ou « dangereuses » à l'importation. Les races restreintes dans certains autres pays (types pit-bull, Tosa, Rottweiler, etc.) ne sont pas interdites d'entrée au Vietnam en raison de la race."
    es: "No existe ninguna lista nacional de razas prohibidas o «peligrosas» en la importación. Las razas restringidas en algunos otros países (tipos pit bull, Tosa, Rottweiler, etc.) no tienen prohibida la entrada en Vietnam por motivo de raza."
    pt: "Não existe uma lista nacional de raças proibidas ou 'perigosas' na importação. Raças restritas em alguns outros países (tipos pit bull, Tosa, Rottweiler etc.) não são proibidas de entrar no Vietnã com base na raça."
  cat2:
    en: "What is restricted is origin, not breed: under Decree 35/2016/ND-CP, animals from countries affected by Vietnam's notifiable diseases or by zoonotic/emerging agents are prohibited. There is no additional keeping permit tied to the dog's breed at national level."
    fr: "Ce qui est restreint, c'est l'origine, pas la race : selon le décret 35/2016/ND-CP, les animaux venant de pays touchés par les maladies à déclaration obligatoire du Vietnam ou par des agents zoonotiques/émergents sont interdits. Il n'existe pas de permis de détention supplémentaire lié à la race au niveau national."
    es: "Lo que se restringe es el origen, no la raza: en virtud del Decreto 35/2016/ND-CP, están prohibidos los animales procedentes de países afectados por las enfermedades de declaración obligatoria de Vietnam o por agentes zoonóticos/emergentes. No existe ningún permiso de tenencia adicional ligado a la raza del perro a nivel nacional."
    pt: "O que é restrito é a origem, não a raça: segundo o Decreto 35/2016/ND-CP, animais vindos de países afetados pelas doenças de notificação obrigatória do Vietnã ou por agentes zoonóticos/emergentes são proibidos. Não há autorização adicional de posse vinculada à raça do cachorro em nível nacional."
  note:
    en: "Local rules on keeping dogs (leashing, muzzling, registration) can apply where the dog will live, and airlines set their own breed and crate policies — confirm both separately."
    fr: "Des règles locales de détention (laisse, muselière, enregistrement) peuvent s'appliquer au lieu de vie du chien, et les compagnies aériennes fixent leurs propres politiques de race et de caisse — vérifie les deux séparément."
    es: "Las normas locales sobre la tenencia de perros (correa, bozal, registro) pueden aplicarse allí donde vaya a vivir el perro, y las aerolíneas fijan sus propias políticas de raza y de jaula — confirma ambas por separado."
    pt: "Normas locais sobre a posse de cachorros (uso de coleira, focinheira, registro) podem se aplicar onde o cachorro vai morar, e as companhias aéreas definem as próprias políticas de raça e caixa de transporte — confirme os dois separadamente."

checklist:
  - en: "Microchip (ISO 11784/11785) recommended, with its number matching all certificates"
    fr: "Puce (ISO 11784/11785) recommandée, son numéro correspondant à tous les certificats"
    es: "Microchip (ISO 11784/11785) recomendado, con su número coincidiendo con todos los certificados"
    pt: "Microchip (ISO 11784/11785) recomendado, com o número coincidindo em todos os certificados"
  - en: "Valid rabies vaccination given at least 30 days and no more than 12 months before entry"
    fr: "Vaccination antirabique valide, faite au moins 30 jours et au plus 12 mois avant l'entrée"
    es: "Vacunación antirrábica válida administrada al menos 30 días y no más de 12 meses antes de la entrada"
    pt: "Vacinação antirrábica válida, aplicada pelo menos 30 dias e no máximo 12 meses antes da entrada"
  - en: "International veterinary health certificate from the exporting country's official authority"
    fr: "Certificat vétérinaire international de l'autorité officielle du pays d'export"
    es: "Certificado veterinario internacional de la autoridad oficial del país exportador"
    pt: "Atestado de saúde veterinário internacional da autoridade oficial do país exportador"
  - en: "Advance quarantine registration with the Department of Animal Health (Form 19, before departure)"
    fr: "Enregistrement préalable en quarantaine auprès du Département de la santé animale (formulaire 19, avant le départ)"
    es: "Registro previo de cuarentena ante el Departamento de Sanidad Animal (formulario 19, antes de la salida)"
    pt: "Registro de quarentena prévio junto ao Department of Animal Health (Formulário 19, antes da partida)"
  - en: "Vaccination record / pet passport documenting full vaccination and deworming history"
    fr: "Carnet de vaccination / passeport documentant l'historique complet de vaccination et de vermifugation"
    es: "Cartilla de vacunación / pasaporte de mascota que documente el historial completo de vacunación y desparasitación"
    pt: "Carteira de vacinação / passaporte de animal de estimação documentando o histórico completo de vacinação e vermifugação"
  - en: "Original documents translated into English or Vietnamese"
    fr: "Documents originaux traduits en anglais ou en vietnamien"
    es: "Documentos originales traducidos al inglés o al vietnamita"
    pt: "Documentos originais traduzidos para inglês ou vietnamita"
  - en: "Arrive through a designated international airport and notify the quarantine station in advance"
    fr: "Arrive par un aéroport international désigné et préviens la station de quarantaine à l'avance"
    es: "Llega por un aeropuerto internacional designado y avisa a la estación de cuarentena con antelación"
    pt: "Chegue por um aeroporto internacional designado e avise o posto de quarentena com antecedência"
  - en: "Airline reservation and suitable travel crate if travelling in the hold"
    fr: "Réservation aérienne et caisse de transport adaptée si voyage en soute"
    es: "Reserva de la aerolínea y jaula de transporte adecuada si viaja en bodega"
    pt: "Reserva na companhia aérea e caixa de transporte adequada às normas IATA se for viajar no porão"

