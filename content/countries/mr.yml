# Country Entry Guide — Mauritania (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_mr
iso2: "MR"
name: { en: "Mauritania", fr: "Mauritanie", es: "Mauritania", pt: "Mauritânia" }
region: { en: "West Africa", fr: "Afrique de l'Ouest", es: "África Occidental", pt: "África Ocidental" }


regime: non_listed
exit:
  authority: DSV
  authorityUrl: https://elevage.gov.mr
  intro:
    en: "Mauritania is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Direction des Services Vétérinaires (DSV)."
    fr: "La Mauritanie est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par la Direction des Services Vétérinaires (DSV)."
    es: "Mauritania no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por la Direction des Services Vétérinaires (DSV)."
    pt: "A Mauritânia não está na lista, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para retornar à UE — além de um certificado de saúde de exportação endossado pela Direction des Services Vétérinaires (DSV)."
  steps:
    - timing: longlead
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico (titulação): exame de sangue em um laboratório aprovado pela UE, pelo menos 30 dias após a vacinação — um resultado válido é essencial para reentrar na UE e não pode ser providenciado de última hora."
    - timing: window
      text:
        en: "The DSV within the Ministry of Livestock is the competent authority for export health certification."
        fr: "La DSV, au sein du ministère de l'Élevage, est l'autorité compétente pour la certification sanitaire d'export."
        es: "La DSV, dentro del Ministerio de Ganadería, es la autoridad competente para la certificación sanitaria de exportación."
        pt: "A DSV, dentro do Ministério da Pecuária, é a autoridade competente para a certificação sanitária de exportação."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha uma titulação antirrábica da UE válida antes de partir, ela permanece válida por toda a vida, desde que a vacinação antirrábica seja mantida em dia — verifique isso antes de viajar."

hero:
  h1: { en: "Traveling to Mauritania with your dog", fr: "Voyager en Mauritanie avec ton chien", es: "Viajar a Mauritania con tu perro", pt: "Viajando para a Mauritânia com o seu cachorro" }
  intro:
    en: >-
      Mauritania admits pet dogs, but it publishes almost nothing about the exact procedure, so this
      guide stays strictly within what official sources confirm. Mauritania is not part of the EU
      framework: animal health is overseen by the Direction des Services Vétérinaires (DSV), the
      national veterinary authority within the Direction Générale de l'Élevage of the ministry
      responsible for rural development / livestock, and the country's WOAH delegate. Crucially, the
      United States' animal-health agency (USDA APHIS) does not list published pet-entry requirements
      for Mauritania: it classes the country under "Unknown Requirements", meaning the authorities have
      not officially communicated a scheme, and it recommends travelling with an official veterinary
      health certificate (APHIS Form 7001) plus proof of a current rabies vaccination. Because no
      detailed Mauritanian pet-import procedure is published, most specific points — advance import
      permit, microchip rule, rabies-vaccination timing, antibody testing for entry, parasite
      treatment, quarantine, minimum age and breed rules — are simply not published and are marked
      "Unknown" here rather than guessed. This guide explains what is confirmed and what must be
      verified directly with the DSV or a Mauritanian embassy before you book.
    fr: >-
      La Mauritanie admet les chiens de compagnie, mais publie très peu de détails sur la procédure
      exacte ; ce guide s'en tient donc strictement à ce que confirment les sources officielles. La
      Mauritanie ne relève pas du cadre de l'UE : la santé animale est supervisée par la Direction des
      Services Vétérinaires (DSV), autorité vétérinaire nationale au sein de la Direction Générale de
      l'Élevage du ministère chargé du développement rural / de l'élevage, et déléguée du pays auprès de
      l'OMSA. Fait important, l'agence sanitaire animale des États-Unis (USDA APHIS) ne publie pas
      d'exigences d'entrée pour la Mauritanie : elle classe le pays parmi les « exigences non connues »,
      ce qui signifie que les autorités n'ont pas communiqué officiellement de dispositif, et
      recommande de voyager avec un certificat vétérinaire officiel (formulaire APHIS 7001) et une
      preuve de vaccination antirabique à jour. Aucune procédure détaillée d'importation d'animaux
      n'étant publiée, la plupart des points précis — permis d'importation préalable, règle sur la puce,
      délai de vaccination antirabique, titrage pour l'entrée, traitement antiparasitaire, quarantaine,
      âge minimum et règles de race — ne sont tout simplement pas publiés et sont indiqués « Non
      communiqué » ici plutôt que devinés. Ce guide détaille ce qui est confirmé et ce qui doit être
      vérifié directement auprès de la DSV ou d'une ambassade de Mauritanie avant de réserver.
    es: >-
      Mauritania admite perros de compañía, pero publica casi nada sobre el procedimiento exacto, así
      que esta guía se ciñe estrictamente a lo que confirman las fuentes oficiales. Mauritania no forma
      parte del marco de la UE: la sanidad animal está supervisada por la Direction des Services
      Vétérinaires (DSV), la autoridad veterinaria nacional dentro de la Direction Générale de l'Élevage
      del ministerio responsable del desarrollo rural / la ganadería, y delegada del país ante la OMSA.
      Un punto clave: la agencia de sanidad animal de Estados Unidos (USDA APHIS) no publica requisitos
      de entrada para mascotas en Mauritania: clasifica al país como de «requisitos desconocidos», lo
      que significa que las autoridades no han comunicado oficialmente un régimen, y recomienda viajar
      con un certificado sanitario veterinario oficial (formulario APHIS 7001) y una prueba de
      vacunación antirrábica vigente. Como no se publica ningún procedimiento detallado de importación
      de mascotas de Mauritania, la mayoría de los puntos concretos — permiso de importación previo,
      regla sobre el microchip, plazos de la vacunación antirrábica, prueba de titulación para la
      entrada, tratamiento antiparasitario, cuarentena, edad mínima y normas por raza — simplemente no
      se publican y aquí se marcan como «desconocidos» en lugar de suponerlos. Esta guía explica lo que
      está confirmado y lo que debe verificarse directamente con la DSV o una embajada de Mauritania
      antes de reservar.

    pt: "A Mauritânia admite cachorros de estimação, mas publica quase nada sobre o procedimento exato, então este guia se atém estritamente ao que as fontes oficiais confirmam. A Mauritânia não faz parte do quadro da UE: a saúde animal é supervisionada pela Direction des Services Vétérinaires (DSV), a autoridade veterinária nacional dentro da Direction Générale de l'Élevage do ministério responsável pelo desenvolvimento rural / pecuária, e pelo delegado do país junto à WOAH (OMSA). Crucialmente, a agência de saúde animal dos Estados Unidos (USDA APHIS) não lista exigências publicadas de entrada de animais de estimação para a Mauritânia: ela classifica o país sob \"Unknown Requirements\" (exigências desconhecidas), o que significa que as autoridades não comunicaram oficialmente um sistema, e recomenda viajar com um certificado de saúde veterinário oficial (APHIS Form 7001) além de comprovante de vacinação antirrábica em dia. Como nenhum procedimento detalhado de importação de animais de estimação da Mauritânia é publicado, a maioria dos pontos específicos — autorização de importação prévia, regra de microchip, prazo da vacinação antirrábica, teste sorológico para entrada, tratamento antiparasitário, quarentena, idade mínima e regras de raça — simplesmente não são publicados e são marcados como \"Desconhecido\" aqui em vez de presumidos. Este guia explica o que está confirmado e o que deve ser verificado diretamente com a DSV ou uma embaixada da Mauritânia antes de reservar."
difficulty:
  level: difficult
  label: { en: "Difficult to plan — no published procedure; confirm everything with the DSV", fr: "Difficile à préparer — aucune procédure publiée ; tout confirmer auprès de la DSV", es: "Difícil de planificar — ningún procedimiento publicado; confírmalo todo con la DSV", pt: "Difícil de planejar — nenhum procedimento publicado; confirme tudo com a DSV" }

prepTime:
  eu:
    en: "From the EU: allow time to confirm the procedure directly with the DSV or a Mauritanian embassy, since none is published online. If identification and rabies vaccination are already valid, an official EU vet can issue an international veterinary certificate close to departure — but verify the accepted model and any advance permit first."
    fr: "Depuis l'UE : prévois le temps de confirmer la procédure directement auprès de la DSV ou d'une ambassade de Mauritanie, aucune n'étant publiée en ligne. Si l'identification et la vaccination antirabique sont déjà valides, un vétérinaire officiel de l'UE peut établir un certificat vétérinaire international peu avant le départ — mais vérifie d'abord le modèle accepté et tout permis préalable."
    es: "Desde la UE: prevé tiempo para confirmar el procedimiento directamente con la DSV o una embajada de Mauritania, ya que no se publica ninguno en línea. Si la identificación y la vacunación antirrábica ya son válidas, un veterinario oficial de la UE puede expedir un certificado veterinario internacional poco antes de la salida — pero verifica primero el modelo aceptado y cualquier permiso previo."
    pt: "Da UE: reserve tempo para confirmar o procedimento diretamente com a DSV ou uma embaixada da Mauritânia, já que nenhum é publicado on-line. Se a identificação e a vacinação antirrábica já estiverem válidas, um veterinário oficial da UE pode emitir um certificado veterinário internacional próximo à partida — mas verifique antes o modelo aceito e qualquer autorização prévia."
  listed:
    en: "From the United States: APHIS lists no Mauritania-specific requirements, so it recommends an official health certificate (APHIS Form 7001) endorsed by APHIS plus proof of current rabies vaccination. Allow roughly 3 weeks if the first rabies shot is still needed, because vaccination must precede the certificate."
    fr: "Depuis les États-Unis : l'APHIS ne publie aucune exigence propre à la Mauritanie et recommande donc un certificat sanitaire officiel (formulaire APHIS 7001) endossé par l'APHIS, avec une preuve de vaccination antirabique à jour. Prévois environ 3 semaines s'il faut encore faire le premier vaccin antirabique, la vaccination devant précéder le certificat."
    es: "Desde Estados Unidos: APHIS no publica ningún requisito específico de Mauritania, así que recomienda un certificado sanitario oficial (formulario APHIS 7001) refrendado por APHIS y una prueba de vacunación antirrábica vigente. Prevé unas 3 semanas si aún falta la primera vacuna antirrábica, porque la vacunación debe preceder al certificado."
    pt: "Dos Estados Unidos: a APHIS não lista exigências específicas para a Mauritânia, portanto recomenda um certificado de saúde oficial (APHIS Form 7001) endossado pela APHIS, além de comprovante de vacinação antirrábica em dia. Reserve cerca de 3 semanas caso a primeira dose antirrábica ainda seja necessária, pois a vacinação deve preceder o certificado."
  nonListed:
    en: "Whatever the origin, the limiting steps are confirming the current procedure with the DSV and completing the rabies vaccination before the certificate is issued. Because Mauritania publishes nothing detailed, contact the DSV or a Mauritanian embassy early to learn whether an advance import permit or any extra condition applies."
    fr: "Quelle que soit l'origine, les étapes limitantes sont la confirmation de la procédure à jour auprès de la DSV et la vaccination antirabique avant l'établissement du certificat. La Mauritanie ne publiant rien de détaillé, contacte tôt la DSV ou une ambassade de Mauritanie pour savoir si un permis d'importation préalable ou une condition supplémentaire s'applique."
    es: "Sea cual sea el origen, los pasos limitantes son confirmar el procedimiento vigente con la DSV y completar la vacunación antirrábica antes de que se expida el certificado. Como Mauritania no publica nada detallado, ponte en contacto pronto con la DSV o una embajada de Mauritania para saber si se aplica un permiso de importación previo o alguna condición adicional."
    pt: "Seja qual for a origem, as etapas limitantes são confirmar o procedimento atual com a DSV e concluir a vacinação antirrábica antes de o certificado ser emitido. Como a Mauritânia não publica nada detalhado, entre em contato com a DSV ou com uma embaixada da Mauritânia com antecedência para saber se é aplicável uma autorização de importação prévia ou qualquer condição extra."

