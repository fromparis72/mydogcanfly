  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Mauritania (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — la Mauritanie (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Mauritania (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — a Mauritânia (seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Mauritania", fr: "Pays de destination — Mauritanie", es: "País de destino — Mauritania", pt: "País de destino — Mauritânia" }
      text:
        en: "Mauritania sits outside the EU framework and its animal health is overseen by the Direction des Services Vétérinaires (DSV), within the Direction Générale de l'Élevage. No detailed pet-import procedure is published, and the US authorities (APHIS) class Mauritania under 'Unknown Requirements'. So an advance permit, microchip rule, rabies timing, quarantine, minimum age and breed rules are unpublished and must be confirmed directly with the DSV."
        fr: "La Mauritanie se situe hors du cadre de l'UE et sa santé animale est supervisée par la Direction des Services Vétérinaires (DSV), au sein de la Direction Générale de l'Élevage. Aucune procédure détaillée d'importation n'est publiée, et les autorités américaines (APHIS) classent la Mauritanie parmi les « exigences non connues ». Ainsi, permis préalable, règle sur la puce, délai antirabique, quarantaine, âge minimum et règles de race ne sont pas publiés et doivent être confirmés directement auprès de la DSV."
        es: "Mauritania se sitúa fuera del marco de la UE y su sanidad animal está supervisada por la Direction des Services Vétérinaires (DSV), dentro de la Direction Générale de l'Élevage. No se publica ningún procedimiento detallado de importación de mascotas, y las autoridades estadounidenses (APHIS) clasifican a Mauritania como de «requisitos desconocidos». Así que un permiso previo, la regla sobre el microchip, los plazos antirrábicos, la cuarentena, la edad mínima y las normas por raza no están publicados y deben confirmarse directamente con la DSV."
        pt: "A Mauritânia está fora do quadro da UE e sua saúde animal é supervisionada pela Direction des Services Vétérinaires (DSV), dentro da Direction Générale de l'Élevage. Nenhum procedimento detalhado de importação de animais de estimação é publicado, e as autoridades dos EUA (APHIS) classificam a Mauritânia sob 'Unknown Requirements' (exigências desconhecidas). Assim, a autorização prévia, a regra de microchip, o prazo da vacinação antirrábica, a quarentena, a idade mínima e as regras de raça não são publicadas e devem ser confirmadas diretamente com a DSV."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The international veterinary certificate is issued by a government-accredited vet in the country of departure, using that country's official model. From the United States, where APHIS has no Mauritania model, it recommends the generic APHIS Form 7001 endorsed by APHIS plus rabies proof. The country of departure decides who signs your certificate and shapes the rabies evidence Mauritania's services expect."
        fr: "Le certificat vétérinaire international est établi par un vétérinaire accrédité du pays de départ, selon le modèle officiel de ce pays. Depuis les États-Unis, où l'APHIS n'a pas de modèle pour la Mauritanie, elle recommande le formulaire générique APHIS 7001 endossé par l'APHIS et une preuve de vaccination antirabique. Le pays de départ détermine qui signe ton certificat et conditionne les preuves antirabiques attendues par les services mauritaniens."
        es: "El certificado veterinario internacional lo expide un veterinario acreditado por el gobierno en el país de salida, usando el modelo oficial de ese país. Desde Estados Unidos, donde APHIS no tiene un modelo para Mauritania, recomienda el formulario genérico APHIS 7001 refrendado por APHIS y una prueba antirrábica. El país de salida determina quién firma tu certificado y condiciona las pruebas antirrábicas que esperan los servicios de Mauritania."
        pt: "O certificado veterinário internacional é emitido por um veterinário credenciado pelo governo no país de partida, usando o modelo oficial desse país. A partir dos Estados Unidos, onde a APHIS não tem um modelo específico para a Mauritânia, ela recomenda o APHIS Form 7001 genérico, endossado pela APHIS, além do comprovante de raiva. O país de partida determina quem assina o seu certificado e molda as evidências relativas à raiva que os serviços da Mauritânia esperam."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "Your dog's rabies history and recent country of residence matter to the veterinary services, not only the last airport. A stay in a rabies-risk country can affect the evidence required. Note that Mauritania is itself a rabies-endemic country, treated by the EU as a non-listed (unfavourable) third country, which matters for any later return to the EU."
        fr: "L'historique antirabique et le pays de résidence récent de ton chien comptent pour les services vétérinaires, pas seulement l'aéroport de destination finale. Un séjour dans un pays à risque rabique peut influer sur les preuves exigées. Note que la Mauritanie est elle-même un pays à rage endémique, traitée par l'UE comme un pays tiers non listé (situation défavorable), ce qui compte pour un éventuel retour ultérieur vers l'UE."
        es: "El historial antirrábico y el país de residencia reciente de tu perro importan a los servicios veterinarios, no solo el último aeropuerto. Una estancia en un país con riesgo de rabia puede influir en las pruebas exigidas. Ten en cuenta que Mauritania es en sí misma un país con rabia endémica, tratada por la UE como un país tercero no listado (situación desfavorable), lo que importa para un posible regreso posterior a la UE."
        pt: "O histórico de raiva do seu cachorro e o país de residência recente importam para os serviços veterinários, não apenas o último aeroporto. Uma estadia em um país de risco para a raiva pode afetar as evidências exigidas. Observe que a própria Mauritânia é um país endêmico para a raiva, tratado pela UE como um país terceiro não listado (desfavorável), o que é relevante para qualquer retorno posterior à UE."
  note:
    en: "So read the requirements below as the confirmed core, then verify every unpublished point and your dog's exact origin, length of stay and history with your vet and the DSV before booking."
    fr: "Lis donc les exigences ci-dessous comme le socle confirmé, puis vérifie chaque point non publié ainsi que l'origine, la durée du séjour et l'historique exacts de ton chien auprès de ton vétérinaire et de la DSV avant de réserver."
    es: "Así que lee los requisitos siguientes como el núcleo confirmado y luego verifica cada punto no publicado y el origen, la duración de la estancia y el historial exactos de tu perro con tu veterinario y la DSV antes de reservar."
    pt: "Portanto, leia as exigências abaixo como o núcleo confirmado e, depois, verifique cada ponto não publicado, além da origem exata, do tempo de estadia e do histórico do seu cachorro, com o seu veterinário e a DSV antes de reservar."

requirements:
  - item: { en: "Advance import permit", fr: "Permis d'importation préalable", es: "Permiso de importación previo", pt: "Autorização de importação prévia" }
    required: { en: "Not published", fr: "Non communiqué", es: "No publicado", pt: "Não publicado" }
    when: { en: "Mauritania does not publish an online pet-import permit procedure, and no official model references a prior permit for personal pets. This is an absence of published rule, not a confirmation that none exists — confirm directly with the DSV or a Mauritanian embassy before travel.", fr: "La Mauritanie ne publie pas de procédure de permis d'importation d'animaux en ligne, et aucun modèle officiel n'évoque de permis préalable pour les animaux personnels. C'est une absence de règle publiée, non une confirmation qu'aucun n'existe — à confirmer directement auprès de la DSV ou d'une ambassade de Mauritanie avant le voyage.", es: "Mauritania no publica ningún procedimiento en línea de permiso de importación de mascotas, y ningún modelo oficial menciona un permiso previo para mascotas personales. Es una ausencia de regla publicada, no una confirmación de que no exista — confírmalo directamente con la DSV o una embajada de Mauritania antes de viajar.", pt: "A Mauritânia não publica on-line um procedimento de autorização de importação de animais de estimação, e nenhum modelo oficial faz referência a uma autorização prévia para animais de estimação pessoais. Isso é uma ausência de regra publicada, não uma confirmação de que nenhuma exista — confirme diretamente com a DSV ou uma embaixada da Mauritânia antes de viajar." }
    exceptions: { en: "Unknown — the DSV may set conditions case by case.", fr: "Non communiqué — la DSV peut fixer des conditions au cas par cas.", es: "Desconocido — la DSV puede fijar condiciones caso por caso.", pt: "Desconhecido — a DSV pode estabelecer condições caso a caso." }
    ref: { en: "Mauritania DSV (Direction Générale de l'Élevage) — no published pet-import permit; USDA APHIS classes Mauritania under 'Unknown Requirements'", fr: "DSV Mauritanie (Direction Générale de l'Élevage) — aucun permis d'importation d'animaux publié ; l'USDA APHIS classe la Mauritanie parmi les « exigences non connues »", es: "DSV de Mauritania (Direction Générale de l'Élevage) — sin permiso de importación de mascotas publicado; la USDA APHIS clasifica a Mauritania como de «requisitos desconocidos»", pt: "DSV da Mauritânia (Direction Générale de l'Élevage) — nenhuma autorização de importação de animais de estimação publicada; a USDA APHIS classifica a Mauritânia sob 'Unknown Requirements' (exigências desconhecidas)" }
  - item: { en: "Identification (microchip)", fr: "Identification (puce)", es: "Identificación (microchip)", pt: "Identificação (microchip)" }
    required: { en: "No published rule; ISO microchip recommended", fr: "Aucune règle publiée ; puce ISO recommandée", es: "Sin regla publicada; se recomienda microchip ISO", pt: "Nenhuma regra publicada; microchip ISO recomendado" }
    when: { en: "Mauritania publishes no stand-alone microchip law for pet import. In practice a permanent identification is the standard on any international veterinary certificate, and an ISO microchip is needed for a later return to the EU. Place identification before the rabies vaccination so records match.", fr: "La Mauritanie ne publie pas de loi spécifique sur la puce pour l'importation d'animaux. En pratique, une identification permanente est le standard sur tout certificat vétérinaire international, et une puce ISO est nécessaire pour un retour ultérieur vers l'UE. Posez l'identification avant la vaccination antirabique pour que les documents concordent.", es: "Mauritania no publica ninguna ley específica sobre el microchip para la importación de mascotas. En la práctica, una identificación permanente es el estándar en cualquier certificado veterinario internacional, y se necesita un microchip ISO para un regreso posterior a la UE. Coloca la identificación antes de la vacunación antirrábica para que los registros coincidan.", pt: "A Mauritânia não publica uma lei específica sobre microchip para a importação de animais de estimação. Na prática, uma identificação permanente é o padrão em qualquer certificado veterinário internacional, e um microchip ISO é necessário para um retorno posterior à UE. Coloque a identificação antes da vacinação antirrábica para que os registros coincidam." }
    exceptions: { en: "Unknown — confirm with the DSV what identification is accepted.", fr: "Non communiqué — confirme auprès de la DSV l'identification acceptée.", es: "Desconocido — confirma con la DSV qué identificación se acepta.", pt: "Desconhecido — confirme com a DSV qual identificação é aceita." }
    ref: { en: "No published Mauritanian microchip rule; ISO microchip is the international/EU standard", fr: "Aucune règle mauritanienne publiée sur la puce ; la puce ISO est le standard international/UE", es: "Sin regla mauritana publicada sobre el microchip; el microchip ISO es el estándar internacional/de la UE", pt: "Nenhuma regra de microchip da Mauritânia publicada; o microchip ISO é o padrão internacional/da UE" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Recommended (timing not published)", fr: "Recommandée (délai non communiqué)", es: "Recomendada (plazos no publicados)", pt: "Recomendada (prazo não publicado)" }
    when: { en: "Mauritania is a rabies-endemic country and APHIS recommends proof of a current rabies vaccination for dogs travelling there, but no Mauritanian vaccination-timing rule is published. Where it is a primary vaccination, allow it to take effect before travel (commonly at least 21 days); confirm the exact window with your official vet and the DSV.", fr: "La Mauritanie est un pays à rage endémique et l'APHIS recommande une preuve de vaccination antirabique à jour pour les chiens qui s'y rendent, mais aucune règle mauritanienne de délai de vaccination n'est publiée. S'il s'agit d'une primo-vaccination, laisse-la produire ses effets avant le voyage (souvent au moins 21 jours) ; confirme la fenêtre exacte avec ton vétérinaire officiel et la DSV.", es: "Mauritania es un país con rabia endémica y APHIS recomienda una prueba de vacunación antirrábica vigente para los perros que viajan allí, pero no se publica ninguna regla mauritana de plazos de vacunación. Si es una primovacunación, deja que surta efecto antes del viaje (normalmente al menos 21 días); confirma la ventana exacta con tu veterinario oficial y la DSV.", pt: "A Mauritânia é um país endêmico para a raiva, e a APHIS recomenda comprovante de vacinação antirrábica em dia para cachorros que viajam para lá, mas nenhuma regra da Mauritânia sobre o prazo da vacinação é publicada. Quando se trata de uma primovacinação, deixe que ela produza efeito antes da viagem (geralmente pelo menos 21 dias); confirme a janela exata com o seu veterinário oficial e a DSV." }
    exceptions: { en: "A dog too young to be validly vaccinated cannot meet a rabies requirement.", fr: "Un chien trop jeune pour être valablement vacciné ne peut satisfaire une exigence antirabique.", es: "Un perro demasiado joven para ser vacunado válidamente no puede cumplir un requisito antirrábico.", pt: "Um cachorro jovem demais para ser validamente vacinado não pode cumprir uma exigência relativa à raiva." }
    ref: { en: "USDA APHIS — proof of current rabies vaccination recommended (Unknown Requirements); Mauritania rabies-endemic", fr: "USDA APHIS — preuve de vaccination antirabique à jour recommandée (exigences non connues) ; Mauritanie à rage endémique", es: "USDA APHIS — se recomienda una prueba de vacunación antirrábica vigente (requisitos desconocidos); Mauritania con rabia endémica", pt: "USDA APHIS — comprovante de vacinação antirrábica em dia recomendado (Unknown Requirements); Mauritânia endêmica para a raiva" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not published", fr: "Non prévu", es: "No prevista", pt: "Não publicado" }
    when: { en: "No published Mauritanian entry rule requires a rabies antibody test for import of personal pets into the country. (A rabies antibody test may still be relevant for a later return to the EU, because Mauritania is rabies-endemic and non-listed.)", fr: "Aucune règle d'entrée mauritanienne publiée n'exige de titrage antirabique pour l'importation d'animaux personnels dans le pays. (Un titrage peut toutefois rester pertinent pour un retour ultérieur vers l'UE, la Mauritanie étant à rage endémique et non listée.)", es: "Ninguna regla de entrada mauritana publicada exige una prueba de titulación de rabia para la importación de mascotas personales en el país. (Una prueba de titulación de rabia puede seguir siendo pertinente para un regreso posterior a la UE, ya que Mauritania es de rabia endémica y no está listada.)", pt: "Nenhuma regra de entrada da Mauritânia publicada exige um teste sorológico antirrábico para a importação de animais de estimação pessoais no país. (Um teste sorológico antirrábico ainda pode ser relevante para um retorno posterior à UE, pois a Mauritânia é endêmica para a raiva e não listada.)" }
    exceptions: { en: "Unknown for special cases — confirm with the DSV, as conditions can differ by the dog's origin and rabies history.", fr: "Non communiqué pour les cas particuliers — à confirmer auprès de la DSV, les conditions pouvant varier selon l'origine et l'historique rabique du chien.", es: "Desconocido para casos especiales — confírmalo con la DSV, ya que las condiciones pueden variar según el origen y el historial antirrábico del perro.", pt: "Desconhecido para casos particulares — confirme com a DSV, pois as condições podem variar conforme a origem e o histórico de raiva do cachorro." }
    ref: { en: "No published Mauritanian antibody-test requirement; USDA APHIS Unknown Requirements", fr: "Aucun titrage mauritanien publié exigé ; USDA APHIS exigences non connues", es: "Sin prueba de titulación mauritana publicada exigida; USDA APHIS requisitos desconocidos", pt: "Nenhuma exigência de teste sorológico da Mauritânia publicada; USDA APHIS Unknown Requirements" }
  - item: { en: "International veterinary health certificate", fr: "Certificat vétérinaire international", es: "Certificado veterinario internacional", pt: "Atestado de saúde veterinário internacional" }
    required: { en: "Recommended (APHIS Form 7001)", fr: "Recommandé (formulaire APHIS 7001)", es: "Recomendado (formulario APHIS 7001)", pt: "Recomendado (APHIS Form 7001)" }
    when: { en: "Because Mauritania has not communicated a certificate model to APHIS, APHIS recommends travelling with a health certificate (for example, APHIS Form 7001) issued and, where possible, endorsed by APHIS, plus proof of current rabies vaccination. From other countries, use that country's official export/international veterinary certificate model, issued by a government-accredited vet close to departure. A certificate in French is generally acceptable for a francophone country.", fr: "La Mauritanie n'ayant pas communiqué de modèle de certificat à l'APHIS, celle-ci recommande de voyager avec un certificat sanitaire (par exemple le formulaire APHIS 7001) établi et, si possible, endossé par l'APHIS, avec une preuve de vaccination antirabique à jour. Depuis d'autres pays, utilise le modèle de certificat d'exportation/vétérinaire international officiel de ce pays, établi par un vétérinaire accrédité peu avant le départ. Un certificat en français est en général acceptable pour un pays francophone.", es: "Como Mauritania no ha comunicado un modelo de certificado a APHIS, esta recomienda viajar con un certificado sanitario (por ejemplo, el formulario APHIS 7001) expedido y, cuando sea posible, refrendado por APHIS, más una prueba de vacunación antirrábica vigente. Desde otros países, usa el modelo oficial de certificado de exportación/veterinario internacional de ese país, expedido por un veterinario acreditado por el gobierno poco antes de la salida. Un certificado en francés suele ser aceptable para un país francófono.", pt: "Como a Mauritânia não comunicou um modelo de certificado à APHIS, a APHIS recomenda viajar com um certificado de saúde (por exemplo, o APHIS Form 7001) emitido e, quando possível, endossado pela APHIS, além de comprovante de vacinação antirrábica em dia. A partir de outros países, use o modelo oficial de certificado veterinário de exportação/internacional desse país, emitido por um veterinário credenciado pelo governo próximo à partida. Um certificado em francês é geralmente aceitável para um país francófono." }
    exceptions: { en: "Unknown — the exact model Mauritania accepts is not published; confirm with the DSV or a Mauritanian embassy.", fr: "Non communiqué — le modèle exact accepté par la Mauritanie n'est pas publié ; à confirmer auprès de la DSV ou d'une ambassade de Mauritanie.", es: "Desconocido — el modelo exacto que acepta Mauritania no está publicado; confírmalo con la DSV o una embajada de Mauritania.", pt: "Desconhecido — o modelo exato aceito pela Mauritânia não é publicado; confirme com a DSV ou uma embaixada da Mauritânia." }
    ref: { en: "USDA APHIS — Unknown Requirements (recommends APHIS Form 7001 + rabies proof)", fr: "USDA APHIS — exigences non connues (recommande le formulaire APHIS 7001 + preuve antirabique)", es: "USDA APHIS — requisitos desconocidos (recomienda el formulario APHIS 7001 + prueba antirrábica)", pt: "USDA APHIS — Unknown Requirements (recomenda o APHIS Form 7001 + comprovante de raiva)" }
  - item: { en: "Parasite / tapeworm treatment", fr: "Traitement antiparasitaire / échinocoque", es: "Tratamiento antiparasitario / contra la tenia", pt: "Tratamento antiparasitário / contra tênias" }
    required: { en: "Not published", fr: "Non communiqué", es: "No publicado", pt: "Não publicado" }
    when: { en: "Mauritania does not publish a mandatory internal or external parasite treatment for personal pet dogs. This is an absence of published rule, not a guarantee.", fr: "La Mauritanie ne publie pas de traitement antiparasitaire interne ou externe obligatoire pour les chiens de compagnie personnels. C'est une absence de règle publiée, non une garantie.", es: "Mauritania no publica ningún tratamiento antiparasitario interno o externo obligatorio para los perros de compañía personales. Es una ausencia de regla publicada, no una garantía.", pt: "A Mauritânia não publica um tratamento antiparasitário interno ou externo obrigatório para cachorros de estimação pessoais. Isso é uma ausência de regra publicada, não uma garantia." }
    exceptions: { en: "Unknown — a vet may recommend treatments; confirm any requirement with the DSV.", fr: "Non communiqué — un vétérinaire peut recommander des traitements ; confirme toute exigence auprès de la DSV.", es: "Desconocido — un veterinario puede recomendar tratamientos; confirma cualquier requisito con la DSV.", pt: "Desconhecido — um veterinário pode recomendar tratamentos; confirme qualquer exigência com a DSV." }
    ref: { en: "No published Mauritanian parasite-treatment requirement", fr: "Aucun traitement antiparasitaire mauritanien publié exigé", es: "Sin tratamiento antiparasitario mauritano publicado exigido", pt: "Nenhuma exigência de tratamento antiparasitário da Mauritânia publicada" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Not published (linked to rabies)", fr: "Non communiqué (lié à la rage)", es: "No publicada (vinculada a la rabia)", pt: "Não publicado (vinculado à raiva)" }
    when: { en: "Mauritania does not publish a stand-alone minimum age. In practice, a puppy must be old enough to be validly vaccinated against rabies (commonly about 3 months / 12 weeks) with the vaccination effective before travel.", fr: "La Mauritanie ne publie pas d'âge minimum distinct. En pratique, un chiot doit être en âge d'être valablement vacciné contre la rage (souvent environ 3 mois / 12 semaines), la vaccination devant produire ses effets avant le voyage.", es: "Mauritania no publica una edad mínima independiente. En la práctica, un cachorro debe tener edad suficiente para ser vacunado válidamente contra la rabia (normalmente unos 3 meses / 12 semanas), y la vacunación debe surtir efecto antes del viaje.", pt: "A Mauritânia não publica uma idade mínima específica. Na prática, um filhote deve ter idade suficiente para ser validamente vacinado contra a raiva (geralmente cerca de 3 meses / 12 semanas), com a vacinação em vigor antes da viagem." }
    exceptions: { en: "Puppies too young to be vaccinated cannot meet a rabies requirement — confirm with the DSV.", fr: "Les chiots trop jeunes pour être vaccinés ne peuvent satisfaire une exigence antirabique — à confirmer auprès de la DSV.", es: "Los cachorros demasiado jóvenes para ser vacunados no pueden cumplir un requisito antirrábico — confírmalo con la DSV.", pt: "Filhotes jovens demais para serem vacinados não podem cumprir uma exigência relativa à raiva — confirme com a DSV." }
    ref: { en: "Derived from the rabies-vaccination recommendation; no separate Mauritanian minimum-age rule published", fr: "Déduit de la recommandation de vaccination antirabique ; aucun âge minimum mauritanien distinct publié", es: "Derivado de la recomendación de vacunación antirrábica; sin regla mauritana de edad mínima independiente publicada", pt: "Derivada da recomendação de vacinação antirrábica; nenhuma regra separada de idade mínima da Mauritânia publicada" }
  - item: { en: "Border veterinary inspection & customs", fr: "Inspection vétérinaire frontalière et douane", es: "Inspección veterinaria fronteriza y aduanas", pt: "Inspeção veterinária de fronteira e alfândega" }
    required: { en: "Expected — details not published", fr: "Attendue — détails non publiés", es: "Prevista — detalles no publicados", pt: "Prevista — detalhes não publicados" }
    when: { en: "The Direction des Services Vétérinaires is responsible for the sanitary control of animals, including at border posts, so the dog and its documents can be checked on arrival (e.g. at Nouakchott–Oumtounsy International Airport) by the official veterinary services alongside customs. Mauritania does not publish the specific airport pet-check procedure — carry all originals and be ready to present them.", fr: "La Direction des Services Vétérinaires est responsable du contrôle sanitaire des animaux, y compris aux postes frontaliers ; le chien et ses documents peuvent donc être contrôlés à l'arrivée (par exemple à l'aéroport international de Nouakchott–Oumtounsy) par les services vétérinaires officiels, aux côtés de la douane. La Mauritanie ne publie pas la procédure spécifique de contrôle des animaux à l'aéroport — garde tous les originaux et sois prêt à les présenter.", es: "La Direction des Services Vétérinaires es responsable del control sanitario de los animales, incluso en los puestos fronterizos, por lo que el perro y sus documentos pueden ser revisados a la llegada (por ejemplo, en el Aeropuerto Internacional de Nuakchot–Oumtounsy) por los servicios veterinarios oficiales, junto con las aduanas. Mauritania no publica el procedimiento específico de control de mascotas en el aeropuerto — lleva todos los originales y prepárate para presentarlos.", pt: "A Direction des Services Vétérinaires é responsável pelo controle sanitário dos animais, inclusive nos postos de fronteira, de modo que o cachorro e seus documentos podem ser verificados na chegada (por exemplo, no Aeroporto Internacional de Nouakchott–Oumtounsy) pelos serviços veterinários oficiais junto com a alfândega. A Mauritânia não publica o procedimento específico de verificação de animais de estimação no aeroporto — leve todos os originais e esteja pronto para apresentá-los." }
    exceptions: { en: "Unknown — the exact inspection procedure is not published; confirm with the DSV.", fr: "Non communiqué — la procédure d'inspection exacte n'est pas publiée ; à confirmer auprès de la DSV.", es: "Desconocido — el procedimiento de inspección exacto no está publicado; confírmalo con la DSV.", pt: "Desconhecido — o procedimento exato de inspeção não é publicado; confirme com a DSV." }
    ref: { en: "Mauritania — Direction des Services Vétérinaires (WOAH PVS evaluation): veterinary services responsible for animal sanitary control", fr: "Mauritanie — Direction des Services Vétérinaires (évaluation PVS de l'OMSA) : services vétérinaires chargés du contrôle sanitaire des animaux", es: "Mauritania — Direction des Services Vétérinaires (evaluación PVS de la OMSA): servicios veterinarios responsables del control sanitario de los animales", pt: "Mauritânia — Direction des Services Vétérinaires (avaliação PVS da WOAH/OMSA): serviços veterinários responsáveis pelo controle sanitário animal" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not published", fr: "Non communiqué", es: "No publicada", pt: "Não publicado" }
    when: { en: "No routine quarantine for compliant personal pet dogs is published by Mauritania. This is an absence of published rule, not a guarantee — a non-compliant animal could still be held or refused.", fr: "Aucune quarantaine de routine pour les chiens de compagnie personnels conformes n'est publiée par la Mauritanie. C'est une absence de règle publiée, non une garantie — un animal non conforme pourrait néanmoins être retenu ou refusé.", es: "Mauritania no publica ninguna cuarentena de rutina para los perros de compañía personales que cumplan los requisitos. Es una ausencia de regla publicada, no una garantía — un animal que no cumpla podría, aun así, ser retenido o rechazado.", pt: "Nenhuma quarentena de rotina para cachorros de estimação pessoais em conformidade é publicada pela Mauritânia. Isso é uma ausência de regra publicada, não uma garantia — um animal em situação irregular ainda poderia ser retido ou recusado." }
    exceptions: { en: "Non-compliant animals may be refused, returned or held under veterinary control at the owner's expense.", fr: "Les animaux non conformes peuvent être refusés, renvoyés ou placés sous contrôle vétérinaire aux frais du propriétaire.", es: "Los animales que no cumplan pueden ser rechazados, devueltos o retenidos bajo control veterinario a cargo del propietario.", pt: "Animais em situação irregular podem ser recusados, devolvidos ou retidos sob controle veterinário às custas do dono." }
    ref: { en: "No quarantine rule published on official Mauritanian sources or by USDA APHIS", fr: "Aucune règle de quarantaine publiée sur les sources officielles mauritaniennes ni par l'USDA APHIS", es: "Sin regla de cuarentena publicada en las fuentes oficiales mauritanas ni por la USDA APHIS", pt: "Nenhuma regra de quarentena publicada em fontes oficiais da Mauritânia ou pela USDA APHIS" }
  - item: { en: "Banned / restricted breeds", fr: "Races interdites / restreintes", es: "Razas prohibidas / restringidas", pt: "Raças proibidas / restritas" }
    required: { en: "No published breed ban", fr: "Aucune interdiction par race publiée", es: "Sin prohibición por raza publicada", pt: "Nenhuma proibição de raça publicada" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "We found no official Mauritanian instrument banning or restricting dog breeds at import. This is an absence of published rule, not a guarantee — confirm your dog's breed with the DSV before travel.", fr: "Nous n'avons trouvé aucun texte officiel mauritanien interdisant ou restreignant les races de chiens à l'importation. C'est une absence de règle publiée, non une garantie — confirme la race de ton chien auprès de la DSV avant de voyager.", es: "No encontramos ningún instrumento oficial mauritano que prohíba o restrinja razas de perros en la importación. Es una ausencia de regla publicada, no una garantía — confirma la raza de tu perro con la DSV antes de viajar.", pt: "Não encontramos nenhum instrumento oficial da Mauritânia que proíba ou restrinja raças de cachorros na importação. Isso é uma ausência de regra publicada, não uma garantia — confirme a raça do seu cachorro com a DSV antes de viajar." }
    ref: { en: "No breed-specific import legislation found on official Mauritanian sources", fr: "Aucune législation d'importation par race trouvée sur les sources officielles mauritaniennes", es: "No se encontró legislación de importación por raza en las fuentes oficiales mauritanas", pt: "Nenhuma legislação de importação específica por raça encontrada em fontes oficiais da Mauritânia" }

origin:
  eu:
    title: { en: "From the European Union", fr: "Depuis l'Union européenne", es: "Desde la Unión Europea", pt: "Da União Europeia" }
    body:
      en: "For a dog leaving the EU, have an official EU vet issue an international veterinary certificate close to departure. Your dog needs a permanent identification (an ISO microchip in practice) and a valid rabies vaccination recorded in the passport / vaccination booklet. No rabies antibody test is published for entry into Mauritania. Because Mauritania publishes nothing detailed, confirm with the DSV or a Mauritanian embassy which certificate model is accepted and whether an advance import permit or any extra condition applies before you book. On arrival, the official veterinary services may check the dog and its documents with customs."
      fr: "Pour un chien quittant l'UE, fais établir un certificat vétérinaire international par un vétérinaire officiel de l'UE peu avant le départ. Ton chien a besoin d'une identification permanente (une puce ISO en pratique) et d'une vaccination antirabique valide consignée dans le passeport / carnet de vaccination. Aucun titrage antirabique n'est publié pour l'entrée en Mauritanie. La Mauritanie ne publiant rien de détaillé, confirme auprès de la DSV ou d'une ambassade de Mauritanie le modèle de certificat accepté et l'existence éventuelle d'un permis d'importation préalable ou de toute condition supplémentaire avant de réserver. À l'arrivée, les services vétérinaires officiels peuvent contrôler le chien et ses documents avec la douane."
      es: "Para un perro que sale de la UE, haz que un veterinario oficial de la UE expida un certificado veterinario internacional poco antes de la salida. Tu perro necesita una identificación permanente (un microchip ISO en la práctica) y una vacunación antirrábica válida registrada en el pasaporte / cartilla de vacunación. No se publica ninguna prueba de titulación de rabia para la entrada en Mauritania. Como Mauritania no publica nada detallado, confirma con la DSV o una embajada de Mauritania qué modelo de certificado se acepta y si se aplica un permiso de importación previo o alguna condición adicional antes de reservar. A la llegada, los servicios veterinarios oficiales pueden revisar el perro y sus documentos junto con las aduanas."
      pt: "Para um cachorro que parte da UE, peça a um veterinário oficial da UE que emita um certificado veterinário internacional próximo à partida. O seu cachorro precisa de uma identificação permanente (na prática, um microchip ISO) e de uma vacinação antirrábica válida registrada no passaporte / caderneta de vacinação. Nenhum teste sorológico antirrábico é publicado para a entrada na Mauritânia. Como a Mauritânia não publica nada detalhado, confirme com a DSV ou uma embaixada da Mauritânia qual modelo de certificado é aceito e se é aplicável uma autorização de importação prévia ou qualquer condição extra antes de reservar. Na chegada, os serviços veterinários oficiais podem verificar o cachorro e seus documentos junto com a alfândega."
    cls: warn
  listed:
    title: { en: "From another third country", fr: "Depuis un autre pays tiers", es: "Desde otro país tercero", pt: "De outro país terceiro" }
    body:
      en: "From a non-EU country, the practical core is the same: a permanent identification, a valid rabies vaccination and an official international veterinary certificate issued by a government-accredited vet close to departure. From the United States, APHIS has no Mauritania model, so it recommends the generic APHIS Form 7001 endorsed by APHIS plus proof of current rabies vaccination. Use your own country's official export model where you travel from elsewhere, and confirm any additional Mauritanian condition with the DSV."
      fr: "Depuis un pays hors UE, le socle pratique est identique : une identification permanente, une vaccination antirabique valide et un certificat vétérinaire international officiel établi par un vétérinaire accrédité peu avant le départ. Depuis les États-Unis, l'APHIS n'a pas de modèle pour la Mauritanie et recommande donc le formulaire générique APHIS 7001 endossé par l'APHIS, avec une preuve de vaccination antirabique à jour. Utilise le modèle d'exportation officiel de ton propre pays si tu voyages d'ailleurs, et confirme toute condition mauritanienne supplémentaire auprès de la DSV."
      es: "Desde un país no perteneciente a la UE, el núcleo práctico es el mismo: una identificación permanente, una vacunación antirrábica válida y un certificado veterinario internacional oficial expedido por un veterinario acreditado por el gobierno poco antes de la salida. Desde Estados Unidos, APHIS no tiene un modelo para Mauritania, así que recomienda el formulario genérico APHIS 7001 refrendado por APHIS y una prueba de vacunación antirrábica vigente. Usa el modelo de exportación oficial de tu propio país si viajas desde otro lugar, y confirma cualquier condición mauritana adicional con la DSV."
      pt: "A partir de um país fora da UE, o núcleo prático é o mesmo: uma identificação permanente, uma vacinação antirrábica válida e um certificado veterinário internacional oficial emitido por um veterinário credenciado pelo governo próximo à partida. A partir dos Estados Unidos, a APHIS não tem um modelo para a Mauritânia, então recomenda o APHIS Form 7001 genérico, endossado pela APHIS, além de comprovante de vacinação antirrábica em dia. Use o modelo oficial de exportação do seu próprio país se viajar de outro lugar, e confirme qualquer condição adicional da Mauritânia com a DSV."
    cls: warn
  nonListed:
    title: { en: "Rabies history & special cases", fr: "Historique rabique et cas particuliers", es: "Historial antirrábico y casos particulares", pt: "Histórico de raiva e casos particulares" }
    body:
      en: "Mauritania does not publish a separate at-risk-country track or a rabies antibody test for personal pets entering the country, but the DSV can attach conditions based on the dog's origin and rabies history. If your dog has stayed in a high-risk country, confirm directly with the DSV what evidence will be required before you travel. Because Mauritania is itself rabies-endemic and treated by the EU as a non-listed third country, plan the rabies antibody test now if you intend to bring the dog back into the EU later."
      fr: "La Mauritanie ne publie pas de parcours distinct pour les pays à risque ni de titrage antirabique pour les animaux personnels entrant dans le pays, mais la DSV peut assortir l'entrée de conditions selon l'origine et l'historique rabique du chien. Si ton chien a séjourné dans un pays à haut risque, confirme directement auprès de la DSV les preuves exigées avant de voyager. La Mauritanie étant elle-même à rage endémique et traitée par l'UE comme un pays tiers non listé, prévois dès maintenant le titrage antirabique si tu compte ramener le chien dans l'UE plus tard."
      es: "Mauritania no publica un recorrido aparte para países de riesgo ni una prueba de titulación de rabia para las mascotas personales que entran en el país, pero la DSV puede añadir condiciones según el origen y el historial antirrábico del perro. Si tu perro ha estado en un país de alto riesgo, confirma directamente con la DSV qué pruebas se exigirán antes de viajar. Como Mauritania es en sí misma de rabia endémica y la UE la trata como un país tercero no listado, planifica ya la prueba de titulación de rabia si tienes intención de traer al perro de vuelta a la UE más tarde."
      pt: "A Mauritânia não publica um percurso separado para países de risco nem um teste sorológico antirrábico para animais de estimação pessoais que entram no país, mas a DSV pode impor condições com base na origem e no histórico de raiva do cachorro. Se o seu cachorro esteve em um país de alto risco, confirme diretamente com a DSV quais evidências serão exigidas antes de viajar. Como a própria Mauritânia é endêmica para a raiva e é tratada pela UE como um país terceiro não listado, planeje o teste sorológico antirrábico desde já, caso pretenda trazer o cachorro de volta para a UE mais tarde."
    cls: neutral

arrival:
  intro:
    en: "What happens when your dog reaches Mauritania is not published in detail, so prepare a complete, valid document set and expect an official check."
    fr: "Ce qui se passe à l'arrivée de ton chien en Mauritanie n'est pas publié en détail ; prépare donc un dossier complet et valide et attends-toi à un contrôle officiel."
    es: "Lo que ocurre cuando tu perro llega a Mauritania no está publicado en detalle, así que prepara un juego de documentos completo y válido y espera un control oficial."
    pt: "O que acontece quando o seu cachorro chega à Mauritânia não é publicado em detalhes, então prepare um conjunto completo e válido de documentos e espere uma verificação oficial."
  points:
    - en: "The Direction des Services Vétérinaires (DSV) is responsible for the sanitary control of animals, including at border posts, so your dog and documents can be checked on arrival alongside customs."
      fr: "La Direction des Services Vétérinaires (DSV) est responsable du contrôle sanitaire des animaux, y compris aux postes frontaliers ; ton chien et tes documents peuvent donc être contrôlés à l'arrivée, aux côtés de la douane."
      es: "La Direction des Services Vétérinaires (DSV) es responsable del control sanitario de los animales, incluso en los puestos fronterizos, por lo que tu perro y tus documentos pueden ser revisados a la llegada, junto con las aduanas."
      pt: "A Direction des Services Vétérinaires (DSV) é responsável pelo controle sanitário dos animais, inclusive nos postos de fronteira, de modo que o seu cachorro e seus documentos podem ser verificados na chegada junto com a alfândega."
    - en: "Present the originals: the international veterinary certificate (e.g. APHIS Form 7001 from the US), proof of identification and proof of a valid rabies vaccination."
      fr: "Présente les originaux : le certificat vétérinaire international (par exemple le formulaire APHIS 7001 depuis les États-Unis), la preuve d'identification et la preuve d'une vaccination antirabique valide."
      es: "Presenta los originales: el certificado veterinario internacional (por ejemplo, el formulario APHIS 7001 desde EE. UU.), la prueba de identificación y la prueba de una vacunación antirrábica válida."
      pt: "Apresente os originais: o certificado veterinário internacional (por exemplo, o APHIS Form 7001, no caso dos EUA), o comprovante de identificação e o comprovante de vacinação antirrábica válida."
    - en: "Keep the certificate within its validity window on the day of arrival — confirm the accepted window with your official vet, since Mauritania does not publish one."
      fr: "Garde le certificat dans sa fenêtre de validité le jour de l'arrivée — confirme la fenêtre acceptée avec ton vétérinaire officiel, la Mauritanie n'en publiant pas."
      es: "Mantén el certificado dentro de su ventana de valide el día de la llegada — confirma la ventana aceptada con tu veterinario oficial, ya que Mauritania no publica ninguna."
      pt: "Mantenha o certificado dentro da sua janela de validade no dia da chegada — confirme a janela aceita com o seu veterinário oficial, já que a Mauritânia não publica uma."
    - en: "If documents are missing or invalid, the animal may be refused entry, returned or held under veterinary control — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, l'animal peut être refusé, renvoyé ou placé sous contrôle vétérinaire — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, se puede denegar la entrada al animal, devolverlo o retenerlo bajo control veterinario — a cargo del propietario."
      pt: "Se faltarem documentos ou eles forem inválidos, o animal pode ter a entrada recusada, ser devolvido ou ficar retido sob controle veterinário — às custas do dono."
    - en: "Because the exact airport procedure is not published, confirm the arrival formalities with the DSV or a Mauritanian embassy before you travel, and carry a full set of originals throughout the journey."
      fr: "La procédure exacte à l'aéroport n'étant pas publiée, confirme les formalités d'arrivée auprès de la DSV ou d'une ambassade de Mauritanie avant de voyager, et garde un jeu complet d'originaux durant tout le trajet."
      es: "Como el procedimiento exacto del aeropuerto no está publicado, confirma los trámites de llegada con la DSV o una embajada de Mauritania antes de viajar, y lleva un juego completo de originales durante todo el trayecto."
      pt: "Como o procedimento exato do aeroporto não é publicado, confirme as formalidades de chegada com a DSV ou uma embaixada da Mauritânia antes de viajar, e leve um conjunto completo de originais durante toda a viagem."

travellerExperience: null

restrictedDogs:
  intro:
    en: "No breed-specific import ban for dogs is published on Mauritania's official veterinary or government sources. Entry is framed by general health requirements (identification, rabies vaccination, veterinary certificate), not by a published national list of prohibited breeds."
    fr: "Aucune interdiction d'importation par race pour les chiens n'est publiée sur les sources officielles vétérinaires ou gouvernementales de la Mauritanie. L'entrée est encadrée par des exigences sanitaires générales (identification, vaccination antirabique, certificat vétérinaire), non par une liste nationale de races interdites publiée."
    es: "No se publica ninguna prohibición de importación por raza para los perros en las fuentes oficiales veterinarias o gubernamentales de Mauritania. La entrada se enmarca en requisitos sanitarios generales (identificación, vacunación antirrábica, certificado veterinario), no en una lista nacional publicada de razas prohibidas."
    pt: "Nenhuma proibição de importação específica por raça de cachorro é publicada nas fontes veterinárias ou governamentais oficiais da Mauritânia. A entrada é enquadrada por exigências sanitárias gerais (identificação, vacinação antirrábica, certificado veterinário), não por uma lista nacional publicada de raças proibidas."
  cat1:
    en: "We found no official Mauritanian instrument banning breeds such as pit bull types from import. This is an absence of published rule rather than a positive authorisation of any specific breed."
    fr: "Nous n'avons trouvé aucun texte officiel mauritanien interdisant à l'importation des races comme les types pit-bull. Il s'agit d'une absence de règle publiée, et non d'une autorisation expresse d'une race précise."
    es: "No encontramos ningún instrumento oficial mauritano que prohíba la importación de razas como los tipos pit bull. Es una ausencia de regla publicada más que una autorización expresa de una raza concreta."
    pt: "Não encontramos nenhum instrumento oficial da Mauritânia que proíba a importação de raças como os tipos pit bull. Isso é uma ausência de regra publicada, e não uma autorização positiva de qualquer raça específica."
  cat2:
    en: "There is likewise no published lighter 'permitted with conditions' breed category at the border. Local ownership or public-order rules could still exist; they are not part of any published import procedure."
    fr: "Il n'existe de même aucune catégorie allégée « autorisée sous conditions » publiée à la frontière. Des règles locales de détention ou d'ordre public pourraient exister ; elles ne font pas partie d'une procédure d'importation publiée."
    es: "Tampoco existe una categoría de raza «permitida con condiciones» más ligera publicada en la frontera. Podrían existir normas locales de tenencia o de orden público; no forman parte de ningún procedimiento de importación publicado."
    pt: "Também não há uma categoria mais branda de raça 'permitida com condições' publicada na fronteira. Regras locais de posse ou de ordem pública ainda podem existir; elas não fazem parte de nenhum procedimento de importação publicado."
  note:
    en: "Because rules can change and Mauritania publishes little online, confirm your dog's breed and any cross with the DSV before you travel."
    fr: "Les règles pouvant évoluer et la Mauritanie publiant peu en ligne, confirme la race de ton chien et tout croisement auprès de la DSV avant de voyager."
    es: "Como las normas pueden cambiar y Mauritania publica poco en línea, confirma la raza de tu perro y cualquier cruce con la DSV antes de viajar."
    pt: "Como as regras podem mudar e a Mauritânia publica pouco on-line, confirme a raça do seu cachorro e qualquer cruzamento com a DSV antes de viajar."

checklist:
  - en: "Confirm the current procedure with the DSV or a Mauritanian embassy — which certificate model is accepted, and whether an advance import permit or any extra condition applies (Mauritania publishes almost nothing)"
    fr: "Confirme la procédure à jour auprès de la DSV ou d'une ambassade de Mauritanie — quel modèle de certificat est accepté, et si un permis d'importation préalable ou une condition supplémentaire s'applique (la Mauritanie publie presque rien)"
    es: "Confirma el procedimiento vigente con la DSV o una embajada de Mauritania — qué modelo de certificado se acepta y si se aplica un permiso de importación previo o alguna condición adicional (Mauritania publica casi nada)"
    pt: "Confirme o procedimento atual com a DSV ou uma embaixada da Mauritânia — qual modelo de certificado é aceito e se é aplicável uma autorização de importação prévia ou qualquer condição extra (a Mauritânia publica quase nada)"
  - en: "Permanent identification (ISO microchip recommended) placed before the rabies vaccination"
    fr: "Identification permanente (puce ISO recommandée) posée avant la vaccination antirabique"
    es: "Identificación permanente (se recomienda microchip ISO) colocada antes de la vacunación antirrábica"
    pt: "Identificação permanente (microchip ISO recomendado) colocada antes da vacinação antirrábica"
  - en: "Valid rabies vaccination recorded with date, vaccine, batch and validity (primary shot to take effect before travel)"
    fr: "Vaccination antirabique valide consignée avec date, vaccin, lot et validité (primo-vaccination produisant ses effets avant le voyage)"
    es: "Vacunación antirrábica válida registrada con fecha, vacuna, lote y valide (la primovacunación debe surtir efecto antes del viaje)"
    pt: "Vacinação antirrábica válida registrada com data, vacina, lote e validade (a primovacinação deve produzir efeito antes da viagem)"
  - en: "Official international veterinary certificate issued shortly before departure (from the US, APHIS Form 7001 endorsed by APHIS)"
    fr: "Certificat vétérinaire international officiel établi peu avant le départ (depuis les États-Unis, formulaire APHIS 7001 endossé par l'APHIS)"
    es: "Certificado veterinario internacional oficial expedido poco antes de la salida (desde EE. UU., formulario APHIS 7001 refrendado por APHIS)"
    pt: "Certificado veterinário internacional oficial emitido pouco antes da partida (nos EUA, o APHIS Form 7001 endossado pela APHIS)"
  - en: "Up-to-date vaccination records carried with you"
    fr: "Preuves de vaccination à jour emportées avec toi"
    es: "Registros de vacunación al día que lleves contigo"
    pt: "Registros de vacinação atualizados levados com você"
  - en: "Check the certificate is still within its accepted validity window on your arrival date"
    fr: "Vérifie que le certificat est encore dans sa fenêtre de validité acceptée à ta date d'arrivée"
    es: "Comprueba que el certificado sigue dentro de su ventana de valide aceptada en tu fecha de llegada"
    pt: "Verifique se o certificado ainda está dentro da sua janela de validade aceita na data da sua chegada"
  - en: "Original documents ready for a possible border veterinary check and customs"
    fr: "Documents originaux prêts pour un éventuel contrôle vétérinaire frontalier et la douane"
    es: "Documentos originales listos para un posible control veterinario fronterizo y las aduanas"
    pt: "Documentos originais prontos para uma possível verificação veterinária de fronteira e alfândega"
  - en: "If you will return to the EU, plan the rabies antibody test (Mauritania is rabies-endemic and non-listed)"
    fr: "Si tu rentre dans l'UE, prévois le titrage antirabique (la Mauritanie est à rage endémique et non listée)"
    es: "Si vas a regresar a la UE, planifica la prueba de titulación de rabia (Mauritania es de rabia endémica y no está listada)"
    pt: "Se você for retornar à UE, planeje o teste sorológico antirrábico (a Mauritânia é endêmica para a raiva e não listada)"
  - en: "Airline reservation confirming your dog's travel option and suitable IATA crate"
    fr: "Réservation confirmant l'option de transport de ton chien et caisse IATA adaptée"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y jaula IATA adecuada"
    pt: "Reserva na companhia aérea confirmando a opção de transporte do seu cachorro e caixa de transporte adequada às normas da IATA"

