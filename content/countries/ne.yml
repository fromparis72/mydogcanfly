# Country Entry Guide — Niger (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_ne
iso2: "NE"
name: { en: "Niger", fr: "Niger", es: "Níger", pt: "Níger" }
region: { en: "West Africa", fr: "Afrique de l'Ouest", es: "África Occidental", pt: "África Ocidental" }


regime: non_listed
exit:
  authority: DGSV
  authorityUrl: https://agriculture.gouv.ne
  intro:
    en: "Niger is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Direction Générale des Services Vétérinaires (DGSV)."
    fr: "Le Niger est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par la Direction Générale des Services Vétérinaires (DGSV)."
    es: "Níger no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por la Direction Générale des Services Vétérinaires (DGSV)."
    pt: "O Níger é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pela Direction Générale des Services Vétérinaires (DGSV)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "The DGSV veterinary inspection service issues and endorses the export health certificate before departure."
        fr: "Le service d'inspection vétérinaire de la DGSV délivre et vise le certificat sanitaire d'export avant le départ."
        es: "El servicio de inspección veterinaria de la DGSV emite y refrenda el certificado sanitario de exportación antes de salir."
        pt: "O serviço de inspeção veterinária da DGSV emite e endossa o atestado de saúde de exportação antes da partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Niger with your dog", fr: "Voyager au Niger avec ton chien", es: "Viajar a Níger con tu perro", pt: "Viajar para o Níger com seu cachorro" }
  intro:
    en: >-
      Niger admits pet dogs, but it publishes almost nothing about the exact import procedure, so this
      guide stays strictly within what official sources confirm and marks everything else "Unknown"
      rather than guessing. Niger is not part of the EU framework: animal health is overseen by the
      Direction Générale des Services Vétérinaires (DGSV) of the Ministère de l'Agriculture et de
      l'Élevage (MAG/EL), which drafts the legislation on animal health and veterinary public health and
      runs veterinary inspection through its Direction de l'Inspection Vétérinaire (DIV). Niger is a
      landlocked, rabies-endemic Sahel country and a member of the World Organisation for Animal Health
      (WOAH). Unlike neighbouring Mali or Burkina Faso, there is no published USDA/APHIS export
      certificate model for Niger and no online pet-import scheme, so the specific documents, timings,
      import authorization, quarantine, minimum age and breed rules are simply not published. What is
      realistic to expect is that a rabies-endemic third country will want a valid rabies vaccination and
      an official international veterinary certificate, and that the DGSV/DIV can check the animal on
      arrival — but the exact conditions must be confirmed directly with the DGSV or a Niger embassy
      before you book.
    fr: >-
      Le Niger admet les chiens de compagnie, mais publie très peu de détails sur la procédure exacte
      d'importation ; ce guide s'en tient donc strictement à ce que confirment les sources officielles et
      indique « Non communiqué » partout ailleurs plutôt que de deviner. Le Niger ne relève pas du cadre
      de l'UE : la santé animale est supervisée par la Direction Générale des Services Vétérinaires (DGSV)
      du Ministère de l'Agriculture et de l'Élevage (MAG/EL), qui élabore la législation sur la santé
      animale et la santé publique vétérinaire et assure l'inspection vétérinaire via sa Direction de
      l'Inspection Vétérinaire (DIV). Le Niger est un pays sahélien enclavé, à rage endémique, et membre
      de l'Organisation mondiale de la santé animale (OMSA/WOAH). Contrairement au Mali ou au Burkina Faso
      voisins, il n'existe pas de modèle de certificat d'exportation USDA/APHIS publié pour le Niger ni de
      dispositif d'importation d'animaux en ligne : les documents précis, les délais, l'autorisation
      d'importation, la quarantaine, l'âge minimum et les règles de race ne sont tout simplement pas
      publiés. Ce que l'on peut raisonnablement attendre, c'est qu'un pays tiers à rage endémique exige
      une vaccination antirabique valide et un certificat vétérinaire international officiel, et que la
      DGSV/DIV puisse contrôler l'animal à l'arrivée — mais les conditions exactes doivent être confirmées
      directement auprès de la DGSV ou d'une ambassade du Niger avant de réserver.
    es: >-
      Níger admite perros de compañía, pero publica casi nada sobre el procedimiento exacto de
      importación, por lo que esta guía se ciñe estrictamente a lo que confirman las fuentes oficiales e
      indica «Desconocido» en todo lo demás en lugar de suponer. Níger no forma parte del marco de la UE:
      la sanidad animal está supervisada por la Direction Générale des Services Vétérinaires (DGSV) del
      Ministère de l'Agriculture et de l'Élevage (MAG/EL), que elabora la legislación sobre sanidad animal
      y salud pública veterinaria y lleva a cabo la inspección veterinaria a través de su Direction de
      l'Inspection Vétérinaire (DIV). Níger es un país saheliano sin salida al mar, con rabia endémica, y
      miembro de la Organización Mundial de Sanidad Animal (OMSA/WOAH). A diferencia de los vecinos Mali y Burkina
      Faso, no existe un modelo de certificado de exportación USDA/APHIS publicado para Níger ni
      un sistema de importación de animales en línea, por lo que los documentos concretos, los plazos, la
      autorización de importación, la cuarentena, la edad mínima y las reglas de raza simplemente no están
      publicados. Lo realista que cabe esperar es que un país tercero con rabia endémica exija una
      vacunación antirrábica válida y un certificado veterinario internacional oficial, y que la DGSV/DIV
      pueda revisar al animal a la llegada — pero las condiciones exactas deben confirmarse directamente
      con la DGSV o una embajada de Níger antes de reservar.

    pt: "O Níger admite cachorros de estimação, mas publica quase nada sobre o procedimento exato de importação, portanto este guia se atém estritamente ao que as fontes oficiais confirmam e marca tudo o mais como 'não comunicado' em vez de presumir. O Níger não faz parte do quadro da UE: a saúde animal é supervisionada pela Direction Générale des Services Vétérinaires (DGSV) do Ministère de l'Agriculture et de l'Élevage (MAG/EL), que elabora a legislação sobre saúde animal e saúde pública veterinária e conduz a inspeção veterinária por meio de sua Direction de l'Inspection Vétérinaire (DIV). O Níger é um país saheliano sem litoral, com raiva endêmica, e membro da Organização Mundial de Saúde Animal (WOAH). Diferentemente do vizinho Mali ou Burkina Faso, não há um modelo de certificado de exportação USDA/APHIS publicado para o Níger nem um esquema on-line de importação de animais de estimação, portanto os documentos específicos, os prazos, a autorização de importação, a quarentena, a idade mínima e as regras de raça simplesmente não são publicados. O que é realista esperar é que um país terceiro com raiva endêmica exija uma vacinação antirrábica válida e um certificado veterinário internacional oficial, e que a DGSV/DIV possa verificar o animal na chegada — mas as condições exatas devem ser confirmadas diretamente com a DGSV ou com uma embaixada nigerina antes de reservar."
difficulty:
  level: difficult
  label: { en: "Difficult — Niger publishes almost no pet-import procedure; nearly everything must be confirmed with the DGSV", fr: "Difficile — le Niger ne publie presque aucune procédure d'importation d'animaux ; presque tout doit être confirmé auprès de la DGSV", es: "Difícil — Níger publica casi ningún procedimiento de importación de animales; casi todo debe confirmarse con la DGSV", pt: "Difícil — o Níger publica quase nenhum procedimento de importação de animais de estimação; quase tudo deve ser confirmado com a DGSV" }

prepTime:
  eu:
    en: "From the EU: allow several weeks and start early. Have identification and a valid rabies vaccination in order, then contact the DGSV or a Niger embassy in writing to confirm the exact documents, any import authorization and the certificate model, because Niger does not publish a pet-import procedure. An official EU vet issues the international veterinary certificate close to departure."
    fr: "Depuis l'UE : prévois plusieurs semaines et anticipe. Mets en règle l'identification et une vaccination antirabique valide, puis contacte par écrit la DGSV ou une ambassade du Niger pour confirmer les documents exacts, toute autorisation d'importation et le modèle de certificat, le Niger ne publiant pas de procédure d'importation d'animaux. Un vétérinaire officiel de l'UE établit le certificat vétérinaire international peu avant le départ."
    es: "Desde la UE: calcula varias semanas y empieza pronto. Ten en regla la identificación y una vacunación antirrábica válida, y luego contacta por escrito con la DGSV o una embajada de Níger para confirmar los documentos exactos, cualquier autorización de importación y el modelo de certificado, ya que Níger no publica un procedimiento de importación de animales. Un veterinario oficial de la UE expide el certificado veterinario internacional poco antes de la salida."
    pt: "Da UE: reserve várias semanas e comece cedo. Deixe a identificação e a vacinação antirrábica válida em ordem, e depois entre em contato por escrito com a DGSV ou com uma embaixada nigerina para confirmar os documentos exatos, qualquer autorização de importação e o modelo de certificado, já que o Níger não publica um procedimento de importação de animais de estimação. Um veterinário oficial da UE emite o certificado veterinário internacional perto da partida."
  listed:
    en: "From the United States or another third country: there is no published USDA/APHIS certificate model for Niger, so plan extra time to have your government veterinary authority confirm which export certificate applies. If the rabies vaccination is a primary dose, allow it to take effect (commonly at least 21 days) before travel."
    fr: "Depuis les États-Unis ou un autre pays tiers : il n'existe pas de modèle de certificat USDA/APHIS publié pour le Niger ; prévois donc du temps supplémentaire pour que ton autorité vétérinaire gouvernementale confirme le certificat d'exportation applicable. Si la vaccination antirabique est une primo-vaccination, laisse-la produire ses effets (souvent au moins 21 jours) avant le voyage."
    es: "Desde Estados Unidos u otro país tercero: no existe un modelo de certificado USDA/APHIS publicado para Níger, así que reserva tiempo adicional para que tu autoridad veterinaria gubernamental confirme qué certificado de exportación se aplica. Si la vacunación antirrábica es una dosis primaria, deja que produzca sus efectos (por lo común al menos 21 días) antes de viajar."
    pt: "Dos Estados Unidos ou de outro país terceiro: não há um modelo de certificado USDA/APHIS publicado para o Níger, portanto planeje tempo extra para que sua autoridade veterinária governamental confirme qual certificado de exportação se aplica. Se a vacinação antirrábica for uma primovacinação, deixe-a fazer efeito (geralmente pelo menos 21 dias) antes da viagem."
  nonListed:
    en: "Whatever the origin, the limiting steps are the rabies vaccination and obtaining an official international veterinary certificate shortly before departure. Because Niger publishes so little, the single most important step is to contact the DGSV or a Niger embassy early to confirm the full requirement list before booking anything."
    fr: "Quelle que soit l'origine, les étapes limitantes sont la vaccination antirabique et l'obtention d'un certificat vétérinaire international officiel peu avant le départ. Le Niger publiant si peu, l'étape la plus importante est de contacter tôt la DGSV ou une ambassade du Niger pour confirmer la liste complète des exigences avant toute réservation."
    es: "Sea cual sea el origen, los pasos limitantes son la vacunación antirrábica y la obtención de un certificado veterinario internacional oficial poco antes de la salida. Como Níger publica tan poco, el paso más importante es contactar pronto con la DGSV o una embajada de Níger para confirmar la lista completa de requisitos antes de reservar nada."
    pt: "Seja qual for a origem, as etapas limitantes são a vacinação antirrábica e a obtenção de um certificado veterinário internacional oficial pouco antes da partida. Como o Níger publica muito pouco, a etapa mais importante é entrar em contato com a DGSV ou com uma embaixada nigerina com antecedência para confirmar a lista completa de exigências antes de reservar qualquer coisa."

