seo:
  title: { en: "Niger Dog Entry Requirements — Travel Guide", fr: "Formalités d'entrée chien au Niger — Guide", es: "Requisitos de entrada de perros en Níger — Guía de viaje", pt: "Exigências de Entrada de Cachorros no Níger — Guia de Viagem" }
  metaTitle: { en: "Taking Your Dog to Niger: Pet Travel Requirements 2026", fr: "Voyager au Niger avec ton chien : formalités (2026)", es: "Viajar a Níger con tu perro: requisitos de entrada (2026)", pt: "Levar seu cachorro para o Níger: exigências de entrada 2026" }
  metaDesc:
    en: "Official framework for bringing a dog into Niger: the DGSV veterinary authority. Niger publishes almost no procedure — sourced and dated."
    fr: "Cadre officiel pour faire entrer un chien au Niger : autorité vétérinaire DGSV. Le Niger ne publie presque aucune procédure — sourcé et daté."
    es: "Marco oficial para traer un perro a Níger: autoridad DGSV, vacunación antirrábica y certificado veterinario previstos. Níger publica poco — con fuentes y fecha."
    pt: "Quadro oficial para levar um cachorro ao Níger: a autoridade veterinária DGSV. O Níger publica quase nenhum procedimento — com fontes e data."
