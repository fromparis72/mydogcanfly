notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Niger publishes almost nothing about pet import, so only a veterinarian and the DGSV can confirm the exact, current procedure for your individual dog — treat every point below as provisional until the DGSV confirms it."
    fr: "Le Niger publie presque rien sur l'importation d'animaux ; seuls un vétérinaire et la DGSV peuvent confirmer la procédure exacte et à jour pour ton chien — considère chaque point ci-dessous comme provisoire tant que la DGSV ne l'a pas confirmé."
    es: "Níger publica casi nada sobre la importación de animales, por lo que solo un veterinario y la DGSV pueden confirmar el procedimiento exacto y actual para tu perro — considera cada punto de abajo como provisional hasta que la DGSV lo confirme."
    pt: "O Níger publica quase nada sobre a importação de animais de estimação, portanto só um veterinário e a DGSV podem confirmar o procedimento exato e atual para o seu cachorro — trate cada ponto abaixo como provisório até que a DGSV o confirme."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Niger (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — le Niger (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Níger (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — o Níger (seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Niger", fr: "Pays de destination — Niger", es: "País de destino — Níger", pt: "País de destino — Níger" }
      text:
        en: "Niger sits outside the EU framework and its animal health is overseen by the DGSV of the Ministère de l'Agriculture et de l'Élevage, with veterinary inspection run by the Direction de l'Inspection Vétérinaire (DIV). Niger does not publish an online pet-import procedure and there is no USDA/APHIS certificate model for it, so the specific documents, an import authorization, quarantine, minimum age and breed rules are unpublished and must be confirmed directly with the DGSV."
        fr: "Le Niger se situe hors du cadre de l'UE et sa santé animale est supervisée par la DGSV du Ministère de l'Agriculture et de l'Élevage, l'inspection vétérinaire étant assurée par la Direction de l'Inspection Vétérinaire (DIV). Le Niger ne publie pas de procédure d'importation d'animaux en ligne et il n'existe pas de modèle de certificat USDA/APHIS pour lui : les documents précis, une autorisation d'importation, la quarantaine, l'âge minimum et les règles de race ne sont pas publiés et doivent être confirmés directement auprès de la DGSV."
        es: "Níger se sitúa fuera del marco de la UE y su sanidad animal está supervisada por la DGSV del Ministère de l'Agriculture et de l'Élevage, con la inspección veterinaria a cargo de la Direction de l'Inspection Vétérinaire (DIV). Níger no publica un procedimiento de importación de animales en línea y no existe un modelo de certificado USDA/APHIS para él, por lo que los documentos concretos, una autorización de importación, la cuarentena, la edad mínima y las reglas de raza no están publicados y deben confirmarse directamente con la DGSV."
        pt: "O Níger está fora do quadro da UE, e sua saúde animal é supervisionada pela DGSV do Ministère de l'Agriculture et de l'Élevage, com a inspeção veterinária conduzida pela Direction de l'Inspection Vétérinaire (DIV). O Níger não publica um procedimento on-line de importação de animais de estimação, e não há um modelo de certificado USDA/APHIS para ele, portanto os documentos específicos, uma autorização de importação, a quarentena, a idade mínima e as regras de raça não são publicados e devem ser confirmados diretamente com a DGSV."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The international veterinary certificate is issued by a government-accredited vet in the country of departure, using that country's official model. Because there is no published Niger-specific certificate, your government veterinary authority must confirm which export certificate to use and how the rabies vaccination is documented. The country of departure therefore shapes the exact paperwork Niger's services will see."
        fr: "Le certificat vétérinaire international est établi par un vétérinaire accrédité du pays de départ, selon le modèle officiel de ce pays. En l'absence de certificat propre au Niger publié, ton autorité vétérinaire gouvernementale doit confirmer le certificat d'exportation à utiliser et la façon de documenter la vaccination antirabique. Le pays de départ conditionne donc les documents exacts que verront les services nigériens."
        es: "El certificado veterinario internacional lo expide un veterinario acreditado por el gobierno en el país de salida, usando el modelo oficial de ese país. Como no hay un certificado propio de Níger publicado, tu autoridad veterinaria gubernamental debe confirmar qué certificado de exportación usar y cómo se documenta la vacunación antirrábica. El país de salida condiciona, por tanto, la documentación exacta que verán los servicios nigerinos."
        pt: "O certificado veterinário internacional é emitido por um veterinário credenciado pelo governo no país de partida, usando o modelo oficial desse país. Como não há um certificado específico publicado para o Níger, sua autoridade veterinária governamental deve confirmar qual certificado de exportação usar e como a vacinação antirrábica é documentada. O país de partida, portanto, molda a documentação exata que os serviços do Níger verão."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "Your dog's rabies history and recent country of residence matter to the veterinary services, not only the last airport. A stay in a rabies-risk country can affect the evidence required. Note that Niger is itself rabies-endemic, treated by the EU as a non-listed (unfavourable) third country, which matters for any later return to the EU."
        fr: "L'historique antirabique et le pays de résidence récent de ton chien comptent pour les services vétérinaires, pas seulement l'aéroport de destination finale. Un séjour dans un pays à risque rabique peut influer sur les preuves exigées. Note que le Niger est lui-même à rage endémique, traité par l'UE comme un pays tiers non listé (situation défavorable), ce qui compte pour un éventuel retour ultérieur vers l'UE."
        es: "El historial antirrábico y el país de residencia reciente de tu perro importan a los servicios veterinarios, no solo el último aeropuerto. Una estancia en un país con riesgo de rabia puede afectar a las pruebas exigidas. Ten en cuenta que Níger es en sí mismo un país con rabia endémica, tratado por la UE como un país tercero no listado (situación desfavorable), lo que importa para cualquier regreso posterior a la UE."
        pt: "O histórico de raiva do seu cachorro e o país de residência recente importam para os serviços veterinários, não apenas o último aeroporto. Uma estadia em um país de risco de raiva pode afetar as comprovações exigidas. Observe que o próprio Níger tem raiva endêmica, tratado pela UE como país terceiro não listado (desfavorável), o que importa para uma eventual volta à UE."
  note:
    en: "So read the requirements below as an expected baseline, not a published procedure. Verify every point — documents, timings, import authorization — and your dog's exact origin, length of stay and history with your vet and the DGSV before booking."
    fr: "Lis donc les exigences ci-dessous comme un socle attendu, non comme une procédure publiée. Vérifie chaque point — documents, délais, autorisation d'importation — ainsi que l'origine, la durée du séjour et l'historique exacts de ton chien auprès de ton vétérinaire et de la DGSV avant de réserver."
    es: "Así que lee los requisitos siguientes como una base prevista, no como un procedimiento publicado. Verifica cada punto — documentos, plazos, autorización de importación — y el origen, la duración de la estancia y el historial exactos de tu perro con tu veterinario y la DGSV antes de reservar."
    pt: "Portanto, leia as exigências abaixo como uma base esperada, não um procedimento publicado. Verifique cada ponto — documentos, prazos, autorização de importação — e a origem exata, o tempo de estadia e o histórico do seu cachorro com seu veterinário e com a DGSV antes de reservar."

requirements:
  - item: { en: "Advance import authorization", fr: "Autorisation préalable d'importation", es: "Autorización previa de importación", pt: "Autorização de importação prévia" }
    required: { en: "Not published", fr: "Non communiqué", es: "No publicado", pt: "Não publicado" }
    when: { en: "Niger does not publish an online pet-import authorization procedure. Because the DGSV drafts and applies the animal-health regulations, an authorization or prior notification could apply — this is an absence of published rule, not a confirmation that none exists. Confirm directly with the DGSV or a Niger embassy before travel.", fr: "Le Niger ne publie pas de procédure d'autorisation d'importation d'animaux en ligne. La DGSV élaborant et appliquant la réglementation de santé animale, une autorisation ou une notification préalable pourrait s'appliquer — c'est une absence de règle publiée, non une confirmation qu'aucune n'existe. À confirmer directement auprès de la DGSV ou d'une ambassade du Niger avant le voyage.", es: "Níger no publica un procedimiento de autorización de importación de animales en línea. Como la DGSV elabora y aplica la reglamentación de sanidad animal, podría aplicarse una autorización o una notificación previa — se trata de una ausencia de regla publicada, no de una confirmación de que no exista ninguna. Confírmalo directamente con la DGSV o una embajada de Níger antes del viaje.", pt: "O Níger não publica on-line um procedimento de autorização de importação de animais de estimação. Como a DGSV elabora e aplica os regulamentos de saúde animal, uma autorização ou notificação prévia pode se aplicar — isso é a ausência de uma regra publicada, não a confirmação de que nenhuma existe. Confirme diretamente com a DGSV ou com uma embaixada nigerina antes de viajar." }
    exceptions: { en: "Unknown — the DGSV may set conditions case by case.", fr: "Non communiqué — la DGSV peut fixer des conditions au cas par cas.", es: "Desconocido — la DGSV puede fijar condiciones caso por caso.", pt: "Não comunicado — a DGSV pode definir condições caso a caso." }
    ref: { en: "Niger DGSV (MAG/EL) — animal-health regulation authority; no published pet-import authorization procedure", fr: "DGSV Niger (MAG/EL) — autorité de réglementation de la santé animale ; aucune procédure d'autorisation d'importation d'animaux publiée", es: "DGSV de Níger (MAG/EL) — autoridad de reglamentación de la sanidad animal; ningún procedimiento de autorización de importación de animales publicado", pt: "Niger DGSV (MAG/EL) — autoridade de regulamentação da saúde animal; nenhum procedimento de autorização de importação de animais de estimação publicado" }
  - item: { en: "Identification (microchip)", fr: "Identification (puce)", es: "Identificación (microchip)", pt: "Identificação (microchip)" }
    required: { en: "Not published (ISO microchip recommended)", fr: "Non communiqué (puce ISO recommandée)", es: "No publicado (se recomienda microchip ISO)", pt: "Não publicado (microchip ISO recomendado)" }
    when: { en: "Niger does not publish a stand-alone microchip requirement for pet dogs. A permanent identification is the practical standard for international travel and an ISO 11784/11785 microchip is needed for any later return to the EU, so an ISO microchip placed before the rabies vaccination is strongly recommended even though Niger does not publish the rule.", fr: "Le Niger ne publie pas d'exigence spécifique de puce pour les chiens de compagnie. Une identification permanente est le standard en pratique pour un voyage international et une puce ISO 11784/11785 est nécessaire pour un retour ultérieur vers l'UE ; une puce ISO posée avant la vaccination antirabique est donc fortement recommandée même si le Niger ne publie pas la règle.", es: "Níger no publica un requisito específico de microchip para los perros de compañía. Una identificación permanente es el estándar en la práctica para el viaje internacional y un microchip ISO 11784/11785 es necesario para cualquier regreso posterior a la UE, por lo que se recomienda encarecidamente un microchip ISO implantado antes de la vacunación antirrábica, aunque Níger no publique la regla.", pt: "O Níger não publica uma exigência isolada de microchip para cachorros de estimação. Uma identificação permanente é o padrão prático para viagens internacionais, e um microchip ISO 11784/11785 é necessário para uma eventual volta à UE, portanto um microchip ISO implantado antes da vacinação antirrábica é fortemente recomendado, mesmo que o Níger não publique a regra." }
    exceptions: { en: "Unknown — confirm what identification the DGSV accepts.", fr: "Non communiqué — confirme l'identification acceptée par la DGSV.", es: "Desconocido — confirma qué identificación acepta la DGSV.", pt: "Não comunicado — confirme qual identificação a DGSV aceita." }
    ref: { en: "No published Nigerien microchip rule; ISO 11784/11785 recommended (EU standard for return)", fr: "Aucune règle de puce nigérienne publiée ; ISO 11784/11785 recommandée (standard UE pour le retour)", es: "Ninguna regla de microchip nigerina publicada; ISO 11784/11785 recomendada (estándar de la UE para el regreso)", pt: "Nenhuma regra nigerina de microchip publicada; ISO 11784/11785 recomendado (padrão da UE para a volta)" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Expected; specific rule not published", fr: "Attendue ; règle précise non communiquée", es: "Prevista; regla concreta no publicada", pt: "Esperada; regra específica não publicada" }
    when: { en: "Niger is rabies-endemic, so a valid rabies vaccination is the realistic baseline for a dog entering the country, recorded with vaccine name, date, batch number and validity. Where it is a primary vaccination, allow it to take effect before travel (commonly at least 21 days). Niger does not publish the exact validity window or timing, so confirm it with the DGSV and your official vet.", fr: "Le Niger est à rage endémique ; une vaccination antirabique valide est donc le socle réaliste pour un chien entrant dans le pays, consignée avec le nom du vaccin, la date, le numéro de lot et la validité. S'il s'agit d'une primo-vaccination, laisse-la produire ses effets avant le voyage (souvent au moins 21 jours). Le Niger ne publie pas la fenêtre de validité ou le délai exacts ; confirme-les auprès de la DGSV et de ton vétérinaire officiel.", es: "Níger tiene rabia endémica, por lo que una vacunación antirrábica válida es la base realista para un perro que entra en el país, registrada con el nombre de la vacuna, la fecha, el número de lote y la valide. Cuando se trate de una primovacunación, deja que produzca sus efectos antes de viajar (por lo común al menos 21 días). Níger no publica la ventana de valide ni el plazo exactos, así que confírmalos con la DGSV y tu veterinario oficial.", pt: "O Níger tem raiva endêmica, portanto uma vacinação antirrábica válida é a base realista esperada para um cachorro que entra no país, registrada com o nome da vacina, data, número do lote e validade. Quando se tratar de uma primovacinação, deixe-a fazer efeito antes da viagem (geralmente pelo menos 21 dias). O Níger não publica a janela exata de validade ou o prazo, portanto confirme com a DGSV e com seu veterinário oficial." }
    exceptions: { en: "A dog too young to be validly vaccinated cannot meet a rabies requirement.", fr: "Un chien trop jeune pour être valablement vacciné ne peut satisfaire une exigence antirabique.", es: "Un perro demasiado joven para estar válidamente vacunado no puede cumplir un requisito antirrábico.", pt: "Um cachorro jovem demais para ser validamente vacinado não pode cumprir uma exigência relativa à raiva." }
    ref: { en: "Niger: WOAH member, rabies-endemic; specific national import timing not published — confirm with DGSV", fr: "Niger : membre de l'OMSA/WOAH, à rage endémique ; délai national précis d'importation non publié — à confirmer auprès de la DGSV", es: "Níger: miembro de la OMSA/WOAH, con rabia endémica; plazo nacional concreto de importación no publicado — confirmar con la DGSV", pt: "Níger: membro da WOAH, raiva endêmica; prazo nacional de importação específico não publicado — confirme com a DGSV" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not published for entry", fr: "Non communiqué pour l'entrée", es: "No publicado para la entrada", pt: "Não publicado para a entrada" }
    when: { en: "No rabies antibody test for import into Niger is published in official Nigerien sources. (A rabies antibody test may still be relevant for a later return to the EU, because Niger is rabies-endemic and treated as a non-listed third country.)", fr: "Aucun titrage des anticorps antirabiques pour l'importation au Niger n'est publié dans les sources officielles nigériennes. (Un titrage peut toutefois rester pertinent pour un retour ultérieur vers l'UE, le Niger étant à rage endémique et traité comme un pays tiers non listé.)", es: "No hay ninguna prueba de titulación de rabia para la importación a Níger publicada en fuentes oficiales nigerinas. (Una prueba de titulación de rabia puede seguir siendo relevante para un regreso posterior a la UE, porque Níger tiene rabia endémica y se trata como un país tercero no listado.)", pt: "Nenhum teste sorológico antirrábico para a importação no Níger é publicado em fontes oficiais nigerinas. (Um teste sorológico antirrábico ainda pode ser relevante para uma volta futura à UE, pois o Níger tem raiva endêmica e é tratado como país terceiro não listado.)" }
    exceptions: { en: "Unknown for special cases — confirm with the DGSV, as conditions can differ by the dog's origin and rabies history.", fr: "Non communiqué pour les cas particuliers — à confirmer auprès de la DGSV, les conditions pouvant varier selon l'origine et l'historique rabique du chien.", es: "Desconocido para los casos particulares — confírmalo con la DGSV, ya que las condiciones pueden variar según el origen y el historial antirrábico del perro.", pt: "Não comunicado para casos especiais — confirme com a DGSV, pois as condições podem variar conforme a origem e o histórico de raiva do cachorro." }
    ref: { en: "No published Nigerien antibody-test requirement for entry", fr: "Aucune exigence de titrage nigérienne publiée pour l'entrée", es: "Ninguna exigencia de prueba de titulación nigerina publicada para la entrada", pt: "Nenhuma exigência nigerina de teste sorológico publicada para a entrada" }
  - item: { en: "International veterinary certificate", fr: "Certificat vétérinaire international", es: "Certificado veterinario internacional", pt: "Certificado veterinário internacional" }
    required: { en: "Expected; no published Niger model", fr: "Attendu ; aucun modèle nigérien publié", es: "Previsto; sin modelo nigerino publicado", pt: "Esperado; nenhum modelo nigerino publicado" }
    when: { en: "An official international veterinary certificate issued by a government-accredited vet close to departure is the realistic baseline, certifying identification, rabies vaccination and clinical health. Unlike Mali or Burkina Faso, there is no published USDA/APHIS certificate model for Niger, so your government veterinary authority must confirm which export certificate to use. French is the working language of Niger's administration, so a French-language certificate is appropriate.", fr: "Un certificat vétérinaire international officiel établi par un vétérinaire accrédité peu avant le départ est le socle réaliste, attestant l'identification, la vaccination antirabique et l'état clinique. Contrairement au Mali ou au Burkina Faso, il n'existe pas de modèle de certificat USDA/APHIS publié pour le Niger ; ton autorité vétérinaire gouvernementale doit donc confirmer le certificat d'exportation à utiliser. Le français étant la langue de travail de l'administration nigérienne, un certificat en français est adapté.", es: "Un certificado veterinario internacional oficial expedido por un veterinario acreditado por el gobierno poco antes de la salida es la base realista, que certifica la identificación, la vacunación antirrábica y el estado clínico de salud. A diferencia de Mali o Burkina Faso, no existe un modelo de certificado USDA/APHIS publicado para Níger, así que tu autoridad veterinaria gubernamental debe confirmar qué certificado de exportación usar. El francés es la lengua de trabajo de la administración nigerina, por lo que un certificado en francés es adecuado.", pt: "Um certificado veterinário internacional oficial, emitido por um veterinário credenciado pelo governo perto da partida, é a base realista esperada, certificando a identificação, a vacinação antirrábica e a saúde clínica. Diferentemente do Mali ou de Burkina Faso, não há um modelo de certificado USDA/APHIS publicado para o Níger, portanto sua autoridade veterinária governamental deve confirmar qual certificado de exportação usar. O francês é o idioma de trabalho da administração nigerina, portanto um certificado em francês é apropriado." }
    exceptions: { en: "Unknown — the exact model, validity window and endorsement are not published; confirm with the DGSV and your veterinary authority.", fr: "Non communiqué — le modèle exact, la fenêtre de validité et le visa ne sont pas publiés ; à confirmer auprès de la DGSV et de ton autorité vétérinaire.", es: "Desconocido — el modelo exacto, la ventana de valide y el refrendo no están publicados; confírmalo con la DGSV y tu autoridad veterinaria.", pt: "Não comunicado — o modelo exato, a janela de validade e o endosso não são publicados; confirme com a DGSV e com sua autoridade veterinária." }
    ref: { en: "No USDA/APHIS Niger certificate published (not in the APHIS export country list); confirm certificate with DGSV", fr: "Aucun certificat USDA/APHIS Niger publié (absent de la liste des pays d'exportation APHIS) ; certificat à confirmer auprès de la DGSV", es: "Ningún certificado USDA/APHIS para Níger publicado (ausente de la lista de países de exportación de APHIS); confirmar el certificado con la DGSV", pt: "Nenhum certificado USDA/APHIS para o Níger publicado (não consta na lista de países de exportação da APHIS); confirme o certificado com a DGSV" }
  - item: { en: "Parasite / tapeworm treatment", fr: "Traitement antiparasitaire / échinocoque", es: "Tratamiento antiparasitario / contra la tenia", pt: "Tratamento antiparasitário / contra tênias" }
    required: { en: "Not published as mandatory", fr: "Non communiqué comme obligatoire", es: "No publicado como obligatorio", pt: "Não publicado como obrigatório" }
    when: { en: "Niger does not publish a mandatory internal or external parasite treatment for personal pet dogs entering the country. A vet may still recommend treatments as good practice.", fr: "Le Niger ne publie pas de traitement antiparasitaire interne ou externe obligatoire pour les chiens de compagnie personnels entrant dans le pays. Un vétérinaire peut néanmoins recommander des traitements en bonne pratique.", es: "Níger no publica un tratamiento antiparasitario interno o externo obligatorio para los perros de compañía personales que entran en el país. Un veterinario puede, no obstante, recomendar tratamientos como buena práctica.", pt: "O Níger não publica um tratamento antiparasitário interno ou externo obrigatório para cachorros de estimação pessoais que entram no país. Um veterinário ainda pode recomendar tratamentos como boa prática." }
    exceptions: { en: "Unknown — confirm any requirement with the DGSV.", fr: "Non communiqué — confirme toute exigence auprès de la DGSV.", es: "Desconocido — confirma cualquier requisito con la DGSV.", pt: "Não comunicado — confirme qualquer exigência com a DGSV." }
    ref: { en: "No published Nigerien mandatory parasite-treatment rule for pet import", fr: "Aucune règle nigérienne de traitement antiparasitaire obligatoire publiée pour l'importation d'animaux", es: "Ninguna regla nigerina de tratamiento antiparasitario obligatorio publicada para la importación de animales", pt: "Nenhuma regra nigerina obrigatória de tratamento antiparasitário publicada para a importação de animais de estimação" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Not published (linked to rabies)", fr: "Non communiqué (lié à la rage)", es: "No publicado (vinculado a la rabia)", pt: "Não publicado (vinculado à raiva)" }
    when: { en: "Niger does not publish a stand-alone minimum age. In practice, a puppy must be old enough to be validly vaccinated against rabies (commonly about 3 months / 12 weeks) with the vaccination effective before travel.", fr: "Le Niger ne publie pas d'âge minimum distinct. En pratique, un chiot doit être en âge d'être valablement vacciné contre la rage (souvent environ 3 mois / 12 semaines), la vaccination devant produire ses effets avant le voyage.", es: "Níger no publica una edad mínima independiente. En la práctica, un cachorro debe tener edad suficiente para estar válidamente vacunado contra la rabia (por lo común alrededor de 3 meses / 12 semanas) con la vacunación surtiendo efecto antes del viaje.", pt: "O Níger não publica uma idade mínima isolada. Na prática, um filhote precisa ter idade suficiente para ser validamente vacinado contra a raiva (geralmente cerca de 3 meses / 12 semanas), com a vacinação em vigor antes da viagem." }
    exceptions: { en: "Puppies too young to be vaccinated cannot meet a rabies requirement — confirm with the DGSV.", fr: "Les chiots trop jeunes pour être vaccinés ne peuvent satisfaire une exigence antirabique — à confirmer auprès de la DGSV.", es: "Los cachorros demasiado jóvenes para ser vacunados no pueden cumplir un requisito antirrábico — confírmalo con la DGSV.", pt: "Filhotes jovens demais para serem vacinados não podem cumprir uma exigência relativa à raiva — confirme com a DGSV." }
    ref: { en: "Derived from the expected rabies-vaccination baseline; no separate Nigerien minimum-age rule published", fr: "Déduit du socle attendu de vaccination antirabique ; aucun âge minimum nigérien distinct publié", es: "Deducido de la base prevista de vacunación antirrábica; ninguna regla de edad mínima nigerina independiente publicada", pt: "Derivada da base esperada de vacinação antirrábica; nenhuma regra nigerina separada de idade mínima publicada" }
  - item: { en: "Border veterinary inspection & customs", fr: "Inspection vétérinaire frontalière et douane", es: "Inspección veterinaria fronteriza y aduanas", pt: "Inspeção veterinária de fronteira e alfândega" }
    required: { en: "Expected — details not published", fr: "Attendue — détails non publiés", es: "Prevista — detalles no publicados", pt: "Prevista — detalhes não publicados" }
    when: { en: "The DGSV, through its Direction de l'Inspection Vétérinaire (DIV), is responsible for veterinary inspection, so the dog and its documents can be checked on arrival by the official veterinary services alongside customs. Niger is landlocked, so a personal pet arrives by air (Niamey) or a land border. Niger does not publish the specific airport pet-check procedure — carry all originals and be ready to present them.", fr: "La DGSV, via sa Direction de l'Inspection Vétérinaire (DIV), est responsable de l'inspection vétérinaire ; le chien et ses documents peuvent donc être contrôlés à l'arrivée par les services vétérinaires officiels, aux côtés de la douane. Le Niger est enclavé : un animal de compagnie personnel arrive par avion (Niamey) ou par une frontière terrestre. Le Niger ne publie pas la procédure spécifique de contrôle des animaux à l'aéroport — garde tous les originaux et sois prêt à les présenter.", es: "La DGSV, a través de su Direction de l'Inspection Vétérinaire (DIV), es responsable de la inspección veterinaria, por lo que el perro y sus documentos pueden ser revisados a la llegada por los servicios veterinarios oficiales junto con las aduanas. Níger no tiene salida al mar, así que una mascota personal llega por avión (Niamey) o por una frontera terrestre. Níger no publica el procedimiento específico de control de animales en el aeropuerto — lleva todos los originales y prepárate para presentarlos.", pt: "A DGSV, por meio de sua Direction de l'Inspection Vétérinaire (DIV), é responsável pela inspeção veterinária, portanto o cachorro e seus documentos podem ser verificados na chegada pelos serviços veterinários oficiais junto com a alfândega. O Níger não tem litoral, portanto um animal de estimação pessoal chega por via aérea (Niamei) ou por uma fronteira terrestre. O Níger não publica o procedimento específico de verificação de animais de estimação no aeroporto — leve todos os originais e esteja pronto para apresentá-los." }
    exceptions: { en: "Unknown — the exact inspection procedure and any fees are not published; confirm with the DGSV.", fr: "Non communiqué — la procédure d'inspection exacte et d'éventuels frais ne sont pas publiés ; à confirmer auprès de la DGSV.", es: "Desconocido — el procedimiento de inspección exacto y las posibles tasas no están publicados; confírmalo con la DGSV.", pt: "Não comunicado — o procedimento exato de inspeção e eventuais taxas não são publicados; confirme com a DGSV." }
    ref: { en: "Niger DGSV / Direction de l'Inspection Vétérinaire (DIV) — veterinary inspection mandate", fr: "DGSV Niger / Direction de l'Inspection Vétérinaire (DIV) — mandat d'inspection vétérinaire", es: "DGSV de Níger / Direction de l'Inspection Vétérinaire (DIV) — mandato de inspección veterinaria", pt: "Niger DGSV / Direction de l'Inspection Vétérinaire (DIV) — mandato de inspeção veterinária" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not published", fr: "Non communiqué", es: "No publicado", pt: "Não publicado" }
    when: { en: "No routine quarantine for compliant personal pet dogs is published by Niger. This is an absence of published rule, not a guarantee — a non-compliant animal could still be held or refused under veterinary control.", fr: "Aucune quarantaine de routine pour les chiens de compagnie personnels conformes n'est publiée par le Niger. C'est une absence de règle publiée, non une garantie — un animal non conforme pourrait néanmoins être retenu ou refusé sous contrôle vétérinaire.", es: "Níger no publica ninguna cuarentena rutinaria para los perros de compañía personales conformes. Se trata de una ausencia de regla publicada, no de una garantía — un animal no conforme podría ser retenido o rechazado bajo control veterinario.", pt: "Nenhuma quarentena sistemática é publicada pelo Níger para cachorros de estimação pessoais em conformidade. Isso é a ausência de uma regra publicada, não uma garantia — um animal em não conformidade ainda pode ser retido ou recusado sob controle veterinário." }
    exceptions: { en: "Non-compliant animals may be refused, returned or held under veterinary control at the owner's expense.", fr: "Les animaux non conformes peuvent être refusés, renvoyés ou placés sous contrôle vétérinaire aux frais du propriétaire.", es: "Los animales no conformes pueden ser rechazados, devueltos o retenidos bajo control veterinario a cargo del propietario.", pt: "Animais em situação irregular podem ser recusados, devolvidos ou retidos sob controle veterinário às custas do dono." }
    ref: { en: "No quarantine rule published on official Nigerien sources", fr: "Aucune règle de quarantaine publiée sur les sources officielles nigériennes", es: "Ninguna regla de cuarentena publicada en las fuentes oficiales nigerinas", pt: "Nenhuma regra de quarentena publicada em fontes oficiais nigerinas" }
  - item: { en: "Banned / restricted breeds", fr: "Races interdites / restreintes", es: "Razas prohibidas / restringidas", pt: "Raças proibidas / restritas" }
    required: { en: "No published breed ban found", fr: "Aucune interdiction par race publiée trouvée", es: "No se encontró prohibición por raza publicada", pt: "Nenhuma proibição de raça publicada encontrada" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "We found no official Nigerien instrument banning or restricting dog breeds at import. This is an absence of published rule, not a guarantee — confirm your dog's breed with the DGSV before travel.", fr: "Nous n'avons trouvé aucun texte officiel nigérien interdisant ou restreignant les races de chiens à l'importation. C'est une absence de règle publiée, non une garantie — confirme la race de ton chien auprès de la DGSV avant de voyager.", es: "No encontramos ningún texto oficial nigerino que prohíba o restrinja las razas de perro en la importación. Se trata de una ausencia de regla publicada, no de una garantía — confirma la raza de tu perro con la DGSV antes de viajar.", pt: "Não encontramos nenhum instrumento oficial nigerino que proíba ou restrinja raças de cachorro na importação. Isso é a ausência de uma regra publicada, não uma garantia — confirme a raça do seu cachorro com a DGSV antes de viajar." }
    ref: { en: "No breed-specific import legislation found on official Nigerien sources", fr: "Aucune législation d'importation par race trouvée sur les sources officielles nigériennes", es: "Ninguna legislación de importación por raza encontrada en las fuentes oficiales nigerinas", pt: "Nenhuma legislação específica por raça encontrada em fontes oficiais nigerinas" }

origin:
  scheme: eu
  eu:
    title: { en: "From the European Union", fr: "Depuis l'Union européenne", es: "Desde la Unión Europea", pt: "Da União Europeia" }
    body:
      en: "For a dog leaving the EU, there is no EU pet-passport shortcut into Niger. The realistic baseline is a permanent identification (an ISO microchip in practice), a valid rabies vaccination recorded in the passport / vaccination booklet, and an international veterinary certificate issued by an official EU vet close to departure. No rabies antibody test is published for entry into Niger. Because Niger publishes almost nothing, confirm with the DGSV or a Niger embassy whether an import authorization or any extra condition applies before you book. On arrival, the veterinary services (DIV) may check the dog and its documents with customs."
      fr: "Pour un chien quittant l'UE, il n'existe pas de raccourci « passeport UE » vers le Niger. Le socle réaliste est une identification permanente (une puce ISO en pratique), une vaccination antirabique valide consignée dans le passeport / carnet de vaccination et un certificat vétérinaire international établi par un vétérinaire officiel de l'UE peu avant le départ. Aucun titrage antirabique n'est publié pour l'entrée au Niger. Le Niger publiant presque rien, confirme auprès de la DGSV ou d'une ambassade du Niger si une autorisation d'importation ou toute condition supplémentaire s'applique avant de réserver. À l'arrivée, les services vétérinaires (DIV) peuvent contrôler le chien et ses documents avec la douane."
      es: "Para un perro que sale de la UE, no hay atajo de «pasaporte europeo para mascotas» para entrar en Níger. La base realista es una identificación permanente (un microchip ISO en la práctica), una vacunación antirrábica válida registrada en el pasaporte / cartilla de vacunación, y un certificado veterinario internacional expedido por un veterinario oficial de la UE poco antes de la salida. No se publica ninguna prueba de titulación de rabia para la entrada a Níger. Como Níger publica casi nada, confirma con la DGSV o una embajada de Níger si se aplica una autorización de importación o cualquier condición adicional antes de reservar. A la llegada, los servicios veterinarios (DIV) pueden revisar al perro y sus documentos junto con las aduanas."
      pt: "Para um cachorro que sai da UE, não existe atalho de passaporte europeu para entrar no Níger. A base realista esperada é uma identificação permanente (um microchip ISO na prática), uma vacinação antirrábica válida registrada no passaporte / carteira de vacinação, e um certificado veterinário internacional emitido por um veterinário oficial da UE perto da partida. Nenhum teste sorológico antirrábico é publicado para a entrada no Níger. Como o Níger publica quase nada, confirme com a DGSV ou com uma embaixada nigerina se é exigida uma autorização de importação ou qualquer condição extra antes de reservar. Na chegada, os serviços veterinários (DIV) podem verificar o cachorro e seus documentos junto com a alfândega."
    cls: warn
  listed:
    title: { en: "From the United States & other third countries", fr: "Depuis les États-Unis et autres pays tiers", es: "Desde Estados Unidos y otros países terceros", pt: "Dos Estados Unidos e de outros países terceiros" }
    body:
      en: "From a non-EU country the baseline is the same — a permanent identification, a valid rabies vaccination and an original international veterinary certificate issued by a government-accredited vet close to departure. Unlike Mali or Burkina Faso, USDA/APHIS does not publish a Niger certificate model, so from the US your USDA-accredited vet and APHIS must confirm which export certificate applies before endorsement. From elsewhere, use your own country's official export model confirmed by the government veterinary authority, and confirm any additional Nigerien condition with the DGSV."
      fr: "Depuis un pays hors UE, le socle est identique — une identification permanente, une vaccination antirabique valide et l'original d'un certificat vétérinaire international établi par un vétérinaire accrédité peu avant le départ. Contrairement au Mali ou au Burkina Faso, l'USDA/APHIS ne publie pas de modèle de certificat pour le Niger ; depuis les USA, ton vétérinaire agréé USDA et l'APHIS doivent donc confirmer le certificat d'exportation applicable avant tout visa. Depuis ailleurs, utilise le modèle d'exportation officiel de ton pays validé par l'autorité vétérinaire gouvernementale, et confirme toute condition nigérienne supplémentaire auprès de la DGSV."
      es: "Desde un país fuera de la UE, la base es la misma — una identificación permanente, una vacunación antirrábica válida y el original de un certificado veterinario internacional expedido por un veterinario acreditado por el gobierno poco antes de la salida. A diferencia de Mali o Burkina Faso, el USDA/APHIS no publica un modelo de certificado para Níger, así que desde EE. UU. tu veterinario acreditado por el USDA y el APHIS deben confirmar qué certificado de exportación se aplica antes del refrendo. Desde otros lugares, usa el modelo de exportación oficial de tu propio país confirmado por la autoridad veterinaria gubernamental, y confirma cualquier condición nigerina adicional con la DGSV."
      pt: "Vindo de um país fora da UE, a base é a mesma — uma identificação permanente, uma vacinação antirrábica válida e um certificado veterinário internacional original emitido por um veterinário credenciado pelo governo perto da partida. Diferentemente do Mali ou de Burkina Faso, a USDA/APHIS não publica um modelo de certificado para o Níger, portanto, a partir dos EUA, seu veterinário credenciado pela USDA e a APHIS devem confirmar qual certificado de exportação se aplica antes do endosso. De outro lugar, use o modelo oficial de exportação do seu próprio país, confirmado pela autoridade veterinária governamental, e confirme qualquer condição nigerina adicional com a DGSV."
    cls: warn
  nonListed:
    title: { en: "Rabies history & special cases", fr: "Historique rabique et cas particuliers", es: "Historial antirrábico y casos particulares", pt: "Histórico de raiva e casos particulares" }
    body:
      en: "Niger does not publish a separate at-risk-country track or a rabies antibody test for personal pets entering the country, but as a rabies-endemic state its veterinary services focus on the dog's rabies status and origin, and the DGSV can attach conditions case by case. If your dog has stayed in a high-risk country, confirm directly with the DGSV what evidence will be required before you travel. Because Niger is itself rabies-endemic and treated by the EU as a non-listed third country, plan the rabies antibody test now if you intend to bring the dog back into the EU later."
      fr: "Le Niger ne publie pas de parcours distinct pour les pays à risque ni de titrage antirabique pour les animaux personnels entrant dans le pays, mais, en tant qu'État à rage endémique, ses services vétérinaires se concentrent sur le statut rabique et l'origine du chien, et la DGSV peut assortir l'entrée de conditions au cas par cas. Si ton chien a séjourné dans un pays à haut risque, confirme directement auprès de la DGSV les preuves exigées avant de voyager. Le Niger étant lui-même à rage endémique et traité par l'UE comme un pays tiers non listé, prévois dès maintenant le titrage antirabique si tu compte ramener le chien dans l'UE plus tard."
      es: "Níger no publica un itinerario aparte para los países de riesgo ni una prueba de titulación de rabia para las mascotas personales que entran en el país, pero, como Estado con rabia endémica, sus servicios veterinarios se centran en el estado antirrábico y el origen del perro, y la DGSV puede añadir condiciones caso por caso. Si tu perro ha estado en un país de alto riesgo, confirma directamente con la DGSV qué pruebas se exigirán antes de viajar. Como Níger es en sí mismo un país con rabia endémica y la UE lo trata como un país tercero no listado, planifica ya la prueba de titulación de rabia si tienes intención de traer al perro de vuelta a la UE más adelante."
      pt: "O Níger não publica uma via separada para países de risco nem um teste sorológico antirrábico para animais de estimação pessoais que entram no país, mas, por ser um estado com raiva endêmica, seus serviços veterinários se concentram no status de raiva e na origem do cachorro, e a DGSV pode acrescentar condições caso a caso. Se seu cachorro esteve em um país de alto risco, confirme diretamente com a DGSV quais comprovações serão exigidas antes de viajar. Como o próprio Níger tem raiva endêmica e é tratado pela UE como país terceiro não listado, planeje já o teste sorológico antirrábico (titulação) se pretende levar o cachorro de volta à UE mais tarde."
    cls: neutral

arrival:
  intro:
    en: "What happens when your dog reaches Niger is not published in detail, so prepare a complete, valid document set and expect an official check. Niger is landlocked, so entry is by air (Niamey) or a land border."
    fr: "Ce qui se passe à l'arrivée de ton chien au Niger n'est pas publié en détail ; prépare donc un dossier complet et valide et attends-toi à un contrôle officiel. Le Niger est enclavé : l'entrée se fait par avion (Niamey) ou par une frontière terrestre."
    es: "Lo que ocurre cuando tu perro llega a Níger no se publica en detalle, así que prepara un conjunto de documentos completo y válido y cuenta con un control oficial. Níger no tiene salida al mar, por lo que la entrada se realiza por avión (Niamey) o por una frontera terrestre."
    pt: "O que acontece quando seu cachorro chega ao Níger não é publicado em detalhes, portanto prepare um conjunto completo e válido de documentos e espere uma verificação oficial. O Níger não tem litoral, portanto a entrada é por via aérea (Niamei) ou por uma fronteira terrestre."
  points:
    - en: "The DGSV, through its Direction de l'Inspection Vétérinaire (DIV), is responsible for veterinary inspection, so your dog and documents can be checked on arrival alongside customs."
      fr: "La DGSV, via sa Direction de l'Inspection Vétérinaire (DIV), est responsable de l'inspection vétérinaire ; ton chien et tes documents peuvent donc être contrôlés à l'arrivée, aux côtés de la douane."
      es: "La DGSV, a través de su Direction de l'Inspection Vétérinaire (DIV), es responsable de la inspección veterinaria, por lo que tu perro y tus documentos pueden ser revisados a la llegada junto con las aduanas."
      pt: "A DGSV, por meio de sua Direction de l'Inspection Vétérinaire (DIV), é responsável pela inspeção veterinária, portanto seu cachorro e seus documentos podem ser verificados na chegada junto com a alfândega."
    - en: "Present the originals: the international veterinary certificate, proof of identification and proof of a valid rabies vaccination."
      fr: "Présente les originaux : le certificat vétérinaire international, la preuve d'identification et la preuve d'une vaccination antirabique valide."
      es: "Presenta los originales: el certificado veterinario internacional, la prueba de identificación y la prueba de una vacunación antirrábica válida."
      pt: "Apresente os originais: o certificado veterinário internacional, a comprovação de identificação e a comprovação da vacinação antirrábica válida."
    - en: "Documents must be consistent — identification, vaccination and health statements should match across the certificate and the vaccination record."
      fr: "Les documents doivent être cohérents — l'identification, la vaccination et les mentions sanitaires doivent concorder entre le certificat et le carnet de vaccination."
      es: "Los documentos deben ser coherentes — la identificación, la vacunación y las declaraciones de salud deben concordar entre el certificado y la cartilla de vacunación."
      pt: "Os documentos devem ser coerentes entre si — a identificação, a vacinação e as declarações de saúde devem corresponder entre o certificado e a caderneta de vacinação."
    - en: "If documents are missing or invalid, the animal may be refused entry, returned or held under veterinary control — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, l'animal peut être refusé, renvoyé ou placé sous contrôle vétérinaire — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, se puede denegar la entrada al animal, devolverlo o retenerlo bajo control veterinario — a cargo del propietario."
      pt: "Se faltarem documentos ou eles forem inválidos, o animal pode ter a entrada recusada, ser devolvido ou ficar retido sob controle veterinário — às custas do dono."
    - en: "Because the exact airport procedure and any fees are not published, confirm the arrival formalities with the DGSV or a Niger embassy before you travel, and carry a full set of originals throughout the journey."
      fr: "La procédure exacte à l'aéroport et d'éventuels frais n'étant pas publiés, confirme les formalités d'arrivée auprès de la DGSV ou d'une ambassade du Niger avant de voyager, et garde un jeu complet d'originaux durant tout le trajet."
      es: "Como el procedimiento exacto en el aeropuerto y las posibles tasas no están publicados, confirma las formalidades de llegada con la DGSV o una embajada de Níger antes de viajar, y lleva un juego completo de originales durante todo el trayecto."
      pt: "Como o procedimento exato do aeroporto e eventuais taxas não são publicados, confirme as formalidades de chegada com a DGSV ou com uma embaixada nigerina antes de viajar, e leve um conjunto completo de originais durante toda a viagem."

travellerExperience: null

restrictedDogs:
  intro:
    en: "No breed-specific import ban for dogs is published on Niger's official veterinary or government sources. Entry is framed by health requirements (identification, rabies vaccination, veterinary certificate) rather than by a published national list of prohibited breeds — but because Niger publishes so little, treat this as unconfirmed."
    fr: "Aucune interdiction d'importation par race pour les chiens n'est publiée sur les sources officielles vétérinaires ou gouvernementales du Niger. L'entrée est encadrée par les exigences sanitaires (identification, vaccination antirabique, certificat vétérinaire) plutôt que par une liste nationale de races interdites publiée — mais le Niger publiant si peu, considère ce point comme non confirmé."
    es: "En las fuentes oficiales veterinarias o gubernamentales de Níger no se publica ninguna prohibición de importación por raza para los perros. La entrada se enmarca en los requisitos sanitarios (identificación, vacunación antirrábica, certificado veterinario) y no en una lista nacional publicada de razas prohibidas — pero, como Níger publica tan poco, considera esto como no confirmado."
    pt: "Nenhuma proibição de importação por raça de cachorro é publicada nas fontes veterinárias ou governamentais oficiais do Níger. A entrada é enquadrada pelas exigências sanitárias (identificação, vacinação antirrábica, certificado veterinário), e não por uma lista nacional publicada de raças proibidas — mas, como o Níger publica muito pouco, trate isso como não confirmado."
  cat1:
    en: "We found no official Nigerien instrument banning breeds such as pit bull types from import. This is an absence of published rule rather than a positive authorisation of any specific breed."
    fr: "Nous n'avons trouvé aucun texte officiel nigérien interdisant à l'importation des races comme les types pit-bull. Il s'agit d'une absence de règle publiée, et non d'une autorisation expresse d'une race précise."
    es: "No encontramos ningún texto oficial nigerino que prohíba a la importación razas como los tipos pit bull. Se trata de una ausencia de regla publicada y no de una autorización expresa de ninguna raza concreta."
    pt: "Não encontramos nenhum instrumento oficial nigerino que proíba a importação de raças como os tipos pit bull. Isso é a ausência de uma regra publicada, e não uma autorização positiva de nenhuma raça específica."
  cat2:
    en: "There is likewise no published lighter 'permitted with conditions' breed category at the border. Local ownership or public-order rules could still exist; they are not part of any published import procedure."
    fr: "Il n'existe de même aucune catégorie allégée « autorisée sous conditions » publiée à la frontière. Des règles locales de détention ou d'ordre public pourraient exister ; elles ne font pas partie d'une procédure d'importation publiée."
    es: "Tampoco existe una categoría de razas «permitidas con condiciones» más ligera publicada en la frontera. Podrían existir normas locales de tenencia o de orden público; no forman parte de ningún procedimiento de importación publicado."
    pt: "Também não há uma categoria mais branda de raça 'permitida com condições' publicada na fronteira. Regras locais de posse ou de ordem pública ainda podem existir; elas não fazem parte de nenhum procedimento de importação publicado."
  note:
    en: "Because rules can change and Niger publishes almost nothing online, confirm your dog's breed and any cross with the DGSV before you travel."
    fr: "Les règles pouvant évoluer et le Niger publiant presque rien en ligne, confirme la race de ton chien et tout croisement auprès de la DGSV avant de voyager."
    es: "Como las reglas pueden cambiar y Níger publica casi nada en línea, confirma la raza de tu perro y cualquier cruce con la DGSV antes de viajar."
    pt: "Como as regras podem mudar e o Níger publica quase nada on-line, confirme a raça do seu cachorro e qualquer cruzamento com a DGSV antes de viajar."

checklist:
  - en: "Contact the DGSV or a Niger embassy in writing early to confirm the full requirement list, any import authorization and the certificate model (Niger publishes almost nothing)"
    fr: "Contacte tôt et par écrit la DGSV ou une ambassade du Niger pour confirmer la liste complète des exigences, toute autorisation d'importation et le modèle de certificat (le Niger publie presque rien)"
    es: "Contacta pronto y por escrito con la DGSV o una embajada de Níger para confirmar la lista completa de requisitos, cualquier autorización de importación y el modelo de certificado (Níger publica casi nada)"
    pt: "Entre em contato por escrito com a DGSV ou com uma embaixada nigerina com antecedência para confirmar a lista completa de exigências, qualquer autorização de importação e o modelo de certificado (o Níger publica quase nada)"
  - en: "Permanent identification (ISO microchip recommended) placed before the rabies vaccination"
    fr: "Identification permanente (puce ISO recommandée) posée avant la vaccination antirabique"
    es: "Identificación permanente (se recomienda microchip ISO) implantada antes de la vacunación antirrábica"
    pt: "Identificação permanente (microchip ISO recomendado) implantada antes da vacinação antirrábica"
  - en: "Valid rabies vaccination recorded with date, vaccine, batch and validity (primary shot to take effect before travel)"
    fr: "Vaccination antirabique valide consignée avec date, vaccin, lot et validité (primo-vaccination produisant ses effets avant le voyage)"
    es: "Vacunación antirrábica válida registrada con fecha, vacuna, lote y valide (la primovacunación debe surtir efecto antes del viaje)"
    pt: "Vacinação antirrábica válida registrada com data, vacina, lote e validade (a primovacinação deve fazer efeito antes da viagem)"
  - en: "Original international veterinary certificate from an official vet of origin (confirm the correct model with your veterinary authority; French acceptable)"
    fr: "Original du certificat vétérinaire international établi par un vétérinaire officiel d'origine (confirme le modèle correct avec ton autorité vétérinaire ; français accepté)"
    es: "Original del certificado veterinario internacional de un veterinario oficial de origen (confirma el modelo correcto con tu autoridad veterinaria; el francés es aceptable)"
    pt: "Certificado veterinário internacional original de um veterinário oficial de origem (confirme o modelo correto com sua autoridade veterinária; francês aceito)"
  - en: "Up-to-date vaccination records carried with you"
    fr: "Preuves de vaccination à jour emportées avec toi"
    es: "Registros de vacunación al día que lleves contigo"
    pt: "Registros de vacinação atualizados levados com você"
  - en: "Original documents ready for a possible border veterinary check (DIV) and customs at Niamey or a land border"
    fr: "Documents originaux prêts pour un éventuel contrôle vétérinaire frontalier (DIV) et la douane à Niamey ou à une frontière terrestre"
    es: "Documentos originales listos para un posible control veterinario fronterizo (DIV) y las aduanas en Niamey o en una frontera terrestre"
    pt: "Documentos originais prontos para uma possível verificação veterinária de fronteira (DIV) e alfândega em Niamei ou em uma fronteira terrestre"
  - en: "Confirm any breed or additional condition with the DGSV before booking"
    fr: "Confirme toute question de race ou condition supplémentaire auprès de la DGSV avant de réserver"
    es: "Confirma cualquier cuestión de raza o condición adicional con la DGSV antes de reservar"
    pt: "Confirmar qualquer condição adicional ou relativa à raça junto da DGSV antes de reservar"
  - en: "If you will return to the EU, plan the rabies antibody test (Niger is rabies-endemic and non-listed)"
    fr: "Si tu rentre dans l'UE, prévois le titrage antirabique (le Niger est à rage endémique et non listé)"
    es: "Si vas a regresar a la UE, planifica la prueba de titulación de rabia (Níger tiene rabia endémica y no está listado)"
    pt: "Se você for voltar à UE, planeje o teste sorológico antirrábico (titulação) (o Níger tem raiva endêmica e é não listado)"
  - en: "Airline reservation confirming your dog's travel option and suitable travel crate"
    fr: "Réservation confirmant l'option de transport de ton chien et caisse de transport adaptée"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y jaula de transporte adecuada"
    pt: "Reserva na companhia aérea confirmando a opção de transporte do seu cachorro e caixa de transporte adequada às normas da IATA"

