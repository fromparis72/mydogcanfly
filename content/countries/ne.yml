    es: "Lo que cabe esperar para traer un perro a Níger — una vacunación antirrábica válida y un certificado veterinario internacional como base; casi todos los detalles sin publicar, confirma con la DGSV."
    pt: "O que esperar para levar um cachorro ao Níger — uma vacinação antirrábica válida e um certificado veterinário internacional como base; quase todos os detalhes não são publicados, confirme com a DGSV."

