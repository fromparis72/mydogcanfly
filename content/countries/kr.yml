# Country Entry Guide — South Korea (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_kr
iso2: "KR"
name: { en: "South Korea", fr: "Corée du Sud", es: "Corea del Sur", pt: "Coreia do Sul" }
region: { en: "Asia", fr: "Asie", es: "Asia", pt: "Ásia" }


regime: non_listed
domestic:
  intro:
    en: "Domestic flight in South Korea: no quarantine certificate for internal travel — those are issued for departures abroad only."
    fr: "Vol intérieur en Corée du Sud : aucun certificat de quarantaine pour un trajet interne — ils ne sont délivrés que pour les départs à l'étranger."
    es: "Vuelo nacional en Corea del Sur: ningún certificado de cuarentena para un trayecto interno — solo se emiten para salidas al extranjero."
    pt: "Voo doméstico na Coreia do Sul: nenhum certificado de quarentena para um trajeto interno — eles só são emitidos para saídas ao exterior."
  points:
    - en: "Dogs aged 2 months and over must be registered with an RFID microchip — an ownership duty under the Animal Protection Act, not a travel condition."
      fr: "Les chiens de 2 mois et plus doivent être enregistrés avec une puce RFID — une obligation de détention au titre de la loi sur la protection animale, pas une condition de voyage."
      es: "Los perros de 2 meses o más deben estar registrados con microchip RFID — un deber de tenencia bajo la ley de protección animal, no una condición de viaje."
      pt: "Cachorros com 2 meses ou mais precisam ser registrados com um microchip RFID — é um dever de quem tem o animal, previsto na Animal Protection Act (Lei de Proteção Animal), e não uma condição de viagem."
    - en: "Jeju does run a distinct inbound quarantine regime, but its published scope covers cloven-hoofed livestock and poultry — dogs are not listed."
      fr: "Jeju applique bien un régime de quarantaine distinct à l'entrée, mais son champ publié vise le bétail à onglons et la volaille — les chiens n'y figurent pas."
      es: "Jeju sí aplica un régimen de cuarentena distinto a la entrada, pero su ámbito publicado abarca ganado de pezuña hendida y aves — los perros no figuran."
      pt: "Jeju aplica, sim, um regime de quarentena próprio na entrada, mas o escopo publicado abrange gado de casco fendido e aves — cachorros não estão na lista."
    - en: "Whatever the airline asks for (health certificate, vaccination record, breed or crate rules) is its own commercial policy, not a legal requirement — check with your carrier."
      fr: "Ce que la compagnie demande (certificat de santé, carnet de vaccination, règles de race ou de caisse) relève de sa politique commerciale, pas d'une obligation légale — vérifie auprès d'elle."
      es: "Lo que pida la aerolínea (certificado de salud, cartilla de vacunación, reglas de raza o jaula) es su política comercial, no una obligación legal — consúltalo con ella."
      pt: "Tudo o que a companhia aérea pedir (atestado de saúde, carteira de vacinação, regras de raça ou de caixa de transporte) é política comercial dela, não exigência legal — confirme com a sua companhia."
exit:
  authority: APQA
  authorityUrl: https://www.qia.go.kr/english/html/Animal_livestock/02AnimalLivestock_007-8.jsp
  intro:
    en: "South Korea is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus a government export certificate from the Animal and Plant Quarantine Agency (APQA)."
    fr: "La Corée du Sud est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat d'export officiel de l'Agence de quarantaine animale et végétale (APQA)."
    es: "Corea del Sur no está listada: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado de exportación oficial de la Agencia de Cuarentena Animal y Vegetal (APQA)."
    pt: "A Coreia do Sul é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um certificado oficial de exportação da Animal and Plant Quarantine Agency (APQA)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: eu
      text:
        en: "A vet completes the EU-model animal health certificate; APQA inspects the dog at export and provides the official government endorsement before departure."
        fr: "Un vétérinaire remplit le certificat au modèle UE ; l'APQA inspecte le chien à l'export et fournit l'endossement officiel avant le départ."
        es: "Un veterinario rellena el certificado en modelo UE; la APQA inspecciona al perro en la exportación y proporciona el refrendo oficial antes de salir."
        pt: "Um veterinário preenche o certificado de saúde animal no modelo da UE; a APQA inspeciona o cachorro na exportação e concede o endosso oficial do governo antes da partida."
    - timing: window
      scope: non_eu
      text:
        en: "A vet completes the health certificate required by the destination; APQA inspects the dog at export and provides the official government endorsement before departure."
        fr: "Un vétérinaire remplit le certificat sanitaire exigé par la destination ; l'APQA inspecte le chien à l'export et appose le visa officiel avant le départ."
        es: "Un veterinario completa el certificado sanitario que exige el destino; la APQA inspecciona al perro en la exportación y añade el visado oficial antes de la salida."
        pt: "Um veterinário preenche o certificado sanitário exigido pelo destino; a APQA inspeciona o cachorro na exportação e faz o endosso oficial antes da partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to South Korea with your dog", fr: "Voyager en Corée du Sud avec ton chien", es: "Viajar a Corea del Sur con tu perro", pt: "Viajar para a Coreia do Sul com seu cachorro" }
  intro:
    en: >-
      South Korea welcomes dogs, but what you must prepare depends mainly on the country your dog is
      travelling from — not only on Korea itself. Korea runs its own scheme through the Animal and Plant
      Quarantine Agency (APQA): an ISO microchip is always required. If your dog comes from a country APQA
      designates as rabies-free, you mainly need a microchip and a government veterinary health certificate.
      If your dog comes from a country that is NOT designated rabies-free, you must add a rabies vaccination
      and a rabies antibody test showing at least 0.5 IU/ml. A dog that meets every condition clears
      the quarantine inspection and is normally released on the day of arrival; otherwise it can be detained.
      This guide explains each case so you know exactly what to prepare before you book your flight.
    fr: >-
      La Corée du Sud accueille les chiens, mais ce qu'il faut préparer dépend surtout du pays d'où ton
      chien voyage — pas seulement de la Corée. La Corée applique son propre dispositif via l'Agence de
      quarantaine animale et végétale (APQA) : une puce ISO est toujours exigée. Si ton chien vient d'un
      pays désigné indemne de rage par l'APQA, il faut surtout une puce et un certificat sanitaire
      vétérinaire officiel. Si ton chien vient d'un pays NON désigné indemne de rage, il faut ajouter une
      vaccination antirabique et un titrage des anticorps antirabiques d'au moins 0,5 UI/ml. Un chien qui
      remplit toutes les conditions passe l'inspection de quarantaine et est normalement libéré le jour de
      l'arrivée ; sinon il peut être placé en détention. Ce guide détaille chaque cas avant de réserver
      ton vol.
    es: >-
      Corea del Sur acoge a los perros, pero lo que debes preparar depende sobre todo del país desde el
      que viaja tu perro — no solo de Corea. Corea aplica su propio dispositivo a través de la Agencia de
      Cuarentena Animal y Vegetal (APQA): siempre se exige un microchip ISO. Si tu perro procede de un
      país que la APQA designa como indemne de rabia, principalmente necesitas un microchip y un
      certificado sanitario veterinario oficial. Si tu perro procede de un país que NO está designado
      indemne de rabia, debes añadir una vacunación antirrábica y una prueba de titulación de anticuerpos
      contra la rabia que muestre al menos 0,5 UI/ml. Un perro que cumple todas las condiciones supera la
      inspección de cuarentena y normalmente se libera el mismo día de la llegada; en caso contrario,
      puede quedar retenido. Esta guía explica cada caso para que sepas exactamente qué preparar antes de
      reservar tu vuelo.

    pt: "A Coreia do Sul recebe bem os cachorros, mas o que você precisa preparar depende principalmente do país de onde o seu cachorro viaja — e não só da Coreia em si. A Coreia aplica o seu próprio esquema por meio da Animal and Plant Quarantine Agency (APQA): um microchip ISO é sempre obrigatório. Se o seu cachorro vem de um país que a APQA designa como livre de raiva, você precisa basicamente de um microchip e de um atestado de saúde veterinário oficial. Se o seu cachorro vem de um país que NÃO é designado livre de raiva, é preciso acrescentar uma vacinação antirrábica e um teste sorológico antirrábico com resultado de pelo menos 0,5 UI/ml. Um cachorro que cumpre todas as condições passa pela inspeção de quarentena e normalmente é liberado no mesmo dia da chegada; caso contrário, pode ficar retido. Este guia explica cada caso para você saber exatamente o que preparar antes de comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Easy to moderate (depends on origin)", fr: "Facile à modéré (selon l'origine)", es: "De fácil a moderado (según el origen)", pt: "De fácil a moderado (depende da origem)" }

prepTime:
  eu:
    en: "EU departures: an EU pet passport may replace the government health certificate; the rabies-status rule still decides whether an antibody test is needed."
    fr: "Départs UE : un passeport européen peut remplacer le certificat sanitaire officiel ; la règle du statut rabique décide quand même si un titrage est requis."
    es: "Salidas desde la UE: un pasaporte europeo para mascotas puede sustituir al certificado sanitario oficial; la norma del estatus rábico sigue determinando si se necesita una prueba de titulación."
    pt: "Saídas da UE: um passaporte europeu para animais de estimação pode substituir o atestado de saúde oficial; a regra do status em relação à raiva continua definindo se o teste sorológico é necessário."
  listed:
    en: "Rabies-free origin: a few days — microchip plus a government health certificate; the dog is normally released on the day of arrival."
    fr: "Origine indemne de rage : quelques jours — puce et certificat sanitaire officiel ; le chien est normalement libéré le jour de l'arrivée."
    es: "Origen indemne de rabia: unos días — microchip más un certificado sanitario oficial; el perro normalmente se libera el mismo día de la llegada."
    pt: "Origem livre de raiva: alguns dias — microchip mais um atestado de saúde oficial; o cachorro normalmente é liberado no mesmo dia da chegada."
  nonListed:
    en: "Not rabies-free origin: several weeks — rabies vaccination, then an antibody test ≥0.5 IU/ml (valid 24 months). Korea sets no fixed post-test wait, but lab turnaround takes time."
    fr: "Origine non indemne de rage : plusieurs semaines — vaccination antirabique, puis titrage ≥0,5 UI/ml (valable 24 mois). La Corée n'impose pas de délai fixe après le test, mais le laboratoire prend du temps."
    es: "Origen no indemne de rabia: varias semanas — vacunación antirrábica y luego una prueba de titulación ≥0,5 UI/ml (válida 24 meses). Corea no fija una espera posterior a la prueba, pero el laboratorio necesita tiempo."
    pt: "Origem não livre de raiva: várias semanas — vacinação antirrábica e depois um teste sorológico ≥0,5 UI/ml (válido por 24 meses). A Coreia não fixa prazo de espera após o teste, mas o laboratório leva tempo."

