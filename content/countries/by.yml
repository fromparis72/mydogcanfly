# Country Entry Guide — Belarus (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_by
iso2: "BY"
name: { en: "Belarus", fr: "Biélorussie", es: "Bielorrusia", pt: "Belarus" }
region: { en: "Europe (non-EU)", fr: "Europe (hors UE)", es: "Europa (fuera de la UE)", pt: "Europa (fora da UE)" }


regime: non_listed
exit:
  authority: Department of Veterinary and Food Supervision
  authorityUrl: https://dvpn.gov.by/en
  intro:
    en: "Belarus is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Department of Veterinary and Food Supervision (Ministry of Agriculture and Food)."
    fr: "La Biélorussie est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par le Département de la surveillance vétérinaire et alimentaire (ministère de l'Agriculture)."
    es: "Bielorrusia no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el Departamento de Supervisión Veterinaria y Alimentaria (Ministerio de Agricultura)."
    pt: "Belarus é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pelo Departamento de Supervisão Veterinária e Alimentar (Ministério da Agricultura e Alimentação)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "The state veterinary service (Department of Veterinary and Food Supervision) issues the export veterinary certificate before departure."
        fr: "Le service vétérinaire d'État (Département de la surveillance vétérinaire et alimentaire) délivre le certificat vétérinaire d'export avant le départ."
        es: "El servicio veterinario estatal (Departamento de Supervisión Veterinaria y Alimentaria) emite el certificado veterinario de exportación antes de salir."
        pt: "O serviço veterinário estatal (Departamento de Supervisão Veterinária e Alimentar) emite o certificado veterinário de exportação antes da partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Belarus with your dog", fr: "Voyager en Biélorussie avec ton chien", es: "Viajar a Bielorrusia con tu perro", pt: "Viajar para Belarus com seu cachorro" }
  intro:
    en: >-
      Belarus welcomes dogs, but it is not an EU country: it is a member of the Eurasian Economic Union
      (EAEU) and applies the Union's common veterinary rules. What you need to prepare depends mainly on
      the country your dog is travelling from. In every case your dog must be identified (ISO microchip),
      vaccinated against rabies and travel with an international veterinary passport or an EAEU veterinary
      certificate. Up to two dogs or cats carried for personal use enter without an import permit and
      without quarantine, as long as the paperwork is in order. A dog arriving from another EAEU state
      moves under simplified conditions; a dog from any other country needs a full certificate and a
      recent clinical examination. This guide explains each case so you know exactly what to prepare
      before you book your flight.
    fr: >-
      La Biélorussie accueille les chiens, mais ce n'est pas un pays de l'UE : elle est membre de l'Union
      économique eurasiatique (UEEA) et applique les règles vétérinaires communes de l'Union. Ce qu'il
      faut préparer dépend surtout du pays d'où ton chien voyage. Dans tous les cas, ton chien doit
      être identifié (puce ISO), vacciné contre la rage et voyager avec un passeport vétérinaire
      international ou un certificat vétérinaire de l'UEEA. Jusqu'à deux chiens ou chats transportés pour
      usage personnel entrent sans permis d'importation ni quarantaine, si les documents sont en règle.
      Un chien venant d'un autre État de l'UEEA circule dans des conditions simplifiées ; un chien venant
      de tout autre pays a besoin d'un certificat complet et d'un examen clinique récent. Ce guide
      détaille chaque cas pour savoir exactement quoi préparer avant de réserver ton vol.
    es: >-
      Bielorrusia acoge a los perros, pero no es un país de la UE: es miembro de la Unión Económica
      Euroasiática (UEEA) y aplica las normas veterinarias comunes de la Unión. Lo que debes preparar
      depende sobre todo del país desde el que viaja tu perro. En todos los casos, tu perro debe estar
      identificado (microchip ISO), vacunado contra la rabia y viajar con un pasaporte veterinario
      internacional o un certificado veterinario de la UEEA. Hasta dos perros o gatos transportados para
      uso personal entran sin permiso de importación y sin cuarentena, siempre que los documentos estén
      en regla. Un perro que llega de otro Estado de la UEEA circula en condiciones simplificadas; un
      perro procedente de cualquier otro país necesita un certificado completo y un examen clínico
      reciente. Esta guía explica cada caso para que sepas exactamente qué preparar antes de reservar tu
      vuelo.

    pt: "Belarus recebe bem os cachorros, mas não é um país da UE: é membro da União Econômica Eurasiática (UEE) e aplica as regras veterinárias comuns da União. O que você precisa preparar depende principalmente do país de onde seu cachorro parte. Em todos os casos, seu cachorro precisa estar identificado (microchip ISO), vacinado contra a raiva e viajar com um passaporte veterinário internacional ou um certificado veterinário da UEE. Até dois cachorros ou gatos levados para uso pessoal entram sem autorização de importação e sem quarentena, desde que a documentação esteja em ordem. Um cachorro que chega de outro Estado da UEE viaja em condições simplificadas; um cachorro vindo de qualquer outro país precisa de um certificado completo e de um exame clínico recente. Este guia explica cada caso para você saber exatamente o que preparar antes de comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Moderate (identification, rabies and certificate required)", fr: "Modérée (identification, rage et certificat exigés)", es: "Moderada (se exigen identificación, rabia y certificado)", pt: "Moderado (identificação, raiva e certificado obrigatórios)" }

prepTime:
  eu:
    en: "From an EAEU country (Russia, Kazakhstan, Armenia, Kyrgyzstan): a few days if the passport and rabies vaccination are up to date."
    fr: "Depuis un pays de l'UEEA (Russie, Kazakhstan, Arménie, Kirghizistan) : quelques jours si le passeport et le vaccin antirabique sont à jour."
    es: "Desde un país de la UEEA (Rusia, Kazajistán, Armenia, Kirguistán): unos días si el pasaporte y la vacuna antirrábica están al día."
    pt: "De um país da UEE (Rússia, Cazaquistão, Armênia, Quirguistão): alguns dias, se o passaporte e a vacinação antirrábica estiverem em dia."
  listed:
    en: "From other countries: ~3–4 weeks — rabies shot at least 20 days before departure (if not vaccinated in the last 12 months), plus a clinical exam within 14 days of travel."
    fr: "Depuis les autres pays : ~3–4 semaines — vaccin antirabique au moins 20 jours avant le départ (si non vacciné dans les 12 derniers mois), plus un examen clinique dans les 14 jours du voyage."
    es: "Desde otros países: ~3–4 semanas — vacuna antirrábica al menos 20 días antes de la salida (si no se ha vacunado en los últimos 12 meses), más un examen clínico dentro de los 14 días del viaje."
    pt: "De outros países: ~3–4 semanas — vacina antirrábica pelo menos 20 dias antes da partida (se não vacinado nos últimos 12 meses), mais um exame clínico feito nos 14 dias anteriores à viagem."
  nonListed:
    en: "From a country with a rabies risk or a disease outbreak: allow extra time — vaccination, a possible antibody test and additional veterinary conditions may apply."
    fr: "Depuis un pays à risque rabique ou touché par un foyer de maladie : prévois du temps supplémentaire — vaccination, éventuel titrage et conditions vétérinaires additionnelles possibles."
    es: "Desde un país con riesgo de rabia o afectado por un brote de enfermedad: prevé tiempo adicional — pueden aplicarse la vacunación, una posible prueba de titulación y condiciones veterinarias adicionales."
    pt: "De um país com risco de raiva ou surto de doença: reserve tempo extra — vacinação, um possível teste sorológico e condições veterinárias adicionais podem se aplicar."

