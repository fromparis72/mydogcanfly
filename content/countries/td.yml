  metaTitle: { en: "Taking Your Dog to Chad: Pet Travel Requirements 2026", fr: "Voyager au Tchad avec ton chien : formalités (2026)", es: "Viajar a Chad con tu perro: requisitos de entrada (2026)", pt: "Levar seu cachorro para o Chade: exigências de entrada 2026" }
