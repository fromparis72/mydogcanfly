# Country Entry Guide — Chad (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_td
iso2: "TD"
name: { en: "Chad", fr: "Tchad", es: "Chad", pt: "Chade" }
region: { en: "Central Africa", fr: "Afrique centrale", es: "África Central", pt: "África Central" }


regime: non_listed

hero:
  h1: { en: "Traveling to Chad with your dog", fr: "Voyager au Tchad avec ton chien", es: "Viajar a Chad con tu perro", pt: "Viajar para o Chade com seu cachorro" }
  intro:
    en: >-
      Chad is one of the countries that publishes almost nothing about bringing a pet dog in, so this
      guide stays strictly with what official sources confirm and marks everything else as Unknown rather
      than guessing. Chad is not part of the EU pet framework; animal health is overseen by the Ministry
      of Livestock and Animal Production (Ministère de l'Élevage et des Productions Animales) and its
      veterinary services. Chad's animal-health law (Loi n° 9/PR/2004) organises veterinary sanitary
      policing, and animals imported or exported are accompanied by a zoosanitary (veterinary) certificate
      issued by the competent veterinary authorities. Crucially, the US authority USDA APHIS lists Chad
      under "unknown requirements" — meaning Chad has not filed an agreed dog/cat import certificate, and
      there is no published country-specific model. In that situation the safe core is an international
      veterinary health certificate issued by an official vet with proof of a current rabies vaccination,
      but the exact conditions must be confirmed directly with Chad's veterinary services or a Chadian
      embassy before you book. This guide flags clearly what is confirmed and what is simply not published.
    fr: >-
      Le Tchad fait partie des pays qui ne publient presque rien sur l'entrée d'un chien de compagnie ; ce
      guide s'en tient donc strictement à ce que confirment les sources officielles et indique tout le
      reste comme « Non communiqué » plutôt que de le deviner. Le Tchad ne relève pas du cadre de l'UE ;
      la santé animale est supervisée par le Ministère de l'Élevage et des Productions Animales et ses
      services vétérinaires. La loi sanitaire animale tchadienne (Loi n° 9/PR/2004) organise la police
      sanitaire vétérinaire, et les animaux importés ou exportés sont accompagnés d'un certificat
      zoosanitaire (vétérinaire) délivré par les autorités vétérinaires compétentes. Point essentiel :
      l'autorité américaine USDA APHIS classe le Tchad parmi les pays « aux exigences inconnues » — le
      Tchad n'a pas déposé de certificat d'importation chiens/chats convenu, et aucun modèle propre au
      pays n'est publié. Dans ce cas, le socle prudent est un certificat sanitaire vétérinaire
      international établi par un vétérinaire officiel avec la preuve d'une vaccination antirabique à jour,
      mais les conditions exactes doivent être confirmées directement auprès des services vétérinaires du
      Tchad ou d'une ambassade du Tchad avant de réserver. Ce guide distingue clairement ce qui est
      confirmé de ce qui n'est tout simplement pas publié.
    es: >-
      Chad es uno de los países que no publica casi nada sobre la entrada de un perro de compañía, por lo
      que esta guía se ciñe estrictamente a lo que confirman las fuentes oficiales y marca todo lo demás
      como «No comunicado» en lugar de suponerlo. Chad no forma parte del marco de mascotas de la UE; la
      salud animal la supervisa el Ministerio de Ganadería y Producciones Animales (Ministère de
      l'Élevage et des Productions Animales) y sus servicios veterinarios. La ley de sanidad animal de
      Chad (Loi n° 9/PR/2004) organiza la policía sanitaria veterinaria, y los animales importados o
      exportados van acompañados de un certificado zoosanitario (veterinario) emitido por las autoridades
      veterinarias competentes. Un punto esencial: la autoridad estadounidense USDA APHIS clasifica a
      Chad entre los países «con requisitos desconocidos» — lo que significa que Chad no ha presentado un
      certificado de importación acordado para perros/gatos, y no hay ningún modelo propio del país
      publicado. En esa situación, el núcleo prudente es un certificado sanitario veterinario
      internacional emitido por un veterinario oficial con prueba de una vacunación antirrábica al día,
      pero las condiciones exactas deben confirmarse directamente con los servicios veterinarios de Chad o
      con una embajada de Chad antes de reservar. Esta guía señala con claridad lo que está confirmado y
      lo que simplemente no se publica.

    pt: "O Chade é um dos países que publica quase nenhuma informação sobre a entrada de um cachorro de estimação, então este guia se atém estritamente ao que as fontes oficiais confirmam e marca todo o resto como não comunicado, em vez de supor. O Chade não faz parte do marco de animais de estimação da UE; a saúde animal é supervisionada pelo Ministério da Pecuária e Produção Animal (Ministère de l'Élevage et des Productions Animales) e seus serviços veterinários. A lei de saúde animal do Chade (Loi n° 9/PR/2004) organiza a polícia sanitária veterinária, e os animais importados ou exportados são acompanhados de um certificado zoosanitário (veterinário) emitido pelas autoridades veterinárias competentes. Um ponto essencial: a autoridade americana USDA APHIS classifica o Chade entre os países com \"exigências não comunicadas\" — o que significa que o Chade não apresentou um certificado de importação de cachorros/gatos acordado, e não há nenhum modelo próprio do país publicado. Nessa situação, o núcleo seguro é um atestado de saúde veterinário internacional emitido por um veterinário oficial com comprovação de uma vacinação antirrábica em dia, mas as condições exatas precisam ser confirmadas diretamente com os serviços veterinários do Chade ou com uma embaixada do Chade antes de reservar. Este guia sinaliza claramente o que está confirmado e o que simplesmente não é publicado."
difficulty:
  level: difficult
  label: { en: "Difficult — no published import scheme; requirements largely unknown, confirm directly", fr: "Difficile — aucun dispositif d'importation publié ; exigences largement inconnues, à confirmer directement", es: "Difícil — sin sistema de importación publicado; requisitos en gran parte desconocidos, confirma directamente", pt: "Difícil — nenhum sistema de importação publicado; exigências majoritariamente não comunicadas, confirme diretamente" }

prepTime:
  eu:
    en: "From the EU: allow at least one to two weeks if microchip and rabies vaccination are already valid — an official EU vet issues an international veterinary certificate close to departure. Add time to contact Chad's veterinary services or a Chadian embassy, because no EU-specific model and no full procedure are published."
    fr: "Depuis l'UE : prévois au moins une à deux semaines si la puce et la vaccination antirabique sont déjà valides — un vétérinaire officiel de l'UE établit un certificat vétérinaire international peu avant le départ. Ajoute du temps pour contacter les services vétérinaires du Tchad ou une ambassade du Tchad, aucun modèle propre à l'UE ni procédure complète n'étant publiés."
    es: "Desde la UE: cuenta con al menos una o dos semanas si el microchip y la vacunación antirrábica ya son válidos — un veterinario oficial de la UE emite un certificado veterinario internacional poco antes de la salida. Añade tiempo para contactar con los servicios veterinarios de Chad o una embajada de Chad, ya que no se publica ningún modelo propio de la UE ni un procedimiento completo."
    pt: "Da UE: reserve pelo menos uma a duas semanas se o microchip e a vacinação antirrábica já forem válidos — um veterinário oficial da UE emite um certificado veterinário internacional próximo da partida. Adicione tempo para contatar os serviços veterinários do Chade ou uma embaixada do Chade, já que nenhum modelo específico da UE nem procedimento completo são publicados."
  listed:
    en: "From the United States: APHIS lists Chad under unknown requirements, so no agreed certificate exists. APHIS recommends a health certificate (APHIS Form 7001) issued by a USDA-accredited vet and endorsed by APHIS, plus proof of current rabies vaccination. Allow time for the vet visit and endorsement, and confirm Chad's conditions directly."
    fr: "Depuis les États-Unis : l'APHIS classe le Tchad parmi les exigences inconnues, donc aucun certificat convenu n'existe. L'APHIS recommande un certificat sanitaire (formulaire APHIS 7001) établi par un vétérinaire accrédité USDA et endossé par l'APHIS, avec la preuve d'une vaccination antirabique à jour. Prévois le temps de la visite et de l'endossement, et confirme les conditions du Tchad directement."
    es: "Desde Estados Unidos: la APHIS clasifica a Chad entre los requisitos desconocidos, así que no existe ningún certificado acordado. La APHIS recomienda un certificado sanitario (formulario APHIS 7001) emitido por un veterinario acreditado por el USDA y refrendado por la APHIS, más prueba de una vacunación antirrábica al día. Cuenta con tiempo para la visita al veterinario y el refrendo, y confirma las condiciones de Chad directamente."
    pt: "Dos Estados Unidos: o APHIS classifica o Chade entre as exigências não comunicadas, então não existe nenhum certificado acordado. O APHIS recomenda um certificado sanitário (formulário APHIS 7001) emitido por um veterinário credenciado pelo USDA e endossado pelo APHIS, além de comprovação de vacinação antirrábica em dia. Reserve tempo para a visita ao veterinário e o endosso, e confirme as condições do Chade diretamente."
  nonListed:
    en: "From other origins: whatever the departure country, plan the rabies vaccination and the official international veterinary certificate well ahead. Because Chad publishes no detailed scheme, contact its veterinary services early to confirm whether an import authorization or any extra condition applies — allow several weeks."
    fr: "Depuis d'autres origines : quel que soit le pays de départ, prévois à l'avance la vaccination antirabique et le certificat vétérinaire international officiel. Le Tchad ne publiant aucun dispositif détaillé, contacte tôt ses services vétérinaires pour confirmer si une autorisation d'importation ou toute condition supplémentaire s'applique — prévois plusieurs semaines."
    es: "Desde otros orígenes: sea cual sea el país de salida, planifica con antelación la vacunación antirrábica y el certificado veterinario internacional oficial. Como Chad no publica ningún sistema detallado, contacta pronto con sus servicios veterinarios para confirmar si se aplica una autorización de importación o cualquier condición adicional — cuenta con varias semanas."
    pt: "De outras origens: seja qual for o país de partida, planeje com antecedência a vacinação antirrábica e o certificado veterinário internacional oficial. Como o Chade não publica nenhum sistema detalhado, contate os seus serviços veterinários com antecedência para confirmar se uma autorização de importação ou qualquer condição extra se aplica — reserve várias semanas."

