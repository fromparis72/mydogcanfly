notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Chad publishes almost nothing about pet import, so only a veterinarian and Chad's veterinary services (or a Chadian embassy) can confirm the exact, current procedure for your individual dog."
    fr: "Le Tchad ne publie presque rien sur l'importation d'animaux ; seuls un vétérinaire et les services vétérinaires du Tchad (ou une ambassade du Tchad) peuvent confirmer la procédure exacte et à jour pour ton chien."
    es: "Chad no publica casi nada sobre la importación de animales, por lo que solo un veterinario y los servicios veterinarios de Chad (o una embajada de Chad) pueden confirmar el procedimiento exacto y actual para tu perro."
    pt: "O Chade publica quase nenhuma informação sobre a importação de animais de estimação, então somente um médico-veterinário e os serviços veterinários do Chade (ou uma embaixada do Chade) podem confirmar o procedimento exato e atual para o seu cachorro."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
