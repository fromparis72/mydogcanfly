  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Chad (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — le Tchad (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Chad (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — o Chade (seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Chad", fr: "Pays de destination — Tchad", es: "País de destino — Chad", pt: "País de destino — Chade" }
      text:
        en: "Chad sits outside the EU framework and its animal health is overseen by the Ministry of Livestock and Animal Production and its veterinary services. Its law (Loi n° 9/PR/2004) requires imported and exported animals to travel with a zoosanitary certificate from the competent veterinary authorities. Chad has filed no agreed import certificate with foreign authorities and publishes no detailed scheme, so an import permit, microchip standard, rabies timing, quarantine, minimum age and breed rules are unpublished and must be confirmed directly."
        fr: "Le Tchad se situe hors du cadre de l'UE et sa santé animale est supervisée par le Ministère de l'Élevage et des Productions Animales et ses services vétérinaires. Sa loi (Loi n° 9/PR/2004) exige que les animaux importés et exportés voyagent avec un certificat zoosanitaire des autorités vétérinaires compétentes. Le Tchad n'a déposé aucun certificat d'importation convenu auprès des autorités étrangères et ne publie aucun dispositif détaillé : autorisation d'importation, norme de puce, délais de la rage, quarantaine, âge minimum et règles de race ne sont pas publiés et doivent être confirmés directement."
        es: "Chad queda fuera del marco de la UE y su salud animal la supervisa el Ministerio de Ganadería y Producciones Animales y sus servicios veterinarios. Su ley (Loi n° 9/PR/2004) exige que los animales importados y exportados viajen con un certificado zoosanitario de las autoridades veterinarias competentes. Chad no ha presentado ningún certificado de importación acordado ante las autoridades extranjeras y no publica ningún sistema detallado, por lo que un permiso de importación, la norma de microchip, los plazos de la rabia, la cuarentena, la edad mínima y las reglas de raza no están publicados y deben confirmarse directamente."
        pt: "O Chade fica fora do marco da UE, e sua saúde animal é supervisionada pelo Ministério da Pecuária e Produção Animal e seus serviços veterinários. Sua lei (Loi n° 9/PR/2004) exige que os animais importados e exportados viajem com um certificado zoosanitário das autoridades veterinárias competentes. O Chade não apresentou nenhum certificado de importação acordado junto a autoridades estrangeiras e não publica nenhum sistema detalhado, então uma autorização de importação, a norma de microchip, os prazos relativos à raiva, a quarentena, a idade mínima e as regras de raça não são publicados e precisam ser confirmados diretamente."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The country of departure decides which official certificate your vet uses and which authority endorses it. Because Chad has no country-specific model, US travellers use a health certificate (APHIS Form 7001) endorsed by USDA, and EU travellers use an official international veterinary certificate endorsed by their competent authority. The departure country's veterinary authority must sign whatever certificate is used."
        fr: "Le pays de départ détermine le certificat officiel utilisé par ton vétérinaire et l'autorité qui le vise. Le Tchad n'ayant pas de modèle propre, les voyageurs américains utilisent un certificat sanitaire (formulaire APHIS 7001) endossé par l'USDA, et les voyageurs de l'UE un certificat vétérinaire international officiel visé par leur autorité compétente. L'autorité vétérinaire du pays de départ doit signer le certificat utilisé."
        es: "El país de salida decide qué certificado oficial usa tu veterinario y qué autoridad lo refrenda. Como Chad no tiene un modelo propio del país, los viajeros de EE. UU. usan un certificado sanitario (formulario APHIS 7001) refrendado por el USDA, y los viajeros de la UE usan un certificado veterinario internacional oficial refrendado por su autoridad competente. La autoridad veterinaria del país de salida debe firmar el certificado que se utilice."
        pt: "O país de partida determina qual certificado oficial o seu veterinário usa e qual autoridade o endossa. Como o Chade não tem um modelo próprio do país, viajantes dos Estados Unidos usam um certificado sanitário (formulário APHIS 7001) endossado pelo USDA, e viajantes da UE usam um certificado veterinário internacional oficial endossado pela sua autoridade competente. A autoridade veterinária do país de partida precisa assinar o certificado utilizado."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "Your dog's rabies history and recent country of residence matter to the veterinary services, not only the last airport. A stay in a rabies-risk country can affect the evidence the services expect. Note that Chad is treated by the EU as a non-listed third country and lies in a rabies-endemic region, which matters both for entry and for any later return to the EU."
        fr: "L'historique antirabique et le pays de résidence récent de ton chien comptent pour les services vétérinaires, pas seulement le dernier aéroport. Un séjour dans un pays à risque rabique peut modifier les preuves attendues. Note que le Tchad est traité par l'UE comme un pays tiers non listé et se situe dans une région où la rage est endémique, ce qui compte tant pour l'entrée que pour un éventuel retour ultérieur vers l'UE."
        es: "El historial de rabia y el país de residencia reciente de tu perro importan a los servicios veterinarios, no solo el último aeropuerto. Una estancia en un país con riesgo de rabia puede modificar las pruebas que esperan los servicios. Ten en cuenta que la UE trata a Chad como un país tercero no listado y se encuentra en una región donde la rabia es endémica, lo que importa tanto para la entrada como para un posible regreso posterior a la UE."
        pt: "O histórico de raiva do seu cachorro e o país de residência recente importam para os serviços veterinários, não apenas o último aeroporto. Uma estadia em um país de risco de raiva pode afetar as provas esperadas pelos serviços. Vale notar que o Chade é tratado pela UE como um país terceiro não listado e está em uma região com raiva endêmica, o que importa tanto para a entrada quanto para um eventual retorno posterior à UE."
  note:
    en: "So read the requirements below as a prudent core, then verify every unpublished point and your dog's exact origin, length of stay and history with your vet and Chad's veterinary services before booking."
    fr: "Lis donc les exigences ci-dessous comme un socle prudent, puis vérifie chaque point non publié ainsi que l'origine, la durée du séjour et l'historique exacts de ton chien auprès de ton vétérinaire et des services vétérinaires du Tchad avant de réserver."
    es: "Así que lee los requisitos siguientes como un núcleo prudente y luego verifica cada punto no publicado, así como el origen, la duración de la estancia y el historial exactos de tu perro, con tu veterinario y los servicios veterinarios de Chad antes de reservar."
    pt: "Portanto, leia as exigências abaixo como um núcleo prudente e, depois, verifique cada ponto não publicado, além da origem exata, da duração da estadia e do histórico do seu cachorro, com o seu veterinário e com os serviços veterinários do Chade antes de reservar."

requirements:
  - item: { en: "Advance import authorization", fr: "Autorisation d'importation préalable", es: "Autorización de importación previa", pt: "Autorização de importação prévia" }
    required: { en: "Not published (Unknown)", fr: "Non communiqué", es: "No comunicado", pt: "Não publicado (não informado)" }
    when: { en: "Chad does not publish an online pet-import permit procedure. Its veterinary policing is organised by Loi n° 9/PR/2004, but whether a traveller's accompanying pet needs a prior authorization is not stated. This is an absence of published rule, not confirmation that none exists — confirm with Chad's veterinary services or a Chadian embassy before travel.", fr: "Le Tchad ne publie pas de procédure de permis d'importation d'animaux en ligne. Sa police sanitaire est organisée par la Loi n° 9/PR/2004, mais la nécessité d'une autorisation préalable pour l'animal accompagné d'un voyageur n'est pas précisée. C'est une absence de règle publiée, non une confirmation qu'aucune n'existe — confirme auprès des services vétérinaires du Tchad ou d'une ambassade du Tchad avant le voyage.", es: "Chad no publica ningún procedimiento en línea de permiso de importación de mascotas. Su policía sanitaria la organiza la Loi n° 9/PR/2004, pero no se indica si una mascota que acompaña a un viajero necesita una autorización previa. Esto es una ausencia de regla publicada, no una confirmación de que no exista ninguna — confírmalo con los servicios veterinarios de Chad o una embajada de Chad antes de viajar.", pt: "O Chade não publica um procedimento on-line de autorização de importação de animais de estimação. Sua polícia sanitária é organizada pela Loi n° 9/PR/2004, mas não é especificado se o animal de estimação que acompanha um viajante precisa de uma autorização prévia. Isso é uma ausência de regra publicada, não uma confirmação de que nenhuma exista — confirme com os serviços veterinários do Chade ou com uma embaixada do Chade antes da viagem." }
    exceptions: { en: "Unknown — the veterinary services may set conditions case by case.", fr: "Non communiqué — les services vétérinaires peuvent fixer des conditions au cas par cas.", es: "No comunicado — los servicios veterinarios pueden fijar condiciones caso por caso.", pt: "Não comunicado — os serviços veterinários podem definir condições caso a caso." }
    ref: { en: "Chad — Loi n° 9/PR/2004 (animal health policing); USDA APHIS lists Chad under unknown requirements (no agreed certificate)", fr: "Tchad — Loi n° 9/PR/2004 (police sanitaire animale) ; l'USDA APHIS classe le Tchad parmi les exigences inconnues (aucun certificat convenu)", es: "Chad — Loi n° 9/PR/2004 (policía sanitaria animal); la USDA APHIS clasifica a Chad entre los requisitos desconocidos (ningún certificado acordado)", pt: "Chade — Loi n° 9/PR/2004 (polícia sanitária animal); o USDA APHIS classifica o Chade entre os países com exigências não comunicadas (nenhum certificado acordado)" }
  - item: { en: "Microchip (identification)", fr: "Puce électronique (identification)", es: "Microchip (identificación)", pt: "Microchip (identificação)" }
    required: { en: "Not published — ISO chip recommended", fr: "Non communiqué — puce ISO recommandée", es: "No comunicado — microchip ISO recomendado", pt: "Não publicado — microchip ISO recomendado" }
    when: { en: "No official Chad source publishes a microchip requirement or a chip standard for imported pet dogs. In practice an ISO 11784/11785 microchip is the international norm and is needed for any later return to the EU, so it is strongly recommended even though Chad does not state it.", fr: "Aucune source officielle tchadienne ne publie d'exigence de puce ni de norme de puce pour les chiens de compagnie importés. En pratique, une puce ISO 11784/11785 est la référence internationale et est nécessaire pour un retour ultérieur vers l'UE ; elle est donc fortement recommandée même si le Tchad ne la précise pas.", es: "Ninguna fuente oficial de Chad publica un requisito de microchip ni una norma de chip para perros de compañía importados. En la práctica, un microchip ISO 11784/11785 es la referencia internacional y es necesario para un regreso posterior a la UE, por lo que es muy recomendable aunque Chad no lo indique.", pt: "Nenhuma fonte oficial do Chade publica uma exigência de microchip ou uma norma de chip para cachorros de estimação importados. Na prática, um microchip ISO 11784/11785 é a norma internacional e é necessário para um eventual retorno à UE, então é fortemente recomendado mesmo que o Chade não o especifique." }
    exceptions: { en: "Unknown — confirm the accepted identification with Chad's veterinary services.", fr: "Non communiqué — confirme l'identification acceptée auprès des services vétérinaires du Tchad.", es: "No comunicado — confirma la identificación aceptada con los servicios veterinarios de Chad.", pt: "Não comunicado — confirme a identificação aceita com os serviços veterinários do Chade." }
    ref: { en: "No official published Chad microchip rule found; ISO 11784/11785 is the international standard", fr: "Aucune règle de puce officielle tchadienne publiée trouvée ; ISO 11784/11785 est la norme internationale", es: "No se encontró ninguna regla de microchip oficial de Chad publicada; ISO 11784/11785 es la norma internacional", pt: "Nenhuma regra oficial de microchip do Chade publicada foi encontrada; o ISO 11784/11785 é a norma internacional" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required in practice", fr: "Requise en pratique", es: "Obligatoria en la práctica", pt: "Obrigatória na prática" }
    when: { en: "Chad publishes no specific rabies protocol for pet import, but it lies in a rabies-endemic region and USDA APHIS recommends proof of a current rabies vaccination for dogs entering countries with unknown requirements. Keep the vaccination valid and recorded (date, vaccine, batch, validity). The exact minimum waiting period and validity window are not published by Chad.", fr: "Le Tchad ne publie pas de protocole rabique spécifique pour l'importation d'animaux, mais il se situe dans une région où la rage est endémique et l'USDA APHIS recommande la preuve d'une vaccination antirabique à jour pour les chiens entrant dans les pays aux exigences inconnues. Garde la vaccination valide et consignée (date, vaccin, lot, validité). Le délai minimal exact et la fenêtre de validité ne sont pas publiés par le Tchad.", es: "Chad no publica un protocolo específico de rabia para la importación de mascotas, pero se encuentra en una región donde la rabia es endémica y la USDA APHIS recomienda prueba de una vacunación antirrábica al día para los perros que entran en países con requisitos desconocidos. Mantén la vacunación válida y registrada (fecha, vacuna, lote, valide). El periodo mínimo de espera exacto y la ventana de valide no los publica Chad.", pt: "O Chade não publica um protocolo específico de raiva para a importação de animais de estimação, mas está em uma região com raiva endêmica, e o USDA APHIS recomenda comprovação de uma vacinação antirrábica em dia para cachorros que entram em países com exigências não comunicadas. Mantenha a vacinação válida e registrada (data, vacina, lote, validade). O período mínimo de espera exato e a janela de validade não são publicados pelo Chade." }
    exceptions: { en: "A dog too young to be validly vaccinated cannot meet the rabies requirement.", fr: "Un chien trop jeune pour être valablement vacciné ne peut satisfaire l'exigence antirabique.", es: "Un perro demasiado joven para ser vacunado válidamente no puede cumplir el requisito antirrábico.", pt: "Um cachorro jovem demais para ser validamente vacinado não pode cumprir a exigência relativa à raiva." }
    ref: { en: "USDA APHIS — Unknown Requirements (rabies vaccination recommended); rabies-endemic region", fr: "USDA APHIS — Exigences inconnues (vaccination antirabique recommandée) ; région où la rage est endémique", es: "USDA APHIS — Unknown Requirements (vacunación antirrábica recomendada); región donde la rabia es endémica", pt: "USDA APHIS — Unknown Requirements (vacinação antirrábica recomendada); região com raiva endêmica" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not published (Unknown)", fr: "Non communiqué", es: "No comunicado", pt: "Não publicado (não informado)" }
    when: { en: "No official Chad source publishes a rabies antibody test requirement for import. This is an absence of published rule, not confirmation that none applies. (A rabies antibody test may still be relevant for a later return to the EU, because Chad is treated as a non-listed third country.)", fr: "Aucune source officielle tchadienne ne publie d'exigence de titrage des anticorps antirabiques pour l'importation. C'est une absence de règle publiée, non une confirmation qu'aucun ne s'applique. (Un titrage peut toutefois rester pertinent pour un retour ultérieur vers l'UE, le Tchad étant traité comme un pays tiers non listé.)", es: "Ninguna fuente oficial de Chad publica un requisito de prueba de titulación de rabia para la importación. Esto es una ausencia de regla publicada, no una confirmación de que no se aplique ninguna. (Una prueba de titulación de rabia puede seguir siendo relevante para un regreso posterior a la UE, porque Chad se trata como un país tercero no listado.)", pt: "Nenhuma fonte oficial do Chade publica uma exigência de teste sorológico antirrábico para a importação. Isso é uma ausência de regra publicada, não uma confirmação de que nenhuma se aplica. (Um teste sorológico antirrábico ainda pode ser relevante para um retorno posterior à UE, já que o Chade é tratado como um país terceiro não listado.)" }
    exceptions: { en: "Unknown — confirm with Chad's veterinary services, as conditions may differ by the dog's origin and rabies history.", fr: "Non communiqué — à confirmer auprès des services vétérinaires du Tchad, les conditions pouvant varier selon l'origine et l'historique rabique du chien.", es: "No comunicado — confírmalo con los servicios veterinarios de Chad, ya que las condiciones pueden variar según el origen y el historial de rabia del perro.", pt: "Não comunicado — confirme com os serviços veterinários do Chade, pois as condições podem variar conforme a origem e o histórico de raiva do cachorro." }
    ref: { en: "No published Chad antibody-test requirement found (Ministry of Livestock / USDA APHIS)", fr: "Aucune exigence de titrage tchadienne publiée trouvée (Ministère de l'Élevage / USDA APHIS)", es: "No se encontró ningún requisito de prueba de titulación de Chad publicado (Ministerio de Ganadería / USDA APHIS)", pt: "Nenhuma exigência de teste sorológico do Chade publicada foi encontrada (Ministry of Livestock / USDA APHIS)" }
  - item: { en: "Official international veterinary (zoosanitary) certificate", fr: "Certificat vétérinaire (zoosanitaire) international officiel", es: "Certificado veterinario (zoosanitario) internacional oficial", pt: "Certificado veterinário (zoosanitário) internacional oficial" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Under Chad's animal-health law, imported and exported animals travel with a zoosanitary certificate issued by the competent veterinary authorities. Because there is no country-specific model, use your departure country's official international veterinary certificate, issued by an official/accredited vet and endorsed by that country's veterinary authority. For the US this is a health certificate (APHIS Form 7001) endorsed by USDA. French is acceptable as Chad is francophone.", fr: "Selon la loi sanitaire animale du Tchad, les animaux importés et exportés voyagent avec un certificat zoosanitaire délivré par les autorités vétérinaires compétentes. Aucun modèle propre au pays n'existant, utilise le certificat vétérinaire international officiel de ton pays de départ, établi par un vétérinaire officiel/agréé et visé par l'autorité vétérinaire de ce pays. Pour les États-Unis, il s'agit d'un certificat sanitaire (formulaire APHIS 7001) endossé par l'USDA. Le français est accepté, le Tchad étant francophone.", es: "Según la ley de sanidad animal de Chad, los animales importados y exportados viajan con un certificado zoosanitario emitido por las autoridades veterinarias competentes. Como no existe un modelo propio del país, usa el certificado veterinario internacional oficial de tu país de salida, emitido por un veterinario oficial/acreditado y refrendado por la autoridad veterinaria de ese país. Para EE. UU. se trata de un certificado sanitario (formulario APHIS 7001) refrendado por el USDA. El francés es aceptable, ya que Chad es francófono.", pt: "Segundo a lei de saúde animal do Chade, os animais importados e exportados viajam com um certificado zoosanitário emitido pelas autoridades veterinárias competentes. Como não existe um modelo próprio do país, use o certificado veterinário internacional oficial do seu país de partida, emitido por um veterinário oficial/credenciado e endossado pela autoridade veterinária desse país. Para os EUA, trata-se de um certificado sanitário (formulário APHIS 7001) endossado pelo USDA. O francês é aceito, já que o Chade é francófono." }
    exceptions: { en: "None — an official endorsed certificate should accompany every dog; confirm the exact wording Chad accepts.", fr: "Aucune — un certificat officiel visé devrait accompagner chaque chien ; confirme la rédaction exacte acceptée par le Tchad.", es: "Ninguna — un certificado oficial refrendado debería acompañar a cada perro; confirma la redacción exacta que acepta Chad.", pt: "Nenhuma — um certificado oficial endossado deve acompanhar todo cachorro; confirme a redação exata aceita pelo Chade." }
    ref: { en: "Chad — Loi n° 9/PR/2004 (zoosanitary certificate for imported/exported animals); USDA APHIS — Unknown Requirements (APHIS Form 7001 recommended)", fr: "Tchad — Loi n° 9/PR/2004 (certificat zoosanitaire pour les animaux importés/exportés) ; USDA APHIS — Exigences inconnues (formulaire APHIS 7001 recommandé)", es: "Chad — Loi n° 9/PR/2004 (certificado zoosanitario para animales importados/exportados); USDA APHIS — Unknown Requirements (formulario APHIS 7001 recomendado)", pt: "Chade — Loi n° 9/PR/2004 (certificado zoosanitário para animais importados/exportados); USDA APHIS — Unknown Requirements (formulário APHIS 7001 recomendado)" }
  - item: { en: "Parasite / tapeworm treatment", fr: "Traitement antiparasitaire / contre les ténias", es: "Tratamiento antiparasitario / contra la tenia", pt: "Tratamento antiparasitário / contra tênias" }
    required: { en: "Not published (Unknown)", fr: "Non communiqué", es: "No comunicado", pt: "Não publicado (não informado)" }
    when: { en: "No official Chad source specifies an internal/external parasite or tapeworm treatment for pet dogs. Confirm with your vet whether one is advisable.", fr: "Aucune source officielle tchadienne ne précise de traitement antiparasitaire interne/externe ou contre les ténias pour les chiens de compagnie. Vérifie avec ton vétérinaire s'il est conseillé.", es: "Ninguna fuente oficial de Chad especifica un tratamiento antiparasitario interno/externo o contra la tenia para perros de compañía. Verifica con tu veterinario si es aconsejable.", pt: "Nenhuma fonte oficial do Chade especifica um tratamento antiparasitário interno/externo ou contra tênias para cachorros de estimação. Confirme com o seu veterinário se é aconselhável." }
    exceptions: { en: "Unknown.", fr: "Non communiqué.", es: "No comunicado.", pt: "Não informado." }
    ref: { en: "No official published Chad requirement found (Ministry of Livestock / USDA APHIS)", fr: "Aucune exigence officielle tchadienne publiée trouvée (Ministère de l'Élevage / USDA APHIS)", es: "No se encontró ningún requisito oficial de Chad publicado (Ministerio de Ganadería / USDA APHIS)", pt: "Nenhuma exigência oficial do Chade publicada foi encontrada (Ministry of Livestock / USDA APHIS)" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Not published (linked to rabies)", fr: "Non communiqué (lié à la rage)", es: "No comunicado (vinculado a la rabia)", pt: "Não publicado (vinculado à raiva)" }
    when: { en: "Chad publishes no stand-alone minimum age. In practice a puppy must be old enough to be validly vaccinated against rabies (commonly about 3 months / 12 weeks) with the vaccination effective before travel, but Chad does not publish a specific age.", fr: "Le Tchad ne publie pas d'âge minimum autonome. En pratique, un chiot doit être en âge d'être valablement vacciné contre la rage (souvent environ 3 mois / 12 semaines), la vaccination devant produire ses effets avant le voyage, mais le Tchad ne publie pas d'âge spécifique.", es: "Chad no publica ninguna edad mínima independiente. En la práctica, un cachorro debe tener edad suficiente para ser vacunado válidamente contra la rabia (habitualmente unos 3 meses / 12 semanas), con la vacunación surtiendo efecto antes del viaje, pero Chad no publica una edad específica.", pt: "O Chade não publica uma idade mínima independente. Na prática, um filhote precisa ter idade suficiente para ser validamente vacinado contra a raiva (geralmente cerca de 3 meses / 12 semanas), com a vacinação já em efeito antes da viagem, mas o Chade não publica uma idade específica." }
    exceptions: { en: "Unknown — confirm with Chad's veterinary services.", fr: "Non communiqué — à confirmer auprès des services vétérinaires du Tchad.", es: "No comunicado — confírmalo con los servicios veterinarios de Chad.", pt: "Não comunicado — confirme com os serviços veterinários do Chade." }
    ref: { en: "Derived from the rabies-vaccination recommendation; no separate published Chad minimum age", fr: "Déduit de la recommandation de vaccination antirabique ; aucun âge minimum tchadien distinct publié", es: "Derivado de la recomendación de vacunación antirrábica; ninguna edad mínima de Chad independiente publicada", pt: "Deduzido da recomendação de vacinação antirrábica; nenhuma idade mínima do Chade publicada separadamente" }
  - item: { en: "Border veterinary inspection & customs", fr: "Inspection vétérinaire frontalière et douane", es: "Inspección veterinaria fronteriza y aduanas", pt: "Inspeção veterinária de fronteira e alfândega" }
    required: { en: "Expected — details not published", fr: "Attendue — détails non publiés", es: "Prevista — detalles no publicados", pt: "Prevista — detalhes não publicados" }
    when: { en: "Chad's animal-health law organises veterinary sanitary policing, so the dog and its documents can be checked on arrival by the official veterinary services alongside customs. Chad does not publish the specific airport pet-check procedure — carry all originals and be ready to present them.", fr: "La loi sanitaire animale du Tchad organise la police sanitaire vétérinaire ; le chien et ses documents peuvent donc être contrôlés à l'arrivée par les services vétérinaires officiels, aux côtés de la douane. Le Tchad ne publie pas la procédure spécifique de contrôle des animaux à l'aéroport — garde tous les originaux et sois prêt à les présenter.", es: "La ley de sanidad animal de Chad organiza la policía sanitaria veterinaria, por lo que el perro y sus documentos pueden ser revisados a la llegada por los servicios veterinarios oficiales, junto a las aduanas. Chad no publica el procedimiento específico de control de animales en el aeropuerto — lleva todos los originales y prepárate para presentarlos.", pt: "A lei de saúde animal do Chade organiza a polícia sanitária veterinária, então o cachorro e seus documentos podem ser verificados na chegada pelos serviços veterinários oficiais, junto com a alfândega. O Chade não publica o procedimento específico de verificação de animais no aeroporto — leve todos os originais e esteja pronto para apresentá-los." }
    exceptions: { en: "Unknown — the exact inspection procedure is not published; confirm with the veterinary services.", fr: "Non communiqué — la procédure d'inspection exacte n'est pas publiée ; à confirmer auprès des services vétérinaires.", es: "No comunicado — el procedimiento de inspección exacto no se publica; confírmalo con los servicios veterinarios.", pt: "Não comunicado — o procedimento exato de inspeção não é publicado; confirme com os serviços veterinários." }
    ref: { en: "Chad — Loi n° 9/PR/2004 (veterinary sanitary policing)", fr: "Tchad — Loi n° 9/PR/2004 (police sanitaire vétérinaire)", es: "Chad — Loi n° 9/PR/2004 (policía sanitaria veterinaria)", pt: "Chade — Loi n° 9/PR/2004 (polícia sanitária veterinária)" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not published (Unknown)", fr: "Non communiqué", es: "No comunicado", pt: "Não publicado (não informado)" }
    when: { en: "No official Chad source specifies a routine quarantine for compliant pet dogs. This is an absence of published rule, not a guarantee — a non-compliant animal could still be held or refused.", fr: "Aucune source officielle tchadienne ne précise de quarantaine de routine pour les chiens conformes. C'est une absence de règle publiée, non une garantie — un animal non conforme pourrait néanmoins être retenu ou refusé.", es: "Ninguna fuente oficial de Chad especifica una cuarentena rutinaria para perros de compañía que cumplen los requisitos. Esto es una ausencia de regla publicada, no una garantía — un animal que no cumpla podría ser retenido o rechazado igualmente.", pt: "Nenhuma fonte oficial do Chade especifica uma quarentena de rotina para cachorros de estimação em conformidade. Isso é uma ausência de regra publicada, não uma garantia — um animal em situação irregular ainda poderia ser retido ou recusado." }
    exceptions: { en: "Non-compliant animals may be refused, returned or held under veterinary control at the owner's expense.", fr: "Les animaux non conformes peuvent être refusés, renvoyés ou placés sous contrôle vétérinaire aux frais du propriétaire.", es: "Los animales que no cumplan los requisitos pueden ser rechazados, devueltos o retenidos bajo control veterinario a cargo del propietario.", pt: "Animais em situação irregular podem ser recusados, devolvidos ou retidos sob controle veterinário às custas do dono." }
    ref: { en: "No published Chad quarantine rule found (Ministry of Livestock)", fr: "Aucune règle de quarantaine tchadienne publiée trouvée (Ministère de l'Élevage)", es: "No se encontró ninguna regla de cuarentena de Chad publicada (Ministerio de Ganadería)", pt: "Nenhuma regra de quarentena do Chade publicada foi encontrada (Ministry of Livestock)" }
  - item: { en: "Banned / restricted breeds", fr: "Races interdites / restreintes", es: "Razas prohibidas / restringidas", pt: "Raças proibidas / restritas" }
    required: { en: "No published breed import ban", fr: "Aucune interdiction d'importation par race publiée", es: "Ninguna prohibición de importación por raza publicada", pt: "Nenhuma proibição de importação por raça publicada" }
    when: { en: "No official Chad breed-specific import ban was found. Entry appears to be framed by health requirements, not by breed.", fr: "Aucune interdiction d'importation par race officielle tchadienne n'a été trouvée. L'entrée semble encadrée par les exigences sanitaires, non par la race.", es: "No se encontró ninguna prohibición de importación por raza oficial de Chad. La entrada parece regirse por los requisitos sanitarios, no por la raza.", pt: "Nenhuma proibição de importação por raça oficial do Chade foi encontrada. A entrada parece ser regida por exigências sanitárias, não pela raça." }
    exceptions: { en: "Unknown — no published list confirms or excludes any breed; verify with Chad's veterinary services.", fr: "Non communiqué — aucune liste publiée ne confirme ni n'exclut de race ; vérifie auprès des services vétérinaires du Tchad.", es: "No comunicado — ninguna lista publicada confirma ni excluye ninguna raza; verifica con los servicios veterinarios de Chad.", pt: "Não comunicado — nenhuma lista publicada confirma ou exclui qualquer raça; verifique com os serviços veterinários do Chade." }
    ref: { en: "No official published breed legislation found (Ministry of Livestock and Animal Production)", fr: "Aucune législation par race officielle publiée trouvée (Ministère de l'Élevage et des Productions Animales)", es: "No se encontró ninguna legislación por raza oficial publicada (Ministerio de Ganadería y Producciones Animales)", pt: "Nenhuma legislação oficial por raça publicada foi encontrada (Ministry of Livestock and Animal Production)" }

origin:
  scheme: eu
  eu:
    title: { en: "From the European Union", fr: "Depuis l'Union européenne", es: "Desde la Unión Europea", pt: "Da União Europeia" }
    body:
      en: "Chad is a non-EU third country and does not run the EU pet-passport scheme, and it publishes no EU-specific certificate model. In practice a dog leaving the EU needs a permanent identification (an ISO microchip in practice), a valid rabies vaccination, and an official international veterinary certificate issued and endorsed by the EU country's competent veterinary authority close to departure. Because Chad publishes no detailed procedure, confirm with its veterinary services or a Chadian embassy whether an import authorization or any extra condition applies before you book."
      fr: "Le Tchad est un pays tiers hors UE, n'applique pas le dispositif de passeport pour animal de compagnie de l'UE et ne publie pas de modèle de certificat propre à l'UE. En pratique, un chien quittant l'UE a besoin d'une identification permanente (une puce ISO en pratique), d'une vaccination antirabique valide et d'un certificat vétérinaire international officiel établi et visé par l'autorité vétérinaire compétente du pays de l'UE peu avant le départ. Le Tchad ne publiant aucune procédure détaillée, confirme auprès de ses services vétérinaires ou d'une ambassade du Tchad si une autorisation d'importation ou toute condition supplémentaire s'applique avant de réserver."
      es: "Chad es un país tercero fuera de la UE y no aplica el sistema de pasaporte europeo para mascotas, ni publica ningún modelo de certificado propio de la UE. En la práctica, un perro que sale de la UE necesita una identificación permanente (un microchip ISO en la práctica), una vacunación antirrábica válida y un certificado veterinario internacional oficial emitido y refrendado por la autoridad veterinaria competente del país de la UE poco antes de la salida. Como Chad no publica ningún procedimiento detallado, confirma con sus servicios veterinarios o una embajada de Chad si se aplica una autorización de importación o cualquier condición adicional antes de reservar."
      pt: "O Chade é um país terceiro fora da UE e não aplica o sistema de passaporte europeu para animais de estimação, nem publica nenhum modelo de certificado específico para a UE. Na prática, um cachorro que sai da UE precisa de uma identificação permanente (um microchip ISO na prática), de uma vacinação antirrábica válida e de um certificado veterinário internacional oficial emitido e endossado pela autoridade veterinária competente do país da UE, próximo da partida. Como o Chade não publica nenhum procedimento detalhado, confirme com os seus serviços veterinários ou com uma embaixada do Chade se uma autorização de importação ou qualquer condição extra se aplica antes de reservar."
    cls: warn
  listed:
    title: { en: "From the United States — unknown requirements", fr: "Depuis les États-Unis — exigences inconnues", es: "Desde Estados Unidos — requisitos desconocidos", pt: "Dos Estados Unidos — exigências não comunicadas" }
    body:
      en: "The United States has no agreed export certificate for Chad: USDA APHIS lists Chad under \"unknown requirements,\" meaning Chad has not informed APHIS of its pet-entry rules. APHIS recommends your pet travel with a health certificate (APHIS Form 7001) issued by a USDA-accredited veterinarian and endorsed by APHIS, plus proof of a current rabies vaccination. Because this is a recommendation rather than an agreed Chadian model, contact Chad's animal-health officials (or its embassy) directly to confirm what will be accepted on arrival."
      fr: "Les États-Unis n'ont pas de certificat d'exportation convenu pour le Tchad : l'USDA APHIS classe le Tchad parmi les « exigences inconnues », le Tchad n'ayant pas informé l'APHIS de ses règles d'entrée pour les animaux. L'APHIS recommande que ton animal voyage avec un certificat sanitaire (formulaire APHIS 7001) établi par un vétérinaire accrédité USDA et endossé par l'APHIS, ainsi que la preuve d'une vaccination antirabique à jour. S'agissant d'une recommandation et non d'un modèle tchadien convenu, contacte directement les autorités sanitaires animales du Tchad (ou son ambassade) pour confirmer ce qui sera accepté à l'arrivée."
      es: "Estados Unidos no tiene un certificado de exportación acordado para Chad: la USDA APHIS clasifica a Chad entre los «requisitos desconocidos», lo que significa que Chad no ha informado a la APHIS de sus reglas de entrada para animales. La APHIS recomienda que tu mascota viaje con un certificado sanitario (formulario APHIS 7001) emitido por un veterinario acreditado por el USDA y refrendado por la APHIS, más prueba de una vacunación antirrábica al día. Como se trata de una recomendación y no de un modelo chadiano acordado, contacta directamente con las autoridades de sanidad animal de Chad (o su embajada) para confirmar qué se aceptará a la llegada."
      pt: "Os Estados Unidos não têm um certificado de exportação acordado para o Chade: o USDA APHIS classifica o Chade entre as \"exigências não comunicadas\", o que significa que o Chade não informou o APHIS sobre suas regras de entrada de animais. O APHIS recomenda que o seu animal de estimação viaje com um certificado sanitário (formulário APHIS 7001) emitido por um veterinário credenciado pelo USDA e endossado pelo APHIS, além de comprovação de vacinação antirrábica em dia. Como se trata de uma recomendação, e não de um modelo chadiano acordado, contate diretamente as autoridades de saúde animal do Chade (ou a sua embaixada) para confirmar o que será aceito na chegada."
    cls: warn
  nonListed:
    title: { en: "From other countries — general framework", fr: "Depuis d'autres pays — cadre général", es: "Desde otros países — marco general", pt: "De outros países — marco geral" }
    body:
      en: "For other origins there is likewise no publicly posted country-specific model. The prudent core is a permanent identification, a valid rabies vaccination and an official international veterinary (zoosanitary) certificate issued by a government-accredited vet and endorsed by the origin's veterinary authority, followed by veterinary control at the Chadian border. Use your own country's official export model, and confirm any additional Chadian condition with the Ministry of Livestock and Animal Production's veterinary services."
      fr: "Pour les autres origines, aucun modèle propre au pays n'est publié non plus. Le socle prudent est une identification permanente, une vaccination antirabique valide et un certificat vétérinaire (zoosanitaire) international officiel établi par un vétérinaire accrédité et visé par l'autorité vétérinaire d'origine, suivi d'un contrôle vétérinaire à la frontière tchadienne. Utilise le modèle d'exportation officiel de ton propre pays, et confirme toute condition tchadienne supplémentaire auprès des services vétérinaires du Ministère de l'Élevage et des Productions Animales."
      es: "Para otros orígenes tampoco hay ningún modelo propio del país publicado. El núcleo prudente es una identificación permanente, una vacunación antirrábica válida y un certificado veterinario (zoosanitario) internacional oficial emitido por un veterinario acreditado por el gobierno y refrendado por la autoridad veterinaria de origen, seguido de un control veterinario en la frontera chadiana. Usa el modelo de exportación oficial de tu propio país, y confirma cualquier condición chadiana adicional con los servicios veterinarios del Ministerio de Ganadería y Producciones Animales."
      pt: "Para outras origens também não há nenhum modelo próprio do país publicado. O núcleo prudente é uma identificação permanente, uma vacinação antirrábica válida e um certificado veterinário (zoosanitário) internacional oficial emitido por um veterinário credenciado pelo governo e endossado pela autoridade veterinária de origem, seguido de um controle veterinário na fronteira chadiana. Use o modelo de exportação oficial do seu próprio país, e confirme qualquer condição chadiana adicional com os serviços veterinários do Ministério da Pecuária e Produção Animal."
    cls: neutral

arrival:
  intro:
    en: "What happens when your dog reaches Chad is not published in detail, so prepare a complete, valid document set and expect an official veterinary check."
    fr: "Ce qui se passe à l'arrivée de ton chien au Tchad n'est pas publié en détail ; prépare donc un dossier complet et valide et attends-toi à un contrôle vétérinaire officiel."
    es: "Lo que ocurre cuando tu perro llega a Chad no se publica en detalle, así que prepara un conjunto de documentos completo y válido y espera un control veterinario oficial."
    pt: "O que acontece quando o seu cachorro chega ao Chade não é publicado em detalhe, então prepare um conjunto completo e válido de documentos e espere uma verificação veterinária oficial."
  points:
    - en: "Chad's animal-health law organises veterinary sanitary policing, so your dog and its documents can be checked on arrival by the official veterinary services alongside customs."
      fr: "La loi sanitaire animale du Tchad organise la police sanitaire vétérinaire ; ton chien et tes documents peuvent donc être contrôlés à l'arrivée par les services vétérinaires officiels, aux côtés de la douane."
      es: "La ley de sanidad animal de Chad organiza la policía sanitaria veterinaria, por lo que tu perro y tus documentos pueden ser revisados a la llegada por los servicios veterinarios oficiales, junto a las aduanas."
      pt: "A lei de saúde animal do Chade organiza a polícia sanitária veterinária, então o seu cachorro e os seus documentos podem ser verificados na chegada pelos serviços veterinários oficiais, junto com a alfândega."
    - en: "Carry the originals: the international veterinary (zoosanitary) certificate, proof of identification and proof of a valid rabies vaccination."
      fr: "Munis-toi des originaux : le certificat vétérinaire (zoosanitaire) international, la preuve d'identification et la preuve d'une vaccination antirabique valide."
      es: "Lleva los originales: el certificado veterinario (zoosanitario) internacional, la prueba de identificación y la prueba de una vacunación antirrábica válida."
      pt: "Leve os originais: o certificado veterinário (zoosanitário) internacional, o comprovante de identificação e o comprovante de uma vacinação antirrábica válida."
    - en: "If your certificate has a validity window (for example a US-issued health certificate endorsed by USDA), arrive within it and keep the endorsement intact."
      fr: "Si ton certificat a une fenêtre de validité (par exemple un certificat sanitaire émis aux États-Unis et endossé par l'USDA), arrive dans ce délai et conserve le visa intact."
      es: "Si tu certificado tiene una ventana de valide (por ejemplo, un certificado sanitario emitido en EE. UU. y refrendado por el USDA), llega dentro de ese plazo y conserva el refrendo intacto."
      pt: "Se o seu certificado tiver uma janela de validade (por exemplo, um certificado sanitário emitido nos EUA e endossado pelo USDA), chegue dentro desse prazo e mantenha o endosso intacto."
    - en: "If documents are missing, incomplete or invalid, the animal may be refused, returned or held under veterinary control at the owner's expense; the exact consequences are not published, so avoid any gap in your paperwork."
      fr: "Si les documents manquent, sont incomplets ou invalides, l'animal peut être refusé, renvoyé ou placé sous contrôle vétérinaire aux frais du propriétaire ; les conséquences exactes ne sont pas publiées, évite donc toute lacune dans ton dossier."
      es: "Si faltan documentos, están incompletos o no son válidos, el animal puede ser rechazado, devuelto o retenido bajo control veterinario a cargo del propietario; las consecuencias exactas no se publican, así que evita cualquier laguna en tu documentación."
      pt: "Se faltarem documentos, ou se estiverem incompletos ou inválidos, o animal pode ser recusado, devolvido ou retido sob controle veterinário às custas do dono; as consequências exatas não são publicadas, então evite qualquer lacuna na sua documentação."
    - en: "Because Chad publishes almost nothing, confirm entry-point procedures with its veterinary services or a Chadian embassy and with your airline before departure."
      fr: "Le Tchad ne publiant presque rien, confirme les procédures au point d'entrée avec ses services vétérinaires ou une ambassade du Tchad et avec ta compagnie aérienne avant le départ."
      es: "Como Chad no publica casi nada, confirma los procedimientos del punto de entrada con sus servicios veterinarios o una embajada de Chad y con tu aerolínea antes de la salida."
      pt: "Como o Chade publica quase nenhuma informação, confirme os procedimentos no ponto de entrada com os seus serviços veterinários ou com uma embaixada do Chade, e com a sua companhia aérea, antes da partida."

travellerExperience: null

restrictedDogs:
  intro:
    en: "No official Chad breed-specific import ban was found in published government sources. Entry appears to be controlled by veterinary health requirements and border control, not by breed."
    fr: "Aucune interdiction d'importation par race officielle tchadienne n'a été trouvée dans les sources gouvernementales publiées. L'entrée semble encadrée par les exigences sanitaires vétérinaires et le contrôle frontalier, non par la race."
    es: "No se encontró ninguna prohibición de importación por raza oficial de Chad en las fuentes gubernamentales publicadas. La entrada parece controlarse mediante los requisitos sanitarios veterinarios y el control fronterizo, no por la raza."
    pt: "Nenhuma proibição de importação por raça oficial do Chade foi encontrada nas fontes governamentais publicadas. A entrada parece ser controlada pelas exigências sanitárias veterinárias e pelo controle de fronteira, não pela raça."
  cat1:
    en: "There is no published national list of prohibited or dangerous breeds for import. Absence of a published list is not the same as a guarantee — no official text confirms that every breed is admitted either."
    fr: "Il n'existe pas de liste nationale publiée de races interdites ou dangereuses à l'importation. L'absence de liste publiée ne vaut pas garantie — aucun texte officiel ne confirme non plus que toutes les races sont admises."
    es: "No existe ninguna lista nacional publicada de razas prohibidas o peligrosas para la importación. La ausencia de una lista publicada no equivale a una garantía — ningún texto oficial confirma tampoco que todas las razas estén admitidas."
    pt: "Não existe nenhuma lista nacional publicada de raças proibidas ou perigosas para importação. A ausência de uma lista publicada não equivale a uma garantia — nenhum texto oficial confirma tampouco que todas as raças sejam admitidas."
  cat2:
    en: "No published 'permitted with conditions' category exists for particular breeds. Any local rules on keeping certain dogs, if they exist, are not documented in the official sources reviewed."
    fr: "Aucune catégorie « autorisée sous conditions » publiée n'existe pour des races particulières. D'éventuelles règles locales sur la détention de certains chiens, si elles existent, ne sont pas documentées dans les sources officielles consultées."
    es: "No existe ninguna categoría «autorizada con condiciones» publicada para razas concretas. Cualquier norma local sobre la tenencia de ciertos perros, si existe, no está documentada en las fuentes oficiales consultadas."
    pt: "Não existe nenhuma categoria publicada de \"permitido com condições\" para raças específicas. Eventuais regras locais sobre a posse de determinados cachorros, se existirem, não estão documentadas nas fontes oficiais consultadas."
  note:
    en: "Because the position is unpublished rather than confirmed, verify your specific breed with Chad's veterinary services before you travel, especially for types often restricted elsewhere."
    fr: "La situation étant non publiée plutôt que confirmée, vérifie ta race précise auprès des services vétérinaires du Tchad avant de voyager, surtout pour les types souvent restreints ailleurs."
    es: "Como la situación no está publicada más que confirmada, verifica tu raza concreta con los servicios veterinarios de Chad antes de viajar, sobre todo para los tipos que a menudo se restringen en otros lugares."
    pt: "Como a situação é não publicada, e não confirmada, verifique a sua raça específica com os serviços veterinários do Chade antes de viajar, especialmente para tipos frequentemente restritos em outros lugares."

checklist:
  - en: "Confirm with Chad's veterinary services or a Chadian embassy whether an import authorization or any extra condition applies (Chad publishes almost nothing)"
    fr: "Confirme auprès des services vétérinaires du Tchad ou d'une ambassade du Tchad si une autorisation d'importation ou une condition supplémentaire s'applique (le Tchad publie presque rien)"
    es: "Confirma con los servicios veterinarios de Chad o una embajada de Chad si se aplica una autorización de importación o cualquier condición adicional (Chad publica casi nada)"
    pt: "Confirme com os serviços veterinários do Chade ou com uma embaixada do Chade se uma autorização de importação ou qualquer condição extra se aplica (o Chade publica quase nenhuma informação)"
  - en: "Permanent identification (ISO microchip recommended) placed before the rabies vaccination"
    fr: "Identification permanente (puce ISO recommandée) posée avant la vaccination antirabique"
    es: "Identificación permanente (microchip ISO recomendado) colocada antes de la vacunación antirrábica"
    pt: "Identificação permanente (microchip ISO recomendado) colocada antes da vacinação antirrábica"
  - en: "Valid rabies vaccination recorded with date, vaccine, batch and validity (primary shot to take effect before travel)"
    fr: "Vaccination antirabique valide consignée avec date, vaccin, lot et validité (primo-vaccination produisant ses effets avant le voyage)"
    es: "Vacunación antirrábica válida registrada con fecha, vacuna, lote y valide (primovacunación que surta efecto antes del viaje)"
    pt: "Vacinação antirrábica válida registrada com data, vacina, lote e validade (dose primária em efeito antes da viagem)"
  - en: "Official international veterinary (zoosanitary) certificate issued and endorsed by the origin's veterinary authority (US: APHIS Form 7001 endorsed by USDA)"
    fr: "Certificat vétérinaire (zoosanitaire) international officiel établi et visé par l'autorité vétérinaire d'origine (États-Unis : formulaire APHIS 7001 endossé par l'USDA)"
    es: "Certificado veterinario (zoosanitario) internacional oficial emitido y refrendado por la autoridad veterinaria de origen (EE. UU.: formulario APHIS 7001 refrendado por el USDA)"
    pt: "Certificado veterinário (zoosanitário) internacional oficial emitido e endossado pela autoridade veterinária de origem (EUA: formulário APHIS 7001 endossado pelo USDA)"
  - en: "Up-to-date vaccination records carried with you"
    fr: "Preuves de vaccination à jour emportées avec toi"
    es: "Registros de vacunación actualizados que lleves contigo"
    pt: "Registros de vacinação atualizados levados com você"
  - en: "Original documents ready for a possible border veterinary check and customs"
    fr: "Documents originaux prêts pour un éventuel contrôle vétérinaire frontalier et la douane"
    es: "Documentos originales listos para un posible control veterinario fronterizo y las aduanas"
    pt: "Documentos originais prontos para uma possível verificação veterinária de fronteira e alfândega"
  - en: "Confirm any quarantine, parasite-treatment, minimum-age or breed point directly with the veterinary services (all unpublished)"
    fr: "Confirme tout point de quarantaine, traitement antiparasitaire, âge minimum ou race directement avec les services vétérinaires (tous non publiés)"
    es: "Confirma cualquier punto de cuarentena, tratamiento antiparasitario, edad mínima o raza directamente con los servicios veterinarios (todos no publicados)"
    pt: "Confirme qualquer ponto de quarentena, tratamento antiparasitário, idade mínima ou raça diretamente com os serviços veterinários (todos não publicados)"
  - en: "If you will return to the EU, plan the rabies antibody test (Chad is treated as a non-listed third country in a rabies-endemic region)"
    fr: "Si tu rentre dans l'UE, prévois le titrage des anticorps antirabiques (le Tchad est traité comme un pays tiers non listé, dans une région où la rage est endémique)"
    es: "Si vas a regresar a la UE, planifica la prueba de titulación de anticuerpos contra la rabia (Chad se trata como un país tercero no listado, en una región donde la rabia es endémica)"
    pt: "Se você for retornar à UE, planeje o teste sorológico antirrábico (o Chade é tratado como um país terceiro não listado, em uma região com raiva endêmica)"
  - en: "Airline reservation confirming your dog's travel option and a suitable IATA crate"
    fr: "Réservation confirmant l'option de transport de ton chien et une caisse IATA adaptée"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y una jaula IATA adecuada"
    pt: "Reserva na companhia aérea confirmando a opção de viagem do cachorro e uma caixa de transporte adequada às normas IATA"

