# Country Entry Guide — Philippines (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
# The Philippines is NOT in the EU. It runs its own national scheme through the
# Department of Agriculture — Bureau of Animal Industry (DA-BAI) and its National
# Veterinary Quarantine Services Division (NVQSD). The single mandatory step is to
# secure an approved Sanitary and Phytosanitary Import Clearance (SPSIC / import permit)
# ONLINE before travel; the SPSIC is then presented to the exporting country's veterinary
# authority to obtain the export permit / international veterinary health certificate
# (EP/IVHC). ISO microchip -> rabies + core vaccinations -> internal/external parasite
# treatment -> EP/IVHC issued within 10 days of departure -> on arrival a BAI Veterinary
# Quarantine Officer (VQO) inspects the animal and clears it. No rabies antibody test is
# required, and there is no routine quarantine if every condition is met.
# The eu/listed/nonListed slots are repurposed to the Philippines' practical paths:
# eu = fully compliant dog with valid vaccinations (standard, no quarantine);
# listed = dog from a WOAH rabies-free country (rabies vaccine may be waived by attestation);
# nonListed = non-compliant arrival or missing SPSIC/IVHC (seized/refused/returned).
id: country_ph
iso2: "PH"
name: { en: "Philippines", fr: "Philippines", es: "Filipinas", pt: "Filipinas" }
region: { en: "Asia", fr: "Asie", es: "Asia", pt: "Ásia" }


regime: non_listed
domestic:
  intro:
    en: "Domestic flight in the Philippines: every inter-island move of a pet needs a national shipping permit."
    fr: "Vol intérieur aux Philippines : tout déplacement d'animal entre îles requiert un permis national de transport."
    es: "Vuelo nacional en Filipinas: todo traslado de mascota entre islas requiere un permiso nacional de transporte."
    pt: "Voo doméstico nas Filipinas: todo deslocamento entre ilhas de um animal de estimação precisa de uma autorização nacional de transporte."
  points:
    - en: "A Local Shipping Permit from the Bureau of Animal Industry is required for domestic movement, including inter-island. It is free and takes about 3 working days, applied for online."
      fr: "Un Local Shipping Permit du Bureau of Animal Industry est exigé pour tout mouvement intérieur, y compris entre îles. Il est gratuit, s'obtient en ligne et prend environ 3 jours ouvrés."
      es: "Se exige un Local Shipping Permit del Bureau of Animal Industry para el movimiento nacional, incluido entre islas. Es gratuito, se solicita en línea y tarda unos 3 días hábiles."
      pt: "Um Local Shipping Permit do Bureau of Animal Industry é obrigatório para o deslocamento doméstico, inclusive entre ilhas. É gratuito e leva cerca de 3 dias úteis, solicitado on-line."
    - en: "Rabies vaccination must be at least 14 days and at most 1 year old, and the dog must be about 4 months minimum to be shipped."
      fr: "La vaccination antirabique doit dater d'au moins 14 jours et d'au plus 1 an, et le chien doit avoir environ 4 mois minimum pour être transporté."
      es: "La vacuna antirrábica debe tener al menos 14 días y como máximo 1 año, y el perro debe tener unos 4 meses mínimo para ser transportado."
      pt: "A vacinação antirrábica precisa ter pelo menos 14 dias e no máximo 1 ano, e o cachorro precisa ter cerca de 4 meses no mínimo para ser transportado."
    - en: "Some provinces are declared rabies-free and add their own entry rules at local level — check with the destination provincial or city veterinary office."
      fr: "Certaines provinces sont déclarées indemnes de rage et ajoutent leurs propres règles d'entrée au niveau local — renseigne-toi auprès du bureau vétérinaire provincial ou municipal de destination."
      es: "Algunas provincias están declaradas libres de rabia y añaden sus propias reglas de entrada a nivel local — consulta la oficina veterinaria provincial o municipal de destino."
      pt: "Algumas províncias são declaradas livres de raiva e acrescentam suas próprias regras de entrada em nível local — confira com o escritório veterinário provincial ou municipal de destino."
exit:
  authority: BAI
  authorityUrl: https://www.bai.gov.ph/
  intro:
    en: "The Philippines is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export permit and international veterinary health certificate (EP/IVHC) from the Bureau of Animal Industry (BAI)."
    fr: "Les Philippines sont un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un permis d'export et un certificat sanitaire vétérinaire international (EP/IVHC) du Bureau de l'industrie animale (BAI)."
    es: "Filipinas no está listada: una titulación antirrábica válida es obligatoria para volver a la UE — más un permiso de exportación y un certificado sanitario veterinario internacional (EP/IVHC) del Buró de Industria Animal (BAI)."
    pt: "As Filipinas são um país não listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para retornar à UE — além de uma autorização de exportação e de um atestado de saúde veterinário internacional (EP/IVHC) do Bureau of Animal Industry (BAI)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "The BAI issues the export permit / international veterinary health certificate (EP/IVHC) within 10 days before departure — apply to the BAI as the official veterinary authority."
        fr: "Le BAI délivre le permis d'export / certificat sanitaire vétérinaire international (EP/IVHC) dans les 10 jours avant le départ — adresse-toi au BAI, l'autorité vétérinaire officielle."
        es: "El BAI emite el permiso de exportación / certificado sanitario veterinario internacional (EP/IVHC) dentro de los 10 días antes de salir — dirígete al BAI, la autoridad veterinaria oficial."
        pt: "O BAI emite a autorização de exportação / atestado de saúde veterinário internacional (EP/IVHC) dentro de 10 dias antes da partida — solicite ao BAI como autoridade veterinária oficial."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to the Philippines with your dog", fr: "Voyager aux Philippines avec ton chien", es: "Viajar a Filipinas con tu perro", pt: "Viajar para as Filipinas com seu cachorro" }
  intro:
    en: >-
      The Philippines welcomes dogs, but it runs its own import scheme through the Department of
      Agriculture — Bureau of Animal Industry (DA-BAI), not the EU framework. The single most important
      step is to secure an approved Sanitary and Phytosanitary Import Clearance (SPSIC) — the import
      permit — online before you fly. Your dog needs an ISO-compatible microchip, a valid rabies
      vaccination (minimum age 84 days, given at least 14 days before you apply), core vaccinations and
      a preventive treatment against internal and external parasites. Once the SPSIC is approved you
      present it to the exporting country's veterinary authority to obtain an export permit / international
      veterinary health certificate (EP/IVHC) issued within 10 days of departure. A rabies antibody test
      is not required. On arrival a BAI Veterinary Quarantine Officer inspects your dog; meet every
      condition and there is no quarantine.
    fr: >-
      Les Philippines accueillent les chiens, mais appliquent leur propre régime d'importation via le
      Département de l'agriculture — Bureau de l'industrie animale (DA-BAI), et non le cadre européen.
      L'étape la plus importante est d'obtenir une autorisation sanitaire et phytosanitaire d'importation
      (SPSIC) — le permis d'importation — en ligne avant de partir. Ton chien a besoin d'une puce
      compatible ISO, d'une vaccination antirabique valide (âge minimal 84 jours, administrée au moins
      14 jours avant la demande), de vaccins de base et d'un traitement préventif contre les parasites
      internes et externes. Une fois le SPSIC approuvé, tu le présente à l'autorité vétérinaire du pays
      exportateur pour obtenir un permis d'export / certificat vétérinaire international (EP/IVHC) établi
      dans les 10 jours avant le départ. Un titrage des anticorps antirabiques n'est pas exigé. À
      l'arrivée, un agent de quarantaine vétérinaire du BAI inspecte ton chien ; si toutes les
      conditions sont remplies, il n'y a pas de quarantaine.
    es: >-
      Filipinas acoge a los perros, pero aplica su propio régimen de importación a través del
      Departamento de Agricultura — Oficina de Industria Animal (DA-BAI), no el marco de la UE. El paso
      más importante es obtener una autorización sanitaria y fitosanitaria de importación aprobada
      (SPSIC) — el permiso de importación — en línea antes de volar. Tu perro necesita un microchip
      compatible con ISO, una vacunación antirrábica válida (edad mínima 84 días, administrada al menos
      14 días antes de la solicitud), las vacunas básicas y un tratamiento preventivo contra los
      parásitos internos y externos. Una vez aprobada la SPSIC, la presentas a la autoridad veterinaria
      del país exportador para obtener un permiso de exportación / certificado sanitario veterinario
      internacional (EP/IVHC) emitido dentro de los 10 días previos a la salida. No se exige una prueba
      de titulación de rabia. A la llegada, un oficial de cuarentena veterinaria del BAI inspecciona a tu
      perro; si cumples todas las condiciones, no hay cuarentena.

    pt: "As Filipinas recebem cachorros, mas aplicam seu próprio esquema de importação por meio do Department of Agriculture — Bureau of Animal Industry (DA-BAI), e não o marco da UE. A etapa mais importante é obter, on-line, um Sanitary and Phytosanitary Import Clearance (SPSIC) aprovado — a autorização de importação — antes de voar. Seu cachorro precisa de um microchip compatível com ISO, uma vacinação antirrábica válida (idade mínima de 84 dias, aplicada pelo menos 14 dias antes do pedido), vacinas essenciais e um tratamento preventivo contra parasitas internos e externos. Depois que o SPSIC for aprovado, você o apresenta à autoridade veterinária do país exportador para obter uma autorização de exportação / atestado de saúde veterinário internacional (EP/IVHC) emitido dentro de 10 dias antes da partida. Um teste sorológico antirrábico não é exigido. Na chegada, um Veterinary Quarantine Officer do BAI inspeciona o seu cachorro; cumprindo todas as condições, não há quarentena."
difficulty:
  level: moderate
  label: { en: "Moderate — an advance import clearance (SPSIC) is mandatory", fr: "Modéré — une autorisation d'importation préalable (SPSIC) est obligatoire", es: "Moderado — una autorización de importación previa (SPSIC) es obligatoria", pt: "Moderado — uma autorização de importação prévia (SPSIC) é obrigatória" }

prepTime:
  eu:
    en: "Compliant dog (valid vaccinations): ~2-3 weeks — apply online for the SPSIC (valid 60 days), then obtain the EP/IVHC within 10 days before departure; no quarantine if fully compliant."
    fr: "Chien conforme (vaccins valides) : ~2-3 semaines — demande du SPSIC en ligne (valable 60 jours), puis obtention de l'EP/IVHC dans les 10 jours avant le départ ; pas de quarantaine si totalement conforme."
    es: "Perro conforme (vacunas válidas): ~2-3 semanas — solicita la SPSIC en línea (válida 60 días) y luego obtén el EP/IVHC dentro de los 10 días previos a la salida; sin cuarentena si cumple del todo."
    pt: "Cachorro em conformidade (vacinas válidas): cerca de 2 a 3 semanas — solicite on-line o SPSIC (válido por 60 dias), depois obtenha o EP/IVHC dentro de 10 dias antes da partida; sem quarentena se totalmente em conformidade."
  listed:
    en: "Primary or lapsed rabies vaccination: allow more time — the initial rabies vaccine must be given at least 14 days before the SPSIC application, so plan the vaccination schedule several weeks ahead."
    fr: "Vaccination antirabique primaire ou périmée : prévois plus de temps — le premier vaccin antirabique doit être administré au moins 14 jours avant la demande de SPSIC ; planifie le calendrier vaccinal plusieurs semaines à l'avance."
    es: "Vacunación antirrábica primaria o caducada: prevé más tiempo — la primera vacuna antirrábica debe administrarse al menos 14 días antes de la solicitud de la SPSIC, así que planifica el calendario de vacunación varias semanas antes."
    pt: "Primeira dose ou vacinação antirrábica vencida: reserve mais tempo — a primeira dose da vacina antirrábica precisa ser aplicada pelo menos 14 dias antes do pedido do SPSIC, então planeje o calendário de vacinação com várias semanas de antecedência."
  nonListed:
    en: "Non-compliant arrival or missing SPSIC/IVHC: no legal entry path — a dog arriving without an approved SPSIC and original EP/IVHC is refused, seized or returned to the country of origin at the owner's expense."
    fr: "Arrivée non conforme ou SPSIC/IVHC manquant : aucune voie d'entrée légale — un chien arrivant sans SPSIC approuvé ni EP/IVHC original est refusé, saisi ou renvoyé vers le pays d'origine aux frais du propriétaire."
    es: "Llegada no conforme o SPSIC/IVHC ausente: no hay vía de entrada legal — un perro que llega sin una SPSIC aprobada y el EP/IVHC original es rechazado, incautado o devuelto al país de origen a cargo del propietario."
    pt: "Chegada em não conformidade ou SPSIC/IVHC ausente: nenhum caminho legal de entrada — um cachorro que chega sem um SPSIC aprovado e o EP/IVHC original é recusado, apreendido ou devolvido ao país de origem, às custas do dono."

