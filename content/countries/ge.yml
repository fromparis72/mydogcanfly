arrival:
  intro:
    en: "What happens when your dog reaches Georgia depends on where you flew from, but every arrival can be checked at the border."
    fr: "Ce qui se passe à l'arrivée de ton chien en Géorgie dépend de ton lieu de départ, mais toute arrivée peut être contrôlée à la frontière."
    es: "Lo que ocurre cuando tu perro llega a Georgia depende del lugar desde el que hayas volado, pero cualquier llegada puede controlarse en la frontera."
    pt: "O que acontece quando seu cachorro chega à Geórgia depende de onde você partiu, mas toda chegada pode ser controlada na fronteira."
  points:
    - en: "Present the pet passport or the official health certificate, together with the signed non-commercial declaration (Annex No. 5), to customs and the veterinary control at the point of entry."
      fr: "Présente le passeport ou le certificat sanitaire officiel, avec la déclaration non commerciale signée (annexe n° 5), à la douane et au contrôle vétérinaire au point d'entrée."
      es: "Presenta el pasaporte para mascotas o el certificado sanitario oficial, junto con la declaración no comercial firmada (anexo n.º 5), a las aduanas y al control veterinario en el punto de entrada."
      pt: "Apresente o passaporte para animais ou o atestado de saúde oficial, junto com a declaração não comercial assinada (anexo nº 5), à alfândega e ao controle veterinário no ponto de entrada."
    - en: "Officers may read the microchip and check that it matches the documents; the transponder must be readable, and the owner should be able to supply a reader for a non-standard chip."
      fr: "Les agents peuvent lire la puce et vérifier qu'elle correspond aux documents ; le transpondeur doit être lisible, et le propriétaire doit pouvoir fournir un lecteur pour une puce non normalisée."
      es: "Los agentes pueden leer el microchip y comprobar que coincide con los documentos; el transpondedor debe ser legible, y el propietario debe poder proporcionar un lector para un microchip no estándar."
      pt: "Os agentes podem ler o microchip e conferir se ele coincide com os documentos; o transponder precisa ser legível, e o dono deve poder fornecer um leitor para um microchip fora do padrão."
    - en: "Non-commercial movement covers up to five pets accompanying their owner; more than five is allowed only for competitions/exhibitions with proof of registration and animals over six months old."
      fr: "Le mouvement non commercial couvre jusqu'à cinq animaux accompagnant leur propriétaire ; plus de cinq n'est admis que pour concours/expositions avec preuve d'inscription et animaux de plus de six mois."
      es: "El movimiento no comercial cubre hasta cinco mascotas que acompañan a su propietario; más de cinco solo se admite para concursos/exposiciones con prueba de inscripción y animales mayores de seis meses."
      pt: "O movimento não comercial abrange até cinco animais acompanhando seu dono; mais de cinco só é permitido para competições/exposições com comprovante de inscrição e animais com mais de seis meses."
    - en: "Movement for sale or transfer of ownership is not non-commercial and requires the separate commercial veterinary import procedure."
      fr: "Un déplacement pour vente ou transfert de propriété n'est pas non commercial et exige la procédure d'importation vétérinaire commerciale distincte."
      es: "Un traslado para venta o transferencia de propiedad no es no comercial y exige el procedimiento de importación veterinaria comercial aparte."
      pt: "O movimento para venda ou transferência de propriedade não é não comercial e exige o procedimento veterinário de importação comercial separado."
    - en: "Carry original documents (not copies); a separate set of documents is shown for each animal."
      fr: "Munis-toi des documents originaux (pas de copies) ; un jeu de documents distinct est présenté pour chaque animal."
      es: "Lleva los documentos originales (no copias); se muestra un juego de documentos aparte para cada animal."
      pt: "Leve os documentos originais (não cópias); um conjunto separado de documentos é apresentado para cada animal."
    - en: "If documents are missing or invalid, the border veterinary control may refuse entry or order corrective measures — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, le contrôle vétérinaire frontalier peut refuser l'entrée ou ordonner des mesures correctives — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, el control veterinario fronterizo puede denegar la entrada u ordenar medidas correctoras — a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, o controle veterinário de fronteira pode recusar a entrada ou determinar medidas corretivas — às custas do dono."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Georgia's official pet-movement rules (Government Ordinance No. 551) set no breed-specific import restriction: entry conditions are the same for every dog, based on identification, rabies vaccination, parasite treatment and certification — not on breed. No national list of banned or dangerous breeds is published in the official import materials."
    fr: "Les règles officielles géorgiennes de mouvement des animaux (ordonnance gouvernementale n° 551) ne prévoient aucune restriction d'importation propre à une race : les conditions d'entrée sont les mêmes pour tout chien, fondées sur l'identification, la vaccination antirabique, le traitement antiparasitaire et la certification — pas sur la race. Aucune liste nationale de races interdites ou dangereuses n'est publiée dans les documents d'importation officiels."
    es: "Las normas oficiales georgianas de movimiento de animales (Orden Gubernamental n.º 551) no establecen ninguna restricción de importación por raza: las condiciones de entrada son las mismas para todo perro, basadas en la identificación, la vacunación antirrábica, el tratamiento antiparasitario y la certificación — no en la raza. No se publica ninguna lista nacional de razas prohibidas o peligrosas en los documentos oficiales de importación."
    pt: "As regras oficiais de circulação de animais da Geórgia (Decreto Governamental nº 551) não estabelecem nenhuma restrição de importação por raça: as condições de entrada são as mesmas para todo cachorro, com base na identificação, na vacinação antirrábica, no tratamento antiparasitário e na certificação — não na raça. Nenhuma lista nacional de raças banidas ou perigosas é publicada nos materiais oficiais de importação."
  cat1:
    en: "There is no national Category 1 equivalent and no breed is banned from entry at the national level. Import formalities follow the standard veterinary rules (microchip, rabies vaccination, parasite treatment, certificate/passport) regardless of breed."
    fr: "Il n'existe pas d'équivalent national de la catégorie 1 et aucune race n'est interdite d'entrée au niveau national. Les formalités d'importation suivent les règles vétérinaires standard (puce, vaccination antirabique, traitement antiparasitaire, certificat/passeport) quelle que soit la race."
    es: "No existe un equivalente nacional de la categoría 1 y ninguna raza tiene prohibida la entrada a nivel nacional. Los trámites de importación siguen las normas veterinarias estándar (microchip, vacunación antirrábica, tratamiento antiparasitario, certificado/pasaporte) sea cual sea la raza."
    pt: "Não existe um equivalente nacional à categoria 1, e nenhuma raça tem a entrada proibida em nível nacional. As formalidades de importação seguem as regras veterinárias padrão (microchip, vacinação antirrábica, tratamento antiparasitário, certificado/passaporte), independentemente da raça."
  cat2:
    en: "No national Category 2 (keeping) breed regime is published in the official import materials. Any local keeping or leashing rules would be a municipal matter, not an entry condition."
    fr: "Aucun régime national de catégorie 2 (détention) par race n'est publié dans les documents d'importation officiels. D'éventuelles règles locales de détention ou de tenue en laisse relèveraient de la commune, non des conditions d'entrée."
    es: "No se publica ningún régimen nacional de categoría 2 (tenencia) por raza en los documentos oficiales de importación. Cualquier norma local de tenencia o de uso de correa sería un asunto municipal, no una condición de entrada."
    pt: "Nenhum regime nacional de categoria 2 (posse) por raça é publicado nos materiais oficiais de importação. Eventuais regras locais de posse ou de uso de guia seriam uma questão municipal, não uma condição de entrada."
  note:
    en: "As official Georgian sources publish no national restricted-breed list, we mark that detail as not published rather than infer one. Confirm any local keeping obligations with the relevant authority if you plan to stay with a powerful or guard-type dog."
    fr: "Les sources officielles géorgiennes ne publiant aucune liste nationale de races réglementées, nous indiquons ce point comme non communiqué plutôt que de l'inférer. Confirme d'éventuelles obligations locales de détention auprès de l'autorité compétente si tu séjourne avec un chien puissant ou de type garde."
    es: "Como las fuentes oficiales georgianas no publican ninguna lista nacional de razas reguladas, señalamos ese punto como no publicado en lugar de inferirlo. Confirma cualquier obligación local de tenencia con la autoridad competente si vas a alojarte con un perro potente o de tipo guardián."
    pt: "Como as fontes oficiais georgianas não publicam nenhuma lista nacional de raças restritas, marcamos esse detalhe como não publicado em vez de presumir uma. Confirme qualquer obrigação local de posse junto à autoridade competente se você planeja ficar com um cachorro forte ou do tipo guarda."

checklist:
  - en: "Microchip (ISO 11784/11785, HDX or FDX-B) readable and recorded on the documents"
    fr: "Puce (ISO 11784/11785, HDX ou FDX-B) lisible et consignée sur les documents"
    es: "Microchip (ISO 11784/11785, HDX o FDX-B) legible y registrado en los documentos"
    pt: "Microchip (ISO 11784/11785, HDX ou FDX-B) legível e registrado nos documentos"
  - en: "Valid rabies vaccination (at least 21 days after the primary shot)"
    fr: "Vaccination antirabique valide (au moins 21 jours après la primo-vaccination)"
    es: "Vacunación antirrábica válida (al menos 21 días después de la vacuna primaria)"
    pt: "Vacinação antirrábica válida (pelo menos 21 dias após a primeira dose)"
  - en: "Rabies antibody test — non-listed origins only (blood ≥30 days after the shot, then a 3-month wait)"
    fr: "Titrage antirabique — pays non listés uniquement (sang ≥30 jours après le vaccin, puis 3 mois d'attente)"
    es: "Prueba de titulación de rabia — solo orígenes no listados (sangre ≥30 días después de la vacuna, y luego una espera de 3 meses)"
    pt: "Teste sorológico antirrábico — apenas origens não listadas (sangue ≥30 dias após a vacina, seguido de 3 meses de espera)"
  - en: "Broad-spectrum parasite treatment (internal and external) recorded before travel"
    fr: "Traitement antiparasitaire à large spectre (interne et externe) consigné avant le voyage"
    es: "Tratamiento antiparasitario de amplio espectro (interno y externo) registrado antes del viaje"
    pt: "Tratamento antiparasitário de amplo espectro (interno e externo) registrado antes da viagem"
  - en: "Pet passport (EU) or official 'Health Certificate' from the origin authority (other countries)"
    fr: "Passeport (UE) ou « Health Certificate » officiel de l'autorité d'origine (autres pays)"
    es: "Pasaporte para mascotas (UE) o «Health Certificate» oficial de la autoridad de origen (otros países)"
    pt: "Passaporte para animais (UE) ou \"Health Certificate\" oficial da autoridade de origem (outros países)"
  - en: "Signed non-commercial declaration (Annex No. 5); Annex No. 3 transit declaration if you transit a non-listed country"
    fr: "Déclaration non commerciale signée (annexe n° 5) ; déclaration de transit annexe n° 3 si tu transitez un pays non listé"
    es: "Declaración no comercial firmada (anexo n.º 5); declaración de tránsito del anexo n.º 3 si transitas por un país no listado"
    pt: "Declaração não comercial assinada (anexo nº 5); declaração de trânsito do anexo nº 3 se você transitar por um país não listado"
  - en: "Original documents, one set per animal (up to 5 pets per traveller, non-commercial)"
    fr: "Documents originaux, un jeu par animal (jusqu'à 5 animaux par voyageur, non commercial)"
    es: "Documentos originales, un juego por animal (hasta 5 mascotas por viajero, no comercial)"
    pt: "Documentos originais, um conjunto por animal (até 5 animais por viajante, não comercial)"
  - en: "Airline reservation confirming your dog's travel option and a suitable travel crate if travelling in the hold"
    fr: "Réservation confirmant l'option de transport de ton chien et une caisse de transport adaptée si voyage en soute"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y una jaula de transporte adecuada si viaja en bodega"
    pt: "Reserva na companhia aérea confirmando a forma de transporte do seu cachorro e caixa de transporte adequada às normas IATA se for viajar no porão"

