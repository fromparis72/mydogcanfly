regime: non_listed
domestic:
  intro:
    en: "Domestic flight in Georgia: no travel document is required, but identification and rabies vaccination are compulsory for every pet."
    fr: "Vol intérieur en Géorgie : aucun document de voyage n'est exigé, mais l'identification et la vaccination antirabique sont obligatoires pour tout animal."
    es: "Vuelo nacional en Georgia: no se exige documento de viaje, pero la identificación y la vacuna antirrábica son obligatorias para toda mascota."
    pt: "Voo doméstico na Geórgia: nenhum documento de viagem é exigido, mas identificação e vacinação antirrábica são obrigatórias para todo animal de estimação."
  points:
    - en: "Under the pet law in force since 2026, dogs must be identified and registered in the national database, and vaccinated against rabies. Both are ownership duties, not flight conditions."
      fr: "En vertu de la loi sur les animaux de compagnie en vigueur depuis 2026, les chiens doivent être identifiés et enregistrés dans la base nationale, et vaccinés contre la rage. Ce sont des obligations de détention, pas des conditions de vol."
      es: "Según la ley de mascotas vigente desde 2026, los perros deben estar identificados y registrados en la base nacional, y vacunados contra la rabia. Son deberes de tenencia, no condiciones de vuelo."
      pt: "Segundo a lei de animais de estimação em vigor desde 2026, os cachorros precisam estar identificados e registrados no banco de dados nacional, e vacinados contra a raiva. Ambas são obrigações de posse, não condições de voo."
    - en: "No document is required by the State for a domestic flight."
      fr: "Aucun document n'est exigé par l'État pour un vol intérieur."
      es: "El Estado no exige ningún documento para un vuelo nacional."
      pt: "Nenhum documento é exigido pelo Estado para um voo doméstico."
    - en: "Carriers on the small domestic network differ widely, and the operator serving the mountain airfields publishes no pet policy at all — call before you count on flying with your dog."
      fr: "Les compagnies du petit réseau intérieur diffèrent beaucoup, et l'opérateur desservant les aérodromes de montagne ne publie aucune politique animaux — appelle avant de compter voyager avec ton chien."
      es: "Las aerolíneas de la pequeña red nacional difieren mucho, y el operador que sirve los aeródromos de montaña no publica ninguna política de mascotas — llama antes de contar con volar con tu perro."
      pt: "As companhias da pequena rede doméstica variam muito, e o operador que atende os campos de pouso de montanha não publica nenhuma política para animais — ligue antes de contar em voar com seu cachorro."
exit:
  authority: NFA
  authorityUrl: https://nfa.gov.ge/En
  intro:
    en: "Georgia is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the National Food Agency (NFA)."
    fr: "La Géorgie est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par la National Food Agency (NFA)."
    es: "Georgia no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por la National Food Agency (NFA)."
    pt: "A Geórgia é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pela Agência Nacional de Alimentos (NFA)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "The NFA is the competent veterinary authority; export certification runs through its veterinary control and the state e-services permit system."
        fr: "La NFA est l'autorité vétérinaire compétente ; la certification d'export passe par son contrôle vétérinaire et le système de permis e-services de l'État."
        es: "La NFA es la autoridad veterinaria competente; la certificación de exportación se tramita a través de su control veterinario y el sistema estatal de permisos electrónicos."
        pt: "A NFA é a autoridade veterinária competente; a certificação de exportação passa pelo seu controle veterinário e pelo sistema estatal de autorizações eletrônicas."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Georgia with your dog", fr: "Voyager en Géorgie avec ton chien", es: "Viajar a Georgia con tu perro", pt: "Viajar para a Geórgia com seu cachorro" }
  intro:
    en: >-
      Georgia welcomes dogs, but what you need to prepare depends mainly on the country your dog is
      travelling from — not only on Georgia itself. Georgia is not an EU member, yet it applies
      EU-aligned pet-movement rules set by the National Food Agency (under the Ministry of
      Environmental Protection and Agriculture) and enforced at the border by the Revenue Service
      (customs). An ISO microchip, a valid rabies vaccination, a broad-spectrum parasite treatment and
      an official health certificate are always required for a dog. A dog from an EU country simply
      needs a properly completed pet passport; a dog from a country on Georgia's Article 7 list (such
      as the United States, Canada, Japan or Australia) needs a health certificate but no blood test;
      a dog from a non-listed country faces the longest path, including a rabies antibody test and a
      three-month wait. This guide explains each case so you know exactly what to prepare before you
      book your flight.
    fr: >-
      La Géorgie accueille les chiens, mais ce qu'il faut préparer dépend surtout du pays d'où ton
      chien voyage — pas seulement de la Géorgie. La Géorgie n'est pas membre de l'UE, mais elle
      applique des règles de mouvement des animaux alignées sur celles de l'UE, fixées par l'Agence
      nationale de l'alimentation (rattachée au ministère de la Protection de l'environnement et de
      l'Agriculture) et appliquées à la frontière par le Service des recettes (douane). Une puce ISO,
      une vaccination antirabique valide, un traitement antiparasitaire à large spectre et un
      certificat sanitaire officiel sont toujours exigés pour un chien. Un chien venant d'un pays de
      l'UE a simplement besoin d'un passeport correctement rempli ; un chien venant d'un pays figurant
      sur la liste « article 7 » géorgienne (États-Unis, Canada, Japon, Australie…) a besoin d'un
      certificat sanitaire mais pas de prise de sang ; un chien en provenance d'un pays non listé suit
      le parcours le plus long, avec un titrage antirabique et un délai de trois mois. Ce guide détaille
      chaque cas pour savoir exactement quoi préparer avant de réserver ton vol.
    es: >-
      Georgia acoge a los perros, pero lo que debes preparar depende sobre todo del país desde el que
      viaja tu perro — no solo de Georgia. Georgia no es un Estado miembro de la UE, pero aplica normas
      de movimiento de animales de compañía alineadas con las de la UE, fijadas por la Agencia Nacional
      de Alimentos (dependiente del Ministerio de Protección Ambiental y Agricultura) y aplicadas en la
      frontera por el Servicio de Ingresos (aduanas). Para un perro siempre se exigen un microchip ISO,
      una vacunación antirrábica válida, un tratamiento antiparasitario de amplio espectro y un
      certificado sanitario oficial. Un perro que llega de un país de la UE solo necesita un pasaporte
      para mascotas correctamente cumplimentado; un perro de un país incluido en la lista del artículo 7
      de Georgia (como Estados Unidos, Canadá, Japón o Australia) necesita un certificado sanitario pero
      no un análisis de sangre; un perro de un país no listado se enfrenta al camino más largo, que
      incluye una prueba de titulación de rabia y una espera de tres meses. Esta guía explica cada caso
      para que sepas exactamente qué preparar antes de reservar tu vuelo.

    pt: "A Geórgia recebe bem os cachorros, mas o que você precisa preparar depende principalmente do país de onde seu cachorro parte — e não só da Geórgia em si. A Geórgia não é membro da UE, mas aplica regras de circulação de animais alinhadas com a UE, definidas pela Agência Nacional de Alimentos (vinculada ao Ministério da Proteção Ambiental e Agricultura) e fiscalizadas na fronteira pelo Serviço de Receitas (alfândega). Microchip ISO, vacinação antirrábica válida, tratamento antiparasitário de amplo espectro e atestado de saúde oficial são sempre obrigatórios para um cachorro. Um cachorro vindo de um país da UE precisa apenas de um passaporte para animais devidamente preenchido; um cachorro vindo de um país da lista do Artigo 7 da Geórgia (como Estados Unidos, Canadá, Japão ou Austrália) precisa de um atestado de saúde, mas não de exame de sangue; um cachorro vindo de um país não listado enfrenta o caminho mais longo, com teste sorológico antirrábico e três meses de espera. Este guia explica cada caso para você saber exatamente o que preparar antes de comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Easy to difficult (depends on origin)", fr: "Facile à difficile (selon l'origine)", es: "De fácil a difícil (según el origen)", pt: "De fácil a difícil (depende da origem)" }

prepTime:
  eu:
    en: "A few days if the pet passport is up to date, up to ~3 weeks if the first rabies shot is still needed (21-day wait after the primary vaccination)."
    fr: "Quelques jours si le passeport est à jour, jusqu'à ~3 semaines si la première vaccination reste à faire (délai de 21 jours après la primo-vaccination)."
    es: "Unos días si el pasaporte está al día, hasta ~3 semanas si aún falta la primera vacuna antirrábica (espera de 21 días tras la primovacunación)."
    pt: "Alguns dias se o passaporte para animais estiver em dia, até ~3 semanas se a primeira vacina antirrábica ainda estiver pendente (espera de 21 dias após a primovacinação)."
  listed:
    en: "~3 weeks: 21-day wait after the rabies shot, plus a health certificate issued by the origin country's veterinary authority and a parasite treatment."
    fr: "~3 semaines : délai de 21 jours après le vaccin, plus un certificat sanitaire délivré par l'autorité vétérinaire du pays d'origine et un traitement antiparasitaire."
    es: "~3 semanas: espera de 21 días tras la vacuna antirrábica, más un certificado sanitario expedido por la autoridad veterinaria del país de origen y un tratamiento antiparasitario."
    pt: "~3 semanas: 21 dias de espera após a vacina antirrábica, mais um atestado de saúde emitido pela autoridade veterinária do país de origem e um tratamento antiparasitário."
  nonListed:
    en: "~4–5 months: rabies antibody test at least 30 days after vaccination, then a compulsory 3-month wait before entry."
    fr: "~4–5 mois : titrage antirabique au moins 30 jours après le vaccin, puis un délai obligatoire de 3 mois avant l'entrée."
    es: "~4–5 meses: prueba de titulación de rabia al menos 30 días después de la vacuna, y luego una espera obligatoria de 3 meses antes de la entrada."
    pt: "~4–5 meses: teste sorológico antirrábico pelo menos 30 dias após a vacinação, seguido de uma espera obrigatória de 3 meses antes da entrada."

