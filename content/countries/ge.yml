factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Georgia (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — la Géorgie (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Georgia (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — a Geórgia (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — Georgia", fr: "Pays de destination — Géorgie", es: "País de destino — Georgia", pt: "País de destino — Geórgia" }
      text:
        en: "Georgia applies EU-aligned pet-movement rules under Government Ordinance No. 551 (2018): an ISO microchip, a valid rabies vaccination, a broad-spectrum parasite treatment and an official health certificate are always required, with up to five pets per traveller for non-commercial movement."
        fr: "La Géorgie applique des règles alignées sur celles de l'UE au titre de l'ordonnance gouvernementale n° 551 (2018) : puce ISO, vaccination antirabique valide, traitement antiparasitaire à large spectre et certificat sanitaire officiel toujours exigés, avec jusqu'à cinq animaux par voyageur pour un mouvement non commercial."
        es: "Georgia aplica normas de movimiento de animales alineadas con la UE en virtud de la Orden Gubernamental n.º 551 (2018): siempre se exigen un microchip ISO, una vacunación antirrábica válida, un tratamiento antiparasitario de amplio espectro y un certificado sanitario oficial, con hasta cinco mascotas por viajero para el movimiento no comercial."
        pt: "A Geórgia aplica regras de circulação de animais alinhadas com a UE, sob o Decreto Governamental nº 551 (2018): microchip ISO, vacinação antirrábica válida, tratamento antiparasitário de amplo espectro e atestado de saúde oficial são sempre obrigatórios, com até cinco animais por viajante para movimento não comercial."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Whether your dog leaves from an EU country, from a country on Georgia's Article 7 list, or from a non-listed country decides whether a rabies antibody test — and its compulsory 3-month wait — is required. Listed origins are exempt from the blood test."
        fr: "Que ton chien parte d'un pays de l'UE, d'un pays figurant sur la liste « article 7 » géorgienne ou d'un pays non listé détermine si un titrage antirabique — et son délai obligatoire de 3 mois — est exigé. Les origines listées sont dispensées de la prise de sang."
        es: "Que tu perro salga de un país de la UE, de un país incluido en la lista del artículo 7 de Georgia o de un país no listado determina si se exige una prueba de titulación de rabia — y su espera obligatoria de 3 meses. Los orígenes listados están exentos del análisis de sangre."
        pt: "Se o seu cachorro parte de um país da UE, de um país da lista do Artigo 7 da Geórgia, ou de um país não listado é o que determina se o teste sorológico antirrábico — com sua espera obrigatória de 3 meses — é exigido. As origens listadas são isentas do exame de sangue."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay in — or transit through — a non-listed rabies-risk country can trigger an antibody test even if you fly in from a listed country, unless a transit declaration is signed. It is your dog's real origin and history that count — not only the last airport."
        fr: "Un séjour récent dans un pays non listé à risque rabique — ou un transit par un tel pays — peut imposer un titrage même si tu arrives d'un pays listé, sauf si une déclaration de transit est signée. C'est l'origine réelle et l'historique du chien qui comptent — pas seulement l'aéroport de destination finale."
        es: "Una estancia reciente en — o un tránsito por — un país no listado con riesgo de rabia puede obligar a una prueba de titulación aunque llegues desde un país listado, salvo que se firme una declaración de tránsito. Lo que cuenta es el origen y el historial reales de tu perro — no solo el último aeropuerto."
        pt: "Uma estadia recente em — ou trânsito por — um país não listado de risco de raiva pode acionar o teste sorológico mesmo que você chegue de um país listado, a menos que uma declaração de trânsito seja assinada. O que conta é a origem e o histórico reais do seu cachorro — não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Georgia's framework, then confirm your dog's exact origin, transit history and health treatments with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre géorgien, puis confirme l'origine, l'historique de transit et les traitements de santé exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Georgia y luego confirma el origen exacto, el historial de tránsito y los tratamientos sanitarios de tu perro con tu veterinario."
    pt: "Leia então as exigências abaixo como o quadro geral da Geórgia, e confirme com seu veterinário a origem exata, o histórico de trânsito e os tratamentos de saúde do seu cachorro."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Must comply with ISO 11784 and use HDX or FDX-B technology, readable by an ISO 11785 reader; the transponder code is recorded on the health certificate or passport.", fr: "Doit être conforme à l'ISO 11784 et utiliser la technologie HDX ou FDX-B, lisible par un lecteur ISO 11785 ; le code du transpondeur est consigné sur le certificat sanitaire ou le passeport.", es: "Debe cumplir la norma ISO 11784 y usar tecnología HDX o FDX-B, legible con un lector ISO 11785; el código del transpondedor se registra en el certificado sanitario o el pasaporte.", pt: "Deve estar em conformidade com a norma ISO 11784 e usar tecnologia HDX ou FDX-B, legível por um leitor ISO 11785; o código do transponder é registrado no atestado de saúde ou no passaporte." }
    exceptions: { en: "A clearly legible tattoo is accepted only if it was applied before 1 January 2020; if the chip is non-standard, the owner should provide a compatible reader.", fr: "Un tatouage clairement lisible n'est accepté que s'il a été réalisé avant le 1er janvier 2020 ; si la puce n'est pas normalisée, le propriétaire doit fournir un lecteur compatible.", es: "Un tatuaje claramente legible solo se acepta si se hizo antes del 1 de enero de 2020; si el microchip no es estándar, el propietario debe proporcionar un lector compatible.", pt: "Uma tatuagem claramente legível só é aceita se tiver sido feita antes de 1º de janeiro de 2020; se o microchip não for padrão, o dono deve fornecer um leitor compatível." }
    ref: { en: "Government of Georgia Ordinance No. 551 (16.11.2018)", fr: "Ordonnance du Gouvernement de Géorgie n° 551 (16.11.2018)", es: "Orden del Gobierno de Georgia n.º 551 (16.11.2018)", pt: "Decreto do Governo da Geórgia nº 551 (16.11.2018)" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "A valid rabies vaccination meeting the ordinance's validity requirements; at least 21 days must have passed since the completion of the primary vaccination before travel.", fr: "Une vaccination antirabique valide répondant aux exigences de validité de l'ordonnance ; au moins 21 jours doivent s'être écoulés depuis l'achèvement de la primo-vaccination avant le voyage.", es: "Una vacunación antirrábica válida que cumpla los requisitos de valide de la orden; deben haber transcurrido al menos 21 días desde la finalización de la primovacunación antes del viaje.", pt: "Uma vacinação antirrábica válida que atenda às exigências de validade do decreto; pelo menos 21 dias precisam ter se passado desde a conclusão da primovacinação antes da viagem." }
    exceptions: { en: "The vaccination is recorded on the certificate/passport; a booster given within validity keeps continuous cover. Very young unvaccinated pets follow the minimum-age rule below.", fr: "La vaccination est consignée sur le certificat/passeport ; un rappel effectué dans la validité maintient une couverture continue. Les très jeunes animaux non vaccinés suivent la règle d'âge minimum ci-dessous.", es: "La vacunación se registra en el certificado/pasaporte; un refuerzo administrado dentro de la valide mantiene una cobertura continua. Las mascotas muy jóvenes sin vacunar siguen la regla de edad mínima que figura a continuación.", pt: "A vacinação é registrada no certificado/passaporte; um reforço aplicado dentro da validade mantém a cobertura contínua. Animais muito jovens e não vacinados seguem a regra de idade mínima abaixo." }
    ref: { en: "Government of Georgia Ordinance No. 551, Art. 7; USDA APHIS (US export)", fr: "Ordonnance du Gouvernement de Géorgie n° 551, art. 7 ; USDA APHIS (export USA)", es: "Orden del Gobierno de Georgia n.º 551, art. 7; USDA APHIS (exportación de EE. UU.)", pt: "Decreto do Governo da Geórgia nº 551, art. 7; USDA APHIS (exportação dos EUA)" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Non-listed origins only: blood drawn by an authorised vet at least 30 days after vaccination and at least 3 months before export, tested in an approved laboratory. Entry follows the 3-month wait.", fr: "Pays non listés uniquement : sang prélevé par un vétérinaire habilité au moins 30 jours après le vaccin et au moins 3 mois avant l'export, analysé dans un laboratoire agréé. L'entrée suit le délai de 3 mois.", es: "Solo orígenes no listados: sangre extraída por un veterinario autorizado al menos 30 días después de la vacuna y al menos 3 meses antes de la exportación, analizada en un laboratorio autorizado. La entrada se produce tras la espera de 3 meses.", pt: "Somente origens não listadas: sangue coletado por um veterinário autorizado pelo menos 30 dias após a vacinação e pelo menos 3 meses antes da exportação, testado em laboratório aprovado. A entrada segue a espera de 3 meses." }
    exceptions: { en: "Not required for pets coming directly from — or only transiting — a country on Georgia's Article 7 list; for other transits a signed transit declaration (Annex No. 3) waives it.", fr: "Non requis pour un animal venant directement de — ou transitant uniquement par — un pays de la liste « article 7 » géorgienne ; pour d'autres transits, une déclaration de transit signée (annexe n° 3) en dispense.", es: "No se exige para las mascotas que llegan directamente de — o que solo transitan por — un país de la lista del artículo 7 de Georgia; para otros tránsitos, una declaración de tránsito firmada (anexo n.º 3) exime de ella.", pt: "Não exigido para animais que vêm diretamente de — ou que apenas transitam por — um país da lista do Artigo 7 da Geórgia; para outros trânsitos, uma declaração de trânsito assinada (anexo nº 3) dispensa a exigência." }
    ref: { en: "Government of Georgia Ordinance No. 551, Art. 7; Article 7 list of countries/territories", fr: "Ordonnance du Gouvernement de Géorgie n° 551, art. 7 ; liste « article 7 » des pays/territoires", es: "Orden del Gobierno de Georgia n.º 551, art. 7; lista del artículo 7 de países/territorios", pt: "Decreto do Governo da Geórgia nº 551, art. 7; lista do Artigo 7 de países/territórios" }
  - item: { en: "Pet passport", fr: "Passeport pour animal", es: "Pasaporte para mascotas", pt: "Passaporte para animais" }
    required: { en: "EU origins", fr: "Origines UE", es: "Orígenes de la UE", pt: "Origens na UE" }
    when: { en: "A correctly completed passport issued by an authorised vet, recording the microchip and the valid rabies vaccination, is accepted as the identification document for pets from EU member states and other territories.", fr: "Un passeport correctement rempli délivré par un vétérinaire agréé, consignant la puce et la vaccination antirabique valide, est accepté comme document d'identification pour les animaux venant des États membres de l'UE et d'autres territoires.", es: "Un pasaporte correctamente cumplimentado expedido por un veterinario autorizado, que registre el microchip y la vacunación antirrábica válida, se acepta como documento de identificación para las mascotas procedentes de Estados miembros de la UE y otros territorios.", pt: "Um passaporte corretamente preenchido, emitido por um veterinário autorizado, registrando o microchip e a vacinação antirrábica válida, é aceito como documento de identificação para animais vindos dos Estados membros da UE e de outros territórios." }
    exceptions: { en: "For these origins no separate health certificate is required.", fr: "Pour ces origines, aucun certificat sanitaire distinct n'est exigé.", es: "Para estos orígenes no se exige un certificado sanitario aparte.", pt: "Para essas origens, nenhum atestado de saúde separado é exigido." }
    ref: { en: "Government of Georgia Ordinance No. 551", fr: "Ordonnance du Gouvernement de Géorgie n° 551", es: "Orden del Gobierno de Georgia n.º 551", pt: "Decreto do Governo da Geórgia nº 551" }
  - item: { en: "Health certificate (origin authority)", fr: "Certificat sanitaire (autorité d'origine)", es: "Certificado sanitario (autoridad de origen)", pt: "Atestado de saúde (autoridade de origem)" }
    required: { en: "Non-EU origins", fr: "Origines hors UE", es: "Orígenes fuera de la UE", pt: "Origens fora da UE" }
    when: { en: "The duly completed model 'Health Certificate' issued/endorsed by the competent veterinary authority of the country of dispatch; from the US it is valid for 10 days from issue and must be APHIS-endorsed before travel.", fr: "Le certificat modèle « Health Certificate » dûment rempli, établi/visé par l'autorité vétérinaire compétente du pays d'expédition ; depuis les USA, valable 10 jours à compter de l'émission et visé par l'APHIS avant le voyage.", es: "El modelo «Health Certificate» debidamente cumplimentado, expedido/refrendado por la autoridad veterinaria competente del país de expedición; desde EE. UU. es válido 10 días desde su emisión y debe ir refrendado por el APHIS antes del viaje.", pt: "O modelo de \"Health Certificate\" devidamente preenchido, emitido/endossado pela autoridade veterinária competente do país de despacho; vindo dos EUA, é válido por 10 dias a partir da emissão e precisa ser endossado pelo APHIS antes da viagem." }
    exceptions: { en: "Not needed for EU/assimilated origins (passport instead). A separate certificate is completed for each animal.", fr: "Inutile pour les origines UE/assimilées (passeport à la place). Un certificat distinct est établi pour chaque animal.", es: "No es necesario para orígenes de la UE/asimilados (en su lugar, el pasaporte). Se cumplimenta un certificado aparte para cada animal.", pt: "Não necessário para origens da UE/assimiladas (nesse caso, vale o passaporte). Um certificado separado é preenchido para cada animal." }
    ref: { en: "Government of Georgia Ordinance No. 551, Art. 7; USDA APHIS (US export)", fr: "Ordonnance du Gouvernement de Géorgie n° 551, art. 7 ; USDA APHIS (export USA)", es: "Orden del Gobierno de Georgia n.º 551, art. 7; USDA APHIS (exportación de EE. UU.)", pt: "Decreto do Governo da Geórgia nº 551, art. 7; USDA APHIS (exportação dos EUA)" }
  - item: { en: "Parasite treatment (endoparasites & ectoparasites)", fr: "Traitement antiparasitaire (endo- & ectoparasites)", es: "Tratamiento antiparasitario (endoparásitos y ectoparásitos)", pt: "Tratamento antiparasitário (endoparasitas e ectoparasitas)" }
    required: { en: "Required for dogs", fr: "Requis pour les chiens", es: "Obligatorio para los perros", pt: "Obrigatórias para cachorros" }
    when: { en: "Dogs must be treated with a broad-spectrum anthelmintic against internal parasites and against external parasites (fleas & ticks) before travel; the treatment is recorded on the certificate/passport.", fr: "Les chiens doivent être traités avec un anthelminthique à large spectre contre les parasites internes et contre les parasites externes (puces & tiques) avant le voyage ; le traitement est consigné sur le certificat/passeport.", es: "Los perros deben tratarse con un antihelmíntico de amplio espectro contra los parásitos internos y contra los parásitos externos (pulgas y garrapatas) antes del viaje; el tratamiento se registra en el certificado/pasaporte.", pt: "Os cachorros precisam ser tratados com um anti-helmíntico de amplo espectro contra parasitas internos e contra parasitas externos (pulgas e carrapatos) antes da viagem; o tratamento é registrado no certificado/passaporte." }
    exceptions: { en: "A specific fixed timing window is not published in the official English materials; confirm the interval with your vet.", fr: "Aucune fenêtre horaire fixe précise n'est publiée dans les documents officiels en anglais ; confirme l'intervalle avec ton vétérinaire.", es: "No se publica una ventana temporal fija específica en los documentos oficiales en inglés; confirma el intervalo con tu veterinario.", pt: "Um prazo fixo específico não é publicado nos materiais oficiais em inglês; confirme o intervalo com seu veterinário." }
    ref: { en: "Government of Georgia Ordinance No. 551; USDA APHIS (US export)", fr: "Ordonnance du Gouvernement de Géorgie n° 551 ; USDA APHIS (export USA)", es: "Orden del Gobierno de Georgia n.º 551; USDA APHIS (exportación de EE. UU.)", pt: "Decreto do Governo da Geórgia nº 551; USDA APHIS (exportação dos EUA)" }
  - item: { en: "Owner's non-commercial declaration", fr: "Déclaration non commerciale du propriétaire", es: "Declaración no comercial del propietario", pt: "Declaração não comercial do dono" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "A written declaration signed by the owner or authorised person (Annex No. 5) confirming the pet is moved for non-commercial purposes is an integral part of the certificate/passport and must be submitted.", fr: "Une déclaration écrite signée par le propriétaire ou la personne autorisée (annexe n° 5) confirmant que l'animal est déplacé à des fins non commerciales fait partie intégrante du certificat/passeport et doit être présentée.", es: "Una declaración escrita firmada por el propietario o la persona autorizada (anexo n.º 5) que confirme que la mascota se traslada con fines no comerciales forma parte integrante del certificado/pasaporte y debe presentarse.", pt: "Uma declaração escrita assinada pelo dono ou por pessoa autorizada (anexo nº 5), confirmando que o animal é transportado para fins não comerciais, é parte integrante do certificado/passaporte e precisa ser apresentada." }
    exceptions: { en: "Movement for sale or transfer of ownership is not 'non-commercial' and falls outside this scheme.", fr: "Un déplacement pour vente ou transfert de propriété n'est pas « non commercial » et sort de ce régime.", es: "Un traslado para venta o transferencia de propiedad no es «no comercial» y queda fuera de este régimen.", pt: "O movimento para venda ou transferência de propriedade não é \"não comercial\" e fica fora desse regime." }
    ref: { en: "Government of Georgia Ordinance No. 551, Annex No. 5", fr: "Ordonnance du Gouvernement de Géorgie n° 551, annexe n° 5", es: "Orden del Gobierno de Georgia n.º 551, anexo n.º 5", pt: "Decreto do Governo da Geórgia nº 551, anexo nº 5" }
  - item: { en: "Number of pets / import permit", fr: "Nombre d'animaux / permis d'import", es: "Número de mascotas / permiso de importación", pt: "Número de animais / autorização de importação" }
    required: { en: "Up to 5; no permit (non-commercial)", fr: "Jusqu'à 5 ; pas de permis (non commercial)", es: "Hasta 5; sin permiso (no comercial)", pt: "Até 5; sem autorização (não comercial)" }
    when: { en: "Up to five pets may accompany a traveller with no import permit. More than five is allowed only for competitions/exhibitions/sport, with proof of registration and animals over six months old.", fr: "Jusqu'à cinq animaux peuvent accompagner un voyageur sans permis d'import. Plus de cinq n'est admis que pour concours/expositions/sport, avec preuve d'inscription et animaux de plus de six mois.", es: "Hasta cinco mascotas pueden acompañar a un viajero sin permiso de importación. Más de cinco solo se admite para concursos/exposiciones/deporte, con prueba de inscripción y animales mayores de seis meses.", pt: "Até cinco animais podem acompanhar um viajante sem autorização de importação. Mais de cinco só é permitido para competições/exposições/esportes, com comprovante de inscrição e animais com mais de seis meses." }
    exceptions: { en: "Sale, transfer of ownership or larger consignments fall under commercial rules and require separate veterinary import procedures.", fr: "Vente, transfert de propriété ou envois plus importants relèvent des règles commerciales et exigent des procédures d'importation vétérinaire distinctes.", es: "La venta, la transferencia de propiedad o los envíos mayores se rigen por las normas comerciales y exigen procedimientos de importación veterinaria aparte.", pt: "Venda, transferência de propriedade ou remessas maiores seguem as regras comerciais e exigem procedimentos veterinários de importação separados." }
    ref: { en: "Government of Georgia Ordinance No. 551; USDA APHIS (US export)", fr: "Ordonnance du Gouvernement de Géorgie n° 551 ; USDA APHIS (export USA)", es: "Orden del Gobierno de Georgia n.º 551; USDA APHIS (exportación de EE. UU.)", pt: "Decreto do Governo da Geórgia nº 551; USDA APHIS (exportação dos EUA)" }
  - item: { en: "Border veterinary / customs check", fr: "Contrôle vétérinaire / douanier à la frontière", es: "Control veterinario / aduanero en la frontera", pt: "Controle veterinário / alfandegário de fronteira" }
    required: { en: "All arrivals", fr: "Toutes les arrivées", es: "Todas las llegadas", pt: "Todas as chegadas" }
    when: { en: "At the point of entry the Revenue Service (customs) and veterinary control may read the microchip and verify the passport or health certificate and declaration.", fr: "Au point d'entrée, le Service des recettes (douane) et le contrôle vétérinaire peuvent lire la puce et vérifier le passeport ou le certificat sanitaire et la déclaration.", es: "En el punto de entrada, el Servicio de Ingresos (aduanas) y el control veterinario pueden leer el microchip y verificar el pasaporte o el certificado sanitario y la declaración.", pt: "No ponto de entrada, o Serviço de Receitas (alfândega) e o controle veterinário podem ler o microchip e verificar o passaporte ou o atestado de saúde e a declaração." }
    exceptions: { en: "A passport or certificate alone, without a readable microchip and matching documents, is not enough to cross the border.", fr: "Un passeport ou certificat seul, sans puce lisible et documents concordants, ne suffit pas pour franchir la frontière.", es: "Un pasaporte o certificado por sí solo, sin un microchip legible y documentos coincidentes, no basta para cruzar la frontera.", pt: "Um passaporte ou certificado sozinho, sem um microchip legível e documentos correspondentes, não basta para cruzar a fronteira." }
    ref: { en: "Georgian Revenue Service (customs) — Border crossing, Animals", fr: "Service des recettes de Géorgie (douane) — Passage frontalier, Animaux", es: "Servicio de Ingresos de Georgia (aduanas) — Cruce fronterizo, Animales", pt: "Serviço de Receitas da Geórgia (alfândega) — Travessia de fronteira, Animais" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "Effectively ≥15 weeks", fr: "En pratique ≥15 semaines", es: "En la práctica ≥15 semanas", pt: "Na prática, ≥15 semanas" }
    when: { en: "Rabies shot possible from 12 weeks + 21-day wait. Pets under 12 weeks unvaccinated, or 12–16 weeks vaccinated but under 21 days, need Annex No. 2 conditions (e.g. accompanied by the vaccinated mother).", fr: "Vaccin possible dès 12 semaines + 21 jours d'attente. Les animaux de moins de 12 semaines non vaccinés, ou de 12–16 semaines vaccinés mais à moins de 21 jours, relèvent des conditions de l'annexe n° 2 (ex. accompagnés de la mère vaccinée).", es: "Vacuna posible desde las 12 semanas + espera de 21 días. Las mascotas menores de 12 semanas sin vacunar, o de 12–16 semanas vacunadas pero con menos de 21 días, se rigen por las condiciones del anexo n.º 2 (p. ej. acompañadas de la madre vacunada).", pt: "A vacina antirrábica é possível a partir das 12 semanas + 21 dias de espera. Animais com menos de 12 semanas e não vacinados, ou de 12–16 semanas vacinados mas com menos de 21 dias, precisam cumprir as condições do anexo nº 2 (por exemplo, acompanhados da mãe vacinada)." }
    exceptions: { en: "Admission of very young unvaccinated pets is judged on the rabies situation of the origin country.", fr: "L'admission de très jeunes animaux non vaccinés est appréciée selon la situation rabique du pays d'origine.", es: "La admisión de mascotas muy jóvenes sin vacunar se valora según la situación de la rabia del país de origen.", pt: "A admissão de animais muito jovens e não vacinados é avaliada conforme a situação da raiva no país de origem." }
    ref: { en: "Government of Georgia Ordinance No. 551, Annex No. 2; USDA APHIS (US export)", fr: "Ordonnance du Gouvernement de Géorgie n° 551, annexe n° 2 ; USDA APHIS (export USA)", es: "Orden del Gobierno de Georgia n.º 551, anexo n.º 2; USDA APHIS (exportación de EE. UU.)", pt: "Decreto do Governo da Geórgia nº 551, anexo nº 2; USDA APHIS (exportação dos EUA)" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not required", fr: "Non requise", es: "No obligatoria", pt: "Não obrigatório" }
    when: { en: "No import quarantine for a compliant pet travelling with its owner under the non-commercial scheme.", fr: "Aucune quarantaine à l'import pour un animal conforme voyageant avec son propriétaire sous le régime non commercial.", es: "No hay cuarentena de importación para una mascota conforme que viaja con su propietario bajo el régimen no comercial.", pt: "Sem quarentena de importação para um animal em conformidade que viaja com seu dono sob o regime não comercial." }
    exceptions: { en: "Only if rules are breached — the border veterinary control may then refuse entry or order corrective measures at the owner's expense.", fr: "Uniquement en cas de non-conformité — le contrôle vétérinaire frontalier peut alors refuser l'entrée ou ordonner des mesures correctives aux frais du propriétaire.", es: "Solo en caso de incumplimiento — el control veterinario fronterizo puede entonces denegar la entrada u ordenar medidas correctoras a cargo del propietario.", pt: "Somente em caso de descumprimento das regras — o controle veterinário de fronteira pode então recusar a entrada ou determinar medidas corretivas às custas do dono." }
    ref: { en: "Government of Georgia Ordinance No. 551; Georgian Revenue Service", fr: "Ordonnance du Gouvernement de Géorgie n° 551 ; Service des recettes de Géorgie", es: "Orden del Gobierno de Georgia n.º 551; Servicio de Ingresos de Georgia", pt: "Decreto do Governo da Geórgia nº 551; Serviço de Receitas da Geórgia" }

origin:
  scheme: eu
  eu:
    title: { en: "Simplified — pet passport", fr: "Simplifié — passeport", es: "Simplificado — pasaporte para mascotas", pt: "Simplificado — passaporte para animais" }
    body:
      en: "A dog coming from an EU member state needs a valid ISO microchip, an in-date rabies vaccination (at least 21 days after the primary shot), a broad-spectrum parasite treatment and a correctly completed pet passport, which Georgia accepts as the identification document. No rabies antibody test and no separate health certificate are required. The signed non-commercial declaration (Annex No. 5) still accompanies the passport."
      fr: "Un chien venant d'un État membre de l'UE a besoin d'une puce ISO valide, d'une vaccination antirabique à jour (au moins 21 jours après la primo-vaccination), d'un traitement antiparasitaire à large spectre et d'un passeport correctement rempli, que la Géorgie accepte comme document d'identification. Ni titrage antirabique ni certificat sanitaire distinct ne sont requis. La déclaration non commerciale signée (annexe n° 5) accompagne toujours le passeport."
      es: "Un perro que llega de un Estado miembro de la UE necesita un microchip ISO válido, una vacunación antirrábica en vigor (al menos 21 días después de la vacuna primaria), un tratamiento antiparasitario de amplio espectro y un pasaporte para mascotas correctamente cumplimentado, que Georgia acepta como documento de identificación. No se exigen prueba de titulación de rabia ni certificado sanitario aparte. La declaración no comercial firmada (anexo n.º 5) sigue acompañando al pasaporte."
      pt: "Um cachorro vindo de um Estado membro da UE precisa de um microchip ISO válido, uma vacinação antirrábica em dia (pelo menos 21 dias após a primeira dose), um tratamento antiparasitário de amplo espectro e um passaporte para animais corretamente preenchido, que a Geórgia aceita como documento de identificação. Nenhum teste sorológico antirrábico e nenhum atestado de saúde separado são exigidos. A declaração não comercial assinada (anexo nº 5) ainda acompanha o passaporte."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a country on Georgia's Article 7 list (United States, Canada, Japan, Australia, Russia, North Macedonia, Bosnia and Herzegovina, New Zealand, Singapore and many others), your dog needs a microchip, a valid rabies vaccination, a broad-spectrum parasite treatment and the official 'Health Certificate' issued by the competent authority of the country of origin, plus the Annex No. 5 declaration. No rabies antibody test is required."
      fr: "Depuis un pays figurant sur la liste « article 7 » géorgienne (États-Unis, Canada, Japon, Australie, Russie, Macédoine du Nord, Bosnie-Herzégovine, Nouvelle-Zélande, Singapour et bien d'autres), ton chien a besoin d'une puce, d'une vaccination antirabique valide, d'un traitement antiparasitaire à large spectre et du « Health Certificate » officiel délivré par l'autorité compétente du pays d'origine, ainsi que de la déclaration annexe n° 5. Aucun titrage antirabique n'est requis."
      es: "Desde un país incluido en la lista del artículo 7 de Georgia (Estados Unidos, Canadá, Japón, Australia, Rusia, Macedonia del Norte, Bosnia y Herzegovina, Nueva Zelanda, Singapur y muchos otros), tu perro necesita un microchip, una vacunación antirrábica válida, un tratamiento antiparasitario de amplio espectro y el «Health Certificate» oficial expedido por la autoridad competente del país de origen, además de la declaración del anexo n.º 5. No se exige prueba de titulación de rabia."
      pt: "De um país da lista do Artigo 7 da Geórgia (Estados Unidos, Canadá, Japão, Austrália, Rússia, Macedônia do Norte, Bósnia e Herzegovina, Nova Zelândia, Singapura e muitos outros), seu cachorro precisa de microchip, vacinação antirrábica válida, tratamento antiparasitário de amplo espectro e do \"Health Certificate\" oficial emitido pela autoridade competente do país de origem, além da declaração do anexo nº 5. Nenhum teste sorológico antirrábico é exigido."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (rabies-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination and at least 3 months before export, tested at an approved laboratory. A microchip, valid rabies vaccination, broad-spectrum parasite treatment, official health certificate and the Annex No. 5 declaration are also required. A dog that only transits a non-listed country can avoid the test by carrying a signed transit declaration (Annex No. 3)."
      fr: "Depuis un pays non listé (à risque rabique), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin et au moins 3 mois avant l'export, analysé dans un laboratoire agréé. Une puce, une vaccination antirabique valide, un traitement antiparasitaire à large spectre, un certificat sanitaire officiel et la déclaration annexe n° 5 sont également requis. Un chien qui ne fait que transiter par un pays non listé peut éviter le test en présentant une déclaration de transit signée (annexe n° 3)."
      es: "Desde un país no listado (con riesgo de rabia), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna y al menos 3 meses antes de la exportación, analizada en un laboratorio autorizado. También se exigen un microchip, una vacunación antirrábica válida, un tratamiento antiparasitario de amplio espectro, un certificado sanitario oficial y la declaración del anexo n.º 5. Un perro que solo transita por un país no listado puede evitar la prueba llevando una declaración de tránsito firmada (anexo n.º 3)."
      pt: "De um país não listado (de risco de raiva), acrescente o teste sorológico antirrábico: sangue coletado pelo menos 30 dias após a vacinação e pelo menos 3 meses antes da exportação, testado em laboratório aprovado. Microchip, vacinação antirrábica válida, tratamento antiparasitário de amplo espectro, atestado de saúde oficial e a declaração do anexo nº 5 também são exigidos. Um cachorro que apenas transita por um país não listado pode evitar o teste levando uma declaração de trânsito assinada (anexo nº 3)."
