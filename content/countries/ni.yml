factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Nicaragua (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — le Nicaragua (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Nicaragua (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — a Nicarágua (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — Nicaragua", fr: "Pays de destination — Nicaragua", es: "País de destino — Nicaragua", pt: "País de destino — Nicarágua" }
      text:
        en: "IPSA runs a certificate-based scheme: an official export veterinary certificate, core canine vaccines (distemper, hepatitis, leptospirosis, parvovirus, rabies) applied 30–365 days before export, and an internal/external parasite treatment within 30 days of shipment are always required. A personal pet needs no advance import permit — a quarantine permit is issued on arrival."
        fr: "L'IPSA applique un dispositif fondé sur un certificat : un certificat vétérinaire officiel d'exportation, les vaccins canins de base (maladie de Carré, hépatite, leptospirose, parvovirose, rage) administrés 30 à 365 jours avant l'exportation, et un traitement antiparasitaire interne/externe dans les 30 jours avant l'embarquement sont toujours exigés. Un animal de compagnie n'a besoin d'aucun permis d'import préalable — un permis de quarantaine est délivré à l'arrivée."
        es: "El IPSA aplica un sistema basado en un certificado: siempre se exigen un certificado veterinario oficial de exportación, las vacunas caninas básicas (moquillo, hepatitis, leptospirosis, parvovirus, rabia) aplicadas 30–365 días antes de la exportación, y un tratamiento antiparasitario interno/externo dentro de los 30 días previos al embarque. Una mascota personal no necesita ningún permiso de importación previo — se expide un permiso de cuarentena a la llegada."
        pt: "O IPSA aplica um esquema baseado em certificados: um certificado veterinário oficial de exportação, as vacinas caninas essenciais (cinomose, hepatite, leptospirose, parvovirose, raiva) aplicadas de 30 a 365 dias antes da exportação e um tratamento antiparasitário interno/externo nos 30 dias anteriores ao embarque são sempre obrigatórios. Um animal de estimação pessoal não precisa de autorização de importação prévia — a autorização de quarentena é emitida na chegada."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The certificate must be an official export veterinary certificate issued by the competent authority of the exporting country, and the animal is inspected at the point of exit by that country's official quarantine officer — so the departure country's veterinary services and health status matter directly. Arrivals from the United States use a USDA-accredited veterinarian and APHIS ink endorsement."
        fr: "Le certificat doit être un certificat vétérinaire officiel d'exportation délivré par l'autorité compétente du pays exportateur, et l'animal est inspecté au point de sortie par l'agent officiel de quarantaine de ce pays — les services vétérinaires et le statut sanitaire du pays de départ comptent donc directement. Les arrivées des États-Unis passent par un vétérinaire agréé USDA et un visa à l'encre de l'APHIS."
        es: "El certificado debe ser un certificado veterinario oficial de exportación expedido por la autoridad competente del país exportador, y el animal es inspeccionado en el punto de salida por el agente oficial de cuarentena de ese país — por lo que los servicios veterinarios y el estado sanitario del país de salida importan directamente. Las llegadas desde los Estados Unidos pasan por un veterinario acreditado por el USDA y el refrendo con tinta del APHIS."
        pt: "O certificado precisa ser um certificado veterinário oficial de exportação emitido pela autoridade competente do país exportador, e o animal é inspecionado no ponto de saída por um agente oficial de quarentena desse país — por isso os serviços veterinários e a situação sanitária do país de partida contam diretamente. As chegadas vindas dos Estados Unidos usam um veterinário credenciado pelo USDA e o visto a tinta do APHIS."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "Your dog's recent residence and vaccination history determine whether its vaccination record is complete and falls within IPSA's timing windows. It is the dog's real history that counts — not only the last airport."
        fr: "La résidence récente et l'historique de vaccination du chien déterminent si son carnet est complet et respecte les délais de l'IPSA. C'est l'historique réel du chien qui compte — pas seulement le dernier aéroport."
        es: "La residencia reciente y el historial de vacunación de tu perro determinan si su registro de vacunación está completo y cumple los plazos del IPSA. Lo que cuenta es el historial real del perro — no solo el último aeropuerto."
        pt: "Onde o seu cachorro morou recentemente e o histórico de vacinação dele determinam se a carteira de vacinação está completa e dentro dos prazos exigidos pelo IPSA. O que conta é o histórico real do cachorro — não só o último aeroporto."
  note:
    en: "So read the requirements below as Nicaragua's framework, then confirm your dog's exact origin and history with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre nicaraguayen, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Nicaragua y luego confirma el origen y el historial exactos de tu perro con tu veterinario."
    pt: "Leia então as exigências abaixo como o quadro geral da Nicarágua, e confirme com seu veterinário a origem e o histórico exatos do seu cachorro."

requirements:
  - item: { en: "Identification (microchip)", fr: "Identification (puce électronique)", es: "Identificación (microchip)", pt: "Identificação (microchip)" }
    required: { en: "Not published", fr: "Non communiqué", es: "No publicado", pt: "Não publicado" }
    when: { en: "IPSA's published import requirements for dogs and cats do not list a microchip as an entry condition; the animal is identified through the export certificate and health card.", fr: "Les exigences d'importation publiées par l'IPSA pour les chiens et chats ne mentionnent pas la puce comme condition d'entrée ; l'animal est identifié via le certificat d'exportation et la tarjeta de salud.", es: "Los requisitos de importación publicados por el IPSA para perros y gatos no mencionan el microchip como condición de entrada; el animal se identifica mediante el certificado de exportación y la tarjeta de salud.", pt: "As exigências de importação publicadas pelo IPSA para cães e gatos não mencionam o microchip como condição de entrada; o animal é identificado pelo certificado de exportação e pela carteira de saúde." }
    exceptions: { en: "A microchip is not required by IPSA but is strongly advised for identification, for the return trip and because most airlines require it.", fr: "La puce n'est pas exigée par l'IPSA mais fortement conseillée pour l'identification, le retour et parce que la plupart des compagnies l'exigent.", es: "El microchip no lo exige el IPSA, pero es muy aconsejable para la identificación, para el viaje de vuelta y porque la mayoría de las aerolíneas lo exigen.", pt: "O microchip não é exigido pelo IPSA, mas é fortemente recomendado para a identificação, para a viagem de volta e porque a maioria das companhias aéreas o exige." }
    ref: { en: "IPSA — Import requirements: Dogs and cats", fr: "IPSA — Exigences d'importation : Chiens et chats", es: "IPSA — Requisitos de importación: perros y gatos", pt: "IPSA — Exigências de importação: cães e gatos" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Dogs must be vaccinated against rabies between 365 and 30 days before the export date, with the date of immunization and the product brand recorded. From the United States, dogs over four months old must be vaccinated against rabies and the vaccination is valid for no more than 365 days before embarkation.", fr: "Les chiens doivent être vaccinés contre la rage entre 365 et 30 jours avant la date d'exportation, avec la date d'immunisation et la marque du produit indiquées. Depuis les États-Unis, les chiens de plus de quatre mois doivent être vaccinés contre la rage et la vaccination ne doit pas dater de plus de 365 jours avant l'embarquement.", es: "Los perros deben estar vacunados contra la rabia entre 365 y 30 días antes de la fecha de exportación, con la fecha de inmunización y la marca del producto anotadas. Desde los Estados Unidos, los perros de más de cuatro meses deben estar vacunados contra la rabia y la vacunación no debe tener más de 365 días antes del embarque.", pt: "Os cachorros precisam ser vacinados contra a raiva entre 365 e 30 dias antes da data de exportação, com a data de imunização e a marca do produto registradas. Dos Estados Unidos, cachorros com mais de quatro meses precisam estar vacinados contra a raiva, e a vacinação não pode ter mais de 365 dias antes do embarque." }
    exceptions: { en: "No immunogen (vaccine) may be given in the 29 days immediately before shipment, so plan the rabies shot at least 30 days ahead.", fr: "Aucun immunogène (vaccin) ne doit être administré dans les 29 jours précédant immédiatement l'embarquement ; prévois donc la vaccination antirabique au moins 30 jours à l'avance.", es: "No se puede administrar ningún inmunógeno (vacuna) en los 29 días inmediatamente anteriores al embarque, así que planifica la vacuna antirrábica con al menos 30 días de antelación.", pt: "Nenhum imunógeno (vacina) pode ser aplicado nos 29 dias imediatamente anteriores ao embarque, então programe a dose antirrábica com pelo menos 30 dias de antecedência." }
    ref: { en: "IPSA — Import requirements: Dogs and cats; USDA APHIS health certificate", fr: "IPSA — Exigences d'importation : Chiens et chats ; certificat sanitaire USDA APHIS", es: "IPSA — Requisitos de importación: perros y gatos; certificado sanitario USDA APHIS", pt: "IPSA — Exigências de importação: cães e gatos; atestado de saúde USDA APHIS" }
  - item: { en: "Core canine vaccinations", fr: "Vaccins canins de base", es: "Vacunas caninas básicas", pt: "Vacinas caninas essenciais" }
    required: { en: "Required", fr: "Requis", es: "Obligatorias", pt: "Obrigatório" }
    when: { en: "Between 365 and 30 days before export, dogs must receive distemper, hepatitis, leptospirosis, parvovirus and rabies, with the date of immunization and product brand recorded on the certificate.", fr: "Entre 365 et 30 jours avant l'exportation, les chiens doivent recevoir la maladie de Carré, l'hépatite, la leptospirose, la parvovirose et la rage, avec la date d'immunisation et la marque du produit indiquées sur le certificat.", es: "Entre 365 y 30 días antes de la exportación, los perros deben recibir moquillo, hepatitis, leptospirosis, parvovirus y rabia, con la fecha de inmunización y la marca del producto anotadas en el certificado.", pt: "Entre 365 e 30 dias antes da exportação, os cachorros precisam receber cinomose, hepatite, leptospirose, parvovirose e raiva, com a data de imunização e a marca do produto registradas no certificado." }
    exceptions: { en: "No immunogen may be administered within the 29 days before shipment.", fr: "Aucun immunogène ne doit être administré dans les 29 jours avant l'embarquement.", es: "No se puede administrar ningún inmunógeno dentro de los 29 días previos al embarque.", pt: "Nenhum imunógeno pode ser administrado nos 29 dias anteriores ao embarque." }
    ref: { en: "IPSA — Import requirements: Dogs and cats", fr: "IPSA — Exigences d'importation : Chiens et chats", es: "IPSA — Requisitos de importación: perros y gatos", pt: "IPSA — Exigências de importação: cães e gatos" }
  - item: { en: "Internal and external parasite treatment", fr: "Traitement antiparasitaire interne et externe", es: "Tratamiento antiparasitario interno y externo", pt: "Tratamento antiparasitário interno e externo" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Within the 30 days before shipment, dogs must be treated against endoparasites and ectoparasites with products authorized by the country of origin; the animal must show no ectoparasites at the point of exit.", fr: "Dans les 30 jours avant l'embarquement, les chiens doivent être traités contre les endoparasites et ectoparasites avec des produits autorisés par le pays d'origine ; l'animal ne doit présenter aucun ectoparasite au point de sortie.", es: "Dentro de los 30 días previos al embarque, los perros deben ser tratados contra endoparásitos y ectoparásitos con productos autorizados por el país de origen; el animal no debe presentar ningún ectoparásito en el punto de salida.", pt: "Nos 30 dias anteriores ao embarque, os cachorros precisam ser tratados contra endoparasitas e ectoparasitas com produtos autorizados pelo país de origem; o animal não pode apresentar nenhum ectoparasita no ponto de saída." }
    exceptions: { en: "No separate tapeworm (Echinococcus) window is published — a general internal/external parasite treatment is required.", fr: "Aucun délai spécifique contre l'échinococcose n'est publié — un traitement antiparasitaire interne/externe général est exigé.", es: "No se publica un plazo específico contra la tenia (Echinococcus) — se exige un tratamiento antiparasitario interno/externo general.", pt: "Não há prazo específico publicado para tênia (Echinococcus) — o que se exige é um tratamento antiparasitário interno/externo geral." }
    ref: { en: "IPSA — Import requirements: Dogs and cats", fr: "IPSA — Exigences d'importation : Chiens et chats", es: "IPSA — Requisitos de importación: perros y gatos", pt: "IPSA — Exigências de importação: cães e gatos" }
  - item: { en: "Clinical veterinary examination", fr: "Examen clinique vétérinaire", es: "Examen clínico veterinario", pt: "Exame clínico veterinário" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "The dog must be examined by an official or private veterinarian in the country of origin and found in good health, free of infectious-contagious disease. From the United States this exam is done within two weeks of the departure date.", fr: "Le chien doit être examiné par un vétérinaire officiel ou privé dans le pays d'origine et jugé en bon état de santé, exempt de maladie infecto-contagieuse. Depuis les États-Unis, cet examen est réalisé dans les deux semaines avant la date de départ.", es: "El perro debe ser examinado por un veterinario oficial o privado en el país de origen y hallado en buen estado de salud, libre de enfermedad infecto-contagiosa. Desde los Estados Unidos, este examen se realiza dentro de las dos semanas previas a la fecha de salida.", pt: "O cachorro precisa ser examinado por um veterinário oficial ou particular no país de origem e considerado em bom estado de saúde, livre de doença infectocontagiosa. Dos Estados Unidos, esse exame é feito nas duas semanas anteriores à data da partida." }
    exceptions: { en: "The exam underlies the official export certificate; no exception is published.", fr: "L'examen fonde le certificat officiel d'exportation ; aucune exception n'est publiée.", es: "El examen sustenta el certificado oficial de exportación; no se publica ninguna excepción.", pt: "O exame é a base do certificado oficial de exportação; nenhuma exceção é publicada." }
    ref: { en: "IPSA — Import requirements: Dogs and cats; USDA APHIS health certificate", fr: "IPSA — Exigences d'importation : Chiens et chats ; certificat sanitaire USDA APHIS", es: "IPSA — Requisitos de importación: perros y gatos; certificado sanitario USDA APHIS", pt: "IPSA — Exigências de importação: cães e gatos; atestado de saúde USDA APHIS" }
  - item: { en: "Official export veterinary certificate", fr: "Certificat vétérinaire officiel d'exportation", es: "Certificado veterinario oficial de exportación", pt: "Certificado veterinário oficial de exportação" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "An official export sanitary certificate must be presented at the border of entry, together with a health card (tarjeta de salud) issued by a veterinarian in the country of origin and the passport. From the US, one original and one photocopy are presented on arrival.", fr: "Un certificat sanitaire officiel d'exportation doit être présenté à la frontière d'entrée, accompagné d'une tarjeta de salud (carte de santé) délivrée par un vétérinaire du pays d'origine et du passeport. Depuis les États-Unis, un original et une photocopie sont présentés à l'arrivée.", es: "Debe presentarse un certificado sanitario oficial de exportación en la frontera de entrada, junto con una tarjeta de salud expedida por un veterinario del país de origen y el pasaporte. Desde los EE. UU., se presentan un original y una fotocopia a la llegada.", pt: "Um certificado sanitário oficial de exportação precisa ser apresentado na fronteira de entrada, junto com uma carteira de saúde (tarjeta de salud) emitida por um veterinário do país de origem e com o passaporte. Dos EUA, apresentam-se um original e uma fotocópia na chegada." }
    exceptions: { en: "From the United States, APHIS must ink-sign and emboss the certificate; it does not require a Notary Public or Nicaraguan consular stamp.", fr: "Depuis les États-Unis, l'APHIS doit signer à l'encre et gaufrer le certificat ; il n'exige ni notaire ni visa consulaire nicaraguayen.", es: "Desde los Estados Unidos, el APHIS debe firmar con tinta y grabar en relieve el certificado; no exige ni notario público ni sello consular nicaragüense.", pt: "Dos Estados Unidos, o APHIS precisa assinar a tinta e gravar em relevo o certificado; não é exigido notário público nem selo consular nicaraguense." }
    ref: { en: "IPSA — Import requirements: Dogs and cats; USDA APHIS — Pet Travel to Nicaragua", fr: "IPSA — Exigences d'importation : Chiens et chats ; USDA APHIS — Voyage d'animaux vers le Nicaragua", es: "IPSA — Requisitos de importación: perros y gatos; USDA APHIS — Viaje de mascotas a Nicaragua", pt: "IPSA — Exigências de importação: cães e gatos; USDA APHIS — Viagem de animais de estimação para a Nicarágua" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not required for entry", fr: "Non requis pour l'entrée", es: "No obligatoria para la entrada", pt: "Não obrigatório para a entrada" }
    when: { en: "Neither IPSA's published import requirements nor the US export certificate include a rabies antibody test to enter Nicaragua.", fr: "Ni les exigences d'importation publiées par l'IPSA ni le certificat d'exportation américain n'incluent de titrage des anticorps antirabiques pour entrer au Nicaragua.", es: "Ni los requisitos de importación publicados por el IPSA ni el certificado de exportación estadounidense incluyen una prueba de titulación de rabia para entrar en Nicaragua.", pt: "Nem as exigências de importação publicadas pelo IPSA nem o certificado de exportação dos EUA incluem teste sorológico antirrábico para entrar na Nicarágua." }
    exceptions: { en: "Only relevant for a dog that will later return to a country that itself requires the test — keep that document for the subsequent export.", fr: "Pertinent uniquement pour un chien qui repartira ensuite vers un pays exigeant lui-même ce test — conserve ce document pour l'exportation ultérieure.", es: "Solo es relevante para un perro que más tarde regresará a un país que exige la prueba por su cuenta — conserva ese documento para la exportación posterior.", pt: "Só é relevante para um cachorro que depois vai voltar a um país que exige o teste por conta própria — guarde esse documento para a exportação posterior." }
    ref: { en: "IPSA — Import requirements: Dogs and cats", fr: "IPSA — Exigences d'importation : Chiens et chats", es: "IPSA — Requisitos de importación: perros y gatos", pt: "IPSA — Exigências de importação: cães e gatos" }
  - item: { en: "Crate cleaning & export inspection", fr: "Nettoyage de la caisse & inspection à l'exportation", es: "Limpieza de la jaula e inspección de exportación", pt: "Limpeza da caixa de transporte e inspeção de exportação" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "The crate must be washed and disinfected with authorized products before shipment, and the animal is inspected at the point of exit by an official animal-quarantine officer of the country of origin, showing no fresh or healing wounds and no ectoparasites.", fr: "La caisse doit être lavée et désinfectée avec des produits autorisés avant l'embarquement, et l'animal est inspecté au point de sortie par un agent officiel de quarantaine animale du pays d'origine, sans blessures fraîches ou en cicatrisation ni ectoparasites.", es: "La jaula debe lavarse y desinfectarse con productos autorizados antes del embarque, y el animal es inspeccionado en el punto de salida por un agente oficial de cuarentena animal del país de origen, sin heridas frescas ni en cicatrización y sin ectoparásitos.", pt: "A caixa de transporte precisa ser lavada e desinfetada com produtos autorizados antes do embarque, e o animal é inspecionado no ponto de saída por um agente oficial de quarentena animal do país de origem, sem feridas recentes nem em cicatrização e sem ectoparasitas." }
    exceptions: { en: "This exit inspection is carried out by the departure country's authority, not by IPSA.", fr: "Cette inspection de sortie est réalisée par l'autorité du pays de départ, non par l'IPSA.", es: "Esta inspección de salida la realiza la autoridad del país de salida, no el IPSA.", pt: "Essa inspeção de saída é feita pela autoridade do país de partida, e não pelo IPSA." }
    ref: { en: "IPSA — Import requirements: Dogs and cats", fr: "IPSA — Exigences d'importation : Chiens et chats", es: "IPSA — Requisitos de importación: perros y gatos", pt: "IPSA — Exigências de importação: cães e gatos" }
  - item: { en: "Import permit / quarantine permit", fr: "Permis d'importation / permis de quarantaine", es: "Permiso de importación / permiso de cuarentena", pt: "Autorização de importação / autorização de quarentena" }
    required: { en: "No import permit for a personal pet", fr: "Aucun permis d'import pour un animal de compagnie", es: "Sin permiso de importación para una mascota personal", pt: "Nenhuma autorização de importação para um animal de estimação pessoal" }
    when: { en: "Personal pet dogs and cats do not need an advance import permit; instead a quarantine permit is obtained at the Nicaraguan port of entry on arrival. Animals exported in commercial lot numbers must be accompanied by an import permit.", fr: "Les chiens et chats de compagnie n'ont pas besoin de permis d'importation préalable ; un permis de quarantaine est plutôt obtenu au point d'entrée nicaraguayen à l'arrivée. Les animaux exportés en lots commerciaux doivent être accompagnés d'un permis d'importation.", es: "Los perros y gatos de compañía no necesitan un permiso de importación previo; en su lugar, se obtiene un permiso de cuarentena en el punto de entrada nicaragüense a la llegada. Los animales exportados en lotes comerciales deben ir acompañados de un permiso de importación.", pt: "Cães e gatos de estimação pessoais não precisam de autorização de importação prévia; em vez disso, obtém-se uma autorização de quarentena no ponto de entrada nicaraguense na chegada. Animais exportados em lotes comerciais precisam ser acompanhados de uma autorização de importação." }
    exceptions: { en: "Under Law No. 747, importing domestic animals requires presenting a rabies vaccination certificate and a good-health certificate from a veterinarian at entry.", fr: "En vertu de la loi n° 747, l'importation d'animaux domestiques exige la présentation à l'entrée d'un certificat de vaccination antirabique et d'un certificat de bonne santé d'un vétérinaire.", es: "En virtud de la Ley n.º 747, la importación de animales domésticos exige presentar en la entrada un certificado de vacunación antirrábica y un certificado de buena salud de un veterinario.", pt: "Pela Ley n.º 747, importar animais domésticos exige apresentar na entrada um certificado de vacinação antirrábica e um atestado de boa saúde emitido por um veterinário." }
    ref: { en: "USDA APHIS — Pet Travel to Nicaragua; Law No. 747, Art. 40", fr: "USDA APHIS — Voyage d'animaux vers le Nicaragua ; Loi n° 747, art. 40", es: "USDA APHIS — Viaje de mascotas a Nicaragua; Ley n.º 747, art. 40", pt: "USDA APHIS — Viagem de animais de estimação para a Nicarágua; Ley n.º 747, art. 40" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Not published", fr: "Non communiqué", es: "No publicado", pt: "Não publicado" }
    when: { en: "IPSA does not publish a single minimum entry age. In practice a dog must be old enough to have completed its core vaccines and rabies at least 30 days before export; from the US, dogs over four months old must be vaccinated against rabies.", fr: "L'IPSA ne publie pas d'âge minimum d'entrée unique. En pratique, un chien doit être assez âgé pour avoir terminé ses vaccins de base et la rage au moins 30 jours avant l'exportation ; depuis les États-Unis, les chiens de plus de quatre mois doivent être vaccinés contre la rage.", es: "El IPSA no publica una edad mínima de entrada única. En la práctica, un perro debe tener edad suficiente para haber completado sus vacunas básicas y la rabia al menos 30 días antes de la exportación; desde los EE. UU., los perros de más de cuatro meses deben estar vacunados contra la rabia.", pt: "O IPSA não publica uma idade mínima única de entrada. Na prática, o cachorro precisa ter idade suficiente para ter concluído as vacinas essenciais e a antirrábica pelo menos 30 dias antes da exportação; dos EUA, cachorros com mais de quatro meses precisam estar vacinados contra a raiva." }
    exceptions: { en: "Airline age rules and your home country's return rules may be stricter — confirm both.", fr: "Les règles d'âge des compagnies et les règles de retour de ton pays peuvent être plus strictes — vérifie les deux.", es: "Las normas de edad de las aerolíneas y las normas de regreso de tu país pueden ser más estrictas — verifica ambas.", pt: "As regras de idade da companhia aérea e as regras de retorno do seu país podem ser mais rígidas — confirme as duas." }
    ref: { en: "IPSA — Import requirements: Dogs and cats; USDA APHIS health certificate", fr: "IPSA — Exigences d'importation : Chiens et chats ; certificat sanitaire USDA APHIS", es: "IPSA — Requisitos de importación: perros y gatos; certificado sanitario USDA APHIS", pt: "IPSA — Exigências de importação: cães e gatos; atestado de saúde USDA APHIS" }
  - item: { en: "Inspection & quarantine on arrival", fr: "Inspection & quarantaine à l'arrivée", es: "Inspección y cuarentena a la llegada", pt: "Inspeção e quarentena na chegada" }
    required: { en: "Inspection required; no routine quarantine", fr: "Inspection requise ; aucune quarantaine de routine", es: "Inspección obligatoria; sin cuarentena de rutina", pt: "Inspeção obrigatória; sem quarentena de rotina" }
    when: { en: "On arrival the pet is taken to IPSA at the point of entry for the quarantine permit and inspection of the animal and its documents. There is no published routine quarantine confinement for a compliant pet.", fr: "À l'arrivée, l'animal est présenté à l'IPSA au point d'entrée pour le permis de quarantaine et l'inspection de l'animal et de ses documents. Aucune quarantaine de confinement de routine n'est publiée pour un animal conforme.", es: "A la llegada, la mascota se presenta al IPSA en el punto de entrada para el permiso de cuarentena y la inspección del animal y sus documentos. No se publica ningún confinamiento de cuarentena de rutina para una mascota conforme.", pt: "Na chegada, o animal é levado ao IPSA no ponto de entrada para a autorização de quarentena e a inspeção do animal e dos documentos dele. Não há confinamento de quarentena de rotina publicado para um animal em conformidade." }
    exceptions: { en: "Handling of a non-compliant or sick animal on arrival is not detailed in the published requirements — confirm with IPSA.", fr: "Le traitement d'un animal non conforme ou malade à l'arrivée n'est pas détaillé dans les exigences publiées — vérifie auprès de l'IPSA.", es: "El manejo de un animal no conforme o enfermo a la llegada no se detalla en los requisitos publicados — verifica con el IPSA.", pt: "O tratamento dado na chegada a um animal fora das exigências ou doente não é detalhado nas exigências publicadas — confirme com o IPSA." }
    ref: { en: "USDA APHIS — Pet Travel to Nicaragua; IPSA", fr: "USDA APHIS — Voyage d'animaux vers le Nicaragua ; IPSA", es: "USDA APHIS — Viaje de mascotas a Nicaragua; IPSA", pt: "USDA APHIS — Viagem de animais de estimação para a Nicarágua; IPSA" }

origin:
  scheme: own
  eu:
    from: any
    title: { en: "Standard — a personal pet travelling with its owner", fr: "Standard — un animal de compagnie voyageant avec son propriétaire", es: "Estándar — una mascota personal que viaja con su propietario", pt: "Padrão — um animal de estimação pessoal viajando com o dono" }
    body:
      en: "A dog accompanying its owner needs an official export veterinary certificate from the country of departure confirming a clinical exam and good health, the core canine vaccines (distemper, hepatitis, leptospirosis, parvovirus, rabies) applied between 30 and 365 days before export, and an internal/external parasite treatment within 30 days of shipment. No advance import permit is needed. On arrival the pet is presented to IPSA at the point of entry, where a quarantine permit is issued and the animal and documents are inspected. There is no rabies antibody test and no routine quarantine for a compliant dog."
      fr: "Un chien accompagnant son propriétaire a besoin d'un certificat vétérinaire officiel d'exportation du pays de départ attestant d'un examen clinique et d'un bon état de santé, des vaccins canins de base (maladie de Carré, hépatite, leptospirose, parvovirose, rage) administrés entre 30 et 365 jours avant l'exportation, et d'un traitement antiparasitaire interne/externe dans les 30 jours avant l'embarquement. Aucun permis d'import préalable n'est requis. À l'arrivée, l'animal est présenté à l'IPSA au point d'entrée, où un permis de quarantaine est délivré et l'animal et les documents sont inspectés. Aucun titrage des anticorps antirabiques ni quarantaine de routine pour un chien conforme."
      es: "Un perro que acompaña a su propietario necesita un certificado veterinario oficial de exportación del país de salida que acredite un examen clínico y un buen estado de salud, las vacunas caninas básicas (moquillo, hepatitis, leptospirosis, parvovirus, rabia) aplicadas entre 30 y 365 días antes de la exportación, y un tratamiento antiparasitario interno/externo dentro de los 30 días previos al embarque. No se necesita ningún permiso de importación previo. A la llegada, la mascota se presenta al IPSA en el punto de entrada, donde se expide un permiso de cuarentena y se inspeccionan el animal y los documentos. No hay prueba de titulación de rabia ni cuarentena de rutina para un perro conforme."
      pt: "Um cachorro que acompanha o dono precisa de um certificado veterinário oficial de exportação do país de partida atestando exame clínico e bom estado de saúde, das vacinas caninas essenciais (cinomose, hepatite, leptospirose, parvovirose, raiva) aplicadas entre 30 e 365 dias antes da exportação e de um tratamento antiparasitário interno/externo nos 30 dias anteriores ao embarque. Não é preciso autorização de importação prévia. Na chegada, o animal é apresentado ao IPSA no ponto de entrada, onde é emitida a autorização de quarentena e o animal e os documentos são inspecionados. Não há teste sorológico antirrábico nem quarentena de rotina para um cachorro em conformidade."
    cls: ok
  listed:
    from: [us]
    title: { en: "Arriving from the United States", fr: "Arrivée depuis les États-Unis", es: "Llegada desde los Estados Unidos", pt: "Chegando dos Estados Unidos" }
    body:
      en: "From the United States a USDA-accredited veterinarian issues the export health certificate through VEHCS, and APHIS must ink-sign and emboss it. The clinical exam is done within two weeks of departure; dogs over four months old must be vaccinated against rabies (valid for no more than 365 days before embarkation), and the rabies vaccination certificate accompanies the health documents. The certificate needs no Notary Public or Nicaraguan consular stamp. Present one original and one photocopy on arrival, where a quarantine permit is obtained at the port of entry."
      fr: "Depuis les États-Unis, un vétérinaire agréé USDA établit le certificat sanitaire d'exportation via VEHCS, et l'APHIS doit le signer à l'encre et le gaufrer. L'examen clinique est réalisé dans les deux semaines avant le départ ; les chiens de plus de quatre mois doivent être vaccinés contre la rage (valable au plus 365 jours avant l'embarquement), et le certificat de vaccination antirabique accompagne les documents sanitaires. Le certificat ne nécessite ni notaire ni visa consulaire nicaraguayen. Présente un original et une photocopie à l'arrivée, où un permis de quarantaine est obtenu au point d'entrée."
      es: "Desde los Estados Unidos, un veterinario acreditado por el USDA emite el certificado sanitario de exportación a través de VEHCS, y el APHIS debe firmarlo con tinta y grabarlo en relieve. El examen clínico se realiza dentro de las dos semanas previas a la salida; los perros de más de cuatro meses deben estar vacunados contra la rabia (válida como máximo 365 días antes del embarque), y el certificado de vacunación antirrábica acompaña a los documentos sanitarios. El certificado no necesita ni notario público ni sello consular nicaragüense. Presenta un original y una fotocopia a la llegada, donde se obtiene un permiso de cuarentena en el punto de entrada."
      pt: "Dos Estados Unidos, um veterinário credenciado pelo USDA emite o atestado de saúde de exportação pelo VEHCS, e o APHIS precisa assiná-lo a tinta e gravá-lo em relevo. O exame clínico é feito nas duas semanas anteriores à partida; cachorros com mais de quatro meses precisam estar vacinados contra a raiva (vacinação com no máximo 365 dias antes do embarque), e o certificado de vacinação antirrábica acompanha os documentos sanitários. O certificado não precisa de notário público nem de selo consular nicaraguense. Apresente um original e uma fotocópia na chegada, quando a autorização de quarentena é obtida no ponto de entrada."
    cls: ok
  nonListed:
    title: { en: "Commercial lots — import permit required", fr: "Lots commerciaux — permis d'importation requis", es: "Lotes comerciales — permiso de importación obligatorio", pt: "Lotes comerciais — autorização de importação obrigatória" }
    body:
      en: "Animals exported in commercial lot numbers (not a personal pet accompanying its owner) must be accompanied by an import permit, in addition to meeting all the sanitary requirements above. This is the case in which an advance import permit is required; a personal pet travelling with its owner does not need one and instead obtains a quarantine permit at the port of entry. Plan extra lead time for the permit paperwork and confirm the current procedure with IPSA."
      fr: "Les animaux exportés en lots commerciaux (et non un animal de compagnie accompagnant son propriétaire) doivent être accompagnés d'un permis d'importation, en plus de satisfaire à toutes les exigences sanitaires ci-dessus. C'est le cas où un permis d'importation anticipé est requis ; un animal de compagnie voyageant avec son propriétaire n'en a pas besoin et obtient plutôt un permis de quarantaine au point d'entrée. Prévois un délai supplémentaire pour les formalités et confirme la procédure en vigueur auprès de l'IPSA."
      es: "Los animales exportados en lotes comerciales (no una mascota personal que acompaña a su propietario) deben ir acompañados de un permiso de importación, además de cumplir todos los requisitos sanitarios anteriores. Este es el caso en el que se exige un permiso de importación previo; una mascota personal que viaja con su propietario no lo necesita y, en su lugar, obtiene un permiso de cuarentena en el punto de entrada. Prevé un plazo adicional para los trámites del permiso y confirma el procedimiento vigente con el IPSA."
      pt: "Animais exportados em lotes comerciais (e não como animal de estimação pessoal que acompanha o dono) precisam ser acompanhados de uma autorização de importação, além de cumprir todas as exigências sanitárias acima. Esse é o caso em que se exige uma autorização de importação prévia; um animal de estimação pessoal que viaja com o dono não precisa dela e, em vez disso, obtém uma autorização de quarentena no ponto de entrada. Conte com um prazo extra para a papelada da autorização e confirme o procedimento em vigor com o IPSA."
    cls: warn

arrival:
  intro:
    en: "What happens when your dog reaches Nicaragua centres on the IPSA quarantine permit and inspection at the point of entry."
    fr: "Ce qui se passe à l'arrivée de ton chien au Nicaragua tourne autour du permis de quarantaine et de l'inspection de l'IPSA au point d'entrée."
    es: "Lo que ocurre cuando tu perro llega a Nicaragua gira en torno al permiso de cuarentena y la inspección del IPSA en el punto de entrada."
    pt: "O que acontece quando seu cachorro chega à Nicarágua gira em torno da autorização de quarentena do IPSA e da inspeção no ponto de entrada."
  points:
    - en: "The pet is taken to IPSA at the Nicaraguan point of entry, where a quarantine permit is obtained (a personal pet needs no advance import permit)."
      fr: "L'animal est présenté à l'IPSA au point d'entrée nicaraguayen, où un permis de quarantaine est obtenu (un animal de compagnie n'a besoin d'aucun permis d'import préalable)."
      es: "La mascota se presenta al IPSA en el punto de entrada nicaragüense, donde se obtiene un permiso de cuarentena (una mascota personal no necesita ningún permiso de importación previo)."
      pt: "O animal é levado ao IPSA no ponto de entrada nicaraguense, onde se obtém a autorização de quarentena (um animal de estimação pessoal não precisa de autorização de importação prévia)."
    - en: "IPSA inspects the animal and reviews the documents: the official export sanitary certificate, the health card from the origin-country vet, and the passport."
      fr: "L'IPSA inspecte l'animal et contrôle les documents : le certificat sanitaire officiel d'exportation, la tarjeta de salud du vétérinaire du pays d'origine et le passeport."
      es: "El IPSA inspecciona al animal y revisa los documentos: el certificado sanitario oficial de exportación, la tarjeta de salud del veterinario del país de origen y el pasaporte."
      pt: "O IPSA inspeciona o animal e confere os documentos: o certificado sanitário oficial de exportação, a carteira de saúde emitida pelo veterinário do país de origem e o passaporte."
    - en: "Carry the rabies vaccination certificate with the health documents; from the US, present one original and one photocopy of the certificate."
      fr: "Munis-toi du certificat de vaccination antirabique avec les documents sanitaires ; depuis les États-Unis, présente un original et une photocopie du certificat."
      es: "Lleva el certificado de vacunación antirrábica con los documentos sanitarios; desde los EE. UU., presenta un original y una fotocopia del certificado."
      pt: "Leve o certificado de vacinação antirrábica junto com os documentos sanitários; dos EUA, apresente um original e uma fotocópia do certificado."
    - en: "Animals in commercial lot numbers must arrive with an import permit obtained in advance."
      fr: "Les animaux en lots commerciaux doivent arriver avec un permis d'importation obtenu à l'avance."
      es: "Los animales en lotes comerciales deben llegar con un permiso de importación obtenido con antelación."
      pt: "Animais em lotes comerciais precisam chegar com uma autorização de importação obtida com antecedência."
    - en: "Missing or invalid documents can delay clearance — confirm the current requirements with IPSA before you fly."
      fr: "Des documents manquants ou invalides peuvent retarder le dédouanement — confirme les exigences en vigueur auprès de l'IPSA avant de voler."
      es: "Los documentos que falten o no sean válidos pueden retrasar el despacho — confirma los requisitos vigentes con el IPSA antes de volar."
      pt: "Documentos faltando ou inválidos podem atrasar a liberação — confirme as exigências em vigor com o IPSA antes de voar."
    - en: "Airlines have their own crate, breed and booking rules — confirm them separately before you fly."
      fr: "Les compagnies ont leurs propres règles de caisse, de race et de réservation — vérifie-les séparément avant de voler."
      es: "Las aerolíneas tienen sus propias normas de jaula, raza y reserva — verifícalas por separado antes de volar."
      pt: "As companhias aéreas têm as próprias regras de caixa de transporte, raça e reserva — confirme-as separadamente antes de voar."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Nicaragua publishes no breed-specific import ban for dogs. Animal keeping is governed by Law No. 747 (Law for the Protection and Welfare of Domestic Animals and Domesticated Wild Animals), whose category of 'potentially dangerous animals' is defined as animals from wild fauna kept as pets whose physical and aggressive characteristics endanger people or property — a definition aimed at wild species, not at specific dog breeds."
    fr: "Le Nicaragua ne publie aucune interdiction d'importation visant une race de chien. La détention d'animaux relève de la loi n° 747 (Loi pour la protection et le bien-être des animaux domestiques et des animaux sauvages domestiqués), dont la catégorie d'« animaux potentiellement dangereux » désigne des animaux de la faune sauvage détenus comme animaux de compagnie dont les caractéristiques physiques et d'agressivité mettent en danger les personnes ou les biens — une définition visant des espèces sauvages, non des races de chiens précises."
    es: "Nicaragua no publica ninguna prohibición de importación dirigida a una raza de perro. La tenencia de animales se rige por la Ley n.º 747 (Ley para la Protección y el Bienestar de los Animales Domésticos y Animales Silvestres Domesticados), cuya categoría de «animales potencialmente peligrosos» se define como animales de la fauna silvestre tenidos como mascotas cuyas características físicas y de agresividad ponen en peligro a las personas o los bienes — una definición dirigida a las especies silvestres, no a razas de perros concretas."
    pt: "A Nicarágua não publica nenhuma proibição de importação por raça de cachorro. A criação de animais é regida pela Ley n.º 747 (Lei de Proteção e Bem-Estar dos Animais Domésticos e dos Animais Silvestres Domesticados), cuja categoria de «animais potencialmente perigosos» é definida como animais da fauna silvestre mantidos como animais de estimação cujas características físicas e agressivas colocam em risco pessoas ou bens — uma definição voltada para espécies silvestres, e não para raças específicas de cachorros."
  cat1:
    en: "No dog breed is refused entry to Nicaragua under IPSA's published import rules: any dog meeting the export-certificate, vaccination and parasite-treatment requirements may be imported regardless of breed. Border formalities are health-based, not breed-based."
    fr: "Aucune race de chien n'est refusée à l'entrée du Nicaragua selon les règles d'importation publiées de l'IPSA : tout chien répondant aux exigences de certificat d'exportation, de vaccination et de traitement antiparasitaire peut être importé, quelle que soit sa race. Les formalités frontalières sont sanitaires, non fondées sur la race."
    es: "Ninguna raza de perro tiene la entrada denegada en Nicaragua según las normas de importación publicadas por el IPSA: cualquier perro que cumpla los requisitos de certificado de exportación, vacunación y tratamiento antiparasitario puede importarse, con independencia de su raza. Los trámites fronterizos se basan en la salud, no en la raza."
    pt: "Nenhuma raça de cachorro tem a entrada recusada na Nicarágua pelas regras de importação publicadas pelo IPSA: qualquer cachorro que cumpra as exigências de certificado de exportação, vacinação e tratamento antiparasitário pode ser importado, seja qual for a raça. As formalidades na fronteira são sanitárias, e não baseadas na raça."
  cat2:
    en: "Under Law No. 747, keeping an animal classed as 'potentially dangerous' requires a permit from the local municipality (Alcaldía) and registration, and the import, sale or transfer of such animals is regulated; the police, army, fire service and authorized security firms are exempt. As written, this category targets dangerous wild fauna kept as pets rather than listing dog breeds, and it concerns keeping within the country, not entry at the border."
    fr: "En vertu de la loi n° 747, la détention d'un animal classé « potentiellement dangereux » exige un permis de la municipalité locale (Alcaldía) et un enregistrement, et l'importation, la vente ou la cession de tels animaux est réglementée ; la police, l'armée, les pompiers et les sociétés de sécurité autorisées en sont exemptés. Telle que rédigée, cette catégorie vise la faune sauvage dangereuse détenue comme animal de compagnie plutôt qu'une liste de races de chiens, et elle concerne la détention dans le pays, non l'entrée à la frontière."
    es: "En virtud de la Ley n.º 747, la tenencia de un animal clasificado como «potencialmente peligroso» exige un permiso del municipio local (Alcaldía) y su registro, y la importación, venta o cesión de tales animales está regulada; la policía, el ejército, los bomberos y las empresas de seguridad autorizadas están exentos. Tal como está redactada, esta categoría se dirige a la fauna silvestre peligrosa tenida como mascota en lugar de listar razas de perros, y se refiere a la tenencia dentro del país, no a la entrada en la frontera."
    pt: "Pela Ley n.º 747, manter um animal classificado como «potencialmente perigoso» exige uma licença da prefeitura local (Alcaldía) e registro, e a importação, a venda ou a transferência desses animais é regulamentada; a polícia, o exército, os bombeiros e as empresas de segurança autorizadas ficam isentos. Do jeito que está escrita, essa categoria mira a fauna silvestre perigosa mantida como animal de estimação, em vez de listar raças de cachorros, e diz respeito à criação do animal dentro do país, não à entrada na fronteira."
  note:
    en: "So no dog breed is refused entry for its breed alone. Confirm current national rules with IPSA and your airline's breed policy before booking."
    fr: "Ainsi, aucune race de chien n'est refusée à l'entrée du seul fait de sa race. Vérifie les règles nationales en vigueur auprès de l'IPSA et la politique de race de ta compagnie avant de réserver."
    es: "Así que ninguna raza de perro tiene la entrada denegada solo por su raza. Confirma las normas nacionales vigentes con el IPSA y la política de razas de tu aerolínea antes de reservar."
    pt: "Ou seja, nenhuma raça de cachorro tem a entrada recusada só por causa da raça. Confirme as regras nacionais em vigor com o IPSA e a política de raças da sua companhia aérea antes de reservar."

checklist:
  - en: "Official export veterinary certificate from the country of departure (competent veterinary authority)"
    fr: "Certificat vétérinaire officiel d'exportation du pays de départ (autorité vétérinaire compétente)"
    es: "Certificado veterinario oficial de exportación del país de salida (autoridad veterinaria competente)"
    pt: "Certificado veterinário oficial de exportação do país de partida (autoridade veterinária competente)"
  - en: "Core canine vaccines applied 30–365 days before export: distemper, hepatitis, leptospirosis, parvovirus, rabies (date and product brand recorded)"
    fr: "Vaccins canins de base administrés 30–365 jours avant l'exportation : maladie de Carré, hépatite, leptospirose, parvovirose, rage (date et marque du produit indiquées)"
    es: "Vacunas caninas básicas aplicadas 30–365 días antes de la exportación: moquillo, hepatitis, leptospirosis, parvovirus, rabia (fecha y marca del producto anotadas)"
    pt: "Vacinas caninas essenciais aplicadas de 30 a 365 dias antes da exportação: cinomose, hepatite, leptospirose, parvovirose, raiva (com data e marca do produto registradas)"
  - en: "No vaccine given in the 29 days before shipment"
    fr: "Aucun vaccin administré dans les 29 jours avant l'embarquement"
    es: "Ninguna vacuna administrada en los 29 días previos al embarque"
    pt: "Nenhuma vacina aplicada nos 29 dias anteriores ao embarque"
  - en: "Internal and external parasite treatment within 30 days before shipment (products authorized by the country of origin)"
    fr: "Traitement antiparasitaire interne et externe dans les 30 jours avant l'embarquement (produits autorisés par le pays d'origine)"
    es: "Tratamiento antiparasitario interno y externo dentro de los 30 días previos al embarque (productos autorizados por el país de origen)"
    pt: "Tratamento antiparasitário interno e externo nos 30 dias anteriores ao embarque (produtos autorizados pelo país de origem)"
  - en: "Rabies vaccination certificate and health card (tarjeta de salud) to accompany the health documents"
    fr: "Certificat de vaccination antirabique et tarjeta de salud accompagnant les documents sanitaires"
    es: "Certificado de vacunación antirrábica y tarjeta de salud que acompañen a los documentos sanitarios"
    pt: "Certificado de vacinação antirrábica e carteira de saúde (tarjeta de salud) acompanhando os documentos sanitários"
  - en: "From the US: certificate issued in VEHCS by a USDA-accredited vet and ink-endorsed by APHIS (one original + one photocopy on arrival)"
    fr: "Depuis les États-Unis : certificat établi dans VEHCS par un vétérinaire agréé USDA et visé à l'encre par l'APHIS (un original + une photocopie à l'arrivée)"
    es: "Desde los EE. UU.: certificado emitido en VEHCS por un veterinario acreditado por el USDA y refrendado con tinta por el APHIS (un original + una fotocopia a la llegada)"
    pt: "Dos EUA: certificado emitido no VEHCS por um veterinário credenciado pelo USDA e visado a tinta pelo APHIS (um original + uma fotocópia na chegada)"
  - en: "Crate washed and disinfected before shipment"
    fr: "Caisse lavée et désinfectée avant l'embarquement"
    es: "Jaula lavado y desinfectado antes del embarque"
    pt: "Caixa de transporte lavada e desinfetada antes do embarque"
  - en: "Microchip fitted (not required by IPSA, but advised for ID, return trip and airlines)"
    fr: "Puce posée (non exigée par l'IPSA, mais conseillée pour l'ID, le retour et les compagnies)"
    es: "Microchip colocado (no exigido por el IPSA, pero aconsejado para la identificación, el viaje de vuelta y las aerolíneas)"
    pt: "Microchip implantado (não exigido pelo IPSA, mas recomendado para identificação, viagem de volta e companhias aéreas)"
  - en: "Plan to obtain the quarantine permit from IPSA at the port of entry on arrival"
    fr: "Prévois d'obtenir le permis de quarantaine auprès de l'IPSA au point d'entrée à l'arrivée"
    es: "Prevé obtener el permiso de cuarentena del IPSA en el punto de entrada a la llegada"
    pt: "Programe-se para obter a autorização de quarentena do IPSA no ponto de entrada na chegada"
  - en: "Airline reservation and suitable travel crate if travelling in the hold"
    fr: "Réservation compagnie et caisse de transport adaptée si voyage en soute"
    es: "Reserva de la aerolínea y jaula de transporte adecuada si viaja en bodega"
    pt: "Reserva na companhia aérea e caixa de transporte adequada às normas IATA se for viajar no porão"

