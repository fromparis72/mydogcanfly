# Country Entry Guide — Nicaragua (bilingual EN/FR).
# Nicaragua is NOT in the EU. This encodes Nicaragua's own IPSA scheme.
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_ni
iso2: "NI"
name: { en: "Nicaragua", fr: "Nicaragua", es: "Nicaragua", pt: "Nicarágua" }
region: { en: "Central America", fr: "Amérique centrale", es: "América Central", pt: "América Central" }


regime: non_listed
exit:
  authority: IPSA
  authorityUrl: https://www.ipsa.gob.ni/SALUD-ANIMAL
  intro:
    en: "Nicaragua is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Instituto de Protección y Sanidad Agropecuaria (IPSA)."
    fr: "Le Nicaragua est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par l'Instituto de Protección y Sanidad Agropecuaria (IPSA)."
    es: "Nicaragua no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el Instituto de Protección y Sanidad Agropecuaria (IPSA)."
    pt: "A Nicarágua é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação visado pelo Instituto de Protección y Sanidad Agropecuaria (IPSA)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "IPSA (Animal Health / Agricultural Quarantine) is the competent authority that issues the export zoosanitary certificate before departure."
        fr: "L'IPSA (santé animale / quarantaine agricole) est l'autorité compétente qui délivre le certificat zoosanitaire d'export avant le départ."
        es: "El IPSA (sanidad animal / cuarentena agropecuaria) es la autoridad competente que emite el certificado zoosanitario de exportación antes de salir."
        pt: "O IPSA (Sanidade Animal / Quarentena Agropecuária) é a autoridade competente que emite o certificado zoossanitário de exportação antes da partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Nicaragua with your dog", fr: "Voyager au Nicaragua avec ton chien", es: "Viajar a Nicaragua con tu perro", pt: "Viajar para a Nicarágua com seu cachorro" }
  intro:
    en: >-
      Nicaragua welcomes dogs, and it runs its own scheme through IPSA — the Institute for Agricultural
      Protection and Health (Instituto de Protección y Sanidad Agropecuaria) — not the EU pet-passport
      system. A dog travelling with its owner needs an official export veterinary certificate from the
      country of departure confirming a clinical exam and good health, an up-to-date set of core canine
      vaccinations (including rabies) applied within a set window before travel, and an internal and
      external parasite treatment shortly before shipment. There is no rabies antibody test for entry.
      A personal pet does not need an advance import permit, but a quarantine permit is obtained on
      arrival at the Nicaraguan point of entry, where IPSA inspects the animal. What you must prepare
      still depends on your dog's country of departure and recent history, because the export certificate
      is issued and endorsed by the veterinary authority of that country. This guide explains exactly what
      to prepare before you book your flight.
    fr: >-
      Le Nicaragua accueille les chiens, et il applique son propre dispositif via l'IPSA — l'Institut de
      protection et de santé agricole (Instituto de Protección y Sanidad Agropecuaria) — et non le système
      du passeport européen. Un chien voyageant avec son propriétaire a besoin d'un certificat vétérinaire
      officiel d'exportation du pays de départ attestant d'un examen clinique et d'un bon état de santé,
      d'un ensemble de vaccins canins de base à jour (dont la rage) administrés dans une fenêtre définie
      avant le voyage, et d'un traitement antiparasitaire interne et externe peu avant l'embarquement. Il
      n'y a pas de titrage des anticorps antirabiques pour l'entrée. Un animal de compagnie n'a pas besoin
      de permis d'importation préalable, mais un permis de quarantaine est obtenu à l'arrivée au point
      d'entrée nicaraguayen, où l'IPSA inspecte l'animal. Ce qu'il faut préparer dépend tout de même du
      pays de départ et de l'historique récent du chien, car le certificat d'exportation est délivré et
      visé par l'autorité vétérinaire de ce pays. Ce guide détaille exactement quoi préparer avant de réserver.
    es: >-
      Nicaragua acoge a los perros y aplica su propio sistema a través del IPSA — el Instituto de
      Protección y Sanidad Agropecuaria — y no el sistema del pasaporte europeo para mascotas. Un perro
      que viaja con su propietario necesita un certificado veterinario oficial de exportación del país de
      salida que acredite un examen clínico y un buen estado de salud, un conjunto actualizado de vacunas
      caninas básicas (incluida la rabia) aplicadas dentro de un plazo determinado antes del viaje, y un
      tratamiento antiparasitario interno y externo poco antes del embarque. No hay prueba de titulación
      de rabia para la entrada. Una mascota personal no necesita un permiso de importación previo, pero se
      obtiene un permiso de cuarentena a la llegada al punto de entrada nicaragüense, donde el IPSA
      inspecciona al animal. Lo que debes preparar depende igualmente del país de salida y del historial
      reciente de tu perro, porque el certificado de exportación lo expide y refrenda la autoridad
      veterinaria de ese país. Esta guía explica exactamente qué preparar antes de reservar tu vuelo.

    pt: "A Nicarágua recebe cachorros e aplica seu próprio esquema, conduzido pelo IPSA — o Instituto de Proteção e Sanidade Agropecuária (Instituto de Protección y Sanidad Agropecuaria) —, e não o sistema do passaporte europeu para animais. Um cachorro que viaja com seu dono precisa de um certificado veterinário oficial de exportação do país de partida atestando exame clínico e bom estado de saúde, de um conjunto de vacinas caninas essenciais em dia (inclusive a antirrábica) aplicadas dentro de um prazo definido antes da viagem, e de um tratamento contra parasitas internos e externos pouco antes do embarque. Não há teste sorológico antirrábico para a entrada. Um animal de estimação pessoal não precisa de autorização de importação prévia, mas uma autorização de quarentena é obtida na chegada ao ponto de entrada nicaraguense, onde o IPSA inspeciona o animal. O que você tem de preparar também depende do país de partida e do histórico recente do seu cachorro, porque o certificado de exportação é emitido e visado pela autoridade veterinária desse país. Este guia explica exatamente o que preparar antes de você reservar o voo."
difficulty:
  level: moderate
  label: { en: "Moderate — full vaccination record and export certificate, quarantine permit on arrival", fr: "Modéré — carnet de vaccination complet et certificat d'exportation, permis de quarantaine à l'arrivée", es: "Moderada — registro de vacunación completo y certificado de exportación, permiso de cuarentena a la llegada", pt: "Moderada — carteira de vacinação completa e certificado de exportação, autorização de quarentena na chegada" }

prepTime:
  eu:
    en: "A few days to a few weeks if the core vaccines are already valid — IPSA requires distemper, hepatitis, leptospirosis, parvovirus and rabies applied between 30 and 365 days before export, plus a parasite treatment within 30 days of shipment and an official export certificate."
    fr: "De quelques jours à quelques semaines si les vaccins de base sont déjà valides — l'IPSA exige maladie de Carré, hépatite, leptospirose, parvovirose et rage administrés entre 30 et 365 jours avant l'exportation, plus un traitement antiparasitaire dans les 30 jours avant l'embarquement et un certificat officiel d'exportation."
    es: "De unos días a unas semanas si las vacunas básicas ya están vigentes — el IPSA exige moquillo, hepatitis, leptospirosis, parvovirus y rabia aplicados entre 30 y 365 días antes de la exportación, más un tratamiento antiparasitario dentro de los 30 días previos al embarque y un certificado oficial de exportación."
    pt: "De alguns dias a algumas semanas se as vacinas essenciais já estiverem válidas — o IPSA exige cinomose, hepatite, leptospirose, parvovirose e raiva aplicadas entre 30 e 365 dias antes da exportação, além de um tratamento antiparasitário nos 30 dias anteriores ao embarque e de um certificado de exportação oficial."
  listed:
    en: "From the United States: allow time for a USDA-accredited veterinarian to prepare the health certificate and for APHIS to ink-endorse it (VEHCS); the clinical exam is done within two weeks of departure and dogs over four months must be vaccinated against rabies."
    fr: "Depuis les États-Unis : prévois du temps pour qu'un vétérinaire agréé USDA établisse le certificat sanitaire et que l'APHIS le vise à l'encre (VEHCS) ; l'examen clinique est réalisé dans les deux semaines avant le départ et les chiens de plus de quatre mois doivent être vaccinés contre la rage."
    es: "Desde los Estados Unidos: deja tiempo para que un veterinario acreditado por el USDA prepare el certificado sanitario y para que el APHIS lo refrende con tinta (VEHCS); el examen clínico se realiza dentro de las dos semanas previas a la salida y los perros de más de cuatro meses deben estar vacunados contra la rabia."
    pt: "Dos Estados Unidos: reserve tempo para que um veterinário credenciado pelo USDA prepare o atestado de saúde e para que o APHIS o vise a tinta (VEHCS); o exame clínico é feito nas duas semanas anteriores à partida e cachorros com mais de quatro meses precisam estar vacinados contra a raiva."
  nonListed:
    en: "Longer for animals shipped in commercial lot numbers (not a personal pet): these must be accompanied by an import permit, in addition to all the sanitary requirements — arrange it before shipping."
    fr: "Plus long pour les animaux expédiés en lots commerciaux (et non comme animal de compagnie) : ceux-ci doivent être accompagnés d'un permis d'importation, en plus de toutes les exigences sanitaires — obtiens-le avant l'expédition."
    es: "Más largo para los animales enviados en lotes comerciales (no como mascota personal): estos deben ir acompañados de un permiso de importación, además de todos los requisitos sanitarios — gestiónalo antes del envío."
    pt: "Mais tempo para animais enviados em lotes comerciais (e não como animal de estimação pessoal): eles precisam ser acompanhados de uma autorização de importação, além de todas as exigências sanitárias — providencie-a antes do embarque."

