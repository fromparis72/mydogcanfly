# Country Entry Guide — Morocco (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_ma
iso2: "MA"
name: { en: "Morocco", fr: "Maroc", es: "Marruecos", pt: "Marrocos" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
domestic:
  intro:
    en: "Domestic flight in Morocco: no official domestic requirement could be confirmed — what is asked for comes from the airline."
    fr: "Vol intérieur au Maroc : aucune exigence intérieure officielle n'a pu être confirmée — ce qui est demandé vient de la compagnie."
    es: "Vuelo nacional en Marruecos: no se ha podido confirmar ningún requisito nacional oficial — lo que se pide viene de la aerolínea."
    pt: "Voo doméstico no Marrocos: não foi possível confirmar nenhuma exigência nacional oficial — o que é pedido vem da companhia aérea."
  points:
    - en: "The veterinary authority publishes identification and certificate models for import and export only; no domestic movement document was found, and even the general rabies obligation could not be verified on an official page."
      fr: "L'autorité vétérinaire ne publie des modèles d'identification et de certificats que pour l'import et l'export ; aucun document de mouvement intérieur n'a été trouvé, et même l'obligation générale de vaccination antirabique n'a pu être vérifiée sur une page officielle."
      es: "La autoridad veterinaria solo publica modelos de identificación y certificados para importación y exportación; no se encontró documento de movimiento nacional, y ni siquiera la obligación general de vacuna antirrábica pudo verificarse en una página oficial."
      pt: "A autoridade veterinária só publica modelos de identificação e de certificados para importação e exportação; nenhum documento de circulação interna foi encontrado, e nem mesmo a obrigação geral de vacinação antirrábica pôde ser verificada em uma página oficial."
    - en: "The airports authority imposes nothing of its own and defers entirely to the airline, which does ask for health and vaccination certificates and bans snub-nosed breeds."
      fr: "L'autorité aéroportuaire n'impose rien en propre et s'en remet entièrement à la compagnie, qui exige bien certificats de santé et de vaccination et interdit les races à nez court."
      es: "La autoridad aeroportuaria no impone nada propio y se remite enteramente a la aerolínea, que sí exige certificados de salud y vacunación y prohíbe razas chatas."
      pt: "A autoridade aeroportuária não impõe nada por conta própria e remete inteiramente à companhia aérea, que de fato exige atestado de saúde e comprovante de vacinação e proíbe as raças de focinho achatado."
exit:
  authority: ONSSA
  authorityUrl: https://www.onssa.gov.ma/import-and-export-controls/export-certification/export-of-live-animals/dogs-and-cats/?lang=en
  intro:
    en: "Leaving Morocco with your dog needs an official export health certificate (ONSSA model) signed by an official veterinarian."
    fr: "Sortir du Maroc avec ton chien demande un certificat sanitaire d'export officiel (modèle ONSSA) signé par un vétérinaire officiel."
    es: "Salir de Marruecos con tu perro requiere un certificado sanitario de exportación oficial (modelo ONSSA) firmado por un veterinario oficial."
    pt: "Sair do Marrocos com seu cachorro exige um atestado de saúde oficial de exportação (modelo ONSSA) assinado por um veterinário oficial."
  steps:
    - timing: window
      scope: any
      text:
        en: "Have an official veterinarian issue the ONSSA export health certificate shortly before departure."
        fr: "Fais établir le certificat sanitaire d'export ONSSA par un vétérinaire officiel peu avant le départ."
        es: "Haz que un veterinario oficial emita el certificado sanitario de exportación de ONSSA poco antes de la salida."
        pt: "Peça a um veterinário oficial que emita o atestado de saúde de exportação do ONSSA pouco antes da partida."
  onSiteNote:
    en: "Morocco is a non-listed country: the EU-return rabies titer is the real trap — do it in the EU BEFORE you leave to avoid a 3-month wait."
    fr: "Le Maroc est un pays non listé : le titrage antirabique du retour UE est le vrai piège — réalise-le dans l'UE AVANT de partir pour éviter les 3 mois d'attente."
    es: "Marruecos es un país no listado: la titulación antirrábica del regreso a la UE es la verdadera trampa — hazla en la UE ANTES de salir para evitar la espera de 3 meses."
    pt: "O Marrocos é um país não listado: o teste sorológico antirrábico (titulação) exigido no retorno à UE é a verdadeira armadilha — faça-o na UE ANTES de partir, para evitar 3 meses de espera."

hero:
  h1: { en: "Traveling to Morocco with your dog", fr: "Voyager au Maroc avec ton chien", es: "Viajar a Marruecos con tu perro", pt: "Viajar para o Marrocos com seu cachorro" }
  intro:
    en: >-
      Morocco welcomes pet dogs, but entry runs through the country's own scheme managed by ONSSA
      (the national food-safety and veterinary authority), not the EU framework. Every dog needs a
      permanent identification (microchip or tattoo), a valid rabies vaccination and an official
      veterinary health certificate (certificat sanitaire) issued shortly before departure by a
      government vet of the country of origin. The dog must also come from a country or zone free of
      rabies. For a temporary stay, a rabies antibody test is required in addition. On arrival, you
      present your dog for veterinary inspection and declare it to customs. This guide explains the
      certificate, the rabies rules, the temporary-stay blood test and the banned breeds so you know
      exactly what to prepare before you book your flight.
    fr: >-
      Le Maroc accueille les chiens, mais l'entrée passe par le dispositif propre au pays, géré par
      l'ONSSA (l'autorité nationale de sécurité sanitaire et vétérinaire), et non par le cadre de l'UE.
      Chaque chien doit disposer d'une identification permanente (puce électronique ou tatouage), d'une
      vaccination antirabique valide et d'un certificat sanitaire officiel établi peu avant le départ
      par un vétérinaire officiel du pays d'origine. Le chien doit en outre provenir d'un pays ou d'une
      zone indemne de rage. Pour un séjour temporaire, un titrage des anticorps antirabiques est exigé
      en plus. À l'arrivée, tu présente ton chien à l'inspection vétérinaire et le déclare à la
      douane. Ce guide détaille le certificat, les règles antirabiques, la prise de sang pour les
      séjours temporaires et les races interdites, pour savoir exactement quoi préparer avant de
      réserver ton vol.
    es: >-
      Marruecos acoge a los perros de compañía, pero la entrada se gestiona a través del sistema
      propio del país, administrado por la ONSSA (la autoridad nacional de seguridad alimentaria y
      veterinaria), y no por el marco de la UE. Todo perro necesita una identificación permanente
      (microchip o tatuaje), una vacunación antirrábica válida y un certificado sanitario veterinario
      oficial (certificat sanitaire) expedido poco antes de la salida por un veterinario oficial del
      país de origen. El perro debe proceder además de un país o una zona libre de rabia. Para una
      estancia temporal, se exige adicionalmente una prueba de titulación de rabia. A la llegada,
      presentas tu perro para la inspección veterinaria y lo declaras en aduanas. Esta guía explica
      el certificado, las normas antirrábicas, el análisis de sangre para estancias temporales y las
      razas prohibidas, para que sepas exactamente qué preparar antes de reservar tu vuelo.

    pt: "O Marrocos recebe cachorros de estimação, mas a entrada segue o sistema próprio do país, gerido pelo ONSSA (a autoridade nacional de segurança sanitária dos alimentos e de saúde veterinária), e não o marco da UE. Todo cachorro precisa de uma identificação permanente (microchip ou tatuagem), de uma vacinação antirrábica válida e de um certificado veterinário oficial (certificat sanitaire) emitido pouco antes da partida por um veterinário oficial do país de origem. O cachorro também precisa vir de um país ou de uma zona livre de raiva. Para uma estadia temporária, é exigido além disso um teste sorológico antirrábico (titulação). Na chegada, você apresenta o cachorro à inspeção veterinária e o declara à alfândega. Este guia explica o certificado, as regras sobre a raiva, o exame de sangue das estadias temporárias e as raças proibidas, para você saber exatamente o que preparar antes de reservar o voo."
difficulty:
  level: moderate
  label: { en: "Moderate — official veterinary certificate required", fr: "Modéré — certificat sanitaire officiel requis", es: "Moderado — se exige un certificado sanitario oficial", pt: "Moderado — certificado veterinário oficial obrigatório" }

prepTime:
  eu:
    en: "From the EU: a few days if identification and rabies vaccination are already in order — the ONSSA health certificate is issued by an official vet close to departure."
    fr: "Depuis l'UE : quelques jours si l'identification et la vaccination antirabique sont déjà en règle — le certificat sanitaire ONSSA est établi par un vétérinaire officiel peu avant le départ."
    es: "Desde la UE: unos días si la identificación y la vacunación antirrábica ya están en regla — el certificado sanitario ONSSA lo expide un veterinario oficial poco antes de la salida."
    pt: "Da UE: alguns dias se a identificação e a vacinação antirrábica já estiverem em ordem — o atestado de saúde do ONSSA é emitido por um veterinário oficial perto da data de partida."
  listed:
    en: "From another third country: similar timing using the ONSSA certificate model for that country; allow about 3 weeks if the first rabies shot is still needed."
    fr: "Depuis un autre pays tiers : délais comparables avec le modèle de certificat ONSSA du pays ; prévois environ 3 semaines s'il faut encore faire le premier vaccin antirabique."
    es: "Desde otro país tercero: plazos similares usando el modelo de certificado ONSSA de ese país; prevé unas 3 semanas si aún falta la primera vacuna antirrábica."
    pt: "De outro país terceiro: prazos parecidos, usando o modelo de certificado do ONSSA correspondente a esse país; conte cerca de 3 semanas se a primeira dose da vacina antirrábica ainda for necessária."
  nonListed:
    en: "For a temporary stay, add the rabies antibody test: blood drawn at least 30 days after vaccination, so plan several extra weeks for sampling and the laboratory result."
    fr: "Pour un séjour temporaire, ajoute le titrage antirabique : sang prélevé au moins 30 jours après la vaccination — compte plusieurs semaines de plus pour le prélèvement et le résultat de laboratoire."
    es: "Para una estancia temporal, añade la prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacunación, así que prevé varias semanas más para la toma y el resultado del laboratorio."
    pt: "Para uma estadia temporária, acrescente o teste sorológico antirrábico (titulação): coleta de sangue pelo menos 30 dias após a vacinação, portanto reserve várias semanas a mais para a coleta e o resultado do laboratório."

