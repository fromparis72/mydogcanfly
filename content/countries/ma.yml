    es: "Confirma que tu perro no sea de una raza prohibida (pit bull, Boerbull/Mastiff, Tosa)"
    pt: "Confirme que seu cachorro não é de uma raça proibida (pit bull, Boerbull/Mastiff, Tosa)"
  - en: "Airline reservation confirming your dog's travel option and suitable IATA crate"
