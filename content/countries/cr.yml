# Country Entry Guide — Costa Rica (source of truth, bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_cr
iso2: "CR"
name: { en: "Costa Rica", fr: "Costa Rica", es: "Costa Rica", pt: "Costa Rica" }
region: { en: "Central America", fr: "Amérique centrale", es: "América Central", pt: "América Central" }


regime: non_listed
domestic:
  intro:
    en: "Domestic flight in Costa Rica: no State requirement found for a domestic flight."
    fr: "Vol intérieur au Costa Rica : aucune exigence de l'État identifiée pour un vol intérieur."
    es: "Vuelo nacional en Costa Rica: no se ha identificado ningún requisito del Estado para un vuelo nacional."
    pt: "Voo doméstico na Costa Rica: nenhuma exigência do Estado foi identificada para um voo doméstico."
  points:
    - en: "SENASA's dog and cat procedures are written for leaving the country; no domestic permit or certificate exists for pets."
      fr: "Les procédures du SENASA pour chiens et chats sont écrites pour la sortie du territoire ; aucun permis ni certificat intérieur n'existe pour les animaux de compagnie."
      es: "Los procedimientos de SENASA para perros y gatos están escritos para salir del país; no existe permiso ni certificado nacional para mascotas."
      pt: "Os procedimentos do SENASA para cães e gatos foram escritos para a saída do país; não existe autorização nem certificado interno para animais de estimação."
    - en: "The domestic operator carries dogs in the hold rather than the cabin and asks for a vaccination record — a carrier condition."
      fr: "L'opérateur intérieur transporte les chiens en soute plutôt qu'en cabine et demande un carnet de vaccination — une condition de la compagnie."
      es: "El operador nacional transporta perros en bodega más que en cabina y pide una cartilla de vacunación — una condición de la aerolínea."
      pt: "A companhia doméstica transporta cachorros no porão, e não na cabine, e pede a carteira de vacinação — é uma condição da transportadora."
exit:
  authority: SENASA
  authorityUrl: https://www.senasa.go.cr/informacion/centro-de-informacion/informacion/sgc/dca/mascotas
  intro:
    en: "Costa Rica is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by SENASA."
    fr: "Le Costa Rica est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par le SENASA."
    es: "Costa Rica no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el SENASA."
    pt: "A Costa Rica é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação visado pelo SENASA."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "A private vet prepares the export certificate and it must be reviewed and signed by an official SENASA veterinarian; it is valid 21 days."
        fr: "Un vétérinaire privé prépare le certificat d'export, qui doit être vérifié et signé par un vétérinaire officiel du SENASA ; il est valable 21 jours."
        es: "Un veterinario privado prepara el certificado de exportación, que debe ser revisado y firmado por un veterinario oficial del SENASA; es válido 21 días."
        pt: "Um veterinário particular prepara o certificado de exportação, que precisa ser conferido e assinado por um veterinário oficial do SENASA; ele vale 21 dias."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Costa Rica with your dog", fr: "Voyager au Costa Rica avec ton chien", es: "Viajar a Costa Rica con tu perro", pt: "Viajar para a Costa Rica com seu cachorro" }
  intro:
    en: >-
      Costa Rica welcomes dogs, and it runs its own scheme through SENASA (Servicio Nacional de Salud
      Animal), part of the Ministry of Agriculture and Livestock — not the EU pet-passport system. A dog
      travelling with its owner needs a clinical exam by a veterinarian in the country of origin within the
      two weeks before travel, an official (endorsed) international veterinary certificate, a microchip whose
      number is written on that certificate, a valid rabies vaccination if the dog is over three months old,
      the core canine vaccines, and internal and external parasite treatment within 15 days before arrival.
      There is no quarantine and no rabies antibody test for entry. What you must prepare still depends on
      your dog's country of departure and recent history, because the certificate must confirm the dog's
      health status. This guide explains exactly what to prepare before you book your flight.
    fr: >-
      Le Costa Rica accueille les chiens, et il applique son propre dispositif via le SENASA (Servicio
      Nacional de Salud Animal), rattaché au ministère de l'Agriculture et de l'Élevage — et non le système
      du passeport européen. Un chien voyageant avec son propriétaire a besoin d'un examen clinique par un
      vétérinaire dans le pays d'origine dans les deux semaines précédant le voyage, d'un certificat
      vétérinaire international officiel (visé), d'une puce dont le numéro figure sur ce certificat, d'une
      vaccination antirabique valide si le chien a plus de trois mois, des vaccins canins de base, et d'un
      traitement antiparasitaire interne et externe dans les 15 jours avant l'arrivée. Il n'y a ni
      quarantaine ni titrage des anticorps antirabiques pour l'entrée. Ce qu'il faut préparer dépend tout de
      même du pays de départ et de l'historique récent du chien, car le certificat doit confirmer son état
      sanitaire. Ce guide détaille exactement quoi préparer avant de réserver.
    es: >-
      Costa Rica acoge a los perros y aplica su propio sistema a través del SENASA (Servicio Nacional de
      Salud Animal), adscrito al Ministerio de Agricultura y Ganadería — y no el sistema del pasaporte
      europeo. Un perro que viaja con su dueño necesita un examen clínico realizado por un veterinario en
      el país de origen dentro de las dos semanas previas al viaje, un certificado veterinario internacional
      oficial (refrendado), un microchip cuyo número figure en ese certificado, una vacunación antirrábica
      válida si el perro tiene más de tres meses, las vacunas caninas básicas y un tratamiento contra
      parásitos internos y externos dentro de los 15 días previos a la llegada. No hay cuarentena ni prueba
      de titulación de rabia para la entrada. Lo que debes preparar depende igualmente del país de salida y
      del historial reciente del perro, porque el certificado debe confirmar su estado sanitario. Esta guía
      explica exactamente qué preparar antes de reservar tu vuelo.

    pt: "A Costa Rica recebe cachorros e aplica seu próprio esquema, conduzido pelo SENASA (Servicio Nacional de Salud Animal), órgão do Ministério da Agricultura e Pecuária — não o sistema do passaporte europeu para animais. Um cachorro que viaja com seu dono precisa de um exame clínico feito por um veterinário no país de origem nas duas semanas anteriores à viagem, de um certificado veterinário internacional oficial (visado), de um microchip cujo número esteja escrito nesse certificado, de vacinação antirrábica válida se tiver mais de três meses de idade, das vacinas caninas essenciais e de tratamento contra parasitas internos e externos nos 15 dias anteriores à chegada. Não há quarentena nem teste sorológico antirrábico para a entrada. O que você tem de preparar também depende do país de partida e do histórico recente do seu cachorro, porque o certificado precisa confirmar o estado de saúde dele. Este guia explica exatamente o que preparar antes de você reservar o voo."
difficulty:
  level: moderate
  label: { en: "Moderate — one endorsed certificate and full vaccination record, no quarantine", fr: "Modéré — un certificat visé et un carnet complet, sans quarantaine", es: "Moderado — un certificado refrendado y un carné de vacunación completo, sin cuarentena", pt: "Moderada — um certificado visado e a carteira de vacinação completa, sem quarentena" }

prepTime:
  eu:
    en: "A few days to two weeks if the rabies and core vaccines are already valid — the clinical exam and endorsed certificate are done within two weeks of travel, and deworming within 15 days of arrival."
    fr: "De quelques jours à deux semaines si les vaccins antirabique et de base sont déjà valides — l'examen clinique et le certificat visé sont réalisés dans les deux semaines avant le voyage, et le vermifuge dans les 15 jours avant l'arrivée."
    es: "De unos días a dos semanas si las vacunas antirrábica y básicas ya están vigentes — el examen clínico y el certificado refrendado se hacen dentro de las dos semanas previas al viaje, y la desparasitación dentro de los 15 días previos a la llegada."
    pt: "De alguns dias a duas semanas se a vacina antirrábica e as vacinas essenciais já estiverem válidas — o exame clínico e o certificado visado são feitos nas duas semanas anteriores à viagem, e a vermifugação nos 15 dias anteriores à chegada."
  listed:
    en: "Longer if a first rabies shot is still needed: a dog can only be vaccinated against rabies from three months of age, and the vaccination must be valid at the time of entry."
    fr: "Plus long si une première vaccination antirabique reste à faire : un chien ne peut être vacciné contre la rage qu'à partir de trois mois, et la vaccination doit être valide au moment de l'entrée."
    es: "Más tiempo si aún falta la primera vacuna antirrábica: un perro solo puede vacunarse contra la rabia a partir de los tres meses de edad, y la vacunación debe estar vigente en el momento de la entrada."
    pt: "Mais tempo se ainda faltar a primeira dose antirrábica: um cachorro só pode ser vacinado contra a raiva a partir dos três meses de idade, e a vacinação precisa estar válida no momento da entrada."
  nonListed:
    en: "Longer for a pet shipped as cargo (unaccompanied): in addition to all the above, a prior import permit must be arranged through a customs agency before shipping."
    fr: "Plus long pour un animal expédié comme fret (non accompagné) : en plus de tout ce qui précède, un permis d'importation préalable doit être obtenu via une agence en douane avant l'expédition."
    es: "Más tiempo para una mascota enviada como carga (no acompañada): además de todo lo anterior, hay que gestionar un permiso de importación previo a través de una agencia aduanal antes del envío."
    pt: "Mais tempo para um animal enviado como carga (desacompanhado): além de tudo o que foi listado acima, é preciso obter uma autorização de importação prévia por meio de uma agência aduaneira antes do embarque."

