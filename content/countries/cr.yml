restrictedDogs:
  intro:
    en: "Costa Rica has no national breed-specific import ban. SENASA does not classify any breed as dangerous; the country regulates dogs by behaviour and responsible ownership rather than by breed, under the Animal Welfare Law (Ley 7451) and the regulation on responsible reproduction and ownership of companion animals."
    fr: "Le Costa Rica n'a aucune interdiction nationale d'importation visant une race. Le SENASA ne classe aucune race comme dangereuse ; le pays réglemente les chiens par le comportement et la détention responsable plutôt que par la race, en vertu de la loi de bien-être animal (Ley 7451) et du règlement sur la reproduction et la détention responsables des animaux de compagnie."
    es: "Costa Rica no tiene ninguna prohibición nacional de importación por raza. El SENASA no clasifica ninguna raza como peligrosa; el país regula a los perros por el comportamiento y la tenencia responsable en lugar de por la raza, en virtud de la Ley de Bienestar de los Animales (Ley 7451) y del reglamento sobre la reproducción y tenencia responsable de los animales de compañía."
    pt: "A Costa Rica não tem proibição nacional de importação por raça. O SENASA não classifica nenhuma raça como perigosa; o país regula os cachorros pelo comportamento e pela posse responsável, e não pela raça, com base na lei de bem-estar animal (Ley 7451) e no regulamento sobre reprodução e posse responsável de animais de companhia."
  cat1:
    en: "No dog breed is prohibited from entering Costa Rica under national law. Any dog meeting SENASA's certificate, identification, vaccination and parasite-treatment requirements may be imported regardless of breed."
    fr: "Aucune race de chien n'est interdite d'entrée au Costa Rica selon la loi nationale. Tout chien répondant aux exigences du SENASA (certificat, identification, vaccination, traitement antiparasitaire) peut être importé, quelle que soit sa race."
    es: "Ninguna raza de perro tiene prohibida la entrada a Costa Rica según la ley nacional. Cualquier perro que cumpla los requisitos del SENASA (certificado, identificación, vacunación y tratamiento antiparasitario) puede importarse independientemente de la raza."
    pt: "Nenhuma raça de cachorro é proibida de entrar na Costa Rica pela legislação nacional. Qualquer cachorro que cumpra as exigências de certificado, identificação, vacinação e tratamento antiparasitário do SENASA pode ser importado, seja qual for a raça."
  cat2:
    en: "Costa Rican rules address dogs that behave aggressively (declared potentially dangerous by conduct, not by breed), with responsible-ownership duties for the owner — leash control and, where needed, a muzzle in public. These duties concern how a dog is kept and handled in the country, not import eligibility."
    fr: "Les règles costariciennes visent les chiens au comportement agressif (déclarés potentiellement dangereux par la conduite, non par la race), avec des obligations de détention responsable pour le propriétaire — tenue en laisse et, si nécessaire, muselière dans l'espace public. Ces obligations concernent la manière de détenir et de gérer un chien dans le pays, pas l'admissibilité à l'importation."
    es: "Las normas costarricenses se dirigen a los perros que se comportan de forma agresiva (declarados potencialmente peligrosos por su conducta, no por su raza), con obligaciones de tenencia responsable para el dueño — control con correa y, cuando sea necesario, bozal en público. Estas obligaciones se refieren a cómo se tiene y se maneja a un perro en el país, no a la admisibilidad de importación."
    pt: "As regras costa-riquenhas tratam dos cachorros que se comportam de forma agressiva (declarados potencialmente perigosos pela conduta, e não pela raça), com deveres de posse responsável para o dono — condução na guia e, quando necessário, focinheira em público. Esses deveres dizem respeito a como o cachorro é mantido e conduzido no país, não ao direito de entrada."
  note:
    en: "Airlines may set their own breed and crate rules. Confirm current national rules and your airline's breed policy before booking."
    fr: "Les compagnies aériennes peuvent fixer leurs propres règles de race et de caisse. Vérifie les règles nationales en vigueur et la politique de race de ta compagnie avant de réserver."
    es: "Las aerolíneas pueden establecer sus propias normas de raza y jaula. Confirma las normas nacionales vigentes y la política de razas de tu aerolínea antes de reservar."
    pt: "As companhias aéreas podem ter suas próprias regras de raça e de caixa de transporte. Confirme as regras nacionais em vigor e a política de raças da sua companhia aérea antes de reservar."

checklist:
  - en: "Microchip implanted and its number written on the veterinary certificate"
    fr: "Puce posée et son numéro inscrit sur le certificat vétérinaire"
    es: "Microchip implantado y su número anotado en el certificado veterinario"
    pt: "Microchip implantado e o número dele escrito no certificado veterinário"
  - en: "Valid rabies vaccination if the dog is over 3 months old (current at entry)"
    fr: "Vaccination antirabique valide si le chien a plus de 3 mois (en cours de validité à l'entrée)"
    es: "Vacunación antirrábica válida si el perro tiene más de 3 meses (vigente en la entrada)"
    pt: "Vacinação antirrábica válida se o cachorro tiver mais de 3 meses (em dia na entrada)"
  - en: "Core canine vaccines by age: distemper, hepatitis, parvovirus, leptospirosis"
    fr: "Vaccins canins de base selon l'âge : maladie de Carré, hépatite, parvovirose, leptospirose"
    es: "Vacunas caninas básicas según la edad: moquillo, hepatitis, parvovirus, leptospirosis"
    pt: "Vacinas caninas essenciais conforme a idade: cinomose, hepatite, parvovirose, leptospirose"
  - en: "Internal and external parasite treatment within 15 days before arrival (brand, batch, validity noted)"
    fr: "Traitement antiparasitaire interne et externe dans les 15 jours avant l'arrivée (marque, lot, validité indiqués)"
    es: "Tratamiento contra parásitos internos y externos dentro de los 15 días previos a la llegada (marca, lote y vigencia anotados)"
    pt: "Tratamento antiparasitário interno e externo nos 15 dias anteriores à chegada (marca, lote e validade anotados)"
  - en: "Clinical exam by a vet in the country of origin within 2 weeks before travel"
    fr: "Examen clinique par un vétérinaire du pays d'origine dans les 2 semaines avant le voyage"
    es: "Examen clínico por un veterinario del país de origen dentro de las 2 semanas previas al viaje"
    pt: "Exame clínico por um veterinário no país de origem nas 2 semanas anteriores à viagem"
  - en: "Official international veterinary certificate endorsed by the country's animal-health authority"
    fr: "Certificat vétérinaire international officiel visé par l'autorité sanitaire du pays"
    es: "Certificado veterinario internacional oficial refrendado por la autoridad sanitaria animal del país"
    pt: "Certificado veterinário internacional oficial visado pela autoridade de saúde animal do país"
  - en: "Prior import permit via a customs agency only if the pet is shipped as cargo"
    fr: "Permis d'importation préalable via une agence en douane uniquement si l'animal est expédié comme fret"
    es: "Permiso de importación previo a través de una agencia aduanal solo si la mascota se envía como carga"
    pt: "Autorização de importação prévia por meio de uma agência aduaneira só se o animal for enviado como carga"
  - en: "Original documents carried with you (not copies)"
    fr: "Documents originaux transportés avec toi (pas de copies)"
    es: "Documentos originales que lleves contigo (no copias)"
    pt: "Documentos originais levados com você (não cópias)"
  - en: "Airline reservation and suitable travel crate if travelling in the hold"
    fr: "Réservation compagnie et caisse de transport adaptée si voyage en soute"
    es: "Reserva de la aerolínea y jaula de transporte adecuada si viaja en bodega"
    pt: "Reserva na companhia aérea e caixa de transporte adequada às normas IATA se for viajar no porão"

