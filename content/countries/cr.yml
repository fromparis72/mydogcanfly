  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Costa Rica (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — le Costa Rica (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Costa Rica (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — a Costa Rica (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — Costa Rica", fr: "Pays de destination — Costa Rica", es: "País de destino — Costa Rica", pt: "País de destino — Costa Rica" }
      text:
        en: "SENASA runs a certificate-based scheme: an official international veterinary certificate, a microchip, a valid rabies vaccination (from 3 months old), core canine vaccines and internal/external parasite treatment are always required. No import permit is needed for a personal pet."
        fr: "Le SENASA applique un dispositif fondé sur un certificat : certificat vétérinaire international officiel, puce, vaccination antirabique valide (dès 3 mois), vaccins canins de base et traitement antiparasitaire interne/externe toujours exigés. Aucun permis d'import n'est requis pour un animal de compagnie."
        es: "El SENASA aplica un sistema basado en un certificado: siempre se exigen un certificado veterinario internacional oficial, un microchip, una vacunación antirrábica válida (a partir de los 3 meses), las vacunas caninas básicas y un tratamiento contra parásitos internos/externos. No se necesita permiso de importación para una mascota personal."
        pt: "O SENASA aplica um esquema baseado em certificados: um certificado veterinário internacional oficial, um microchip, vacinação antirrábica válida (a partir dos 3 meses de idade), vacinas caninas essenciais e tratamento contra parasitas internos/externos são sempre obrigatórios. Não é preciso autorização de importação para um animal de estimação pessoal."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The certificate is issued by the competent animal-health authority of the country of departure or origin, after a clinical exam within two weeks of travel, so the departure country's official veterinary service and health status matter directly."
        fr: "Le certificat est délivré par l'autorité sanitaire compétente du pays de départ ou d'origine, après un examen clinique dans les deux semaines avant le voyage ; le service vétérinaire officiel et le statut sanitaire du pays de départ comptent donc directement."
        es: "El certificado lo expide la autoridad sanitaria animal competente del país de salida o de origen, tras un examen clínico realizado dentro de las dos semanas previas al viaje, por lo que el servicio veterinario oficial y el estado sanitario del país de salida influyen directamente."
        pt: "O certificado é emitido pela autoridade de saúde animal competente do país de partida ou de origem, depois de um exame clínico feito nas duas semanas anteriores à viagem; por isso o serviço veterinário oficial e a situação sanitária do país de partida contam diretamente."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "Your dog's recent residence and rabies history determine whether its vaccination record is complete and valid for the whole trip. It is the dog's real history that counts — not only the last airport."
        fr: "La résidence récente et l'historique rabique du chien déterminent si son carnet de vaccination est complet et valide pour tout le voyage. C'est l'historique réel du chien qui compte — pas seulement le dernier aéroport."
        es: "La residencia reciente y el historial de rabia de tu perro determinan si su carné de vacunación está completo y vigente para todo el viaje. Lo que cuenta es el historial real del perro — no solo el último aeropuerto."
        pt: "Onde o seu cachorro morou recentemente e o histórico de raiva dele determinam se a carteira de vacinação está completa e válida durante toda a viagem. O que conta é o histórico real do cachorro — não só o último aeroporto."
  note:
    en: "So read the requirements below as the Costa Rican framework, then confirm your dog's exact origin and history with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre costaricien, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco costarricense y luego confirma el origen y el historial exactos de tu perro con tu veterinario."
    pt: "Leia então as exigências abaixo como o quadro geral da Costa Rica, e confirme com seu veterinário a origem e o histórico exatos do seu cachorro."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Dogs must be identified with a microchip, and the microchip number must be declared on the official veterinary certificate.", fr: "Les chiens doivent être identifiés par une puce, et le numéro de puce doit être déclaré sur le certificat vétérinaire officiel.", es: "Los perros deben estar identificados con un microchip, y el número del microchip debe declararse en el certificado veterinario oficial.", pt: "Os cachorros precisam ser identificados com um microchip, e o número do microchip precisa ser declarado no certificado veterinário oficial." }
    exceptions: { en: "No tattoo alternative is published by SENASA; the number on the certificate must match the animal.", fr: "Aucune alternative par tatouage n'est publiée par le SENASA ; le numéro figurant sur le certificat doit correspondre à l'animal.", es: "El SENASA no publica una alternativa por tatuaje; el número que figura en el certificado debe corresponder al animal.", pt: "O SENASA não publica nenhuma alternativa por tatuagem; o número que consta no certificado precisa corresponder ao animal." }
    ref: { en: "SENASA / MAG — Sanitary requirements for importing dogs and cats", fr: "SENASA / MAG — Exigences sanitaires pour l'importation de chiens et chats", es: "SENASA / MAG — Requisitos sanitarios para la importación de perros y gatos", pt: "SENASA / MAG — Exigências sanitárias para a importação de cães e gatos" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required if over 3 months old", fr: "Requise si plus de 3 mois", es: "Obligatoria si tiene más de 3 meses", pt: "Obrigatória se tiver mais de 3 meses" }
    when: { en: "Dogs older than three months must carry a valid rabies vaccination; the certificate must record the date applied, brand, batch number and validity, and the vaccine must be current at the time of entry.", fr: "Les chiens de plus de trois mois doivent disposer d'une vaccination antirabique valide ; le certificat doit indiquer la date d'application, la marque, le numéro de lot et la validité, et le vaccin doit être en cours de validité au moment de l'entrée.", es: "Los perros mayores de tres meses deben contar con una vacunación antirrábica válida; el certificado debe registrar la fecha de aplicación, la marca, el número de lote y la vigencia, y la vacuna debe estar vigente en el momento de la entrada.", pt: "Cachorros com mais de três meses precisam ter vacinação antirrábica válida; o certificado precisa registrar a data de aplicação, a marca, o número do lote e a validade, e a vacina precisa estar em dia no momento da entrada." }
    exceptions: { en: "A specific number of days to wait between the rabies shot and travel is not published by SENASA — Non communiqué; confirm the timing with your vet.", fr: "Un délai précis à respecter entre la vaccination antirabique et le voyage n'est pas communiqué par le SENASA — Non communiqué ; confirme le calendrier avec ton vétérinaire.", es: "El SENASA no publica un número concreto de días de espera entre la vacuna antirrábica y el viaje — sin especificar; confirma los plazos con tu veterinario.", pt: "O SENASA não publica um prazo específico de espera entre a dose antirrábica e a viagem — não informado; confirme os prazos com seu veterinário." }
    ref: { en: "SENASA / MAG — Sanitary requirements for importing dogs and cats", fr: "SENASA / MAG — Exigences sanitaires pour l'importation de chiens et chats", es: "SENASA / MAG — Requisitos sanitarios para la importación de perros y gatos", pt: "SENASA / MAG — Exigências sanitárias para a importação de cães e gatos" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "No fixed minimum published", fr: "Aucun minimum fixe publié", es: "No se publica un mínimo fijo", pt: "Nenhum mínimo fixo publicado" }
    when: { en: "SENASA does not publish a single minimum entry age; rabies vaccination is required only for dogs over three months old, and core vaccines depend on the dog's age.", fr: "Le SENASA ne publie pas d'âge minimum d'entrée unique ; la vaccination antirabique n'est exigée que pour les chiens de plus de trois mois, et les vaccins de base dépendent de l'âge du chien.", es: "El SENASA no publica una edad mínima de entrada única; la vacunación antirrábica solo se exige para los perros mayores de tres meses, y las vacunas básicas dependen de la edad del perro.", pt: "O SENASA não publica uma idade mínima única de entrada; a vacinação antirrábica só é obrigatória para cachorros com mais de três meses, e as vacinas essenciais dependem da idade do cachorro." }
    exceptions: { en: "For a dog three months or younger, whether it may still travel unvaccinated is not detailed — Non communiqué; confirm with SENASA before travel.", fr: "Pour un chien de trois mois ou moins, la possibilité de voyager sans vaccination n'est pas détaillée — Non communiqué ; vérifie auprès du SENASA avant le voyage.", es: "Para un perro de tres meses o menos, no se detalla si puede viajar sin vacunar — sin especificar; confírmalo con el SENASA antes de viajar.", pt: "Para um cachorro de três meses ou menos, não há detalhamento sobre a possibilidade de viajar sem vacinação — não informado; confirme com o SENASA antes da viagem." }
    ref: { en: "SENASA / MAG — Sanitary requirements for importing dogs and cats", fr: "SENASA / MAG — Exigences sanitaires pour l'importation de chiens et chats", es: "SENASA / MAG — Requisitos sanitarios para la importación de perros y gatos", pt: "SENASA / MAG — Exigências sanitárias para a importação de cães e gatos" }
  - item: { en: "Core canine vaccinations", fr: "Vaccins canins de base", es: "Vacunas caninas básicas", pt: "Vacinas caninas essenciais" }
    required: { en: "Required (by age)", fr: "Requis (selon l'âge)", es: "Obligatorias (según la edad)", pt: "Obrigatórias (conforme a idade)" }
    when: { en: "According to age, dogs must be vaccinated against distemper, hepatitis, parvovirus, leptospirosis and rabies; the certificate must list the date applied, brand, batch and validity of each.", fr: "Selon l'âge, les chiens doivent être vaccinés contre la maladie de Carré, l'hépatite, la parvovirose, la leptospirose et la rage ; le certificat doit indiquer la date d'application, la marque, le lot et la validité de chacun.", es: "Según la edad, los perros deben estar vacunados contra el moquillo, la hepatitis, el parvovirus, la leptospirosis y la rabia; el certificado debe indicar la fecha de aplicación, la marca, el lote y la vigencia de cada una.", pt: "Conforme a idade, os cachorros precisam estar vacinados contra cinomose, hepatite, parvovirose, leptospirose e raiva; o certificado precisa indicar a data de aplicação, a marca, o lote e a validade de cada uma." }
    exceptions: { en: "All listed vaccines must be current at the time of entry.", fr: "Tous les vaccins indiqués doivent être en cours de validité au moment de l'entrée.", es: "Todas las vacunas indicadas deben estar vigentes en el momento de la entrada.", pt: "Todas as vacinas listadas precisam estar em dia no momento da entrada." }
    ref: { en: "SENASA / MAG — Sanitary requirements for importing dogs and cats", fr: "SENASA / MAG — Exigences sanitaires pour l'importation de chiens et chats", es: "SENASA / MAG — Requisitos sanitarios para la importación de perros y gatos", pt: "SENASA / MAG — Exigências sanitárias para a importação de cães e gatos" }
  - item: { en: "Internal and external parasite treatment", fr: "Traitement antiparasitaire interne et externe", es: "Tratamiento contra parásitos internos y externos", pt: "Tratamento antiparasitário interno e externo" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Dogs must be treated against internal and external parasites within the 15 days before arrival in Costa Rica; the certificate must declare the treatment's brand, batch number and validity.", fr: "Les chiens doivent être traités contre les parasites internes et externes dans les 15 jours avant l'arrivée au Costa Rica ; le certificat doit déclarer la marque, le numéro de lot et la validité du traitement.", es: "Los perros deben ser tratados contra los parásitos internos y externos dentro de los 15 días previos a la llegada a Costa Rica; el certificado debe declarar la marca, el número de lote y la vigencia del tratamiento.", pt: "Os cachorros precisam receber tratamento contra parasitas internos e externos nos 15 dias anteriores à chegada à Costa Rica; o certificado precisa declarar a marca, o número do lote e a validade do tratamento." }
    exceptions: { en: "No separate tapeworm (Echinococcus) window is published — a general internal/external parasite treatment is required.", fr: "Aucun délai spécifique contre l'échinococcose n'est publié — un traitement antiparasitaire interne/externe général est exigé.", es: "No se publica un plazo específico contra la tenia (Echinococcus) — se exige un tratamiento general contra parásitos internos/externos.", pt: "Não há prazo específico publicado para tênia (Echinococcus) — o que se exige é um tratamento antiparasitário interno/externo geral." }
    ref: { en: "SENASA / MAG — Sanitary requirements for importing dogs and cats", fr: "SENASA / MAG — Exigences sanitaires pour l'importation de chiens et chats", es: "SENASA / MAG — Requisitos sanitarios para la importación de perros y gatos", pt: "SENASA / MAG — Exigências sanitárias para a importação de cães e gatos" }
  - item: { en: "Clinical veterinary examination", fr: "Examen clinique vétérinaire", es: "Examen clínico veterinario", pt: "Exame clínico veterinário" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "The dog must be examined by a veterinarian in the country of origin within the two weeks before travel.", fr: "Le chien doit être examiné par un vétérinaire dans le pays d'origine dans les deux semaines avant le voyage.", es: "El perro debe ser examinado por un veterinario en el país de origen dentro de las dos semanas previas al viaje.", pt: "O cachorro precisa ser examinado por um veterinário no país de origem nas duas semanas anteriores à viagem." }
    exceptions: { en: "The exam underlies the official certificate; no exception is published.", fr: "L'examen fonde le certificat officiel ; aucune exception n'est publiée.", es: "El examen fundamenta el certificado oficial; no se publica ninguna excepción.", pt: "O exame é a base do certificado oficial; nenhuma exceção é publicada." }
    ref: { en: "SENASA / MAG — Sanitary requirements for importing dogs and cats", fr: "SENASA / MAG — Exigences sanitaires pour l'importation de chiens et chats", es: "SENASA / MAG — Requisitos sanitarios para la importación de perros y gatos", pt: "SENASA / MAG — Exigências sanitárias para a importação de cães e gatos" }
  - item: { en: "Official international veterinary certificate", fr: "Certificat vétérinaire international officiel", es: "Certificado veterinario internacional oficial", pt: "Certificado veterinário internacional oficial" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "An official sanitary certificate (international veterinary certificate) issued by the competent animal-health authority of the country of departure or origin, confirming the species' sanitary requirements are met, with identification and full vaccine and parasite-treatment details.", fr: "Un certificat sanitaire officiel (certificat vétérinaire international) délivré par l'autorité sanitaire compétente du pays de départ ou d'origine, confirmant le respect des exigences sanitaires de l'espèce, avec l'identification et le détail complet des vaccins et du traitement antiparasitaire.", es: "Un certificado sanitario oficial (certificado veterinario internacional) expedido por la autoridad sanitaria animal competente del país de salida o de origen, que confirme el cumplimiento de los requisitos sanitarios de la especie, con la identificación y el detalle completo de las vacunas y del tratamiento antiparasitario.", pt: "Um certificado sanitário oficial (certificado veterinário internacional) emitido pela autoridade de saúde animal competente do país de partida ou de origem, confirmando que as exigências sanitárias da espécie foram cumpridas, com a identificação e todos os detalhes das vacinas e do tratamento antiparasitário." }
    exceptions: { en: "It must be endorsed by the country's official (government) animal-health authority; documents must be valid and current at entry.", fr: "Il doit être visé par l'autorité sanitaire officielle (gouvernementale) du pays ; les documents doivent être valides et en cours de validité à l'entrée.", es: "Debe ser refrendado por la autoridad sanitaria animal oficial (gubernamental) del país; los documentos deben ser válidos y estar vigentes en la entrada.", pt: "Ele precisa ser visado pela autoridade de saúde animal oficial (governamental) do país; os documentos precisam estar válidos e em dia na entrada." }
    ref: { en: "SENASA / MAG — Sanitary requirements for importing dogs and cats", fr: "SENASA / MAG — Exigences sanitaires pour l'importation de chiens et chats", es: "SENASA / MAG — Requisitos sanitarios para la importación de perros y gatos", pt: "SENASA / MAG — Exigências sanitárias para a importação de cães e gatos" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not required for entry", fr: "Non requis pour l'entrée", es: "No obligatoria para la entrada", pt: "Não obrigatório para a entrada" }
    when: { en: "Costa Rica does not require a rabies antibody test to import a dog.", fr: "Le Costa Rica n'exige pas de titrage des anticorps antirabiques pour importer un chien.", es: "Costa Rica no exige una prueba de titulación de rabia para importar un perro.", pt: "A Costa Rica não exige teste sorológico antirrábico (titulação) para importar um cachorro." }
    exceptions: { en: "Only relevant for dogs coming from countries that require a rabies antibody test and will later return to that country of origin: the owner should carry that document for the subsequent export procedure.", fr: "Pertinent uniquement pour les chiens venant de pays qui exigent un titrage des anticorps antirabiques et qui repartiront ensuite vers ce pays d'origine : le propriétaire doit conserver ce document pour la démarche d'exportation ultérieure.", es: "Solo relevante para los perros procedentes de países que exigen una prueba de titulación de rabia y que luego regresarán a ese país de origen: el dueño debe conservar ese documento para el posterior trámite de exportación.", pt: "Só é relevante para cachorros vindos de países que exigem teste sorológico antirrábico e que depois vão voltar a esse país de origem: o dono deve levar esse documento para o procedimento de exportação posterior." }
    ref: { en: "SENASA / MAG — Sanitary requirements for importing dogs and cats", fr: "SENASA / MAG — Exigences sanitaires pour l'importation de chiens et chats", es: "SENASA / MAG — Requisitos sanitarios para la importación de perros y gatos", pt: "SENASA / MAG — Exigências sanitárias para a importação de cães e gatos" }
  - item: { en: "Prior import permit (cargo)", fr: "Permis d'importation préalable (fret)", es: "Permiso de importación previo (carga)", pt: "Autorização de importação prévia (carga)" }
    required: { en: "Only if shipped as cargo", fr: "Uniquement en cas d'expédition comme fret", es: "Solo si se envía como carga", pt: "Só se enviado como carga" }
    when: { en: "To import a pet declared as cargo (unaccompanied), in addition to all the requirements above, a prior import permit must be arranged through a customs agency.", fr: "Pour importer un animal déclaré comme fret (non accompagné), en plus de toutes les exigences ci-dessus, un permis d'importation préalable doit être obtenu via une agence en douane.", es: "Para importar una mascota declarada como carga (no acompañada), además de todos los requisitos anteriores, hay que gestionar un permiso de importación previo a través de una agencia aduanal.", pt: "Para importar um animal de estimação declarado como carga (desacompanhado), além de todas as exigências acima, é preciso obter uma autorização de importação prévia por meio de uma agência aduaneira." }
    exceptions: { en: "Not required for a personal pet travelling with its owner.", fr: "Non requis pour un animal de compagnie voyageant avec son propriétaire.", es: "No obligatorio para una mascota personal que viaja con su dueño.", pt: "Não é obrigatória para um animal de estimação pessoal que viaja com o dono." }
    ref: { en: "SENASA / MAG — Sanitary requirements for importing dogs and cats", fr: "SENASA / MAG — Exigences sanitaires pour l'importation de chiens et chats", es: "SENASA / MAG — Requisitos sanitarios para la importación de perros y gatos", pt: "SENASA / MAG — Exigências sanitárias para a importação de cães e gatos" }
  - item: { en: "Inspection on arrival", fr: "Inspection à l'arrivée", es: "Inspección a la llegada", pt: "Inspeção na chegada" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "SENASA checks the animal and its documents on arrival; the dog is released if the sanitary requirements are met.", fr: "Le SENASA contrôle l'animal et ses documents à l'arrivée ; le chien est libéré si les exigences sanitaires sont satisfaites.", es: "El SENASA revisa al animal y sus documentos a la llegada; el perro es liberado si se cumplen los requisitos sanitarios.", pt: "O SENASA confere o animal e os documentos dele na chegada; o cachorro é liberado se as exigências sanitárias forem cumpridas." }
    exceptions: { en: "If requirements are not met, entry is denied and the pet is returned to the country of origin as a sanitary measure.", fr: "Si les exigences ne sont pas satisfaites, l'entrée est refusée et l'animal est renvoyé au pays d'origine comme mesure sanitaire.", es: "Si no se cumplen los requisitos, se deniega la entrada y la mascota es devuelta al país de origen como medida sanitaria.", pt: "Se as exigências não forem cumpridas, a entrada é negada e o animal é devolvido ao país de origem como medida sanitária." }
    ref: { en: "SENASA / MAG — Sanitary requirements for importing dogs and cats", fr: "SENASA / MAG — Exigences sanitaires pour l'importation de chiens et chats", es: "SENASA / MAG — Requisitos sanitarios para la importación de perros y gatos", pt: "SENASA / MAG — Exigências sanitárias para a importação de cães e gatos" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "None", fr: "Aucune", es: "Ninguna", pt: "Nenhuma" }
    when: { en: "There is no routine quarantine for a compliant dog.", fr: "Aucune quarantaine de routine pour un chien conforme.", es: "No hay cuarentena rutinaria para un perro que cumple los requisitos.", pt: "Não há quarentena de rotina para um cachorro em conformidade." }
    exceptions: { en: "A non-compliant animal is not quarantined but refused entry and returned to the country of origin.", fr: "Un animal non conforme n'est pas mis en quarantaine mais refoulé et renvoyé au pays d'origine.", es: "Un animal no conforme no se pone en cuarentena, sino que se le deniega la entrada y se le devuelve al país de origen.", pt: "Um animal fora das exigências não fica em quarentena: a entrada é recusada e ele é devolvido ao país de origem." }
    ref: { en: "SENASA / MAG — Sanitary requirements for importing dogs and cats", fr: "SENASA / MAG — Exigences sanitaires pour l'importation de chiens et chats", es: "SENASA / MAG — Requisitos sanitarios para la importación de perros y gatos", pt: "SENASA / MAG — Exigências sanitárias para a importação de cães e gatos" }

origin:
  scheme: own
  eu:
    from: any
    title: { en: "Standard — a pet travelling with its owner", fr: "Standard — un animal voyageant avec son propriétaire", es: "Estándar — una mascota que viaja con su dueño", pt: "Padrão — um animal de companhia viajando com o dono" }
    body:
      en: "A dog accompanying its owner needs a clinical exam by a vet in the country of origin within two weeks of travel, an official international veterinary certificate endorsed by that country's animal-health authority, a microchip declared on the certificate, a valid rabies vaccination (if over three months), the core canine vaccines, and internal/external parasite treatment within 15 days of arrival. No prior import permit is needed. On arrival SENASA checks the animal and papers and releases it if everything is in order — no quarantine and no rabies antibody test."
      fr: "Un chien accompagnant son propriétaire a besoin d'un examen clinique par un vétérinaire du pays d'origine dans les deux semaines avant le voyage, d'un certificat vétérinaire international officiel visé par l'autorité sanitaire de ce pays, d'une puce déclarée sur le certificat, d'une vaccination antirabique valide (si plus de trois mois), des vaccins canins de base et d'un traitement antiparasitaire interne/externe dans les 15 jours avant l'arrivée. Aucun permis d'import préalable n'est requis. À l'arrivée, le SENASA contrôle l'animal et les documents et le libère si tout est en règle — sans quarantaine ni titrage des anticorps antirabiques."
      es: "Un perro que acompaña a su dueño necesita un examen clínico realizado por un veterinario del país de origen dentro de las dos semanas previas al viaje, un certificado veterinario internacional oficial refrendado por la autoridad sanitaria animal de ese país, un microchip declarado en el certificado, una vacunación antirrábica válida (si tiene más de tres meses), las vacunas caninas básicas y un tratamiento contra parásitos internos/externos dentro de los 15 días previos a la llegada. No se necesita permiso de importación previo. A la llegada, el SENASA revisa al animal y los documentos y lo libera si todo está en regla — sin cuarentena ni prueba de titulación de rabia."
      pt: "Um cachorro que acompanha o dono precisa de um exame clínico feito por um veterinário no país de origem nas duas semanas anteriores à viagem, de um certificado veterinário internacional oficial visado pela autoridade de saúde animal desse país, de um microchip declarado no certificado, de vacinação antirrábica válida (se tiver mais de três meses), das vacinas caninas essenciais e de tratamento antiparasitário interno/externo nos 15 dias anteriores à chegada. Não é preciso autorização de importação prévia. Na chegada, o SENASA confere o animal e os documentos e o libera se estiver tudo em ordem — sem quarentena e sem teste sorológico antirrábico."
    cls: ok
  listed:
    title: { en: "Puppies and first-time vaccination", fr: "Chiots et primo-vaccination", es: "Cachorros y primovacunación", pt: "Filhotes e primeira vacinação" }
    body:
      en: "Rabies vaccination is required only for dogs over three months of age, so a puppy cannot be vaccinated against rabies before that age, and the vaccine must be valid at the time of entry. The core canine vaccines (distemper, hepatitis, parvovirus, leptospirosis) are given according to the dog's age. SENASA does not publish a single minimum entry age, nor a fixed waiting period between the rabies shot and travel — confirm the exact timing and whether a very young puppy may travel with your vet and with SENASA before booking."
      fr: "La vaccination antirabique n'est exigée que pour les chiens de plus de trois mois ; un chiot ne peut donc être vacciné contre la rage avant cet âge, et le vaccin doit être valide au moment de l'entrée. Les vaccins canins de base (maladie de Carré, hépatite, parvovirose, leptospirose) sont administrés selon l'âge du chien. Le SENASA ne publie ni âge minimum d'entrée unique, ni délai fixe entre la vaccination antirabique et le voyage — confirme le calendrier exact et la possibilité de voyager pour un très jeune chiot avec ton vétérinaire et le SENASA avant de réserver."
      es: "La vacunación antirrábica solo se exige para los perros mayores de tres meses, por lo que un cachorro no puede vacunarse contra la rabia antes de esa edad, y la vacuna debe estar vigente en el momento de la entrada. Las vacunas caninas básicas (moquillo, hepatitis, parvovirus, leptospirosis) se aplican según la edad del perro. El SENASA no publica una edad mínima de entrada única ni un periodo de espera fijo entre la vacuna antirrábica y el viaje — confirma los plazos exactos y si un cachorro muy joven puede viajar con tu veterinario y con el SENASA antes de reservar."
      pt: "A vacinação antirrábica só é obrigatória para cachorros com mais de três meses de idade, ou seja, um filhote não pode ser vacinado contra a raiva antes dessa idade, e a vacina precisa estar válida no momento da entrada. As vacinas caninas essenciais (cinomose, hepatite, parvovirose, leptospirose) são aplicadas conforme a idade do cachorro. O SENASA não publica uma idade mínima única de entrada nem um prazo fixo de espera entre a dose antirrábica e a viagem — confirme os prazos exatos e se um filhote muito novo pode viajar com seu veterinário e com o SENASA antes de reservar."
    cls: warn
  nonListed:
    title: { en: "Pets shipped as cargo (unaccompanied)", fr: "Animaux expédiés comme fret (non accompagnés)", es: "Mascotas enviadas como carga (no acompañadas)", pt: "Animais de estimação enviados como carga (desacompanhados)" }
    body:
      en: "A dog imported as cargo (not travelling in the cabin or hold with its owner) must meet all the sanitary requirements above and, in addition, a prior import permit must be arranged through a customs agency before shipping. This is the only case in which an advance import permit is required; a personal pet accompanying its owner does not need one. Plan extra lead time for the customs paperwork."
      fr: "Un chien importé comme fret (ne voyageant pas en cabine ou en soute avec son propriétaire) doit satisfaire à toutes les exigences sanitaires ci-dessus et, de plus, un permis d'importation préalable doit être obtenu via une agence en douane avant l'expédition. C'est le seul cas où un permis d'importation anticipé est requis ; un animal de compagnie accompagnant son propriétaire n'en a pas besoin. Prévois un délai supplémentaire pour les formalités douanières."
      es: "Un perro importado como carga (que no viaja en cabina o en bodega con su dueño) debe cumplir todos los requisitos sanitarios anteriores y, además, hay que gestionar un permiso de importación previo a través de una agencia aduanal antes del envío. Este es el único caso en el que se exige un permiso de importación anticipado; una mascota personal que acompaña a su dueño no lo necesita. Prevé más tiempo de antelación para los trámites aduaneros."
      pt: "Um cachorro importado como carga (que não viaja na cabine nem no porão com o dono) precisa cumprir todas as exigências sanitárias acima e, além disso, é preciso obter uma autorização de importação prévia por meio de uma agência aduaneira antes do embarque. Esse é o único caso em que se exige uma autorização de importação antecipada; um animal de estimação pessoal que acompanha o dono não precisa dela. Conte com um prazo extra para a papelada aduaneira."
    cls: warn

arrival:
  intro:
    en: "What happens when your dog reaches Costa Rica depends on whether its documents are complete."
    fr: "Ce qui se passe à l'arrivée de ton chien au Costa Rica dépend de la complétude de ses documents."
    es: "Lo que ocurre cuando tu perro llega a Costa Rica depende de si sus documentos están completos."
    pt: "O que acontece quando seu cachorro chega à Costa Rica depende de os documentos dele estarem ou não completos."
  points:
    - en: "SENASA inspects the animal and its documents on arrival at the point of entry."
      fr: "Le SENASA inspecte l'animal et ses documents à l'arrivée au point d'entrée."
      es: "El SENASA inspecciona al animal y sus documentos a la llegada al punto de entrada."
      pt: "O SENASA inspeciona o animal e os documentos dele na chegada ao ponto de entrada."
    - en: "If the official certificate, identification, vaccinations and parasite treatment are all in order, the dog is released with no quarantine."
      fr: "Si le certificat officiel, l'identification, les vaccinations et le traitement antiparasitaire sont en règle, le chien est libéré sans quarantaine."
      es: "Si el certificado oficial, la identificación, las vacunas y el tratamiento antiparasitario están en regla, el perro es liberado sin cuarentena."
      pt: "Se o certificado oficial, a identificação, as vacinas e o tratamento antiparasitário estiverem todos em ordem, o cachorro é liberado sem quarentena."
    - en: "If the sanitary requirements are not met, entry is denied and the pet is returned to the country of origin as a sanitary measure."
      fr: "Si les exigences sanitaires ne sont pas satisfaites, l'entrée est refusée et l'animal est renvoyé au pays d'origine comme mesure sanitaire."
      es: "Si no se cumplen los requisitos sanitarios, se deniega la entrada y la mascota es devuelta al país de origen como medida sanitaria."
      pt: "Se as exigências sanitárias não forem cumpridas, a entrada é negada e o animal é devolvido ao país de origem como medida sanitária."
    - en: "Carry the original endorsed certificate and the vaccination record; the microchip number on the certificate must match the dog."
      fr: "Munis-toi du certificat original visé et du carnet de vaccination ; le numéro de puce figurant sur le certificat doit correspondre au chien."
      es: "Lleva el certificado original refrendado y el carné de vacunación; el número de microchip del certificado debe corresponder al perro."
      pt: "Leve o certificado visado original e a carteira de vacinação; o número do microchip que consta no certificado precisa corresponder ao cachorro."
    - en: "For a pet declared as cargo, the prior import permit obtained through a customs agency must also be presented."
      fr: "Pour un animal déclaré comme fret, le permis d'importation préalable obtenu via une agence en douane doit également être présenté."
      es: "Para una mascota declarada como carga, también debe presentarse el permiso de importación previo obtenido a través de una agencia aduanal."
      pt: "No caso de um animal declarado como carga, também é preciso apresentar a autorização de importação prévia obtida por meio de uma agência aduaneira."
    - en: "Airlines have their own crate, breed and booking rules — confirm them separately before you fly."
      fr: "Les compagnies ont leurs propres règles de caisse, de race et de réservation — vérifie-les séparément avant de voler."
      es: "Las aerolíneas tienen sus propias normas de jaula, raza y reserva — confírmalas por separado antes de volar."
      pt: "As companhias aéreas têm as próprias regras de caixa de transporte, raça e reserva — confirme-as separadamente antes de voar."

