# Country Entry Guide — Malaysia (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_my
iso2: "MY"
name: { en: "Malaysia", fr: "Malaisie", es: "Malasia", pt: "Malásia" }
region: { en: "Asia", fr: "Asie", es: "Asia", pt: "Ásia" }


regime: listed
domestic:
  intro:
    en: "Domestic flight in Malaysia: flying to Sabah or Sarawak is legally an import, with permit, titer and quarantine."
    fr: "Vol intérieur en Malaisie : rejoindre Sabah ou Sarawak constitue juridiquement une importation, avec permis, titrage et quarantaine."
    es: "Vuelo nacional en Malasia: volar a Sabah o Sarawak es jurídicamente una importación, con permiso, titulación y cuarentena."
    pt: "Voo doméstico na Malásia: voar para Sabah ou Sarawak é legalmente uma importação, com autorização, titulação e quarentena."
  points:
    - en: "Sabah and Sarawak run their own animal-health legislation and treat a dog from Peninsular Malaysia as an imported animal."
      fr: "Sabah et Sarawak appliquent leur propre législation sanitaire et traitent un chien venant de Malaisie péninsulaire comme un animal importé."
      es: "Sabah y Sarawak aplican su propia legislación sanitaria y tratan a un perro procedente de Malasia peninsular como un animal importado."
      pt: "Sabah e Sarawak aplicam sua própria legislação de saúde animal e tratam um cachorro vindo da Malásia Peninsular como um animal importado."
    - en: "Airlines take pets in the hold rather than the cabin, and at least one Malaysian carrier refuses animals entirely."
      fr: "Les compagnies acceptent les animaux en soute plutôt qu'en cabine, et au moins une compagnie malaisienne les refuse totalement."
      es: "Las aerolíneas aceptan mascotas en bodega más que en cabina, y al menos una aerolínea malasia las rechaza por completo."
      pt: "As companhias aéreas levam animais de estimação no porão, e não na cabine, e pelo menos uma companhia aérea malaia recusa animais por completo."
  territories:
    - name: { en: "Sabah", fr: "Sabah", es: "Sabah", pt: "Sabah" }
      note:
        en: "An import licence from the state veterinary service is mandatory, with rabies vaccination between 6 months and 1 year old, a rabies antibody titer of at least 0.5 IU/ml, a microchip, and a minimum 14-day quarantine — extended to 60 days if the titer is missing."
        fr: "Une licence d'importation du service vétérinaire de l'État est obligatoire, avec vaccination antirabique datant de 6 mois à 1 an, un titrage antirabique d'au moins 0,5 UI/ml, une puce, et une quarantaine minimale de 14 jours — portée à 60 jours en l'absence de titrage."
        es: "Se exige una licencia de importación del servicio veterinario estatal, con vacuna antirrábica de entre 6 meses y 1 año, titulación antirrábica de al menos 0,5 UI/ml, microchip y cuarentena mínima de 14 días — ampliada a 60 días si falta la titulación."
        pt: "Uma licença de importação do serviço veterinário estadual é obrigatória, com vacinação antirrábica entre 6 meses e 1 ano de idade, um teste sorológico antirrábico (titulação) de pelo menos 0,5 UI/ml, um microchip e uma quarentena mínima de 14 dias — estendida para 60 dias se a titulação estiver ausente."
      url: https://vet.sabah.gov.my/import
    - name: { en: "Sarawak", fr: "Sarawak", es: "Sarawak", pt: "Sarawak" }
      note:
        en: "An import permit is required, the dog must be at least 3 months old and microchipped, with a health certificate within 7 days. Quarantine is 14 days, but can be waived entirely if the rabies titer exceeds 0.5 IU/ml."
        fr: "Un permis d'importation est exigé, le chien doit avoir au moins 3 mois et être pucé, avec un certificat sanitaire de moins de 7 jours. La quarantaine est de 14 jours, mais peut être totalement levée si le titrage antirabique dépasse 0,5 UI/ml."
        es: "Se exige permiso de importación, el perro debe tener al menos 3 meses y microchip, con certificado sanitario de menos de 7 días. La cuarentena es de 14 días, pero puede eliminarse por completo si la titulación antirrábica supera 0,5 UI/ml."
        pt: "Uma autorização de importação é obrigatória, o cachorro precisa ter pelo menos 3 meses de idade e microchip, com um atestado de saúde emitido dentro de 7 dias. A quarentena é de 14 dias, mas pode ser totalmente dispensada se a titulação antirrábica for superior a 0,5 UI/ml."
      url: https://dvs.sarawak.gov.my/web/subpage/download_list/
exit:
  authority: DVS
  authorityUrl: https://www.dvs.gov.my/
  intro:
    en: "Malaysia is a listed country, so no rabies titer is needed to return to the EU — the Department of Veterinary Services (DVS) issues the export veterinary health certificate."
    fr: "La Malaisie est un pays listé : pas de titrage pour rentrer dans l'UE — le Département des services vétérinaires (DVS) délivre le certificat sanitaire vétérinaire d'export."
    es: "Malasia es un país listado: no hace falta titulación para volver a la UE — el Departamento de Servicios Veterinarios (DVS) emite el certificado sanitario veterinario de exportación."
    pt: "A Malásia é um país listado, portanto nenhuma titulação antirrábica é necessária para retornar à UE — o Department of Veterinary Services (DVS) emite o atestado de saúde veterinário de exportação."
  steps:
    - timing: window
      text:
        en: "Apply for the veterinary health certificate and export permit online through the DVS e-Permit / MAQIS system; DVS advises applying at least a week before travel (permit valid 30 days)."
        fr: "Demande le certificat sanitaire vétérinaire et le permis d'export en ligne via le système e-Permit / MAQIS du DVS ; le DVS conseille de s'y prendre au moins une semaine avant (permis valable 30 jours)."
        es: "Solicita el certificado sanitario veterinario y el permiso de exportación en línea a través del sistema e-Permit / MAQIS del DVS; el DVS recomienda hacerlo al menos una semana antes (permiso válido 30 días)."
        pt: "Solicite o atestado de saúde veterinário e a autorização de exportação on-line pelo sistema e-Permit do DVS / MAQIS; o DVS recomenda solicitar pelo menos uma semana antes da viagem (autorização válida por 30 dias)."
  onSiteNote:
    en: "A licensed vet completes the EU health certificate; the DVS endorsement is the official step — allow a few working days."
    fr: "Un vétérinaire agréé remplit le certificat sanitaire UE ; l'endossement DVS est l'étape officielle — prévois quelques jours ouvrés."
    es: "Un veterinario autorizado rellena el certificado sanitario UE; el refrendo del DVS es el paso oficial — prevé unos días hábiles."
    pt: "Um veterinário licenciado preenche o atestado de saúde da UE; o endosso do DVS é a etapa oficial — reserve alguns dias úteis."

hero:
  h1: { en: "Traveling to Malaysia with your dog", fr: "Voyager en Malaisie avec ton chien", es: "Viajar a Malasia con tu perro", pt: "Viajar para a Malásia com seu cachorro" }
  intro:
    en: >-
      Malaysia allows dogs to enter, but it runs its own national scheme — not the EU framework — and
      what you must prepare depends mainly on the country your dog is travelling from. An import permit
      from the Malaysian Quarantine and Inspection Services Department (MAQIS), an ISO microchip, a valid
      rabies vaccination and a government veterinary health certificate are the foundation for every dog.
      From a small list of rabies-free "scheduled" countries (such as the United Kingdom, Japan, Singapore
      or Australia) a healthy dog can often enter without quarantine. From other countries a rabies
      antibody test and a quarantine period apply, and certain breeds are banned outright. This guide
      explains each case so you know exactly what to prepare before you book your flight.
    fr: >-
      La Malaisie autorise l'entrée des chiens, mais elle applique son propre système national — pas le
      cadre européen — et ce qu'il faut préparer dépend surtout du pays d'où ton chien voyage. Un permis
      d'importation du Département malaisien de quarantaine et d'inspection (MAQIS), une puce ISO, une
      vaccination antirabique valide et un certificat sanitaire vétérinaire officiel constituent la base
      pour tout chien. Depuis une courte liste de pays « répertoriés » indemnes de rage (Royaume-Uni,
      Japon, Singapour, Australie…), un chien en bonne santé peut souvent entrer sans quarantaine. Depuis
      les autres pays s'appliquent un titrage antirabique et une période de quarantaine, et certaines races
      sont totalement interdites. Ce guide détaille chaque cas pour savoir exactement quoi préparer avant
      de réserver ton vol.
    es: >-
      Malasia permite la entrada de perros, pero aplica su propio sistema nacional — no el marco de la UE
      — y lo que debes preparar depende sobre todo del país desde el que viaja tu perro. Un permiso de
      importación del Departamento de Servicios de Cuarentena e Inspección de Malasia (MAQIS), un microchip
      ISO, una vacunación antirrábica válida y un certificado sanitario veterinario oficial son la base
      para todo perro. Desde una corta lista de países «listados» libres de rabia (como el Reino Unido,
      Japón, Singapur o Australia), un perro sano puede a menudo entrar sin cuarentena. Desde otros países
      se aplican una prueba de titulación de rabia y un periodo de cuarentena, y ciertas razas están
      directamente prohibidas. Esta guía explica cada caso para que sepas exactamente qué preparar antes
      de reservar tu vuelo.

    pt: "A Malásia permite a entrada de cachorros, mas aplica seu próprio esquema nacional — e não o marco da UE —, e o que você precisa preparar depende principalmente do país de onde o seu cachorro está viajando. Uma autorização de importação do Malaysian Quarantine and Inspection Services Department (MAQIS), um microchip ISO, uma vacinação antirrábica válida e um atestado de saúde veterinário do governo são a base para todo cachorro. Vindo de uma pequena lista de países \"programados\" livres de raiva (como o Reino Unido, o Japão, Singapura ou a Austrália), um cachorro saudável muitas vezes pode entrar sem quarentena. Vindo de outros países, um teste sorológico antirrábico e um período de quarentena se aplicam, e certas raças são banidas por completo. Este guia explica cada caso para você saber exatamente o que preparar antes de reservar o seu voo."
difficulty:
  level: moderate
  label: { en: "Moderate to difficult (permit + possible quarantine)", fr: "Modéré à difficile (permis + quarantaine possible)", es: "De moderado a difícil (permiso + posible cuarentena)", pt: "Moderado a difícil (autorização + possível quarentena)" }

prepTime:
  eu:
    en: "Scheduled (rabies-free) countries: allow a few weeks for the MAQIS import permit; often no quarantine if all documents are in order."
    fr: "Pays répertoriés (indemnes de rage) : compte quelques semaines pour le permis MAQIS ; souvent sans quarantaine si tous les documents sont en règle."
    es: "Países listados (libres de rabia): calcula unas semanas para el permiso de importación de MAQIS; a menudo sin cuarentena si todos los documentos están en regla."
    pt: "Países programados (livres de raiva): reserve algumas semanas para a autorização de importação do MAQIS; muitas vezes sem quarentena se todos os documentos estiverem em ordem."
  listed:
    en: "Other permitted countries: 2–4 weeks for the DVS/MAQIS permit, plus a health certificate issued within 7 days of export and a minimum 7-day quarantine on arrival."
    fr: "Autres pays autorisés : 2 à 4 semaines pour le permis DVS/MAQIS, plus un certificat sanitaire établi dans les 7 jours avant l'export et une quarantaine d'au moins 7 jours à l'arrivée."
    es: "Otros países autorizados: 2–4 semanas para el permiso del DVS/MAQIS, más un certificado sanitario expedido dentro de los 7 días previos a la exportación y una cuarentena mínima de 7 días a la llegada."
    pt: "Outros países permitidos: 2 a 4 semanas para a autorização do DVS/MAQIS, além de um atestado de saúde emitido dentro de 7 dias antes da exportação e uma quarentena mínima de 7 dias na chegada."
  nonListed:
    en: "Rabies-risk countries: several months — rabies vaccination, a rabies antibody test (≥0.5 IU/ml) and quarantine that can be extended based on risk assessment."
    fr: "Pays à risque rabique : plusieurs mois — vaccination antirabique, titrage antirabique (≥0,5 UI/ml) et quarantaine pouvant être prolongée selon l'évaluation du risque."
    es: "Países con riesgo de rabia: varios meses — vacunación antirrábica, una prueba de titulación de rabia (≥0,5 UI/ml) y una cuarentena que puede prolongarse según la evaluación del riesgo."
    pt: "Países de risco de raiva: vários meses — vacinação antirrábica, um teste sorológico antirrábico (≥0,5 UI/ml) e quarentena que pode ser estendida com base na avaliação de risco."

