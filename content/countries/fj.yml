restrictedDogs:
  intro:
    en: "Fiji prohibits the import of certain dog breeds outright, in addition to the biosecurity rules. A prohibited-breed dog cannot enter Fiji even if all other conditions are met."
    fr: "Fidji interdit purement et simplement l'importation de certaines races de chiens, en plus des règles de biosécurité. Un chien d'une race interdite ne peut entrer à Fidji même si toutes les autres conditions sont remplies."
    es: "Fiyi prohíbe rotundamente la importación de ciertas razas de perros, además de las normas de bioseguridad. Un perro de una raza prohibida no puede entrar en Fiyi aunque se cumplan todas las demás condiciones."
    pt: "Fiji proíbe totalmente a importação de determinadas raças de cachorro, além das regras de biossegurança. Um cachorro de raça proibida não pode entrar em Fiji mesmo que todas as demais condições sejam cumpridas."
  cat1:
    en: "Prohibited breeds (cannot enter Fiji): Dogo Argentino, Fila Brasileiro, Japanese Tosa, and Pit Bull Terriers — including American Pit Bull Terriers — or crosses of any of these breeds."
    fr: "Races interdites (ne peuvent entrer à Fidji) : Dogo Argentino, Fila brasileiro, Tosa japonais et Pit Bull Terriers — y compris les American Pit Bull Terriers — ou tout croisement de ces races."
    es: "Razas prohibidas (no pueden entrar en Fiyi): Dogo Argentino, Fila Brasileiro, Tosa japonés y Pit Bull Terriers — incluidos los American Pit Bull Terriers — o cruces de cualquiera de estas razas."
    pt: "Raças proibidas (não podem entrar em Fiji): Dogo Argentino, Fila Brasileiro, Tosa Japonês e Pit Bull Terriers — incluindo American Pit Bull Terriers — ou cruzamentos de qualquer uma dessas raças."
  cat2:
    en: "Emotional support or comfort dogs are not treated as service or assistance animals and are not exempt from quarantine. Only dogs trained to perform a task for a person's disability, evidenced by a recognised accredited organisation (e.g. International Guide Dog Federation or Assistance Dogs International member), qualify as service or assistance dogs."
    fr: "Les chiens de soutien émotionnel ou de réconfort ne sont pas considérés comme des animaux d'assistance ou de service et ne sont pas exemptés de quarantaine. Seuls les chiens formés pour accomplir une tâche liée au handicap d'une personne, attestés par une organisation accréditée reconnue (ex. membre de l'International Guide Dog Federation ou d'Assistance Dogs International), sont reconnus comme chiens d'assistance ou de service."
    es: "Los perros de apoyo emocional o de compañía no se consideran animales de servicio o de asistencia y no están exentos de cuarentena. Solo los perros adiestrados para realizar una tarea relacionada con la discapacidad de una persona, acreditados por una organización reconocida (p. ej. miembro de la International Guide Dog Federation o de Assistance Dogs International), se reconocen como perros de servicio o de asistencia."
    pt: "Cachorros de apoio emocional ou de conforto não são tratados como animais de serviço ou de assistência e não são isentos de quarentena. Somente cachorros treinados para realizar uma tarefa relacionada à deficiência de uma pessoa, comprovada por uma organização credenciada reconhecida (por exemplo, a International Guide Dog Federation ou um membro da Assistance Dogs International), se qualificam como cães de serviço ou de assistência."
  note:
    en: "Applications to bring cats and dogs into Fiji are also assessed on a case-by-case basis, and entry may be refused depending on the animal-health status of the country of origin."
    fr: "Les demandes d'importation de chats et chiens à Fidji sont également évaluées au cas par cas, et l'entrée peut être refusée selon le statut sanitaire animal du pays d'origine."
    es: "Las solicitudes para traer gatos y perros a Fiyi también se evalúan caso por caso, y la entrada puede denegarse según el estatus sanitario animal del país de origen."
    pt: "Os pedidos para trazer gatos e cachorros para Fiji também são avaliados caso a caso, e a entrada pode ser recusada dependendo da situação sanitária animal do país de origem."

checklist:
  - en: "Confirm your dog's origin is a BAF-approved country and identify its group (A or B)"
    fr: "Vérifie que l'origine de ton chien est un pays approuvé par la BAF et identifiez son groupe (A ou B)"
    es: "Confirma que el origen de tu perro es un país aprobado por la BAF e identifica su grupo (A o B)"
    pt: "Confirme que a origem do seu cachorro é um país aprovado pela BAF e identifique o grupo dele (A ou B)"
  - en: "Confirm your dog is not a prohibited breed (Dogo Argentino, Fila Brasileiro, Japanese Tosa, Pit Bull Terrier or crosses)"
    fr: "Vérifie que ton chien n'est pas d'une race interdite (Dogo Argentino, Fila brasileiro, Tosa japonais, Pit Bull Terrier ou croisements)"
    es: "Confirma que tu perro no es de una raza prohibida (Dogo Argentino, Fila Brasileiro, Tosa japonés, Pit Bull Terrier o cruces)"
    pt: "Confirme que seu cachorro não é de uma raça proibida (Dogo Argentino, Fila Brasileiro, Tosa Japonês, Pit Bull Terrier ou cruzamentos)"
  - en: "Confirm your dog is at least 4 months old and (if female) not more than 21 days pregnant at export"
    fr: "Vérifie que ton chien a au moins 4 mois et (si femelle) n'est pas gestant de plus de 21 jours à l'export"
    es: "Confirma que tu perro tiene al menos 4 meses y (si es hembra) no más de 21 días de gestación en la exportación"
    pt: "Confirme que seu cachorro tem pelo menos 4 meses de idade e, se for fêmea, no máximo 21 dias de gestação no momento da exportação"
  - en: "Implant an ISO-compatible microchip (AVID, TROVAN, DESTRON or other ISO reader)"
    fr: "Posez une puce compatible ISO (lecteur AVID, TROVAN, DESTRON ou autre ISO)"
    es: "Implanta un microchip compatible con ISO (lector AVID, TROVAN, DESTRON u otro ISO)"
    pt: "Implante um microchip compatível com ISO (AVID, TROVAN, DESTRON ou outro leitor ISO)"
  - en: "Group B: rabies vaccination ≥30 days before export, valid until release from quarantine"
    fr: "Groupe B : vaccination antirabique ≥30 jours avant l'export, valide jusqu'à la sortie de quarantaine"
    es: "Grupo B: vacunación antirrábica ≥30 días antes de la exportación, válida hasta la salida de la cuarentena"
    pt: "Grupo B: vacinação antirrábica ≥30 dias antes da exportação, válida até a liberação da quarentena"
  - en: "Group B: rabies antibody test (RNATT/FAVN) ≥0.5 IU/ml, blood taken 180–365 days before export"
    fr: "Groupe B : titrage antirabique (RNATT/FAVN) ≥0,5 UI/ml, sang prélevé 180 à 365 jours avant l'export"
    es: "Grupo B: prueba de titulación de rabia (RNATT/FAVN) ≥0,5 UI/ml, sangre extraída 180–365 días antes de la exportación"
    pt: "Grupo B: teste sorológico antirrábico (RNATT/FAVN) ≥0,5 UI/ml, sangue coletado entre 180 e 365 dias antes da exportação"
  - en: "Apply for the BAF import permit in advance (valid 6 months; original travels with the dog)"
    fr: "Demande le permis d'importation BAF à l'avance (valable 6 mois ; l'original voyage avec le chien)"
    es: "Solicita el permiso de importación de la BAF por adelantado (válido 6 meses; el original viaja con el perro)"
    pt: "Solicite a autorização de importação da BAF com antecedência (válida por 6 meses; o original viaja com o cachorro)"
  - en: "Complete the tests and treatments listed on your permit, plus the endorsed veterinary health certificate and lab results"
    fr: "Réalise les tests et traitements listés sur ton permis, ainsi que le certificat sanitaire vétérinaire visé et les résultats de laboratoire"
    es: "Realiza las pruebas y tratamientos indicados en tu permiso, además del certificado sanitario veterinario refrendado y los resultados de laboratorio"
    pt: "Complete os exames e tratamentos listados na sua autorização, além do atestado de saúde veterinário endossado e dos resultados laboratoriais"
  - en: "Book PEQ quarantine (Koronivia) 6–8 weeks ahead; fly a direct route in an travel crate with seals intact"
    fr: "Réserve la quarantaine PEQ (Koronivia) 6 à 8 semaines à l'avance ; voyage par route directe dans une caisse de transport aux scellés intacts"
    es: "Reserva la cuarentena PEQ (Koronivia) con 6–8 semanas de antelación; vuela por una ruta directa en una jaula de transporte con los precintos intactos"
    pt: "Reserve a quarentena na PEQ (Koronivia) com 6 a 8 semanas de antecedência; voe por rota direta em uma caixa de transporte com os lacres intactos"

