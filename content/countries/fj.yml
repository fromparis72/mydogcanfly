# Country Entry Guide — Fiji (source of truth, bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_fj
iso2: "FJ"
name: { en: "Fiji", fr: "Fidji", es: "Fiyi", pt: "Fiji" }
region: { en: "Oceania", fr: "Océanie", es: "Oceanía", pt: "Oceania" }


regime: listed

hero:
  h1: { en: "Traveling to Fiji with your dog", fr: "Voyager à Fidji avec ton chien", es: "Viajar a Fiyi con tu perro", pt: "Viajando para Fiji com seu cachorro" }
  intro:
    en: >-
      Fiji welcomes dogs, but as a rabies-free island nation it runs strict biosecurity controls set by
      the Biosecurity Authority of Fiji (BAF) under the Biosecurity Act 2008. Your dog can only be
      imported directly from a BAF-approved country, must hold a BAF import permit obtained in advance,
      and must complete a mandatory quarantine at BAF's Post Entry Quarantine (PEQ) station in Koronivia,
      Nausori — home quarantine is not allowed. What you prepare depends heavily on where your dog is
      coming from: approved countries are split into Group A (rabies-free) and Group B (rabies present but
      controlled), and a dog from a country on neither list cannot be imported directly at all. Dogs from
      Group B must also be vaccinated against rabies and pass a rabies antibody test. This guide explains
      each pathway so you know exactly what to prepare before you book.
    fr: >-
      Fidji accueille les chiens, mais en tant qu'île indemne de rage, le pays applique des contrôles de
      biosécurité stricts fixés par la Biosecurity Authority of Fiji (BAF) au titre du Biosecurity Act
      2008. Ton chien ne peut être importé que directement depuis un pays approuvé par la BAF, doit
      disposer d'un permis d'importation BAF obtenu à l'avance, et doit effectuer une quarantaine
      obligatoire à la station de quarantaine post-entrée (PEQ) de la BAF à Koronivia, Nausori — la
      quarantaine à domicile n'est pas autorisée. Ce qu'il faut préparer dépend fortement du pays de
      provenance : les pays approuvés sont répartis en groupe A (indemnes de rage) et groupe B (rage
      présente mais maîtrisée), et un chien venant d'un pays ne figurant sur aucune des deux listes ne
      peut pas être importé directement. Les chiens du groupe B doivent en outre être vaccinés contre la
      rage et réussir un test des anticorps antirabiques. Ce guide détaille chaque parcours.
    es: >-
      Fiyi acoge a los perros, pero como nación insular libre de rabia aplica estrictos controles de
      bioseguridad fijados por la Biosecurity Authority of Fiji (BAF) en virtud del Biosecurity Act
      2008. Tu perro solo puede importarse directamente desde un país aprobado por la BAF, debe disponer
      de un permiso de importación de la BAF obtenido por adelantado, y debe completar una cuarentena
      obligatoria en la estación de cuarentena post-entrada (PEQ) de la BAF en Koronivia, Nausori — la
      cuarentena en el domicilio no está permitida. Lo que debes preparar depende en gran medida de dónde
      venga tu perro: los países aprobados se dividen en Grupo A (libres de rabia) y Grupo B (con rabia
      presente pero controlada), y un perro de un país que no figure en ninguna de las dos listas no
      puede importarse directamente en absoluto. Los perros del Grupo B deben además estar vacunados
      contra la rabia y superar una prueba de titulación de rabia. Esta guía explica cada vía para que
      sepas exactamente qué preparar antes de reservar.

    pt: "Fiji recebe cachorros, mas, por ser uma nação insular livre de raiva, aplica controles rígidos de biossegurança definidos pela Biosecurity Authority of Fiji (BAF) sob o Biosecurity Act 2008. Seu cachorro só pode ser importado diretamente de um país aprovado pela BAF, precisa ter uma autorização de importação da BAF obtida com antecedência e precisa cumprir uma quarentena obrigatória na estação de quarentena pós-entrada (PEQ) da BAF em Koronivia, Nausori — quarentena domiciliar não é permitida. O que você precisa preparar depende muito de onde o cachorro está vindo: os países aprovados são divididos em Grupo A (livre de raiva) e Grupo B (com raiva presente, mas controlada), e um cachorro de um país que não esteja em nenhuma das duas listas não pode ser importado diretamente de forma alguma. Cachorros do Grupo B também precisam ser vacinados contra a raiva e passar por um teste sorológico antirrábico. Este guia explica cada caminho para que você saiba exatamente o que preparar antes de reservar a viagem."
difficulty:
  level: difficult
  label: { en: "Difficult — permit, tests and quarantine required", fr: "Difficile — permis, tests et quarantaine exigés", es: "Difícil — se exigen permiso, pruebas y cuarentena", pt: "Difícil — exige autorização, exames e quarentena" }

prepTime:
  eu:
    en: "Group A (rabies-free countries, e.g. Australia, New Zealand and Pacific neighbours): the simplest path — import permit, ISO microchip and a minimum 7-day quarantine, but no rabies antibody test."
    fr: "Groupe A (pays indemnes de rage, ex. Australie, Nouvelle-Zélande et voisins du Pacifique) : le parcours le plus simple — permis d'importation, puce ISO et quarantaine minimale de 7 jours, mais pas de test des anticorps antirabiques."
    es: "Grupo A (países libres de rabia, p. ej. Australia, Nueva Zelanda y vecinos del Pacífico): la vía más sencilla — permiso de importación, microchip ISO y una cuarentena mínima de 7 días, pero sin prueba de titulación de rabia."
    pt: "Grupo A (países livres de raiva, por exemplo Austrália, Nova Zelândia e vizinhos do Pacífico): o caminho mais simples — autorização de importação, microchip ISO e quarentena mínima de 7 dias, mas sem teste sorológico antirrábico."
  listed:
    en: "Group B (rabies-controlled approved countries, e.g. USA, UK, EU, Canada): allow ~6+ months — rabies vaccination, a rabies antibody test taken 180–365 days before export, import permit and a minimum 30-day quarantine."
    fr: "Groupe B (pays approuvés où la rage est maîtrisée, ex. USA, Royaume-Uni, UE, Canada) : compte ~6 mois et plus — vaccination antirabique, titrage antirabique prélevé 180 à 365 jours avant l'export, permis d'importation et quarantaine minimale de 30 jours."
    es: "Grupo B (países aprobados con la rabia controlada, p. ej. EE. UU., RU, UE, Canadá): prevé ~6 meses o más — vacunación antirrábica, una prueba de titulación de rabia tomada 180–365 días antes de la exportación, permiso de importación y una cuarentena mínima de 30 días."
    pt: "Grupo B (países aprovados com raiva controlada, por exemplo EUA, Reino Unido, UE, Canadá): reserve cerca de 6 meses ou mais — vacinação antirrábica, teste sorológico antirrábico colhido entre 180 e 365 dias antes da exportação, autorização de importação e quarentena mínima de 30 dias."
  nonListed:
    en: "Non-approved country (not on Group A or B): direct import is not possible — your dog must first move to an approved country and complete a six-month residency before it can qualify."
    fr: "Pays non approuvé (ni groupe A ni groupe B) : l'importation directe est impossible — ton chien doit d'abord s'installer dans un pays approuvé et y accomplir une résidence de six mois pour devenir éligible."
    es: "País no aprobado (ni Grupo A ni Grupo B): la importación directa no es posible — tu perro debe trasladarse primero a un país aprobado y completar una residencia de seis meses antes de poder cumplir los requisitos."
    pt: "País não aprovado (que não está no Grupo A nem no B): a importação direta não é possível — seu cachorro precisa primeiro se mudar para um país aprovado e cumprir seis meses de residência antes de poder se qualificar."

