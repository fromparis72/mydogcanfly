restrictedDogs:
  intro:
    en: "Belgium has no national dangerous-breed ban and refuses no dog entry purely on its breed. Dangerous-dog rules are regional (Flanders, Wallonia, Brussels) and are often set municipality by municipality, so they vary widely — from no special rule to a local muzzle-and-lead obligation for listed breeds."
    fr: "La Belgique n'a pas d'interdiction nationale de races dangereuses et ne refuse l'entrée à aucun chien uniquement sur sa race. La réglementation des chiens dangereux est régionale (Flandre, Wallonie, Bruxelles) et souvent fixée commune par commune, elle varie donc fortement — de l'absence de règle à une obligation locale de muselière et laisse pour certaines races."
    es: "Bélgica no tiene una prohibición nacional de razas peligrosas y no rechaza la entrada de ningún perro únicamente por su raza. Las normas sobre perros peligrosos son regionales (Flandes, Valonia, Bruselas) y a menudo se fijan municipio por municipio, por lo que varían mucho — desde la ausencia de una norma especial hasta una obligación local de bozal y correa para las razas listadas."
    pt: "A Bélgica não tem proibição nacional de raças perigosas e não recusa a entrada de nenhum cachorro apenas por causa da raça. As regras sobre cachorros perigosos são regionais (Flandres, Valônia, Bruxelas) e muitas vezes definidas município a município, por isso variam muito — desde nenhuma regra específica até uma obrigação local de focinheira e guia para as raças listadas."
  cat1:
    en: "Wallonia: the Walloon Animal Welfare Code and municipal police regulations frame the matter. Many municipalities list breeds such as American Staffordshire Terrier, pit bull, Tosa, Rottweiler and Mastiff, require category-1 (attack) dogs to be declared to the town hall, and impose a muzzle and lead in public. Some communes add registration, insurance or sterilisation conditions — check the local règlement de police."
    fr: "Wallonie : le Code wallon du bien-être animal et les règlements de police communaux encadrent la matière. De nombreuses communes listent des races comme l'American Staffordshire Terrier, le pit-bull, le Tosa, le Rottweiler et le Mastiff, imposent la déclaration des chiens de catégorie 1 (chiens d'attaque) à l'administration communale, ainsi que muselière et laisse en public. Certaines communes ajoutent enregistrement, assurance ou stérilisation — vérifie le règlement de police local."
    es: "Valonia: el Código Valón de Bienestar Animal y los reglamentos de policía municipales regulan la materia. Muchos municipios listan razas como el American Staffordshire Terrier, el pit bull, el Tosa, el Rottweiler y el Mastiff, exigen que los perros de categoría 1 (de ataque) se declaren en el ayuntamiento e imponen bozal y correa en la vía pública. Algunos municipios añaden condiciones de registro, seguro o esterilización — consulta el reglamento de policía local (règlement de police)."
    pt: "Valônia: o Code wallon du Bien-être animal (Código valão do bem-estar animal) e os regulamentos municipais de polícia enquadram o tema. Muitos municípios listam raças como American Staffordshire Terrier, pit bull, Tosa, Rottweiler e Mastiff, exigem que os cachorros de categoria 1 (de ataque) sejam declarados à prefeitura e impõem focinheira e guia em espaços públicos. Algumas comunas acrescentam condições de registro, seguro ou castração — consulte o règlement de police local."
  cat2:
    en: "Flanders and Brussels: there is no region-wide breed list. Flanders relies on general animal-welfare rules plus any local municipal regulation. In the Brussels-Capital Region the rules are set commune by commune, and several communes list dangerous breeds subject to a muzzle-and-lead requirement in public. Always confirm the rule of your exact destination municipality."
    fr: "Flandre et Bruxelles : aucune liste de races à l'échelle régionale. La Flandre s'appuie sur les règles générales de bien-être animal et les éventuels règlements communaux. En Région de Bruxelles-Capitale les règles sont fixées commune par commune, et plusieurs communes listent des races dangereuses soumises à muselière et laisse en public. Vérifie toujours la règle de la commune de destination exacte."
    es: "Flandes y Bruselas: no existe una lista de razas a escala regional. Flandes se basa en las normas generales de bienestar animal y en cualquier reglamento municipal local. En la Región de Bruselas-Capital las normas se fijan municipio por municipio, y varios municipios listan razas peligrosas sujetas a la obligación de bozal y correa en la vía pública. Confirma siempre la norma del municipio exacto de destino."
    pt: "Flandres e Bruxelas: não existe lista de raças válida para toda a região. A Flandres se apoia nas regras gerais de bem-estar animal e em eventuais regulamentos municipais locais. Na Região de Bruxelas-Capital (Bruxelles-Capitale), as regras são definidas comuna a comuna, e várias comunas listam raças perigosas sujeitas à obrigação de focinheira e guia em espaços públicos. Confirme sempre a regra do município exato de destino."
  note:
    en: "Because these rules are regional and municipal, none of them blocks entry into Belgium — they govern how a listed dog is kept once there. Confirm the police regulation (règlement de police / politiereglement) of your specific destination before you travel."
    fr: "Comme ces règles sont régionales et communales, aucune ne bloque l'entrée en Belgique — elles régissent la détention d'un chien listé sur place. Vérifie le règlement de police (politiereglement) de ta destination précise avant de voyager."
    es: "Como estas normas son regionales y municipales, ninguna bloquea la entrada en Bélgica — regulan cómo se tiene un perro listado una vez allí. Confirma el reglamento de policía (règlement de police / politiereglement) de tu destino concreto antes de viajar."
    pt: "Como essas regras são regionais e municipais, nenhuma delas impede a entrada na Bélgica — elas regem como um cachorro de raça listada deve ser mantido depois de chegar. Confirme o regulamento de polícia (règlement de police / politiereglement) do seu destino específico antes de viajar."

