origin:
  scheme: eu
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate and normally no border check."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire et normalement pas de contrôle frontalier."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario y normalmente sin control fronterizo."
      pt: "Um cachorro vindo de outro país da UE precisa de um passaporte europeu que comprove um microchip ISO válido e uma vacinação antirrábica em dia. Sem teste sorológico, sem certificado sanitário e, normalmente, sem controle de fronteira."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Switzerland, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination and an EU animal health certificate endorsed by an official vet before departure. No antibody test is required; present yourself to Belgian customs on arrival at the airport."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Suisse, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire européen visé par un vétérinaire officiel avant le départ. Pas de titrage ; présente-toi à la douane belge à l'arrivée à l'aéroport."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Suiza, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal de la UE refrendado por un veterinario oficial antes de la salida. No se exige prueba de titulación; preséntate ante las aduanas belgas a la llegada al aeropuerto."
      pt: "Vindo de um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Suíça, Japão, Austrália e outros), seu cachorro precisa de microchip, vacinação antirrábica válida e um certificado sanitário europeu endossado por um veterinário oficial antes da partida. Não é exigido teste sorológico; apresente-se à alfândega belga na chegada ao aeroporto."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-designated laboratory, then a compulsory 3-month wait before entry. An endorsed EU animal health certificate is also required."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen visé est également requis."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exige un certificado sanitario animal de la UE refrendado."
      pt: "Vindo de um país não listado (de risco), acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório designado pela UE, e depois 3 meses obrigatórios de espera antes da entrada. Também é exigido um certificado sanitário europeu endossado."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Belgium depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien en Belgique dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Bélgica depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega à Bélgica depende de onde você embarcou."
  points:
    - from: eu
      en: "From another EU country: no systematic border check — keep the EU pet passport with you."
      fr: "Depuis un autre pays de l'UE : pas de contrôle systématique — garde le passeport européen sur toi."
      es: "Desde otro país de la UE: sin control fronterizo sistemático — lleva contigo el pasaporte europeo."
      pt: "De outro país da UE: sem controle de fronteira sistemático — leve o passaporte europeu com você."
    - from: non_eu
      en: "From outside the EU: on arrival at the airport, present yourself spontaneously to Belgian customs for the documentary and identity check."
      fr: "Depuis hors UE : à l'arrivée à l'aéroport, présente-toi spontanément à la douane belge pour le contrôle documentaire et d'identité."
      es: "Desde fuera de la UE: a la llegada al aeropuerto, preséntate espontáneamente ante las aduanas belgas para el control documental y de identidad."
      pt: "De fora da UE: na chegada ao aeroporto, apresente-se espontaneamente à alfândega belga para o controle documental e de identidade."
    - en: "No import permit is issued and no prior appointment is needed for a non-commercial pet."
      fr: "Aucun permis d'import n'est délivré et aucun rendez-vous préalable n'est nécessaire pour un animal non commercial."
      es: "No se expide ningún permiso de importación ni se necesita cita previa para una mascota no comercial."
      pt: "Não é emitida nenhuma autorização de importação e não é preciso agendamento prévio para um animal de estimação não comercial."
    - en: "A dog imported from a non-EU country and staying at least 6 months must be registered in the central DogID database within 8 days of arrival."
      fr: "Un chien importé d'un pays hors UE et séjournant au moins 6 mois doit être enregistré dans la base centrale DogID dans les 8 jours suivant l'arrivée."
      es: "Un perro importado de un país de fuera de la UE y que permanezca al menos 6 meses debe registrarse en la base de datos central DogID en un plazo de 8 días desde la llegada."
      pt: "Um cachorro importado de um país fora da UE que permaneça pelo menos 6 meses precisa ser registrado na base de dados central DogID em até 8 dias após a chegada."
    - en: "Carry original documents (not copies). Belgium has three official languages, so documents in French, Dutch or German — or officially translated — are accepted."
      fr: "Munis-toi des documents originaux (pas de copies). La Belgique a trois langues officielles : les documents en français, néerlandais ou allemand — ou traduits officiellement — sont acceptés."
      es: "Lleva los documentos originales (no copias). Bélgica tiene tres lenguas oficiales, por lo que se aceptan los documentos en francés, neerlandés o alemán — o traducidos oficialmente."
      pt: "Leve os documentos originais (não cópias). A Bélgica tem três línguas oficiais, então são aceitos documentos em francês, neerlandês ou alemão — ou com tradução oficial."
    - en: "If documents are missing or invalid, customs may order re-export, quarantine or, in the worst case, euthanasia — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, la douane peut ordonner réexpédition, quarantaine ou, au pire, euthanasie — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, las aduanas pueden ordenar la reexpedición, la cuarentena o, en el peor de los casos, la eutanasia — a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, a alfândega pode determinar a reexportação, a quarentena ou, na pior das hipóteses, a eutanásia — às custas do dono."

