# Country Entry Guide — Norway (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_no
iso2: "NO"
name: { en: "Norway", fr: "Norvège", es: "Noruega", pt: "Noruega" }
region: { en: "Europe (EEA, non-EU)", fr: "Europe (EEE, hors UE)", es: "Europa (EEE, fuera de la UE)", pt: "Europa (EEE, fora da UE)" }


regime: eu

hero:
  h1: { en: "Traveling to Norway with your dog", fr: "Voyager en Norvège avec ton chien", es: "Viajar a Noruega con tu perro", pt: "Viajar para a Noruega com seu cachorro" }
  intro:
    en: >-
      Norway welcomes dogs, but what you need to prepare depends mainly on the country your dog is
      travelling from — not only on Norway itself. Norway is not in the EU: it is part of the EEA and
      applies the EU pet-movement rules, with a few national additions. An ISO microchip and a valid
      rabies vaccination are always required. A crucial extra step is the compulsory tapeworm
      (Echinococcus) treatment by a vet before arrival — Norway is one of the few countries that still
      demands it. A dog from an EEA or listed country needs no rabies blood test; a dog from a
      non-listed country must also pass a rabies antibody test with a three-month wait. On arrival you
      must declare your dog to Norwegian customs. This guide explains each case before you book.
    fr: >-
      La Norvège accueille les chiens, mais ce qu'il faut préparer dépend surtout du pays d'où ton
      chien voyage — pas seulement de la Norvège. La Norvège n'est pas dans l'UE : elle fait partie de
      l'EEE et applique les règles européennes de mouvement des animaux, avec quelques ajouts nationaux.
      Une puce ISO et une vaccination antirabique valide sont toujours exigées. Une étape supplémentaire
      essentielle est le traitement obligatoire contre l'échinococcose (ténia) par un vétérinaire avant
      l'arrivée — la Norvège est l'un des rares pays à l'exiger encore. Un chien venant d'un pays de
      l'EEE ou d'un pays listé n'a pas besoin de prise de sang antirabique ; un chien d'un pays non
      listé doit aussi passer un titrage antirabique avec un délai de trois mois. À l'arrivée, tu
      devez déclarer ton chien à la douane norvégienne. Ce guide détaille chaque cas avant de réserver.
    es: >-
      Noruega acoge a los perros, pero lo que debes preparar depende sobre todo del país desde el que
      viaja tu perro — no solo de Noruega. Noruega no está en la UE: forma parte del EEE y aplica las
      normas europeas de movimiento de animales de compañía, con algunos añadidos nacionales. Siempre se
      exigen un microchip ISO y una vacunación antirrábica válida. Un paso adicional crucial es el
      tratamiento obligatorio contra la tenia (Echinococcus) administrado por un veterinario antes de la
      llegada — Noruega es uno de los pocos países que aún lo exige. Un perro procedente de un país del
      EEE o de un país listado no necesita ninguna prueba de sangre para la rabia; un perro de un país
      no listado debe además superar una prueba de titulación de rabia con una espera de tres meses. A la
      llegada debes declarar tu perro a las aduanas noruegas. Esta guía explica cada caso antes de que
      reserves.

    pt: "A Noruega recebe bem os cachorros, mas o que você precisa preparar depende principalmente do país de onde seu cachorro parte — e não só da Noruega em si. A Noruega não está na UE: ela faz parte do EEE e aplica as regras europeias de circulação de animais de estimação, com alguns acréscimos nacionais. Microchip ISO e vacinação antirrábica válida são sempre obrigatórios. Uma etapa a mais, fundamental, é o tratamento obrigatório contra a tênia (Echinococcus) aplicado por um veterinário antes da chegada — a Noruega é um dos poucos países que ainda o exigem. Um cachorro vindo do EEE ou de um país listado não precisa de exame de sangue para raiva; um cachorro vindo de um país não listado precisa também passar no teste sorológico antirrábico, com três meses de espera. Na chegada, você tem que declarar seu cachorro à alfândega norueguesa. Este guia explica cada caso antes de você comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Moderate to difficult (tapeworm treatment always required)", fr: "Modéré à difficile (traitement antiténia toujours requis)", es: "De moderada a difícil (tratamiento contra la tenia siempre obligatorio)", pt: "De moderada a difícil (tratamento contra a tênia sempre obrigatório)" }

prepTime:
  eu:
    en: "A few days if the passport is up to date, up to ~3 weeks if the first rabies shot is still needed — plus a vet tapeworm treatment 24–120 hours before arrival."
    fr: "Quelques jours si le passeport est à jour, jusqu'à ~3 semaines si la première vaccination reste à faire — plus un traitement antiténia chez le vétérinaire 24 à 120 heures avant l'arrivée."
    es: "Unos días si el pasaporte está al día, hasta ~3 semanas si aún falta la primera vacuna antirrábica — más un tratamiento contra la tenia por un veterinario 24–120 horas antes de la llegada."
    pt: "Alguns dias se o passaporte estiver em dia, até cerca de 3 semanas se ainda faltar a primeira dose da vacina antirrábica — mais um tratamento contra a tênia aplicado por um veterinário de 24 a 120 horas antes da chegada."
  listed:
    en: "~3–4 weeks: 21-day wait after the rabies shot, an EU health certificate, and the tapeworm treatment 24–120 hours before entry."
    fr: "~3–4 semaines : délai de 21 jours après le vaccin, un certificat sanitaire UE, et le traitement antiténia 24 à 120 heures avant l'entrée."
    es: "~3–4 semanas: espera de 21 días tras la vacuna antirrábica, un certificado sanitario de la UE y el tratamiento contra la tenia 24–120 horas antes de la entrada."
    pt: "Cerca de 3 a 4 semanas: 21 dias de espera depois da vacina antirrábica, um certificado sanitário europeu e o tratamento contra a tênia de 24 a 120 horas antes da entrada."
  nonListed:
    en: "~4–7 months: antibody test at least 30 days after vaccination and ≥3 months before entry, plus the tapeworm treatment 24–120 hours before arrival."
    fr: "~4–7 mois : titrage au moins 30 jours après le vaccin et ≥3 mois avant l'entrée, plus le traitement antiténia 24 à 120 heures avant l'arrivée."
    es: "~4–7 meses: prueba de titulación al menos 30 días después de la vacuna y ≥3 meses antes de la entrada, más el tratamiento contra la tenia 24–120 horas antes de la llegada."
    pt: "Cerca de 4 a 7 meses: teste sorológico no mínimo 30 dias depois da vacinação e ≥3 meses antes da entrada, mais o tratamento contra a tênia de 24 a 120 horas antes da chegada."

