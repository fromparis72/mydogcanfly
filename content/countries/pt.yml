origin:
  scheme: eu
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate, no advance arrival notice and normally no border check."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire, pas d'avis d'arrivée et normalement pas de contrôle frontalier."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario, sin aviso de llegada previo y normalmente sin control fronterizo."
      pt: "Um cachorro vindo de outro país da UE precisa do passaporte europeu com microchip ISO válido e vacinação antirrábica em dia. Sem teste sorológico, sem certificado sanitário, sem aviso prévio de chegada e, normalmente, sem controlo de fronteira."
    cls: ok
  listed:
    title: { en: "Health certificate + advance notice", fr: "Certificat sanitaire + avis préalable", es: "Certificado sanitario + aviso previo", pt: "Certificado sanitário e aviso prévio" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Switzerland, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination and an EU animal health certificate issued by the official authority before departure. No antibody test is required, but you must notify the Traveller Point of Entry at least 48 hours before arrival and undergo the veterinary check on entry."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Suisse, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire européen délivré par l'autorité officielle avant le départ. Pas de titrage, mais tu dois prévenir le Point d'Entrée des Voyageurs au moins 48 heures avant l'arrivée et passer le contrôle vétérinaire à l'entrée."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Suiza, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal de la UE expedido por la autoridad oficial antes de la salida. No se exige prueba de titulación, pero debes avisar al Punto de Entrada de Viajeros al menos 48 horas antes de la llegada y pasar el control veterinario a la entrada."
      pt: "Vindo de um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Suíça, Japão, Austrália e outros), seu cachorro precisa de microchip, vacinação antirrábica válida e certificado sanitário europeu emitido pela autoridade oficial antes da partida. Não é exigido teste sorológico, mas é preciso avisar o Ponto de Entrada de Viajantes com pelo menos 48 horas de antecedência e passar pelo controlo veterinário na entrada."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-designated laboratory, then a compulsory 3-month wait before entry. An endorsed EU animal health certificate and an advance arrival notice are also required."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen visé et un avis d'arrivée préalable sont également requis."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exigen un certificado sanitario animal de la UE refrendado y un aviso de llegada previo."
      pt: "Vindo de um país não listado (de risco), acrescente o teste sorológico antirrábico: coleta no mínimo 30 dias depois da vacinação, resultado igual ou superior a 0,5 UI/ml em laboratório designado pela UE, e depois 3 meses obrigatórios de espera antes da entrada. Também são exigidos o certificado sanitário europeu endossado e o aviso prévio de chegada."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Portugal depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien au Portugal dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Portugal depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega a Portugal depende de onde você partiu."
  points:
    - from: eu
      en: "From another EU country: no systematic border check — keep the EU pet passport with you."
      fr: "Depuis un autre pays de l'UE : pas de contrôle systématique — garde le passeport européen sur toi."
      es: "Desde otro país de la UE: sin control fronterizo sistemático — lleva contigo el pasaporte europeo."
      pt: "De outro país da UE: sem controle de fronteira sistemático — leve o passaporte europeu com você."
    - from: non_eu
      en: "From outside the EU: notify the Traveller Point of Entry (aviso de chegada) as early as possible — at least 48 hours before arrival — and enter through that designated point for the veterinary check."
      fr: "Depuis hors UE : préviens le Point d'Entrée des Voyageurs (aviso de chegada) le plus tôt possible — au moins 48 heures avant l'arrivée — et entre par ce point désigné pour le contrôle vétérinaire."
      es: "Desde fuera de la UE: avisa al Punto de Entrada de Viajeros (aviso de chegada) lo antes posible — al menos 48 horas antes de la llegada — y entra por ese punto designado para el control veterinario."
      pt: "De fora da UE: avise o Ponto de Entrada de Viajantes (aviso de chegada) o quanto antes — com pelo menos 48 horas de antecedência — e entre por esse ponto designado para o controlo veterinário."
    - en: "A veterinary control fee applies to non-EU arrivals: €42.25 for one animal, €84.50 for two or more; assistance dogs are exempt."
      fr: "Une taxe de contrôle vétérinaire s'applique aux arrivées hors UE : 42,25 € pour un animal, 84,50 € pour deux ou plus ; les chiens d'assistance en sont exemptés."
      es: "A las llegadas de fuera de la UE se les aplica una tasa de control veterinario: 42,25 € por un animal, 84,50 € por dos o más; los perros de asistencia están exentos."
      pt: "Há taxa de controlo veterinário nas chegadas de fora da UE: 42,25 € por um animal, 84,50 € por dois ou mais; cães de assistência são isentos."
    - en: "No import permit is issued, but pleasure marinas/ports that are not Points of Entry cannot be used — the dog must reach a Traveller Point of Entry to be checked."
      fr: "Aucun permis d'import n'est délivré, mais les marinas/ports de plaisance qui ne sont pas des Points d'Entrée ne peuvent être utilisés — le chien doit rejoindre un Point d'Entrée des Voyageurs pour être contrôlé."
      es: "No se expide permiso de importación, pero no pueden usarse los puertos deportivos/de recreo que no sean Puntos de Entrada — el perro debe llegar a un Punto de Entrada de Viajeros para ser controlado."
      pt: "Não é emitida autorização de importação, mas marinas e portos de recreio que não sejam Pontos de Entrada não podem ser usados — o cachorro precisa chegar a um Ponto de Entrada de Viajantes para ser controlado."
    - en: "Carry original documents (or certified copies where allowed), in Portuguese, bilingual or officially translated."
      fr: "Munis-toi des documents originaux (ou copies certifiées lorsque c'est admis), en portugais, bilingues ou traduits officiellement."
      es: "Lleva los documentos originales (o copias certificadas cuando se admitan), en portugués, bilingües o traducidos oficialmente."
      pt: "Leve os documentos originais (ou cópias autenticadas, quando permitido), em português, bilíngues ou com tradução oficial."
    - en: "If documents are missing or invalid, authorities may order re-export to origin or, in the worst case, euthanasia — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, les autorités peuvent ordonner la réexpédition à l'origine ou, au pire, l'euthanasie — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, las autoridades pueden ordenar la reexpedición al origen o, en el peor de los casos, la eutanasia — a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, as autoridades podem determinar a reexportação para a origem ou, na pior das hipóteses, a eutanásia — às custas do proprietário."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Portugal regulates dangerous and potentially dangerous dogs under Decree-Law 315/2009 (amended by Law 46/2013). Unlike some countries, no breed is banned from entry, but owners of listed breeds must meet strict keeping conditions."
    fr: "Le Portugal réglemente les chiens dangereux et potentiellement dangereux (Décret-loi 315/2009, modifié par la loi 46/2013). Contrairement à certains pays, aucune race n'est interdite d'entrée, mais les détenteurs des races listées doivent respecter des conditions strictes."
    es: "Portugal regula los perros peligrosos y potencialmente peligrosos en virtud del Decreto-Ley 315/2009 (modificado por la Ley 46/2013). A diferencia de algunos países, ninguna raza tiene prohibida la entrada, pero los propietarios de las razas listadas deben cumplir condiciones de tenencia estrictas."
    pt: "Portugal regula os cães perigosos e potencialmente perigosos pelo Decreto-Lei 315/2009 (alterado pela Lei 46/2013). Ao contrário de outros países, nenhuma raça é proibida de entrar, mas os donos das raças listadas precisam cumprir condições rigorosas de detenção."
  cat1:
    en: "Potentially dangerous breeds (raças potencialmente perigosas), listed in Portaria 422/2004, are: Brazilian Mastiff (Fila Brasileiro), Argentine Dogo, Pit Bull Terrier, Rottweiler, American Staffordshire Terrier, Staffordshire Bull Terrier and Tosa Inu — plus their first-generation crosses. Keeping one requires an annual licence from the local parish council (junta de freguesia), compulsory civil-liability insurance (Portaria 585/2004, minimum €50,000), a muzzle and lead in public, and — for dogs not registered in a recognised stud book (e.g. Pit Bull, American Bully) — sterilisation."
    fr: "Les races potentiellement dangereuses (raças potencialmente perigosas), listées dans la Portaria 422/2004, sont : Fila Brasileiro, Dogue Argentin, Pit Bull Terrier, Rottweiler, American Staffordshire Terrier, Staffordshire Bull Terrier et Tosa Inu — ainsi que leurs croisements de première génération. En détenir un exige une licence annuelle de la junta de freguesia locale, une assurance responsabilité civile obligatoire (Portaria 585/2004, minimum 50 000 €), muselière et laisse en public, et — pour les chiens non inscrits dans un livre des origines reconnu (ex. Pit Bull, American Bully) — la stérilisation."
    es: "Las razas potencialmente peligrosas (raças potencialmente perigosas), listadas en la Portaria 422/2004, son: Fila Brasileiro, Dogo Argentino, Pit Bull Terrier, Rottweiler, American Staffordshire Terrier, Staffordshire Bull Terrier y Tosa Inu — además de sus cruces de primera generación. Tener uno requiere una licencia anual de la junta de freguesia local, un seguro de responsabilidad civil obligatorio (Portaria 585/2004, mínimo 50 000 €), bozal y correa en la vía pública, y — para los perros no inscritos en un libro genealógico reconocido (p. ej. Pit Bull, American Bully) — la esterilización."
    pt: "As raças potencialmente perigosas, listadas na Portaria 422/2004, são: Fila Brasileiro, Dogo Argentino, Pit Bull Terrier, Rottweiler, American Staffordshire Terrier, Staffordshire Bull Terrier e Tosa Inu — além dos cruzamentos de primeira geração. Ter um deles exige licença anual da junta de freguesia, seguro obrigatório de responsabilidade civil (Portaria 585/2004, mínimo de 50 000 €), focinheira e trela em espaços públicos e — para cães sem registo em livro genealógico reconhecido (Pit Bull, American Bully, por exemplo) — esterilização."
  cat2:
    en: "A separate category, 'dangerous animal' (animal perigoso), is defined by behaviour rather than breed: any dog that has bitten or injured a person or another animal, has been declared aggressive by its owner, or has been assessed as a risk by the authorities. These dogs face the same keeping obligations and must be sterilised."
    fr: "Une catégorie distincte, « animal dangereux » (animal perigoso), est définie par le comportement et non la race : tout chien ayant mordu ou blessé une personne ou un autre animal, déclaré agressif par son détenteur, ou évalué comme un risque par les autorités. Ces chiens sont soumis aux mêmes obligations de détention et doivent être stérilisés."
    es: "Una categoría distinta, «animal peligroso» (animal perigoso), se define por el comportamiento y no por la raza: cualquier perro que haya mordido o herido a una persona o a otro animal, haya sido declarado agresivo por su propietario, o haya sido evaluado como un riesgo por las autoridades. Estos perros están sujetos a las mismas obligaciones de tenencia y deben esterilizarse."
    pt: "Uma categoria à parte, a de «animal perigoso», é definida pelo comportamento e não pela raça: qualquer cão que tenha mordido ou ferido uma pessoa ou outro animal, que tenha sido declarado agressivo pelo dono ou que tenha sido avaliado como risco pelas autoridades. Esses cães têm as mesmas obrigações de detenção e precisam ser esterilizados."
  note:
    en: "Importing a listed breed is allowed. From another EU country, travel on the EU pet passport as usual. From outside the EU for a non-commercial stay, the owner signs a responsibility statement (termo de responsabilidade) at the Point of Entry for stays up to 4 months, or requests a residence notification (notificação de permanência) from DGAV for longer stays. Confirm the current formalities with DGAV before travelling."
    fr: "L'importation d'une race listée est autorisée. Depuis un autre pays de l'UE, voyage avec le passeport européen comme d'habitude. Depuis hors UE pour un séjour non commercial, le propriétaire signe un termo de responsabilidade au Point d'Entrée pour les séjours jusqu'à 4 mois, ou demande une notificação de permanência à la DGAV pour les séjours plus longs. Confirme les formalités en vigueur avec la DGAV avant de voyager."
    es: "Se permite importar una raza listada. Desde otro país de la UE, viaja con el pasaporte europeo como de costumbre. Desde fuera de la UE para una estancia no comercial, el propietario firma una declaración de responsabilidad (termo de responsabilidade) en el Punto de Entrada para estancias de hasta 4 meses, o solicita una notificación de permanencia (notificação de permanência) a la DGAV para estancias más largas. Confirma los trámites vigentes con la DGAV antes de viajar."
    pt: "É permitido importar uma raça listada. Vindo de outro país da UE, viaja-se com o passaporte europeu, como de costume. Vindo de fora da UE para uma estadia não comercial, o dono assina um termo de responsabilidade no Ponto de Entrada para estadias de até 4 meses, ou pede à DGAV uma notificação de permanência para estadias mais longas. Confirme as formalidades em vigor junto da DGAV antes de viajar."

