origin:
  scheme: eu
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate, no tapeworm treatment and normally no border check."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire, pas de traitement échinococcose et normalement pas de contrôle frontalier."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario, sin tratamiento contra la tenia y normalmente sin control fronterizo."
      pt: "Um cachorro que vem de outro país da UE precisa de um passaporte europeu para animais que comprove um microchip ISO válido e uma vacinação antirrábica em dia. Sem teste sorológico antirrábico, sem certificado sanitário, sem tratamento contra a tênia e, normalmente, sem controle na fronteira."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Switzerland, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination and an EU animal health certificate endorsed by an official vet before departure. No antibody test is required; contact the competent authority at a travellers' point of entry."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Suisse, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire européen visé par un vétérinaire officiel avant le départ. Pas de titrage ; contacte l'autorité compétente à un point d'entrée voyageurs."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Suiza, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal de la UE refrendado por un veterinario oficial antes de la salida. No se exige prueba de titulación; contacta con la autoridad competente en un punto de entrada de viajeros."
      pt: "De um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Suíça, Japão, Austrália e outros), o seu cachorro precisa de microchip, vacinação antirrábica válida e certificado sanitário europeu visado por um veterinário oficial antes da partida. Não é exigido teste sorológico antirrábico; entre em contato com a autoridade competente em um ponto de entrada para viajantes."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country such as Serbia or Ukraine, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-approved laboratory, then a compulsory 3-month wait before entry. An endorsed EU animal health certificate is also required."
      fr: "Depuis un pays non listé (à risque) comme la Serbie ou l'Ukraine, ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen visé est également requis."
      es: "Desde un país no listado (con riesgo) como Serbia o Ucrania, añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exige un certificado sanitario animal de la UE refrendado."
      pt: "De um país não listado (de risco), como Sérvia ou Ucrânia, acrescente um teste sorológico antirrábico: sangue coletado pelo menos 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório aprovado pela UE e, depois, uma espera obrigatória de 3 meses antes da entrada. Também é exigido um certificado sanitário europeu visado."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Hungary depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien en Hongrie dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Hungría depende del lugar desde el que hayas volado."
    pt: "O que acontece quando o seu cachorro chega à Hungria depende do lugar de onde você voou."
  points:
    - from: eu
      en: "From another EU country: no systematic border check — keep the EU pet passport with you."
      fr: "Depuis un autre pays de l'UE : pas de contrôle systématique — garde le passeport européen sur toi."
      es: "Desde otro país de la UE: sin control fronterizo sistemático — lleva contigo el pasaporte europeo."
      pt: "De outro país da UE: sem controle de fronteira sistemático — leve o passaporte europeu com você."
    - from: non_eu
      en: "From outside the EU: enter via a designated travellers' point of entry (Budapest Liszt Ferenc Airport has a veterinary border inspection post) and contact the competent authority for documentary and identity checks."
      fr: "Depuis hors UE : entre par un point d'entrée voyageurs désigné (l'aéroport Budapest Liszt Ferenc dispose d'un poste d'inspection vétérinaire) et contacte l'autorité compétente pour les contrôles documentaires et d'identité."
      es: "Desde fuera de la UE: entra por un punto de entrada de viajeros designado (el aeropuerto Budapest Liszt Ferenc cuenta con un puesto de inspección fronteriza veterinaria) y contacta con la autoridad competente para los controles documentales y de identidad."
      pt: "De fora da UE: entre por um ponto de entrada designado para viajantes (o aeroporto Budapest Liszt Ferenc tem um posto de inspeção veterinária de fronteira) e entre em contato com a autoridade competente para as conferências documental e de identidade."
    - en: "No import permit is issued and no prior appointment is needed for a non-commercial pet dog."
      fr: "Aucun permis d'import n'est délivré et aucun rendez-vous préalable n'est nécessaire pour un chien de compagnie non commercial."
      es: "No se expide permiso de importación ni se necesita cita previa para un perro de compañía no comercial."
      pt: "Não é emitida nenhuma licença de importação nem é necessário agendamento prévio para um cachorro de companhia não comercial."
    - en: "Carry original documents (not copies); an English- or Hungarian-language certificate is expected for non-EU arrivals."
      fr: "Munis-toi des documents originaux (pas de copies) ; un certificat en anglais ou en hongrois est attendu pour les arrivées hors UE."
      es: "Lleva los documentos originales (no copias); para las llegadas de fuera de la UE se espera un certificado en inglés o en húngaro."
      pt: "Leve os documentos originais (não cópias); nas chegadas de fora da UE, espera-se um certificado em inglês ou em húngaro."
    - en: "If documents are missing or invalid, the authority may order return to the country of origin, quarantine at the owner's expense or, as a last resort, euthanasia."
      fr: "Si les documents manquent ou sont invalides, l'autorité peut ordonner le retour vers le pays d'origine, la quarantaine aux frais du propriétaire ou, en dernier recours, l'euthanasie."
      es: "Si faltan documentos o no son válidos, la autoridad puede ordenar la devolución al país de origen, la cuarentena a cargo del propietario o, como último recurso, la eutanasia."
      pt: "Se faltarem documentos ou eles não forem válidos, a autoridade pode determinar a devolução ao país de origem, a quarentena às custas do tutor ou, em último caso, a eutanásia."
    - en: "Hungary applies no breed-based import ban: no dog is refused entry merely because of its breed."
      fr: "La Hongrie n'applique aucune interdiction d'importation fondée sur la race : aucun chien n'est refusé à l'entrée au seul motif de sa race."
      es: "Hungría no aplica ninguna prohibición de importación por raza: a ningún perro se le deniega la entrada solo por su raza."
      pt: "A Hungria não aplica nenhuma proibição de importação baseada na raça: nenhum cachorro tem a entrada recusada apenas por causa da raça."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Hungary has no national breed ban. The former breed-based 'dangerous dog' (veszélyes eb) classification was repealed: since Government Decree 41/2010 (II.26.) a dog is never declared dangerous by breed or in advance, only individually, case by case, on the basis of its own behaviour and acts — assessed if needed by a dog-behaviour expert."
    fr: "La Hongrie n'a pas d'interdiction nationale de race. L'ancienne classification des « chiens dangereux » (veszélyes eb) fondée sur la race a été abrogée : depuis le décret gouvernemental 41/2010 (II.26.), un chien n'est jamais déclaré dangereux selon sa race ni par principe, mais uniquement au cas par cas, selon son propre comportement et ses actes — évalués au besoin par un expert du comportement canin."
    es: "Hungría no tiene ninguna prohibición nacional por raza. La antigua clasificación de «perro peligroso» (veszélyes eb) basada en la raza fue derogada: desde el Decreto Gubernamental 41/2010 (II.26.), un perro nunca se declara peligroso por su raza ni de antemano, sino solo de forma individual, caso por caso, según su propio comportamiento y sus actos — evaluados si es necesario por un experto en comportamiento canino."
    pt: "A Hungria não tem proibição nacional de raças. A antiga classificação de “cachorro perigoso” (veszélyes eb) baseada na raça foi revogada: desde o Decreto Governamental 41/2010 (II.26.), um cachorro nunca é declarado perigoso pela raça nem de antemão, mas apenas de forma individual, caso a caso, com base no seu próprio comportamento e nos seus atos — avaliados, se necessário, por um especialista em comportamento canino."
  cat1:
    en: "No breed list. There is no list of prohibited or restricted breeds and no import ban targeting pit bull, Staffordshire, Rottweiler, Tosa or any other type. A dog is not treated as dangerous simply because it resembles a given breed."
    fr: "Aucune liste de races. Il n'existe aucune liste de races interdites ou restreintes ni d'interdiction d'importation visant le pit-bull, le Staffordshire, le Rottweiler, le Tosa ou tout autre type. Un chien n'est pas considéré comme dangereux au seul motif qu'il ressemble à une race donnée."
    es: "Sin lista de razas. No existe ninguna lista de razas prohibidas o restringidas ni prohibición de importación dirigida al pit bull, el Staffordshire, el Rottweiler, el Tosa ni ningún otro tipo. Un perro no se considera peligroso solo por parecerse a una raza determinada."
    pt: "Sem lista de raças. Não existe nenhuma lista de raças proibidas ou restritas nem proibição de importação dirigida a pit bull, Staffordshire, Rottweiler, Tosa ou qualquer outro tipo. Um cachorro não é tratado como perigoso apenas por se parecer com uma determinada raça."
  cat2:
    en: "Owner-responsibility model. A dog individually classified as dangerous by the authority (after a behaviour-based procedure) may only be kept under permit, must be neutered and microchipped, and in public must wear a muzzle and a secure lead under the supervision of the person named in the permit. All dogs over four months must be microchipped and registered in the national database."
    fr: "Modèle de responsabilité du propriétaire. Un chien individuellement classé dangereux par l'autorité (après une procédure fondée sur le comportement) ne peut être détenu que sous permis, doit être stérilisé et pucé, et en public porter une muselière et une laisse sûre sous la surveillance de la personne désignée dans le permis. Tout chien de plus de quatre mois doit être pucé et enregistré dans la base nationale."
    es: "Modelo de responsabilidad del propietario. Un perro clasificado individualmente como peligroso por la autoridad (tras un procedimiento basado en el comportamiento) solo puede tenerse con permiso, debe estar esterilizado y con microchip, y en la vía pública debe llevar bozal y una correa segura bajo la supervisión de la persona designada en el permiso. Todos los perros mayores de cuatro meses deben tener microchip y estar registrados en la base de datos nacional."
    pt: "Modelo de responsabilidade do tutor. Um cachorro classificado individualmente como perigoso pela autoridade (após um procedimento baseado no comportamento) só pode ser mantido mediante licença, precisa ser castrado e ter microchip e, em local público, deve usar focinheira e uma guia segura sob a supervisão da pessoa indicada na licença. Todos os cachorros com mais de quatro meses precisam ter microchip e estar registrados no banco de dados nacional."
  note:
    en: "Because classification is individual and behaviour-based, breed alone does not restrict entry to Hungary. Confirm current local rules with your vet or the National Food Chain Safety Office (Nébih) before travelling."
    fr: "La classification étant individuelle et fondée sur le comportement, la race seule ne restreint pas l'entrée en Hongrie. Confirme les règles locales en vigueur auprès de ton vétérinaire ou de l'Office national de sécurité de la chaîne alimentaire (Nébih) avant de voyager."
    es: "Como la clasificación es individual y se basa en el comportamiento, la raza por sí sola no restringe la entrada en Hungría. Confirma las reglas locales vigentes con tu veterinario o con la Oficina Nacional de Seguridad de la Cadena Alimentaria (Nébih) antes de viajar."
    pt: "Como a classificação é individual e baseada no comportamento, a raça por si só não restringe a entrada na Hungria. Confirme as regras locais em vigor com o seu veterinário ou com o Escritório Nacional de Segurança da Cadeia Alimentar (Nébih) antes de viajar."

