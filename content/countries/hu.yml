    exceptions: { en: "Hungary issues no import permit and requires no prior customs appointment for a non-commercial pet dog.", fr: "La Hongrie ne délivre aucun permis d'import et n'exige aucun rendez-vous douanier préalable pour un chien de compagnie non commercial.", es: "Hungría no expide permiso de importación ni exige cita previa en aduanas para un perro de compañía no comercial.", pt: "A Hungria não emite licença de importação nem exige agendamento prévio na alfândega para um cachorro de companhia não comercial." }
