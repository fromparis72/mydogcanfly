    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Only Finland, Ireland, Malta, Northern Ireland and Norway require it — Hungary is not on that list.", fr: "Seuls la Finlande, l'Irlande, Malte, l'Irlande du Nord et la Norvège l'exigent — la Hongrie n'y figure pas.", es: "Solo lo exigen Finlandia, Irlanda, Malta, Irlanda del Norte y Noruega — Hungría no está en esa lista.", pt: "Apenas Finlândia, Irlanda, Malta, Irlanda do Norte e Noruega o exigem — a Hungria não está nessa lista." }
    ref: { en: "EU Reg. 2018/878; Nébih", fr: "Règl. UE 2018/878 ; Nébih", es: "Regl. UE 2018/878; Nébih", pt: "Regulamento UE 2018/878; Nébih" }
