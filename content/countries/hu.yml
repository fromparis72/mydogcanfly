    when: { en: "12-week rabies shot + 21-day wait (listed); about 7 months from a non-listed country.", fr: "Vaccin à 12 semaines + 21 jours (pays listé) ; environ 7 mois depuis un pays non listé.", es: "Vacuna a las 12 semanas + espera de 21 días (país listado); unos 7 meses desde un país no listado.", pt: "Vacina antirrábica às 12 semanas + 21 dias de espera (país listado); cerca de 7 meses vindo de um país não listado." }
    exceptions: { en: "A puppy under 12 weeks cannot be vaccinated, so cannot enter from outside the EU; young dogs may only travel with an owner declaration or the vaccinated mother.", fr: "Un chiot de moins de 12 semaines ne peut être vacciné, donc ne peut entrer depuis hors UE ; les jeunes chiens ne circulent qu'avec une déclaration du propriétaire ou la mère vaccinée.", es: "Un cachorro menor de 12 semanas no puede vacunarse, por lo que no puede entrar desde fuera de la UE; los perros jóvenes solo viajan con una declaración del propietario o con la madre vacunada.", pt: "Um filhote com menos de 12 semanas não pode ser vacinado e, portanto, não pode entrar vindo de fora da UE; cachorros jovens só circulam com uma declaração do tutor ou acompanhados da mãe vacinada." }
