notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian and Singapore's AVS can confirm the exact procedure for your individual dog."
    fr: "Seuls un vétérinaire et l'AVS de Singapour peuvent confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario y el AVS de Singapur pueden confirmar el procedimiento exacto para tu perro."
    pt: "Só um veterinário e o AVS de Singapura podem confirmar o procedimento exato para o seu cachorro."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact procedure depends on three things — Singapore (your destination) is only the first."
    fr: "La procédure exacte dépend de trois éléments — Singapour (ta destination) n'est que le premier."
    es: "El procedimiento exacto depende de tres factores — Singapur (tu destino) es solo el primero."
    pt: "O procedimento exato depende de três fatores — Singapura (seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Singapore", fr: "Pays de destination — Singapour", es: "País de destino — Singapur", pt: "País de destino — Singapura" }
      text:
        en: "Singapore runs its own AVS scheme: an ISO microchip, a dog licence and an AVS import licence are always required, the dog must be at least 12 weeks old at export, and certain breeds are banned entirely."
        fr: "Singapour applique son propre régime AVS : puce ISO, licence de chien et licence d'importation AVS toujours exigées, chien d'au moins 12 semaines à l'export, et certaines races totalement interdites."
        es: "Singapur aplica su propio régimen del AVS: siempre se exigen un microchip ISO, una licencia de perro y una licencia de importación del AVS, el perro debe tener al menos 12 semanas en el momento de la exportación, y ciertas razas están totalmente prohibidas."
        pt: "Singapura aplica seu próprio regime do AVS: microchip ISO, licença de cachorro e licença de importação do AVS são sempre obrigatórios, o cachorro precisa ter pelo menos 12 semanas no momento da exportação, e certas raças são totalmente proibidas."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "AVS sorts the exporting country into Schedule I, II or III by rabies risk. That schedule decides whether a rabies vaccination, a serology (blood) test and post-arrival quarantine apply."
        fr: "L'AVS classe le pays d'export en annexe I, II ou III selon le risque rabique. Cette annexe détermine si une vaccination antirabique, un titrage (prise de sang) et une quarantaine à l'arrivée s'appliquent."
        es: "El AVS clasifica el país exportador en el Anexo I, II o III según el riesgo de rabia. Ese anexo determina si se aplican una vacunación antirrábica, una prueba de serología (sangre) y una cuarentena posterior a la llegada."
        pt: "O AVS classifica o país exportador no Anexo I, II ou III conforme o risco de raiva. Esse anexo define se são exigidos vacinação antirrábica, teste sorológico (exame de sangue) e quarentena depois da chegada."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "AVS looks at your dog's real travel history, not only the last airport. A recent stay in a higher-risk country can move your dog into a stricter schedule with a blood test and longer quarantine."
        fr: "L'AVS examine l'historique réel de ton chien, pas seulement l'aéroport de destination finale. Un séjour récent dans un pays à risque plus élevé peut faire basculer ton chien dans une annexe plus stricte avec prise de sang et quarantaine plus longue."
        es: "El AVS examina el historial real de viajes de tu perro, no solo el último aeropuerto. Una estancia reciente en un país de mayor riesgo puede pasar a tu perro a un anexo más estricto con prueba de sangre y una cuarentena más larga."
        pt: "O AVS analisa o histórico real de viagens do seu cachorro, não só o último aeroporto. Uma estadia recente em um país de risco maior pode colocar seu cachorro em um anexo mais rígido, com exame de sangue e quarentena mais longa."
  note:
    en: "So read the requirements below as Singapore's framework, then confirm your dog's exact schedule and history with your vet and AVS."
    fr: "Lis donc les exigences ci-dessous comme le cadre singapourien, puis confirme l'annexe et l'historique exacts de ton chien avec ton vétérinaire et l'AVS."
    es: "Así que lee los requisitos siguientes como el marco de Singapur y luego confirma el anexo y el historial exactos de tu perro con tu veterinario y el AVS."
    pt: "Portanto, leia as exigências abaixo como o quadro geral de Singapura e depois confirme com seu veterinário e com o AVS qual é exatamente o anexo e o histórico do seu cachorro."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "ISO 11784 / 11785 microchip implanted before vaccinations; the number must appear on every vaccination and treatment record.", fr: "Puce ISO 11784 / 11785 posée avant les vaccinations ; le numéro doit figurer sur chaque enregistrement de vaccination et de traitement.", es: "Microchip ISO 11784 / 11785 implantado antes de las vacunaciones; el número debe figurar en cada registro de vacunación y de tratamiento.", pt: "Microchip ISO 11784 / 11785 implantado antes das vacinações; o número precisa constar em todos os registros de vacinação e de tratamento." }
    exceptions: { en: "No tattoo alternative is accepted.", fr: "Aucune alternative par tatouage n'est acceptée.", es: "No se acepta ninguna alternativa por tatuaje.", pt: "Não é aceita nenhuma alternativa por tatuagem." }
    ref: { en: "AVS — Importing dogs and cats", fr: "AVS — Importation de chiens et chats", es: "AVS — Importación de perros y gatos", pt: "AVS — Importação de cães e gatos" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required (Schedule II & III)", fr: "Requise (annexes II et III)", es: "Obligatoria (Anexos II y III)", pt: "Obrigatória (Anexos II e III)" }
    when: { en: "Valid inactivated or recombinant vaccine acceptable to AVS; not required for Schedule I countries.", fr: "Vaccin inactivé ou recombinant valide accepté par l'AVS ; non requis pour les pays de l'annexe I.", es: "Vacuna inactivada o recombinante válida aceptada por el AVS; no obligatoria para los países del Anexo I.", pt: "Vacina inativada ou recombinante válida e aceita pelo AVS; não é obrigatória para países do Anexo I." }
    exceptions: { en: "Schedule III dogs are also re-vaccinated against rabies on arrival in Singapore.", fr: "Les chiens de l'annexe III sont également revaccinés contre la rage à l'arrivée à Singapour.", es: "Los perros del Anexo III también se revacunan contra la rabia a la llegada a Singapur.", pt: "Os cachorros do Anexo III também são revacinados contra a raiva na chegada em Singapura." }
    ref: { en: "AVS — Schedule II & III veterinary conditions", fr: "AVS — conditions vétérinaires annexes II et III", es: "AVS — Condiciones veterinarias de los Anexos II y III", pt: "AVS — Condições veterinárias dos Anexos II e III" }
  - item: { en: "Rabies antibody (serology) test", fr: "Titrage des anticorps antirabiques (sérologie)", es: "Prueba de titulación de anticuerpos contra la rabia (serología)", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Required (Schedule II & III)", fr: "Requis (annexes II et III)", es: "Obligatoria (Anexos II y III)", pt: "Obrigatória (Anexos II e III)" }
    when: { en: "Blood sampled at least 28 days after a valid vaccination, and at least 90 days and within 12 months before export, at a WOAH reference or approved Schedule I/II lab.", fr: "Sang prélevé au moins 28 jours après un vaccin valide, et au moins 90 jours et dans les 12 mois avant l'export, dans un labo de référence WOAH ou agréé annexe I/II.", es: "Sangre extraída al menos 28 días después de una vacunación válida, y al menos 90 días y dentro de los 12 meses antes de la exportación, en un laboratorio de referencia de la WOAH o aprobado del Anexo I/II.", pt: "Sangue coletado pelo menos 28 dias depois de uma vacinação válida e, ainda, no mínimo 90 dias e no máximo 12 meses antes da exportação, em laboratório de referência da WOAH ou aprovado nos Anexos I/II." }
    exceptions: { en: "Not required for Schedule I countries (Australia, New Zealand, Ireland, United Kingdom).", fr: "Non requis pour les pays de l'annexe I (Australie, Nouvelle-Zélande, Irlande, Royaume-Uni).", es: "No obligatoria para los países del Anexo I (Australia, Nueva Zelanda, Irlanda, Reino Unido).", pt: "Não obrigatório para países do Anexo I (Austrália, Nova Zelândia, Irlanda, Reino Unido)." }
    ref: { en: "AVS — Importing dogs and cats, step 3", fr: "AVS — Importation de chiens et chats, étape 3", es: "AVS — Importación de perros y gatos, paso 3", pt: "AVS — Importação de cães e gatos, etapa 3" }
  - item: { en: "Core vaccinations", fr: "Vaccinations de base", es: "Vacunas de base", pt: "Vacinas essenciais" }
    required: { en: "Required", fr: "Requises", es: "Obligatorias", pt: "Obrigatório" }
    when: { en: "Dogs: valid vaccination against canine distemper virus, canine adenovirus type 1 and canine parvovirus type 2, supported by records on arrival.", fr: "Chiens : vaccination valide contre la maladie de Carré, l'adénovirus canin de type 1 et le parvovirus canin de type 2, justifiée par des enregistrements à l'arrivée.", es: "Perros: vacunación válida contra el virus del moquillo canino, el adenovirus canino de tipo 1 y el parvovirus canino de tipo 2, justificada con registros a la llegada.", pt: "Cachorros: vacinação válida contra o vírus da cinomose canina, o adenovírus canino tipo 1 e o parvovírus canino tipo 2, comprovada por registros na chegada." }
    exceptions: { en: "Follow the vaccine manufacturer's recommendations on validity and dosing.", fr: "Suivre les recommandations du fabricant du vaccin sur la validité et les doses.", es: "Sigue las recomendaciones del fabricante de la vacuna sobre la valide y las dosis.", pt: "Siga as recomendações do fabricante da vacina quanto à validade e à dosagem." }
    ref: { en: "AVS — Importing dogs and cats, step 4", fr: "AVS — Importation de chiens et chats, étape 4", es: "AVS — Importación de perros y gatos, paso 4", pt: "AVS — Importação de cães e gatos, etapa 4" }
  - item: { en: "Dog licence", fr: "Licence de chien", es: "Licencia de perro", pt: "Licença de cachorro" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "A dog licence must be obtained on the Pet Animal Licensing System (PALS) before applying for the import licence.", fr: "Une licence de chien doit être obtenue sur le Pet Animal Licensing System (PALS) avant de demander la licence d'importation.", es: "Debe obtenerse una licencia de perro en el Pet Animal Licensing System (PALS) antes de solicitar la licencia de importación.", pt: "A licença de cachorro precisa ser obtida no Pet Animal Licensing System (PALS) antes de pedir a licença de importação." }
    exceptions: { en: "Specified (Part 2) dogs need extra conditions: muzzle, insurance and a banker's guarantee.", fr: "Les chiens « spécifiés » (partie 2) exigent des conditions supplémentaires : muselière, assurance et garantie bancaire.", es: "Los perros «especificados» (parte 2) requieren condiciones adicionales: bozal, seguro y un aval bancario.", pt: "Os cachorros especificados (Specified Dogs, Parte 2) exigem condições extras: focinheira, seguro e garantia bancária." }
    ref: { en: "AVS — Applying for dog and cat licences", fr: "AVS — Demande de licence de chien et de chat", es: "AVS — Solicitud de licencias de perro y gato", pt: "AVS — Solicitação de licenças de cães e gatos" }
  - item: { en: "AVS import licence", fr: "Licence d'importation AVS", es: "Licencia de importación del AVS", pt: "Licença de importação do AVS" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Import licence via the GoBusiness Licensing Portal (S$50 normal / S$100 express); valid 90 days from issue and applied for within 90 days of arrival.", fr: "Licence d'importation via le portail GoBusiness (50 S$ normale / 100 S$ express) ; valable 90 jours à compter de l'émission, demandée dans les 90 jours avant l'arrivée.", es: "Licencia de importación a través del portal GoBusiness (50 S$ normal / 100 S$ exprés); válida 90 días desde su expedición y solicitada dentro de los 90 días previos a la llegada.", pt: "Licença de importação pelo GoBusiness Licensing Portal (50 dólares singapurianos no serviço normal / 100 dólares singapurianos no expresso); válida por 90 dias a partir da emissão e solicitada dentro dos 90 dias anteriores à chegada." }
    exceptions: { en: "Mixed/cross-breed dogs must include a colour photo showing face and body to confirm the dog is not a prohibited breed.", fr: "Les chiens croisés/de type mixte doivent inclure une photo couleur du visage et du corps pour confirmer qu'il ne s'agit pas d'une race interdite.", es: "Los perros mestizos o de cruce deben incluir una foto en color que muestre la cara y el cuerpo para confirmar que no son de una raza prohibida.", pt: "Os cachorros mestiços ou sem raça definida precisam incluir uma foto colorida mostrando rosto e corpo, para confirmar que o cachorro não é de uma raça proibida." }
    ref: { en: "AVS — Importing dogs and cats, step 7", fr: "AVS — Importation de chiens et chats, étape 7", es: "AVS — Importación de perros y gatos, paso 7", pt: "AVS — Importação de cães e gatos, etapa 7" }
  - item: { en: "Veterinary health certificate", fr: "Certificat sanitaire vétérinaire", es: "Certificado sanitario veterinario", pt: "Atestado de saúde veterinário" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Completed 2–7 days before export: treating vet certifies conditions and fitness (Sections I–III); the exporting country's government vet endorses Section IV.", fr: "Rempli 2 à 7 jours avant l'export : le vétérinaire traitant certifie les conditions et l'aptitude (sections I à III) ; le vétérinaire officiel du pays d'export vise la section IV.", es: "Cumplimentado de 2 a 7 días antes de la exportación: el veterinario que trata al animal certifica las condiciones y la aptitud (secciones I a III); el veterinario oficial del país exportador refrenda la sección IV.", pt: "Preenchido de 2 a 7 dias antes da exportação: o veterinário responsável atesta as condições e a aptidão para viajar (Seções I a III); o veterinário oficial do país exportador endossa a Seção IV." }
    exceptions: { en: "The animal must be free from any clinical sign of contagious or infectious disease and fit for travel.", fr: "L'animal doit être exempt de tout signe clinique de maladie contagieuse ou infectieuse et apte au voyage.", es: "El animal debe estar libre de cualquier signo clínico de enfermedad contagiosa o infecciosa y apto para viajar.", pt: "O animal precisa estar livre de qualquer sinal clínico de doença contagiosa ou infecciosa e apto a viajar." }
    ref: { en: "AVS — Importing dogs and cats, step 10", fr: "AVS — Importation de chiens et chats, étape 10", es: "AVS — Importación de perros y gatos, paso 10", pt: "AVS — Importação de cães e gatos, etapa 10" }
  - item: { en: "External & internal parasite treatment", fr: "Traitement antiparasitaire externe et interne", es: "Tratamiento antiparasitario externo e interno", pt: "Tratamento antiparasitário externo e interno" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Administered between 2 and 7 days before export and recorded on the health certificate.", fr: "Administré entre 2 et 7 jours avant l'export et consigné sur le certificat sanitaire.", es: "Administrado entre 2 y 7 días antes de la exportación y registrado en el certificado sanitario.", pt: "Aplicado entre 2 e 7 dias antes da exportação e registrado no atestado de saúde." }
    exceptions: { en: "—", fr: "—", es: "—", pt: "—" }
    ref: { en: "AVS — Importing dogs and cats, step 10", fr: "AVS — Importation de chiens et chats, étape 10", es: "AVS — Importación de perros y gatos, paso 10", pt: "AVS — Importação de cães e gatos, etapa 10" }
  - item: { en: "Customs GST permit", fr: "Permis douanier (TPS/GST)", es: "Permiso aduanero (GST)", pt: "Permissão aduaneira de GST" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "A Customs In-Payment (GST) permit is needed before arrival; obtained via a local forwarding agent within 14 days of arrival.", fr: "Un permis douanier In-Payment (GST) est nécessaire avant l'arrivée ; obtenu via un transitaire local dans les 14 jours de l'arrivée.", es: "Se necesita un permiso aduanero In-Payment (GST) antes de la llegada; se obtiene a través de un agente transitario local dentro de los 14 días previos a la llegada.", pt: "É preciso uma permissão Customs In-Payment (GST) antes da chegada; ela é obtida por meio de um agente despachante local dentro de 14 dias da chegada." }
    exceptions: { en: "—", fr: "—", es: "—", pt: "—" }
    ref: { en: "Singapore Customs — Importing personal pets", fr: "Douane de Singapour — Importation d'animaux personnels", es: "Aduana de Singapur — Importación de mascotas personales", pt: "Singapore Customs — Importação de animais de estimação pessoais" }
  - item: { en: "Border inspection appointment", fr: "Rendez-vous d'inspection frontalière", es: "Cita de inspección fronteriza", pt: "Agendamento da inspeção na fronteira" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Book an inspection at least 5 days before arrival; dogs by air are inspected at Changi (CAPQ), by land at Tuas Checkpoint.", fr: "Réserver une inspection au moins 5 jours avant l'arrivée ; par avion à Changi (CAPQ), par voie terrestre au poste de Tuas.", es: "Reserva una inspección al menos 5 días antes de la llegada; los perros que llegan por aire se inspeccionan en Changi (CAPQ), y por tierra en el paso de Tuas.", pt: "Agende uma inspeção pelo menos 5 dias antes da chegada; os cachorros que chegam de avião são inspecionados em Changi (CAPQ) e, por via terrestre, no Tuas Checkpoint." }
    exceptions: { en: "Arriving without an appointment incurs an inspection fee of S$133 per hour or part thereof.", fr: "Arriver sans rendez-vous entraîne des frais d'inspection de 133 S$ par heure entamée.", es: "Llegar sin cita conlleva una tasa de inspección de 133 S$ por hora o fracción.", pt: "Chegar sem agendamento gera uma taxa de inspeção de 133 dólares singapurianos por hora ou fração de hora." }
    ref: { en: "AVS — Importing dogs and cats, step 9", fr: "AVS — Importation de chiens et chats, étape 9", es: "AVS — Importación de perros y gatos, paso 9", pt: "AVS — Importação de cães e gatos, etapa 9" }
  - item: { en: "Minimum age", fr: "Âge minimum", es: "Edad mínima", pt: "Idade mínima" }
    required: { en: "≥12 weeks at export", fr: "≥12 semaines à l'export", es: "≥12 semanas en la exportación", pt: "≥12 semanas na exportação" }
    when: { en: "The dog must be at least 12 weeks old at the time of export.", fr: "Le chien doit avoir au moins 12 semaines au moment de l'export.", es: "El perro debe tener al menos 12 semanas en el momento de la exportación.", pt: "O cachorro precisa ter pelo menos 12 semanas no momento da exportação." }
    exceptions: { en: "With the serology waiting periods, dogs from Schedule II/III are effectively much older before they can enter.", fr: "Avec les délais de titrage, les chiens des annexes II/III sont en pratique bien plus âgés avant de pouvoir entrer.", es: "Con los plazos de espera de la serología, los perros de los Anexos II/III son en la práctica bastante mayores antes de poder entrar.", pt: "Com os prazos de espera da sorologia, na prática os cachorros dos Anexos II/III só conseguem entrar bem mais velhos." }
    ref: { en: "AVS — Preparing to bring dogs and cats into Singapore", fr: "AVS — Préparer l'entrée de chiens et chats à Singapour", es: "AVS — Preparación para traer perros y gatos a Singapur", pt: "AVS — Preparação para trazer cães e gatos para Singapura" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Conditional by schedule", fr: "Conditionnelle selon l'annexe", es: "Condicional según el anexo", pt: "Condicional conforme o anexo" }
    when: { en: "Schedule I: none. Schedule II: may be exempt, otherwise minimum 10-day home quarantine (or 10 days at AQC for commercial imports). Schedule III: minimum 30 days at the Animal Quarantine Centre.", fr: "Annexe I : aucune. Annexe II : possible exemption, sinon quarantaine minimale de 10 jours à domicile (ou 10 jours à l'AQC pour les imports commerciaux). Annexe III : minimum 30 jours au centre de quarantaine animale.", es: "Anexo I: ninguna. Anexo II: puede quedar exenta, si no, cuarentena mínima de 10 días a domicilio (o 10 días en el AQC para las importaciones comerciales). Anexo III: mínimo 30 días en el Centro de Cuarentena Animal.", pt: "Anexo I: nenhuma. Anexo II: pode haver isenção; caso contrário, quarentena domiciliar de no mínimo 10 dias (ou 10 dias no AQC nas importações comerciais). Anexo III: no mínimo 30 dias no Animal Quarantine Centre." }
    exceptions: { en: "Schedule II exemption needs a personal import, the pet brought within 5 days of the owner's entry, and 6+ months living at the owner's address.", fr: "L'exemption annexe II exige un import personnel, l'animal amené dans les 5 jours de l'entrée du propriétaire et 6+ mois de vie à l'adresse du propriétaire.", es: "La exención del Anexo II requiere una importación personal, que la mascota se traiga dentro de los 5 días siguientes a la entrada del propietario, y más de 6 meses viviendo en el domicilio del propietario.", pt: "A isenção do Anexo II exige uma importação pessoal, o animal trazido dentro de 5 dias da entrada do dono e pelo menos 6 meses morando no endereço do dono." }
    ref: { en: "AVS — Importing dogs and cats, step 5", fr: "AVS — Importation de chiens et chats, étape 5", es: "AVS — Importación de perros y gatos, paso 5", pt: "AVS — Importação de cães e gatos, etapa 5" }

origin:
  scheme: own
  eu:
    from: [au, nz, ie, gb]
    title: { en: "Schedule I — no blood test, no quarantine", fr: "Annexe I — sans prise de sang ni quarantaine", es: "Anexo I — sin prueba de sangre ni cuarentena", pt: "Anexo I — sem exame de sangue, sem quarentena" }
    body:
      en: "From Schedule I countries (Australia, New Zealand, Ireland, United Kingdom), your dog needs an ISO microchip, valid core vaccinations, a dog licence, an AVS import licence and an endorsed health certificate — but no rabies vaccination, no serology test and no quarantine, provided all conditions are fully met."
      fr: "Depuis les pays de l'annexe I (Australie, Nouvelle-Zélande, Irlande, Royaume-Uni), ton chien a besoin d'une puce ISO, de vaccins de base valides, d'une licence de chien, d'une licence d'importation AVS et d'un certificat sanitaire visé — mais pas de vaccination antirabique, pas de titrage et pas de quarantaine, à condition de respecter toutes les conditions."
      es: "Desde los países del Anexo I (Australia, Nueva Zelanda, Irlanda, Reino Unido), tu perro necesita un microchip ISO, vacunas de base válidas, una licencia de perro, una licencia de importación del AVS y un certificado sanitario refrendado — pero sin vacunación antirrábica, sin prueba de serología y sin cuarentena, siempre que se cumplan todas las condiciones."
      pt: "Vindo de países do Anexo I (Austrália, Nova Zelândia, Irlanda, Reino Unido), seu cachorro precisa de microchip ISO, vacinas essenciais válidas, licença de cachorro, licença de importação do AVS e um atestado de saúde endossado — mas nada de vacinação antirrábica, teste sorológico ou quarentena, desde que todas as condições sejam integralmente cumpridas."
    cls: ok
  listed:
    title: { en: "Schedule II — vaccination, blood test, often 10-day quarantine", fr: "Annexe II — vaccination, prise de sang, souvent 10 jours de quarantaine", es: "Anexo II — vacunación, prueba de sangre, a menudo 10 días de cuarentena", pt: "Anexo II — vacinação, exame de sangue e, muitas vezes, 10 dias de quarentena" }
    body:
      en: "From Schedule II countries (most of the EU, USA, Canada, Japan, Hong Kong, Switzerland and others), add a rabies vaccination and a serology test taken at least 28 days after vaccination and at least 90 days before export. A minimum 10-day home quarantine applies unless the personal-import exemption is met (pet brought within 5 days of the owner's entry and 6+ months at the owner's address)."
      fr: "Depuis les pays de l'annexe II (une grande partie de l'UE, USA, Canada, Japon, Hong Kong, Suisse…), ajoute une vaccination antirabique et un titrage prélevé au moins 28 jours après le vaccin et au moins 90 jours avant l'export. Une quarantaine minimale de 10 jours à domicile s'applique, sauf si l'exemption import personnel est remplie (animal amené dans les 5 jours de l'entrée du propriétaire et 6+ mois à son adresse)."
      es: "Desde los países del Anexo II (gran parte de la UE, EE. UU., Canadá, Japón, Hong Kong, Suiza y otros), añade una vacunación antirrábica y una prueba de serología realizada al menos 28 días después de la vacuna y al menos 90 días antes de la exportación. Se aplica una cuarentena mínima de 10 días a domicilio, salvo que se cumpla la exención de importación personal (mascota traída dentro de los 5 días siguientes a la entrada del propietario y más de 6 meses en el domicilio del propietario)."
      pt: "Vindo de países do Anexo II (grande parte da UE, EUA, Canadá, Japão, Hong Kong, Suíça e outros), acrescente uma vacinação antirrábica e um teste sorológico feito pelo menos 28 dias depois da vacinação e no mínimo 90 dias antes da exportação. Aplica-se uma quarentena domiciliar de no mínimo 10 dias, a não ser que a isenção de importação pessoal seja atendida (animal trazido dentro de 5 dias da entrada do dono e pelo menos 6 meses no endereço do dono)."
    cls: warn
  nonListed:
    title: { en: "Schedule III — titre + minimum 30-day quarantine", fr: "Annexe III — titrage + quarantaine minimale de 30 jours", es: "Anexo III — titulación + cuarentena mínima de 30 días", pt: "Anexo III — titulação + quarentena mínima de 30 dias" }
    body:
      en: "From any other country (Schedule III), your dog needs the rabies vaccination and serology test, then a post-arrival quarantine of at least 30 days at the Animal Quarantine Centre (AQC), booked in advance via the Quarantine Management System. Dogs from Schedule III are also re-vaccinated against rabies on arrival."
      fr: "Depuis tout autre pays (annexe III), ton chien a besoin de la vaccination antirabique et du titrage, puis d'une quarantaine à l'arrivée d'au moins 30 jours au centre de quarantaine animale (AQC), réservée à l'avance via le Quarantine Management System. Les chiens de l'annexe III sont aussi revaccinés contre la rage à l'arrivée."
      es: "Desde cualquier otro país (Anexo III), tu perro necesita la vacunación antirrábica y la prueba de serología, y luego una cuarentena posterior a la llegada de al menos 30 días en el Centro de Cuarentena Animal (AQC), reservada con antelación a través del Quarantine Management System. Los perros del Anexo III también se revacunan contra la rabia a la llegada."
      pt: "Vindo de qualquer outro país (Anexo III), seu cachorro precisa da vacinação antirrábica e do teste sorológico e, depois, de uma quarentena de no mínimo 30 dias na chegada, no Animal Quarantine Centre (AQC), reservada com antecedência pelo Quarantine Management System. Os cachorros do Anexo III também são revacinados contra a raiva na chegada."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Singapore depends on its schedule and the checkpoint of entry."
    fr: "Ce qui se passe à l'arrivée de ton chien à Singapour dépend de son annexe et du point d'entrée."
    es: "Lo que ocurre cuando tu perro llega a Singapur depende de su anexo y del punto de entrada."
    pt: "O que acontece quando seu cachorro chega a Singapura depende do anexo dele e do posto de entrada."
  points:
    - en: "Dogs arriving by air are inspected at Changi Animal & Plant Quarantine Station (CAPQ); dogs by land at Tuas Checkpoint."
      fr: "Les chiens arrivant par avion sont inspectés à la station de quarantaine animale et végétale de Changi (CAPQ) ; par voie terrestre au poste de Tuas."
      es: "Los perros que llegan por aire se inspeccionan en la Changi Animal & Plant Quarantine Station (CAPQ); los que llegan por tierra en el paso de Tuas."
      pt: "Os cachorros que chegam de avião são inspecionados na Changi Animal & Plant Quarantine Station (CAPQ); os que chegam por via terrestre, no Tuas Checkpoint."
    - en: "You must book the border inspection at least 5 days before arrival; arriving without an appointment incurs a fee of S$133 per hour or part thereof."
      fr: "Tu dois réserver l'inspection frontalière au moins 5 jours avant l'arrivée ; sans rendez-vous, des frais de 133 S$ par heure entamée s'appliquent."
      es: "Debes reservar la inspección fronteriza al menos 5 días antes de la llegada; llegar sin cita conlleva una tasa de 133 S$ por hora o fracción."
      pt: "Você precisa agendar a inspeção na fronteira pelo menos 5 dias antes da chegada; chegar sem agendamento gera uma taxa de 133 dólares singapurianos por hora ou fração de hora."
    - en: "Present the AVS import licence at check-in; for Schedule I and II origins you also need a captain's declaration form endorsed by the airline."
      fr: "Présente la licence d'importation AVS à l'enregistrement ; pour les origines annexes I et II, un formulaire de déclaration du commandant visé par la compagnie est aussi requis."
      es: "Presenta la licencia de importación del AVS en la facturación; para los orígenes de los Anexos I y II también necesitas un formulario de declaración del comandante refrendado por la aerolínea."
      pt: "Apresente a licença de importação do AVS no check-in; para origens dos Anexos I e II também é preciso um formulário de declaração do comandante (captain’s declaration) endossado pela companhia aérea."
    - en: "Schedule II dogs without the exemption go to home quarantine (minimum 10 days, smart collar tag); Schedule III dogs go to the AQC for at least 30 days."
      fr: "Les chiens de l'annexe II sans exemption partent en quarantaine à domicile (minimum 10 jours, collier connecté) ; les chiens de l'annexe III à l'AQC pendant au moins 30 jours."
      es: "Los perros del Anexo II sin la exención van a cuarentena a domicilio (mínimo 10 días, collar inteligente); los perros del Anexo III van al AQC durante al menos 30 días."
      pt: "Os cachorros do Anexo II sem a isenção vão para quarentena domiciliar (no mínimo 10 dias, com etiqueta inteligente na coleira); os do Anexo III vão para o AQC por pelo menos 30 dias."
    - en: "Large pet containers exceeding 82 x 64 x 58 cm must be collected in person at CAPQ or Tuas, otherwise transfer to a private contractor incurs extra fees."
      fr: "Les grands conteneurs dépassant 82 x 64 x 58 cm doivent être récupérés en personne à CAPQ ou Tuas ; sinon leur transfert à un prestataire privé entraîne des frais supplémentaires."
      es: "Los contenedores grandes para mascotas que superen los 82 x 64 x 58 cm deben recogerse en persona en CAPQ o Tuas; de lo contrario, su traslado a un contratista privado conlleva tasas adicionales."
      pt: "As caixas de transporte grandes, acima de 82 x 64 x 58 cm, precisam ser retiradas pessoalmente no CAPQ ou em Tuas; caso contrário, a transferência para uma empresa privada gera taxas extras."
    - en: "If documents or veterinary conditions are not met, the dog can be refused, quarantined further, re-exported or, for banned breeds, denied entry entirely."
      fr: "Si les documents ou conditions vétérinaires ne sont pas remplis, le chien peut être refusé, mis en quarantaine prolongée, réexpédié ou, pour les races interdites, totalement refusé à l'entrée."
      es: "Si no se cumplen los documentos o las condiciones veterinarias, el perro puede ser rechazado, sometido a cuarentena adicional, reexportado o, en el caso de las razas prohibidas, rechazado por completo en la entrada."
      pt: "Se os documentos ou as condições veterinárias não forem cumpridos, o cachorro pode ser recusado, ficar mais tempo em quarentena, ser reexportado ou, no caso das raças proibidas, ter a entrada totalmente negada."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Singapore lists potentially dangerous breeds in the First Schedule of the Animals and Birds (Licensing and Control of Cats and Dogs) Rules 2024 as 'Specified Dogs', split into Part 1 (banned from import) and Part 2 (allowed with extra conditions)."
    fr: "Singapour liste les races potentiellement dangereuses dans la première annexe des Animals and Birds (Licensing and Control of Cats and Dogs) Rules 2024 (« chiens spécifiés »), réparties en partie 1 (importation interdite) et partie 2 (autorisées sous conditions)."
    es: "Singapur enumera las razas potencialmente peligrosas en el primer anexo de las Animals and Birds (Licensing and Control of Cats and Dogs) Rules 2024 como «perros especificados», divididas en la parte 1 (prohibidas para la importación) y la parte 2 (permitidas con condiciones adicionales)."
    pt: "Singapura lista as raças potencialmente perigosas no First Schedule (primeiro anexo) das Animals and Birds (Licensing and Control of Cats and Dogs) Rules 2024 como “Specified Dogs”, divididas em Parte 1 (proibidas de importação) e Parte 2 (permitidas com condições extras)."
  cat1:
    en: "Banned from import (Part 1): Pit Bull (American Pit Bull Terrier, American Staffordshire Terrier, Staffordshire Bull Terrier, American Bulldog), Akita, Neapolitan Mastiff, Tosa, Dogo Argentino, Fila Brasileiro, Boerboel, Perro de Presa Canario, and crosses of any of these. These breeds are not allowed into Singapore for sale, temporary visit or permanent stay, except those already licensed."
    fr: "Interdits à l'importation (partie 1) : Pit Bull (American Pit Bull Terrier, American Staffordshire Terrier, Staffordshire Bull Terrier, American Bulldog), Akita, Mâtin de Naples, Tosa, Dogo Argentino, Fila Brasileiro, Boerboel, Dogue des Canaries (Perro de Presa Canario) et leurs croisements. Ces races ne sont pas admises à Singapour pour la vente, un séjour temporaire ou permanent, sauf celles déjà licenciées."
    es: "Prohibidos para la importación (parte 1): Pit Bull (American Pit Bull Terrier, American Staffordshire Terrier, Staffordshire Bull Terrier, American Bulldog), Akita, Mastín Napolitano, Tosa, Dogo Argentino, Fila Brasileiro, Boerboel, Perro de Presa Canario, y los cruces de cualquiera de ellos. Estas razas no se admiten en Singapur para la venta, una visita temporal o una estancia permanente, salvo las que ya cuenten con licencia."
    pt: "Proibidas de importação (Parte 1): Pit Bull (American Pit Bull Terrier, American Staffordshire Terrier, Staffordshire Bull Terrier, American Bulldog), Akita, Mastim Napolitano, Tosa, Dogo Argentino, Fila Brasileiro, Boerboel, Perro de Presa Canario e cruzamentos de qualquer uma delas. Essas raças não são admitidas em Singapura para venda, visita temporária ou permanência definitiva, exceto as que já tenham licença."
  cat2:
    en: "Allowed with conditions (Part 2): Bull Terrier, Doberman Pinscher, Rottweiler, German Shepherd and related breeds (Belgian, East European Shepherd), Mastiffs (Bull Mastiff, Cane Corso, Dogue de Bordeaux) and their crosses. These require muzzle and leash in public, third-party insurance of at least S$100,000, a S$2,000 banker's guarantee and training; only one such dog is allowed per non-HDB residence."
    fr: "Autorisés sous conditions (partie 2) : Bull Terrier, Doberman, Rottweiler, Berger allemand et races apparentées (Berger belge, Berger d'Europe de l'Est), Mâtins (Bull Mastiff, Cane Corso, Dogue de Bordeaux) et leurs croisements. Ils exigent muselière et laisse en public, une assurance responsabilité civile d'au moins 100 000 S$, une garantie bancaire de 2 000 S$ et un dressage ; un seul de ces chiens est admis par logement non-HDB."
    es: "Permitidos con condiciones (parte 2): Bull Terrier, Doberman Pinscher, Rottweiler, Pastor Alemán y razas afines (Pastor Belga, Pastor de Europa del Este), Mastines (Bull Mastiff, Cane Corso, Dogue de Bordeaux) y sus cruces. Estos exigen bozal y correa en público, un seguro de responsabilidad civil de al menos 100 000 S$, un aval bancario de 2000 S$ y adiestramiento; solo se permite uno de estos perros por vivienda que no sea HDB."
    pt: "Permitidas com condições (Parte 2): Bull Terrier, Doberman Pinscher, Rottweiler, Pastor Alemão e raças aparentadas (Pastor Belga, Pastor do Leste Europeu), mastins (Bull Mastiff, Cane Corso, Dogue de Bordeaux) e seus cruzamentos. Exigem focinheira e guia em locais públicos, seguro de responsabilidade civil de pelo menos 100.000 dólares singapurianos, garantia bancária de 2.000 dólares singapurianos e treinamento; só é permitido um cachorro desse tipo por residência que não seja do HDB."
  note:
    en: "If you import a mixed or cross-breed dog, you must submit a colour photo of its face and body so AVS can confirm it is not a prohibited breed. HDB flats also restrict which breeds may be kept."
    fr: "Si tu importez un chien croisé ou de type mixte, tu dois fournir une photo couleur de son visage et de son corps afin que l'AVS confirme qu'il ne s'agit pas d'une race interdite. Les logements HDB limitent également les races autorisées."
    es: "Si importas un perro mestizo o de cruce, debes presentar una foto en color de su cara y su cuerpo para que el AVS pueda confirmar que no es de una raza prohibida. Los pisos de HDB también restringen qué razas pueden tenerse."
    pt: "Se você importar um cachorro mestiço ou sem raça definida, precisa enviar uma foto colorida do rosto e do corpo dele para que o AVS confirme que não é de uma raça proibida. Os apartamentos do HDB também restringem quais raças podem ser mantidas."

checklist:
  - en: "ISO 11784/11785 microchip implanted before vaccinations, number on all records"
    fr: "Puce ISO 11784/11785 posée avant les vaccinations, numéro sur tous les documents"
    es: "Microchip ISO 11784/11785 implantado antes de las vacunaciones, con el número en todos los registros"
    pt: "Microchip ISO 11784/11785 implantado antes das vacinações, número em todos os registros"
  - en: "Rabies vaccination + serology test (Schedule II & III origins)"
    fr: "Vaccination antirabique + titrage (origines annexes II et III)"
    es: "Vacunación antirrábica + prueba de serología (orígenes de los Anexos II y III)"
    pt: "Vacinação antirrábica + teste sorológico (origens dos Anexos II e III)"
  - en: "Core vaccinations (distemper, adenovirus type 1, parvovirus type 2) with records"
    fr: "Vaccins de base (Carré, adénovirus type 1, parvovirus type 2) avec enregistrements"
    es: "Vacunas de base (moquillo, adenovirus tipo 1, parvovirus tipo 2) con registros"
    pt: "Vacinas essenciais (cinomose, adenovírus tipo 1, parvovírus tipo 2) com registros"
  - en: "Dog licence on PALS, then AVS import licence via GoBusiness (valid 90 days)"
    fr: "Licence de chien sur PALS, puis licence d'importation AVS via GoBusiness (valable 90 jours)"
    es: "Licencia de perro en PALS, y luego licencia de importación del AVS a través de GoBusiness (válida 90 días)"
    pt: "Licença de cachorro no PALS e, depois, licença de importação do AVS pelo GoBusiness (válida por 90 dias)"
  - en: "Endorsed veterinary health certificate + parasite treatment (2–7 days before export)"
    fr: "Certificat sanitaire vétérinaire visé + traitement antiparasitaire (2 à 7 jours avant l'export)"
    es: "Certificado sanitario veterinario refrendado + tratamiento antiparasitario (2 a 7 días antes de la exportación)"
    pt: "Atestado de saúde veterinário endossado + tratamento antiparasitário (2–7 dias antes da exportação)"
  - en: "Customs GST permit via a local forwarding agent"
    fr: "Permis douanier GST via un transitaire local"
    es: "Permiso aduanero (GST) a través de un agente transitario local"
    pt: "Permissão aduaneira de GST por meio de um agente despachante local"
  - en: "Quarantine space booked (home quarantine or AQC) where required"
    fr: "Place de quarantaine réservée (domicile ou AQC) le cas échéant"
    es: "Plaza de cuarentena reservada (cuarentena a domicilio o AQC) cuando corresponda"
    pt: "Vaga de quarentena reservada (domiciliar ou no AQC) quando exigida"
  - en: "Border inspection appointment booked at least 5 days before arrival"
    fr: "Rendez-vous d'inspection frontalière réservé au moins 5 jours avant l'arrivée"
    es: "Cita de inspección fronteriza reservada al menos 5 días antes de la llegada"
    pt: "Agendamento da inspeção na fronteira feito pelo menos 5 dias antes da chegada"
  - en: "compliant with the applicable requirements crate; confirm your dog is not a Part 1 banned breed"
    fr: "Caisse conforme aux exigences applicables ; vérifie que ton chien n'est pas une race interdite (partie 1)"
    es: "Jaula de transporte; confirma que tu perro no es de una raza prohibida de la parte 1"
    pt: "Caixa de transporte em conformidade com a IATA; confirme que seu cachorro não é de uma raça proibida da Parte 1"

