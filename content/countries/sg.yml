# Country Entry Guide — Singapore (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
# Singapore is NOT in the EU. Source of truth: NParks / Animal & Veterinary Service (AVS).
# The eu/listed/nonListed keys are reused to map Singapore's own rabies-risk schedules:
#   eu = Schedule I, listed = Schedule II, nonListed = Schedule III.
id: country_sg
iso2: "SG"
name: { en: "Singapore", fr: "Singapour", es: "Singapur", pt: "Singapura" }
region: { en: "Asia", fr: "Asie", es: "Asia", pt: "Ásia" }


regime: listed
exit:
  authority: AVS (NParks)
  authorityUrl: https://avs.nparks.gov.sg/pets/importing-exporting-a-pet/export/dogs-and-cats/
  intro:
    en: "Singapore is a listed country, so no rabies titer is needed to return — but AVS (NParks) must endorse the EU health certificate and issue an export licence."
    fr: "Singapour est un pays listé : pas de titrage pour revenir — mais l'AVS (NParks) doit endosser le certificat sanitaire UE et délivrer une licence d'export."
    es: "Singapur es un país listado: no hace falta titulación para volver — pero AVS (NParks) debe refrendar el certificado sanitario UE y emitir una licencia de exportación."
    pt: "Singapura é um país listado, então não é preciso teste sorológico antirrábico para voltar — mas o AVS (NParks) precisa endossar o atestado de saúde da UE e emitir uma licença de exportação."
  steps:
    - timing: longlead
      scope: any
      text:
        en: "Obtain the AVS export licence via the GoBusiness Licensing Portal (valid 90 days), and request the pre-export inspection at least 5 days before departure."
        fr: "Obtiens la licence d'export AVS via le portail GoBusiness Licensing (valable 90 jours), et demande l'inspection pré-export au moins 5 jours avant le départ."
        es: "Obtén la licencia de exportación de AVS a través del GoBusiness Licensing Portal (válida 90 días) y solicita la inspección previa a la exportación al menos 5 días antes de salir."
        pt: "Obtenha a licença de exportação do AVS pelo GoBusiness Licensing Portal (válida por 90 dias) e solicite a inspeção pré-exportação pelo menos 5 dias antes da partida."
    - timing: window
      scope: eu
      text:
        en: "A licensed vet completes the EU health certificate; AVS then endorses it (allow about 2 working days — no express service for endorsement)."
        fr: "Un vétérinaire agréé remplit le certificat sanitaire UE ; l'AVS l'endosse ensuite (compte ~2 jours ouvrés — pas de service express pour l'endossement)."
        es: "Un veterinario autorizado rellena el certificado sanitario UE; luego AVS lo refrenda (calcula ~2 días hábiles — sin servicio exprés para el refrendo)."
        pt: "Um veterinário credenciado preenche o atestado de saúde da UE; em seguida o AVS o endossa (conte cerca de 2 dias úteis — não há serviço expresso para o endosso)."
  onSiteNote:
    en: "Plan the licence and endorsement together — neither is instant, and the endorsement has no express option."
    fr: "Planifie la licence et l'endossement ensemble — aucun n'est instantané, et l'endossement n'a pas d'option express."
    es: "Planifica la licencia y el refrendo juntos — ninguno es inmediato, y el refrendo no tiene opción exprés."
    pt: "Planeje a licença e o endosso juntos — nenhum dos dois é imediato, e o endosso não tem opção expressa."

hero:
  h1: { en: "Traveling to Singapore with your dog", fr: "Voyager à Singapour avec ton chien", es: "Viajar a Singapur con tu perro", pt: "Viajar para Singapura com seu cachorro" }
  intro:
    en: >-
      Singapore welcomes dogs, but it runs its own import scheme through the Animal & Veterinary Service
      (AVS, part of NParks) — not the EU framework. What you must prepare depends mainly on the country your
      dog is travelling from, which AVS sorts into three rabies-risk schedules. Every dog needs an ISO
      microchip, a dog licence and an AVS import licence. Dogs from Schedule I countries (Australia, New
      Zealand, Ireland, the UK) skip the rabies blood test and quarantine. Dogs from Schedule II countries
      (most of the EU, the USA, Canada, Japan and others) need a rabies vaccination and a serology test, and
      often a short home quarantine. Dogs from any other country (Schedule III) face a rabies antibody test and a
      minimum 30-day quarantine. Some breeds are banned outright. This guide explains each case.
    fr: >-
      Singapour accueille les chiens, mais applique son propre régime d'importation via l'Animal & Veterinary
      Service (AVS, rattaché à NParks) — et non le cadre européen. Ce qu'il faut préparer dépend surtout du
      pays d'où ton chien voyage, que l'AVS classe en trois annexes selon le risque rabique. Tout chien doit
      avoir une puce ISO, une licence de chien et une licence d'importation AVS. Les chiens des pays de
      l'annexe I (Australie, Nouvelle-Zélande, Irlande, Royaume-Uni) évitent la prise de sang rabique et la
      quarantaine. Les chiens de l'annexe II (une grande partie de l'UE, les États-Unis, le Canada, le Japon…)
      ont besoin d'une vaccination antirabique et d'un titrage, et souvent d'une courte quarantaine à domicile.
      Les chiens de tout autre pays (annexe III) subissent un titrage et une quarantaine d'au moins 30 jours.
      Certaines races sont interdites. Ce guide détaille chaque cas.
    es: >-
      Singapur acoge a los perros, pero aplica su propio régimen de importación a través del Animal &
      Veterinary Service (AVS, parte de NParks) — no el marco europeo. Lo que debes preparar depende sobre
      todo del país desde el que viaja tu perro, que el AVS clasifica en tres anexos según el riesgo de
      rabia. Cada perro necesita un microchip ISO, una licencia de perro y una licencia de importación del
      AVS. Los perros de los países del Anexo I (Australia, Nueva Zelanda, Irlanda, el Reino Unido) se
      libran de la prueba de sangre de rabia y de la cuarentena. Los perros de los países del Anexo II
      (gran parte de la UE, EE. UU., Canadá, Japón y otros) necesitan una vacunación antirrábica y una
      prueba de serología, y a menudo una corta cuarentena a domicilio. Los perros de cualquier otro país
      (Anexo III) se enfrentan a una prueba de titulación de rabia y a una cuarentena mínima de 30 días.
      Algunas razas están totalmente prohibidas. Esta guía explica cada caso.

    pt: "Singapura recebe bem os cachorros, mas aplica seu próprio regime de importação por meio do Animal & Veterinary Service (AVS, ligado ao NParks) — e não o quadro europeu. O que você precisa preparar depende principalmente do país de onde seu cachorro está viajando, que o AVS classifica em três anexos conforme o risco de raiva. Todo cachorro precisa de microchip ISO, licença de cachorro e licença de importação do AVS. Os cachorros vindos de países do Anexo I (Austrália, Nova Zelândia, Irlanda, Reino Unido) dispensam o exame de sangue para raiva e a quarentena. Os cachorros de países do Anexo II (grande parte da UE, Estados Unidos, Canadá, Japão e outros) precisam de vacinação antirrábica e de teste sorológico, e muitas vezes de uma curta quarentena domiciliar. Os cachorros de qualquer outro país (Anexo III) enfrentam um teste sorológico antirrábico e uma quarentena mínima de 30 dias. Algumas raças são totalmente proibidas. Este guia explica cada caso."
difficulty:
  level: difficult
  label: { en: "Moderate to difficult (depends on origin)", fr: "Modéré à difficile (selon l'origine)", es: "De moderado a difícil (según el origen)", pt: "De moderado a difícil (depende da origem)" }

prepTime:
  eu:
    en: "Schedule I (Australia, NZ, Ireland, UK): a few weeks — no blood test and no quarantine, just microchip, core vaccinations, licences and a health certificate."
    fr: "Annexe I (Australie, N.-Zélande, Irlande, R.-Uni) : quelques semaines — pas de prise de sang ni de quarantaine, seulement puce, vaccins de base, licences et certificat sanitaire."
    es: "Anexo I (Australia, N. Zelanda, Irlanda, R. Unido): unas semanas — sin prueba de sangre ni cuarentena, solo microchip, vacunas de base, licencias y un certificado sanitario."
    pt: "Anexo I (Austrália, N. Zelândia, Irlanda, R. Unido): algumas semanas — sem exame de sangue e sem quarentena, apenas microchip, vacinas essenciais, licenças e um atestado de saúde."
  listed:
    en: "Schedule II (most EU, USA, Canada, Japan…): about 4–5 months — serology at least 28 days after vaccination, then a 90-day wait before export; often a 10-day home quarantine."
    fr: "Annexe II (une grande partie de l'UE, USA, Canada, Japon…) : environ 4–5 mois — titrage au moins 28 jours après le vaccin, puis attente de 90 jours avant l'export ; souvent 10 jours de quarantaine à domicile."
    es: "Anexo II (gran parte de la UE, EE. UU., Canadá, Japón…): unos 4–5 meses — serología al menos 28 días después de la vacuna, y luego una espera de 90 días antes de la exportación; a menudo 10 días de cuarentena a domicilio."
    pt: "Anexo II (grande parte da UE, EUA, Canadá, Japão…): cerca de 4–5 meses — sorologia pelo menos 28 dias depois da vacinação e, em seguida, espera de 90 dias antes da exportação; muitas vezes 10 dias de quarentena domiciliar."
  nonListed:
    en: "Schedule III (all other countries): about 4–6 months plus a minimum 30-day quarantine at the AQC on arrival, with a rabies re-vaccination on arrival."
    fr: "Annexe III (tous les autres pays) : environ 4–6 mois plus une quarantaine minimale de 30 jours à l'AQC à l'arrivée, avec une revaccination antirabique à l'arrivée."
    es: "Anexo III (todos los demás países): unos 4–6 meses más una cuarentena mínima de 30 días en el AQC a la llegada, con una revacunación antirrábica a la llegada."
    pt: "Anexo III (todos os outros países): cerca de 4–6 meses mais uma quarentena mínima de 30 dias no AQC na chegada, com revacinação antirrábica na chegada."

