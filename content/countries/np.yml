# Country Entry Guide — Nepal (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
# Nepal is NOT in the EU and does not use the EU pet-passport system. Animal imports are
# governed by the Animal Health and Livestock Services Act, 2055 (1999) and the Animal Health
# and Livestock Services Rules, 2056 (2000), administered by the Department of Livestock Services
# (DLS) Animal Quarantine Division (national technical authority in the animal quarantine sector).
# Official pet documentation published by the Government of Nepal (Embassy of Nepal, London —
# "Taking Pets to Nepal") is limited to: (a) a veterinary health certificate issued within 10 days
# of arrival, valid 30 days; (b) a rabies vaccination card; (c) advance notification of the Animal
# Quarantine Office at Kathmandu (Tribhuvan International Airport, TIA) 72 hours before arrival, by
# email (ktmquarantine@gmail.com). Nepal is rabies-endemic. Several details that other countries
# publish (a fixed microchip standard, a specific rabies interval, a rabies antibody test, parasite
# treatment, minimum age, breed restrictions) are NOT published in the official Nepali sources
# reviewed, and are therefore marked Unknown / not specified rather than guessed.
# The eu/listed/nonListed slots are repurposed to Nepal's practical paths, since Nepal applies a
# single national scheme to every dog regardless of the EU/listed distinction.
id: country_np
iso2: "NP"
name: { en: "Nepal", fr: "Népal", es: "Nepal", pt: "Nepal" }
region: { en: "South Asia", fr: "Asie du Sud", es: "Asia del Sur", pt: "Ásia do Sul" }


regime: non_listed
exit:
  authority: DLS
  authorityUrl: https://dls.gov.np
  intro:
    en: "Nepal is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Department of Livestock Services / Animal Quarantine."
    fr: "Le Népal est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par le Department of Livestock Services / la quarantaine animale."
    es: "Nepal no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el Department of Livestock Services / la cuarentena animal."
    pt: "O Nepal é um país não listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para retornar à UE — além de um atestado de saúde de exportação endossado pelo Department of Livestock Services / Animal Quarantine."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "A licensed vet in Kathmandu completes the health certificate, which the DLS Animal Quarantine Office endorses; the international certificate is generally issued within 30 days of travel."
        fr: "Un vétérinaire agréé à Katmandou remplit le certificat sanitaire, que le bureau de quarantaine animale du DLS vise ; le certificat international est généralement délivré dans les 30 jours du voyage."
        es: "Un veterinario autorizado en Katmandú rellena el certificado sanitario, que la oficina de cuarentena animal del DLS refrenda; el certificado internacional se emite normalmente dentro de los 30 días del viaje."
        pt: "Um veterinário licenciado em Kathmandu preenche o atestado de saúde, que o Animal Quarantine Office do DLS endossa; o certificado internacional geralmente é emitido dentro de 30 dias antes da viagem."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Nepal with your dog", fr: "Voyager au Népal avec ton chien", es: "Viajar a Nepal con tu perro", pt: "Viajar para o Nepal com seu cachorro" }
  intro:
    en: >-
      Nepal welcomes pet dogs, but it runs its own national scheme through the Department of Livestock
      Services (DLS) Animal Quarantine Division — not the EU pet-passport framework. Imports are governed
      by the Animal Health and Livestock Services Act, 2055 (1999) and its Rules, 2056 (2000): every animal
      must enter through a quarantine check post and may only be cleared once a quarantine officer has
      examined it. The official pet documentation published by the Government of Nepal is a veterinary
      health certificate issued within ten days of arrival (valid thirty days) plus a rabies vaccination
      card, and you must notify the Animal Quarantine Office at Kathmandu airport 72 hours before you land.
      Nepal is rabies-endemic, so a valid rabies vaccination is essential. Several finer details are not
      published in the official sources, so confirm them with the Animal Quarantine Office and your vet.
      What you must prepare also depends on your dog's country of origin and travel history — read this guide before booking.
    fr: >-
      Le Népal accueille les chiens de compagnie, mais applique son propre régime national via la Division
      de quarantaine animale du Department of Livestock Services (DLS) — et non le cadre du passeport
      européen. Les importations relèvent de l'Animal Health and Livestock Services Act, 2055 (1999) et de
      ses Rules, 2056 (2000) : tout animal doit entrer par un poste de quarantaine et n'est dédouané qu'après
      examen par un agent de quarantaine. La documentation officielle publiée par le Gouvernement du Népal se
      compose d'un certificat sanitaire vétérinaire établi dans les dix jours avant l'arrivée (valable trente
      jours) et d'une carte de vaccination antirabique, et tu dois prévenir le Bureau de quarantaine animale
      de l'aéroport de Katmandou 72 heures avant l'atterrissage. Le Népal est un pays d'endémie rabique : une
      vaccination antirabique valide est donc indispensable. Plusieurs détails ne sont pas publiés dans les
      sources officielles : confirme-les auprès du Bureau de quarantaine et de ton vétérinaire. Ce que tu
      devez préparer dépend aussi de l'origine et de l'historique de ton chien — lis ce guide avant de réserver.
    es: >-
      Nepal acoge a los perros de compañía, pero aplica su propio régimen nacional a través de la División de
      Cuarentena Animal del Department of Livestock Services (DLS) — no el marco del pasaporte europeo para
      mascotas. Las importaciones se rigen por la Animal Health and Livestock Services Act, 2055 (1999) y sus
      Rules, 2056 (2000): todo animal debe entrar por un puesto de cuarentena y solo puede despacharse una vez
      que un agente de cuarentena lo ha examinado. La documentación oficial para mascotas publicada por el
      Gobierno de Nepal es un certificado sanitario veterinario expedido dentro de los diez días previos a la
      llegada (válido treinta días) más una cartilla de vacunación antirrábica, y debes avisar a la Oficina de
      Cuarentena Animal del aeropuerto de Katmandú 72 horas antes de aterrizar. Nepal tiene rabia endémica, por
      lo que una vacunación antirrábica válida es esencial. Varios detalles más finos no están publicados en las
      fuentes oficiales, así que confírmalos con la Oficina de Cuarentena Animal y tu veterinario. Lo que debes
      preparar depende también del país de origen y el historial de viajes de tu perro — lee esta guía antes de reservar.

    pt: "O Nepal recebe cachorros de estimação, mas aplica seu próprio esquema nacional por meio da Animal Quarantine Division do Department of Livestock Services (DLS) — e não o marco do passaporte de animal de estimação da UE. As importações são regidas pelo Animal Health and Livestock Services Act, 2055 (1999) e suas Rules, 2056 (2000): todo animal precisa entrar por um posto de controle de quarentena e só pode ser liberado depois que um agente de quarentena o examinar. A documentação oficial para animais de estimação publicada pelo Governo do Nepal é um atestado de saúde veterinário emitido dentro de dez dias antes da chegada (válido por trinta dias), além de uma carteira de vacinação antirrábica, e você precisa notificar o Animal Quarantine Office no aeroporto de Kathmandu 72 horas antes de pousar. O Nepal é endêmico de raiva, portanto uma vacinação antirrábica válida é essencial. Vários detalhes mais específicos não são publicados nas fontes oficiais, então confirme-os com o Animal Quarantine Office e o seu veterinário. O que você precisa preparar também depende do país de origem do seu cachorro e do histórico de viagens — leia este guia antes de reservar."
difficulty:
  level: moderate
  label: { en: "Moderate — health certificate, rabies card and advance quarantine notice", fr: "Modéré — certificat sanitaire, carte antirabique et préavis de quarantaine", es: "Moderado — certificado sanitario, cartilla antirrábica y aviso previo de cuarentena", pt: "Moderado — atestado de saúde, carteira antirrábica e notificação prévia à quarentena" }

prepTime:
  eu:
    en: "Dog from the EU: ~2–4 weeks — the EU pet passport is not used, but a valid rabies vaccination and a veterinary health certificate issued within 10 days of arrival are enough, plus a 72-hour advance notice to the Animal Quarantine Office."
    fr: "Chien venant de l'UE : ~2 à 4 semaines — le passeport européen n'est pas utilisé, mais une vaccination antirabique valide et un certificat sanitaire vétérinaire établi dans les 10 jours avant l'arrivée suffisent, plus un préavis de 72 heures au Bureau de quarantaine animale."
    es: "Perro procedente de la UE: ~2–4 semanas — el pasaporte europeo para mascotas no se utiliza, pero bastan una vacunación antirrábica válida y un certificado sanitario veterinario expedido dentro de los 10 días previos a la llegada, más un aviso previo de 72 horas a la Oficina de Cuarentena Animal."
    pt: "Cachorro vindo da UE: cerca de 2 a 4 semanas — o passaporte de animal de estimação da UE não é usado, mas uma vacinação antirrábica válida e um atestado de saúde veterinário emitido dentro de 10 dias antes da chegada bastam, além de uma notificação prévia de 72 horas ao Animal Quarantine Office."
  listed:
    en: "Dog from another country: ~2–4 weeks — the same national procedure applies: rabies vaccination card, health certificate issued within 10 days of arrival (valid 30 days) and 72-hour advance notice to the Animal Quarantine Office."
    fr: "Chien venant d'un autre pays : ~2 à 4 semaines — la même procédure nationale s'applique : carte de vaccination antirabique, certificat sanitaire établi dans les 10 jours avant l'arrivée (valable 30 jours) et préavis de 72 heures au Bureau de quarantaine animale."
    es: "Perro procedente de otro país: ~2–4 semanas — se aplica el mismo procedimiento nacional: cartilla de vacunación antirrábica, certificado sanitario expedido dentro de los 10 días previos a la llegada (válido 30 días) y aviso previo de 72 horas a la Oficina de Cuarentena Animal."
    pt: "Cachorro vindo de outro país: cerca de 2 a 4 semanas — o mesmo procedimento nacional se aplica: carteira de vacinação antirrábica, atestado de saúde emitido dentro de 10 dias antes da chegada (válido por 30 dias) e notificação prévia de 72 horas ao Animal Quarantine Office."
  nonListed:
    en: "Non-compliant arrival, 3+ animals, or a dog that is not healthy on inspection: plan extra time — the Act allows an import permit / quarantine-check-post regime and discretionary quarantine, and a dog without the required certificate can be held, returned or destroyed."
    fr: "Arrivée non conforme, 3 animaux ou plus, ou chien jugé non sain à l'inspection : prévois du temps supplémentaire — la loi prévoit un régime de permis d'importation / poste de quarantaine et une quarantaine discrétionnaire, et un chien sans le certificat requis peut être retenu, renvoyé ou détruit."
    es: "Llegada no conforme, 3 o más animales, o un perro que no esté sano en la inspección: prevé tiempo adicional — la Ley admite un régimen de permiso de importación / puesto de cuarentena y una cuarentena discrecional, y un perro sin el certificado exigido puede ser retenido, devuelto o sacrificado."
    pt: "Chegada em não conformidade, 3 ou mais animais, ou um cachorro que não esteja saudável na inspeção: planeje tempo extra — a lei prevê um regime de autorização de importação / posto de controle de quarentena e quarentena discricionária, e um cachorro sem o certificado exigido pode ficar retido, ser devolvido ou sacrificado."

