# Country Entry Guide — Bangladesh (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
# Bangladesh is NOT in the EU. It runs its own national scheme through the Department of
# Livestock Services (DLS), Ministry of Fisheries and Livestock. A pet dog is imported under a
# "No Objection Certificate (NOC) for Pet Animal Companion", applied for online on the DLS
# e-Trade portal (etrade.dls.gov.bd). The NOC application records the microchip number and
# requires: a vaccination certificate + vaccination card, an official health certificate from the
# origin country's veterinarian, a passport copy, a visa copy and a colour photo of the pet.
# A pre-arrival notification and a DLS quarantine certificate complete the process on arrival at
# Hazrat Shahjalal International Airport (HSIA), Dhaka. DLS does NOT publish a rabies antibody
# test requirement, a fixed rabies-vaccination window, a parasite-treatment rule, a minimum age
# or a quarantine duration — those are marked Unknown. No breed-import ban is published by DLS.
# USDA APHIS lists no dog export requirements for Bangladesh (only bovine embryos): the importer
# must obtain the DLS import permit/NOC, which sets the conditions.
# The eu/listed/nonListed slots are repurposed to Bangladesh's practical paths:
# eu = accompanied pet dog (checked baggage/cabin) — standard NOC path;
# listed = unaccompanied / air-cargo import — NOC plus pre-arrival notification;
# nonListed = incomplete documents or non-compliant arrival — risk of quarantine/refusal.
id: country_bd
iso2: "BD"
name: { en: "Bangladesh", fr: "Bangladesh", es: "Bangladés", pt: "Bangladesh" }
region: { en: "South Asia", fr: "Asie du Sud", es: "Asia meridional", pt: "Ásia do Sul" }


regime: non_listed
exit:
  authority: DLS
  authorityUrl: http://www.dls.gov.bd
  intro:
    en: "Bangladesh is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Department of Livestock Services (DLS)."
    fr: "Le Bangladesh est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par le Department of Livestock Services (DLS)."
    es: "Bangladés no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el Department of Livestock Services (DLS)."
    pt: "Bangladesh é um país não listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para retornar à UE — além de um atestado de saúde de exportação endossado pelo Department of Livestock Services (DLS)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "A DLS government veterinary officer issues the export health certificate, typically endorsing a licensed vet's health certificate before departure."
        fr: "Un vétérinaire officiel du DLS délivre le certificat sanitaire d'export, en visant généralement le certificat d'un vétérinaire agréé avant le départ."
        es: "Un veterinario oficial del DLS emite el certificado sanitario de exportación, normalmente refrendando el certificado de un veterinario autorizado antes de salir."
        pt: "Um veterinário oficial do governo do DLS emite o atestado de saúde de exportação, geralmente endossando o atestado de saúde de um veterinário licenciado antes da partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Bangladesh with your dog", fr: "Voyager au Bangladesh avec ton chien", es: "Viajar a Bangladés con tu perro", pt: "Viajar para Bangladesh com seu cachorro" }
  intro:
    en: >-
      Bangladesh welcomes pet dogs, but it runs its own national import scheme through the Department of
      Livestock Services (DLS), under the Ministry of Fisheries and Livestock — not the EU framework.
      Before your dog travels, you must obtain a No Objection Certificate (NOC) for a Pet Animal Companion,
      applied for online on the DLS e-Trade portal. The application records your dog's microchip number and
      requires a vaccination certificate and vaccination card, an official health certificate issued by the
      veterinarian of the country you are coming from, a copy of your passport and visa, and a colour photo
      of the pet. On arrival at Hazrat Shahjalal International Airport in Dhaka, the pet is handled through
      DLS animal quarantine. Bangladesh is a rabies-endemic country, so a valid rabies vaccination is
      expected, but several specifics — exact vaccination timing, any quarantine period and minimum age —
      are not published officially. What you must prepare depends on your dog's country of origin and travel
      history, so read this guide, then confirm the current conditions with DLS before you book.
    fr: >-
      Le Bangladesh accueille les chiens de compagnie, mais applique son propre régime d'importation via le
      Department of Livestock Services (DLS), rattaché au Ministère de la Pêche et de l'Élevage — et non le
      cadre européen. Avant le voyage, tu dois obtenir un No Objection Certificate (NOC) pour animal de
      compagnie, à demander en ligne sur le portail e-Trade du DLS. La demande enregistre le numéro de puce
      de ton chien et exige un certificat de vaccination et un carnet de vaccination, un certificat
      sanitaire officiel établi par le vétérinaire du pays d'où tu viens, une copie de ton passeport et
      de ton visa, et une photo couleur de l'animal. À l'arrivée à l'aéroport international Hazrat
      Shahjalal de Dhaka, l'animal est pris en charge par la quarantaine animale du DLS. Le Bangladesh est
      un pays où la rage est endémique : une vaccination antirabique valide est donc attendue, mais
      plusieurs points précis — calendrier exact de vaccination, éventuelle quarantaine, âge minimum — ne
      sont pas publiés officiellement. Ce que tu dois préparer dépend de l'origine et de l'historique de
      ton chien : lis ce guide, puis confirme les conditions en vigueur auprès du DLS avant de réserver.
    es: >-
      Bangladés acoge a los perros de compañía, pero aplica su propio régimen nacional de importación a
      través del Department of Livestock Services (DLS), dependiente del Ministerio de Pesca y Ganadería —
      y no el marco europeo. Antes de que tu perro viaje, debes obtener un No Objection Certificate (NOC)
      para animal de compañía, que se solicita en línea en el portal e-Trade del DLS. La solicitud registra
      el número de microchip de tu perro y exige un certificado de vacunación y una cartilla de vacunación,
      un certificado sanitario oficial expedido por el veterinario del país del que vienes, una copia de tu
      pasaporte y de tu visado, y una foto en color de la mascota. A la llegada al aeropuerto internacional
      Hazrat Shahjalal de Daca, la mascota es atendida por la cuarentena animal del DLS. Bangladés es un
      país con rabia endémica, por lo que se espera una vacunación antirrábica válida, pero varios detalles
      concretos — calendario exacto de vacunación, cualquier periodo de cuarentena y edad mínima — no se
      publican oficialmente. Lo que debes preparar depende del país de origen y del historial de viajes de
      tu perro, así que lee esta guía y luego confirma las condiciones vigentes con el DLS antes de reservar.

    pt: "Bangladesh recebe cachorros de estimação, mas aplica seu próprio esquema nacional de importação por meio do Department of Livestock Services (DLS), vinculado ao Ministério da Pesca e Pecuária — e não o marco da UE. Antes de o seu cachorro viajar, você precisa obter um No Objection Certificate (NOC) para Pet Animal Companion, solicitado on-line no portal DLS e-Trade. O pedido registra o número do microchip do seu cachorro e exige um certificado de vacinação e a carteira de vacinação, um atestado de saúde oficial emitido pelo veterinário do país de onde você está vindo, uma cópia do seu passaporte e visto, e uma foto colorida do animal. Na chegada ao Hazrat Shahjalal International Airport, em Dhaka, o animal é encaminhado à quarentena animal do DLS. Bangladesh é um país endêmico de raiva, portanto uma vacinação antirrábica válida é esperada, mas vários detalhes — o momento exato da vacinação, qualquer período de quarentena e a idade mínima — não são publicados oficialmente. O que você precisa preparar depende do país de origem do seu cachorro e do histórico de viagens, então leia este guia e depois confirme as condições atuais com o DLS antes de reservar."
difficulty:
  level: moderate
  label: { en: "Moderate — DLS import NOC and arrival quarantine handling", fr: "Modéré — NOC d'importation du DLS et prise en charge en quarantaine à l'arrivée", es: "Moderado — NOC de importación del DLS y gestión de cuarentena a la llegada", pt: "Moderado — NOC de importação do DLS e quarentena na chegada" }

prepTime:
  eu:
    en: "Accompanied pet dog (standard NOC path): allow ~2–4 weeks — apply online for the DLS NOC with the microchip number, vaccination certificate and card, an official health certificate, and passport/visa copies, then send a pre-arrival notification before travel."
    fr: "Chien de compagnie accompagné (parcours NOC standard) : compte ~2 à 4 semaines — demande en ligne du NOC du DLS avec le numéro de puce, le certificat et le carnet de vaccination, un certificat sanitaire officiel et les copies de passeport/visa, puis notification de pré-arrivée avant le voyage."
    es: "Perro de compañía acompañado (vía NOC estándar): cuenta con ~2 a 4 semanas — solicita en línea el NOC del DLS con el número de microchip, el certificado y la cartilla de vacunación, un certificado sanitario oficial y las copias de pasaporte/visado, y luego envía una notificación previa a la llegada antes del viaje."
    pt: "Cachorro acompanhado (caminho padrão do NOC): reserve cerca de 2 a 4 semanas — solicite on-line o NOC do DLS com o número do microchip, o certificado e a carteira de vacinação, um atestado de saúde oficial e cópias do passaporte/visto, depois envie a notificação prévia de chegada antes da viagem."
  listed:
    en: "Unaccompanied / air-cargo import: allow more time — the same DLS NOC applies, plus a pre-arrival/shipment notification and coordination with the carrier and DLS animal quarantine at Dhaka airport."
    fr: "Import non accompagné / en fret aérien : prévois davantage de temps — le même NOC du DLS s'applique, plus une notification de pré-arrivée/expédition et une coordination avec la compagnie et la quarantaine animale du DLS à l'aéroport de Dhaka."
    es: "Importación no acompañada / en carga aérea: prevé más tiempo — se aplica el mismo NOC del DLS, más una notificación previa a la llegada/al envío y coordinación con la aerolínea y la cuarentena animal del DLS en el aeropuerto de Daca."
    pt: "Importação desacompanhada / como carga aérea: reserve mais tempo — o mesmo NOC do DLS se aplica, além de uma notificação prévia de chegada/embarque e da coordenação com a companhia aérea e a quarentena animal do DLS no aeroporto de Dhaka."
  nonListed:
    en: "Incomplete documents or a non-compliant arrival: plan extra time and cost — a dog arriving without a valid NOC, matching microchip, health certificate or vaccination records may be held for post-entry quarantine or refused; timelines are decided by DLS case by case."
    fr: "Documents incomplets ou arrivée non conforme : prévois du temps et des frais supplémentaires — un chien arrivant sans NOC valide, sans puce correspondante, sans certificat sanitaire ni carnet de vaccination peut être placé en quarantaine post-entrée ou refusé ; les délais sont fixés au cas par cas par le DLS."
    es: "Documentos incompletos o una llegada no conforme: prevé tiempo y costes adicionales — un perro que llega sin un NOC válido, sin un microchip que coincida, sin certificado sanitario ni cartilla de vacunación puede quedar retenido en cuarentena posterior a la entrada o ser rechazado; los plazos los decide el DLS caso por caso."
    pt: "Documentos incompletos ou chegada em não conformidade: preveja tempo e custo extras — um cachorro que chega sem um NOC válido, sem microchip correspondente, sem atestado de saúde ou registros de vacinação pode ficar retido para quarentena pós-entrada ou ser recusado; os prazos são decididos pelo DLS caso a caso."

