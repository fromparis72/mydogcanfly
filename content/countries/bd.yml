  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact steps depend on three things — Bangladesh (your destination) is only the first."
    fr: "Les étapes exactes dépendent de trois éléments — le Bangladesh (ta destination) n'est que le premier."
    es: "Los pasos exactos dependen de tres factores — Bangladés (tu destino) es solo el primero."
    pt: "As etapas exatas dependem de três fatores — Bangladesh (seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Bangladesh", fr: "Pays de destination — Bangladesh", es: "País de destino — Bangladés", pt: "País de destino — Bangladesh" }
      text:
        en: "Bangladesh runs its own DLS scheme: a No Objection Certificate for a Pet Animal Companion applied for online, a recorded microchip number, a vaccination certificate and card, an official health certificate, and handling by DLS animal quarantine at Dhaka airport. It does not use the EU pet-passport system."
        fr: "Le Bangladesh applique son propre régime DLS : un No Objection Certificate pour animal de compagnie demandé en ligne, un numéro de puce consigné, un certificat et un carnet de vaccination, un certificat sanitaire officiel, et une prise en charge par la quarantaine animale du DLS à l'aéroport de Dhaka. Il n'utilise pas le passeport européen."
        es: "Bangladés aplica su propio régimen del DLS: un No Objection Certificate para animal de compañía solicitado en línea, un número de microchip registrado, un certificado y una cartilla de vacunación, un certificado sanitario oficial, y la gestión por parte de la cuarentena animal del DLS en el aeropuerto de Daca. No utiliza el sistema del pasaporte europeo para mascotas."
        pt: "Bangladesh aplica seu próprio esquema do DLS: um No Objection Certificate para Pet Animal Companion solicitado on-line, um número de microchip registrado, um certificado e carteira de vacinação, um atestado de saúde oficial, e o encaminhamento à quarentena animal do DLS no aeroporto de Dhaka. O país não usa o sistema de passaporte para animais de estimação da UE."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The health certificate and vaccination records must be issued by the veterinary surgeon or specialist of the country you are travelling from. Bangladesh is rabies-endemic, so a valid rabies vaccination from the origin country is expected, and your dog's origin shapes what the origin vet must certify."
        fr: "Le certificat sanitaire et le carnet de vaccination doivent être établis par le vétérinaire ou le spécialiste du pays d'où tu voyages. Le Bangladesh étant un pays d'endémie rabique, une vaccination antirabique valide du pays d'origine est attendue, et l'origine de ton chien détermine ce que le vétérinaire d'origine doit certifier."
        es: "El certificado sanitario y la cartilla de vacunación deben ser expedidos por el veterinario o el especialista del país desde el que viajas. Como Bangladés tiene rabia endémica, se espera una vacunación antirrábica válida del país de origen, y el origen de tu perro determina lo que el veterinario de origen debe certificar."
        pt: "O atestado de saúde e os registros de vacinação precisam ser emitidos pelo médico-veterinário ou especialista do país de onde você está viajando. Bangladesh é endêmico de raiva, portanto uma vacinação antirrábica válida vinda do país de origem é esperada, e a origem do seu cachorro determina o que o veterinário de origem precisa atestar."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "Your dog's disease exposure and travel history can affect what DLS asks for and how the animal is handled on arrival. DLS quarantine officers may hold a dog for post-entry quarantine if its health, identity or paperwork raises a concern — regardless of the last airport."
        fr: "L'exposition aux maladies et l'historique de voyage de ton chien peuvent influer sur ce que demande le DLS et sur la prise en charge à l'arrivée. Les agents de quarantaine du DLS peuvent retenir un chien en quarantaine post-entrée si sa santé, son identité ou ses documents suscitent une inquiétude — quel que soit le dernier aéroport."
        es: "La exposición a enfermedades y el historial de viajes de tu perro pueden influir en lo que pide el DLS y en cómo se gestiona al animal a la llegada. Los agentes de cuarentena del DLS pueden retener a un perro en cuarentena posterior a la entrada si su salud, su identidad o su documentación generan preocupación — sea cual sea el último aeropuerto."
        pt: "A exposição a doenças e o histórico de viagens do seu cachorro podem afetar o que o DLS exige e como o animal é tratado na chegada. Os agentes de quarentena do DLS podem reter um cachorro para quarentena pós-entrada se a saúde, a identidade ou a documentação levantarem alguma dúvida — independentemente do último aeroporto."
  note:
    en: "So read the requirements below as Bangladesh's framework, then confirm your dog's exact origin, history and timeline with your vet and DLS before you book."
    fr: "Lis donc les exigences ci-dessous comme le cadre bangladais, puis confirme l'origine, l'historique et le calendrier exacts de ton chien avec ton vétérinaire et le DLS avant de réserver."
    es: "Así que lee los requisitos siguientes como el marco de Bangladés y luego confirma el origen, el historial y el calendario exactos de tu perro con tu veterinario y el DLS antes de reservar."
    pt: "Portanto, leia as exigências abaixo como o marco de Bangladesh e depois confirme com o seu veterinário e o DLS a origem, o histórico e o cronograma exatos do seu cachorro antes de reservar."

