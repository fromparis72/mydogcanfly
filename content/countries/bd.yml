notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian and Bangladesh's Department of Livestock Services (DLS) can confirm the exact procedure for your individual dog."
    fr: "Seuls un vétérinaire et le Department of Livestock Services (DLS) du Bangladesh peuvent confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario y el Department of Livestock Services (DLS) de Bangladés pueden confirmar el procedimiento exacto para tu perro."
    pt: "Só um veterinário e o Department of Livestock Services (DLS) de Bangladesh podem confirmar o procedimento exato para o seu cachorro."
  - en: "The DLS import NOC must be obtained before departure — apply online on the DLS e-Trade portal and send the pre-arrival notification."
    fr: "Le NOC d'importation du DLS doit être obtenu avant le départ — demande en ligne sur le portail e-Trade du DLS et envoi de la notification de pré-arrivée."
    es: "El NOC de importación del DLS debe obtenerse antes de la salida — solicítalo en línea en el portal e-Trade del DLS y envía la notificación previa a la llegada."
    pt: "O NOC de importação do DLS precisa ser obtido antes da partida — solicite on-line no portal DLS e-Trade e envie a notificação prévia de chegada."
  - en: "Several specifics — exact vaccination timing, quarantine duration and minimum age — are not published officially; confirm them with DLS."
    fr: "Plusieurs points précis — calendrier exact de vaccination, durée de quarantaine et âge minimum — ne sont pas publiés officiellement ; confirme-les auprès du DLS."
    es: "Varios detalles concretos — calendario exacto de vacunación, duración de la cuarentena y edad mínima — no se publican oficialmente; confírmalos con el DLS."
    pt: "Vários detalhes — o momento exato da vacinação, a duração da quarentena e a idade mínima — não são publicados oficialmente; confirme-os com o DLS."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
