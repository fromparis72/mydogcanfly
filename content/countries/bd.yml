  - item: { en: "Import NOC (DLS)", fr: "NOC d'import (DLS)", es: "NOC de importación (DLS)", pt: "NOC de importação (DLS)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "A No Objection Certificate for a Pet Animal Companion (Import) must be obtained before travel. Apply online on the DLS e-Trade portal (etrade.dls.gov.bd): register, complete the applicant and pet information (up to three pets), upload the mandatory documents and submit. Up to three pet animals can be listed on one application.", fr: "Un No Objection Certificate pour animal de compagnie (Import) doit être obtenu avant le voyage. Demande en ligne sur le portail e-Trade du DLS (etrade.dls.gov.bd) : inscription, informations sur le demandeur et l'animal (jusqu'à trois animaux), téléversement des documents obligatoires et soumission. Jusqu'à trois animaux peuvent figurer sur une même demande.", es: "Un No Objection Certificate para animal de compañía (importación) debe obtenerse antes del viaje. Solicítalo en línea en el portal e-Trade del DLS (etrade.dls.gov.bd): regístrate, completa la información del solicitante y de la mascota (hasta tres mascotas), sube los documentos obligatorios y envía. Se pueden incluir hasta tres animales de compañía en una misma solicitud.", pt: "Um No Objection Certificate para Pet Animal Companion (Import) precisa ser obtido antes da viagem. Solicite on-line no portal DLS e-Trade (etrade.dls.gov.bd): cadastre-se, preencha as informações do solicitante e do animal de estimação (até três animais), envie os documentos obrigatórios e submeta o pedido. Até três animais de estimação podem constar em um mesmo pedido." }
    exceptions: { en: "The NOC has an issue date and an expiry date shown on the certificate; a specific validity period is not published in the reviewed DLS documents — confirm current validity with DLS. Applications may be rejected by the reviewing officer if incomplete.", fr: "Le NOC porte une date d'émission et une date d'expiration figurant sur le certificat ; une durée de validité précise n'est pas publiée dans les documents DLS consultés — confirme la validité en vigueur auprès du DLS. Une demande incomplète peut être rejetée par l'agent instructeur.", es: "El NOC lleva una fecha de emisión y una fecha de caducidad que figuran en el certificado; un periodo de valide concreto no se publica en los documentos del DLS consultados — confirma la valide vigente con el DLS. Las solicitudes pueden ser rechazadas por el agente instructor si están incompletas.", pt: "O NOC traz uma data de emissão e uma data de validade indicadas no certificado; um período de validade específico não é publicado nos documentos do DLS analisados — confirme a validade atual com o DLS. Os pedidos podem ser rejeitados pelo agente responsável pela análise se estiverem incompletos." }
    ref: { en: "DLS e-Trade portal — NOC for Pet Animal Companion; DLS NOC user manual", fr: "Portail e-Trade du DLS — NOC pour animal de compagnie ; manuel DLS du NOC", es: "Portal e-Trade del DLS — NOC para animal de compañía; manual de usuario del NOC del DLS", pt: "Portal DLS e-Trade — NOC for Pet Animal Companion; manual do usuário do NOC do DLS" }
  - item: { en: "Microchip", fr: "Puce électronique", es: "Microchip", pt: "Microchip" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "The pet's microchip number is a mandatory field in the DLS NOC application (entered with the dog's name, sex, colour and breed). It must match the animal and its documents on arrival.", fr: "Le numéro de puce de l'animal est un champ obligatoire de la demande de NOC du DLS (saisi avec le nom, le sexe, la couleur et la race du chien). Il doit correspondre à l'animal et à ses documents à l'arrivée.", es: "El número de microchip de la mascota es un campo obligatorio de la solicitud de NOC del DLS (introducido junto con el nombre, el sexo, el color y la raza del perro). Debe coincidir con el animal y sus documentos a la llegada.", pt: "O número do microchip do animal é um campo obrigatório no pedido do NOC do DLS (informado junto com o nome, sexo, cor e raça do cachorro). Ele precisa corresponder ao animal e à sua documentação na chegada." }
    exceptions: { en: "The reviewed DLS documents require a microchip number but do not specify a particular microchip standard (e.g. ISO 11784/11785) — bring an ISO-compatible microchip and a scanner, and make sure it is readable on arrival.", fr: "Les documents DLS consultés exigent un numéro de puce mais ne précisent pas de norme de puce particulière (par ex. ISO 11784/11785) — prévois une puce compatible ISO et un lecteur, et assure-toi qu'elle soit lisible à l'arrivée.", es: "Los documentos del DLS consultados exigen un número de microchip pero no especifican una norma de microchip concreta (p. ej. ISO 11784/11785) — lleva un microchip compatible con la ISO y un lector, y asegúrate de que sea legible a la llegada.", pt: "Os documentos do DLS analisados exigem um número de microchip, mas não especificam um padrão de microchip em particular (por exemplo, ISO 11784/11785) — leve um microchip compatível com ISO e um leitor, e garanta que ele seja legível na chegada." }
    ref: { en: "DLS NOC user manual (Pet Information — Microchip No)", fr: "Manuel DLS du NOC (informations sur l'animal — numéro de puce)", es: "Manual de usuario del NOC del DLS (información de la mascota — n.º de microchip)", pt: "Manual do usuário do NOC do DLS (Informações do Animal — Número do Microchip)" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "A vaccination certificate and a vaccination card issued by the veterinary surgeon or specialist of the country you are coming from are mandatory documents in the NOC application. Bangladesh is rabies-endemic, so a valid rabies vaccination is expected among these records.", fr: "Un certificat de vaccination et un carnet de vaccination établis par le vétérinaire ou le spécialiste du pays d'où tu viens sont des documents obligatoires de la demande de NOC. Le Bangladesh étant un pays d'endémie rabique, une vaccination antirabique valide est attendue parmi ces documents.", es: "Un certificado de vacunación y una cartilla de vacunación expedidos por el veterinario o el especialista del país del que vienes son documentos obligatorios de la solicitud de NOC. Como Bangladés tiene rabia endémica, se espera una vacunación antirrábica válida entre estos registros.", pt: "Um certificado de vacinação e uma carteira de vacinação emitidos pelo médico-veterinário ou especialista do país de onde você está vindo são documentos obrigatórios no pedido do NOC. Bangladesh é endêmico de raiva, portanto uma vacinação antirrábica válida é esperada entre esses registros." }
    exceptions: { en: "The reviewed DLS documents do not publish a specific rabies-vaccination interval (e.g. a minimum or maximum number of days before travel) — carry complete, dated records showing current validity, and confirm the required timing with DLS.", fr: "Les documents DLS consultés ne publient pas d'intervalle de vaccination antirabique précis (par ex. un nombre minimal ou maximal de jours avant le voyage) — munis-toi d'un carnet complet et daté attestant la validité en cours, et confirme le calendrier requis auprès du DLS.", es: "Los documentos del DLS consultados no publican un intervalo de vacunación antirrábica concreto (p. ej. un número mínimo o máximo de días antes del viaje) — lleva registros completos y fechados que acrediten la valide vigente, y confirma el calendario exigido con el DLS.", pt: "Os documentos do DLS analisados não publicam um intervalo específico para a vacinação antirrábica (por exemplo, um número mínimo ou máximo de dias antes da viagem) — leve registros completos e datados que mostrem a validade atual, e confirme o prazo exigido com o DLS." }
    ref: { en: "DLS NOC user manual (Documents — Vaccination Certificate & Card); HSIA — Importation of Pets", fr: "Manuel DLS du NOC (documents — certificat et carnet de vaccination) ; HSIA — importation d'animaux", es: "Manual de usuario del NOC del DLS (documentos — certificado y cartilla de vacunación); HSIA — importación de mascotas", pt: "Manual do usuário do NOC do DLS (Documentos — Certificado e Carteira de Vacinação); HSIA — Importation of Pets" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not required", fr: "Non requis", es: "No obligatoria", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "The reviewed DLS import documents do not call for a rabies antibody test. Only a vaccination certificate, vaccination card and health certificate are listed as mandatory; a lab test report is optional in the DLS pre-arrival notification.", fr: "Les documents d'import du DLS consultés n'imposent pas de titrage antirabique. Seuls un certificat de vaccination, un carnet de vaccination et un certificat sanitaire sont listés comme obligatoires ; un rapport de test de laboratoire est facultatif dans la notification de pré-arrivée du DLS.", es: "Los documentos de importación del DLS consultados no exigen una prueba de titulación de rabia. Solo se enumeran como obligatorios un certificado de vacunación, una cartilla de vacunación y un certificado sanitario; un informe de análisis de laboratorio es opcional en la notificación previa a la llegada del DLS.", pt: "Os documentos de importação do DLS analisados não exigem um teste sorológico antirrábico. Apenas o certificado de vacinação, a carteira de vacinação e o atestado de saúde constam como obrigatórios; um laudo de exame laboratorial é opcional na notificação prévia de chegada do DLS." }
    ref: { en: "DLS NOC user manual (Documents; Pre-Arrival Notification)", fr: "Manuel DLS du NOC (documents ; notification de pré-arrivée)", es: "Manual de usuario del NOC del DLS (documentos; notificación previa a la llegada)", pt: "Manual do usuário do NOC do DLS (Documentos; Notificação Prévia de Chegada)" }
  - item: { en: "Veterinary health certificate", fr: "Certificat sanitaire vétérinaire", es: "Certificado sanitario veterinario", pt: "Atestado de saúde veterinário" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "An official health certificate issued by the veterinary surgeon or specialist of the country of departure is a mandatory attachment in the NOC application and is named again in the airport guidance for importing pets.", fr: "Un certificat sanitaire officiel établi par le vétérinaire ou le spécialiste du pays de départ est une pièce obligatoire de la demande de NOC et est de nouveau cité dans la notice aéroportuaire pour l'importation d'animaux.", es: "Un certificado sanitario oficial expedido por el veterinario o el especialista del país de salida es un adjunto obligatorio de la solicitud de NOC y se menciona de nuevo en las instrucciones del aeropuerto para la importación de mascotas.", pt: "Um atestado de saúde oficial emitido pelo médico-veterinário ou especialista do país de partida é um anexo obrigatório no pedido do NOC, e volta a ser mencionado na orientação do aeroporto para a importação de animais de estimação." }
    exceptions: { en: "The reviewed DLS documents do not publish a fixed validity window for the health certificate (e.g. issued within X days of travel) — have it issued as close to departure as your vet advises, and confirm any time limit with DLS.", fr: "Les documents DLS consultés ne publient pas de fenêtre de validité fixe pour le certificat sanitaire (par ex. délivré dans les X jours avant le voyage) — fais-le établir au plus près du départ selon l'avis de ton vétérinaire, et confirme tout délai auprès du DLS.", es: "Los documentos del DLS consultados no publican una ventana de valide fija para el certificado sanitario (p. ej. expedido dentro de los X días previos al viaje) — hazlo expedir lo más cerca posible de la salida según lo aconseje tu veterinario, y confirma cualquier plazo con el DLS.", pt: "Os documentos do DLS analisados não publicam um prazo de validade fixo para o atestado de saúde (por exemplo, emitido dentro de X dias antes da viagem) — providencie a emissão o mais próximo possível da partida, conforme a orientação do seu veterinário, e confirme qualquer prazo com o DLS." }
    ref: { en: "DLS NOC user manual (Documents — Health Certificate); HSIA — Importation of Pets", fr: "Manuel DLS du NOC (documents — certificat sanitaire) ; HSIA — importation d'animaux", es: "Manual de usuario del NOC del DLS (documentos — certificado sanitario); HSIA — importación de mascotas", pt: "Manual do usuário do NOC do DLS (Documentos — Atestado de Saúde); HSIA — Importation of Pets" }
  - item: { en: "Passport & visa copies", fr: "Copies de passeport et de visa", es: "Copias de pasaporte y de visado", pt: "Cópias do passaporte e do visto" }
    required: { en: "Required", fr: "Requises", es: "Obligatorias", pt: "Obrigatório" }
    when: { en: "A copy of the owner's passport and a copy of the visa are mandatory attachments in the NOC application, together with a colour photo of the pet; the passport number is also entered in the applicant information.", fr: "Une copie du passeport du propriétaire et une copie du visa sont des pièces obligatoires de la demande de NOC, avec une photo couleur de l'animal ; le numéro de passeport est aussi saisi dans les informations sur le demandeur.", es: "Una copia del pasaporte del propietario y una copia del visado son adjuntos obligatorios de la solicitud de NOC, junto con una foto en color de la mascota; el número de pasaporte también se introduce en la información del solicitante.", pt: "Uma cópia do passaporte do dono e uma cópia do visto são anexos obrigatórios no pedido do NOC, junto com uma foto colorida do animal; o número do passaporte também é informado nos dados do solicitante." }
    exceptions: { en: "A work order and additional attachments can be uploaded optionally. The application is submitted to and reviewed by DLS before the NOC is issued.", fr: "Un bon de travail et des pièces complémentaires peuvent être téléversés à titre facultatif. La demande est soumise au DLS et instruite par lui avant délivrance du NOC.", es: "Una orden de trabajo y adjuntos adicionales pueden subirse de forma opcional. La solicitud se envía al DLS y este la instruye antes de expedir el NOC.", pt: "Uma ordem de serviço e anexos adicionais podem ser enviados de forma opcional. O pedido é submetido ao DLS e analisado por ele antes da emissão do NOC." }
    ref: { en: "DLS NOC user manual (Applicant Information; Documents)", fr: "Manuel DLS du NOC (informations sur le demandeur ; documents)", es: "Manual de usuario del NOC del DLS (información del solicitante; documentos)", pt: "Manual do usuário do NOC do DLS (Informações do Solicitante; Documentos)" }
  - item: { en: "Parasite treatment", fr: "Traitement antiparasitaire", es: "Tratamiento antiparasitario", pt: "Tratamento antiparasitário" }
    required: { en: "Not published officially", fr: "Non communiqué officiellement", es: "No publicado oficialmente", pt: "Não publicado oficialmente" }
    when: { en: "Unknown — the reviewed DLS documents do not list a specific internal/external parasite-treatment requirement for importing a pet dog.", fr: "Non communiqué — les documents DLS consultés ne mentionnent pas d'exigence spécifique de traitement antiparasitaire interne/externe pour l'importation d'un chien de compagnie.", es: "No comunicado — los documentos del DLS consultados no mencionan ninguna exigencia específica de tratamiento antiparasitario interno/externo para la importación de un perro de compañía.", pt: "Desconhecido — os documentos do DLS analisados não listam uma exigência específica de tratamento antiparasitário interno/externo para a importação de um cachorro de estimação." }
    exceptions: { en: "As good practice for a rabies-endemic, tropical destination, ask your vet about parasite protection and confirm with DLS whether any treatment must be certified.", fr: "Par bonne pratique vers une destination tropicale d'endémie rabique, interrogez ton vétérinaire sur la protection antiparasitaire et confirme auprès du DLS si un traitement doit être certifié.", es: "Como buena práctica hacia un destino tropical con rabia endémica, pregunta a tu veterinario sobre la protección antiparasitaria y confirma con el DLS si algún tratamiento debe certificarse.", pt: "Como boa prática para um destino tropical e endêmico de raiva, pergunte ao seu veterinário sobre proteção antiparasitária e confirme com o DLS se algum tratamento precisa ser certificado." }
    ref: { en: "DLS NOC user manual (Documents) — no parasite-treatment field published", fr: "Manuel DLS du NOC (documents) — aucun champ de traitement antiparasitaire publié", es: "Manual de usuario del NOC del DLS (documentos) — ningún campo de tratamiento antiparasitario publicado", pt: "Manual do usuário do NOC do DLS (Documentos) — nenhum campo de tratamento antiparasitário publicado" }
  - item: { en: "Pre-arrival notification", fr: "Notification de pré-arrivée", es: "Notificación previa a la llegada", pt: "Notificação prévia de chegada" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "After the NOC is issued, the applicant sends a pre-arrival notification through the DLS portal — selecting the transportation type, entering the booking/rental number and the estimated arrival date and time, and attaching the health/veterinary certificate and any lab test report — so DLS quarantine officers can prepare for the arrival.", fr: "Une fois le NOC délivré, le demandeur envoie une notification de pré-arrivée via le portail du DLS — en choisissant le mode de transport, en saisissant le numéro de réservation et la date/heure d'arrivée estimées, et en joignant le certificat sanitaire/vétérinaire et tout rapport de test — afin que les agents de quarantaine du DLS préparent l'arrivée.", es: "Una vez expedido el NOC, el solicitante envía una notificación previa a la llegada a través del portal del DLS — seleccionando el tipo de transporte, introduciendo el número de reserva/alquiler y la fecha y hora de llegada estimadas, y adjuntando el certificado sanitario/veterinario y cualquier informe de análisis de laboratorio — para que los agentes de cuarentena del DLS preparen la llegada.", pt: "Depois que o NOC é emitido, o solicitante envia uma notificação prévia de chegada pelo portal do DLS — selecionando o tipo de transporte, informando o número da reserva/locação e a data e hora estimadas de chegada, e anexando o atestado de saúde/veterinário e qualquer laudo de exame laboratorial — para que os agentes de quarentena do DLS possam se preparar para a chegada." }
    exceptions: { en: "The intended use can be marked as 'post-entry quarantine' among the options; the notification supports the airport's monitoring and coordination.", fr: "L'usage prévu peut être coché comme « quarantaine post-entrée » parmi les options ; la notification appuie la surveillance et la coordination à l'aéroport.", es: "El uso previsto puede marcarse como «cuarentena posterior a la entrada» entre las opciones; la notificación respalda la vigilancia y la coordinación en el aeropuerto.", pt: "A finalidade pretendida pode ser marcada como 'quarentena pós-entrada' entre as opções; a notificação apoia o monitoramento e a coordenação do aeroporto." }
    ref: { en: "DLS NOC user manual (Pre-Arrival Notification Process)", fr: "Manuel DLS du NOC (processus de notification de pré-arrivée)", es: "Manual de usuario del NOC del DLS (proceso de notificación previa a la llegada)", pt: "Manual do usuário do NOC do DLS (Processo de Notificação Prévia de Chegada)" }
  - item: { en: "Arrival handling & quarantine (DLS)", fr: "Prise en charge et quarantaine à l'arrivée (DLS)", es: "Gestión y cuarentena a la llegada (DLS)", pt: "Encaminhamento na chegada e quarentena (DLS)" }
    required: { en: "Required (handling)", fr: "Requise (prise en charge)", es: "Obligatoria (gestión)", pt: "Obrigatório (encaminhamento)" }
    when: { en: "Pets from abroad are handled through DLS animal quarantine on arrival, and the DLS portal issues a quarantine certificate as part of its services. Dhaka's Hazrat Shahjalal International Airport directs importers to apply on the DLS portal and to clear the pet through animal quarantine.", fr: "Les animaux venant de l'étranger sont pris en charge par la quarantaine animale du DLS à l'arrivée, et le portail du DLS délivre un certificat de quarantaine dans le cadre de ses services. L'aéroport international Hazrat Shahjalal de Dhaka renvoie les importateurs vers la demande sur le portail du DLS et vers le dédouanement de l'animal en quarantaine.", es: "Las mascotas procedentes del extranjero son atendidas por la cuarentena animal del DLS a la llegada, y el portal del DLS expide un certificado de cuarentena como parte de sus servicios. El aeropuerto internacional Hazrat Shahjalal de Daca dirige a los importadores a solicitarlo en el portal del DLS y a despachar la mascota a través de la cuarentena animal.", pt: "Os animais de estimação vindos do exterior são encaminhados à quarentena animal do DLS na chegada, e o portal do DLS emite um certificado de quarentena como parte de seus serviços. O Hazrat Shahjalal International Airport, em Dhaka, orienta os importadores a fazer o pedido no portal do DLS e a liberar o animal pela quarentena animal." }
    exceptions: { en: "The reviewed official documents do not publish a fixed quarantine duration for pet dogs — confirm whether, and for how long, your dog may be held with DLS before travel.", fr: "Les documents officiels consultés ne publient pas de durée de quarantaine fixe pour les chiens de compagnie — confirme auprès du DLS si ton chien peut être retenu et pour combien de temps avant le voyage.", es: "Los documentos oficiales consultados no publican una duración de cuarentena fija para los perros de compañía — confirma con el DLS si tu perro puede quedar retenido y durante cuánto tiempo antes del viaje.", pt: "Os documentos oficiais analisados não publicam uma duração fixa de quarentena para cachorros de estimação — confirme com o DLS, antes da viagem, se e por quanto tempo o seu cachorro pode ficar retido." }
    ref: { en: "DLS e-Trade portal (Quarantine Certificate); HSIA — Importation of Pets", fr: "Portail e-Trade du DLS (certificat de quarantaine) ; HSIA — importation d'animaux", es: "Portal e-Trade del DLS (certificado de cuarentena); HSIA — importación de mascotas", pt: "Portal DLS e-Trade (Certificado de Quarentena); HSIA — Importation of Pets" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Not published officially", fr: "Non communiqué officiellement", es: "No publicado oficialmente", pt: "Não publicado oficialmente" }
    when: { en: "Unknown — the reviewed DLS documents do not state a minimum age for importing a pet dog. Date of birth is an optional field on the NOC application.", fr: "Non communiqué — les documents DLS consultés n'indiquent pas d'âge minimum pour l'importation d'un chien de compagnie. La date de naissance est un champ facultatif de la demande de NOC.", es: "No comunicado — los documentos del DLS consultados no indican una edad mínima para la importación de un perro de compañía. La fecha de nacimiento es un campo opcional de la solicitud de NOC.", pt: "Desconhecido — os documentos do DLS analisados não indicam uma idade mínima para a importação de um cachorro de estimação. A data de nascimento é um campo opcional no pedido do NOC." }
    exceptions: { en: "Because a valid rabies vaccination is expected and rabies vaccines are generally given from about three months of age, plan for a dog old enough to be properly vaccinated, and confirm with DLS.", fr: "Comme une vaccination antirabique valide est attendue et que les vaccins antirabiques sont en général administrés à partir d'environ trois mois, prévois un chien assez âgé pour être correctement vacciné, et confirme auprès du DLS.", es: "Como se espera una vacunación antirrábica válida y las vacunas antirrábicas suelen administrarse a partir de unos tres meses de edad, prevé un perro con edad suficiente para estar correctamente vacunado, y confírmalo con el DLS.", pt: "Como uma vacinação antirrábica válida é esperada e as vacinas antirrábicas costumam ser aplicadas a partir de cerca de três meses de idade, planeje levar um cachorro com idade suficiente para estar devidamente vacinado, e confirme com o DLS." }
    ref: { en: "DLS NOC user manual (Pet Information — Date of Birth optional)", fr: "Manuel DLS du NOC (informations sur l'animal — date de naissance facultative)", es: "Manual de usuario del NOC del DLS (información de la mascota — fecha de nacimiento opcional)", pt: "Manual do usuário do NOC do DLS (Informações do Animal — Data de Nascimento opcional)" }

origin:
  scheme: own
  eu:
    from: any
    title: { en: "Accompanied pet dog — standard NOC path", fr: "Chien de compagnie accompagné — parcours NOC standard", es: "Perro de compañía acompañado — vía NOC estándar", pt: "Cachorro de estimação acompanhado — caminho padrão do NOC" }
    body:
      en: "For a dog travelling with you as accompanied baggage or in the cabin, apply online for the DLS No Objection Certificate for a Pet Animal Companion before departure. You need the recorded microchip number, a vaccination certificate and card, an official health certificate from your origin-country vet, and copies of your passport and visa plus a colour photo of the pet. After the NOC is issued, send the pre-arrival notification. No rabies antibody test is required by DLS, but a valid rabies vaccination is expected and your dog is handled through DLS animal quarantine on arrival at Dhaka."
      fr: "Pour un chien voyageant avec toi en bagage accompagné ou en cabine, demande en ligne le No Objection Certificate du DLS pour animal de compagnie avant le départ. Il te faut le numéro de puce consigné, un certificat et un carnet de vaccination, un certificat sanitaire officiel du vétérinaire du pays d'origine, et les copies de ton passeport et visa ainsi qu'une photo couleur de l'animal. Une fois le NOC délivré, envoie la notification de pré-arrivée. Aucun titrage antirabique n'est exigé par le DLS, mais une vaccination antirabique valide est attendue et ton chien est pris en charge par la quarantaine animale du DLS à l'arrivée à Dhaka."
      es: "Para un perro que viaja contigo como equipaje acompañado o en la cabina, solicita en línea el No Objection Certificate del DLS para animal de compañía antes de la salida. Necesitas el número de microchip registrado, un certificado y una cartilla de vacunación, un certificado sanitario oficial del veterinario de tu país de origen, y copias de tu pasaporte y visado más una foto en color de la mascota. Una vez expedido el NOC, envía la notificación previa a la llegada. El DLS no exige prueba de titulación de rabia, pero se espera una vacunación antirrábica válida y tu perro es atendido por la cuarentena animal del DLS a la llegada a Daca."
      pt: "Para um cachorro que viaja com você como bagagem acompanhada ou na cabine, solicite on-line o No Objection Certificate do DLS para Pet Animal Companion antes da partida. Você precisa do número do microchip registrado, de um certificado e carteira de vacinação, de um atestado de saúde oficial do veterinário do país de origem, e de cópias do seu passaporte e visto, além de uma foto colorida do animal. Depois que o NOC for emitido, envie a notificação prévia de chegada. Nenhum teste sorológico antirrábico é exigido pelo DLS, mas uma vacinação antirrábica válida é esperada, e o seu cachorro é encaminhado à quarentena animal do DLS na chegada a Dhaka."
    cls: warn
  listed:
    title: { en: "Unaccompanied / air-cargo import", fr: "Import non accompagné / en fret aérien", es: "Importación no acompañada / en carga aérea", pt: "Importação desacompanhada / como carga aérea" }
    body:
      en: "If the dog travels unaccompanied or as air cargo, the same DLS NOC is required, together with the pre-arrival/shipment notification through the portal and coordination with the carrier and DLS animal quarantine at Dhaka airport. Keep the microchip, health certificate and vaccination records consistent with the NOC, and be ready to present the originals on arrival. Confirm the airport's cargo handling and any fees with the carrier and DLS in advance."
      fr: "Si le chien voyage non accompagné ou en fret aérien, le même NOC du DLS est requis, avec la notification de pré-arrivée/expédition via le portail et la coordination avec la compagnie et la quarantaine animale du DLS à l'aéroport de Dhaka. Garde la puce, le certificat sanitaire et le carnet de vaccination cohérents avec le NOC, et sois prêt à présenter les originaux à l'arrivée. Confirme à l'avance la prise en charge du fret et les éventuels frais auprès de la compagnie et du DLS."
      es: "Si el perro viaja no acompañado o como carga aérea, se exige el mismo NOC del DLS, junto con la notificación previa a la llegada/al envío a través del portal y la coordinación con la aerolínea y la cuarentena animal del DLS en el aeropuerto de Daca. Mantén el microchip, el certificado sanitario y la cartilla de vacunación coherentes con el NOC, y prepárate para presentar los originales a la llegada. Confirma de antemano la gestión de la carga en el aeropuerto y cualquier tasa con la aerolínea y el DLS."
      pt: "Se o cachorro viajar desacompanhado ou como carga aérea, o mesmo NOC do DLS é exigido, junto com a notificação prévia de chegada/embarque pelo portal e a coordenação com a companhia aérea e a quarentena animal do DLS no aeroporto de Dhaka. Mantenha o microchip, o atestado de saúde e os registros de vacinação condizentes com o NOC, e esteja pronto para apresentar os originais na chegada. Confirme com antecedência o processamento de carga do aeroporto e eventuais taxas com a companhia aérea e o DLS."
    cls: warn
  nonListed:
    title: { en: "Incomplete documents or non-compliant arrival", fr: "Documents incomplets ou arrivée non conforme", es: "Documentos incompletos o llegada no conforme", pt: "Documentos incompletos ou chegada em não conformidade" }
    body:
      en: "A dog that arrives without a valid DLS NOC, without a matching microchip, or without the required health certificate and vaccination records risks being held for post-entry quarantine, delayed clearance or refusal, with any costs falling on the owner. Because DLS does not publish fixed timings, quarantine duration or a minimum age, do not assume a specific outcome — complete every document before departure and confirm the current conditions with DLS."
      fr: "Un chien qui arrive sans NOC valide du DLS, sans puce correspondante, ou sans le certificat sanitaire et le carnet de vaccination requis risque une quarantaine post-entrée, un dédouanement retardé ou un refus, les frais éventuels étant à la charge du propriétaire. Comme le DLS ne publie pas de délais fixes, de durée de quarantaine ni d'âge minimum, ne présume pas d'un résultat précis — complète chaque document avant le départ et confirme les conditions en vigueur auprès du DLS."
      es: "Un perro que llega sin un NOC válido del DLS, sin un microchip que coincida, o sin el certificado sanitario y la cartilla de vacunación exigidos corre el riesgo de quedar retenido en cuarentena posterior a la entrada, de un despacho retrasado o de una denegación, con los costes eventuales a cargo del propietario. Como el DLS no publica plazos fijos, duración de la cuarentena ni una edad mínima, no des por hecho un resultado concreto — completa todos los documentos antes de la salida y confirma las condiciones vigentes con el DLS."
      pt: "Um cachorro que chega sem um NOC do DLS válido, sem um microchip correspondente, ou sem o atestado de saúde e os registros de vacinação exigidos corre o risco de ficar retido para quarentena pós-entrada, ter a liberação atrasada ou ser recusado, com os custos correndo por conta do dono. Como o DLS não publica prazos fixos, duração de quarentena ou idade mínima, não presuma um resultado específico — complete todos os documentos antes da partida e confirme as condições atuais com o DLS."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Bangladesh depends on whether the DLS NOC and every supporting document were completed before departure."
    fr: "Ce qui se passe à l'arrivée de ton chien au Bangladesh dépend du fait que le NOC du DLS et chaque document justificatif aient été complétés avant le départ."
    es: "Lo que ocurre cuando tu perro llega a Bangladés depende de si el NOC del DLS y cada documento justificativo se completaron antes de la salida."
    pt: "O que acontece quando o seu cachorro chega a Bangladesh depende de o NOC do DLS e todos os documentos de apoio terem sido concluídos antes da partida."
  points:
    - en: "Dogs enter through Hazrat Shahjalal International Airport (HSIA) in Dhaka, where importers are directed to apply on the DLS portal and clear the pet through animal quarantine."
      fr: "Les chiens entrent par l'aéroport international Hazrat Shahjalal (HSIA) de Dhaka, où les importateurs sont invités à faire la demande sur le portail du DLS et à dédouaner l'animal via la quarantaine animale."
      es: "Los perros entran por el aeropuerto internacional Hazrat Shahjalal (HSIA) de Daca, donde se indica a los importadores que soliciten en el portal del DLS y despachen la mascota a través de la cuarentena animal."
      pt: "Os cachorros entram pelo Hazrat Shahjalal International Airport (HSIA), em Dhaka, onde os importadores são orientados a fazer o pedido no portal do DLS e liberar o animal pela quarentena animal."
    - en: "Send the DLS pre-arrival notification before travel so quarantine officers can prepare; carry the issued NOC and the originals of the health certificate, vaccination certificate and vaccination card."
      fr: "Envoie la notification de pré-arrivée du DLS avant le voyage afin que les agents de quarantaine puissent se préparer ; munis-toi du NOC délivré et des originaux du certificat sanitaire, du certificat de vaccination et du carnet de vaccination."
      es: "Envía la notificación previa a la llegada del DLS antes del viaje para que los agentes de cuarentena puedan prepararse; lleva el NOC expedido y los originales del certificado sanitario, el certificado de vacunación y la cartilla de vacunación."
      pt: "Envie a notificação prévia de chegada do DLS antes da viagem para que os agentes de quarentena possam se preparar; leve o NOC emitido e os originais do atestado de saúde, do certificado de vacinação e da carteira de vacinação."
    - en: "The microchip must match the animal and its documents; a mismatch or missing paperwork can delay or block clearance."
      fr: "La puce doit correspondre à l'animal et à ses documents ; une discordance ou des documents manquants peuvent retarder ou bloquer le dédouanement."
      es: "El microchip debe coincidir con el animal y sus documentos; una discrepancia o documentos que falten pueden retrasar o bloquear el despacho."
      pt: "O microchip precisa corresponder ao animal e à sua documentação; uma divergência ou documentação ausente pode atrasar ou bloquear a liberação."
    - en: "DLS animal quarantine handles the pet on arrival and the portal issues a quarantine certificate as part of the process; the reviewed official documents do not publish a fixed quarantine duration for dogs."
      fr: "La quarantaine animale du DLS prend en charge l'animal à l'arrivée et le portail délivre un certificat de quarantaine dans le cadre du processus ; les documents officiels consultés ne publient pas de durée de quarantaine fixe pour les chiens."
      es: "La cuarentena animal del DLS atiende a la mascota a la llegada y el portal expide un certificado de cuarentena como parte del proceso; los documentos oficiales consultados no publican una duración de cuarentena fija para los perros."
      pt: "A quarentena animal do DLS cuida do animal na chegada, e o portal emite um certificado de quarentena como parte do processo; os documentos oficiais analisados não publicam uma duração fixa de quarentena para cachorros."
    - en: "If documents are missing or invalid, the dog may be held for post-entry quarantine, delayed or refused, at the owner's expense — so complete everything before you fly."
      fr: "Si des documents manquent ou sont invalides, le chien peut être placé en quarantaine post-entrée, retardé ou refusé, aux frais du propriétaire — complète donc tout avant de voler."
      es: "Si faltan documentos o no son válidos, el perro puede quedar retenido en cuarentena posterior a la entrada, retrasado o rechazado, a cargo del propietario — así que complétalo todo antes de volar."
      pt: "Se a documentação estiver ausente ou inválida, o cachorro pode ficar retido para quarentena pós-entrada, ter a liberação atrasada ou ser recusado, às custas do dono — por isso, complete tudo antes de voar."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Bangladesh's Department of Livestock Services does not publish a breed-specific import ban in its reviewed pet-import documents: the No Objection Certificate process records each dog's breed but does not name breeds prohibited from entering the country."
    fr: "Le Department of Livestock Services du Bangladesh ne publie pas d'interdiction d'importation liée à la race dans les documents d'import consultés : le processus de No Objection Certificate enregistre la race de chaque chien mais ne désigne aucune race interdite d'entrée."
    es: "El Department of Livestock Services de Bangladés no publica ninguna prohibición de importación específica por raza en los documentos de importación de mascotas consultados: el proceso del No Objection Certificate registra la raza de cada perro pero no designa razas prohibidas de entrar en el país."
    pt: "O Department of Livestock Services de Bangladesh não publica uma proibição de importação específica por raça em seus documentos de importação de animais de estimação analisados: o processo do No Objection Certificate registra a raça de cada cachorro, mas não nomeia raças proibidas de entrar no país."
  cat1:
    en: "No national breed-import ban is published. Breeds restricted in some other countries (pit-bull types, Tosa, Rottweiler and similar) are not, in the reviewed DLS documents, named as prohibited from being imported into Bangladesh. This is an absence of a published rule, not a positive confirmation that every breed is accepted."
    fr: "Aucune interdiction nationale d'importation liée à la race n'est publiée. Les races restreintes dans certains autres pays (types pit-bull, Tosa, Rottweiler et similaires) ne sont pas, dans les documents DLS consultés, désignées comme interdites d'importation au Bangladesh. Il s'agit d'une absence de règle publiée, non d'une confirmation positive que toute race est acceptée."
    es: "No hay publicada ninguna prohibición nacional de importación por raza. Las razas restringidas en algunos otros países (tipos pit bull, Tosa, Rottweiler y similares) no están, en los documentos del DLS consultados, designadas como prohibidas de importación en Bangladés. Se trata de la ausencia de una norma publicada, no de una confirmación positiva de que toda raza sea aceptada."
    pt: "Nenhuma proibição nacional de importação por raça é publicada. Raças restritas em alguns outros países (tipos pit-bull, Tosa, Rottweiler e semelhantes) não são citadas, nos documentos do DLS analisados, como proibidas de serem importadas para Bangladesh. Isso é uma ausência de regra publicada, não uma confirmação positiva de que toda raça é aceita."
  cat2:
    en: "Practical restrictions come mainly from airline policies: many carriers refuse or restrict snub-nosed (brachycephalic) breeds in the hold and set their own breed and crate rules. These are airline rules, not Bangladeshi import bans."
    fr: "Les restrictions pratiques proviennent surtout des politiques des compagnies aériennes : de nombreux transporteurs refusent ou limitent les races brachycéphales (au nez court) en soute et fixent leurs propres règles de race et de caisse. Ce sont des règles de compagnie, pas des interdictions d'importation bangladaises."
    es: "Las restricciones prácticas provienen sobre todo de las políticas de las aerolíneas: muchos transportistas rechazan o limitan las razas de nariz chata (braquicéfalas) en la bodega y fijan sus propias normas de raza y de jaula. Son normas de la aerolínea, no prohibiciones de importación de Bangladés."
    pt: "As restrições práticas vêm principalmente das políticas das companhias aéreas: muitas recusam ou restringem raças de focinho achatado (braquicefálicas) no porão e estabelecem suas próprias regras de raça e de caixa de transporte. Essas são regras das companhias aéreas, não proibições de importação de Bangladesh."
  note:
    en: "Because DLS does not publish a breed list and airline policies can be stricter, confirm your dog's breed both with DLS and with your carrier before booking, and re-check DLS for any future change."
    fr: "Comme le DLS ne publie pas de liste de races et que les politiques des compagnies peuvent être plus strictes, vérifie la race de ton chien auprès du DLS et de ton transporteur avant de réserver, et revérifiez auprès du DLS toute évolution future."
    es: "Como el DLS no publica una lista de razas y las políticas de las aerolíneas pueden ser más estrictas, confirma la raza de tu perro tanto con el DLS como con tu transportista antes de reservar, y vuelve a comprobar con el DLS cualquier cambio futuro."
    pt: "Como o DLS não publica uma lista de raças e as políticas das companhias aéreas podem ser mais rígidas, confirme a raça do seu cachorro tanto com o DLS quanto com a sua companhia aérea antes de reservar, e verifique novamente o DLS para qualquer mudança futura."

checklist:
  - en: "DLS No Objection Certificate (NOC) for a Pet Animal Companion applied for online before departure"
    fr: "No Objection Certificate (NOC) du DLS pour animal de compagnie demandé en ligne avant le départ"
    es: "No Objection Certificate (NOC) del DLS para animal de compañía solicitado en línea antes de la salida"
    pt: "No Objection Certificate (NOC) do DLS para Pet Animal Companion, solicitado on-line antes da partida"
  - en: "Microchip readable on arrival; number recorded on the NOC application (ISO-compatible recommended)"
    fr: "Puce lisible à l'arrivée ; numéro consigné sur la demande de NOC (compatible ISO recommandée)"
    es: "Microchip legible a la llegada; número registrado en la solicitud de NOC (se recomienda compatible con la ISO)"
    pt: "Microchip legível na chegada; número registrado no pedido do NOC (compatível com ISO recomendado)"
  - en: "Vaccination certificate and vaccination card from the origin-country vet, including rabies"
    fr: "Certificat de vaccination et carnet de vaccination du vétérinaire du pays d'origine, rage comprise"
    es: "Certificado de vacunación y cartilla de vacunación del veterinario del país de origen, incluida la rabia"
    pt: "Certificado e carteira de vacinação do veterinário do país de origem, incluindo a antirrábica"
  - en: "Official veterinary health certificate from the country of departure"
    fr: "Certificat sanitaire vétérinaire officiel du pays de départ"
    es: "Certificado sanitario veterinario oficial del país de salida"
    pt: "Atestado de saúde veterinário oficial do país de partida"
  - en: "Copies of your passport and visa, plus a colour photo of the pet"
    fr: "Copies de ton passeport et de ton visa, plus une photo couleur de l'animal"
    es: "Copias de tu pasaporte y de tu visado, más una foto en color de la mascota"
    pt: "Cópias do seu passaporte e visto, além de uma foto colorida do animal"
  - en: "Pre-arrival notification sent through the DLS portal before travel"
    fr: "Notification de pré-arrivée envoyée via le portail du DLS avant le voyage"
    es: "Notificación previa a la llegada enviada a través del portal del DLS antes del viaje"
    pt: "Notificação prévia de chegada enviada pelo portal do DLS antes da viagem"
  - en: "Flight arriving at Hazrat Shahjalal International Airport (HSIA), Dhaka, with DLS animal quarantine handling"
    fr: "Vol arrivant à l'aéroport international Hazrat Shahjalal (HSIA) de Dhaka, avec prise en charge par la quarantaine animale du DLS"
    es: "Vuelo que llega al aeropuerto internacional Hazrat Shahjalal (HSIA) de Daca, con gestión por parte de la cuarentena animal del DLS"
    pt: "Voo chegando ao Hazrat Shahjalal International Airport (HSIA), em Dhaka, com encaminhamento pela quarentena animal do DLS"
  - en: "Confirm with DLS the exact vaccination timing, any quarantine duration and minimum age (not published officially)"
    fr: "Confirmer auprès du DLS le calendrier exact de vaccination, la durée de quarantaine éventuelle et l'âge minimum (non publiés officiellement)"
    es: "Confirmar con el DLS el calendario exacto de vacunación, la duración de la cuarentena eventual y la edad mínima (no publicados oficialmente)"
    pt: "Confirme com o DLS o momento exato da vacinação, a duração da quarentena e a idade mínima (não publicados oficialmente)"
  - en: "crate that meets the applicable requirements if travelling in the hold; confirm your breed with the airline"
    fr: "Caisse conforme aux exigences applicables si voyage en soute ; vérifier ta race auprès de la compagnie"
    es: "Jaula de transporte si viaja en bodega; confirma tu raza con la aerolínea"
    pt: "Caixa de transporte em conformidade com a IATA, se viajar no porão; confirme a raça do seu cachorro com a companhia aérea"

