origin:
  scheme: eu
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test and no health certificate. There is no systematic veterinary check, but you must still notify Swedish Customs — EU residents can do this online with the EU pet passport."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage ni de certificat sanitaire. Pas de contrôle vétérinaire systématique, mais tu dois tout de même le déclarer à la douane suédoise — les résidents de l'UE peuvent le faire en ligne avec le passeport européen."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación ni certificado sanitario. No hay control veterinario sistemático, pero aun así debes declararlo ante la Aduana sueca — los residentes de la UE pueden hacerlo en línea con el pasaporte europeo para mascotas."
      pt: "Um cachorro vindo de outro país da UE precisa de um passaporte europeu para animais que comprove um microchip ISO válido e uma vacinação antirrábica em dia. Sem teste sorológico e sem certificado sanitário. Não há controle veterinário sistemático, mas você ainda assim precisa declarar o cachorro à alfândega sueca — residentes na UE podem fazer isso on-line com o passaporte europeu para animais."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Switzerland, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination and an EU animal health certificate endorsed by an official vet before departure. No antibody test is required. On arrival, notify Swedish Customs at the red lane."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Suisse, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire européen visé par un vétérinaire officiel avant le départ. Pas de titrage. À l'arrivée, déclare-le à la douane suédoise au couloir rouge."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Suiza, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal de la UE refrendado por un veterinario oficial antes de la salida. No se exige prueba de titulación. A la llegada, decláralo ante la Aduana sueca en el pasillo rojo."
      pt: "Vindo de um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Suíça, Japão, Austrália e outros), seu cachorro precisa de microchip, vacinação antirrábica válida e certificado sanitário europeu endossado por um veterinário oficial antes da partida. Não é exigido teste sorológico. Na chegada, declare o cachorro à alfândega sueca no canal vermelho."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-designated laboratory, then a compulsory 3-month wait before entry. An endorsed EU animal health certificate is also required, and you must notify Swedish Customs on arrival."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen visé est également requis, et tu dois déclarer l'animal à la douane suédoise à l'arrivée."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exige un certificado sanitario animal de la UE refrendado, y debes declararlo ante la Aduana sueca a la llegada."
      pt: "Vindo de um país não listado (de risco), acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório designado pela UE e, depois, 3 meses obrigatórios de espera antes da entrada. Também é exigido um certificado sanitário europeu endossado, e você precisa declarar o cachorro à alfândega sueca na chegada."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Sweden depends on where you flew from — but a customs notification is always required."
    fr: "Ce qui se passe à l'arrivée de ton chien en Suède dépend de ton lieu de départ — mais une déclaration douanière est toujours requise."
    es: "Lo que ocurre cuando tu perro llega a Suecia depende del lugar desde el que hayas volado — pero siempre se exige una declaración en aduana."
    pt: "O que acontece quando seu cachorro chega à Suécia depende de onde você embarcou — mas a declaração à alfândega é sempre obrigatória."
  points:
    - en: "Everyone bringing a dog into Sweden must notify Swedish Customs (Tullverket) — this even applies after a short holiday abroad with your own dog."
      fr: "Toute personne faisant entrer un chien en Suède doit le déclarer à la douane suédoise (Tullverket) — cela vaut même après de courtes vacances à l'étranger avec son propre chien."
      es: "Toda persona que introduzca un perro en Suecia debe declararlo ante la Aduana sueca (Tullverket) — esto rige incluso tras unas cortas vacaciones en el extranjero con su propio perro."
      pt: "Toda pessoa que leva um cachorro para a Suécia precisa declará-lo à alfândega sueca (Tullverket) — isso vale inclusive depois de férias curtas no exterior com o próprio cachorro."
    - from: eu
      en: "From another EU country with an EU pet passport, an EU resident can make this entry registration online before or during the trip."
      fr: "Depuis un autre pays de l'UE avec un passeport européen, un résident de l'UE peut faire cette déclaration d'entrée en ligne avant ou pendant le voyage."
      es: "Desde otro país de la UE con un pasaporte europeo para mascotas, un residente de la UE puede hacer este registro de entrada en línea antes o durante el viaje."
      pt: "Vindo de outro país da UE com passaporte europeu para animais, quem reside na UE pode fazer esse registro de entrada on-line antes ou durante a viagem."
    - from: non_eu
      en: "From a non-EU country (or if you live outside the EU), you cannot register online: choose the red lane at the border crossing and contact a customs official."
      fr: "Depuis un pays hors UE (ou si tu résides hors UE), l'enregistrement en ligne est impossible : emprunte le couloir rouge au passage frontalier et contacte un agent des douanes."
      es: "Desde un país fuera de la UE (o si resides fuera de la UE), no puedes registrarte en línea: elige el pasillo rojo en el paso fronterizo y contacta con un agente de aduanas."
      pt: "Vindo de um país fora da UE (ou se você mora fora da UE), o registro on-line não é possível: escolha o canal vermelho no ponto de passagem de fronteira e procure um agente da alfândega."
    - en: "You must also follow the Swedish Board of Agriculture's rules and be able to show your declaration number and the animal's documents if asked."
      fr: "Tu dois aussi respecter les règles du Jordbruksverket et pouvoir présenter ton numéro de déclaration et les documents de l'animal sur demande."
      es: "También debes cumplir las normas de la Junta Sueca de Agricultura y poder mostrar tu número de declaración y los documentos del animal si te los piden."
      pt: "Você também precisa cumprir as regras do Jordbruksverket e conseguir apresentar seu número de declaração e os documentos do animal, se pedirem."
    - en: "A dog bought, adopted or received as a gift from a non-EU country may be subject to customs duty and VAT."
      fr: "Un chien acheté, adopté ou reçu en cadeau depuis un pays hors UE peut être soumis aux droits de douane et à la TVA."
      es: "Un perro comprado, adoptado o recibido como regalo desde un país fuera de la UE puede estar sujeto a derechos de aduana e IVA."
      pt: "Um cachorro comprado, adotado ou recebido de presente em um país fora da UE pode estar sujeito a imposto de importação e IVA."
    - en: "If documents are missing or invalid, the animal may be denied entry, quarantined at the owner's expense or, in the worst case, euthanised."
      fr: "Si les documents manquent ou sont invalides, l'animal peut être refusé, mis en quarantaine aux frais du propriétaire ou, au pire, euthanasié."
      es: "Si faltan documentos o no son válidos, el animal puede ser rechazado, puesto en cuarentena a cargo del propietario o, en el peor de los casos, sacrificado."
      pt: "Se faltarem documentos ou eles não forem válidos, o animal pode ter a entrada recusada, ser colocado em quarentena às custas do dono ou, na pior das hipóteses, ser sacrificado."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Sweden has no breed-specific legislation: no dog breed is banned from ownership or import. Instead, Sweden follows an owner-responsibility model under the Act on the supervision of dogs and cats (Lag 2007:1150, the 'Tillsynslagen')."
    fr: "La Suède n'a aucune législation par race : aucune race de chien n'est interdite de détention ou d'importation. La Suède applique au contraire un modèle de responsabilité du propriétaire, encadré par la loi sur la surveillance des chiens et des chats (Lag 2007:1150, la « Tillsynslagen »)."
    es: "Suecia no tiene legislación específica por razas: ninguna raza de perro está prohibida para la tenencia o la importación. En su lugar, Suecia sigue un modelo de responsabilidad del propietario en virtud de la Ley de supervisión de perros y gatos (Lag 2007:1150, la «Tillsynslagen»)."
    pt: "A Suécia não tem legislação específica por raça: nenhuma raça de cachorro é proibida de ser mantida ou importada. Em vez disso, a Suécia adota um modelo de responsabilidade do dono, previsto na Lei de supervisão de cães e gatos (Lag 2007:1150, a “Tillsynslagen”)."
  cat1:
    en: "There is no 'Category 1' of prohibited breeds in Sweden. No breed — including types banned elsewhere, such as the pit bull or XL Bully — is refused entry on the basis of breed alone."
    fr: "Il n'existe pas de « catégorie 1 » de races interdites en Suède. Aucune race — y compris les types interdits ailleurs, comme le pit-bull ou l'XL Bully — n'est refusée à l'entrée sur le seul fondement de la race."
    es: "No existe una «categoría 1» de razas prohibidas en Suecia. Ninguna raza — incluidos los tipos prohibidos en otros lugares, como el pit bull o el XL Bully — es rechazada en la entrada únicamente por su raza."
    pt: "Não existe “categoria 1” de raças proibidas na Suécia. Nenhuma raça — nem mesmo os tipos proibidos em outros países, como o pit bull ou o XL Bully — tem a entrada recusada apenas por causa da raça."
  cat2:
    en: "There is no 'Category 2' of specially regulated breeds either. Any dog can be individually assessed by the police or the county administrative board (länsstyrelsen), which may order a muzzle, a leash, supervision or, for a genuinely dangerous individual dog, that it be put down — regardless of breed."
    fr: "Il n'existe pas non plus de « catégorie 2 » de races spécialement réglementées. Tout chien peut faire l'objet d'une évaluation individuelle par la police ou la préfecture régionale (länsstyrelsen), qui peut imposer muselière, laisse, surveillance ou, pour un chien individuellement dangereux, son euthanasie — quelle que soit la race."
    es: "Tampoco existe una «categoría 2» de razas especialmente reguladas. Cualquier perro puede ser evaluado individualmente por la policía o la administración provincial (länsstyrelsen), que puede ordenar bozal, correa, vigilancia o, para un perro individualmente peligroso, su sacrificio — con independencia de la raza."
    pt: "Também não existe “categoria 2” de raças com regulamentação especial. Qualquer cachorro pode ser avaliado individualmente pela polícia ou pela administração do condado (länsstyrelsen), que pode determinar o uso de focinheira, de guia, supervisão ou, no caso de um cachorro realmente perigoso, o sacrifício do animal — seja qual for a raça."
  note:
    en: "Because the rules target individual behaviour, not breed, owners must keep dogs under proper supervision so they do not cause harm or serious disturbance. The police may also bar an unsuitable person from keeping a dog."
    fr: "Comme les règles visent le comportement individuel et non la race, les propriétaires doivent tenir leur chien sous surveillance appropriée pour éviter tout dommage ou trouble grave. La police peut aussi interdire à une personne inapte de détenir un chien."
    es: "Como las normas se dirigen al comportamiento individual y no a la raza, los propietarios deben mantener a sus perros bajo la debida vigilancia para que no causen daños ni molestias graves. La policía también puede prohibir a una persona no apta tener un perro."
    pt: "Como as regras miram o comportamento individual, e não a raça, os donos precisam manter o cachorro sob supervisão adequada para que ele não cause danos nem perturbação grave. A polícia também pode proibir uma pessoa inapta de ter um cachorro."

