# Country Entry Guide — Venezuela (bilingual EN/FR).
# Venezuela is NOT in the EU. This encodes Venezuela's own scheme run by INSAI
# (Instituto Nacional de Salud Agrícola Integral): a certificate-based import with a
# movement permit (guía de movilización) issued/paid on arrival, plus extra rules for
# pets coming from the EU. Venezuela publishes little in stable form — many fields are
# marked Unknown / Non communiqué and overall confidence is LOW.
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_ve
iso2: "VE"
name: { en: "Venezuela", fr: "Venezuela", es: "Venezuela", pt: "Venezuela" }
region: { en: "South America", fr: "Amérique du Sud", es: "América del Sur", pt: "América do Sul" }


regime: non_listed
exit:
  authority: INSAI
  authorityUrl: https://www.insai.gob.ve/requisitos
  intro:
    en: "Venezuela is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Instituto Nacional de Salud Agrícola Integral (INSAI)."
    fr: "Le Venezuela est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par l'Instituto Nacional de Salud Agrícola Integral (INSAI)."
    es: "Venezuela no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el Instituto Nacional de Salud Agrícola Integral (INSAI)."
    pt: "A Venezuela é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação avalizado pelo Instituto Nacional de Salud Agrícola Integral (INSAI)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: eu
      text:
        en: "INSAI issues the export inspection certificate with the current rabies and deworming records; for the EU it also requires the microchip and an approved-lab antibody titer."
        fr: "L'INSAI délivre le certificat d'inspection d'export avec le carnet antirabique et vermifuge à jour ; pour l'UE, il exige aussi la puce et un titrage en labo agréé."
        es: "El INSAI emite el certificado de inspección de exportación con el registro antirrábico y de desparasitación al día; para la UE también exige el microchip y una titulación en laboratorio aprobado."
        pt: "O INSAI emite o certificado de inspeção para exportação com os registros atualizados de raiva e de vermifugação; para a UE, exige também o microchip e um teste sorológico antirrábico (titulação) feito em laboratório aprovado."
    - timing: window
      scope: non_eu
      text:
        en: "INSAI issues the export inspection certificate with the current rabies and deworming records."
        fr: "L'INSAI délivre le certificat d'inspection à l'export avec les registres à jour de vaccination antirabique et de vermifugation."
        es: "El INSAI expide el certificado de inspección de exportación con los registros vigentes de vacunación antirrábica y desparasitación."
        pt: "O INSAI emite o certificado de inspeção de exportação com os registros atualizados de vacinação antirrábica e vermifugação."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Venezuela with your dog", fr: "Voyager au Venezuela avec ton chien", es: "Viajar a Venezuela con tu perro", pt: "Viajar para a Venezuela com o seu cachorro" }
  intro:
    en: >-
      Venezuela welcomes dogs, and its rules are run by INSAI (Instituto Nacional de Salud Agrícola
      Integral), the national agricultural-health authority that regulates the entry of animals. There
      is no EU pet passport here: a dog entering with its owner needs a valid rabies vaccination
      certificate, a current international veterinary health certificate, an up-to-date vaccination card
      (the canine "séxtuple"), proof of internal and external deworming, and an official zoosanitary
      export certificate from the country of origin. On arrival, INSAI issues a movement permit (guía de
      movilización) against a set fee. Pets coming from the European Union face an extra step — a
      microchip and a rabies antibody test, or an EU pet passport instead. One important warning:
      Venezuelan law prohibits importing pit-bull-type dogs. Venezuela publishes little of this in a
      stable, central form, so treat the details below as a starting framework and confirm the current
      requirements with INSAI and your veterinarian before you book.
    fr: >-
      Le Venezuela accueille les chiens, et ses règles sont gérées par l'INSAI (Instituto Nacional de
      Salud Agrícola Integral), l'autorité nationale de santé agricole qui encadre l'entrée des animaux.
      Pas de passeport européen ici : un chien entrant avec son propriétaire a besoin d'un certificat de
      vaccination antirabique valide, d'un certificat sanitaire vétérinaire international en cours, d'une
      carte de vaccination à jour (la « séxtuple » canine), d'une preuve de vermifugation interne et
      externe, et d'un certificat zoosanitaire d'exportation du pays d'origine. À l'arrivée, l'INSAI
      délivre un permis de mobilisation (guía de movilización) contre une taxe. Les animaux venant de
      l'Union européenne ont une étape supplémentaire — puce et titrage antirabique, ou passeport
      européen à la place. Un avertissement important : la loi vénézuélienne interdit l'importation des
      chiens de type pit-bull. Le Venezuela publie peu de ces informations de façon stable et centralisée
      ; considère donc les détails ci-dessous comme un cadre de départ et confirme les exigences en
      vigueur auprès de l'INSAI et de ton vétérinaire avant de réserver.
    es: >-
      Venezuela acoge a los perros, y sus normas las gestiona el INSAI (Instituto Nacional de Salud
      Agrícola Integral), la autoridad nacional de sanidad agrícola que regula la entrada de animales.
      Aquí no hay pasaporte europeo para mascotas: un perro que entra con su propietario necesita un
      certificado de vacunación antirrábica válido, un certificado sanitario veterinario internacional
      vigente, una cartilla de vacunación al día (la «séxtuple» canina), un comprobante de desparasitación
      interna y externa, y un certificado zoosanitario de exportación oficial del país de origen. A la
      llegada, el INSAI expide un permiso de movilización (guía de movilización) mediante el pago de una
      tasa establecida. Las mascotas procedentes de la Unión Europea tienen un paso adicional — un
      microchip y una prueba de titulación de rabia, o un pasaporte europeo para mascotas en su lugar. Una
      advertencia importante: la ley venezolana prohíbe importar perros de tipo pit-bull. Venezuela
      publica poco de esto de forma estable y centralizada, así que trata los detalles siguientes como un
      marco de partida y confirma los requisitos vigentes con el INSAI y tu veterinario antes de reservar.

    pt: "A Venezuela recebe bem os cachorros, e as suas regras são conduzidas pelo INSAI (Instituto Nacional de Salud Agrícola Integral), a autoridade nacional de saúde agrícola que regula a entrada de animais. Aqui não existe passaporte europeu para animais: um cachorro que entra acompanhando o dono precisa de um certificado de vacinação antirrábica válido, de um atestado veterinário internacional de saúde em vigor, de uma carteira de vacinação atualizada (a \"séxtuple\" canina), de comprovação de vermifugação interna e externa e de um certificado zoossanitário oficial de exportação do país de origem. Na chegada, o INSAI emite uma guia de movimentação (guía de movilización) mediante o pagamento de uma taxa fixa. Os animais vindos da União Europeia enfrentam uma etapa a mais — um microchip e um teste sorológico antirrábico (titulação), ou, em vez disso, um passaporte europeu para animais. Um aviso importante: a lei venezuelana proíbe a importação de cachorros do tipo pit bull. A Venezuela publica pouco disso de forma estável e centralizada, portanto trate os detalhes abaixo como um quadro inicial e confirme as exigências em vigor com o INSAI e com o seu veterinário antes de reservar."
difficulty:
  level: moderate
  label: { en: "Moderate — an INSAI scheme with several documents, extra EU-origin rules and a breed import ban", fr: "Modéré — un régime INSAI à plusieurs documents, des règles propres à l'origine UE et une interdiction d'importation de race", es: "Moderado — un esquema del INSAI con varios documentos, normas adicionales para el origen UE y una prohibición de importación por raza", pt: "Moderada — um esquema do INSAI com vários documentos, regras adicionais para quem vem da UE e uma proibição de importação por raça" }

prepTime:
  eu:
    en: "Standard case (dog from a non-EU country): a few days to assemble the documents once vaccinations are valid — the international health certificate is valid one month and the origin export certificate must be current at travel."
    fr: "Cas standard (chien venant d'un pays hors UE) : quelques jours pour réunir les documents une fois les vaccinations valides — le certificat sanitaire international est valable un mois et le certificat d'exportation d'origine doit être en cours au moment du voyage."
    es: "Caso estándar (perro procedente de un país fuera de la UE): unos días para reunir los documentos una vez que las vacunas están vigentes — el certificado sanitario internacional es válido un mes y el certificado de exportación de origen debe estar vigente en el momento del viaje."
    pt: "Caso padrão (cachorro vindo de um país fora da UE): alguns dias para reunir os documentos assim que as vacinas estiverem válidas — o atestado de saúde internacional vale um mês e o certificado de exportação de origem precisa estar em vigor na data da viagem."
  listed:
    en: "Coming from the European Union: allow more time — INSAI requires a microchip plus a rabies antibody test (or an EU pet passport instead). A laboratory antibody test can take about 15 to 21 days to return a result."
    fr: "En provenance de l'Union européenne : prévois plus de temps — l'INSAI exige une puce et un titrage antirabique (ou, à défaut, un passeport européen). Un titrage en laboratoire peut prendre environ 15 à 21 jours pour rendre un résultat."
    es: "Procedente de la Unión Europea: prevé más tiempo — el INSAI exige un microchip más una prueba de titulación de rabia (o, en su defecto, un pasaporte europeo para mascotas). Una prueba de titulación de laboratorio puede tardar unos 15 a 21 días en dar un resultado."
    pt: "Vindo da União Europeia: reserve mais tempo — o INSAI exige um microchip e um teste sorológico antirrábico (titulação) (ou, em vez disso, um passaporte europeu para animais). Um teste sorológico feito em laboratório pode levar cerca de 15 a 21 dias para dar resultado."
  nonListed:
    en: "Special cases: a species other than a dog or cat needs a prior INSAI import permit plus a permit from the Ministry of the Environment; a pit-bull-type dog cannot be imported at all. Allow much longer, or it may not be possible."
    fr: "Cas particuliers : une espèce autre que chien ou chat nécessite un permis d'importation préalable de l'INSAI et un permis du Ministère de l'Environnement ; un chien de type pit-bull ne peut pas être importé du tout. Prévois beaucoup plus de temps, voire c'est impossible."
    es: "Casos particulares: una especie distinta de perro o gato necesita un permiso de importación previo del INSAI más un permiso del Ministerio del Ambiente; un perro de tipo pit-bull no puede importarse en absoluto. Prevé mucho más tiempo, o puede que no sea posible."
    pt: "Casos especiais: uma espécie que não seja cachorro nem gato precisa de uma autorização de importação prévia do INSAI mais uma autorização do Ministério do Ambiente; um cachorro do tipo pit bull não pode ser importado de jeito nenhum. Conte com muito mais tempo — ou pode simplesmente não ser possível."

