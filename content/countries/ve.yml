factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Venezuela (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — le Venezuela (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Venezuela (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — a Venezuela (o seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Venezuela", fr: "Pays de destination — Venezuela", es: "País de destino — Venezuela", pt: "País de destino — Venezuela" }
      text:
        en: "Venezuela applies its own INSAI scheme: a valid rabies vaccination, an international health certificate, an up-to-date vaccination card (canine séxtuple), internal and external deworming, an origin export certificate, and a movement permit (guía de movilización) issued against a fee on arrival. Pit-bull-type dogs are banned from import."
        fr: "Le Venezuela applique son propre régime INSAI : vaccination antirabique valide, certificat sanitaire international, carte de vaccination à jour (séxtuple canine), vermifugation interne et externe, certificat d'exportation d'origine, et permis de mobilisation (guía de movilización) délivré contre une taxe à l'arrivée. Les chiens de type pit-bull sont interdits d'importation."
        es: "Venezuela aplica su propio esquema del INSAI: una vacunación antirrábica válida, un certificado sanitario internacional, una cartilla de vacunación al día (séxtuple canina), desparasitación interna y externa, un certificado de exportación de origen, y un permiso de movilización (guía de movilización) expedido mediante el pago de una tasa a la llegada. Los perros de tipo pit-bull están prohibidos para la importación."
        pt: "A Venezuela aplica o seu próprio esquema do INSAI: vacinação antirrábica válida, atestado de saúde internacional, carteira de vacinação atualizada (séxtuple canina), vermifugação interna e externa, certificado de exportação de origem e uma guia de movimentação (guía de movilización) emitida na chegada mediante pagamento de taxa. Cachorros do tipo pit bull são proibidos de importação."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "INSAI requires an official zoosanitary export certificate issued by the competent veterinary authority of the country of origin. The origin also changes the rules: pets coming from the European Union must additionally carry a microchip and a rabies antibody test, or an EU pet passport instead."
        fr: "L'INSAI exige un certificat zoosanitaire d'exportation officiel émis par l'autorité vétérinaire compétente du pays d'origine. L'origine change aussi les règles : les animaux venant de l'Union européenne doivent en plus porter une puce et un titrage antirabique, ou présenter à la place un passeport européen."
        es: "El INSAI exige un certificado zoosanitario de exportación oficial emitido por la autoridad veterinaria competente del país de origen. El origen también cambia las normas: las mascotas procedentes de la Unión Europea deben llevar además un microchip y una prueba de titulación de rabia, o presentar en su lugar un pasaporte europeo para mascotas."
        pt: "O INSAI exige um certificado zoossanitário oficial de exportação emitido pela autoridade veterinária competente do país de origem. A origem também muda as regras: os animais vindos da União Europeia precisam levar, além disso, um microchip e um teste sorológico antirrábico (titulação), ou, em vez disso, um passaporte europeu para animais."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "Your dog's recent residence and rabies history determine whether its vaccination record is complete and valid for the whole trip, and whether the EU-origin extra steps apply. It is the dog's real history that counts — not only the last airport."
        fr: "La résidence récente et l'historique rabique du chien déterminent si son carnet de vaccination est complet et valide pour tout le voyage, et si les étapes supplémentaires propres à l'origine UE s'appliquent. C'est l'historique réel du chien qui compte — pas seulement le dernier aéroport."
        es: "La residencia reciente y el historial de rabia de tu perro determinan si su registro de vacunación está completo y en vigor para todo el viaje, y si se aplican los pasos adicionales propios del origen UE. Lo que cuenta es el historial real del perro — no solo el último aeropuerto."
        pt: "A residência recente do seu cachorro e o histórico dele em relação à raiva determinam se o registro de vacinação está completo e válido para toda a viagem, e se as etapas adicionais para quem vem da UE se aplicam. O que conta é o histórico real do cachorro — não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Venezuela's framework, then confirm your dog's exact origin, breed and history with INSAI and your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre vénézuélien, puis confirme l'origine, la race et l'historique exacts de ton chien auprès de l'INSAI et de ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Venezuela y luego confirma el origen, la raza y el historial exactos de tu perro con el INSAI y tu veterinario."
    pt: "Portanto, leia as exigências abaixo como o quadro geral da Venezuela e depois confirme a origem exata, a raça e o histórico do seu cachorro com o INSAI e com o seu veterinário."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required for EU-origin pets; recommended otherwise", fr: "Requise pour les animaux d'origine UE ; recommandée sinon", es: "Obligatorio para mascotas de origen UE; recomendado en los demás casos", pt: "Obrigatório para animais com origem na UE; recomendado nos demais casos" }
    when: { en: "INSAI requires a 12–15 digit identification microchip for pets entering from the European Union (together with a rabies antibody test, or an EU pet passport instead). For other origins a microchip is not stated as mandatory but is strongly advised for identification and the return trip.", fr: "L'INSAI exige une puce d'identification de 12 à 15 chiffres pour les animaux entrant depuis l'Union européenne (avec un titrage antirabique, ou un passeport européen à la place). Pour les autres origines, la puce n'est pas indiquée comme obligatoire mais fortement conseillée pour l'identification et le retour.", es: "El INSAI exige un microchip de identificación de 12 a 15 dígitos para las mascotas que entran desde la Unión Europea (junto con una prueba de titulación de rabia, o un pasaporte europeo en su lugar). Para otros orígenes, el microchip no se indica como obligatorio pero se recomienda encarecidamente para la identificación y el viaje de regreso.", pt: "O INSAI exige um microchip de identificação de 12 a 15 dígitos para os animais que entram vindos da União Europeia (junto com um teste sorológico antirrábico (titulação) ou, em vez disso, um passaporte europeu para animais). Para outras origens, o microchip não é declarado obrigatório, mas é fortemente recomendado para a identificação e para a viagem de volta." }
    exceptions: { en: "A US export health certificate identifies the dog by its recorded details rather than a mandatory microchip. Confirm the current identification rule with INSAI.", fr: "Un certificat sanitaire d'exportation américain identifie le chien par ses données consignées plutôt que par une puce obligatoire. Vérifie la règle d'identification en vigueur auprès de l'INSAI.", es: "Un certificado sanitario de exportación estadounidense identifica al perro por sus datos registrados en lugar de por un microchip obligatorio. Confirma la norma de identificación vigente con el INSAI.", pt: "O atestado de saúde de exportação dos EUA identifica o cachorro pelos dados registrados, e não por um microchip obrigatório. Confirme a regra de identificação em vigor com o INSAI." }
    ref: { en: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela", fr: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela", es: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela", pt: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "A current rabies vaccination certificate is required, no more than one year old (original and copy). The US export health certificate to Venezuela likewise certifies rabies vaccination, except for a dog less than 4 months old.", fr: "Un certificat de vaccination antirabique en cours est requis, datant de moins d'un an (original et copie). Le certificat sanitaire d'exportation américain vers le Venezuela atteste également la vaccination antirabique, sauf pour un chien de moins de 4 mois.", es: "Se exige un certificado de vacunación antirrábica vigente, de menos de un año de antigüedad (original y copia). El certificado sanitario de exportación estadounidense a Venezuela también certifica la vacunación antirrábica, salvo para un perro de menos de 4 meses.", pt: "É exigido um certificado de vacinação antirrábica em vigor, com no máximo um ano (original e cópia). O atestado de saúde de exportação dos EUA para a Venezuela também atesta a vacinação antirrábica, exceto para o cachorro com menos de 4 meses de idade." }
    exceptions: { en: "A dog under 4 months old is not required to be vaccinated against rabies on the US export certificate; a dog under 3 months cannot travel to the EU/UK because it is not yet rabies-vaccinated.", fr: "Un chien de moins de 4 mois n'a pas à être vacciné contre la rage sur le certificat d'exportation américain ; un chien de moins de 3 mois ne peut pas voyager vers l'UE/le Royaume-Uni car il n'est pas encore vacciné contre la rage.", es: "Un perro de menos de 4 meses no está obligado a estar vacunado contra la rabia en el certificado de exportación estadounidense; un perro de menos de 3 meses no puede viajar a la UE/Reino Unido porque aún no está vacunado contra la rabia.", pt: "Um cachorro com menos de 4 meses não precisa estar vacinado contra a raiva no certificado de exportação dos EUA; um cachorro com menos de 3 meses não pode viajar para a UE nem para o Reino Unido porque ainda não está vacinado contra a raiva." }
    ref: { en: "INSAI — Requisitos de ingreso; USDA APHIS — Health Certificate for export of dogs and cats to Venezuela", fr: "INSAI — Requisitos de ingreso ; USDA APHIS — Certificat sanitaire d'exportation de chiens et chats vers le Venezuela", es: "INSAI — Requisitos de ingreso; USDA APHIS — Certificado sanitario para la exportación de perros y gatos a Venezuela", pt: "INSAI — Requisitos de ingreso; USDA APHIS — atestado de saúde para exportação de cães e gatos para a Venezuela" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Only for pets from the EU", fr: "Uniquement pour les animaux venant de l'UE", es: "Solo para mascotas procedentes de la UE", pt: "Somente para animais vindos da UE" }
    when: { en: "Pets entering Venezuela from the European Union must present a rabies neutralizing antibody test together with a microchip — or, instead, the original and copy of the EU pet passport. The test is not stated as a requirement for pets from other origins.", fr: "Les animaux entrant au Venezuela depuis l'Union européenne doivent présenter un titrage des anticorps neutralisants de la rage avec une puce — ou, à la place, l'original et une copie du passeport européen de l'animal. Le titrage n'est pas indiqué comme exigence pour les animaux d'autres origines.", es: "Las mascotas que entran en Venezuela desde la Unión Europea deben presentar una prueba de anticuerpos neutralizantes de la rabia junto con un microchip — o, en su lugar, el original y una copia del pasaporte europeo de la mascota. La prueba no se indica como requisito para las mascotas de otros orígenes.", pt: "Os animais que entram na Venezuela vindos da União Europeia devem apresentar um teste de anticorpos neutralizantes da raiva junto com um microchip — ou, em vez disso, o original e a cópia do passaporte europeu para animais. O teste não é declarado como exigência para animais de outras origens." }
    exceptions: { en: "INSAI notes the antibody test can be run in the USA, Spain and France, or the sample sent to the INIA laboratory in Maracay (Aragua), and that a result may take about 15–21 days.", fr: "L'INSAI note que le titrage peut être réalisé aux États-Unis, en Espagne et en France, ou l'échantillon envoyé au laboratoire de l'INIA à Maracay (Aragua), et qu'un résultat peut prendre environ 15 à 21 jours.", es: "El INSAI señala que la prueba de titulación puede realizarse en EE. UU., España y Francia, o la muestra enviarse al laboratorio del INIA en Maracay (Aragua), y que un resultado puede tardar unos 15 a 21 días.", pt: "O INSAI indica que o teste sorológico pode ser feito nos EUA, na Espanha e na França, ou que a amostra pode ser enviada ao laboratório do INIA em Maracay (Aragua), e que o resultado pode levar cerca de 15 a 21 dias." }
    ref: { en: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela", fr: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela", es: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela", pt: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela" }
  - item: { en: "Core vaccinations (séxtuple)", fr: "Vaccins de base (séxtuple)", es: "Vacunas básicas (séxtuple)", pt: "Vacinas essenciais (séxtuple)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorias", pt: "Obrigatório" }
    when: { en: "A current vaccination card (original and copy, valid one year) must show the canine 'séxtuple' with the batch, expiry date and product name. The US export certificate lists distemper, hepatitis, leptospirosis, parvovirus and parainfluenza for dogs.", fr: "Une carte de vaccination en cours (original et copie, valable un an) doit indiquer la « séxtuple » canine avec le lot, la date de péremption et le nom du produit. Le certificat d'exportation américain énumère la maladie de Carré, l'hépatite, la leptospirose, le parvovirus et le parainfluenza pour les chiens.", es: "Una cartilla de vacunación vigente (original y copia, válida un año) debe mostrar la «séxtuple» canina con el lote, la fecha de caducidad y el nombre del producto. El certificado de exportación estadounidense enumera el moquillo, la hepatitis, la leptospirosis, el parvovirus y la parainfluenza para los perros.", pt: "A carteira de vacinação em dia (original e cópia, válida por um ano) deve mostrar a \"séxtuple\" canina com o lote, a data de validade e o nome do produto. O certificado de exportação dos EUA lista, para os cachorros, cinomose, hepatite, leptospirose, parvovirose e parainfluenza." }
    exceptions: { en: "—", fr: "—", es: "—", pt: "—" }
    ref: { en: "INSAI — Requisitos de ingreso; USDA APHIS — Health Certificate (dogs & cats, Venezuela)", fr: "INSAI — Requisitos de ingreso ; USDA APHIS — Certificat sanitaire (chiens & chats, Venezuela)", es: "INSAI — Requisitos de ingreso; USDA APHIS — Certificado sanitario (perros y gatos, Venezuela)", pt: "INSAI — Requisitos de ingreso; USDA APHIS — atestado de saúde (cães e gatos, Venezuela)" }
  - item: { en: "Internal & external deworming", fr: "Vermifugation interne & externe", es: "Desparasitación interna y externa", pt: "Vermifugação interna e externa" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "A current deworming certificate (original and copy, valid three months) must state the full identification of the product used and the date it was administered, against both internal and external parasites.", fr: "Un certificat de vermifugation en cours (original et copie, valable trois mois) doit indiquer l'identification complète du produit utilisé et la date d'application, contre les parasites internes et externes.", es: "Un certificado de desparasitación vigente (original y copia, válido tres meses) debe indicar la identificación completa del producto utilizado y la fecha en que se administró, contra parásitos tanto internos como externos.", pt: "O certificado de vermifugação em vigor (original e cópia, válido por três meses) deve indicar a identificação completa do produto usado e a data de aplicação, contra parasitas tanto internos quanto externos." }
    exceptions: { en: "No specific tapeworm (Echinococcus) treatment window is published — a general internal and external parasite treatment is required.", fr: "Aucun délai spécifique de traitement contre l'échinococcose n'est publié — un traitement antiparasitaire interne et externe général est exigé.", es: "No se publica ningún plazo específico de tratamiento contra la tenia (Echinococcus) — se exige un tratamiento antiparasitario interno y externo general.", pt: "Não há prazo específico publicado para o tratamento contra tênia (Echinococcus) — o que se exige é um tratamento geral contra parasitas internos e externos." }
    ref: { en: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela", fr: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela", es: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela", pt: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela" }
  - item: { en: "International veterinary health certificate", fr: "Certificat sanitaire vétérinaire international", es: "Certificado sanitario veterinario internacional", pt: "Atestado de saúde veterinário internacional" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "A current international health certificate (original and copy, valid one month) must certify that the animal was examined and showed no signs or symptoms of any infectious-contagious disease. From the USA, the USDA-endorsed export health certificate is examined within 10 days of departure and is valid 14 days after issuance.", fr: "Un certificat sanitaire international en cours (original et copie, valable un mois) doit attester que l'animal a été examiné et ne présentait aucun signe ni symptôme de maladie infecto-contagieuse. Depuis les États-Unis, le certificat d'exportation avalisé par l'USDA est établi après un examen dans les 10 jours avant le départ et est valable 14 jours après émission.", es: "Un certificado sanitario internacional vigente (original y copia, válido un mes) debe certificar que el animal fue examinado y no presentaba signos ni síntomas de ninguna enfermedad infectocontagiosa. Desde EE. UU., el certificado de exportación refrendado por el USDA se emite tras un examen dentro de los 10 días previos a la salida y es válido 14 días después de su emisión.", pt: "O atestado de saúde internacional em vigor (original e cópia, válido por um mês) deve certificar que o animal foi examinado e não apresentou sinais nem sintomas de nenhuma doença infectocontagiosa. Nos EUA, o atestado de saúde de exportação avalizado pelo USDA baseia-se em um exame feito nos 10 dias anteriores à partida e vale 14 dias após a emissão." }
    exceptions: { en: "The certificate must be issued by a veterinarian recognised by the competent authority; from the USA it is endorsed by USDA APHIS.", fr: "Le certificat doit être émis par un vétérinaire reconnu par l'autorité compétente ; depuis les États-Unis, il est avalisé par l'USDA APHIS.", es: "El certificado debe ser emitido por un veterinario reconocido por la autoridad competente; desde EE. UU. lo refrenda el USDA APHIS.", pt: "O certificado deve ser emitido por um veterinário reconhecido pela autoridade competente; nos EUA, ele é avalizado pelo USDA APHIS." }
    ref: { en: "INSAI — Requisitos de ingreso; USDA APHIS — Health Certificate for export to Venezuela", fr: "INSAI — Requisitos de ingreso ; USDA APHIS — Certificat sanitaire d'exportation vers le Venezuela", es: "INSAI — Requisitos de ingreso; USDA APHIS — Certificado sanitario para la exportación a Venezuela", pt: "INSAI — Requisitos de ingreso; USDA APHIS — atestado de saúde para exportação para a Venezuela" }
  - item: { en: "Origin zoosanitary export certificate", fr: "Certificat zoosanitaire d'exportation d'origine", es: "Certificado zoosanitario de exportación de origen", pt: "Certificado zoossanitário de exportação do país de origem" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "INSAI requires the official zoosanitary export certificate for pets (dogs and/or cats) issued by the competent authorities of the country of origin, in addition to the international health certificate.", fr: "L'INSAI exige le certificat zoosanitaire d'exportation officiel pour animaux de compagnie (chiens et/ou chats) émis par les autorités compétentes du pays d'origine, en plus du certificat sanitaire international.", es: "El INSAI exige el certificado zoosanitario de exportación oficial para mascotas (perros o gatos) emitido por las autoridades competentes del país de origen, además del certificado sanitario internacional.", pt: "O INSAI exige o certificado zoossanitário oficial de exportação de animais de estimação (cachorros e/ou gatos) emitido pelas autoridades competentes do país de origem, além do atestado de saúde internacional." }
    exceptions: { en: "—", fr: "—", es: "—", pt: "—" }
    ref: { en: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela", fr: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela", es: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela", pt: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela" }
  - item: { en: "INSAI movement permit (guía de movilización)", fr: "Permis de mobilisation INSAI (guía de movilización)", es: "Permiso de movilización del INSAI (guía de movilización)", pt: "Guia de movimentação do INSAI (guía de movilización)" }
    required: { en: "Required on arrival", fr: "Requis à l'arrivée", es: "Obligatorio a la llegada", pt: "Obrigatória na chegada" }
    when: { en: "A sanitary movement permit for animals is issued by INSAI against a fee/bank deposit of 5 tax units (UT), under Article 81(32) of the Ley de Salud Agrícola Integral. For arrivals at Maiquetía (Simón Bolívar International Airport) it is handled at the INSAI airport office, floor 3, customs area (passenger section).", fr: "Un permis sanitaire de mobilisation des animaux est délivré par l'INSAI contre une taxe/dépôt bancaire de 5 unités tributaires (UT), au titre de l'article 81(32) de la Ley de Salud Agrícola Integral. Pour les arrivées à Maiquetía (aéroport international Simón Bolívar), il est traité au bureau aéroportuaire de l'INSAI, étage 3, zone de douane (section passagers).", es: "El INSAI expide un permiso sanitario de movilización de animales mediante el pago de una tasa/depósito bancario de 5 unidades tributarias (UT), conforme al artículo 81(32) de la Ley de Salud Agrícola Integral. Para las llegadas a Maiquetía (Aeropuerto Internacional Simón Bolívar) se tramita en la oficina del INSAI en el aeropuerto, piso 3, zona de aduanas (sección de pasajeros).", pt: "A guia sanitária de movimentação de animais é emitida pelo INSAI mediante taxa/depósito bancário de 5 unidades tributárias (UT), conforme o artigo 81(32) da Ley de Salud Agrícola Integral. Para chegadas em Maiquetía (Aeroporto Internacional Simón Bolívar), o trâmite é feito no escritório do INSAI no aeroporto, no andar 3, na área da alfândega (setor de passageiros)." }
    exceptions: { en: "No consular procedure is required for a personal dog or cat. Fee amounts in UT and office locations can change — confirm with INSAI.", fr: "Aucune démarche consulaire n'est requise pour un chien ou un chat de compagnie. Les montants en UT et les adresses des bureaux peuvent changer — vérifie auprès de l'INSAI.", es: "No se requiere ningún trámite consular para un perro o gato de compañía. Los importes en UT y las ubicaciones de las oficinas pueden cambiar — confírmalo con el INSAI.", pt: "Não é exigido nenhum trâmite consular para um cachorro ou gato particular. Os valores da taxa em UT e a localização dos escritórios podem mudar — confirme com o INSAI." }
    ref: { en: "INSAI — Requisitos de ingreso; Ley de Salud Agrícola Integral, Art. 81(32)", fr: "INSAI — Requisitos de ingreso ; Ley de Salud Agrícola Integral, art. 81(32)", es: "INSAI — Requisitos de ingreso; Ley de Salud Agrícola Integral, art. 81(32)", pt: "INSAI — Requisitos de ingreso; Ley de Salud Agrícola Integral, art. 81(32)" }
  - item: { en: "Import permit (other species)", fr: "Permis d'importation (autres espèces)", es: "Permiso de importación (otras especies)", pt: "Autorização de importação (outras espécies)" }
    required: { en: "Only for species other than dogs/cats", fr: "Uniquement pour les espèces autres que chiens/chats", es: "Solo para especies distintas de perros/gatos", pt: "Somente para espécies que não sejam cachorros/gatos" }
    when: { en: "To bring in a pet that is not a dog or cat, you must first obtain an Import Permit issued by INSAI plus a permit from the Ministry of the Environment.", fr: "Pour faire entrer un animal autre qu'un chien ou un chat, tu dois obtenir au préalable un permis d'importation émis par l'INSAI et un permis du Ministère de l'Environnement.", es: "Para hacer entrar una mascota que no sea perro o gato, debes obtener primero un permiso de importación emitido por el INSAI más un permiso del Ministerio del Ambiente.", pt: "Para trazer um animal de estimação que não seja cachorro nem gato, você precisa obter primeiro uma autorização de importação emitida pelo INSAI mais uma autorização do Ministério do Ambiente." }
    exceptions: { en: "A prior import permit is not stated as required for a personal dog or cat accompanying its owner.", fr: "Un permis d'importation préalable n'est pas indiqué comme requis pour un chien ou un chat de compagnie accompagnant son propriétaire.", es: "No se indica que se exija un permiso de importación previo para un perro o gato de compañía que acompaña a su propietario.", pt: "Não consta exigência de autorização de importação prévia para um cachorro ou gato particular que acompanha o dono." }
    ref: { en: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela", fr: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela", es: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela", pt: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela" }
  - item: { en: "Border / airport check", fr: "Contrôle frontalier / aéroport", es: "Control fronterizo / aeropuerto", pt: "Controle na fronteira / no aeroporto" }
    required: { en: "Required on arrival", fr: "Requis à l'arrivée", es: "Obligatorio a la llegada", pt: "Obrigatória na chegada" }
    when: { en: "INSAI processes pets at the point of entry and issues the movement permit there; the fee is paid at the INSAI airport office on arrival. Exact inspection steps for imports are not published in detail.", fr: "L'INSAI traite les animaux au point d'entrée et y délivre le permis de mobilisation ; la taxe est payée au bureau aéroportuaire de l'INSAI à l'arrivée. Les étapes exactes d'inspection à l'importation ne sont pas publiées en détail.", es: "El INSAI procesa las mascotas en el punto de entrada y allí expide el permiso de movilización; la tasa se paga en la oficina del INSAI en el aeropuerto a la llegada. Los pasos exactos de inspección para las importaciones no se publican en detalle.", pt: "O INSAI atende os animais no ponto de entrada e emite ali a guia de movimentação; a taxa é paga no escritório do INSAI no aeroporto, na chegada. As etapas exatas de inspeção na importação não são publicadas em detalhe." }
    exceptions: { en: "The consequences of arriving with missing or invalid documents are not published — confirm with INSAI before travel.", fr: "Les conséquences d'une arrivée avec des documents manquants ou invalides ne sont pas publiées — vérifie auprès de l'INSAI avant le voyage.", es: "Las consecuencias de llegar con documentos que falten o no sean válidos no se publican — confírmalo con el INSAI antes de viajar.", pt: "As consequências de chegar com documentos faltando ou inválidos não são publicadas — confirme com o INSAI antes de viajar." }
    ref: { en: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela", fr: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela", es: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela", pt: "INSAI — Requisitos para el ingreso de mascotas (caninos y felinos) a Venezuela" }
  - item: { en: "Minimum age", fr: "Âge minimum", es: "Edad mínima", pt: "Idade mínima" }
    required: { en: "Not published (Unknown)", fr: "Non communiqué (inconnu)", es: "No publicado (desconocido)", pt: "Não publicado (não informado)" }
    when: { en: "INSAI does not publish a single minimum entry age for Venezuela. In practice age is tied to rabies vaccination: the US export certificate exempts a dog under 4 months from rabies vaccination, and a dog under 3 months cannot travel to the EU/UK.", fr: "L'INSAI ne publie pas d'âge minimum d'entrée unique pour le Venezuela. En pratique, l'âge est lié à la vaccination antirabique : le certificat d'exportation américain exempte un chien de moins de 4 mois de vaccination antirabique, et un chien de moins de 3 mois ne peut pas voyager vers l'UE/le Royaume-Uni.", es: "El INSAI no publica una única edad mínima de entrada para Venezuela. En la práctica, la edad está ligada a la vacunación antirrábica: el certificado de exportación estadounidense exime a un perro de menos de 4 meses de la vacunación antirrábica, y un perro de menos de 3 meses no puede viajar a la UE/Reino Unido.", pt: "O INSAI não publica uma idade mínima única de entrada na Venezuela. Na prática, a idade está ligada à vacinação antirrábica: o certificado de exportação dos EUA dispensa da vacinação antirrábica o cachorro com menos de 4 meses, e um cachorro com menos de 3 meses não pode viajar para a UE nem para o Reino Unido." }
    exceptions: { en: "Airline age rules and your home country's return rules may be stricter.", fr: "Les règles d'âge des compagnies et les règles de retour de ton pays peuvent être plus strictes.", es: "Las normas de edad de las aerolíneas y las normas de regreso de tu país pueden ser más estrictas.", pt: "As regras de idade da companhia aérea e as regras de retorno do seu país podem ser mais rígidas." }
    ref: { en: "USDA APHIS — Health Certificate (dogs & cats, Venezuela); INSAI notes", fr: "USDA APHIS — Certificat sanitaire (chiens & chats, Venezuela) ; notes INSAI", es: "USDA APHIS — Certificado sanitario (perros y gatos, Venezuela); notas del INSAI", pt: "USDA APHIS — atestado de saúde (cães e gatos, Venezuela); notas do INSAI" }
