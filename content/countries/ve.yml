origin:
  scheme: eu
  eu:
    title: { en: "Standard scheme — a dog entering from a non-EU country", fr: "Régime standard — un chien entrant depuis un pays hors UE", es: "Esquema estándar — un perro que entra desde un país fuera de la UE", pt: "Esquema padrão — um cachorro que entra vindo de um país fora da UE" }
    body:
      en: "For a dog or cat entering with its owner from a non-EU origin (for example the Americas), the path is document-based. Your dog needs a valid rabies vaccination certificate (≤ 1 year), a current international health certificate (valid one month), an up-to-date vaccination card showing the canine séxtuple, proof of internal and external deworming (valid three months), and the official zoosanitary export certificate from the origin country. On arrival INSAI issues the movement permit (guía de movilización) against a fee. No prior import permit is stated for a personal dog or cat."
      fr: "Pour un chien ou un chat entrant avec son propriétaire depuis une origine hors UE (par exemple les Amériques), le parcours est documentaire. Ton chien a besoin d'un certificat de vaccination antirabique valide (≤ 1 an), d'un certificat sanitaire international en cours (valable un mois), d'une carte de vaccination à jour indiquant la séxtuple canine, d'une preuve de vermifugation interne et externe (valable trois mois), et du certificat zoosanitaire d'exportation officiel du pays d'origine. À l'arrivée, l'INSAI délivre le permis de mobilisation (guía de movilización) contre une taxe. Aucun permis d'importation préalable n'est indiqué pour un chien ou un chat de compagnie."
      es: "Para un perro o gato que entra con su propietario desde un origen fuera de la UE (por ejemplo, las Américas), el camino es documental. Tu perro necesita un certificado de vacunación antirrábica válido (≤ 1 año), un certificado sanitario internacional vigente (válido un mes), una cartilla de vacunación al día que muestre la séxtuple canina, un comprobante de desparasitación interna y externa (válido tres meses), y el certificado zoosanitario de exportación oficial del país de origen. A la llegada, el INSAI expide el permiso de movilización (guía de movilización) mediante el pago de una tasa. No se indica ningún permiso de importación previo para un perro o gato de compañía."
      pt: "Para um cachorro ou gato que entra acompanhando o dono a partir de uma origem fora da UE (as Américas, por exemplo), o caminho é documental. O seu cachorro precisa de um certificado de vacinação antirrábica válido (≤ 1 ano), de um atestado de saúde internacional em vigor (válido por um mês), de uma carteira de vacinação atualizada mostrando a séxtuple canina, de comprovação de vermifugação interna e externa (válida por três meses) e do certificado zoossanitário oficial de exportação do país de origem. Na chegada, o INSAI emite a guia de movimentação (guía de movilización) mediante taxa. Não consta exigência de autorização de importação prévia para um cachorro ou gato particular."
    cls: ok
  listed:
    title: { en: "Pets coming from the European Union", fr: "Animaux venant de l'Union européenne", es: "Mascotas procedentes de la Unión Europea", pt: "Animais vindos da União Europeia" }
    body:
      en: "A dog or cat arriving from the European Union must additionally carry a 12–15 digit identification microchip and a rabies antibody test — or, instead, present the original and a copy of the EU pet passport. INSAI notes the antibody test can be run in the USA, Spain or France, or sent to the INIA laboratory in Maracay (Aragua), and a result can take about 15–21 days. All the standard documents (rabies certificate, health certificate, vaccination card, deworming, origin export certificate, movement permit) still apply."
      fr: "Un chien ou un chat arrivant de l'Union européenne doit en plus porter une puce d'identification de 12 à 15 chiffres et un titrage antirabique — ou, à la place, présenter l'original et une copie du passeport européen de l'animal. L'INSAI note que le titrage peut être réalisé aux États-Unis, en Espagne ou en France, ou envoyé au laboratoire de l'INIA à Maracay (Aragua), et qu'un résultat peut prendre environ 15 à 21 jours. Tous les documents standard (certificat antirabique, certificat sanitaire, carte de vaccination, vermifugation, certificat d'exportation d'origine, permis de mobilisation) s'appliquent toujours."
      es: "Un perro o gato que llega de la Unión Europea debe llevar además un microchip de identificación de 12 a 15 dígitos y una prueba de titulación de rabia — o, en su lugar, presentar el original y una copia del pasaporte europeo de la mascota. El INSAI señala que la prueba de titulación puede realizarse en EE. UU., España o Francia, o enviarse al laboratorio del INIA en Maracay (Aragua), y que un resultado puede tardar unos 15 a 21 días. Todos los documentos estándar (certificado antirrábico, certificado sanitario, cartilla de vacunación, desparasitación, certificado de exportación de origen, permiso de movilización) siguen aplicándose."
      pt: "Um cachorro ou gato que chega da União Europeia precisa levar, além disso, um microchip de identificação de 12 a 15 dígitos e um teste sorológico antirrábico (titulação) — ou, em vez disso, apresentar o original e uma cópia do passaporte europeu para animais. O INSAI indica que o teste sorológico pode ser feito nos EUA, na Espanha ou na França, ou enviado ao laboratório do INIA em Maracay (Aragua), e que o resultado pode levar cerca de 15 a 21 dias. Todos os documentos padrão (certificado antirrábico, atestado de saúde, carteira de vacinação, vermifugação, certificado de exportação de origem, guia de movimentação) continuam valendo."
    cls: warn
  nonListed:
    title: { en: "Other species & banned breeds", fr: "Autres espèces & races interdites", es: "Otras especies y razas prohibidas", pt: "Outras espécies e raças proibidas" }
    body:
      en: "A pet that is not a dog or cat cannot travel on this scheme: you must first obtain an INSAI Import Permit plus a permit from the Ministry of the Environment. And certain dogs cannot be imported at all — Venezuelan law (Gaceta Oficial N° 39.338, 2010) prohibits importing pit-bull-type dogs and their crosses. Verify your dog's breed against the current law before booking; a banned breed will be refused regardless of its paperwork."
      fr: "Un animal autre qu'un chien ou un chat ne peut pas voyager selon ce régime : tu dois d'abord obtenir un permis d'importation de l'INSAI et un permis du Ministère de l'Environnement. Et certains chiens ne peuvent pas être importés du tout — la loi vénézuélienne (Gaceta Oficial N° 39.338, 2010) interdit l'importation des chiens de type pit-bull et de leurs croisements. Vérifie la race de ton chien au regard de la loi en vigueur avant de réserver ; une race interdite sera refusée quels que soient ses documents."
      es: "Una mascota que no sea perro o gato no puede viajar bajo este esquema: debes obtener primero un permiso de importación del INSAI más un permiso del Ministerio del Ambiente. Y ciertos perros no pueden importarse en absoluto — la ley venezolana (Gaceta Oficial N° 39.338, 2010) prohíbe importar perros de tipo pit-bull y sus cruces. Verifica la raza de tu perro conforme a la ley vigente antes de reservar; una raza prohibida será rechazada sea cual sea su documentación."
      pt: "Um animal de estimação que não seja cachorro nem gato não pode viajar por esse esquema: você precisa obter primeiro uma autorização de importação do INSAI mais uma autorização do Ministério do Ambiente. E certos cachorros não podem ser importados de jeito nenhum — a lei venezuelana (Gaceta Oficial N° 39.338, 2010) proíbe a importação de cachorros do tipo pit bull e de seus cruzamentos. Confira a raça do seu cachorro na lei em vigor antes de reservar; uma raça proibida será recusada, independentemente da papelada."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Venezuela centres on INSAI at your point of entry, most often Maiquetía (Simón Bolívar International Airport)."
    fr: "Ce qui se passe à l'arrivée de ton chien au Venezuela s'articule autour de l'INSAI à ton point d'entrée, le plus souvent Maiquetía (aéroport international Simón Bolívar)."
    es: "Lo que ocurre cuando tu perro llega a Venezuela gira en torno al INSAI en tu punto de entrada, con mayor frecuencia Maiquetía (Aeropuerto Internacional Simón Bolívar)."
    pt: "O que acontece quando o seu cachorro chega à Venezuela gira em torno do INSAI no seu ponto de entrada, na maioria das vezes Maiquetía (Aeroporto Internacional Simón Bolívar)."
  points:
    - en: "Present your dog and all documents (rabies certificate, international health certificate, vaccination card, deworming certificate and origin export certificate) to INSAI at the point of entry."
      fr: "Présente ton chien et tous les documents (certificat antirabique, certificat sanitaire international, carte de vaccination, certificat de vermifugation et certificat d'exportation d'origine) à l'INSAI au point d'entrée."
      es: "Presenta tu perro y todos los documentos (certificado antirrábico, certificado sanitario internacional, cartilla de vacunación, certificado de desparasitación y certificado de exportación de origen) al INSAI en el punto de entrada."
      pt: "Apresente o seu cachorro e todos os documentos (certificado antirrábico, atestado de saúde internacional, carteira de vacinação, certificado de vermifugação e certificado de exportação de origem) ao INSAI no ponto de entrada."
    - en: "At Maiquetía the movement permit (guía de movilización) is handled at the INSAI airport office on floor 3 in the customs area (passenger section), against a fee of 5 tax units (UT)."
      fr: "À Maiquetía, le permis de mobilisation (guía de movilización) est traité au bureau aéroportuaire de l'INSAI, étage 3, zone de douane (section passagers), contre une taxe de 5 unités tributaires (UT)."
      es: "En Maiquetía, el permiso de movilización (guía de movilización) se tramita en la oficina del INSAI en el aeropuerto, piso 3, zona de aduanas (sección de pasajeros), mediante el pago de una tasa de 5 unidades tributarias (UT)."
      pt: "Em Maiquetía, a guia de movimentação (guía de movilización) é emitida no escritório do INSAI no aeroporto, no andar 3, na área da alfândega (setor de passageiros), mediante taxa de 5 unidades tributárias (UT)."
    - en: "Carry the original documents and a copy of each; INSAI's published requirements ask for both the original and a copy."
      fr: "Munis-toi des documents originaux et d'une copie de chacun ; les exigences publiées par l'INSAI demandent l'original et une copie."
      es: "Lleva los documentos originales y una copia de cada uno; los requisitos publicados por el INSAI piden tanto el original como una copia."
      pt: "Leve os documentos originais e uma cópia de cada um; as exigências publicadas pelo INSAI pedem tanto o original quanto uma cópia."
    - en: "The international health certificate is valid one month and (from the USA) the endorsed export certificate is valid 14 days after issuance — time your departure accordingly."
      fr: "Le certificat sanitaire international est valable un mois et (depuis les États-Unis) le certificat d'exportation avalisé est valable 14 jours après émission — calez ton départ en conséquence."
      es: "El certificado sanitario internacional es válido un mes y (desde EE. UU.) el certificado de exportación refrendado es válido 14 días después de su emisión — planifica tu salida en consecuencia."
      pt: "O atestado de saúde internacional vale um mês e (nos EUA) o certificado de exportação avalizado vale 14 dias após a emissão — programe a sua partida levando isso em conta."
    - en: "For pets from the European Union, be ready to show the microchip and rabies antibody test, or the EU pet passport instead."
      fr: "Pour les animaux venant de l'Union européenne, sois prêt à montrer la puce et le titrage antirabique, ou le passeport européen à la place."
      es: "Para las mascotas procedentes de la Unión Europea, ten listo para mostrar el microchip y la prueba de titulación de rabia, o el pasaporte europeo en su lugar."
      pt: "Para os animais vindos da União Europeia, esteja pronto para mostrar o microchip e o teste sorológico antirrábico (titulação), ou, em vez disso, o passaporte europeu para animais."
    - en: "No consular procedure is required. A pit-bull-type dog will be refused entry regardless of its documents, so verify the breed rules before you travel."
      fr: "Aucune démarche consulaire n'est requise. Un chien de type pit-bull sera refusé à l'entrée quels que soient ses documents, vérifie donc les règles de race avant de voyager."
      es: "No se requiere ningún trámite consular. Un perro de tipo pit-bull será rechazado a la entrada sea cual sea su documentación, así que verifica las normas sobre razas antes de viajar."
      pt: "Não é exigido nenhum trâmite consular. Um cachorro do tipo pit bull terá a entrada recusada, independentemente dos documentos, então verifique as regras de raça antes de viajar."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Venezuela does restrict certain breeds by law. The Ley para la Protección de la Fauna Doméstica Libre y en Cautiverio (Official Gazette N° 39.338, 2010) prohibits pit-bull-type dogs, and this is reported to include an import ban — an entry restriction, not only an ownership rule."
    fr: "Le Venezuela restreint certaines races par la loi. La Ley para la Protección de la Fauna Doméstica Libre y en Cautiverio (Gaceta Oficial N° 39.338, 2010) interdit les chiens de type pit-bull, et cela comprendrait une interdiction d'importation — une restriction d'entrée, pas seulement une règle de détention."
    es: "Venezuela sí restringe determinadas razas por ley. La Ley para la Protección de la Fauna Doméstica Libre y en Cautiverio (Gaceta Oficial N° 39.338, 2010) prohíbe los perros de tipo pit-bull, y se informa de que esto incluye una prohibición de importación — una restricción de entrada, no solo una norma de tenencia."
    pt: "A Venezuela restringe sim certas raças por lei. A Ley para la Protección de la Fauna Doméstica Libre y en Cautiverio (Gaceta Oficial N° 39.338, 2010) proíbe os cachorros do tipo pit bull, e há relatos de que isso inclui uma proibição de importação — uma restrição de entrada, e não apenas uma regra de posse."
  cat1:
    en: "Import prohibited: Venezuelan law prohibits the import, breeding, adoption and sale of pit-bull-type dogs — Pit Bull, American Staffordshire Terrier and Staffordshire Bull Terrier — and their crosses. A dog of these breeds cannot be brought into the country."
    fr: "Importation interdite : la loi vénézuélienne interdit l'importation, la reproduction, l'adoption et la vente des chiens de type pit-bull — Pit Bull, American Staffordshire Terrier et Staffordshire Bull Terrier — et de leurs croisements. Un chien de ces races ne peut pas être introduit dans le pays."
    es: "Importación prohibida: la ley venezolana prohíbe la importación, la cría, la adopción y la venta de perros de tipo pit-bull — Pit Bull, American Staffordshire Terrier y Staffordshire Bull Terrier — y sus cruces. Un perro de estas razas no puede introducirse en el país."
    pt: "Importação proibida: a lei venezuelana proíbe a importação, a criação, a adoção e a venda de cachorros do tipo pit bull — Pit Bull, American Staffordshire Terrier e Staffordshire Bull Terrier — e de seus cruzamentos. Um cachorro dessas raças não pode ser levado para o país."
  cat2:
    en: "Verification needed: the precise breed list and article text should be checked against the official gazette, as the details available online come largely from secondary reporting of the law. No wider category of 'potentially dangerous' breeds with a separate import rule is confirmed from an official source."
    fr: "Vérification nécessaire : la liste précise des races et le texte de l'article devraient être vérifiés dans la Gaceta officielle, car les détails disponibles en ligne proviennent en grande partie de reprises secondaires de la loi. Aucune catégorie plus large de races « potentiellement dangereuses » avec une règle d'importation distincte n'est confirmée par une source officielle."
    es: "Verificación necesaria: la lista precisa de razas y el texto del artículo deberían comprobarse en la Gaceta Oficial, ya que los detalles disponibles en línea proceden en gran parte de reproducciones secundarias de la ley. No hay una categoría más amplia de razas «potencialmente peligrosas» con una norma de importación aparte confirmada por una fuente oficial."
    pt: "Verificação necessária: a lista precisa de raças e o texto do artigo devem ser conferidos na gaceta oficial, já que os detalhes disponíveis online vêm em grande parte de relatos secundários sobre a lei. Nenhuma categoria mais ampla de raças \"potencialmente perigosas\" com uma regra de importação própria está confirmada por fonte oficial."
  note:
    en: "Because this is an import restriction, verify your dog's breed and the current law before you book. A prohibited breed will be refused entry even with a perfect set of health documents."
    fr: "Comme il s'agit d'une restriction à l'importation, vérifie la race de ton chien et la loi en vigueur avant de réserver. Une race interdite sera refusée à l'entrée même avec un dossier sanitaire parfait."
    es: "Como se trata de una restricción a la importación, verifica la raza de tu perro y la ley vigente antes de reservar. Una raza prohibida será rechazada a la entrada incluso con un expediente sanitario perfecto."
    pt: "Como se trata de uma restrição de importação, verifique a raça do seu cachorro e a lei em vigor antes de reservar. Uma raça proibida terá a entrada recusada mesmo com um conjunto perfeito de documentos sanitários."

checklist:
  - en: "Valid rabies vaccination certificate (≤ 1 year), original and copy"
    fr: "Certificat de vaccination antirabique valide (≤ 1 an), original et copie"
    es: "Certificado de vacunación antirrábica válido (≤ 1 año), original y copia"
    pt: "Certificado de vacinação antirrábica válido (≤ 1 ano), original e cópia"
  - en: "International veterinary health certificate (valid one month), original and copy; from the USA, USDA-endorsed"
    fr: "Certificat sanitaire vétérinaire international (valable un mois), original et copie ; depuis les États-Unis, avalisé par l'USDA"
    es: "Certificado sanitario veterinario internacional (válido un mes), original y copia; desde EE. UU., refrendado por el USDA"
    pt: "Atestado veterinário internacional de saúde (válido por um mês), original e cópia; nos EUA, avalizado pelo USDA"
  - en: "Up-to-date vaccination card showing the canine séxtuple (batch, expiry, product name), original and copy"
    fr: "Carte de vaccination à jour indiquant la séxtuple canine (lot, péremption, nom du produit), original et copie"
    es: "Cartilla de vacunación al día que muestre la séxtuple canina (lote, caducidad, nombre del producto), original y copia"
    pt: "Carteira de vacinação atualizada mostrando a séxtuple canina (lote, validade, nome do produto), original e cópia"
  - en: "Internal and external deworming certificate (valid three months), original and copy"
    fr: "Certificat de vermifugation interne et externe (valable trois mois), original et copie"
    es: "Certificado de desparasitación interna y externa (válido tres meses), original y copia"
    pt: "Certificado de vermifugação interna e externa (válido por três meses), original e cópia"
  - en: "Official zoosanitary export certificate from the country of origin"
    fr: "Certificat zoosanitaire d'exportation officiel du pays d'origine"
    es: "Certificado zoosanitario de exportación oficial del país de origen"
    pt: "Certificado zoossanitário oficial de exportação do país de origem"
  - en: "If coming from the EU: microchip + rabies antibody test, or the EU pet passport (original and copy)"
    fr: "Si tu viens de l'UE : puce + titrage antirabique, ou le passeport européen (original et copie)"
    es: "Si vienes de la UE: microchip + prueba de titulación de rabia, o el pasaporte europeo para mascotas (original y copia)"
    pt: "Se você vier da UE: microchip + teste sorológico antirrábico (titulação), ou o passaporte europeu para animais (original e cópia)"
  - en: "Budget for the INSAI movement permit fee (5 UT) paid at the airport on arrival"
    fr: "Prévois la taxe du permis de mobilisation INSAI (5 UT) payée à l'aéroport à l'arrivée"
    es: "Prevé la tasa del permiso de movilización del INSAI (5 UT) pagada en el aeropuerto a la llegada"
    pt: "Reserve dinheiro para a taxa da guia de movimentação do INSAI (5 UT), paga no aeroporto na chegada"
