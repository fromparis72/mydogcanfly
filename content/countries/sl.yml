# Country Entry Guide — Sierra Leone (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_sl
iso2: "SL"
name: { en: "Sierra Leone", fr: "Sierra Leone", es: "Sierra Leona", pt: "Serra Leoa" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
exit:
  authority: Livestock & Veterinary Services (MAFS)
  authorityUrl: https://maf.gov.sl/
  intro:
    en: "Sierra Leone is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Livestock and Veterinary Services Division (MAFS)."
    fr: "La Sierra Leone est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par la Livestock and Veterinary Services Division (MAFS)."
    es: "Sierra Leona no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por la Livestock and Veterinary Services Division (MAFS)."
    pt: "Serra Leoa não é um país listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para retornar à UE — além de um certificado veterinário de exportação endossado pela Livestock and Veterinary Services Division (MAFS)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico (titulação): exame de sangue em um laboratório aprovado pela UE, pelo menos 30 dias após a vacinação — um resultado válido é essencial para retornar à UE e não pode ser resolvido de última hora."
    - timing: window
      scope: any
      text:
        en: "The Ministry's Livestock and Veterinary Services Division is the national competent authority for animal export and veterinary certification."
        fr: "La Livestock and Veterinary Services Division du ministère est l'autorité nationale compétente pour l'export animal et la certification vétérinaire."
        es: "La Livestock and Veterinary Services Division del ministerio es la autoridad nacional competente para la exportación animal y la certificación veterinaria."
        pt: "A Livestock and Veterinary Services Division do ministério é a autoridade nacional competente para exportação de animais e certificação veterinária."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico (titulação) da UE válido antes de sair, ele continua válido por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Sierra Leone with your dog", fr: "Voyager en Sierra Leone avec ton chien", es: "Viajar a Sierra Leona con tu perro", pt: "Viajar para a Serra Leoa com seu cachorro" }
  intro:
    en: >-
      Sierra Leone admits pet dogs, but entry is controlled by its own veterinary authority — the
      Livestock and Veterinary Services Division of the Ministry of Agriculture, Forestry and Food
      Security — not by the EU framework. Sierra Leone publishes very little about pet imports, so the
      single reliable rule is this: no dog should be shipped without an import permit obtained in
      advance from the Ministry, and that permit is what sets out the exact conditions for your animal.
      The United States veterinary authority (USDA APHIS) lists no agreed health certificate for dogs
      to Sierra Leone and states that, for species it does not cover, the importer must apply to the
      Ministry for a permit that "will most likely outline the specific requirements." A valid rabies
      vaccination and an official veterinary health certificate endorsed by the exporting country's
      government vet are standard for a rabies-endemic West African destination. Because so little is
      published, confirm every detail with the Ministry and your vet before you book.
    fr: >-
      La Sierra Leone admet les chiens de compagnie, mais l'entrée est contrôlée par sa propre autorité
      vétérinaire — la Livestock and Veterinary Services Division du ministère de l'Agriculture, des
      Forêts et de la Sécurité alimentaire — et non par le cadre européen. La Sierra Leone publie très
      peu d'informations sur l'importation d'animaux ; la seule règle fiable est donc la suivante :
      aucun chien ne doit être expédié sans un permis d'importation obtenu à l'avance auprès du
      ministère, et c'est ce permis qui fixe les conditions exactes applicables à ton animal.
      L'autorité vétérinaire américaine (USDA APHIS) ne publie aucun certificat sanitaire convenu pour
      les chiens vers la Sierra Leone et indique que, pour les espèces qu'elle ne couvre pas,
      l'importateur doit demander au ministère un permis qui « précisera très probablement les
      exigences spécifiques ». Une vaccination antirabique valide et un certificat vétérinaire officiel
      visé par le vétérinaire gouvernemental du pays d'export sont la norme pour une destination
      d'endémie rabique en Afrique de l'Ouest. Comme très peu est publié, confirme chaque détail
      auprès du ministère et de ton vétérinaire avant de réserver.
    es: >-
      Sierra Leona admite perros de compañía, pero la entrada la controla su propia autoridad
      veterinaria — la Livestock and Veterinary Services Division del Ministerio de Agricultura,
      Bosques y Seguridad Alimentaria — y no el marco de la UE. Sierra Leona publica muy poca
      información sobre la importación de mascotas, por lo que la única regla fiable es esta: ningún
      perro debe enviarse sin un permiso de importación obtenido con antelación en el Ministerio, y ese
      permiso es lo que fija las condiciones exactas para tu animal. La autoridad veterinaria de
      Estados Unidos (USDA APHIS) no publica ningún certificado sanitario acordado para perros hacia
      Sierra Leona e indica que, para las especies que no cubre, el importador debe solicitar al
      Ministerio un permiso que «probablemente detallará los requisitos específicos». Una vacunación
      antirrábica válida y un certificado sanitario veterinario oficial refrendado por el veterinario
      gubernamental del país exportador son lo habitual para un destino de África Occidental donde la
      rabia es endémica. Como se publica tan poco, confirma cada detalle con el Ministerio y con tu
      veterinario antes de reservar.

    pt: "A Serra Leoa aceita cachorros de estimação, mas a entrada é controlada pela sua própria autoridade veterinária — a Livestock and Veterinary Services Division do Ministry of Agriculture, Forestry and Food Security — e não pelo marco da UE. A Serra Leoa publica muito pouca informação sobre a importação de animais de estimação, então a única regra confiável é esta: nenhum cachorro deve ser enviado sem uma autorização de importação obtida com antecedência junto ao ministério, e é essa autorização que estabelece as condições exatas para o seu animal. A autoridade veterinária dos Estados Unidos (USDA APHIS) não lista nenhum certificado de saúde acordado para cachorros com destino à Serra Leoa e afirma que, para as espécies que não cobre, o importador precisa solicitar ao ministério uma autorização que \"provavelmente detalhará as exigências específicas\". Uma vacinação antirrábica válida e um atestado de saúde veterinário oficial endossado pelo veterinário do governo do país exportador são o padrão para um destino da África Ocidental com raiva endêmica. Como muito pouco é publicado, confirme cada detalhe com o ministério e com o seu veterinário antes de reservar."
difficulty:
  level: difficult
  label: { en: "Difficult — advance import permit; little published, confirm each step", fr: "Difficile — permis d'importation préalable ; peu de publications, chaque étape à confirmer", es: "Difícil — permiso de importación previo; poca información publicada, confirma cada paso", pt: "Difícil — autorização de importação prévia; pouca informação publicada, confirme cada etapa" }

prepTime:
  eu:
    en: "From Europe: no official timeline is published. The pacing step is obtaining the Ministry import permit in advance, so plan well ahead and add a margin — allow a generous several weeks, plus a rabies vaccination and an endorsed veterinary health certificate."
    fr: "Depuis l'Europe : aucun délai officiel n'est publié. L'étape déterminante est l'obtention préalable du permis d'importation du ministère ; anticipe donc largement et garde une marge — prévois plusieurs semaines confortables, plus une vaccination antirabique et un certificat vétérinaire visé."
    es: "Desde Europa: no se publica ningún plazo oficial. El paso que marca el ritmo es obtener con antelación el permiso de importación del Ministerio, así que planifícalo con mucha antelación y añade un margen — cuenta con varias semanas holgadas, más una vacunación antirrábica y un certificado sanitario veterinario refrendado."
    pt: "Da Europa: nenhum prazo oficial é publicado. A etapa que determina o ritmo é obter a autorização de importação do ministério com antecedência, então planeje com bastante antecedência e adicione uma margem — reserve várias semanas confortáveis, além de uma vacinação antirrábica e um atestado de saúde veterinário endossado."
  listed:
    en: "From a rabies-controlled country (US, Canada, Gulf states…): same approach — the advance import permit drives the timeline, but Sierra Leone does not publish processing times, so confirm directly with the Ministry."
    fr: "Depuis un pays à rage maîtrisée (USA, Canada, pays du Golfe…) : même logique — le permis d'importation préalable rythme le calendrier, mais la Sierra Leone ne publie pas de délais, à confirmer directement avec le ministère."
    es: "Desde un país con la rabia controlada (EE. UU., Canadá, países del Golfo…): mismo enfoque — el permiso de importación previo marca el calendario, pero Sierra Leona no publica plazos de tramitación, así que confírmalo directamente con el Ministerio."
    pt: "De um país com raiva controlada (EUA, Canadá, países do Golfo…): mesma abordagem — a autorização de importação prévia determina o calendário, mas a Serra Leoa não publica prazos de tramitação, então confirme diretamente com o ministério."
  nonListed:
    en: "From a high-rabies-risk country: similar base steps, but expect closer scrutiny on arrival; a dog coming from a rabies-affected area may face extra checks or refusal. Exact conditions: Unknown — set by the permit."
    fr: "Depuis un pays à haut risque rabique : mêmes étapes de base, mais contrôle renforcé à l'arrivée ; un chien venant d'une zone touchée par la rage peut subir des contrôles supplémentaires ou un refus. Conditions exactes : non communiquées — fixées par le permis."
    es: "Desde un país de alto riesgo de rabia: los mismos pasos básicos, pero espera un control más riguroso a la llegada; un perro que llega de una zona afectada por la rabia puede enfrentarse a controles adicionales o al rechazo. Condiciones exactas: no comunicadas — las fija el permiso."
    pt: "De um país de alto risco de raiva: etapas básicas semelhantes, mas espere uma verificação mais rigorosa na chegada; um cachorro vindo de uma área afetada pela raiva pode enfrentar verificações extras ou recusa. Condições exatas: não comunicado — definidas pela autorização."

