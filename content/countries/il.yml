# Country Entry Guide — Israel (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
# Israel is NOT in the EU. It runs its own scheme via the Ministry of Agriculture and Food
# Security — Veterinary Services and Animal Health, under the Animal Diseases Regulations
# (Import of Animals), 1974. Key national feature: a rabies antibody test (>=0.5 IU/ml,
# blood taken >30 days after the primary rabies vaccination, OIE/WOAH-approved lab) is
# MANDATORY for every dog, from every origin, in addition to microchip + rabies vaccination.
# A government-endorsed veterinary health certificate must be issued no more than 10 days
# before arrival, and a "Notification of Pet Arrival" (Annex B) must be sent to the Veterinary
# Services at the port of entry at least 2 working days before departure. Up to two dogs/cats
# accompanying their owner on the same flight (in their care >=90 days) are exempt from an
# import licence; more than two pets, unaccompanied/cargo pets, and dangerous-breed cases
# require an import permit from the Director of Veterinary Services. Eight dog breeds are
# prohibited from import except by case-by-case permit. No routine quarantine if compliant.
# The eu/listed/nonListed slots are repurposed to Israel's practical paths:
# eu = up-to-date dog with a valid lifelong antibody result (fastest, licence-exempt);
# listed = primary/lapsed rabies vaccination (30-day wait + new antibody test);
# nonListed = import-permit cases (>2 pets, cargo, or a restricted/dangerous breed).
id: country_il
iso2: "IL"
name: { en: "Israel", fr: "Israël", es: "Israel", pt: "Israel" }
region: { en: "Middle East", fr: "Moyen-Orient", es: "Oriente Medio", pt: "Oriente Médio" }


regime: non_listed
exit:
  authority: IVSAH (MOAG)
  authorityUrl: https://www.gov.il/en/departments/ministry_of_agriculture
  intro:
    en: "Israel is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export certificate approved by a government veterinarian."
    fr: "Israël est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat d'export approuvé par un vétérinaire officiel."
    es: "Israel no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado de exportación aprobado por un veterinario oficial."
    pt: "Israel é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um certificado de exportação aprovado por um veterinário oficial."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "The export health certificate must be signed and approved by a government veterinarian of the MOAG Veterinary Services (a private-vet certificate alone is not valid), issued at the regional veterinary offices."
        fr: "Le certificat sanitaire d'export doit être signé et approuvé par un vétérinaire officiel des Services vétérinaires du MOAG (un certificat de vétérinaire privé seul ne suffit pas), délivré dans les bureaux vétérinaires régionaux."
        es: "El certificado sanitario de exportación debe ser firmado y aprobado por un veterinario oficial de los Servicios Veterinarios del MOAG (un certificado de veterinario privado por sí solo no es válido), emitido en las oficinas veterinarias regionales."
        pt: "O atestado de saúde para exportação precisa ser assinado e aprovado por um veterinário oficial dos Veterinary Services do MOAG (um certificado emitido apenas por veterinário particular não vale), emitido nos escritórios veterinários regionais."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Israel with your dog", fr: "Voyager en Israël avec ton chien", es: "Viajar a Israel con tu perro", pt: "Viajar para Israel com o seu cachorro" }
  intro:
    en: >-
      Israel welcomes dogs, but it is not part of the EU pet-passport system — it runs its own
      import scheme through the Ministry of Agriculture and Food Security (Veterinary Services and
      Animal Health), under the Animal Diseases Regulations (Import of Animals), 1974. The step that
      surprises many travellers is that a rabies antibody test is mandatory for every dog, from every
      country, on top of an ISO microchip and a valid rabies vaccination. Your dog must be at least
      4 months old, carry a government-endorsed veterinary health certificate issued no more than
      10 days before arrival, and you must send a Notification of Pet Arrival to the Veterinary Services
      at your port of entry at least two working days before departure. Up to two pets travelling with
      their owner on the same flight are exempt from an import licence; more pets, cargo shipments and
      restricted breeds need a permit. This guide explains each case before you book.
    fr: >-
      Israël accueille les chiens, mais ne fait pas partie du système du passeport européen : le pays
      applique son propre régime d'importation via le ministère de l'Agriculture et de la Sécurité
      alimentaire (Services vétérinaires et santé animale), au titre du règlement sur les maladies
      animales (importation d'animaux) de 1974. L'étape qui surprend beaucoup de voyageurs est qu'un
      titrage des anticorps antirabiques est obligatoire pour tout chien, quel que soit le pays d'origine,
      en plus d'une puce ISO et d'une vaccination antirabique valide. Ton chien doit avoir au moins
      4 mois, disposer d'un certificat sanitaire vétérinaire visé par l'autorité établi au plus tôt
      10 jours avant l'arrivée, et tu dois envoyer une notification d'arrivée aux Services vétérinaires
      de ton point d'entrée au moins deux jours ouvrés avant le départ. Jusqu'à deux animaux voyageant
      avec leur propriétaire sur le même vol sont dispensés de licence d'importation ; au-delà, le fret
      et les races restreintes exigent un permis. Ce guide détaille chaque cas avant de réserver.
    es: >-
      Israel acoge a los perros, pero no forma parte del sistema del pasaporte europeo para mascotas —
      aplica su propio régimen de importación a través del Ministerio de Agricultura y Seguridad
      Alimentaria (Servicios Veterinarios y Sanidad Animal), en virtud del Reglamento de Enfermedades
      Animales (Importación de Animales) de 1974. El paso que sorprende a muchos viajeros es que una
      prueba de titulación de anticuerpos contra la rabia es obligatoria para todo perro, de cualquier
      país, además de un microchip ISO y una vacunación antirrábica válida. Tu perro debe tener al
      menos 4 meses, llevar un certificado sanitario veterinario refrendado por el gobierno expedido
      como máximo 10 días antes de la llegada, y debes enviar una notificación de llegada de mascota a
      los Servicios Veterinarios en tu punto de entrada al menos dos días laborables antes de la
      salida. Hasta dos mascotas que viajen con su propietario en el mismo vuelo están exentas de
      licencia de importación; más mascotas, los envíos como carga y las razas restringidas necesitan
      un permiso. Esta guía explica cada caso antes de que reserves.

    pt: "Israel recebe bem os cachorros, mas não faz parte do sistema do passaporte europeu para animais de estimação — o país aplica o seu próprio regime de importação por meio do Ministry of Agriculture and Food Security (Veterinary Services and Animal Health), com base no Animal Diseases Regulations (Import of Animals), 1974, o regulamento sobre doenças animais. A etapa que surpreende muitos viajantes é que o teste sorológico antirrábico é obrigatório para todo cachorro, seja qual for o país de origem, além do microchip ISO e da vacinação antirrábica válida. O seu cachorro precisa ter pelo menos 4 meses, levar um certificado veterinário de saúde visado pela autoridade oficial emitido no máximo 10 dias antes da chegada, e você precisa enviar uma Notification of Pet Arrival aos Veterinary Services do seu ponto de entrada pelo menos dois dias úteis antes da partida. Até dois animais que viajam com o dono no mesmo voo estão dispensados da licença de importação; acima disso, os envios como carga e as raças restritas exigem uma autorização. Este guia detalha cada caso antes de você reservar."
difficulty:
  level: moderate
  label: { en: "Moderate — a mandatory rabies antibody test for every dog", fr: "Modéré — un titrage antirabique obligatoire pour chaque chien", es: "Moderado — una prueba de titulación de rabia obligatoria para cada perro", pt: "Moderado — teste sorológico antirrábico obrigatório para todo cachorro" }

prepTime:
  eu:
    en: "Up-to-date dog with a valid lifelong rabies antibody result: ~2-3 weeks — issue the government-endorsed health certificate within 10 days of arrival and send the arrival notification at least 2 working days before departure; no import licence for up to two accompanied pets."
    fr: "Chien à jour avec un titrage antirabique valable à vie : ~2-3 semaines — établissez le certificat sanitaire visé dans les 10 jours avant l'arrivée et envoie la notification d'arrivée au moins 2 jours ouvrés avant le départ ; pas de licence pour jusqu'à deux animaux accompagnés."
    es: "Perro al día con un resultado de titulación de rabia válido de por vida: ~2-3 semanas — expide el certificado sanitario refrendado por el gobierno dentro de los 10 días previos a la llegada y envía la notificación de llegada al menos 2 días laborables antes de la salida; sin licencia de importación para hasta dos mascotas acompañadas."
    pt: "Cachorro em dia com um resultado sorológico antirrábico válido por toda a vida: ~2-3 semanas — emita o atestado de saúde visado pela autoridade oficial dentro dos 10 dias que antecedem a chegada e envie a notificação de chegada pelo menos 2 dias úteis antes da partida; sem licença de importação para até dois animais acompanhados."
  listed:
    en: "Primary or lapsed rabies vaccination (new antibody test needed): ~2-3 months — vaccinate, wait, draw blood more than 30 days after the vaccination for an OIE/WOAH-approved laboratory, then a 30-day wait before import."
    fr: "Vaccination antirabique primaire ou périmée (nouveau titrage requis) : ~2-3 mois — vaccinez, patientez, prélevez le sang plus de 30 jours après la vaccination pour un laboratoire agréé OIE/OMSA, puis un délai de 30 jours avant l'importation."
    es: "Vacunación antirrábica primaria o caducada (se necesita nueva prueba de titulación): ~2-3 meses — vacuna, espera, extrae sangre más de 30 días después de la vacunación para un laboratorio aprobado por la OIE/WOAH, y luego una espera de 30 días antes de la importación."
    pt: "Vacinação antirrábica primária ou vencida (é preciso um novo teste sorológico): ~2-3 meses — vacine, espere, colete o sangue mais de 30 dias após a vacinação para um laboratório aprovado pela OIE/WOAH e, depois, aguarde 30 dias antes da importação."
  nonListed:
    en: "Import-permit cases (more than two pets, unaccompanied/cargo, or a dangerous breed): add several weeks — a permit from the Director of Veterinary Services is needed; dangerous breeds are only admitted case-by-case, if at all."
    fr: "Cas soumis à permis (plus de deux animaux, non accompagnés/fret, ou race dangereuse) : ajoute plusieurs semaines — un permis du directeur des Services vétérinaires est requis ; les races dangereuses ne sont admises qu'au cas par cas, si tant est."
    es: "Casos con permiso de importación (más de dos mascotas, sin acompañante/carga, o raza peligrosa): añade varias semanas — se necesita un permiso del director de los Servicios Veterinarios; las razas peligrosas solo se admiten caso por caso, si es que se admiten."
    pt: "Casos sujeitos a autorização de importação (mais de dois animais, desacompanhados/em carga ou raça perigosa): acrescente várias semanas — é preciso uma autorização do Director of Veterinary Services; raças perigosas só são admitidas caso a caso, quando o são."

