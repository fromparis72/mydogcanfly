notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro."
    pt: "Somente um veterinário pode confirmar o procedimento exato para o seu cachorro em particular."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem: do país de origem, do histórico de viagens anteriores, da identificação, das vacinas, do itinerário e da data da viagem."
  - en: "Bahrain publishes only a short official checklist; several details (microchip, rabies timing, minimum age, permit validity, quarantine) are not detailed publicly and must be confirmed with the Veterinary Quarantine department."
    fr: "Bahreïn ne publie qu'une courte liste officielle ; plusieurs détails (puce, délais rabiques, âge minimum, validité du permis, quarantaine) ne sont pas précisés publiquement et doivent être confirmés auprès du département de Quarantaine vétérinaire."
    es: "Baréin solo publica una breve lista oficial; varios detalles (microchip, plazos de la rabia, edad mínima, valide del permiso, cuarentena) no se detallan públicamente y deben confirmarse con el departamento de Cuarentena Veterinaria."
    pt: "O Bahrein publica apenas uma breve lista de verificação oficial; vários detalhes (microchip, prazos da raiva, idade mínima, validade da autorização, quarentena) não são detalhados publicamente e precisam ser confirmados com o departamento de Quarentena Veterinária."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Sempre consulte seu veterinário antes de reservar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como as exigências de entrada do seu cachorro são decididas" }
  intro:
    en: "The exact documents depend on three things — Bahrain (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — Bahreïn (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Baréin (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — o Bahrein (seu destino) é apenas o primeiro deles."
  items:
    - stars: 5
      label: { en: "Country of destination — Bahrain", fr: "Pays de destination — Bahreïn", es: "País de destino — Baréin", pt: "País de destino — Bahrein" }
      text:
        en: "Bahrain runs its own scheme through the Veterinary Quarantine service: advance contact and a personal import permit, a government veterinary health certificate, a certificate of origin and a rabies antibody (RANAT) blood test are the published requirements for importing a dog. Certain dangerous dog types are banned outright."
        fr: "Bahreïn applique son propre dispositif via le service de Quarantaine vétérinaire : contact préalable et permis d'importation personnel, certificat vétérinaire officiel, certificat d'origine et titrage des anticorps antirabiques (RANAT) constituent les exigences publiées pour importer un chien. Certains types de chiens dangereux sont totalement interdits."
        es: "Baréin aplica su propio sistema a través del servicio de Cuarentena Veterinaria: contacto previo y un permiso de importación personal, un certificado veterinario oficial del gobierno, un certificado de origen y una prueba de sangre de anticuerpos contra la rabia (RANAT) son los requisitos publicados para importar un perro. Ciertos tipos de perros peligrosos están totalmente prohibidos."
        pt: "O Bahrein aplica seu próprio esquema por meio do serviço de Quarentena Veterinária: contato prévio e autorização de importação pessoal, atestado de saúde veterinário oficial do governo, certificado de origem e teste sorológico antirrábico (RANAT) são as exigências publicadas para importar um cachorro. Determinados tipos de cachorros perigosos são totalmente banidos."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The country your dog leaves shapes the rabies steps: the rabies antibody (RANAT) test and the timing of vaccination depend on how Bahrain treats that origin for rabies. An origin Bahrain does not accept can block import altogether."
        fr: "Le pays de départ conditionne les étapes rabiques : le titrage (RANAT) et le calendrier de vaccination dépendent de la manière dont Bahreïn traite cette origine au regard de la rage. Une origine non acceptée par Bahreïn peut bloquer l'importation."
        es: "El país del que sale tu perro condiciona los pasos relativos a la rabia: la prueba de titulación (RANAT) y el calendario de vacunación dependen de cómo trate Baréin ese origen en materia de rabia. Un origen que Baréin no acepta puede bloquear la importación por completo."
        pt: "O país de onde o cachorro parte molda as etapas relacionadas à raiva: o teste sorológico antirrábico (RANAT) e o cronograma da vacinação dependem de como o Bahrein trata aquela origem em relação à raiva. Uma origem que o Bahrein não aceita pode bloquear totalmente a importação."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro morou recentemente" }
      text:
        en: "A recent stay in a higher-risk country can affect the rabies steps even if you fly in from a low-risk country. Your dog's real origin and history count — not only the last airport."
        fr: "Un séjour récent dans un pays à risque plus élevé peut modifier les étapes rabiques même si tu arrives d'un pays à faible risque. C'est l'origine réelle et l'historique du chien qui comptent — pas seulement le dernier aéroport."
        es: "Una estancia reciente en un país de mayor riesgo puede modificar los pasos relativos a la rabia aunque llegues desde un país de bajo riesgo. Lo que cuenta es el origen y el historial reales de tu perro — no solo el último aeropuerto."
        pt: "Uma estadia recente em um país de risco mais alto pode afetar as etapas relacionadas à raiva, mesmo que você embarque de um país de baixo risco. O que conta é a origem e o histórico reais do seu cachorro — não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Bahrain's framework, then confirm your dog's exact origin, rabies-risk status and history with the Veterinary Quarantine department before arranging the permit."
    fr: "Lis donc les exigences ci-dessous comme le cadre bahreïni, puis confirme l'origine, le statut de risque rabique et l'historique exacts de ton chien auprès du département de Quarantaine vétérinaire avant d'organiser le permis."
    es: "Así que lee los requisitos siguientes como el marco de Baréin y luego confirma el origen, el estado de riesgo de rabia y el historial exactos de tu perro con el departamento de Cuarentena Veterinaria antes de gestionar el permiso."
    pt: "Portanto, leia as exigências abaixo como o marco geral do Bahrein e depois confirme a origem exata, a situação de risco de raiva e o histórico do seu cachorro junto ao departamento de Quarentena Veterinária antes de providenciar a autorização."

requirements:
  - item: { en: "Personal import permit / advance approval", fr: "Permis d'importation personnel / accord préalable", es: "Permiso de importación personal / aprobación previa", pt: "Autorização de importação pessoal / aprovação prévia" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "The traveller or importer must contact the Veterinary Quarantine department in advance and arrange a personal live-animal import permit, informing the authority of the date and time of arrival. A personal Import Permit (Live Animal) e-service is provided by the Ministry of Municipalities Affairs and Agriculture.", fr: "Le voyageur ou l'importateur doit contacter à l'avance le département de Quarantaine vétérinaire et organiser un permis d'importation d'animal vivant à titre personnel, en informant l'autorité de la date et de l'heure d'arrivée. Un e-service Permis d'importation (animal vivant) à titre personnel est proposé par le ministère des Affaires municipales et de l'Agriculture.", es: "El viajero o importador debe contactar con antelación con el departamento de Cuarentena Veterinaria y gestionar un permiso de importación de animal vivo a título personal, informando a la autoridad de la fecha y la hora de llegada. El Ministerio de Asuntos Municipales y Agricultura ofrece un servicio electrónico de Permiso de Importación (Animal Vivo) a título personal.", pt: "O viajante ou importador precisa entrar em contato com antecedência com o departamento de Quarentena Veterinária e providenciar uma autorização de importação de animal vivo a título pessoal, informando à autoridade a data e o horário de chegada. Um serviço eletrônico de Autorização de Importação (Animal Vivo) a título pessoal é oferecido pelo Ministério dos Assuntos Municipais e Agricultura." }
    exceptions: { en: "No dog should be shipped without prior coordination; permit validity, fees and processing time are not published — confirm with the authority.", fr: "Aucun chien ne devrait être expédié sans coordination préalable ; la validité du permis, les frais et le délai de traitement ne sont pas publiés — à confirmer auprès de l'autorité.", es: "Ningún perro debería enviarse sin coordinación previa; la valide del permiso, las tasas y el plazo de tramitación no se publican — confírmalo con la autoridad.", pt: "Nenhum cachorro deve ser enviado sem coordenação prévia; a validade da autorização, as taxas e o prazo de processamento não são publicados — confirme com a autoridade." }
    ref: { en: "Bahrain Customs — Personal Pets; Import of live animals (dogs and cats); bahrain.bh Import Permit (Live Animal, Personal)", fr: "Douanes de Bahreïn — Animaux personnels ; Importation d'animaux vivants (chiens et chats) ; bahrain.bh Permis d'importation (animal vivant, personnel)", es: "Aduanas de Baréin — Mascotas personales; Importación de animales vivos (perros y gatos); bahrain.bh Permiso de Importación (Animal Vivo, personal)", pt: "Bahrain Customs — Personal Pets; Import of live animals (dogs and cats); bahrain.bh Import Permit (Live Animal, Personal)" }
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Not itemised officially", fr: "Non détaillée officiellement", es: "No detallado oficialmente", pt: "Não detalhado oficialmente" }
    when: { en: "An ISO microchip is the international identification standard and underpins the health certificate and the rabies antibody test, but Bahrain's published import checklist for dogs does not itemise a microchip requirement.", fr: "Une puce ISO est la norme d'identification internationale et sous-tend le certificat sanitaire et le titrage antirabique, mais la liste d'importation publiée par Bahreïn pour les chiens ne mentionne pas explicitement une puce.", es: "Un microchip ISO es la norma internacional de identificación y sustenta el certificado sanitario y la prueba de titulación de rabia, pero la lista de importación publicada por Baréin para perros no detalla explícitamente un requisito de microchip.", pt: "Um microchip ISO é o padrão internacional de identificação e sustenta o atestado de saúde e o teste sorológico antirrábico, mas a lista de verificação de importação publicada pelo Bahrein para cachorros não detalha uma exigência de microchip." }
    exceptions: { en: "Because it is not published, confirm the accepted identification with the Veterinary Quarantine department before travel.", fr: "N'étant pas publiée, confirme l'identification acceptée auprès du département de Quarantaine vétérinaire avant le voyage.", es: "Al no estar publicada, confirma la identificación aceptada con el departamento de Cuarentena Veterinaria antes del viaje.", pt: "Como isso não é publicado, confirme a identificação aceita com o departamento de Quarentena Veterinária antes da viagem." }
    ref: { en: "Bahrain Customs — Import of live animals (dogs and cats) (no microchip itemised)", fr: "Douanes de Bahreïn — Importation d'animaux vivants (chiens et chats) (puce non détaillée)", es: "Aduanas de Baréin — Importación de animales vivos (perros y gatos) (microchip no detallado)", pt: "Bahrain Customs — Import of live animals (dogs and cats) (no microchip itemised)" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required (precondition)", fr: "Requise (préalable)", es: "Obligatoria (requisito previo)", pt: "Obrigatória (pré-requisito)" }
    when: { en: "A valid rabies vaccination is the necessary precondition of the rabies antibody (RANAT) test that Bahrain requires. The minimum age, the interval before travel and the accepted validity are not published by the Bahraini authority.", fr: "Une vaccination antirabique valide est le préalable nécessaire au titrage (RANAT) exigé par Bahreïn. L'âge minimum, le délai avant le voyage et la validité acceptée ne sont pas publiés par l'autorité bahreïnie.", es: "Una vacunación antirrábica válida es el requisito previo necesario de la prueba de titulación (RANAT) que exige Baréin. La edad mínima, el intervalo antes del viaje y la valide aceptada no son publicados por la autoridad bareiní.", pt: "Uma vacinação antirrábica válida é o pré-requisito necessário do teste sorológico antirrábico (RANAT) exigido pelo Bahrein. A idade mínima, o intervalo antes da viagem e a validade aceita não são publicados pela autoridade do Bahrein." }
    exceptions: { en: "Timing details are Unknown from official sources — confirm with the Veterinary Quarantine department and your vet.", fr: "Les délais sont non communiqués dans les sources officielles — à confirmer auprès du département de Quarantaine vétérinaire et de ton vétérinaire.", es: "Los detalles de los plazos son desconocidos en las fuentes oficiales — confírmalos con el departamento de Cuarentena Veterinaria y con tu veterinario.", pt: "Os detalhes de prazo não são conhecidos nas fontes oficiais — confirme com o departamento de Quarentena Veterinária e com seu veterinário." }
    ref: { en: "Bahrain Customs — Import of live animals (dogs and cats) (RANAT listed)", fr: "Douanes de Bahreïn — Importation d'animaux vivants (chiens et chats) (RANAT listé)", es: "Aduanas de Baréin — Importación de animales vivos (perros y gatos) (RANAT en la lista)", pt: "Bahrain Customs — Import of live animals (dogs and cats) (RANAT listed)" }
  - item: { en: "Rabies antibody test (RANAT)", fr: "Titrage des anticorps antirabiques (RANAT)", es: "Prueba de titulación de anticuerpos contra la rabia (RANAT)", pt: "Teste sorológico antirrábico (RANAT)" }
    required: { en: "Required", fr: "Requis", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Bahrain's official import checklist for dogs and cats lists a rabies antibody blood test (RANAT — rabies antibody neutralisation test) taken after rabies vaccination. The accepted laboratory, the protective threshold and any waiting period are not published by the authority.", fr: "La liste d'importation officielle de Bahreïn pour les chiens et chats comprend un titrage sanguin des anticorps antirabiques (RANAT — test de neutralisation des anticorps antirabiques) réalisé après la vaccination antirabique. Le laboratoire accepté, le seuil protecteur et un éventuel délai ne sont pas publiés par l'autorité.", es: "La lista de importación oficial de Baréin para perros y gatos incluye una prueba de sangre de anticuerpos contra la rabia (RANAT — prueba de neutralización de anticuerpos contra la rabia) realizada tras la vacunación antirrábica. El laboratorio aceptado, el umbral protector y cualquier periodo de espera no son publicados por la autoridad.", pt: "A lista de verificação de importação oficial do Bahrein para cachorros e gatos inclui um teste sorológico antirrábico (RANAT — rabies antibody neutralisation test) realizado após a vacinação antirrábica. O laboratório aceito, o limiar de proteção e qualquer período de espera não são publicados pela autoridade." }
    exceptions: { en: "Any exemption for rabies-free origins is not stated on the official import page — confirm with the Veterinary Quarantine department.", fr: "Toute exemption pour les origines indemnes de rage n'est pas indiquée sur la page d'importation officielle — à confirmer auprès du département de Quarantaine vétérinaire.", es: "Cualquier exención para orígenes libres de rabia no figura en la página de importación oficial — confírmalo con el departamento de Cuarentena Veterinaria.", pt: "Qualquer isenção para origens livres de raiva não é indicada na página de importação oficial — confirme com o departamento de Quarentena Veterinária." }
    ref: { en: "Bahrain Customs — Import of live animals (dogs and cats)", fr: "Douanes de Bahreïn — Importation d'animaux vivants (chiens et chats)", es: "Aduanas de Baréin — Importación de animales vivos (perros y gatos)", pt: "Bahrain Customs — Import of live animals (dogs and cats)" }
  - item: { en: "Government veterinary health certificate", fr: "Certificat vétérinaire officiel", es: "Certificado veterinario de salud oficial del gobierno", pt: "Atestado de saúde veterinário oficial" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "An original government veterinary health certificate issued by the competent authority of the exporting country must accompany the dog.", fr: "Un certificat vétérinaire officiel original délivré par l'autorité compétente du pays exportateur doit accompagner le chien.", es: "Un certificado veterinario de salud oficial del gobierno original expedido por la autoridad competente del país exportador debe acompañar al perro.", pt: "Um atestado de saúde veterinário oficial do governo original, emitido pela autoridade competente do país exportador, precisa acompanhar o cachorro." }
    exceptions: { en: "None — an official certificate is on the published import checklist.", fr: "Aucune — un certificat officiel figure sur la liste d'importation publiée.", es: "Ninguna — un certificado oficial figura en la lista de importación publicada.", pt: "Nenhuma — um certificado oficial consta na lista de verificação de importação publicada." }
    ref: { en: "Bahrain Customs — Import of live animals (dogs and cats)", fr: "Douanes de Bahreïn — Importation d'animaux vivants (chiens et chats)", es: "Aduanas de Baréin — Importación de animales vivos (perros y gatos)", pt: "Bahrain Customs — Import of live animals (dogs and cats)" }
  - item: { en: "Certificate of origin", fr: "Certificat d'origine", es: "Certificado de origen", pt: "Certificado de origem" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "An original certificate of origin for the animal must accompany the dog, alongside the health certificate.", fr: "Un certificat d'origine original pour l'animal doit accompagner le chien, aux côtés du certificat sanitaire.", es: "Un certificado de origen original del animal debe acompañar al perro, junto con el certificado sanitario.", pt: "Um certificado de origem original do animal precisa acompanhar o cachorro, junto com o atestado de saúde." }
    exceptions: { en: "None — it is on the published import checklist.", fr: "Aucune — il figure sur la liste d'importation publiée.", es: "Ninguna — figura en la lista de importación publicada.", pt: "Nenhuma — ele consta na lista de verificação de importação publicada." }
    ref: { en: "Bahrain Customs — Import of live animals (dogs and cats)", fr: "Douanes de Bahreïn — Importation d'animaux vivants (chiens et chats)", es: "Aduanas de Baréin — Importación de animales vivos (perros y gatos)", pt: "Bahrain Customs — Import of live animals (dogs and cats)" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Not published", fr: "Non communiqué", es: "No publicada", pt: "Não publicado" }
    when: { en: "Bahrain does not publish a minimum import age. In practice a puppy must be old enough to be rabies-vaccinated and then to pass the rabies antibody (RANAT) test, which pushes the practical minimum age to several months.", fr: "Bahreïn ne publie pas d'âge minimum d'importation. En pratique, un chiot doit être assez âgé pour être vacciné contre la rage puis réussir le titrage (RANAT), ce qui porte l'âge minimum pratique à plusieurs mois.", es: "Baréin no publica una edad mínima de importación. En la práctica, un cachorro debe tener edad suficiente para ser vacunado contra la rabia y luego para superar la prueba de titulación de rabia (RANAT), lo que eleva la edad mínima práctica a varios meses.", pt: "O Bahrein não publica uma idade mínima de importação. Na prática, um filhote precisa ter idade suficiente para ser vacinado contra a raiva e depois passar no teste sorológico antirrábico (RANAT), o que empurra a idade mínima prática para vários meses." }
    exceptions: { en: "Exact age is Unknown from official sources — confirm with the Veterinary Quarantine department.", fr: "L'âge exact est non communiqué dans les sources officielles — à confirmer auprès du département de Quarantaine vétérinaire.", es: "La edad exacta es desconocida en las fuentes oficiales — confírmala con el departamento de Cuarentena Veterinaria.", pt: "A idade exata não é conhecida nas fontes oficiais — confirme com o departamento de Quarentena Veterinária." }
    ref: { en: "No published minimum age (Bahrain Customs / Ministry of Municipalities Affairs and Agriculture)", fr: "Aucun âge minimum publié (Douanes de Bahreïn / ministère des Affaires municipales et de l'Agriculture)", es: "Sin edad mínima publicada (Aduanas de Baréin / Ministerio de Asuntos Municipales y Agricultura)", pt: "No published minimum age (Bahrain Customs / Ministry of Municipalities Affairs and Agriculture)" }
  - item: { en: "Border check / port examination", fr: "Contrôle frontalier / examen au port", es: "Control fronterizo / examen en el puerto", pt: "Controle de fronteira / exame no ponto de entrada" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "At arrival the animal is subject to the control of the Veterinary Quarantine authority; a representative completes the necessary procedures before a simplified customs declaration releases the animal. Coordinating in advance prevents delays.", fr: "À l'arrivée, l'animal est soumis au contrôle de l'autorité de Quarantaine vétérinaire ; un représentant accomplit les procédures nécessaires avant qu'une déclaration douanière simplifiée ne libère l'animal. La coordination préalable évite les retards.", es: "A la llegada, el animal queda sujeto al control de la autoridad de Cuarentena Veterinaria; un representante realiza los trámites necesarios antes de que una declaración aduanera simplificada libere al animal. La coordinación previa evita retrasos.", pt: "Na chegada, o animal fica sujeito ao controle da autoridade de Quarentena Veterinária; um representante conclui os procedimentos necessários antes que uma declaração alfandegária simplificada libere o animal. Coordenar com antecedência evita atrasos." }
    exceptions: { en: "Without advance coordination the traveller must wait for the control-authority representative to arrive.", fr: "Sans coordination préalable, le voyageur doit attendre l'arrivée du représentant de l'autorité de contrôle.", es: "Sin coordinación previa, el viajero debe esperar a que llegue el representante de la autoridad de control.", pt: "Sem coordenação prévia, o viajante precisa esperar a chegada do representante da autoridade de controle." }
    ref: { en: "Bahrain Customs — Personal Pets", fr: "Douanes de Bahreïn — Animaux personnels", es: "Aduanas de Baréin — Mascotas personales", pt: "Bahrain Customs — Personal Pets" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not published", fr: "Non communiqué", es: "No publicada", pt: "Não publicado" }
    when: { en: "Bahrain does not publish a routine quarantine requirement for compliant pet dogs on its official import pages.", fr: "Bahreïn ne publie pas d'exigence de quarantaine systématique pour les chiens de compagnie conformes sur ses pages d'importation officielles.", es: "Baréin no publica una exigencia de cuarentena sistemática para los perros de compañía conformes en sus páginas de importación oficiales.", pt: "O Bahrein não publica uma exigência de quarentena de rotina para cachorros de estimação em conformidade em suas páginas de importação oficiais." }
    exceptions: { en: "Non-compliant animals remain subject to the control of the Veterinary Quarantine authority; measures for such cases are Unknown from published sources.", fr: "Les animaux non conformes restent soumis au contrôle de l'autorité de Quarantaine vétérinaire ; les mesures dans ces cas sont non communiquées dans les sources publiées.", es: "Los animales no conformes siguen sujetos al control de la autoridad de Cuarentena Veterinaria; las medidas para esos casos son desconocidas en las fuentes publicadas.", pt: "Animais em não conformidade permanecem sujeitos ao controle da autoridade de Quarentena Veterinária; as medidas para esses casos não são conhecidas nas fontes publicadas." }
    ref: { en: "Bahrain Customs — Personal Pets (no routine quarantine published)", fr: "Douanes de Bahreïn — Animaux personnels (aucune quarantaine systématique publiée)", es: "Aduanas de Baréin — Mascotas personales (sin cuarentena sistemática publicada)", pt: "Bahrain Customs — Personal Pets (no routine quarantine published)" }
  - item: { en: "Banned / restricted breeds", fr: "Races interdites / restreintes", es: "Razas prohibidas / restringidas", pt: "Raças proibidas / restritas" }
    required: { en: "Prohibited", fr: "Interdites", es: "Prohibidas", pt: "Proibidas" }
    when: { en: "Import of listed dangerous dog types — Pit Bull, Mastiff, Tosa and Presa types — is prohibited under the Veterinary Quarantine import controls.", fr: "L'importation des types de chiens dangereux listés — types Pit Bull, Mastiff, Tosa et Presa — est interdite au titre des contrôles d'importation de la Quarantaine vétérinaire.", es: "La importación de los tipos de perros peligrosos listados — tipos Pit Bull, Mastiff, Tosa y Presa — está prohibida en virtud de los controles de importación de la Cuarentena Veterinaria.", pt: "A importação dos tipos de cachorros perigosos listados — tipos Pit Bull, Mastiff, Tosa e Presa — é proibida pelos controles de importação da Quarentena Veterinária." }
    exceptions: { en: "No lighter category is published for these types at import; their import is refused.", fr: "Aucune catégorie allégée n'est publiée pour ces types à l'importation ; leur importation est refusée.", es: "No se publica ninguna categoría más flexible para estos tipos en la importación; su importación se rechaza.", pt: "Não é publicada nenhuma categoria mais leve para esses tipos na importação; a importação deles é recusada." }
    ref: { en: "Bahrain Customs — Import of live animals (dogs and cats): prohibited dog species (Pitbull, Mastiff, Tosa, Presa)", fr: "Douanes de Bahreïn — Importation d'animaux vivants (chiens et chats) : espèces de chiens interdites (Pitbull, Mastiff, Tosa, Presa)", es: "Aduanas de Baréin — Importación de animales vivos (perros y gatos): especies de perros prohibidas (Pitbull, Mastiff, Tosa, Presa)", pt: "Bahrain Customs — Import of live animals (dogs and cats): prohibited dog species (Pitbull, Mastiff, Tosa, Presa)" }

origin:
  scheme: own
  eu:
    title: { en: "Rabies-controlled origin — antibody test still required", fr: "Origine à rage contrôlée — titrage tout de même requis", es: "Origen con la rabia controlada — la prueba de titulación sigue siendo obligatoria", pt: "Origem com raiva controlada — teste sorológico ainda é obrigatório" }
    body:
      en: "Even from a country with a controlled rabies situation, Bahrain's published import checklist still lists the rabies antibody (RANAT) blood test, alongside a government veterinary health certificate, a certificate of origin and advance coordination with the Veterinary Quarantine department for a personal import permit. Any exemption for rabies-free origins is not stated on the official import page, so plan for the RANAT and confirm your case with the authority before you book."
      fr: "Même depuis un pays à situation rabique contrôlée, la liste d'importation publiée de Bahreïn mentionne le titrage des anticorps antirabiques (RANAT), aux côtés d'un certificat vétérinaire officiel, d'un certificat d'origine et d'une coordination préalable avec le département de Quarantaine vétérinaire pour un permis d'importation personnel. Toute exemption pour les origines indemnes de rage n'est pas indiquée sur la page d'importation officielle : prévois donc le RANAT et confirme ton cas auprès de l'autorité avant de réserver."
      es: "Incluso desde un país con una situación de rabia controlada, la lista de importación publicada de Baréin sigue incluyendo la prueba de sangre de anticuerpos contra la rabia (RANAT), junto con un certificado veterinario oficial del gobierno, un certificado de origen y una coordinación previa con el departamento de Cuarentena Veterinaria para un permiso de importación personal. Cualquier exención para orígenes libres de rabia no figura en la página de importación oficial, así que planifica la RANAT y confirma tu caso con la autoridad antes de reservar."
      pt: "Mesmo vindo de um país com situação de raiva controlada, a lista de verificação de importação publicada pelo Bahrein ainda inclui o teste sorológico antirrábico (RANAT), além de um atestado de saúde veterinário oficial do governo, um certificado de origem e coordenação prévia com o departamento de Quarentena Veterinária para uma autorização de importação pessoal. Qualquer isenção para origens livres de raiva não é indicada na página de importação oficial, então planeje-se para o RANAT e confirme o seu caso com a autoridade antes de reservar a viagem."
    cls: warn
  listed:
    title: { en: "Higher-risk origin — full rabies pathway", fr: "Origine à risque plus élevé — parcours rabique complet", es: "Origen de mayor riesgo — recorrido antirrábico completo", pt: "Origem de risco mais alto — trajetória antirrábica completa" }
    body:
      en: "From a country Bahrain treats as higher-risk for rabies, the rabies vaccination and the rabies antibody (RANAT) test must be completed before travel, and the sample sent to an accredited laboratory. The permit, government health certificate and certificate of origin are all still required. The exact accepted origins, laboratory, threshold and any waiting period are set by the Veterinary Quarantine department and are not published — confirm them directly."
      fr: "Depuis un pays que Bahreïn considère à risque rabique plus élevé, la vaccination antirabique et le titrage (RANAT) doivent être réalisés avant le voyage, l'échantillon étant envoyé à un laboratoire agréé. Le permis, le certificat vétérinaire officiel et le certificat d'origine restent tous requis. Les origines acceptées exactes, le laboratoire, le seuil et un éventuel délai sont fixés par le département de Quarantaine vétérinaire et ne sont pas publiés — à confirmer directement."
      es: "Desde un país que Baréin considera de mayor riesgo de rabia, la vacunación antirrábica y la prueba de titulación (RANAT) deben realizarse antes del viaje, y la muestra enviarse a un laboratorio acreditado. El permiso, el certificado sanitario oficial del gobierno y el certificado de origen siguen siendo todos obligatorios. Los orígenes aceptados exactos, el laboratorio, el umbral y cualquier periodo de espera los fija el departamento de Cuarentena Veterinaria y no se publican — confírmalos directamente."
      pt: "De um país que o Bahrein trata como de risco mais alto para a raiva, a vacinação antirrábica e o teste sorológico antirrábico (RANAT) precisam ser concluídos antes da viagem, e a amostra precisa ser enviada a um laboratório credenciado. A autorização, o atestado de saúde oficial e o certificado de origem continuam todos obrigatórios. As origens exatas aceitas, o laboratório, o limiar e qualquer período de espera são definidos pelo departamento de Quarentena Veterinária e não são publicados — confirme-os diretamente."
    cls: warn
  nonListed:
    title: { en: "Banned breed, or origin not accepted", fr: "Race interdite, ou origine non acceptée", es: "Raza prohibida, u origen no aceptado", pt: "Raça banida, ou origem não aceita" }
    body:
      en: "Bahrain bans the import of listed dangerous dog types (Pit Bull, Mastiff, Tosa and Presa types), and an origin the Veterinary Quarantine department does not accept may lead to refusal or require special approval. Because a dog that resembles a banned type risks refusal, confirm your dog's breed, any cross, and its origin with the department before making any plans."
      fr: "Bahreïn interdit l'importation des types de chiens dangereux listés (types Pit Bull, Mastiff, Tosa et Presa), et une origine non acceptée par le département de Quarantaine vétérinaire peut entraîner un refus ou nécessiter une autorisation spéciale. Un chien ressemblant à un type interdit risquant le refus, confirme la race de ton chien, tout croisement et son origine auprès du département avant tout projet."
      es: "Baréin prohíbe la importación de los tipos de perros peligrosos listados (tipos Pit Bull, Mastiff, Tosa y Presa), y un origen que el departamento de Cuarentena Veterinaria no acepta puede dar lugar a un rechazo o requerir una autorización especial. Como un perro que se parece a un tipo prohibido corre el riesgo de ser rechazado, confirma la raza de tu perro, cualquier cruce y su origen con el departamento antes de hacer cualquier plan."
      pt: "O Bahrein proíbe a importação dos tipos de cachorros perigosos listados (tipos Pit Bull, Mastiff, Tosa e Presa), e uma origem que o departamento de Quarentena Veterinária não aceita pode levar à recusa ou exigir aprovação especial. Como um cachorro que se pareça com um tipo banido corre o risco de ser recusado, confirme a raça do seu cachorro, qualquer cruzamento e sua origem junto ao departamento antes de fazer qualquer plano."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Bahrain depends on your advance coordination and the country you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien à Bahreïn dépend de ton coordination préalable et du pays de départ."
    es: "Lo que ocurre cuando tu perro llega a Baréin depende de tu coordinación previa y del país desde el que hayas volado."
    pt: "O que acontece quando o seu cachorro chega ao Bahrein depende da sua coordenação prévia e do país de onde você embarcou."
  points:
    - en: "Contact the Veterinary Quarantine department before travel and inform it of the date and time of arrival, so a representative can complete the procedures without delay."
      fr: "Contacte le département de Quarantaine vétérinaire avant le voyage et informe-le de la date et de l'heure d'arrivée, afin qu'un représentant puisse accomplir les procédures sans retard."
      es: "Contacta con el departamento de Cuarentena Veterinaria antes del viaje e infórmale de la fecha y la hora de llegada, para que un representante pueda realizar los trámites sin retraso."
      pt: "Entre em contato com o departamento de Quarentena Veterinária antes da viagem e informe a data e o horário de chegada, para que um representante possa concluir os procedimentos sem atraso."
    - en: "The animal is subject to the control of the Veterinary Quarantine authority; procedures are completed before a simplified customs declaration releases it."
      fr: "L'animal est soumis au contrôle de l'autorité de Quarantaine vétérinaire ; les procédures sont accomplies avant qu'une déclaration douanière simplifiée ne le libère."
      es: "El animal queda sujeto al control de la autoridad de Cuarentena Veterinaria; los trámites se realizan antes de que una declaración aduanera simplificada lo libere."
      pt: "O animal fica sujeito ao controle da autoridade de Quarentena Veterinária; os procedimentos são concluídos antes que uma declaração alfandegária simplificada o libere."
    - en: "Carry original documents — the government veterinary health certificate, the certificate of origin and the rabies antibody (RANAT) test result."
      fr: "Munis-toi des documents originaux — le certificat vétérinaire officiel, le certificat d'origine et le résultat du titrage antirabique (RANAT)."
      es: "Lleva los documentos originales — el certificado veterinario oficial del gobierno, el certificado de origen y el resultado de la prueba de titulación de rabia (RANAT)."
      pt: "Leve consigo os documentos originais — o atestado de saúde veterinário oficial do governo, o certificado de origem e o resultado do teste sorológico antirrábico (RANAT)."
    - en: "If you have not coordinated in advance, you must wait for the control-authority representative to arrive before procedures can be finished."
      fr: "Si tu n'avez pas coordonné à l'avance, tu dois attendre l'arrivée du représentant de l'autorité de contrôle avant que les procédures puissent être achevées."
      es: "Si no has coordinado con antelación, debes esperar a que llegue el representante de la autoridad de control antes de que puedan finalizarse los trámites."
      pt: "Se você não tiver coordenado com antecedência, precisará esperar a chegada do representante da autoridade de controle antes que os procedimentos possam ser concluídos."
    - en: "A banned breed is refused import; the consequences of missing or invalid documents are handled by the Veterinary Quarantine authority."
      fr: "Une race interdite est refusée à l'importation ; les conséquences de documents manquants ou invalides sont gérées par l'autorité de Quarantaine vétérinaire."
      es: "Una raza prohibida es rechazada en la importación; las consecuencias de documentos faltantes o no válidos las gestiona la autoridad de Cuarentena Veterinaria."
      pt: "Uma raça banida tem a importação recusada; as consequências de documentos ausentes ou inválidos são tratadas pela autoridade de Quarentena Veterinária."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Bahrain's Veterinary Quarantine import controls, published through Bahrain Customs, prohibit the import of a list of dangerous dog types. The restriction targets specific types rather than an individual behavioural assessment."
    fr: "Les contrôles d'importation de la Quarantaine vétérinaire de Bahreïn, publiés via les Douanes de Bahreïn, interdisent l'importation d'une liste de types de chiens dangereux. La restriction vise des types précis plutôt qu'une évaluation comportementale individuelle."
    es: "Los controles de importación de la Cuarentena Veterinaria de Baréin, publicados a través de las Aduanas de Baréin, prohíben la importación de una lista de tipos de perros peligrosos. La restricción se dirige a tipos concretos en lugar de a una evaluación individual del comportamiento."
    pt: "Os controles de importação da Quarentena Veterinária do Bahrein, publicados pela Alfândega do Bahrein, proíbem a importação de uma lista de tipos de cachorros perigosos. A restrição tem como alvo tipos específicos, e não uma avaliação comportamental individual."
  cat1:
    en: "Prohibited from import: Pit Bull types, Mastiff types, Tosa and Presa (Presa Canario) types, as named on the official import page. A dog that resembles one of these types, or a cross of them, risks refusal at the border."
    fr: "Interdits à l'importation : les types Pit Bull, les types Mastiff, les types Tosa et Presa (Presa Canario), tels que nommés sur la page d'importation officielle. Un chien ressemblant à l'un de ces types, ou un croisement de ceux-ci, risque le refus à la frontière."
    es: "Prohibidos para la importación: los tipos Pit Bull, los tipos Mastiff, los tipos Tosa y Presa (Presa Canario), tal como se nombran en la página de importación oficial. Un perro que se parezca a uno de estos tipos, o un cruce de ellos, corre el riesgo de ser rechazado en la frontera."
    pt: "Proibidos para importação: tipos Pit Bull, tipos Mastiff, tipos Tosa e Presa (Presa Canario), conforme nomeados na página de importação oficial. Um cachorro que se pareça com um desses tipos, ou um cruzamento deles, corre o risco de ser recusado na fronteira."
  cat2:
    en: "There is no published lighter 'permitted with conditions' category for these types at import: their import is refused. Any case-by-case treatment would be a matter for the Veterinary Quarantine department."
    fr: "Il n'existe pas de catégorie allégée « autorisée sous conditions » publiée pour ces types à l'importation : leur importation est refusée. Tout traitement au cas par cas relèverait du département de Quarantaine vétérinaire."
    es: "No existe una categoría más flexible de «permitido con condiciones» publicada para estos tipos en la importación: su importación se rechaza. Cualquier tratamiento caso por caso correspondería al departamento de Cuarentena Veterinaria."
    pt: "Não existe publicada uma categoria mais leve de 'permitido com condições' para esses tipos na importação: a importação deles é recusada. Qualquer tratamento caso a caso seria uma questão a cargo do departamento de Quarentena Veterinária."
  note:
    en: "The official list names the types only broadly (Pit Bull, Mastiff, Tosa, Presa). Because interpretation at the border can be strict, confirm your dog's breed and any cross with the Veterinary Quarantine department before arranging the permit."
    fr: "La liste officielle ne nomme les types que de façon générale (Pit Bull, Mastiff, Tosa, Presa). L'interprétation à la frontière pouvant être stricte, confirme la race de ton chien et tout croisement auprès du département de Quarantaine vétérinaire avant d'organiser le permis."
    es: "La lista oficial solo nombra los tipos de forma general (Pit Bull, Mastiff, Tosa, Presa). Como la interpretación en la frontera puede ser estricta, confirma la raza de tu perro y cualquier cruce con el departamento de Cuarentena Veterinaria antes de gestionar el permiso."
    pt: "A lista oficial nomeia os tipos apenas de forma genérica (Pit Bull, Mastiff, Tosa, Presa). Como a interpretação na fronteira pode ser rigorosa, confirme a raça do seu cachorro e qualquer cruzamento junto ao departamento de Quarentena Veterinária antes de providenciar a autorização."

checklist:
  - en: "Contact the Veterinary Quarantine department in advance and arrange a personal import permit"
    fr: "Contacte à l'avance le département de Quarantaine vétérinaire et organise un permis d'importation personnel"
    es: "Contacta con antelación con el departamento de Cuarentena Veterinaria y gestiona un permiso de importación personal"
    pt: "Entre em contato com antecedência com o departamento de Quarentena Veterinária e providencie uma autorização de importação pessoal"
  - en: "Inform the authority of your dog's date and time of arrival"
    fr: "Informe l'autorité de la date et de l'heure d'arrivée de ton chien"
    es: "Informa a la autoridad de la fecha y la hora de llegada de tu perro"
    pt: "Informe à autoridade a data e o horário de chegada do seu cachorro"
  - en: "Valid rabies vaccination (precondition of the antibody test — confirm timing with your vet)"
    fr: "Vaccination antirabique valide (préalable au titrage — confirme les délais avec ton vétérinaire)"
    es: "Vacunación antirrábica válida (requisito previo de la prueba de titulación — confirma los plazos con tu veterinario)"
    pt: "Vacinação antirrábica válida (pré-requisito do teste sorológico — confirme os prazos com seu veterinário)"
  - en: "Rabies antibody test (RANAT) taken after vaccination"
    fr: "Titrage des anticorps antirabiques (RANAT) réalisé après la vaccination"
    es: "Prueba de titulación de anticuerpos contra la rabia (RANAT) realizada tras la vacunación"
    pt: "Teste sorológico antirrábico (RANAT) realizado após a vacinação"
  - en: "Original government veterinary health certificate"
    fr: "Certificat vétérinaire officiel original"
    es: "Certificado veterinario de salud oficial del gobierno original"
    pt: "Atestado de saúde veterinário oficial do governo original"
  - en: "Original certificate of origin for the animal"
    fr: "Certificat d'origine original pour l'animal"
    es: "Certificado de origen original del animal"
    pt: "Certificado de origem original do animal"
  - en: "Confirm your dog is not a banned type (Pit Bull, Mastiff, Tosa, Presa)"
    fr: "Vérifie que ton chien n'est pas d'un type interdit (Pit Bull, Mastiff, Tosa, Presa)"
    es: "Confirma que tu perro no es de un tipo prohibido (Pit Bull, Mastiff, Tosa, Presa)"
    pt: "Confirme que seu cachorro não é de um tipo banido (Pit Bull, Mastiff, Tosa, Presa)"
  - en: "Confirm identification (microchip) accepted with the Veterinary Quarantine department"
    fr: "Confirme l'identification (puce) acceptée auprès du département de Quarantaine vétérinaire"
    es: "Confirma la identificación (microchip) aceptada con el departamento de Cuarentena Veterinaria"
    pt: "Confirme a identificação (microchip) aceita junto ao departamento de Quarentena Veterinária"
  - en: "Airline reservation confirming your dog's travel option and a suitable travel crate"
    fr: "Réservation confirmant l'option de transport de ton chien et une caisse de transport adaptée"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y una jaula de transporte adecuada"
    pt: "Reserva na companhia aérea confirmando a opção de viagem do cachorro e uma caixa de transporte adequada às normas IATA"

