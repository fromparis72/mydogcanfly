# Country Entry Guide — Bahrain (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_bh
iso2: "BH"
name: { en: "Bahrain", fr: "Bahreïn", es: "Baréin", pt: "Bahrein" }
region: { en: "Middle East", fr: "Moyen-Orient", es: "Oriente Medio", pt: "Oriente Médio" }


regime: listed
exit:
  authority: Animal Wealth Directorate
  authorityUrl: https://www.mun.gov.bh/newportal/en
  intro:
    en: "Bahrain is a listed country, so no rabies titer is needed to return to the EU — but you must obtain an export permit and endorsed health certificate from the Veterinary Quarantine (Animal Wealth Directorate)."
    fr: "Bahreïn est un pays listé : pas de titrage pour rentrer dans l'UE — mais tu dois obtenir un permis d'export et un certificat sanitaire visé par la Quarantaine vétérinaire (Direction de la richesse animale)."
    es: "Baréin es un país listado: no hace falta titulación para volver a la UE — pero debes obtener un permiso de exportación y un certificado sanitario refrendado por la Cuarentena Veterinaria (Dirección de Riqueza Animal)."
    pt: "O Bahrein é um país listado, portanto não é necessária titulação antirrábica para retornar à UE — mas você precisa obter uma autorização de exportação e um atestado de saúde endossado pela Quarentena Veterinária (Animal Wealth Directorate)."
  steps:
    - timing: window
      scope: any
      text:
        en: "Contact the Veterinary Quarantine Department before travel to obtain the export permit and the endorsed original health certificate for your dog."
        fr: "Contacte le service de Quarantaine vétérinaire avant le voyage pour obtenir le permis d'export et le certificat sanitaire original visé pour ton chien."
        es: "Contacta con el Departamento de Cuarentena Veterinaria antes del viaje para obtener el permiso de exportación y el certificado sanitario original refrendado para tu perro."
        pt: "Entre em contato com o Departamento de Quarentena Veterinária antes da viagem para obter a autorização de exportação e o atestado de saúde original endossado para o seu cachorro."
  onSiteNote:
    en: "The certificate is valid 10 days to reach the EU border check — arrange it close to departure."
    fr: "Le certificat est valable 10 jours pour atteindre le contrôle à la frontière UE — organise-le peu avant le départ."
    es: "El certificado vale 10 días para llegar al control fronterizo de la UE — organízalo cerca de la salida."
    pt: "O certificado vale 10 dias para chegar ao controle de fronteira da UE — providencie-o pouco antes da partida."

hero:
  h1: { en: "Traveling to Bahrain with your dog", fr: "Voyager à Bahreïn avec ton chien", es: "Viajar a Baréin con tu perro", pt: "Viajando para o Bahrein com seu cachorro" }
  intro:
    en: >-
      Bahrain allows pet dogs, but entry runs through the Kingdom's own scheme, not the EU framework.
      Bringing a dog in is handled by the Veterinary Quarantine service of the Ministry of Municipalities
      Affairs and Agriculture, and cleared by Bahrain Customs at the border. Before your dog travels you
      must contact the Veterinary Quarantine department in advance and arrange a personal live-animal
      import permit. Your dog must arrive with an official government veterinary health certificate, a
      certificate of origin and a rabies antibody blood test (the authority calls it the RANAT). Several
      dangerous dog types are banned from import outright. The exact path depends mainly on the country
      your dog is travelling from and its rabies situation. This guide explains the permit, the documents,
      the rabies antibody test and the banned breeds, and flags clearly the points Bahrain does not publish
      in detail so you know what to confirm with the authority before you book.
    fr: >-
      Bahreïn admet les chiens, mais l'entrée passe par le dispositif propre au Royaume, pas par le cadre
      de l'UE. L'importation d'un chien relève du service de Quarantaine vétérinaire du ministère des
      Affaires municipales et de l'Agriculture, et le dédouanement se fait auprès des Douanes de Bahreïn à
      la frontière. Avant le voyage de ton chien, tu dois contacter à l'avance le département de
      Quarantaine vétérinaire et organiser un permis d'importation d'animal vivant à titre personnel. Ton
      chien doit arriver avec un certificat vétérinaire officiel, un certificat d'origine et un titrage des
      anticorps antirabiques (que l'autorité appelle le RANAT). Plusieurs types de chiens dangereux sont
      totalement interdits à l'importation. Le parcours exact dépend surtout du pays de départ et de sa
      situation rabique. Ce guide détaille le permis, les documents, le titrage antirabique et les races
      interdites, et signale clairement les points que Bahreïn ne publie pas en détail afin que tu
      sachiez quoi confirmer auprès de l'autorité avant de réserver.
    es: >-
      Baréin admite perros, pero la entrada se rige por el sistema propio del Reino, no por el marco de la
      UE. La importación de un perro corre a cargo del servicio de Cuarentena Veterinaria del Ministerio de
      Asuntos Municipales y Agricultura, y el despacho se hace ante las Aduanas de Baréin en la frontera.
      Antes de que tu perro viaje, debes contactar con antelación con el departamento de Cuarentena
      Veterinaria y gestionar un permiso de importación de animal vivo a título personal. Tu perro debe
      llegar con un certificado veterinario oficial del gobierno, un certificado de origen y una prueba de
      sangre de anticuerpos contra la rabia (que la autoridad denomina RANAT). Varios tipos de perros
      peligrosos están totalmente prohibidos para la importación. El recorrido exacto depende sobre todo del
      país desde el que viaja tu perro y de su situación en materia de rabia. Esta guía explica el permiso,
      los documentos, la prueba de titulación de rabia y las razas prohibidas, y señala claramente los
      puntos que Baréin no publica en detalle para que sepas qué confirmar con la autoridad antes de
      reservar.

    pt: "O Bahrein permite cachorros de estimação, mas a entrada segue o esquema próprio do Reino, não o marco da UE. A entrada de um cachorro é conduzida pelo serviço de Quarentena Veterinária do Ministério dos Assuntos Municipais e Agricultura, e liberada pela Alfândega do Bahrein na fronteira. Antes de o seu cachorro viajar, você precisa entrar em contato com antecedência com o departamento de Quarentena Veterinária e providenciar uma autorização de importação de animal vivo a título pessoal. Seu cachorro precisa chegar com um atestado de saúde veterinário oficial do governo, um certificado de origem e um teste sorológico antirrábico (a autoridade chama de RANAT). Vários tipos de cachorros perigosos são totalmente banidos de importação. O caminho exato depende principalmente do país de onde o cachorro está partindo e da situação da raiva nesse país. Este guia explica a autorização, os documentos, o teste sorológico antirrábico e as raças banidas, e sinaliza claramente os pontos que o Bahrein não publica em detalhe, para que você saiba o que confirmar com a autoridade antes de reservar a viagem."
difficulty:
  level: moderate
  label: { en: "Moderate — import permit and rabies antibody test required", fr: "Modéré — permis d'importation et titrage antirabique requis", es: "Moderado — permiso de importación y prueba de titulación de rabia obligatorios", pt: "Moderado — exige autorização de importação e teste sorológico antirrábico" }

prepTime:
  eu:
    en: "From a rabies-controlled origin: plan several weeks — advance contact with Veterinary Quarantine, the personal import permit, a government health certificate, a certificate of origin and the rabies antibody (RANAT) blood test, whose laboratory result takes time."
    fr: "Depuis une origine à rage contrôlée : compte plusieurs semaines — contact préalable avec la Quarantaine vétérinaire, permis d'importation personnel, certificat vétérinaire officiel, certificat d'origine et titrage des anticorps antirabiques (RANAT), dont le résultat de laboratoire demande du temps."
    es: "Desde un origen con la rabia controlada: cuenta con varias semanas — contacto previo con Cuarentena Veterinaria, el permiso de importación personal, un certificado sanitario oficial, un certificado de origen y la prueba de sangre de anticuerpos contra la rabia (RANAT), cuyo resultado de laboratorio lleva tiempo."
    pt: "De uma origem com raiva controlada: planeje várias semanas — contato prévio com a Quarentena Veterinária, a autorização de importação pessoal, um atestado de saúde oficial, um certificado de origem e o teste sorológico antirrábico (RANAT), cujo resultado laboratorial leva tempo."
  listed:
    en: "From a higher-risk origin: allow several weeks to a few months, as the rabies vaccination and the rabies antibody (RANAT) test must be completed and the sample sent to an accredited laboratory before travel."
    fr: "Depuis une origine à risque plus élevé : prévois plusieurs semaines à quelques mois, la vaccination antirabique et le titrage (RANAT) devant être réalisés et l'échantillon envoyé à un laboratoire agréé avant le voyage."
    es: "Desde un origen de mayor riesgo: cuenta con desde varias semanas hasta unos meses, ya que la vacunación antirrábica y la prueba de titulación (RANAT) deben realizarse y la muestra enviarse a un laboratorio acreditado antes del viaje."
    pt: "De uma origem de risco mais alto: reserve de várias semanas a alguns meses, já que a vacinação antirrábica e o teste sorológico antirrábico (RANAT) precisam ser concluídos e a amostra enviada a um laboratório credenciado antes da viagem."
  nonListed:
    en: "For a banned breed, or an origin Bahrain does not accept: import may be refused or require special approval from the Veterinary Quarantine authority — timing is case-by-case and cannot be assumed."
    fr: "Pour une race interdite, ou une origine non acceptée par Bahreïn : l'importation peut être refusée ou soumise à une autorisation spéciale de l'autorité de Quarantaine vétérinaire — les délais sont examinés au cas par cas."
    es: "Para una raza prohibida, o un origen que Baréin no acepta: la importación puede ser rechazada o requerir una autorización especial de la autoridad de Cuarentena Veterinaria — los plazos se examinan caso por caso y no pueden darse por hechos."
    pt: "Para uma raça banida, ou uma origem que o Bahrein não aceita: a importação pode ser recusada ou exigir aprovação especial da autoridade de Quarentena Veterinária — os prazos são avaliados caso a caso e não podem ser presumidos."

