notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog, and DALRRD spells out the exact tests on your import permit and health certificate."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien, et le DALRRD précise les tests exacts sur ton permis et ton certificat sanitaire."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro, y el DALRRD detalla las pruebas exactas en tu permiso de importación y tu certificado sanitario."
    pt: "Só um veterinário pode confirmar o procedimento exato para o seu cachorro, e o DALRRD detalha os testes exatos na sua autorização de importação e no seu atestado de saúde."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — South Africa (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — l'Afrique du Sud (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Sudáfrica (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — a África do Sul (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — South Africa", fr: "Pays de destination — Afrique du Sud", es: "País de destino — Sudáfrica", pt: "País de destino — África do Sul" }
      text:
        en: "South Africa always requires an advance veterinary import permit from DALRRD, an ISO microchip, a valid rabies vaccination, a set of disease tests for dogs and a state-endorsed health certificate."
        fr: "L'Afrique du Sud exige toujours un permis d'importation vétérinaire préalable du DALRRD, une puce ISO, une vaccination antirabique valide, une série de tests de maladies pour les chiens et un certificat sanitaire visé par l'État."
        es: "Sudáfrica exige siempre un permiso de importación veterinario previo del DALRRD, un microchip ISO, una vacunación antirrábica válida, una serie de pruebas de enfermedades para perros y un certificado sanitario refrendado por el Estado."
        pt: "A África do Sul sempre exige uma autorização de importação veterinária prévia do DALRRD, um microchip ISO, uma vacinação antirrábica válida, uma série de testes de doenças para cachorros e um atestado de saúde com aval do Estado."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The rabies status of the departure country decides whether a rabies antibody test and a period of quarantine are added. High-risk rabies origins face the strictest path."
        fr: "Le statut rabique du pays de départ détermine si un test des anticorps antirabiques et une quarantaine s'ajoutent. Les origines à haut risque suivent le parcours le plus strict."
        es: "El estatus de rabia del país de salida determina si se añaden una prueba de titulación de rabia y un periodo de cuarentena. Los orígenes de alto riesgo de rabia siguen el camino más estricto."
        pt: "O estatuto de raiva do país de partida determina se um teste sorológico antirrábico (titulação) e um período de quarentena serão acrescentados. As origens de alto risco de raiva seguem o caminho mais rígido."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay in a rabies-risk country can change the tests and treatments required, even if you fly in from a lower-risk country. It is your dog's real origin and history that count."
        fr: "Un séjour récent dans un pays à risque rabique peut modifier les tests et traitements exigés, même si tu arrives d'un pays à moindre risque. C'est l'origine réelle et l'historique du chien qui comptent."
        es: "Una estancia reciente en un país con riesgo de rabia puede cambiar las pruebas y los tratamientos exigidos, aunque llegues desde un país de menor riesgo. Lo que cuenta es el origen y el historial reales de tu perro."
        pt: "Uma estadia recente em um país com risco de raiva pode mudar os testes e os tratamentos exigidos, mesmo que você chegue de um país de menor risco. O que conta é a origem real e o histórico do seu cachorro."
  note:
    en: "So read the requirements below as South Africa's framework, then confirm your dog's exact origin and history with your vet — the import permit and health certificate list the precise tests."
    fr: "Lis donc les exigences ci-dessous comme le cadre sud-africain, puis confirme l'origine et l'historique exacts avec ton vétérinaire — le permis et le certificat listent les tests précis."
    es: "Así que lee los requisitos siguientes como el marco de Sudáfrica y luego confirma el origen y el historial exactos de tu perro con tu veterinario — el permiso de importación y el certificado sanitario detallan las pruebas precisas."
    pt: "Leia então as exigências abaixo como o quadro geral da África do Sul e confirme com seu veterinário a origem e o histórico exatos do seu cachorro — a autorização de importação e o atestado de saúde listam os testes precisos."

requirements:
  - item: { en: "Veterinary import permit", fr: "Permis d'importation vétérinaire", es: "Permiso de importación veterinario", pt: "Autorização de importação veterinária" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Apply to the Director: Animal Health (DALRRD) before the dog is shipped; permit is valid for a limited time. Processing takes about 3–5 working days.", fr: "À demander au Director: Animal Health (DALRRD) avant l'expédition du chien ; permis valable une durée limitée. Traitement en 3 à 5 jours ouvrés.", es: "Solicítalo al Director: Animal Health (DALRRD) antes de expedir al perro; el permiso es válido durante un tiempo limitado. La tramitación lleva unos 3 a 5 días hábiles.", pt: "Peça ao Director: Animal Health (DALRRD) antes do embarque do cachorro; a autorização é válida por tempo limitado. A análise leva cerca de 3 a 5 dias úteis." }
    exceptions: { en: "No exceptions — dogs without an approved permit are refused entry.", fr: "Aucune exception — un chien sans permis approuvé est refusé à l'entrée.", es: "Sin excepciones — los perros sin un permiso aprobado son rechazados en la entrada.", pt: "Sem exceções — cachorros sem autorização aprovada têm a entrada recusada." }
    ref: { en: "DALRRD — Import of animals and animal products; gov.za", fr: "DALRRD — Importation d'animaux et de produits animaux ; gov.za", es: "DALRRD — Importación de animales y productos animales; gov.za", pt: "DALRRD — Importação de animais e produtos de origem animal; gov.za" }
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "ISO 11784/11785 15-digit microchip, implanted before the rabies vaccination; the microchip number must appear on all lab reports.", fr: "Puce ISO 11784/11785 à 15 chiffres, posée avant la vaccination antirabique ; le numéro doit figurer sur tous les rapports de laboratoire.", es: "Microchip ISO 11784/11785 de 15 dígitos, implantado antes de la vacunación antirrábica; el número del microchip debe figurar en todos los informes de laboratorio.", pt: "Microchip ISO 11784/11785 de 15 dígitos, implantado antes da vacinação antirrábica; o número do microchip precisa constar em todos os laudos de laboratório." }
    exceptions: { en: "None — identification is required for the vaccination and tests to be valid.", fr: "Aucune — l'identification est requise pour que le vaccin et les tests soient valides.", es: "Ninguna — la identificación es obligatoria para que la vacuna y las pruebas sean válidas.", pt: "Nenhuma — a identificação é obrigatória para que a vacina e os testes sejam válidos." }
    ref: { en: "DALRRD import conditions for dogs and cats", fr: "Conditions d'importation DALRRD pour chiens et chats", es: "Condiciones de importación del DALRRD para perros y gatos", pt: "Condições de importação do DALRRD para cães e gatos" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Primary vaccination not less than 30 days and not more than 12 months before import; boosters within 12 months. Given after microchipping.", fr: "Primo-vaccination au moins 30 jours et au plus 12 mois avant l'import ; rappels dans les 12 mois. Après la pose de la puce.", es: "Primovacunación no menos de 30 días y no más de 12 meses antes de la importación; refuerzos dentro de los 12 meses. Administrada después de la colocación del microchip.", pt: "Vacinação primária no mínimo 30 dias e no máximo 12 meses antes da importação; reforços dentro de 12 meses. Aplicada depois da colocação do microchip." }
    exceptions: { en: "A copy of the rabies vaccination certificate must accompany the health certificate.", fr: "Une copie du certificat de vaccination antirabique doit accompagner le certificat sanitaire.", es: "Una copia del certificado de vacunación antirrábica debe acompañar al certificado sanitario.", pt: "Uma cópia do certificado de vacinação antirrábica precisa acompanhar o atestado de saúde." }
    ref: { en: "DALRRD import conditions for dogs and cats", fr: "Conditions d'importation DALRRD pour chiens et chats", es: "Condiciones de importación del DALRRD para perros y gatos", pt: "Condições de importação do DALRRD para cães e gatos" }
  - item: { en: "Rabies antibody test", fr: "Test des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Required for dogs from high-risk rabies countries: a positive result (≥0.5 IU/ml) from a WOAH/OIE-approved laboratory. Specified on the import permit.", fr: "Requis pour les chiens venant de pays à haut risque de rage : résultat positif (≥0,5 UI/ml) d'un laboratoire agréé WOAH/OIE. Précisé sur le permis.", es: "Obligatoria para perros procedentes de países de alto riesgo de rabia: un resultado positivo (≥0,5 UI/ml) de un laboratorio autorizado por la WOAH/OIE. Se especifica en el permiso de importación.", pt: "Obrigatório para cachorros vindos de países de alto risco de raiva: resultado positivo (≥0,5 UI/ml) de um laboratório aprovado pela WOAH/OIE. Especificado na autorização de importação." }
    exceptions: { en: "Not required from rabies-free or rabies-controlled countries (e.g. EU, US, UK, Canada, Australia).", fr: "Non requis depuis les pays indemnes ou à rage contrôlée (ex. UE, USA, RU, Canada, Australie).", es: "No se exige desde países libres de rabia o con rabia controlada (p. ej. UE, EE. UU., RU, Canadá, Australia).", pt: "Não obrigatório vindo de países livres de raiva ou com raiva controlada (p. ex. UE, EUA, Reino Unido, Canadá, Austrália)." }
    ref: { en: "DALRRD import conditions (per country of origin)", fr: "Conditions d'importation DALRRD (selon le pays d'origine)", es: "Condiciones de importación del DALRRD (según el país de origen)", pt: "Condições de importação do DALRRD (conforme o país de origem)" }
  - item: { en: "Disease tests (dogs)", fr: "Tests de maladies (chiens)", es: "Pruebas de enfermedades (perros)", pt: "Testes de doenças (cachorros)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorias", pt: "Obrigatório" }
    when: { en: "Dogs tested and certified free of Brucella canis, Trypanosoma evansi (surra), Babesia gibsoni, Dirofilaria immitis and Leishmania, within 30 days of export. Surra testing at a recognised OIE reference lab.", fr: "Chiens testés et certifiés indemnes de Brucella canis, Trypanosoma evansi (surra), Babesia gibsoni, Dirofilaria immitis et Leishmania, dans les 30 jours avant l'export. Test surra dans un labo de référence OIE reconnu.", es: "Perros sometidos a pruebas y certificados como libres de Brucella canis, Trypanosoma evansi (surra), Babesia gibsoni, Dirofilaria immitis y Leishmania, dentro de los 30 días previos a la exportación. La prueba de surra en un laboratorio de referencia reconocido por la OIE.", pt: "Cachorros testados e certificados como livres de Brucella canis, Trypanosoma evansi (surra), Babesia gibsoni, Dirofilaria immitis e Leishmania, dentro dos 30 dias anteriores à exportação. O teste de surra deve ser feito em um laboratório de referência reconhecido pela OIE." }
    exceptions: { en: "Exact tests and any treatments are listed on the health certificate issued with the permit; they can vary by origin.", fr: "Les tests exacts et d'éventuels traitements sont listés sur le certificat délivré avec le permis ; ils peuvent varier selon l'origine.", es: "Las pruebas exactas y cualquier tratamiento figuran en el certificado sanitario expedido con el permiso; pueden variar según el origen.", pt: "Os testes exatos e eventuais tratamentos constam no atestado de saúde emitido junto com a autorização; podem variar conforme a origem." }
    ref: { en: "DALRRD veterinary health certificate for dogs", fr: "Certificat sanitaire vétérinaire DALRRD pour chiens", es: "Certificado sanitario veterinario del DALRRD para perros", pt: "Atestado de saúde veterinário do DALRRD para cachorros" }
  - item: { en: "Veterinary health certificate", fr: "Certificat sanitaire vétérinaire", es: "Certificado sanitario veterinario", pt: "Atestado de saúde veterinário" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Completed in English by a vet authorised by the exporting country's veterinary authority, within 10 days of departure; signed, stamped and endorsed.", fr: "Rempli en anglais par un vétérinaire habilité par l'autorité du pays d'export, dans les 10 jours avant le départ ; signé, tamponné et visé.", es: "Cumplimentado en inglés por un veterinario autorizado por la autoridad veterinaria del país exportador, dentro de los 10 días previos a la salida; firmado, sellado y refrendado.", pt: "Preenchido em inglês por um veterinário habilitado pela autoridade veterinária do país exportador, dentro dos 10 dias anteriores à partida; assinado, carimbado e endossado." }
    exceptions: { en: "Template is issued together with the import permit; use only that version.", fr: "Le modèle est délivré avec le permis d'importation ; n'utilise que cette version.", es: "El modelo se expide junto con el permiso de importación; usa únicamente esa versión.", pt: "O modelo é emitido junto com a autorização de importação; use apenas essa versão." }
    ref: { en: "DALRRD — Import of animals and animal products; gov.za", fr: "DALRRD — Importation d'animaux et de produits animaux ; gov.za", es: "DALRRD — Importación de animales y productos animales; gov.za", pt: "DALRRD — Importação de animais e produtos de origem animal; gov.za" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Dogs from high-risk origins may undergo isolation/quarantine on arrival at an approved facility; the state veterinarian at the port of entry arranges accommodation.", fr: "Les chiens d'origines à risque peuvent subir un isolement/quarantaine à l'arrivée dans un établissement agréé ; le vétérinaire d'État au point d'entrée organise l'hébergement.", es: "Los perros de orígenes de alto riesgo pueden someterse a aislamiento/cuarentena a la llegada en un establecimiento autorizado; el veterinario del Estado en el punto de entrada organiza el alojamiento.", pt: "Cachorros de origens de alto risco podem passar por isolamento/quarentena na chegada, em um estabelecimento autorizado; o veterinário do Estado no ponto de entrada organiza a acomodação." }
    exceptions: { en: "Not applied to most rabies-free/controlled origins. Confirm on your permit; an indemnity declaration is required where quarantine applies.", fr: "Non appliquée à la plupart des origines indemnes/contrôlées. À confirmer sur le permis ; une déclaration d'indemnité est requise en cas de quarantaine.", es: "No se aplica a la mayoría de los orígenes libres de rabia/controlados. Confírmalo en tu permiso; se exige una declaración de indemnidad cuando procede la cuarentena.", pt: "Não se aplica à maioria das origens livres de raiva ou com raiva controlada. Confirme na sua autorização; quando há quarentena, é exigida uma declaração de indenidade." }
    ref: { en: "DALRRD — Import of animals (quarantine at port of entry)", fr: "DALRRD — Importation d'animaux (quarantaine au point d'entrée)", es: "DALRRD — Importación de animales (cuarentena en el punto de entrada)", pt: "DALRRD — Importação de animais (quarentena no ponto de entrada)" }
  - item: { en: "Advance notification", fr: "Notification préalable", es: "Notificación previa", pt: "Aviso prévio" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "The import permit is itself the advance authorisation; present the original permit, original health certificate and rabies certificate to the veterinary import control officer at the port of entry.", fr: "Le permis d'importation constitue l'autorisation préalable ; présente l'original du permis, du certificat sanitaire et du certificat de rage à l'agent de contrôle vétérinaire au point d'entrée.", es: "El permiso de importación constituye la autorización previa; presenta el permiso original, el certificado sanitario original y el certificado de rabia al agente de control veterinario de importación en el punto de entrada.", pt: "A própria autorização de importação é a autorização prévia; apresente o original da autorização, o original do atestado de saúde e o certificado antirrábico ao agente de controle veterinário de importação no ponto de entrada." }
    exceptions: { en: "Where quarantine applies, notify the state veterinarian at the port of entry in advance.", fr: "En cas de quarantaine, préviens à l'avance le vétérinaire d'État au point d'entrée.", es: "Cuando procede la cuarentena, avisa con antelación al veterinario del Estado en el punto de entrada.", pt: "Quando houver quarentena, avise com antecedência o veterinário do Estado no ponto de entrada." }
    ref: { en: "DALRRD — Import of animals and animal products; gov.za", fr: "DALRRD — Importation d'animaux et de produits animaux ; gov.za", es: "DALRRD — Importación de animales y productos animales; gov.za", pt: "DALRRD — Importação de animais e produtos de origem animal; gov.za" }
  - item: { en: "Restricted breeds", fr: "Races restreintes", es: "Razas restringidas", pt: "Raças restritas" }
    required: { en: "No national import ban", fr: "Pas d'interdiction nationale", es: "Sin prohibición nacional de importación", pt: "Sem proibição nacional de importação" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "South Africa has no national breed-specific import ban; some municipalities apply local ownership rules. Verify local by-laws.", fr: "L'Afrique du Sud n'a pas d'interdiction d'importation par race au niveau national ; certaines municipalités appliquent des règles locales. Vérifie les règlements locaux.", es: "Sudáfrica no tiene ninguna prohibición de importación por raza a nivel nacional; algunos municipios aplican normas locales de tenencia. Verifica los reglamentos locales.", pt: "A África do Sul não tem proibição nacional de importação por raça; alguns municípios aplicam regras locais de posse. Verifique os regulamentos municipais." }
    ref: { en: "No national breed-specific legislation (DALRRD)", fr: "Aucune législation nationale par race (DALRRD)", es: "Sin legislación nacional por raza (DALRRD)", pt: "Nenhuma legislação nacional por raça (DALRRD)" }

origin:
  scheme: own
  eu:
    title: { en: "Rabies-free origins", fr: "Origines indemnes de rage", es: "Orígenes libres de rabia", pt: "Origens livres de raiva" }
    body:
      en: "From a rabies-free country, your dog still needs the DALRRD import permit, an ISO microchip, a valid rabies vaccination, the dog disease tests within 30 days and a state-endorsed health certificate. No rabies antibody test and normally no quarantine."
      fr: "Depuis un pays indemne de rage, ton chien a tout de même besoin du permis DALRRD, d'une puce ISO, d'une vaccination antirabique valide, des tests de maladies dans les 30 jours et d'un certificat sanitaire visé. Pas de test des anticorps antirabiques et normalement pas de quarantaine."
      es: "Desde un país libre de rabia, tu perro necesita igualmente el permiso de importación del DALRRD, un microchip ISO, una vacunación antirrábica válida, las pruebas de enfermedades para perros dentro de los 30 días y un certificado sanitario refrendado por el Estado. Sin prueba de titulación de rabia y normalmente sin cuarentena."
      pt: "Vindo de um país livre de raiva, o seu cachorro ainda assim precisa da autorização de importação do DALRRD, de um microchip ISO, de uma vacinação antirrábica válida, dos testes de doenças para cachorros dentro de 30 dias e de um atestado de saúde com aval do Estado. Sem teste sorológico antirrábico (titulação) e, normalmente, sem quarentena."
    cls: warn
  listed:
    title: { en: "Rabies-controlled origins (EU, US, UK, Canada…)", fr: "Origines à rage contrôlée (UE, USA, RU, Canada…)", es: "Orígenes con rabia controlada (UE, EE. UU., RU, Canadá…)", pt: "Origens com raiva controlada (UE, EUA, Reino Unido, Canadá…)" }
    body:
      en: "From a rabies-controlled country, the same core requirements apply: import permit, microchip, rabies vaccination, dog disease tests and an endorsed health certificate. A rabies antibody test is not required; present all originals to the veterinary control officer on arrival."
      fr: "Depuis un pays à rage contrôlée, les mêmes exigences de base s'appliquent : permis, puce, vaccination antirabique, tests de maladies et certificat sanitaire visé. Un test des anticorps antirabiques n'est pas requis ; présente tous les originaux à l'agent de contrôle vétérinaire à l'arrivée."
      es: "Desde un país con rabia controlada se aplican los mismos requisitos básicos: permiso de importación, microchip, vacunación antirrábica, pruebas de enfermedades para perros y un certificado sanitario refrendado. No se exige prueba de titulación de rabia; presenta todos los originales al agente de control veterinario a la llegada."
      pt: "Vindo de um país com raiva controlada, valem as mesmas exigências básicas: autorização de importação, microchip, vacinação antirrábica, testes de doenças para cachorros e um atestado de saúde endossado. Não é exigido teste sorológico antirrábico (titulação); apresente todos os originais ao agente de controle veterinário na chegada."
    cls: warn
  nonListed:
    title: { en: "High-risk rabies origins", fr: "Origines à haut risque de rage", es: "Orígenes de alto riesgo de rabia", pt: "Origens de alto risco de raiva" }
    body:
      en: "From a high-risk rabies country, add a rabies antibody test (positive result ≥0.5 IU/ml from a WOAH/OIE-approved laboratory) and expect a possible period of isolation or quarantine on arrival. All the core requirements above still apply, and the exact tests are set on your import permit."
      fr: "Depuis un pays à haut risque de rage, ajoute un test des anticorps antirabiques (résultat positif ≥0,5 UI/ml d'un laboratoire agréé WOAH/OIE) et prévois un possible isolement ou quarantaine à l'arrivée. Toutes les exigences de base ci-dessus restent applicables, et les tests exacts figurent sur ton permis."
      es: "Desde un país de alto riesgo de rabia, añade una prueba de titulación de rabia (resultado positivo ≥0,5 UI/ml de un laboratorio autorizado por la WOAH/OIE) y prevé un posible periodo de aislamiento o cuarentena a la llegada. Siguen aplicándose todos los requisitos básicos anteriores, y las pruebas exactas se fijan en tu permiso de importación."
      pt: "Vindo de um país de alto risco de raiva, acrescente um teste sorológico antirrábico (titulação) com resultado positivo ≥0,5 UI/ml de um laboratório aprovado pela WOAH/OIE e conte com um possível período de isolamento ou quarentena na chegada. Todas as exigências básicas acima continuam valendo, e os testes exatos são definidos na sua autorização de importação."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches South Africa depends on your permit and the country you flew from."
    fr: "Ce qui se passe à l'arrivée en Afrique du Sud dépend de ton permis et de ton pays de départ."
    es: "Lo que ocurre cuando tu perro llega a Sudáfrica depende de tu permiso y del país desde el que hayas volado."
    pt: "O que acontece quando o seu cachorro chega à África do Sul depende da sua autorização e do país de onde você voou."
  points:
    - en: "Present the original import permit, original endorsed health certificate and rabies vaccination certificate to the veterinary import control officer at the port of entry (e.g. Johannesburg, Cape Town, Durban)."
      fr: "Présente l'original du permis, l'original du certificat sanitaire visé et le certificat de vaccination antirabique à l'agent de contrôle vétérinaire au point d'entrée (Johannesburg, Le Cap, Durban…)."
      es: "Presenta el permiso de importación original, el certificado sanitario refrendado original y el certificado de vacunación antirrábica al agente de control veterinario de importación en el punto de entrada (p. ej. Johannesburgo, Ciudad del Cabo, Durban)."
      pt: "Apresente o original da autorização de importação, o original do atestado de saúde endossado e o certificado de vacinação antirrábica ao agente de controle veterinário de importação no ponto de entrada (p. ex. Joanesburgo, Cidade do Cabo, Durban)."
    - en: "Documents must be in English, complete and legible; the health certificate must have been issued within 10 days of departure."
      fr: "Les documents doivent être en anglais, complets et lisibles ; le certificat sanitaire doit avoir été établi dans les 10 jours avant le départ."
      es: "Los documentos deben estar en inglés, completos y legibles; el certificado sanitario debe haberse emitido dentro de los 10 días previos a la salida."
      pt: "Os documentos precisam estar em inglês, completos e legíveis; o atestado de saúde precisa ter sido emitido dentro dos 10 dias anteriores à partida."
    - en: "Dogs from high-risk origins may be moved to an approved isolation/quarantine facility arranged with the state veterinarian; an indemnity declaration is required in that case."
      fr: "Les chiens d'origines à risque peuvent être placés en établissement d'isolement/quarantaine agréé avec le vétérinaire d'État ; une déclaration d'indemnité est alors requise."
      es: "Los perros de orígenes de alto riesgo pueden trasladarse a un establecimiento de aislamiento/cuarentena autorizado, coordinado con el veterinario del Estado; en ese caso se exige una declaración de indemnidad."
      pt: "Cachorros de origens de alto risco podem ser levados a um estabelecimento autorizado de isolamento/quarentena, combinado com o veterinário do Estado; nesse caso, é exigida uma declaração de indenidade."
    - en: "If the disease tests do not comply with the health certificate, the dog may be returned to the country of export or, in the worst case, euthanised."
      fr: "Si les tests de maladies ne sont pas conformes au certificat sanitaire, le chien peut être renvoyé au pays d'export ou, au pire, euthanasié."
      es: "Si las pruebas de enfermedades no concuerdan con el certificado sanitario, el perro puede ser devuelto al país de exportación o, en el peor de los casos, sacrificado."
      pt: "Se os testes de doenças não estiverem de acordo com o atestado de saúde, o cachorro pode ser devolvido ao país de exportação ou, na pior das hipóteses, sacrificado."
    - en: "Carry original documents (not copies) and keep a set with you throughout the journey."
      fr: "Munis-toi des documents originaux (pas de copies) et garde-en un jeu sur toi durant tout le trajet."
      es: "Lleva los documentos originales (no copias) y guarda un juego contigo durante todo el trayecto."
      pt: "Leve os documentos originais (não cópias) e mantenha um jogo com você durante todo o trajeto."

travellerExperience: null

restrictedDogs:
  intro:
    en: "South Africa has no national breed-specific legislation banning the import of particular dog breeds. Entry is controlled by the veterinary import permit and health requirements, not by breed."
    fr: "L'Afrique du Sud n'a pas de législation nationale par race interdisant l'importation de races de chiens particulières. L'entrée est encadrée par le permis d'importation vétérinaire et les exigences sanitaires, non par la race."
    es: "Sudáfrica no tiene una legislación nacional por raza que prohíba la importación de razas de perros concretas. La entrada se controla mediante el permiso de importación veterinario y los requisitos sanitarios, no por la raza."
    pt: "A África do Sul não tem legislação nacional por raça que proíba a importação de raças específicas de cachorro. A entrada é controlada pela autorização de importação veterinária e pelas exigências sanitárias, não pela raça."
  cat1:
    en: "There is no national list of prohibited breeds and no national import ban on breeds such as pit bull types. A national debate and petitions on pit bulls have taken place, but no national ban has been enacted."
    fr: "Il n'existe pas de liste nationale de races interdites ni d'interdiction nationale d'importation visant des races comme les types pit-bull. Un débat national et des pétitions sur les pit-bulls ont eu lieu, mais aucune interdiction nationale n'a été adoptée."
    es: "No existe una lista nacional de razas prohibidas ni una prohibición nacional de importación de razas como los tipos pit bull. Ha habido un debate nacional y peticiones sobre los pit bull, pero no se ha promulgado ninguna prohibición nacional."
    pt: "Não existe lista nacional de raças proibidas nem proibição nacional de importação de raças como os tipos pit bull. Houve debate nacional e petições sobre os pit bulls, mas nenhuma proibição nacional foi aprovada."
  cat2:
    en: "Some municipalities apply local by-laws (permits, leashing or muzzling in public) to certain dogs. These are local ownership rules, not import bans — check the rules of your destination municipality."
    fr: "Certaines municipalités appliquent des règlements locaux (permis, laisse ou muselière en public) à certains chiens. Ce sont des règles locales de détention, pas des interdictions d'importation — vérifie les règles de ton municipalité de destination."
    es: "Algunos municipios aplican reglamentos locales (permisos, correa o bozal en público) a ciertos perros. Son normas locales de tenencia, no prohibiciones de importación — consulta las normas de tu municipio de destino."
    pt: "Alguns municípios aplicam regulamentos locais (licenças, uso de guia ou de focinheira em público) a determinados cachorros. São regras locais de posse, não proibições de importação — consulte as regras do município de destino."
  note:
    en: "Because local rules vary, confirm any municipal requirement for your specific breed at your destination before you travel."
    fr: "Les règles locales variant, confirme toute exigence municipale pour ta race précise à destination avant de voyager."
    es: "Como las normas locales varían, confirma cualquier requisito municipal para tu raza concreta en tu destino antes de viajar."
    pt: "Como as regras locais variam, confirme antes de viajar qualquer exigência municipal para a sua raça específica no destino."

checklist:
  - en: "Apply for the DALRRD veterinary import permit well before travel"
    fr: "Demande le permis d'importation vétérinaire DALRRD bien avant le voyage"
    es: "Solicita el permiso de importación veterinario del DALRRD bastante antes del viaje"
    pt: "Peça a autorização de importação veterinária do DALRRD bem antes da viagem"
  - en: "Microchip (ISO 11784/11785) implanted before the rabies vaccination"
    fr: "Puce (ISO 11784/11785) posée avant la vaccination antirabique"
    es: "Microchip (ISO 11784/11785) implantado antes de la vacunación antirrábica"
    pt: "Microchip (ISO 11784/11785) implantado antes da vacinação antirrábica"
  - en: "Valid rabies vaccination (primary 30 days to 12 months before import)"
    fr: "Vaccination antirabique valide (primo de 30 jours à 12 mois avant l'import)"
    es: "Vacunación antirrábica válida (primovacunación de 30 días a 12 meses antes de la importación)"
    pt: "Vacinação antirrábica válida (dose primária de 30 dias a 12 meses antes da importação)"
  - en: "Rabies antibody test if coming from a high-risk rabies country"
    fr: "Test des anticorps antirabiques si origine à haut risque de rage"
    es: "Prueba de titulación de rabia si procedes de un país de alto riesgo de rabia"
    pt: "Teste sorológico antirrábico (titulação) se você vier de um país de alto risco de raiva"
  - en: "Dog disease tests (Brucella, Trypanosoma, Babesia, Dirofilaria, Leishmania) within 30 days"
