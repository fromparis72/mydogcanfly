# Country Entry Guide — South Africa (trilingual EN/FR/ES).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_za
iso2: "ZA"
name: { en: "South Africa", fr: "Afrique du Sud", es: "Sudáfrica", pt: "África do Sul" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
domestic:
  intro:
    en: "Domestic flight in South Africa: no permit or health certificate is required by the State, but rabies vaccination is compulsory for every dog."
    fr: "Vol intérieur en Afrique du Sud : aucun permis ni certificat sanitaire n'est exigé par l'État, mais la vaccination antirabique est obligatoire pour tout chien."
    es: "Vuelo nacional en Sudáfrica: el Estado no exige permiso ni certificado sanitario, pero la vacuna antirrábica es obligatoria para todo perro."
    pt: "Voo doméstico na África do Sul: o Estado não exige autorização nem atestado de saúde, mas a vacinação antirrábica é obrigatória para todo cachorro."
  points:
    - en: "Rabies vaccination is compulsory for all dogs and cats: at 3 months, a second dose within 12 months, then every 3 years. This is a standing duty on the owner, not a travel rule."
      fr: "La vaccination antirabique est obligatoire pour tous les chiens et chats : à 3 mois, une seconde dose dans les 12 mois, puis tous les 3 ans. C'est une obligation permanente du détenteur, pas une règle de voyage."
      es: "La vacuna antirrábica es obligatoria para todos los perros y gatos: a los 3 meses, una segunda dosis en 12 meses, y luego cada 3 años. Es un deber permanente del propietario, no una regla de viaje."
      pt: "A vacinação antirrábica é obrigatória para todos os cachorros e gatos: aos 3 meses, uma segunda dose em até 12 meses e depois a cada 3 anos. É um dever permanente de quem tem o animal, não uma regra de viagem."
    - en: "No microchip and no movement permit are required for an ordinary healthy dog. In practice airlines turn the vaccination duty into a document you must produce at check-in."
      fr: "Ni puce ni permis de mouvement ne sont exigés pour un chien sain ordinaire. En pratique, les compagnies transforment cette obligation vaccinale en document à présenter à l'enregistrement."
      es: "No se exige microchip ni permiso de movimiento para un perro sano corriente. En la práctica, las aerolíneas convierten ese deber de vacunación en un documento que hay que presentar en el mostrador."
      pt: "Não são exigidos microchip nem autorização de trânsito para um cachorro saudável comum. Na prática, as companhias aéreas transformam esse dever de vacinação em um documento que você precisa apresentar no check-in."
    - en: "Around an active rabies outbreak a local restriction can be imposed at short notice — check with the state veterinarian if in doubt."
      fr: "Autour d'un foyer de rage actif, une restriction locale peut être imposée à bref délai — renseigne-toi auprès du vétérinaire d'État en cas de doute."
      es: "Alrededor de un brote activo de rabia puede imponerse una restricción local con poca antelación — consulta al veterinario estatal en caso de duda."
      pt: "No entorno de um foco ativo de raiva, uma restrição local pode ser imposta de uma hora para outra — em caso de dúvida, consulte o veterinário do Estado."
exit:
  authority: DALRRD
  authorityUrl: https://www.dalrrd.gov.za
  intro:
    en: "South Africa is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export permit and a State Veterinarian's endorsement."
    fr: "L'Afrique du Sud est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un permis d'export et l'endossement d'un vétérinaire d'État."
    es: "Sudáfrica no está listada: una titulación antirrábica válida es obligatoria para volver a la UE — más un permiso de exportación y el refrendo de un veterinario estatal."
    pt: "A África do Sul é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de uma autorização de exportação e do endosso de um veterinário do Estado."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: eu
      text:
        en: "Apply to DALRRD for the export permit; a State Veterinarian endorses the health certificate confirming the dog is fit to travel and meets the EU conditions."
        fr: "Demande à la DALRRD le permis d'export ; un vétérinaire d'État endosse le certificat sanitaire attestant que le chien est apte au voyage et conforme aux conditions UE."
        es: "Solicita a DALRRD el permiso de exportación; un veterinario estatal refrenda el certificado sanitario confirmando que el perro está apto para viajar y cumple las condiciones de la UE."
        pt: "Peça ao DALRRD a autorização de exportação; um veterinário do Estado endossa o atestado de saúde confirmando que o cachorro está apto a viajar e atende às condições da UE."
    - timing: window
      scope: non_eu
      text:
        en: "Apply to DALRRD for the export permit; a State Veterinarian endorses the health certificate confirming the dog is fit to travel."
        fr: "Demande le permis d'export au DALRRD ; un vétérinaire d'État vise le certificat sanitaire attestant que le chien est apte au voyage."
        es: "Solicita el permiso de exportación al DALRRD; un veterinario estatal valida el certificado sanitario que confirma que el perro está apto para viajar."
        pt: "Solicite a licença de exportação ao DALRRD; um veterinário estadual endossa o certificado sanitário confirmando que o cachorro está apto a viajar."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to South Africa with your dog", fr: "Voyager en Afrique du Sud avec ton chien", es: "Viajar a Sudáfrica con tu perro", pt: "Viajar para a África do Sul com seu cachorro" }
  intro:
    en: >-
      South Africa welcomes dogs, but entry is controlled: no dog may arrive without a veterinary
      import permit issued in advance by the Department of Agriculture, Land Reform and Rural
      Development (DALRRD). Every dog needs an ISO microchip and a valid rabies vaccination, and
      dogs must be tested and certified free of several diseases (such as Brucella canis,
      Trypanosoma evansi, Babesia gibsoni, Dirofilaria immitis and Leishmania) shortly before
      travel. A state-endorsed veterinary health certificate from the exporting country is required.
      What you must prepare — including a rabies antibody test or a period of quarantine — depends
      heavily on the rabies status of the country your dog is travelling from. This guide explains
      each step so you know exactly what to prepare before you book your flight.
    fr: >-
      L'Afrique du Sud accueille les chiens, mais l'entrée est contrôlée : aucun chien ne peut
      arriver sans un permis d'importation vétérinaire délivré à l'avance par le Department of
      Agriculture, Land Reform and Rural Development (DALRRD). Chaque chien doit porter une puce ISO
      et une vaccination antirabique valide, et les chiens doivent être testés et certifiés indemnes
      de plusieurs maladies (comme Brucella canis, Trypanosoma evansi, Babesia gibsoni, Dirofilaria
      immitis et Leishmania) peu avant le voyage. Un certificat sanitaire vétérinaire visé par
      l'autorité du pays d'export est exigé. Ce qu'il faut préparer — dont un test des anticorps
      antirabiques ou une période de quarantaine — dépend fortement du statut rabique du pays d'où
      voyage ton chien. Ce guide détaille chaque étape pour savoir quoi préparer avant de réserver.
    es: >-
      Sudáfrica acoge a los perros, pero la entrada está controlada: ningún perro puede llegar sin un
      permiso de importación veterinario expedido con antelación por el Department of Agriculture, Land
      Reform and Rural Development (DALRRD). Cada perro necesita un microchip ISO y una vacunación
      antirrábica válida, y los perros deben someterse a pruebas y estar certificados como libres de
      varias enfermedades (como Brucella canis, Trypanosoma evansi, Babesia gibsoni, Dirofilaria
      immitis y Leishmania) poco antes del viaje. Se exige un certificado sanitario veterinario
      refrendado por el Estado del país exportador. Lo que debes preparar — incluida una prueba de
      titulación de rabia o un periodo de cuarentena — depende en gran medida del estatus de rabia del
      país desde el que viaja tu perro. Esta guía explica cada paso para que sepas exactamente qué
      preparar antes de reservar tu vuelo.

    pt: "A África do Sul recebe bem os cachorros, mas a entrada é controlada: nenhum cachorro pode chegar sem uma autorização de importação veterinária emitida com antecedência pelo Department of Agriculture, Land Reform and Rural Development (DALRRD). Todo cachorro precisa de um microchip ISO e de uma vacinação antirrábica válida, e os cachorros precisam ser testados e certificados como livres de várias doenças (como Brucella canis, Trypanosoma evansi, Babesia gibsoni, Dirofilaria immitis e Leishmania) pouco antes da viagem. Também é exigido um atestado de saúde veterinário do país exportador com aval do Estado. O que você precisa preparar — incluindo um teste sorológico antirrábico (titulação) ou um período de quarentena — depende muito do estatuto de raiva do país de onde o seu cachorro viaja. Este guia explica cada etapa para você saber exatamente o que preparar antes de reservar o voo."
difficulty:
  level: difficult
  label: { en: "Moderate to difficult (permit + disease tests)", fr: "Modéré à difficile (permis + tests de maladies)", es: "De moderado a difícil (permiso + pruebas de enfermedades)", pt: "De moderado a difícil (autorização + testes de doenças)" }

prepTime:
  eu:
    en: "Rabies-free origins: allow ~4–6 weeks for the import permit, disease tests (within 30 days) and endorsed certificate."
    fr: "Origines indemnes de rage : prévoir ~4 à 6 semaines pour le permis, les tests de maladies (sous 30 jours) et le certificat visé."
    es: "Orígenes libres de rabia: prevé ~4 a 6 semanas para el permiso de importación, las pruebas de enfermedades (dentro de los 30 días) y el certificado refrendado."
    pt: "Origens livres de raiva: conte com ~4 a 6 semanas para a autorização de importação, os testes de doenças (dentro de 30 dias) e o certificado endossado."
  listed:
    en: "Rabies-controlled origins (EU, US, UK, Canada…): ~4–8 weeks, driven by the import permit and the disease tests."
    fr: "Origines à rage contrôlée (UE, USA, RU, Canada…) : ~4 à 8 semaines, selon le permis et les tests de maladies."
    es: "Orígenes con rabia controlada (UE, EE. UU., RU, Canadá…): ~4 a 8 semanas, según el permiso de importación y las pruebas de enfermedades."
    pt: "Origens com raiva controlada (UE, EUA, Reino Unido, Canadá…): ~4 a 8 semanas, conforme a autorização de importação e os testes de doenças."
  nonListed:
    en: "High-risk rabies origins: ~2–4 months — add a rabies antibody test and a possible quarantine period on arrival."
    fr: "Origines à haut risque de rage : ~2 à 4 mois — ajoute un test des anticorps antirabiques et une éventuelle quarantaine à l'arrivée."
    es: "Orígenes de alto riesgo de rabia: ~2 a 4 meses — añade una prueba de titulación de rabia y un posible periodo de cuarentena a la llegada."
    pt: "Origens de alto risco de raiva: ~2 a 4 meses — acrescente um teste sorológico antirrábico (titulação) e um possível período de quarentena na chegada."

