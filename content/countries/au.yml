# Country Entry Guide — Australia (source of truth, bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_au
iso2: "AU"
name: { en: "Australia", fr: "Australie", es: "Australia", pt: "Austrália" }
region: { en: "Oceania", fr: "Océanie", es: "Oceanía", pt: "Oceania" }


regime: island_strict
domestic:
  intro:
    en: "Domestic flight in Australia: nothing is required between mainland states — but Tasmania and the external territories are real biosecurity borders."
    fr: "Vol intérieur en Australie : rien n'est exigé entre États du continent — mais la Tasmanie et les territoires extérieurs constituent de véritables frontières de biosécurité."
    es: "Vuelo nacional en Australia: nada se exige entre estados continentales — pero Tasmania y los territorios exteriores son verdaderas fronteras de bioseguridad."
    pt: "Voo doméstico na Austrália: nada é exigido entre os estados do continente — mas a Tasmânia e os territórios externos são fronteiras de biossegurança de verdade."
  points:
    - en: "Australia is rabies-free, so no rabies vaccination applies. Microchipping is required to register a dog in most states, but it is never a boarding condition."
      fr: "L'Australie est indemne de rage, aucune vaccination antirabique ne s'applique donc. La puce est exigée pour enregistrer un chien dans la plupart des États, mais n'est jamais une condition d'embarquement."
      es: "Australia está libre de rabia, así que no aplica vacuna antirrábica. El microchip es obligatorio para registrar al perro en la mayoría de estados, pero nunca es condición de embarque."
      pt: "A Austrália é livre de raiva, então não há vacinação antirrábica a cumprir. O microchip é obrigatório para registrar um cachorro na maioria dos estados, mas nunca é condição de embarque."
    - en: "Western Australia runs biosecurity checkpoints but imposes no dog-specific entry condition. Restricted breeds are controlled by the destination council, not at the airport."
      fr: "L'Australie-Occidentale tient des postes de biosécurité mais n'impose aucune condition d'entrée propre aux chiens. Les races réglementées sont contrôlées par la commune de destination, pas à l'aéroport."
      es: "Australia Occidental tiene puestos de bioseguridad pero no impone condición de entrada específica para perros. Las razas restringidas las controla el municipio de destino, no el aeropuerto."
      pt: "A Austrália Ocidental mantém postos de controle de biossegurança, mas não impõe nenhuma condição de entrada específica para cachorros. As raças restritas são controladas pelo município de destino, não no aeroporto."
    - en: "Carrier rules matter more than law here: one major airline refuses pets entirely, another is the only one allowing cabin travel, and heat and cold limits apply to hold carriage."
      fr: "Les règles des compagnies comptent ici plus que la loi : une grande compagnie refuse totalement les animaux, une autre est la seule à autoriser la cabine, et des limites de chaleur et de froid s'appliquent à la soute."
      es: "Aquí las reglas de las aerolíneas pesan más que la ley: una gran aerolínea rechaza las mascotas por completo, otra es la única que permite cabina, y hay límites de calor y frío para la bodega."
      pt: "Aqui as regras das companhias aéreas pesam mais que a lei: uma grande companhia aérea recusa animais de estimação por completo, outra é a única que permite viagem na cabine, e há limites de calor e de frio para o transporte no porão."
  territories:
    - name: { en: "Tasmania", fr: "Tasmanie", es: "Tasmania", pt: "Tasmânia" }
      note:
        en: "The one genuine interstate requirement: praziquantel treatment at 5 mg/kg within 14 days before entry, against hydatid disease, plus a tick-freedom declaration. Proof can be a vet statement, a statutory declaration or the pill packet. Without it the tablet is given at the port, at your cost."
        fr: "La seule véritable exigence entre États : un traitement au praziquantel à 5 mg/kg dans les 14 jours précédant l'entrée, contre l'échinococcose, plus une déclaration d'absence de tiques. La preuve peut être une attestation vétérinaire, une déclaration sur l'honneur ou la boîte du médicament. À défaut, le comprimé est administré au port, à tes frais."
        es: "El único requisito real entre estados: tratamiento con prazicuantel a 5 mg/kg en los 14 días previos a la entrada, contra la hidatidosis, más una declaración de ausencia de garrapatas. La prueba puede ser un certificado veterinario, una declaración jurada o el envase del medicamento. Si no, la pastilla se administra en el puerto, a tu costa."
        pt: "A única exigência interestadual de verdade: tratamento com praziquantel a 5 mg/kg nos 14 dias anteriores à entrada, contra a hidatidose, mais uma declaração de ausência de carrapatos. A prova pode ser uma declaração do veterinário, uma declaração juramentada (statutory declaration) ou a própria cartela do comprimido. Sem isso, o comprimido é administrado no porto, às suas custas."
      url: https://nre.tas.gov.au/biosecurity-tasmania/biosecurity/importing-animals/dogs
    - name: { en: "Christmas Island", fr: "Île Christmas", es: "Isla de Navidad", pt: "Ilha Christmas" }
      note:
        en: "Dogs and cats are banned outright from Christmas Island. Only an assistance animal may be approved, on written application to the Administrator."
        fr: "Les chiens et chats sont purement interdits sur l'île Christmas. Seul un animal d'assistance peut être autorisé, sur demande écrite à l'Administrateur."
        es: "Los perros y gatos están totalmente prohibidos en la Isla de Navidad. Solo puede autorizarse un animal de asistencia, mediante solicitud escrita al Administrador."
        pt: "Cachorros e gatos são totalmente proibidos na Ilha Christmas. Só um animal de assistência pode ser autorizado, mediante pedido por escrito ao Administrator (administrador do território)."
      url: https://www.infrastructure.gov.au/territories-regions-cities/territories/indian-ocean-territories/christmas-island/travel-information
    - name: { en: "Norfolk Island", fr: "Île Norfolk", es: "Isla Norfolk", pt: "Ilha Norfolk" }
      note:
        en: "A full international-style protocol applies from the mainland: microchip, core vaccinations at least 14 days before, continuous parasite cover, a negative Ehrlichia canis test within 45 days, negative heartworm and leptospirosis tests, and a vet health certificate within 5 days. The return leg is unrestricted."
        fr: "Un protocole de type international s'applique depuis le continent : puce, vaccins de base au moins 14 jours avant, couverture antiparasitaire continue, test Ehrlichia canis négatif dans les 45 jours, tests dirofilariose et leptospirose négatifs, et certificat vétérinaire de moins de 5 jours. Le retour, lui, est libre."
        es: "Se aplica un protocolo de tipo internacional desde el continente: microchip, vacunas básicas al menos 14 días antes, cobertura antiparasitaria continua, test de Ehrlichia canis negativo en 45 días, pruebas negativas de dirofilariosis y leptospirosis, y certificado veterinario de menos de 5 días. La vuelta es libre."
        pt: "Vindo do continente, aplica-se um protocolo completo, nos moldes internacionais: microchip, vacinas essenciais pelo menos 14 dias antes, proteção antiparasitária contínua, teste negativo para Ehrlichia canis nos 45 dias anteriores, testes negativos para dirofilariose e leptospirose e um atestado de saúde veterinário emitido nos 5 dias anteriores. O trajeto de volta não tem restrições."
      url: https://www.agriculture.gov.au/biosecurity-trade/cats-dogs/norfolk-island-from-mainland-australia
exit:
  authority: DAFF (Australie)
  authorityUrl: https://micor.agriculture.gov.au/live-animals/Pages/european_union/dogs.aspx
  intro:
    en: "Leaving Australia with your dog, the export health certificate must be endorsed by the Department of Agriculture (DAFF) through an accredited veterinarian."
    fr: "Pour sortir d'Australie avec ton chien, le certificat sanitaire d'export doit être endossé par le Department of Agriculture (DAFF) via un vétérinaire accrédité."
    es: "Para salir de Australia con tu perro, el certificado sanitario de exportación debe ser validado por el Department of Agriculture (DAFF) a través de un veterinario acreditado."
    pt: "Na saída da Austrália com seu cachorro, o atestado de saúde de exportação precisa ser endossado pelo Department of Agriculture (DAFF) por meio de um veterinário credenciado."
  steps:
    - timing: window
      scope: eu
      text:
        en: "An accredited vet prepares the EU health certificate; DAFF officers endorse it before departure."
        fr: "Un vétérinaire accrédité prépare le certificat sanitaire UE ; les agents du DAFF l'endossent avant le départ."
        es: "Un veterinario acreditado prepara el certificado sanitario de la UE; los agentes del DAFF lo validan antes de la salida."
        pt: "Um veterinário credenciado prepara o atestado de saúde da UE; os agentes do DAFF o endossam antes da partida."
    - timing: window
      scope: non_eu
      text:
        en: "An accredited vet prepares the health certificate required by the destination; DAFF officers endorse it before departure."
        fr: "Un vétérinaire accrédité prépare le certificat sanitaire exigé par la destination ; les agents du DAFF le visent avant le départ."
        es: "Un veterinario acreditado prepara el certificado sanitario que exige el destino; los agentes del DAFF lo validan antes de la salida."
        pt: "Um veterinário credenciado prepara o certificado sanitário exigido pelo destino; os agentes do DAFF o endossam antes da partida."
  onSiteNote:
    en: "Start well ahead — endorsement and supporting documents take time."
    fr: "Lance la démarche bien à l'avance — l'endossement et les documents justificatifs prennent du temps."
    es: "Inicia el trámite con mucha antelación — la validación y los documentos justificativos llevan tiempo."
    pt: "Comece bem antes — o endosso e os documentos comprobatórios levam tempo."

hero:
  h1: { en: "Traveling to Australia with your dog", fr: "Voyager en Australie avec ton chien", es: "Viajar a Australia con tu perro", pt: "Viajar para a Austrália com seu cachorro" }
  intro:
    en: >-
      Australia has one of the strictest dog-import schemes in the world, run by the Department of
      Agriculture, Fisheries and Forestry (DAFF) to keep the country rabies-free. Your dog can only be
      imported directly from an approved country, must hold a biosecurity import permit obtained in
      advance, and must complete a mandatory stay at the Mickleham post-entry quarantine facility near
      Melbourne. What you prepare depends heavily on where your dog is coming from: approved countries
      are grouped by rabies risk (Group 1, 2 and 3), and a dog from a non-approved country must first
      live in an approved country before it can qualify. Plan on at least six months of veterinary
      preparation. This guide explains each step so you know exactly what to prepare before you book.
    fr: >-
      L'Australie applique l'un des régimes d'importation de chiens les plus stricts au monde, géré par
      le Department of Agriculture, Fisheries and Forestry (DAFF) pour rester indemne de rage. Ton
      chien ne peut être importé que directement depuis un pays approuvé, doit disposer d'un permis
      d'importation biosécurité obtenu à l'avance, et doit effectuer un séjour obligatoire au centre de
      quarantaine post-entrée de Mickleham, près de Melbourne. Ce qu'il faut préparer dépend fortement
      du pays de provenance : les pays approuvés sont classés par risque rabique (groupes 1, 2 et 3), et
      un chien venant d'un pays non approuvé doit d'abord résider dans un pays approuvé pour devenir
      éligible. Compte au moins six mois de préparation vétérinaire. Ce guide détaille chaque étape.
    es: >-
      Australia aplica uno de los regímenes de importación de perros más estrictos del mundo, gestionado
      por el Department of Agriculture, Fisheries and Forestry (DAFF) para mantener al país libre de
      rabia. Tu perro solo puede importarse directamente desde un país aprobado, debe disponer de un
      permiso de importación de bioseguridad obtenido con antelación y debe cumplir una estancia
      obligatoria en el centro de cuarentena posterior a la entrada de Mickleham, cerca de Melbourne. Lo
      que debes preparar depende en gran medida del lugar del que venga tu perro: los países aprobados se
      clasifican por riesgo de rabia (grupos 1, 2 y 3), y un perro de un país no aprobado debe residir
      primero en un país aprobado para poder ser elegible. Cuenta con al menos seis meses de preparación
      veterinaria. Esta guía explica cada paso para que sepas exactamente qué preparar antes de reservar.

    pt: "A Austrália tem um dos regimes de importação de cachorros mais rigorosos do mundo, conduzido pelo Department of Agriculture, Fisheries and Forestry (DAFF) para manter o país livre de raiva. Seu cachorro só pode ser importado diretamente de um país aprovado, precisa ter uma autorização de importação de biossegurança obtida com antecedência e cumprir uma estadia obrigatória na unidade de quarentena pós-entrada de Mickleham, perto de Melbourne. O que você precisa preparar depende muito de onde seu cachorro está vindo: os países aprovados são divididos por risco de raiva (grupos 1, 2 e 3), e um cachorro que vem de um país não aprovado precisa antes morar em um país aprovado para poder se qualificar. Conte com pelo menos seis meses de preparação veterinária. Este guia explica cada etapa para você saber exatamente o que preparar antes de comprar a passagem."
difficulty:
  level: difficult
  label: { en: "Difficult — permit, tests and quarantine required", fr: "Difficile — permis, tests et quarantaine exigés", es: "Difícil — se exigen permiso, pruebas y cuarentena", pt: "Difícil — exige autorização, exames e quarentena" }

prepTime:
  eu:
    en: "Group 1 (e.g. New Zealand): the simplest path, but still weeks of preparation and certification before export."
    fr: "Groupe 1 (ex. Nouvelle-Zélande) : le parcours le plus simple, mais plusieurs semaines de préparation et de certification restent nécessaires."
    es: "Grupo 1 (p. ej. Nueva Zelanda): el camino más sencillo, pero aun así requiere semanas de preparación y certificación antes de la exportación."
    pt: "Grupo 1 (por exemplo, Nova Zelândia): o caminho mais simples, mas ainda assim semanas de preparação e certificação antes da exportação."
  listed:
    en: "Group 2 (rabies-free approved countries): allow ~6 months — import permit, tests, treatments, then quarantine in Australia."
    fr: "Groupe 2 (pays approuvés indemnes de rage) : compte ~6 mois — permis d'importation, tests, traitements, puis quarantaine en Australie."
    es: "Grupo 2 (países aprobados libres de rabia): cuenta con ~6 meses — permiso de importación, pruebas, tratamientos y luego cuarentena en Australia."
    pt: "Grupo 2 (países aprovados livres de raiva): reserve ~6 meses — autorização de importação, exames, tratamentos e depois quarentena na Austrália."
  nonListed:
    en: "Group 3 (rabies-present approved countries) or non-approved origin: 6+ months — rabies test with a 180-day wait, permit, tests, then quarantine."
    fr: "Groupe 3 (pays approuvés où la rage est présente) ou pays non approuvé : 6 mois et plus — titrage avec 180 jours d'attente, permis, tests, puis quarantaine."
    es: "Grupo 3 (países aprobados con presencia de rabia) u origen no aprobado: más de 6 meses — prueba de titulación de rabia con una espera de 180 días, permiso, pruebas y luego cuarentena."
    pt: "Grupo 3 (países aprovados onde há raiva) ou origem não aprovada: mais de 6 meses — teste sorológico antirrábico com espera de 180 dias, autorização, exames e depois quarentena."

