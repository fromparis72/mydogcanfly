restrictedDogs:
  intro:
    en: "Australia bans the import of certain dog breeds under customs and environment law (separate from the biosecurity rules). These prohibitions apply on top of the import scheme, and a mixed-breed dog may be investigated on arrival if it appears to be a prohibited breed."
    fr: "L'Australie interdit l'importation de certaines races de chiens au titre du droit douanier et environnemental (distinct des règles de biosécurité). Ces interdictions s'ajoutent au régime d'importation, et un chien croisé peut faire l'objet d'une enquête à l'arrivée s'il semble être une race interdite."
    es: "Australia prohíbe la importación de ciertas razas de perros en virtud del derecho aduanero y medioambiental (independiente de las normas de bioseguridad). Estas prohibiciones se suman al régimen de importación, y un perro mestizo puede ser investigado a la llegada si parece ser una raza prohibida."
    pt: "A Austrália proíbe a importação de certas raças de cachorro pela legislação aduaneira e ambiental (separada das regras de biossegurança). Essas proibições valem além do regime de importação, e um cachorro sem raça definida pode ser investigado na chegada se parecer ser de uma raça proibida."
  cat1:
    en: "Pure-breed dogs banned from import: dogo Argentino, fila Brasileiro, Japanese tosa, American pit bull terrier (or pit bull terrier), and Perro de Presa Canario (Presa Canario). These are prohibited under customs law — contact the Department of Home Affairs (+61 2 6264 1111) for details."
    fr: "Races pures interdites d'importation : dogo Argentino, fila Brasileiro, tosa japonais, American pit bull terrier (ou pit bull terrier) et Perro de Presa Canario (Presa Canario). Interdites au titre du droit douanier — contacte le Department of Home Affairs (+61 2 6264 1111) pour les détails."
    es: "Perros de raza pura prohibidos para la importación: dogo Argentino, fila Brasileiro, tosa japonés, American pit bull terrier (o pit bull terrier) y Perro de Presa Canario (Presa Canario). Están prohibidos en virtud del derecho aduanero — contacta con el Department of Home Affairs (+61 2 6264 1111) para más detalles."
    pt: "Raças puras proibidas de importação: dogo argentino, fila brasileiro, tosa japonês, american pit bull terrier (ou pit bull terrier) e perro de presa canario (presa canario). São proibidas pela legislação aduaneira — entre em contato com o Department of Home Affairs (+61 2 6264 1111) para mais detalhes."
  cat2:
    en: "Banned hybrid (wolf-cross) dogs: Czechoslovakian wolfdog (Vlcak), Saarloos wolfdog (wolfhound), Lupo Italiano (Italian wolfdog) and Kunming wolfdog. These fall under environment law — contact the Department of Climate Change, Energy, the Environment and Water (Exotic.Species@dcceew.gov.au)."
    fr: "Chiens hybrides (croisés loup) interdits : chien-loup tchécoslovaque (Vlcak), chien-loup de Saarloos, Lupo Italiano (chien-loup italien) et chien-loup de Kunming. Relèvent du droit environnemental — contacte le Department of Climate Change, Energy, the Environment and Water (Exotic.Species@dcceew.gov.au)."
    es: "Perros híbridos (cruces de lobo) prohibidos: perro lobo checoslovaco (Vlcak), perro lobo de Saarloos, Lupo Italiano (perro lobo italiano) y perro lobo de Kunming. Están sujetos al derecho medioambiental — contacta con el Department of Climate Change, Energy, the Environment and Water (Exotic.Species@dcceew.gov.au)."
    pt: "Raças híbridas (cruzadas com lobo) proibidas: cão-lobo-da-checoslováquia (Vlcak), cão-lobo-de-saarloos (wolfhound), lupo italiano (cão-lobo italiano) e cão-lobo de Kunming. Essas entram na legislação ambiental — entre em contato com o Department of Climate Change, Energy, the Environment and Water (Exotic.Species@dcceew.gov.au)."
  note:
    en: "Mixed-breed dogs are allowed if they meet all other import conditions. If an imported dog is later identified as possibly a prohibited breed, the Department of Home Affairs may investigate further."
    fr: "Les chiens croisés sont admis s'ils remplissent toutes les autres conditions d'importation. Si un chien importé est ensuite identifié comme possible race interdite, le Department of Home Affairs peut mener une enquête."
    es: "Los perros mestizos se admiten si cumplen todas las demás condiciones de importación. Si un perro importado se identifica posteriormente como posible raza prohibida, el Department of Home Affairs puede investigar más a fondo."
    pt: "Cachorros sem raça definida são permitidos se cumprirem todas as demais condições de importação. Se depois se identificar que um cachorro importado pode ser de uma raça proibida, o Department of Home Affairs pode aprofundar a investigação."

checklist:
  - en: "Confirm your dog's origin is an approved country and identify its group (1, 2 or 3)"
    fr: "Vérifie que l'origine de ton chien est un pays approuvé et identifiez son groupe (1, 2 ou 3)"
    es: "Confirma que el origen de tu perro es un país aprobado e identifica su grupo (1, 2 o 3)"
    pt: "Confirme que a origem do seu cachorro é um país aprovado e identifique o grupo dele (1, 2 ou 3)"
  - en: "ISO-compliant microchip that scans reliably (not starting with 999)"
    fr: "Puce conforme ISO qui se lit de façon fiable (ne commençant pas par 999)"
    es: "Microchip conforme a la ISO que se lea de forma fiable (que no empiece por 999)"
    pt: "Microchip em conformidade com a norma ISO e de leitura confiável (que não comece com 999)"
  - en: "Valid rabies vaccination (dog ≥84 days old at the shot), kept valid until export"
    fr: "Vaccination antirabique valide (chien ≥84 jours au vaccin), maintenue jusqu'à l'export"
    es: "Vacunación antirrábica válida (perro ≥84 días en el momento de la vacuna), mantenida válida hasta la exportación"
    pt: "Vacinação antirrábica válida (cachorro com ≥84 dias de vida na aplicação), mantida válida até a exportação"
  - en: "Rabies antibody test (RNATT) ≥0.5 IU/ml, then the mandatory 180-day wait — Group 3 origins"
    fr: "Titrage antirabique (RNATT) ≥0,5 UI/ml, puis le délai obligatoire de 180 jours — origines groupe 3"
    es: "Prueba de titulación de rabia (RNATT) ≥0,5 UI/ml, y luego la espera obligatoria de 180 días — orígenes del grupo 3"
    pt: "Teste sorológico antirrábico (RNATT) ≥0,5 UI/ml e depois a espera obrigatória de 180 dias — origens do grupo 3"
  - en: "Optional official identity verification before the RNATT to cut quarantine to 10 days"
    fr: "Vérification officielle d'identité facultative avant le RNATT pour réduire la quarantaine à 10 jours"
    es: "Verificación oficial de la identidad opcional antes del RNATT para reducir la cuarentena a 10 días"
    pt: "Verificação oficial de identidade antes do RNATT, opcional, para reduzir a quarentena a 10 dias"
  - en: "Import permit obtained via BICON before export"
    fr: "Permis d'importation obtenu via BICON avant l'export"
    es: "Permiso de importación obtenido a través de BICON antes de la exportación"
    pt: "Autorização de importação obtida pelo BICON antes da exportação"
  - en: "Required disease tests and parasite treatments completed within the correct windows"
    fr: "Tests de maladies et traitements antiparasitaires exigés réalisés dans les délais corrects"
    es: "Pruebas de enfermedades y tratamientos antiparasitarios exigidos realizados dentro de los plazos correctos"
    pt: "Exames de doenças e tratamentos antiparasitários obrigatórios feitos dentro dos prazos corretos"
  - en: "Endorsed original veterinary health certificate travelling with the dog"
    fr: "Certificat sanitaire vétérinaire original visé voyageant avec le chien"
    es: "Certificado sanitario veterinario original refrendado que viaja con el perro"
    pt: "Atestado de saúde veterinário original endossado viajando com o cachorro"
  - en: "Mickleham quarantine booked and paid; flight arriving directly into Melbourne as cargo in a travel crate"
    fr: "Quarantaine de Mickleham réservée et payée ; vol arrivant directement à Melbourne en fret, dans une caisse de transport"
    es: "Cuarentena de Mickleham reservada y pagada; vuelo que llega directamente a Melbourne como carga en una jaula de transporte"
    pt: "Quarentena de Mickleham reservada e paga; voo chegando diretamente a Melbourne como carga, em caixa de transporte"
  - en: "Confirm your dog is not a prohibited breed (pure-breed or wolf-hybrid list)"
    fr: "Vérifie que ton chien n'est pas une race interdite (liste races pures ou hybrides loup)"
    es: "Confirma que tu perro no es una raza prohibida (lista de razas puras o híbridos de lobo)"
    pt: "Confirme que seu cachorro não é de uma raça proibida (lista de raças puras ou de híbridos com lobo)"

