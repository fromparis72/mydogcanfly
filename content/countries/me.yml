# Country Entry Guide — Montenegro (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_me
iso2: "ME"
name: { en: "Montenegro", fr: "Monténégro", es: "Montenegro", pt: "Montenegro" }
region: { en: "Europe (non-EU)", fr: "Europe (hors UE)", es: "Europa (fuera de la UE)", pt: "Europa (fora da UE)" }


regime: listed
exit:
  authority: UBHVFP
  authorityUrl: https://www.gov.me/ubh/veterina
  intro:
    en: "Montenegro is a listed country, so no rabies titer is needed to return to the EU — export certificates are issued by the Administration for Food Safety, Veterinary and Phytosanitary Affairs (UBHVFP)."
    fr: "Le Monténégro est un pays listé : pas de titrage pour rentrer dans l'UE — les certificats d'export sont délivrés par l'Administration pour la sécurité alimentaire, vétérinaire et phytosanitaire (UBHVFP)."
    es: "Montenegro es un país listado: no hace falta titulación para volver a la UE — los certificados de exportación los emite la Administración de Seguridad Alimentaria, Veterinaria y Fitosanitaria (UBHVFP)."
    pt: "Montenegro é um país listado: nenhum teste sorológico antirrábico é necessário para voltar à UE — os certificados de exportação são emitidos pela Administração de Segurança Alimentar, Assuntos Veterinários e Fitossanitários (UBHVFP)."
  steps:
    - timing: window
      scope: eu
      text:
        en: "With microchip and valid rabies vaccination, the EU-model health certificate is issued and endorsed by the UBHVFP veterinary inspection under its special rules for export to the EU."
        fr: "Avec puce et vaccination antirabique valide, le certificat au modèle UE est délivré et visé par l'inspection vétérinaire de l'UBHVFP, selon ses règles spéciales d'export vers l'UE."
        es: "Con microchip y vacuna antirrábica válida, el certificado en modelo UE lo emite y refrenda la inspección veterinaria de la UBHVFP según sus reglas especiales de exportación a la UE."
        pt: "Com o microchip e a vacinação antirrábica válida, o certificado sanitário no modelo da UE é emitido e endossado pela inspeção veterinária da UBHVFP, segundo suas regras especiais de exportação para a UE."
    - timing: window
      scope: non_eu
      text:
        en: "With a microchip and a valid rabies vaccination, the health certificate is issued and endorsed by the UBHVFP veterinary inspection before departure."
        fr: "Avec une puce et une vaccination antirabique valide, le certificat sanitaire est délivré et visé par l'inspection vétérinaire de l'UBHVFP avant le départ."
        es: "Con microchip y vacunación antirrábica válida, el certificado sanitario lo expide y valida la inspección veterinaria de la UBHVFP antes de la salida."
        pt: "Com microchip e vacinação antirrábica válida, o certificado sanitário é emitido e endossado pela inspeção veterinária da UBHVFP antes da partida."
  onSiteNote:
    en: "The certificate is valid 10 days to reach the EU border check — arrange it close to departure."
    fr: "Le certificat est valable 10 jours pour atteindre le contrôle à la frontière UE — organise-le peu avant le départ."
    es: "El certificado vale 10 días para llegar al control fronterizo de la UE — organízalo cerca de la salida."
    pt: "O certificado vale 10 dias para chegar ao controle de fronteira da UE — providencie-o pouco antes da partida."

hero:
  h1: { en: "Traveling to Montenegro with your dog", fr: "Voyager au Monténégro avec ton chien", es: "Viajar a Montenegro con tu perro", pt: "Viajar para Montenegro com seu cachorro" }
  intro:
    en: >-
      Montenegro welcomes dogs, but what you need to prepare depends mainly on the country your dog is
      travelling from — not only on Montenegro itself. Montenegro is not an EU member, yet it applies
      EU-aligned pet-movement rules: an ISO microchip and a valid rabies vaccination are always required,
      and every dog must be treated against tapeworm (Echinococcus) on entry. A dog coming from an EU
      country simply needs its pet passport. A dog from another rabies-controlled country needs a
      veterinary health certificate but no blood test. A dog from a non-listed (at-risk) country faces
      the longest path, including a rabies antibody test and a three-month wait. Since April 2026
      Montenegro is itself on the EU list of rabies-controlled countries. This guide explains each case
      so you know exactly what to prepare before you book your flight.
    fr: >-
      Le Monténégro accueille les chiens, mais ce qu'il faut préparer dépend surtout du pays d'où ton
      chien voyage — pas seulement du Monténégro. Le Monténégro n'est pas membre de l'UE, mais il applique
      des règles de mouvement des animaux alignées sur celles de l'UE : une puce ISO et une vaccination
      antirabique valide sont toujours exigées, et tout chien doit être traité contre l'échinococcose à
      l'entrée. Un chien venant d'un pays de l'UE a simplement besoin de son passeport. Un chien venant
      d'un autre pays à rage maîtrisée a besoin d'un certificat sanitaire vétérinaire mais pas de prise de
      sang. Un chien venant d'un pays non listé (à risque) suit le parcours le plus long, avec un titrage
      antirabique et un délai de trois mois. Depuis avril 2026, le Monténégro figure lui-même sur la liste
      UE des pays à rage maîtrisée. Ce guide détaille chaque cas pour savoir exactement quoi préparer
      avant de réserver ton vol.
    es: >-
      Montenegro acoge a los perros, pero lo que debes preparar depende sobre todo del país desde el que
      viaja tu perro — no solo de Montenegro. Montenegro no es miembro de la UE, pero aplica normas de
      movimiento de mascotas alineadas con las de la UE: siempre se exigen un microchip ISO y una
      vacunación antirrábica válida, y todo perro debe recibir un tratamiento contra la tenia
      (Echinococcus) a la entrada. Un perro que llega de un país de la UE solo necesita su pasaporte para
      mascotas. Un perro procedente de otro país con la rabia controlada necesita un certificado sanitario
      veterinario, pero no una prueba de sangre. Un perro de un país no listado (con riesgo) se enfrenta al
      camino más largo, que incluye una prueba de titulación de rabia y una espera de tres meses. Desde
      abril de 2026, Montenegro figura a su vez en la lista de la UE de países con la rabia controlada.
      Esta guía explica cada caso para que sepas exactamente qué preparar antes de reservar tu vuelo.

    pt: "Montenegro recebe bem os cachorros, mas o que você precisa preparar depende principalmente do país de onde seu cachorro parte — e não só de Montenegro em si. Montenegro não é membro da UE, mas aplica regras de circulação de animais alinhadas com a UE: microchip ISO e vacinação antirrábica válida são sempre obrigatórios, e todo cachorro precisa ser tratado contra a tênia (Echinococcus) na entrada. Um cachorro vindo de um país da UE precisa apenas do seu passaporte para animais. Um cachorro vindo de outro país com a raiva controlada precisa de um atestado de saúde veterinário, mas não de exame de sangue. Um cachorro vindo de um país não listado (de risco) enfrenta o caminho mais longo, com teste sorológico antirrábico e três meses de espera. Desde abril de 2026, o próprio Montenegro está na lista da UE de países com a raiva controlada. Este guia explica cada caso para você saber exatamente o que preparar antes de comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Easy to difficult (depends on origin)", fr: "Facile à difficile (selon l'origine)", es: "De fácil a difícil (según el origen)", pt: "De fácil a difícil (depende da origem)" }

prepTime:
  eu:
    en: "A few days if the passport and rabies shot are up to date (plus a tapeworm treatment before travel); up to ~3 weeks if the first rabies shot is still needed (21-day wait)."
    fr: "Quelques jours si le passeport et le vaccin sont à jour (plus un traitement échinococcose avant le départ) ; jusqu'à ~3 semaines si la première vaccination reste à faire (délai de 21 jours)."
    es: "Unos días si el pasaporte y la vacuna antirrábica están al día (más un tratamiento contra la tenia antes del viaje); hasta ~3 semanas si aún falta la primera vacuna antirrábica (espera de 21 días)."
    pt: "Alguns dias se o passaporte e a vacina antirrábica estiverem em dia (mais um tratamento contra a tênia antes da viagem); até ~3 semanas se a primeira vacina antirrábica ainda estiver pendente (espera de 21 dias)."
  listed:
    en: "~3 weeks: 21-day wait after the rabies shot, plus a veterinary health certificate and a tapeworm treatment."
    fr: "~3 semaines : délai de 21 jours après le vaccin, plus un certificat sanitaire vétérinaire et un traitement échinococcose."
    es: "~3 semanas: espera de 21 días tras la vacuna antirrábica, más un certificado sanitario veterinario y un tratamiento contra la tenia."
    pt: "~3 semanas: 21 dias de espera após a vacina antirrábica, mais um atestado de saúde veterinário e um tratamento contra a tênia."
  nonListed:
    en: "~4–5 months: antibody test at least 30 days after vaccination, then a compulsory 3-month wait before entry."
    fr: "~4–5 mois : titrage au moins 30 jours après le vaccin, puis un délai obligatoire de 3 mois avant l'entrée."
    es: "~4–5 meses: prueba de titulación al menos 30 días después de la vacuna, y luego una espera obligatoria de 3 meses antes de la entrada."
    pt: "Cerca de 4 a 5 meses: teste sorológico no mínimo 30 dias depois da vacinação, seguido de 3 meses obrigatórios de espera antes da entrada."

