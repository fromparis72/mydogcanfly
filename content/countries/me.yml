origin:
  scheme: eu
  eu:
    title: { en: "Simplified — pet passport", fr: "Simplifié — passeport", es: "Simplificado — pasaporte para mascotas", pt: "Simplificado — passaporte para animais" }
    body:
      en: "A dog coming from an EU member state needs a valid ISO microchip, an in-date rabies vaccination (21 days after the primary shot) and its pet passport. No antibody test is required. Have the vet also give the Echinococcus (tapeworm) treatment required on entry into Montenegro, and keep the documents with you for the border check."
      fr: "Un chien venant d'un État membre de l'UE a besoin d'une puce ISO valide, d'une vaccination antirabique à jour (21 jours après la primo-vaccination) et de son passeport. Aucun titrage n'est requis. Fais aussi administrer par le vétérinaire le traitement échinococcose exigé à l'entrée au Monténégro, et garde les documents sur toi pour le contrôle frontalier."
      es: "Un perro que llega de un Estado miembro de la UE necesita un microchip ISO válido, una vacunación antirrábica en vigor (21 días después de la primovacunación) y su pasaporte para mascotas. No se exige prueba de titulación. Haz que el veterinario administre también el tratamiento contra Echinococcus (tenia) exigido a la entrada en Montenegro, y lleva los documentos contigo para el control fronterizo."
      pt: "Um cachorro vindo de um Estado membro da UE precisa de um microchip ISO válido, uma vacinação antirrábica em dia (21 dias após a primeira dose) e do seu passaporte para animais. Nenhum teste sorológico é exigido. Peça também ao veterinário para aplicar o tratamento contra Echinococcus (tênia) exigido na entrada em Montenegro, e mantenha os documentos com você para o controle de fronteira."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From another rabies-controlled (listed) country, your dog needs a microchip, a valid rabies vaccination, the Echinococcus treatment and Montenegro's model veterinary health certificate issued by an official vet of the country of origin. No antibody test is required; present yourself to customs and the veterinary inspection at the point of entry."
      fr: "Depuis un autre pays à rage maîtrisée (listé), ton chien a besoin d'une puce, d'une vaccination antirabique valide, du traitement échinococcose et du certificat sanitaire modèle monténégrin établi par un vétérinaire officiel du pays d'origine. Pas de titrage ; présente-toi à la douane et à l'inspection vétérinaire au point d'entrée."
      es: "Desde otro país con la rabia controlada (listado), tu perro necesita un microchip, una vacunación antirrábica válida, el tratamiento contra Echinococcus y el certificado sanitario modelo montenegrino expedido por un veterinario oficial del país de origen. No se exige prueba de titulación; preséntate ante la aduana y la inspección veterinaria en el punto de entrada."
      pt: "De outro país com a raiva controlada (listado), seu cachorro precisa de microchip, vacinação antirrábica válida, do tratamento contra Echinococcus e do atestado de saúde veterinário modelo de Montenegro, emitido por um veterinário oficial do país de origem. Nenhum teste sorológico é exigido; apresente-se à alfândega e à inspeção veterinária no ponto de entrada."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination and at least 3 months before entry, result ≥0.5 IU/ml at an EU-authorised laboratory. A veterinary health certificate and the Echinococcus treatment are also required."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin et au moins 3 mois avant l'entrée, résultat ≥0,5 UI/ml dans un laboratoire agréé UE. Un certificat sanitaire vétérinaire et le traitement échinococcose sont également requis."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna y al menos 3 meses antes de la entrada, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE. También se exigen un certificado sanitario veterinario y el tratamiento contra Echinococcus."
      pt: "De um país não listado (de risco), acrescente o teste sorológico antirrábico: sangue coletado pelo menos 30 dias após a vacinação e pelo menos 3 meses antes da entrada, resultado ≥0,5 UI/ml em laboratório autorizado pela UE. Um atestado de saúde veterinário e o tratamento contra Echinococcus também são exigidos."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Montenegro depends on where you flew from, but every arrival can be checked at the border."
    fr: "Ce qui se passe à l'arrivée de ton chien au Monténégro dépend de ton lieu de départ, mais toute arrivée peut être contrôlée à la frontière."
    es: "Lo que ocurre cuando tu perro llega a Montenegro depende del lugar desde el que hayas volado, pero toda llegada puede ser controlada en la frontera."
    pt: "O que acontece quando seu cachorro chega a Montenegro depende de onde você partiu, mas toda chegada pode ser controlada na fronteira."
  points:
    - en: "Non-commercial movement covers up to five pets (each at least 3 months old) accompanying their owner or an authorised person; it needs no import permit."
      fr: "Le mouvement non commercial couvre jusqu'à cinq animaux (chacun d'au moins 3 mois) accompagnant leur propriétaire ou une personne autorisée ; aucun permis d'import n'est requis."
      es: "El movimiento no comercial abarca hasta cinco mascotas (cada una de al menos 3 meses) que acompañen a su propietario o a una persona autorizada; no necesita permiso de importación."
      pt: "O movimento não comercial abrange até cinco animais (cada um com pelo menos 3 meses) acompanhando o dono ou uma pessoa autorizada; não precisa de autorização de importação."
    - en: "Customs and the veterinary inspection may read the microchip and verify the pet passport or the health certificate — carry the original documents, not copies."
      fr: "La douane et l'inspection vétérinaire peuvent lire la puce et vérifier le passeport ou le certificat sanitaire — munis-toi des documents originaux, pas de copies."
      es: "La aduana y la inspección veterinaria pueden leer el microchip y verificar el pasaporte para mascotas o el certificado sanitario — lleva los documentos originales, no copias."
      pt: "A alfândega e a inspeção veterinária podem ler o microchip e verificar o passaporte para animais ou o atestado de saúde — leve os documentos originais, não cópias."
    - en: "Commercial movement (sale, change of owner, more than five animals, or an unaccompanied animal) is treated as import and must clear an approved border inspection post."
      fr: "Le mouvement commercial (vente, changement de propriétaire, plus de cinq animaux ou animal non accompagné) est traité comme une importation et doit passer par un poste d'inspection frontalier agréé."
      es: "El movimiento comercial (venta, cambio de propietario, más de cinco animales o un animal sin acompañante) se trata como importación y debe despacharse en un puesto de inspección fronteriza aprobado."
      pt: "O movimento comercial (venda, mudança de dono, mais de cinco animais ou um animal desacompanhado) é tratado como importação e precisa passar por um posto de inspeção de fronteira aprovado."
    - en: "Make sure the tapeworm (Echinococcus) treatment is recorded — it is required on entry into Montenegro even for EU-origin dogs."
      fr: "Assure-toi que le traitement échinococcose est consigné — il est requis à l'entrée au Monténégro, y compris pour les chiens d'origine UE."
      es: "Asegúrate de que el tratamiento contra la tenia (Echinococcus) quede registrado — se exige a la entrada en Montenegro, incluso para los perros de origen UE."
      pt: "Certifique-se de que o tratamento contra a tênia (Echinococcus) esteja registrado — ele é exigido na entrada em Montenegro mesmo para cachorros de origem na UE."
    - en: "If documents are missing or invalid, the border inspection may refuse entry or order corrective measures — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, l'inspection frontalière peut refuser l'entrée ou ordonner des mesures correctives — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, la inspección fronteriza puede denegar la entrada u ordenar medidas correctoras — a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, a inspeção de fronteira pode recusar a entrada ou determinar medidas corretivas — às custas do dono."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Montenegro has no national ban on importing particular dog breeds: entry follows the standard veterinary rules regardless of breed. It does, however, regulate the keeping of dogs classed as dangerous under the Law on Animal Welfare Protection and the Rulebook on the manner of keeping dangerous dogs (Off. Gaz. CG 31/2017)."
    fr: "Le Monténégro n'a aucune interdiction nationale d'importer des races de chiens particulières : l'entrée suit les règles vétérinaires standard quelle que soit la race. Il réglemente toutefois la détention des chiens classés dangereux au titre de la Loi sur la protection du bien-être animal et du Règlement sur le mode de détention des chiens dangereux (J.O. CG 31/2017)."
    es: "Montenegro no tiene ninguna prohibición nacional de importar razas de perros concretas: la entrada sigue las normas veterinarias estándar con independencia de la raza. Sin embargo, regula la tenencia de perros clasificados como peligrosos conforme a la Ley de Protección del Bienestar Animal y al Reglamento sobre la forma de tenencia de perros peligrosos (B.O. CG 31/2017)."
    pt: "Montenegro não tem nenhuma proibição nacional de importação de raças específicas de cachorros: a entrada segue as regras veterinárias padrão, independentemente da raça. Ele regula, porém, a posse de cachorros classificados como perigosos, sob a Lei de Proteção do Bem-Estar Animal e o Regulamento sobre a forma de posse de cachorros perigosos (Diário Oficial CG 31/2017)."
  cat1:
    en: "There is no Category 1-style import prohibition and no breed is banned from entry. Import formalities are the standard veterinary rules (microchip, rabies vaccination, tapeworm treatment, certificate/passport) for every dog."
    fr: "Il n'existe pas d'interdiction d'importation de type catégorie 1 et aucune race n'est interdite d'entrée. Les formalités d'importation sont les règles vétérinaires standard (puce, vaccination antirabique, traitement échinococcose, certificat/passeport) pour tout chien."
    es: "No existe una prohibición de importación de tipo categoría 1 y ninguna raza tiene vetada la entrada. Las formalidades de importación son las normas veterinarias estándar (microchip, vacunación antirrábica, tratamiento contra la tenia, certificado/pasaporte) para todo perro."
    pt: "Não existe uma proibição de importação do tipo categoria 1, e nenhuma raça tem a entrada proibida. As formalidades de importação são as regras veterinárias padrão (microchip, vacinação antirrábica, tratamento contra a tênia, certificado/passaporte) para todo cachorro."
  cat2:
    en: "The 2017 rulebook lists breeds treated as dangerous (including pit bull terrier, American Staffordshire terrier, bull terrier, Tosa Inu, Fila Brasileiro, Caucasian, Central Asian and South Russian shepherds, and their crosses, plus dogs trained to fight). Owners must be adults and typically keep such dogs sterilised, leashed and muzzled under supervision in public. These are keeping rules for owners, not entry conditions."
    fr: "Le règlement de 2017 liste des races considérées comme dangereuses (dont pit-bull terrier, American Staffordshire terrier, bull terrier, Tosa Inu, Fila Brasileiro, bergers du Caucase, d'Asie centrale et de Russie méridionale, et leurs croisements, ainsi que les chiens dressés au combat). Les propriétaires doivent être majeurs et tenir généralement ces chiens stérilisés, en laisse et muselés sous surveillance en public. Ce sont des règles de détention pour les propriétaires, pas des conditions d'entrée."
    es: "El reglamento de 2017 enumera razas consideradas peligrosas (entre ellas pit bull terrier, American Staffordshire terrier, bull terrier, Tosa Inu, Fila Brasileiro, pastores del Cáucaso, de Asia Central y del sur de Rusia, y sus cruces, además de los perros adiestrados para el combate). Los propietarios deben ser mayores de edad y, por lo general, mantener a estos perros esterilizados, con correa y con bozal bajo vigilancia en público. Son normas de tenencia para los propietarios, no condiciones de entrada."
    pt: "O regulamento de 2017 lista raças tratadas como perigosas (incluindo pit bull terrier, American Staffordshire terrier, bull terrier, Tosa Inu, Fila Brasileiro, pastor do Cáucaso, da Ásia Central e do Sul da Rússia, e seus cruzamentos, além de cachorros treinados para lutar). Os donos precisam ser adultos e, normalmente, mantêm esses cachorros castrados, na guia e com focinheira, sob supervisão, em locais públicos. Essas são regras de posse para os donos, não condições de entrada."
  note:
    en: "If you plan to stay in Montenegro with a powerful or guard-type dog, confirm the current keeping obligations with the veterinary authority (UBH), as the dangerous-dog rulebook applies to residents and can be enforced by the veterinary inspection."
    fr: "Si tu prévois de séjourner au Monténégro avec un chien puissant ou de type garde, confirme les obligations de détention en vigueur auprès de l'autorité vétérinaire (UBH), car le règlement sur les chiens dangereux s'applique aux résidents et peut être contrôlé par l'inspection vétérinaire."
    es: "Si planeas quedarte en Montenegro con un perro potente o de tipo guardián, confirma las obligaciones de tenencia vigentes con la autoridad veterinaria (UBH), ya que el reglamento sobre perros peligrosos se aplica a los residentes y puede ser controlado por la inspección veterinaria."
    pt: "Se você planeja ficar em Montenegro com um cachorro forte ou do tipo guarda, confirme as obrigações de posse vigentes junto à autoridade veterinária (UBH), já que o regulamento sobre cachorros perigosos se aplica a residentes e pode ser fiscalizado pela inspeção veterinária."

checklist:
  - en: "Microchip (ISO) implanted before the rabies vaccination"
    fr: "Puce (ISO) posée avant la vaccination antirabique"
    es: "Microchip (ISO) implantado antes de la vacunación antirrábica"
    pt: "Microchip (ISO) implantado antes da vacinação antirrábica"
  - en: "Valid rabies vaccination (dog ≥12 weeks at the shot, +21 days)"
    fr: "Vaccination antirabique valide (chien ≥12 semaines, +21 jours)"
    es: "Vacunación antirrábica válida (perro ≥12 semanas en la vacuna, +21 días)"
    pt: "Vacinação antirrábica válida (cachorro com ≥12 semanas na data da vacina, +21 dias)"
  - en: "Rabies antibody test — non-listed countries only"
    fr: "Titrage antirabique — pays non listés uniquement"
    es: "Prueba de titulación de rabia — solo países no listados"
    pt: "Teste sorológico antirrábico — apenas para países não listados"
  - en: "Pet passport (EU origin) or veterinary health certificate (non-EU origin)"
    fr: "Passeport (origine UE) ou certificat sanitaire vétérinaire (origine hors UE)"
    es: "Pasaporte para mascotas (origen UE) o certificado sanitario veterinario (origen fuera de la UE)"
    pt: "Passaporte para animais (origem UE) ou atestado de saúde veterinário (origem fora da UE)"
  - en: "Tapeworm (Echinococcus) treatment recorded before entry"
    fr: "Traitement contre l'échinococcose consigné avant l'entrée"
    es: "Tratamiento contra la tenia (Echinococcus) registrado antes de la entrada"
    pt: "Tratamento contra a tênia (Echinococcus) registrado antes da entrada"
  - en: "Original documents; certified translation if requested at the border"
    fr: "Documents originaux ; traduction certifiée si demandée à la frontière"
    es: "Documentos originales; traducción certificada si se solicita en la frontera"
    pt: "Documentos originais; tradução certificada se solicitada na fronteira"
