  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Montenegro (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — le Monténégro (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Montenegro (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — Montenegro (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — Montenegro", fr: "Pays de destination — Monténégro", es: "País de destino — Montenegro", pt: "País de destino — Montenegro" }
      text:
        en: "Montenegro applies EU-aligned pet-movement rules: an ISO microchip and a valid rabies vaccination are always required, and a tapeworm (Echinococcus multilocularis) treatment is required on entry into Montenegro."
        fr: "Le Monténégro applique des règles alignées sur celles de l'UE : puce ISO et vaccination antirabique valide toujours exigées, et un traitement contre l'échinococcose (Echinococcus multilocularis) est requis à l'entrée au Monténégro."
        es: "Montenegro aplica normas de movimiento de mascotas alineadas con las de la UE: siempre se exigen un microchip ISO y una vacunación antirrábica válida, y se exige un tratamiento contra la tenia (Echinococcus multilocularis) a la entrada en Montenegro."
        pt: "Montenegro aplica regras de circulação de animais alinhadas com a UE: microchip ISO e vacinação antirrábica válida são sempre obrigatórios, e um tratamento contra a tênia (Echinococcus multilocularis) é exigido na entrada em Montenegro."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Whether your dog leaves from an EU country, another rabies-controlled (listed) country, or a non-listed country decides whether an antibody test and a health certificate are required."
        fr: "Que ton chien parte d'un pays de l'UE, d'un autre pays à rage maîtrisée (listé) ou d'un pays non listé détermine si un titrage et un certificat sanitaire sont exigés."
        es: "Que tu perro salga de un país de la UE, de otro país con la rabia controlada (listado) o de un país no listado determina si se exigen una prueba de titulación y un certificado sanitario."
        pt: "Se o seu cachorro parte de um país da UE, de outro país com a raiva controlada (listado) ou de um país não listado é o que determina se o teste sorológico e um atestado de saúde são exigidos."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay in a non-listed rabies-risk country can trigger an antibody test even if you fly in from an exempt country. It is your dog's real origin and history that count — not only the last airport."
        fr: "Un séjour récent dans un pays non listé à risque rabique peut imposer un titrage même si tu arrives d'un pays exempté. C'est l'origine réelle et l'historique du chien qui comptent — pas seulement l'aéroport de destination finale."
        es: "Una estancia reciente en un país no listado con riesgo de rabia puede obligar a una prueba de titulación aunque llegues desde un país exento. Lo que cuenta es el origen y el historial reales de tu perro — no solo el último aeropuerto."
        pt: "Uma estadia recente em um país não listado de risco de raiva pode acionar a exigência do teste sorológico mesmo que você chegue de um país isento. O que conta é a origem e o histórico reais do seu cachorro — não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Montenegro's framework, then confirm your dog's exact origin and history with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre monténégrin, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Montenegro y luego confirma el origen y el historial exactos de tu perro con tu veterinario."
    pt: "Leia então as exigências abaixo como o quadro geral de Montenegro, e confirme com seu veterinário a origem e o histórico exatos do seu cachorro."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "The dog must be identified by microchip before the rabies vaccination; the vaccination date must not be earlier than the microchip date.", fr: "Le chien doit être identifié par puce avant la vaccination antirabique ; la date du vaccin ne doit pas être antérieure à celle de la puce.", es: "El perro debe estar identificado con microchip antes de la vacunación antirrábica; la fecha de la vacuna no debe ser anterior a la del microchip.", pt: "O cachorro precisa estar identificado por microchip antes da vacinação antirrábica; a data da vacinação não pode ser anterior à data do microchip." }
    exceptions: { en: "A legible tattoo is accepted only if applied before 3 July 2011.", fr: "Un tatouage lisible n'est accepté que s'il est antérieur au 3 juillet 2011.", es: "Un tatuaje legible solo se acepta si se hizo antes del 3 de julio de 2011.", pt: "Uma tatuagem legível só é aceita se tiver sido feita antes de 3 de julho de 2011." }
    ref: { en: "Rulebook on non-commercial movement of pets (Off. Gaz. CG 42/2016); UBH", fr: "Règlement sur le mouvement non commercial des animaux (J.O. CG 42/2016) ; UBH", es: "Reglamento sobre el movimiento no comercial de mascotas (B.O. CG 42/2016); UBH", pt: "Regulamento sobre o movimento não comercial de animais de estimação (Diário Oficial CG 42/2016); UBH" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Dog at least 12 weeks old on the day of vaccination; for a first vaccination, 21 days must have passed before travel.", fr: "Chien d'au moins 12 semaines le jour de la vaccination ; pour une primo-vaccination, 21 jours doivent s'être écoulés avant le voyage.", es: "Perro de al menos 12 semanas el día de la vacunación; para una primovacunación, deben haber pasado 21 días antes del viaje.", pt: "Cachorro com pelo menos 12 semanas no dia da vacinação; para uma primovacinação, 21 dias precisam ter se passado antes da viagem." }
    exceptions: { en: "The microchip must already be in place before the shot; otherwise re-vaccination is needed.", fr: "La puce doit déjà être posée avant le vaccin ; sinon il faut revacciner.", es: "El microchip debe estar ya implantado antes de la vacuna; de lo contrario, hay que revacunar.", pt: "O microchip já precisa estar implantado antes da vacina; caso contrário, é preciso revacinar." }
    ref: { en: "Rulebook on non-commercial movement of pets (Off. Gaz. CG 42/2016)", fr: "Règlement sur le mouvement non commercial des animaux (J.O. CG 42/2016)", es: "Reglamento sobre el movimiento no comercial de mascotas (B.O. CG 42/2016)", pt: "Regulamento sobre o movimento não comercial de animais de estimação (Diário Oficial CG 42/2016)" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Non-listed origins only: blood drawn ≥30 days after vaccination and ≥3 months before travel, result ≥0.5 IU/ml at an EU-authorised laboratory.", fr: "Pays non listés uniquement : sang prélevé ≥30 jours après le vaccin et ≥3 mois avant le voyage, résultat ≥0,5 UI/ml dans un laboratoire agréé UE.", es: "Solo orígenes no listados: sangre extraída ≥30 días después de la vacuna y ≥3 meses antes del viaje, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE.", pt: "Somente origens não listadas: sangue coletado ≥30 dias após a vacinação e ≥3 meses antes da viagem, resultado ≥0,5 UI/ml em laboratório autorizado pela UE." }
    exceptions: { en: "Not required from the EU or from other rabies-controlled (listed) countries. Since April 2026 Montenegro itself is on the EU list, so the same exemption logic applies to visitors as within the EU.", fr: "Non requis depuis l'UE ou d'autres pays à rage maîtrisée (listés). Depuis avril 2026, le Monténégro figure lui-même sur la liste UE, de sorte que la même logique d'exemption s'applique aux visiteurs qu'au sein de l'UE.", es: "No se exige desde la UE ni desde otros países con la rabia controlada (listados). Desde abril de 2026, Montenegro figura a su vez en la lista de la UE, por lo que se aplica a los visitantes la misma lógica de exención que dentro de la UE.", pt: "Não exigido a partir da UE nem de outros países com a raiva controlada (listados). Desde abril de 2026, o próprio Montenegro está na lista da UE, então a mesma lógica de isenção que vale dentro da UE se aplica aos visitantes." }
    ref: { en: "Rulebook (Off. Gaz. CG 42/2016); UBH — EU listing, 02.04.2026", fr: "Règlement (J.O. CG 42/2016) ; UBH — inscription UE, 02.04.2026", es: "Reglamento (B.O. CG 42/2016); UBH — inclusión en la lista de la UE, 02.04.2026", pt: "Regulamento (Diário Oficial CG 42/2016); UBH — inclusão na lista da UE, 02.04.2026" }
  - item: { en: "Pet passport", fr: "Passeport pour animal", es: "Pasaporte para mascotas", pt: "Passaporte para animais" }
    required: { en: "EU origins", fr: "Origines UE", es: "Orígenes de la UE", pt: "Origens na UE" }
    when: { en: "A valid pet passport issued by an authorised vet, recording the microchip and the in-date rabies vaccination.", fr: "Un passeport valide délivré par un vétérinaire agréé, consignant la puce et la vaccination antirabique à jour.", es: "Un pasaporte para mascotas válido expedido por un veterinario autorizado, que registre el microchip y la vacunación antirrábica en vigor.", pt: "Um passaporte para animais válido, emitido por um veterinário autorizado, registrando o microchip e a vacinação antirrábica em dia." }
    exceptions: { en: "Replaced by a veterinary health certificate for non-EU origins.", fr: "Remplacé par un certificat sanitaire vétérinaire pour les origines hors UE.", es: "Se sustituye por un certificado sanitario veterinario para orígenes fuera de la UE.", pt: "Substituído por um atestado de saúde veterinário para origens fora da UE." }
    ref: { en: "Rulebook on non-commercial movement of pets (Off. Gaz. CG 42/2016)", fr: "Règlement sur le mouvement non commercial des animaux (J.O. CG 42/2016)", es: "Reglamento sobre el movimiento no comercial de mascotas (B.O. CG 42/2016)", pt: "Regulamento sobre o movimento não comercial de animais de estimação (Diário Oficial CG 42/2016)" }
  - item: { en: "Veterinary health certificate", fr: "Certificat sanitaire vétérinaire", es: "Certificado sanitario veterinario", pt: "Atestado de saúde veterinário" }
    required: { en: "Non-EU origins", fr: "Origines hors UE", es: "Orígenes fuera de la UE", pt: "Origens fora da UE" }
    when: { en: "Montenegro's model non-commercial-movement certificate, issued by an official vet of the exporting country; valid 10 days to the point of entry.", fr: "Le certificat modèle monténégrin de mouvement non commercial, établi par un vétérinaire officiel du pays exportateur ; valable 10 jours jusqu'au point d'entrée.", es: "El certificado modelo montenegrino de movimiento no comercial, expedido por un veterinario oficial del país exportador; válido 10 días hasta el punto de entrada.", pt: "O certificado modelo de Montenegro para movimento não comercial, emitido por um veterinário oficial do país exportador; válido por 10 dias até o ponto de entrada." }
    exceptions: { en: "EU-origin dogs travel on their pet passport instead.", fr: "Les chiens d'origine UE voyagent avec leur passeport à la place.", es: "Los perros de origen UE viajan con su pasaporte para mascotas en su lugar.", pt: "Cachorros de origem na UE viajam com o passaporte para animais deles, em vez disso." }
    ref: { en: "UBH — model certificate for non-commercial movement of dogs", fr: "UBH — modèle de certificat pour le mouvement non commercial des chiens", es: "UBH — certificado modelo para el movimiento no comercial de perros", pt: "UBH — certificado modelo para o movimento não comercial de cachorros" }
  - item: { en: "Tapeworm (Echinococcus) treatment", fr: "Traitement échinococcose", es: "Tratamiento contra la tenia (Echinococcus)", pt: "Tratamento contra a tênia (Echinococcus)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Dogs must be treated against Echinococcus multilocularis in the prescribed manner on entry into (or exit from) Montenegro.", fr: "Les chiens doivent être traités contre Echinococcus multilocularis de la manière prescrite à l'entrée (ou à la sortie) du Monténégro.", es: "Los perros deben ser tratados contra Echinococcus multilocularis de la manera prescrita a la entrada (o salida) de Montenegro.", pt: "Os cachorros precisam ser tratados contra a Echinococcus multilocularis da maneira prescrita, na entrada em (ou na saída de) Montenegro." }
    exceptions: { en: "Unlike France, Montenegro requires this treatment; have the vet record it before travel.", fr: "Contrairement à la France, le Monténégro exige ce traitement ; fais-le consigner par le vétérinaire avant le voyage.", es: "A diferencia de Francia, Montenegro exige este tratamiento; haz que el veterinario lo registre antes del viaje.", pt: "Diferentemente da França, Montenegro exige esse tratamento; peça ao veterinário para registrá-lo antes da viagem." }
    ref: { en: "Rulebook on non-commercial movement of pets (Off. Gaz. CG 42/2016)", fr: "Règlement sur le mouvement non commercial des animaux (J.O. CG 42/2016)", es: "Reglamento sobre el movimiento no comercial de mascotas (B.O. CG 42/2016)", pt: "Regulamento sobre o movimento não comercial de animais de estimação (Diário Oficial CG 42/2016)" }
  - item: { en: "Advance notification / import permit", fr: "Notification préalable / permis d'import", es: "Notificación previa / permiso de importación", pt: "Notificação prévia / autorização de importação" }
    required: { en: "Commercial movement only", fr: "Mouvement commercial uniquement", es: "Solo movimiento comercial", pt: "Somente movimento comercial" }
    when: { en: "Sale, change of owner, more than five pets or an unaccompanied animal are treated as import and cleared through an approved border inspection post with the competent inspector's approval.", fr: "Vente, changement de propriétaire, plus de cinq animaux ou animal non accompagné sont traités comme une importation, dédouanée via un poste d'inspection frontalier agréé avec l'accord de l'inspecteur compétent.", es: "La venta, el cambio de propietario, más de cinco mascotas o un animal sin acompañante se tratan como importación y se despachan a través de un puesto de inspección fronteriza aprobado con la aprobación del inspector competente.", pt: "Venda, mudança de dono, mais de cinco animais ou um animal desacompanhado são tratados como importação e liberados por um posto de inspeção de fronteira aprovado, com a aprovação do inspetor competente." }
    exceptions: { en: "Non-commercial movement (up to 5 accompanied pets, each ≥3 months old) needs no import permit.", fr: "Le mouvement non commercial (jusqu'à 5 animaux accompagnés, chacun ≥3 mois) ne nécessite aucun permis d'import.", es: "El movimiento no comercial (hasta 5 mascotas acompañadas, cada una ≥3 meses) no necesita permiso de importación.", pt: "O movimento não comercial (até 5 animais acompanhados, cada um com ≥3 meses) não precisa de autorização de importação." }
    ref: { en: "Uprava carina — Information for travellers (animals & pets)", fr: "Uprava carina — Informations pour les voyageurs (animaux & compagnie)", es: "Uprava carina — Información para viajeros (animales y mascotas)", pt: "Uprava carina — Informações para viajantes (animais e animais de estimação)" }
  - item: { en: "Border check (documents & identity)", fr: "Contrôle frontalier (documents & identité)", es: "Control fronterizo (documentos e identidad)", pt: "Controle de fronteira (documentos e identidade)" }
    required: { en: "All arrivals", fr: "Toutes les arrivées", es: "Todas las llegadas", pt: "Todas as chegadas" }
    when: { en: "Customs and the veterinary inspection may read the microchip and verify the passport or certificate at the point of entry.", fr: "La douane et l'inspection vétérinaire peuvent lire la puce et vérifier le passeport ou le certificat au point d'entrée.", es: "La aduana y la inspección veterinaria pueden leer el microchip y verificar el pasaporte o el certificado en el punto de entrada.", pt: "A alfândega e a inspeção veterinária podem ler o microchip e verificar o passaporte ou o certificado no ponto de entrada." }
    exceptions: { en: "Present the dog and its documents spontaneously; a passport alone is not enough if a certificate is required.", fr: "Présente spontanément le chien et ses documents ; le seul passeport ne suffit pas si un certificat est exigé.", es: "Presenta el perro y sus documentos espontáneamente; el pasaporte por sí solo no basta si se exige un certificado.", pt: "Apresente o cachorro e seus documentos espontaneamente; apenas o passaporte não basta se um certificado for exigido." }
    ref: { en: "Uprava carina — Information for travellers; UBH", fr: "Uprava carina — Informations pour les voyageurs ; UBH", es: "Uprava carina — Información para viajeros; UBH", pt: "Uprava carina — Informações para viajantes; UBH" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "Effectively ≥15 weeks", fr: "En pratique ≥15 semaines", es: "En la práctica ≥15 semanas", pt: "Na prática, ≥15 semanas" }
    when: { en: "Pets may move non-commercially only from 3 months old; the rabies shot is given from 12 weeks and needs a 21-day wait.", fr: "Les animaux ne peuvent circuler à titre non commercial qu'à partir de 3 mois ; le vaccin est administré dès 12 semaines et nécessite un délai de 21 jours.", es: "Las mascotas solo pueden desplazarse de forma no comercial a partir de los 3 meses; la vacuna antirrábica se administra desde las 12 semanas y necesita una espera de 21 días.", pt: "Os animais só podem viajar de forma não comercial a partir dos 3 meses; a vacina antirrábica é aplicada a partir das 12 semanas e exige 21 dias de espera." }
    exceptions: { en: "A puppy under 12 weeks cannot be vaccinated and cannot qualify; from a non-listed country the wait is far longer.", fr: "Un chiot de moins de 12 semaines ne peut être vacciné et ne peut être éligible ; depuis un pays non listé, le délai est bien plus long.", es: "Un cachorro de menos de 12 semanas no puede vacunarse y no puede optar; desde un país no listado, la espera es mucho más larga.", pt: "Um filhote com menos de 12 semanas não pode ser vacinado e não consegue se qualificar; vindo de um país não listado, a espera é bem mais longa." }
    ref: { en: "Rulebook on non-commercial movement of pets (Off. Gaz. CG 42/2016)", fr: "Règlement sur le mouvement non commercial des animaux (J.O. CG 42/2016)", es: "Reglamento sobre el movimiento no comercial de mascotas (B.O. CG 42/2016)", pt: "Regulamento sobre o movimento não comercial de animais de estimação (Diário Oficial CG 42/2016)" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not required", fr: "Non requise", es: "No obligatoria", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Only if rules are breached — the border inspection may then refuse entry or order corrective measures at the owner's expense.", fr: "Uniquement en cas de non-conformité — l'inspection frontalière peut alors refuser l'entrée ou ordonner des mesures correctives aux frais du propriétaire.", es: "Solo en caso de incumplimiento — la inspección fronteriza puede entonces denegar la entrada u ordenar medidas correctoras a cargo del propietario.", pt: "Somente em caso de descumprimento das regras — a inspeção de fronteira pode então recusar a entrada ou determinar medidas corretivas às custas do dono." }
