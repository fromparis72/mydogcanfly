  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — the UAE (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — les Émirats (ta destination) ne sont que le premier."
    es: "Los documentos exactos dependen de tres factores — los Emiratos (tu destino) son solo el primero."
    pt: "Os documentos exatos dependem de três fatores — os Emirados (seu destino) são apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — United Arab Emirates", fr: "Pays de destination — Émirats arabes unis", es: "País de destino — Emiratos Árabes Unidos", pt: "País de destino — Emirados Árabes Unidos" }
      text:
        en: "The UAE runs its own scheme: an advance MOCCAE import permit, an ISO microchip, a valid rabies vaccination, core vaccinations and parasite treatment, and a government health certificate are always required. Certain breeds are banned outright."
        fr: "Les Émirats appliquent leur propre dispositif : permis d'importation MOCCAE préalable, puce ISO, vaccination antirabique valide, vaccinations essentielles et traitement antiparasitaire, et certificat vétérinaire officiel toujours exigés. Certaines races sont totalement interdites."
        es: "Los Emiratos aplican su propio sistema: siempre se exigen un permiso de importación MOCCAE previo, un microchip ISO, una vacunación antirrábica válida, las vacunas esenciales y un tratamiento antiparasitario, y un certificado sanitario oficial. Algunas razas están totalmente prohibidas."
        pt: "Os Emirados aplicam um sistema próprio: autorização de importação do MOCCAE obtida com antecedência, microchip ISO, vacinação antirrábica válida, vacinas essenciais e tratamento antiparasitário, além de um certificado veterinário oficial, são sempre obrigatórios. Algumas raças são totalmente proibidas."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Whether your dog leaves an approved low-risk country, an approved high-risk country or a non-approved country decides whether a rabies antibody test is required and whether import is even allowed."
        fr: "Que ton chien parte d'un pays approuvé à faible risque, à haut risque ou d'un pays non approuvé détermine si un titrage antirabique est exigé et si l'importation est même autorisée."
        es: "Que tu perro salga de un país aprobado de bajo riesgo, de un país aprobado de alto riesgo o de un país no aprobado determina si se exige una prueba de titulación de rabia y si la importación siquiera está permitida."
        pt: "Se o seu cachorro parte de um país aprovado de baixo risco, de um país aprovado de alto risco ou de um país não aprovado é o que determina se o teste sorológico antirrábico (titulação) é obrigatório e se a importação é sequer permitida."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay in a high-risk or non-approved country can trigger the antibody test or block import even if you fly in from an approved country. Your dog's real origin and history count — not only the last airport."
        fr: "Un séjour récent dans un pays à haut risque ou non approuvé peut imposer le titrage ou bloquer l'importation même si tu arrives d'un pays approuvé. C'est l'origine réelle et l'historique du chien qui comptent — pas seulement l'aéroport de destination finale."
        es: "Una estancia reciente en un país de alto riesgo o no aprobado puede obligar a la prueba de titulación o bloquear la importación aunque llegues desde un país aprobado. Lo que cuenta es el origen y el historial reales de tu perro — no solo el último aeropuerto."
        pt: "Uma estadia recente em um país de alto risco ou não aprovado pode acionar a exigência do teste sorológico ou bloquear a importação, mesmo que você chegue voando de um país aprovado. O que conta é a origem real e o histórico do seu cachorro — não apenas o último aeroporto."
  note:
    en: "So read the requirements below as the UAE's framework, then confirm your dog's exact origin, rabies-risk status and history with your vet before applying for the permit."
    fr: "Lis donc les exigences ci-dessous comme le cadre émirati, puis confirme l'origine, le statut de risque rabique et l'historique exacts de ton chien avec ton vétérinaire avant de demander le permis."
    es: "Así que lee los requisitos siguientes como el marco de los Emiratos y luego confirma el origen exacto, el estatus de riesgo de rabia y el historial de tu perro con tu veterinario antes de solicitar el permiso."
    pt: "Portanto, leia as exigências abaixo como o marco dos Emirados e, depois, confirme com o seu veterinário a origem exata do seu cachorro, o status de risco de raiva e o histórico antes de solicitar a autorização."

requirements:
  - item: { en: "MOCCAE import permit", fr: "Permis d'importation MOCCAE", es: "Permiso de importación MOCCAE", pt: "Autorização de importação do MOCCAE" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Applied for online via MOCCAE before the dog travels; valid 90 days from issue. A dog cannot be imported on an expired permit.", fr: "Demandé en ligne via le MOCCAE avant le voyage du chien ; valable 90 jours à compter de la délivrance. Un chien ne peut être importé avec un permis expiré.", es: "Se solicita en línea a través del MOCCAE antes de que el perro viaje; válido 90 días desde su expedición. Un perro no puede importarse con un permiso caducado.", pt: "Solicitada on-line pelo MOCCAE antes de o cachorro viajar; válida por 90 dias a partir da emissão. Nenhum cachorro pode ser importado com uma autorização vencida." }
    exceptions: { en: "No dog may enter without a valid permit.", fr: "Aucun chien ne peut entrer sans permis valide.", es: "Ningún perro puede entrar sin un permiso válido.", pt: "Nenhum cachorro pode entrar sem uma autorização válida." }
    ref: { en: "MOCCAE — Import of pets (cats/dogs)", fr: "MOCCAE — Importation d'animaux de compagnie (chats/chiens)", es: "MOCCAE — Importación de mascotas (gatos/perros)", pt: "MOCCAE — Importação de animais de estimação (cães e gatos)" }
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Permanent microchip implanted before the rabies vaccination; the chip number must match the health certificate.", fr: "Puce permanente posée avant la vaccination antirabique ; le numéro de puce doit correspondre au certificat sanitaire.", es: "Microchip permanente implantado antes de la vacunación antirrábica; el número de microchip debe coincidir con el certificado sanitario.", pt: "Microchip permanente implantado antes da vacinação antirrábica; o número do chip deve coincidir com o do atestado de saúde." }
    exceptions: { en: "None — identification is mandatory for every imported dog.", fr: "Aucune — l'identification est obligatoire pour tout chien importé.", es: "Ninguna — la identificación es obligatoria para todo perro importado.", pt: "Nenhuma — a identificação é obrigatória para todo cachorro importado." }
    ref: { en: "MOCCAE — Import of pets (cats/dogs)", fr: "MOCCAE — Importation d'animaux de compagnie (chats/chiens)", es: "MOCCAE — Importación de mascotas (gatos/perros)", pt: "MOCCAE — Importação de animais de estimação (cães e gatos)" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Given at 12 weeks of age or older; for a first vaccination at least 21 days must pass before travel. A valid booster needs no 21-day wait.", fr: "Administrée à l'âge de 12 semaines ou plus ; pour une primo-vaccination, un délai d'au moins 21 jours est requis avant le voyage. Un rappel valide ne nécessite pas d'attente de 21 jours.", es: "Administrada a las 12 semanas de edad o más; para una primera vacunación deben pasar al menos 21 días antes de viajar. Un refuerzo válido no requiere la espera de 21 días.", pt: "Aplicada a partir das 12 semanas de idade; no caso de uma primeira vacinação, devem transcorrer pelo menos 21 dias antes da viagem. Um reforço válido não exige a espera de 21 dias." }
    exceptions: { en: "The microchip must already be in place; otherwise the animal is re-vaccinated.", fr: "La puce doit déjà être posée ; sinon l'animal est revacciné.", es: "El microchip debe estar ya implantado; de lo contrario, se revacuna al animal.", pt: "O microchip já deve estar implantado; caso contrário, o animal é revacinado." }
    ref: { en: "MOCCAE — Import of pets (cats/dogs)", fr: "MOCCAE — Importation d'animaux de compagnie (chats/chiens)", es: "MOCCAE — Importación de mascotas (gatos/perros)", pt: "MOCCAE — Importação de animais de estimação (cães e gatos)" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Required from high-risk countries: sampling by a laboratory accredited by the exporting country's authorities, result at least 0.5 IU/ml. Test is valid one year while the vaccination stays current.", fr: "Requis depuis les pays à haut risque : prélèvement par un laboratoire agréé par les autorités du pays exportateur, résultat au moins égal à 0,5 UI/ml. Le test est valable un an tant que la vaccination reste à jour.", es: "Obligatoria desde países de alto riesgo: toma de muestra por un laboratorio acreditado por las autoridades del país exportador, resultado de al menos 0,5 UI/ml. La prueba es válida un año mientras la vacunación se mantenga vigente.", pt: "Obrigatório para quem vem de países de alto risco: coleta feita por um laboratório credenciado pelas autoridades do país exportador, resultado de pelo menos 0,5 UI/ml. O teste vale um ano, enquanto a vacinação se mantiver em dia." }
    exceptions: { en: "Not required for dogs coming from countries the UAE classes as low-risk (approved list).", fr: "Non requis pour les chiens venant de pays classés à faible risque par les Émirats (liste approuvée).", es: "No se exige para los perros que llegan de países que los Emiratos clasifican como de bajo riesgo (lista aprobada).", pt: "Não obrigatório para cachorros vindos de países classificados pelos Emirados como de baixo risco (lista aprovada)." }
    ref: { en: "MOCCAE — Import of pets (cats/dogs)", fr: "MOCCAE — Importation d'animaux de compagnie (chats/chiens)", es: "MOCCAE — Importación de mascotas (gatos/perros)", pt: "MOCCAE — Importação de animais de estimação (cães e gatos)" }
  - item: { en: "Other vaccinations & parasite treatment", fr: "Autres vaccinations et traitement antiparasitaire", es: "Otras vacunas y tratamiento antiparasitario", pt: "Outras vacinas e tratamento antiparasitário" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Core vaccinations current per the manufacturer's validity; preventive treatment for internal and external parasites within the 14 days before shipment, recorded in the certificate or passport.", fr: "Vaccinations essentielles à jour selon la validité du fabricant ; traitement préventif contre les parasites internes et externes dans les 14 jours précédant l'expédition, consigné au certificat ou passeport.", es: "Vacunas esenciales vigentes según la valide del fabricante; tratamiento preventivo contra parásitos internos y externos en los 14 días previos al envío, registrado en el certificado o pasaporte.", pt: "Vacinas essenciais em dia conforme a validade indicada pelo fabricante; tratamento preventivo contra parasitas internos e externos nos 14 dias anteriores ao embarque, registrado no certificado ou no passaporte." }
    exceptions: { en: "None documented.", fr: "Aucune documentée.", es: "Ninguna documentada.", pt: "Nenhuma documentada." }
    ref: { en: "MOCCAE — Import of pets (cats/dogs)", fr: "MOCCAE — Importation d'animaux de compagnie (chats/chiens)", es: "MOCCAE — Importación de mascotas (gatos/perros)", pt: "MOCCAE — Importação de animais de estimação (cães e gatos)" }
  - item: { en: "Government veterinary health certificate", fr: "Certificat vétérinaire officiel", es: "Certificado sanitario veterinario oficial", pt: "Atestado de saúde veterinário oficial" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Issued by the competent government veterinary authority of the exporting country; records the microchip, vaccinations and parasite treatment.", fr: "Délivré par l'autorité vétérinaire gouvernementale compétente du pays exportateur ; consigne la puce, les vaccinations et le traitement antiparasitaire.", es: "Expedido por la autoridad veterinaria gubernamental competente del país exportador; registra el microchip, las vacunas y el tratamiento antiparasitario.", pt: "Emitido pela autoridade veterinária governamental competente do país exportador; registra o microchip, as vacinas e o tratamento antiparasitário." }
    exceptions: { en: "None — an authorised certificate must accompany every dog.", fr: "Aucune — un certificat autorisé doit accompagner chaque chien.", es: "Ninguna — un certificado autorizado debe acompañar a cada perro.", pt: "Nenhuma — um certificado autorizado deve acompanhar cada cachorro." }
    ref: { en: "MOCCAE — Import of pets (cats/dogs)", fr: "MOCCAE — Importation d'animaux de compagnie (chats/chiens)", es: "MOCCAE — Importación de mascotas (gatos/perros)", pt: "MOCCAE — Importação de animais de estimação (cães e gatos)" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "At least 12 weeks old from an approved low-risk country; at least 15 weeks old from a high-risk country (to allow vaccination and the antibody test).", fr: "Au moins 12 semaines depuis un pays approuvé à faible risque ; au moins 15 semaines depuis un pays à haut risque (pour permettre la vaccination et le titrage).", es: "Al menos 12 semanas de edad desde un país aprobado de bajo riesgo; al menos 15 semanas desde un país de alto riesgo (para permitir la vacunación y la prueba de titulación).", pt: "Pelo menos 12 semanas de idade vindo de um país aprovado de baixo risco; pelo menos 15 semanas vindo de um país de alto risco (para dar tempo à vacinação e ao teste sorológico)." }
    exceptions: { en: "Younger puppies cannot meet the rabies requirements and cannot be imported.", fr: "Les chiots plus jeunes ne peuvent satisfaire les exigences antirabiques et ne peuvent être importés.", es: "Los cachorros más jóvenes no pueden cumplir los requisitos antirrábicos y no pueden importarse.", pt: "Filhotes mais novos não conseguem cumprir as exigências relativas à raiva e não podem ser importados." }
    ref: { en: "MOCCAE — Import of pets (cats/dogs)", fr: "MOCCAE — Importation d'animaux de compagnie (chats/chiens)", es: "MOCCAE — Importación de mascotas (gatos/perros)", pt: "MOCCAE — Importação de animais de estimação (cães e gatos)" }
  - item: { en: "Maximum pets per person per year", fr: "Nombre maximum d'animaux par personne et par an", es: "Número máximo de mascotas por persona y año", pt: "Número máximo de animais por pessoa por ano" }
    required: { en: "Limited", fr: "Limité", es: "Limitado", pt: "Limitado" }
    when: { en: "Personal import is capped at 2 dogs, or 2 cats, or one dog and one cat, per person per year.", fr: "L'importation personnelle est plafonnée à 2 chiens, ou 2 chats, ou un chien et un chat, par personne et par an.", es: "La importación personal está limitada a 2 perros, o 2 gatos, o un perro y un gato, por persona y año.", pt: "A importação pessoal é limitada a 2 cachorros, ou 2 gatos, ou um cachorro e um gato, por pessoa por ano." }
    exceptions: { en: "Larger movements fall under commercial import rules, not personal import.", fr: "Les mouvements plus importants relèvent de l'importation commerciale, non de l'importation personnelle.", es: "Los movimientos mayores se rigen por las normas de importación comercial, no por la importación personal.", pt: "Movimentações maiores se enquadram nas regras de importação comercial, e não de importação particular." }
    ref: { en: "MOCCAE — Import of pets (cats/dogs)", fr: "MOCCAE — Importation d'animaux de compagnie (chats/chiens)", es: "MOCCAE — Importación de mascotas (gatos/perros)", pt: "MOCCAE — Importação de animais de estimação (cães e gatos)" }
  - item: { en: "Border check / port examination", fr: "Contrôle frontalier / examen au port", es: "Control fronterizo / examen en el puerto", pt: "Controle de fronteira / exame no ponto de entrada" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Animals are examined at the port of entry on arrival against the permit and certificate.", fr: "Les animaux sont examinés au point d'entrée à l'arrivée, au regard du permis et du certificat.", es: "Los animales se examinan en el punto de entrada a la llegada, cotejándolos con el permiso y el certificado.", pt: "Os animais são examinados no ponto de entrada, na chegada, em confronto com a autorização e o certificado." }
    exceptions: { en: "None.", fr: "Aucune.", es: "Ninguna.", pt: "Nenhuma." }
    ref: { en: "MOCCAE — Import of pets (cats/dogs)", fr: "MOCCAE — Importation d'animaux de compagnie (chats/chiens)", es: "MOCCAE — Importación de mascotas (gatos/perros)", pt: "MOCCAE — Importação de animais de estimação (cães e gatos)" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not routinely required", fr: "Non requise en routine", es: "No obligatoria de forma rutinaria", pt: "Não obrigatória de forma rotineira" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Non-compliant or high-risk animals may be held, refused or returned at the owner's expense.", fr: "Les animaux non conformes ou à haut risque peuvent être retenus, refusés ou renvoyés aux frais du propriétaire.", es: "Los animales no conformes o de alto riesgo pueden ser retenidos, rechazados o devueltos a cargo del propietario.", pt: "Animais fora de conformidade ou de alto risco podem ser retidos, recusados ou devolvidos às custas do tutor." }
    ref: { en: "MOCCAE — Import of pets (cats/dogs)", fr: "MOCCAE — Importation d'animaux de compagnie (chats/chiens)", es: "MOCCAE — Importación de mascotas (gatos/perros)", pt: "MOCCAE — Importação de animais de estimação (cães e gatos)" }
  - item: { en: "Banned / restricted breeds", fr: "Races interdites / restreintes", es: "Razas prohibidas / restringidas", pt: "Raças proibidas / restritas" }
    required: { en: "Prohibited", fr: "Interdites", es: "Prohibidas", pt: "Proibidas" }
    when: { en: "Import of listed dangerous breeds (pit bull types, mastiff types, Tosa and others) is not allowed.", fr: "L'importation des races dangereuses listées (types pit-bull, types mastiff, Tosa et autres) n'est pas autorisée.", es: "No se permite la importación de las razas peligrosas listadas (tipos pit bull, tipos mastín, Tosa y otras).", pt: "A importação das raças perigosas listadas (tipos pit bull, tipos mastim, Tosa e outras) não é permitida." }
    exceptions: { en: "Service, assistance and medical-use dogs may be exempt if they meet the regulating conditions.", fr: "Les chiens de service, d'assistance et à usage médical peuvent être exemptés s'ils respectent les conditions réglementaires.", es: "Los perros de servicio, de asistencia y de uso médico pueden estar exentos si cumplen las condiciones reglamentarias.", pt: "Cães de serviço, cães de assistência e cachorros de uso médico podem ser isentos se cumprirem as condições regulamentares." }
    ref: { en: "u.ae — Banned and restricted goods; Federal Law No. 22 of 2016", fr: "u.ae — Marchandises interdites et restreintes ; loi fédérale n° 22 de 2016", es: "u.ae — Mercancías prohibidas y restringidas; Ley Federal n.º 22 de 2016", pt: "u.ae — Mercadorias proibidas e restritas; Federal Law No. 22 of 2016 (lei federal nº 22 de 2016)" }

origin:
  scheme: own
  eu:
    title: { en: "Approved low-risk country — no blood test", fr: "Pays approuvé à faible risque — sans prise de sang", es: "País aprobado de bajo riesgo — sin análisis de sangre", pt: "País aprovado de baixo risco — sem exame de sangue" }
    body:
      en: "If your dog leaves a country the UAE classifies as low-risk for rabies (its approved list includes many EU states, the United Kingdom, Japan, Australia, New Zealand, Singapore and others), it needs the MOCCAE import permit, an ISO microchip, a valid rabies vaccination, core vaccinations, parasite treatment within 14 days of travel and a government health certificate. No rabies antibody test is required, and the minimum age is 12 weeks."
      fr: "Si ton chien part d'un pays classé à faible risque rabique par les Émirats (la liste approuvée comprend de nombreux États de l'UE, le Royaume-Uni, le Japon, l'Australie, la Nouvelle-Zélande, Singapour et d'autres), il lui faut le permis MOCCAE, une puce ISO, une vaccination antirabique valide, les vaccinations essentielles, un traitement antiparasitaire dans les 14 jours du voyage et un certificat vétérinaire officiel. Aucun titrage antirabique n'est requis, et l'âge minimum est de 12 semaines."
      es: "Si tu perro sale de un país que los Emiratos clasifican como de bajo riesgo de rabia (su lista aprobada incluye muchos Estados de la UE, el Reino Unido, Japón, Australia, Nueva Zelanda, Singapur y otros), necesita el permiso de importación MOCCAE, un microchip ISO, una vacunación antirrábica válida, las vacunas esenciales, un tratamiento antiparasitario en los 14 días previos al viaje y un certificado sanitario oficial. No se exige prueba de titulación de rabia, y la edad mínima es de 12 semanas."
      pt: "Se o seu cachorro parte de um país classificado pelos Emirados como de baixo risco para raiva (a lista aprovada inclui muitos Estados da UE, o Reino Unido, o Japão, a Austrália, a Nova Zelândia, Singapura e outros), ele precisa da autorização de importação do MOCCAE, de um microchip ISO, de uma vacinação antirrábica válida, das vacinas essenciais, de tratamento antiparasitário nos 14 dias anteriores à viagem e de um certificado veterinário oficial. Nenhum teste sorológico antirrábico é exigido, e a idade mínima é de 12 semanas."
    cls: ok
  listed:
    title: { en: "Approved high-risk country — antibody test required", fr: "Pays approuvé à haut risque — titrage requis", es: "País aprobado de alto riesgo — se requiere prueba de titulación", pt: "País aprovado de alto risco — teste sorológico obrigatório" }
    body:
      en: "From a country the UAE classifies as high-risk for rabies, add a rabies antibody test: a sample taken by a laboratory accredited by the exporting country's authorities, with a result of at least 0.5 IU/ml. The test is valid for one year as long as the vaccination stays current. The minimum age is 15 weeks. The permit, microchip, vaccinations, parasite treatment and government health certificate are all still required."
      fr: "Depuis un pays classé à haut risque rabique par les Émirats, ajoute un titrage antirabique : un prélèvement effectué par un laboratoire agréé par les autorités du pays exportateur, avec un résultat d'au moins 0,5 UI/ml. Le test est valable un an tant que la vaccination reste à jour. L'âge minimum est de 15 semaines. Le permis, la puce, les vaccinations, le traitement antiparasitaire et le certificat vétérinaire officiel restent tous requis."
      es: "Desde un país que los Emiratos clasifican como de alto riesgo de rabia, añade una prueba de titulación de rabia: una muestra tomada por un laboratorio acreditado por las autoridades del país exportador, con un resultado de al menos 0,5 UI/ml. La prueba es válida un año mientras la vacunación se mantenga vigente. La edad mínima es de 15 semanas. El permiso, el microchip, las vacunas, el tratamiento antiparasitario y el certificado sanitario oficial siguen siendo todos obligatorios."
      pt: "Vindo de um país classificado pelos Emirados como de alto risco para raiva, acrescente um teste sorológico antirrábico (titulação): uma amostra coletada por um laboratório credenciado pelas autoridades do país exportador, com resultado de pelo menos 0,5 UI/ml. O teste vale um ano, desde que a vacinação se mantenha em dia. A idade mínima é de 15 semanas. A autorização, o microchip, as vacinas, o tratamento antiparasitário e o certificado veterinário oficial continuam todos obrigatórios."
    cls: warn
  nonListed:
    title: { en: "Country not on the approved list", fr: "Pays hors liste approuvée", es: "País que no figura en la lista aprobada", pt: "País fora da lista de países aprovados" }
    body:
      en: "MOCCAE only authorises imports from countries on its approved list, and that list changes with the global animal-health situation. If your dog is travelling from a country that is not approved, import may be refused or require special case-by-case approval. Check your dog's origin against the current MOCCAE approved-countries tool before making any plans."
      fr: "Le MOCCAE n'autorise l'importation qu'en provenance des pays figurant sur sa liste approuvée, et cette liste évolue selon la situation sanitaire mondiale. Si ton chien voyage depuis un pays non approuvé, l'importation peut être refusée ou soumise à une autorisation spéciale au cas par cas. Vérifie l'origine de ton chien avec l'outil MOCCAE des pays approuvés avant tout projet."
      es: "El MOCCAE solo autoriza importaciones desde los países que figuran en su lista aprobada, y esa lista cambia según la situación sanitaria mundial. Si tu perro viaja desde un país no aprobado, la importación puede denegarse o requerir una autorización especial caso por caso. Comprueba el origen de tu perro con la herramienta actual de países aprobados del MOCCAE antes de hacer cualquier plan."
      pt: "O MOCCAE só autoriza importações de países que constam da sua lista aprovada, e essa lista muda conforme a situação sanitária animal no mundo. Se o seu cachorro viaja de um país não aprovado, a importação pode ser recusada ou exigir uma aprovação especial, caso a caso. Confira a origem do seu cachorro na ferramenta atual do MOCCAE de países aprovados antes de fazer qualquer plano."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches the UAE depends on your permit and the country you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien aux Émirats dépend de ton permis et du pays de départ."
    es: "Lo que ocurre cuando tu perro llega a los Emiratos depende de tu permiso y del país desde el que hayas volado."
    pt: "O que acontece quando o seu cachorro chega aos Emirados depende da sua autorização e do país de onde você voou."
  points:
    - en: "The import permit must be issued by MOCCAE before you travel and be still valid (90 days) on the day of entry."
      fr: "Le permis d'importation doit être délivré par le MOCCAE avant le voyage et être encore valide (90 jours) le jour de l'entrée."
      es: "El permiso de importación debe ser expedido por el MOCCAE antes de viajar y seguir siendo válido (90 días) el día de la entrada."
      pt: "A autorização de importação precisa ser emitida pelo MOCCAE antes da viagem e ainda estar válida (90 dias) no dia da entrada."
    - en: "Animals are examined at the port of entry against the permit, microchip and health certificate."
      fr: "Les animaux sont examinés au point d'entrée au regard du permis, de la puce et du certificat sanitaire."
      es: "Los animales se examinan en el punto de entrada cotejándolos con el permiso, el microchip y el certificado sanitario."
      pt: "Os animais são examinados no ponto de entrada em confronto com a autorização, o microchip e o atestado de saúde."
    - en: "Carry original documents, including the government veterinary health certificate and vaccination records."
      fr: "Munis-toi des documents originaux, dont le certificat vétérinaire officiel et le carnet de vaccination."
      es: "Lleva los documentos originales, incluidos el certificado sanitario veterinario oficial y los registros de vacunación."
      pt: "Leve os documentos originais, incluindo o certificado veterinário oficial e a carteira de vacinação."
    - en: "If documents are missing or invalid, or the breed is banned, the animal may be held, refused entry or returned — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, ou si la race est interdite, l'animal peut être retenu, refusé ou renvoyé — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, o la raza está prohibida, el animal puede ser retenido, rechazado a la entrada o devuelto — a cargo del propietario."
      pt: "Se faltarem documentos ou eles forem inválidos, ou se a raça for proibida, o animal pode ser retido, ter a entrada recusada ou ser devolvido — às custas do tutor."
    - en: "Personal import is limited to 2 dogs, or 2 cats, or one dog and one cat, per person per year."
      fr: "L'importation personnelle est limitée à 2 chiens, ou 2 chats, ou un chien et un chat, par personne et par an."
      es: "La importación personal está limitada a 2 perros, o 2 gatos, o un perro y un gato, por persona y año."
      pt: "A importação pessoal é limitada a 2 cachorros, ou 2 gatos, ou um cachorro e um gato, por pessoa por ano."

travellerExperience: null

restrictedDogs:
  intro:
    en: "The UAE prohibits the import and private possession of a list of dangerous dog breeds under Federal Law No. 22 of 2016 on the possession of dangerous animals and its customs rules. The ban targets specific breeds and their crosses; it does not depend on an individual behavioural assessment."
    fr: "Les Émirats interdisent l'importation et la détention privée d'une liste de races de chiens dangereux au titre de la loi fédérale n° 22 de 2016 sur la détention d'animaux dangereux et de leurs règles douanières. L'interdiction vise des races précises et leurs croisements ; elle ne dépend pas d'une évaluation comportementale individuelle."
    es: "Los Emiratos prohíben la importación y la tenencia privada de una lista de razas de perros peligrosos en virtud de la Ley Federal n.º 22 de 2016 sobre la tenencia de animales peligrosos y de sus normas aduaneras. La prohibición se dirige a razas concretas y sus cruces; no depende de una evaluación individual del comportamiento."
    pt: "Os Emirados proíbem a importação e a posse particular de uma lista de raças de cachorro perigosas com base na Federal Law No. 22 of 2016 (lei federal nº 22 de 2016) sobre a posse de animais perigosos e nas regras aduaneiras correspondentes. A proibição atinge raças específicas e seus cruzamentos; não depende de uma avaliação comportamental individual."
  cat1:
    en: "Banned from import: Pit Bull types (American Pit Bull Terrier, American Staffordshire Terrier, Staffordshire Bull Terrier, American Bully), Japanese Tosa, Dogo Argentino (Argentinian Mastiff), Fila Brasileiro (Brazilian Mastiff), and mastiff-type breeds such as Boerboel, Bullmastiff, Cane Corso, Dogue de Bordeaux, Neapolitan Mastiff, Tibetan Mastiff, Bully Kutta and Perro de Presa Canario. Wolf hybrids and other cross-breeds of dangerous animals are also prohibited."
    fr: "Interdits à l'importation : types Pit Bull (American Pit Bull Terrier, American Staffordshire Terrier, Staffordshire Bull Terrier, American Bully), Tosa japonais, Dogo Argentino (mâtin argentin), Fila Brasileiro (mâtin brésilien) et races de type mastiff comme le Boerboel, le Bullmastiff, le Cane Corso, le Dogue de Bordeaux, le mâtin napolitain, le mâtin tibétain, le Bully Kutta et le Perro de Presa Canario. Les hybrides de loup et autres croisements d'animaux dangereux sont également interdits."
    es: "Prohibidos para la importación: tipos Pit Bull (American Pit Bull Terrier, American Staffordshire Terrier, Staffordshire Bull Terrier, American Bully), Tosa japonés, Dogo Argentino (mastín argentino), Fila Brasileiro (mastín brasileño) y razas de tipo mastín como Boerboel, Bullmastiff, Cane Corso, Dogo de Burdeos, Mastín Napolitano, Mastín Tibetano, Bully Kutta y Perro de Presa Canario. Los híbridos de lobo y otros cruces de animales peligrosos también están prohibidos."
    pt: "Proibidos de importação: tipos Pit Bull (American Pit Bull Terrier, American Staffordshire Terrier, Staffordshire Bull Terrier, American Bully), Tosa Japonês, Dogo Argentino (mastim argentino), Fila Brasileiro, e raças do tipo mastim como Boerboel, Bullmastiff, Cane Corso, Dogue de Bordeaux, Mastim Napolitano, Mastim Tibetano, Bully Kutta e Perro de Presa Canario. Híbridos de lobo e outros cruzamentos de animais perigosos também são proibidos."
  cat2:
    en: "There is no lighter 'permitted with conditions' category for these breeds at the border: their import is refused outright. Exemptions apply only to genuine service, assistance and medical-use dogs that meet the regulating conditions."
    fr: "Il n'existe pas de catégorie allégée « autorisée sous conditions » pour ces races à la frontière : leur importation est purement refusée. Des exemptions ne s'appliquent qu'aux véritables chiens de service, d'assistance et à usage médical qui respectent les conditions réglementaires."
    es: "No existe una categoría más flexible «permitida con condiciones» para estas razas en la frontera: su importación se deniega directamente. Las exenciones se aplican solo a auténticos perros de servicio, de asistencia y de uso médico que cumplan las condiciones reglamentarias."
    pt: "Não existe uma categoria mais branda de \"permitido com condições\" para essas raças na fronteira: a importação é recusada de forma pura e simples. As isenções valem apenas para cães de serviço, cães de assistência e cachorros de uso médico legítimos que cumpram as condições regulamentares."
  note:
    en: "Because a dog that resembles a listed type risks refusal, confirm your dog's breed and any cross before applying for the permit. The approved-breed position can change; verify with MOCCAE."
    fr: "Un chien ressemblant à un type listé risquant le refus, confirme la race de ton chien et tout croisement avant de demander le permis. La position sur les races admises peut évoluer ; vérifie auprès du MOCCAE."
    es: "Dado que un perro que se parezca a un tipo listado corre el riesgo de ser rechazado, confirma la raza de tu perro y cualquier cruce antes de solicitar el permiso. La posición sobre las razas admitidas puede cambiar; verifícalo con el MOCCAE."
    pt: "Como um cachorro que se pareça com um dos tipos listados corre o risco de ser recusado, confirme a raça do seu cachorro e eventuais cruzamentos antes de solicitar a autorização. A posição sobre as raças aceitas pode mudar; verifique junto ao MOCCAE."

checklist:
  - en: "MOCCAE import permit obtained online before travel (valid 90 days)"
    fr: "Permis d'importation MOCCAE obtenu en ligne avant le voyage (valable 90 jours)"
    es: "Permiso de importación MOCCAE obtenido en línea antes de viajar (válido 90 días)"
    pt: "Autorização de importação do MOCCAE obtida on-line antes da viagem (válida por 90 dias)"
  - en: "Microchip (ISO) implanted before the rabies vaccination"
    fr: "Puce (ISO) posée avant la vaccination antirabique"
    es: "Microchip (ISO) implantado antes de la vacunación antirrábica"
    pt: "Microchip (ISO) implantado antes da vacinação antirrábica"
  - en: "Valid rabies vaccination (dog ≥12 weeks at the shot, +21 days for a first vaccination)"
    fr: "Vaccination antirabique valide (chien ≥12 semaines, +21 jours pour une primo-vaccination)"
    es: "Vacunación antirrábica válida (perro ≥12 semanas en la vacuna, +21 días para una primera vacunación)"
    pt: "Vacinação antirrábica válida (cachorro com ≥12 semanas na aplicação, +21 dias no caso de primeira vacinação)"
  - en: "Rabies antibody test ≥0.5 IU/ml — high-risk countries only"
    fr: "Titrage antirabique ≥0,5 UI/ml — pays à haut risque uniquement"
    es: "Prueba de titulación de rabia ≥0,5 UI/ml — solo países de alto riesgo"
    pt: "Teste sorológico antirrábico (titulação) ≥0,5 UI/ml — somente para países de alto risco"
  - en: "Core vaccinations current and parasite treatment within 14 days of travel"
    fr: "Vaccinations essentielles à jour et traitement antiparasitaire dans les 14 jours du voyage"
    es: "Vacunas esenciales vigentes y tratamiento antiparasitario en los 14 días previos al viaje"
    pt: "Vacinas essenciais em dia e tratamento antiparasitário nos 14 dias anteriores à viagem"
  - en: "Government veterinary health certificate matching the microchip number"
    fr: "Certificat vétérinaire officiel correspondant au numéro de puce"
    es: "Certificado sanitario veterinario oficial que coincida con el número de microchip"
    pt: "Certificado veterinário oficial coincidindo com o número do microchip"
  - en: "Confirm your dog's origin is on the MOCCAE approved-countries list"
    fr: "Vérifie que l'origine de ton chien figure sur la liste MOCCAE des pays approuvés"
    es: "Confirma que el origen de tu perro figura en la lista de países aprobados del MOCCAE"
    pt: "Confirme que a origem do seu cachorro está na lista de países aprovados do MOCCAE"
  - en: "Confirm your dog is not a banned breed (pit bull, Tosa, Dogo Argentino, mastiff types, wolf hybrid…)"
    fr: "Vérifie que ton chien n'est pas d'une race interdite (pit-bull, Tosa, Dogo Argentino, types mastiff, hybride de loup…)"
    es: "Confirma que tu perro no es de una raza prohibida (pit bull, Tosa, Dogo Argentino, tipos mastín, híbrido de lobo…)"
    pt: "Confirme que o seu cachorro não é de uma raça proibida (pit bull, Tosa, Dogo Argentino, tipos mastim, híbrido de lobo…)"
  - en: "Airline reservation confirming your dog's travel option and suitable IATA crate"
    fr: "Réservation confirmant l'option de transport de ton chien et caisse IATA adaptée"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y jaula adecuada conforme a la IATA"
    pt: "Reserva na companhia aérea confirmando a opção de transporte do seu cachorro e caixa de transporte adequada às normas da IATA"

