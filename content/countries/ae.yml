# Country Entry Guide — United Arab Emirates (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_ae
iso2: "AE"
name: { en: "United Arab Emirates", fr: "Émirats arabes unis", es: "Emiratos Árabes Unidos", pt: "Emirados Árabes Unidos" }
region: { en: "Middle East", fr: "Moyen-Orient", es: "Oriente Medio", pt: "Oriente Médio" }


regime: listed
domestic:
  intro:
    en: "Domestic flight in the United Arab Emirates: no internal movement permit exists for pets."
    fr: "Vol intérieur aux Émirats arabes unis : aucun permis de mouvement interne n'existe pour les animaux de compagnie."
    es: "Vuelo nacional en Emiratos Árabes Unidos: no existe permiso de movimiento interno para mascotas."
    pt: "Voo doméstico nos Emirados Árabes Unidos: não existe nenhuma autorização de circulação interna para animais de estimação."
  points:
    - en: "The federal ministry issues import, transit and export permits only — nothing for moving a pet between emirates."
      fr: "Le ministère fédéral ne délivre que des permis d'import, de transit et d'export — rien pour déplacer un animal entre émirats."
      es: "El ministerio federal solo emite permisos de importación, tránsito y exportación — nada para mover una mascota entre emiratos."
      pt: "O ministério federal só emite autorizações de importação, de trânsito e de exportação — nada para deslocar um animal entre emirados."
    - en: "Federal law requires a dog licence and a leash in public, and the emirates run their own pet registration schemes, but these are ownership rules rather than arrival rules."
      fr: "La loi fédérale impose une licence pour chien et la laisse en public, et les émirats gèrent leurs propres enregistrements d'animaux, mais ce sont des règles de détention et non d'arrivée."
      es: "La ley federal exige licencia para perro y correa en público, y los emiratos gestionan sus propios registros de mascotas, pero son reglas de tenencia, no de llegada."
      pt: "A lei federal exige licença para cachorro e uso de guia em público, e cada emirado mantém seu próprio sistema de registro de animais, mas essas são regras de posse, e não de entrada no país."
    - en: "Note that the domestic network is very limited: carriers here describe international sectors, with widely differing cabin and breed rules."
      fr: "Note que le réseau intérieur est très limité : les compagnies décrivent ici des vols internationaux, avec des règles de cabine et de race très variables."
      es: "Ten en cuenta que la red nacional es muy limitada: las aerolíneas describen aquí trayectos internacionales, con reglas de cabina y raza muy dispares."
      pt: "Repare que a malha doméstica é muito limitada: as companhias aéreas descrevem aqui trechos internacionais, com regras de cabine e de raça bastante diferentes entre si."
exit:
  authority: MOCCAE
  authorityUrl: https://www.moccae.gov.ae/en/services/animal-health-certificate-for-export-re-export-of-live-animals
  intro:
    en: "The UAE is a listed country, so no rabies titer is needed to return — but you must obtain a MOCCAE export veterinary health certificate for your dog."
    fr: "Les Émirats sont un pays listé : pas de titrage pour revenir — mais tu dois obtenir un certificat sanitaire vétérinaire d'export MOCCAE pour ton chien."
    es: "Los EAU son un país listado: no hace falta titulación para volver — pero debes obtener un certificado sanitario veterinario de exportación de MOCCAE para tu perro."
    pt: "Os Emirados são um país listado: não é preciso teste sorológico antirrábico (titulação) para voltar — mas você precisa obter um certificado veterinário de exportação do MOCCAE para o seu cachorro."
  steps:
    - timing: window
      scope: any
      text:
        en: "Apply through the MOCCAE digital portal for the export/re-export veterinary health certificate; it is issued after examination of the dog and is valid 30 days from issue (processing about 1 working day)."
        fr: "Fais la demande sur le portail numérique MOCCAE pour le certificat vétérinaire d'export/ré-export ; il est délivré après examen du chien et valable 30 jours (traitement en ~1 jour ouvré)."
        es: "Solicita en el portal digital de MOCCAE el certificado veterinario de exportación/reexportación; se emite tras el examen del perro y es válido 30 días (tramitación ~1 día hábil)."
        pt: "Solicite no portal digital do MOCCAE o certificado veterinário de exportação/reexportação; ele é emitido após o exame do cachorro e vale 30 dias a partir da emissão (tramitação de cerca de 1 dia útil)."
  onSiteNote:
    en: "Arrange the MOCCAE certificate close to departure so it is still valid on arrival; the separate EU health certificate is completed by your vet."
    fr: "Organise le certificat MOCCAE peu avant le départ pour qu'il soit encore valide à l'arrivée ; le certificat sanitaire UE distinct est rempli par ton vétérinaire."
    es: "Gestiona el certificado MOCCAE cerca de la salida para que siga siendo válido a la llegada; el certificado sanitario UE aparte lo rellena tu veterinario."
    pt: "Providencie o certificado do MOCCAE perto da data de partida para que ainda esteja válido na chegada; o atestado de saúde da UE, que é um documento à parte, é preenchido pelo seu veterinário."

hero:
  h1: { en: "Traveling to the United Arab Emirates with your dog", fr: "Voyager aux Émirats arabes unis avec ton chien", es: "Viajar a los Emiratos Árabes Unidos con tu perro", pt: "Viajar para os Emirados Árabes Unidos com seu cachorro" }
  intro:
    en: >-
      The United Arab Emirates welcomes pet dogs, but entry runs through the country's own scheme, not
      the EU framework. Every dog needs an import permit obtained online in advance from the Ministry of
      Climate Change and Environment (MOCCAE) before it travels. On top of the permit, your dog must have
      an ISO microchip, a valid rabies vaccination, other core vaccinations and parasite treatment, and a
      government veterinary health certificate. Dogs coming from countries the UAE classes as high-risk
      for rabies must also pass a rabies antibody test. The exact path depends on the country your
      dog is travelling from and its rabies status. This guide explains the permit, the tests, the age
      limits, the yearly pet quota and the banned breeds so you know what to prepare before you book.
    fr: >-
      Les Émirats arabes unis accueillent les chiens, mais l'entrée passe par le dispositif propre au pays,
      pas par le cadre de l'UE. Chaque chien doit disposer d'un permis d'importation obtenu en ligne à
      l'avance auprès du ministère du Changement climatique et de l'Environnement (MOCCAE) avant de voyager.
      Outre le permis, ton chien doit avoir une puce ISO, une vaccination antirabique valide, les autres
      vaccinations essentielles et un traitement antiparasitaire, ainsi qu'un certificat vétérinaire officiel.
      Les chiens en provenance de pays classés à haut risque rabique par les Émirats doivent aussi réussir
      un titrage des anticorps antirabiques. Le parcours exact dépend du pays de départ et de son statut
      rabique. Ce guide détaille le permis, les tests, les âges minimums, le quota annuel d'animaux et les
      races interdites pour savoir quoi préparer avant de réserver.
    es: >-
      Los Emiratos Árabes Unidos acogen a los perros de compañía, pero la entrada se rige por el sistema
      propio del país, no por el marco de la UE. Cada perro necesita un permiso de importación obtenido en
      línea con antelación ante el Ministerio de Cambio Climático y Medio Ambiente (MOCCAE) antes de viajar.
      Además del permiso, tu perro debe tener un microchip ISO, una vacunación antirrábica válida, otras
      vacunas esenciales y un tratamiento antiparasitario, y un certificado sanitario veterinario oficial.
      Los perros que llegan de países que los Emiratos clasifican como de alto riesgo de rabia también deben
      superar una prueba de titulación de rabia. El camino exacto depende del país desde el que viaja tu
      perro y de su estatus rábico. Esta guía explica el permiso, las pruebas, los límites de edad, el cupo
      anual de mascotas y las razas prohibidas para que sepas qué preparar antes de reservar.

    pt: "Os Emirados Árabes Unidos recebem cachorros de estimação, mas a entrada segue o sistema próprio do país, e não o marco da UE. Todo cachorro precisa de uma autorização de importação obtida on-line com antecedência junto ao Ministry of Climate Change and Environment (MOCCAE, o ministério da Mudança Climática e do Meio Ambiente) antes de viajar. Além da autorização, seu cachorro precisa ter um microchip ISO, uma vacinação antirrábica válida, as demais vacinas essenciais e tratamento antiparasitário, e ainda um certificado veterinário oficial. Cachorros vindos de países classificados pelos Emirados como de alto risco para raiva também precisam passar por um teste sorológico antirrábico (titulação). O percurso exato depende do país de onde o cachorro parte e do seu status em relação à raiva. Este guia explica a autorização, os exames, os limites de idade, a cota anual de animais e as raças proibidas para você saber o que preparar antes de reservar."
difficulty:
  level: moderate
  label: { en: "Moderate — advance import permit required", fr: "Modéré — permis d'importation préalable requis", es: "Moderado — se requiere permiso de importación previo", pt: "Moderado — autorização de importação prévia obrigatória" }

prepTime:
  eu:
    en: "From an approved low-risk country: about 3–4 weeks — microchip, rabies vaccination valid 21 days after a first shot, parasite treatment and the MOCCAE import permit."
    fr: "Depuis un pays approuvé à faible risque : environ 3–4 semaines — puce, vaccin antirabique valide 21 jours après une primo-vaccination, traitement antiparasitaire et permis MOCCAE."
    es: "Desde un país aprobado de bajo riesgo: unas 3–4 semanas — microchip, vacunación antirrábica válida 21 días después de una primera dosis, tratamiento antiparasitario y el permiso de importación MOCCAE."
    pt: "De um país aprovado de baixo risco: cerca de 3–4 semanas — microchip, vacinação antirrábica válida 21 dias após a primeira dose, tratamento antiparasitário e a autorização de importação do MOCCAE."
  listed:
    en: "From an approved high-risk country: add a rabies antibody test — plan several weeks to months for sampling, laboratory results and permit."
    fr: "Depuis un pays approuvé à haut risque : ajoute un titrage antirabique — compte plusieurs semaines à plusieurs mois pour le prélèvement, les résultats de laboratoire et le permis."
    es: "Desde un país aprobado de alto riesgo: añade una prueba de titulación de rabia — prevé de varias semanas a meses para la toma de muestra, los resultados de laboratorio y el permiso."
    pt: "De um país aprovado de alto risco: acrescente um teste sorológico antirrábico (titulação) — conte de várias semanas a alguns meses para a coleta, os resultados do laboratório e a autorização."
  nonListed:
    en: "From a country not approved by MOCCAE: import may be refused or require special approval — timing is case-by-case and cannot be assumed."
    fr: "Depuis un pays non approuvé par le MOCCAE : l'importation peut être refusée ou soumise à une autorisation spéciale — les délais sont examinés au cas par cas."
    es: "Desde un país no aprobado por el MOCCAE: la importación puede denegarse o requerir una autorización especial — los plazos se examinan caso por caso y no pueden darse por sentado."
    pt: "De um país não aprovado pelo MOCCAE: a importação pode ser recusada ou exigir uma aprovação especial — os prazos são analisados caso a caso e não podem ser presumidos."

