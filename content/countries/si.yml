origin:
  scheme: eu
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate and normally no border check."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire et normalement pas de contrôle frontalier."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario y normalmente sin control fronterizo."
      pt: "Um cachorro vindo de outro país da UE precisa de um passaporte europeu que comprove um microchip ISO válido e uma vacinação antirrábica em dia. Sem teste sorológico, sem certificado sanitário e, normalmente, sem controle de fronteira."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Switzerland, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination and an EU animal health certificate endorsed by an official vet before departure. No antibody test is required; enter via a designated travellers' point of entry (Ljubljana Airport / Brnik)."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Suisse, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire européen visé par un vétérinaire officiel avant le départ. Pas de titrage ; entre par un point d'entrée voyageurs désigné (aéroport de Ljubljana / Brnik)."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Suiza, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal de la UE refrendado por un veterinario oficial antes de la salida. No se exige prueba de titulación; entra por un punto de entrada de viajeros designado (aeropuerto de Liubliana / Brnik)."
      pt: "Vindo de um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Suíça, Japão, Austrália e outros), seu cachorro precisa de microchip, vacinação antirrábica válida e certificado sanitário europeu endossado por um veterinário oficial antes da partida. Não é exigido teste sorológico; a entrada deve ser feita por um ponto de entrada de viajantes designado (Aeroporto de Liubliana / Brnik)."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-designated laboratory, then a compulsory 3-month wait before entry. An endorsed EU animal health certificate is also required."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen visé est également requis."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exige un certificado sanitario animal de la UE refrendado."
      pt: "Vindo de um país não listado (de risco), acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório designado pela UE, e depois 3 meses obrigatórios de espera antes da entrada. Também é exigido um certificado sanitário europeu endossado."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Slovenia depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien en Slovénie dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Eslovenia depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega à Eslovênia depende do país de onde você veio."
  points:
    - from: eu
      en: "From another EU country: no systematic border check — keep the EU pet passport with you."
      fr: "Depuis un autre pays de l'UE : pas de contrôle systématique — garde le passeport européen sur toi."
      es: "Desde otro país de la UE: sin control fronterizo sistemático — lleva contigo el pasaporte europeo."
      pt: "De outro país da UE: sem controle de fronteira sistemático — leve o passaporte europeu com você."
    - from: non_eu
      en: "From outside the EU: live animals may enter only via a designated point of entry — in Slovenia this is Ljubljana Airport (Brnik) — where UVHVVR officers carry out veterinary checks."
      fr: "Depuis hors UE : les animaux vivants ne peuvent entrer que par un point d'entrée désigné — en Slovénie l'aéroport de Ljubljana (Brnik) — où les agents de l'UVHVVR réalisent les contrôles vétérinaires."
      es: "Desde fuera de la UE: los animales vivos solo pueden entrar por un punto de entrada designado — en Eslovenia, el aeropuerto de Liubliana (Brnik) — donde los agentes de la UVHVVR realizan los controles veterinarios."
      pt: "De fora da UE: animais vivos só podem entrar por um ponto de entrada designado — na Eslovênia, o Aeroporto de Liubliana (Brnik) —, onde os agentes da UVHVVR fazem os controles veterinários."
    - en: "Present the accompanying documents to the customs authority (FURS) at the point of entry and allow any check to be carried out."
      fr: "Présente les documents d'accompagnement à la douane (FURS) au point d'entrée et permets tout contrôle éventuel."
      es: "Presenta los documentos de acompañamiento a la autoridad aduanera (FURS) en el punto de entrada y permite que se realice cualquier control."
      pt: "Apresente os documentos que acompanham o cachorro à autoridade aduaneira (FURS) no ponto de entrada e permita a realização de qualquer controle."
    - en: "No import permit is issued and no prior appointment is needed for a non-commercial movement of up to five pets."
      fr: "Aucun permis d'import n'est délivré et aucun rendez-vous préalable n'est nécessaire pour un mouvement non commercial d'au plus cinq animaux."
      es: "No se expide permiso de importación ni se necesita cita previa para un movimiento no comercial de hasta cinco mascotas."
      pt: "Não é emitida autorização de importação e não é preciso agendamento prévio para a circulação não comercial de até cinco animais de estimação."
    - en: "Carry original documents (not copies); an official translation may be requested if they are not in Slovene or English."
      fr: "Munis-toi des documents originaux (pas de copies) ; une traduction officielle peut être demandée s'ils ne sont pas en slovène ou en anglais."
      es: "Lleva los documentos originales (no copias); puede solicitarse una traducción oficial si no están en esloveno o en inglés."
      pt: "Leve os documentos originais (não cópias); pode ser exigida uma tradução oficial se eles não estiverem em esloveno ou inglês."
    - en: "If documents are missing or invalid, animals that do not pass the checks are not allowed to enter the customs territory of the Union."
      fr: "Si les documents manquent ou sont invalides, un animal qui ne passe pas les contrôles n'est pas autorisé à entrer sur le territoire douanier de l'Union."
      es: "Si faltan documentos o no son válidos, los animales que no superan los controles no pueden entrar en el territorio aduanero de la Unión."
      pt: "Se faltarem documentos ou eles não forem válidos, os animais que não passarem nos controles não podem entrar no território aduaneiro da União."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Slovenia has no breed-specific ban and no official list of dangerous breeds. Under the Animal Protection Act (Zakon o zaščiti živali, ZZZiv), 'dangerous dog' status is decided by an individual dog's behaviour, not by its breed. So no breed is prohibited from entering Slovenia on breed grounds."
    fr: "La Slovénie n'applique aucune interdiction visant une race et ne tient aucune liste officielle de races dangereuses. Selon la loi sur la protection des animaux (Zakon o zaščiti živali, ZZZiv), le statut de « chien dangereux » dépend du comportement individuel du chien, pas de sa race. Aucune race n'est donc interdite d'entrée en Slovénie pour un motif racial."
    es: "Eslovenia no aplica ninguna prohibición por raza ni mantiene ninguna lista oficial de razas peligrosas. Según la Ley de Protección de los Animales (Zakon o zaščiti živali, ZZZiv), la condición de «perro peligroso» se decide por el comportamiento individual del perro, no por su raza. Por tanto, ninguna raza tiene prohibida la entrada en Eslovenia por motivos de raza."
    pt: "A Eslovênia não tem proibição por raça nem lista oficial de raças perigosas. Segundo a Lei de Proteção Animal (Zakon o zaščiti živali, ZZZiv), a condição de “cachorro perigoso” é definida pelo comportamento de cada cachorro, e não pela sua raça. Portanto, nenhuma raça está proibida de entrar na Eslovênia por motivo de raça."
  cat1:
    en: "No breed ban: unlike some EU countries, Slovenia does not prohibit or restrict any breed by name (no pit-bull, Rottweiler, Tosa or similar list). Every dog is welcome subject only to the EU pet-movement rules above. All dogs must be entered in the central dog register and kept on a lead in public places."
    fr: "Aucune interdiction de race : contrairement à certains pays de l'UE, la Slovénie n'interdit ni ne restreint aucune race nommément (pas de liste pit-bull, Rottweiler, Tosa ou similaire). Tout chien est admis sous réserve des seules règles européennes ci-dessus. Tout chien doit être inscrit au registre central des chiens et tenu en laisse dans les lieux publics."
    es: "Sin prohibición de raza: a diferencia de algunos países de la UE, Eslovenia no prohíbe ni restringe ninguna raza por su nombre (sin lista de pit bull, Rottweiler, Tosa o similares). Todo perro es bienvenido con sujeción únicamente a las normas europeas de movimiento de animales anteriores. Todos los perros deben inscribirse en el registro central de perros y mantenerse con correa en los lugares públicos."
    pt: "Sem proibição de raças: diferentemente de alguns países da UE, a Eslovênia não proíbe nem restringe nenhuma raça pelo nome (não há lista de pit bull, rottweiler, tosa ou semelhantes). Todo cachorro é bem-vindo, sujeito apenas às regras europeias de circulação de animais indicadas acima. Todos os cachorros devem ser inscritos no registro central de cães e mantidos na coleira em locais públicos."
  cat2:
    en: "Dangerous-dog conditions (any breed): a dog legally classed as dangerous — one that has bitten a person or animal (excluding service dogs on duty and dogs biting an intruder) — must in public be on a lead AND muzzled, or kept in an enclosure fenced at least 1.8 m high with a warning sign. It may not be handled by anyone under 16, and mandatory behavioural training applies after a bite."
    fr: "Conditions pour chien dangereux (toute race) : un chien légalement classé dangereux — ayant mordu une personne ou un animal (hors chiens de service en fonction et chiens mordant un intrus) — doit en public être tenu en laisse ET muselé, ou gardé dans un enclos clôturé d'au moins 1,8 m avec un panneau d'avertissement. Il ne peut être confié à une personne de moins de 16 ans, et une rééducation comportementale obligatoire s'applique après une morsure."
    es: "Condiciones para perro peligroso (cualquier raza): un perro clasificado legalmente como peligroso — que haya mordido a una persona o a un animal (salvo los perros de servicio en funciones y los perros que muerden a un intruso) — debe llevar en público correa Y bozal, o mantenerse en un recinto vallado de al menos 1,8 m de altura con una señal de advertencia. No puede confiarse a nadie menor de 16 años, y tras una mordedura se aplica una reeducación conductual obligatoria."
    pt: "Condições para cachorro perigoso (qualquer raça): um cachorro classificado legalmente como perigoso — aquele que mordeu uma pessoa ou um animal (excluídos os cães de serviço em atividade e os cachorros que mordem um invasor) — deve, em local público, estar na coleira E com focinheira, ou ficar em um recinto cercado com pelo menos 1,8 m de altura e placa de advertência. Não pode ser conduzido por menores de 16 anos, e um treinamento comportamental obrigatório se aplica depois de uma mordida."
  note:
    en: "Because the classification is behaviour-based, a dog is only declared dangerous after a documented bite — not on arrival for how it looks. For confirmation, contact the Administration for Food Safety, Veterinary Sector and Plant Protection (UVHVVR)."
    fr: "La classification étant comportementale, un chien n'est déclaré dangereux qu'après une morsure documentée — pas à l'arrivée selon son apparence. Pour confirmation, contacte l'Administration pour la sécurité alimentaire, le secteur vétérinaire et la protection des végétaux (UVHVVR)."
    es: "Como la clasificación se basa en el comportamiento, un perro solo se declara peligroso tras una mordedura documentada — no a la llegada por su aspecto. Para confirmarlo, ponte en contacto con la Administración para la Seguridad Alimentaria, el Sector Veterinario y la Protección Vegetal (UVHVVR)."
    pt: "Como a classificação se baseia no comportamento, um cachorro só é declarado perigoso depois de uma mordida documentada — nunca na chegada, por causa da aparência. Para confirmar, entre em contato com a Administração de Segurança dos Alimentos, Setor Veterinário e Proteção Vegetal (Uprava za varno hrano, veterinarstvo in varstvo rastlin — UVHVVR)."

