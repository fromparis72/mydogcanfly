    when: { en: "12-week rabies shot + 21-day wait (listed); about 7 months from a non-listed country.", fr: "Vaccin à 12 semaines + 21 jours (pays listé) ; environ 7 mois depuis un pays non listé.", es: "Vacuna a las 12 semanas + espera de 21 días (país listado); unos 7 meses desde un país no listado.", pt: "Vacina antirrábica às 12 semanas + 21 dias de espera (país listado); cerca de 7 meses vindo de um país não listado." }
    exceptions: { en: "Puppies under 12 weeks cannot be vaccinated, so cannot enter from outside the EU.", fr: "Un chiot de moins de 12 semaines ne peut être vacciné, donc ne peut entrer depuis hors UE.", es: "Un cachorro de menos de 12 semanas no puede vacunarse, así que no puede entrar desde fuera de la UE.", pt: "Filhotes com menos de 12 semanas não podem ser vacinados e, portanto, não podem entrar vindos de fora da UE." }
    ref: { en: "EU Reg. 576/2013; gov.si (UVHVVR)", fr: "Règl. UE 576/2013 ; gov.si (UVHVVR)", es: "Regl. UE 576/2013; gov.si (UVHVVR)", pt: "Regulamento UE 576/2013; gov.si (UVHVVR)" }
