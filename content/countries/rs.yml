# Country Entry Guide — Serbia (trilingual EN/FR/ES).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_rs
iso2: "RS"
name: { en: "Serbia", fr: "Serbie", es: "Serbia", pt: "Sérvia" }
region: { en: "Europe (non-EU)", fr: "Europe (hors UE)", es: "Europa (fuera de la UE)", pt: "Europa (fora da UE)" }


regime: listed
exit:
  authority: Uprava za veterinu
  authorityUrl: https://www.vet.minpolj.gov.rs/movement-of-pets/
  intro:
    en: "Serbia is a listed country, so no rabies titer is needed to return to the EU — the EU health certificate is issued by an official veterinarian of the Veterinary Directorate."
    fr: "La Serbie est un pays listé : pas de titrage pour rentrer dans l'UE — le certificat sanitaire UE est délivré par un vétérinaire officiel de la Direction vétérinaire."
    es: "Serbia es un país listado: no hace falta titulación para volver a la UE — el certificado sanitario UE lo emite un veterinario oficial de la Dirección Veterinaria."
    pt: "A Sérvia é um país listado: não é preciso teste sorológico antirrábico para voltar à UE — o certificado sanitário europeu é emitido por um veterinário oficial da Uprava za veterinu (Direção Veterinária)."
  steps:
    - timing: window
      scope: eu
      text:
        en: "Your dog needs a microchip and valid rabies vaccination (at least 21 days after the primary shot); the EU-model health certificate is completed and endorsed by an official veterinarian of the Veterinary Directorate before departure."
        fr: "Ton chien doit être pucé et vacciné contre la rage (au moins 21 jours après la primo-vaccination) ; le certificat sanitaire au modèle UE est rempli et visé par un vétérinaire officiel de la Direction vétérinaire avant le départ."
        es: "Tu perro necesita microchip y vacuna antirrábica válida (al menos 21 días tras la primovacunación); el certificado sanitario en modelo UE lo rellena y refrenda un veterinario oficial de la Dirección Veterinaria antes de salir."
        pt: "Seu cachorro precisa de microchip e de vacinação antirrábica válida (no mínimo 21 dias após a primovacinação); o certificado sanitário no modelo da UE é preenchido e endossado por um veterinário oficial da Uprava za veterinu antes da partida."
    - timing: window
      scope: non_eu
      text:
        en: "Your dog needs a microchip and a valid rabies vaccination (at least 21 days after the primary shot); the health certificate is completed and endorsed by an official veterinarian of the Veterinary Directorate before departure."
        fr: "Ton chien a besoin d'une puce et d'une vaccination antirabique valide (au moins 21 jours après la primo-injection) ; le certificat sanitaire est rempli et visé par un vétérinaire officiel de la Direction vétérinaire avant le départ."
        es: "Tu perro necesita microchip y vacunación antirrábica válida (al menos 21 días después de la primera dosis); el certificado sanitario lo completa y valida un veterinario oficial de la Dirección Veterinaria antes de la salida."
        pt: "Seu cachorro precisa de microchip e vacinação antirrábica válida (no mínimo 21 dias após a primeira dose); o certificado sanitário é preenchido e endossado por um veterinário oficial da Direção Veterinária antes da partida."
  onSiteNote:
    en: "The certificate is valid 10 days to reach the EU border check — arrange it close to departure."
    fr: "Le certificat est valable 10 jours pour atteindre le contrôle à la frontière UE — organise-le peu avant le départ."
    es: "El certificado vale 10 días para llegar al control fronterizo de la UE — organízalo cerca de la salida."
    pt: "O certificado vale 10 dias para chegar ao controle de fronteira da UE — providencie-o pouco antes da partida."

hero:
  h1: { en: "Traveling to Serbia with your dog", fr: "Voyager en Serbie avec ton chien", es: "Viajar a Serbia con tu perro", pt: "Viajar para a Sérvia com seu cachorro" }
  intro:
    en: >-
      Serbia welcomes dogs, but what you need to prepare depends mainly on the country your dog is
      travelling from — not only on Serbia itself. Serbia is not an EU member, yet it applies
      EU-aligned pet-movement rules: an ISO microchip and a valid rabies vaccination are always
      required. A dog coming from an EU country (or from Switzerland, Norway and similar territories)
      simply needs a properly completed pet passport. A dog from a listed country (such as the United
      States, Canada, Japan or Australia) also needs a veterinary certificate from the origin country,
      but no blood test. A dog from a non-listed country faces the longest path, including a rabies
      antibody test and a three-month wait. This guide explains each case so you know exactly what to
      prepare before you book your flight.
    fr: >-
      La Serbie accueille les chiens, mais ce qu'il faut préparer dépend surtout du pays d'où ton
      chien voyage — pas seulement de la Serbie. La Serbie n'est pas membre de l'UE, mais elle applique
      des règles de mouvement des animaux alignées sur celles de l'UE : une puce ISO et une vaccination
      antirabique valide sont toujours exigées. Un chien venant d'un pays de l'UE (ou de Suisse, de
      Norvège et de territoires assimilés) a simplement besoin d'un passeport correctement rempli. Un
      chien venant d'un pays listé (États-Unis, Canada, Japon, Australie…) a aussi besoin d'un
      certificat vétérinaire du pays d'origine, mais pas de prise de sang. Un chien en provenance d'un
      pays non listé suit le parcours le plus long, avec un titrage antirabique et un délai de trois
      mois. Ce guide détaille chaque cas pour savoir exactement quoi préparer avant de réserver ton vol.
    es: >-
      Serbia acoge a los perros, pero lo que debes preparar depende sobre todo del país desde el que
      viaja tu perro — no solo de Serbia. Serbia no es miembro de la UE, pero aplica normas de
      movimiento de animales alineadas con las de la UE: siempre se exigen un microchip ISO y una
      vacunación antirrábica válida. Un perro que llega de un país de la UE (o de Suiza, Noruega y
      territorios asimilados) solo necesita un pasaporte correctamente cumplimentado. Un perro que llega
      de un país listado (como Estados Unidos, Canadá, Japón o Australia) necesita además un certificado
      veterinario del país de origen, pero no una prueba de sangre. Un perro de un país no listado se
      enfrenta al camino más largo, que incluye una prueba de titulación de rabia y una espera de tres
      meses. Esta guía explica cada caso para que sepas exactamente qué preparar antes de reservar tu vuelo.

    pt: "A Sérvia recebe bem os cachorros, mas o que você precisa preparar depende principalmente do país de onde seu cachorro está viajando — e não apenas da Sérvia em si. A Sérvia não é membro da UE, mas aplica regras de circulação de animais de estimação alinhadas com as europeias: microchip ISO e vacinação antirrábica válida são sempre obrigatórios. Um cachorro vindo de um país da UE (ou da Suíça, da Noruega e de territórios semelhantes) precisa apenas de um passaporte para animais corretamente preenchido. Um cachorro vindo de um país listado (como Estados Unidos, Canadá, Japão ou Austrália) precisa também de um certificado veterinário do país de origem, mas sem exame de sangue. Um cachorro vindo de um país não listado enfrenta o caminho mais longo, que inclui um teste sorológico antirrábico e uma espera de três meses. Este guia explica cada caso para você saber exatamente o que preparar antes de comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Easy to difficult (depends on origin)", fr: "Facile à difficile (selon l'origine)", es: "De fácil a difícil (según el origen)", pt: "De fácil a difícil (depende da origem)" }

prepTime:
  eu:
    en: "A few days if the passport is up to date, up to ~3 weeks if the first rabies shot is still needed (21-day wait)."
    fr: "Quelques jours si le passeport est à jour, jusqu'à ~3 semaines si la première vaccination reste à faire (délai de 21 jours)."
    es: "Unos días si el pasaporte está al día, hasta ~3 semanas si aún falta la primera vacuna antirrábica (espera de 21 días)."
    pt: "Alguns dias se o passaporte estiver em dia, até cerca de 3 semanas se ainda faltar a primeira vacina antirrábica (21 dias de espera)."
  listed:
    en: "~3 weeks: 21-day wait after the rabies shot, plus a veterinary certificate issued by the origin country's authority."
    fr: "~3 semaines : délai de 21 jours après le vaccin, plus un certificat vétérinaire délivré par l'autorité du pays d'origine."
    es: "~3 semanas: espera de 21 días tras la vacuna antirrábica, más un certificado veterinario expedido por la autoridad del país de origen."
    pt: "Cerca de 3 semanas: 21 dias de espera depois da vacina antirrábica, mais um certificado veterinário emitido pela autoridade do país de origem."
  nonListed:
    en: "~4–5 months: antibody test at least 30 days after vaccination, then a compulsory 3-month wait before entry."
    fr: "~4–5 mois : titrage au moins 30 jours après le vaccin, puis un délai obligatoire de 3 mois avant l'entrée."
    es: "~4–5 meses: prueba de titulación al menos 30 días después de la vacuna, y luego una espera obligatoria de 3 meses antes de la entrada."
    pt: "Cerca de 4 a 5 meses: teste sorológico no mínimo 30 dias depois da vacinação, seguido de 3 meses obrigatórios de espera antes da entrada."

