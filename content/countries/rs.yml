    exceptions: { en: "A passport alone is not enough to cross the border.", fr: "Le seul passeport ne suffit pas pour franchir la frontière.", es: "El pasaporte por sí solo no basta para cruzar la frontera.", pt: "O passaporte sozinho não basta para cruzar a fronteira." }
    ref: { en: "Uprava carina — Pets; Uprava za veterinu", fr: "Uprava carina — Animaux ; Uprava za veterinu", es: "Uprava carina — Mascotas; Uprava za veterinu", pt: "Uprava carina (alfândega sérvia) — Animais de estimação; Uprava za veterinu" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "Effectively ≥15 weeks", fr: "En pratique ≥15 semaines", es: "En la práctica ≥15 semanas", pt: "Na prática, ≥15 semanas" }
    when: { en: "Rabies shot from 12 weeks + 21-day wait. Under 12 or 12–16 weeks only under strict conditions.", fr: "Vaccin dès 12 semaines + 21 jours d'attente. Moins de 12 ou 12–16 semaines seulement sous conditions strictes.", es: "Vacuna desde las 12 semanas + espera de 21 días. Menos de 12 o 12–16 semanas solo bajo condiciones estrictas.", pt: "Vacina antirrábica a partir das 12 semanas + 21 dias de espera. Abaixo de 12 semanas, ou entre 12 e 16 semanas, apenas sob condições estritas." }
    exceptions: { en: "Young dogs may enter from EU/assimilated origins (and favourable Annex 2 origins) with a signed no-contact declaration or accompanied by their vaccinated mother.", fr: "Les jeunes chiens peuvent entrer depuis l'UE/assimilé (et les origines annexe 2 favorables) avec une déclaration d'absence de contact signée ou accompagnés de leur mère vaccinée.", es: "Los perros jóvenes pueden entrar desde orígenes UE/asimilados (y orígenes favorables del anexo 2) con una declaración firmada de ausencia de contacto o acompañados de su madre vacunada.", pt: "Cachorros jovens podem entrar vindos de origens na UE ou assimiladas (e de origens favoráveis do anexo 2) com uma declaração assinada de ausência de contato ou acompanhados da mãe vacinada." }
    ref: { en: "Uprava za veterinu — Movement of pets, Annex 5", fr: "Uprava za veterinu — Mouvement des animaux, annexe 5", es: "Uprava za veterinu — Movimiento de animales de compañía, anexo 5", pt: "Uprava za veterinu — Circulação de animais de estimação, anexo 5" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
