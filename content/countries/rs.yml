factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Serbia (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — la Serbie (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Serbia (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — a Sérvia (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — Serbia", fr: "Pays de destination — Serbie", es: "País de destino — Serbia", pt: "País de destino — Sérvia" }
      text:
        en: "Serbia applies EU-aligned pet-movement rules: an ISO microchip and a valid rabies vaccination are always required, and no tapeworm treatment is needed to enter Serbia."
        fr: "La Serbie applique des règles alignées sur celles de l'UE : puce ISO et vaccination antirabique valide toujours exigées, et aucun traitement contre l'échinococcose n'est requis pour entrer en Serbie."
        es: "Serbia aplica normas de movimiento de animales alineadas con las de la UE: siempre se exigen un microchip ISO y una vacunación antirrábica válida, y no se necesita tratamiento contra la tenia para entrar en Serbia."
        pt: "A Sérvia aplica regras de circulação de animais de estimação alinhadas com as da UE: microchip ISO e vacinação antirrábica válida são sempre obrigatórios, e nenhum tratamento contra a tênia é exigido para entrar na Sérvia."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Whether your dog leaves from an EU/assimilated country, a country on Serbia's Annex 2 list, or a non-listed country decides whether an antibody test and a certificate are required."
        fr: "Que ton chien parte d'un pays de l'UE/assimilé, d'un pays figurant sur l'annexe 2 serbe ou d'un pays non listé détermine si un titrage et un certificat sont exigés."
        es: "Que tu perro salga de un país de la UE/asimilado, de un país que figure en el anexo 2 serbio o de un país no listado determina si se exigen una prueba de titulación y un certificado."
        pt: "Partir de um país da UE ou assimilado, de um país da lista do anexo 2 da Sérvia ou de um país não listado é o que define se o teste sorológico e o certificado são exigidos."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay in a non-listed rabies-risk country can trigger an antibody test even if you fly in from an exempt country. It is your dog's real origin and history that count — not only the last airport."
        fr: "Un séjour récent dans un pays non listé à risque rabique peut imposer un titrage même si tu arrives d'un pays exempté. C'est l'origine réelle et l'historique du chien qui comptent — pas seulement l'aéroport de destination finale."
        es: "Una estancia reciente en un país no listado con riesgo de rabia puede obligar a una prueba de titulación aunque llegues desde un país exento. Lo que cuenta es el origen y el historial reales de tu perro — no solo el último aeropuerto."
        pt: "Uma estadia recente em um país não listado de risco de raiva pode acionar a exigência do teste sorológico mesmo que você chegue de um país isento. O que conta é a origem e o histórico reais do seu cachorro — não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Serbia's framework, then confirm your dog's exact origin and history with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre serbe, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Serbia y luego confirma el origen y el historial exactos de tu perro con tu veterinario."
    pt: "Então leia as exigências abaixo como o quadro geral da Sérvia e depois confirme a origem exata e o histórico do seu cachorro com o seu veterinário."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Compliant with ISO 11784/11785; must be implanted before (or at the latest on the day of) the rabies vaccination.", fr: "Conforme ISO 11784/11785 ; doit être posée avant (ou au plus tard le jour de) la vaccination antirabique.", es: "Conforme con ISO 11784/11785; debe implantarse antes (o, como muy tarde, el mismo día) de la vacunación antirrábica.", pt: "Em conformidade com a ISO 11784/11785; precisa ser implantado antes da vacinação antirrábica (ou, no máximo, no mesmo dia)." }
    exceptions: { en: "A clearly legible tattoo is accepted only if applied before 3 July 2011.", fr: "Un tatouage clairement lisible n'est accepté que s'il est antérieur au 3 juillet 2011.", es: "Un tatuaje claramente legible solo se acepta si se hizo antes del 3 de julio de 2011.", pt: "Uma tatuagem claramente legível só é aceita se tiver sido feita antes de 3 de julho de 2011." }
    ref: { en: "Uprava za veterinu — Movement of pets", fr: "Uprava za veterinu — Mouvement des animaux", es: "Uprava za veterinu — Movimiento de animales de compañía", pt: "Uprava za veterinu — Circulação de animais de estimação" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Inactivated or recombinant vaccine with ≥1 antigenic unit per dose; 21 days must have passed since the primary vaccination.", fr: "Vaccin inactivé ou recombinant à ≥1 unité antigénique par dose ; 21 jours doivent s'être écoulés depuis la primo-vaccination.", es: "Vacuna inactivada o recombinante con ≥1 unidad antigénica por dosis; deben haber transcurrido 21 días desde la primovacunación.", pt: "Vacina inativada ou recombinante com ≥1 unidade antigênica por dose; precisam ter passado 21 dias desde a primovacinação." }
    exceptions: { en: "The microchip must already be in place before the shot; otherwise the vaccination may be considered invalid.", fr: "La puce doit être posée avant le vaccin ; sinon la vaccination peut être jugée invalide.", es: "El microchip debe estar implantado antes de la vacuna; de lo contrario, la vacunación puede considerarse inválida.", pt: "O microchip já deve estar implantado antes da aplicação; caso contrário, a vacinação pode ser considerada inválida." }
    ref: { en: "Uprava za veterinu — Movement of pets", fr: "Uprava za veterinu — Mouvement des animaux", es: "Uprava za veterinu — Movimiento de animales de compañía", pt: "Uprava za veterinu — Circulação de animais de estimação" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Non-listed origins only: blood ≥30 days after vaccination and ≥3 months before entry, result ≥0.5 IU/ml, EU-authorised lab.", fr: "Pays non listés : sang ≥30 jours après le vaccin et ≥3 mois avant l'entrée, résultat ≥0,5 UI/ml, labo agréé UE.", es: "Solo orígenes no listados: sangre ≥30 días tras la vacuna y ≥3 meses antes de la entrada, resultado ≥0,5 UI/ml, laboratorio autorizado por la UE.", pt: "Apenas para origens não listadas: sangue coletado ≥30 dias após a vacinação e ≥3 meses antes da entrada, resultado ≥0,5 UI/ml, em laboratório autorizado pela UE." }
    exceptions: { en: "Not required from the EU/assimilated territories or from Serbia's Annex 2 listed countries (US, Canada, Japan, Australia…).", fr: "Non requis depuis l'UE/territoires assimilés ou les pays listés à l'annexe 2 serbe (USA, Canada, Japon, Australie…).", es: "No se exige desde la UE/territorios asimilados ni desde los países listados en el anexo 2 serbio (EE. UU., Canadá, Japón, Australia…).", pt: "Não exigido para quem vem da UE e dos territórios assimilados nem dos países listados no anexo 2 da Sérvia (EUA, Canadá, Japão, Austrália…)." }
    ref: { en: "Uprava za veterinu — Movement of pets, Annex 2", fr: "Uprava za veterinu — Mouvement des animaux, annexe 2", es: "Uprava za veterinu — Movimiento de animales de compañía, anexo 2", pt: "Uprava za veterinu — Circulação de animais de estimação, anexo 2" }
  - item: { en: "Pet passport", fr: "Passeport pour animal", es: "Pasaporte para mascotas", pt: "Passaporte para animais" }
    required: { en: "EU / assimilated origins", fr: "Origines UE / assimilées", es: "Orígenes UE / asimilados", pt: "Origens na UE / assimiladas" }
    when: { en: "A correctly completed passport issued by an authorised vet, recording the microchip and rabies vaccination.", fr: "Un passeport correctement rempli délivré par un vétérinaire agréé, consignant la puce et la vaccination.", es: "Un pasaporte correctamente cumplimentado, expedido por un veterinario autorizado, que registre el microchip y la vacunación antirrábica.", pt: "Passaporte corretamente preenchido, emitido por um veterinário autorizado, registrando o microchip e a vacinação antirrábica." }
    exceptions: { en: "For these origins no separate veterinary certificate is required.", fr: "Pour ces origines, aucun certificat vétérinaire distinct n'est exigé.", es: "Para estos orígenes no se exige un certificado veterinario aparte.", pt: "Para essas origens não é exigido certificado veterinário à parte." }
    ref: { en: "Uprava za veterinu — Movement of pets", fr: "Uprava za veterinu — Mouvement des animaux", es: "Uprava za veterinu — Movimiento de animales de compañía", pt: "Uprava za veterinu — Circulação de animais de estimação" }
  - item: { en: "Veterinary certificate (origin authority)", fr: "Certificat vétérinaire (autorité d'origine)", es: "Certificado veterinario (autoridad de origen)", pt: "Certificado veterinário (autoridade de origem)" }
    required: { en: "Non-EU origins", fr: "Origines hors UE", es: "Orígenes fuera de la UE", pt: "Origens fora da UE" }
    when: { en: "Issued by the competent authority of the country of origin; for the US it must be issued and endorsed within 10 days of travel.", fr: "Délivré par l'autorité compétente du pays d'origine ; pour les USA, établi et visé dans les 10 jours précédant le voyage.", es: "Expedido por la autoridad competente del país de origen; para EE. UU. debe emitirse y refrendarse dentro de los 10 días previos al viaje.", pt: "Emitido pela autoridade competente do país de origem; no caso dos EUA, precisa ser emitido e endossado nos 10 dias anteriores à viagem." }
    exceptions: { en: "Not needed for EU/assimilated origins (passport instead).", fr: "Inutile pour les origines UE/assimilées (passeport à la place).", es: "No necesario para orígenes de la UE/asimilados (en su lugar, el pasaporte).", pt: "Não é necessário para origens na UE ou assimiladas (usa-se o passaporte)." }
    ref: { en: "Uprava za veterinu — Movement of pets; APHIS (US)", fr: "Uprava za veterinu — Mouvement des animaux ; APHIS (USA)", es: "Uprava za veterinu — Movimiento de animales de compañía; APHIS (EE. UU.)", pt: "Uprava za veterinu — Circulação de animais de estimação; APHIS (EUA)" }
  - item: { en: "Tapeworm (Echinococcus) treatment", fr: "Traitement échinococcose", es: "Tratamiento contra la tenia (Echinococcus)", pt: "Tratamento contra a tênia (Echinococcus)" }
    required: { en: "Not required", fr: "Non requis", es: "No obligatorio", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Serbia does not require Echinococcus treatment for entry.", fr: "La Serbie n'exige pas de traitement contre l'échinococcose à l'entrée.", es: "Serbia no exige tratamiento contra el Echinococcus para la entrada.", pt: "A Sérvia não exige tratamento contra Echinococcus para a entrada." }
    ref: { en: "Uprava za veterinu — Movement of pets", fr: "Uprava za veterinu — Mouvement des animaux", es: "Uprava za veterinu — Movimiento de animales de compañía", pt: "Uprava za veterinu — Circulação de animais de estimação" }
  - item: { en: "Advance notification / import permit", fr: "Notification préalable / permis d'import", es: "Notificación previa / permiso de importación", pt: "Notificação prévia / autorização de importação" }
    required: { en: "Commercial imports only", fr: "Importations commerciales uniquement", es: "Solo importaciones comerciales", pt: "Somente para importações comerciais" }
    when: { en: "Change of owner, sale/gift, >5 pets or an unaccompanied animal: apply to the Veterinary Directorate (rešenje), ~10 working days, 7,700 RSD fee.", fr: "Changement de propriétaire, vente/don, >5 animaux ou animal non accompagné : demande à l'Uprava za veterinu (rešenje), ~10 jours ouvrés, taxe de 7 700 RSD.", es: "Cambio de propietario, venta/donación, >5 mascotas o un animal no acompañado: solicitud a la Uprava za veterinu (rešenje), ~10 días hábiles, tasa de 7.700 RSD.", pt: "Mudança de dono, venda/doação, mais de 5 animais ou animal desacompanhado: solicite à Uprava za veterinu (rešenje), cerca de 10 dias úteis, taxa de 7.700 RSD." }
    exceptions: { en: "Non-commercial movement (up to 5 accompanied pets) needs no import permit.", fr: "Le mouvement non commercial (jusqu'à 5 animaux accompagnés) ne nécessite aucun permis d'import.", es: "El movimiento no comercial (hasta 5 mascotas acompañadas) no necesita permiso de importación.", pt: "A circulação não comercial (até 5 animais acompanhados) não exige autorização de importação." }
