origin:
  scheme: eu
  eu:
    title: { en: "Simplified — pet passport", fr: "Simplifié — passeport", es: "Simplificado — pasaporte", pt: "Simplificado — passaporte para animais" }
    body:
      en: "A dog coming from an EU member state — or from Andorra, Switzerland, the Faroe Islands, Gibraltar, Greenland, Iceland, Liechtenstein, Monaco, Norway, San Marino or the Vatican — needs a valid ISO microchip, an in-date rabies vaccination (21 days after the primary shot) and a correctly completed pet passport. No antibody test and no separate veterinary certificate are required."
      fr: "Un chien venant d'un État membre de l'UE — ou d'Andorre, Suisse, Îles Féroé, Gibraltar, Groenland, Islande, Liechtenstein, Monaco, Norvège, Saint-Marin ou du Vatican — a besoin d'une puce ISO valide, d'une vaccination antirabique à jour (21 jours après la primo-vaccination) et d'un passeport correctement rempli. Ni titrage ni certificat vétérinaire distinct ne sont requis."
      es: "Un perro que llega de un Estado miembro de la UE — o de Andorra, Suiza, las Islas Feroe, Gibraltar, Groenlandia, Islandia, Liechtenstein, Mónaco, Noruega, San Marino o el Vaticano — necesita un microchip ISO válido, una vacunación antirrábica en vigor (21 días después de la primovacunación) y un pasaporte correctamente cumplimentado. No se exigen prueba de titulación ni certificado veterinario aparte."
      pt: "Um cachorro vindo de um Estado-membro da UE — ou de Andorra, Suíça, Ilhas Faroé, Gibraltar, Groenlândia, Islândia, Liechtenstein, Mônaco, Noruega, San Marino ou Vaticano — precisa de microchip ISO válido, vacinação antirrábica em dia (21 dias após a primovacinação) e passaporte para animais corretamente preenchido. Não são exigidos teste sorológico nem certificado veterinário à parte."
    cls: ok
  listed:
    title: { en: "Certificate, no blood test", fr: "Certificat, sans prise de sang", es: "Certificado, sin análisis de sangre", pt: "Certificado, sem exame de sangue" }
    body:
      en: "From a country on Serbia's Annex 2 list (United States, Canada, Japan, Australia, Russia, North Macedonia, Bosnia and Herzegovina and many others), your dog needs a microchip, a valid rabies vaccination and a veterinary certificate issued by the competent authority of the country of origin. No antibody test is required."
      fr: "Depuis un pays figurant sur l'annexe 2 serbe (États-Unis, Canada, Japon, Australie, Russie, Macédoine du Nord, Bosnie-Herzégovine et bien d'autres), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat vétérinaire délivré par l'autorité compétente du pays d'origine. Pas de titrage."
      es: "Desde un país que figure en el anexo 2 serbio (Estados Unidos, Canadá, Japón, Australia, Rusia, Macedonia del Norte, Bosnia y Herzegovina y muchos otros), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado veterinario expedido por la autoridad competente del país de origen. No se exige prueba de titulación."
      pt: "Vindo de um país da lista do anexo 2 da Sérvia (Estados Unidos, Canadá, Japão, Austrália, Rússia, Macedônia do Norte, Bósnia e Herzegovina e muitos outros), seu cachorro precisa de microchip, vacinação antirrábica válida e certificado veterinário emitido pela autoridade competente do país de origem. Não é exigido teste sorológico."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination and at least 3 months before entry, result ≥0.5 IU/ml at an EU-authorised laboratory. A veterinary certificate from the origin country's authority is also required."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin et au moins 3 mois avant l'entrée, résultat ≥0,5 UI/ml dans un laboratoire agréé UE. Un certificat vétérinaire de l'autorité du pays d'origine est également requis."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna y al menos 3 meses antes de la entrada, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE. También se exige un certificado veterinario de la autoridad del país de origen."
      pt: "Vindo de um país não listado (de risco), acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação e pelo menos 3 meses antes da entrada, resultado ≥0,5 UI/ml em laboratório autorizado pela UE. Também é exigido um certificado veterinário da autoridade do país de origem."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Serbia depends on where you flew from, but every arrival can be checked at the border."
    fr: "Ce qui se passe à l'arrivée de ton chien en Serbie dépend de ton lieu de départ, mais toute arrivée peut être contrôlée à la frontière."
    es: "Lo que ocurre cuando tu perro llega a Serbia depende del lugar desde el que hayas volado, pero toda llegada puede ser controlada en la frontera."
    pt: "O que acontece quando seu cachorro chega à Sérvia depende de onde você veio, mas toda chegada pode ser conferida na fronteira."
  points:
    - en: "The veterinary border inspection and customs may read the microchip and verify the passport or certificate — a passport alone is not enough to cross the border."
      fr: "L'inspection vétérinaire frontalière et la douane peuvent lire la puce et vérifier le passeport ou le certificat — le seul passeport ne suffit pas pour franchir la frontière."
      es: "La inspección veterinaria fronteriza y las aduanas pueden leer el microchip y verificar el pasaporte o el certificado — el pasaporte por sí solo no basta para cruzar la frontera."
      pt: "A inspeção veterinária de fronteira e a alfândega podem ler o microchip e conferir o passaporte ou o certificado — o passaporte sozinho não basta para cruzar a fronteira."
    - en: "Non-commercial movement covers up to five pets accompanying their owner or an authorised person; it needs no import permit."
      fr: "Le mouvement non commercial couvre jusqu'à cinq animaux accompagnant leur propriétaire ou une personne autorisée ; aucun permis d'import n'est requis."
      es: "El movimiento no comercial cubre hasta cinco mascotas que acompañan a su propietario o a una persona autorizada; no necesita permiso de importación."
      pt: "A circulação não comercial abrange até cinco animais que acompanham o dono ou uma pessoa autorizada; não exige autorização de importação."
    - en: "Commercial movement (sale, change of owner, more than five animals, or an unaccompanied animal) requires a prior import decision (rešenje) from the Veterinary Directorate."
      fr: "Le mouvement commercial (vente, changement de propriétaire, plus de cinq animaux ou animal non accompagné) exige une décision d'importation préalable (rešenje) de l'Uprava za veterinu."
      es: "El movimiento comercial (venta, cambio de propietario, más de cinco animales o un animal no acompañado) exige una decisión de importación previa (rešenje) de la Uprava za veterinu."
      pt: "A circulação comercial (venda, mudança de dono, mais de cinco animais ou animal desacompanhado) exige uma decisão prévia de importação (rešenje) da Uprava za veterinu."
    - en: "Carry original documents (not copies); a certified translation may be requested if they are not in Serbian."
      fr: "Munis-toi des documents originaux (pas de copies) ; une traduction certifiée peut être demandée s'ils ne sont pas en serbe."
      es: "Lleva los documentos originales (no copias); puede solicitarse una traducción certificada si no están en serbio."
      pt: "Leve os documentos originais (não cópias); pode ser pedida uma tradução juramentada se eles não estiverem em sérvio."
    - en: "If documents are missing or invalid, the border veterinary inspection may refuse entry or order corrective measures — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, l'inspection vétérinaire frontalière peut refuser l'entrée ou ordonner des mesures correctives — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, la inspección veterinaria fronteriza puede denegar la entrada u ordenar medidas correctoras — a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, a inspeção veterinária de fronteira pode recusar a entrada ou determinar medidas corretivas — às custas do dono."
    - en: "Temporary import/transit bans may apply to shipments from countries with active disease outbreaks (e.g. foot-and-mouth) — check before you travel."
      fr: "Des interdictions temporaires d'importation/transit peuvent viser les envois en provenance de pays touchés par une épizootie active (ex. fièvre aphteuse) — vérifie avant de partir."
      es: "Pueden aplicarse prohibiciones temporales de importación/tránsito a los envíos procedentes de países con brotes activos de enfermedades (p. ej. fiebre aftosa) — comprueba antes de viajar."
      pt: "Proibições temporárias de importação ou de trânsito podem valer para remessas vindas de países com surtos de doenças em curso (por exemplo, febre aftosa) — confira antes de viajar."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Serbia has no national breed-specific law banning or categorising dangerous dogs, and there is no national ban on importing particular breeds. Keeping of potentially dangerous dogs is regulated mainly at provincial and local (municipal) level."
    fr: "La Serbie n'a pas de loi nationale spécifique interdisant ou catégorisant les chiens dangereux, et il n'existe aucune interdiction nationale d'importer des races particulières. La détention de chiens potentiellement dangereux est réglementée surtout au niveau provincial et local (communal)."
    es: "Serbia no tiene una ley nacional específica que prohíba o categorice a los perros peligrosos, y no existe ninguna prohibición nacional de importar razas concretas. La tenencia de perros potencialmente peligrosos se regula sobre todo a nivel provincial y local (municipal)."
    pt: "A Sérvia não tem uma lei nacional específica por raça que proíba ou classifique cachorros perigosos, e não existe proibição nacional de importar determinadas raças. A posse de cachorros potencialmente perigosos é regulada principalmente em nível provincial e local (municipal)."
  cat1:
    en: "There is no national Category 1 equivalent and no breed is banned from entry at the national level. Import formalities follow the standard veterinary rules (microchip, rabies vaccination, certificate/passport) regardless of breed."
    fr: "Il n'existe pas d'équivalent national de la catégorie 1 et aucune race n'est interdite d'entrée au niveau national. Les formalités d'importation suivent les règles vétérinaires standard (puce, vaccination antirabique, certificat/passeport) quelle que soit la race."
    es: "No existe un equivalente nacional de la categoría 1 y ninguna raza está prohibida de entrada a nivel nacional. Los trámites de importación siguen las normas veterinarias estándar (microchip, vacunación antirrábica, certificado/pasaporte) sea cual sea la raza."
    pt: "Não existe equivalente nacional a uma categoria 1 e nenhuma raça é proibida de entrar em nível nacional. As formalidades de importação seguem as regras veterinárias padrão (microchip, vacinação antirrábica, certificado/passaporte), qualquer que seja a raça."
  cat2:
    en: "Local rules (for example in Vojvodina and the City of Belgrade) can require owners of dogs deemed dangerous to hold a permit, take out third-party insurance, and keep the dog leashed and usually muzzled in public. These are keeping rules for residents, not entry conditions."
    fr: "Des règles locales (par exemple en Voïvodine et dans la Ville de Belgrade) peuvent imposer aux propriétaires de chiens jugés dangereux de détenir un permis, de souscrire une assurance responsabilité civile et de tenir le chien en laisse, généralement muselé, en public. Ce sont des règles de détention pour les résidents, pas des conditions d'entrée."
    es: "Las normas locales (por ejemplo en Voivodina y en la Ciudad de Belgrado) pueden exigir a los propietarios de perros considerados peligrosos disponer de un permiso, contratar un seguro de responsabilidad civil y mantener al perro con correa y, por lo general, con bozal en público. Son normas de tenencia para residentes, no condiciones de entrada."
    pt: "As regras locais (por exemplo, na Voivodina e na cidade de Belgrado) podem exigir que os donos de cachorros considerados perigosos tenham uma autorização, contratem seguro de responsabilidade civil contra terceiros e mantenham o cachorro na guia e, em geral, com focinheira em local público. São regras de posse para os residentes, não condições de entrada."
  note:
    en: "Because rules vary by municipality, confirm local keeping obligations with the relevant authority if you plan to stay with a powerful or guard-type dog. As official Serbian sources publish no national restricted-breed list, we mark that detail as not published rather than infer one."
    fr: "Les règles variant selon la commune, confirme les obligations locales de détention auprès de l'autorité compétente si tu séjourne avec un chien puissant ou de type garde. Les sources officielles serbes ne publiant aucune liste nationale de races réglementées, nous indiquons ce point comme non communiqué plutôt que de l'inférer."
    es: "Como las normas varían según el municipio, confirma las obligaciones locales de tenencia con la autoridad competente si vas a alojarte con un perro potente o de tipo guardián. Como las fuentes oficiales serbias no publican ninguna lista nacional de razas restringidas, marcamos ese dato como no publicado en lugar de inferirlo."
    pt: "Como as regras variam de município para município, confirme as obrigações locais de posse com a autoridade competente se você pretende ficar com um cachorro potente ou de guarda. Como as fontes oficiais sérvias não publicam nenhuma lista nacional de raças restritas, marcamos esse dado como não publicado em vez de deduzir uma."

