origin:
  scheme: eu
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from an EU or EFTA country (Annex IV Part A) needs a microchip, a valid rabies vaccination and its EU pet passport, completed by an authorised vet before leaving. No antibody test and no separate health certificate — just present yourself to the competent authority at a designated point of entry."
      fr: "Un chien venant d'un pays de l'UE ou de l'AELE (annexe IV partie A) a besoin d'une puce, d'une vaccination antirabique valide et de son passeport européen, rempli par un vétérinaire agréé avant le départ. Pas de titrage ni de certificat séparé — présente-toi simplement à l'autorité compétente à un point d'entrée désigné."
      es: "Un perro que llega de un país de la UE o de la AELC (anexo IV parte A) necesita un microchip, una vacunación antirrábica válida y su pasaporte europeo para mascotas, cumplimentado por un veterinario autorizado antes de salir. Sin prueba de titulación ni certificado sanitario aparte — solo tienes que presentarte ante la autoridad competente en un punto de entrada designado."
      pt: "Um cachorro vindo de um país da UE ou da EFTA (anexo IV parte A) precisa de microchip, vacinação antirrábica válida e do seu passaporte europeu para animais, preenchido por um veterinário autorizado antes da partida. Sem teste sorológico e sem certificado sanitário separado — basta se apresentar à autoridade competente em um ponto de entrada designado."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From another listed country (Annex IV Part B), your dog needs a microchip, a valid rabies vaccination and an animal health certificate issued by an official vet, documenting the microchip code, vaccination and blood sampling, valid 10 days to the border. No antibody test is required."
      fr: "Depuis un autre pays listé (annexe IV partie B), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire établi par un vétérinaire officiel, documentant le code puce, la vaccination et la prise de sang, valable 10 jours jusqu'à la frontière. Aucun titrage n'est requis."
      es: "Desde otro país listado (anexo IV parte B), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal expedido por un veterinario oficial, que documente el código del microchip, la vacunación y la extracción de sangre, válido 10 días hasta la frontera. No se exige prueba de titulación."
      pt: "De outro país listado (anexo IV parte B), seu cachorro precisa de microchip, vacinação antirrábica válida e de um certificado sanitário animal emitido por um veterinário oficial, documentando o código do microchip, a vacinação e a coleta de sangue, válido por 10 dias até a fronteira. Nenhum teste sorológico é exigido."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (rabies-risk) country, add a rabies antibody test: blood taken at least 30 days after vaccination and at least 3 months before movement, result ≥0.5 IU/ml at an approved laboratory. An official animal health certificate is also required, valid 10 days to the border."
      fr: "Depuis un pays non listé (à risque rabique), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin et au moins 3 mois avant le mouvement, résultat ≥0,5 UI/ml dans un laboratoire agréé. Un certificat sanitaire officiel est également requis, valable 10 jours jusqu'à la frontière."
      es: "Desde un país no listado (con riesgo de rabia), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna y al menos 3 meses antes del desplazamiento, resultado ≥0,5 UI/ml en un laboratorio autorizado. También se exige un certificado sanitario animal oficial, válido 10 días hasta la frontera."
      pt: "De um país não listado (de risco de raiva), acrescente o teste sorológico antirrábico: sangue coletado pelo menos 30 dias após a vacinação e pelo menos 3 meses antes do movimento, resultado ≥0,5 UI/ml em laboratório aprovado. Um certificado sanitário animal oficial também é exigido, válido por 10 dias até a fronteira."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Bosnia and Herzegovina depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien en Bosnie-Herzégovine dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Bosnia y Herzegovina depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega à Bósnia e Herzegovina depende de onde você partiu."
  points:
    - en: "Enter via a travellers' point of entry designated by BiH and contact the competent authority there for documentary and identity checks."
      fr: "Entre par un point d'entrée voyageurs désigné par la BiH et contacte-y l'autorité compétente pour les contrôles documentaires et d'identité."
      es: "Entra por un punto de entrada de viajeros designado por BiH y contacta allí con la autoridad competente para los controles documentales y de identidad."
      pt: "Entre por um ponto de entrada para viajantes designado pela BiH e contate ali a autoridade competente para os controles documentais e de identidade."
    - from: eu
      en: "From an EU/EFTA country: carry the EU pet passport recording the microchip and valid rabies vaccination."
      fr: "Depuis un pays UE/AELE : munis-toi du passeport européen consignant la puce et la vaccination antirabique valide."
      es: "Desde un país de la UE/AELC: lleva el pasaporte europeo para mascotas que registra el microchip y la vacunación antirrábica válida."
      pt: "De um país da UE/EFTA: leve o passaporte europeu registrando o microchip e a vacinação antirrábica válida."
    - from: non_eu
      en: "From another listed or a non-listed country: carry the original animal health certificate (valid 10 days) and, for non-listed origins, the antibody-test result."
      fr: "Depuis un autre pays listé ou un pays non listé : munis-toi du certificat sanitaire original (valable 10 jours) et, pour les origines non listées, du résultat du titrage."
      es: "Desde otro país listado o un país no listado: lleva el certificado sanitario animal original (válido 10 días) y, para los orígenes no listados, el resultado de la prueba de titulación."
      pt: "De outro país listado ou de um país não listado: leve o certificado sanitário animal original (válido por 10 dias) e, para origens não listadas, o resultado do teste sorológico."
    - en: "Non-commercial travel covers up to five pets; more than five are handled as a commercial import."
      fr: "Le voyage non commercial couvre jusqu'à cinq animaux ; au-delà de cinq, il s'agit d'un import commercial."
      es: "El viaje no comercial abarca hasta cinco mascotas; más de cinco se tratan como una importación comercial."
      pt: "A viagem não comercial abrange até cinco animais; mais de cinco são tratados como importação comercial."
    - en: "Sanitary and veterinary controls of imported animals apply under BiH customs rules; the microchip is read to match the documents."
      fr: "Les contrôles sanitaires et vétérinaires des animaux importés s'appliquent selon les règles douanières de BiH ; la puce est lue pour correspondre aux documents."
      es: "Los controles sanitarios y veterinarios de los animales importados se aplican según las normas aduaneras de BiH; el microchip se lee para que coincida con los documentos."
      pt: "Controles sanitários e veterinários de animais importados se aplicam conforme as regras alfandegárias da BiH; o microchip é lido para conferir com os documentos."
    - en: "If documents are missing or invalid, border veterinary services may refuse entry or order corrective measures at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, les services vétérinaires frontaliers peuvent refuser l'entrée ou ordonner des mesures correctives aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, los servicios veterinarios fronterizos pueden denegar la entrada u ordenar medidas correctoras a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, os serviços veterinários de fronteira podem recusar a entrada ou determinar medidas corretivas às custas do dono."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Bosnia and Herzegovina's federal pet-movement rules published by the Veterinary Office do not list any breed as banned or restricted for import. Any dangerous-dog keeping rules exist at entity level (Republika Srpska, the Federation of BiH and Brčko District) rather than as a single national import ban."
    fr: "Les règles fédérales de mouvement des animaux publiées par le Bureau vétérinaire de Bosnie-Herzégovine ne listent aucune race interdite ou restreinte à l'import. D'éventuelles règles de détention de chiens dangereux existent au niveau des entités (Republika Srpska, Fédération de BiH et district de Brčko) plutôt que comme une interdiction nationale unique d'importation."
    es: "Las normas federales de movimiento de animales de compañía publicadas por la Oficina Veterinaria de Bosnia y Herzegovina no incluyen ninguna raza como prohibida o restringida para la importación. Las eventuales normas de tenencia de perros peligrosos existen a nivel de entidad (República Srpska, la Federación de BiH y el Distrito de Brčko) más que como una única prohibición nacional de importación."
    pt: "As regras federais de circulação de animais da Bósnia e Herzegovina, publicadas pelo Escritório Veterinário, não listam nenhuma raça como banida ou restrita para importação. Eventuais regras de posse de cachorros perigosos existem em nível de entidade (Republika Srpska, Federação da BiH e Distrito de Brčko), e não como uma única proibição nacional de importação."
  cat1:
    en: "No nationally published category of prohibited breeds applies to import into Bosnia and Herzegovina. The Veterinary Office's non-commercial movement conditions set no breed exclusion."
    fr: "Aucune catégorie nationale publiée de races interdites ne s'applique à l'entrée en Bosnie-Herzégovine. Les conditions de mouvement non commercial du Bureau vétérinaire ne prévoient aucune exclusion de race."
    es: "Ninguna categoría de razas prohibidas publicada a nivel nacional se aplica a la importación a Bosnia y Herzegovina. Las condiciones de movimiento no comercial de la Oficina Veterinaria no establecen ninguna exclusión de razas."
    pt: "Nenhuma categoria de raças proibidas publicada em nível nacional se aplica à importação para a Bósnia e Herzegovina. As condições de movimento não comercial do Escritório Veterinário não estabelecem nenhuma exclusão por raça."
  cat2:
    en: "Entity- and municipal-level rules on keeping dogs considered dangerous may impose local obligations (leash, muzzle, registration). The precise list of affected breeds is not centrally published — status: Unknown. Verify with local authorities for your destination city."
    fr: "Des règles au niveau des entités et des municipalités sur la détention de chiens jugés dangereux peuvent imposer des obligations locales (laisse, muselière, enregistrement). La liste précise des races concernées n'est pas publiée de façon centralisée — statut : Non communiqué. Vérifie auprès des autorités locales de ta ville de destination."
    es: "Las normas a nivel de entidad y municipal sobre la tenencia de perros considerados peligrosos pueden imponer obligaciones locales (correa, bozal, registro). La lista precisa de razas afectadas no se publica de forma centralizada — estado: no comunicado. Verifícalo con las autoridades locales de tu ciudad de destino."
    pt: "Regras em nível de entidade e municipal sobre a posse de cachorros considerados perigosos podem impor obrigações locais (guia, focinheira, registro). A lista precisa das raças afetadas não é publicada de forma centralizada — status: não comunicado. Verifique com as autoridades locais da sua cidade de destino."
  note:
    en: "Because dangerous-dog rules are decentralised in Bosnia, confirm any local breed obligations directly with the destination municipality or the Veterinary Office (info@vet.gov.ba) before travelling."
    fr: "Les règles sur les chiens dangereux étant décentralisées en Bosnie, confirme toute obligation locale de race directement auprès de la municipalité de destination ou du Bureau vétérinaire (info@vet.gov.ba) avant de voyager."
    es: "Como las normas sobre perros peligrosos están descentralizadas en Bosnia, confirma cualquier obligación local por raza directamente con el municipio de destino o con la Oficina Veterinaria (info@vet.gov.ba) antes de viajar."
    pt: "Como as regras sobre cachorros perigosos são descentralizadas na Bósnia, confirme qualquer obrigação local por raça diretamente com o município de destino ou com o Escritório Veterinário (info@vet.gov.ba) antes de viajar."

