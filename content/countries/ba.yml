  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Bosnia and Herzegovina (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — la Bosnie-Herzégovine (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Bosnia y Herzegovina (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — a Bósnia e Herzegovina (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — Bosnia and Herzegovina", fr: "Pays de destination — Bosnie-Herzégovine", es: "País de destino — Bosnia y Herzegovina", pt: "País de destino — Bósnia e Herzegovina" }
      text:
        en: "Bosnia applies an EU-modelled pet-movement framework: an ISO microchip and a valid rabies vaccination are always required, and non-commercial travel covers up to five pets accompanied by their owner."
        fr: "La Bosnie applique un cadre calqué sur l'UE : puce ISO et vaccination antirabique valide toujours exigées, et le mouvement non commercial couvre jusqu'à cinq animaux accompagnés de leur propriétaire."
        es: "Bosnia aplica un marco de movimiento de animales de compañía inspirado en el de la UE: siempre se exigen un microchip ISO y una vacunación antirrábica válida, y el viaje no comercial abarca hasta cinco mascotas acompañadas por su propietario."
        pt: "A Bósnia aplica um marco de circulação de animais inspirado no da UE: microchip ISO e vacinação antirrábica válida são sempre obrigatórios, e a viagem não comercial abrange até cinco animais acompanhados pelo dono."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Whether your dog leaves from an EU/EFTA country, another listed country or a non-listed country decides whether an EU passport, a health certificate or an additional antibody test is required."
        fr: "Que ton chien parte d'un pays UE/AELE, d'un autre pays listé ou d'un pays non listé détermine si un passeport européen, un certificat sanitaire ou un titrage supplémentaire est exigé."
        es: "Que tu perro salga de un país de la UE/AELC, de otro país listado o de un país no listado determina si se exige un pasaporte europeo, un certificado sanitario o una prueba de titulación adicional."
        pt: "Se o seu cachorro parte de um país da UE/EFTA, de outro país listado ou de um país não listado é o que determina se é exigido um passaporte europeu, um certificado sanitário ou um teste sorológico adicional."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay in a rabies-risk country can trigger an antibody test even if you fly in from an exempt country. It is your dog's real origin and history that count — not only the last airport."
        fr: "Un séjour récent dans un pays à risque rabique peut imposer un titrage même si tu arrives d'un pays exempté. C'est l'origine réelle et l'historique du chien qui comptent — pas seulement l'aéroport de destination finale."
        es: "Una estancia reciente en un país con riesgo de rabia puede obligar a una prueba de titulación aunque llegues desde un país exento. Lo que cuenta es el origen y el historial reales de tu perro — no solo el último aeropuerto."
        pt: "Uma estadia recente em um país de risco de raiva pode acionar a exigência do teste sorológico mesmo que você chegue de um país isento. O que conta é a origem e o histórico reais do seu cachorro — não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Bosnia's framework, then confirm your dog's exact origin and history with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre bosnien, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Bosnia y luego confirma el origen y el historial exactos de tu perro con tu veterinario."
    pt: "Leia então as exigências abaixo como o quadro geral da Bósnia, e confirme com seu veterinário a origem e o histórico exatos do seu cachorro."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Must be implanted before the rabies vaccination and read at the border.", fr: "Doit être posée avant la vaccination antirabique et lue à la frontière.", es: "Debe implantarse antes de la vacunación antirrábica y leerse en la frontera.", pt: "Deve ser implantado antes da vacinação antirrábica e lido na fronteira." }
    exceptions: { en: "A clearly readable tattoo is accepted only if applied before 3 July 2011.", fr: "Un tatouage clairement lisible n'est accepté que s'il est antérieur au 3 juillet 2011.", es: "Un tatuaje claramente legible solo se acepta si se aplicó antes del 3 de julio de 2011.", pt: "Uma tatuagem claramente legível só é aceita se tiver sido feita antes de 3 de julho de 2011." }
    ref: { en: "Veterinary Office of BiH — conditions for non-commercial movement", fr: "Bureau vétérinaire de BiH — conditions de mouvement non commercial", es: "Oficina Veterinaria de BiH — condiciones para el movimiento no comercial", pt: "Escritório Veterinário da BiH — condições para o movimento não comercial" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Dog at least 12 weeks old at the shot; the vaccination date must not precede the microchip date; validity starts 21 days after the primary vaccination.", fr: "Chien d'au moins 12 semaines ; la date du vaccin ne doit pas précéder la puce ; validité 21 jours après la primo-vaccination.", es: "Perro de al menos 12 semanas en el momento de la vacuna; la fecha de la vacunación no debe ser anterior a la del microchip; la valide empieza 21 días después de la primovacunación.", pt: "Cachorro com pelo menos 12 semanas na data da vacina; a data da vacinação não pode ser anterior à data do microchip; a validade começa 21 dias após a primovacinação." }
    exceptions: { en: "The microchip must already be in place; otherwise re-vaccination is needed.", fr: "La puce doit déjà être posée ; sinon il faut revacciner.", es: "El microchip debe estar ya implantado; de lo contrario, hay que revacunar.", pt: "O microchip já deve estar implantado; caso contrário, é preciso revacinar." }
    ref: { en: "Veterinary Office of BiH — conditions for non-commercial movement", fr: "Bureau vétérinaire de BiH — conditions de mouvement non commercial", es: "Oficina Veterinaria de BiH — condiciones para el movimiento no comercial", pt: "Escritório Veterinário da BiH — condições para o movimento não comercial" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Non-listed origins only: blood taken ≥30 days after vaccination and ≥3 months before movement, result ≥0.5 IU/ml, approved laboratory.", fr: "Pays non listés : sang prélevé ≥30 jours après le vaccin et ≥3 mois avant le mouvement, résultat ≥0,5 UI/ml, laboratoire agréé.", es: "Solo orígenes no listados: sangre extraída ≥30 días después de la vacuna y ≥3 meses antes del desplazamiento, resultado ≥0,5 UI/ml, laboratorio autorizado.", pt: "Somente origens não listadas: sangue coletado ≥30 dias após a vacinação e ≥3 meses antes do movimento, resultado ≥0,5 UI/ml, em laboratório aprovado." }
    exceptions: { en: "Not required from EU/EFTA (Annex IV Part A) or from other listed countries (Annex IV Part B).", fr: "Non requis depuis l'UE/AELE (annexe IV partie A) ou les autres pays listés (annexe IV partie B).", es: "No se exige desde la UE/AELC (anexo IV parte A) ni desde otros países listados (anexo IV parte B).", pt: "Não exigido a partir da UE/EFTA (anexo IV parte A) nem de outros países listados (anexo IV parte B)." }
    ref: { en: "Veterinary Office of BiH — Annex IV, non-listed countries", fr: "Bureau vétérinaire de BiH — annexe IV, pays non listés", es: "Oficina Veterinaria de BiH — anexo IV, países no listados", pt: "Escritório Veterinário da BiH — anexo IV, países não listados" }
  - item: { en: "EU pet passport", fr: "Passeport européen", es: "Pasaporte europeo para mascotas", pt: "Passaporte europeu para animais" }
    required: { en: "EU/EFTA origins", fr: "Origines UE/AELE", es: "Orígenes de la UE/AELC", pt: "Origens UE/EFTA" }
    when: { en: "Completed and issued by an authorised vet before leaving the EU/EFTA member; records the microchip and rabies vaccination.", fr: "Rempli et délivré par un vétérinaire agréé avant de quitter l'État UE/AELE ; consigne la puce et la vaccination.", es: "Cumplimentado y expedido por un veterinario autorizado antes de salir del Estado de la UE/AELC; registra el microchip y la vacunación antirrábica.", pt: "Preenchido e emitido por um veterinário autorizado antes de sair do Estado membro da UE/EFTA; registra o microchip e a vacinação antirrábica." }
    exceptions: { en: "Replaced by an animal health certificate for non-EU/EFTA origins.", fr: "Remplacé par un certificat sanitaire pour les origines hors UE/AELE.", es: "Se sustituye por un certificado sanitario animal para orígenes fuera de la UE/AELC.", pt: "Substituído por um certificado sanitário animal para origens fora da UE/EFTA." }
    ref: { en: "Veterinary Office of BiH — Annex IV Part A", fr: "Bureau vétérinaire de BiH — annexe IV partie A", es: "Oficina Veterinaria de BiH — anexo IV parte A", pt: "Escritório Veterinário da BiH — anexo IV parte A" }
  - item: { en: "Animal health certificate", fr: "Certificat sanitaire", es: "Certificado sanitario animal", pt: "Atestado de saúde animal" }
    required: { en: "Non-EU/EFTA origins", fr: "Origines hors UE/AELE", es: "Orígenes fuera de la UE/AELC", pt: "Origens fora da UE/EFTA" }
    when: { en: "Issued by an official vet; documents the microchip/tattoo code, rabies vaccination and blood sampling; valid 10 days from issue until the checks at the entry point (extended for sea transport).", fr: "Établi par un vétérinaire officiel ; documente le code puce/tatouage, la vaccination antirabique et la prise de sang ; valable 10 jours jusqu'aux contrôles au point d'entrée (prolongé pour le transport maritime).", es: "Expedido por un veterinario oficial; documenta el código del microchip/tatuaje, la vacunación antirrábica y la extracción de sangre; válido 10 días desde la emisión hasta los controles en el punto de entrada (ampliado para el transporte marítimo).", pt: "Emitido por um veterinário oficial; documenta o código do microchip/tatuagem, a vacinação antirrábica e a coleta de sangue; válido por 10 dias, da emissão até os controles no ponto de entrada (prazo estendido para o transporte marítimo)." }
    exceptions: { en: "Not needed for EU/EFTA origins (EU pet passport instead).", fr: "Inutile pour les origines UE/AELE (passeport européen à la place).", es: "No necesario para orígenes de la UE/AELC (en su lugar, el pasaporte europeo para mascotas).", pt: "Não necessário para origens da UE/EFTA (nesse caso, vale o passaporte europeu para animais)." }
    ref: { en: "Veterinary Office of BiH — Annex IV Part B / non-listed", fr: "Bureau vétérinaire de BiH — annexe IV partie B / non listés", es: "Oficina Veterinaria de BiH — anexo IV parte B / no listados", pt: "Escritório Veterinário da BiH — anexo IV parte B / não listados" }
  - item: { en: "Tapeworm (Echinococcus) treatment", fr: "Traitement échinococcose", es: "Tratamiento contra la tenia (Echinococcus)", pt: "Tratamento contra a tênia (Echinococcus)" }
    required: { en: "Not required", fr: "Non requis", es: "No obligatorio", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
