    exceptions: { en: "Sanitary and veterinary controls of imported goods and animals apply under BiH customs rules.", fr: "Les contrôles sanitaires et vétérinaires des marchandises et animaux importés s'appliquent selon les règles douanières de BiH.", es: "Los controles sanitarios y veterinarios de las mercancías y los animales importados se aplican según las normas aduaneras de BiH.", pt: "Controles sanitários e veterinários de mercadorias e animais importados se aplicam conforme as regras alfandegárias da BiH." }
    ref: { en: "Veterinary Office of BiH; Indirect Taxation Authority (customs)", fr: "Bureau vétérinaire de BiH ; Administration des impôts indirects (douane)", es: "Oficina Veterinaria de BiH; Administración de Impuestos Indirectos (aduanas)", pt: "Escritório Veterinário da BiH; Administração de Impostos Indiretos (alfândega)" }
