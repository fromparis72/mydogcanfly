# Country Entry Guide — Bosnia and Herzegovina (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_ba
iso2: "BA"
name: { en: "Bosnia and Herzegovina", fr: "Bosnie-Herzégovine", es: "Bosnia y Herzegovina", pt: "Bósnia e Herzegovina" }
region: { en: "Europe (non-EU)", fr: "Europe (hors UE)", es: "Europa (fuera de la UE)", pt: "Europa (fora da UE)" }


regime: listed
exit:
  authority: Ured za veterinarstvo BiH
  authorityUrl: https://www.vet.gov.ba/en/dokument/d346
  intro:
    en: "Bosnia and Herzegovina is a listed country, so no rabies titer is needed to return to the EU — the EU health certificate is issued by an official veterinarian of the Veterinary Office of BiH."
    fr: "La Bosnie-Herzégovine est un pays listé : pas de titrage pour rentrer dans l'UE — le certificat sanitaire UE est délivré par un vétérinaire officiel de l'Office vétérinaire de BiH."
    es: "Bosnia y Herzegovina es un país listado: no hace falta titulación para volver a la UE — el certificado sanitario UE lo emite un veterinario oficial de la Oficina Veterinaria de BiH."
    pt: "A Bósnia e Herzegovina é um país listado: nenhum teste sorológico antirrábico é necessário para voltar à UE — o certificado sanitário da UE é emitido por um veterinário oficial do Escritório Veterinário da BiH."
  steps:
    - timing: window
      scope: eu
      text:
        en: "With microchip and valid rabies vaccination (21-day wait), the EU-model animal health certificate is completed and issued by an official government veterinarian before departure."
        fr: "Avec puce et vaccination antirabique valide (délai de 21 jours), le certificat sanitaire au modèle UE est rempli et délivré par un vétérinaire officiel avant le départ."
        es: "Con microchip y vacuna antirrábica válida (espera de 21 días), el certificado sanitario en modelo UE lo rellena y emite un veterinario oficial antes de salir."
        pt: "Com o microchip e a vacinação antirrábica válida (espera de 21 dias), o certificado sanitário no modelo da UE é preenchido e emitido por um veterinário oficial do governo antes da partida."
    - timing: window
      scope: non_eu
      text:
        en: "With a microchip and a valid rabies vaccination, the animal health certificate is completed and issued by an official government veterinarian before departure."
        fr: "Avec une puce et une vaccination antirabique valide, le certificat sanitaire est rempli et délivré par un vétérinaire officiel de l'État avant le départ."
        es: "Con microchip y vacunación antirrábica válida, el certificado sanitario lo completa y expide un veterinario oficial del Estado antes de la salida."
        pt: "Com microchip e vacinação antirrábica válida, o certificado sanitário é preenchido e emitido por um veterinário oficial do Estado antes da partida."
  onSiteNote:
    en: "A new EU certificate format applies since 22 April 2026 (Reg. (EU) 2026/131) — make sure your vet uses the current model."
    fr: "Un nouveau format de certificat UE s'applique depuis le 22 avril 2026 (règlement (UE) 2026/131) — assure-toi que ton vétérinaire utilise le modèle en vigueur."
    es: "Desde el 22 de abril de 2026 se aplica un nuevo formato de certificado UE (Reg. (UE) 2026/131) — asegúrate de que tu veterinario use el modelo vigente."
    pt: "Um novo formato de certificado da UE se aplica desde 22 de abril de 2026 (Regl. (UE) 2026/131) — certifique-se de que seu veterinário use o modelo vigente."

hero:
  h1: { en: "Traveling to Bosnia and Herzegovina with your dog", fr: "Voyager en Bosnie-Herzégovine avec ton chien", es: "Viajar a Bosnia y Herzegovina con tu perro", pt: "Viajar para a Bósnia e Herzegovina com seu cachorro" }
  intro:
    en: >-
      Bosnia and Herzegovina welcomes dogs, but what you need to prepare depends mainly on the country
      your dog is travelling from — not only on Bosnia itself. Bosnia is not an EU member, yet its
      Veterinary Office applies rules closely modelled on the EU pet-movement framework: an ISO
      microchip and a valid rabies vaccination are always required. A dog coming from an EU or EFTA
      country simply needs its EU pet passport. A dog from another listed country needs an official
      animal health certificate but no blood test. A dog from a non-listed (rabies-risk) country faces
      the longest path, including a rabies antibody test and a three-month wait. This guide explains
      each case so you know exactly what to prepare before you book your flight.
    fr: >-
      La Bosnie-Herzégovine accueille les chiens, mais ce qu'il faut préparer dépend surtout du pays
      d'où ton chien voyage — pas seulement de la Bosnie. La Bosnie n'est pas membre de l'UE, mais son
      Bureau vétérinaire applique des règles calquées sur le cadre européen : une puce ISO et une
      vaccination antirabique valide sont toujours exigées. Un chien venant d'un pays de l'UE ou de
      l'AELE a simplement besoin de son passeport européen. Un chien d'un autre pays listé a besoin d'un
      certificat sanitaire officiel mais pas de prise de sang. Un chien venant d'un pays non listé (à
      risque rabique) suit le parcours le plus long, avec un titrage antirabique et un délai de trois
      mois. Ce guide détaille chaque cas pour savoir exactement quoi préparer avant de réserver ton vol.
    es: >-
      Bosnia y Herzegovina acoge a los perros, pero lo que debes preparar depende sobre todo del país
      desde el que viaja tu perro — no solo de Bosnia. Bosnia no es miembro de la UE, pero su Oficina
      Veterinaria aplica normas estrechamente inspiradas en el marco europeo de movimiento de animales
      de compañía: siempre se exigen un microchip ISO y una vacunación antirrábica válida. Un perro que
      llega de un país de la UE o de la AELC solo necesita su pasaporte europeo para mascotas. Un perro
      de otro país listado necesita un certificado sanitario animal oficial, pero no un análisis de
      sangre. Un perro de un país no listado (con riesgo de rabia) se enfrenta al camino más largo, que
      incluye una prueba de titulación de rabia y una espera de tres meses. Esta guía explica cada caso
      para que sepas exactamente qué preparar antes de reservar tu vuelo.

    pt: "A Bósnia e Herzegovina recebe bem os cachorros, mas o que você precisa preparar depende principalmente do país de onde seu cachorro parte — e não só da Bósnia em si. A Bósnia não é membro da UE, mas seu Escritório Veterinário aplica regras bem próximas do marco europeu de circulação de animais de estimação: microchip ISO e vacinação antirrábica válida são sempre obrigatórios. Um cachorro vindo de um país da UE ou da EFTA precisa apenas do seu passaporte europeu para animais. Um cachorro vindo de outro país listado precisa de um certificado sanitário animal oficial, mas não de exame de sangue. Um cachorro vindo de um país não listado (de risco de raiva) enfrenta o caminho mais longo, com teste sorológico antirrábico e três meses de espera. Este guia explica cada caso para você saber exatamente o que preparar antes de comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Easy to difficult (depends on origin)", fr: "Facile à difficile (selon l'origine)", es: "De fácil a difícil (según el origen)", pt: "De fácil a difícil (depende da origem)" }

prepTime:
  eu:
    en: "A few days if the EU pet passport is up to date, up to ~3 weeks if the first rabies shot is still needed."
    fr: "Quelques jours si le passeport européen est à jour, jusqu'à ~3 semaines si la première vaccination reste à faire."
    es: "Unos días si el pasaporte europeo está al día, hasta ~3 semanas si aún falta la primera vacuna antirrábica."
    pt: "Alguns dias se o passaporte europeu estiver em dia, até ~3 semanas se a primeira vacina antirrábica ainda estiver pendente."
  listed:
    en: "~3–4 weeks: allow the rabies vaccination to become valid, plus an animal health certificate valid 10 days."
    fr: "~3–4 semaines : le temps que la vaccination antirabique devienne valide, plus un certificat sanitaire valable 10 jours."
    es: "~3–4 semanas: el tiempo para que la vacunación antirrábica pase a ser válida, más un certificado sanitario animal válido 10 días."
    pt: "~3–4 semanas: o tempo para a vacinação antirrábica se tornar válida, mais um certificado sanitário animal válido por 10 dias."
  nonListed:
    en: "~4–7 months: antibody test at least 30 days after vaccination, then a compulsory 3-month wait before entry."
    fr: "~4–7 mois : titrage au moins 30 jours après le vaccin, puis un délai obligatoire de 3 mois avant l'entrée."
    es: "~4–7 meses: prueba de titulación al menos 30 días después de la vacuna, y luego una espera obligatoria de 3 meses antes de la entrada."
    pt: "~4–7 meses: teste sorológico antirrábico (titulação) pelo menos 30 dias após a vacinação, seguido de uma espera obrigatória de 3 meses antes da entrada."

