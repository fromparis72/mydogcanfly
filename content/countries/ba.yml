    when: { en: "12-week rabies shot + 21-day validity (EU/EFTA and listed); about 7 months from a non-listed country because of the antibody test and 3-month wait.", fr: "Vaccin à 12 semaines + 21 jours de validité (UE/AELE et listés) ; environ 7 mois depuis un pays non listé à cause du titrage et du délai de 3 mois.", es: "Vacuna a las 12 semanas + 21 días de valide (UE/AELC y listados); unos 7 meses desde un país no listado por la prueba de titulación y la espera de 3 meses.", pt: "Vacina antirrábica a partir das 12 semanas + 21 dias de validade (UE/EFTA e países listados); cerca de 7 meses vindo de um país não listado, por causa do teste sorológico e dos 3 meses de espera." }
    exceptions: { en: "Puppies under 12 weeks cannot be vaccinated, so cannot meet the rabies rule; non-commercial pets must be at least 3 months old.", fr: "Un chiot de moins de 12 semaines ne peut être vacciné, donc ne peut respecter la règle rage ; les animaux non commerciaux doivent avoir au moins 3 mois.", es: "Un cachorro de menos de 12 semanas no puede vacunarse, por lo que no puede cumplir la norma de la rabia; las mascotas no comerciales deben tener al menos 3 meses.", pt: "Filhotes com menos de 12 semanas não podem ser vacinados e, portanto, não conseguem cumprir a regra da raiva; animais não comerciais precisam ter pelo menos 3 meses." }
