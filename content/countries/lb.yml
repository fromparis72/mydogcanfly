# Country Entry Guide — Lebanon (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_lb
iso2: "LB"
name: { en: "Lebanon", fr: "Liban", es: "Líbano", pt: "Líbano" }
region: { en: "Middle East / Mediterranean", fr: "Moyen-Orient / Méditerranée", es: "Oriente Medio / Mediterráneo", pt: "Oriente Médio / Mediterrâneo" }


regime: non_listed
exit:
  authority: Ministère de l'Agriculture
  authorityUrl: https://www.agriculture.gov.lb
  intro:
    en: "Lebanon is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus a health certificate signed and stamped by a government veterinarian of the Ministry of Agriculture."
    fr: "Le Liban est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire signé et tamponné par un vétérinaire officiel du ministère de l'Agriculture."
    es: "Líbano no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario firmado y sellado por un veterinario oficial del Ministerio de Agricultura."
    pt: "O Líbano não é um país listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde assinado e carimbado por um veterinário do governo do Ministério da Agricultura."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "Under the Ministry of Agriculture's veterinary quarantine rules, the travel health certificate must be signed and stamped by an official government veterinarian before departure."
        fr: "Selon les règles de quarantaine vétérinaire du ministère de l'Agriculture, le certificat sanitaire de voyage doit être signé et tamponné par un vétérinaire officiel avant le départ."
        es: "Según las reglas de cuarentena veterinaria del Ministerio de Agricultura, el certificado sanitario de viaje debe ser firmado y sellado por un veterinario oficial antes de salir."
        pt: "Segundo as normas de quarentena veterinária do Ministério da Agricultura, o atestado de saúde de viagem deve ser assinado e carimbado por um veterinário oficial do governo antes da partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Lebanon with your dog", fr: "Voyager au Liban avec ton chien", es: "Viajar al Líbano con tu perro", pt: "Viajar para o Líbano com seu cachorro" }
  intro:
    en: >-
      Lebanon admits pet dogs, but entry runs through its own veterinary framework, managed by the
      Ministry of Agriculture's veterinary services, not the EU pet-passport scheme. The legal basis is
      Decree No. 12301 on veterinary quarantine, which subjects animals arriving in Lebanon to
      veterinary health control at the border and requires a veterinary health certificate from the
      country of origin. In practice, the core documents are a microchip, up-to-date vaccinations
      (rabies plus the usual canine vaccines), and an official veterinary health certificate issued by
      a licensed vet within about 10 days before travel; an import clearance is obtained from customs on
      arrival. Lebanon is a rabies-endemic country and publishes very little of its detailed import
      procedure in a stable, public form, so several specifics — exact rabies timing, any antibody test,
      parasite treatment, minimum age and breed rules — are not officially confirmed. This guide states
      clearly what is documented and what is not.
    fr: >-
      Le Liban admet les chiens de compagnie, mais l'entrée passe par son propre cadre vétérinaire, géré
      par les services vétérinaires du ministère de l'Agriculture, et non par le passeport européen. La
      base légale est le décret n° 12301 sur la quarantaine vétérinaire, qui soumet les animaux arrivant
      au Liban à un contrôle sanitaire vétérinaire à la frontière et exige un certificat sanitaire du
      pays d'origine. En pratique, les documents de base sont une puce électronique, des vaccinations à
      jour (rage et vaccins canins habituels) et un certificat vétérinaire officiel établi par un
      vétérinaire agréé dans les 10 jours environ avant le voyage ; un dédouanement est obtenu auprès de
      la douane à l'arrivée. Le Liban est un pays d'endémie rabique et publie très peu sa procédure
      d'importation détaillée sous une forme stable et publique ; plusieurs points — délais exacts de la
      rage, éventuel titrage, traitement antiparasitaire, âge minimum et règles de races — ne sont donc
      pas confirmés officiellement. Ce guide indique clairement ce qui est documenté et ce qui ne l'est pas.
    es: >-
      El Líbano admite perros de compañía, pero la entrada se gestiona a través de su propio marco
      veterinario, administrado por los servicios veterinarios del Ministerio de Agricultura, y no por el
      sistema del pasaporte europeo para mascotas. La base legal es el Decreto n.º 12301 sobre cuarentena
      veterinaria, que somete a los animales que llegan al Líbano a un control sanitario veterinario en la
      frontera y exige un certificado sanitario veterinario del país de origen. En la práctica, los
      documentos básicos son un microchip, las vacunas al día (la rabia más las vacunas caninas
      habituales) y un certificado sanitario veterinario oficial expedido por un veterinario autorizado en
      torno a los 10 días previos al viaje; a la llegada se obtiene un despacho de importación en aduanas.
      El Líbano es un país con rabia endémica y publica muy poco de su procedimiento de importación
      detallado de forma estable y pública, por lo que varios aspectos concretos — el plazo exacto de la
      rabia, una posible prueba de titulación, el tratamiento antiparasitario, la edad mínima y las normas
      de razas — no están confirmados oficialmente. Esta guía indica claramente lo que está documentado y
      lo que no.

    pt: "O Líbano admite cachorros de estimação, mas a entrada segue o próprio regime veterinário, administrado pelos serviços veterinários do Ministério da Agricultura, e não o esquema de passaporte europeu para animais de estimação. A base legal é o Decreto nº 12301 sobre quarentena veterinária, que submete os animais que chegam ao Líbano a um controle sanitário veterinário na fronteira e exige um atestado de saúde veterinário do país de origem. Na prática, os documentos centrais são um microchip, vacinas em dia (antirrábica mais as vacinas caninas usuais) e um atestado de saúde veterinário oficial emitido por um veterinário licenciado dentro de cerca de 10 dias antes da viagem; uma liberação de importação é obtida junto à alfândega na chegada. O Líbano é um país endêmico para raiva e publica muito pouco do seu procedimento de importação detalhado de forma estável e pública, portanto vários detalhes — o prazo exato da vacinação antirrábica, um eventual teste sorológico, o tratamento antiparasitário, a idade mínima e as normas de raça — não são oficialmente confirmados. Este guia indica claramente o que é documentado e o que não é."
difficulty:
  level: moderate
  label: { en: "Moderate — core rules known, several details unpublished", fr: "Modérée — règles de base connues, plusieurs détails non publiés", es: "Moderado — normas básicas conocidas, varios detalles no publicados", pt: "Moderado — normas centrais conhecidas, vários detalhes não publicados" }

prepTime:
  eu:
    en: "From the EU: allow a few weeks. Identification and rabies vaccination should already be in order; the official veterinary health certificate is issued by a licensed vet within about 10 days of departure."
    fr: "Depuis l'UE : prévois quelques semaines. L'identification et la vaccination antirabique doivent déjà être en règle ; le certificat vétérinaire officiel est établi par un vétérinaire agréé dans les 10 jours environ avant le départ."
    es: "Desde la UE: prevé unas semanas. La identificación y la vacunación antirrábica deberían estar ya en regla; el certificado sanitario veterinario oficial lo expide un veterinario autorizado en torno a los 10 días previos a la salida."
    pt: "Da UE: conte algumas semanas. A identificação e a vacinação antirrábica já devem estar em dia; o atestado de saúde veterinário oficial é emitido por um veterinário licenciado dentro de cerca de 10 dias antes da partida."
  listed:
    en: "From another third country: similar timing. If the first rabies shot is still needed, allow several extra weeks; the exact post-vaccination waiting period is not officially published by Lebanon."
    fr: "Depuis un autre pays tiers : délais comparables. S'il faut encore faire le premier vaccin antirabique, prévois plusieurs semaines de plus ; le délai exact après vaccination n'est pas publié officiellement par le Liban."
    es: "Desde otro país tercero: plazos similares. Si aún falta la primera vacuna antirrábica, prevé varias semanas más; el Líbano no publica oficialmente el periodo exacto de espera posterior a la vacunación."
    pt: "De outro país terceiro: prazo semelhante. Se a primeira dose da vacina antirrábica ainda for necessária, conte várias semanas extras; o período exato de espera após a vacinação não é publicado oficialmente pelo Líbano."
  nonListed:
    en: "From a high-rabies-risk origin: plan conservatively. Lebanon does not publish whether a rabies antibody test is required, so confirm the current procedure with the Ministry of Agriculture veterinary services or a Lebanese consulate well ahead."
    fr: "Depuis une origine à haut risque rabique : prévois large. Le Liban ne publie pas si un titrage antirabique est exigé ; confirme la procédure à jour auprès des services vétérinaires du ministère de l'Agriculture ou d'un consulat libanais bien à l'avance."
    es: "Desde un origen de alto riesgo de rabia: planifica con margen. El Líbano no publica si se exige una prueba de titulación de rabia, así que confirma el procedimiento vigente con los servicios veterinarios del Ministerio de Agricultura o un consulado libanés con mucha antelación."
    pt: "De uma origem de alto risco de raiva: planeje com margem de segurança. O Líbano não publica se o teste sorológico antirrábico é exigido, portanto confirme o procedimento atual com os serviços veterinários do Ministério da Agricultura ou um consulado libanês com bastante antecedência."

