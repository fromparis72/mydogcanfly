restrictedDogs:
  intro:
    en: "Lebanon's Animal Protection and Welfare Law No. 47/2017 is the national framework for keeping animals. Article 7 lets the Minister of Agriculture designate 'dangerous animals' by ministerial order, in addition to CITES-listed wild animals. This is a legal mechanism rather than a published breed list."
    fr: "La loi n° 47/2017 sur la protection et le bien-être animal constitue le cadre national de détention des animaux. L'article 7 permet au ministre de l'Agriculture de désigner par arrêté des « animaux dangereux », en plus des animaux sauvages inscrits à la CITES. Il s'agit d'un mécanisme légal plutôt que d'une liste de races publiée."
    es: "La Ley de Protección y Bienestar Animal del Líbano n.º 47/2017 es el marco nacional para la tenencia de animales. El artículo 7 permite al Ministro de Agricultura designar «animales peligrosos» por orden ministerial, además de los animales silvestres incluidos en CITES. Se trata de un mecanismo legal más que de una lista de razas publicada."
    pt: "A Lei de Proteção e Bem-Estar Animal do Líbano nº 47/2017 é o marco nacional para a posse de animais. O artigo 7 permite que o Ministro da Agricultura designe 'animais perigosos' por decreto ministerial, além dos animais silvestres listados pela CITES. Trata-se de um mecanismo legal, e não de uma lista de raças publicada."
  cat1:
    en: "Banned breeds: no official public list of dog breeds banned from import into Lebanon is confirmed. Status Unknown — do not assume any particular breed is either freely allowed or prohibited without checking."
    fr: "Races interdites : aucune liste publique officielle de races de chiens interdites à l'importation au Liban n'est confirmée. Statut inconnu — ne présume pas qu'une race donnée est librement admise ou interdite sans vérification."
    es: "Razas prohibidas: no hay confirmada ninguna lista pública oficial de razas de perros prohibidas para la importación al Líbano. Situación desconocida — no des por hecho que una raza concreta esté libremente permitida o prohibida sin comprobarlo."
    pt: "Raças proibidas: nenhuma lista pública oficial de raças de cachorros proibidas para importação no Líbano é confirmada. Situação Não comunicado — não presuma que uma raça específica é livremente permitida ou proibida sem verificar."
  cat2:
    en: "Restricted / licensed breeds: likewise not officially published. Because the Minister of Agriculture may designate dangerous animals by order, the situation can change without wide notice."
    fr: "Races restreintes / sous licence : de même, non publiées officiellement. Le ministre de l'Agriculture pouvant désigner des animaux dangereux par arrêté, la situation peut évoluer sans large publicité."
    es: "Razas restringidas / con licencia: igualmente no publicadas oficialmente. Como el Ministro de Agricultura puede designar animales peligrosos por orden, la situación puede cambiar sin gran publicidad."
    pt: "Raças restritas / com exigência de licença: também não publicado oficialmente. Como o Ministro da Agricultura pode designar animais perigosos por decreto, a situação pode mudar sem ampla divulgação."
  note:
    en: "Before booking, confirm your dog's breed status directly with the Ministry of Agriculture veterinary services or a Lebanese consulate, as any designation is made by ministerial order and may be updated."
    fr: "Avant de réserver, confirme le statut de la race de ton chien directement auprès des services vétérinaires du ministère de l'Agriculture ou d'un consulat libanais, toute désignation étant faite par arrêté et pouvant être mise à jour."
    es: "Antes de reservar, confirma la situación de la raza de tu perro directamente con los servicios veterinarios del Ministerio de Agricultura o un consulado libanés, ya que cualquier designación se hace por orden ministerial y puede actualizarse."
    pt: "Antes de reservar, confirme a situação da raça do seu cachorro diretamente com os serviços veterinários do Ministério da Agricultura ou um consulado libanês, já que qualquer designação é feita por decreto ministerial e pode ser atualizada."

checklist:
  - en: "Microchip (ISO 11784/11785 recommended) implanted before the rabies vaccination"
    fr: "Puce (ISO 11784/11785 recommandée) posée avant la vaccination antirabique"
    es: "Microchip (se recomienda ISO 11784/11785) implantado antes de la vacunación antirrábica"
    pt: "Microchip (ISO 11784/11785 recomendado) implantado antes da vacinação antirrábica"
  - en: "Valid rabies vaccination recorded with vaccine, dates and lot"
    fr: "Vaccination antirabique valide consignée avec vaccin, dates et lot"
    es: "Vacunación antirrábica válida registrada con vacuna, fechas y lote"
    pt: "Vacinação antirrábica válida, registrada com a vacina, as datas e o lote"
  - en: "Other canine vaccinations (distemper, hepatitis, parvovirus, leptospirosis)"
    fr: "Autres vaccins canins (Carré, hépatite, parvovirose, leptospirose)"
    es: "Otras vacunas caninas (moquillo, hepatitis, parvovirus, leptospirosis)"
    pt: "Outras vacinações caninas (cinomose, hepatite, parvovirose, leptospirose)"
  - en: "Official veterinary health certificate issued within about 10 days before travel"
    fr: "Certificat vétérinaire officiel établi dans les 10 jours environ avant le voyage"
    es: "Certificado sanitario veterinario oficial expedido en torno a los 10 días previos al viaje"
    pt: "Atestado de saúde veterinário oficial emitido dentro de cerca de 10 dias antes da viagem"
  - en: "Original vaccination booklet and microchip record (not copies)"
    fr: "Carnet de vaccination et justificatif de puce originaux (pas de copies)"
    es: "Cartilla de vacunación y registro del microchip originales (no copias)"
    pt: "Carteira de vacinação e comprovante do microchip originais (não cópias)"
  - en: "Confirm current procedure (antibody test, parasite treatment, minimum age, breeds) with the Ministry of Agriculture veterinary services or a Lebanese consulate"
    fr: "Confirme la procédure à jour (titrage, traitement antiparasitaire, âge minimum, races) auprès des services vétérinaires du ministère de l'Agriculture ou d'un consulat libanais"
    es: "Confirma el procedimiento vigente (prueba de titulación, tratamiento antiparasitario, edad mínima, razas) con los servicios veterinarios del Ministerio de Agricultura o un consulado libanés"
    pt: "Confirme o procedimento atual (teste sorológico, tratamento antiparasitário, idade mínima, raças) com os serviços veterinários do Ministério da Agricultura ou um consulado libanês"
  - en: "Plan for the import clearance obtained from customs on arrival"
    fr: "Prévois le dédouanement d'importation obtenu auprès de la douane à l'arrivée"
    es: "Prevé el despacho de importación que se obtiene en aduanas a la llegada"
    pt: "Planeje a liberação de importação obtida junto à alfândega na chegada"
  - en: "Airline reservation confirming your dog's travel option and travel crate if in the hold"
    fr: "Réservation confirmant l'option de transport du chien et caisse de transport si voyage en soute"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y jaula de transporte si viaja en bodega"
    pt: "Reserva da companhia aérea confirmando a opção de viagem do seu cachorro e caixa de transporte se for no porão"

