factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Lebanon (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — le Liban (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — el Líbano (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — o Líbano (seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Lebanon", fr: "Pays de destination — Liban", es: "País de destino — Líbano", pt: "País de destino — Líbano" }
      text:
        en: "Lebanon applies Decree No. 12301 on veterinary quarantine: every arriving animal is subject to veterinary health control at the border and must carry a veterinary health certificate from the country of origin. A microchip, rabies vaccination and other canine vaccines are the documented core."
        fr: "Le Liban applique le décret n° 12301 sur la quarantaine vétérinaire : tout animal arrivant est soumis à un contrôle sanitaire vétérinaire à la frontière et doit être accompagné d'un certificat sanitaire du pays d'origine. Puce, vaccination antirabique et autres vaccins canins constituent le socle documenté."
        es: "El Líbano aplica el Decreto n.º 12301 sobre cuarentena veterinaria: todo animal que llega está sujeto a un control sanitario veterinario en la frontera y debe llevar un certificado sanitario veterinario del país de origen. Un microchip, la vacunación antirrábica y otras vacunas caninas constituyen la base documentada."
        pt: "O Líbano aplica o Decreto nº 12301 sobre quarentena veterinária: todo animal que chega é submetido a controle sanitário veterinário na fronteira e deve levar um atestado de saúde veterinário do país de origem. Um microchip, a vacinação antirrábica e outras vacinas caninas formam a base documentada."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Because Lebanon is rabies-endemic and does not publish origin-specific certificate models, the disease status of your departure country and what your official vet can certify matter. There is no EU pet-passport shortcut into Lebanon."
        fr: "Le Liban étant en endémie rabique et ne publiant pas de modèles de certificat par origine, la situation sanitaire du pays de départ et ce que ton vétérinaire officiel peut certifier importent. Aucun raccourci « passeport européen » n'existe pour entrer au Liban."
        es: "Como el Líbano tiene rabia endémica y no publica modelos de certificado por origen, importan la situación sanitaria de tu país de salida y lo que tu veterinario oficial pueda certificar. No hay atajo de «pasaporte europeo» para entrar en el Líbano."
        pt: "Como o Líbano é endêmico para raiva e não publica modelos de atestado específicos por origem, a situação sanitária do seu país de partida e o que o seu veterinário oficial pode atestar são importantes. Não há atalho de passaporte europeu para entrar no Líbano."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "Decree No. 12301 sets specific import procedures for animals coming from countries where disease is endemic, so a recent stay in a high-risk area can affect the checks and possible quarantine on arrival. Your dog's real history counts — not only the last airport."
        fr: "Le décret n° 12301 prévoit des procédures d'importation particulières pour les animaux provenant de pays où des maladies sont endémiques ; un séjour récent dans une zone à risque peut donc influer sur les contrôles et une éventuelle quarantaine à l'arrivée. L'historique réel du chien compte — pas seulement le dernier aéroport."
        es: "El Decreto n.º 12301 establece procedimientos de importación específicos para los animales procedentes de países donde una enfermedad es endémica, por lo que una estancia reciente en una zona de alto riesgo puede afectar a los controles y a una posible cuarentena a la llegada. Lo que cuenta es el historial real de tu perro — no solo el último aeropuerto."
        pt: "O Decreto nº 12301 estabelece procedimentos de importação específicos para animais vindos de países onde a doença é endêmica, portanto uma estadia recente em uma área de alto risco pode afetar os controles e uma eventual quarentena na chegada. O histórico real do seu cachorro conta — não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Lebanon's framework, then confirm your dog's exact origin, history and the current procedure with your vet and the Lebanese authorities before booking."
    fr: "Lis donc les exigences ci-dessous comme le cadre libanais, puis confirme l'origine et l'historique exacts de ton chien ainsi que la procédure à jour avec ton vétérinaire et les autorités libanaises avant de réserver."
    es: "Así que lee los requisitos siguientes como el marco del Líbano y luego confirma el origen y el historial exactos de tu perro y el procedimiento vigente con tu veterinario y las autoridades libanesas antes de reservar."
    pt: "Portanto, leia as exigências abaixo como o regime do Líbano e depois confirme a origem exata, o histórico e o procedimento atual do seu cachorro com o seu veterinário e as autoridades libanesas antes de reservar."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Pets must be microchipped for identification; an ISO 11784/11785 chip implanted before the rabies vaccination is the international standard and should match the health certificate.", fr: "Les animaux doivent être identifiés par puce ; une puce ISO 11784/11785 posée avant la vaccination antirabique est la norme internationale et doit correspondre au certificat sanitaire.", es: "Las mascotas deben llevar microchip para su identificación; un chip ISO 11784/11785 implantado antes de la vacunación antirrábica es la norma internacional y debe coincidir con el certificado sanitario.", pt: "Os animais de estimação devem ter microchip para identificação; um chip ISO 11784/11785 implantado antes da vacinação antirrábica é o padrão internacional e deve coincidir com o atestado de saúde." }
    exceptions: { en: "Lebanon states pets must be microchipped but does not officially publish the exact chip standard; a reader for non-ISO chips cannot be assumed. Unknown.", fr: "Le Liban indique que les animaux doivent être pucés mais ne publie pas officiellement la norme exacte de puce ; ne présume pas d'un lecteur pour puces non ISO. Non communiqué.", es: "El Líbano indica que las mascotas deben llevar microchip, pero no publica oficialmente la norma exacta del chip; no des por hecho que haya un lector para chips no ISO. No publicado.", pt: "O Líbano declara que os animais de estimação devem ter microchip, mas não publica oficialmente o padrão exato do chip; não se pode presumir a existência de um leitor para chips não ISO. Não comunicado." }
    ref: { en: "Consulate General of Lebanon (New York) — Shipping of Pets", fr: "Consulat général du Liban (New York) — Expédition d'animaux", es: "Consulado General del Líbano (Nueva York) — Envío de mascotas", pt: "Consulado-Geral do Líbano (Nova York) — Envio de Animais de Estimação" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "The dog must be vaccinated against rabies, recorded with vaccine, dates and lot on the health certificate.", fr: "Le chien doit être vacciné contre la rage, avec vaccin, dates et lot consignés sur le certificat sanitaire.", es: "El perro debe estar vacunado contra la rabia, registrada con vacuna, fechas y lote en el certificado sanitario.", pt: "O cachorro deve ser vacinado contra a raiva, registrada com a vacina, as datas e o lote no atestado de saúde." }
    exceptions: { en: "The exact post-vaccination waiting period and validity window are not officially published by Lebanon. Lebanon is rabies-endemic. Timing: Unknown — confirm with your vet.", fr: "Le délai exact après vaccination et la fenêtre de validité ne sont pas publiés officiellement par le Liban. Le Liban est en endémie rabique. Délais : non communiqués — à confirmer avec ton vétérinaire.", es: "El Líbano no publica oficialmente el periodo exacto de espera posterior a la vacunación ni la ventana de valide. El Líbano tiene rabia endémica. Plazos: no publicado — confírmalo con tu veterinario.", pt: "O período exato de espera após a vacinação e a janela de validade não são publicados oficialmente pelo Líbano. O Líbano é endêmico para raiva. Prazo: Não comunicado — confirme com o seu veterinário." }
    ref: { en: "Consulate General of Lebanon (New York); Decree No. 12301 (veterinary quarantine)", fr: "Consulat général du Liban (New York) ; décret n° 12301 (quarantaine vétérinaire)", es: "Consulado General del Líbano (Nueva York); Decreto n.º 12301 (cuarentena veterinaria)", pt: "Consulado-Geral do Líbano (Nova York); Decreto nº 12301 (quarentena veterinária)" }
  - item: { en: "Other canine vaccinations", fr: "Autres vaccins canins", es: "Otras vacunas caninas", pt: "Outras vacinações caninas" }
    required: { en: "Required", fr: "Requis", es: "Obligatorias", pt: "Obrigatório" }
    when: { en: "Dogs must be vaccinated against other contagious diseases — distemper, hepatitis, parvovirus and leptospirosis — recorded in the vaccination booklet and on the certificate.", fr: "Les chiens doivent être vaccinés contre d'autres maladies contagieuses — maladie de Carré, hépatite, parvovirose et leptospirose — consignées dans le carnet et sur le certificat.", es: "Los perros deben estar vacunados contra otras enfermedades contagiosas — moquillo, hepatitis, parvovirus y leptospirosis — registradas en la cartilla de vacunación y en el certificado.", pt: "Os cachorros devem ser vacinados contra outras doenças contagiosas — cinomose, hepatite, parvovirose e leptospirose — registradas na carteira de vacinação e no atestado." }
    exceptions: { en: "None published.", fr: "Aucune publiée.", es: "Ninguna publicada.", pt: "Nenhuma publicada." }
    ref: { en: "Consulate General of Lebanon (New York) — Shipping of Pets", fr: "Consulat général du Liban (New York) — Expédition d'animaux", es: "Consulado General del Líbano (Nueva York) — Envío de mascotas", pt: "Consulado-Geral do Líbano (Nova York) — Envio de Animais de Estimação" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not published", fr: "Non communiqué", es: "No publicado", pt: "Não publicado" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Lebanon does not officially publish whether a rabies antibody test is required to enter. Its status is Unknown — do not assume it is or is not required; confirm with the Ministry of Agriculture veterinary services or a Lebanese consulate.", fr: "Le Liban ne publie pas officiellement si un titrage antirabique est exigé à l'entrée. Son statut est inconnu — ne présume ni qu'il est requis ni le contraire ; confirme auprès des services vétérinaires du ministère de l'Agriculture ou d'un consulat libanais.", es: "El Líbano no publica oficialmente si se exige una prueba de titulación de rabia para entrar. Su situación es desconocida — no des por hecho que se exige o no; confírmalo con los servicios veterinarios del Ministerio de Agricultura o un consulado libanés.", pt: "O Líbano não publica oficialmente se o teste sorológico antirrábico é exigido para entrar. Sua situação é Não comunicado — não presuma que ele é ou não exigido; confirme com os serviços veterinários do Ministério da Agricultura ou um consulado libanês." }
    ref: { en: "Ministry of Agriculture — veterinary services (procedure not published)", fr: "Ministère de l'Agriculture — services vétérinaires (procédure non publiée)", es: "Ministerio de Agricultura — servicios veterinarios (procedimiento no publicado)", pt: "Ministério da Agricultura — serviços veterinários (procedimento não publicado)" }
  - item: { en: "Official veterinary health certificate", fr: "Certificat vétérinaire officiel", es: "Certificado sanitario veterinario oficial", pt: "Certificado veterinário oficial" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "A health certificate issued by a licensed veterinarian confirming the dog is healthy, free of infectious disease and has completed the required vaccinations, completed within about 10 days before travel.", fr: "Un certificat établi par un vétérinaire agréé attestant que le chien est sain, indemne de maladie infectieuse et à jour des vaccinations requises, établi dans les 10 jours environ avant le voyage.", es: "Un certificado sanitario expedido por un veterinario autorizado que confirme que el perro está sano, libre de enfermedades infecciosas y ha completado las vacunas requeridas, cumplimentado en torno a los 10 días previos al viaje.", pt: "Um atestado de saúde emitido por um veterinário licenciado, confirmando que o cachorro está saudável, livre de doença infecciosa e com as vacinas exigidas em dia, concluído dentro de cerca de 10 dias antes da viagem." }
    exceptions: { en: "Decree No. 12301 requires a veterinary health certificate from the country of origin. Endorsement by the origin country's government veterinary authority is standard international practice but not separately detailed by Lebanon.", fr: "Le décret n° 12301 exige un certificat sanitaire du pays d'origine. Le visa par l'autorité vétérinaire gouvernementale du pays d'origine est une pratique internationale courante mais non détaillée séparément par le Liban.", es: "El Decreto n.º 12301 exige un certificado sanitario veterinario del país de origen. El refrendo por la autoridad veterinaria gubernamental del país de origen es una práctica internacional habitual, pero el Líbano no lo detalla por separado.", pt: "O Decreto nº 12301 exige um atestado de saúde veterinário do país de origem. O endosso pela autoridade veterinária governamental do país de origem é prática internacional padrão, mas não é detalhado separadamente pelo Líbano." }
    ref: { en: "Consulate General of Lebanon (New York); Decree No. 12301", fr: "Consulat général du Liban (New York) ; décret n° 12301", es: "Consulado General del Líbano (Nueva York); Decreto n.º 12301", pt: "Consulado-Geral do Líbano (Nova York); Decreto nº 12301" }
  - item: { en: "Internal & external parasite treatment", fr: "Traitement antiparasitaire interne & externe", es: "Tratamiento antiparasitario interno y externo", pt: "Tratamento antiparasitário interno e externo" }
    required: { en: "Not published", fr: "Non communiqué", es: "No publicado", pt: "Não publicado" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Lebanon does not officially publish a mandatory tapeworm or ecto-parasite treatment for dog entry. Status Unknown; a treatment recorded by your vet before travel is nonetheless good practice.", fr: "Le Liban ne publie pas officiellement de traitement obligatoire contre le ténia ou les ectoparasites pour l'entrée d'un chien. Statut inconnu ; un traitement consigné par ton vétérinaire avant le départ reste une bonne pratique.", es: "El Líbano no publica oficialmente un tratamiento obligatorio contra la tenia o los ectoparásitos para la entrada de un perro. Situación desconocida; no obstante, un tratamiento registrado por tu veterinario antes del viaje es una buena práctica.", pt: "O Líbano não publica oficialmente um tratamento obrigatório contra tênia ou ectoparasitas para a entrada de cachorros. Situação Não comunicado; ainda assim, um tratamento registrado pelo seu veterinário antes da viagem é boa prática." }
    ref: { en: "Ministry of Agriculture — veterinary services (not specified)", fr: "Ministère de l'Agriculture — services vétérinaires (non précisé)", es: "Ministerio de Agricultura — servicios veterinarios (no especificado)", pt: "Ministério da Agricultura — serviços veterinários (não especificado)" }
  - item: { en: "Import permit / advance approval", fr: "Permis d'importation / autorisation préalable", es: "Permiso de importación / autorización previa", pt: "Autorização de importação / aprovação prévia" }
    required: { en: "On arrival (from customs)", fr: "À l'arrivée (auprès de la douane)", es: "A la llegada (en aduanas)", pt: "Na chegada (pela alfândega)" }
    when: { en: "On arrival, the owner obtains an import permit/clearance from a customs officer at the point of entry. No advance import permit is documented for a personal pet dog.", fr: "À l'arrivée, le propriétaire obtient un permis/dédouanement d'importation auprès d'un agent des douanes au point d'entrée. Aucun permis d'importation préalable n'est documenté pour un chien de compagnie personnel.", es: "A la llegada, el propietario obtiene un permiso/despacho de importación de un agente de aduanas en el punto de entrada. No hay documentado ningún permiso de importación previo para un perro de compañía personal.", pt: "Na chegada, o dono obtém uma autorização/liberação de importação junto a um agente da alfândega no ponto de entrada. Nenhuma autorização de importação prévia é documentada para um cachorro de estimação pessoal." }
    exceptions: { en: "Whether prior approval is ever needed (for example multiple animals) is not officially published. Confirm with the airline and Lebanese customs before travel.", fr: "La nécessité éventuelle d'une autorisation préalable (par exemple pour plusieurs animaux) n'est pas publiée officiellement. À confirmer avec la compagnie et la douane libanaise avant le voyage.", es: "Si alguna vez se necesita una autorización previa (por ejemplo, para varios animales) no se publica oficialmente. Confírmalo con la aerolínea y la aduana libanesa antes del viaje.", pt: "Se uma aprovação prévia é necessária em algum caso (por exemplo, para vários animais) não é publicado oficialmente. Confirme com a companhia aérea e a alfândega libanesa antes de viajar." }
    ref: { en: "Consulate General of Lebanon (New York) — Shipping of Pets", fr: "Consulat général du Liban (New York) — Expédition d'animaux", es: "Consulado General del Líbano (Nueva York) — Envío de mascotas", pt: "Consulado-Geral do Líbano (Nova York) — Envio de Animais de Estimação" }
  - item: { en: "Arrival veterinary control", fr: "Contrôle vétérinaire à l'arrivée", es: "Control veterinario a la llegada", pt: "Controle veterinário na chegada" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Under Decree No. 12301 all animals entering Lebanon are subject to veterinary health control at the border to prevent introduction of disease; documents are checked and the animal is inspected.", fr: "En vertu du décret n° 12301, tous les animaux entrant au Liban sont soumis à un contrôle sanitaire vétérinaire à la frontière pour empêcher l'introduction de maladies ; les documents sont vérifiés et l'animal inspecté.", es: "En virtud del Decreto n.º 12301, todos los animales que entran en el Líbano están sujetos a un control sanitario veterinario en la frontera para evitar la introducción de enfermedades; se revisan los documentos y se inspecciona al animal.", pt: "Segundo o Decreto nº 12301, todos os animais que entram no Líbano são submetidos a controle sanitário veterinário na fronteira para evitar a introdução de doenças; os documentos são conferidos e o animal é inspecionado." }
    exceptions: { en: "Entry is through designated border points; the exact designated points and office hours are not published on the portal.", fr: "L'entrée se fait par des points frontière désignés ; les points exacts et les horaires ne sont pas publiés sur le portail.", es: "La entrada se realiza por puntos fronterizos designados; los puntos designados exactos y el horario de oficina no se publican en el portal.", pt: "A entrada é feita por pontos de fronteira designados; os pontos exatos designados e o horário de expediente não são publicados no portal." }
    ref: { en: "Decree No. 12301 (veterinary quarantine)", fr: "Décret n° 12301 (quarantaine vétérinaire)", es: "Decreto n.º 12301 (cuarentena veterinaria)", pt: "Decreto nº 12301 (quarentena veterinária)" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Possible under decree", fr: "Possible selon le décret", es: "Posible según el decreto", pt: "Possível segundo o decreto" }
    when: { en: "Decree No. 12301 provides for veterinary quarantine, sets quarantine premises and a quarantine duration, and defines special procedures for animals from endemic countries and steps if disease appears.", fr: "Le décret n° 12301 prévoit la quarantaine vétérinaire, fixe les locaux et une durée de quarantaine, et définit des procédures particulières pour les animaux provenant de pays endémiques ainsi que les mesures en cas d'apparition de maladie.", es: "El Decreto n.º 12301 prevé la cuarentena veterinaria, fija los locales de cuarentena y una duración de cuarentena, y define procedimientos especiales para los animales procedentes de países endémicos y las medidas si aparece una enfermedad.", pt: "O Decreto nº 12301 prevê a quarentena veterinária, estabelece instalações de quarentena e uma duração de quarentena, e define procedimentos especiais para animais vindos de países endêmicos e as medidas a tomar caso surja doença." }
    exceptions: { en: "Whether a healthy, fully documented personal pet is routinely quarantined, and the exact duration, are not clearly published. Status Unknown; expect discretion of the veterinary authority.", fr: "La mise en quarantaine systématique d'un animal de compagnie sain et bien documenté, ainsi que la durée exacte, ne sont pas clairement publiées. Statut inconnu ; attends-toi à l'appréciation de l'autorité vétérinaire.", es: "No se publica claramente si una mascota personal sana y con toda la documentación se pone en cuarentena de forma rutinaria, ni la duración exacta. Situación desconocida; cuenta con la discrecionalidad de la autoridad veterinaria.", pt: "Se um animal de estimação pessoal saudável e com toda a documentação em dia é colocado em quarentena de rotina, e a duração exata, não são claramente publicados. Situação Não comunicado; espere que fique a critério da autoridade veterinária." }
    ref: { en: "Decree No. 12301 (veterinary quarantine)", fr: "Décret n° 12301 (quarantaine vétérinaire)", es: "Decreto n.º 12301 (cuarentena veterinaria)", pt: "Decreto nº 12301 (quarentena veterinária)" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Not published", fr: "Non communiqué", es: "No publicado", pt: "Não publicado" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Lebanon does not officially publish a minimum travelling age. In practice a puppy must be old enough to be validly vaccinated against rabies, but no stand-alone age is confirmed. Unknown.", fr: "Le Liban ne publie pas officiellement d'âge minimum pour voyager. En pratique, un chiot doit être en âge d'être valablement vacciné contre la rage, mais aucun âge distinct n'est confirmé. Non communiqué.", es: "El Líbano no publica oficialmente una edad mínima para viajar. En la práctica, un cachorro debe tener edad suficiente para ser vacunado válidamente contra la rabia, pero no hay confirmada ninguna edad independiente. No publicado.", pt: "O Líbano não publica oficialmente uma idade mínima de viagem. Na prática, um filhote deve ter idade suficiente para ser validamente vacinado contra a raiva, mas nenhuma idade isolada é confirmada. Não comunicado." }
    ref: { en: "Ministry of Agriculture — veterinary services (not specified)", fr: "Ministère de l'Agriculture — services vétérinaires (non précisé)", es: "Ministerio de Agricultura — servicios veterinarios (no especificado)", pt: "Ministério da Agricultura — serviços veterinários (não especificado)" }
  - item: { en: "Restricted / dangerous breeds", fr: "Races restreintes / dangereuses", es: "Razas restringidas / peligrosas", pt: "Raças restritas / perigosas" }
    required: { en: "Not published", fr: "Non communiqué", es: "No publicado", pt: "Não publicado" }
    when: { en: "Lebanon's Animal Protection and Welfare Law No. 47/2017 allows the Minister of Agriculture to designate dangerous animals by ministerial order, but no public list of banned or restricted dog breeds for import is officially confirmed.", fr: "La loi n° 47/2017 sur la protection et le bien-être animal permet au ministre de l'Agriculture de désigner par arrêté les animaux dangereux, mais aucune liste publique de races de chiens interdites ou restreintes à l'importation n'est confirmée officiellement.", es: "La Ley de Protección y Bienestar Animal del Líbano n.º 47/2017 permite al Ministro de Agricultura designar animales peligrosos por orden ministerial, pero no hay confirmada oficialmente ninguna lista pública de razas de perros prohibidas o restringidas para la importación.", pt: "A Lei de Proteção e Bem-Estar Animal do Líbano nº 47/2017 permite que o Ministro da Agricultura designe animais perigosos por decreto ministerial, mas nenhuma lista pública de raças de cachorros proibidas ou restritas para importação é oficialmente confirmada." }
    exceptions: { en: "Because a designation by order is possible and may change, confirm your dog's breed status with the Ministry of Agriculture or a Lebanese consulate before travelling. Unknown.", fr: "Une désignation par arrêté étant possible et susceptible d'évoluer, confirme le statut de la race de ton chien auprès du ministère de l'Agriculture ou d'un consulat libanais avant de voyager. Non communiqué.", es: "Como una designación por orden es posible y puede cambiar, confirma la situación de la raza de tu perro con el Ministerio de Agricultura o un consulado libanés antes de viajar. No publicado.", pt: "Como uma designação por decreto é possível e pode mudar, confirme a situação da raça do seu cachorro com o Ministério da Agricultura ou um consulado libanês antes de viajar. Não comunicado." }
    ref: { en: "Law No. 47/2017 (Animal Protection and Welfare), Article 7", fr: "Loi n° 47/2017 (protection et bien-être animal), article 7", es: "Ley n.º 47/2017 (Protección y Bienestar Animal), artículo 7", pt: "Lei nº 47/2017 (Proteção e Bem-Estar Animal), artigo 7" }

origin:
  scheme: eu
  eu:
    title: { en: "From Europe / the EU", fr: "Depuis l'Europe / l'UE", es: "Desde Europa / la UE", pt: "Da Europa / da UE" }
    body:
      en: "There is no EU pet-passport shortcut into Lebanon: the EU passport is not a Lebanese document. A dog from Europe needs a microchip, a valid rabies vaccination, the other canine vaccinations and an official veterinary health certificate issued within about 10 days before travel. Keep in mind that Lebanon is not on the EU's list of listed third countries, so a dog later returning to the EU from Lebanon faces the stricter non-listed re-entry procedure (including a rabies antibody test carried out before leaving the EU)."
      fr: "Aucun raccourci « passeport européen » pour entrer au Liban : le passeport UE n'est pas un document libanais. Un chien venant d'Europe a besoin d'une puce, d'une vaccination antirabique valide, des autres vaccins canins et d'un certificat vétérinaire officiel établi dans les 10 jours environ avant le voyage. Note que le Liban ne figure pas sur la liste UE des pays tiers listés ; un chien revenant ensuite dans l'UE depuis le Liban est donc soumis à la procédure de réintroduction non listée plus stricte (dont un titrage antirabique réalisé avant de quitter l'UE)."
      es: "No hay atajo de «pasaporte europeo» para entrar en el Líbano: el pasaporte de la UE no es un documento libanés. Un perro procedente de Europa necesita un microchip, una vacunación antirrábica válida, las demás vacunas caninas y un certificado sanitario veterinario oficial expedido en torno a los 10 días previos al viaje. Ten en cuenta que el Líbano no figura en la lista de la UE de países terceros listados, por lo que un perro que regrese después a la UE desde el Líbano se enfrenta al procedimiento de reentrada no listado más estricto (que incluye una prueba de titulación de rabia realizada antes de salir de la UE)."
      pt: "Não há atalho de passaporte europeu para entrar no Líbano: o passaporte da UE não é um documento libanês. Um cachorro vindo da Europa precisa de microchip, vacinação antirrábica válida, as demais vacinas caninas e um atestado de saúde veterinário oficial emitido dentro de cerca de 10 dias antes da viagem. Tenha em mente que o Líbano não está na lista de países terceiros listados da UE, portanto um cachorro que depois voltar à UE vindo do Líbano enfrenta o procedimento mais rigoroso de reentrada para países não listados (incluindo um teste sorológico antirrábico realizado antes de sair da UE)."
    cls: warn
  listed:
    title: { en: "From another third country", fr: "Depuis un autre pays tiers", es: "Desde otro país tercero", pt: "De outro país terceiro" }
    body:
      en: "From the United States, Canada, the Gulf and other third countries, the same documented core applies: microchip, rabies vaccination, other canine vaccines and a veterinary health certificate close to departure. Note that USDA/APHIS reports it has not been officially informed of Lebanon's dog and cat requirements, so no country-specific agreed certificate exists for the US — travellers rely on a standard international health certificate and Lebanese consular guidance."
      fr: "Depuis les États-Unis, le Canada, le Golfe et d'autres pays tiers, le même socle documenté s'applique : puce, vaccination antirabique, autres vaccins canins et certificat sanitaire vétérinaire peu avant le départ. Note que l'USDA/APHIS indique ne pas avoir été officiellement informé des exigences libanaises pour chiens et chats ; aucun certificat convenu propre au pays n'existe pour les USA — les voyageurs s'appuient sur un certificat sanitaire international standard et les indications consulaires libanaises."
      es: "Desde Estados Unidos, Canadá, el Golfo y otros países terceros se aplica la misma base documentada: microchip, vacunación antirrábica, otras vacunas caninas y un certificado sanitario veterinario poco antes de la salida. Ten en cuenta que el USDA/APHIS informa de que no ha sido informado oficialmente de los requisitos del Líbano para perros y gatos, por lo que no existe un certificado acordado específico por país para Estados Unidos — los viajeros se basan en un certificado sanitario internacional estándar y en las indicaciones consulares libanesas."
      pt: "Vindo dos Estados Unidos, do Canadá, do Golfo e de outros países terceiros, aplica-se a mesma base documentada: microchip, vacinação antirrábica, outras vacinas caninas e um atestado de saúde veterinário próximo à partida. Observe que o USDA/APHIS informa não ter sido oficialmente comunicado das exigências do Líbano para cachorros e gatos, portanto não existe um atestado específico acordado com os EUA — os viajantes contam com um atestado de saúde internacional padrão e a orientação consular libanesa."
    cls: warn
  nonListed:
    title: { en: "From a high-rabies-risk country", fr: "Depuis un pays à haut risque rabique", es: "Desde un país de alto riesgo de rabia", pt: "De um país de alto risco de raiva" }
    body:
      en: "Lebanon is itself rabies-endemic, and Decree No. 12301 sets special import procedures for animals coming from countries where disease is endemic. Whether a rabies antibody test or additional measures apply is not officially published, and quarantine is possible under the decree. Expect closer scrutiny, carry original documents, and confirm the current procedure with the Ministry of Agriculture veterinary services before booking."
      fr: "Le Liban est lui-même en endémie rabique, et le décret n° 12301 prévoit des procédures d'importation particulières pour les animaux provenant de pays où des maladies sont endémiques. L'application d'un titrage antirabique ou de mesures supplémentaires n'est pas publiée officiellement, et une quarantaine est possible selon le décret. Attends-toi à un contrôle renforcé, munis-toi des originaux et confirme la procédure à jour auprès des services vétérinaires du ministère de l'Agriculture avant de réserver."
      es: "El propio Líbano tiene rabia endémica, y el Decreto n.º 12301 establece procedimientos de importación especiales para los animales procedentes de países donde una enfermedad es endémica. Si se aplica una prueba de titulación de rabia o medidas adicionales no se publica oficialmente, y la cuarentena es posible según el decreto. Espera un control más estricto, lleva los documentos originales y confirma el procedimiento vigente con los servicios veterinarios del Ministerio de Agricultura antes de reservar."
      pt: "O próprio Líbano é endêmico para raiva, e o Decreto nº 12301 estabelece procedimentos de importação especiais para animais vindos de países onde a doença é endêmica. Se um teste sorológico antirrábico ou medidas adicionais se aplicam não é publicado oficialmente, e a quarentena é possível segundo o decreto. Espere um controle mais rigoroso, leve os documentos originais e confirme o procedimento atual com os serviços veterinários do Ministério da Agricultura antes de reservar."
    cls: no

arrival:
  intro:
    en: "When your dog reaches Lebanon, the veterinary services carry out the health control at the border and customs handles the import clearance."
    fr: "À l'arrivée de ton chien au Liban, les services vétérinaires effectuent le contrôle sanitaire à la frontière et la douane gère le dédouanement à l'importation."
    es: "Cuando tu perro llega al Líbano, los servicios veterinarios realizan el control sanitario en la frontera y la aduana se encarga del despacho de importación."
    pt: "Quando o seu cachorro chega ao Líbano, os serviços veterinários realizam o controle sanitário na fronteira e a alfândega cuida da liberação da importação."
  points:
    - en: "Under Decree No. 12301, every arriving animal undergoes veterinary health control to prevent the introduction of disease; entry is through designated border points."
      fr: "En vertu du décret n° 12301, tout animal arrivant subit un contrôle sanitaire vétérinaire pour empêcher l'introduction de maladies ; l'entrée se fait par des points frontière désignés."
      es: "En virtud del Decreto n.º 12301, todo animal que llega se somete a un control sanitario veterinario para evitar la introducción de enfermedades; la entrada se realiza por puntos fronterizos designados."
      pt: "Segundo o Decreto nº 12301, todo animal que chega passa por controle sanitário veterinário para evitar a introdução de doenças; a entrada é feita por pontos de fronteira designados."
    - en: "Present original documents: the microchip record, proof of rabies and other vaccinations, and the veterinary health certificate — carry originals, not copies."
      fr: "Présente les documents originaux : le justificatif de puce, la preuve de vaccination antirabique et des autres vaccins, et le certificat sanitaire vétérinaire — munis-toi des originaux, pas de copies."
      es: "Presenta los documentos originales: el registro del microchip, la prueba de la rabia y de las demás vacunas, y el certificado sanitario veterinario — lleva los originales, no copias."
      pt: "Apresente os documentos originais: o registro do microchip, o comprovante da vacinação antirrábica e das demais vacinas, e o atestado de saúde veterinário — leve originais, não cópias."
    - en: "Obtain the import permit/clearance from the customs officer on arrival at the airport."
      fr: "Obtiens le permis/dédouanement d'importation auprès de l'agent des douanes à l'arrivée à l'aéroport."
      es: "Obtén el permiso/despacho de importación del agente de aduanas a la llegada al aeropuerto."
      pt: "Obtenha a autorização/liberação de importação junto ao agente da alfândega na chegada ao aeroporto."
    - en: "The decree provides for quarantine premises and a quarantine duration; a healthy, fully documented pet is normally cleared, but the veterinary authority may hold an animal if disease is suspected or documents are deficient."
      fr: "Le décret prévoit des locaux et une durée de quarantaine ; un animal sain et bien documenté passe normalement, mais l'autorité vétérinaire peut retenir un animal en cas de suspicion de maladie ou de documents incomplets."
      es: "El decreto prevé locales de cuarentena y una duración de cuarentena; una mascota sana y con toda la documentación se despacha normalmente, pero la autoridad veterinaria puede retener a un animal si se sospecha una enfermedad o los documentos son deficientes."
      pt: "O decreto prevê instalações de quarentena e uma duração de quarentena; um animal de estimação saudável e com toda a documentação em dia normalmente é liberado, mas a autoridade veterinária pode reter um animal se houver suspeita de doença ou se os documentos forem deficientes."
    - en: "If documents are missing or invalid, the animal may be refused, returned or placed under veterinary control — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, l'animal peut être refusé, renvoyé ou placé sous contrôle vétérinaire — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, el animal puede ser rechazado, devuelto o puesto bajo control veterinario — a cargo del propietario."
      pt: "Se faltarem documentos ou eles forem inválidos, o animal pode ter a entrada recusada, ser devolvido ou colocado sob controle veterinário — às custas do dono."

