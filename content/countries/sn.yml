# Country Entry Guide — Senegal (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_sn
iso2: "SN"
name: { en: "Senegal", fr: "Sénégal", es: "Senegal", pt: "Senegal" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
exit:
  authority: DSV
  authorityUrl: https://elevage.sec.gouv.sn/
  intro:
    en: "Senegal is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export authorization from the Veterinary Services (DSV)."
    fr: "Le Sénégal est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus une autorisation d'export des Services vétérinaires (DSV)."
    es: "Senegal no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más una autorización de exportación de los Servicios Veterinarios (DSV)."
    pt: "O Senegal é um país não listado: por isso, um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de uma autorização de exportação dos Services Vétérinaires (DSV)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "Request the export authorization from the Director of Veterinary Services; an international zoosanitary certificate is then issued and certified by an official veterinarian, with veterinary inspection for pets flying out."
        fr: "Demande l'autorisation d'export au Directeur des Services vétérinaires ; un certificat zoosanitaire international est ensuite délivré et certifié par un vétérinaire officiel, avec inspection vétérinaire pour les animaux qui prennent l'avion."
        es: "Solicita la autorización de exportación al Director de los Servicios Veterinarios; después se emite y certifica un certificado zoosanitario internacional por un veterinario oficial, con inspección veterinaria para las mascotas que vuelan."
        pt: "Peça a autorização de exportação ao Directeur des Services Vétérinaires (Diretor dos Serviços Veterinários); em seguida, um certificado zoossanitário internacional é emitido e certificado por um veterinário oficial, com inspeção veterinária para os animais de estimação que embarcam."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Senegal with your dog", fr: "Voyager au Sénégal avec ton chien", es: "Viajar a Senegal con tu perro", pt: "Viajar para o Senegal com seu cachorro" }
  intro:
    en: >-
      Senegal welcomes pet dogs, but entry runs through the country's own scheme managed by the
      Direction des Services Vétérinaires (DSV) of the Ministry responsible for livestock, not the
      EU framework. Before you travel you must obtain an import authorization ("autorisation
      d'introduction d'animaux de compagnie") from the DSV: it is requested in advance, is valid for
      three months, and must be presented on arrival. Every dog also needs a permanent identification
      (microchip or tattoo), a valid rabies vaccination and an original international veterinary health
      certificate issued shortly before departure by a government-mandated vet of the country of
      origin, along with an up-to-date vaccination booklet. On arrival, the animal and its documents
      are checked by the official veterinary services. This guide explains the import authorization,
      the rabies rule, the certificate and the border check so you know exactly what to prepare before
      you book your flight.
    fr: >-
      Le Sénégal accueille les chiens, mais l'entrée passe par le dispositif propre au pays, géré par
      la Direction des Services Vétérinaires (DSV) du ministère chargé de l'élevage, et non par le
      cadre de l'UE. Avant de voyager, tu dois obtenir une autorisation d'introduction d'animaux de
      compagnie auprès de la DSV : elle se demande à l'avance, est valable trois mois et doit être
      présentée à l'arrivée. Chaque chien doit aussi disposer d'une identification permanente (puce
      électronique ou tatouage), d'une vaccination antirabique valide et de l'original d'un certificat
      vétérinaire international établi peu avant le départ par un vétérinaire mandaté du pays d'origine,
      ainsi que d'un carnet de vaccination à jour. À l'arrivée, l'animal et ses documents sont
      contrôlés par les services vétérinaires officiels. Ce guide détaille l'autorisation
      d'importation, la règle antirabique, le certificat et le contrôle à la frontière, pour savoir
      exactement quoi préparer avant de réserver ton vol.
    es: >-
      Senegal acoge a los perros de compañía, pero la entrada se rige por el sistema propio del país,
      gestionado por la Direction des Services Vétérinaires (DSV) del Ministerio responsable de la
      ganadería, y no por el marco de la UE. Antes de viajar debes obtener una autorización de
      importación («autorisation d'introduction d'animaux de compagnie») de la DSV: se solicita con
      antelación, es válida durante tres meses y debe presentarse a la llegada. Cada perro necesita
      además una identificación permanente (microchip o tatuaje), una vacunación antirrábica válida y
      el original de un certificado sanitario veterinario internacional emitido poco antes de la salida
      por un veterinario habilitado del país de origen, junto con una cartilla de vacunación
      actualizada. A la llegada, el animal y sus documentos son revisados por los servicios
      veterinarios oficiales. Esta guía explica la autorización de importación, la regla antirrábica, el
      certificado y el control fronterizo para que sepas exactamente qué preparar antes de reservar tu
      vuelo.

    pt: "O Senegal recebe cachorros de estimação, mas a entrada segue o sistema próprio do país, gerido pela Direction des Services Vétérinaires (DSV) do Ministério responsável pela pecuária, e não o marco da UE. Antes de viajar, você precisa obter uma autorização de importação (\"autorisation d'introduction d'animaux de compagnie\") junto à DSV: ela é solicitada com antecedência, vale três meses e deve ser apresentada na chegada. Todo cachorro também precisa de uma identificação permanente (microchip ou tatuagem), de uma vacinação antirrábica válida e do original de um certificado veterinário internacional emitido pouco antes da partida por um veterinário credenciado pelo governo do país de origem, além de uma carteira de vacinação atualizada. Na chegada, o animal e seus documentos são verificados pelos serviços veterinários oficiais. Este guia explica a autorização de importação, a regra sobre a raiva, o certificado e o controle na fronteira, para você saber exatamente o que preparar antes de reservar o voo."
difficulty:
  level: moderate
  label: { en: "Moderate — advance import authorization + veterinary certificate", fr: "Modéré — autorisation d'importation préalable + certificat vétérinaire", es: "Moderado — autorización de importación previa + certificado veterinario", pt: "Moderado — autorização de importação prévia + certificado veterinário" }

prepTime:
  eu:
    en: "From the EU: allow one to two weeks — request the DSV import authorization in advance, and have an official vet issue the international veterinary certificate close to departure if identification and rabies vaccination are already in order."
    fr: "Depuis l'UE : prévois une à deux semaines — demande l'autorisation d'importation de la DSV à l'avance, et fais établir le certificat vétérinaire international par un vétérinaire officiel peu avant le départ si l'identification et la vaccination antirabique sont déjà en règle."
    es: "Desde la UE: cuenta con una o dos semanas — solicita con antelación la autorización de importación de la DSV y haz que un veterinario oficial emita el certificado veterinario internacional poco antes de la salida si la identificación y la vacunación antirrábica ya están en regla."
    pt: "Da UE: conte de uma a duas semanas — peça a autorização de importação da DSV com antecedência e peça a um veterinário oficial que emita o certificado veterinário internacional perto da data de partida, se a identificação e a vacinação antirrábica já estiverem em ordem."
  listed:
    en: "From another third country: similar timing using that country's official export certificate model; allow about 3 weeks if the first rabies shot is still needed, since the vaccination must precede the certificate."
    fr: "Depuis un autre pays tiers : délais comparables avec le modèle de certificat d'exportation officiel du pays ; prévois environ 3 semaines s'il faut encore faire le premier vaccin antirabique, car la vaccination doit précéder le certificat."
    es: "Desde otro país tercero: plazos similares usando el modelo de certificado de exportación oficial de ese país; cuenta con unas 3 semanas si aún falta la primera vacuna antirrábica, ya que la vacunación debe preceder al certificado."
    pt: "De outro país terceiro: prazos parecidos, usando o modelo oficial de certificado de exportação desse país; conte cerca de 3 semanas se a primeira dose da vacina antirrábica ainda for necessária, já que a vacinação precisa ser anterior ao certificado."
  nonListed:
    en: "Whatever the origin, the limiting step is the advance import authorization and the rabies vaccination itself — plan around requesting the DSV authorization early rather than around a long list of tests."
    fr: "Quelle que soit l'origine, l'étape limitante est l'autorisation d'importation préalable et la vaccination antirabique elle-même — organise-toi autour de la demande anticipée de l'autorisation DSV plutôt qu'autour d'une longue liste de tests."
    es: "Sea cual sea el origen, el paso limitante es la autorización de importación previa y la propia vacunación antirrábica — organízate en torno a solicitar pronto la autorización de la DSV, más que en torno a una larga lista de pruebas."
    pt: "Seja qual for a origem, a etapa limitante é a autorização de importação prévia e a própria vacinação antirrábica — organize-se para pedir cedo a autorização da DSV, e não em torno de uma longa lista de exames."

