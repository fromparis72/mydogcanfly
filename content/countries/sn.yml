restrictedDogs:
  intro:
    en: "No breed-specific import ban for dogs is published on Senegal's official veterinary or government-service pages. Entry is controlled by the import authorization and the health requirements, not by a national list of prohibited breeds."
    fr: "Aucune interdiction d'importation par race pour les chiens n'est publiée sur les pages officielles vétérinaires ou de service public du Sénégal. L'entrée est encadrée par l'autorisation d'importation et les exigences sanitaires, non par une liste nationale de races interdites."
    es: "No se publica ninguna prohibición de importación por raza para perros en las páginas oficiales veterinarias o de servicio público de Senegal. La entrada se controla mediante la autorización de importación y los requisitos sanitarios, no por una lista nacional de razas prohibidas."
    pt: "Nenhuma proibição de importação específica por raça de cachorro está publicada nas páginas veterinárias oficiais ou de serviços públicos do Senegal. A entrada é controlada pela autorização de importação e pelas exigências sanitárias, e não por uma lista nacional de raças proibidas."
  cat1:
    en: "We found no official Senegalese instrument banning breeds such as pit bull types from import. This is an absence of published rule rather than a positive authorisation of any specific breed."
    fr: "Nous n'avons trouvé aucun texte officiel sénégalais interdisant à l'importation des races comme les types pit-bull. Il s'agit d'une absence de règle publiée, et non d'une autorisation expresse d'une race précise."
    es: "No encontramos ningún texto oficial senegalés que prohíba la importación de razas como los tipos pit bull. Se trata de una ausencia de regla publicada, y no de una autorización expresa de ninguna raza concreta."
    pt: "Não encontramos nenhum instrumento oficial senegalês que proíba a importação de raças como os tipos pit bull. Isso é a ausência de regra publicada, e não uma autorização expressa de qualquer raça específica."
  cat2:
    en: "There is likewise no published lighter 'permitted with conditions' breed category at the border. Local ownership or public-order rules could still exist; they are not part of the published import procedure."
    fr: "Il n'existe de même aucune catégorie allégée « autorisée sous conditions » publiée à la frontière. Des règles locales de détention ou d'ordre public pourraient exister ; elles ne font pas partie de la procédure d'importation publiée."
    es: "Tampoco existe ninguna categoría más ligera de raza «autorizada con condiciones» publicada en la frontera. Podrían existir normas locales de tenencia o de orden público; no forman parte del procedimiento de importación publicado."
    pt: "Também não existe, na fronteira, nenhuma categoria intermediária publicada de raças 'permitidas com condições'. Podem existir regras locais de posse ou de ordem pública; elas não fazem parte do procedimento de importação publicado."
  note:
    en: "Because rules can change and may not be fully published online, confirm your dog's breed and any cross with the DSV before you travel."
    fr: "Les règles pouvant évoluer et n'étant pas toujours entièrement publiées en ligne, confirme la race de ton chien et tout croisement auprès de la DSV avant de voyager."
    es: "Como las normas pueden cambiar y no siempre se publican por completo en línea, confirma la raza de tu perro y cualquier cruce con la DSV antes de viajar."
    pt: "Como as regras podem mudar e nem sempre são publicadas por completo on-line, confirme a raça do seu cachorro e qualquer cruzamento com a DSV antes de viajar."

checklist:
  - en: "Request the DSV import authorization in advance (state country of origin, species/breed, traveller's name)"
    fr: "Demande l'autorisation d'importation de la DSV à l'avance (précise pays d'origine, espèce/race, nom du voyageur)"
    es: "Solicita la autorización de importación de la DSV con antelación (indica país de origen, especie/raza, nombre del viajero)"
    pt: "Peça a autorização de importação da DSV com antecedência (indique país de origem, espécie/raça, nome do viajante)"
  - en: "Permanent identification (ISO microchip or legible tattoo) placed before the rabies vaccination"
    fr: "Identification permanente (puce ISO ou tatouage lisible) posée avant la vaccination antirabique"
    es: "Identificación permanente (microchip ISO o tatuaje legible) colocada antes de la vacunación antirrábica"
    pt: "Identificação permanente (microchip ISO ou tatuagem legível) aplicada antes da vacinação antirrábica"
  - en: "Valid rabies vaccination recorded in the vaccination booklet (primary shot at least 21 days before travel)"
    fr: "Vaccination antirabique valide consignée dans le carnet de vaccination (primo-vaccination au moins 21 jours avant le voyage)"
    es: "Vacunación antirrábica válida registrada en la cartilla de vacunación (primovacunación al menos 21 días antes del viaje)"
    pt: "Vacinação antirrábica válida registrada na carteira de vacinação (primovacinação pelo menos 21 dias antes da viagem)"
  - en: "Original international veterinary certificate issued shortly before departure and validated by the official authority"
    fr: "Original du certificat vétérinaire international établi peu avant le départ et validé par l'autorité officielle"
    es: "Original del certificado veterinario internacional emitido poco antes de la salida y validado por la autoridad oficial"
    pt: "Original do certificado veterinário internacional emitido pouco antes da partida e validado pela autoridade oficial"
  - en: "Up-to-date vaccination booklet (carnet de vaccination) carried with you"
    fr: "Carnet de vaccination à jour emporté avec toi"
    es: "Cartilla de vacunación (carnet de vaccination) actualizada que lleves contigo"
    pt: "Carteira de vacinação (carnet de vaccination) atualizada levada com você"
  - en: "Check that the import authorization is still valid (3 months) on your arrival date"
    fr: "Vérifie que l'autorisation d'importation est encore valable (3 mois) à ta date d'arrivée"
    es: "Comprueba que la autorización de importación sigue siendo válida (3 meses) en tu fecha de llegada"
    pt: "Verifique se a autorização de importação ainda é válida (3 meses) na sua data de chegada"
  - en: "Original documents ready for the border veterinary check and customs"
    fr: "Documents originaux prêts pour le contrôle vétérinaire frontalier et la douane"
    es: "Documentos originales listos para el control veterinario fronterizo y las aduanas"
    pt: "Documentos originais prontos para o controle veterinário de fronteira e a alfândega"
  - en: "If you will return to the EU, plan the rabies antibody test (Senegal is rabies-endemic)"
    fr: "Si tu rentre dans l'UE, prévois le titrage antirabique (le Sénégal est à rage endémique)"
    es: "Si vas a regresar a la UE, planifica la prueba de titulación de rabia (en Senegal la rabia es endémica)"
    pt: "Se você for voltar à UE, programe o teste sorológico antirrábico (no Senegal a raiva é endêmica)"
  - en: "Airline reservation confirming your dog's travel option and suitable IATA crate"
    fr: "Réservation confirmant l'option de transport de ton chien et caisse IATA adaptée"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y jaula IATA adecuada"
    pt: "Reserva na companhia aérea confirmando a opção de transporte do seu cachorro e caixa de transporte adequada às normas da IATA"

