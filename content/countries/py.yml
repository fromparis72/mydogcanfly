# Country Entry Guide — Paraguay (bilingual EN/FR).
# Paraguay is NOT in the EU. This encodes Paraguay's own SENACSA scheme, which applies the Mercosur
# standard now in force: Resolución GMC N° 20/2024 "Requisitos zoosanitarios de los Estados Partes para
# el ingreso y circulación de caninos y felinos domésticos" (repealing the former GMC 17/15).
# The key document is an International Veterinary Certificate (CVI) issued by the origin's veterinary
# authority, presented to a SENACSA inspector at the entry point: clinical exam, rabies vaccination and
# internal & external antiparasitic treatment. No rabies antibody test, no microchip mandate and no
# quarantine for a compliant pet. Microchip, praziquantel and a Leishmaniosis test are Uruguay-only
# add-ons, NOT Paraguayan entry requirements. The breed list on SENACSA's page belongs to the United
# Arab Emirates destination section (export), not to Paraguay's own import rules.
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_py
iso2: "PY"
name: { en: "Paraguay", fr: "Paraguay", es: "Paraguay", pt: "Paraguai" }
region: { en: "South America", fr: "Amérique du Sud", es: "América del Sur", pt: "América do Sul" }


regime: non_listed
exit:
  authority: SENACSA
  authorityUrl: https://senacsa.gov.py/servicios/sanidad-animal-identidad-y-trazabilidad/cuarentena/viajar-con-mascotas/
  intro:
    en: "Paraguay is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by SENACSA."
    fr: "Le Paraguay est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par le SENACSA."
    es: "Paraguay no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el SENACSA."
    pt: "O Paraguai é um país não listado, então o teste sorológico antirrábico válido é obrigatório para voltar à União Europeia — além de um atestado de saúde de exportação endossado pelo SENACSA."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "SENACSA's certification department authorises the export and issues the international veterinary certificate (CVI) in person after online application."
        fr: "Le département de certification du SENACSA autorise l'export et délivre le certificat vétérinaire international (CVI) en présentiel après demande en ligne."
        es: "El departamento de certificación del SENACSA autoriza la exportación y emite el certificado veterinario internacional (CVI) de forma presencial tras la solicitud en línea."
        pt: "O departamento de certificação do SENACSA autoriza a exportação e emite o certificado veterinário internacional (CVI) presencialmente, após a solicitação on-line."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Paraguay with your dog", fr: "Voyager au Paraguay avec ton chien", es: "Viajar a Paraguay con tu perro", pt: "Viajar ao Paraguai com seu cachorro" }
  intro:
    en: >-
      Paraguay welcomes dogs, and its entry rules are refreshingly uniform: the same procedure applies to
      a personal pet arriving from almost anywhere. SENACSA (Servicio Nacional de Calidad y Salud Animal),
      the national animal-health authority, applies the Mercosur standard in force — Resolución GMC N°
      20/2024 — and asks for a single document: an International Veterinary Certificate (CVI) issued,
      signed and stamped by the official veterinary authority of the country you travel from, or a current
      official passport endorsed by that authority. The CVI must show a clinical examination, a valid
      rabies vaccination and internal and external antiparasitic treatment. There is no rabies antibody
      test, no compulsory microchip and no quarantine for a healthy pet — SENACSA simply inspects your dog
      and its documents at the point of entry. This guide explains exactly what to prepare, and the timing
      to respect, before you book your flight.
    fr: >-
      Le Paraguay accueille les chiens, et ses règles d'entrée sont d'une simplicité rassurante : la même
      procédure s'applique à un animal de compagnie venant de presque partout. Le SENACSA (Servicio
      Nacional de Calidad y Salud Animal), l'autorité sanitaire animale nationale, applique la norme
      Mercosur en vigueur — la Resolución GMC N° 20/2024 — et demande un seul document : un Certificat
      Vétérinaire International (CVI) émis, signé et scellé par l'autorité vétérinaire officielle du pays
      de départ, ou un passeport officiel en cours de validité refrendé par cette autorité. Le CVI doit
      attester un examen clinique, une vaccination antirabique valide et un traitement antiparasitaire
      interne et externe. Pas de titrage antirabique, pas de puce obligatoire et pas de quarantaine pour
      un animal en bonne santé — le SENACSA inspecte simplement ton chien et ses documents au point
      d'entrée. Ce guide détaille exactement quoi préparer, et les délais à respecter, avant de réserver
      ton vol.
    es: >-
      Paraguay acoge a los perros, y sus normas de entrada son de una uniformidad tranquilizadora: se
      aplica el mismo procedimiento a una mascota personal que llega desde casi cualquier lugar. El
      SENACSA (Servicio Nacional de Calidad y Salud Animal), la autoridad nacional de sanidad animal,
      aplica la norma del Mercosur en vigor — la Resolución GMC N° 20/2024 — y pide un único documento: un
      Certificado Veterinario Internacional (CVI) emitido, firmado y sellado por la autoridad veterinaria
      oficial del país desde el que viajas, o un pasaporte oficial vigente refrendado por esa autoridad. El
      CVI debe acreditar un examen clínico, una vacunación antirrábica válida y un tratamiento
      antiparasitario interno y externo. No hay prueba de titulación de rabia, ni microchip obligatorio, ni
      cuarentena para una mascota sana — el SENACSA simplemente inspecciona a tu perro y sus documentos en
      el punto de entrada. Esta guía explica exactamente qué preparar, y los plazos que hay que respetar,
      antes de reservar tu vuelo.

    pt: "O Paraguai recebe bem os cachorros, e suas regras de entrada são de uma uniformidade tranquilizadora: o mesmo procedimento vale para um animal de estimação que chega de quase qualquer lugar. O SENACSA (Servicio Nacional de Calidad y Salud Animal), a autoridade nacional de saúde animal, aplica a norma do Mercosul em vigor — a Resolución GMC N° 20/2024 — e pede um único documento: um Certificado Veterinário Internacional (CVI) emitido, assinado e carimbado pela autoridade veterinária oficial do país de onde você parte, ou um passaporte oficial dentro da validade endossado por essa autoridade. O CVI precisa atestar um exame clínico, uma vacinação antirrábica válida e um tratamento antiparasitário interno e externo. Não há teste sorológico antirrábico, nem microchip obrigatório, nem quarentena para um animal saudável — o SENACSA simplesmente inspeciona seu cachorro e seus documentos no ponto de entrada. Este guia explica exatamente o que preparar, e os prazos a respeitar, antes de comprar a passagem."
difficulty:
  level: easy
  label: { en: "Easy — one uniform Mercosur scheme for most origins", fr: "Facile — un régime Mercosur uniforme pour la plupart des origines", es: "Fácil — un régimen Mercosur uniforme para la mayoría de los orígenes", pt: "Fácil — um único procedimento do Mercosul para a maioria das origens" }

prepTime:
  eu:
    en: "Standard case: a few days to assemble the CVI once vaccination is valid — the clinical exam is done within 10 days before the CVI, deworming within 15 days before it, and the CVI is valid 60 days."
    fr: "Cas standard : quelques jours pour réunir le CVI une fois la vaccination valide — l'examen clinique est fait dans les 10 jours avant le CVI, la vermifugation dans les 15 jours avant, et le CVI est valable 60 jours."
    es: "Caso estándar: unos días para reunir el CVI una vez que la vacunación es válida — el examen clínico se hace dentro de los 10 días previos al CVI, la desparasitación dentro de los 15 días previos, y el CVI es válido 60 días."
    pt: "Caso padrão: alguns dias para montar o CVI quando a vacinação já está válida — o exame clínico é feito nos 10 dias anteriores ao CVI, a vermifugação nos 15 dias anteriores a ele, e o CVI vale 60 dias."
  listed:
    en: "If the first rabies shot is still needed: plan ~3 weeks, as a primary vaccination must be given at least 21 days before shipment."
    fr: "Si la première vaccination reste à faire : prévois ~3 semaines, une primo-vaccination devant être faite au moins 21 jours avant l'embarquement."
    es: "Si aún falta la primera vacuna antirrábica: prevé ~3 semanas, ya que una primovacunación debe aplicarse al menos 21 días antes del embarque."
    pt: "Se ainda faltar a primeira dose antirrábica: conte cerca de 3 semanas, já que a primovacinação precisa ser aplicada no mínimo 21 dias antes do embarque."
  nonListed:
    en: "Puppies under 90 days: extra certification on the CVI (age + no urban-rabies contact where the pup lived in the last 90 days), so allow more preparation time."
    fr: "Chiots de moins de 90 jours : certification supplémentaire sur le CVI (âge + aucun contact avec un cas de rage urbaine là où le chiot a vécu ces 90 derniers jours), prévois plus de temps."
    es: "Cachorros de menos de 90 días: certificación adicional en el CVI (edad + ningún contacto con la rabia urbana donde el cachorro vivió en los últimos 90 días), así que prevé más tiempo de preparación."
    pt: "Filhotes com menos de 90 dias: certificação extra no CVI (idade + ausência de contato com caso de raiva urbana onde o filhote viveu nos últimos 90 dias), então reserve mais tempo de preparação."

