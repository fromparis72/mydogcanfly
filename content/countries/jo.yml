# Country Entry Guide — Jordan (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_jo
iso2: "JO"
name: { en: "Jordan", fr: "Jordanie", es: "Jordania", pt: "Jordânia" }
region: { en: "Middle East", fr: "Moyen-Orient", es: "Oriente Medio", pt: "Oriente Médio" }


regime: non_listed
exit:
  authority: Ministry of Agriculture
  authorityUrl: https://www.moa.gov.jo
  intro:
    en: "Jordan is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus a health certificate endorsed by a government veterinarian of the Ministry of Agriculture."
    fr: "La Jordanie est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire visé par un vétérinaire officiel du ministère de l'Agriculture."
    es: "Jordania no está listada: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario refrendado por un veterinario oficial del Ministerio de Agricultura."
    pt: "A Jordânia não é um país listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde endossado por um veterinário do governo do Ministério da Agricultura."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "The Ministry of Agriculture oversees export permits and veterinary requirements; your dog's health certificate must be endorsed by a government veterinarian before the flight."
        fr: "Le ministère de l'Agriculture supervise les permis d'export et les exigences vétérinaires ; le certificat sanitaire de ton chien doit être visé par un vétérinaire officiel avant le vol."
        es: "El Ministerio de Agricultura supervisa los permisos de exportación y los requisitos veterinarios; el certificado sanitario de tu perro debe ser refrendado por un veterinario oficial antes del vuelo."
        pt: "O Ministério da Agricultura supervisiona as autorizações de exportação e as exigências veterinárias; o atestado de saúde do seu cachorro deve ser endossado por um veterinário do governo antes do voo."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Jordan with your dog", fr: "Voyager en Jordanie avec ton chien", es: "Viajar a Jordania con tu perro", pt: "Viajar para a Jordânia com seu cachorro" }
  intro:
    en: >-
      Jordan (the Hashemite Kingdom of Jordan) is a non-EU country, so the EU pet-passport framework
      does not apply here. Entry is governed by Jordan's own authorities: the Ministry of Agriculture,
      which is the competent veterinary authority for importing live animals, together with Jordan
      Customs at the border. The Ministry of Agriculture issues the import permit for a live animal, and
      that permit is where the exact conditions for your dog are set out. Jordan does not publish a
      single, detailed public checklist for personal pet-dog imports, and the country is classified as
      high-risk for dog rabies. Because several key details are not officially published, this guide
      states clearly what is confirmed by official sources and what you must confirm directly with the
      Ministry of Agriculture before you book. Always request your import permit early and travel with
      an official government-endorsed veterinary health certificate.
    fr: >-
      La Jordanie (Royaume hachémite de Jordanie) est un pays hors UE : le cadre du passeport européen
      pour animaux ne s'applique donc pas. L'entrée relève des autorités jordaniennes : le ministère de
      l'Agriculture, autorité vétérinaire compétente pour l'importation d'animaux vivants, ainsi que la
      Douane jordanienne à la frontière. Le ministère de l'Agriculture délivre le permis d'importation
      d'un animal vivant, et c'est ce permis qui fixe les conditions exactes pour ton chien. La
      Jordanie ne publie pas de liste publique détaillée unique pour l'importation personnelle de
      chiens, et le pays est classé à haut risque pour la rage canine. Plusieurs points clés n'étant pas
      officiellement publiés, ce guide distingue clairement ce qui est confirmé par des sources
      officielles de ce que tu dois confirmer directement auprès du ministère de l'Agriculture avant
      de réserver. Demande toujours ton permis d'importation tôt et voyage avec un certificat
      vétérinaire officiel visé par l'autorité gouvernementale.
    es: >-
      Jordania (el Reino Hachemita de Jordania) es un país fuera de la UE, así que el marco del
      pasaporte europeo para mascotas no se aplica aquí. La entrada está regulada por las propias
      autoridades jordanas: el ministerio de Agricultura, que es la autoridad veterinaria competente
      para la importación de animales vivos, junto con la Aduana de Jordania en la frontera. El
      ministerio de Agricultura expide el permiso de importación de un animal vivo, y es ese permiso el
      que establece las condiciones exactas para tu perro. Jordania no publica una lista pública
      detallada única para las importaciones personales de perros como mascotas, y el país está
      clasificado como de alto riesgo para la rabia canina. Como varios detalles clave no están
      publicados oficialmente, esta guía indica con claridad qué está confirmado por fuentes oficiales y
      qué debes confirmar directamente con el ministerio de Agricultura antes de reservar. Solicita
      siempre tu permiso de importación con antelación y viaja con un certificado veterinario oficial
      refrendado por la autoridad gubernamental.

    pt: "A Jordânia (o Reino Hachemita da Jordânia) é um país fora da UE, portanto o regime europeu de passaporte para animais de estimação não se aplica aqui. A entrada é regida pelas próprias autoridades jordanianas: o Ministério da Agricultura, autoridade veterinária competente para a importação de animais vivos, junto com a Alfândega da Jordânia na fronteira. O Ministério da Agricultura emite a autorização de importação de um animal vivo, e é nessa autorização que as condições exatas para o seu cachorro são definidas. A Jordânia não publica uma única lista de verificação pública detalhada para a importação pessoal de cachorros de estimação, e o país é classificado como de alto risco para a raiva canina. Como vários detalhes-chave não são publicados oficialmente, este guia indica claramente o que é confirmado por fontes oficiais e o que você precisa confirmar diretamente com o Ministério da Agricultura antes de reservar. Solicite sempre a autorização de importação com antecedência e viaje com um atestado de saúde veterinário oficial endossado pelo governo."
difficulty:
  level: difficult
  label: { en: "Difficult — import permit required, several details not officially published", fr: "Difficile — permis d'importation requis, plusieurs détails non publiés officiellement", es: "Difícil — se requiere permiso de importación, varios detalles no publicados oficialmente", pt: "Difícil — autorização de importação obrigatória, vários detalhes não publicados oficialmente" }

prepTime:
  eu:
    en: "From Europe / the EU: no EU-passport shortcut. Plan ahead for the Ministry of Agriculture import permit and an official government-endorsed veterinary health certificate. Exact lead time is set by the permit and is not publicly published — confirm with the Ministry of Agriculture."
    fr: "Depuis l'Europe / l'UE : aucun raccourci « passeport UE ». Prévois le permis d'importation du ministère de l'Agriculture et un certificat vétérinaire officiel visé par l'autorité gouvernementale. Le délai exact est fixé par le permis et n'est pas publié — à confirmer auprès du ministère de l'Agriculture."
    es: "Desde Europa / la UE: sin atajo de pasaporte europeo. Prevé con antelación el permiso de importación del ministerio de Agricultura y un certificado veterinario oficial refrendado por la autoridad gubernamental. El plazo exacto lo fija el permiso y no está publicado — confírmalo con el ministerio de Agricultura."
    pt: "Da Europa / da UE: não há atalho de passaporte europeu. Planeje com antecedência a autorização de importação do Ministério da Agricultura e um atestado de saúde veterinário oficial endossado pelo governo. O prazo exato é definido pela autorização e não é publicado publicamente — confirme com o Ministério da Agricultura."
  listed:
    en: "From another rabies-controlled country: same core steps — import permit and endorsed veterinary health certificate. Specific timelines are not officially published; obtain the permit before travelling."
    fr: "Depuis un autre pays à rage maîtrisée : mêmes étapes de base — permis d'importation et certificat vétérinaire visé. Les délais précis ne sont pas publiés officiellement ; obtiens le permis avant de voyager."
    es: "Desde otro país con la rabia controlada: los mismos pasos básicos — permiso de importación y certificado veterinario refrendado. Los plazos concretos no están publicados oficialmente; obtén el permiso antes de viajar."
    pt: "De outro país com raiva controlada: as mesmas etapas básicas — autorização de importação e atestado de saúde veterinário endossado. Os prazos específicos não são publicados oficialmente; obtenha a autorização antes de viajar."
  nonListed:
    en: "From a high-rabies-risk country: expect closer scrutiny. Jordan is itself classified as high-risk for dog rabies. The import permit conditions and any extra measures are decided case-by-case by the Ministry of Agriculture."
    fr: "Depuis un pays à haut risque rabique : attends-toi à un contrôle renforcé. La Jordanie est elle-même classée à haut risque pour la rage canine. Les conditions du permis et d'éventuelles mesures supplémentaires sont décidées au cas par cas par le ministère de l'Agriculture."
    es: "Desde un país de alto riesgo de rabia: espera un control más estricto. La propia Jordania está clasificada como de alto riesgo para la rabia canina. Las condiciones del permiso y cualquier medida adicional las decide caso por caso el ministerio de Agricultura."
    pt: "De um país de alto risco de raiva: espere um controle mais rigoroso. A própria Jordânia é classificada como de alto risco para a raiva canina. As condições da autorização de importação e quaisquer medidas adicionais são decididas caso a caso pelo Ministério da Agricultura."

