    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro."
    pt: "Só um médico-veterinário pode confirmar o procedimento exato para o seu cachorro."
  - en: "Several Jordanian pet-import details are not officially published; the definitive conditions are set on the import permit issued by the Ministry of Agriculture."
    fr: "Plusieurs détails d'importation d'animaux en Jordanie ne sont pas publiés officiellement ; les conditions définitives figurent sur le permis d'importation délivré par le ministère de l'Agriculture."
    es: "Varios detalles sobre la importación de mascotas en Jordania no están publicados oficialmente; las condiciones definitivas figuran en el permiso de importación expedido por el ministerio de Agricultura."
    pt: "Vários detalhes da importação de animais de estimação na Jordânia não são publicados oficialmente; as condições definitivas são estabelecidas na autorização de importação emitida pelo Ministério da Agricultura."
