# Country Entry Guide — Tunisia (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_tn
iso2: "TN"
name: { en: "Tunisia", fr: "Tunisie", es: "Túnez", pt: "Tunísia" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
domestic:
  intro:
    en: "Domestic flight in Tunisia: no travel formality is published — the vaccination booklet is asked for by the carrier."
    fr: "Vol intérieur en Tunisie : aucune formalité de voyage n'est publiée — le carnet de vaccination est demandé par la compagnie."
    es: "Vuelo nacional en Túnez: no se publica ningún trámite de viaje — la cartilla de vacunación la pide la aerolínea."
    pt: "Voo doméstico na Tunísia: nenhuma formalidade de viagem é publicada — a caderneta de vacinação é solicitada pela companhia."
  points:
    - en: "Rabies vaccination is described by the ministry as free and compulsory as a public-health measure, but nothing ties it to travel, and the administrative services list no domestic pet certificate."
      fr: "La vaccination antirabique est présentée par le ministère comme gratuite et obligatoire au titre de la santé publique, mais rien ne la relie au voyage, et les services administratifs ne listent aucun certificat intérieur pour animaux."
      es: "El ministerio presenta la vacuna antirrábica como gratuita y obligatoria por salud pública, pero nada la vincula al viaje, y los servicios administrativos no listan ningún certificado nacional para mascotas."
      pt: "A vacinação antirrábica é descrita pelo ministério como gratuita e obrigatória como medida de saúde pública, mas nada a vincula à viagem, e os serviços administrativos não listam nenhum certificado interno para animais."
    - en: "The domestic operator does require a vaccination booklet to carry an animal — the only vaccination requirement genuinely attached to a Tunisian domestic flight, and it is contractual."
      fr: "L'opérateur intérieur exige bien un carnet de vaccination pour transporter un animal — la seule exigence vaccinale réellement attachée à un vol intérieur tunisien, et elle est contractuelle."
      es: "El operador nacional sí exige una cartilla de vacunación para transportar un animal — el único requisito de vacunación realmente ligado a un vuelo nacional tunecino, y es contractual."
      pt: "O operador doméstico realmente exige uma caderneta de vacinação para transportar um animal — a única exigência de vacinação genuinamente ligada a um voo doméstico tunisiano, e ela é contratual."
exit:
  authority: DGSV
  authorityUrl: https://www.douane.gov.tn/animaux-de-compagnie/
  intro:
    en: "Tunisia is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an official export health certificate endorsed by a government veterinarian."
    fr: "La Tunisie est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export officiel visé par un vétérinaire officiel."
    es: "Túnez no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación visado por un veterinario oficial."
    pt: "A Tunísia não é um país listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para retornar à UE — além de um certificado veterinário de exportação oficial endossado por um veterinário do governo."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico (titulação): exame de sangue em um laboratório aprovado pela UE, pelo menos 30 dias após a vacinação — um resultado válido é essencial para retornar à UE e não pode ser resolvido de última hora."
    - timing: window
      scope: any
      text:
        en: "An international health certificate is drawn up by a practising vet and must be endorsed by an official government veterinarian shortly before the flight."
        fr: "Un certificat sanitaire international est établi par un vétérinaire sanitaire et doit être visé par un vétérinaire officiel peu avant le vol."
        es: "Un certificado sanitario internacional lo redacta un veterinario sanitario y debe ser visado por un veterinario oficial poco antes del vuelo."
        pt: "Um certificado sanitário internacional é elaborado por um veterinário clínico e precisa ser endossado por um veterinário oficial do governo pouco antes do voo."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico (titulação) da UE válido antes de sair, ele continua válido por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Tunisia with your dog", fr: "Voyager en Tunisie avec ton chien", es: "Viajar a Túnez con tu perro", pt: "Viajar para a Tunísia com seu cachorro" }
  intro:
    en: >-
      Tunisia welcomes pet dogs, but entry runs through the country's own scheme managed by the
      Ministry of Agriculture's veterinary authority (Direction Générale des Services Vétérinaires,
      DGSV), not the EU framework. A dog travelling with its owner as a personal pet needs a valid
      rabies vaccination and an original official veterinary health certificate (certificat
      sanitaire) issued shortly before departure by a government vet of the country of origin, plus
      the animal's health booklet. On arrival, your dog is checked by the border veterinary services
      alongside customs. A short list of dangerous breeds is banned outright. This guide explains the
      certificate, the rabies rule, the border check and the banned breeds so you know exactly what
      to prepare before you book your flight.
    fr: >-
      La Tunisie accueille les chiens, mais l'entrée passe par le dispositif propre au pays, géré par
      l'autorité vétérinaire du ministère de l'Agriculture (Direction Générale des Services
      Vétérinaires, DGSV), et non par le cadre de l'UE. Un chien voyageant avec son propriétaire comme
      animal de compagnie doit disposer d'une vaccination antirabique valide et de l'original d'un
      certificat sanitaire officiel établi peu avant le départ par un vétérinaire officiel du pays
      d'origine, ainsi que du carnet de santé de l'animal. À l'arrivée, ton chien est contrôlé par
      les services vétérinaires frontaliers, aux côtés de la douane. Une courte liste de races
      dangereuses est totalement interdite. Ce guide détaille le certificat, la règle antirabique, le
      contrôle à la frontière et les races interdites, pour savoir exactement quoi préparer avant de
      réserver ton vol.
    es: >-
      Túnez acoge a los perros, pero la entrada se rige por el propio sistema del país, gestionado por
      la autoridad veterinaria del ministerio de Agricultura (Direction Générale des Services
      Vétérinaires, DGSV), y no por el marco de la UE. Un perro que viaja con su propietario como
      mascota personal necesita una vacunación antirrábica válida y el original de un certificado
      sanitario veterinario oficial (certificat sanitaire) expedido poco antes de la salida por un
      veterinario oficial del país de origen, además de la cartilla sanitaria del animal. A la llegada,
      tu perro es revisado por los servicios veterinarios fronterizos, junto con las aduanas. Una breve
      lista de razas peligrosas está totalmente prohibida. Esta guía explica el certificado, la norma
      antirrábica, el control fronterizo y las razas prohibidas, para que sepas exactamente qué preparar
      antes de reservar tu vuelo.

    pt: "A Tunísia recebe bem os cachorros de estimação, mas a entrada passa pelo dispositivo próprio do país, gerido pela autoridade veterinária do ministério da Agricultura (Direction Générale des Services Vétérinaires, DGSV), e não pelo marco da UE. Um cachorro que viaja com o seu dono como animal de estimação pessoal precisa de uma vacinação antirrábica válida e do original de um certificado veterinário oficial (certificat sanitaire) emitido pouco antes da partida por um veterinário do governo do país de origem, além da caderneta de saúde do animal. Na chegada, o seu cachorro é verificado pelos serviços veterinários de fronteira junto com a alfândega. Uma curta lista de raças perigosas é totalmente proibida. Este guia explica o certificado, a regra antirrábica, a verificação na fronteira e as raças proibidas, para você saber exatamente o que preparar antes de reservar o seu voo."
difficulty:
  level: moderate
  label: { en: "Moderate — official veterinary certificate required", fr: "Modéré — certificat sanitaire officiel requis", es: "Moderado — se exige certificado sanitario veterinario oficial", pt: "Moderado — certificado veterinário oficial obrigatório" }

prepTime:
  eu:
    en: "From the EU: a few days if the rabies vaccination is already valid — the veterinary health certificate is issued by an official vet shortly before departure."
    fr: "Depuis l'UE : quelques jours si la vaccination antirabique est déjà valide — le certificat sanitaire est établi par un vétérinaire officiel peu avant le départ."
    es: "Desde la UE: unos días si la vacunación antirrábica ya es válida — el certificado sanitario lo expide un veterinario oficial poco antes de la salida."
    pt: "Da UE: alguns dias se a vacinação antirrábica já for válida — o certificado veterinário é emitido por um veterinário oficial pouco antes da partida."
  listed:
    en: "From any other country: similar timing; allow about 3 weeks if the first rabies shot is still needed, since the vaccination must be given before the certificate."
    fr: "Depuis tout autre pays : délais comparables ; prévois environ 3 semaines s'il faut encore faire le premier vaccin antirabique, car la vaccination doit précéder le certificat."
    es: "Desde cualquier otro país: plazos similares; prevé unas 3 semanas si aún falta la primera vacuna antirrábica, ya que la vacunación debe administrarse antes del certificado."
    pt: "De qualquer outro país: prazo semelhante; reserve cerca de 3 semanas se ainda for necessária a primeira dose antirrábica, já que a vacinação precisa ser aplicada antes do certificado."
  nonListed:
    en: "Whatever the origin, the certificate is issued close to departure, so most of the time is the rabies vaccination itself — plan around it rather than around Tunisian paperwork."
    fr: "Quelle que soit l'origine, le certificat est délivré peu avant le départ ; l'essentiel du délai tient donc à la vaccination antirabique elle-même — organise-toi autour d'elle plutôt qu'autour des formalités tunisiennes."
    es: "Sea cual sea el origen, el certificado se expide poco antes de la salida, así que la mayor parte del tiempo es la propia vacunación antirrábica — organízate en torno a ella y no en torno a los trámites tunecinos."
    pt: "Seja qual for a origem, o certificado é emitido próximo da partida, então a maior parte do tempo é a própria vacinação antirrábica — planeje-se em torno dela, e não em torno da burocracia tunisiana."

