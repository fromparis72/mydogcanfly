factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Tunisia (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — la Tunisie (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Túnez (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — a Tunísia (seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Tunisia", fr: "Pays de destination — Tunisie", es: "País de destino — Túnez", pt: "País de destino — Tunísia" }
      text:
        en: "Tunisia runs its own DGSV scheme: a valid rabies vaccination and an original official veterinary health certificate are always required, and your dog is checked by the border veterinary services on arrival. Certain dangerous breeds are banned outright."
        fr: "La Tunisie applique son propre dispositif DGSV : une vaccination antirabique valide et l'original d'un certificat sanitaire officiel sont toujours exigés, et ton chien est contrôlé par les services vétérinaires frontaliers à l'arrivée. Certaines races dangereuses sont totalement interdites."
        es: "Túnez aplica su propio sistema de la DGSV: siempre se exigen una vacunación antirrábica válida y el original de un certificado sanitario veterinario oficial, y tu perro es revisado por los servicios veterinarios fronterizos a la llegada. Ciertas razas peligrosas están totalmente prohibidas."
        pt: "A Tunísia aplica o seu próprio dispositivo da DGSV: uma vacinação antirrábica válida e o original de um certificado veterinário oficial são sempre exigidos, e o seu cachorro é verificado pelos serviços veterinários de fronteira na chegada. Certas raças perigosas são totalmente proibidas."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The health certificate is issued by an official vet in the country of departure, using that country's official model. The country of departure decides who signs your certificate and shapes the rabies-vaccination evidence the Tunisian border expects."
        fr: "Le certificat sanitaire est établi par un vétérinaire officiel du pays de départ, selon le modèle officiel de ce pays. Le pays de départ détermine qui signe ton certificat et conditionne les preuves de vaccination antirabique attendues à la frontière tunisienne."
        es: "El certificado sanitario lo expide un veterinario oficial del país de salida, usando el modelo oficial de ese país. El país de salida determina quién firma tu certificado y condiciona las pruebas de vacunación antirrábica que espera la frontera tunecina."
        pt: "O certificado veterinário é emitido por um veterinário oficial no país de partida, usando o modelo oficial desse país. O país de partida determina quem assina o seu certificado e molda as provas de vacinação antirrábica que a fronteira tunisiana espera."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "Your dog's rabies history and recent country of residence matter to the veterinary services, not only the last airport. A stay in a rabies-risk country can affect what the border vet asks for, so confirm your dog's full history with your vet and the DGSV."
        fr: "L'historique antirabique et le pays de résidence récent de ton chien comptent pour les services vétérinaires, pas seulement l'aéroport de destination finale. Un séjour dans un pays à risque rabique peut influer sur ce que demande le vétérinaire frontalier ; confirme donc l'historique complet de ton chien avec ton vétérinaire et la DGSV."
        es: "El historial antirrábico y el país de residencia reciente de tu perro importan a los servicios veterinarios, no solo el último aeropuerto. Una estancia en un país con riesgo de rabia puede influir en lo que pide el veterinario fronterizo, así que confirma el historial completo de tu perro con tu veterinario y la DGSV."
        pt: "O histórico de raiva do seu cachorro e o país de residência recente importam para os serviços veterinários, não apenas o último aeroporto. Uma estadia em um país de risco de raiva pode afetar o que o veterinário de fronteira pede, então confirme o histórico completo do seu cachorro com o seu veterinário e com a DGSV."
  note:
    en: "So read the requirements below as Tunisia's framework, then confirm your dog's exact origin and history with your vet and the DGSV before booking."
    fr: "Lis donc les exigences ci-dessous comme le cadre tunisien, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire et la DGSV avant de réserver."
    es: "Así que lee los requisitos siguientes como el marco de Túnez y luego confirma el origen y el historial exactos de tu perro con tu veterinario y la DGSV antes de reservar."
    pt: "Portanto, leia as exigências abaixo como o marco da Tunísia e, depois, confirme a origem exata e o histórico do seu cachorro com o seu veterinário e com a DGSV antes de reservar."

requirements:
  - item: { en: "Identification (microchip)", fr: "Identification (puce électronique)", es: "Identificación (microchip)", pt: "Identificação (microchip)" }
    required: { en: "Recommended", fr: "Recommandée", es: "Recomendado", pt: "Recomendado" }
    when: { en: "An ISO microchip is the standard way to identify the animal on the health certificate and is needed for a later return to the EU; place it before the rabies vaccination.", fr: "Une puce ISO est le moyen standard d'identifier l'animal sur le certificat sanitaire et est nécessaire pour un retour ultérieur vers l'UE ; posez-la avant la vaccination antirabique.", es: "Un microchip ISO es la forma estándar de identificar al animal en el certificado sanitario y es necesario para un regreso posterior a la UE; implántalo antes de la vacunación antirrábica.", pt: "Um microchip ISO é a forma padrão de identificar o animal no certificado veterinário e é necessário para um retorno posterior à UE; implante-o antes da vacinação antirrábica." }
    exceptions: { en: "The Tunisian customs portal lists the certificate and health booklet but does not publish a separate microchip rule — confirm with the DGSV.", fr: "Le portail de la douane tunisienne mentionne le certificat et le carnet de santé mais ne publie pas de règle distincte sur la puce — à confirmer auprès de la DGSV.", es: "El portal de la aduana tunecina menciona el certificado y la cartilla sanitaria, pero no publica una norma específica sobre el microchip — a confirmar con la DGSV.", pt: "O portal da alfândega tunisiana lista o certificado e a caderneta de saúde, mas não publica uma regra específica sobre o microchip — confirme com a DGSV." }
    ref: { en: "Douane Tunisienne — Animaux de compagnie", fr: "Douane Tunisienne — Animaux de compagnie", es: "Douane Tunisienne — Animaux de compagnie", pt: "Douane Tunisienne — Animaux de compagnie" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "The dog must be vaccinated against rabies; the vaccination is recorded in the health booklet and referenced on the certificate. It is commonly applied as valid from at least 30 days and less than 12 months after the injection — confirm the exact window with the DGSV.", fr: "Le chien doit être vacciné contre la rage ; la vaccination est consignée dans le carnet de santé et reportée sur le certificat. Elle est généralement considérée comme valide à partir d'au moins 30 jours et moins de 12 mois après l'injection — confirme la fenêtre exacte auprès de la DGSV.", es: "El perro debe estar vacunado contra la rabia; la vacunación se registra en la cartilla sanitaria y se refleja en el certificado. Suele considerarse válida a partir de al menos 30 días y menos de 12 meses después de la inyección — confirma la ventana exacta con la DGSV.", pt: "O cachorro precisa ser vacinado contra a raiva; a vacinação é registrada na caderneta de saúde e referenciada no certificado. Ela costuma ser considerada válida a partir de pelo menos 30 dias e até menos de 12 meses após a aplicação — confirme a janela exata com a DGSV." }
    exceptions: { en: "If the dog is under 3 months old, its mother must have been vaccinated against rabies.", fr: "Si le chien a moins de 3 mois, sa mère doit avoir été vaccinée contre la rage.", es: "Si el perro tiene menos de 3 meses, su madre debe haber sido vacunada contra la rabia.", pt: "Se o cachorro tiver menos de 3 meses, a mãe dele precisa ter sido vacinada contra a raiva." }
    ref: { en: "Douane Tunisienne — Animaux de compagnie", fr: "Douane Tunisienne — Animaux de compagnie", es: "Douane Tunisienne — Animaux de compagnie", pt: "Douane Tunisienne — Animaux de compagnie" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not published", fr: "Non prévu", es: "No prevista", pt: "Não publicado" }
    when: { en: "Tunisia's published pet-import rules do not mention a rabies antibody test for personal pets, and it is generally not requested from listed origins.", fr: "Les règles publiées d'importation d'animaux de compagnie en Tunisie ne mentionnent pas de titrage antirabique pour les animaux personnels, et il n'est généralement pas demandé depuis les origines listées.", es: "Las normas publicadas de importación de mascotas en Túnez no mencionan una prueba de titulación de rabia para las mascotas personales, y generalmente no se solicita desde los orígenes listados.", pt: "As regras publicadas da Tunísia para importação de animais de estimação não mencionam um teste sorológico antirrábico para animais pessoais, e geralmente ele não é solicitado de origens listadas." }
    exceptions: { en: "Unknown for specific cases — confirm with the DGSV, as requirements can differ by the dog's origin and rabies history.", fr: "Non communiqué pour les cas particuliers — à confirmer auprès de la DGSV, les exigences pouvant varier selon l'origine et l'historique rabique du chien.", es: "No comunicado para casos particulares — a confirmar con la DGSV, ya que los requisitos pueden variar según el origen y el historial antirrábico del perro.", pt: "Não comunicado para casos específicos — confirme com a DGSV, pois as exigências podem variar conforme a origem e o histórico de raiva do cachorro." }
    ref: { en: "Douane Tunisienne — Animaux de compagnie; DGSV", fr: "Douane Tunisienne — Animaux de compagnie ; DGSV", es: "Douane Tunisienne — Animaux de compagnie; DGSV", pt: "Douane Tunisienne — Animaux de compagnie; DGSV" }
  - item: { en: "Veterinary health certificate (certificat sanitaire)", fr: "Certificat sanitaire vétérinaire", es: "Certificado sanitario veterinario (certificat sanitaire)", pt: "Certificado veterinário (certificat sanitaire)" }
    required: { en: "Required (original)", fr: "Requis (original)", es: "Obligatorio (original)", pt: "Obrigatório (original)" }
    when: { en: "The original certificate must be issued by the official veterinary services of the country of origin and presented at the Tunisian point of entry; it is issued shortly before travel.", fr: "L'original du certificat doit être établi par les services vétérinaires officiels du pays d'origine et présenté au point d'entrée tunisien ; il est délivré peu avant le voyage.", es: "El original del certificado debe ser expedido por los servicios veterinarios oficiales del país de origen y presentarse en el punto de entrada tunecino; se expide poco antes del viaje.", pt: "O certificado original precisa ser emitido pelos serviços veterinários oficiais do país de origem e apresentado no ponto de entrada tunisiano; ele é emitido pouco antes da viagem." }
    exceptions: { en: "None — an original official certificate must accompany every dog (copies are not accepted).", fr: "Aucune — un certificat officiel original doit accompagner chaque chien (les copies ne sont pas acceptées).", es: "Ninguna — un certificado oficial original debe acompañar a cada perro (no se aceptan copias).", pt: "Nenhuma — um certificado oficial original precisa acompanhar todo cachorro (cópias não são aceitas)." }
    ref: { en: "Douane Tunisienne — Animaux de compagnie", fr: "Douane Tunisienne — Animaux de compagnie", es: "Douane Tunisienne — Animaux de compagnie", pt: "Douane Tunisienne — Animaux de compagnie" }
  - item: { en: "Animal health booklet", fr: "Carnet de santé de l'animal", es: "Cartilla sanitaria del animal", pt: "Caderneta de saúde do animal" }
    required: { en: "Required", fr: "Requis", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Carry the animal's health booklet (livret / carnet sanitaire) recording identification and vaccinations, including rabies.", fr: "Munis-toi du carnet de santé de l'animal (livret sanitaire) consignant l'identification et les vaccinations, dont la rage.", es: "Lleva la cartilla sanitaria del animal (livret / carnet sanitaire) que registra la identificación y las vacunas, incluida la rabia.", pt: "Leve a caderneta de saúde do animal (livret / carnet sanitaire) que registra a identificação e as vacinas, incluindo a raiva." }
    exceptions: { en: "None.", fr: "Aucune.", es: "Ninguna.", pt: "Nenhuma." }
    ref: { en: "Douane Tunisienne — Animaux de compagnie", fr: "Douane Tunisienne — Animaux de compagnie", es: "Douane Tunisienne — Animaux de compagnie", pt: "Douane Tunisienne — Animaux de compagnie" }
  - item: { en: "Non-commercial (personal pet) movement", fr: "Mouvement non commercial (animal personnel)", es: "Movimiento no comercial (mascota personal)", pt: "Movimentação não comercial (animal de estimação pessoal)" }
    required: { en: "Applies to a limited number of pets", fr: "S'applique à un nombre limité d'animaux", es: "Se aplica a un número limitado de mascotas", pt: "Aplica-se a um número limitado de animais" }
    when: { en: "A traveller's own dog accompanying them counts as a non-commercial personal pet. A larger number of animals is treated as a commercial import with heavier requirements and prior authorisation from the Ministry of Agriculture.", fr: "Le chien personnel d'un voyageur qui l'accompagne relève d'un animal de compagnie non commercial. Un nombre plus important d'animaux est traité comme une importation commerciale, avec des exigences plus lourdes et une autorisation préalable du ministère de l'Agriculture.", es: "El perro propio de un viajero que lo acompaña cuenta como mascota personal no comercial. Un número mayor de animales se trata como una importación comercial, con requisitos más exigentes y autorización previa del ministerio de Agricultura.", pt: "O próprio cachorro de um viajante que o acompanha conta como animal de estimação pessoal não comercial. Um número maior de animais é tratado como importação comercial, com exigências mais pesadas e autorização prévia do ministério da Agricultura." }
    exceptions: { en: "The exact non-commercial pet limit is not published on the customs portal — confirm with the DGSV / customs.", fr: "Le nombre exact d'animaux admis en non-commercial n'est pas publié sur le portail de la douane — à confirmer auprès de la DGSV / douane.", es: "El número exacto de mascotas admitidas como no comerciales no se publica en el portal de la aduana — a confirmar con la DGSV / aduanas.", pt: "O limite exato de animais não comerciais não é publicado no portal da alfândega — confirme com a DGSV / alfândega." }
    ref: { en: "Douane Tunisienne — Animaux de compagnie; Loi n° 99-24", fr: "Douane Tunisienne — Animaux de compagnie ; Loi n° 99-24", es: "Douane Tunisienne — Animaux de compagnie; Loi n° 99-24", pt: "Douane Tunisienne — Animaux de compagnie; Loi n° 99-24" }
  - item: { en: "Advance notification / import permit", fr: "Notification préalable / permis d'import", es: "Notificación previa / permiso de importación", pt: "Notificação prévia / autorização de importação" }
    required: { en: "Not required (personal pet)", fr: "Non requis (animal personnel)", es: "No obligatorio (mascota personal)", pt: "Não obrigatória (animal de estimação particular)" }
    when: { en: "A traveller's pet dog needs no prior import permit, but it is subject to veterinary sanitary inspection at the border.", fr: "Le chien de compagnie d'un voyageur n'exige pas de permis d'importation préalable, mais il est soumis à l'inspection sanitaire vétérinaire à la frontière.", es: "El perro de compañía de un viajero no exige un permiso de importación previo, pero está sujeto a inspección sanitaria veterinaria en la frontera.", pt: "O cachorro de estimação de um viajante não precisa de autorização de importação prévia, mas está sujeito a inspeção sanitária veterinária na fronteira." }
    exceptions: { en: "Transit and commercial movements require prior approval from the Ministry of Agriculture.", fr: "Le transit et les mouvements commerciaux requièrent l'accord préalable du ministère de l'Agriculture.", es: "El tránsito y los movimientos comerciales requieren la aprobación previa del ministerio de Agricultura.", pt: "Movimentações de trânsito e comerciais exigem aprovação prévia do ministério da Agricultura." }
    ref: { en: "Idaraty / SICAD — contrôle sanitaire vétérinaire à l'importation", fr: "Idaraty / SICAD — contrôle sanitaire vétérinaire à l'importation", es: "Idaraty / SICAD — contrôle sanitaire vétérinaire à l'importation", pt: "Idaraty / SICAD — contrôle sanitaire vétérinaire à l'importation" }
  - item: { en: "Border veterinary inspection & customs check", fr: "Inspection vétérinaire frontalière et contrôle douanier", es: "Inspección veterinaria fronteriza y control aduanero", pt: "Inspeção veterinária de fronteira e controle alfandegário" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "On arrival, present your dog and its documents to the border veterinary services alongside customs; a sanitary check is carried out at the point of entry.", fr: "À l'arrivée, présente ton chien et ses documents aux services vétérinaires frontaliers, aux côtés de la douane ; un contrôle sanitaire est effectué au point d'entrée.", es: "A la llegada, presenta tu perro y sus documentos a los servicios veterinarios fronterizos, junto con las aduanas; se realiza un control sanitario en el punto de entrada.", pt: "Na chegada, apresente o seu cachorro e os seus documentos aos serviços veterinários de fronteira junto com a alfândega; uma verificação sanitária é realizada no ponto de entrada." }
    exceptions: { en: "None for a live dog entering the territory.", fr: "Aucune pour un chien vivant entrant sur le territoire.", es: "Ninguna para un perro vivo que entra en el territorio.", pt: "Nenhuma para um cachorro vivo que entra no território." }
    ref: { en: "Loi n° 99-24 (1999); Décret n° 2002-668 (2002)", fr: "Loi n° 99-24 (1999) ; Décret n° 2002-668 (2002)", es: "Loi n° 99-24 (1999); Décret n° 2002-668 (2002)", pt: "Loi n° 99-24 (1999); Décret n° 2002-668 (2002)" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Linked to rabies vaccination", fr: "Lié à la vaccination antirabique", es: "Ligada a la vacunación antirrábica", pt: "Ligada à vacinação antirrábica" }
    when: { en: "A puppy is expected to be vaccinated against rabies; a dog under 3 months old is admitted only if its mother was vaccinated against rabies.", fr: "Un chiot doit être vacciné contre la rage ; un chien de moins de 3 mois n'est admis que si sa mère a été vaccinée contre la rage.", es: "Se espera que un cachorro esté vacunado contra la rabia; un perro de menos de 3 meses solo se admite si su madre fue vacunada contra la rabia.", pt: "Espera-se que um filhote esteja vacinado contra a raiva; um cachorro com menos de 3 meses só é admitido se a mãe dele foi vacinada contra a raiva." }
    exceptions: { en: "No separate stand-alone minimum age is published beyond the rabies rule — confirm with the DGSV.", fr: "Aucun âge minimum distinct n'est publié au-delà de la règle antirabique — à confirmer auprès de la DGSV.", es: "No se publica ninguna edad mínima independiente más allá de la norma antirrábica — a confirmar con la DGSV.", pt: "Nenhuma idade mínima independente é publicada além da regra antirrábica — confirme com a DGSV." }
    ref: { en: "Douane Tunisienne — Animaux de compagnie", fr: "Douane Tunisienne — Animaux de compagnie", es: "Douane Tunisienne — Animaux de compagnie", pt: "Douane Tunisienne — Animaux de compagnie" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not required if compliant", fr: "Non requise si conforme", es: "No obligatoria si se cumple", pt: "Não obrigatória se estiver tudo em conformidade" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Non-compliant animals may be refused, returned or held under veterinary control at the owner's expense.", fr: "Les animaux non conformes peuvent être refusés, renvoyés ou placés sous contrôle vétérinaire aux frais du propriétaire.", es: "Los animales que no cumplan las normas pueden ser rechazados, devueltos o retenidos bajo control veterinario a cargo del propietario.", pt: "Animais em situação irregular podem ser recusados, devolvidos ou retidos sob controle veterinário às custas do dono." }
    ref: { en: "Loi n° 99-24 (1999); Décret n° 2002-668 (2002)", fr: "Loi n° 99-24 (1999) ; Décret n° 2002-668 (2002)", es: "Loi n° 99-24 (1999); Décret n° 2002-668 (2002)", pt: "Loi n° 99-24 (1999); Décret n° 2002-668 (2002)" }
  - item: { en: "Banned / dangerous breeds", fr: "Races interdites / dangereuses", es: "Razas prohibidas / peligrosas", pt: "Raças proibidas / perigosas" }
    required: { en: "Prohibited", fr: "Interdites", es: "Prohibidas", pt: "Proibidas" }
    when: { en: "Import of dangerous, fierce dogs is prohibited for the pit-bull, Rottweiler, Tosa and Mastiff (Boerbull) types, and generally their crossbreeds.", fr: "L'importation des chiens dangereux et féroces est interdite pour les types pit-bull, Rottweiler, Tosa et Mastiff (Boerbull), et généralement leurs croisements.", es: "La importación de perros peligrosos y feroces está prohibida para los tipos pit bull, Rottweiler, Tosa y Mastín (Boerbull), y generalmente sus cruces.", pt: "A importação de cachorros perigosos e ferozes é proibida para os tipos pit bull, Rottweiler, Tosa e Mastiff (Boerbull), e geralmente para os seus cruzamentos." }
    exceptions: { en: "None published — the ban is set by the Ministry of Agriculture (DGSV) and applies at the border.", fr: "Aucune publiée — l'interdiction est fixée par le ministère de l'Agriculture (DGSV) et s'applique à la frontière.", es: "Ninguna publicada — la prohibición la fija el ministerio de Agricultura (DGSV) y se aplica en la frontera.", pt: "Nenhuma publicada — a proibição é definida pelo ministério da Agricultura (DGSV) e se aplica na fronteira." }
    ref: { en: "Ministère de l'Agriculture / DGSV — races de chiens interdites à l'importation", fr: "Ministère de l'Agriculture / DGSV — races de chiens interdites à l'importation", es: "Ministère de l'Agriculture / DGSV — races de chiens interdites à l'importation", pt: "Ministère de l'Agriculture / DGSV — races de chiens interdites à l'importation" }

origin:
  scheme: eu
  eu:
    title: { en: "From the European Union", fr: "Depuis l'Union européenne", es: "Desde la Unión Europea", pt: "Da União Europeia" }
    body:
      en: "For a dog leaving the EU, an official EU vet issues the veterinary health certificate for Tunisia shortly before departure. Your dog needs a valid rabies vaccination (recorded in the passport / health booklet) and, in practice, an ISO microchip. No rabies antibody test is published as a requirement. On arrival in Tunisia, the border veterinary services check the dog and its documents with customs."
      fr: "Pour un chien quittant l'UE, un vétérinaire officiel de l'UE établit le certificat sanitaire pour la Tunisie peu avant le départ. Ton chien a besoin d'une vaccination antirabique valide (consignée dans le passeport / carnet de santé) et, en pratique, d'une puce ISO. Aucun titrage antirabique n'est publié comme exigence. À l'arrivée en Tunisie, les services vétérinaires frontaliers contrôlent le chien et ses documents avec la douane."
      es: "Para un perro que sale de la UE, un veterinario oficial de la UE expide el certificado sanitario para Túnez poco antes de la salida. Tu perro necesita una vacunación antirrábica válida (registrada en el pasaporte / cartilla sanitaria) y, en la práctica, un microchip ISO. No se publica ninguna prueba de titulación de rabia como requisito. A la llegada a Túnez, los servicios veterinarios fronterizos revisan el perro y sus documentos junto con las aduanas."
      pt: "Para um cachorro que sai da UE, um veterinário oficial da UE emite o certificado veterinário para a Tunísia pouco antes da partida. O seu cachorro precisa de uma vacinação antirrábica válida (registrada no passaporte / caderneta de saúde) e, na prática, de um microchip ISO. Nenhum teste sorológico antirrábico é publicado como exigência. Na chegada à Tunísia, os serviços veterinários de fronteira verificam o cachorro e os seus documentos junto com a alfândega."
    cls: ok
  listed:
    title: { en: "From any other country", fr: "Depuis tout autre pays", es: "Desde cualquier otro país", pt: "De qualquer outro país" }
    body:
      en: "From a non-EU country, the core requirements are the same: a valid rabies vaccination and an original official veterinary health certificate issued by the government veterinary services of the country of origin, plus the animal's health booklet. Use your country's official export certificate model and have it signed by an official vet close to departure."
      fr: "Depuis un pays hors UE, les exigences de base sont identiques : une vaccination antirabique valide et l'original d'un certificat sanitaire officiel établi par les services vétérinaires gouvernementaux du pays d'origine, ainsi que le carnet de santé de l'animal. Utilise le modèle de certificat d'exportation officiel de ton pays et fais-le signer par un vétérinaire officiel peu avant le départ."
      es: "Desde un país fuera de la UE, los requisitos básicos son los mismos: una vacunación antirrábica válida y el original de un certificado sanitario veterinario oficial expedido por los servicios veterinarios gubernamentales del país de origen, además de la cartilla sanitaria del animal. Usa el modelo de certificado de exportación oficial de tu país y hazlo firmar por un veterinario oficial poco antes de la salida."
      pt: "De um país fora da UE, as exigências básicas são as mesmas: uma vacinação antirrábica válida e o original de um certificado veterinário oficial emitido pelos serviços veterinários do governo do país de origem, além da caderneta de saúde do animal. Use o modelo de certificado de exportação oficial do seu país e faça-o assinar por um veterinário oficial próximo da partida."
    cls: warn
  nonListed:
    title: { en: "Rabies history & special cases", fr: "Historique rabique et cas particuliers", es: "Historial antirrábico y casos particulares", pt: "Histórico de raiva e casos particulares" }
    body:
      en: "Tunisia does not publish a separate at-risk-country track or a rabies antibody test for personal pets, but the border veterinary services take the dog's rabies history and recent residence into account. If your dog has stayed in a high-risk country, confirm directly with the DGSV what evidence the border will require before you travel."
      fr: "La Tunisie ne publie pas de parcours distinct pour les pays à risque ni de titrage antirabique pour les animaux personnels, mais les services vétérinaires frontaliers tiennent compte de l'historique rabique et de la résidence récente du chien. Si ton chien a séjourné dans un pays à haut risque, confirme directement auprès de la DGSV les preuves exigées à la frontière avant de voyager."
      es: "Túnez no publica una vía separada para los países de riesgo ni una prueba de titulación de rabia para las mascotas personales, pero los servicios veterinarios fronterizos tienen en cuenta el historial antirrábico y la residencia reciente del perro. Si tu perro ha estado en un país de alto riesgo, confirma directamente con la DGSV qué pruebas exigirá la frontera antes de viajar."
      pt: "A Tunísia não publica um percurso separado para países de risco nem um teste sorológico antirrábico para animais de estimação pessoais, mas os serviços veterinários de fronteira levam em conta o histórico de raiva e a residência recente do cachorro. Se o seu cachorro esteve em um país de alto risco, confirme diretamente com a DGSV quais provas a fronteira exigirá antes de viajar."
    cls: neutral

arrival:
  intro:
    en: "What happens when your dog reaches Tunisia depends on your documents and your dog's breed."
    fr: "Ce qui se passe à l'arrivée de ton chien en Tunisie dépend de tes documents et de la race de ton chien."
    es: "Lo que ocurre cuando tu perro llega a Túnez depende de tus documentos y de la raza de tu perro."
    pt: "O que acontece quando o seu cachorro chega à Tunísia depende dos seus documentos e da raça do seu cachorro."
  points:
    - en: "At the Tunisian point of entry, your dog is checked by the border veterinary services together with customs."
      fr: "Au point d'entrée tunisien, ton chien est contrôlé par les services vétérinaires frontaliers, avec la douane."
      es: "En el punto de entrada tunecino, tu perro es revisado por los servicios veterinarios fronterizos junto con las aduanas."
      pt: "No ponto de entrada tunisiano, o seu cachorro é verificado pelos serviços veterinários de fronteira junto com a alfândega."
    - en: "Present the originals: the official veterinary health certificate, the animal's health booklet and proof of the rabies vaccination."
      fr: "Présente les originaux : le certificat sanitaire officiel, le carnet de santé de l'animal et la preuve de la vaccination antirabique."
      es: "Presenta los originales: el certificado sanitario veterinario oficial, la cartilla sanitaria del animal y la prueba de la vacunación antirrábica."
      pt: "Apresente os originais: o certificado veterinário oficial, a caderneta de saúde do animal e o comprovante da vacinação antirrábica."
    - en: "Copies are not accepted in place of the original certificate."
      fr: "Les copies ne sont pas acceptées à la place du certificat original."
      es: "No se aceptan copias en lugar del certificado original."
      pt: "Cópias não são aceitas no lugar do certificado original."
    - en: "If documents are missing or invalid, or the breed is banned, the animal may be refused entry, returned or held under veterinary control — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, ou si la race est interdite, l'animal peut être refusé, renvoyé ou placé sous contrôle vétérinaire — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, o la raza está prohibida, el animal puede ser rechazado a la entrada, devuelto o retenido bajo control veterinario — a cargo del propietario."
      pt: "Se faltarem documentos ou se eles forem inválidos, ou ainda se a raça for proibida, o animal pode ter a entrada recusada, ser devolvido ou ficar sob controle veterinário — às custas do dono."
    - en: "Pit-bull, Rottweiler, Tosa and Mastiff (Boerbull) type dogs are refused entry."
      fr: "Les chiens de type pit-bull, Rottweiler, Tosa et Mastiff (Boerbull) sont refusés à l'entrée."
      es: "Los perros de tipo pit bull, Rottweiler, Tosa y Mastín (Boerbull) son rechazados a la entrada."
      pt: "Cachorros dos tipos pit bull, Rottweiler, Tosa e Mastiff (Boerbull) têm a entrada recusada."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Tunisia prohibits the import of dogs considered dangerous and fierce. The list is set by the Ministry of Agriculture, Water Resources and Fisheries — Direction Générale des Services Vétérinaires (DGSV) — and applies at the border; it does not depend on an individual behavioural assessment."
    fr: "La Tunisie interdit l'importation des chiens considérés comme dangereux et féroces. La liste est fixée par le ministère de l'Agriculture, des Ressources Hydrauliques et de la Pêche — Direction Générale des Services Vétérinaires (DGSV) — et s'applique à la frontière ; elle ne dépend pas d'une évaluation comportementale individuelle."
    es: "Túnez prohíbe la importación de perros considerados peligrosos y feroces. La lista la fija el ministerio de Agricultura, Recursos Hídricos y Pesca — Direction Générale des Services Vétérinaires (DGSV) — y se aplica en la frontera; no depende de una evaluación conductual individual."
    pt: "A Tunísia proíbe a importação de cachorros considerados perigosos e ferozes. A lista é definida pelo ministério da Agricultura, Recursos Hídricos e Pesca — Direction Générale des Services Vétérinaires (DGSV) — e se aplica na fronteira; não depende de uma avaliação comportamental individual."
  cat1:
    en: "Banned from import: pit-bull, Rottweiler, Tosa and Mastiff (Boerbull) types. The customs portal describes each type by its morphology (build, chest girth, weight and height at the withers) to identify prohibited dogs at the border."
    fr: "Interdits à l'importation : types pit-bull, Rottweiler, Tosa et Mastiff (Boerbull). Le portail de la douane décrit chaque type par sa morphologie (gabarit, périmètre thoracique, poids et hauteur au garrot) pour identifier les chiens interdits à la frontière."
    es: "Prohibidos a la importación: tipos pit bull, Rottweiler, Tosa y Mastín (Boerbull). El portal de la aduana describe cada tipo por su morfología (corpulencia, perímetro torácico, peso y altura a la cruz) para identificar a los perros prohibidos en la frontera."
    pt: "Proibidos de importação: tipos pit bull, Rottweiler, Tosa e Mastiff (Boerbull). O portal da alfândega descreve cada tipo pela sua morfologia (porte, perímetro torácico, peso e altura na cernelha) para identificar os cachorros proibidos na fronteira."
  cat2:
    en: "There is no lighter 'permitted with conditions' category for these breeds at the border: their import is refused outright, and crossbreeds involving a banned type are generally affected too."
    fr: "Il n'existe pas de catégorie allégée « autorisée sous conditions » pour ces races à la frontière : leur importation est purement refusée, et les croisements impliquant un type interdit sont généralement concernés aussi."
    es: "No existe una categoría más leve de «permitido con condiciones» para estas razas en la frontera: su importación se rechaza sin más, y los cruces que implican un tipo prohibido generalmente también se ven afectados."
    pt: "Não existe uma categoria mais leve de \"permitido com condições\" para essas raças na fronteira: a importação delas é simplesmente recusada, e cruzamentos envolvendo um tipo proibido geralmente também são afetados."
  note:
    en: "Because a dog that resembles a listed type risks refusal on morphology alone, confirm your dog's breed and any cross before you travel, and check the current DGSV notice."
    fr: "Un chien ressemblant à un type listé risquant le refus sur la seule morphologie, confirme la race de ton chien et tout croisement avant de voyager, et vérifie l'avis DGSV en vigueur."
    es: "Dado que un perro que se parece a un tipo listado corre el riesgo de ser rechazado solo por su morfología, confirma la raza de tu perro y cualquier cruce antes de viajar, y consulta el aviso vigente de la DGSV."
    pt: "Como um cachorro que se pareça com um tipo listado corre o risco de ser recusado apenas pela morfologia, confirme a raça do seu cachorro e qualquer cruzamento antes de viajar, e verifique o aviso vigente da DGSV."

checklist:
  - en: "Valid rabies vaccination recorded in the health booklet (mother vaccinated if the pup is under 3 months)"
    fr: "Vaccination antirabique valide consignée dans le carnet de santé (mère vaccinée si le chiot a moins de 3 mois)"
    es: "Vacunación antirrábica válida registrada en la cartilla sanitaria (madre vacunada si el cachorro tiene menos de 3 meses)"
    pt: "Vacinação antirrábica válida registrada na caderneta de saúde (mãe vacinada se o filhote tiver menos de 3 meses)"
  - en: "ISO microchip in place before vaccination (standard identification; needed for an EU return)"
    fr: "Puce ISO posée avant la vaccination (identification standard ; nécessaire pour un retour vers l'UE)"
    es: "Microchip ISO implantado antes de la vacunación (identificación estándar; necesario para un regreso a la UE)"
    pt: "Microchip ISO implantado antes da vacinação (identificação padrão; necessário para um retorno à UE)"
  - en: "Original official veterinary health certificate issued shortly before departure"
    fr: "Original du certificat sanitaire officiel établi peu avant le départ"
    es: "Original del certificado sanitario veterinario oficial expedido poco antes de la salida"
    pt: "Certificado veterinário oficial original emitido pouco antes da partida"
  - en: "Animal health booklet (livret / carnet sanitaire) carried with you"
    fr: "Carnet de santé de l'animal (livret sanitaire) emporté avec toi"
    es: "Cartilla sanitaria del animal (livret / carnet sanitaire) contigo"
    pt: "Caderneta de saúde do animal (livret / carnet sanitaire) levada com você"
  - en: "Original documents ready for the border veterinary check and customs"
    fr: "Documents originaux prêts pour le contrôle vétérinaire frontalier et la douane"
    es: "Documentos originales listos para el control veterinario fronterizo y las aduanas"
    pt: "Documentos originais prontos para o controle veterinário de fronteira e a alfândega"
  - en: "Confirm your dog is not a banned breed (pit-bull, Rottweiler, Tosa, Mastiff/Boerbull)"
    fr: "Vérifie que ton chien n'est pas d'une race interdite (pit-bull, Rottweiler, Tosa, Mastiff/Boerbull)"
    es: "Confirma que tu perro no es de una raza prohibida (pit bull, Rottweiler, Tosa, Mastín/Boerbull)"
    pt: "Confirme que o seu cachorro não é de uma raça proibida (pit bull, Rottweiler, Tosa, Mastiff/Boerbull)"
  - en: "Check any special requirement for your dog's origin and rabies history with the DGSV"
    fr: "Vérifie auprès de la DGSV toute exigence particulière liée à l'origine et à l'historique rabique de ton chien"
    es: "Comprueba con la DGSV cualquier requisito especial ligado al origen y al historial antirrábico de tu perro"
    pt: "Verifique com a DGSV qualquer exigência especial ligada à origem e ao histórico de raiva do seu cachorro"
  - en: "Airline reservation confirming your dog's travel option and suitable travel crate"
    fr: "Réservation confirmant l'option de transport de ton chien et caisse de transport adaptée"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y jaula de transporte adecuada"
    pt: "Reserva na companhia aérea confirmando a opção de transporte do seu cachorro e caixa de transporte adequada às normas da IATA"

