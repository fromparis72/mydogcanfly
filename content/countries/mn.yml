notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro."
    pt: "Só um médico-veterinário pode confirmar o procedimento exato para o seu cachorro."
  - en: "Mongolia publishes only limited detail; several points below are marked unconfirmed and must be checked with GAVS."
    fr: "La Mongolie publie peu de détails ; plusieurs points ci-dessous sont signalés non confirmés et doivent être vérifiés auprès de la GAVS."
    es: "Mongolia publica pocos detalles; varios puntos a continuación se marcan como no confirmados y deben verificarse con la GAVS."
    pt: "A Mongólia publica apenas detalhes limitados; vários pontos abaixo estão marcados como não confirmados e precisam ser verificados com a GAVS."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Mongolia (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — la Mongolie (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Mongolia (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — a Mongólia (seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Mongolia", fr: "Pays de destination — Mongolie", es: "País de destino — Mongolia", pt: "País de destino — Mongólia" }
      text:
        en: "Mongolia requires an official international veterinary health certificate and a passport or record of the dog's vaccinations and antiparasitic treatment, verified by veterinary and customs officers at the border. It is not part of the EU or the EAEU, so no simplified movement regime applies."
        fr: "La Mongolie exige un certificat sanitaire vétérinaire international officiel et un passeport ou carnet des vaccins et du traitement antiparasitaire du chien, vérifié par les agents vétérinaires et douaniers à la frontière. Elle n'appartient ni à l'UE ni à l'UEEA, donc aucun régime de circulation simplifié ne s'applique."
        es: "Mongolia exige un certificado sanitario veterinario internacional oficial y un pasaporte o cartilla de las vacunas y el tratamiento antiparasitario del perro, verificado por los agentes veterinarios y de aduanas en la frontera. No forma parte de la UE ni de la UEEA, por lo que no se aplica ningún régimen de circulación simplificado."
        pt: "A Mongólia exige um atestado de saúde veterinário internacional oficial e um passaporte ou registro das vacinas e do tratamento antiparasitário do cachorro, verificados por agentes veterinários e da alfândega na fronteira. O país não faz parte da UE nem da EAEU, portanto nenhum regime simplificado de deslocamento se aplica."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The health certificate is issued by the competent veterinary authority of the country you fly from, on that country's official form. Mongolia's requirements are the same from every country, but the issuing authority, forms and the endorsement chain differ by departure country."
        fr: "Le certificat sanitaire est délivré par l'autorité vétérinaire compétente du pays d'où tu pars, sur le formulaire officiel de ce pays. Les exigences mongoles sont identiques depuis tout pays, mais l'autorité émettrice, les formulaires et la chaîne de visa diffèrent selon le pays de départ."
        es: "El certificado sanitario lo expide la autoridad veterinaria competente del país desde el que vuelas, en el formulario oficial de ese país. Los requisitos de Mongolia son los mismos desde cualquier país, pero la autoridad emisora, los formularios y la cadena de refrendo difieren según el país de salida."
        pt: "O atestado de saúde é emitido pela autoridade veterinária competente do país de onde você está partindo, no formulário oficial desse país. As exigências da Mongólia são as mesmas para qualquer país, mas a autoridade emissora, os formulários e a cadeia de endosso variam conforme o país de partida."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "Mongolia does not run an EU-style listed/non-listed system, but the rabies situation of your dog's real origin matters. Mongolia is a rabies-endemic country, so keep clear proof of an in-date rabies vaccination and of any treatments; border officers assess documents against the animal's history."
        fr: "La Mongolie n'applique pas de système listé/non listé à l'européenne, mais la situation rabique de l'origine réelle du chien compte. La Mongolie est un pays d'endémie rabique : conserve une preuve claire d'une vaccination antirabique à jour et des traitements ; les agents frontaliers évaluent les documents au regard de l'historique de l'animal."
        es: "Mongolia no aplica un sistema listado/no listado al estilo de la UE, pero la situación de rabia del origen real de tu perro importa. Mongolia es un país con rabia endémica, así que conserva una prueba clara de una vacunación antirrábica en vigor y de cualquier tratamiento; los agentes fronterizos evalúan los documentos frente al historial del animal."
        pt: "A Mongólia não aplica um sistema de países listados/não listados no estilo da UE, mas a situação da raiva na origem real do seu cachorro importa. A Mongólia é um país endêmico de raiva, portanto mantenha comprovantes claros de uma vacinação antirrábica em dia e de quaisquer tratamentos; os agentes de fronteira avaliam os documentos em relação ao histórico do animal."
  note:
    en: "So read the requirements below as Mongolia's general framework, then confirm the exact steps, timings and any microchip rule with GAVS and your veterinarian for your departure country."
    fr: "Lis donc les exigences ci-dessous comme le cadre général mongol, puis confirme les étapes exactes, les délais et toute règle de puçage auprès de la GAVS et de ton vétérinaire pour ton pays de départ."
    es: "Así que lee los requisitos siguientes como el marco general de Mongolia y luego confirma los pasos exactos, los plazos y cualquier norma de microchip con la GAVS y tu veterinario para tu país de salida."
    pt: "Portanto, leia as exigências abaixo como o marco geral da Mongólia e depois confirme com a GAVS e o seu veterinário as etapas exatas, os prazos e qualquer regra de microchip para o seu país de partida."

requirements:
  - item: { en: "Microchip / identification", fr: "Puce / identification", es: "Microchip / identificación", pt: "Microchip / identificação" }
    required: { en: "Not officially published for import", fr: "Non communiqué à l'import", es: "No comunicado para la importación", pt: "Não publicado oficialmente para importação" }
    when: { en: "No published Mongolian import rule mandates an ISO microchip for an incoming pet; an ISO 11784/11785 chip is nonetheless strongly recommended and is generally expected on the health certificate and passport.", fr: "Aucune règle d'importation mongole publiée n'impose une puce ISO pour un animal entrant ; une puce ISO 11784/11785 est néanmoins fortement recommandée et généralement attendue sur le certificat et le passeport.", es: "Ninguna norma de importación mongola publicada obliga a un microchip ISO para una mascota que entra; aun así, se recomienda encarecidamente un chip ISO 11784/11785 y por lo general se espera en el certificado sanitario y el pasaporte.", pt: "Nenhuma regra de importação mongol publicada exige um microchip ISO para um animal de estimação que entra no país; ainda assim, um chip ISO 11784/11785 é fortemente recomendado e geralmente é esperado no atestado de saúde e no passaporte." }
    exceptions: { en: "Under the 2024 Law on Pet Animals, domestic breeders in Mongolia are required to microchip animals; this is a national keeping rule, not a published import condition.", fr: "En vertu de la loi de 2024 sur les animaux de compagnie, les éleveurs domestiques en Mongolie doivent pucer les animaux ; il s'agit d'une règle nationale de détention, non d'une condition d'importation publiée.", es: "En virtud de la Ley de Animales de Compañía de 2024, los criadores nacionales en Mongolia están obligados a colocar microchip a los animales; se trata de una norma nacional de tenencia, no de una condición de importación publicada.", pt: "Pela Law on Pet Animals de 2024, os criadores nacionais na Mongólia são obrigados a colocar microchip nos animais; essa é uma regra nacional de posse, não uma condição de importação publicada." }
    ref: { en: "GAVS (vet.gov.mn); Law on Pet Animals (legalinfo.mn) — import microchip rule: Unknown", fr: "GAVS (vet.gov.mn) ; loi sur les animaux de compagnie (legalinfo.mn) — règle de puçage à l'import : non communiquée", es: "GAVS (vet.gov.mn); Ley de Animales de Compañía (legalinfo.mn) — norma de microchip a la importación: no comunicada", pt: "GAVS (vet.gov.mn); Law on Pet Animals (legalinfo.mn) — regra de microchip para importação: desconhecida" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required (recorded)", fr: "Requise (consignée)", es: "Obligatoria (registrada)", pt: "Obrigatória (registrada)" }
    when: { en: "A valid rabies vaccination must be recorded in the passport and certified on the veterinary health certificate. Mongolia is rabies-endemic, so an in-date vaccination is expected for any dog over the usual vaccination age.", fr: "Une vaccination antirabique valide doit être consignée dans le passeport et certifiée sur le certificat sanitaire vétérinaire. La Mongolie est en endémie rabique : une vaccination à jour est attendue pour tout chien au-delà de l'âge usuel de vaccination.", es: "Una vacunación antirrábica válida debe registrarse en el pasaporte y certificarse en el certificado sanitario veterinario. Mongolia tiene rabia endémica, por lo que se espera una vacunación en vigor para cualquier perro que supere la edad habitual de vacunación.", pt: "Uma vacinação antirrábica válida precisa estar registrada no passaporte e certificada no atestado de saúde veterinário. A Mongólia é endêmica de raiva, portanto uma vacinação em dia é esperada para qualquer cachorro acima da idade usual de vacinação." }
    exceptions: { en: "The exact minimum interval before travel and the maximum validity accepted are not officially published (Unknown) — confirm with GAVS and your veterinarian.", fr: "Le délai minimal exact avant le voyage et la validité maximale acceptée ne sont pas officiellement publiés (non communiqués) — à confirmer auprès de la GAVS et de ton vétérinaire.", es: "El intervalo mínimo exacto antes del viaje y la valide máxima aceptada no están publicados oficialmente (no comunicados) — confirma con la GAVS y tu veterinario.", pt: "O intervalo mínimo exato antes da viagem e a validade máxima aceita não são publicados oficialmente (desconhecidos) — confirme com a GAVS e o seu veterinário." }
    ref: { en: "GAVS (vet.gov.mn); departure-country export certificate; exact timing: Unknown", fr: "GAVS (vet.gov.mn) ; certificat d'export du pays de départ ; calendrier exact : non communiqué", es: "GAVS (vet.gov.mn); certificado de exportación del país de salida; calendario exacto: no comunicado", pt: "GAVS (vet.gov.mn); certificado de exportação do país de partida; momento exato: desconhecido" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not among published requirements", fr: "Absent des exigences publiées", es: "No figura entre los requisitos publicados", pt: "Não consta entre as exigências publicadas" }
    when: { en: "No rabies antibody test is listed in Mongolia's published pet-import documents. It is not stated as a routine condition for personal pets.", fr: "Aucun titrage des anticorps antirabiques ne figure dans les documents d'importation d'animaux publiés par la Mongolie. Il n'est pas indiqué comme condition de routine pour les animaux de compagnie.", es: "No figura ninguna prueba de titulación de rabia en los documentos de importación de mascotas publicados por Mongolia. No se indica como condición rutinaria para las mascotas personales.", pt: "Nenhum teste sorológico antirrábico consta nos documentos de importação de animais de estimação publicados pela Mongólia. Ele não é indicado como condição de rotina para animais de estimação pessoais." }
    exceptions: { en: "Because Mongolia publishes little detail, the absence of a published test is not a formal exemption — verify with GAVS whether any test is required for your case.", fr: "La Mongolie publiant peu de détails, l'absence de titrage publié n'est pas une dispense formelle — vérifie auprès de la GAVS si un test est exigé dans ton cas.", es: "Como Mongolia publica pocos detalles, la ausencia de una prueba publicada no es una exención formal — verifica con la GAVS si se exige alguna prueba en tu caso.", pt: "Como a Mongólia publica pouco detalhe, a ausência de um teste publicado não é uma dispensa formal — verifique com a GAVS se algum teste é exigido para o seu caso." }
    ref: { en: "GAVS (vet.gov.mn); GASI border inspection (sbb.inspection.gov.mn) — antibody test: not published", fr: "GAVS (vet.gov.mn) ; inspection frontalière GASI (sbb.inspection.gov.mn) — titrage : non publié", es: "GAVS (vet.gov.mn); inspección fronteriza GASI (sbb.inspection.gov.mn) — prueba de titulación: no publicada", pt: "GAVS (vet.gov.mn); inspeção de fronteira da GASI (sbb.inspection.gov.mn) — teste sorológico: não publicado" }
  - item: { en: "Other vaccinations / antiparasitic treatment", fr: "Autres vaccins / traitement antiparasitaire", es: "Otras vacunas / tratamiento antiparasitario", pt: "Outras vacinas / tratamento antiparasitário" }
    required: { en: "Recorded in the passport", fr: "Consignés dans le passeport", es: "Registrados en el pasaporte", pt: "Registrado no passaporte" }
    when: { en: "The published personal-pet requirement is a passport documenting the dog's vaccinations and its antiparasitic (parasite-prevention) treatment; core canine vaccinations (distemper, hepatitis, parvovirus, leptospirosis) are customary but the exact list is not detailed officially.", fr: "L'exigence publiée pour les animaux de compagnie est un passeport documentant les vaccins du chien et son traitement antiparasitaire ; les vaccins canins de base (Carré, hépatite, parvovirose, leptospirose) sont d'usage, mais la liste exacte n'est pas détaillée officiellement.", es: "El requisito publicado para las mascotas personales es un pasaporte que documente las vacunas del perro y su tratamiento antiparasitario (de prevención de parásitos); las vacunas caninas básicas (moquillo, hepatitis, parvovirus, leptospirosis) son habituales, pero la lista exacta no se detalla oficialmente.", pt: "A exigência publicada para animais de estimação pessoais é um passaporte que documente as vacinas do cachorro e seu tratamento antiparasitário (prevenção de parasitas); as vacinas caninas essenciais (cinomose, hepatite, parvovirose, leptospirose) são costumeiras, mas a lista exata não é detalhada oficialmente." }
    exceptions: { en: "The specific products, doses and timing of the antiparasitic treatment are not officially published (Unknown).", fr: "Les produits, doses et délais précis du traitement antiparasitaire ne sont pas officiellement publiés (non communiqués).", es: "Los productos, dosis y plazos concretos del tratamiento antiparasitario no están publicados oficialmente (no comunicados).", pt: "Os produtos, doses e o momento específicos do tratamento antiparasitário não são publicados oficialmente (desconhecidos)." }
    ref: { en: "GASI border inspection (sbb.inspection.gov.mn); GAVS (vet.gov.mn)", fr: "Inspection frontalière GASI (sbb.inspection.gov.mn) ; GAVS (vet.gov.mn)", es: "Inspección fronteriza GASI (sbb.inspection.gov.mn); GAVS (vet.gov.mn)", pt: "Inspeção de fronteira da GASI (sbb.inspection.gov.mn); GAVS (vet.gov.mn)" }
  - item: { en: "International veterinary health certificate", fr: "Certificat sanitaire vétérinaire international", es: "Certificado sanitario veterinario internacional", pt: "Atestado de saúde veterinário internacional" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "An official international veterinary health certificate issued (or endorsed) by the competent veterinary authority of the country of departure must accompany the dog; for import into Mongolia it is expected in Mongolian, and a separate certificate is drawn up for each animal.", fr: "Un certificat sanitaire vétérinaire international officiel délivré (ou visé) par l'autorité vétérinaire compétente du pays de départ doit accompagner le chien ; pour l'import en Mongolie, il est attendu en mongol, et un certificat distinct est établi pour chaque animal.", es: "Un certificado sanitario veterinario internacional oficial expedido (o refrendado) por la autoridad veterinaria competente del país de salida debe acompañar al perro; para la importación en Mongolia se espera en mongol, y se elabora un certificado separado para cada animal.", pt: "Um atestado de saúde veterinário internacional oficial, emitido (ou endossado) pela autoridade veterinária competente do país de partida, precisa acompanhar o cachorro; para a importação na Mongólia, ele é esperado em mongol, e um certificado separado é preenchido para cada animal." }
    exceptions: { en: "GAVS issues Mongolia's own international veterinary certificate (procedure A/51) for animals crossing the border; certificate validity is typically up to about 30 days from issue.", fr: "La GAVS délivre le certificat vétérinaire international propre à la Mongolie (procédure A/51) pour les animaux franchissant la frontière ; la validité du certificat est généralement d'environ 30 jours à compter de sa délivrance.", es: "La GAVS expide el certificado veterinario internacional propio de Mongolia (procedimiento A/51) para los animales que cruzan la frontera; la valide del certificado suele ser de unos 30 días desde su expedición.", pt: "A GAVS emite o próprio certificado veterinário internacional da Mongólia (procedimento A/51) para animais que cruzam a fronteira; a validade do certificado costuma ser de até cerca de 30 dias a partir da emissão." }
    ref: { en: "GAVS certificate A/51 (mongoliatradeportal.gov.mn); Order on Veterinary Certificate Design and Instruction", fr: "Certificat GAVS A/51 (mongoliatradeportal.gov.mn) ; ordre sur le modèle et l'instruction du certificat vétérinaire", es: "Certificado GAVS A/51 (mongoliatradeportal.gov.mn); Orden sobre el modelo e instrucción del certificado veterinario", pt: "Certificado A/51 da GAVS (mongoliatradeportal.gov.mn); Order on Veterinary Certificate Design and Instruction" }
  - item: { en: "Import permit / advance approval", fr: "Permis d'importation / accord préalable", es: "Permiso de importación / aprobación previa", pt: "Autorização de importação / aprovação prévia" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "A personal pet accompanying its owner does not need an import permit under the published guidance. A commercial import of animals requires an import notification / permit from GAVS in advance.", fr: "Un animal de compagnie accompagnant son propriétaire n'a pas besoin de permis d'importation selon les indications publiées. Un import commercial d'animaux nécessite une notification / permis d'importation de la GAVS à l'avance.", es: "Una mascota personal que acompaña a su propietario no necesita permiso de importación según las indicaciones publicadas. Una importación comercial de animales requiere una notificación / permiso de importación de la GAVS por adelantado.", pt: "Um animal de estimação pessoal acompanhando o dono não precisa de autorização de importação segundo a orientação publicada. Uma importação comercial de animais exige uma notificação/autorização de importação da GAVS com antecedência." }
    exceptions: { en: "Customs treats pets as goods requiring pre-declaration; passenger customs allows no more than one animal of each type per traveller for personal use.", fr: "La douane traite les animaux comme des marchandises à déclarer au préalable ; la douane voyageurs autorise au plus un animal de chaque type par voyageur à titre personnel.", es: "La aduana trata a las mascotas como mercancías que requieren declaración previa; la aduana de pasajeros permite como máximo un animal de cada tipo por viajero para uso personal.", pt: "A alfândega trata animais de estimação como mercadorias que exigem declaração prévia; a alfândega de passageiros permite no máximo um animal de cada tipo por viajante, para uso pessoal." }
    ref: { en: "GASI border inspection (sbb.inspection.gov.mn); Mongolian Customs (customs.gov.mn)", fr: "Inspection frontalière GASI (sbb.inspection.gov.mn) ; Douane mongole (customs.gov.mn)", es: "Inspección fronteriza GASI (sbb.inspection.gov.mn); Aduana mongola (customs.gov.mn)", pt: "Inspeção de fronteira da GASI (sbb.inspection.gov.mn); alfândega da Mongólia (customs.gov.mn)" }
  - item: { en: "Border veterinary control", fr: "Contrôle vétérinaire frontalier", es: "Control veterinario fronterizo", pt: "Controle veterinário de fronteira" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "On arrival the dog undergoes veterinary and quarantine inspection at the border, carried out under World Organisation for Animal Health (WOAH) standards and Mongolia's border animal/plant quarantine legislation; documents and the animal's health are checked.", fr: "À l'arrivée, le chien fait l'objet d'une inspection vétérinaire et de quarantaine à la frontière, réalisée selon les normes de l'Organisation mondiale de la santé animale (WOAH) et la législation mongole sur la quarantaine animale/végétale aux frontières ; les documents et l'état de santé de l'animal sont vérifiés.", es: "A la llegada, el perro es objeto de una inspección veterinaria y de cuarentena en la frontera, realizada conforme a las normas de la Organización Mundial de Sanidad Animal (WOAH) y a la legislación mongola sobre cuarentena animal/vegetal en las fronteras; se verifican los documentos y el estado de salud del animal.", pt: "Na chegada, o cachorro passa por inspeção veterinária e de quarentena na fronteira, realizada segundo as normas da World Organisation for Animal Health (WOAH) e a legislação de quarentena animal/vegetal de fronteira da Mongólia; os documentos e a saúde do animal são conferidos." }
    exceptions: { en: "Enter through a crossing point that operates veterinary control (e.g. Chinggis Khaan International Airport, Ulaanbaatar); declare the animal to customs.", fr: "Entre par un point de passage assurant le contrôle vétérinaire (ex. aéroport international Chinggis Khaan, Oulan-Bator) ; déclare l'animal à la douane.", es: "Entra por un punto de paso que realice control veterinario (p. ej. el Aeropuerto Internacional Chinggis Khaan, Ulán Bator); declara el animal a la aduana.", pt: "Entre por um ponto de travessia que opere controle veterinário (por exemplo, o Chinggis Khaan International Airport, em Ulaanbaatar); declare o animal à alfândega." }
    ref: { en: "GASI border inspection (sbb.inspection.gov.mn); Mongolian Customs (customs.gov.mn)", fr: "Inspection frontalière GASI (sbb.inspection.gov.mn) ; Douane mongole (customs.gov.mn)", es: "Inspección fronteriza GASI (sbb.inspection.gov.mn); Aduana mongola (customs.gov.mn)", pt: "Inspeção de fronteira da GASI (sbb.inspection.gov.mn); alfândega da Mongólia (customs.gov.mn)" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "Not officially published", fr: "Non communiqué", es: "No comunicado", pt: "Não publicado oficialmente" }
    when: { en: "Mongolia does not publish a minimum import age or a specific rule for unvaccinated puppies. In practice a puppy's earliest travel date is governed by the rabies vaccination it must carry.", fr: "La Mongolie ne publie ni âge minimal d'importation, ni règle spécifique pour les chiots non vaccinés. En pratique, la première date de voyage d'un chiot est déterminée par la vaccination antirabique qu'il doit porter.", es: "Mongolia no publica una edad mínima de importación ni una norma específica para cachorros no vacunados. En la práctica, la fecha más temprana de viaje de un cachorro la determina la vacunación antirrábica que debe llevar.", pt: "A Mongólia não publica uma idade mínima de importação nem uma regra específica para filhotes não vacinados. Na prática, a data mais cedo em que um filhote pode viajar é determinada pela vacinação antirrábica que ele precisa ter." }
    exceptions: { en: "Any airline minimum age applies separately. Confirm the puppy rule with GAVS before travel (Unknown).", fr: "Un âge minimum de la compagnie aérienne s'applique séparément. Confirme la règle pour les chiots auprès de la GAVS avant le voyage (non communiquée).", es: "Cualquier edad mínima de la aerolínea se aplica por separado. Confirma la norma para cachorros con la GAVS antes de viajar (no comunicada).", pt: "Qualquer idade mínima da companhia aérea se aplica separadamente. Confirme a regra para filhotes com a GAVS antes da viagem (desconhecida)." }
    ref: { en: "GAVS (vet.gov.mn) — minimum age: Unknown", fr: "GAVS (vet.gov.mn) — âge minimum : non communiqué", es: "GAVS (vet.gov.mn) — edad mínima: no comunicada", pt: "GAVS (vet.gov.mn) — idade mínima: desconhecida" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "No routine quarantine for compliant pets", fr: "Pas de quarantaine systématique si conforme", es: "Sin cuarentena rutinaria para mascotas conformes", pt: "Sem quarentena de rotina para animais em conformidade" }
    when: { en: "A personal pet with complete, valid documents is not subject to a routine import quarantine; it is cleared after the border veterinary and customs inspection.", fr: "Un animal de compagnie avec des documents complets et valides n'est pas soumis à une quarantaine d'importation systématique ; il est dédouané après l'inspection vétérinaire et douanière à la frontière.", es: "Una mascota personal con documentos completos y válidos no está sujeta a una cuarentena de importación rutinaria; se despacha tras la inspección veterinaria y aduanera en la frontera.", pt: "Um animal de estimação pessoal com documentos completos e válidos não está sujeito a uma quarentena de importação de rotina; ele é liberado após a inspeção veterinária e alfandegária de fronteira." }
    exceptions: { en: "If documents are missing or invalid, or a disease risk is identified, the border service may hold, isolate or refuse the animal; commercial consignments follow separate conditions.", fr: "Si les documents manquent ou sont invalides, ou si un risque sanitaire est identifié, le service frontalier peut retenir, isoler ou refuser l'animal ; les envois commerciaux suivent des conditions distinctes.", es: "Si faltan documentos o no son válidos, o se identifica un riesgo sanitario, el servicio fronterizo puede retener, aislar o rechazar al animal; los envíos comerciales siguen condiciones distintas.", pt: "Se a documentação estiver ausente ou inválida, ou se for identificado algum risco sanitário, o serviço de fronteira pode reter, isolar ou recusar o animal; remessas comerciais seguem condições separadas." }
    ref: { en: "GASI border inspection (sbb.inspection.gov.mn); border animal/plant quarantine law", fr: "Inspection frontalière GASI (sbb.inspection.gov.mn) ; loi sur la quarantaine animale/végétale aux frontières", es: "Inspección fronteriza GASI (sbb.inspection.gov.mn); ley sobre cuarentena animal/vegetal en las fronteras", pt: "Inspeção de fronteira da GASI (sbb.inspection.gov.mn); lei de quarentena animal/vegetal de fronteira" }

origin:
  scheme: eu
  eu:
    title: { en: "Not an EU or EAEU member", fr: "Ni membre de l'UE ni de l'UEEA", es: "Ni miembro de la UE ni de la UEEA", pt: "Não é membro da UE nem da EAEU" }
    body:
      en: "Mongolia belongs to neither the European Union nor the Eurasian Economic Union, so there is no simplified pet-passport movement into the country. A dog coming from an EU state, from an EAEU state (Russia, Kazakhstan and others) or from anywhere else follows the same third-country path: an official veterinary health certificate from the departure country plus vaccination and treatment records."
      fr: "La Mongolie n'appartient ni à l'Union européenne, ni à l'Union économique eurasiatique : il n'existe donc pas de circulation simplifiée par passeport pour animaux vers le pays. Un chien venant d'un État de l'UE, d'un État de l'UEEA (Russie, Kazakhstan, etc.) ou de tout autre pays suit le même parcours de pays tiers : un certificat sanitaire vétérinaire officiel du pays de départ, plus les preuves de vaccination et de traitement."
      es: "Mongolia no pertenece ni a la Unión Europea ni a la Unión Económica Euroasiática, por lo que no existe una circulación simplificada por pasaporte para mascotas hacia el país. Un perro procedente de un Estado de la UE, de un Estado de la UEEA (Rusia, Kazajistán y otros) o de cualquier otro lugar sigue la misma ruta de país tercero: un certificado sanitario veterinario oficial del país de salida, más los registros de vacunación y tratamiento."
      pt: "A Mongólia não pertence à União Europeia nem à União Econômica Eurasiática, portanto não há um deslocamento simplificado por passaporte de animal de estimação para o país. Um cachorro vindo de um estado da UE, de um estado da EAEU (Rússia, Cazaquistão e outros) ou de qualquer outro lugar segue o mesmo caminho de país terceiro: um atestado de saúde veterinário oficial do país de partida, além dos registros de vacinação e tratamento."
    cls: warn
  listed:
    title: { en: "Personal pet with its owner", fr: "Animal de compagnie avec son propriétaire", es: "Mascota personal con su propietario", pt: "Animal de estimação pessoal com o dono" }
    body:
      en: "For a dog travelling with its owner for personal use, the published requirement is an animal health certificate from the competent authority of the country of departure and a passport recording vaccinations and antiparasitic treatment. No import permit is needed, and customs allows up to one animal of each type per traveller. The animal is inspected by veterinary and customs officers at the border."
      fr: "Pour un chien voyageant avec son propriétaire à titre personnel, l'exigence publiée est un certificat sanitaire vétérinaire de l'autorité compétente du pays de départ et un passeport consignant les vaccins et le traitement antiparasitaire. Aucun permis d'importation n'est requis, et la douane autorise au plus un animal de chaque type par voyageur. L'animal est inspecté par les agents vétérinaires et douaniers à la frontière."
      es: "Para un perro que viaja con su propietario para uso personal, el requisito publicado es un certificado sanitario veterinario de la autoridad competente del país de salida y un pasaporte que registre las vacunas y el tratamiento antiparasitario. No se necesita permiso de importación, y la aduana permite hasta un animal de cada tipo por viajero. El animal es inspeccionado por los agentes veterinarios y de aduanas en la frontera."
      pt: "Para um cachorro que viaja com o dono para uso pessoal, a exigência publicada é um atestado de saúde animal da autoridade competente do país de partida e um passaporte que registre as vacinas e o tratamento antiparasitário. Nenhuma autorização de importação é necessária, e a alfândega permite até um animal de cada tipo por viajante. O animal é inspecionado por agentes veterinários e da alfândega na fronteira."
    cls: warn
  nonListed:
    title: { en: "Commercial import / more than the allowance", fr: "Import commercial / au-delà de la franchise", es: "Importación comercial / más allá de la franquicia", pt: "Importação comercial / acima do limite permitido" }
    body:
      en: "For a commercial import, or more animals than the personal customs allowance, an import notification / permit from GAVS must be obtained in advance, in addition to the exporting country's veterinary certificate and passport for each animal. Additional conditions and inspection apply, and clearance is handled as a regulated consignment rather than personal baggage."
      fr: "Pour un import commercial, ou davantage d'animaux que la franchise douanière personnelle, une notification / permis d'importation de la GAVS doit être obtenu à l'avance, en plus du certificat vétérinaire et du passeport du pays exportateur pour chaque animal. Des conditions et une inspection supplémentaires s'appliquent, et le dédouanement se fait comme un envoi réglementé, non comme un bagage personnel."
      es: "Para una importación comercial, o más animales que la franquicia aduanera personal, debe obtenerse por adelantado una notificación / permiso de importación de la GAVS, además del certificado veterinario y el pasaporte del país exportador para cada animal. Se aplican condiciones e inspección adicionales, y el despacho se gestiona como un envío regulado en lugar de equipaje personal."
      pt: "Para uma importação comercial, ou mais animais do que o limite alfandegário pessoal, uma notificação/autorização de importação da GAVS precisa ser obtida com antecedência, além do certificado veterinário e do passaporte do país exportador para cada animal. Condições e inspeções adicionais se aplicam, e a liberação é tratada como uma remessa regulamentada, e não como bagagem pessoal."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Mongolia depends on where you flew from and whether the animal is a personal pet or a commercial import."
    fr: "Ce qui se passe à l'arrivée de ton chien en Mongolie dépend de ton lieu de départ et du statut de l'animal (compagnie ou import commercial)."
    es: "Lo que ocurre cuando tu perro llega a Mongolia depende del lugar desde el que hayas volado y de si el animal es una mascota personal o una importación comercial."
    pt: "O que acontece quando o seu cachorro chega à Mongólia depende de onde você partiu e de o animal ser um animal de estimação pessoal ou uma importação comercial."
  points:
    - en: "Enter through a crossing point that operates veterinary control, such as Chinggis Khaan International Airport in Ulaanbaatar."
      fr: "Entre par un point de passage assurant le contrôle vétérinaire, comme l'aéroport international Chinggis Khaan à Oulan-Bator."
      es: "Entra por un punto de paso que realice control veterinario, como el Aeropuerto Internacional Chinggis Khaan de Ulán Bator."
      pt: "Entre por um ponto de travessia que opere controle veterinário, como o Chinggis Khaan International Airport, em Ulaanbaatar."
    - en: "Declare the animal to customs — pets are goods requiring pre-declaration; use the red channel where airport channels apply."
      fr: "Déclare l'animal à la douane — les animaux sont des marchandises à déclarer au préalable ; emprunte le canal rouge lorsque les canaux d'aéroport s'appliquent."
      es: "Declara el animal a la aduana — las mascotas son mercancías que requieren declaración previa; usa el canal rojo donde apliquen los canales del aeropuerto."
      pt: "Declare o animal à alfândega — animais de estimação são mercadorias que exigem declaração prévia; use o canal vermelho onde houver canais de aeroporto."
    - en: "Present the international veterinary health certificate and the passport with vaccination and antiparasitic-treatment records to the veterinary officer."
      fr: "Présente le certificat sanitaire vétérinaire international et le passeport avec les preuves de vaccination et de traitement antiparasitaire à l'agent vétérinaire."
      es: "Presenta el certificado sanitario veterinario internacional y el pasaporte con los registros de vacunación y de tratamiento antiparasitario al agente veterinario."
      pt: "Apresente o atestado de saúde veterinário internacional e o passaporte com os registros de vacinação e tratamento antiparasitário ao agente veterinário."
    - en: "For a personal pet with complete, valid documents there is no routine quarantine and no import permit."
      fr: "Pour un animal de compagnie avec des documents complets et valides, il n'y a ni quarantaine systématique, ni permis d'importation."
      es: "Para una mascota personal con documentos completos y válidos no hay cuarentena rutinaria ni permiso de importación."
      pt: "Para um animal de estimação pessoal com documentos completos e válidos, não há quarentena de rotina nem autorização de importação."
    - en: "Carry original documents; for import into Mongolia the veterinary certificate is expected in Mongolian, so arrange an official translation where needed."
      fr: "Munis-toi des documents originaux ; pour l'import en Mongolie, le certificat vétérinaire est attendu en mongol : prévois une traduction officielle si nécessaire."
      es: "Lleva los documentos originales; para la importación en Mongolia se espera el certificado veterinario en mongol, así que gestiona una traducción oficial cuando sea necesario."
      pt: "Leve os documentos originais; para a importação na Mongólia, o certificado veterinário é esperado em mongol, então providencie uma tradução oficial quando necessário."
    - en: "If vaccinations or documents are missing or invalid, the border service may hold, isolate or refuse the animal, or return it at the owner's expense."
      fr: "Si les vaccins ou documents manquent ou sont invalides, le service frontalier peut retenir, isoler ou refuser l'animal, ou le réexpédier aux frais du propriétaire."
      es: "Si las vacunas o los documentos faltan o no son válidos, el servicio fronterizo puede retener, aislar o rechazar al animal, o devolverlo a cargo del propietario."
      pt: "Se as vacinas ou os documentos estiverem ausentes ou inválidos, o serviço de fronteira pode reter, isolar ou recusar o animal, ou devolvê-lo, às custas do dono."

