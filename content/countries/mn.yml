restrictedDogs:
  intro:
    en: "Mongolia does not publish a breed-specific import ban for dogs. In 2024 it adopted its first Law on Pet Animals, which regulates the keeping, breeding and welfare of companion animals inside the country rather than customs entry."
    fr: "La Mongolie ne publie pas d'interdiction d'importation visant une race de chien. En 2024, elle a adopté sa première loi sur les animaux de compagnie, qui encadre la détention, l'élevage et le bien-être des animaux de compagnie à l'intérieur du pays, et non l'entrée douanière."
    es: "Mongolia no publica ninguna prohibición de importación por raza para perros. En 2024 adoptó su primera Ley de Animales de Compañía, que regula la tenencia, la cría y el bienestar de los animales de compañía dentro del país, más que la entrada aduanera."
    pt: "A Mongólia não publica uma proibição de importação por raça para cachorros. Em 2024, o país adotou sua primeira Law on Pet Animals, que regula a posse, a criação e o bem-estar de animais de companhia dentro do país, e não a entrada alfandegária."
  cat1:
    en: "No category of dog breed is listed as prohibited from import in Mongolia's published veterinary or customs requirements. Any breed-based restriction that may exist is not officially published (Unknown)."
    fr: "Aucune catégorie de race de chien n'est listée comme interdite à l'importation dans les exigences vétérinaires ou douanières publiées de la Mongolie. Toute restriction fondée sur la race qui existerait n'est pas officiellement publiée (non communiquée)."
    es: "Ninguna categoría de raza de perro figura como prohibida para la importación en los requisitos veterinarios o aduaneros publicados de Mongolia. Cualquier restricción basada en la raza que pudiera existir no está publicada oficialmente (no comunicada)."
    pt: "Nenhuma categoria de raça de cachorro consta como proibida de importação nas exigências veterinárias ou alfandegárias publicadas pela Mongólia. Qualquer restrição baseada em raça que possa existir não é publicada oficialmente (desconhecida)."
  cat2:
    en: "The 2024 Law on Pet Animals places obligations on domestic keepers and breeders — for example registration and microchipping of animals by licensed breeders — with the Mongolian Bankhar, the national mastiff, given special protection. These are domestic keeping rules, not an import ban."
    fr: "La loi de 2024 sur les animaux de compagnie impose des obligations aux détenteurs et éleveurs domestiques — par exemple l'enregistrement et le puçage des animaux par les éleveurs agréés — le Bankhar mongol, mâtin national, bénéficiant d'une protection particulière. Ce sont des règles de détention internes, non une interdiction d'importation."
    es: "La Ley de Animales de Compañía de 2024 impone obligaciones a los tenedores y criadores nacionales — por ejemplo el registro y la colocación de microchip a los animales por parte de criadores autorizados — con el Bankhar mongol, el mastín nacional, que goza de una protección especial. Son normas internas de tenencia, no una prohibición de importación."
    pt: "A Law on Pet Animals de 2024 impõe obrigações a donos e criadores nacionais — por exemplo, o registro e a colocação de microchip em animais por criadores licenciados —, com o Bankhar mongol, o mastim nacional, recebendo proteção especial. Essas são regras nacionais de posse, não uma proibição de importação."
  note:
    en: "Only the official law and GAVS guidance are authoritative. Because Mongolia publishes limited detail, confirm any breed, keeping or licensing rule with GAVS before you travel."
    fr: "Seuls la loi officielle et les indications de la GAVS font foi. La Mongolie publiant peu de détails, confirme toute règle de race, de détention ou d'agrément auprès de la GAVS avant de voyager."
    es: "Solo la ley oficial y las indicaciones de la GAVS son vinculantes. Como Mongolia publica pocos detalles, confirma cualquier norma de raza, tenencia o licencia con la GAVS antes de viajar."
    pt: "Apenas a lei oficial e a orientação da GAVS têm valor normativo. Como a Mongólia publica detalhes limitados, confirme qualquer regra de raça, posse ou licenciamento com a GAVS antes de viajar."

