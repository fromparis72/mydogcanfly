# Country Entry Guide — Mongolia (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_mn
iso2: "MN"
name: { en: "Mongolia", fr: "Mongolie", es: "Mongolia", pt: "Mongólia" }
region: { en: "East Asia", fr: "Asie de l'Est", es: "Asia Oriental", pt: "Ásia Oriental" }


regime: non_listed
exit:
  authority: GAVS
  authorityUrl: https://vet.gov.mn
  intro:
    en: "Mongolia is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the General Authority for Veterinary Services (GAVS)."
    fr: "La Mongolie est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par la General Authority for Veterinary Services (GAVS)."
    es: "Mongolia no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por la General Authority for Veterinary Services (GAVS)."
    pt: "A Mongólia é um país não listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para retornar à UE — além de um atestado de saúde de exportação endossado pela General Authority for Veterinary Services (GAVS)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "A licensed vet completes the certificate just before travel and a GAVS government veterinarian issues/endorses the export veterinary certificate."
        fr: "Un vétérinaire agréé remplit le certificat juste avant le voyage et un vétérinaire officiel du GAVS délivre/vise le certificat vétérinaire d'export."
        es: "Un veterinario autorizado rellena el certificado justo antes del viaje y un veterinario oficial de la GAVS emite/refrenda el certificado veterinario de exportación."
        pt: "Um veterinário licenciado preenche o certificado pouco antes da viagem, e um veterinário do governo da GAVS emite/endossa o certificado veterinário de exportação."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Mongolia with your dog", fr: "Voyager en Mongolie avec ton chien", es: "Viajar a Mongolia con tu perro", pt: "Viajar para a Mongólia com seu cachorro" }
  intro:
    en: >-
      Mongolia is neither an EU member nor a member of the Eurasian Economic Union (EAEU): it applies
      its own veterinary import rules through the General Authority for Veterinary Services (GAVS), a
      government implementing agency under the Ministry of Food, Agriculture and Light Industry. A pet
      dog travelling with its owner is admitted, but Mongolia publishes only limited English-language
      detail on the exact steps. The core of the published procedure is an official international
      veterinary health certificate from the veterinary authority of the country of departure, together
      with a passport or record showing the dog's vaccinations and antiparasitic treatment, checked by
      veterinary and customs officers at the border. Several finer points — a mandatory microchip, the
      exact rabies-vaccination timing, or any antibody test — are not clearly published, so this guide
      flags them as unconfirmed and points you to GAVS and a USDA-accredited or official veterinarian
      before you book.
    fr: >-
      La Mongolie n'est ni membre de l'UE, ni membre de l'Union économique eurasiatique (UEEA) : elle
      applique ses propres règles d'importation vétérinaire via l'Autorité générale des services
      vétérinaires (GAVS), agence d'exécution du gouvernement rattachée au ministère de l'Alimentation,
      de l'Agriculture et de l'Industrie légère. Un chien de compagnie voyageant avec son propriétaire
      est admis, mais la Mongolie ne publie que peu de détails en anglais sur les étapes exactes. Le
      cœur de la procédure publiée est un certificat sanitaire vétérinaire international officiel délivré
      par l'autorité vétérinaire du pays de départ, accompagné d'un passeport ou carnet indiquant les
      vaccinations et le traitement antiparasitaire du chien, vérifié par les agents vétérinaires et
      douaniers à la frontière. Plusieurs points fins — puce obligatoire, calendrier exact du vaccin
      antirabique ou éventuel titrage — ne sont pas clairement publiés ; ce guide les signale comme non
      confirmés et tu renvoie à la GAVS et à un vétérinaire officiel avant de réserver.
    es: >-
      Mongolia no es ni miembro de la UE ni de la Unión Económica Euroasiática (UEEA): aplica sus propias
      normas de importación veterinaria a través de la Autoridad General de Servicios Veterinarios (GAVS),
      un organismo ejecutor del gobierno dependiente del Ministerio de Alimentación, Agricultura e
      Industria Ligera. Un perro de compañía que viaja con su propietario es admitido, pero Mongolia
      publica pocos detalles en inglés sobre los pasos exactos. El núcleo del procedimiento publicado es
      un certificado sanitario veterinario internacional oficial de la autoridad veterinaria del país de
      salida, junto con un pasaporte o cartilla que acredite las vacunaciones y el tratamiento
      antiparasitario del perro, revisado por los agentes veterinarios y de aduanas en la frontera.
      Varios puntos más finos — un microchip obligatorio, el calendario exacto de la vacunación
      antirrábica o una posible prueba de titulación — no están claramente publicados, por lo que esta
      guía los señala como no confirmados y te remite a la GAVS y a un veterinario acreditado por el USDA
      u oficial antes de reservar.

    pt: "A Mongólia não é membro da UE nem da União Econômica Eurasiática (EAEU): ela aplica suas próprias regras veterinárias de importação por meio da General Authority for Veterinary Services (GAVS), um órgão executivo do governo vinculado ao Ministry of Food, Agriculture and Light Industry. Um cachorro de estimação viajando com o dono é admitido, mas a Mongólia publica apenas detalhes limitados em inglês sobre as etapas exatas. O núcleo do procedimento publicado é um atestado de saúde veterinário internacional oficial da autoridade veterinária do país de partida, junto com um passaporte ou registro que mostre as vacinas e o tratamento antiparasitário do cachorro, conferidos por agentes veterinários e da alfândega na fronteira. Vários pontos mais específicos — um microchip obrigatório, o momento exato da vacinação antirrábica, ou qualquer teste sorológico — não são publicados com clareza, então este guia os sinaliza como não confirmados e recomenda que você consulte a GAVS e um veterinário credenciado pelo USDA ou oficial antes de reservar."
difficulty:
  level: moderate
  label: { en: "Moderate (health certificate + vaccinations; several details unpublished)", fr: "Modéré (certificat sanitaire + vaccins ; plusieurs détails non publiés)", es: "Moderado (certificado sanitario + vacunas; varios detalles no publicados)", pt: "Moderado (atestado de saúde + vacinas; vários detalhes não publicados)" }

prepTime:
  eu:
    en: "No EU/EAEU simplified regime exists: the same third-country rules apply from every country of departure, so there is no fast-track lane."
    fr: "Aucun régime simplifié UE/UEEA n'existe : les mêmes règles de pays tiers s'appliquent depuis tout pays de départ, sans voie accélérée."
    es: "No existe un régimen simplificado UE/UEEA: las mismas normas de país tercero se aplican desde cualquier país de salida, sin vía rápida."
    pt: "Não existe um regime simplificado UE/EAEU: as mesmas regras de país terceiro se aplicam a partir de qualquer país de partida, portanto não há um caminho rápido."
  listed:
    en: "Personal pet with the owner: allow roughly 2 to 4 weeks to gather vaccinations, the departure-country veterinary health certificate and its official endorsement — longer if a primary rabies shot is still needed."
    fr: "Animal de compagnie avec le propriétaire : compte environ 2 à 4 semaines pour réunir les vaccins, le certificat sanitaire vétérinaire du pays de départ et son visa officiel — plus si une primo-vaccination antirabique reste à faire."
    es: "Mascota personal con el propietario: prevé aproximadamente de 2 a 4 semanas para reunir las vacunas, el certificado sanitario veterinario del país de salida y su refrendo oficial — más si aún falta una primovacunación antirrábica."
    pt: "Animal de estimação pessoal com o dono: reserve cerca de 2 a 4 semanas para reunir as vacinas, o atestado de saúde veterinário do país de partida e o seu endosso oficial — mais tempo se ainda for necessária a primeira dose da vacina antirrábica."
  nonListed:
    en: "Commercial import or more than the personal allowance: several weeks — an import permit / advance approval from GAVS must be obtained before shipment."
    fr: "Import commercial ou au-delà de la franchise personnelle : plusieurs semaines — un permis d'importation / accord préalable de la GAVS doit être obtenu avant l'expédition."
    es: "Importación comercial o más allá de la franquicia personal: varias semanas — debe obtenerse un permiso de importación / aprobación previa de la GAVS antes del envío."
    pt: "Importação comercial ou acima do limite pessoal: várias semanas — uma autorização de importação / aprovação prévia da GAVS precisa ser obtida antes do embarque."

