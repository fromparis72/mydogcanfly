# Country Entry Guide — Hong Kong (source of truth, bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_hk
iso2: "HK"
name: { en: "Hong Kong", fr: "Hong Kong", es: "Hong Kong", pt: "Hong Kong" }
region: { en: "Asia", fr: "Asie", es: "Asia", pt: "Ásia" }


regime: listed
exit:
  authority: AFCD
  authorityUrl: https://www.afcd.gov.hk/english/quarantine/qua_ie/qua_ie_eapao/qua_ie_eapao_ioahc/qua_ie_eapao_ioahc_eu_uk.html
  intro:
    en: "Hong Kong is a listed country, so no rabies titer is needed to return to the EU — the AFCD officially certifies the EU-format health documentation for your dog."
    fr: "Hong Kong est un pays listé : pas de titrage pour rentrer dans l'UE — l'AFCD certifie officiellement les documents sanitaires au format UE pour ton chien."
    es: "Hong Kong es un país listado: no hace falta titulación para volver a la UE — el AFCD certifica oficialmente la documentación sanitaria en formato UE para tu perro."
    pt: "Hong Kong é um país listado: não é preciso titulação antirrábica para voltar à UE — o AFCD certifica oficialmente a documentação sanitária em formato UE do seu cachorro."
  steps:
    - timing: window
      scope: eu
      text:
        en: "The dog must be microchipped, rabies-vaccinated (at least 21 days after the primary shot) and examined by an approved vet; the AFCD then officially endorses the EU-format certificate, valid 10 days in the EU."
        fr: "Le chien doit être pucé, vacciné contre la rage (au moins 21 jours après la primo-vaccination) et examiné par un vétérinaire agréé ; l'AFCD vise ensuite officiellement le certificat au format UE, valable 10 jours dans l'UE."
        es: "El perro debe estar microchipado, vacunado contra la rabia (al menos 21 días tras la primovacunación) y examinado por un veterinario aprobado; luego el AFCD refrenda oficialmente el certificado en formato UE, válido 10 días en la UE."
        pt: "O cachorro precisa ter microchip, estar com a vacinação antirrábica em dia (pelo menos 21 dias depois da dose inicial) e ser examinado por um veterinário credenciado; em seguida o AFCD chancela oficialmente o certificado em formato UE, válido por 10 dias na UE."
    - timing: window
      scope: non_eu
      text:
        en: "The dog must be microchipped, rabies-vaccinated (at least 21 days after the primary shot) and examined by an approved vet; the AFCD then officially endorses the export certificate."
        fr: "Le chien doit être pucé, vacciné contre la rage (au moins 21 jours après la primo-injection) et examiné par un vétérinaire agréé ; l'AFCD vise ensuite officiellement le certificat d'export."
        es: "El perro debe tener microchip, vacuna antirrábica (al menos 21 días después de la primera dosis) y un examen de un veterinario autorizado; luego el AFCD valida oficialmente el certificado de exportación."
        pt: "O cachorro precisa de microchip, vacinação antirrábica (no mínimo 21 dias após a primeira dose) e exame por um veterinário credenciado; depois o AFCD endossa oficialmente o certificado de exportação."
  onSiteNote:
    en: "For Finland, Ireland, Malta or Norway, dogs must be treated against tapeworm 24–120 hours before EU arrival."
    fr: "Pour la Finlande, l'Irlande, Malte ou la Norvège, les chiens doivent être traités contre le ténia 24 à 120 h avant l'arrivée dans l'UE."
    es: "Para Finlandia, Irlanda, Malta o Noruega, los perros deben recibir tratamiento contra la tenia 24–120 h antes de llegar a la UE."
    pt: "Para Finlândia, Irlanda, Malta ou Noruega, os cachorros precisam ser tratados contra a tênia entre 24 e 120 horas antes da chegada à UE."

hero:
  h1: { en: "Traveling to Hong Kong with your dog", fr: "Voyager à Hong Kong avec ton chien", es: "Viajar a Hong Kong con tu perro", pt: "Viajar para Hong Kong com o seu cachorro" }
  intro:
    en: >-
      Hong Kong welcomes dogs, but every dog needs a Special Permit issued in advance by the
      Agriculture, Fisheries and Conservation Department (AFCD) before it can be brought in — no
      permit, no entry. What else you must prepare depends mainly on where your dog is coming from.
      AFCD sorts countries and places into groups by rabies risk: Group I (rabies-free places such as
      Australia, New Zealand, the United Kingdom, Ireland and Japan) and Group II (most of Europe, the
      United States, Canada) allow entry without quarantine when the permit conditions are met. Group
      IIIA adds a rabies antibody test and a 30-day quarantine, and Group IIIB (all other places)
      requires a 120-day quarantine. This guide explains each case so you know exactly what to prepare
      before you book your flight.
    fr: >-
      Hong Kong accueille les chiens, mais chaque chien doit obtenir à l'avance un permis spécial
      délivré par l'Agriculture, Fisheries and Conservation Department (AFCD) avant de pouvoir entrer —
      pas de permis, pas d'entrée. Ce qu'il faut préparer par ailleurs dépend surtout du lieu de
      provenance de ton chien. L'AFCD classe les pays et territoires en groupes selon le risque
      rabique : le groupe I (lieux indemnes de rage comme l'Australie, la Nouvelle-Zélande, le
      Royaume-Uni, l'Irlande et le Japon) et le groupe II (la plupart de l'Europe, les États-Unis, le
      Canada) permettent l'entrée sans quarantaine si les conditions du permis sont remplies. Le groupe
      IIIA ajoute un test d'anticorps antirabiques et une quarantaine de 30 jours, et le groupe IIIB
      (tous les autres lieux) impose une quarantaine de 120 jours. Ce guide détaille chaque cas pour
      savoir exactement quoi préparer avant de réserver ton vol.
    es: >-
      Hong Kong acoge a los perros, pero cada perro necesita un permiso especial expedido por
      adelantado por el Agriculture, Fisheries and Conservation Department (AFCD) antes de poder entrar —
      sin permiso, no hay entrada. Lo demás que debes preparar depende sobre todo del lugar de
      procedencia de tu perro. El AFCD clasifica los países y territorios en grupos según el riesgo de
      rabia: el grupo I (lugares libres de rabia como Australia, Nueva Zelanda, el Reino Unido, Irlanda
      y Japón) y el grupo II (la mayor parte de Europa, Estados Unidos, Canadá) permiten la entrada sin
      cuarentena cuando se cumplen las condiciones del permiso. El grupo IIIA añade una prueba de
      titulación de rabia y una cuarentena de 30 días, y el grupo IIIB (todos los demás lugares) exige
      una cuarentena de 120 días. Esta guía explica cada caso para que sepas exactamente qué preparar
      antes de reservar tu vuelo.

    pt: "Hong Kong recebe bem os cachorros, mas todo cachorro precisa de uma Permissão Especial (Special Permit) emitida com antecedência pelo Agriculture, Fisheries and Conservation Department (AFCD) para poder entrar — sem permissão, sem entrada. O restante do preparo depende principalmente de onde o seu cachorro vem. O AFCD organiza países e territórios em grupos conforme o risco de raiva: o grupo I (lugares livres de raiva, como Austrália, Nova Zelândia, Reino Unido, Irlanda e Japão) e o grupo II (a maior parte da Europa, os Estados Unidos e o Canadá) permitem a entrada sem quarentena quando as condições da permissão são cumpridas. O grupo IIIA acrescenta um teste sorológico antirrábico (titulação) e uma quarentena de 30 dias, e o grupo IIIB (todos os demais lugares) exige uma quarentena de 120 dias. Este guia explica cada caso para você saber exatamente o que preparar antes de comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Easy to difficult (depends on origin)", fr: "Facile à difficile (selon l'origine)", es: "De fácil a difícil (según el origen)", pt: "De fácil a difícil (depende da origem)" }

prepTime:
  eu:
    en: "Group I & II: a few weeks — obtain the Special Permit (about 5 working days) plus the pre-export vaccinations and health certificate; no quarantine."
    fr: "Groupes I & II : quelques semaines — obtention du permis spécial (environ 5 jours ouvrés) plus les vaccinations et le certificat sanitaire avant départ ; sans quarantaine."
    es: "Grupos I y II: unas semanas — obtén el permiso especial (unos 5 días hábiles) más las vacunaciones y el certificado sanitario previos a la exportación; sin cuarentena."
    pt: "Grupos I e II: algumas semanas — obter a Permissão Especial (cerca de 5 dias úteis), além das vacinas e do atestado de saúde antes da exportação; sem quarentena."
  listed:
    en: "Group IIIA: ~4–6 months — rabies vaccination, a rabies antibody test with blood drawn 90 days to 1 year before export, then a 30-day quarantine on arrival."
    fr: "Groupe IIIA : ~4–6 mois — vaccination antirabique, test d'anticorps antirabiques avec prise de sang 90 jours à 1 an avant l'export, puis quarantaine de 30 jours à l'arrivée."
    es: "Grupo IIIA: ~4–6 meses — vacunación antirrábica, una prueba de titulación de rabia con sangre extraída de 90 días a 1 año antes de la exportación, y luego una cuarentena de 30 días a la llegada."
    pt: "Grupo IIIA: cerca de 4 a 6 meses — vacinação antirrábica, teste sorológico antirrábico com coleta de sangue de 90 dias a 1 ano antes da exportação e, na chegada, uma quarentena de 30 dias."
  nonListed:
    en: "Group IIIB: several months to over a year — a quarantine space must be booked well ahead, followed by a minimum 120-day quarantine on arrival."
    fr: "Groupe IIIB : de plusieurs mois à plus d'un an — une place de quarantaine doit être réservée très en avance, suivie d'une quarantaine minimale de 120 jours à l'arrivée."
    es: "Grupo IIIB: de varios meses a más de un año — debe reservarse con mucha antelación una plaza de cuarentena, seguida de una cuarentena mínima de 120 días a la llegada."
    pt: "Grupo IIIB: de vários meses a mais de um ano — é preciso reservar uma vaga de quarentena com bastante antecedência e cumprir, na chegada, uma quarentena mínima de 120 dias."

