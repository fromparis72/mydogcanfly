# Country Entry Guide — Kosovo (bilingual EN/FR).
# Non-EU national scheme. Governing instrument: Administrative Instruction No. 02/2009
# "On the conditions of movement of non-commercial companion animals" (Food and Veterinary
# Agency — AUV / Agjencia e Ushqimit dhe Veterinarisë, auvk.rks-gov.net), transposing the
# EU non-commercial pet-movement model. Microchip identification also covered by AI (MAFRD)
# No. 02/2018 on identification and registration of companion animals. Border document control
# by Kosovo Customs (Dogana e Kosovës, dogana.rks-gov.net).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_xk
iso2: "XK"
name: { en: "Kosovo", fr: "Kosovo", es: "Kosovo", pt: "Kosovo" }
region: { en: "Europe (non-EU)", fr: "Europe (hors UE)", es: "Europa (fuera de la UE)", pt: "Europa (fora da UE)" }


regime: non_listed
exit:
  authority: AUV
  authorityUrl: https://auvk.rks-gov.net/shendeti-i-kafsheve/
  intro:
    en: "Kosovo is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus a health certificate issued by a Food and Veterinary Agency (AUV) official veterinarian."
    fr: "Le Kosovo est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire délivré par un vétérinaire officiel de l'Agence de l'alimentation et de la vétérinaire (AUV)."
    es: "Kosovo no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario emitido por un veterinario oficial de la Agencia de Alimentos y Veterinaria (AUV)."
    pt: "O Kosovo é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde emitido por um veterinário oficial da Agência de Alimentos e Veterinária (AUV)."
  steps:
    - timing: longlead
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      text:
        en: "The EU-model animal health certificate is issued and signed by an AUV official veterinarian before departure."
        fr: "Le certificat sanitaire au modèle UE est délivré et signé par un vétérinaire officiel de l'AUV avant le départ."
        es: "El certificado sanitario en modelo UE lo emite y firma un veterinario oficial de la AUV antes de salir."
        pt: "O certificado sanitário no modelo da UE é emitido e assinado por um veterinário oficial da AUV antes da partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Kosovo with your dog", fr: "Voyager au Kosovo avec ton chien", es: "Viajar a Kosovo con tu perro", pt: "Viajar para o Kosovo com seu cachorro" }
  intro:
    en: >-
      Kosovo welcomes dogs, but what you need to prepare depends mainly on the country your dog is
      travelling from — not only on Kosovo itself. Kosovo is not an EU member; it runs its own national
      scheme under Administrative Instruction No. 02/2009 of the Food and Veterinary Agency (AUV), which
      mirrors the EU non-commercial pet-movement model. An ISO microchip, a valid rabies vaccination and a
      veterinary certificate (or pet passport) are always required. A dog arriving from the EU or another
      listed country needs the certificate but no blood test. A dog from a non-listed, rabies-risk country
      faces the longest path — a rabies antibody test, a three-month wait and a tapeworm treatment. This
      guide explains each case so you know exactly what to prepare before you book your flight.
    fr: >-
      Le Kosovo accueille les chiens, mais ce qu'il faut préparer dépend surtout du pays d'où ton chien
      voyage — pas seulement du Kosovo. Le Kosovo n'est pas membre de l'UE ; il applique son propre
      dispositif national selon l'Instruction administrative n° 02/2009 de l'Agence de l'alimentation et de
      la vétérinaire (AUV), calquée sur le modèle européen de mouvement non commercial des animaux. Une puce
      ISO, une vaccination antirabique valide et un certificat vétérinaire (ou passeport) sont toujours
      exigés. Un chien arrivant de l'UE ou d'un autre pays listé a besoin du certificat mais pas de prise de
      sang. Un chien venant d'un pays non listé, à risque rabique, suit le parcours le plus long — titrage
      antirabique, délai de trois mois et traitement contre l'échinococcose. Ce guide détaille chaque cas
      pour savoir exactement quoi préparer avant de réserver ton vol.
    es: >-
      Kosovo acoge a los perros, pero lo que debes preparar depende sobre todo del país desde el que
      viaja tu perro — no solo de Kosovo. Kosovo no es miembro de la UE; aplica su propio régimen
      nacional en virtud de la Instrucción Administrativa n.º 02/2009 de la Agencia de Alimentación y
      Veterinaria (AUV), que refleja el modelo europeo de movimiento no comercial de animales de
      compañía. Siempre se exigen un microchip ISO, una vacunación antirrábica válida y un certificado
      veterinario (o pasaporte para mascotas). Un perro que llega de la UE o de otro país listado
      necesita el certificado, pero no un análisis de sangre. Un perro de un país no listado, con riesgo
      de rabia, se enfrenta al camino más largo — una prueba de titulación de rabia, una espera de tres
      meses y un tratamiento contra la tenia. Esta guía explica cada caso para que sepas exactamente qué
      preparar antes de reservar tu vuelo.

    pt: "O Kosovo recebe bem os cachorros, mas o que você precisa preparar depende principalmente do país de onde seu cachorro parte — e não só do Kosovo em si. O Kosovo não é membro da UE; ele aplica seu próprio regime nacional sob a Instrução Administrativa nº 02/2009 da Agência de Alimentos e Veterinária (AUV), que espelha o modelo europeu de circulação não comercial de animais de estimação. Microchip ISO, vacinação antirrábica válida e certificado veterinário (ou passaporte para animais) são sempre obrigatórios. Um cachorro que chega da UE ou de outro país listado precisa do certificado, mas não de exame de sangue. Um cachorro vindo de um país não listado, de risco de raiva, enfrenta o caminho mais longo — teste sorológico antirrábico, três meses de espera e tratamento contra a tênia. Este guia explica cada caso para você saber exatamente o que preparar antes de comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Easy to difficult (depends on origin)", fr: "Facile à difficile (selon l'origine)", es: "De fácil a difícil (según el origen)", pt: "De fácil a difícil (depende da origem)" }

prepTime:
  eu:
    en: "A few days to ~3 weeks: if the rabies shot is current you mainly need the veterinary certificate; allow +21 days if the first vaccination is still needed."
    fr: "Quelques jours à ~3 semaines : si le vaccin antirabique est à jour il reste surtout le certificat vétérinaire ; compte +21 jours si la première vaccination reste à faire."
    es: "Desde unos días hasta ~3 semanas: si la vacuna antirrábica está al día, sobre todo necesitas el certificado veterinario; cuenta con +21 días si aún falta la primera vacunación."
    pt: "De alguns dias a ~3 semanas: se a vacina antirrábica estiver em dia, você precisa basicamente do certificado veterinário; conte +21 dias se a primeira vacinação ainda estiver pendente."
  listed:
    en: "~3–4 weeks: valid rabies vaccination recorded in the passport/certificate, plus the veterinary certificate issued shortly before travel."
    fr: "~3–4 semaines : vaccination antirabique valide consignée au passeport/certificat, plus le certificat vétérinaire établi peu avant le voyage."
    es: "~3–4 semanas: vacunación antirrábica válida registrada en el pasaporte/certificado, más el certificado veterinario expedido poco antes del viaje."
    pt: "~3–4 semanas: vacinação antirrábica válida registrada no passaporte/certificado, mais o certificado veterinário emitido pouco antes da viagem."
  nonListed:
    en: "~4–7 months: rabies vaccination at least 30 days before entry, antibody test taken ≥30 days after vaccination and 3 months before travel, plus a tapeworm treatment 30 days before import."
    fr: "~4–7 mois : vaccination antirabique au moins 30 jours avant l'entrée, titrage prélevé ≥30 jours après le vaccin et 3 mois avant le voyage, plus un traitement contre l'échinococcose 30 jours avant l'importation."
    es: "~4–7 meses: vacunación antirrábica al menos 30 días antes de la entrada, prueba de titulación tomada ≥30 días después de la vacuna y 3 meses antes del viaje, más un tratamiento contra la tenia 30 días antes de la importación."
    pt: "~4–7 meses: vacinação antirrábica pelo menos 30 dias antes da entrada, teste sorológico coletado ≥30 dias após a vacinação e 3 meses antes da viagem, mais um tratamento contra a tênia 30 dias antes da importação."

