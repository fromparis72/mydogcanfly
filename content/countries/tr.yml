notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro."
    pt: "Só um médico-veterinário pode confirmar o procedimento exato para o seu cachorro."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Turkey (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — la Turquie (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Turquía (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — a Turquia (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — Turkey", fr: "Pays de destination — Turquie", es: "País de destino — Turquía", pt: "País de destino — Turquia" }
      text:
        en: "Turkey applies its own national scheme under Law No. 5996: an ISO microchip, a valid rabies vaccination, a rabies antibody test of at least 0.5 IU/ml and an official veterinary health certificate are the core requirements, with at most two pets per traveller."
        fr: "La Turquie applique son propre régime national (loi n° 5996) : puce ISO, vaccination antirabique valide, titre antirabique d'au moins 0,5 UI/ml et certificat sanitaire vétérinaire officiel sont les exigences de base, avec deux animaux maximum par voyageur."
        es: "Turquía aplica su propio régimen nacional (Ley n.º 5996): un microchip ISO, una vacunación antirrábica válida, una prueba de titulación de rabia de al menos 0,5 UI/ml y un certificado sanitario veterinario oficial son los requisitos básicos, con un máximo de dos mascotas por viajero."
        pt: "A Turquia aplica seu próprio esquema nacional, previsto na Lei nº 5996: microchip ISO, vacinação antirrábica válida, teste sorológico antirrábico de pelo menos 0,5 UI/ml e certificado veterinário de saúde oficial são as exigências centrais, com no máximo dois animais por viajante."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Whether your dog already holds a passport documenting an acceptable rabies antibody test decides if a fresh blood test — and its compulsory 3-month wait — is needed. Dogs with a regular vaccination record and a documented antibody test are not re-tested."
        fr: "Le fait que ton chien dispose déjà d'un passeport attestant un titre antirabique acceptable détermine si une nouvelle prise de sang — et son délai obligatoire de 3 mois — est nécessaire. Les chiens à vaccination régulière et titre attesté ne sont pas retestés."
        es: "Que tu perro ya tenga un pasaporte que documente una prueba de titulación de rabia aceptable determina si se necesita una nueva prueba de sangre — y su espera obligatoria de 3 meses. Los perros con un registro de vacunación regular y una prueba de titulación documentada no se vuelven a analizar."
        pt: "O fato de o seu cachorro já ter ou não um passaporte que documente um teste sorológico antirrábico aceitável decide se será preciso uma nova coleta de sangue — e a espera obrigatória de 3 meses que vem junto. Cachorros com histórico de vacinação em dia e teste sorológico documentado não são testados de novo."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "The rabies situation of your dog's real origin matters. A Turkey-origin pet that travelled abroad and returns keeps the benefit of an antibody test taken before it left, skipping the 3-month wait — but it is the dog's true history that counts, not only the last airport."
        fr: "La situation rabique de l'origine réelle du chien compte. Un animal d'origine turque parti à l'étranger et qui revient conserve le bénéfice d'un titrage effectué avant son départ, évitant le délai de 3 mois — mais c'est l'historique réel du chien qui compte, pas seulement l'aéroport de destination finale."
        es: "La situación de rabia del origen real de tu perro importa. Una mascota de origen turco que viajó al extranjero y regresa conserva el beneficio de una prueba de titulación realizada antes de salir, evitando la espera de 3 meses — pero lo que cuenta es el historial real del perro, no solo el último aeropuerto."
        pt: "A situação da raiva na verdadeira origem do seu cachorro conta. Um animal de origem turca que viajou para o exterior e volta mantém o benefício de um teste sorológico feito antes de sair, pulando a espera de 3 meses — mas o que vale é o histórico real do cachorro, não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Turkey's framework, then confirm your dog's exact origin, antibody-test history and breed with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre turc, puis confirme l'origine exacte, l'historique de titrage et la race de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Turquía y luego confirma con tu veterinario el origen exacto de tu perro, su historial de pruebas de titulación y su raza."
    pt: "Então leia as exigências abaixo como o quadro geral da Turquia e depois confirme com seu veterinário a origem exata, o histórico de testes sorológicos e a raça do seu cachorro."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Must comply with ISO 11784 (HDX or FDX-B) and be readable with an ISO 11785 reader; implanted before the rabies vaccination.", fr: "Doit être conforme à l'ISO 11784 (HDX ou FDX-B) et lisible par un lecteur ISO 11785 ; posée avant la vaccination antirabique.", es: "Debe cumplir la norma ISO 11784 (HDX o FDX-B) y ser legible con un lector ISO 11785; implantado antes de la vacunación antirrábica.", pt: "Precisa estar em conformidade com a ISO 11784 (HDX ou FDX-B) e ser legível por um leitor ISO 11785; implantado antes da vacinação antirrábica." }
    exceptions: { en: "A clearly legible tattoo is accepted as identification; if the chip is non-standard, the owner must supply a compatible reader.", fr: "Un tatouage clairement lisible est accepté comme identification ; si la puce n'est pas normalisée, le propriétaire doit fournir un lecteur compatible.", es: "Un tatuaje claramente legible se acepta como identificación; si el chip no es estándar, el propietario debe proporcionar un lector compatible.", pt: "Uma tatuagem claramente legível é aceita como identificação; se o chip não for padrão, o dono precisa fornecer um leitor compatível." }
    ref: { en: "Reg. on non-commercial movement of pets (RG 05.12.2011-28133), Law No. 5996", fr: "Règl. mouvements non commerciaux d'animaux (JO 05.12.2011-28133), loi n° 5996", es: "Regl. sobre movimientos no comerciales de mascotas (RG 05.12.2011-28133), Ley n.º 5996", pt: "Reg. sobre a circulação não comercial de animais de estimação (RG 05.12.2011-28133), Lei nº 5996" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "An inactivated or recombinant vaccine listed in the WOAH (OIE) manual; given after microchipping and still valid. A booster given outside the previous vaccine's validity counts as a first vaccination.", fr: "Vaccin inactivé ou recombinant figurant au manuel WOAH (OIE) ; fait après la pose de la puce et toujours valide. Un rappel effectué hors validité du vaccin précédent compte comme une primo-vaccination.", es: "Una vacuna inactivada o recombinante que figure en el manual de la WOAH (OIE); administrada después del microchip y aún válida. Un refuerzo administrado fuera de la valide de la vacuna anterior cuenta como primovacunación.", pt: "Vacina inativada ou recombinante listada no manual da WOAH (OIE); aplicada depois do microchip e ainda dentro da validade. Um reforço aplicado fora da validade da vacina anterior conta como primeira vacinação." }
    exceptions: { en: "The vaccination date cannot be earlier than the microchipping date, or the vaccine is invalid.", fr: "La date de vaccination ne peut être antérieure à la pose de la puce, sinon le vaccin est invalide.", es: "La fecha de vacunación no puede ser anterior a la del implante del microchip; de lo contrario, la vacuna no es válida.", pt: "A data da vacinação não pode ser anterior à data de implantação do microchip; caso contrário, a vacina não vale." }
    ref: { en: "Reg. on non-commercial movement of pets (RG 05.12.2011-28133), art. 3", fr: "Règl. mouvements non commerciaux d'animaux (JO 05.12.2011-28133), art. 3", es: "Regl. sobre movimientos no comerciales de mascotas (RG 05.12.2011-28133), art. 3", pt: "Reg. sobre a circulação não comercial de animais de estimação (RG 05.12.2011-28133), art. 3" }
  - item: { en: "Rabies antibody (titration) test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Required", fr: "Requis", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Blood taken by an authorised vet at least 30 days after the last rabies vaccination and at least 3 months before travel; tested in an EU-approved laboratory; result ≥0.5 IU/ml. Entry is possible only 3 months after the blood draw.", fr: "Sang prélevé par un vétérinaire habilité au moins 30 jours après le dernier vaccin antirabique et au moins 3 mois avant le voyage ; analysé dans un laboratoire agréé UE ; résultat ≥0,5 UI/ml. Entrée possible seulement 3 mois après le prélèvement.", es: "Sangre extraída por un veterinario autorizado al menos 30 días después de la última vacunación antirrábica y al menos 3 meses antes del viaje; analizada en un laboratorio autorizado por la UE; resultado ≥0,5 UI/ml. La entrada solo es posible 3 meses después de la extracción de sangre.", pt: "Sangue coletado por um veterinário autorizado no mínimo 30 dias depois da última vacinação antirrábica e no mínimo 3 meses antes da viagem; analisado em laboratório aprovado pela UE; resultado ≥0,5 UI/ml. A entrada só é possível 3 meses depois da coleta." }
    exceptions: { en: "Not re-requested for a dog whose passport already documents an acceptable antibody test and a regular vaccination record; a Turkey-origin dog returning after travel is exempt from the 3-month wait if it was tested before leaving.", fr: "Non redemandé pour un chien dont le passeport atteste déjà un titre acceptable et une vaccination régulière ; un chien d'origine turque qui revient est dispensé du délai de 3 mois s'il a été testé avant son départ.", es: "No se vuelve a exigir a un perro cuyo pasaporte ya documenta una prueba de titulación aceptable y un registro de vacunación regular; un perro de origen turco que regresa tras un viaje está exento de la espera de 3 meses si se analizó antes de salir.", pt: "Não é pedido de novo para um cachorro cujo passaporte já documenta um teste sorológico aceitável e um histórico de vacinação em dia; um cachorro de origem turca que volta depois de uma viagem fica dispensado da espera de 3 meses se tiver sido testado antes de sair." }
    ref: { en: "Reg. on non-commercial movement of pets (RG 05.12.2011-28133), art. 4-6", fr: "Règl. mouvements non commerciaux d'animaux (JO 05.12.2011-28133), art. 4-6", es: "Regl. sobre movimientos no comerciales de mascotas (RG 05.12.2011-28133), art. 4-6", pt: "Reg. sobre a circulação não comercial de animais de estimação (RG 05.12.2011-28133), art. 4-6" }
  - item: { en: "Pet passport", fr: "Passeport pour animal", es: "Pasaporte para animal", pt: "Passaporte para animais" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Issued by an authorised vet; must confirm the rabies vaccination is valid and record the microchip, identity and any species-specific treatments.", fr: "Délivré par un vétérinaire habilité ; doit confirmer que la vaccination antirabique est valide et consigner la puce, l'identité et les traitements propres à l'espèce.", es: "Expedido por un veterinario autorizado; debe confirmar que la vacunación antirrábica es válida y registrar el microchip, la identidad y cualquier tratamiento propio de la especie.", pt: "Emitido por um veterinário autorizado; deve confirmar que a vacinação antirrábica está válida e registrar o microchip, a identidade e os eventuais tratamentos específicos da espécie." }
    exceptions: { en: "The passport accompanies the animal alongside the veterinary health certificate.", fr: "Le passeport accompagne l'animal aux côtés du certificat sanitaire vétérinaire.", es: "El pasaporte acompaña al animal junto con el certificado sanitario veterinario.", pt: "O passaporte acompanha o animal junto com o certificado veterinário de saúde." }
    ref: { en: "Reg. on non-commercial movement of pets (RG 05.12.2011-28133), art. 8", fr: "Règl. mouvements non commerciaux d'animaux (JO 05.12.2011-28133), art. 8", es: "Regl. sobre movimientos no comerciales de mascotas (RG 05.12.2011-28133), art. 8", pt: "Reg. sobre a circulação não comercial de animais de estimação (RG 05.12.2011-28133), art. 8" }
  - item: { en: "Veterinary health certificate (Origin & Health)", fr: "Certificat sanitaire vétérinaire (origine & santé)", es: "Certificado sanitario veterinario (origen y salud)", pt: "Certificado veterinário de saúde (origem e saúde)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Ministry model certificate, issued and endorsed by the official veterinary authority of the country of dispatch; a separate certificate is drawn up for each animal.", fr: "Certificat modèle du Ministère, établi et visé par l'autorité vétérinaire officielle du pays d'expédition ; un certificat distinct est établi pour chaque animal.", es: "Certificado según el modelo del Ministerio, expedido y refrendado por la autoridad veterinaria oficial del país de expedición; se emite un certificado independiente para cada animal.", pt: "Certificado no modelo do Ministério, emitido e endossado pela autoridade veterinária oficial do país de expedição; é feito um certificado separado para cada animal." }
    exceptions: { en: "Valid for 4 months after signature/endorsement, or until the rabies vaccination expires, whichever is earlier.", fr: "Valable 4 mois après signature/visa, ou jusqu'à l'expiration de la vaccination antirabique, selon la première échéance.", es: "Válido durante 4 meses tras la firma/refrendo, o hasta que caduque la vacunación antirrábica, lo que ocurra primero.", pt: "Válido por 4 meses depois da assinatura/endosso, ou até a vacinação antirrábica vencer, o que ocorrer primeiro." }
    ref: { en: "Reg. on non-commercial movement of pets (RG 05.12.2011-28133), art. 7, Annex EK-2", fr: "Règl. mouvements non commerciaux d'animaux (JO 05.12.2011-28133), art. 7, annexe EK-2", es: "Regl. sobre movimientos no comerciales de mascotas (RG 05.12.2011-28133), art. 7, anexo EK-2", pt: "Reg. sobre a circulação não comercial de animais de estimação (RG 05.12.2011-28133), art. 7, Anexo EK-2" }
  - item: { en: "Tick / tapeworm (Echinococcus) treatment", fr: "Traitement tiques / échinococcose", es: "Tratamiento contra garrapatas / tenia (Echinococcus)", pt: "Tratamento contra carrapatos / tênia (Echinococcus)" }
    required: { en: "Only when requested", fr: "Uniquement si demandé", es: "Solo si se solicita", pt: "Apenas quando solicitado" }
    when: { en: "The certificate has optional sections for a tick treatment and an Echinococcus treatment, completed only where required.", fr: "Le certificat comporte des sections facultatives pour un traitement anti-tiques et un traitement contre l'échinococcose, remplies uniquement si requis.", es: "El certificado tiene secciones opcionales para un tratamiento contra garrapatas y un tratamiento contra Echinococcus, que se rellenan solo cuando es necesario.", pt: "O certificado tem campos opcionais para um tratamento contra carrapatos e um tratamento contra Echinococcus, preenchidos apenas quando exigidos." }
    exceptions: { en: "Not a systematic requirement for standard passenger movements.", fr: "Non exigé systématiquement pour les mouvements ordinaires de voyageurs.", es: "No es un requisito sistemático para los movimientos ordinarios de viajeros.", pt: "Não é uma exigência sistemática nos deslocamentos comuns de passageiros." }
    ref: { en: "Reg. on non-commercial movement of pets (RG 05.12.2011-28133), Annex EK-2 (VI-VII)", fr: "Règl. mouvements non commerciaux d'animaux (JO 05.12.2011-28133), annexe EK-2 (VI-VII)", es: "Regl. sobre movimientos no comerciales de mascotas (RG 05.12.2011-28133), anexo EK-2 (VI-VII)", pt: "Reg. sobre a circulação não comercial de animais de estimação (RG 05.12.2011-28133), Anexo EK-2 (VI-VII)" }
  - item: { en: "Number of pets per traveller", fr: "Nombre d'animaux par voyageur", es: "Número de mascotas por viajero", pt: "Número de animais por viajante" }
    required: { en: "Maximum 2", fr: "Maximum 2", es: "Máximo 2", pt: "No máximo 2" }
    when: { en: "At most two accompanying pets may be brought (e.g. 2 cats, or 1 cat and 1 dog); documents are drawn up separately for each.", fr: "Deux animaux d'accompagnement maximum (ex. 2 chats, ou 1 chat et 1 chien) ; les documents sont établis séparément pour chacun.", es: "Se pueden llevar como máximo dos mascotas acompañantes (p. ej. 2 gatos, o 1 gato y 1 perro); los documentos se emiten por separado para cada una.", pt: "É possível levar no máximo dois animais de estimação acompanhados (por exemplo, 2 gatos, ou 1 gato e 1 cachorro); os documentos são feitos separadamente para cada um." }
    exceptions: { en: "More animals or a commercial consignment fall outside the passenger (non-commercial) scheme.", fr: "Un plus grand nombre d'animaux ou un envoi commercial sortent du régime voyageur (non commercial).", es: "Un número mayor de animales o un envío comercial quedan fuera del régimen de viajero (no comercial).", pt: "Mais animais do que isso, ou uma remessa comercial, ficam fora do regime de passageiros (não comercial)." }
    ref: { en: "Ministry of Agriculture and Forestry — entry conditions for cats/dogs", fr: "Ministère de l'Agriculture et des Forêts — conditions d'entrée chats/chiens", es: "Ministerio de Agricultura y Bosques — condiciones de entrada para gatos/perros", pt: "Ministério da Agricultura e Florestas — condições de entrada de gatos e cães" }
  - item: { en: "Customs declaration on arrival", fr: "Déclaration en douane à l'arrivée", es: "Declaración en aduanas a la llegada", pt: "Declaração aduaneira na chegada" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "On entry, present the pet passport, the original antibody-test result and the veterinary health certificate to Turkish Customs / the veterinary border service.", fr: "À l'entrée, présente le passeport, l'original du résultat de titrage et le certificat sanitaire vétérinaire à la douane turque / au service vétérinaire frontalier.", es: "A la entrada, presenta el pasaporte, el resultado original de la prueba de titulación y el certificado sanitario veterinario a la aduana turca / al servicio veterinario fronterizo.", pt: "Na entrada, apresente o passaporte do animal, o resultado original do teste sorológico e o certificado veterinário de saúde à alfândega turca / ao serviço veterinário de fronteira." }
    exceptions: { en: "If documents are incomplete, the pet may be refused, quarantined or returned at the owner's expense.", fr: "Si les documents sont incomplets, l'animal peut être refusé, mis en quarantaine ou réexpédié aux frais du propriétaire.", es: "Si los documentos están incompletos, la mascota puede ser rechazada, puesta en cuarentena o devuelta a cargo del propietario.", pt: "Se os documentos estiverem incompletos, o animal pode ser recusado, colocado em quarentena ou devolvido às custas do dono." }
    ref: { en: "Ministry of Trade (Customs) — animals brought by passengers", fr: "Ministère du Commerce (Douane) — animaux amenés par les voyageurs", es: "Ministerio de Comercio (Aduana) — animales traídos por los viajeros", pt: "Ministério do Comércio (Alfândega) — animais trazidos pelos viajantes" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Unvaccinated cats, dogs and ferrets under 3 months may be admitted only subject to the health conditions set by the Ministry, judged on the rabies situation of the origin country.", fr: "Les chats, chiens et furets non vaccinés de moins de 3 mois ne peuvent être admis que sous réserve des conditions sanitaires fixées par le Ministère, appréciées selon la situation rabique du pays d'origine.", es: "Los gatos, perros y hurones no vacunados de menos de 3 meses solo pueden ser admitidos con sujeción a las condiciones sanitarias establecidas por el Ministerio, evaluadas según la situación de rabia del país de origen.", pt: "Gatos, cachorros e furões não vacinados com menos de 3 meses só podem ser admitidos mediante as condições sanitárias definidas pelo Ministério, avaliadas conforme a situação da raiva no país de origem." }
    exceptions: { en: "In practice a dog cannot complete the rabies-vaccination and titre timeline before roughly 7 months of age.", fr: "En pratique, un chien ne peut achever le calendrier vaccination-titrage avant environ 7 mois.", es: "En la práctica, un perro no puede completar el calendario de vacunación y titulación antes de unos 7 meses de edad.", pt: "Na prática, um cachorro não consegue cumprir o calendário de vacinação antirrábica e titulação antes de mais ou menos 7 meses de idade." }
    ref: { en: "Reg. on non-commercial movement of pets (RG 05.12.2011-28133), art. 9", fr: "Règl. mouvements non commerciaux d'animaux (JO 05.12.2011-28133), art. 9", es: "Regl. sobre movimientos no comerciales de mascotas (RG 05.12.2011-28133), art. 9", pt: "Reg. sobre a circulação não comercial de animais de estimação (RG 05.12.2011-28133), art. 9" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not required", fr: "Non requise", es: "No obligatoria", pt: "Não obrigatório" }
    when: { en: "No import quarantine for a compliant pet travelling with its owner.", fr: "Aucune quarantaine à l'import pour un animal conforme voyageant avec son propriétaire.", es: "Sin cuarentena de importación para una mascota que cumple los requisitos y viaja con su propietario.", pt: "Não há quarentena de importação para um animal em conformidade que viaja com o dono." }
    exceptions: { en: "Only if rules are breached — customs may then order quarantine, return or refusal.", fr: "Uniquement en cas de non-conformité — la douane peut alors ordonner quarantaine, réexpédition ou refus.", es: "Solo en caso de incumplimiento — la aduana puede entonces ordenar cuarentena, devolución o denegación.", pt: "Só se as regras forem descumpridas — a alfândega pode então determinar quarentena, devolução ou recusa." }
    ref: { en: "Ministry of Trade (Customs) — animals brought by passengers", fr: "Ministère du Commerce (Douane) — animaux amenés par les voyageurs", es: "Ministerio de Comercio (Aduana) — animales traídos por los viajeros", pt: "Ministério do Comércio (Alfândega) — animais trazidos pelos viajantes" }

origin:
  scheme: own
  eu:
    from: any
    title: { en: "Antibody test already documented — no new test", fr: "Titre déjà attesté — pas de nouveau test", es: "Prueba de titulación ya documentada — sin nueva prueba", pt: "Teste sorológico já documentado — sem novo teste" }
    body:
      en: "A dog whose passport already documents an acceptable rabies antibody test (≥0.5 IU/ml) and a regular, unbroken vaccination record is not re-tested. You still need the ISO microchip, an in-date rabies vaccination and an official veterinary health certificate from the country of dispatch, plus the passport. This is the fastest path."
      fr: "Un chien dont le passeport atteste déjà un titre antirabique acceptable (≥0,5 UI/ml) et une vaccination régulière et ininterrompue n'est pas retesté. Il faut tout de même la puce ISO, une vaccination antirabique à jour et un certificat sanitaire vétérinaire officiel du pays d'expédition, ainsi que le passeport. C'est le parcours le plus rapide."
      es: "Un perro cuyo pasaporte ya documenta una prueba de titulación de rabia aceptable (≥0,5 UI/ml) y un registro de vacunación regular e ininterrumpido no se vuelve a analizar. Aun así necesitas el microchip ISO, una vacunación antirrábica en vigor y un certificado sanitario veterinario oficial del país de expedición, además del pasaporte. Este es el camino más rápido."
      pt: "Um cachorro cujo passaporte já documenta um teste sorológico antirrábico aceitável (≥0,5 UI/ml) e um histórico de vacinação regular e sem interrupções não é testado de novo. Você ainda precisa do microchip ISO, da vacinação antirrábica dentro da validade e de um certificado veterinário de saúde oficial do país de expedição, além do passaporte. Este é o caminho mais rápido."
    cls: ok
  listed:
    title: { en: "Turkey-origin dog returning home", fr: "Chien d'origine turque de retour", es: "Perro de origen turco que regresa a casa", pt: "Cachorro de origem turca voltando para casa" }
    body:
      en: "A Turkey-origin pet that travelled abroad and comes back is exempt from the compulsory 3-month wait if it holds an acceptable antibody test result obtained before it left Turkey. Microchip, valid rabies vaccination, veterinary health certificate and passport are still required, and you present all documents to customs on arrival."
      fr: "Un animal d'origine turque parti à l'étranger et qui revient est dispensé du délai obligatoire de 3 mois s'il détient un résultat de titrage acceptable obtenu avant son départ de Turquie. Puce, vaccination antirabique valide, certificat sanitaire vétérinaire et passeport restent exigés, et tu présente tous les documents à la douane à l'arrivée."
      es: "Una mascota de origen turco que viajó al extranjero y regresa está exenta de la espera obligatoria de 3 meses si tiene un resultado de prueba de titulación aceptable obtenido antes de salir de Turquía. Siguen siendo obligatorios el microchip, una vacunación antirrábica válida, el certificado sanitario veterinario y el pasaporte, y presentas todos los documentos a la aduana a la llegada."
      pt: "Um animal de origem turca que viajou para o exterior e volta fica dispensado da espera obrigatória de 3 meses se tiver um resultado de teste sorológico aceitável obtido antes de sair da Turquia. Microchip, vacinação antirrábica válida, certificado veterinário de saúde e passaporte continuam obrigatórios, e você apresenta todos os documentos à alfândega na chegada."
    cls: warn
  nonListed:
    title: { en: "First-time antibody test + 3-month wait", fr: "Premier titrage + 3 mois d'attente", es: "Primera prueba de titulación + espera de 3 meses", pt: "Primeiro teste sorológico + 3 meses de espera" }
    body:
      en: "A dog that has never been antibody-tested follows the longest path: after the rabies vaccination, blood is drawn at least 30 days later and tested in an EU-approved laboratory (result ≥0.5 IU/ml), then a compulsory 3-month wait runs from the blood-draw date before the dog may enter. A microchip, an endorsed veterinary health certificate and the passport are also required."
      fr: "Un chien jamais titré suit le parcours le plus long : après la vaccination antirabique, le sang est prélevé au moins 30 jours plus tard et analysé dans un laboratoire agréé UE (résultat ≥0,5 UI/ml), puis un délai obligatoire de 3 mois court à compter du prélèvement avant l'entrée. Une puce, un certificat sanitaire vétérinaire visé et le passeport sont également exigés."
      es: "Un perro que nunca ha pasado una prueba de titulación sigue el camino más largo: tras la vacunación antirrábica, la sangre se extrae al menos 30 días después y se analiza en un laboratorio autorizado por la UE (resultado ≥0,5 UI/ml), y luego corre una espera obligatoria de 3 meses desde la fecha de extracción antes de que el perro pueda entrar. También se exigen un microchip, un certificado sanitario veterinario refrendado y el pasaporte."
      pt: "Um cachorro que nunca fez teste sorológico segue o caminho mais longo: depois da vacinação antirrábica, o sangue é coletado no mínimo 30 dias mais tarde e analisado em um laboratório aprovado pela UE (resultado ≥0,5 UI/ml); em seguida corre uma espera obrigatória de 3 meses, contada da data da coleta, antes de o cachorro poder entrar. Microchip, certificado veterinário de saúde endossado e passaporte também são obrigatórios."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Turkey depends on its documents and breed."
    fr: "Ce qui se passe à l'arrivée de ton chien en Turquie dépend de ses documents et de sa race."
    es: "Lo que ocurre cuando tu perro llega a Turquía depende de sus documentos y de su raza."
    pt: "O que acontece quando seu cachorro chega à Turquia depende dos documentos e da raça dele."
  points:
    - en: "Declare the pet to Turkish Customs and the veterinary border service, presenting the passport, the original antibody-test result and the veterinary health certificate."
      fr: "Déclare l'animal à la douane turque et au service vétérinaire frontalier, en présentant le passeport, l'original du résultat de titrage et le certificat sanitaire vétérinaire."
      es: "Declara la mascota a la aduana turca y al servicio veterinario fronterizo, presentando el pasaporte, el resultado original de la prueba de titulación y el certificado sanitario veterinario."
      pt: "Declare o animal à alfândega turca e ao serviço veterinário de fronteira, apresentando o passaporte, o resultado original do teste sorológico e o certificado veterinário de saúde."
    - en: "A separate set of documents must be shown for each animal; at most two pets may be brought per traveller."
      fr: "Un jeu de documents distinct doit être présenté pour chaque animal ; deux animaux maximum par voyageur."
      es: "Debe presentarse un juego de documentos independiente para cada animal; se pueden llevar como máximo dos mascotas por viajero."
      pt: "É preciso mostrar um conjunto separado de documentos para cada animal; no máximo dois animais de estimação podem ser levados por viajante."
    - en: "Officers verify the microchip (or tattoo) against the documents; the owner must be able to provide a reader for a non-standard chip."
      fr: "Les agents vérifient la puce (ou le tatouage) par rapport aux documents ; le propriétaire doit pouvoir fournir un lecteur pour une puce non normalisée."
      es: "Los agentes verifican el microchip (o el tatuaje) frente a los documentos; el propietario debe poder proporcionar un lector para un chip no estándar."
      pt: "Os agentes conferem o microchip (ou a tatuagem) com os documentos; o dono precisa poder fornecer um leitor se o chip não for padrão."
    - en: "Carry original documents, not copies; an official translation is advisable where they are not in Turkish or English."
      fr: "Munis-toi des documents originaux, pas de copies ; une traduction officielle est conseillée s'ils ne sont ni en turc ni en anglais."
      es: "Lleva los documentos originales, no copias; se recomienda una traducción oficial cuando no estén en turco ni en inglés."
      pt: "Leve os documentos originais, não cópias; uma tradução oficial é recomendável quando eles não estiverem em turco ou inglês."
    - en: "If documents are missing or invalid, customs may order quarantine, return or refusal of entry at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, la douane peut ordonner quarantaine, réexpédition ou refus d'entrée aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, la aduana puede ordenar cuarentena, devolución o denegación de entrada a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, a alfândega pode determinar quarentena, devolução ou recusa de entrada às custas do dono."
    - en: "Banned breeds (Pit Bull Terrier, Japanese Tosa, Dogo Argentino, Fila Brasileiro) are refused entry."
      fr: "Les races interdites (Pit Bull Terrier, Tosa japonais, Dogo Argentino, Fila Brasileiro) sont refusées à l'entrée."
      es: "Las razas prohibidas (Pit Bull Terrier, Tosa japonés, Dogo Argentino, Fila Brasileiro) tienen la entrada denegada."
      pt: "Raças proibidas (Pit Bull Terrier, Tosa Japonês, Dogo Argentino, Fila Brasileiro) têm a entrada recusada."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Turkey bans certain dogs as 'dangerous animals' under Law No. 5199 on the Protection of Animals, amended by Law No. 7332 (14 July 2021) and Circular No. 2021-48 (in force 7 December 2021). Bringing these breeds into the country is prohibited."
    fr: "La Turquie interdit certains chiens comme « animaux dangereux » au titre de la loi n° 5199 sur la protection des animaux, modifiée par la loi n° 7332 (14 juillet 2021) et la circulaire n° 2021-48 (en vigueur le 7 décembre 2021). L'entrée de ces races dans le pays est interdite."
    es: "Turquía prohíbe ciertos perros como «animales peligrosos» en virtud de la Ley n.º 5199 sobre la Protección de los Animales, modificada por la Ley n.º 7332 (14 de julio de 2021) y la Circular n.º 2021-48 (en vigor el 7 de diciembre de 2021). Está prohibido introducir estas razas en el país."
    pt: "A Turquia proíbe certos cachorros como “animais perigosos” pela Lei nº 5199 de Proteção dos Animais, alterada pela Lei nº 7332 (14 de julho de 2021) e pela Circular nº 2021-48 (em vigor desde 7 de dezembro de 2021). Levar essas raças para dentro do país é proibido."
  cat1:
    en: "Prohibited breeds: American Pit Bull Terrier, Japanese Tosa, Dogo Argentino and Fila Brasileiro. Under Article 14(l) of Law No. 5199 it is forbidden to breed, own, shelter, exchange, exhibit, gift these dogs and to bring them into the country, sell or advertise them — so their import/entry is banned. The American Staffordshire Terrier and American Bully were later added to the dangerous-breed list."
    fr: "Races interdites : American Pit Bull Terrier, Tosa japonais, Dogo Argentino et Fila Brasileiro. Selon l'article 14(l) de la loi n° 5199, il est interdit d'élever, de détenir, d'héberger, d'échanger, d'exposer, d'offrir ces chiens et de les faire entrer dans le pays, de les vendre ou d'en faire la publicité — leur importation/entrée est donc interdite. L'American Staffordshire Terrier et l'American Bully ont ensuite été ajoutés à la liste des races dangereuses."
    es: "Razas prohibidas: American Pit Bull Terrier, Tosa japonés, Dogo Argentino y Fila Brasileiro. Según el artículo 14(l) de la Ley n.º 5199, está prohibido criar, poseer, albergar, intercambiar, exhibir y regalar estos perros, así como introducirlos en el país, venderlos o anunciarlos — por lo que su importación/entrada está prohibida. El American Staffordshire Terrier y el American Bully se añadieron después a la lista de razas peligrosas."
    pt: "Raças proibidas: American Pit Bull Terrier, Tosa Japonês, Dogo Argentino e Fila Brasileiro. Pelo Artigo 14(l) da Lei nº 5199, é proibido criar, ter, abrigar, trocar, exibir e presentear esses cachorros, além de trazê-los para o país, vendê-los ou anunciá-los — ou seja, sua importação/entrada é proibida. O American Staffordshire Terrier e o American Bully foram acrescentados depois à lista de raças perigosas."
  cat2:
    en: "Transitional regime: dogs of these breeds already owned before 14 July 2021 could be kept only if neutered and registered (microchipped, entered in the PETVET system) by 14 January 2022. Such dogs may not be walked without their registration document, a muzzle and a lead, and are barred from crowded places, playgrounds and parks; breaches carry administrative fines and seizure."
    fr: "Régime transitoire : les chiens de ces races déjà détenus avant le 14 juillet 2021 ne pouvaient être conservés que s'ils étaient stérilisés et enregistrés (pucés, inscrits au système PETVET) avant le 14 janvier 2022. Ces chiens ne peuvent circuler sans leur document d'enregistrement, une muselière et une laisse, et sont interdits dans les lieux bondés, les aires de jeux et les parcs ; les infractions entraînent des amendes administratives et la saisie."
    es: "Régimen transitorio: los perros de estas razas que ya se poseían antes del 14 de julio de 2021 solo podían conservarse si estaban esterilizados y registrados (con microchip, inscritos en el sistema PETVET) antes del 14 de enero de 2022. Estos perros no pueden pasearse sin su documento de registro, un bozal y una correa, y tienen prohibido el acceso a lugares concurridos, zonas de juego y parques; las infracciones conllevan multas administrativas e incautación."
    pt: "Regime de transição: cachorros dessas raças que já pertenciam a alguém antes de 14 de julho de 2021 só podiam ser mantidos se fossem castrados e registrados (com microchip, cadastrados no sistema PETVET) até 14 de janeiro de 2022. Esses cachorros não podem passear sem o documento de registro, focinheira e guia, e estão proibidos em locais de grande movimento, playgrounds e parques; o descumprimento leva a multas administrativas e apreensão."
  note:
    en: "The transitional regime applies only to dogs already owned in Turkey before the ban — it does not open any route to import a banned breed. Only the official law and circular are authoritative; confirm your dog's breed status before you travel."
    fr: "Le régime transitoire ne concerne que les chiens déjà détenus en Turquie avant l'interdiction — il n'ouvre aucune voie pour importer une race interdite. Seuls la loi et la circulaire officielles font foi ; confirme le statut de race de ton chien avant de voyager."
    es: "El régimen transitorio se aplica únicamente a los perros que ya se poseían en Turquía antes de la prohibición — no abre ninguna vía para importar una raza prohibida. Solo la ley y la circular oficiales tienen valor legal; confirma el estado de raza de tu perro antes de viajar."
    pt: "O regime de transição vale apenas para cachorros que já pertenciam a alguém na Turquia antes da proibição — ele não abre nenhuma via para importar uma raça proibida. Só a lei e a circular oficiais fazem fé; confirme a situação da raça do seu cachorro antes de viajar."

checklist:
  - en: "ISO 11784/11785 microchip implanted before the rabies vaccination"
    fr: "Puce ISO 11784/11785 posée avant la vaccination antirabique"
    es: "Microchip ISO 11784/11785 implantado antes de la vacunación antirrábica"
    pt: "Microchip ISO 11784/11785 implantado antes da vacinação antirrábica"
  - en: "Valid rabies vaccination (inactivated or recombinant, WOAH-listed)"
    fr: "Vaccination antirabique valide (inactivée ou recombinante, listée WOAH)"
    es: "Vacunación antirrábica válida (inactivada o recombinante, listada por la WOAH)"
    pt: "Vacinação antirrábica válida (inativada ou recombinante, listada pela WOAH)"
  - en: "Rabies antibody test ≥0.5 IU/ml — blood ≥30 days after the shot, then a 3-month wait"
    fr: "Titrage antirabique ≥0,5 UI/ml — sang ≥30 jours après le vaccin, puis 3 mois d'attente"
    es: "Prueba de titulación de rabia ≥0,5 UI/ml — sangre ≥30 días después de la vacuna, y luego una espera de 3 meses"
    pt: "Teste sorológico antirrábico ≥0,5 UI/ml — sangue coletado ≥30 dias depois da dose e, em seguida, 3 meses de espera"
  - en: "Original antibody-test result to show at the border"
    fr: "Original du résultat de titrage à présenter à la frontière"
    es: "Resultado original de la prueba de titulación para presentar en la frontera"
    pt: "Resultado original do teste sorológico para apresentar na fronteira"
  - en: "Official veterinary health certificate (Ministry model) endorsed in the country of dispatch"
    fr: "Certificat sanitaire vétérinaire officiel (modèle du Ministère) visé dans le pays d'expédition"
    es: "Certificado sanitario veterinario oficial (modelo del Ministerio) refrendado en el país de expedición"
    pt: "Certificado veterinário de saúde oficial (modelo do Ministério) endossado no país de expedição"
  - en: "Pet passport confirming the vaccination and identity"
    fr: "Passeport confirmant la vaccination et l'identité"
    es: "Pasaporte que confirme la vacunación y la identidad"
    pt: "Passaporte que confirme a vacinação e a identidade"
  - en: "Separate documents for each animal (max 2 pets per traveller)"
    fr: "Documents distincts pour chaque animal (2 animaux maximum par voyageur)"
    es: "Documentos independientes para cada animal (máximo 2 mascotas por viajero)"
    pt: "Documentos separados para cada animal (máximo de 2 animais por viajante)"
  - en: "Confirm your dog is not a banned breed (Pit Bull, Tosa, Dogo Argentino, Fila Brasileiro)"
    fr: "Vérifie que ton chien n'est pas d'une race interdite (Pit Bull, Tosa, Dogo Argentino, Fila Brasileiro)"
    es: "Confirma que tu perro no es de una raza prohibida (Pit Bull, Tosa, Dogo Argentino, Fila Brasileiro)"
    pt: "Confirme que seu cachorro não é de uma raça proibida (Pit Bull, Tosa, Dogo Argentino, Fila Brasileiro)"

