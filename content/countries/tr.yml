# Country Entry Guide — Turkey / Türkiye (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_tr
iso2: "TR"
name: { en: "Turkey", fr: "Turquie", es: "Turquía", pt: "Turquia" }
region: { en: "Asia", fr: "Asie", es: "Asia", pt: "Ásia" }


regime: non_listed
domestic:
  intro:
    en: "Domestic flight in Turkey: the pet passport is compulsory even inside the country — but no health certificate is needed."
    fr: "Vol intérieur en Turquie : le passeport pour animal est obligatoire même à l'intérieur du pays — mais aucun certificat sanitaire n'est requis."
    es: "Vuelo nacional en Turquía: el pasaporte para mascotas es obligatorio incluso dentro del país — pero no se exige certificado sanitario."
    pt: "Voo doméstico na Turquia: o passaporte do animal é obrigatório mesmo dentro do país — mas não é preciso atestado de saúde."
  points:
    - en: "Carrying the pet passport is compulsory for domestic movements of dogs, cats and ferrets. It is issued by an authorised vet or the provincial agriculture directorate."
      fr: "Le port du passeport pour animal est obligatoire pour les mouvements intérieurs de chiens, chats et furets. Il est délivré par un vétérinaire agréé ou la direction provinciale de l'agriculture."
      es: "Llevar el pasaporte de mascota es obligatorio para los movimientos nacionales de perros, gatos y hurones. Lo emite un veterinario autorizado o la dirección provincial de agricultura."
      pt: "Levar o passaporte do animal é obrigatório nos deslocamentos internos de cachorros, gatos e furões. Ele é emitido por um veterinário autorizado ou pela diretoria provincial de agricultura."
    - en: "Conversely, non-commercial pets are expressly exempt from the veterinary health report. Rabies vaccination is compulsory annually from 3 months, and an ISO microchip is mandatory — both as general ownership duties."
      fr: "À l'inverse, les animaux de compagnie non commerciaux sont expressément dispensés du rapport sanitaire vétérinaire. La vaccination antirabique est obligatoire chaque année dès 3 mois, et la puce ISO est obligatoire — l'une et l'autre au titre des obligations générales du détenteur."
      es: "En cambio, las mascotas no comerciales están expresamente exentas del informe sanitario veterinario. La vacuna antirrábica es obligatoria anualmente desde los 3 meses, y el microchip ISO es obligatorio — ambas como obligaciones generales del propietario."
      pt: "Em compensação, os animais de estimação em circulação não comercial estão expressamente dispensados do relatório veterinário de saúde. A vacinação antirrábica é obrigatória todo ano a partir dos 3 meses, e o microchip ISO é obrigatório — os dois como deveres gerais de quem tem o animal."
    - en: "Whatever the airline asks for (health certificate, vaccination record, breed or crate rules) is its own commercial policy, not a legal requirement — check with your carrier."
      fr: "Ce que la compagnie demande (certificat de santé, carnet de vaccination, règles de race ou de caisse) relève de sa politique commerciale, pas d'une obligation légale — vérifie auprès d'elle."
      es: "Lo que pida la aerolínea (certificado de salud, cartilla de vacunación, reglas de raza o jaula) es su política comercial, no una obligación legal — consúltalo con ella."
      pt: "Tudo o que a companhia aérea pedir (atestado de saúde, carteira de vacinação, regras de raça ou de caixa de transporte) é política comercial dela, não exigência legal — confirme com a sua companhia."
exit:
  authority: Tarım ve Orman Bakanlığı
  authorityUrl: https://www.tarimorman.gov.tr
  intro:
    en: "Turkey is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus a government-issued veterinary health certificate."
    fr: "La Turquie est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire vétérinaire délivré par l'administration."
    es: "Turquía no está listada: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario veterinario emitido por la administración."
    pt: "A Turquia é um país não listado, então um teste sorológico antirrábico válido é obrigatório para voltar à UE — além de um certificado veterinário de saúde emitido pelo governo."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "Since 2024 the export health certificate is issued by the District Agriculture and Forestry Directorate of your place of residence (a government vet, not a private one) — apply in person with the dog and documents."
        fr: "Depuis 2024, le certificat sanitaire d'export est délivré par la Direction de district de l'Agriculture et des Forêts de ton lieu de résidence (un vétérinaire officiel, pas privé) — présente-toi en personne avec le chien et les documents."
        es: "Desde 2024 el certificado sanitario de exportación lo emite la Dirección de Distrito de Agricultura y Bosques de tu lugar de residencia (un veterinario oficial, no privado) — preséntate en persona con el perro y los documentos."
        pt: "Desde 2024, o certificado sanitário de exportação é emitido pela Diretoria Distrital de Agricultura e Florestas do seu local de residência (um veterinário do governo, não um particular) — o pedido é feito presencialmente, com o cachorro e os documentos."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Turkey with your dog", fr: "Voyager en Turquie avec ton chien", es: "Viajar a Turquía con tu perro", pt: "Viajar para a Turquia com seu cachorro" }
  intro:
    en: >-
      Turkey (officially Türkiye) is not part of the EU: it applies its own scheme through the Ministry of Agriculture and
      Forestry (Tarım ve Orman Bakanlığı) and Turkish Customs (Ticaret Bakanlığı). A traveller may bring
      up to two pets for personal, non-commercial use. Every dog needs an ISO microchip, a valid rabies
      vaccination, a rabies antibody (titration) test and an official veterinary health certificate from
      the country of dispatch. Because the antibody test is followed by a compulsory three-month wait, what
      you prepare depends heavily on your dog's origin and vaccination history — a dog that already holds
      a passport documenting an acceptable antibody test is not re-tested. Four dog breeds are banned from entering
      the country. This guide explains each path so you know exactly what to organise before you fly.
    fr: >-
      La Turquie ne fait pas partie de l'UE : elle applique son propre régime via le ministère de
      l'Agriculture et des Forêts (Tarım ve Orman Bakanlığı) et la douane turque (Ticaret Bakanlığı). Un
      voyageur peut amener jusqu'à deux animaux à titre personnel et non commercial. Chaque chien doit avoir
      une puce ISO, une vaccination antirabique valide, un test de titrage des anticorps antirabiques et un
      certificat vétérinaire officiel du pays d'expédition. Comme le titrage est suivi d'un délai obligatoire
      de trois mois, ce qu'il faut préparer dépend fortement de l'origine et de l'historique vaccinal du chien
      — un chien dont le passeport atteste déjà un titre acceptable n'est pas retesté. Quatre races de chiens
      sont interdites d'entrée. Ce guide détaille chaque cas pour savoir quoi préparer avant de réserver.
    es: >-
      Turquía (oficialmente Türkiye) no forma parte de la UE: aplica su propio régimen a través del Ministerio de Agricultura y
      Bosques (Tarım ve Orman Bakanlığı) y la aduana turca (Ticaret Bakanlığı). Un viajero puede llevar
      hasta dos mascotas para uso personal y no comercial. Todo perro necesita un microchip ISO, una
      vacunación antirrábica válida, una prueba de titulación de anticuerpos contra la rabia y un
      certificado sanitario veterinario oficial del país de expedición. Como la prueba de titulación va
      seguida de una espera obligatoria de tres meses, lo que debes preparar depende en gran medida del
      origen de tu perro y de su historial de vacunación — un perro que ya tiene un pasaporte que documenta
      una prueba de titulación aceptable no se vuelve a analizar. Cuatro razas de perros tienen prohibida
      la entrada al país. Esta guía explica cada caso para que sepas exactamente qué preparar antes de volar.

    pt: "A Turquia (oficialmente Türkiye) não faz parte da UE: ela aplica o próprio esquema por meio do Ministério da Agricultura e Florestas (Tarım ve Orman Bakanlığı) e da alfândega turca (Ticaret Bakanlığı). Cada viajante pode levar até dois animais de estimação para uso pessoal, não comercial. Todo cachorro precisa de microchip ISO, vacinação antirrábica válida, teste sorológico antirrábico (titulação) e certificado veterinário de saúde oficial do país de expedição. Como o teste sorológico é seguido de uma espera obrigatória de três meses, o que você precisa preparar depende muito da origem e do histórico de vacinação do seu cachorro — um cachorro que já tem um passaporte documentando um teste sorológico aceitável não é testado de novo. Quatro raças de cachorro são proibidas de entrar no país. Este guia explica cada caminho para você saber exatamente o que organizar antes de voar."
difficulty:
  level: moderate
  label: { en: "Moderate (antibody test + 3-month wait)", fr: "Modéré (titrage + 3 mois d'attente)", es: "Moderada (prueba de titulación + espera de 3 meses)", pt: "Moderada (teste sorológico + 3 meses de espera)" }

prepTime:
  eu:
    en: "Dog already holding a passport that documents an acceptable rabies antibody test with regular vaccination: a few weeks — no new blood test, just the veterinary health certificate."
    fr: "Chien disposant déjà d'un passeport attestant un titre antirabique acceptable avec vaccination régulière : quelques semaines — pas de nouvelle prise de sang, seulement le certificat sanitaire."
    es: "Perro que ya dispone de un pasaporte que documenta una prueba de titulación de rabia aceptable con vacunación regular: unas semanas — sin nueva prueba de sangre, solo el certificado sanitario."
    pt: "Cachorro que já tem um passaporte documentando um teste sorológico antirrábico aceitável e vacinação em dia: algumas semanas — sem nova coleta de sangue, apenas o certificado veterinário de saúde."
  listed:
    en: "Turkey-origin dog returning home with an antibody test taken before it left: the compulsory 3-month wait is waived — a few weeks to arrange the certificate."
    fr: "Chien d'origine turque qui revient avec un titrage effectué avant son départ : le délai obligatoire de 3 mois est levé — quelques semaines pour préparer le certificat."
    es: "Perro de origen turco que regresa a casa con una prueba de titulación realizada antes de salir: se exime la espera obligatoria de 3 meses — unas semanas para preparar el certificado."
    pt: "Cachorro de origem turca voltando para casa com um teste sorológico feito antes de sair: a espera obrigatória de 3 meses é dispensada — algumas semanas para providenciar o certificado."
  nonListed:
    en: "First-time antibody test: about 4 months — blood drawn at least 30 days after rabies vaccination, then a compulsory 3-month wait before entry."
    fr: "Premier titrage : environ 4 mois — sang prélevé au moins 30 jours après le vaccin antirabique, puis délai obligatoire de 3 mois avant l'entrée."
    es: "Primera prueba de titulación: unos 4 meses — sangre extraída al menos 30 días después de la vacunación antirrábica, y luego una espera obligatoria de 3 meses antes de la entrada."
    pt: "Primeiro teste sorológico: cerca de 4 meses — sangue coletado no mínimo 30 dias depois da vacinação antirrábica e, em seguida, 3 meses obrigatórios de espera antes da entrada."

