regime: non_listed
exit:
  authority: AQD
  authorityUrl: https://psw.gov.pk/aqd
  intro:
    en: "Pakistan is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Animal Quarantine Department (AQD)."
    fr: "Le Pakistan est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par l'Animal Quarantine Department (AQD)."
    es: "Pakistán no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el Animal Quarantine Department (AQD)."
    pt: "O Paquistão não é um país listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pelo Animal Quarantine Department (AQD)."
  steps:
    - timing: longlead
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      text:
        en: "The AQD issues/endorses the export health certificate through inspection and quarantine (processed via the Pakistan Single Window), around 7 days before travel."
        fr: "L'AQD délivre/vise le certificat sanitaire d'export via inspection et quarantaine (traité par le Pakistan Single Window), environ 7 jours avant le voyage."
        es: "El AQD emite/refrenda el certificado sanitario de exportación mediante inspección y cuarentena (a través del Pakistan Single Window), unos 7 días antes del viaje."
        pt: "O AQD emite/endossa o atestado de saúde de exportação por meio de inspeção e quarentena (processado pelo Pakistan Single Window), cerca de 7 dias antes da viagem."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Pakistan with your dog", fr: "Voyager au Pakistan avec ton chien", es: "Viajar a Pakistán con tu perro", pt: "Viajar para o Paquistão com seu cachorro" }
  intro:
    en: >-
      Pakistan admits pet dogs, but it runs its own national scheme — not the EU framework —
      under the Pakistan Animal Quarantine (Import and Export of Animals and Animal Products)
      Ordinance, 1979 and its 1980 Rules. The Animal Quarantine Department (AQD), an attached
      department of the Ministry of National Food Security & Research, inspects and clears
      animals at its stations and at the port of entry. In practice, the only officially
      published document that lists exactly what Pakistan wants for a pet dog is the government
      veterinary health certificate: it records a rabies vaccination, requires that the dog be
      inspected and free of infectious disease, and states the dog comes from an area not
      quarantined for rabies. Pakistan does not require a rabies antibody test. Several details
      — a pet-specific advance import permit, exact vaccination timing, a minimum age and any
      quarantine — are not published by the authorities, so you must confirm them directly with
      AQD and your veterinarian before you book.
    fr: >-
      Le Pakistan admet les chiens de compagnie, mais il applique son propre régime — et non le
      cadre européen — au titre de la Pakistan Animal Quarantine (Import and Export of Animals
      and Animal Products) Ordinance de 1979 et de ses règles de 1980. L'Animal Quarantine
      Department (AQD), département rattaché au ministère de la Sécurité alimentaire nationale et
      de la Recherche, inspecte et dédouane les animaux dans ses stations et au point d'entrée.
      En pratique, le seul document officiellement publié qui détaille ce que le Pakistan exige
      pour un chien de compagnie est le certificat vétérinaire gouvernemental : il consigne une
      vaccination antirabique, impose que le chien soit inspecté et exempt de maladie
      infectieuse, et atteste que le chien provient d'une zone non placée en quarantaine
      antirabique. Le Pakistan n'exige pas de titrage antirabique. Plusieurs points — un permis
      d'importation préalable propre aux animaux de compagnie, le calendrier vaccinal exact, un
      âge minimum et une éventuelle quarantaine — ne sont pas publiés par les autorités : tu
      devez donc les confirmer directement auprès de l'AQD et de ton vétérinaire avant de
      réserver.
    es: >-
      Pakistán admite perros de compañía, pero aplica su propio régimen nacional — no el marco de
      la UE — en virtud de la Pakistan Animal Quarantine (Import and Export of Animals and Animal
      Products) Ordinance de 1979 y sus Rules de 1980. El Animal Quarantine Department (AQD),
      departamento adscrito al Ministerio de Seguridad Alimentaria Nacional e Investigación,
      inspecciona y despacha a los animales en sus estaciones y en el punto de entrada. En la
      práctica, el único documento publicado oficialmente que detalla exactamente lo que Pakistán
      exige para un perro de compañía es el certificado sanitario veterinario gubernamental:
      registra una vacunación antirrábica, exige que el perro sea inspeccionado y esté libre de
      enfermedad infecciosa, y declara que el perro procede de una zona no sometida a cuarentena
      por rabia. Pakistán no exige una prueba de titulación de rabia. Varios detalles — un permiso
      de importación previo específico para mascotas, el calendario de vacunación exacto, una edad
      mínima y una posible cuarentena — no son publicados por las autoridades, así que debes
      confirmarlos directamente con el AQD y tu veterinario antes de reservar.

    pt: "O Paquistão admite cachorros de estimação, mas aplica o próprio sistema nacional — e não o regime da UE — segundo o Pakistan Animal Quarantine (Import and Export of Animals and Animal Products) Ordinance, 1979, e seu regulamento de 1980. O Animal Quarantine Department (AQD), um departamento vinculado ao Ministry of National Food Security & Research, inspeciona e libera os animais em seus postos e no ponto de entrada. Na prática, o único documento oficialmente publicado que lista exatamente o que o Paquistão exige para um cachorro de estimação é o atestado de saúde veterinário oficial: ele registra a vacinação antirrábica, exige que o cachorro seja inspecionado e esteja livre de doença infecciosa, e declara que o cachorro vem de uma área não colocada em quarentena por raiva. O Paquistão não exige teste sorológico antirrábico. Vários detalhes — uma autorização de importação prévia específica para animais de estimação, o prazo exato da vacinação, uma idade mínima e uma eventual quarentena — não são publicados pelas autoridades, portanto você deve confirmá-los diretamente com o AQD e o seu veterinário antes de reservar."
difficulty:
  level: moderate
  label: { en: "Moderate — light on the official certificate, but several rules are unpublished and must be confirmed with AQD", fr: "Modéré — allégé sur le certificat officiel, mais plusieurs règles ne sont pas publiées et doivent être confirmées auprès de l'AQD", es: "Moderado — ligero en cuanto al certificado oficial, pero varias normas no están publicadas y deben confirmarse con el AQD", pt: "Moderado — leve quanto ao atestado oficial, mas várias normas não são publicadas e devem ser confirmadas com o AQD" }

prepTime:
  eu:
    en: "Dog from a country with an official government veterinary service (e.g. US/EU): ~2–4 weeks — up-to-date rabies vaccination and a government veterinary health certificate (valid 30 days after issuance), plus confirmation of AQD clearance at the port of entry."
    fr: "Chien venant d'un pays doté d'un service vétérinaire gouvernemental officiel (ex. États-Unis / UE) : ~2 à 4 semaines — vaccination antirabique à jour et certificat vétérinaire gouvernemental (valable 30 jours après émission), plus confirmation du dédouanement AQD au point d'entrée."
    es: "Perro procedente de un país con un servicio veterinario gubernamental oficial (p. ej. EE. UU. / UE): ~2 a 4 semanas — vacunación antirrábica al día y un certificado sanitario veterinario gubernamental (válido 30 días tras la emisión), más la confirmación del despacho del AQD en el punto de entrada."
    pt: "Cachorro vindo de um país com serviço veterinário governamental oficial (por exemplo, EUA/UE): cerca de 2 a 4 semanas — vacinação antirrábica em dia e um atestado de saúde veterinário oficial (válido por 30 dias após a emissão), além da confirmação da liberação do AQD no ponto de entrada."
  listed:
    en: "Standard case (most other countries): ~3–5 weeks — allow time to obtain the exporting country's official veterinary health certificate and to confirm with AQD whether an advance import permit or any additional test/treatment applies to your route."
    fr: "Cas standard (la plupart des autres pays) : ~3 à 5 semaines — prévois le temps d'obtenir le certificat vétérinaire officiel du pays d'export et de confirmer auprès de l'AQD si un permis d'importation préalable ou un test/traitement supplémentaire s'applique à ton trajet."
    es: "Caso estándar (la mayoría de los demás países): ~3 a 5 semanas — prevé tiempo para obtener el certificado sanitario veterinario oficial del país exportador y para confirmar con el AQD si a tu ruta se le aplica un permiso de importación previo o alguna prueba/tratamiento adicional."
    pt: "Caso padrão (a maioria dos outros países): cerca de 3 a 5 semanas — reserve tempo para obter o atestado de saúde veterinário oficial do país exportador e para confirmar com o AQD se uma autorização de importação prévia ou algum teste/tratamento adicional se aplica à sua rota."
  nonListed:
    en: "Incomplete documents, unusual origin, or a dog that raises a health concern on arrival: unpredictable — under the 1979 Ordinance AQD may inspect, detain or quarantine an animal, so allow extra time and confirm every requirement with AQD in advance."
    fr: "Documents incomplets, origine inhabituelle, ou chien suscitant une inquiétude sanitaire à l'arrivée : imprévisible — au titre de l'ordonnance de 1979, l'AQD peut inspecter, retenir ou mettre en quarantaine un animal ; prévois donc du temps supplémentaire et confirme chaque exigence auprès de l'AQD à l'avance."
    es: "Documentos incompletos, origen inusual o un perro que suscita una preocupación sanitaria a la llegada: impredecible — en virtud de la Ordinance de 1979, el AQD puede inspeccionar, retener o poner en cuarentena a un animal, así que prevé tiempo adicional y confirma cada requisito con el AQD por adelantado."
    pt: "Documentos incompletos, origem incomum ou um cachorro que gera preocupação sanitária na chegada: imprevisível — segundo a Portaria de 1979, o AQD pode inspecionar, reter ou colocar em quarentena um animal, portanto reserve tempo extra e confirme cada exigência com o AQD com antecedência."

