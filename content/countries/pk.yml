notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian and Pakistan's Animal Quarantine Department (AQD) can confirm the exact procedure for your individual dog — several requirements are not published online."
    fr: "Seuls un vétérinaire et l'Animal Quarantine Department (AQD) du Pakistan peuvent confirmer la procédure exacte pour ton chien — plusieurs exigences ne sont pas publiées en ligne."
    es: "Solo un veterinario y el Animal Quarantine Department (AQD) de Pakistán pueden confirmar el procedimiento exacto para tu perro — varios requisitos no están publicados en línea."
    pt: "Somente um veterinário e o Animal Quarantine Department (AQD) do Paquistão podem confirmar o procedimento exato para o seu cachorro — várias exigências não são publicadas on-line."
  - en: "Because official detail is limited, contact AQD before departure to confirm any advance import permit, vaccination timing, minimum age and quarantine that may apply."
    fr: "L'information officielle étant limitée, contacte l'AQD avant le départ pour confirmer tout permis d'importation préalable, calendrier vaccinal, âge minimum et quarantaine éventuels."
    es: "Como la información oficial es limitada, contacta con el AQD antes de la salida para confirmar cualquier permiso de importación previo, calendario de vacunación, edad mínima y cuarentena que puedan aplicarse."
    pt: "Como o detalhamento oficial é limitado, entre em contato com o AQD antes da partida para confirmar qualquer autorização de importação prévia, o prazo da vacinação, a idade mínima e a eventual quarentena aplicáveis."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
