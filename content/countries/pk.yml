# Country Entry Guide — Pakistan (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
# Pakistan is NOT in the EU. It runs its own national scheme under the Pakistan Animal
# Quarantine (Import and Export of Animals and Animal Products) Ordinance, 1979 and Rules,
# 1980, administered by the Animal Quarantine Department (AQD), an attached department of the
# Ministry of National Food Security & Research (MNFSR). AQD provides quarantine, inspection
# and certification at its stations (Karachi, Lahore, Islamabad, Multan, Sialkot, Peshawar,
# Quetta) and clears animal imports at the port of entry (Release Order via Pakistan Single
# Window). IMPORTANT: the official AQD/MNFSR websites publish the legal framework but do NOT
# publish detailed pet-dog entry parameters (exact vaccination intervals, minimum age,
# quarantine period, a pet-specific advance import-permit rule). The only official published
# document that itemises what Pakistan requires for a pet dog is the USDA APHIS "Veterinary
# Health Certificate for Export of Birds, Dogs and Cats from the United States of America to
# Pakistan": microchip OR name identification, veterinary inspection (free of infectious/
# contagious disease), origin from an area not quarantined for rabies and not exposed to
# rabies, rabies vaccination details recorded, other vaccinations/treatments/tests "if
# required", certificate valid 30 days after issuance, no USDA endorsement required, and NO
# rabies antibody test. Everything not published in an official source is marked Unknown /
# Non communiqué. Confidence is set low accordingly.
