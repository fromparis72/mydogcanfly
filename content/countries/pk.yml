seo:
  title: { en: "Pakistan Dog Entry Requirements — Travel Guide", fr: "Formalités d'entrée chien au Pakistan — Guide", es: "Requisitos de entrada de perros en Pakistán — Guía de viaje", pt: "Exigências de Entrada de Cachorros no Paquistão — Guia de Viagem" }
  metaTitle: { en: "Traveling to Pakistan With Your Dog: Entry Requirements (2026)", fr: "Voyager au Pakistan avec ton chien : formalités (2026)", es: "Viajar a Pakistán con tu perro: requisitos de entrada (2026)", pt: "Levar seu cachorro para o Paquistão: exigências de entrada 2026" }
  metaDesc:
    en: "Official rules for bringing a dog into Pakistan: government veterinary health certificate, recorded rabies vaccination, no antibody test. Sourced and dated."
    fr: "Règles officielles pour faire entrer un chien au Pakistan : certificat vétérinaire gouvernemental, vaccination antirabique consignée, pas de titrage. Sourcé et daté."
    es: "Normas oficiales para traer un perro a Pakistán: certificado sanitario veterinario gubernamental, vacunación antirrábica registrada. Con fuentes y fecha."
    pt: "Normas oficiais para levar um cachorro para o Paquistão: atestado de saúde veterinário oficial, vacinação antirrábica registrada, sem teste sorológico."
  slug: "pakistan"
  shortDesc:
    en: "What you need to bring a dog into Pakistan: a government veterinary health certificate, a current rabies vaccination and AQD clearance — with several rules to confirm directly with AQD."
