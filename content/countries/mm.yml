notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly oferece informação geral — não é orientação veterinária nem jurídica."
  - en: "Only a veterinarian and Myanmar's Livestock Breeding and Veterinary Department (LBVD) can confirm the exact procedure for your individual dog."
    fr: "Seuls un vétérinaire et le Département de l'élevage et des services vétérinaires (LBVD) du Myanmar peuvent confirmer la procédure exacte pour ton chien."
    es: "Solo un veterinario y el Departamento de Cría de Ganado y Servicios Veterinarios (LBVD) de Myanmar pueden confirmar el procedimiento exacto para tu perro."
    pt: "Só um veterinário e o Livestock Breeding and Veterinary Department (LBVD) de Mianmar podem confirmar o procedimento exato para o seu cachorro."
  - en: "Myanmar publishes little stable, pet-specific guidance: obtain the LBVD certificate of recommendation and import permit, and confirm current requirements in writing before you book."
    fr: "Le Myanmar publie peu d'informations stables propres aux animaux de compagnie : obtiens le certificat de recommandation et le permis d'importation du LBVD, et confirme les exigences en vigueur par écrit avant de réserver."
    es: "Myanmar publica poca información estable específica para mascotas: obtén el certificado de recomendación y el permiso de importación del LBVD, y confirma los requisitos vigentes por escrito antes de reservar."
    pt: "Mianmar publica pouca orientação estável e específica para animais de estimação: obtenha o certificado de recomendação e a autorização de importação do LBVD, e confirme por escrito as exigências atuais antes de reservar."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem do país de origem, do histórico de viagens, da identificação, das vacinas, do itinerário e da data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact steps depend on three things — Myanmar (your destination) is only the first."
    fr: "Les étapes exactes dépendent de trois éléments — le Myanmar (ta destination) n'est que le premier."
    es: "Los pasos exactos dependen de tres factores — Myanmar (tu destino) es solo el primero."
    pt: "As etapas exatas dependem de três fatores — Mianmar (seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Myanmar", fr: "Pays de destination — Myanmar", es: "País de destino — Myanmar", pt: "País de destino — Mianmar" }
      text:
        en: "Myanmar runs its own scheme under the Animal Health and Livestock Development Law, administered by the LBVD: an advance certificate of recommendation from the LBVD Director General, an import licence/permit, an official veterinary (health) certificate from the exporting authority, and inspection at an LBVD animal quarantine station (Yangon or Mandalay international airport). It does not use the EU pet-passport system."
        fr: "Le Myanmar applique son propre régime au titre de la loi sur la santé animale et le développement de l'élevage, géré par le LBVD : certificat de recommandation préalable du Directeur général du LBVD, licence/permis d'importation, certificat vétérinaire (sanitaire) officiel de l'autorité d'export et inspection à une station de quarantaine animale du LBVD (aéroport international de Yangon ou de Mandalay). Il n'utilise pas le passeport européen."
        es: "Myanmar aplica su propio régimen al amparo de la Ley de Sanidad Animal y Desarrollo Ganadero, gestionado por el LBVD: un certificado de recomendación previo del Director General del LBVD, una licencia/permiso de importación, un certificado veterinario (sanitario) oficial de la autoridad exportadora e inspección en una estación de cuarentena animal del LBVD (aeropuerto internacional de Yangón o de Mandalay). No utiliza el sistema del pasaporte europeo para mascotas."
        pt: "Mianmar aplica seu próprio esquema sob a Animal Health and Livestock Development Law, administrado pelo LBVD: um certificado de recomendação prévio do Director General do LBVD, uma licença/autorização de importação, um certificado veterinário (de saúde) oficial da autoridade exportadora, e inspeção em uma estação de quarentena animal do LBVD (aeroporto internacional de Yangon ou de Mandalay). O país não usa o sistema de passaporte para animais de estimação da UE."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The exporting country decides whose competent veterinary authority issues and endorses your dog's health certificate. Its disease status also affects whether import is allowed: a dog from a country affected by a listed animal infectious disease can face additional checks or refusal."
        fr: "Le pays d'export détermine quelle autorité vétérinaire compétente délivre et vise le certificat sanitaire de ton chien. Son statut sanitaire influe aussi sur l'autorisation d'import : un chien venant d'un pays touché par une maladie animale infectieuse répertoriée peut faire l'objet de contrôles supplémentaires ou d'un refus."
        es: "El país exportador determina qué autoridad veterinaria competente expide y refrenda el certificado sanitario de tu perro. Su estatus sanitario también influye en si se autoriza la importación: un perro procedente de un país afectado por una enfermedad infecciosa animal listada puede ser objeto de controles adicionales o de denegación."
        pt: "O país exportador determina qual autoridade veterinária competente emite e endossa o certificado de saúde do seu cachorro. A situação sanitária desse país também afeta se a importação é permitida: um cachorro vindo de um país afetado por uma doença infecciosa animal listada pode enfrentar verificações adicionais ou recusa."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay in a higher-risk country can affect the documentation, tests and quarantine required at the LBVD quarantine station, even if you fly in from elsewhere. It is your dog's real origin and history that count."
        fr: "Un séjour récent dans un pays à risque plus élevé peut influer sur les documents, les tests et la quarantaine requis à la station de quarantaine du LBVD, même si tu arrives d'ailleurs. C'est l'origine réelle et l'historique du chien qui comptent."
        es: "Una estancia reciente en un país de mayor riesgo puede afectar a la documentación, las pruebas y la cuarentena exigidas en la estación de cuarentena del LBVD, aunque llegues desde otro lugar. Lo que cuenta es el origen y el historial reales de tu perro."
        pt: "Uma estadia recente em um país de risco mais alto pode afetar a documentação, os exames e a quarentena exigidos na estação de quarentena do LBVD, mesmo que você chegue de avião de outro lugar. O que conta é a origem e o histórico reais do seu cachorro."
  note:
    en: "So read the requirements below as Myanmar's framework, then confirm your dog's exact origin, history and timeline with your vet and the LBVD before you book."
    fr: "Lis donc les exigences ci-dessous comme le cadre myanmarais, puis confirme l'origine, l'historique et le calendrier exacts de ton chien avec ton vétérinaire et le LBVD avant de réserver."
    es: "Así que lee los requisitos siguientes como el marco de Myanmar y luego confirma el origen, el historial y el calendario exactos de tu perro con tu veterinario y el LBVD antes de reservar."
    pt: "Portanto, leia as exigências abaixo como o marco de Mianmar e depois confirme com o seu veterinário e o LBVD a origem, o histórico e o cronograma exatos do seu cachorro antes de reservar."

requirements:
  - item: { en: "Certificate of recommendation + import licence/permit (LBVD)", fr: "Certificat de recommandation + licence/permis d'importation (LBVD)", es: "Certificado de recomendación + licencia/permiso de importación (LBVD)", pt: "Certificado de recomendação + licença/autorização de importação (LBVD)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Under Chapter 11, Para 26 of the Animal Health and Livestock Development Law (2020), a person wishing to import an animal must apply to the LBVD Director General for a certificate of recommendation before applying to the relevant government department for an import licence/permit. Applications are handled by LBVD's Animal & Animal Product Export & Import Inspection Unit (One-Stop Service, Nay Pyi Taw; Yangon).", fr: "Au titre du chapitre 11, paragraphe 26 de la loi sur la santé animale et le développement de l'élevage (2020), toute personne souhaitant importer un animal doit demander au Directeur général du LBVD un certificat de recommandation avant de solliciter une licence/un permis d'importation auprès du département compétent. Les demandes sont traitées par l'unité d'inspection import/export du LBVD (guichet unique, Nay Pyi Taw ; Yangon).", es: "Al amparo del capítulo 11, párrafo 26 de la Ley de Sanidad Animal y Desarrollo Ganadero (2020), toda persona que desee importar un animal debe solicitar al Director General del LBVD un certificado de recomendación antes de solicitar una licencia/permiso de importación al departamento gubernamental competente. Las solicitudes las gestiona la Unidad de Inspección de Exportación e Importación de Animales y Productos Animales del LBVD (ventanilla única, Nay Pyi Taw; Yangón).", pt: "Pelo Capítulo 11, Parágrafo 26 da Animal Health and Livestock Development Law (2020), uma pessoa que deseje importar um animal precisa solicitar ao Director General do LBVD um certificado de recomendação antes de pedir ao órgão governamental competente uma licença/autorização de importação. Os pedidos são tratados pela Animal & Animal Product Export & Import Inspection Unit do LBVD (One-Stop Service, Nay Pyi Taw; Yangon)." }
    exceptions: { en: "The exact procedure for a private traveller with an accompanying pet (versus a registered commercial importer) is not clearly published — confirm the applicable process and lead time in writing with the LBVD before you book.", fr: "La procédure exacte pour un voyageur privé accompagné de son animal (par opposition à un importateur commercial enregistré) n'est pas clairement publiée — confirme le processus applicable et le délai par écrit avec le LBVD avant de réserver.", es: "El procedimiento exacto para un viajero privado con una mascota acompañante (frente a un importador comercial registrado) no está claramente publicado — confirma el proceso aplicable y el plazo por escrito con el LBVD antes de reservar.", pt: "O procedimento exato para um viajante particular com um animal de estimação acompanhante (em contraste com um importador comercial registrado) não está claramente publicado — confirme por escrito o processo aplicável e o prazo com o LBVD antes de reservar." }
    ref: { en: "Animal Health and Livestock Development Law No. 13/2020, Ch. 11 §26; WTO Import Licensing notification (Myanmar); Regulations for exportation/importation of animals (2017)", fr: "Loi sur la santé animale et le développement de l'élevage n° 13/2020, chap. 11 §26 ; notification OMC sur les licences d'importation (Myanmar) ; règlements sur l'export/import d'animaux (2017)", es: "Ley de Sanidad Animal y Desarrollo Ganadero n.º 13/2020, cap. 11 §26; notificación de la OMC sobre licencias de importación (Myanmar); reglamentos de exportación/importación de animales (2017)", pt: "Animal Health and Livestock Development Law No. 13/2020, Cap. 11 §26; notificação de licenciamento de importação da OMC (Mianmar); Regulations for exportation/importation of animals (2017)" }
  - item: { en: "Official veterinary (health) certificate", fr: "Certificat vétérinaire (sanitaire) officiel", es: "Certificado veterinario (sanitario) oficial", pt: "Certificado veterinário (de saúde) oficial" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "An official veterinary/health certificate issued by the competent veterinary authority of the exporting country is required for importation and is checked by the LBVD at the port of entry. It certifies the dog's health and, in practice, its rabies vaccination. From the United States, the exporter uses a USDA-endorsed (ink-signed and embossed) health certificate.", fr: "Un certificat vétérinaire/sanitaire officiel délivré par l'autorité vétérinaire compétente du pays d'export est requis pour l'importation et vérifié par le LBVD au point d'entrée. Il atteste la santé du chien et, en pratique, sa vaccination antirabique. Depuis les États-Unis, l'exportateur utilise un certificat sanitaire visé par l'USDA (signé à l'encre et gaufré).", es: "Un certificado veterinario/sanitario oficial expedido por la autoridad veterinaria competente del país exportador es obligatorio para la importación y lo verifica el LBVD en el punto de entrada. Certifica la salud del perro y, en la práctica, su vacunación antirrábica. Desde Estados Unidos, el exportador utiliza un certificado sanitario refrendado por el USDA (firmado con tinta y con sello en relieve).", pt: "Um certificado veterinário/de saúde oficial emitido pela autoridade veterinária competente do país exportador é obrigatório para a importação e é conferido pelo LBVD no ponto de entrada. Ele atesta a saúde do cachorro e, na prática, sua vacinação antirrábica. A partir dos Estados Unidos, o exportador usa um atestado de saúde endossado pelo USDA (assinado a tinta e com selo em relevo)." }
    exceptions: { en: "Myanmar does not publish a single fixed model certificate for accompanied pet dogs; the exporting country's official form and endorsement govern, and the LBVD issues/verifies the veterinary certificate as competent authority. Confirm content and validity with your vet and the LBVD.", fr: "Le Myanmar ne publie pas de modèle de certificat unique et figé pour les chiens de compagnie accompagnés ; le formulaire officiel et le visa du pays d'export font foi, et le LBVD délivre/vérifie le certificat vétérinaire en tant qu'autorité compétente. Confirme le contenu et la validité avec ton vétérinaire et le LBVD.", es: "Myanmar no publica un modelo de certificado único y fijo para los perros de compañía acompañados; rigen el formulario oficial y el refrendo del país exportador, y el LBVD expide/verifica el certificado veterinario como autoridad competente. Confirma el contenido y la valide con tu veterinario y el LBVD.", pt: "Mianmar não publica um único modelo fixo de certificado para cachorros de estimação acompanhados; prevalecem o formulário oficial e o endosso do país exportador, e o LBVD emite/verifica o certificado veterinário como autoridade competente. Confirme o conteúdo e a validade com o seu veterinário e o LBVD." }
    ref: { en: "Animal Health and Livestock Development Law No. 13/2020; Myanmar National Trade Portal (LBVD competent authority); USDA APHIS — Export Live Animals to Myanmar", fr: "Loi sur la santé animale et le développement de l'élevage n° 13/2020 ; Portail national du commerce du Myanmar (LBVD, autorité compétente) ; USDA APHIS — Export d'animaux vivants vers le Myanmar", es: "Ley de Sanidad Animal y Desarrollo Ganadero n.º 13/2020; Portal Nacional de Comercio de Myanmar (LBVD, autoridad competente); USDA APHIS — Exportación de animales vivos a Myanmar", pt: "Animal Health and Livestock Development Law No. 13/2020; Myanmar National Trade Portal (LBVD como autoridade competente); USDA APHIS — exportação de animais vivos para Mianmar" }
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Not published — recommended", fr: "Non communiqué — recommandée", es: "No comunicado — recomendado", pt: "Não publicado — recomendado" }
    when: { en: "An ISO 11784/11785 (15-digit) microchip that links the dog to its documents is standard international practice and is often required by airlines and by the exporting authority.", fr: "Une puce ISO 11784/11785 (15 chiffres) reliant le chien à ses documents est une pratique internationale standard, souvent exigée par les compagnies aériennes et par l'autorité d'export.", es: "Un microchip ISO 11784/11785 (15 dígitos) que vincule al perro con sus documentos es la práctica internacional estándar y a menudo lo exigen las aerolíneas y la autoridad exportadora.", pt: "Um microchip ISO 11784/11785 (15 dígitos) que vincula o cachorro à sua documentação é prática internacional padrão e costuma ser exigido pelas companhias aéreas e pela autoridade exportadora." }
    exceptions: { en: "A microchip requirement for imported pet dogs is not published in a verifiable Myanmar official source. Treat it as recommended and confirm with the LBVD.", fr: "Une obligation de puce pour les chiens de compagnie importés n'est pas publiée dans une source officielle myanmaraise vérifiable. Considère-la comme recommandée et confirme avec le LBVD.", es: "No se publica un requisito de microchip para los perros de compañía importados en una fuente oficial de Myanmar verificable. Considéralo recomendado y confírmalo con el LBVD.", pt: "Uma exigência de microchip para cachorros de estimação importados não é publicada em uma fonte oficial de Mianmar verificável. Trate-a como recomendada e confirme com o LBVD." }
    ref: { en: "No Myanmar official source identified; ISO 11784/11785 standard", fr: "Aucune source officielle myanmaraise identifiée ; norme ISO 11784/11785", es: "No se identificó ninguna fuente oficial de Myanmar; norma ISO 11784/11785", pt: "Nenhuma fonte oficial de Mianmar identificada; padrão ISO 11784/11785" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required (via export certificate)", fr: "Requise (via le certificat d'export)", es: "Obligatoria (mediante el certificado de exportación)", pt: "Obrigatória (por meio do certificado de exportação)" }
    when: { en: "Myanmar is a rabies-endemic country and the LBVD runs annual World Rabies Day and free rabies-vaccination campaigns. A valid rabies vaccination is expected as part of the exporting country's veterinary health certificate for a dog. The exact Myanmar timing rule (minimum interval before entry, validity window) is not published.", fr: "Le Myanmar est un pays d'endémie rabique et le LBVD organise chaque année la Journée mondiale contre la rage et des campagnes de vaccination antirabique gratuites. Une vaccination antirabique valide est attendue dans le cadre du certificat sanitaire du pays d'export pour un chien. La règle myanmaraise exacte de délai (intervalle minimal avant l'entrée, période de validité) n'est pas publiée.", es: "Myanmar es un país con rabia endémica y el LBVD organiza cada año el Día Mundial contra la Rabia y campañas de vacunación antirrábica gratuitas. Se espera una vacunación antirrábica válida como parte del certificado sanitario veterinario del país exportador para un perro. La regla exacta de calendario de Myanmar (intervalo mínimo antes de la entrada, ventana de valide) no está publicada.", pt: "Mianmar é um país endêmico de raiva, e o LBVD realiza anualmente o World Rabies Day e campanhas gratuitas de vacinação antirrábica. Uma vacinação antirrábica válida é esperada como parte do certificado veterinário de saúde do cachorro emitido pelo país exportador. A regra exata de Mianmar quanto ao momento (intervalo mínimo antes da entrada, prazo de validade) não é publicada." }
    exceptions: { en: "Because no fixed Myanmar timing is published, follow the exporting authority's rules and confirm the vaccination interval with your vet and the LBVD.", fr: "Aucun délai myanmarais fixe n'étant publié, suis les règles de l'autorité d'export et confirme l'intervalle de vaccination avec ton vétérinaire et le LBVD.", es: "Como no se publica un calendario fijo de Myanmar, sigue las reglas de la autoridad exportadora y confirma el intervalo de vacunación con tu veterinario y el LBVD.", pt: "Como nenhum prazo fixo de Mianmar é publicado, siga as regras da autoridade exportadora e confirme o intervalo de vacinação com o seu veterinário e o LBVD." }
    ref: { en: "LBVD (World Rabies Day / rabies-vaccination campaigns); WOAH — Myanmar rabies-endemic; exporting-country veterinary certificate", fr: "LBVD (Journée mondiale contre la rage / campagnes de vaccination) ; WOAH — Myanmar en endémie rabique ; certificat vétérinaire du pays d'export", es: "LBVD (Día Mundial contra la Rabia / campañas de vacunación antirrábica); WOAH — Myanmar con rabia endémica; certificado veterinario del país exportador", pt: "LBVD (World Rabies Day / campanhas de vacinação antirrábica); WOAH — Mianmar endêmico de raiva; certificado veterinário do país exportador" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "No official requirement identified", fr: "Aucune exigence officielle identifiée", es: "No se identificó ningún requisito oficial", pt: "Nenhuma exigência oficial identificada" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "No rabies antibody test is published in Myanmar's import scheme for dogs. As Myanmar is itself rabies-endemic, an entry antibody test is not expected, but the LBVD may carry out serological testing at the quarantine station for suspect cases — confirm with the LBVD for your dog's origin.", fr: "Aucun titrage antirabique n'est publié dans le régime d'importation myanmarais pour les chiens. Le Myanmar étant lui-même en endémie rabique, un titrage à l'entrée n'est pas attendu, mais le LBVD peut réaliser des tests sérologiques à la station de quarantaine pour les cas suspects — confirme auprès du LBVD selon l'origine de ton chien.", es: "No se publica ninguna prueba de titulación de rabia en el régimen de importación de Myanmar para los perros. Como Myanmar tiene rabia endémica, no se espera una prueba de titulación de entrada, pero el LBVD puede realizar pruebas serológicas en la estación de cuarentena para los casos sospechosos — confirma con el LBVD según el origen de tu perro.", pt: "Nenhum teste sorológico antirrábico é publicado no esquema de importação de cachorros de Mianmar. Como o próprio Mianmar é endêmico de raiva, um teste sorológico de entrada não é esperado, mas o LBVD pode realizar exames sorológicos na estação de quarentena para casos suspeitos — confirme com o LBVD para a origem do seu cachorro." }
    ref: { en: "No Myanmar official source identified; WOAH/LBVD — quarantine-station serological testing (case-by-case)", fr: "Aucune source officielle myanmaraise identifiée ; WOAH/LBVD — tests sérologiques en station de quarantaine (au cas par cas)", es: "No se identificó ninguna fuente oficial de Myanmar; WOAH/LBVD — pruebas serológicas en la estación de cuarentena (caso por caso)", pt: "Nenhuma fonte oficial de Mianmar identificada; WOAH/LBVD — exame sorológico na estação de quarentena (caso a caso)" }
  - item: { en: "Parasite / tapeworm treatment", fr: "Traitement antiparasitaire / vermifuge", es: "Tratamiento antiparasitario / contra la tenia", pt: "Tratamento antiparasitário / contra tênias" }
    required: { en: "Not published", fr: "Non communiqué", es: "No comunicado", pt: "Não publicado" }
    when: { en: "Myanmar does not publish a specific internal/external parasite or tapeworm treatment requirement for imported dogs.", fr: "Le Myanmar ne publie pas d'exigence spécifique de traitement antiparasitaire interne/externe ou vermifuge pour les chiens importés.", es: "Myanmar no publica un requisito específico de tratamiento antiparasitario interno/externo o contra la tenia para los perros importados.", pt: "Mianmar não publica uma exigência específica de tratamento antiparasitário interno/externo ou contra tênia para cachorros importados." }
    exceptions: { en: "A parasite treatment may still be advisable and may be required by your airline or by the exporting authority — confirm separately.", fr: "Un traitement antiparasitaire peut néanmoins être conseillé et exigé par ta compagnie aérienne ou par l'autorité d'export — vérifie séparément.", es: "Un tratamiento antiparasitario puede seguir siendo aconsejable y puede exigirlo tu aerolínea o la autoridad exportadora — confírmalo por separado.", pt: "Um tratamento antiparasitário ainda pode ser recomendável e pode ser exigido pela sua companhia aérea ou pela autoridade exportadora — confirme separadamente." }
    ref: { en: "No Myanmar official source identified", fr: "Aucune source officielle myanmaraise identifiée", es: "No se identificó ninguna fuente oficial de Myanmar", pt: "Nenhuma fonte oficial de Mianmar identificada" }
  - item: { en: "Other vaccinations (dogs)", fr: "Autres vaccinations (chiens)", es: "Otras vacunaciones (perros)", pt: "Outras vacinas (cachorros)" }
    required: { en: "Not published — recommended", fr: "Non communiqué — recommandées", es: "No comunicado — recomendadas", pt: "Não publicado — recomendado" }
    when: { en: "Core canine vaccinations (distemper, hepatitis, parvovirus, leptospirosis) are standard veterinary practice but are not published as a fixed Myanmar import requirement.", fr: "Les vaccins canins de base (Carré, hépatite, parvovirose, leptospirose) relèvent de la pratique vétérinaire standard mais ne sont pas publiés comme exigence d'importation myanmaraise fixe.", es: "Las vacunas caninas básicas (moquillo, hepatitis, parvovirus, leptospirosis) son práctica veterinaria estándar, pero no se publican como requisito fijo de importación de Myanmar.", pt: "As vacinas caninas essenciais (cinomose, hepatite, parvovirose, leptospirose) são prática veterinária padrão, mas não são publicadas como uma exigência fixa de importação de Mianmar." }
    exceptions: { en: "Keep vaccinations current and documented; the exporting authority's certificate may list them.", fr: "Maintiens les vaccins à jour et documentés ; le certificat de l'autorité d'export peut les mentionner.", es: "Mantén las vacunas al día y documentadas; el certificado de la autoridad exportadora puede incluirlas.", pt: "Mantenha as vacinas em dia e documentadas; o certificado da autoridade exportadora pode listá-las." }
    ref: { en: "No Myanmar official source identified", fr: "Aucune source officielle myanmaraise identifiée", es: "No se identificó ninguna fuente oficial de Myanmar", pt: "Nenhuma fonte oficial de Mianmar identificada" }
  - item: { en: "Airport animal quarantine inspection (LBVD)", fr: "Inspection à la station de quarantaine de l'aéroport (LBVD)", es: "Inspección en la estación de cuarentena animal del aeropuerto (LBVD)", pt: "Inspeção de quarentena animal no aeroporto (LBVD)" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "On arrival, the LBVD reviews documents, carries out a visual/clinical check of the animal and verifies the veterinary health certificate at the animal quarantine station of the port of entry — the International Airport Quarantine Stations at Yangon and Mandalay. Inspection may include isolation, clinical examination, serological testing or pathogen detection for companion animals on a case-by-case basis.", fr: "À l'arrivée, le LBVD vérifie les documents, procède à un contrôle visuel/clinique de l'animal et vérifie le certificat sanitaire vétérinaire à la station de quarantaine animale du point d'entrée — les stations de quarantaine des aéroports internationaux de Yangon et de Mandalay. L'inspection peut inclure isolement, examen clinique, tests sérologiques ou détection de pathogènes pour les animaux de compagnie, au cas par cas.", es: "A la llegada, el LBVD revisa los documentos, realiza un control visual/clínico del animal y verifica el certificado sanitario veterinario en la estación de cuarentena animal del punto de entrada — las estaciones de cuarentena de los aeropuertos internacionales de Yangón y de Mandalay. La inspección puede incluir aislamiento, examen clínico, pruebas serológicas o detección de patógenos para los animales de compañía, caso por caso.", pt: "Na chegada, o LBVD analisa os documentos, realiza uma verificação visual/clínica do animal e confere o certificado veterinário de saúde na estação de quarentena animal do ponto de entrada — as International Airport Quarantine Stations de Yangon e Mandalay. A inspeção pode incluir isolamento, exame clínico, exame sorológico ou detecção de patógenos para animais de companhia, caso a caso." }
    exceptions: { en: "Clear customs at the same time and keep all original documents to hand. Land borders (Muse, Tachileik, Myawaddy, Tamu, Maungtaw, Kawthaung) operate check points rather than airport-standard facilities.", fr: "Passe la douane en même temps et garde tous les documents originaux à portée de main. Les frontières terrestres (Muse, Tachileik, Myawaddy, Tamu, Maungtaw, Kawthaung) disposent de postes de contrôle plutôt que d'installations de niveau aéroportuaire.", es: "Pasa la aduana al mismo tiempo y ten todos los documentos originales a mano. Las fronteras terrestres (Muse, Tachileik, Myawaddy, Tamu, Maungtaw, Kawthaung) funcionan con puestos de control en lugar de instalaciones de nivel aeroportuario.", pt: "Faça o desembaraço alfandegário ao mesmo tempo e mantenha todos os documentos originais à mão. As fronteiras terrestres (Muse, Tachileik, Myawaddy, Tamu, Maungtaw, Kawthaung) operam postos de controle, e não instalações no padrão dos aeroportos." }
    ref: { en: "WOAH/LBVD (MOALI) — Implementing Border Inspection and Animal Quarantine in Myanmar (2025); Animal Health and Livestock Development Law Ch. 11 §§29-31", fr: "WOAH/LBVD (MOALI) — Mise en œuvre de l'inspection frontalière et de la quarantaine animale au Myanmar (2025) ; loi sur la santé animale et le développement de l'élevage chap. 11 §§29-31", es: "WOAH/LBVD (MOALI) — Implementación de la inspección fronteriza y la cuarentena animal en Myanmar (2025); Ley de Sanidad Animal y Desarrollo Ganadero cap. 11 §§29-31", pt: "WOAH/LBVD (MOALI) — Implementing Border Inspection and Animal Quarantine in Myanmar (2025); Animal Health and Livestock Development Law Cap. 11 §§29-31" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Case-by-case", fr: "Au cas par cas", es: "Caso por caso", pt: "Caso a caso" }
    when: { en: "Myanmar operates animal quarantine stations at its international airports (Yangon, Mandalay) with risk-based observation periods and daily health checks. Compliant animals are inspected and cleared; a temporary quarantine applies to suspect cases pending tests and confirmation. A fixed quarantine duration for pet dogs is not published.", fr: "Le Myanmar dispose de stations de quarantaine animale à ses aéroports internationaux (Yangon, Mandalay) avec des périodes d'observation fondées sur le risque et des contrôles sanitaires quotidiens. Les animaux conformes sont inspectés et libérés ; une quarantaine temporaire s'applique aux cas suspects, en attente de tests et de confirmation. Une durée de quarantaine fixe pour les chiens de compagnie n'est pas publiée.", es: "Myanmar dispone de estaciones de cuarentena animal en sus aeropuertos internacionales (Yangón, Mandalay) con periodos de observación basados en el riesgo y controles sanitarios diarios. Los animales conformes son inspeccionados y liberados; se aplica una cuarentena temporal a los casos sospechosos, a la espera de pruebas y confirmación. No se publica una duración de cuarentena fija para los perros de compañía.", pt: "Mianmar opera estações de quarentena animal em seus aeroportos internacionais (Yangon, Mandalay), com períodos de observação baseados em risco e verificações diárias de saúde. Os animais em conformidade são inspecionados e liberados; uma quarentena temporária se aplica a casos suspeitos, à espera de exames e confirmação. Uma duração fixa de quarentena para cachorros de estimação não é publicada." }
    exceptions: { en: "A dog that lacks valid documents or raises a disease concern may be held, refused or returned at the owner's expense.", fr: "Un chien sans documents valides ou suscitant une inquiétude sanitaire peut être retenu, refusé ou renvoyé aux frais du propriétaire.", es: "Un perro que carezca de documentos válidos o que suscite una preocupación sanitaria puede ser retenido, rechazado o devuelto a cargo del propietario.", pt: "Um cachorro que não tiver documentos válidos ou que levantar alguma preocupação sanitária pode ficar retido, ser recusado ou devolvido, às custas do dono." }
    ref: { en: "WOAH/LBVD (MOALI) — Border Inspection and Animal Quarantine in Myanmar (2025)", fr: "WOAH/LBVD (MOALI) — Inspection frontalière et quarantaine animale au Myanmar (2025)", es: "WOAH/LBVD (MOALI) — Inspección fronteriza y cuarentena animal en Myanmar (2025)", pt: "WOAH/LBVD (MOALI) — Border Inspection and Animal Quarantine in Myanmar (2025)" }
  - item: { en: "Restricted / prohibited origins", fr: "Origines restreintes / interdites", es: "Orígenes restringidos / prohibidos", pt: "Origens restritas / proibidas" }
    required: { en: "Conditional / blocking", fr: "Conditionnel / bloquant", es: "Condicional / bloqueante", pt: "Condicional / bloqueio" }
    when: { en: "LBVD controls the movement of animals to prevent the introduction of transboundary and infectious animal diseases. A dog from a country or area affected by a listed animal infectious disease can face additional documentation, testing, quarantine or refusal of entry.", fr: "Le LBVD contrôle les mouvements d'animaux pour prévenir l'introduction de maladies animales transfrontalières et infectieuses. Un chien venant d'un pays ou d'une zone touchée par une maladie animale infectieuse répertoriée peut faire l'objet de documents, tests, quarantaine supplémentaires ou d'un refus d'entrée.", es: "El LBVD controla el movimiento de animales para prevenir la introducción de enfermedades animales transfronterizas e infecciosas. Un perro procedente de un país o zona afectada por una enfermedad infecciosa animal listada puede ser objeto de documentación, pruebas o cuarentena adicionales, o de denegación de entrada.", pt: "O LBVD controla o deslocamento de animais para evitar a introdução de doenças animais transfronteiriças e infecciosas. Um cachorro vindo de um país ou área afetada por uma doença infecciosa animal listada pode enfrentar documentação adicional, exames, quarentena ou recusa de entrada." }
    exceptions: { en: "The current list of restricted origins/diseases is not published in a single stable pet-specific source — confirm your dog's origin with the LBVD before travelling.", fr: "La liste actuelle des origines/maladies restreintes n'est pas publiée dans une source unique et stable propre aux animaux de compagnie — confirme l'origine de ton chien auprès du LBVD avant de voyager.", es: "La lista actual de orígenes/enfermedades restringidos no se publica en una única fuente estable específica para mascotas — confirma el origen de tu perro con el LBVD antes de viajar.", pt: "A lista atual de origens/doenças restritas não é publicada em uma única fonte estável específica para animais de estimação — confirme a origem do seu cachorro com o LBVD antes de viajar." }
    ref: { en: "Animal Health and Livestock Development Law No. 13/2020; WOAH/LBVD (MOALI) — border control (2025)", fr: "Loi sur la santé animale et le développement de l'élevage n° 13/2020 ; WOAH/LBVD (MOALI) — contrôle aux frontières (2025)", es: "Ley de Sanidad Animal y Desarrollo Ganadero n.º 13/2020; WOAH/LBVD (MOALI) — control fronterizo (2025)", pt: "Animal Health and Livestock Development Law No. 13/2020; WOAH/LBVD (MOALI) — controle de fronteira (2025)" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "Not published", fr: "Non communiqué", es: "No comunicado", pt: "Não publicado" }
    when: { en: "Myanmar does not publish a fixed minimum age for imported dogs. In practice the puppy must be old enough to hold a valid rabies vaccination shown on the export certificate.", fr: "Le Myanmar ne publie pas d'âge minimum fixe pour les chiens importés. En pratique, le chiot doit être en âge d'avoir une vaccination antirabique valide figurant sur le certificat d'export.", es: "Myanmar no publica una edad mínima fija para los perros importados. En la práctica, el cachorro debe tener edad suficiente para contar con una vacunación antirrábica válida que figure en el certificado de exportación.", pt: "Mianmar não publica uma idade mínima fixa para cachorros importados. Na prática, o filhote precisa ter idade suficiente para ter uma vacinação antirrábica válida constando no certificado de exportação." }
    exceptions: { en: "The exporting country and your airline may set their own minimum age.", fr: "Le pays d'export et ta compagnie aérienne peuvent fixer leur propre âge minimum.", es: "El país exportador y tu aerolínea pueden fijar su propia edad mínima.", pt: "O país exportador e a sua companhia aérea podem definir sua própria idade mínima." }
    ref: { en: "No Myanmar official source identified", fr: "Aucune source officielle myanmaraise identifiée", es: "No se identificó ninguna fuente oficial de Myanmar", pt: "Nenhuma fonte oficial de Mianmar identificada" }
  - item: { en: "Number of pets per traveller", fr: "Nombre d'animaux par voyageur", es: "Número de mascotas por viajero", pt: "Número de animais por viajante" }
    required: { en: "Not published", fr: "Non communiqué", es: "No comunicado", pt: "Não publicado" }
    when: { en: "Myanmar does not publish a fixed maximum number of accompanying pets per traveller. Each animal needs its own identification, certificate and LBVD recommendation.", fr: "Le Myanmar ne publie pas de nombre maximal fixe d'animaux accompagnants par voyageur. Chaque animal a besoin de sa propre identification, de son certificat et de la recommandation du LBVD.", es: "Myanmar no publica un número máximo fijo de mascotas acompañantes por viajero. Cada animal necesita su propia identificación, su certificado y la recomendación del LBVD.", pt: "Mianmar não publica um número máximo fixo de animais de estimação acompanhantes por viajante. Cada animal precisa de sua própria identificação, certificado e recomendação do LBVD." }
    exceptions: { en: "Confirm any limit with the LBVD and your airline.", fr: "Confirme toute limite auprès du LBVD et de ta compagnie aérienne.", es: "Confirma cualquier límite con el LBVD y tu aerolínea.", pt: "Confirme qualquer limite com o LBVD e a sua companhia aérea." }
    ref: { en: "No Myanmar official source identified", fr: "Aucune source officielle myanmaraise identifiée", es: "No se identificó ninguna fuente oficial de Myanmar", pt: "Nenhuma fonte oficial de Mianmar identificada" }

origin:
  eu:
    title: { en: "Compliant dog from a low-risk origin — standard path", fr: "Chien conforme depuis une origine à faible risque — parcours standard", es: "Perro conforme desde un origen de bajo riesgo — ruta estándar", pt: "Cachorro em conformidade vindo de uma origem de baixo risco — caminho padrão" }
    body:
      en: "From a low-risk origin the process follows Myanmar's national framework: first obtain the LBVD certificate of recommendation and import licence/permit, travel with an official veterinary (health) certificate issued by the exporting country's competent authority (showing the dog is healthy and, in practice, rabies-vaccinated), and present the dog to the LBVD animal quarantine station at Yangon or Mandalay international airport. A compliant dog is inspected and cleared alongside customs. Because Myanmar publishes little pet-specific detail, confirm the exact steps and documents with the LBVD before you book."
      fr: "Depuis une origine à faible risque, la procédure suit le cadre national myanmarais : obtiens d'abord le certificat de recommandation et la licence/le permis d'importation du LBVD, voyage avec un certificat vétérinaire (sanitaire) officiel délivré par l'autorité compétente du pays d'export (attestant que le chien est sain et, en pratique, vacciné contre la rage), et présente le chien à la station de quarantaine animale du LBVD à l'aéroport international de Yangon ou de Mandalay. Un chien conforme est inspecté et dédouané en même temps qu'à la douane. Le Myanmar publiant peu de détails propres aux animaux, confirme les étapes et documents exacts avec le LBVD avant de réserver."
      es: "Desde un origen de bajo riesgo, el proceso sigue el marco nacional de Myanmar: obtén primero el certificado de recomendación y la licencia/permiso de importación del LBVD, viaja con un certificado veterinario (sanitario) oficial expedido por la autoridad competente del país exportador (que acredite que el perro está sano y, en la práctica, vacunado contra la rabia), y presenta al perro en la estación de cuarentena animal del LBVD en el aeropuerto internacional de Yangón o de Mandalay. Un perro conforme es inspeccionado y despachado junto con la aduana. Como Myanmar publica pocos detalles específicos para mascotas, confirma los pasos y documentos exactos con el LBVD antes de reservar."
      pt: "Vindo de uma origem de baixo risco, o processo segue o marco nacional de Mianmar: obtenha primeiro o certificado de recomendação e a licença/autorização de importação do LBVD, viaje com um certificado veterinário (de saúde) oficial emitido pela autoridade competente do país exportador (mostrando que o cachorro está saudável e, na prática, vacinado contra a raiva), e apresente o cachorro à estação de quarentena animal do LBVD no aeroporto internacional de Yangon ou de Mandalay. Um cachorro em conformidade é inspecionado e liberado junto com a alfândega. Como Mianmar publica poucos detalhes específicos para animais de estimação, confirme as etapas e os documentos exatos com o LBVD antes de reservar."
    cls: ok
  listed:
    title: { en: "Rabies-endemic or higher-risk origin — extra checks likely", fr: "Origine d'endémie rabique ou à risque — contrôles supplémentaires probables", es: "Origen con rabia endémica o de mayor riesgo — controles adicionales probables", pt: "Origem endêmica de raiva ou de risco mais alto — verificações extras prováveis" }
    body:
      en: "From a rabies-endemic or otherwise higher-risk origin the same core documents are required, but the LBVD may ask for additional documentation, clinical or serological testing, or a period of quarantine at the airport quarantine station, and a dog raising a disease concern can be held for testing and confirmation. Exact conditions are not published, so register your intention early and confirm what will be required in writing with the LBVD."
      fr: "Depuis une origine d'endémie rabique ou à risque plus élevé, les mêmes documents de base sont exigés, mais le LBVD peut demander des documents, des tests cliniques ou sérologiques, ou une période de quarantaine à la station de quarantaine de l'aéroport, et un chien suscitant une inquiétude sanitaire peut être retenu pour tests et confirmation. Les conditions exactes ne sont pas publiées ; signale ton intention tôt et confirme par écrit avec le LBVD ce qui sera exigé."
      es: "Desde un origen con rabia endémica o de mayor riesgo se exigen los mismos documentos básicos, pero el LBVD puede pedir documentación adicional, pruebas clínicas o serológicas, o un periodo de cuarentena en la estación de cuarentena del aeropuerto, y un perro que suscite una preocupación sanitaria puede ser retenido para pruebas y confirmación. Las condiciones exactas no están publicadas, así que registra tu intención con antelación y confirma por escrito con el LBVD lo que se exigirá."
      pt: "Vindo de uma origem endêmica de raiva ou de outra forma de risco mais alto, os mesmos documentos essenciais são exigidos, mas o LBVD pode solicitar documentação adicional, exames clínicos ou sorológicos, ou um período de quarentena na estação de quarentena do aeroporto, e um cachorro que levante alguma preocupação sanitária pode ficar retido para exames e confirmação. As condições exatas não são publicadas, então registre sua intenção com antecedência e confirme por escrito com o LBVD o que será exigido."
    cls: warn
  nonListed:
    title: { en: "Origin affected by a listed disease — restricted or refused", fr: "Origine touchée par une maladie répertoriée — restreinte ou refusée", es: "Origen afectado por una enfermedad listada — restringido o denegado", pt: "Origem afetada por uma doença listada — restrita ou recusada" }
    body:
      en: "A dog coming from a country or area affected by a listed animal infectious disease can face additional testing and quarantine, or be refused entry, under the Animal Health and Livestock Development Law, which exists to prevent the introduction of transboundary and infectious animal diseases. The current list of restricted origins is not published in a single stable pet-specific source. Check your dog's origin against Myanmar's current disease restrictions with the LBVD before travelling."
      fr: "Un chien venant d'un pays ou d'une zone touchée par une maladie animale infectieuse répertoriée peut faire l'objet de tests et d'une quarantaine supplémentaires, ou d'un refus d'entrée, au titre de la loi sur la santé animale et le développement de l'élevage, qui vise à prévenir l'introduction de maladies animales transfrontalières et infectieuses. La liste actuelle des origines restreintes n'est pas publiée dans une source unique et stable propre aux animaux de compagnie. Vérifie l'origine de ton chien au regard des restrictions sanitaires en vigueur au Myanmar auprès du LBVD avant de voyager."
      es: "Un perro procedente de un país o zona afectada por una enfermedad infecciosa animal listada puede ser objeto de pruebas y cuarentena adicionales, o de denegación de entrada, al amparo de la Ley de Sanidad Animal y Desarrollo Ganadero, que existe para prevenir la introducción de enfermedades animales transfronterizas e infecciosas. La lista actual de orígenes restringidos no se publica en una única fuente estable específica para mascotas. Comprueba el origen de tu perro frente a las restricciones sanitarias vigentes de Myanmar con el LBVD antes de viajar."
      pt: "Um cachorro vindo de um país ou área afetada por uma doença infecciosa animal listada pode enfrentar exames e quarentena adicionais, ou ter a entrada recusada, pela Animal Health and Livestock Development Law, que existe para evitar a introdução de doenças animais transfronteiriças e infecciosas. A lista atual de origens restritas não é publicada em uma única fonte estável específica para animais de estimação. Verifique a origem do seu cachorro em relação às restrições sanitárias atuais de Mianmar junto ao LBVD antes de viajar."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Myanmar depends on whether the LBVD recommendation, import permit and documents were completed before departure."
    fr: "Ce qui se passe à l'arrivée de ton chien au Myanmar dépend du fait que la recommandation du LBVD, le permis d'importation et les documents aient été obtenus avant le départ."
    es: "Lo que ocurre cuando tu perro llega a Myanmar depende de si la recomendación del LBVD, el permiso de importación y los documentos se completaron antes de la salida."
    pt: "O que acontece quando o seu cachorro chega a Mianmar depende de a recomendação do LBVD, a autorização de importação e os documentos terem sido concluídos antes da partida."
  points:
    - en: "Dogs enter through an international airport with an LBVD animal quarantine station — Yangon or Mandalay."
      fr: "Les chiens entrent par un aéroport international doté d'une station de quarantaine animale du LBVD — Yangon ou Mandalay."
      es: "Los perros entran por un aeropuerto internacional con una estación de cuarentena animal del LBVD — Yangón o Mandalay."
      pt: "Os cachorros entram por um aeroporto internacional com estação de quarentena animal do LBVD — Yangon ou Mandalay."
    - en: "Present your passport, the original official veterinary (health) certificate, the LBVD certificate of recommendation / import permit and vaccination records to the LBVD inspection team, which reviews the documents and inspects the animal."
      fr: "Présente ton passeport, le certificat vétérinaire (sanitaire) officiel original, le certificat de recommandation / permis d'importation du LBVD et le carnet de vaccination à l'équipe d'inspection du LBVD, qui vérifie les documents et inspecte l'animal."
      es: "Presenta tu pasaporte, el certificado veterinario (sanitario) oficial original, el certificado de recomendación / permiso de importación del LBVD y los registros de vacunación al equipo de inspección del LBVD, que revisa los documentos e inspecciona al animal."
      pt: "Apresente seu passaporte, o certificado veterinário (de saúde) oficial original, o certificado de recomendação / autorização de importação do LBVD e os registros de vacinação à equipe de inspeção do LBVD, que analisa os documentos e inspeciona o animal."
    - en: "A compliant dog is inspected and released; suspect cases may be placed in temporary quarantine with risk-based observation, clinical monitoring and possible testing."
      fr: "Un chien conforme est inspecté et libéré ; les cas suspects peuvent être placés en quarantaine temporaire avec observation fondée sur le risque, suivi clinique et tests éventuels."
      es: "Un perro conforme es inspeccionado y liberado; los casos sospechosos pueden colocarse en cuarentena temporal con observación basada en el riesgo, seguimiento clínico y posibles pruebas."
      pt: "Um cachorro em conformidade é inspecionado e liberado; casos suspeitos podem ser colocados em quarentena temporária, com observação baseada em risco, monitoramento clínico e possíveis exames."
    - en: "Clear customs at the same time; keep all original documents and any receipts."
      fr: "Passe la douane en même temps ; conserve tous les documents originaux et les reçus éventuels."
      es: "Pasa la aduana al mismo tiempo; conserva todos los documentos originales y cualquier recibo."
      pt: "Faça o desembaraço alfandegário ao mesmo tempo; mantenha todos os documentos originais e eventuais recibos."
    - en: "If the LBVD recommendation, import permit or documents are missing or invalid, the animal may be refused, held or returned to the exporting country at the owner's expense."
      fr: "Si la recommandation du LBVD, le permis d'importation ou les documents manquent ou sont invalides, l'animal peut être refusé, retenu ou renvoyé vers le pays d'export aux frais du propriétaire."
      es: "Si la recomendación del LBVD, el permiso de importación o los documentos faltan o no son válidos, el animal puede ser rechazado, retenido o devuelto al país exportador a cargo del propietario."
      pt: "Se a recomendação do LBVD, a autorização de importação ou os documentos estiverem ausentes ou inválidos, o animal pode ser recusado, retido ou devolvido ao país exportador, às custas do dono."

travellerExperience: null

restrictedDogs:
  intro:
    en: "No Myanmar breed-specific import ban is published: the identified import controls are based on the origin country's animal-disease status, not on the dog's breed. Myanmar's import controls exist to prevent the introduction of transboundary and infectious animal diseases."
    fr: "Aucune interdiction d'importation myanmaraise liée à la race n'est publiée : les contrôles d'importation identifiés reposent sur le statut sanitaire animal du pays d'origine, pas sur la race du chien. Les contrôles à l'import du Myanmar visent à prévenir l'introduction de maladies animales transfrontalières et infectieuses."
    es: "No se publica ninguna prohibición de importación de Myanmar por raza: los controles de importación identificados se basan en el estatus sanitario animal del país de origen, no en la raza del perro. Los controles de importación de Myanmar existen para prevenir la introducción de enfermedades animales transfronterizas e infecciosas."
    pt: "Nenhuma proibição de importação por raça de Mianmar é publicada: os controles de importação identificados se baseiam na situação sanitária animal do país de origem, não na raça do cachorro. Os controles de importação de Mianmar existem para evitar a introdução de doenças animais transfronteiriças e infecciosas."
  cat1:
    en: "There is no national list of banned or 'dangerous' breeds at import that could be verified in an official source. Breeds restricted in some other countries (pit-bull types, Tosa, Rottweiler and similar) are not identified as prohibited from entering Myanmar on the basis of breed."
    fr: "Il n'existe aucune liste nationale de races interdites ou « dangereuses » à l'importation vérifiable dans une source officielle. Les races restreintes dans certains autres pays (types pit-bull, Tosa, Rottweiler et similaires) ne sont pas identifiées comme interdites d'entrée au Myanmar en raison de la race."
    es: "No existe una lista nacional de razas prohibidas o «peligrosas» en la importación que pueda verificarse en una fuente oficial. Las razas restringidas en algunos otros países (tipos pit bull, Tosa, Rottweiler y similares) no están identificadas como prohibidas para entrar en Myanmar por motivo de la raza."
    pt: "Não há uma lista nacional de raças proibidas ou 'perigosas' na importação que pudesse ser verificada em uma fonte oficial. Raças restritas em alguns outros países (tipos pit-bull, Tosa, Rottweiler e semelhantes) não são identificadas como proibidas de entrar em Mianmar com base na raça."
  cat2:
    en: "What is controlled is origin and disease risk, not breed: under the Animal Health and Livestock Development Law, animals carrying or coming from areas affected by listed infectious diseases can be restricted or refused. If any breed rule exists, it is not published in a verifiable official source — confirm with the LBVD."
    fr: "Ce qui est contrôlé, c'est l'origine et le risque sanitaire, pas la race : au titre de la loi sur la santé animale et le développement de l'élevage, les animaux porteurs de maladies infectieuses répertoriées ou provenant de zones touchées peuvent être restreints ou refusés. Si une règle de race existe, elle n'est pas publiée dans une source officielle vérifiable — confirme avec le LBVD."
    es: "Lo que se controla es el origen y el riesgo sanitario, no la raza: al amparo de la Ley de Sanidad Animal y Desarrollo Ganadero, los animales portadores de enfermedades infecciosas listadas o procedentes de zonas afectadas pueden ser restringidos o rechazados. Si existe alguna norma de raza, no se publica en una fuente oficial verificable — confirma con el LBVD."
    pt: "O que é controlado é a origem e o risco sanitário, não a raça: pela Animal Health and Livestock Development Law, animais portadores, ou vindos de áreas afetadas por doenças infecciosas listadas, podem ser restringidos ou recusados. Se existir alguma regra por raça, ela não é publicada em uma fonte oficial verificável — confirme com o LBVD."
  note:
    en: "Airlines set their own breed and crate policies (many restrict snub-nosed breeds in the hold), and local rules on keeping dogs may apply where the dog will live — confirm both separately."
    fr: "Les compagnies aériennes fixent leurs propres politiques de race et de caisse (beaucoup limitent les races brachycéphales en soute), et des règles locales de détention peuvent s'appliquer au lieu de vie du chien — vérifie les deux séparément."
    es: "Las aerolíneas fijan sus propias políticas de razas y de jaula (muchas restringen las razas braquicéfalas en bodega), y pueden aplicarse normas locales de tenencia en el lugar donde vivirá el perro — confirma ambas por separado."
    pt: "As companhias aéreas definem suas próprias políticas de raça e de caixa de transporte (muitas restringem raças de focinho achatado no porão), e regras locais sobre a posse de cachorros podem se aplicar no local onde o cachorro vai morar — confirme os dois pontos separadamente."

checklist:
  - en: "LBVD certificate of recommendation and import licence/permit obtained in advance (confirm the process in writing)"
    fr: "Certificat de recommandation et licence/permis d'importation du LBVD obtenus à l'avance (confirme le processus par écrit)"
    es: "Certificado de recomendación y licencia/permiso de importación del LBVD obtenidos por adelantado (confirma el proceso por escrito)"
    pt: "Certificado de recomendação e licença/autorização de importação do LBVD obtidos com antecedência (confirme o processo por escrito)"
  - en: "Official veterinary (health) certificate from the exporting country's competent authority"
    fr: "Certificat vétérinaire (sanitaire) officiel de l'autorité compétente du pays d'export"
    es: "Certificado veterinario (sanitario) oficial de la autoridad competente del país exportador"
    pt: "Certificado veterinário (de saúde) oficial da autoridade competente do país exportador"
  - en: "Valid rabies vaccination on the certificate (Myanmar is rabies-endemic; confirm timing with the LBVD)"
    fr: "Vaccination antirabique valide sur le certificat (Myanmar en endémie rabique ; confirme le délai avec le LBVD)"
    es: "Vacunación antirrábica válida en el certificado (Myanmar tiene rabia endémica; confirma el calendario con el LBVD)"
    pt: "Vacinação antirrábica válida constando no certificado (Mianmar é endêmico de raiva; confirme o momento com o LBVD)"
  - en: "ISO 11784/11785 microchip recommended, with its number matching all documents"
    fr: "Puce ISO 11784/11785 recommandée, son numéro correspondant à tous les documents"
    es: "Se recomienda microchip ISO 11784/11785, con su número coincidiendo con todos los documentos"
    pt: "Microchip ISO 11784/11785 recomendado, com o número correspondendo a todos os documentos"
  - en: "Vaccination record / pet passport documenting full vaccination history"
    fr: "Carnet de vaccination / passeport documentant l'historique complet de vaccination"
    es: "Cartilla de vacunación / pasaporte para mascotas que documente el historial completo de vacunación"
    pt: "Registro de vacinação / passaporte de animal de estimação documentando o histórico completo de vacinação"
  - en: "Check your dog's origin against Myanmar's disease restrictions before travelling"
    fr: "Vérifie l'origine de ton chien au regard des restrictions sanitaires du Myanmar avant de voyager"
    es: "Comprueba el origen de tu perro frente a las restricciones sanitarias de Myanmar antes de viajar"
    pt: "Verifique a origem do seu cachorro em relação às restrições sanitárias de Mianmar antes de viajar"
  - en: "Arrive through an international airport with an LBVD animal quarantine station (Yangon or Mandalay)"
    fr: "Arrive par un aéroport international doté d'une station de quarantaine animale du LBVD (Yangon ou Mandalay)"
    es: "Llega por un aeropuerto internacional con una estación de cuarentena animal del LBVD (Yangón o Mandalay)"
    pt: "Chegue por um aeroporto internacional com estação de quarentena animal do LBVD (Yangon ou Mandalay)"
  - en: "Original documents to hand for the LBVD quarantine station and customs"
    fr: "Documents originaux à portée de main pour la station de quarantaine du LBVD et la douane"
    es: "Documentos originales a mano para la estación de cuarentena del LBVD y la aduana"
    pt: "Documentos originais à mão para a estação de quarentena do LBVD e a alfândega"
  - en: "Airline reservation and suitable IATA crate; confirm your dog's breed is accepted by the carrier"
    fr: "Réservation aérienne et caisse IATA adaptée ; vérifie que la race de ton chien est acceptée par la compagnie"
    es: "Reserva de la aerolínea y jaula IATA adecuada; confirma que la aerolínea acepta la raza de tu perro"
    pt: "Reserva na companhia aérea e caixa de transporte adequada, em conformidade com a IATA; confirme que a raça do seu cachorro é aceita pela companhia aérea"

