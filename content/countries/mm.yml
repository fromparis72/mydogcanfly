# Country Entry Guide — Myanmar (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
# Myanmar is NOT in the EU. It runs its own national scheme under the Animal Health and
# Livestock Development Law (Pyidaungsu Hluttaw Law No. 13/2020, amended 2025) and the
# Regulations for the Exportation and Importation of Animals and Animal Products (2017),
# administered by the Livestock Breeding and Veterinary Department (LBVD) of the Ministry
# of Agriculture, Livestock and Irrigation (MOALI). Under Chapter 11, Para 26 of the Law,
# a person wishing to import an animal must first apply to the LBVD Director General for a
# certificate of recommendation, BEFORE applying to the relevant department for an import
# licence/permit. LBVD is the competent authority that issues the veterinary certificate for
# import/export and operates animal quarantine stations at ports of entry, including the
# International Airport Quarantine Stations at Yangon and Mandalay (WOAH/LBVD 2025). On arrival,
# LBVD reviews documents, inspects the animal and may quarantine/test suspect cases.
# Myanmar is rabies-endemic (LBVD runs World Rabies Day and free rabies-vaccination campaigns).
# Myanmar publishes very little stable, dog-specific guidance: microchip, exact rabies timing,
# rabies antibody test, parasite treatment and minimum age are NOT published in a verifiable
# official source and are marked Unknown / Non communiqué below (confidence LOW).
# The eu/listed/nonListed slots are repurposed to Myanmar's origin-risk tiers: eu = compliant dog
# from a low-risk origin (standard path); listed = rabies-endemic / higher-risk origin (extra
# documentation, quarantine or tests likely); nonListed = origin affected by a listed animal
# infectious disease (import restricted/prohibited).
id: country_mm
iso2: "MM"
name: { en: "Myanmar", fr: "Myanmar", es: "Myanmar", pt: "Mianmar" }
region: { en: "Asia", fr: "Asie", es: "Asia", pt: "Ásia" }


regime: non_listed
exit:
  authority: LBVD
  authorityUrl: https://lbvd.gov.mm
  intro:
    en: "Myanmar is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Livestock Breeding and Veterinary Department (LBVD)."
    fr: "Le Myanmar est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par le Livestock Breeding and Veterinary Department (LBVD)."
    es: "Birmania no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por el Livestock Breeding and Veterinary Department (LBVD)."
    pt: "Mianmar é um país não listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para retornar à UE — além de um atestado de saúde de exportação endossado pelo Livestock Breeding and Veterinary Department (LBVD)."
  steps:
    - timing: longlead
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      text:
        en: "The LBVD issues the official veterinary export certificate and export recommendation; apply for the LBVD export licence about 10 days before departure."
        fr: "Le LBVD délivre le certificat vétérinaire d'export officiel et la recommandation d'export ; demande la licence d'export LBVD environ 10 jours avant le départ."
        es: "El LBVD emite el certificado veterinario de exportación oficial y la recomendación de exportación; solicita la licencia de exportación del LBVD unos 10 días antes de salir."
        pt: "O LBVD emite o certificado veterinário oficial de exportação e a recomendação de exportação; solicite a licença de exportação do LBVD cerca de 10 dias antes da partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Myanmar with your dog", fr: "Voyager au Myanmar avec ton chien", es: "Viajar a Myanmar con tu perro", pt: "Viajar para Mianmar com seu cachorro" }
  intro:
    en: >-
      Myanmar allows dogs to enter, but it runs its own national scheme under the Animal Health and
      Livestock Development Law (Law No. 13/2020) — not the EU framework. Imports are administered by
      the Livestock Breeding and Veterinary Department (LBVD) of the Ministry of Agriculture, Livestock
      and Irrigation (MOALI). In principle you must first apply to the LBVD Director General for a
      certificate of recommendation before applying for an import licence/permit, travel with an
      official veterinary (health) certificate issued by the competent authority of the exporting
      country, and present your dog to the LBVD animal quarantine station at your port of entry —
      Yangon or Mandalay international airport — alongside customs. LBVD reviews the documents, inspects
      the animal and may place suspect cases in temporary quarantine. Myanmar is a rabies-endemic
      country and publishes little detailed, stable pet-specific guidance, so several points (microchip,
      exact rabies timing, rabies antibody test, parasite treatment, minimum age) must be confirmed
      directly with the LBVD and a veterinarian before you book.
    fr: >-
      Le Myanmar autorise l'entrée des chiens, mais applique son propre régime national au titre de la
      loi sur la santé animale et le développement de l'élevage (loi n° 13/2020) — et non le cadre
      européen. Les importations sont gérées par le Département de l'élevage et des services vétérinaires
      (LBVD) du Ministère de l'Agriculture, de l'Élevage et de l'Irrigation (MOALI). En principe, tu
      devez d'abord demander au Directeur général du LBVD un certificat de recommandation avant de
      solliciter une licence/un permis d'importation, voyager avec un certificat vétérinaire (sanitaire)
      officiel délivré par l'autorité compétente du pays d'export, et présenter ton chien à la station
      de quarantaine animale du LBVD à ton point d'entrée — aéroport international de Yangon ou de
      Mandalay — en même temps qu'à la douane. Le LBVD vérifie les documents, inspecte l'animal et peut
      placer les cas suspects en quarantaine temporaire. Le Myanmar est un pays d'endémie rabique et
      publie peu d'informations détaillées et stables propres aux animaux de compagnie ; plusieurs points
      (puce, délai exact de vaccination antirabique, titrage antirabique, traitement antiparasitaire,
      âge minimum) doivent être confirmés directement auprès du LBVD et d'un vétérinaire avant de réserver.
    es: >-
      Myanmar permite la entrada de perros, pero aplica su propio régimen nacional al amparo de la Ley de
      Sanidad Animal y Desarrollo Ganadero (Ley n.º 13/2020) — no el marco de la UE. Las importaciones
      las gestiona el Departamento de Cría de Ganado y Servicios Veterinarios (LBVD) del Ministerio de
      Agricultura, Ganadería e Irrigación (MOALI). En principio, primero debes solicitar al Director
      General del LBVD un certificado de recomendación antes de solicitar una licencia/permiso de
      importación, viajar con un certificado veterinario (sanitario) oficial expedido por la autoridad
      competente del país exportador, y presentar a tu perro en la estación de cuarentena animal del LBVD
      en tu punto de entrada — el aeropuerto internacional de Yangón o de Mandalay — junto con la aduana.
      El LBVD revisa los documentos, inspecciona al animal y puede colocar los casos sospechosos en
      cuarentena temporal. Myanmar es un país con rabia endémica y publica poca información detallada y
      estable específica para mascotas, por lo que varios puntos (microchip, calendario exacto de la
      rabia, prueba de titulación de rabia, tratamiento antiparasitario, edad mínima) deben confirmarse
      directamente con el LBVD y un veterinario antes de reservar.

    pt: "Mianmar permite a entrada de cachorros, mas aplica seu próprio esquema nacional sob a Animal Health and Livestock Development Law (Lei nº 13/2020) — e não o marco da UE. As importações são administradas pelo Livestock Breeding and Veterinary Department (LBVD), do Ministry of Agriculture, Livestock and Irrigation (MOALI). Em princípio, você precisa primeiro solicitar ao Director General do LBVD um certificado de recomendação antes de pedir uma licença/autorização de importação, viajar com um certificado veterinário (de saúde) oficial emitido pela autoridade competente do país exportador, e apresentar o seu cachorro à estação de quarentena animal do LBVD no seu ponto de entrada — aeroporto internacional de Yangon ou de Mandalay — junto com a alfândega. O LBVD analisa os documentos, inspeciona o animal e pode colocar casos suspeitos em quarentena temporária. Mianmar é um país endêmico de raiva e publica pouca orientação detalhada e estável específica para animais de estimação, portanto vários pontos (microchip, momento exato da vacinação antirrábica, teste sorológico antirrábico, tratamento antiparasitário, idade mínima) precisam ser confirmados diretamente com o LBVD e um veterinário antes de você reservar."
difficulty:
  level: difficult
  label: { en: "Difficult — advance LBVD recommendation/permit and very limited published guidance", fr: "Difficile — recommandation/permis LBVD préalable et très peu d'informations publiées", es: "Difícil — recomendación/permiso previo del LBVD y muy poca información publicada", pt: "Difícil — recomendação/autorização prévia do LBVD e orientação publicada muito limitada" }

prepTime:
  eu:
    en: "Compliant dog from a low-risk origin: plan several weeks — first obtain the LBVD certificate of recommendation and import licence/permit, then an official veterinary (health) certificate from the exporting authority shortly before travel. Exact lead times are not published; confirm with the LBVD."
    fr: "Chien conforme depuis une origine à faible risque : prévois plusieurs semaines — obtiens d'abord le certificat de recommandation et la licence/le permis d'importation du LBVD, puis un certificat vétérinaire (sanitaire) officiel de l'autorité d'export peu avant le voyage. Les délais exacts ne sont pas publiés ; confirme avec le LBVD."
    es: "Perro conforme desde un origen de bajo riesgo: planifica varias semanas — obtén primero el certificado de recomendación y la licencia/permiso de importación del LBVD, y luego un certificado veterinario (sanitario) oficial de la autoridad exportadora poco antes del viaje. Los plazos exactos no están publicados; confirma con el LBVD."
    pt: "Cachorro em conformidade vindo de uma origem de baixo risco: planeje várias semanas — obtenha primeiro o certificado de recomendação e a licença/autorização de importação do LBVD, depois um certificado veterinário (de saúde) oficial da autoridade exportadora pouco antes da viagem. Os prazos exatos não são publicados; confirme com o LBVD."
  listed:
    en: "Rabies-endemic or higher-risk origin: allow extra time — additional documentation, clinical/serological tests or a period of quarantine may be requested at the LBVD airport quarantine station. Exact requirements are not published; confirm with the LBVD before booking."
    fr: "Origine d'endémie rabique ou à risque plus élevé : prévois du temps supplémentaire — documents, tests cliniques/sérologiques ou une période de quarantaine peuvent être exigés à la station de quarantaine du LBVD à l'aéroport. Les exigences exactes ne sont pas publiées ; confirme avec le LBVD avant de réserver."
    es: "Origen con rabia endémica o de mayor riesgo: prevé tiempo adicional — pueden solicitarse documentación adicional, pruebas clínicas/serológicas o un periodo de cuarentena en la estación de cuarentena del aeropuerto del LBVD. Los requisitos exactos no están publicados; confirma con el LBVD antes de reservar."
    pt: "Origem endêmica de raiva ou de risco mais alto: reserve tempo extra — documentação adicional, exames clínicos/sorológicos ou um período de quarentena podem ser solicitados na estação de quarentena do LBVD no aeroporto. As exigências exatas não são publicadas; confirme com o LBVD antes de reservar."
  nonListed:
    en: "Origin affected by a listed animal infectious disease: import can be restricted or refused — no timeline applies. Check your dog's origin against Myanmar's current disease restrictions with the LBVD before travelling."
    fr: "Origine touchée par une maladie animale infectieuse répertoriée : l'import peut être restreint ou refusé — aucun délai ne s'applique. Vérifie l'origine de ton chien au regard des restrictions sanitaires en vigueur au Myanmar auprès du LBVD avant de voyager."
    es: "Origen afectado por una enfermedad infecciosa animal listada: la importación puede restringirse o denegarse — no aplica ningún plazo. Comprueba el origen de tu perro frente a las restricciones sanitarias vigentes de Myanmar con el LBVD antes de viajar."
    pt: "Origem afetada por uma doença infecciosa animal listada: a importação pode ser restringida ou recusada — nenhum prazo se aplica. Verifique a origem do seu cachorro em relação às restrições sanitárias atuais de Mianmar junto ao LBVD antes de viajar."

