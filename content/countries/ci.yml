  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consultar sempre o médico-veterinário antes de reservar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do cachorro" }
  intro:
    en: "The exact documents depend on three things — Ivory Coast (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — la Côte d'Ivoire (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Costa de Marfil (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — a Costa do Marfim (o destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Ivory Coast", fr: "Pays de destination — Côte d'Ivoire", es: "País de destino — Costa de Marfil", pt: "País de destino — Costa do Marfim" }
      text:
        en: "Ivory Coast runs its own DSV/MIRAH scheme: a prior import authorization obtained before travel, a valid rabies vaccination, an international veterinary health certificate and a border veterinary inspection are the core requirements. There is no EU-style pet passport route."
        fr: "La Côte d'Ivoire applique son propre dispositif DSV/MIRAH : une autorisation préalable d'importation obtenue avant le voyage, une vaccination antirabique valide, un certificat vétérinaire international et une inspection vétérinaire à la frontière constituent les exigences de base. Il n'existe pas de voie « passeport » de l'UE."
        es: "Costa de Marfil aplica su propio sistema DSV/MIRAH: una autorización previa de importación obtenida antes del viaje, una vacunación antirrábica válida, un certificado sanitario veterinario internacional y una inspección veterinaria en frontera son los requisitos básicos. No existe una vía de tipo «pasaporte» de la UE."
        pt: "A Costa do Marfim segue seu próprio esquema pela DSV/MIRAH: uma autorização de importação prévia obtida antes da viagem, uma vacinação antirrábica válida, um atestado de saúde veterinário internacional e uma inspeção veterinária de fronteira são as exigências centrais. Não existe uma via de passaporte para animais de estimação nos moldes europeus."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The country of departure decides which certificate model your official vet uses and how the rabies vaccination is documented. For the United States, USDA/APHIS publishes the exact DSV certificate and import-permit process; other origins follow the same DSV requirements confirmed at authorization."
        fr: "Le pays de départ détermine le modèle de certificat que ton vétérinaire officiel utilise et la manière dont la vaccination antirabique est documentée. Pour les États-Unis, l'USDA/APHIS publie le certificat DSV exact et la procédure de permis d'importation ; les autres origines suivent les mêmes exigences DSV confirmées au moment de l'autorisation."
        es: "El país de salida determina qué modelo de certificado utiliza tu veterinario oficial y cómo se documenta la vacunación antirrábica. Para Estados Unidos, el USDA/APHIS publica el certificado exacto de la DSV y el proceso de permiso de importación; los demás orígenes siguen los mismos requisitos de la DSV confirmados en el momento de la autorización."
        pt: "O país de partida determina qual modelo de certificado o veterinário oficial utiliza e como a vacinação antirrábica é documentada. Para os Estados Unidos, o USDA/APHIS publica o certificado exato da DSV e o processo de autorização de importação; outras origens seguem as mesmas exigências da DSV, confirmadas no momento da autorização."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde o cachorro esteve recentemente" }
      text:
        en: "The dog must come from an area not quarantined for rabies and not have been exposed to rabies. A recent stay in a country with active rabies control measures can therefore matter, not only the last airport you fly from."
        fr: "Le chien doit provenir d'une zone non placée en quarantaine pour la rage et ne pas avoir été exposé à la rage. Un séjour récent dans un pays soumis à des mesures actives de lutte contre la rage peut donc compter, pas seulement le dernier aéroport de départ."
        es: "El perro debe proceder de una zona no puesta en cuarentena por rabia y no haber estado expuesto a la rabia. Una estancia reciente en un país con medidas activas de control de la rabia puede por tanto influir, no solo el último aeropuerto desde el que vueles."
        pt: "O cachorro deve vir de uma área não colocada em quarentena por raiva e não ter sido exposto à raiva. Uma estadia recente em um país com medidas ativas de controle da raiva pode, portanto, ser relevante — não apenas o último aeroporto de onde ele partiu."
  note:
    en: "So read the requirements below as Ivory Coast's framework, then confirm your dog's exact origin, history and documents with your vet and the DSV before booking."
    fr: "Lis donc les exigences ci-dessous comme le cadre ivoirien, puis confirme l'origine, l'historique et les documents exacts de ton chien avec ton vétérinaire et la DSV avant de réserver."
    es: "Así que lee los requisitos siguientes como el marco de Costa de Marfil y luego confirma el origen, el historial y los documentos exactos de tu perro con tu veterinario y la DSV antes de reservar."
    pt: "Portanto, ler as exigências abaixo como o quadro geral da Costa do Marfim e, em seguida, confirmar a origem exata, o histórico e os documentos do cachorro com o veterinário e a DSV antes de reservar."

requirements:
  - item: { en: "Prior import authorization (autorisation préalable d'importation)", fr: "Autorisation préalable d'importation", es: "Autorización previa de importación (autorisation préalable d'importation)", pt: "Autorização de importação prévia (autorisation préalable d'importation)" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Obtained from the Directorate of Veterinary Services (DSV) of MIRAH before the dog travels. The application form plus a copy of the rabies vaccination record is submitted to the DSV; USDA/APHIS lists the DSV email addresses for the permit.", fr: "Obtenue auprès de la Direction des Services Vétérinaires (DSV) du MIRAH avant le voyage du chien. Le formulaire de demande et une copie du carnet de vaccination antirabique sont adressés à la DSV ; l'USDA/APHIS indique les adresses e-mail de la DSV pour le permis.", es: "Se obtiene de la Dirección de Servicios Veterinarios (DSV) del MIRAH antes de que el perro viaje. El formulario de solicitud junto con una copia de la cartilla de vacunación antirrábica se presenta a la DSV; el USDA/APHIS indica las direcciones de correo de la DSV para el permiso.", pt: "Obtida junto à Direction des Services Vétérinaires (DSV) do MIRAH antes de o cachorro viajar. O formulário de pedido, junto com uma cópia da caderneta de vacinação antirrábica, é enviado à DSV; o USDA/APHIS lista os endereços de e-mail da DSV para a autorização." }
    exceptions: { en: "None documented — no dog should travel without the authorization confirmed by the DSV.", fr: "Aucune documentée — aucun chien ne devrait voyager sans l'autorisation confirmée par la DSV.", es: "Ninguna documentada — ningún perro debería viajar sin la autorización confirmada por la DSV.", pt: "Nenhuma documentada — nenhum cachorro deve viajar sem a autorização confirmada pela DSV." }
    ref: { en: "MIRAH–DSV import authorization form; USDA/APHIS — Pet Travel US to Ivory Coast", fr: "Formulaire d'autorisation d'importation MIRAH–DSV ; USDA/APHIS — Pet Travel US to Ivory Coast", es: "Formulario de autorización de importación MIRAH–DSV; USDA/APHIS — Pet Travel US to Ivory Coast", pt: "Formulário de autorização de importação MIRAH–DSV; USDA/APHIS — Pet Travel EUA para a Costa do Marfim" }
  - item: { en: "Identification (microchip)", fr: "Identification (puce électronique)", es: "Identificación (microchip)", pt: "Identificação (microchip)" }
    required: { en: "Not officially mandated", fr: "Non officiellement imposée", es: "No obligatoria oficialmente", pt: "Não obrigatório oficialmente" }
    when: { en: "The DSV/USDA veterinary certificate identifies the animal by microchip number and/or name; the vet verifies any microchip present. An ISO 11784/11785 microchip is strongly recommended but is not published as a stand-alone obligation.", fr: "Le certificat vétérinaire DSV/USDA identifie l'animal par numéro de puce et/ou nom ; le vétérinaire vérifie toute puce présente. Une puce ISO 11784/11785 est fortement recommandée mais n'est pas publiée comme obligation autonome.", es: "El certificado veterinario DSV/USDA identifica al animal por número de microchip o nombre; el veterinario verifica cualquier microchip presente. Un microchip ISO 11784/11785 se recomienda encarecidamente, pero no se publica como obligación autónoma.", pt: "O certificado veterinário DSV/USDA identifica o animal pelo número do microchip e/ou pelo nome; o veterinário verifica qualquer microchip presente. Um microchip ISO 11784/11785 é fortemente recomendado, mas não é publicado como uma obrigação autônoma." }
    exceptions: { en: "Where a microchip is present it must match the certificate and vaccination record.", fr: "Lorsqu'une puce est présente, elle doit correspondre au certificat et au carnet de vaccination.", es: "Cuando hay un microchip, debe coincidir con el certificado y la cartilla de vacunación.", pt: "Caso haja um microchip, ele deve corresponder ao certificado e à caderneta de vacinação." }
    ref: { en: "DSV/USDA veterinary health certificate for dogs & cats (box 21)", fr: "Certificat vétérinaire DSV/USDA pour chiens et chats (case 21)", es: "Certificado sanitario veterinario DSV/USDA para perros y gatos (casilla 21)", pt: "Atestado de saúde veterinário DSV/USDA para cachorros e gatos (campo 21)" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "The dog must be current on rabies vaccination. If it is a primary vaccination, or a booster given outside the validity of the previous dose, the dog must wait at least 21 days after vaccination before travel.", fr: "Le chien doit être à jour de sa vaccination antirabique. S'il s'agit d'une primovaccination, ou d'un rappel effectué en dehors de la validité de la dose précédente, le chien doit attendre au moins 21 jours après la vaccination avant de voyager.", es: "El perro debe estar al día de su vacunación antirrábica. Si se trata de una primovacunación, o de un refuerzo administrado fuera de la valide de la dosis anterior, el perro debe esperar al menos 21 días tras la vacunación antes de viajar.", pt: "O cachorro deve estar com a vacinação antirrábica em dia. Se for uma primeira dose, ou um reforço aplicado fora da validade da dose anterior, o cachorro deve aguardar pelo menos 21 dias após a vacinação antes de viajar." }
    exceptions: { en: "If the booster is given within the validity of the previous vaccination, no waiting period applies before import.", fr: "Si le rappel est effectué pendant la validité de la vaccination précédente, aucun délai d'attente ne s'applique avant l'importation.", es: "Si el refuerzo se administra durante la valide de la vacunación anterior, no se aplica ningún periodo de espera antes de la importación.", pt: "Se o reforço for aplicado dentro da validade da vacinação anterior, nenhum período de carência se aplica antes da importação." }
    ref: { en: "DSV/USDA veterinary health certificate (statements 5–6)", fr: "Certificat vétérinaire DSV/USDA (mentions 5–6)", es: "Certificado sanitario veterinario DSV/USDA (menciones 5–6)", pt: "Atestado de saúde veterinário DSV/USDA (declarações 5–6)" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not required", fr: "Non requis", es: "No obligatoria", pt: "Não obrigatório" }
    when: { en: "The official DSV/USDA veterinary certificate does not require a rabies antibody test for entry to Ivory Coast; a current rabies vaccination is what is certified.", fr: "Le certificat vétérinaire officiel DSV/USDA n'exige pas de titrage des anticorps antirabiques pour l'entrée en Côte d'Ivoire ; c'est une vaccination antirabique à jour qui est certifiée.", es: "El certificado veterinario oficial DSV/USDA no exige una prueba de titulación de rabia para la entrada a Costa de Marfil; lo que se certifica es una vacunación antirrábica al día.", pt: "O certificado veterinário oficial DSV/USDA não exige um teste sorológico antirrábico para a entrada na Costa do Marfim; o que é certificado é a vacinação antirrábica em dia." }
    exceptions: { en: "None published. Confirm with the DSV if your dog travels from an origin with specific conditions.", fr: "Aucune publiée. Vérifie auprès de la DSV si ton chien voyage depuis une origine soumise à des conditions particulières.", es: "Ninguna publicada. Confirma con la DSV si tu perro viaja desde un origen con condiciones específicas.", pt: "Nenhum publicado. Confirmar com a DSV se o cachorro viajar de uma origem com condições específicas." }
    ref: { en: "DSV/USDA veterinary health certificate for dogs & cats", fr: "Certificat vétérinaire DSV/USDA pour chiens et chats", es: "Certificado sanitario veterinario DSV/USDA para perros y gatos", pt: "Atestado de saúde veterinário DSV/USDA para cachorros e gatos" }
  - item: { en: "International veterinary health certificate (certificate of good health)", fr: "Certificat vétérinaire international (certificat de bonne santé)", es: "Certificado sanitario veterinario internacional (certificado de buena salud)", pt: "Atestado de saúde veterinário internacional (certificate of good health)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "The original certificate of good health is issued by a veterinarian in the country of origin and covers identification, rabies vaccination and clinical health. French is acceptable (the DSV form is bilingual French/English). From the US it is issued by a USDA-accredited vet and endorsed by APHIS, valid 10 days.", fr: "Le certificat de bonne santé original est établi par un vétérinaire du pays d'origine et couvre l'identification, la vaccination antirabique et l'état clinique. Le français est accepté (le formulaire DSV est bilingue français/anglais). Depuis les USA, il est établi par un vétérinaire agréé USDA et visé par l'APHIS, valable 10 jours.", es: "El certificado de buena salud original lo expide un veterinario del país de origen y cubre la identificación, la vacunación antirrábica y el estado clínico. El francés es aceptable (el formulario de la DSV es bilingüe francés/inglés). Desde EE. UU. lo expide un veterinario acreditado por el USDA y lo refrenda APHIS, con valide de 10 días.", pt: "O atestado original de boa saúde é emitido por um veterinário no país de origem e cobre identificação, vacinação antirrábica e saúde clínica. O francês é aceito (o formulário da DSV é bilíngue francês/inglês). Nos Estados Unidos, é emitido por um veterinário credenciado pelo USDA e endossado pela APHIS, válido por 10 dias." }
    exceptions: { en: "None — an official certificate must accompany the dog and be presented with the vaccination record.", fr: "Aucune — un certificat officiel doit accompagner le chien et être présenté avec le carnet de vaccination.", es: "Ninguna — un certificado oficial debe acompañar al perro y presentarse con la cartilla de vacunación.", pt: "Nenhuma — um certificado oficial deve acompanhar o cachorro e ser apresentado junto com a caderneta de vacinação." }
    ref: { en: "MIRAH–DSV import authorization form; DSV/USDA veterinary health certificate", fr: "Formulaire d'autorisation d'importation MIRAH–DSV ; certificat vétérinaire DSV/USDA", es: "Formulario de autorización de importación MIRAH–DSV; certificado sanitario veterinario DSV/USDA", pt: "Formulário de autorização de importação MIRAH–DSV; atestado de saúde veterinário DSV/USDA" }
  - item: { en: "Clinical examination & health statements", fr: "Examen clinique et attestations sanitaires", es: "Examen clínico y declaraciones sanitarias", pt: "Exame clínico e declarações de saúde" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "The dog is inspected and certified free of infectious or contagious disease, free of mange for at least the last 6 months, and originating from an area not quarantined for rabies and not exposed to rabies.", fr: "Le chien est examiné et certifié indemne de maladie infectieuse ou contagieuse, indemne de gale depuis au moins les 6 derniers mois, et provenant d'une zone non placée en quarantaine pour la rage et non exposée à la rage.", es: "El perro se examina y se certifica libre de enfermedad infecciosa o contagiosa, libre de sarna durante al menos los últimos 6 meses, y procedente de una zona no puesta en cuarentena por rabia y no expuesta a la rabia.", pt: "O cachorro é inspecionado e certificado como livre de doenças infecciosas ou contagiosas, livre de sarna nos últimos 6 meses pelo menos, e proveniente de uma área não colocada em quarentena por raiva e não exposto à raiva." }
    exceptions: { en: "None.", fr: "Aucune.", es: "Ninguna.", pt: "Nenhuma." }
    ref: { en: "DSV/USDA veterinary health certificate (statements 2–4)", fr: "Certificat vétérinaire DSV/USDA (mentions 2–4)", es: "Certificado sanitario veterinario DSV/USDA (menciones 2–4)", pt: "Atestado de saúde veterinário DSV/USDA (declarações 2–4)" }
  - item: { en: "Parasite / tapeworm treatment", fr: "Traitement antiparasitaire / échinocoque", es: "Tratamiento antiparasitario / contra la tenia", pt: "Tratamento antiparasitário / contra tênias" }
    required: { en: "Not officially required", fr: "Non officiellement requis", es: "No obligatorio oficialmente", pt: "Não exigido oficialmente" }
    when: { en: "The DSV/USDA certificate treats other vaccinations, treatments and tests as optional entries. No mandatory tapeworm or parasite treatment is published for entry to Ivory Coast.", fr: "Le certificat DSV/USDA traite les autres vaccinations, traitements et tests comme des mentions facultatives. Aucun traitement antiparasitaire ou contre l'échinocoque obligatoire n'est publié pour l'entrée en Côte d'Ivoire.", es: "El certificado DSV/USDA trata las demás vacunaciones, tratamientos y pruebas como menciones opcionales. No se publica ningún tratamiento obligatorio contra la tenia o antiparasitario para la entrada a Costa de Marfil.", pt: "O certificado DSV/USDA trata outras vacinas, tratamentos e testes como itens opcionais. Nenhum tratamento antiparasitário ou contra tênias obrigatório é publicado para a entrada na Costa do Marfim." }
    exceptions: { en: "A vet may still recommend parasite treatment; it is good practice but not a published entry condition.", fr: "Un vétérinaire peut néanmoins recommander un traitement antiparasitaire ; c'est une bonne pratique mais pas une condition d'entrée publiée.", es: "Un veterinario puede recomendar igualmente un tratamiento antiparasitario; es buena práctica, pero no una condición de entrada publicada.", pt: "Um veterinário ainda pode recomendar o tratamento antiparasitário; é uma boa prática, mas não é uma condição de entrada publicada." }
    ref: { en: "DSV/USDA veterinary health certificate (statement 7, optional)", fr: "Certificat vétérinaire DSV/USDA (mention 7, facultative)", es: "Certificado sanitario veterinario DSV/USDA (mención 7, opcional)", pt: "Atestado de saúde veterinário DSV/USDA (declaração 7, opcional)" }
  - item: { en: "Border veterinary inspection & customs declaration", fr: "Inspection vétérinaire frontalière et déclaration en douane", es: "Inspección veterinaria en frontera y declaración en aduana", pt: "Inspeção veterinária na fronteira e declaração aduaneira" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Ivory Coast operates a border veterinary inspection and control service (Service d'Inspection et de Contrôle Sanitaires Vétérinaires en Frontières) at customs offices including ports and airports; present your dog and its documents on arrival.", fr: "La Côte d'Ivoire dispose d'un service d'inspection et de contrôle sanitaires vétérinaires en frontières dans les bureaux de douane, y compris ports et aéroports ; présente ton chien et ses documents à l'arrivée.", es: "Costa de Marfil cuenta con un servicio de inspección y control sanitario veterinario en frontera (Service d'Inspection et de Contrôle Sanitaires Vétérinaires en Frontières) en las oficinas de aduanas, incluidos puertos y aeropuertos; presenta a tu perro y sus documentos a la llegada.", pt: "A Costa do Marfim opera um serviço de inspeção e controle veterinário de fronteira (Service d'Inspection et de Contrôle Sanitaires Vétérinaires en Frontières) em postos aduaneiros, incluindo portos e aeroportos; apresentar o cachorro e seus documentos na chegada." }
    exceptions: { en: "Exact fees and steps for a personal pet at the airport are not published in detail; confirm with the DSV.", fr: "Les frais et étapes exacts pour un animal de compagnie personnel à l'aéroport ne sont pas publiés en détail ; à confirmer auprès de la DSV.", es: "Las tasas y los pasos exactos para una mascota personal en el aeropuerto no se publican en detalle; confírmalos con la DSV.", pt: "As taxas e etapas exatas para um cachorro de companhia particular no aeroporto não são publicadas em detalhe; confirmar junto da DSV." }
    ref: { en: "MIRAH–DSV; GUCE Ivory Coast (PWIC) — Live animals procedure", fr: "MIRAH–DSV ; GUCE Côte d'Ivoire (PWIC) — Procédure animaux vivants", es: "MIRAH–DSV; GUCE Costa de Marfil (PWIC) — Procedimiento de animales vivos", pt: "MIRAH–DSV; GUCE Costa do Marfim (PWIC) — Procedimento para animais vivos" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Linked to rabies vaccination", fr: "Lié à la vaccination antirabique", es: "Vinculada a la vacunación antirrábica", pt: "Vinculada à vacinação antirrábica" }
    when: { en: "A puppy must be old enough to be validly vaccinated against rabies and to meet the certificate's rabies statement. The DSV does not publish a separate stand-alone minimum age.", fr: "Un chiot doit être en âge d'être valablement vacciné contre la rage et de satisfaire à la mention antirabique du certificat. La DSV ne publie pas d'âge minimum distinct spécifique.", es: "Un cachorro debe tener la edad suficiente para ser vacunado válidamente contra la rabia y cumplir la mención antirrábica del certificado. La DSV no publica una edad mínima autónoma aparte.", pt: "O filhote deve ter idade suficiente para ser validamente vacinado contra a raiva e atender à declaração de raiva do certificado. A DSV não publica uma idade mínima autônoma separada." }
    exceptions: { en: "A puppy too young to be vaccinated against rabies cannot meet the requirement.", fr: "Un chiot trop jeune pour être vacciné contre la rage ne peut satisfaire l'exigence.", es: "Un cachorro demasiado joven para ser vacunado contra la rabia no puede cumplir el requisito.", pt: "Um filhote jovem demais para ser vacinado contra a raiva não pode cumprir essa exigência." }
    ref: { en: "DSV/USDA veterinary health certificate (rabies statements)", fr: "Certificat vétérinaire DSV/USDA (mentions antirabiques)", es: "Certificado sanitario veterinario DSV/USDA (menciones antirrábicas)", pt: "Atestado de saúde veterinário DSV/USDA (declarações sobre raiva)" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not specified", fr: "Non prévue", es: "No prevista", pt: "Não especificada" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "No quarantine is set out in the official DSV/USDA import documents for a compliant pet dog; non-compliant animals may be held under veterinary control at the border.", fr: "Aucune quarantaine n'est prévue dans les documents d'importation officiels DSV/USDA pour un chien de compagnie conforme ; les animaux non conformes peuvent être placés sous contrôle vétérinaire à la frontière.", es: "No se establece ninguna cuarentena en los documentos oficiales de importación DSV/USDA para un perro de compañía que cumple los requisitos; los animales no conformes pueden quedar bajo control veterinario en la frontera.", pt: "Nenhuma quarentena é estabelecida nos documentos oficiais de importação DSV/USDA para um cachorro de companhia em conformidade; animais em não conformidade podem ficar retidos sob controle veterinário na fronteira." }
    ref: { en: "DSV/USDA veterinary health certificate (no quarantine requirement)", fr: "Certificat vétérinaire DSV/USDA (aucune exigence de quarantaine)", es: "Certificado sanitario veterinario DSV/USDA (sin exigencia de cuarentena)", pt: "Atestado de saúde veterinário DSV/USDA (sem exigência de quarentena)" }
  - item: { en: "Banned / restricted breeds", fr: "Races interdites / restreintes", es: "Razas prohibidas / restringidas", pt: "Raças proibidas / restritas" }
    required: { en: "No published import ban", fr: "Aucune interdiction d'importation publiée", es: "No hay prohibición de importación publicada", pt: "Nenhuma proibição de importação publicada" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "No national breed-specific import ban for dogs was found in official DSV/MIRAH sources. Confirm current rules with the DSV, as national legislation can change.", fr: "Aucune interdiction d'importation nationale par race de chien n'a été trouvée dans les sources officielles DSV/MIRAH. Vérifie les règles en vigueur auprès de la DSV, la législation nationale pouvant évoluer.", es: "No se encontró ninguna prohibición de importación nacional por raza de perro en las fuentes oficiales DSV/MIRAH. Confirma las normas vigentes con la DSV, ya que la legislación nacional puede cambiar.", pt: "Nenhuma proibição nacional de importação específica por raça para cachorros foi encontrada em fontes oficiais da DSV/MIRAH. Confirmar as regras vigentes junto da DSV, já que a legislação nacional pode mudar." }
    ref: { en: "MIRAH–DSV (no published breed-specific import legislation found)", fr: "MIRAH–DSV (aucune législation d'importation par race publiée trouvée)", es: "MIRAH–DSV (no se encontró legislación de importación por raza publicada)", pt: "MIRAH–DSV (nenhuma legislação de importação específica por raça publicada encontrada)" }

origin:
  scheme: eu
  eu:
    title: { en: "From the European Union", fr: "Depuis l'Union européenne", es: "Desde la Unión Europea", pt: "Da União Europeia" }
    body:
      en: "For a dog leaving the EU, there is no EU pet-passport shortcut into Ivory Coast. You still need a prior import authorization from the DSV, a current rabies vaccination and an international veterinary health certificate issued by an official vet of the country of origin. The dog must come from an area not quarantined for rabies. French-language certificates are accepted."
      fr: "Pour un chien quittant l'UE, il n'existe pas de raccourci « passeport UE » vers la Côte d'Ivoire. Tu as tout de même besoin d'une autorisation préalable d'importation de la DSV, d'une vaccination antirabique à jour et d'un certificat vétérinaire international établi par un vétérinaire officiel du pays d'origine. Le chien doit provenir d'une zone non placée en quarantaine pour la rage. Les certificats en français sont acceptés."
      es: "Para un perro que sale de la UE, no existe un atajo de «pasaporte europeo» hacia Costa de Marfil. Aun así necesitas una autorización previa de importación de la DSV, una vacunación antirrábica al día y un certificado sanitario veterinario internacional expedido por un veterinario oficial del país de origen. El perro debe proceder de una zona no puesta en cuarentena por rabia. Se aceptan los certificados en francés."
      pt: "Para um cachorro que sai da UE, não existe atalho pelo passaporte europeu para animais de estimação rumo à Costa do Marfim. Ainda é preciso ter uma autorização de importação prévia da DSV, uma vacinação antirrábica em dia e um atestado de saúde veterinário internacional emitido por um veterinário oficial do país de origem. O cachorro deve vir de uma área não colocada em quarentena por raiva. Certificados em francês são aceitos."
    cls: warn
  listed:
    title: { en: "From the United States & other third countries", fr: "Depuis les États-Unis et autres pays tiers", es: "Desde Estados Unidos y otros países terceros", pt: "Dos Estados Unidos e de outros países terceiros" }
    body:
      en: "From the US, USDA/APHIS documents the full path: apply to the DSV for the import permit (application form plus a copy of the rabies vaccination certificate), then a USDA-accredited vet issues the veterinary health certificate, endorsed by APHIS within 10 days of travel. If the rabies vaccination is a primary dose or has lapsed, wait at least 21 days before travel. Other third countries follow the same DSV requirements."
      fr: "Depuis les USA, l'USDA/APHIS documente tout le parcours : demande le permis d'importation à la DSV (formulaire de demande et copie du certificat de vaccination antirabique), puis un vétérinaire agréé USDA établit le certificat vétérinaire, visé par l'APHIS dans les 10 jours avant le voyage. Si la vaccination antirabique est une primovaccination ou a expiré, attends au moins 21 jours avant de voyager. Les autres pays tiers suivent les mêmes exigences DSV."
      es: "Desde EE. UU., el USDA/APHIS documenta todo el recorrido: solicita a la DSV el permiso de importación (formulario de solicitud más una copia del certificado de vacunación antirrábica), luego un veterinario acreditado por el USDA expide el certificado sanitario veterinario, refrendado por APHIS dentro de los 10 días previos al viaje. Si la vacunación antirrábica es una dosis primaria o ha caducado, espera al menos 21 días antes de viajar. Los demás países terceros siguen los mismos requisitos de la DSV."
      pt: "Dos EUA, o USDA/APHIS documenta todo o caminho: solicitar à DSV a autorização de importação (formulário de pedido mais uma cópia do certificado de vacinação antirrábica), depois um veterinário credenciado pelo USDA emite o atestado de saúde veterinário, endossado pela APHIS até 10 dias antes da viagem. Se a vacinação antirrábica for uma primeira dose ou estiver vencida, aguardar pelo menos 21 dias antes da viagem. Outros países terceiros seguem as mesmas exigências da DSV."
    cls: warn
  nonListed:
    title: { en: "From a rabies-endemic or other origin", fr: "Depuis une origine endémique pour la rage ou autre", es: "Desde un origen endémico de rabia u otro", pt: "De uma origem de raiva endêmica ou outra" }
    body:
      en: "The core process does not change: prior import authorization, a current rabies vaccination and an international veterinary certificate, with the dog originating from an area not quarantined for rabies. Because Ivory Coast is itself rabies-endemic, the veterinary authorities focus on the rabies status of the dog and its origin. Confirm any additional condition directly with the DSV before you travel."
      fr: "Le processus de base ne change pas : autorisation préalable d'importation, vaccination antirabique à jour et certificat vétérinaire international, le chien provenant d'une zone non placée en quarantaine pour la rage. La Côte d'Ivoire étant elle-même endémique pour la rage, les autorités vétérinaires se concentrent sur le statut rabique du chien et de son origine. Confirme toute condition supplémentaire directement auprès de la DSV avant de voyager."
      es: "El proceso básico no cambia: autorización previa de importación, una vacunación antirrábica al día y un certificado veterinario internacional, con el perro procedente de una zona no puesta en cuarentena por rabia. Como Costa de Marfil es en sí misma endémica de rabia, las autoridades veterinarias se centran en el estatus rábico del perro y de su origen. Confirma cualquier condición adicional directamente con la DSV antes de viajar."
      pt: "O processo essencial não muda: autorização de importação prévia, vacinação antirrábica em dia e certificado veterinário internacional, com o cachorro proveniente de uma área não colocada em quarentena por raiva. Como a própria Costa do Marfim tem raiva endêmica, as autoridades veterinárias se concentram no status de raiva do cachorro e na sua origem. Confirmar qualquer condição adicional diretamente junto da DSV antes de viajar."
    cls: neutral

arrival:
  intro:
    en: "What happens when your dog reaches Ivory Coast depends on your import authorization and the documents you carry."
    fr: "Ce qui se passe à l'arrivée de ton chien en Côte d'Ivoire dépend de ton autorisation d'importation et des documents que tu présente."
    es: "Lo que ocurre cuando tu perro llega a Costa de Marfil depende de tu autorización de importación y de los documentos que lleves."
    pt: "O que acontece quando o cachorro chega à Costa do Marfim depende da autorização de importação e dos documentos levados."
  points:
    - en: "Your dog is presented to the border veterinary inspection service (Service d'Inspection et de Contrôle Sanitaires Vétérinaires en Frontières), which operates at customs offices including ports and the airport."
      fr: "Ton chien est présenté au service d'inspection et de contrôle sanitaires vétérinaires en frontières, qui opère dans les bureaux de douane, y compris les ports et l'aéroport."
      es: "Tu perro se presenta al servicio de inspección y control sanitario veterinario en frontera (Service d'Inspection et de Contrôle Sanitaires Vétérinaires en Frontières), que opera en las oficinas de aduanas, incluidos los puertos y el aeropuerto."
      pt: "O cachorro é apresentado ao serviço de inspeção veterinária de fronteira (Service d'Inspection et de Contrôle Sanitaires Vétérinaires en Frontières), que atua em postos aduaneiros, incluindo portos e o aeroporto."
    - en: "Carry the originals: the prior import authorization, the international veterinary health certificate and the rabies vaccination record."
      fr: "Munis-toi des originaux : l'autorisation préalable d'importation, le certificat vétérinaire international et le carnet de vaccination antirabique."
      es: "Lleva los originales: la autorización previa de importación, el certificado sanitario veterinario internacional y la cartilla de vacunación antirrábica."
      pt: "Levar os originais: a autorização de importação prévia, o atestado de saúde veterinário internacional e a caderneta de vacinação antirrábica."
    - en: "Documents must be consistent — the identification, vaccination and health statements must match across the certificate and the vaccination record."
      fr: "Les documents doivent être cohérents — l'identification, la vaccination et les mentions sanitaires doivent concorder entre le certificat et le carnet de vaccination."
      es: "Los documentos deben ser coherentes — la identificación, la vacunación y las menciones sanitarias deben coincidir entre el certificado y la cartilla de vacunación."
      pt: "Os documentos devem ser coerentes entre si — a identificação, a vacinação e as declarações de saúde devem corresponder entre o certificado e a caderneta de vacinação."
    - en: "If documents are missing, invalid or inconsistent, the animal may be refused, returned or held under veterinary control at the owner's expense."
      fr: "Si les documents manquent, sont invalides ou incohérents, l'animal peut être refusé, renvoyé ou placé sous contrôle vétérinaire aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos o coherentes, el animal puede ser rechazado, devuelto o retenido bajo control veterinario a cargo del propietario."
      pt: "Se os documentos estiverem incompletos, inválidos ou inconsistentes, o animal pode ser recusado, devolvido ou retido sob controle veterinário às custas do proprietário."
    - en: "Exact airport fees and steps for a personal pet are not published in detail; ask the DSV when it confirms your import authorization."
      fr: "Les frais et étapes exacts à l'aéroport pour un animal de compagnie personnel ne sont pas publiés en détail ; renseigne-toi auprès de la DSV lorsqu'elle confirme ton autorisation d'importation."
      es: "Las tasas y los pasos exactos en el aeropuerto para una mascota personal no se publican en detalle; consúltalos con la DSV cuando confirme tu autorización de importación."
      pt: "As taxas e etapas exatas no aeroporto para um cachorro de companhia particular não são publicadas em detalhe; perguntar à DSV quando ela confirmar a autorização de importação."

