# Country Entry Guide — Ivory Coast / Côte d'Ivoire (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_ci
iso2: "CI"
name: { en: "Ivory Coast", fr: "Côte d'Ivoire", es: "Costa de Marfil", pt: "Costa do Marfim" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
exit:
  authority: DSV (MIRAH)
  authorityUrl: https://ressourcesanimales.gouv.ci/direction/direction-des-services-veterinaires-dsv/
  intro:
    en: "Ivory Coast is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus a health certificate validated by the Veterinary Services (DSV)."
    fr: "La Côte d'Ivoire est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire validé par les Services vétérinaires (DSV)."
    es: "Costa de Marfil no está listada: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario validado por los Servicios Veterinarios (DSV)."
    pt: "A Costa do Marfim é um país não listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde validado pelos Serviços Veterinários (DSV)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Providenciar com antecedência o teste sorológico antirrábico (titulação): exame de sangue em laboratório aprovado pela UE, pelo menos 30 dias após a vacinação — um resultado válido é indispensável para voltar à UE e não pode ser resolvido de última hora."
    - timing: window
      scope: any
      text:
        en: "Request the health certificate from an authorized vet a few days before departure (in French or with an official translation); it is validated within the DSV/MIRAH framework, which runs border sanitary control."
        fr: "Demande le certificat sanitaire à un vétérinaire autorisé quelques jours avant le départ (en français ou avec traduction officielle) ; il est validé dans le cadre DSV/MIRAH, qui assure le contrôle sanitaire aux frontières."
        es: "Solicita el certificado sanitario a un veterinario autorizado unos días antes de salir (en francés o con traducción oficial); se valida en el marco DSV/MIRAH, que ejerce el control sanitario fronterizo."
        pt: "Solicitar o atestado de saúde a um veterinário autorizado alguns dias antes da partida (em francês ou com tradução oficial); ele é validado dentro do quadro da DSV/MIRAH, que administra o controle sanitário de fronteira."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o cachorro já tinha um teste sorológico antirrábico (titulação) válido para a UE antes da partida, ele permanece válido por toda a vida enquanto a vacinação antirrábica estiver em dia — vale a pena verificar isso antes de viajar."

hero:
  h1: { en: "Traveling to Ivory Coast with your dog", fr: "Voyager en Côte d'Ivoire avec ton chien", es: "Viajar a Costa de Marfil con tu perro", pt: "Viajar para a Costa do Marfim com seu cachorro" }
  intro:
    en: >-
      Ivory Coast welcomes pet dogs, but entry runs through the country's own scheme managed by the
      Direction des Services Vétérinaires (DSV) of the Ministère des Ressources Animales et Halieutiques
      (MIRAH), not the EU framework. Every dog needs a prior import authorization (autorisation préalable
      d'importation) obtained before travel, a valid rabies vaccination and an international veterinary
      health certificate (certificate of good health) issued by a veterinarian in the country of origin.
      Ivory Coast is a rabies-endemic country, so the rabies rule is central: the dog must come from an
      area not quarantined for rabies and be current on its vaccination. On arrival, your dog is presented
      to the border veterinary inspection service, which operates at ports and airports. This guide explains
      the import authorization, the rabies rule and the certificate so you know exactly what to prepare
      before you book your flight.
    fr: >-
      La Côte d'Ivoire accueille les chiens, mais l'entrée passe par le dispositif propre au pays, géré par
      la Direction des Services Vétérinaires (DSV) du Ministère des Ressources Animales et Halieutiques
      (MIRAH), et non par le cadre de l'UE. Chaque chien doit disposer d'une autorisation préalable
      d'importation obtenue avant le voyage, d'une vaccination antirabique valide et d'un certificat
      vétérinaire international (certificat de bonne santé) établi par un vétérinaire du pays d'origine.
      La Côte d'Ivoire est un pays où la rage est endémique : la règle antirabique est donc centrale — le
      chien doit provenir d'une zone non placée en quarantaine pour la rage et être à jour de sa
      vaccination. À l'arrivée, ton chien est présenté au service d'inspection vétérinaire aux frontières,
      qui opère dans les ports et aéroports. Ce guide détaille l'autorisation d'importation, la règle
      antirabique et le certificat, pour savoir exactement quoi préparer avant de réserver ton vol.
    es: >-
      Costa de Marfil acoge a los perros de compañía, pero la entrada se rige por el sistema propio del
      país gestionado por la Direction des Services Vétérinaires (DSV) del Ministère des Ressources
      Animales et Halieutiques (MIRAH), y no por el marco de la UE. Cada perro necesita una autorización
      previa de importación (autorisation préalable d'importation) obtenida antes del viaje, una vacunación
      antirrábica válida y un certificado sanitario veterinario internacional (certificado de buena salud)
      expedido por un veterinario del país de origen. Costa de Marfil es un país donde la rabia es
      endémica, por lo que la norma antirrábica es central: el perro debe proceder de una zona no puesta en
      cuarentena por rabia y estar al día de su vacunación. A la llegada, tu perro se presenta al servicio
      de inspección veterinaria en frontera, que opera en puertos y aeropuertos. Esta guía explica la
      autorización de importación, la norma antirrábica y el certificado para que sepas exactamente qué
      preparar antes de reservar tu vuelo.

    pt: "A Costa do Marfim recebe cachorros de companhia, mas a entrada segue um esquema próprio do país, administrado pela Direction des Services Vétérinaires (DSV) do Ministère des Ressources Animales et Halieutiques (MIRAH), e não o modelo europeu. Todo cachorro precisa de uma autorização de importação prévia (autorisation préalable d'importation) obtida antes da viagem, de uma vacinação antirrábica válida e de um atestado de saúde veterinário internacional (certificate of good health) emitido por um veterinário no país de origem. A Costa do Marfim é um país de raiva endêmica, por isso a regra da raiva é central: o cachorro deve vir de uma área não colocada em quarentena por raiva e estar com a vacinação em dia. Na chegada, o cachorro é apresentado ao serviço de inspeção veterinária de fronteira, que atua em portos e aeroportos. Este guia explica a autorização de importação, a regra da raiva e o atestado, para que você saiba exatamente o que preparar antes de reservar o voo."
difficulty:
  level: moderate
  label: { en: "Moderate — prior import authorization + veterinary certificate required", fr: "Modéré — autorisation préalable d'importation et certificat vétérinaire requis", es: "Moderado — se requieren autorización previa de importación y certificado veterinario", pt: "Moderado — autorização de importação prévia + certificado veterinário obrigatórios" }

prepTime:
  eu:
    en: "From the EU: allow a few weeks. Identification and rabies vaccination should already be in order, then obtain the prior import authorization from the DSV and the international veterinary certificate close to departure."
    fr: "Depuis l'UE : prévois quelques semaines. L'identification et la vaccination antirabique doivent déjà être en règle, puis obtiens l'autorisation préalable d'importation auprès de la DSV et le certificat vétérinaire international peu avant le départ."
    es: "Desde la UE: reserva unas semanas. La identificación y la vacunación antirrábica deben estar ya en regla y, después, obtén la autorización previa de importación de la DSV y el certificado veterinario internacional poco antes de la salida."
    pt: "Da UE: contar com algumas semanas. A identificação e a vacinação antirrábica já devem estar em dia; depois, obter a autorização de importação prévia junto da DSV e o certificado veterinário internacional perto da partida."
  listed:
    en: "From the United States and other third countries: similar timing. USDA/APHIS documents the DSV import-permit process; allow at least 21 days if the rabies vaccination is a primary dose or has lapsed."
    fr: "Depuis les États-Unis et d'autres pays tiers : délais comparables. L'USDA/APHIS documente la procédure de permis d'importation de la DSV ; prévois au moins 21 jours si la vaccination antirabique est une primovaccination ou a expiré."
    es: "Desde Estados Unidos y otros países terceros: plazos similares. El USDA/APHIS documenta el proceso de permiso de importación de la DSV; reserva al menos 21 días si la vacunación antirrábica es una dosis primaria o ha caducado."
    pt: "Dos Estados Unidos e de outros países terceiros: prazo semelhante. O USDA/APHIS documenta o processo de autorização de importação da DSV; contar com pelo menos 21 dias se a vacinação antirrábica for uma primeira dose ou estiver vencida."
  nonListed:
    en: "From a rabies-endemic or other origin: the same core steps apply — import authorization, current rabies vaccination and veterinary certificate. Confirm any additional condition directly with the DSV before booking."
    fr: "Depuis une origine où la rage est endémique ou toute autre origine : les mêmes étapes de base s'appliquent — autorisation d'importation, vaccination antirabique à jour et certificat vétérinaire. Confirme toute condition supplémentaire directement auprès de la DSV avant de réserver."
    es: "Desde un origen donde la rabia es endémica u otro origen: se aplican los mismos pasos básicos — autorización de importación, vacunación antirrábica al día y certificado veterinario. Confirma cualquier condición adicional directamente con la DSV antes de reservar."
    pt: "De uma origem de raiva endêmica ou outra: aplicam-se as mesmas etapas essenciais — autorização de importação, vacinação antirrábica em dia e certificado veterinário. Confirmar qualquer condição adicional diretamente junto da DSV antes de reservar."

