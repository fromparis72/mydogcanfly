restrictedDogs:
  intro:
    en: "No national breed-specific import ban for dogs was found in the official sources of the DSV or MIRAH. Entry to Ivory Coast is controlled through the import authorization and the veterinary health requirements, not through a published list of prohibited breeds."
    fr: "Aucune interdiction d'importation nationale par race de chien n'a été trouvée dans les sources officielles de la DSV ou du MIRAH. L'entrée en Côte d'Ivoire est encadrée par l'autorisation d'importation et les exigences sanitaires vétérinaires, non par une liste publiée de races interdites."
    es: "No se encontró ninguna prohibición de importación nacional por raza de perro en las fuentes oficiales de la DSV o del MIRAH. La entrada a Costa de Marfil se controla mediante la autorización de importación y los requisitos sanitarios veterinarios, no mediante una lista publicada de razas prohibidas."
    pt: "Nenhuma proibição nacional de importação específica por raça para cachorros foi encontrada nas fontes oficiais da DSV ou do MIRAH. A entrada na Costa do Marfim é controlada por meio da autorização de importação e das exigências sanitárias veterinárias, e não por uma lista publicada de raças proibidas."
  cat1:
    en: "No official list of prohibited dog breeds and no national breed-specific import ban was located in DSV/MIRAH publications. This is the absence of a published rule, not a confirmation that any breed is guaranteed admissible."
    fr: "Aucune liste officielle de races de chiens interdites ni interdiction d'importation nationale par race n'a été trouvée dans les publications DSV/MIRAH. Il s'agit de l'absence d'une règle publiée, non d'une confirmation qu'une race serait garantie admissible."
    es: "No se localizó ninguna lista oficial de razas de perros prohibidas ni ninguna prohibición de importación nacional por raza en las publicaciones de la DSV/MIRAH. Se trata de la ausencia de una norma publicada, no de una confirmación de que se garantice la admisión de raza alguna."
    pt: "Nenhuma lista oficial de raças de cachorros proibidas e nenhuma proibição nacional de importação específica por raça foram localizadas nas publicações da DSV/MIRAH. Trata-se da ausência de uma regra publicada, não da confirmação de que qualquer raça tenha entrada garantida."
  cat2:
    en: "Because national legislation can change and local rules may exist, confirm the status of your specific breed with the DSV before you travel, especially for guard or fighting-type dogs."
    fr: "La législation nationale pouvant évoluer et des règles locales pouvant exister, confirme le statut de ta race précise auprès de la DSV avant de voyager, en particulier pour les chiens de garde ou de type combat."
    es: "Como la legislación nacional puede cambiar y pueden existir normas locales, confirma el estatus de tu raza concreta con la DSV antes de viajar, especialmente para perros de guarda o de tipo pelea."
    pt: "Como a legislação nacional pode mudar e podem existir regras locais, confirmar a situação da raça específica junto da DSV antes de viajar, especialmente para cachorros de guarda ou de tipo combate."
  note:
    en: "Treat any breed question as unresolved until the DSV confirms it in writing with your import authorization."
    fr: "Considère toute question de race comme non tranchée tant que la DSV ne l'a pas confirmée par écrit avec ton autorisation d'importation."
    es: "Considera cualquier cuestión de raza como no resuelta hasta que la DSV la confirme por escrito con tu autorización de importación."
    pt: "Tratar qualquer dúvida sobre raça como não resolvida até que a DSV confirme por escrito junto com a autorização de importação."

checklist:
  - en: "Apply to the DSV (MIRAH) for the prior import authorization before travel"
    fr: "Demande à la DSV (MIRAH) l'autorisation préalable d'importation avant le voyage"
    es: "Solicita a la DSV (MIRAH) la autorización previa de importación antes del viaje"
    pt: "Solicitar à DSV (MIRAH) a autorização de importação prévia antes da viagem"
  - en: "Valid rabies vaccination, current and correctly recorded (allow 21 days if primary/lapsed)"
    fr: "Vaccination antirabique valide, à jour et correctement consignée (prévoir 21 jours si primovaccination/expirée)"
    es: "Vacunación antirrábica válida, al día y correctamente registrada (prevé 21 días si es primovacunación/caducada)"
    pt: "Vacinação antirrábica válida, em dia e corretamente registrada (aguardar 21 dias se for primeira dose ou estiver vencida)"
  - en: "Identification recorded (ISO microchip recommended) and matching all documents"
    fr: "Identification consignée (puce ISO recommandée) et concordant avec tous les documents"
    es: "Identificación registrada (microchip ISO recomendado) que coincida con todos los documentos"
    pt: "Identificação registrada (microchip ISO recomendado) e correspondente a todos os documentos"
  - en: "International veterinary health certificate (certificate of good health) from an official vet of origin"
    fr: "Certificat vétérinaire international (certificat de bonne santé) d'un vétérinaire officiel d'origine"
    es: "Certificado sanitario veterinario internacional (certificado de buena salud) de un veterinario oficial de origen"
    pt: "Atestado de saúde veterinário internacional (certificate of good health) emitido por um veterinário oficial de origem"
  - en: "From the US: certificate endorsed by APHIS within 10 days of travel"
    fr: "Depuis les USA : certificat visé par l'APHIS dans les 10 jours avant le voyage"
    es: "Desde EE. UU.: certificado refrendado por APHIS dentro de los 10 días previos al viaje"
    pt: "Dos EUA: certificado endossado pela APHIS até 10 dias antes da viagem"
  - en: "Original documents ready for the border veterinary inspection at the airport/port"
    fr: "Documents originaux prêts pour l'inspection vétérinaire à la frontière (aéroport/port)"
    es: "Documentos originales listos para la inspección veterinaria en frontera (aeropuerto/puerto)"
    pt: "Documentos originais prontos para a inspeção veterinária de fronteira no aeroporto/porto"
  - en: "Confirm any breed or additional condition with the DSV before booking"
    fr: "Confirme toute question de race ou condition supplémentaire auprès de la DSV avant de réserver"
    es: "Confirma cualquier cuestión de raza o condición adicional con la DSV antes de reservar"
    pt: "Confirmar qualquer condição adicional ou relativa à raça junto da DSV antes de reservar"
  - en: "Airline reservation confirming your dog's travel option and suitable IATA crate"
    fr: "Réservation confirmant l'option de transport de ton chien et caisse IATA adaptée"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y una jaula IATA adecuada"
    pt: "Reserva na companhia aérea confirmando a opção de transporte do seu cachorro e caixa de transporte adequada às normas da IATA"

