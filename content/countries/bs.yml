# Country Entry Guide — The Bahamas (source of truth, bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_bs
iso2: "BS"
name: { en: "The Bahamas", fr: "Bahamas", es: "Bahamas", pt: "Bahamas" }
region: { en: "Caribbean", fr: "Caraïbes", es: "Caribe", pt: "Caribe" }


regime: non_listed
exit:
  authority: BAHFSA
  authorityUrl: https://bahfsabahamas.com/sectors/animals
  intro:
    en: "Bahamas is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Bahamas Agricultural Health and Food Safety Authority (BAHFSA)."
    fr: "Les Bahamas est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par la Bahamas Agricultural Health and Food Safety Authority (BAHFSA)."
    es: "Bahamas no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por la Bahamas Agricultural Health and Food Safety Authority (BAHFSA)."
    pt: "As Bahamas são um país não listado, então uma titulação de anticorpos antirrábicos válida é obrigatória para voltar à UE — além de um atestado de saúde de exportação endossado pela Bahamas Agricultural Health and Food Safety Authority (BAHFSA)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "BAHFSA's Veterinary Services Unit is the national competent authority; an international veterinary certificate endorsed by a registered official vet is required to leave."
        fr: "L'unité des services vétérinaires de la BAHFSA est l'autorité nationale compétente ; un certificat vétérinaire international visé par un vétérinaire officiel enregistré est exigé pour partir."
        es: "La Unidad de Servicios Veterinarios de BAHFSA es la autoridad nacional competente; se exige un certificado veterinario internacional refrendado por un veterinario oficial registrado para salir."
        pt: "A Unidade de Serviços Veterinários da BAHFSA é a autoridade nacional competente; para sair, é exigido um certificado veterinário internacional endossado por um veterinário oficial registrado."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to The Bahamas with your dog", fr: "Voyager aux Bahamas avec ton chien", es: "Viajar a Bahamas con tu perro", pt: "Viajar para as Bahamas com o seu cachorro" }
  intro:
    en: >-
      The Bahamas welcomes dogs, but unlike many destinations it requires an import permit obtained in
      advance for every dog and cat — you cannot simply arrive with your pet. Permits are issued by the
      Bahamas Agricultural Health and Food Safety Authority (BAHFSA) through the Customs Click2Clear
      platform, and the permit must accompany the animal on entry. Beyond the permit, your dog must be
      more than six months old, carry an ISO microchip, be vaccinated against rabies and several core
      diseases, be free of internal and external parasites, and travel with an international veterinary
      certificate issued shortly before departure. What exactly you must prepare also depends on whether
      your dog is leaving a country that is rabies-free or not, because that changes the rabies-vaccine
      timing. This guide explains each step before you book your flight.
    fr: >-
      Les Bahamas accueillent les chiens, mais contrairement à de nombreuses destinations, elles exigent
      un permis d'importation obtenu à l'avance pour chaque chien et chat — tu ne peux pas simplement
      arriver avec ton animal. Les permis sont délivrés par la Bahamas Agricultural Health and Food
      Safety Authority (BAHFSA) via la plateforme douanière Click2Clear, et le permis doit accompagner
      l'animal à l'entrée. Au-delà du permis, ton chien doit avoir plus de six mois, porter une puce
      ISO, être vacciné contre la rage et plusieurs maladies de base, être exempt de parasites internes et
      externes, et voyager avec un certificat vétérinaire international établi peu avant le départ. Ce que
      tu dois préparer dépend aussi du fait que ton chien quitte un pays indemne ou non de rage, car
      cela change le calendrier du vaccin antirabique. Ce guide détaille chaque étape avant de réserver.
    es: >-
      Bahamas acoge a los perros, pero, a diferencia de muchos destinos, exige un permiso de importación
      obtenido por adelantado para cada perro y gato — no puedes simplemente llegar con tu mascota. Los
      permisos los expide la Bahamas Agricultural Health and Food Safety Authority (BAHFSA) a través de
      la plataforma aduanera Click2Clear, y el permiso debe acompañar al animal a la entrada. Más allá
      del permiso, tu perro debe tener más de seis meses, llevar un microchip ISO, estar vacunado contra
      la rabia y varias enfermedades básicas, estar libre de parásitos internos y externos, y viajar con
      un certificado veterinario internacional expedido poco antes de la salida. Lo que debes preparar
      exactamente depende también de si tu perro sale de un país libre de rabia o no, porque eso cambia
      el calendario de la vacuna antirrábica. Esta guía explica cada paso antes de reservar tu vuelo.

    pt: "As Bahamas recebem cachorros, mas, ao contrário de muitos destinos, exigem uma autorização de importação obtida com antecedência para cada cachorro e gato — você não pode simplesmente chegar com o seu animal. As autorizações são emitidas pela Bahamas Agricultural Health and Food Safety Authority (BAHFSA) pela plataforma alfandegária Click2Clear, e a autorização precisa acompanhar o animal na entrada. Além da autorização, o seu cachorro precisa ter mais de seis meses, portar um microchip ISO, estar vacinado contra a raiva e várias doenças essenciais, estar livre de parasitas internos e externos e viajar com um certificado veterinário internacional emitido pouco antes da partida. O que exatamente você precisa preparar também depende de o seu cachorro sair de um país livre de raiva ou não, porque isso muda o calendário da vacina antirrábica. Este guia explica cada etapa antes de você comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Moderate — a prior import permit is mandatory, plus vaccines and a vet certificate", fr: "Modéré — un permis d'importation préalable est obligatoire, plus vaccins et certificat vétérinaire", es: "Moderado — un permiso de importación previo es obligatorio, más vacunas y un certificado veterinario", pt: "Moderado — é obrigatória uma autorização de importação prévia, além das vacinas e de um certificado veterinário" }

prepTime:
  eu:
    en: "Core timeline: apply for the BAHFSA import permit through Click2Clear (processed within about two business days), then have a vet complete the veterinarian form 24 hours before travel and the international certificate within 10 days of import."
    fr: "Calendrier de base : demande le permis d'importation BAHFSA via Click2Clear (traité en environ deux jours ouvrables), puis fais remplir le formulaire vétérinaire 24 heures avant le voyage et le certificat international dans les 10 jours précédant l'import."
    es: "Calendario básico: solicita el permiso de importación de la BAHFSA a través de Click2Clear (procesado en unos dos días hábiles), luego haz que un veterinario rellene el formulario veterinario 24 horas antes del viaje y el certificado internacional dentro de los 10 días previos a la importación."
    pt: "Prazo principal: solicite a autorização de importação da BAHFSA pelo Click2Clear (processada em cerca de dois dias úteis), depois peça a um veterinário que preencha o formulário veterinário 24 horas antes da viagem e o certificado internacional nos 10 dias anteriores à importação."
  listed:
    en: "From a rabies-free country: quickest, provided the dog is already immunized against rabies and the core diseases — you mainly need the permit and the certificate within the required windows."
    fr: "Depuis un pays indemne de rage : le plus rapide, si le chien est déjà immunisé contre la rage et les maladies de base — il faut surtout le permis et le certificat dans les délais requis."
    es: "Desde un país libre de rabia: lo más rápido, siempre que el perro ya esté inmunizado contra la rabia y las enfermedades básicas — necesitas sobre todo el permiso y el certificado dentro de las ventanas requeridas."
    pt: "De um país livre de raiva: é o caminho mais rápido, desde que o cachorro já esteja imunizado contra a raiva e as doenças essenciais — você precisa basicamente da autorização e do certificado dentro dos prazos exigidos."
  nonListed:
    en: "From a country not free of rabies: allow at least about one month — a one-year rabies vaccine must be given at least 1 month (and no more than 10 months) before import; a three-year vaccine no more than 34 months and no less than 1 month before."
    fr: "Depuis un pays non indemne de rage : prévois au moins environ un mois — un vaccin antirabique d'un an doit être administré au moins 1 mois (et au plus 10 mois) avant l'import ; un vaccin de trois ans au plus 34 mois et au moins 1 mois avant."
    es: "Desde un país no libre de rabia: prevé al menos alrededor de un mes — una vacuna antirrábica de un año debe administrarse al menos 1 mes (y no más de 10 meses) antes de la importación; una vacuna de tres años no más de 34 meses y no menos de 1 mes antes."
    pt: "De um país não livre de raiva: reserve pelo menos cerca de um mês — a vacina antirrábica de um ano precisa ser aplicada no mínimo 1 mês (e no máximo 10 meses) antes da importação; a vacina de três anos, no máximo 34 meses e no mínimo 1 mês antes."

