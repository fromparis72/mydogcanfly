    pt: "Cachorro com mais de 6 meses na importação"
  - en: "Rabies vaccination valid in the required window for your departure country (rabies-free vs not)"
    fr: "Vaccination antirabique valide dans la fenêtre requise selon le pays de départ (indemne ou non de rage)"
