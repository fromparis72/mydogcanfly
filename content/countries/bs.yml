    pt: "Certificado veterinário internacional emitido nos 10 dias anteriores à importação (em inglês)"
  - en: "BAHFSA veterinarian form (AGR/VS/1A) completed 24 hours before travel"
    fr: "Formulaire vétérinaire BAHFSA (AGR/VS/1A) rempli 24 heures avant le voyage"
    es: "Formulario veterinario de la BAHFSA (AGR/VS/1A) cumplimentado 24 horas antes del viaje"
    pt: "Formulário veterinário da BAHFSA (AGR/VS/1A) preenchido 24 horas antes da viagem"
  - en: "72 hours' advance notice given to BAHFSA Veterinary Services"
    fr: "Préavis de 72 heures donné aux services vétérinaires de la BAHFSA"
    es: "Aviso previo de 72 horas dado a los Servicios Veterinarios de la BAHFSA"
    pt: "Aviso prévio de 72 horas dado aos Serviços Veterinários da BAHFSA"
  - en: "Airline reservation and suitable IATA crate if travelling in the hold"
    fr: "Réservation compagnie et caisse IATA adaptée si voyage en soute"
    es: "Reserva de la aerolínea y jaula adecuada conforme a la IATA si viaja en bodega"
    pt: "Reserva na companhia aérea e caixa de transporte adequada às normas IATA se for viajar no porão"

