# Country Entry Guide — Djibouti (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_dj
iso2: "DJ"
name: { en: "Djibouti", fr: "Djibouti", es: "Yibuti", pt: "Djibuti" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
exit:
  authority: DESV
  authorityUrl: http://www.maem.dj/index.php?id_page=4
  intro:
    en: "Djibouti is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Direction de l'Élevage et des Services Vétérinaires (DESV)."
    fr: "Djibouti est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par la Direction de l'Élevage et des Services Vétérinaires (DESV)."
    es: "Yibuti no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por la Direction de l'Élevage et des Services Vétérinaires (DESV)."
    pt: "O Djibuti é um país não listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação endossado pela Direction de l'Élevage et des Services Vétérinaires (DESV)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Providenciar com antecedência o teste sorológico antirrábico (titulação): exame de sangue em laboratório aprovado pela UE, pelo menos 30 dias após a vacinação — um resultado válido é indispensável para voltar à UE e não pode ser resolvido de última hora."
    - timing: window
      scope: any
      text:
        en: "The DESV inspects animals destined for export and issues the sanitary certificate before departure."
        fr: "La DESV inspecte les animaux destinés à l'export et délivre le certificat sanitaire avant le départ."
        es: "La DESV inspecciona los animales destinados a la exportación y emite el certificado sanitario antes de salir."
        pt: "A DESV inspeciona os animais destinados à exportação e emite o certificado sanitário antes da partida."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o cachorro já tinha um teste sorológico antirrábico (titulação) válido para a UE antes da partida, ele permanece válido por toda a vida enquanto a vacinação antirrábica estiver em dia — vale a pena verificar isso antes de viajar."

hero:
  h1: { en: "Traveling to Djibouti with your dog", fr: "Voyager à Djibouti avec ton chien", es: "Viajar a Yibuti con tu perro", pt: "Viajar para o Djibuti com seu cachorro" }
  intro:
    en: >-
      Djibouti is not an EU country, and entry for a dog is controlled by its own veterinary authority —
      the Direction de l'Élevage et des Services Vétérinaires (DESV), part of the Ministère de
      l'Agriculture, de l'Eau, de la Pêche, chargé de l'Élevage et des Ressources Halieutiques (MAEM).
      Djibouti publishes almost nothing about pet-dog entry. USDA APHIS confirms that, for species other
      than poultry, the requirements are "not known" and directs travellers to have the importer apply for
      an import permit at the appropriate ministry — that permit is what sets the exact conditions for your
      dog. The DESV does run veterinary posts at the country's main animal entry borders and issues health
      certificates for companion animals (dogs and cats), and Djibouti operates a livestock quarantine
      centre, so a health certificate, a veterinary check and a possible quarantine are realistic, but the
      precise microchip, rabies, blood-test and timing rules are not published. This guide states what is
      officially confirmed and flags clearly what remains unpublished, so you know what to ask before you
      book.
    fr: >-
      Djibouti n'est pas un pays de l'UE, et l'entrée d'un chien est contrôlée par sa propre autorité
      vétérinaire — la Direction de l'Élevage et des Services Vétérinaires (DESV), rattachée au Ministère
      de l'Agriculture, de l'Eau, de la Pêche, chargé de l'Élevage et des Ressources Halieutiques (MAEM).
      Djibouti ne publie presque rien sur l'entrée des chiens de compagnie. L'USDA APHIS confirme que,
      pour les espèces autres que la volaille, les exigences sont « non connues » et invite l'importateur
      à demander un permis d'importation auprès du ministère compétent — c'est ce permis qui fixe les
      conditions exactes pour ton chien. La DESV dispose de postes vétérinaires aux principales
      frontières d'entrée des animaux et délivre des certificats de santé pour les animaux de compagnie
      (chiens et chats), et Djibouti exploite un centre de quarantaine pour le bétail : un certificat
      sanitaire, un contrôle vétérinaire et une éventuelle quarantaine sont donc plausibles, mais les
      règles précises de puce, de rage, de test sanguin et de calendrier ne sont pas publiées. Ce guide
      indique ce qui est officiellement confirmé et signale clairement ce qui reste non publié, pour
      savoir quoi demander avant de réserver.
    es: >-
      Yibuti no es un país de la UE, y la entrada de un perro está controlada por su propia autoridad
      veterinaria — la Direction de l'Élevage et des Services Vétérinaires (DESV), dependiente del
      Ministère de l'Agriculture, de l'Eau, de la Pêche, chargé de l'Élevage et des Ressources
      Halieutiques (MAEM). Yibuti no publica casi nada sobre la entrada de perros de compañía. El USDA
      APHIS confirma que, para las especies distintas de las aves de corral, los requisitos son «no
      conocidos» y remite a los viajeros a que el importador solicite un permiso de importación en el
      ministerio competente — ese permiso es lo que fija las condiciones exactas para tu perro. La DESV
      sí gestiona puestos veterinarios en las principales fronteras de entrada de animales del país y
      expide certificados sanitarios para los animales de compañía (perros y gatos), y Yibuti opera un
      centro de cuarentena para el ganado, por lo que un certificado sanitario, un control veterinario y
      una posible cuarentena son realistas, pero las reglas precisas de microchip, rabia, análisis de
      sangre y plazos no están publicadas. Esta guía indica lo que está oficialmente confirmado y señala
      con claridad lo que sigue sin publicarse, para que sepas qué preguntar antes de reservar.

    pt: "O Djibuti não é um país da UE, e a entrada de um cachorro é controlada pela sua própria autoridade veterinária — a Direction de l'Élevage et des Services Vétérinaires (DESV), parte do Ministère de l'Agriculture, de l'Eau, de la Pêche, chargé de l'Élevage et des Ressources Halieutiques (MAEM). O Djibuti publica quase nada sobre a entrada de cachorros de companhia. O USDA APHIS confirma que, para espécies além das aves, as exigências \"não são conhecidas\" e orienta os viajantes a que o importador solicite uma autorização de importação junto ao ministério competente — essa autorização é o que define as condições exatas para o cachorro. A DESV opera postos veterinários nas principais fronteiras de entrada de animais do país e emite atestados de saúde para animais de companhia (cachorros e gatos), e o Djibuti opera um centro de quarentena de animais de criação, de modo que um atestado de saúde, uma verificação veterinária e uma possível quarentena são cenários realistas, mas as regras precisas sobre microchip, raiva, exame de sangue e calendário não são publicadas. Este guia expõe o que é oficialmente confirmado e assinala claramente o que permanece não comunicado, para que você saiba o que perguntar antes de reservar."
difficulty:
  level: difficult
  label: { en: "Difficult — import permit via the ministry, almost no published specifics", fr: "Difficile — permis d'importation via le ministère, quasiment aucun détail publié", es: "Difícil — permiso de importación a través del ministerio, casi ningún detalle publicado", pt: "Difícil — autorização de importação via ministério, quase nenhum detalhe publicado" }

prepTime:
  eu:
    en: "From Europe: no EU-passport shortcut. Allow well ahead of travel to have the importer obtain an import permit from the ministry (MAEM/DESV) and an official government-vet health certificate; the permit sets the exact conditions, so start early and confirm the timeline with the authority."
    fr: "Depuis l'Europe : aucun raccourci « passeport UE ». Prévois largement avant le départ pour que l'importateur obtienne un permis d'importation auprès du ministère (MAEM/DESV) et un certificat sanitaire officiel du vétérinaire gouvernemental ; le permis fixe les conditions exactes, alors anticipe et confirme le calendrier avec l'autorité."
    es: "Desde Europa: no hay atajo de «pasaporte UE». Prevé mucho tiempo antes del viaje para que el importador obtenga un permiso de importación del ministerio (MAEM/DESV) y un certificado sanitario oficial del veterinario gubernamental; el permiso fija las condiciones exactas, así que empieza pronto y confirma los plazos con la autoridad."
    pt: "Da Europa: nenhum atalho pelo passaporte europeu. Providenciar com bastante antecedência para que o importador obtenha uma autorização de importação junto ao ministério (MAEM/DESV) e um atestado de saúde veterinário governamental oficial; a autorização define as condições exatas, portanto começar cedo e confirmar o prazo com a autoridade."
  listed:
    en: "Djibouti does not publish a listed-country / origin-tiering scheme for pet entry. The same import-permit and health-certificate approach applies; plan around the permit, not around an origin list."
    fr: "Djibouti ne publie pas de schéma de pays « listés » ni de classement par origine pour l'entrée des animaux. La même logique de permis et de certificat s'applique ; organise-toi autour du permis, pas d'une liste d'origine."
    es: "Yibuti no publica un esquema de países «listados» ni de clasificación por origen para la entrada de animales. Se aplica el mismo enfoque de permiso de importación y certificado sanitario; organízate en torno al permiso, no a una lista de orígenes."
    pt: "O Djibuti não publica um esquema de países listados / categorização por origem para a entrada de animais de companhia. Aplica-se a mesma abordagem de autorização de importação e atestado de saúde; planejar em função da autorização, e não de uma lista de origens."
  nonListed:
    en: "From any origin: the exact steps depend on the conditions written on the import permit issued by the ministry. Because published detail is essentially absent, confirm every requirement directly with the authority before booking."
    fr: "Depuis toute origine : les étapes exactes dépendent des conditions inscrites sur le permis d'importation délivré par le ministère. Le détail publié étant quasi inexistant, confirme chaque exigence directement auprès de l'autorité avant de réserver."
    es: "Desde cualquier origen: los pasos exactos dependen de las condiciones inscritas en el permiso de importación expedido por el ministerio. Como el detalle publicado es prácticamente inexistente, confirma cada requisito directamente con la autoridad antes de reservar."
    pt: "De qualquer origem: as etapas exatas dependem das condições indicadas na autorização de importação emitida pelo ministério. Como praticamente não há detalhes publicados, confirmar cada exigência diretamente com a autoridade antes de reservar."

