# Country Entry Guide — Iraq (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_iq
iso2: "IQ"
name: { en: "Iraq", fr: "Irak", es: "Irak", pt: "Iraque" }
region: { en: "Middle East", fr: "Moyen-Orient", es: "Oriente Medio", pt: "Oriente Médio" }


regime: non_listed

hero:
  h1: { en: "Traveling to Iraq with your dog", fr: "Voyager en Irak avec ton chien", es: "Viajar a Irak con tu perro", pt: "Viajar para o Iraque com seu cachorro" }
  intro:
    en: >-
      Iraq (the Republic of Iraq) is a non-EU country, so the EU pet-passport framework does not apply
      here. Entry is governed by Iraq's own authorities: the Ministry of Agriculture, which is the
      competent veterinary authority for importing live animals, together with the General Authority of
      Customs at the border. The clearest official reference available is the agreed United States–Iraq
      veterinary health certificate for dogs and cats, published by USDA APHIS: it requires a valid
      rabies vaccination, a veterinary inspection and certification that the animal comes from an area
      not quarantined for rabies, and it is valid for 30 days after issuance. Iraq itself publishes very
      little detailed public guidance for personal pet imports, and the country is classified as
      high-risk for dog rabies. Because several key details are not officially published, this guide
      states clearly what is confirmed by official sources and what you must confirm directly with the
      Ministry of Agriculture before you book. Always travel with an official government-endorsed
      veterinary health certificate.
    fr: >-
      L'Irak (République d'Irak) est un pays hors UE : le cadre du passeport européen pour animaux ne
      s'applique donc pas. L'entrée relève des autorités irakiennes : le ministère de l'Agriculture,
      autorité vétérinaire compétente pour l'importation d'animaux vivants, ainsi que l'Autorité générale
      des douanes à la frontière. La référence officielle la plus claire disponible est le certificat
      vétérinaire convenu entre les États-Unis et l'Irak pour les chiens et les chats, publié par l'USDA
      APHIS : il exige une vaccination antirabique valide, une inspection vétérinaire et une attestation
      que l'animal provient d'une zone non placée sous quarantaine rabique, et il est valable 30 jours
      après sa délivrance. L'Irak lui-même publie très peu d'informations publiques détaillées pour
      l'importation personnelle d'animaux, et le pays est classé à haut risque pour la rage canine.
      Plusieurs points clés n'étant pas officiellement publiés, ce guide distingue clairement ce qui est
      confirmé par des sources officielles de ce que tu dois confirmer directement auprès du ministère
      de l'Agriculture avant de réserver. Voyage toujours avec un certificat vétérinaire officiel visé
      par l'autorité gouvernementale.
    es: >-
      Irak (la República de Irak) es un país no perteneciente a la UE, por lo que el marco del pasaporte
      europeo para mascotas no se aplica aquí. La entrada se rige por las propias autoridades de Irak: el
      Ministerio de Agricultura, que es la autoridad veterinaria competente para la importación de
      animales vivos, junto con la Autoridad General de Aduanas en la frontera. La referencia oficial más
      clara disponible es el certificado sanitario veterinario acordado entre Estados Unidos e Irak para
      perros y gatos, publicado por el USDA APHIS: exige una vacunación antirrábica válida, una inspección
      veterinaria y la certificación de que el animal procede de una zona no sometida a cuarentena por
      rabia, y es válido durante 30 días tras su expedición. El propio Irak publica muy poca información
      pública detallada para la importación personal de mascotas, y el país está clasificado como de alto
      riesgo para la rabia canina. Como varios detalles clave no se publican oficialmente, esta guía
      indica claramente lo que confirman las fuentes oficiales y lo que debes confirmar directamente con
      el Ministerio de Agricultura antes de reservar. Viaja siempre con un certificado sanitario
      veterinario oficial refrendado por el gobierno.

    pt: "O Iraque (República do Iraque) é um país fora da UE, portanto o regime europeu de passaporte para animais de estimação não se aplica aqui. A entrada é regida pelas próprias autoridades iraquianas: o Ministério da Agricultura, autoridade veterinária competente para a importação de animais vivos, junto com a Autoridade Geral de Alfândega na fronteira. A referência oficial mais clara disponível é o atestado de saúde veterinário acordado entre Estados Unidos e Iraque para cachorros e gatos, publicado pelo USDA APHIS: ele exige vacinação antirrábica válida, inspeção veterinária e a certificação de que o animal vem de uma área não colocada em quarentena por raiva, sendo válido por 30 dias após a emissão. O próprio Iraque publica muito pouca orientação pública detalhada para a importação pessoal de animais de estimação, e o país é classificado como de alto risco para a raiva canina. Como vários detalhes-chave não são publicados oficialmente, este guia indica claramente o que é confirmado por fontes oficiais e o que você precisa confirmar diretamente com o Ministério da Agricultura antes de reservar. Viaje sempre com um atestado de saúde veterinário oficial endossado pelo governo."
difficulty:
  level: difficult
  label: { en: "Difficult — official health certificate required, several details not officially published", fr: "Difficile — certificat sanitaire officiel requis, plusieurs détails non publiés officiellement", es: "Difícil — se exige un certificado sanitario oficial, varios detalles no publicados oficialmente", pt: "Difícil — atestado de saúde oficial obrigatório, vários detalhes não publicados oficialmente" }

prepTime:
  eu:
    en: "From Europe / the EU: no EU-passport shortcut. Plan ahead for an official government-endorsed veterinary health certificate and a valid rabies vaccination. Iraq does not publish a detailed public checklist for EU-origin dogs — confirm the exact certificate and any import permit with the Ministry of Agriculture."
    fr: "Depuis l'Europe / l'UE : aucun raccourci « passeport UE ». Prévois un certificat vétérinaire officiel visé par l'autorité gouvernementale et une vaccination antirabique valide. L'Irak ne publie pas de liste publique détaillée pour les chiens d'origine UE — confirme le certificat exact et un éventuel permis d'importation auprès du ministère de l'Agriculture."
    es: "Desde Europa / la UE: sin atajo de «pasaporte UE». Planifica con antelación un certificado sanitario veterinario oficial refrendado por el gobierno y una vacunación antirrábica válida. Irak no publica una lista pública detallada para perros de origen UE — confirma el certificado exacto y cualquier permiso de importación con el Ministerio de Agricultura."
    pt: "Da Europa / da UE: não há atalho de passaporte europeu. Planeje com antecedência um atestado de saúde veterinário oficial endossado pelo governo e uma vacinação antirrábica válida. O Iraque não publica uma lista de verificação pública detalhada para cachorros de origem na UE — confirme o atestado exato e qualquer autorização de importação com o Ministério da Agricultura."
  listed:
    en: "From another rabies-controlled country: same core steps — an endorsed veterinary health certificate and a valid rabies vaccination. For US-origin dogs the agreed certificate is valid for 30 days after issuance; from other countries, obtain the equivalent official export certificate and confirm timings."
    fr: "Depuis un autre pays à rage maîtrisée : mêmes étapes de base — certificat vétérinaire visé et vaccination antirabique valide. Pour les chiens d'origine américaine, le certificat convenu est valable 30 jours après délivrance ; depuis d'autres pays, obtiens le certificat d'exportation officiel équivalent et confirme les délais."
    es: "Desde otro país con la rabia controlada: los mismos pasos básicos — un certificado sanitario veterinario refrendado y una vacunación antirrábica válida. Para los perros de origen estadounidense, el certificado acordado es válido durante 30 días tras su expedición; desde otros países, obtén el certificado de exportación oficial equivalente y confirma los plazos."
    pt: "De outro país com raiva controlada: as mesmas etapas básicas — um atestado de saúde veterinário endossado e uma vacinação antirrábica válida. Para cachorros de origem americana, o atestado acordado é válido por 30 dias após a emissão; de outros países, obtenha o certificado de exportação oficial equivalente e confirme os prazos."
  nonListed:
    en: "From a high-rabies-risk country: expect closer scrutiny. Iraq is itself classified as high-risk for dog rabies. The certificate must state the dog comes from an area not quarantined for rabies; extra measures may be decided case-by-case by the Ministry of Agriculture."
    fr: "Depuis un pays à haut risque rabique : attends-toi à un contrôle renforcé. L'Irak est elle-même classée à haut risque pour la rage canine. Le certificat doit attester que le chien provient d'une zone non placée sous quarantaine rabique ; d'éventuelles mesures supplémentaires sont décidées au cas par cas par le ministère de l'Agriculture."
    es: "Desde un país de alto riesgo de rabia: espera un control más estricto. El propio Irak está clasificado como de alto riesgo para la rabia canina. El certificado debe indicar que el perro procede de una zona no sometida a cuarentena por rabia; el Ministerio de Agricultura puede decidir medidas adicionales caso por caso."
    pt: "De um país de alto risco de raiva: espere um controle mais rigoroso. O próprio Iraque é classificado como de alto risco para a raiva canina. O atestado deve declarar que o cachorro vem de uma área não colocada em quarentena por raiva; medidas adicionais podem ser decididas caso a caso pelo Ministério da Agricultura."

