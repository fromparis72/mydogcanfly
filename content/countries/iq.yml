restrictedDogs:
  intro:
    en: "No official Iraqi law restricting or banning specific dog breeds for import could be verified from a government source. This does not guarantee there is none — it means no published, verifiable list was found."
    fr: "Aucune loi irakienne officielle restreignant ou interdisant des races de chiens précises à l'importation n'a pu être vérifiée à partir d'une source gouvernementale. Cela ne garantit pas qu'il n'en existe aucune — cela signifie qu'aucune liste publiée et vérifiable n'a été trouvée."
    es: "No se pudo verificar ninguna ley iraquí oficial que restrinja o prohíba razas de perros concretas para la importación a partir de una fuente gubernamental. Esto no garantiza que no exista ninguna — significa que no se encontró ninguna lista publicada y verificable."
    pt: "Nenhuma lei iraquiana oficial que restrinja ou proíba raças específicas de cachorros para importação pôde ser confirmada em fonte governamental. Isso não garante que não exista nenhuma — significa apenas que nenhuma lista publicada e verificável foi encontrada."
  cat1:
    en: "Banned breeds: Not officially published. Do not assume your breed is either allowed or prohibited — confirm your dog's breed status with the Ministry of Agriculture, which is the authoritative authority for imports."
    fr: "Races interdites : non communiqué officiellement. Ne présume pas que ta race est autorisée ou interdite — confirme le statut de la race de ton chien auprès du ministère de l'Agriculture, autorité compétente pour les importations."
    es: "Razas prohibidas: no publicado oficialmente. No des por hecho que tu raza está permitida o prohibida — confirma la situación de la raza de tu perro con el Ministerio de Agricultura, que es la autoridad competente para las importaciones."
    pt: "Raças proibidas: não publicado oficialmente. Não presuma que a raça do seu cachorro é permitida ou proibida — confirme a situação da raça com o Ministério da Agricultura, a autoridade competente para importações."
  cat2:
    en: "Restricted / licence-required breeds: Not officially published. If your dog is a type sometimes treated as dangerous elsewhere in the region, confirm its status directly with the Ministry of Agriculture before booking."
    fr: "Races restreintes / soumises à licence : non communiqué officiellement. Si ton chien est d'un type parfois considéré comme dangereux ailleurs dans la région, confirme son statut directement auprès du ministère de l'Agriculture avant de réserver."
    es: "Razas restringidas / que requieren licencia: no publicado oficialmente. Si tu perro es de un tipo que a veces se considera peligroso en otras partes de la región, confirma su situación directamente con el Ministerio de Agricultura antes de reservar."
    pt: "Raças restritas / com exigência de licença: não publicado oficialmente. Se o seu cachorro for de um tipo às vezes tratado como perigoso em outros lugares da região, confirme a situação diretamente com o Ministério da Agricultura antes de reservar."
  note:
    en: "Because breed rules in the region can change and are not clearly published for Iraq, verify your dog's breed status with the Ministry of Agriculture or an Iraqi consulate before you travel."
    fr: "Les règles de race dans la région pouvant évoluer et n'étant pas clairement publiées pour l'Irak, vérifie le statut de la race de ton chien auprès du ministère de l'Agriculture ou d'un consulat irakien avant de voyager."
    es: "Como las normas de razas en la región pueden cambiar y no están claramente publicadas para Irak, verifica la situación de la raza de tu perro con el Ministerio de Agricultura o un consulado iraquí antes de viajar."
    pt: "Como as normas sobre raças na região podem mudar e não são claramente publicadas para o Iraque, verifique a situação da raça do seu cachorro com o Ministério da Agricultura ou um consulado iraquiano antes de viajar."

checklist:
  - en: "Official international veterinary health certificate, endorsed by the government vet (US model valid 30 days)"
    fr: "Certificat vétérinaire international officiel, visé par le vétérinaire gouvernemental (modèle américain valable 30 jours)"
    es: "Certificado sanitario veterinario internacional oficial, refrendado por el veterinario del gobierno (modelo estadounidense válido 30 días)"
    pt: "Atestado de saúde veterinário internacional oficial, endossado pelo veterinário do governo (modelo americano válido por 30 dias)"
  - en: "Confirm the exact certificate and any import permit for your origin with the Ministry of Agriculture"
    fr: "Confirme le certificat exact et un éventuel permis d'importation pour ton origine auprès du ministère de l'Agriculture"
    es: "Confirma el certificado exacto y cualquier permiso de importación para tu origen con el Ministerio de Agricultura"
    pt: "Confirme o atestado exato e qualquer autorização de importação para a sua origem com o Ministério da Agricultura"
  - en: "ISO 11784/11785 microchip implanted before the rabies vaccination (advised)"
    fr: "Puce ISO 11784/11785 posée avant la vaccination antirabique (conseillé)"
    es: "Microchip ISO 11784/11785 implantado antes de la vacunación antirrábica (recomendado)"
    pt: "Microchip ISO 11784/11785 implantado antes da vacinação antirrábica (recomendado)"
  - en: "Valid rabies vaccination for your dog, recorded with date, vaccine and validity"
    fr: "Vaccination antirabique valide pour ton chien, consignée avec date, vaccin et validité"
    es: "Vacunación antirrábica válida para tu perro, registrada con fecha, vacuna y valide"
    pt: "Vacinação antirrábica válida para o seu cachorro, registrada com data, vacina e validade"
  - en: "Confirm rabies vaccination timing and any antibody test for your origin with the Ministry of Agriculture"
    fr: "Confirme le délai de vaccination antirabique et un éventuel titrage pour ton origine auprès du ministère de l'Agriculture"
    es: "Confirma el plazo de la vacunación antirrábica y cualquier prueba de titulación para tu origen con el Ministerio de Agricultura"
    pt: "Confirme o prazo da vacinação antirrábica e qualquer teste sorológico para a sua origem com o Ministério da Agricultura"
  - en: "Original vaccination booklet and identification record (not copies)"
    fr: "Carnet de vaccination et justificatif d'identification originaux (pas de copies)"
    es: "Cartilla de vacunación y justificante de identificación originales (no copias)"
    pt: "Carteira de vacinação original e registro de identificação (não cópias)"
  - en: "Confirm your dog's breed is not restricted with the Ministry of Agriculture"
    fr: "Vérifie que la race de ton chien n'est pas restreinte auprès du ministère de l'Agriculture"
    es: "Confirma que la raza de tu perro no esté restringida con el Ministerio de Agricultura"
    pt: "Confirme com o Ministério da Agricultura que a raça do seu cachorro não é restrita"
  - en: "Airline reservation confirming your dog's travel option and a suitable IATA crate"
    fr: "Réservation confirmant l'option de transport de ton chien et une caisse IATA adaptée"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y una jaula IATA adecuada"
    pt: "Reserva na companhia aérea confirmando a opção de viagem do cachorro e uma caixa de transporte adequada às normas IATA"

