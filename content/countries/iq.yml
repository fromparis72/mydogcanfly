  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Iraq (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — l'Irak (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Irak (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — o Iraque (seu destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Iraq", fr: "Pays de destination — Irak", es: "País de destino — Irak", pt: "País de destino — Iraque" }
      text:
        en: "Iraq runs its own scheme through the Ministry of Agriculture (the competent veterinary authority) and the General Authority of Customs. An official veterinary health certificate and a valid rabies vaccination are the backbone of any live-animal import. Iraq is not an EU country, so the EU pet passport is not an Iraqi document."
        fr: "L'Irak applique son propre dispositif via le ministère de l'Agriculture (autorité vétérinaire compétente) et l'Autorité générale des douanes. Un certificat vétérinaire officiel et une vaccination antirabique valide sont la base de toute importation d'animal vivant. L'Irak n'étant pas un pays de l'UE, le passeport européen n'y est pas un document valable."
        es: "Irak aplica su propio sistema a través del Ministerio de Agricultura (la autoridad veterinaria competente) y la Autoridad General de Aduanas. Un certificado sanitario veterinario oficial y una vacunación antirrábica válida son la base de cualquier importación de animales vivos. Irak no es un país de la UE, por lo que el pasaporte europeo para mascotas no es un documento iraquí."
        pt: "O Iraque aplica um sistema próprio por meio do Ministério da Agricultura (a autoridade veterinária competente) e da Autoridade Geral de Alfândega. Um atestado de saúde veterinário oficial e uma vacinação antirrábica válida são a base de qualquer importação de animal vivo. O Iraque não é um país da UE, portanto o passaporte europeu para animais de estimação não é um documento iraquiano."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The disease status of your departure country shapes what the official vet must certify. The agreed US–Iraq certificate requires a statement that the dog comes from an area not quarantined for rabies — a point that matters because Iraq itself is a rabies-endemic country."
        fr: "La situation sanitaire du pays de départ détermine ce que le vétérinaire officiel doit certifier. Le certificat convenu États-Unis–Irak exige une attestation que le chien provient d'une zone non placée sous quarantaine rabique — un point important, l'Irak étant elle-même un pays d'endémie rabique."
        es: "La situación sanitaria de tu país de salida determina lo que el veterinario oficial debe certificar. El certificado acordado entre Estados Unidos e Irak exige una declaración de que el perro procede de una zona no sometida a cuarentena por rabia — un punto importante, ya que el propio Irak es un país con rabia endémica."
        pt: "A situação sanitária do seu país de partida determina o que o veterinário oficial deve atestar. O atestado acordado entre Estados Unidos e Iraque exige uma declaração de que o cachorro vem de uma área não colocada em quarentena por raiva — um ponto importante, já que o próprio Iraque é um país endêmico para raiva."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay in a high-rabies-risk or rabies-quarantined area can trigger extra scrutiny at the border. It is your dog's real origin and travel history that count — not only the last airport. Keep a complete record of where your dog has lived."
        fr: "Un séjour récent dans une zone à haut risque rabique ou sous quarantaine rabique peut entraîner un contrôle renforcé à la frontière. C'est l'origine réelle et l'historique de voyage du chien qui comptent — pas seulement le dernier aéroport. Conserve un historique complet des lieux de vie de ton chien."
        es: "Una estancia reciente en una zona de alto riesgo de rabia o sometida a cuarentena por rabia puede provocar un control adicional en la frontera. Lo que cuenta es el origen y el historial de viajes reales de tu perro — no solo el último aeropuerto. Conserva un registro completo de dónde ha vivido tu perro."
        pt: "Uma estadia recente em uma área de alto risco de raiva ou sob quarentena por raiva pode acionar um controle adicional na fronteira. O que conta é a origem real e o histórico de viagens do seu cachorro — não apenas o último aeroporto. Mantenha um registro completo de onde o seu cachorro viveu."
  note:
    en: "So read the requirements below as Iraq's framework, then confirm your dog's exact origin, history and the current conditions with the Ministry of Agriculture before you make any plans."
    fr: "Lis donc les exigences ci-dessous comme le cadre irakien, puis confirme l'origine, l'historique de ton chien et les conditions actuelles auprès du ministère de l'Agriculture avant tout projet."
    es: "Así que lee los requisitos siguientes como el marco de Irak y luego confirma el origen, el historial exactos de tu perro y las condiciones vigentes con el Ministerio de Agricultura antes de hacer cualquier plan."
    pt: "Portanto, leia as exigências abaixo como o regime do Iraque e depois confirme a origem exata, o histórico e as condições atuais do seu cachorro com o Ministério da Agricultura antes de fazer qualquer plano."

requirements:
  - item: { en: "Official veterinary health certificate", fr: "Certificat vétérinaire officiel", es: "Certificado sanitario veterinario oficial", pt: "Certificado veterinário oficial" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "An international/export veterinary health certificate completed by a licensed vet accompanies the dog. For US-origin dogs, USDA APHIS publishes an agreed US–Iraq dog/cat certificate that is valid for 30 days after issuance and (for the US) does not require USDA endorsement. From other countries, use the equivalent official export certificate.", fr: "Un certificat vétérinaire international/export établi par un vétérinaire agréé accompagne le chien. Pour les chiens d'origine américaine, l'USDA APHIS publie un certificat convenu États-Unis–Irak chien/chat, valable 30 jours après délivrance et (pour les États-Unis) sans visa USDA obligatoire. Depuis d'autres pays, utilise le certificat d'exportation officiel équivalent.", es: "Un certificado sanitario veterinario internacional/de exportación cumplimentado por un veterinario autorizado acompaña al perro. Para los perros de origen estadounidense, el USDA APHIS publica un certificado acordado entre Estados Unidos e Irak para perros/gatos que es válido durante 30 días tras su expedición y (para Estados Unidos) no requiere el refrendo del USDA. Desde otros países, usa el certificado de exportación oficial equivalente.", pt: "Um atestado de saúde veterinário internacional/de exportação, preenchido por um veterinário licenciado, acompanha o cachorro. Para cachorros de origem americana, o USDA APHIS publica um atestado acordado entre Estados Unidos e Iraque para cachorros e gatos, válido por 30 dias após a emissão e que (para os EUA) não exige endosso do USDA. De outros países, use o atestado de exportação oficial equivalente." }
    exceptions: { en: "Carry originals; the certificate has short validity (30 days for the US model) and must still be valid on arrival. Iraq has no published bilateral model certificate for many other origins — confirm the exact form with the Ministry of Agriculture.", fr: "Munis-toi des originaux ; le certificat a une validité courte (30 jours pour le modèle américain) et doit être encore valable à l'arrivée. L'Irak n'a pas de modèle bilatéral publié pour de nombreuses autres origines — confirme la forme exacte auprès du ministère de l'Agriculture.", es: "Lleva los originales; el certificado tiene una valide corta (30 días para el modelo estadounidense) y debe seguir siendo válido a la llegada. Irak no tiene un modelo de certificado bilateral publicado para muchos otros orígenes — confirma el formulario exacto con el Ministerio de Agricultura.", pt: "Leve os originais; o atestado tem validade curta (30 dias no modelo americano) e precisa continuar válido na chegada. O Iraque não publica um modelo bilateral de atestado para muitas outras origens — confirme o formulário exato com o Ministério da Agricultura." }
    ref: { en: "USDA APHIS — Pet Travel to Iraq (agreed dog/cat health certificate)", fr: "USDA APHIS — Voyage d'animaux vers l'Irak (certificat sanitaire chien/chat convenu)", es: "USDA APHIS — Viaje de mascotas a Irak (certificado sanitario acordado para perros/gatos)", pt: "USDA APHIS — Viagem de animais de estimação para o Iraque (atestado de saúde acordado para cachorros e gatos)" }
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Recommended", fr: "Recommandée", es: "Recomendado", pt: "Recomendado" }
    when: { en: "The agreed US–Iraq certificate identifies each animal by microchip number or name, and the vet certifies verifying any microchip listed. An ISO 11784/11785 chip is the international standard and is strongly advised so records match, but no official Iraqi rule making it strictly mandatory was found.", fr: "Le certificat convenu États-Unis–Irak identifie chaque animal par numéro de puce ou nom, et le vétérinaire atteste avoir vérifié toute puce indiquée. Une puce ISO 11784/11785 est la norme internationale et fortement conseillée pour que les documents concordent, mais aucune règle officielle irakienne la rendant strictement obligatoire n'a été trouvée.", es: "El certificado acordado entre Estados Unidos e Irak identifica a cada animal por número de microchip o nombre, y el veterinario certifica haber verificado cualquier microchip indicado. Un chip ISO 11784/11785 es la norma internacional y se recomienda encarecidamente para que los registros coincidan, pero no se encontró ninguna norma oficial iraquí que lo haga estrictamente obligatorio.", pt: "O atestado acordado entre Estados Unidos e Iraque identifica cada animal pelo número do microchip ou pelo nome, e o veterinário certifica a verificação de qualquer microchip informado. Um chip ISO 11784/11785 é o padrão internacional e é fortemente recomendado para que os registros coincidam, mas nenhuma norma oficial iraquiana o torna estritamente obrigatório." }
    exceptions: { en: "Confirm the identification requirement for your origin with the Ministry of Agriculture.", fr: "Confirme l'exigence d'identification pour ton origine auprès du ministère de l'Agriculture.", es: "Confirma el requisito de identificación para tu origen con el Ministerio de Agricultura.", pt: "Confirme a exigência de identificação para a sua origem com o Ministério da Agricultura." }
    ref: { en: "USDA APHIS — Iraq dog/cat health certificate (box 21 identification)", fr: "USDA APHIS — Certificat chien/chat Irak (identification case 21)", es: "USDA APHIS — Certificado para perros/gatos de Irak (identificación, casilla 21)", pt: "USDA APHIS — Atestado de saúde para cachorros e gatos do Iraque (campo 21, identificação)" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Iraq is a rabies-endemic country; a valid rabies vaccination is recorded on the health certificate with the date, vaccine name and validity period. The certificate also states the dog originated from an area not quarantined for rabies and was not exposed to rabies.", fr: "L'Irak est un pays d'endémie rabique ; une vaccination antirabique valide est consignée sur le certificat sanitaire avec la date, le nom du vaccin et la période de validité. Le certificat atteste aussi que le chien provient d'une zone non placée sous quarantaine rabique et n'a pas été exposé à la rage.", es: "Irak es un país con rabia endémica; una vacunación antirrábica válida se registra en el certificado sanitario con la fecha, el nombre de la vacuna y el periodo de valide. El certificado también indica que el perro procede de una zona no sometida a cuarentena por rabia y que no ha estado expuesto a la rabia.", pt: "O Iraque é um país endêmico para raiva; a vacinação antirrábica válida é registrada no atestado de saúde com a data, o nome da vacina e o período de validade. O atestado também declara que o cachorro veio de uma área não colocada em quarentena por raiva e não foi exposto à raiva." }
    exceptions: { en: "The US model does not state a fixed minimum interval before travel; confirm the required post-vaccination timing and validity with the Ministry of Agriculture before booking.", fr: "Le modèle américain n'indique pas de délai minimum fixe avant le voyage ; confirme le délai post-vaccination requis et la validité auprès du ministère de l'Agriculture avant de réserver.", es: "El modelo estadounidense no indica un intervalo mínimo fijo antes del viaje; confirma el plazo posterior a la vacunación requerido y la valide con el Ministerio de Agricultura antes de reservar.", pt: "O modelo americano não estabelece um intervalo mínimo fixo antes da viagem; confirme o prazo exigido após a vacinação e a validade com o Ministério da Agricultura antes de reservar." }
    ref: { en: "USDA APHIS — Iraq dog/cat health certificate; CDC — Iraq classified high-risk for dog rabies", fr: "USDA APHIS — Certificat chien/chat Irak ; CDC — Irak classée à haut risque pour la rage canine", es: "USDA APHIS — Certificado para perros/gatos de Irak; CDC — Irak clasificado como de alto riesgo para la rabia canina", pt: "USDA APHIS — Atestado de saúde para cachorros e gatos do Iraque; CDC — Iraque classificado como de alto risco para raiva canina" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not on the US–Iraq certificate", fr: "Absent du certificat États-Unis–Irak", es: "No figura en el certificado Estados Unidos–Irak", pt: "Ausente do atestado Estados Unidos–Iraque" }
    when: { en: "The agreed US–Iraq dog/cat certificate does not include a rabies antibody test. Whether Iraq requires an antibody test for dogs from other origins is not published in an official Iraqi source.", fr: "Le certificat convenu États-Unis–Irak chien/chat n'inclut pas de titrage antirabique. La question de savoir si l'Irak exige un titrage pour les chiens d'autres origines n'est pas publiée dans une source officielle irakienne.", es: "El certificado acordado entre Estados Unidos e Irak para perros/gatos no incluye una prueba de titulación de rabia. Si Irak exige una prueba de titulación para perros de otros orígenes no se publica en una fuente oficial iraquí.", pt: "O atestado acordado entre Estados Unidos e Iraque para cachorros e gatos não inclui teste sorológico antirrábico. Se o Iraque exige teste sorológico para cachorros de outras origens não é informado em nenhuma fonte oficial iraquiana." }
    exceptions: { en: "Do not assume it is or is not required from your country — confirm directly with the Ministry of Agriculture.", fr: "Ne présume ni de son exigence ni de sa dispense depuis ton pays — confirme directement auprès du ministère de l'Agriculture.", es: "No des por hecho que se exige o no desde tu país — confírmalo directamente con el Ministerio de Agricultura.", pt: "Não presuma que ele é ou não exigido para o seu país — confirme diretamente com o Ministério da Agricultura." }
    ref: { en: "USDA APHIS — Iraq dog/cat health certificate; no official Iraqi specification found for other origins", fr: "USDA APHIS — Certificat chien/chat Irak ; aucune spécification officielle irakienne trouvée pour les autres origines", es: "USDA APHIS — Certificado para perros/gatos de Irak; no se encontró especificación oficial iraquí para otros orígenes", pt: "USDA APHIS — Atestado de saúde para cachorros e gatos do Iraque; nenhuma especificação oficial iraquiana encontrada para outras origens" }
  - item: { en: "Parasite treatment", fr: "Traitement antiparasitaire", es: "Tratamiento antiparasitario", pt: "Tratamento antiparasitário" }
    required: { en: "Not officially published", fr: "Non communiqué officiellement", es: "No publicado oficialmente", pt: "Não publicado oficialmente" }
    when: { en: "The agreed US–Iraq certificate does not require internal or external parasite treatment. Such treatment shortly before travel is common international practice, but no official Iraqi public rule or timing was found.", fr: "Le certificat convenu États-Unis–Irak n'exige pas de traitement antiparasitaire interne ou externe. Un tel traitement peu avant le voyage est une pratique internationale courante, mais aucune règle ni délai officiel irakien public n'a été trouvé.", es: "El certificado acordado entre Estados Unidos e Irak no exige tratamiento antiparasitario interno o externo. Ese tratamiento poco antes del viaje es una práctica internacional común, pero no se encontró ninguna norma ni plazo oficial iraquí público.", pt: "O atestado acordado entre Estados Unidos e Iraque não exige tratamento antiparasitário interno ou externo. Esse tratamento pouco antes da viagem é uma prática internacional comum, mas nenhuma norma pública oficial iraquiana sobre isso ou seu prazo foi encontrada." }
    exceptions: { en: "Confirm any required treatment and window with the Ministry of Agriculture / your official vet.", fr: "Confirme tout traitement requis et son délai auprès du ministère de l'Agriculture / de ton vétérinaire officiel.", es: "Confirma cualquier tratamiento requerido y su plazo con el Ministerio de Agricultura / tu veterinario oficial.", pt: "Confirme qualquer tratamento exigido e seu prazo com o Ministério da Agricultura / seu veterinário oficial." }
    ref: { en: "USDA APHIS — Iraq dog/cat health certificate; no official Iraqi specification found", fr: "USDA APHIS — Certificat chien/chat Irak ; aucune spécification officielle irakienne trouvée", es: "USDA APHIS — Certificado para perros/gatos de Irak; no se encontró especificación oficial iraquí", pt: "USDA APHIS — Atestado de saúde para cachorros e gatos do Iraque; nenhuma especificação oficial iraquiana encontrada" }
  - item: { en: "Import permit / advance approval", fr: "Permis d'importation / autorisation préalable", es: "Permiso de importación / autorización previa", pt: "Autorização de importação / aprovação prévia" }
    required: { en: "Not officially published for pets", fr: "Non communiqué pour les animaux de compagnie", es: "No publicado oficialmente para mascotas", pt: "Não publicado oficialmente para animais de estimação" }
    when: { en: "USDA APHIS notes that for live-animal species without an agreed protocol, the importer should apply for an import permit at the Iraqi Ministry of Agriculture. For pet dogs and cats an agreed certificate exists and no separate public permit rule was found, but a permit may still be requested in some cases.", fr: "L'USDA APHIS indique que, pour les espèces d'animaux vivants sans protocole convenu, l'importateur doit demander un permis d'importation auprès du ministère de l'Agriculture irakien. Pour les chiens et chats de compagnie, un certificat convenu existe et aucune règle publique de permis distincte n'a été trouvée, mais un permis peut néanmoins être demandé dans certains cas.", es: "El USDA APHIS señala que, para las especies de animales vivos sin un protocolo acordado, el importador debe solicitar un permiso de importación al Ministerio de Agricultura iraquí. Para perros y gatos de compañía existe un certificado acordado y no se encontró una norma pública de permiso aparte, pero en algunos casos aún puede solicitarse un permiso.", pt: "O USDA APHIS observa que, para espécies de animais vivos sem protocolo acordado, o importador deve solicitar uma autorização de importação junto ao Ministério da Agricultura do Iraque. Para cachorros e gatos de estimação existe um atestado acordado e nenhuma norma pública separada sobre autorização foi encontrada, mas uma autorização ainda pode ser solicitada em alguns casos." }
    exceptions: { en: "Confirm whether an advance import permit applies to your dog with the Ministry of Agriculture before travel.", fr: "Confirme si un permis d'importation préalable s'applique à ton chien auprès du ministère de l'Agriculture avant le voyage.", es: "Confirma si un permiso de importación previo se aplica a tu perro con el Ministerio de Agricultura antes de viajar.", pt: "Confirme com o Ministério da Agricultura, antes da viagem, se uma autorização de importação prévia se aplica ao seu cachorro." }
    ref: { en: "USDA APHIS — Export Live Animals to Iraq; Ministry of Agriculture", fr: "USDA APHIS — Exportation d'animaux vivants vers l'Irak ; ministère de l'Agriculture", es: "USDA APHIS — Exportación de animales vivos a Irak; Ministerio de Agricultura", pt: "USDA APHIS — Exportação de animais vivos para o Iraque; Ministério da Agricultura" }
  - item: { en: "Minimum age / puppies", fr: "Âge minimum / chiots", es: "Edad mínima / cachorros", pt: "Idade mínima / filhotes" }
    required: { en: "Not officially published", fr: "Non communiqué officiellement", es: "No publicado oficialmente", pt: "Não publicado oficialmente" }
    when: { en: "A minimum travelling age for puppies is not published in an official Iraqi source. In practice a puppy needs its own valid rabies vaccination, which implies a minimum age.", fr: "Aucun âge minimum de voyage pour les chiots n'est publié dans une source officielle irakienne. En pratique, un chiot a besoin de sa propre vaccination antirabique valide, ce qui implique un âge minimum.", es: "No se publica una edad mínima de viaje para cachorros en una fuente oficial iraquí. En la práctica, un cachorro necesita su propia vacunación antirrábica válida, lo que implica una edad mínima.", pt: "Uma idade mínima de viagem para filhotes não é publicada em nenhuma fonte oficial iraquiana. Na prática, um filhote precisa da própria vacinação antirrábica válida, o que implica uma idade mínima." }
    exceptions: { en: "Confirm the minimum age for your dog's origin with the Ministry of Agriculture.", fr: "Confirme l'âge minimum pour l'origine de ton chien auprès du ministère de l'Agriculture.", es: "Confirma la edad mínima para el origen de tu perro con el Ministerio de Agricultura.", pt: "Confirme a idade mínima para a origem do seu cachorro com o Ministério da Agricultura." }
    ref: { en: "No official Iraqi specification found — verify with the Ministry of Agriculture", fr: "Aucune spécification officielle irakienne trouvée — à vérifier auprès du ministère de l'Agriculture", es: "No se encontró especificación oficial iraquí — verifícalo con el Ministerio de Agricultura", pt: "Nenhuma especificação oficial iraquiana encontrada — verifique com o Ministério da Agricultura" }
  - item: { en: "Arrival veterinary check / border inspection", fr: "Contrôle vétérinaire à l'arrivée / inspection frontalière", es: "Control veterinario a la llegada / inspección fronteriza", pt: "Controle veterinário na chegada / inspeção de fronteira" }
    required: { en: "Not officially published", fr: "Non communiqué officiellement", es: "No publicado oficialmente", pt: "Não publicado oficialmente" }
    when: { en: "Live animals are cleared at the port of entry by the General Authority of Customs and the Ministry of Agriculture's veterinary services against the health certificate. Iraq does not publish a detailed public description of the pet arrival inspection.", fr: "Les animaux vivants sont dédouanés au point d'entrée par l'Autorité générale des douanes et les services vétérinaires du ministère de l'Agriculture, au regard du certificat sanitaire. L'Irak ne publie pas de description publique détaillée de l'inspection des animaux à l'arrivée.", es: "Los animales vivos se despachan en el punto de entrada por la Autoridad General de Aduanas y los servicios veterinarios del Ministerio de Agricultura, contrastándolos con el certificado sanitario. Irak no publica una descripción pública detallada de la inspección de mascotas a la llegada.", pt: "Os animais vivos são liberados no ponto de entrada pela Autoridade Geral de Alfândega e pelos serviços veterinários do Ministério da Agricultura, com base no atestado de saúde. O Iraque não publica uma descrição pública detalhada da inspeção de chegada de animais de estimação." }
    exceptions: { en: "Incomplete or invalid documents may lead to hold, refusal or return at the owner's expense.", fr: "Des documents incomplets ou invalides peuvent entraîner une rétention, un refus ou un renvoi aux frais du propriétaire.", es: "Documentos incompletos o no válidos pueden dar lugar a retención, rechazo o devolución a cargo del propietario.", pt: "Documentos incompletos ou inválidos podem levar à retenção, recusa ou devolução às custas do dono." }
    ref: { en: "Iraq General Authority of Customs; Ministry of Agriculture veterinary services", fr: "Autorité générale des douanes d'Irak ; services vétérinaires du ministère de l'Agriculture", es: "Autoridad General de Aduanas de Irak; servicios veterinarios del Ministerio de Agricultura", pt: "Autoridade Geral de Alfândega do Iraque; serviços veterinários do Ministério da Agricultura" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not officially published", fr: "Non communiqué officiellement", es: "No publicado oficialmente", pt: "Não publicado oficialmente" }
    when: { en: "No official Iraqi rule on routine quarantine for compliant pet dogs was found. Non-compliant or unhealthy animals may be held for examination.", fr: "Aucune règle officielle irakienne sur une quarantaine systématique des chiens conformes n'a été trouvée. Les animaux non conformes ou malades peuvent être retenus pour examen.", es: "No se encontró ninguna norma oficial iraquí sobre cuarentena de rutina para perros de compañía que cumplen los requisitos. Los animales que no cumplen los requisitos o están enfermos pueden ser retenidos para examen.", pt: "Nenhuma norma oficial iraquiana sobre quarentena de rotina para cachorros de estimação em conformidade foi encontrada. Animais em não conformidade ou doentes podem ser retidos para exame." }
    exceptions: { en: "Confirm whether any quarantine applies to your dog's origin with the Ministry of Agriculture.", fr: "Confirme si une quarantaine s'applique à l'origine de ton chien auprès du ministère de l'Agriculture.", es: "Confirma si se aplica alguna cuarentena al origen de tu perro con el Ministerio de Agricultura.", pt: "Confirme com o Ministério da Agricultura se alguma quarentena se aplica à origem do seu cachorro." }
    ref: { en: "No official Iraqi specification found — verify with the Ministry of Agriculture", fr: "Aucune spécification officielle irakienne trouvée — à vérifier auprès du ministère de l'Agriculture", es: "No se encontró especificación oficial iraquí — verifícalo con el Ministerio de Agricultura", pt: "Nenhuma especificação oficial iraquiana encontrada — verifique com o Ministério da Agricultura" }
  - item: { en: "Restricted / banned breeds", fr: "Races interdites / restreintes", es: "Razas restringidas / prohibidas", pt: "Raças restritas / proibidas" }
    required: { en: "Not officially published", fr: "Non communiqué officiellement", es: "No publicado oficialmente", pt: "Não publicado oficialmente" }
    when: { en: "No official Iraqi breed-import law or dangerous-dog list could be verified from a government source.", fr: "Aucune loi irakienne d'importation par race ni liste de chiens dangereux n'a pu être vérifiée à partir d'une source gouvernementale.", es: "No se pudo verificar ninguna ley iraquí oficial de importación por razas ni lista de perros peligrosos a partir de una fuente gubernamental.", pt: "Nenhuma lei iraquiana oficial sobre importação de raças ou lista de cães perigosos pôde ser confirmada em fonte governamental." }
    exceptions: { en: "Confirm any breed restriction with the Ministry of Agriculture before travelling, as national rules can change.", fr: "Confirme toute restriction de race auprès du ministère de l'Agriculture avant de voyager, les règles nationales pouvant évoluer.", es: "Confirma cualquier restricción de raza con el Ministerio de Agricultura antes de viajar, ya que las normas nacionales pueden cambiar.", pt: "Confirme qualquer restrição de raça com o Ministério da Agricultura antes de viajar, pois as normas nacionais podem mudar." }
    ref: { en: "No official Iraqi breed law found — verify with the Ministry of Agriculture", fr: "Aucune loi de race irakienne officielle trouvée — à vérifier auprès du ministère de l'Agriculture", es: "No se encontró ley de razas iraquí oficial — verifícalo con el Ministerio de Agricultura", pt: "Nenhuma lei iraquiana oficial sobre raças encontrada — verifique com o Ministério da Agricultura" }

origin:
  eu:
    title: { en: "From Europe / the EU", fr: "Depuis l'Europe / l'UE", es: "Desde Europa / la UE", pt: "Da Europa / da UE" }
    body:
      en: "There is no EU pet-passport shortcut into Iraq: the EU passport is not an Iraqi document. A dog from Europe needs a valid rabies vaccination and an official international veterinary health certificate endorsed by the government vet before departure. Iraq publishes no bilateral EU model certificate, so request the exact certificate and any import permit from the Ministry of Agriculture before booking."
      fr: "Aucun raccourci « passeport européen » pour entrer en Irak : le passeport UE n'est pas un document irakien. Un chien venant d'Europe a besoin d'une vaccination antirabique valide et d'un certificat vétérinaire international officiel visé par le vétérinaire gouvernemental avant le départ. L'Irak ne publie pas de modèle bilatéral UE ; demande le certificat exact et un éventuel permis d'importation au ministère de l'Agriculture avant de réserver."
      es: "No hay atajo de «pasaporte europeo» para entrar en Irak: el pasaporte de la UE no es un documento iraquí. Un perro procedente de Europa necesita una vacunación antirrábica válida y un certificado sanitario veterinario internacional oficial refrendado por el veterinario del gobierno antes de la salida. Irak no publica un modelo de certificado bilateral para la UE, así que solicita el certificado exacto y cualquier permiso de importación al Ministerio de Agricultura antes de reservar."
      pt: "Não há atalho de passaporte europeu para entrar no Iraque: o passaporte da UE não é um documento iraquiano. Um cachorro vindo da Europa precisa de uma vacinação antirrábica válida e de um atestado de saúde veterinário internacional oficial, endossado pelo veterinário do governo, antes da partida. O Iraque não publica um modelo bilateral com a UE, portanto solicite o atestado exato e qualquer autorização de importação ao Ministério da Agricultura antes de reservar."
    cls: warn
  listed:
    title: { en: "From another rabies-controlled country", fr: "Depuis un autre pays à rage maîtrisée", es: "Desde otro país con la rabia controlada", pt: "De outro país com raiva controlada" }
    body:
      en: "From countries with a controlled rabies situation (United States, Canada, Gulf states, most of Europe and others), the same core scheme applies: valid rabies vaccination and an endorsed veterinary health certificate. For US-origin dogs the agreed certificate is valid for 30 days after issuance and does not require a rabies antibody test. From other countries, obtain the equivalent official export certificate and confirm any additional condition with the Ministry of Agriculture."
      fr: "Depuis les pays à situation rabique maîtrisée (États-Unis, Canada, pays du Golfe, la plupart de l'Europe, etc.), le même schéma de base s'applique : vaccination antirabique valide et certificat vétérinaire visé. Pour les chiens d'origine américaine, le certificat convenu est valable 30 jours après délivrance et n'exige pas de titrage antirabique. Depuis d'autres pays, obtiens le certificat d'exportation officiel équivalent et confirme toute condition supplémentaire auprès du ministère de l'Agriculture."
      es: "Desde países con una situación de rabia controlada (Estados Unidos, Canadá, los países del Golfo, la mayor parte de Europa y otros), se aplica el mismo sistema básico: vacunación antirrábica válida y un certificado sanitario veterinario refrendado. Para los perros de origen estadounidense, el certificado acordado es válido durante 30 días tras su expedición y no exige una prueba de titulación de rabia. Desde otros países, obtén el certificado de exportación oficial equivalente y confirma cualquier condición adicional con el Ministerio de Agricultura."
      pt: "Vindo de países com situação de raiva controlada (Estados Unidos, Canadá, países do Golfo, a maior parte da Europa e outros), aplica-se o mesmo esquema básico: vacinação antirrábica válida e atestado de saúde veterinário endossado. Para cachorros de origem americana, o atestado acordado é válido por 30 dias após a emissão e não exige teste sorológico antirrábico. De outros países, obtenha o atestado de exportação oficial equivalente e confirme qualquer condição adicional com o Ministério da Agricultura."
    cls: warn
  nonListed:
    title: { en: "From a high-rabies-risk country", fr: "Depuis un pays à haut risque rabique", es: "Desde un país de alto riesgo de rabia", pt: "De um país de alto risco de raiva" }
    body:
      en: "From a high-rabies-risk origin, expect closer scrutiny and possibly additional measures decided case-by-case. Iraq itself is classified as high-risk for dog rabies, so origin disease status matters. The official health certificate must reflect the dog's rabies vaccination and confirm it comes from an area not quarantined for rabies. Dogs from areas under rabies restriction may face extra checks or refusal — verify with the Ministry of Agriculture well ahead of travel."
      fr: "Depuis une origine à haut risque rabique, attends-toi à un contrôle renforcé et possiblement à des mesures supplémentaires décidées au cas par cas. L'Irak elle-même est classée à haut risque pour la rage canine ; le statut sanitaire de l'origine compte donc. Le certificat officiel doit refléter la vaccination antirabique du chien et attester qu'il provient d'une zone non placée sous quarantaine rabique. Un chien venant d'une zone sous restriction rabique peut subir des contrôles supplémentaires ou un refus — vérifie auprès du ministère de l'Agriculture bien avant le voyage."
      es: "Desde un origen de alto riesgo de rabia, espera un control más estricto y posiblemente medidas adicionales decididas caso por caso. El propio Irak está clasificado como de alto riesgo para la rabia canina, por lo que la situación sanitaria del origen importa. El certificado oficial debe reflejar la vacunación antirrábica del perro y confirmar que procede de una zona no sometida a cuarentena por rabia. Los perros procedentes de zonas bajo restricción por rabia pueden enfrentarse a controles adicionales o al rechazo — verifícalo con el Ministerio de Agricultura mucho antes del viaje."
      pt: "Vindo de uma origem de alto risco de raiva, espere um controle mais rigoroso e possivelmente medidas adicionais decididas caso a caso. O próprio Iraque é classificado como de alto risco para raiva canina, portanto a situação sanitária da origem importa. O atestado de saúde oficial deve refletir a vacinação antirrábica do cachorro e confirmar que ele vem de uma área não colocada em quarentena por raiva. Cachorros vindos de áreas sob restrição por raiva podem enfrentar controles adicionais ou recusa — verifique com o Ministério da Agricultura com bastante antecedência."
    cls: no

arrival:
  intro:
    en: "When your dog reaches Iraq, the General Authority of Customs and the Ministry of Agriculture's veterinary services handle the check at the port of entry."
    fr: "À l'arrivée de ton chien en Irak, l'Autorité générale des douanes et les services vétérinaires du ministère de l'Agriculture effectuent le contrôle au point d'entrée."
    es: "Cuando tu perro llega a Irak, la Autoridad General de Aduanas y los servicios veterinarios del Ministerio de Agricultura realizan el control en el punto de entrada."
    pt: "Quando o seu cachorro chega ao Iraque, a Autoridade Geral de Alfândega e os serviços veterinários do Ministério da Agricultura cuidam do controle no ponto de entrada."
  points:
    - en: "Travel with the original official veterinary health certificate; the US model is valid for only 30 days after issuance and must still be valid on the day of entry."
      fr: "Voyage avec le certificat vétérinaire officiel original ; le modèle américain n'est valable que 30 jours après délivrance et doit être encore valide le jour de l'entrée."
      es: "Viaja con el certificado sanitario veterinario oficial original; el modelo estadounidense solo es válido durante 30 días tras su expedición y debe seguir siendo válido el día de la entrada."
      pt: "Viaje com o atestado de saúde veterinário oficial original; o modelo americano é válido por apenas 30 dias após a emissão e precisa continuar válido no dia da entrada."
    - en: "The dog is checked against the health certificate, identification (microchip or name) and rabies vaccination record."
      fr: "Le chien est contrôlé au regard du certificat sanitaire, de l'identification (puce ou nom) et du carnet de vaccination antirabique."
      es: "El perro se coteja con el certificado sanitario, la identificación (microchip o nombre) y el registro de vacunación antirrábica."
      pt: "O cachorro é conferido em relação ao atestado de saúde, à identificação (microchip ou nome) e ao registro de vacinação antirrábica."
    - en: "Carry original documents — the government-endorsed health certificate and vaccination records — not copies."
      fr: "Munis-toi des documents originaux — le certificat sanitaire visé par l'autorité et le carnet de vaccination — pas de copies."
      es: "Lleva los documentos originales — el certificado sanitario refrendado por el gobierno y los registros de vacunación — no copias."
      pt: "Leve os documentos originais — o atestado de saúde endossado pelo governo e os registros de vacinação — não cópias."
    - en: "If documents are missing or invalid, the animal may be held, refused entry or returned at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, l'animal peut être retenu, refusé ou renvoyé aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, el animal puede ser retenido, rechazado en la entrada o devuelto a cargo del propietario."
      pt: "Se faltarem documentos ou eles forem inválidos, o animal pode ser retido, ter a entrada recusada ou ser devolvido às custas do dono."
    - en: "Where possible, arrive on a weekday during office hours so the on-duty state vet can clear the animal promptly."
      fr: "Si possible, arrive en semaine et pendant les heures de bureau pour que le vétérinaire d'État de service puisse dédouaner l'animal rapidement."
      es: "Si es posible, llega en día laborable y en horario de oficina para que el veterinario estatal de guardia pueda despachar al animal con prontitud."
      pt: "Sempre que possível, chegue em um dia útil durante o horário de expediente para que o veterinário estatal de plantão possa liberar o animal rapidamente."

