restrictedDogs:
  intro:
    en: "In March 2024 India's Department of Animal Husbandry & Dairying issued a circular advising states not to allow the import, sale, breeding or keeping of about 23 dog breeds considered 'ferocious' and dangerous to human life (including pit bull terrier, Rottweiler, Tosa Inu, dogo Argentino, fila Brasileiro, American bulldog, Boerboel, presa Canario, wolf-dog hybrids and others)."
    fr: "En mars 2024, le Department of Animal Husbandry & Dairying indien a émis une circulaire conseillant aux États de ne pas autoriser l'import, la vente, l'élevage ou la détention d'environ 23 races de chiens jugées « féroces » et dangereuses pour la vie humaine (dont pit bull terrier, Rottweiler, Tosa Inu, dogo Argentino, fila Brasileiro, American bulldog, boerboel, presa Canario, hybrides chien-loup et autres)."
    es: "En marzo de 2024, el Department of Animal Husbandry & Dairying de la India emitió una circular que aconsejaba a los estados no permitir la importación, venta, cría o tenencia de unas 23 razas de perros consideradas «feroces» y peligrosas para la vida humana (entre ellas pit bull terrier, Rottweiler, Tosa Inu, dogo argentino, fila brasileño, American bulldog, boerboel, presa canario, híbridos de perro y lobo y otras)."
    pt: "Em março de 2024, o Department of Animal Husbandry & Dairying da Índia emitiu uma circular orientando os estados a não permitir a importação, a venda, a criação ou a posse de cerca de 23 raças de cachorros consideradas “ferozes” e perigosas para a vida humana (entre elas pit bull terrier, rottweiler, tosa inu, dogo argentino, fila brasileiro, american bulldog, boerboel, presa canário, híbridos de lobo com cachorro e outras)."
  cat1:
    en: "Legal status: the 2024 circular was challenged and stayed or set aside by several High Courts (the Delhi High Court set it aside for lack of procedural fairness; the Karnataka and Calcutta High Courts stayed it), and the central government told the Bombay High Court it would not enforce the circular while it reconsiders after a public notice inviting objections. It is therefore not currently in force as a nationwide import ban."
    fr: "Statut juridique : la circulaire de 2024 a été contestée et suspendue ou annulée par plusieurs Hautes Cours (la Haute Cour de Delhi l'a annulée pour absence d'équité procédurale ; les Hautes Cours du Karnataka et de Calcutta l'ont suspendue), et le gouvernement central a indiqué à la Haute Cour de Bombay qu'il ne l'appliquerait pas pendant son réexamen après un avis public appelant des objections. Elle n'est donc pas actuellement en vigueur comme interdiction d'import nationale."
    es: "Situación jurídica: la circular de 2024 fue impugnada y suspendida o anulada por varios Tribunales Superiores (el Tribunal Superior de Delhi la anuló por falta de equidad procesal; los Tribunales Superiores de Karnataka y Calcuta la suspendieron), y el gobierno central comunicó al Tribunal Superior de Bombay que no la aplicaría mientras la reconsidera tras un aviso público que invita a presentar objeciones. Por tanto, no está actualmente en vigor como prohibición de importación de ámbito nacional."
    pt: "Situação jurídica: a circular de 2024 foi contestada e suspensa ou anulada por vários High Courts (o Delhi High Court a anulou por falta de devido processo; os High Courts de Karnataka e de Calcutá a suspenderam), e o governo central informou ao Bombay High Court que não aplicaria a circular enquanto a reexamina, após um edital público convidando à apresentação de objeções. Portanto, ela não está atualmente em vigor como proibição nacional de importação."
  cat2:
    en: "Practical effect: because the circular has been stayed/set aside and is not being enforced, breed status is uncertain and may change once the government finalises its decision. No settled national breed-import ban currently applies, but some states may act independently."
    fr: "Effet pratique : la circulaire ayant été suspendue/annulée et n'étant pas appliquée, le statut des races est incertain et peut évoluer une fois la décision du gouvernement finalisée. Aucune interdiction nationale d'import de races n'est actuellement établie, mais certains États peuvent agir de leur propre chef."
    es: "Efecto práctico: como la circular ha sido suspendida/anulada y no se está aplicando, la situación de las razas es incierta y puede cambiar una vez que el gobierno finalice su decisión. Actualmente no se aplica ninguna prohibición nacional consolidada de importación por razas, pero algunos estados pueden actuar de forma independiente."
    pt: "Efeito prático: como a circular foi suspensa/anulada e não está sendo aplicada, a situação das raças é incerta e pode mudar quando o governo concluir sua decisão. Nenhuma proibição nacional consolidada de importação por raça se aplica atualmente, mas alguns estados podem agir por conta própria."
  note:
    en: "Because this area is unsettled, confirm the current breed rules with AQCS/DAHD and your destination state before you travel — do not rely on the 2024 list being either in force or fully withdrawn."
    fr: "Ce domaine étant instable, vérifie les règles de races actuelles auprès de l'AQCS/DAHD et de ton État de destination avant de voyager — ne présume pas que la liste de 2024 est en vigueur ni totalement retirée."
    es: "Como este ámbito no está resuelto, confirma las normas de razas vigentes con la AQCS/DAHD y con tu estado de destino antes de viajar — no des por hecho que la lista de 2024 esté en vigor ni totalmente retirada."
    pt: "Como o tema está indefinido, confirme as regras atuais sobre raças com a AQCS/DAHD e com o estado de destino antes de viajar — não presuma que a lista de 2024 esteja em vigor nem que tenha sido totalmente revogada."

checklist:
  - en: "Confirm your import category: transfer of residence (baggage), DGFT licence, or re-import"
    fr: "Confirme ton catégorie d'import : transfert de résidence (bagage), licence DGFT ou ré-importation"
    es: "Confirma tu categoría de importación: traslado de residencia (equipaje), licencia DGFT o reimportación"
    pt: "Confirme sua categoria de importação: transferência de domicílio (bagagem), licença DGFT ou reimportação"
  - en: "Advance NOC applied for at an AQCS station at least 7 working days before departure"
    fr: "NOC anticipé demandé à une station AQCS au moins 7 jours ouvrés avant le départ"
    es: "NOC previo solicitado en una estación AQCS al menos 7 días laborables antes de la salida"
    pt: "NOC prévio solicitado em uma estação da AQCS pelo menos 7 dias úteis antes da partida"
  - en: "Microchip readable on arrival (ISO 11784/11785 recommended)"
    fr: "Puce lisible à l'arrivée (ISO 11784/11785 recommandée)"
    es: "Microchip legible a la llegada (se recomienda ISO 11784/11785)"
    pt: "Microchip legível na chegada (recomendado ISO 11784/11785)"
  - en: "Rabies vaccination certified: dog ≥3 months, shot >1 month and <12 months before embarkation"
    fr: "Vaccination antirabique certifiée : chien ≥3 mois, vaccin de plus d'un mois et de moins de 12 mois avant l'embarquement"
    es: "Vacunación antirrábica certificada: perro ≥3 meses, vacuna de más de 1 mes y de menos de 12 meses antes del embarque"
    pt: "Vacinação antirrábica certificada: cachorro com ≥3 meses, dose aplicada há >1 mês e <12 meses antes do embarque"
  - en: "Official health certificate from the country of origin, signed by the competent authority, owner name matching the ticket"
    fr: "Certificat sanitaire officiel du pays d'origine, signé par l'autorité compétente, nom du propriétaire correspondant au billet"
    es: "Certificado sanitario oficial del país de origen, firmado por la autoridad competente, con el nombre del propietario coincidiendo con el billete"
    pt: "Atestado de saúde oficial do país de origem, assinado pela autoridade competente, com o nome do dono igual ao da passagem"
  - en: "Transfer-of-residence proof (≥2 years abroad + relocation) or a valid DGFT licence"
    fr: "Preuve de transfert de résidence (≥2 ans à l'étranger + relocalisation) ou licence DGFT valide"
    es: "Prueba de traslado de residencia (≥2 años en el extranjero + mudanza) o una licencia DGFT válida"
    pt: "Comprovação de transferência de domicílio (≥2 anos no exterior + mudança) ou licença DGFT válida"
  - en: "Flight arriving at an AQCS airport (Delhi, Mumbai, Chennai, Kolkata, Bengaluru, Hyderabad)"
    fr: "Vol arrivant dans un aéroport AQCS (Delhi, Mumbai, Chennai, Kolkata, Bengaluru, Hyderabad)"
    es: "Vuelo que llega a un aeropuerto AQCS (Delhi, Mumbai, Chennai, Kolkata, Bengaluru, Hyderabad)"
    pt: "Voo que chega a um aeroporto com AQCS (Delhi, Mumbai, Chennai, Kolkata, Bengaluru, Hyderabad)"
  - en: "Suitable travel crate if travelling in the hold, plus airway bill / passport / e-ticket copies"
    fr: "Caisse de transport adaptée si voyage en soute, plus copies de la lettre de transport aérien / passeport / e-billet"
    es: "Jaula de transporte adecuada si viaja en bodega, más copias de la carta de porte aéreo / pasaporte / billete electrónico"
    pt: "Caixa de transporte adequada se viajar no porão, mais cópias do conhecimento aéreo / passaporte / passagem eletrônica"
  - en: "Check the current status of the 2024 'ferocious breeds' guidance for your breed and destination state"
    fr: "Vérifie le statut actuel de la directive 2024 sur les « races féroces » pour ta race et ton État de destination"
    es: "Comprueba la situación actual de la directriz de 2024 sobre «razas feroces» para tu raza y tu estado de destino"
    pt: "Verifique a situação atual da orientação de 2024 sobre “raças ferozes” para a sua raça e o seu estado de destino"

