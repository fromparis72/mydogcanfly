# Country Entry Guide — India (source of truth, bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_in
iso2: "IN"
name: { en: "India", fr: "Inde", es: "India", pt: "Índia" }
region: { en: "Asia", fr: "Asie", es: "Asia", pt: "Ásia" }


regime: non_listed
domestic:
  intro:
    en: "Domestic flight in India: no import formality, but a veterinary health certificate is legally required."
    fr: "Vol intérieur en Inde : aucune formalité d'import, mais un certificat sanitaire vétérinaire est légalement exigé."
    es: "Vuelo nacional en India: ningún trámite de importación, pero se exige legalmente un certificado sanitario veterinario."
    pt: "Voo doméstico na Índia: nenhuma formalidade de importação, mas um atestado de saúde veterinário é exigido por lei."
  points:
    - en: "The Transport of Animals Rules 1978 require a health certificate from a qualified vet, certifying the dog is fit to travel and free of infectious disease including rabies; the animal must be examined within 12 hours of departure."
      fr: "Les Transport of Animals Rules de 1978 imposent un certificat de santé d'un vétérinaire qualifié, attestant que le chien est apte au voyage et indemne de maladie contagieuse dont la rage ; l'animal doit être examiné dans les 12 heures précédant le départ."
      es: "Las Transport of Animals Rules de 1978 exigen un certificado de salud de un veterinario cualificado, que acredite que el perro está apto para viajar y libre de enfermedad contagiosa incluida la rabia; debe examinarse en las 12 horas previas a la salida."
      pt: "As Transport of Animals Rules 1978 (normas indianas de transporte de animais) exigem um atestado de saúde emitido por um veterinário habilitado, certificando que o cachorro está apto a viajar e livre de doenças infecciosas, inclusive a raiva; o animal deve ser examinado nas 12 horas anteriores à partida."
    - en: "Without that certificate the carrier must refuse the animal. Cabin, hold and breed conditions are then set by each airline."
      fr: "Sans ce certificat, la compagnie doit refuser l'animal. Les conditions de cabine, de soute et de race sont ensuite propres à chaque compagnie."
      es: "Sin ese certificado, la aerolínea debe rechazar al animal. Las condiciones de cabina, bodega y raza las fija luego cada aerolínea."
      pt: "Sem esse atestado, a transportadora deve recusar o animal. As condições de cabine, de porão e de raça são definidas por cada companhia aérea."
exit:
  authority: AQCS
  authorityUrl: https://aqcsindia.gov.in/Home/ExportPets
  intro:
    en: "India is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an AQCS export certificate."
    fr: "L'Inde est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat d'export AQCS."
    es: "India no está listada: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado de exportación de AQCS."
    pt: "A Índia é um país não listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um certificado de exportação da AQCS."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: any
      text:
        en: "Get a fit-to-fly certificate from a registered vet, then submit the dog and documents to the AQCS quarantine office 7 days before departure (by appointment); the AQCS export certificate is valid 10 days from issue."
        fr: "Obtiens un certificat d'aptitude au vol d'un vétérinaire enregistré, puis présente le chien et les documents au bureau de quarantaine AQCS 7 jours avant le départ (sur rendez-vous) ; le certificat d'export AQCS est valable 10 jours."
        es: "Consigue un certificado de aptitud para volar de un veterinario registrado y luego presenta al perro y los documentos en la oficina de cuarentena de AQCS 7 días antes de salir (con cita); el certificado de exportación de AQCS es válido 10 días."
        pt: "Obtenha um atestado de aptidão para voar com um veterinário registrado e depois apresente o cachorro e os documentos ao escritório de quarentena da AQCS 7 dias antes da partida (com hora marcada); o certificado de exportação da AQCS é válido por 10 dias a partir da emissão."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to India with your dog", fr: "Voyager en Inde avec ton chien", es: "Viajar a la India con tu perro", pt: "Viajar para a Índia com o seu cachorro" }
  intro:
    en: >-
      India welcomes pet dogs, but under a strict national scheme run by the Animal Quarantine and
      Certification Services (AQCS) of the Department of Animal Husbandry & Dairying (DAHD). Every dog
      needs an advance No Objection Certificate (NOC) from an AQCS station before it can be flown in, and
      is physically examined on arrival. What you can bring depends mainly on your own situation: a
      returning resident transferring residence to India may import up to two pets as baggage, while
      short visits or other purposes require a licence from the Directorate General of Foreign Trade
      (DGFT). India does not require a rabies antibody test, but it does require a certified rabies
      vaccination and an official health certificate. This guide explains each case so you know exactly
      what to prepare before you book your flight.
    fr: >-
      L'Inde accueille les chiens de compagnie, mais dans le cadre d'un régime national strict géré par
      les Animal Quarantine and Certification Services (AQCS) du Department of Animal Husbandry & Dairying
      (DAHD). Chaque chien doit obtenir à l'avance un No Objection Certificate (NOC) auprès d'une station
      AQCS avant de pouvoir voyager, et fait l'objet d'un examen physique à l'arrivée. Ce que tu peux
      importer dépend surtout de ta situation : un résident de retour qui transfère sa résidence en
      Inde peut importer jusqu'à deux animaux comme bagage, tandis qu'un court séjour ou un autre motif
      exige une licence de la Directorate General of Foreign Trade (DGFT). L'Inde n'exige pas de titrage
      antirabique, mais impose une vaccination antirabique certifiée et un certificat sanitaire officiel.
      Ce guide détaille chaque cas pour savoir exactement quoi préparer avant de réserver ton vol.
    es: >-
      La India acoge a los perros de compañía, pero bajo un estricto régimen nacional gestionado por los
      Animal Quarantine and Certification Services (AQCS) del Department of Animal Husbandry & Dairying
      (DAHD). Todo perro necesita un No Objection Certificate (NOC) previo de una estación AQCS antes de
      poder volar, y es examinado físicamente a la llegada. Lo que puedes traer depende sobre todo de tu
      propia situación: un residente que regresa y traslada su residencia a la India puede importar hasta
      dos mascotas como equipaje, mientras que las visitas cortas u otros motivos requieren una licencia
      de la Directorate General of Foreign Trade (DGFT). La India no exige una prueba de titulación de
      rabia, pero sí una vacunación antirrábica certificada y un certificado sanitario oficial. Esta guía
      explica cada caso para que sepas exactamente qué preparar antes de reservar tu vuelo.

    pt: "A Índia aceita cachorros de estimação, mas dentro de um regime nacional rigoroso conduzido pelo Animal Quarantine and Certification Services (AQCS), do Department of Animal Husbandry & Dairying (DAHD). Todo cachorro precisa de um No Objection Certificate (NOC) prévio, emitido por uma estação da AQCS, antes de poder ser embarcado, e é examinado fisicamente na chegada. O que você pode levar depende sobretudo da sua própria situação: um residente que retorna e transfere seu domicílio para a Índia pode importar até dois animais de estimação como bagagem, enquanto visitas curtas ou outras finalidades exigem uma licença do Directorate General of Foreign Trade (DGFT). A Índia não exige teste sorológico antirrábico, mas exige uma vacinação antirrábica certificada e um atestado de saúde oficial. Este guia explica cada caso para que você saiba exatamente o que preparar antes de comprar a passagem."
difficulty:
  level: difficult
  label: { en: "Moderate to difficult (NOC + eligibility rules)", fr: "Modéré à difficile (NOC + règles d'éligibilité)", es: "De moderado a difícil (NOC + reglas de elegibilidad)", pt: "Moderada a difícil (NOC + regras de elegibilidade)" }

prepTime:
  eu:
    en: "Transfer of residence (up to 2 pets as baggage): allow ~2–4 weeks — advance NOC from AQCS issued within about 7 working days, plus vaccination and health-certificate preparation."
    fr: "Transfert de résidence (jusqu'à 2 animaux en bagage) : compte ~2 à 4 semaines — NOC anticipé de l'AQCS délivré sous environ 7 jours ouvrés, plus la vaccination et le certificat sanitaire."
    es: "Traslado de residencia (hasta 2 mascotas como equipaje): prevé ~2–4 semanas — NOC previo de la AQCS emitido en unos 7 días laborables, más la preparación de la vacunación y del certificado sanitario."
    pt: "Transferência de domicílio (até 2 animais como bagagem): conte com cerca de 2 a 4 semanas — NOC prévio da AQCS emitido em cerca de 7 dias úteis, mais o preparo da vacinação e do atestado de saúde."
  listed:
    en: "Short visits / other purposes (DGFT licence): allow ~1–2 months — the DGFT import licence alone takes around a month, then the AQCS NOC on top."
    fr: "Courts séjours / autres motifs (licence DGFT) : compte ~1 à 2 mois — la licence d'importation DGFT prend à elle seule environ un mois, puis le NOC AQCS s'y ajoute."
    es: "Visitas cortas / otros motivos (licencia DGFT): prevé ~1–2 meses — la licencia de importación DGFT tarda por sí sola alrededor de un mes, y luego se añade el NOC de la AQCS."
    pt: "Visitas curtas / outras finalidades (licença DGFT): conte com cerca de 1 a 2 meses — só a licença de importação do DGFT leva cerca de um mês e, depois dela, ainda vem o NOC da AQCS."
  nonListed:
    en: "Re-import of a dog previously exported from India: allow ~2–4 weeks — advance NOC plus proof of the dog's earlier AQCS certification and current health certificate."
    fr: "Ré-importation d'un chien déjà exporté d'Inde : compte ~2 à 4 semaines — NOC anticipé, plus preuve de la certification AQCS antérieure et certificat sanitaire à jour."
    es: "Reimportación de un perro exportado previamente desde la India: prevé ~2–4 semanas — NOC previo, más prueba de la certificación AQCS anterior y un certificado sanitario vigente."
    pt: "Reimportação de um cachorro anteriormente exportado da Índia: conte com cerca de 2 a 4 semanas — NOC prévio, mais a comprovação da certificação anterior da AQCS e o atestado de saúde atual."

