# Country Entry Guide — Albania (bilingual EN/FR).
# Non-EU national scheme (National Food Authority AKU / Ministry of Agriculture bujqesia.gov.al,
# National Authority of Veterinary and Plant Protection AKVMB, Albanian Customs dogana.gov.al).
# Albania applies EU-equivalent pet-movement rules through its own bilingual model health certificate.
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_al
iso2: "AL"
name: { en: "Albania", fr: "Albanie", es: "Albania", pt: "Albânia" }
region: { en: "Europe (non-EU)", fr: "Europe (hors UE)", es: "Europa (fuera de la UE)", pt: "Europa (fora da UE)" }


regime: non_listed
exit:
  authority: AKU
  authorityUrl: https://aku.gov.al/
  intro:
    en: "Albania is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus a health certificate endorsed by a National Food Authority (AKU) official veterinarian."
    fr: "L'Albanie est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire visé par un vétérinaire officiel de l'Autorité nationale de l'alimentation (AKU)."
    es: "Albania no está listada: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario refrendado por un veterinario oficial de la Autoridad Nacional de Alimentos (AKU)."
    pt: "A Albânia é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde endossado por um veterinário oficial da Autoridade Nacional de Alimentos (AKU)."
  steps:
    - timing: longlead
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      text:
        en: "The EU-model animal health certificate is completed and signed by an AKU official veterinarian shortly before the flight."
        fr: "Le certificat sanitaire au modèle UE est rempli et signé par un vétérinaire officiel de l'AKU peu avant le vol."
        es: "El certificado sanitario en modelo UE lo rellena y firma un veterinario oficial de la AKU poco antes del vuelo."
        pt: "O certificado sanitário no modelo da UE é preenchido e assinado por um veterinário oficial da AKU pouco antes do voo."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Albania with your dog", fr: "Voyager en Albanie avec ton chien", es: "Viajar a Albania con tu perro", pt: "Viajar para a Albânia com seu cachorro" }
  intro:
    en: >-
      Albania welcomes dogs, but what you need to prepare depends mainly on the country your dog is
      travelling from — not only on Albania itself. Albania is not an EU member; it runs its own national
      scheme through the National Food Authority (AKU) and the veterinary authority, closely aligned with
      EU pet-movement rules. An ISO microchip and a valid rabies vaccination are always required, together
      with an international veterinary health certificate issued before departure. A dog arriving from the
      EU or another listed country (such as the United States, Canada or the United Kingdom) needs the
      certificate but no blood test. A dog from a non-listed, rabies-risk country faces the longest path,
      including a rabies antibody test and a three-month wait. This guide explains each case so you know
      exactly what to prepare before you book your flight.
    fr: >-
      L'Albanie accueille les chiens, mais ce qu'il faut préparer dépend surtout du pays d'où ton chien
      voyage — pas seulement de l'Albanie. L'Albanie n'est pas membre de l'UE ; elle applique son propre
      dispositif national via l'Autorité nationale de l'alimentation (AKU) et l'autorité vétérinaire, très
      proche des règles européennes de mouvement des animaux. Une puce ISO et une vaccination antirabique
      valide sont toujours exigées, ainsi qu'un certificat vétérinaire international établi avant le départ.
      Un chien arrivant de l'UE ou d'un autre pays listé (États-Unis, Canada, Royaume-Uni…) a besoin du
      certificat mais pas de prise de sang. Un chien venant d'un pays non listé, à risque rabique, suit le
      parcours le plus long, avec un titrage antirabique et un délai de trois mois. Ce guide détaille chaque
      cas pour savoir exactement quoi préparer avant de réserver ton vol.
    es: >-
      Albania acoge a los perros, pero lo que debes preparar depende sobre todo del país desde el que
      viaja tu perro — no solo de Albania. Albania no es Estado miembro de la UE; aplica su propio sistema
      nacional a través de la Autoridad Nacional de Alimentación (AKU) y la autoridad veterinaria, muy
      alineado con las normas europeas de movimiento de animales de compañía. Siempre se exigen un microchip
      ISO y una vacunación antirrábica válida, junto con un certificado sanitario veterinario internacional
      expedido antes de la salida. Un perro que llega de la UE o de otro país listado (como Estados Unidos,
      Canadá o el Reino Unido) necesita el certificado, pero no una prueba de sangre. Un perro procedente de
      un país no listado, con riesgo de rabia, se enfrenta al camino más largo, que incluye una prueba de
      titulación de rabia y una espera de tres meses. Esta guía explica cada caso para que sepas exactamente
      qué preparar antes de reservar tu vuelo.

    pt: "A Albânia recebe bem os cachorros, mas o que você precisa preparar depende principalmente do país de onde seu cachorro parte — e não só da Albânia em si. A Albânia não é membro da UE; ela aplica seu próprio regime nacional, conduzido pela Autoridade Nacional de Alimentos (AKU) e pela autoridade veterinária, bem alinhado com as regras europeias de circulação de animais de estimação. Microchip ISO e vacinação antirrábica válida são sempre obrigatórios, junto com um atestado de saúde veterinário internacional emitido antes da partida. Um cachorro que chega da UE ou de outro país listado (como Estados Unidos, Canadá ou Reino Unido) precisa do certificado, mas não de exame de sangue. Um cachorro vindo de um país não listado, de risco de raiva, enfrenta o caminho mais longo, com teste sorológico antirrábico (titulação) e três meses de espera. Este guia explica cada caso para você saber exatamente o que preparar antes de comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Easy to difficult (depends on origin)", fr: "Facile à difficile (selon l'origine)", es: "De fácil a difícil (según el origen)", pt: "De fácil a difícil (depende da origem)" }

prepTime:
  eu:
    en: "A few days to ~3 weeks: if the rabies shot is current you mainly need the health certificate; allow +21 days if the first vaccination is still needed."
    fr: "Quelques jours à ~3 semaines : si le vaccin antirabique est à jour il reste surtout le certificat sanitaire ; compte +21 jours si la première vaccination reste à faire."
    es: "De unos días a ~3 semanas: si la vacuna antirrábica está al día, sobre todo necesitas el certificado sanitario; calcula +21 días si aún falta la primera vacunación."
    pt: "De alguns dias a ~3 semanas: se a vacina antirrábica estiver em dia, você precisa basicamente do atestado de saúde; conte +21 dias se a primeira vacinação ainda estiver pendente."
  listed:
    en: "~3–4 weeks: 21-day wait after the rabies shot, plus a health certificate endorsed within 10 days of travel."
    fr: "~3–4 semaines : délai de 21 jours après le vaccin, plus un certificat sanitaire visé dans les 10 jours avant le voyage."
    es: "~3–4 semanas: espera de 21 días tras la vacuna antirrábica, más un certificado sanitario refrendado en los 10 días previos al viaje."
    pt: "~3–4 semanas: 21 dias de espera após a vacina antirrábica, mais um atestado de saúde endossado nos 10 dias antes da viagem."
  nonListed:
    en: "~4–7 months: antibody test at least 30 days after vaccination, then a compulsory 3-month wait before entry."
    fr: "~4–7 mois : titrage au moins 30 jours après le vaccin, puis un délai obligatoire de 3 mois avant l'entrée."
    es: "~4–7 meses: prueba de titulación al menos 30 días después de la vacuna, y luego una espera obligatoria de 3 meses antes de la entrada."
    pt: "~4–7 meses: teste sorológico antirrábico (titulação) pelo menos 30 dias após a vacinação, seguido de uma espera obrigatória de 3 meses antes da entrada."

