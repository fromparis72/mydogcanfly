origin:
  scheme: eu
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate and normally no border check."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire et normalement pas de contrôle frontalier."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario y normalmente sin control fronterizo."
      pt: "Um cachorro vindo de outro país da UE precisa de um passaporte europeu que comprove um microchip ISO válido e uma vacinação antirrábica em dia. Sem teste sorológico, sem certificado sanitário e, normalmente, sem controle de fronteira."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Switzerland, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination and an EU animal health certificate endorsed by an official vet before departure. No antibody test is required; declare your dog to customs on arrival."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Suisse, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire européen visé par un vétérinaire officiel avant le départ. Pas de titrage ; déclare ton chien à la douane à l'arrivée."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Suiza, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal de la UE refrendado por un veterinario oficial antes de la salida. No se exige prueba de titulación; declara tu perro en la aduana a la llegada."
      pt: "De um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Suíça, Japão, Austrália e outros), seu cachorro precisa de microchip, vacinação antirrábica válida e certificado sanitário europeu endossado por um veterinário oficial antes da partida. Não é exigido teste sorológico antirrábico; declare seu cachorro à alfândega na chegada."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-designated laboratory, then a compulsory 3-month wait before entry. An endorsed EU animal health certificate is also required."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen visé est également requis."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exige un certificado sanitario animal de la UE refrendado."
      pt: "Vindo de um país não listado (de risco), acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório designado pela UE, e depois 3 meses obrigatórios de espera antes da entrada. Também é exigido um certificado sanitário europeu endossado."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Austria depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien en Autriche dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Austria depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega à Áustria depende do lugar de onde você voou."
  points:
    - from: eu
      en: "From another EU country: no systematic border check — keep the EU pet passport with you."
      fr: "Depuis un autre pays de l'UE : pas de contrôle systématique — garde le passeport européen sur toi."
      es: "Desde otro país de la UE: sin control fronterizo sistemático — lleva contigo el pasaporte europeo."
      pt: "De outro país da UE: sem controle de fronteira sistemático — leve o passaporte europeu com você."
    - from: non_eu
      en: "From outside the EU: declare your dog to Austrian customs at a designated point of entry (use the red exit, e.g. at Vienna-Schwechat); at the EU external border an official vet decides on admissibility."
      fr: "Depuis hors UE : déclare ton chien à la douane autrichienne à un point d'entrée désigné (sortie rouge, ex. à Vienne-Schwechat) ; à la frontière extérieure de l'UE, un vétérinaire officiel décide de l'admissibilité."
      es: "Desde fuera de la UE: declara tu perro en la aduana austriaca en un punto de entrada designado (usa la salida roja, p. ej. en Viena-Schwechat); en la frontera exterior de la UE un veterinario oficial decide sobre la admisibilidad."
      pt: "De fora da UE: declare seu cachorro à alfândega austríaca em um ponto de entrada designado (use a saída vermelha, por exemplo em Viena-Schwechat); na fronteira externa da UE, um veterinário oficial decide sobre a admissibilidade."
    - en: "No import permit is issued and no prior appointment with customs is needed for private pet travel."
      fr: "Aucun permis d'import n'est délivré et aucun rendez-vous préalable avec la douane n'est nécessaire pour le voyage privé."
      es: "No se expide ningún permiso de importación ni se necesita cita previa con la aduana para el viaje privado."
      pt: "Nenhuma licença de importação é emitida e não é preciso agendamento prévio com a alfândega para a viagem particular com animais."
    - en: "Carry original documents (not copies), in German or English, or officially translated."
      fr: "Munis-toi des documents originaux (pas de copies), en allemand ou en anglais, ou traduits officiellement."
      es: "Lleva los documentos originales (no copias), en alemán o en inglés, o traducidos oficialmente."
      pt: "Leve os documentos originais (não cópias), em alemão ou inglês, ou com tradução oficial."
    - en: "If documents are missing or invalid, authorities may order re-export, quarantine or, in the worst case, euthanasia — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, les autorités peuvent ordonner réexpédition, quarantaine ou, au pire, euthanasie — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, las autoridades pueden ordenar la reexpedición, la cuarentena o, en el peor de los casos, la eutanasia — a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, as autoridades podem determinar a reexportação, a quarentena ou, na pior das hipóteses, a eutanásia — às custas do dono."
    - en: "There is no national breed import ban, but if you settle with your dog, the dog-keeping rules of the destination Land (state) may apply."
      fr: "Il n'existe aucune interdiction nationale d'importation par race, mais si tu t'installes avec ton chien, la réglementation de détention du Land (état) de destination peut s'appliquer."
      es: "No existe ninguna prohibición nacional de importación por raza, pero si te instalas con tu perro, pueden aplicarse las normas de tenencia de perros del Land (estado) de destino."
      pt: "Não existe nenhuma proibição nacional de importação por raça, mas, se você se instalar com seu cachorro, podem se aplicar as regras de posse de cachorros do Land (Estado federado) de destino."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Austria has no uniform national breed ban and no national breed-based import prohibition. Dangerous-dog rules are set at the level of the Bundesländer (the nine federal states), so the rules depend on where in Austria you keep the dog."
    fr: "L'Autriche n'a pas d'interdiction nationale de races uniforme ni d'interdiction d'importation fondée sur la race. Les règles sur les chiens dangereux sont fixées au niveau des Bundesländer (les neuf états fédérés) ; elles dépendent donc de l'endroit où le chien est détenu."
    es: "Austria no tiene una prohibición nacional de razas uniforme ni una prohibición nacional de importación basada en la raza. Las normas sobre perros peligrosos se fijan a nivel de los Bundesländer (los nueve estados federados), por lo que las normas dependen del lugar de Austria donde tengas al perro."
    pt: "A Áustria não tem uma proibição nacional uniforme de raças nem uma proibição nacional de importação baseada na raça. As regras sobre cachorros perigosos são definidas no nível dos Bundesländer (os nove Estados federados), portanto dependem do lugar da Áustria onde o cachorro é mantido."
  cat1:
    en: "Only Vienna, Lower Austria (Niederösterreich) and Vorarlberg maintain official 'Listenhunde' lists (breeds such as American Staffordshire Terrier, Bull Terrier, Staffordshire Bull Terrier, Rottweiler, Dogo Argentino, Tosa Inu, Pit Bull Terrier, Mastino/Mastiff types and their crosses). Other states regulate dangerous dogs case-by-case rather than by a breed list."
    fr: "Seuls Vienne, la Basse-Autriche (Niederösterreich) et le Vorarlberg tiennent des listes officielles de « Listenhunde » (races telles qu'American Staffordshire Terrier, Bull Terrier, Staffordshire Bull Terrier, Rottweiler, Dogo Argentino, Tosa Inu, Pit Bull Terrier, types Mastino/Mastiff et leurs croisements). Les autres états réglementent les chiens dangereux au cas par cas plutôt que par une liste de races."
    es: "Solo Viena, Baja Austria (Niederösterreich) y Vorarlberg mantienen listas oficiales de «Listenhunde» (razas como American Staffordshire Terrier, Bull Terrier, Staffordshire Bull Terrier, Rottweiler, Dogo Argentino, Tosa Inu, Pit Bull Terrier, tipos Mastino/Mastiff y sus cruces). Los demás estados regulan los perros peligrosos caso por caso en lugar de mediante una lista de razas."
    pt: "Somente Viena, a Baixa Áustria (Niederösterreich) e o Vorarlberg mantêm listas oficiais de “Listenhunde” (raças como American Staffordshire Terrier, Bull Terrier, Staffordshire Bull Terrier, Rottweiler, Dogo Argentino, Tosa Inu, Pit Bull Terrier, tipos Mastino/Mastiff e seus cruzamentos). Os demais Estados federados regulam os cachorros perigosos caso a caso, em vez de por uma lista de raças."
  cat2:
    en: "Obligations differ by state: in Vienna the owner of a listed dog aged 6 months or more must pass a dog-licence test (Hundeführerschein), with muzzle and leash in public; in Lower Austria keeping a listed dog must be reported to the municipality without delay; in Vorarlberg keeping a listed dog is subject to authorisation. Muzzle and leash duties commonly apply."
    fr: "Les obligations varient selon l'état : à Vienne, le propriétaire d'un chien listé âgé de 6 mois ou plus doit passer un permis canin (Hundeführerschein), avec muselière et laisse en public ; en Basse-Autriche, la détention doit être déclarée sans délai à la commune ; au Vorarlberg, la détention d'un chien listé est soumise à autorisation. Muselière et laisse s'appliquent souvent."
    es: "Las obligaciones difieren según el estado: en Viena, el propietario de un perro listado de 6 meses o más debe aprobar un examen de licencia canina (Hundeführerschein), con bozal y correa en la vía pública; en Baja Austria, la tenencia de un perro listado debe comunicarse sin demora al municipio; en Vorarlberg, la tenencia de un perro listado está sujeta a autorización. Suelen aplicarse las obligaciones de bozal y correa."
    pt: "As obrigações variam conforme o Estado federado: em Viena, o tutor de um cachorro listado com 6 meses ou mais precisa ser aprovado em um exame de habilitação canina (Hundeführerschein), com focinheira e guia em local público; na Baixa Áustria, a posse de um cachorro listado deve ser comunicada ao município sem demora; no Vorarlberg, a posse de um cachorro listado está sujeita a autorização. Focinheira e guia costumam ser obrigatórias."
  note:
    en: "There is no single Austrian breed law — always check the rules of the destination Land (state) and municipality before travelling or settling with a listed breed."
    fr: "Il n'existe pas de loi nationale unique sur les races — vérifie toujours la réglementation du Land (état) et de la commune de destination avant de voyager ou de toi installer avec une race listée."
    es: "No existe una única ley austriaca sobre razas — comprueba siempre las normas del Land (estado) y del municipio de destino antes de viajar o instalarte con una raza listada."
    pt: "Não existe uma lei austríaca única sobre raças — verifique sempre as regras do Land (Estado federado) e do município de destino antes de viajar ou de se instalar com uma raça listada."

