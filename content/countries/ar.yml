factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Argentina (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — l'Argentine (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Argentina (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — a Argentina (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — Argentina", fr: "Pays de destination — Argentine", es: "País de destino — Argentina", pt: "País de destino — Argentina" }
      text:
        en: "Argentina applies its own SENASA scheme (Mercosur Res. GMC 17/15): one International Veterinary Certificate covering health, a valid rabies vaccination and antiparasitic treatment. No microchip, no antibody test and no quarantine are demanded."
        fr: "L'Argentine applique son propre régime SENASA (Mercosur Rés. GMC 17/15) : un Certificat Vétérinaire International couvrant la santé, une vaccination antirabique valide et un traitement antiparasitaire. Ni puce, ni titrage, ni quarantaine ne sont exigés."
        es: "Argentina aplica su propio régimen SENASA (Mercosur Res. GMC 17/15): un Certificado Veterinario Internacional que cubre la salud, una vacunación antirrábica válida y un tratamiento antiparasitario. No se exigen microchip, ni prueba de titulación, ni cuarentena."
        pt: "A Argentina aplica seu próprio esquema do SENASA (Res. GMC 17/15 do Mercosul): um Certificado Veterinário Internacional que cobre a saúde, a vacinação antirrábica válida e o tratamento antiparasitário. Não se exige microchip, nem teste sorológico, nem quarentena."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "The CVI must be issued, signed and stamped by the official veterinary authority of the country you depart from, in Spanish (or a legalized official passport, where English is also accepted). Its timing drives your whole preparation."
        fr: "Le CVI doit être émis, signé et scellé par l'autorité vétérinaire officielle du pays de départ, en espagnol (ou un passeport officiel légalisé, l'anglais étant alors aussi accepté). Ses délais rythment toute ton préparation."
        es: "El CVI debe ser emitido, firmado y sellado por la autoridad veterinaria oficial del país desde el que sales, en español (o un pasaporte oficial legalizado, en cuyo caso también se acepta el inglés). Sus plazos marcan toda tu preparación."
        pt: "O CVI precisa ser emitido, assinado e carimbado pela autoridade veterinária oficial do país de partida, em espanhol (ou um passaporte oficial legalizado, caso em que o inglês também é aceito). O prazo dele comanda toda a sua preparação."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A dog coming from a country or zone declared rabies-free by WOAH can enter if the CVI states that condition. For puppies, recent residence matters: no urban-rabies case may have occurred where they lived in the last 90 days."
        fr: "Un chien venant d'un pays ou d'une zone déclaré indemne de rage par l'OMSA peut entrer si le CVI en fait état. Pour les chiots, le séjour récent compte : aucun cas de rage urbaine ne doit être survenu là où ils ont vécu ces 90 derniers jours."
        es: "Un perro que viene de un país o zona declarado libre de rabia por la OMSA puede entrar si el CVI acredita esa condición. Para los cachorros, la residencia reciente importa: no debe haber ocurrido ningún caso de rabia urbana donde hayan vivido en los últimos 90 días."
        pt: "Um cachorro vindo de um país ou zona declarado livre de raiva pela WOAH pode entrar se o CVI atestar essa condição. Para filhotes, o local onde viveram recentemente conta: não pode ter havido caso de raiva urbana ali nos últimos 90 dias."
  note:
    en: "So read the requirements below as Argentina's framework, then confirm your dog's exact origin and history with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre argentin, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Argentina y luego confirma el origen y el historial exactos de tu perro con tu veterinario."
    pt: "Leia então as exigências abaixo como o quadro geral da Argentina, e confirme com seu veterinário a origem e o histórico exatos do seu cachorro."

