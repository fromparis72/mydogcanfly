    when: { en: "Issued within the 10 days before the CVI is issued, by an authorised vet, stating the dog is clinically healthy, free of parasitosis and fit to travel.", fr: "Émis dans les 10 jours avant l'émission du CVI, par un vétérinaire autorisé, attestant que le chien est cliniquement sain, exempt de parasitose et apte au voyage.", es: "Emitido en los 10 días previos a la emisión del CVI, por un veterinario autorizado, que acredite que el perro está clínicamente sano, libre de parasitosis y apto para viajar.", pt: "Emitido nos 10 dias anteriores ao CVI, por veterinário autorizado, atestando que o cachorro está clinicamente saudável, livre de parasitoses e apto a viajar." }
    exceptions: { en: "Its content is embedded in the International Veterinary Certificate (CVI).", fr: "Son contenu est intégré au Certificat Vétérinaire International (CVI).", es: "Su contenido está integrado en el Certificado Veterinario Internacional (CVI).", pt: "Seu conteúdo é incorporado ao Certificado Veterinário Internacional (CVI)." }
    ref: { en: "SENASA — Res. GMC 17/15", fr: "SENASA — Rés. GMC 17/15", es: "SENASA — Res. GMC 17/15", pt: "SENASA — Res. GMC 17/15" }
  - item: { en: "International Veterinary Certificate (CVI) or legalized passport", fr: "Certificat Vétérinaire International (CVI) ou passeport légalisé", es: "Certificado Veterinario Internacional (CVI) o pasaporte legalizado", pt: "Certificado Veterinário Internacional (CVI) ou passaporte legalizado" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "The CVI is issued, signed and stamped by the official veterinary authority of the country of origin/departure; one of its languages must be Spanish. Valid 60 calendar days from issue for entry.", fr: "Le CVI est émis, signé et scellé par l'autorité vétérinaire officielle du pays d'origine/départ ; l'une de ses langues doit être l'espagnol. Valable 60 jours calendaires depuis l'émission pour entrer.", es: "El CVI es emitido, firmado y sellado por la autoridad veterinaria oficial del país de origen/salida; una de sus lenguas debe ser el español. Válido 60 días naturales desde la emisión para la entrada.", pt: "O CVI é emitido, assinado e carimbado pela autoridade veterinária oficial do país de origem ou de partida; um de seus idiomas deve ser o espanhol. Vale 60 dias corridos a partir da emissão para a entrada." }
    exceptions: { en: "A current official pet passport is accepted instead if it carries the same sanitary information and is endorsed by the origin's veterinary authority; English is then also accepted alongside Spanish.", fr: "Un passeport officiel en cours de validité est accepté à la place s'il porte les mêmes informations sanitaires et est refrendé par l'autorité vétérinaire d'origine ; l'anglais est alors aussi accepté avec l'espagnol.", es: "En su lugar se acepta un pasaporte oficial de mascota vigente si contiene la misma información sanitaria y está refrendado por la autoridad veterinaria de origen; en ese caso también se acepta el inglés junto con el español.", pt: "Um passaporte oficial para animais dentro da validade é aceito no lugar dele se trouxer as mesmas informações sanitárias e for endossado pela autoridade veterinária da origem; nesse caso, o inglês também é aceito junto com o espanhol." }
    ref: { en: "SENASA — Ingresos con perros y/o gatos", fr: "SENASA — Ingresos con perros y/o gatos", es: "SENASA — Ingresos con perros y/o gatos", pt: "SENASA — Ingresos con perros y/o gatos" }
  - item: { en: "Antiparasitic treatment (internal & external)", fr: "Traitement antiparasitaire (interne & externe)", es: "Tratamiento antiparasitario (interno y externo)", pt: "Tratamento antiparasitário (interno e externo)" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Treatment against internal and external parasites within the 15 days before the CVI is issued (or before the passport is endorsed), with products approved in the country of origin.", fr: "Traitement contre les parasites internes et externes dans les 15 jours avant l'émission du CVI (ou l'intervention du passeport), avec des produits approuvés dans le pays d'origine.", es: "Tratamiento contra los parásitos internos y externos en los 15 días previos a la emisión del CVI (o al refrendo del pasaporte), con productos aprobados en el país de origen.", pt: "Tratamento contra parasitas internos e externos nos 15 dias anteriores à emissão do CVI (ou ao endosso do passaporte), com produtos aprovados no país de origem." }
    exceptions: { en: "—", fr: "—", es: "—", pt: "—" }
    ref: { en: "SENASA — Res. GMC 17/15", fr: "SENASA — Rés. GMC 17/15", es: "SENASA — Res. GMC 17/15", pt: "SENASA — Res. GMC 17/15" }
  - item: { en: "Advance notification / import permit", fr: "Notification préalable / permis d'importation", es: "Notificación previa / permiso de importación", pt: "Notificação prévia / autorização de importação" }
    required: { en: "Not required (accompanied pet)", fr: "Non requis (animal accompagné)", es: "No obligatorio (mascota acompañada)", pt: "Não exigida (animal acompanhado)" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "For a pet as accompanied baggage, no prior import request, no advance notice to the border post and no internment/landing permit are needed. Unaccompanied cargo requires 24 working hours' advance notice and an internment-permit fee.", fr: "Pour un animal en bagage accompagné, aucune demande d'importation préalable, aucun avis préalable au poste-frontière ni permis d'internement ne sont nécessaires. Le fret non accompagné exige un préavis de 24 heures ouvrables et un droit de permis d'internement.", es: "Para una mascota como equipaje acompañado, no se necesitan solicitud de importación previa, ni aviso previo al puesto fronterizo, ni permiso de internación/desembarque. La carga no acompañada exige un preaviso de 24 horas hábiles y una tasa de permiso de internación.", pt: "Para um animal como bagagem acompanhada, não é preciso pedido prévio de importação, nem aviso antecipado ao posto de fronteira, nem permissão de internação ou de desembarque. A carga desacompanhada exige aviso com 24 horas úteis de antecedência e o pagamento da taxa de permissão de internação." }
    ref: { en: "SENASA — Ingresos con perros y/o gatos", fr: "SENASA — Ingresos con perros y/o gatos", es: "SENASA — Ingresos con perros y/o gatos", pt: "SENASA — Ingresos con perros y/o gatos" }
  - item: { en: "Border check (SENASA inspection)", fr: "Contrôle frontalier (inspection SENASA)", es: "Control fronterizo (inspección del SENASA)", pt: "Fiscalização na fronteira (inspeção do SENASA)" }
    required: { en: "Required on arrival", fr: "Requis à l'arrivée", es: "Obligatorio a la llegada", pt: "Obrigatória na chegada" }
    when: { en: "At the border post SENASA staff carry out a documentary (CVI or passport), physical and identity verification of the dog.", fr: "Au poste-frontière, le personnel du SENASA effectue une vérification documentaire (CVI ou passeport), physique et d'identité du chien.", es: "En el puesto fronterizo, el personal del SENASA realiza una verificación documental (CVI o pasaporte), física y de identidad del perro.", pt: "No posto de fronteira, a equipe do SENASA faz a verificação documental (CVI ou passaporte), física e de identidade do cachorro." }
    exceptions: { en: "For accompanied pets the verification is free of charge.", fr: "Pour les animaux accompagnés, la vérification est gratuite.", es: "Para las mascotas acompañadas, la verificación es gratuita.", pt: "Para animais acompanhados, a verificação é gratuita." }
    ref: { en: "SENASA — Ingresos con perros y/o gatos", fr: "SENASA — Ingresos con perros y/o gatos", es: "SENASA — Ingresos con perros y/o gatos", pt: "SENASA — Ingresos con perros y/o gatos" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "Special certification under 3 months", fr: "Certification spéciale sous 3 mois", es: "Certificación especial para menores de 3 meses", pt: "Certificação especial abaixo de 3 meses" }
    when: { en: "If the dog is under 3 months old, the veterinary authority must certify the animal's age and that it has not been on any premises where urban rabies occurred in the 90 days before shipment.", fr: "Si le chien a moins de 3 mois, l'autorité vétérinaire doit certifier l'âge de l'animal et qu'il n'a séjourné dans aucun lieu où un cas de rage urbaine est survenu dans les 90 jours avant l'embarquement.", es: "Si el perro tiene menos de 3 meses, la autoridad veterinaria debe certificar la edad del animal y que no ha estado en ningún lugar donde se haya producido rabia urbana en los 90 días previos al embarque.", pt: "Se o cachorro tiver menos de 3 meses, a autoridade veterinária precisa atestar a idade do animal e que ele não esteve em nenhum local onde tenha ocorrido raiva urbana nos 90 dias anteriores ao embarque." }
    exceptions: { en: "Airline age rules and your home country's return rules may be stricter.", fr: "Les règles d'âge des compagnies et les règles de retour de ton pays peuvent être plus strictes.", es: "Las normas de edad de las aerolíneas y las normas de regreso de tu país pueden ser más estrictas.", pt: "As regras de idade da companhia aérea e as regras de retorno do seu país podem ser mais rígidas." }
    ref: { en: "SENASA — Res. GMC 17/15", fr: "SENASA — Rés. GMC 17/15", es: "SENASA — Res. GMC 17/15", pt: "SENASA — Res. GMC 17/15" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not required", fr: "Non requise", es: "No obligatoria", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Only if the sanitary requirements are not met — SENASA may then apply whatever sanitary measures it deems appropriate, at the owner's expense.", fr: "Uniquement si les exigences sanitaires ne sont pas remplies — le SENASA peut alors appliquer les mesures sanitaires qu'il juge appropriées, aux frais du propriétaire.", es: "Solo si no se cumplen los requisitos sanitarios — el SENASA puede entonces aplicar las medidas sanitarias que considere apropiadas, a cargo del propietario.", pt: "Apenas se as exigências sanitárias não forem cumpridas — o SENASA pode então aplicar as medidas sanitárias que julgar adequadas, às custas do proprietário." }
    ref: { en: "SENASA — Ingresos con perros y/o gatos", fr: "SENASA — Ingresos con perros y/o gatos", es: "SENASA — Ingresos con perros y/o gatos", pt: "SENASA — Ingresos con perros y/o gatos" }

origin:
  scheme: own
  eu:
    from: any
    title: { en: "Standard scheme — CVI or legalized passport", fr: "Régime standard — CVI ou passeport légalisé", es: "Régimen estándar — CVI o pasaporte legalizado", pt: "Procedimento padrão — CVI ou passaporte legalizado" }
    body:
      en: "For almost every origin the path is the same. Your dog needs an International Veterinary Certificate (CVI) issued, signed and stamped by the official veterinary authority of the country you travel from, with Spanish as one of its languages. It must show a health certificate (within 10 days), a valid rabies vaccination and internal & external antiparasitic treatment (within 15 days). A current official pet passport carrying the same information and endorsed by the origin's authority is accepted instead."
      fr: "Pour presque toutes les origines, le parcours est identique. Ton chien a besoin d'un Certificat Vétérinaire International (CVI) émis, signé et scellé par l'autorité vétérinaire officielle du pays de départ, avec l'espagnol comme l'une de ses langues. Il doit attester un certificat de santé (dans les 10 jours), une vaccination antirabique valide et un traitement antiparasitaire interne & externe (dans les 15 jours). Un passeport officiel en cours de validité portant les mêmes informations et refrendé par l'autorité d'origine est accepté à la place."
      es: "Para casi todos los orígenes, el recorrido es el mismo. Tu perro necesita un Certificado Veterinario Internacional (CVI) emitido, firmado y sellado por la autoridad veterinaria oficial del país desde el que viajas, con el español como una de sus lenguas. Debe acreditar un certificado de salud (dentro de los 10 días), una vacunación antirrábica válida y un tratamiento antiparasitario interno y externo (dentro de los 15 días). En su lugar se acepta un pasaporte oficial de mascota vigente que contenga la misma información y esté refrendado por la autoridad de origen."
      pt: "Para quase todas as origens o caminho é o mesmo. Seu cachorro precisa de um Certificado Veterinário Internacional (CVI) emitido, assinado e carimbado pela autoridade veterinária oficial do país de partida, tendo o espanhol como um de seus idiomas. Ele deve trazer o atestado de saúde (dos 10 dias anteriores), a vacinação antirrábica válida e o tratamento antiparasitário interno e externo (dos 15 dias anteriores). Um passaporte oficial dentro da validade, com as mesmas informações e endossado pela autoridade da origem, é aceito no lugar dele."
    cls: ok
  listed:
    title: { en: "From a rabies-free country or zone", fr: "Depuis un pays ou une zone indemne de rage", es: "Desde un país o zona libre de rabia", pt: "De um país ou zona livre de raiva" }
    body:
      en: "If your dog comes from a country or zone declared free of rabies by WOAH, it may enter when the veterinary authority states this condition on the CVI or passport. The rest of the scheme — health certificate and antiparasitic treatment — still applies, and there is no antibody test in any case."
      fr: "Si ton chien vient d'un pays ou d'une zone déclaré indemne de rage par l'OMSA, il peut entrer lorsque l'autorité vétérinaire fait état de cette condition sur le CVI ou le passeport. Le reste du régime — certificat de santé et traitement antiparasitaire — s'applique toujours, et il n'y a de toute façon aucun titrage."
      es: "Si tu perro viene de un país o zona declarado libre de rabia por la OMSA, puede entrar cuando la autoridad veterinaria acredite esa condición en el CVI o el pasaporte. El resto del régimen — certificado de salud y tratamiento antiparasitario — sigue aplicándose, y en cualquier caso no hay prueba de titulación."
      pt: "Se o seu cachorro vier de um país ou zona declarado livre de raiva pela WOAH, ele pode entrar quando a autoridade veterinária atestar essa condição no CVI ou no passaporte. O restante do procedimento — atestado de saúde e tratamento antiparasitário — continua valendo, e não há teste sorológico em nenhum caso."
    cls: ok
  nonListed:
    title: { en: "Puppies & non-compliant arrivals", fr: "Chiots & arrivées non conformes", es: "Cachorros y llegadas no conformes", pt: "Filhotes e chegadas irregulares" }
    body:
      en: "A puppy under 3 months needs the CVI to certify its age and that no urban-rabies case occurred where it lived in the previous 90 days. If a dog arrives without meeting the sanitary requirements, SENASA may apply the sanitary measures it deems appropriate to protect the country's animal-health status; the resulting costs and losses fall on the owner."
      fr: "Un chiot de moins de 3 mois nécessite un CVI certifiant son âge et l'absence de cas de rage urbaine là où il a vécu les 90 jours précédents. Si un chien arrive sans remplir les exigences sanitaires, le SENASA peut appliquer les mesures sanitaires qu'il juge appropriées pour protéger le statut zoosanitaire du pays ; les frais et pertes qui en résultent sont à la charge du propriétaire."
      es: "Un cachorro de menos de 3 meses necesita que el CVI certifique su edad y que no se produjo ningún caso de rabia urbana donde vivió en los 90 días anteriores. Si un perro llega sin cumplir los requisitos sanitarios, el SENASA puede aplicar las medidas sanitarias que considere apropiadas para proteger el estatus zoosanitario del país; los costes y pérdidas resultantes corren a cargo del propietario."
      pt: "Um filhote com menos de 3 meses precisa que o CVI ateste sua idade e que não houve caso de raiva urbana no local onde viveu nos 90 dias anteriores. Se um cachorro chegar sem cumprir as exigências sanitárias, o SENASA pode aplicar as medidas sanitárias que julgar adequadas para proteger a situação sanitária do país; os custos e as perdas daí decorrentes ficam com o proprietário."
    cls: warn

arrival:
  intro:
    en: "What happens when your dog reaches Argentina depends on how it travels."
    fr: "Ce qui se passe à l'arrivée de ton chien en Argentine dépend de son mode de voyage."
    es: "Lo que ocurre cuando tu perro llega a Argentina depende de su modo de viaje."
    pt: "O que acontece quando seu cachorro chega à Argentina depende de como ele viaja."
  points:
    - en: "As accompanied baggage (in cabin or hold, with you): SENASA staff at the border post carry out a documentary (CVI or passport), physical and identity check — free of charge."
      fr: "En bagage accompagné (en cabine ou en soute, avec toi) : le personnel du SENASA au poste-frontière effectue un contrôle documentaire (CVI ou passeport), physique et d'identité — gratuit."
      es: "Como equipaje acompañado (en cabina o en bodega, contigo): el personal del SENASA en el puesto fronterizo realiza un control documental (CVI o pasaporte), físico y de identidad — gratuito."
      pt: "Como bagagem acompanhada (na cabine ou no porão, com você): a equipe do SENASA no posto de fronteira faz a verificação documental (CVI ou passaporte), física e de identidade — gratuitamente."
    - en: "No prior import request, no advance notice and no internment/landing permit are required for an accompanied pet."
      fr: "Aucune demande d'importation préalable, aucun avis préalable ni permis d'internement ne sont requis pour un animal accompagné."
      es: "No se exigen solicitud de importación previa, ni aviso previo, ni permiso de internación/desembarque para una mascota acompañada."
      pt: "Não é preciso pedido prévio de importação, nem aviso antecipado, nem permissão de internação ou desembarque para um animal acompanhado."
    - en: "As unaccompanied cargo (commercial or not): the transport agent must notify the border post at least 24 working hours in advance and pay the internment-permit fee."
      fr: "En fret non accompagné (commercial ou non) : l'agent de transport doit prévenir le poste-frontière au moins 24 heures ouvrables à l'avance et payer le droit de permis d'internement."
      es: "Como carga no acompañada (comercial o no): el agente de transporte debe avisar al puesto fronterizo con al menos 24 horas hábiles de antelación y pagar la tasa de permiso de internación."
      pt: "Como carga desacompanhada (comercial ou não): o agente de transporte deve avisar o posto de fronteira com pelo menos 24 horas úteis de antecedência e pagar a taxa de permissão de internação."
    - en: "The CVI or legalized passport is valid for 60 calendar days from issue, provided the rabies vaccination is still valid on the day of entry."
      fr: "Le CVI ou passeport légalisé est valable 60 jours calendaires depuis l'émission, à condition que la vaccination antirabique soit encore valide le jour de l'entrée."
      es: "El CVI o pasaporte legalizado es válido 60 días naturales desde la emisión, siempre que la vacunación antirrábica siga siendo válida el día de la entrada."
      pt: "O CVI ou o passaporte legalizado vale 60 dias corridos a partir da emissão, desde que a vacinação antirrábica ainda esteja válida no dia da entrada."
    - en: "Keep the original rabies vaccination proof — it is not retained and must stay with you."
      fr: "Conserve la preuve de vaccination antirabique originale — elle n'est pas retenue et doit rester avec toi."
      es: "Conserva el justificante original de vacunación antirrábica — no se retiene y debe permanecer contigo."
      pt: "Guarde o comprovante original da vacinação antirrábica — ele não é retido e deve ficar com você."
    - en: "If the requirements are not met, SENASA may apply the sanitary measures it considers appropriate; all resulting costs are borne by the owner."
      fr: "Si les exigences ne sont pas remplies, le SENASA peut appliquer les mesures sanitaires qu'il juge appropriées ; tous les frais qui en découlent sont à la charge du propriétaire."
      es: "Si no se cumplen los requisitos, el SENASA puede aplicar las medidas sanitarias que considere apropiadas; todos los costes resultantes corren a cargo del propietario."
      pt: "Se as exigências não forem cumpridas, o SENASA pode aplicar as medidas sanitárias que considerar adequadas; todos os custos daí decorrentes ficam com o proprietário."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Argentina has no national breed-specific import ban. Federal law does not prohibit any dog breed from entering the country, and there is no national dangerous-dog list applied at the border. Some provinces and cities regulate 'potentially dangerous' dogs for ownership, not for import."
    fr: "L'Argentine n'a aucune interdiction nationale d'importation liée à la race. La loi fédérale n'interdit l'entrée d'aucune race de chien, et il n'existe pas de liste nationale de chiens dangereux appliquée à la frontière. Certaines provinces et villes réglementent les chiens « potentiellement dangereux » pour la détention, pas pour l'importation."
    es: "Argentina no tiene ninguna prohibición nacional de importación por raza. La ley federal no prohíbe la entrada de ninguna raza de perro al país, y no existe una lista nacional de perros peligrosos aplicada en la frontera. Algunas provincias y ciudades regulan los perros «potencialmente peligrosos» para la tenencia, no para la importación."
    pt: "A Argentina não tem proibição nacional de importação por raça. A lei federal não impede a entrada de nenhuma raça no país, e não existe lista nacional de cães perigosos aplicada na fronteira. Algumas províncias e cidades regulam os cães «potencialmente perigosos» para fins de posse, não de importação."
  cat1:
    en: "No banned category at entry: no breed is refused entry to Argentina on the basis of its breed, provided the SENASA sanitary requirements (CVI, rabies vaccination, antiparasitic treatment) are met."
    fr: "Aucune catégorie interdite à l'entrée : aucune race n'est refusée à l'entrée en Argentine en raison de sa race, sous réserve du respect des exigences sanitaires du SENASA (CVI, vaccination antirabique, traitement antiparasitaire)."
    es: "Ninguna categoría prohibida a la entrada: no se rechaza la entrada a Argentina de ninguna raza por su raza, siempre que se cumplan los requisitos sanitarios del SENASA (CVI, vacunación antirrábica, tratamiento antiparasitario)."
    pt: "Nenhuma categoria proibida na entrada: nenhuma raça tem a entrada recusada na Argentina por causa da raça, desde que as exigências sanitárias do SENASA (CVI, vacinação antirrábica, tratamento antiparasitário) sejam cumpridas."
  cat2:
    en: "Local ownership rules: cities and provinces set their own rules for potentially dangerous dogs. For example, the City of Buenos Aires (Law 4078/12) and the Province of Buenos Aires (Law 14107) list breeds — such as pit bull terrier, dogo argentino, rottweiler and others — that owners must register and handle responsibly (leash, muzzle, insurance). These are ownership obligations, not entry bans."
    fr: "Règles locales de détention : les villes et provinces fixent leurs propres règles pour les chiens potentiellement dangereux. Par exemple, la Ville de Buenos Aires (loi 4078/12) et la Province de Buenos Aires (loi 14107) listent des races — comme le pit bull terrier, le dogo argentino, le rottweiler et d'autres — que les propriétaires doivent enregistrer et gérer de manière responsable (laisse, muselière, assurance). Ce sont des obligations de détention, pas des interdictions d'entrée."
    es: "Normas locales de tenencia: las ciudades y provincias fijan sus propias normas para los perros potencialmente peligrosos. Por ejemplo, la Ciudad de Buenos Aires (Ley 4078/12) y la Provincia de Buenos Aires (Ley 14107) enumeran razas — como pit bull terrier, dogo argentino, rottweiler y otras — que los propietarios deben registrar y manejar de forma responsable (correa, bozal, seguro). Son obligaciones de tenencia, no prohibiciones de entrada."
    pt: "Regras locais de posse: cidades e províncias definem suas próprias regras para cães potencialmente perigosos. A Cidade de Buenos Aires (Lei 4078/12) e a Província de Buenos Aires (Lei 14107), por exemplo, listam raças — como pit bull terrier, dogo argentino, rottweiler e outras — que os donos precisam registrar e conduzir com responsabilidade (coleira, focinheira, seguro). São obrigações de posse, não proibições de entrada."
  note:
    en: "Because there is no national breed ban, focus on the SENASA sanitary rules for entry. If you will stay in a specific city or province, check its local ordinances for any registration, leash, muzzle or insurance requirements."
    fr: "Comme il n'y a pas d'interdiction nationale de race, concentre-toi sur les règles sanitaires du SENASA pour l'entrée. Si tu séjourne dans une ville ou province précise, vérifie ses arrêtés locaux pour d'éventuelles obligations d'enregistrement, de laisse, de muselière ou d'assurance."
    es: "Como no hay una prohibición nacional de razas, céntrate en las normas sanitarias del SENASA para la entrada. Si vas a quedarte en una ciudad o provincia concreta, revisa sus ordenanzas locales por si hay requisitos de registro, correa, bozal o seguro."
    pt: "Como não há proibição nacional por raça, concentre-se nas regras sanitárias do SENASA para a entrada. Se você for ficar em uma cidade ou província específica, verifique as normas locais quanto a registro, coleira, focinheira ou seguro."

checklist:
  - en: "International Veterinary Certificate (CVI) in Spanish, endorsed by the origin's official veterinary authority — or a legalized official passport"
    fr: "Certificat Vétérinaire International (CVI) en espagnol, refrendé par l'autorité vétérinaire officielle d'origine — ou un passeport officiel légalisé"
    es: "Certificado Veterinario Internacional (CVI) en español, refrendado por la autoridad veterinaria oficial de origen — o un pasaporte oficial legalizado"
    pt: "Certificado Veterinário Internacional (CVI) em espanhol, endossado pela autoridade veterinária oficial da origem — ou passaporte oficial legalizado"
  - en: "Health certificate issued within 10 days before the CVI (clinically healthy, parasite-free, fit to travel)"
    fr: "Certificat de santé émis dans les 10 jours avant le CVI (cliniquement sain, exempt de parasites, apte au voyage)"
    es: "Certificado de salud emitido en los 10 días previos al CVI (clínicamente sano, libre de parásitos, apto para viajar)"
    pt: "Atestado de saúde emitido nos 10 dias anteriores ao CVI (clinicamente saudável, livre de parasitas, apto a viajar)"
  - en: "Valid rabies vaccination (primary shot at least 21 days before entry); keep the original proof with you"
    fr: "Vaccination antirabique valide (primo-vaccination au moins 21 jours avant l'entrée) ; garde la preuve originale avec toi"
    es: "Vacunación antirrábica válida (primovacunación al menos 21 días antes de la entrada); lleva el justificante original contigo"
    pt: "Vacinação antirrábica válida (primeira dose no mínimo 21 dias antes da entrada); leve o comprovante original com você"
  - en: "Internal & external antiparasitic treatment within 15 days before the CVI"
    fr: "Traitement antiparasitaire interne & externe dans les 15 jours avant le CVI"
    es: "Tratamiento antiparasitario interno y externo en los 15 días previos al CVI"
    pt: "Tratamento antiparasitário interno e externo nos 15 dias anteriores ao CVI"
  - en: "For a puppy under 3 months: certification of age and no urban-rabies case where it lived in the last 90 days"
    fr: "Pour un chiot de moins de 3 mois : certification de l'âge et absence de cas de rage urbaine là où il a vécu ces 90 derniers jours"
    es: "Para un cachorro de menos de 3 meses: certificación de la edad y ausencia de casos de rabia urbana donde haya vivido en los últimos 90 días"
    pt: "Para filhote com menos de 3 meses: atestado de idade e ausência de caso de raiva urbana onde ele viveu nos últimos 90 dias"
  - en: "Check the CVI/passport is used within 60 days of issue and the rabies vaccine is still valid on arrival"
    fr: "Vérifie que le CVI/passeport est utilisé dans les 60 jours suivant l'émission et que le vaccin antirabique est encore valide à l'arrivée"
    es: "Comprueba que el CVI/pasaporte se usa dentro de los 60 días desde la emisión y que la vacuna antirrábica sigue siendo válida a la llegada"
    pt: "Confira que o CVI/passaporte seja usado dentro de 60 dias da emissão e que a vacina antirrábica ainda esteja válida na chegada"
  - en: "Airline reservation confirming your dog's travel option and a suitable travel crate if in the hold"
    fr: "Réservation confirmant l'option de transport de ton chien et une caisse de transport adaptée si en soute"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y una jaula adecuada conforme a los requisitos aplicables si viaja en bodega"
    pt: "Reserva da companhia aérea confirmando a opção de viagem do seu cachorro e uma caixa de transporte adequada se ele for no porão"
  - en: "For unaccompanied cargo: arrange 24 working hours' advance notice to the border post"
    fr: "Pour le fret non accompagné : organise un préavis de 24 heures ouvrables au poste-frontière"
    es: "Para la carga no acompañada: organiza un preaviso de 24 horas hábiles al puesto fronterizo"
    pt: "Para carga desacompanhada: providencie o aviso ao posto de fronteira com 24 horas úteis de antecedência"

