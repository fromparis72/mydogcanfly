# Country Entry Guide — Argentina (bilingual EN/FR).
# Argentina is NOT in the EU. This encodes Argentina's own SENASA scheme (Mercosur Res. GMC 17/15).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_ar
iso2: "AR"
name: { en: "Argentina", fr: "Argentine", es: "Argentina", pt: "Argentina" }
region: { en: "South America", fr: "Amérique du Sud", es: "América del Sur", pt: "América do Sul" }


regime: listed
domestic:
  intro:
    en: "Domestic flight in Argentina: the State has no specific rule — the vet certificate is asked for by the airlines."
    fr: "Vol intérieur en Argentine : l'État n'a pas de réglementation spécifique — le certificat vétérinaire est demandé par les compagnies."
    es: "Vuelo nacional en Argentina: el Estado no tiene reglamentación específica — el certificado veterinario lo piden las aerolíneas."
    pt: "Voo doméstico na Argentina: o Estado não tem regra específica — o atestado veterinário é pedido pelas companhias aéreas."
  points:
    - en: "SENASA states it has no specific regulation for domestic pet transport, and that its involvement is requested by the airlines rather than imposed by law."
      fr: "Le SENASA indique n'avoir aucune réglementation spécifique pour le transport intérieur d'animaux, et que son intervention est sollicitée par les compagnies plutôt qu'imposée par la loi."
      es: "SENASA indica que no tiene reglamentación específica para el transporte nacional de mascotas, y que su intervención la solicitan las aerolíneas, no la impone la ley."
      pt: "O SENASA afirma não ter regulamentação específica para o transporte doméstico de animais de estimação, e que sua participação é solicitada pelas companhias aéreas, não imposta por lei."
    - en: "Vaccinating your dog is a standing legal duty of ownership, which is a different thing from a flight requirement. The Patagonian sanitary barrier restricts meat and fruit, not pet dogs."
      fr: "Vacciner son chien est une obligation légale permanente du détenteur, ce qui est autre chose qu'une exigence de vol. La barrière sanitaire patagonienne restreint les viandes et les fruits, pas les chiens de compagnie."
      es: "Vacunar a tu perro es un deber legal permanente del propietario, cosa distinta de un requisito de vuelo. La barrera sanitaria patagónica restringe carnes y frutas, no perros de compañía."
      pt: "Vacinar seu cachorro é um dever legal permanente de quem tem um animal, o que é diferente de uma exigência de voo. A barreira sanitária patagônica restringe carnes e frutas, não cachorros de estimação."
    - en: "The restriction that catches most travellers is at destination: dogs are banned from national parks, which matters for Bariloche, El Calafate, Ushuaia and Iguazú."
      fr: "La restriction qui piège le plus de voyageurs est à destination : les chiens sont interdits dans les parcs nationaux, ce qui concerne Bariloche, El Calafate, Ushuaia et Iguazú."
      es: "La restricción que más sorprende está en destino: los perros están prohibidos en los parques nacionales, lo que afecta a Bariloche, El Calafate, Ushuaia e Iguazú."
      pt: "A restrição que mais pega os viajantes de surpresa está no destino: cachorros são proibidos nos parques nacionais, o que importa para Bariloche, El Calafate, Ushuaia e Iguaçu."
exit:
  authority: SENASA
  authorityUrl: https://www.argentina.gob.ar/senasa/informacion-al-viajero/viajar-al-exterior/envios-al-exterior-perros-yo-gatos/requisitos-particulares-por-destino/union-europea
  intro:
    en: "Argentina is a listed country, so no rabies titer is needed to return — SENASA issues the international veterinary certificate (CVI) for your dog."
    fr: "L'Argentine est un pays listé : pas de titrage pour revenir — le SENASA délivre le certificat vétérinaire international (CVI) pour ton chien."
    es: "Argentina es un país listado: no hace falta titulación para volver — el SENASA emite el certificado veterinario internacional (CVI) para tu perro."
    pt: "A Argentina é um país listado, então não é preciso teste sorológico antirrábico para voltar — o SENASA emite o certificado veterinário internacional (CVI) do seu cachorro."
  steps:
    - timing: window
      scope: eu
      text:
        en: "A private vet handles the microchip, rabies vaccination and health certificate; present them at a SENASA office, which issues the CVI, valid 10 days up to the EU border check."
        fr: "Un vétérinaire privé s'occupe de la puce, de la vaccination antirabique et du certificat sanitaire ; présente-les à un bureau SENASA, qui délivre le CVI, valable 10 jours jusqu'au contrôle à la frontière UE."
        es: "Un veterinario privado se ocupa del microchip, la vacuna antirrábica y el certificado sanitario; preséntalos en una oficina del SENASA, que emite el CVI, válido 10 días hasta el control fronterizo de la UE."
        pt: "Um veterinário particular cuida do microchip, da vacinação antirrábica e do atestado de saúde; apresente tudo em um escritório do SENASA, que emite o CVI, válido por 10 dias até o controle de fronteira europeu."
    - timing: window
      scope: non_eu
      text:
        en: "A private vet handles the microchip, rabies vaccination and health certificate; present them at a SENASA office, which issues the CVI (valid 10 days)."
        fr: "Un vétérinaire privé s'occupe de la puce, du vaccin antirabique et du certificat sanitaire ; présente-les dans un bureau SENASA, qui délivre le CVI (valable 10 jours)."
        es: "Un veterinario privado se encarga del microchip, la vacuna antirrábica y el certificado sanitario; preséntalos en una oficina del SENASA, que emite el CVI (válido 10 días)."
        pt: "Um veterinário particular cuida do microchip, da vacina antirrábica e do atestado sanitário; apresente-os em um escritório do SENASA, que emite o CVI (válido por 10 dias)."
  onSiteNote:
    en: "The rabies vaccination must be at least 21 days old before EU arrival; time the SENASA CVI within its 10-day window."
    fr: "La vaccination antirabique doit dater d'au moins 21 jours avant l'arrivée dans l'UE ; cale le CVI SENASA dans sa fenêtre de 10 jours."
    es: "La vacuna antirrábica debe tener al menos 21 días antes de llegar a la UE; programa el CVI del SENASA dentro de su ventana de 10 días."
    pt: "A vacinação antirrábica precisa ter pelo menos 21 dias antes da chegada à União Europeia; encaixe o CVI do SENASA dentro da sua janela de 10 dias."

hero:
  h1: { en: "Traveling to Argentina with your dog", fr: "Voyager en Argentine avec ton chien", es: "Viajar a Argentina con tu perro", pt: "Viajar à Argentina com seu cachorro" }
  intro:
    en: >-
      Argentina welcomes dogs, and its entry rules are refreshingly uniform: the same procedure applies
      to a personal pet arriving from almost anywhere. SENASA (the national animal-health authority)
      asks for a single document — an International Veterinary Certificate (CVI) issued, signed and
      stamped by the official veterinary authority of the country you travel from, or a legalized
      official pet passport. It must show a health certificate, a valid rabies vaccination and internal
      and external antiparasitic treatment. There is no rabies antibody test, no import permit and no
      quarantine for a healthy pet travelling as accompanied baggage — SENASA simply inspects your dog
      on arrival. This guide explains exactly what to prepare, and the timing to respect, before you
      book your flight.
    fr: >-
      L'Argentine accueille les chiens, et ses règles d'entrée sont d'une simplicité rassurante : la
      même procédure s'applique à un animal de compagnie venant de presque partout. Le SENASA (l'autorité
      sanitaire animale nationale) demande un seul document — un Certificat Vétérinaire International (CVI)
      émis, signé et scellé par l'autorité vétérinaire officielle du pays d'où tu voyages, ou un
      passeport officiel légalisé. Il doit attester un certificat de santé, une vaccination antirabique
      valide et un traitement antiparasitaire interne et externe. Pas de test sérologique antirabique, pas
      de permis d'importation et pas de quarantaine pour un animal en bonne santé voyageant en bagage
      accompagné — le SENASA inspecte simplement ton chien à l'arrivée. Ce guide détaille exactement
      quoi préparer, et les délais à respecter, avant de réserver ton vol.
    es: >-
      Argentina acoge a los perros, y sus normas de entrada son de una sencillez reconfortante: el mismo
      procedimiento se aplica a una mascota personal que llega desde casi cualquier lugar. El SENASA (la
      autoridad nacional de sanidad animal) pide un solo documento — un Certificado Veterinario Internacional
      (CVI) emitido, firmado y sellado por la autoridad veterinaria oficial del país desde el que viajas, o un
      pasaporte oficial de mascota legalizado. Debe acreditar un certificado de salud, una vacunación
      antirrábica válida y un tratamiento antiparasitario interno y externo. No hay prueba de titulación de
      rabia, ni permiso de importación, ni cuarentena para una mascota sana que viaje como equipaje acompañado
      — el SENASA simplemente inspecciona a tu perro a la llegada. Esta guía explica exactamente qué preparar,
      y los plazos que hay que respetar, antes de reservar tu vuelo.

    pt: "A Argentina recebe bem os cachorros, e suas regras de entrada são agradavelmente uniformes: o mesmo procedimento vale para um animal de estimação que chega de quase qualquer lugar. O SENASA (autoridade nacional de saúde animal) pede um único documento — um Certificado Veterinário Internacional (CVI) emitido, assinado e carimbado pela autoridade veterinária oficial do país de onde você parte, ou um passaporte oficial legalizado. Ele deve trazer o atestado de saúde, a vacinação antirrábica válida e o tratamento antiparasitário interno e externo. Não há teste sorológico antirrábico, nem autorização de importação, nem quarentena para um animal saudável que viaja como bagagem acompanhada — o SENASA simplesmente inspeciona seu cachorro na chegada. Este guia explica exatamente o que preparar, e os prazos a respeitar, antes de comprar a passagem."
difficulty:
  level: easy
  label: { en: "Easy — one uniform scheme for most origins", fr: "Facile — un régime uniforme pour la plupart des origines", es: "Fácil — un régimen uniforme para la mayoría de los orígenes", pt: "Fácil — um único procedimento para quase todas as origens" }

prepTime:
  eu:
    en: "Standard case: a few days to assemble the CVI once vaccination is valid — the health certificate is issued within 10 days before the CVI, and the CVI is valid 60 days."
    fr: "Cas standard : quelques jours pour réunir le CVI une fois la vaccination valide — le certificat de santé est émis dans les 10 jours avant le CVI, valable 60 jours."
    es: "Caso estándar: unos días para reunir el CVI una vez que la vacunación es válida — el certificado de salud se emite en los 10 días previos al CVI, y el CVI es válido 60 días."
    pt: "Caso padrão: alguns dias para montar o CVI quando a vacinação já é válida — o atestado de saúde é emitido nos 10 dias anteriores ao CVI, e o CVI vale 60 dias."
  listed:
    en: "If the first rabies shot is still needed: plan ~3 weeks, as a primary vaccination must be given at least 21 days before entry."
    fr: "Si la première vaccination reste à faire : prévois ~3 semaines, une primo-vaccination devant être faite au moins 21 jours avant l'entrée."
    es: "Si aún falta la primera vacuna antirrábica: prevé ~3 semanas, ya que una primovacunación debe administrarse al menos 21 días antes de la entrada."
    pt: "Se ainda faltar a primeira dose antirrábica: conte cerca de 3 semanas, já que a primovacinação precisa ser aplicada no mínimo 21 dias antes da entrada."
  nonListed:
    en: "Puppies under 3 months: extra certification (age + no urban-rabies case where the pup lived in the last 90 days), so allow more preparation time."
    fr: "Chiots de moins de 3 mois : certification supplémentaire (âge + aucun cas de rage urbaine là où le chiot a vécu ces 90 derniers jours), prévois plus de temps."
    es: "Cachorros de menos de 3 meses: certificación adicional (edad + ausencia de casos de rabia urbana donde el cachorro haya vivido en los últimos 90 días), así que prevé más tiempo de preparación."
    pt: "Filhotes com menos de 3 meses: certificação extra (idade e ausência de caso de raiva urbana no local onde o filhote viveu nos últimos 90 dias), então reserve mais tempo de preparo."

