# Country Entry Guide — Indonesia (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
# Indonesia is NOT in the EU. It runs its own scheme through the Directorate General of
# Livestock and Animal Health Services (Ditjen PKH, Ministry of Agriculture — pertanian.go.id),
# which issues the import permit (via the SIMREK PKH portal), and the Indonesian Quarantine
# Agency (Badan Karantina Indonesia / Barantin — karantinaindonesia.go.id), which inspects and
# quarantines animals at the point of entry. The defining feature is geographic: to protect
# Indonesia's rabies-free provinces, the import of dogs from rabies-infected countries/zones INTO
# rabies-free areas is prohibited, and Bali does not accept the direct entry of dogs at all.
# Dogs may only be imported through designated entry points into areas where import is allowed
# (in practice the mainland via Jakarta), with an import permit, microchip, rabies vaccination,
# a rabies antibody test, a government health certificate and quarantine on arrival.
# The eu/listed/nonListed slots are repurposed to Indonesia's practical paths:
# eu = import into a permitted (rabies-endemic) entry area such as Jakarta; listed = the on-arrival
# conditions and quarantine; nonListed = Bali and the rabies-free provinces, where entry is banned.
id: country_id
iso2: "ID"
name: { en: "Indonesia", fr: "Indonésie", es: "Indonesia", pt: "Indonésia" }
region: { en: "Asia", fr: "Asie", es: "Asia", pt: "Ásia" }


regime: non_listed
domestic:
  intro:
    en: "Domestic flight in Indonesia: islands are separate sanitary zones — quarantine clearance is required at both ends."
    fr: "Vol intérieur en Indonésie : les îles constituent des zones sanitaires distinctes — un passage en quarantaine est exigé au départ comme à l'arrivée."
    es: "Vuelo nacional en Indonesia: las islas son zonas sanitarias distintas — se exige control de cuarentena tanto a la salida como a la llegada."
    pt: "Voo doméstico na Indonésia: as ilhas são zonas sanitárias separadas — a liberação da quarentena é exigida nas duas pontas."
  points:
    - en: "The quarantine law requires a health certificate, use of designated exit and entry points, and reporting the animal to quarantine on departure AND on arrival."
      fr: "La loi de quarantaine impose un certificat sanitaire, l'usage de points de sortie et d'entrée désignés, et la présentation de l'animal à la quarantaine au départ ET à l'arrivée."
      es: "La ley de cuarentena exige un certificado sanitario, el uso de puntos de salida y entrada designados, y presentar al animal en cuarentena a la salida Y a la llegada."
      pt: "A lei de quarentena exige um atestado de saúde, o uso de pontos de saída e entrada designados, e a notificação do animal à quarentena tanto na partida QUANTO na chegada."
    - en: "Rabies vaccination is required, and a protective antibody titre is asked for inter-island movement. Districts are classified rabies-free or infected, and the list is revised annually."
      fr: "La vaccination antirabique est exigée, et un titrage d'anticorps protecteur est demandé pour les mouvements entre îles. Les districts sont classés indemnes ou infectés, et la liste est révisée chaque année."
      es: "Se exige vacuna antirrábica, y se pide una titulación de anticuerpos protectora para el movimiento entre islas. Los distritos se clasifican como libres o infectados, y la lista se revisa anualmente."
      pt: "A vacinação antirrábica é obrigatória, e uma titulação protetora de anticorpos é exigida para o deslocamento entre ilhas. Os distritos são classificados como livres de raiva ou infectados, e a lista é revisada anualmente."
    - en: "Whatever the airline asks for (health certificate, vaccination record, breed or crate rules) is its own commercial policy, not a legal requirement — check with your carrier."
      fr: "Ce que la compagnie demande (certificat de santé, carnet de vaccination, règles de race ou de caisse) relève de sa politique commerciale, pas d'une obligation légale — vérifie auprès d'elle."
      es: "Lo que pida la aerolínea (certificado de salud, cartilla de vacunación, reglas de raza o jaula) es su política comercial, no una obligación legal — consúltalo con ella."
      pt: "Tudo o que a companhia aérea pedir (atestado de saúde, carteira de vacinação, regras de raça ou de caixa de transporte) é política comercial dela, não exigência legal — confirme com a sua companhia."
  territories:
    - name: { en: "Bali", fr: "Bali", es: "Bali", pt: "Bali" }
      note:
        en: "Bali is classified rabies-infected and the movement of dogs, cats and monkeys is prohibited both INTO and OUT OF the province. Some carriers also exclude Denpasar from pet carriage."
        fr: "Bali est classée infectée par la rage et le mouvement des chiens, chats et singes y est interdit dans les deux sens, à l'entrée comme à la sortie. Certaines compagnies excluent aussi Denpasar du transport d'animaux."
        es: "Bali está clasificada como infectada de rabia y el movimiento de perros, gatos y monos está prohibido en ambos sentidos, tanto de entrada como de salida. Algunas aerolíneas también excluyen Denpasar del transporte de mascotas."
        pt: "Bali é classificada como infectada por raiva, e o deslocamento de cachorros, gatos e macacos é proibido tanto PARA DENTRO quanto PARA FORA da província. Algumas companhias aéreas também excluem Denpasar do transporte de animais de estimação."
      url: https://distanpangan.baliprov.go.id/wp-content/uploads/2025/10/Pergub-No.-88-Th-2008-Penutupan-Sementara-HPR.pdf
exit:
  authority: Barantin
  authorityUrl: https://karantinaindonesia.go.id/
  intro:
    en: "Indonesia is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an animal quarantine certificate from the Indonesian Quarantine Authority (Barantin)."
    fr: "L'Indonésie est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat de quarantaine animale de l'Autorité indonésienne de quarantaine (Barantin)."
    es: "Indonesia no está listada: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado de cuarentena animal de la Autoridad de Cuarentena de Indonesia (Barantin)."
    pt: "A Indonésia é um país não listado, portanto um teste sorológico antirrábico (titulação) válido é obrigatório para retornar à UE — além de um certificado de quarentena animal da Indonesian Quarantine Authority (Barantin)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: eu
      text:
        en: "Lodge a quarantine request at your local Barantin office; a quarantine veterinarian examines the dog and, if healthy, issues the animal health certificate, with the EU-model certificate officially certified before departure."
        fr: "Dépose une demande de quarantaine à ton bureau Barantin local ; un vétérinaire de quarantaine examine le chien et, s'il est sain, délivre le certificat sanitaire, le certificat au modèle UE étant certifié officiellement avant le départ."
        es: "Presenta una solicitud de cuarentena en tu oficina local de Barantin; un veterinario de cuarentena examina al perro y, si está sano, emite el certificado sanitario, con el certificado en modelo UE certificado oficialmente antes de salir."
        pt: "Registre um pedido de quarentena no escritório local do Barantin; um veterinário de quarentena examina o cachorro e, se estiver saudável, emite o atestado de saúde animal, com o certificado no modelo da UE oficialmente certificado antes da partida."
    - timing: window
      scope: non_eu
      text:
        en: "Lodge a quarantine request at your local Barantin office; a quarantine veterinarian examines the dog and, if healthy, issues the animal health certificate."
        fr: "Dépose une demande de quarantaine au bureau Barantin local ; un vétérinaire de quarantaine examine le chien et, s'il est en bonne santé, délivre le certificat sanitaire."
        es: "Presenta una solicitud de cuarentena en la oficina local de Barantin; un veterinario de cuarentena examina al perro y, si está sano, expide el certificado sanitario."
        pt: "Protocole um pedido de quarentena no escritório local do Barantin; um veterinário de quarentena examina o cachorro e, se estiver saudável, emite o certificado sanitário."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Indonesia with your dog", fr: "Voyager en Indonésie avec ton chien", es: "Viajar a Indonesia con tu perro", pt: "Viajar para a Indonésia com seu cachorro" }
  intro:
    en: >-
      Indonesia is one of the hardest countries in the world to bring a dog to, and where in the
      country you are heading matters more than anything else. To protect its rabies-free provinces,
      Indonesia prohibits importing dogs from rabies-affected countries into those areas — and Bali,
      the destination most travellers have in mind, does not accept the direct entry of dogs at all.
      Where import is allowed (in practice the mainland via Jakarta), you must first obtain an import
      permit from the Directorate General of Livestock and Animal Health Services (Ditjen PKH), then
      an ISO microchip, a valid rabies vaccination, a rabies antibody test, and a government health
      certificate, followed by quarantine on arrival. This guide explains what is possible, what is
      forbidden, and why you should never assume you can simply fly a dog into Bali.
    fr: >-
      L'Indonésie est l'un des pays les plus difficiles au monde pour faire venir un chien, et
      l'endroit où tu te rends compte plus que tout. Pour protéger ses provinces indemnes de
      rage, l'Indonésie interdit l'importation de chiens depuis les pays touchés par la rage vers ces
      zones — et Bali, la destination à laquelle pensent la plupart des voyageurs, n'accepte pas du
      tout l'entrée directe de chiens. Là où l'importation est permise (en pratique l'île principale
      via Jakarta), tu dois d'abord obtenir un permis d'importation auprès de la Direction générale
      de l'élevage et de la santé animale (Ditjen PKH), puis une puce ISO, une vaccination antirabique
      valide, un test des anticorps antirabiques et un certificat sanitaire officiel, suivis d'une
      quarantaine à l'arrivée. Ce guide explique ce qui est possible, ce qui est interdit, et pourquoi
      il ne faut jamais présumer pouvoir simplement faire entrer un chien à Bali.
    es: >-
      Indonesia es uno de los países más difíciles del mundo para llevar un perro, y adónde te diriges
      dentro del país importa más que cualquier otra cosa. Para proteger sus provincias libres de rabia,
      Indonesia prohíbe importar perros desde países afectados por la rabia hacia esas zonas — y Bali, el
      destino que la mayoría de los viajeros tiene en mente, no acepta en absoluto la entrada directa de
      perros. Donde la importación está permitida (en la práctica la isla principal a través de Yakarta),
      primero debes obtener un permiso de importación de la Dirección General de Ganadería y Servicios de
      Salud Animal (Ditjen PKH), y luego un microchip ISO, una vacunación antirrábica válida, una prueba
      de titulación de rabia y un certificado sanitario oficial, seguidos de cuarentena a la llegada. Esta
      guía explica qué es posible, qué está prohibido y por qué nunca debes dar por hecho que puedes
      simplemente llevar un perro a Bali en avión.

    pt: "A Indonésia é um dos países mais difíceis do mundo para levar um cachorro, e para onde no país você está indo importa mais do que qualquer outra coisa. Para proteger suas províncias livres de raiva, a Indonésia proíbe a importação de cachorros vindos de países afetados pela raiva para essas áreas — e Bali, o destino que a maioria dos viajantes tem em mente, não aceita a entrada direta de cachorros de forma alguma. Onde a importação é permitida (na prática, o território continental via Jacarta), você precisa primeiro obter uma autorização de importação junto à Directorate General of Livestock and Animal Health Services (Ditjen PKH), depois um microchip ISO, uma vacinação antirrábica válida, um teste sorológico antirrábico e um atestado de saúde emitido pelo governo, seguidos de quarentena na chegada. Este guia explica o que é possível, o que é proibido, e por que você nunca deve presumir que pode simplesmente levar um cachorro de avião até Bali."
difficulty:
  level: difficult
  label: { en: "Difficult — many areas ban dogs entirely, notably Bali", fr: "Difficile — de nombreuses zones interdisent totalement les chiens, notamment Bali", es: "Difícil — muchas zonas prohíben totalmente los perros, en especial Bali", pt: "Difícil — muitas áreas proíbem cachorros por completo, principalmente Bali" }

prepTime:
  eu:
    en: "Where import is allowed (rabies-endemic area, e.g. mainland via Jakarta): several months — import permit from Ditjen PKH, rabies vaccination given 30 days to 1 year before shipment, a rabies antibody test result of at least 0.5 IU/ml, a government health certificate, then at least 14 days of quarantine on arrival."
    fr: "Là où l'importation est permise (zone d'enzootie rabique, ex. l'île principale via Jakarta) : plusieurs mois — permis d'importation du Ditjen PKH, vaccination antirabique faite 30 jours à 1 an avant l'expédition, un test des anticorps antirabiques d'au moins 0,5 UI/ml, un certificat sanitaire officiel, puis au moins 14 jours de quarantaine à l'arrivée."
    es: "Donde la importación está permitida (zona endémica de rabia, p. ej. la isla principal a través de Yakarta): varios meses — permiso de importación de Ditjen PKH, vacunación antirrábica administrada de 30 días a 1 año antes del envío, un resultado de prueba de titulación de rabia de al menos 0,5 UI/ml, un certificado sanitario oficial, y luego al menos 14 días de cuarentena a la llegada."
    pt: "Onde a importação é permitida (área endêmica de raiva, por exemplo, o território continental via Jacarta): vários meses — autorização de importação do Ditjen PKH, vacinação antirrábica aplicada entre 30 dias e 1 ano antes do embarque, resultado do teste sorológico antirrábico de pelo menos 0,5 UI/ml, atestado de saúde emitido pelo governo, e depois pelo menos 14 dias de quarentena na chegada."
  listed:
    en: "On arrival: report to the Quarantine (Barantin) officer at least 2 days before arrival; the pet is inspected, documents are verified and it is held in a quarantine facility for at least 14 days. Onward movement inside Indonesia (including into any rabies-free province) is separately restricted."
    fr: "À l'arrivée : signale-toi à l'agent de quarantaine (Barantin) au moins 2 jours avant l'arrivée ; l'animal est inspecté, les documents vérifiés et il est placé en installation de quarantaine pendant au moins 14 jours. Les déplacements ultérieurs à l'intérieur de l'Indonésie (y compris vers toute province indemne de rage) sont réglementés séparément."
    es: "A la llegada: preséntate ante el agente de cuarentena (Barantin) al menos 2 días antes de la llegada; se inspecciona a la mascota, se verifican los documentos y se la mantiene en una instalación de cuarentena durante al menos 14 días. El traslado posterior dentro de Indonesia (incluido hacia cualquier provincia libre de rabia) está restringido por separado."
    pt: "Na chegada: notifique o agente da Quarentena (Barantin) pelo menos 2 dias antes da chegada; o animal é inspecionado, os documentos são verificados e ele fica retido em uma instalação de quarentena por pelo menos 14 dias. O deslocamento posterior dentro da Indonésia (inclusive para qualquer província livre de raiva) é restrito separadamente."
  nonListed:
    en: "Bali and the rabies-free provinces: not possible — the direct entry of dogs is prohibited, whether flown in directly or moved on from the mainland. Do not plan on bringing a dog to Bali."
    fr: "Bali et les provinces indemnes de rage : impossible — l'entrée directe de chiens est interdite, qu'ils arrivent directement par avion ou soient acheminés depuis l'île principale. Ne prévois pas d'amener un chien à Bali."
    es: "Bali y las provincias libres de rabia: no es posible — la entrada directa de perros está prohibida, tanto si llegan directamente en avión como si se trasladan desde la isla principal. No planees llevar un perro a Bali."
    pt: "Bali e as províncias livres de raiva: não é possível — a entrada direta de cachorros é proibida, seja levada de avião diretamente ou deslocada a partir do território continental. Não planeje levar um cachorro para Bali."

