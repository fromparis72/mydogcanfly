restrictedDogs:
  intro:
    en: "Italy has no national list of dangerous or banned dog breeds. The 2006 list of 17 breeds was abolished by the March 2009 ordinance signed by Under-Secretary Francesca Martini, on the scientific ground that a dog's breed does not predict aggressiveness. Responsibility is owner-based: every dog is subject to the same rules regardless of breed."
    fr: "L'Italie n'a aucune liste nationale de races de chiens dangereuses ou interdites. La liste de 17 races de 2006 a été abolie par l'ordonnance de mars 2009 signée par la sous-secrétaire Francesca Martini, au motif scientifique que la race d'un chien ne prédit pas son agressivité. La responsabilité est fondée sur le propriétaire : tout chien est soumis aux mêmes règles, quelle que soit sa race."
    es: "Italia no tiene ninguna lista nacional de razas de perros peligrosas o prohibidas. La lista de 17 razas de 2006 fue derogada por la ordenanza de marzo de 2009 firmada por la subsecretaria Francesca Martini, con el argumento científico de que la raza de un perro no predice su agresividad. La responsabilidad recae en el propietario: todo perro está sujeto a las mismas normas, sea cual sea su raza."
    pt: "A Itália não tem nenhuma lista nacional de raças de cachorro perigosas ou proibidas. A lista de 17 raças de 2006 foi revogada pela portaria (ordinanza) de março de 2009 assinada pela subsecretária Francesca Martini, com o argumento científico de que a raça de um cachorro não prevê sua agressividade. A responsabilidade recai sobre o dono: todo cachorro está sujeito às mesmas regras, independentemente da raça."
  cat1:
    en: "No banned-breed category exists: no breed is prohibited from being imported into, kept in or transiting Italy. A dog is never classified as dangerous by its breed or appearance."
    fr: "Aucune catégorie de races interdites n'existe : aucune race n'est interdite d'importation, de détention ou de transit en Italie. Un chien n'est jamais classé dangereux en raison de sa race ou de son apparence."
    es: "No existe ninguna categoría de razas prohibidas: ninguna raza tiene prohibida la importación, la tenencia o el tránsito en Italia. Un perro nunca se clasifica como peligroso por su raza o apariencia."
    pt: "Não existe nenhuma categoria de raças proibidas: nenhuma raça tem a importação, a posse ou o trânsito proibidos na Itália. Um cachorro nunca é classificado como perigoso por sua raça ou aparência."
  cat2:
    en: "Owner obligations apply to every dog under the public-safety ordinance (ordinanza sulla tutela dell'incolumità pubblica dall'aggressione dei cani): a lead no longer than 1.5 m in urban and public areas, and a muzzle (rigid or soft) always carried and applied on request or when there is potential danger. Dogs entered in the register of at-risk dogs after an incident must also hold third-party liability insurance and, where a behavioural assessment is required, the owner completes a training course (patentino)."
    fr: "Des obligations pèsent sur le propriétaire de tout chien selon l'ordonnance sur la tutelle de l'incolumité publique contre l'agression des chiens : laisse d'au plus 1,50 m dans les zones urbaines et lieux publics, et muselière (rigide ou souple) toujours portée et appliquée sur demande ou en cas de danger potentiel. Les chiens inscrits au registre des chiens à risque après un incident doivent en outre disposer d'une assurance responsabilité civile et, si une évaluation comportementale est requise, le propriétaire suit une formation (patentino)."
    es: "Las obligaciones del propietario se aplican a todo perro según la ordenanza de protección de la seguridad pública frente a la agresión de perros (ordinanza sulla tutela dell'incolumità pubblica dall'aggressione dei cani): correa de no más de 1,5 m en zonas urbanas y lugares públicos, y bozal (rígido o blando) llevado siempre encima y colocado cuando se solicite o exista peligro potencial. Los perros inscritos en el registro de perros de riesgo tras un incidente deben además contar con un seguro de responsabilidad civil y, cuando se requiera una evaluación de comportamiento, el propietario completa un curso de formación (patentino)."
    pt: "As obrigações do dono valem para todo cachorro segundo a portaria de proteção da incolumidade pública contra a agressão de cachorros (ordinanza sulla tutela dell'incolumità pubblica dall'aggressione dei cani): guia de no máximo 1,5 m em áreas urbanas e locais públicos, e focinheira (rígida ou macia) sempre levada consigo e colocada quando solicitado ou quando houver perigo potencial. Cachorros inscritos no registro de cachorros de risco após um incidente precisam ainda ter seguro de responsabilidade civil e, quando for exigida uma avaliação comportamental, o dono faz um curso de formação (patentino)."
  note:
    en: "Only owner behaviour and, where ordered, a veterinary/ASL behavioural assessment matter — not breed. Import into Italy carries no breed restriction. Confirm current details with the Ministero della Salute."
    fr: "Seuls le comportement du propriétaire et, le cas échéant, une évaluation comportementale vétérinaire/ASL comptent — pas la race. L'importation en Italie ne comporte aucune restriction de race. Confirme les détails à jour auprès du Ministero della Salute."
    es: "Solo cuentan el comportamiento del propietario y, cuando se ordene, una evaluación de comportamiento veterinaria/ASL — no la raza. La importación en Italia no conlleva ninguna restricción de raza. Confirma los detalles actuales con el Ministero della Salute."
    pt: "Só contam o comportamento do dono e, quando determinada, uma avaliação comportamental veterinária/ASL — não a raça. A importação para a Itália não tem nenhuma restrição de raça. Confirme os detalhes atuais com o Ministero della Salute."

