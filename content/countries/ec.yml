# Country Entry Guide — Ecuador (bilingual EN/FR).
# Ecuador is NOT in the EU. This encodes Ecuador's own AGROCALIDAD scheme (Agencia de Regulación
# y Control Fito y Zoosanitario): an Export Zoosanitary Certificate from the origin country, several
# vaccinations, parasite treatment, and — for cargo only — an Import Zoosanitary Permit before SENAE clears the pet.
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_ec
iso2: "EC"
name: { en: "Ecuador", fr: "Équateur", es: "Ecuador", pt: "Equador" }
region: { en: "South America", fr: "Amérique du Sud", es: "América del Sur", pt: "América do Sul" }


regime: non_listed
exit:
  authority: AGROCALIDAD
  authorityUrl: https://www.agrocalidad.gob.ec/salida-de-animales-de-compania-perros-y-gatos/
  intro:
    en: "Ecuador is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by AGROCALIDAD."
    fr: "L'Équateur est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par l'AGROCALIDAD."
    es: "Ecuador no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por AGROCALIDAD."
    pt: "O Equador é um país não listado, então um teste sorológico antirrábico (titulação) válido é obrigatório para voltar à UE — além de um atestado de saúde de exportação referendado pela AGROCALIDAD."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipe o teste sorológico antirrábico: a coleta é feita em laboratório aprovado pela União Europeia, no mínimo 30 dias após a vacinação — um resultado válido é indispensável para voltar a entrar na União Europeia e não se resolve em cima da hora."
    - timing: window
      scope: eu
      text:
        en: "A registered vet submits the request at least 72h before travel; an AGROCALIDAD official signs and stamps the export certificate (valid 10 days) and endorses the EU model."
        fr: "Un vétérinaire enregistré dépose la demande au moins 72 h avant le voyage ; un agent d'AGROCALIDAD signe et tamponne le certificat d'export (valable 10 jours) et vise le modèle UE."
        es: "Un veterinario registrado presenta la solicitud al menos 72 h antes del viaje; un funcionario de AGROCALIDAD firma y sella el certificado de exportación (válido 10 días) y refrenda el modelo UE."
        pt: "Um veterinário registrado apresenta o pedido pelo menos 72 h antes da viagem; um funcionário da AGROCALIDAD assina e carimba o certificado de exportação (válido por 10 dias) e referenda o modelo da UE."
    - timing: window
      scope: non_eu
      text:
        en: "A registered vet submits the request at least 72 hours before travel; an AGROCALIDAD official signs and stamps the export certificate (valid 10 days)."
        fr: "Un vétérinaire enregistré dépose la demande au moins 72 heures avant le départ ; un agent d'AGROCALIDAD signe et tamponne le certificat d'export (valable 10 jours)."
        es: "Un veterinario registrado presenta la solicitud al menos 72 horas antes del viaje; un funcionario de AGROCALIDAD firma y sella el certificado de exportación (válido 10 días)."
        pt: "Um veterinário registrado envia o pedido pelo menos 72 horas antes da viagem; um agente da AGROCALIDAD assina e carimba o certificado de exportação (válido por 10 dias)."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o seu cachorro já tinha um teste sorológico antirrábico válido para a União Europeia antes de sair, ele vale por toda a vida enquanto a vacinação antirrábica for mantida em dia — confira isso antes de viajar."

hero:
  h1: { en: "Traveling to Ecuador with your dog", fr: "Voyager en Équateur avec ton chien", es: "Viajar a Ecuador con tu perro", pt: "Viajar para o Equador com o seu cachorro" }
  intro:
    en: >-
      Ecuador welcomes dogs, and it runs one uniform national scheme managed by AGROCALIDAD (Agencia
      de Regulación y Control Fito y Zoosanitario), the official animal-health authority. There is no
      EU pet passport here: the key document is an Export Zoosanitary Certificate (Certificado
      Zoosanitario de Exportación) issued or endorsed by the official veterinary service of your
      country of origin, in Spanish or English, dated no more than 10 calendar days before entry. It
      must confirm a clinical examination, several current vaccinations (including rabies) and internal
      and external parasite treatment. Ecuador asks for no rabies antibody test and imposes no routine
      quarantine for a healthy, compliant pet. If your dog flies in the cabin or as accompanied baggage,
      that certificate alone clears it; only pets arriving as cargo need an Import Zoosanitary Permit
      requested in advance. This guide explains exactly what to prepare, and when, before you book.
    fr: >-
      L'Équateur accueille les chiens et applique un régime national uniforme géré par AGROCALIDAD
      (Agencia de Regulación y Control Fito y Zoosanitario), l'autorité sanitaire animale officielle.
      Pas de passeport européen ici : le document clé est un Certificat Zoosanitaire d'Exportation
      (Certificado Zoosanitario de Exportación) émis ou avalisé par le service vétérinaire officiel de
      ton pays d'origine, en espagnol ou en anglais, daté de 10 jours calendaires au maximum avant
      l'entrée. Il doit attester un examen clinique, plusieurs vaccinations en cours (dont la rage) et
      un traitement antiparasitaire interne et externe. L'Équateur n'exige aucun titrage antirabique
      et n'impose aucune quarantaine de routine pour un animal sain et conforme. Si ton chien voyage
      en cabine ou en bagage accompagné, ce certificat suffit ; seuls les animaux arrivant en fret ont
      besoin d'un Permis Zoosanitaire d'Importation demandé à l'avance. Ce guide détaille quoi préparer,
      et quand, avant de réserver.
    es: >-
      Ecuador acoge a los perros y aplica un régimen nacional uniforme gestionado por AGROCALIDAD
      (Agencia de Regulación y Control Fito y Zoosanitario), la autoridad sanitaria animal oficial.
      Aquí no hay pasaporte europeo para mascotas: el documento clave es un Certificado Zoosanitario de
      Exportación expedido o refrendado por el servicio veterinario oficial de tu país de origen, en
      español o inglés, con fecha no superior a 10 días calendario antes de la entrada. Debe confirmar un
      examen clínico, varias vacunaciones vigentes (incluida la rabia) y un tratamiento contra parásitos
      internos y externos. Ecuador no exige prueba de titulación de rabia ni impone cuarentena rutinaria
      a una mascota sana y que cumple los requisitos. Si tu perro viaja en cabina o como equipaje
      acompañado, ese certificado por sí solo lo despacha; solo las mascotas que llegan como carga
      necesitan un Permiso Zoosanitario de Importación solicitado con antelación. Esta guía explica
      exactamente qué preparar, y cuándo, antes de reservar.

    pt: "O Equador recebe bem os cachorros e aplica um regime nacional único, gerido pela AGROCALIDAD (Agencia de Regulación y Control Fito y Zoosanitario), a autoridade oficial de saúde animal. Aqui não existe passaporte europeu para animais de estimação: o documento central é um Certificado Zoossanitário de Exportação (Certificado Zoosanitario de Exportación) emitido ou referendado pelo serviço veterinário oficial do seu país de origem, em espanhol ou inglês, com data de no máximo 10 dias corridos antes da entrada. Ele deve confirmar um exame clínico, várias vacinações em dia (inclusive a antirrábica) e um tratamento contra parasitas internos e externos. O Equador não exige teste sorológico antirrábico nem impõe quarentena de rotina a um animal saudável e em conformidade. Se o seu cachorro viajar na cabine ou como bagagem acompanhada, esse certificado sozinho já o libera; só os animais que chegam como carga precisam de uma Autorização Zoossanitária de Importação solicitada com antecedência. Este guia explica exatamente o que preparar, e quando, antes de você reservar."
difficulty:
  level: moderate
  label: { en: "Moderate — one uniform scheme, but several vaccinations and a short waiting period", fr: "Modéré — un régime uniforme, mais plusieurs vaccins et un court délai d'attente", es: "Moderado — un régimen uniforme, pero varias vacunaciones y un breve periodo de espera", pt: "Moderado — um regime único, mas várias vacinações e um curto prazo de espera" }

prepTime:
  eu:
    en: "Standard case (cabin or accompanied baggage): a few days to assemble the Export Zoosanitary Certificate once vaccinations are valid — the certificate is issued within 10 calendar days before entry."
    fr: "Cas standard (cabine ou bagage accompagné) : quelques jours pour réunir le Certificat Zoosanitaire d'Exportation une fois les vaccinations valides — le certificat est émis dans les 10 jours calendaires avant l'entrée."
    es: "Caso estándar (cabina o equipaje acompañado): unos días para reunir el Certificado Zoosanitario de Exportación una vez que las vacunaciones son válidas — el certificado se expide dentro de los 10 días calendario previos a la entrada."
    pt: "Caso padrão (cabine ou bagagem acompanhada): alguns dias para reunir o Certificado Zoossanitário de Exportação assim que as vacinações estiverem válidas — o certificado é emitido dentro dos 10 dias corridos anteriores à entrada."
  listed:
    en: "If the first rabies shot is still needed: plan at least ~2 weeks, as a primary rabies vaccination requires at least 14 days to pass before arrival. Minimum entry age is over 4 months."
    fr: "Si la première vaccination antirabique reste à faire : prévois au moins ~2 semaines, une primo-vaccination antirabique nécessitant qu'au moins 14 jours s'écoulent avant l'arrivée. L'âge minimum d'entrée est de plus de 4 mois."
    es: "Si aún falta la primera vacuna antirrábica: planifica al menos ~2 semanas, ya que una primovacunación antirrábica requiere que transcurran al menos 14 días antes de la llegada. La edad mínima de entrada es de más de 4 meses."
    pt: "Se a primeira dose antirrábica ainda estiver pendente: planeje pelo menos ~2 semanas, já que uma primovacinação antirrábica exige que passem pelo menos 14 dias antes da chegada. A idade mínima de entrada é de mais de 4 meses."
  nonListed:
    en: "Pets arriving as cargo: allow more time — an Import Zoosanitary Permit must be requested by email at least 72 hours before arrival, and SENAE clears the animal afterwards."
    fr: "Animaux arrivant en fret : prévois plus de temps — un Permis Zoosanitaire d'Importation doit être demandé par courriel au moins 72 heures avant l'arrivée, et le SENAE dédouane ensuite l'animal."
    es: "Mascotas que llegan como carga: prevé más tiempo — hay que solicitar un Permiso Zoosanitario de Importación por correo electrónico al menos 72 horas antes de la llegada, y el SENAE despacha al animal después."
    pt: "Animais que chegam como carga: reserve mais tempo — a Autorização Zoossanitária de Importação precisa ser solicitada por e-mail pelo menos 72 horas antes da chegada, e o SENAE libera o animal depois."

