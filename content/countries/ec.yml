restrictedDogs:
  intro:
    en: "AGROCALIDAD's zoosanitary import requirements do not refuse any dog at the border on the basis of its breed. However, Ecuador has a national responsible-ownership regulation for certain breeds, and the Galápagos Islands apply a separate, much stricter biosecurity regime."
    fr: "Les exigences zoosanitaires d'importation d'AGROCALIDAD ne refusent aucun chien à la frontière en raison de sa race. Toutefois, l'Équateur dispose d'une réglementation nationale de tenance responsable pour certaines races, et les îles Galápagos appliquent un régime de biosécurité distinct et bien plus strict."
    es: "Los requisitos zoosanitarios de importación de AGROCALIDAD no rechazan a ningún perro en la frontera por su raza. Sin embargo, Ecuador cuenta con una normativa nacional de tenencia responsable para ciertas razas, y las Islas Galápagos aplican un régimen de bioseguridad aparte y mucho más estricto."
    pt: "As exigências zoossanitárias de importação da AGROCALIDAD não recusam nenhum cachorro na fronteira por causa da raça. No entanto, o Equador tem um regulamento nacional de posse responsável para certas raças, e as Ilhas Galápagos aplicam um regime de biossegurança separado e bem mais rígido."
  cat1:
    en: "Responsible-ownership regulation: Ecuador's Reglamento de Tenencia y Manejo Responsable de Perros (Acuerdo Ministerial 116, Registro Oficial 532, 2009) lists breeds considered not recommended as pets — notably Pit Bull and Rottweiler and their crosses — and restricts their breeding and sale to AGROCALIDAD-authorised kennels. This governs ownership and breeding inside the country, not a breed-based refusal at the border."
    fr: "Réglementation de tenance responsable : le Reglamento de Tenencia y Manejo Responsable de Perros (Acuerdo Ministerial 116, Registro Oficial 532, 2009) liste des races considérées comme non recommandées comme animaux de compagnie — notamment le Pit Bull et le Rottweiler et leurs croisements — et réserve leur reproduction et leur vente aux élevages autorisés par AGROCALIDAD. Cela régit la détention et l'élevage dans le pays, non un refus à la frontière fondé sur la race."
    es: "Normativa de tenencia responsable: el Reglamento de Tenencia y Manejo Responsable de Perros (Acuerdo Ministerial 116, Registro Oficial 532, 2009) enumera razas consideradas no recomendadas como mascotas — en particular el Pit Bull y el Rottweiler y sus cruces — y restringe su reproducción y venta a criaderos autorizados por AGROCALIDAD. Esto regula la tenencia y la cría dentro del país, no un rechazo por raza en la frontera."
    pt: "Regulamento de posse responsável: o Reglamento de Tenencia y Manejo Responsable de Perros do Equador (Acuerdo Ministerial 116, Registro Oficial 532, 2009) lista raças consideradas não recomendadas como animais de estimação — notadamente Pit Bull e Rottweiler e seus cruzamentos — e restringe a criação e a venda delas a canis autorizados pela AGROCALIDAD. Isso rege a posse e a criação dentro do país, e não uma recusa na fronteira por causa da raça."
  cat2:
    en: "Galápagos biosecurity: taking a dog to the Galápagos Islands is governed separately by the ABG (Agencia de Regulación y Control de la Bioseguridad y Cuarentena para Galápagos), which controls and restricts the introduction of species to protect the archipelago. Its rules are far stricter than mainland entry and must be checked directly with the ABG before any travel to the islands with a pet."
    fr: "Biosécurité des Galápagos : emmener un chien aux îles Galápagos est régi séparément par l'ABG (Agencia de Regulación y Control de la Bioseguridad y Cuarentena para Galápagos), qui contrôle et restreint l'introduction d'espèces pour protéger l'archipel. Ses règles sont bien plus strictes que l'entrée sur le continent et doivent être vérifiées directement auprès de l'ABG avant tout voyage aux îles avec un animal."
    es: "Bioseguridad de Galápagos: llevar un perro a las Islas Galápagos se rige por separado por la ABG (Agencia de Regulación y Control de la Bioseguridad y Cuarentena para Galápagos), que controla y restringe la introducción de especies para proteger el archipiélago. Sus normas son mucho más estrictas que la entrada al continente y deben consultarse directamente con la ABG antes de cualquier viaje a las islas con una mascota."
    pt: "Biossegurança em Galápagos: levar um cachorro às Ilhas Galápagos é regido separadamente pela ABG (Agencia de Regulación y Control de la Bioseguridad y Cuarentena para Galápagos), que controla e restringe a introdução de espécies para proteger o arquipélago. As regras dela são bem mais rígidas do que as de entrada no continente e precisam ser verificadas diretamente com a ABG antes de qualquer viagem às ilhas com um animal."
  note:
    en: "For mainland entry, focus on the AGROCALIDAD sanitary rules; if you own a listed breed, check the national ownership regulation, and if you plan to reach Galápagos, consult the ABG in advance."
    fr: "Pour l'entrée sur le continent, concentre-toi sur les règles sanitaires d'AGROCALIDAD ; si tu possédez une race listée, vérifie la réglementation nationale de détention, et si tu prévois de rejoindre les Galápagos, consulte l'ABG à l'avance."
    es: "Para la entrada al continente, céntrate en las normas sanitarias de AGROCALIDAD; si tienes una raza listada, comprueba la normativa nacional de tenencia, y si planeas llegar a Galápagos, consulta a la ABG con antelación."
    pt: "Para a entrada no continente, concentre-se nas regras sanitárias da AGROCALIDAD; se você tem uma raça listada, verifique o regulamento nacional de posse, e se pretende chegar a Galápagos, consulte a ABG com antecedência."

checklist:
  - en: "Export Zoosanitary Certificate from the origin country (Spanish or English), issued within 10 calendar days before entry"
    fr: "Certificat Zoosanitaire d'Exportation du pays d'origine (espagnol ou anglais), émis dans les 10 jours calendaires avant l'entrée"
    es: "Certificado Zoosanitario de Exportación del país de origen (español o inglés), expedido dentro de los 10 días calendario previos a la entrada"
    pt: "Certificado Zoossanitário de Exportação do país de origem (em espanhol ou inglês), emitido dentro dos 10 dias corridos anteriores à entrada"
  - en: "Dog over 4 months old and identified by name, tattoo or (recommended) an ISO microchip"
    fr: "Chien de plus de 4 mois, identifié par nom, tatouage ou (recommandé) une puce ISO"
    es: "Perro de más de 4 meses e identificado por nombre, tatuaje o (recomendado) un microchip ISO"
    pt: "Cachorro com mais de 4 meses e identificado por nome, tatuagem ou (recomendado) um microchip ISO"
  - en: "Valid rabies vaccination (if it is the first, at least 14 days before arrival)"
    fr: "Vaccination antirabique valide (si c'est la première, au moins 14 jours avant l'arrivée)"
    es: "Vacunación antirrábica válida (si es la primera, al menos 14 días antes de la llegada)"
    pt: "Vacinação antirrábica válida (se for a primeira, pelo menos 14 dias antes da chegada)"
  - en: "Other canine vaccinations current: distemper, hepatitis, leptospirosis, parvovirus"
    fr: "Autres vaccinations canines en cours : maladie de Carré, hépatite, leptospirose, parvovirose"
    es: "Otras vacunaciones caninas vigentes: moquillo, hepatitis, leptospirosis, parvovirus"
    pt: "Outras vacinações caninas em dia: cinomose, hepatite, leptospirose, parvovirose"
  - en: "Clinical examination within 10 days before travel; internal & external parasite treatment within 21 days before shipment"
    fr: "Examen clinique dans les 10 jours avant le voyage ; traitement antiparasitaire interne & externe dans les 21 jours avant l'embarquement"
    es: "Examen clínico dentro de los 10 días previos al viaje; tratamiento contra parásitos internos y externos dentro de los 21 días previos al embarque"
    pt: "Exame clínico nos 10 dias anteriores à viagem; tratamento contra parasitas internos e externos nos 21 dias anteriores ao embarque"
  - en: "Original vaccination record (booklet or passport) showing product, date and validity"
    fr: "Carnet de vaccination original (livret ou passeport) indiquant produit, date et validité"
    es: "Carné de vacunación original (cartilla o pasaporte) que muestre el producto, la fecha y la vigencia"
    pt: "Carteira de vacinação original (caderneta ou passaporte) indicando produto, data e validade"
  - en: "For cargo arrivals: email the arrival airport's AGROCALIDAD office at least 72 hours ahead to obtain the Import Zoosanitary Permit (paid via authorised banks, no cash)"
    fr: "Pour les arrivées en fret : écrivez au bureau AGROCALIDAD de l'aéroport d'arrivée au moins 72 heures à l'avance pour obtenir le Permis Zoosanitaire d'Importation (payé via les banques autorisées, pas d'espèces)"
    es: "Para las llegadas como carga: escribe a la oficina de AGROCALIDAD del aeropuerto de llegada al menos 72 horas antes para obtener el Permiso Zoosanitario de Importación (pagado a través de bancos autorizados, sin efectivo)"
    pt: "Para chegadas como carga: escreva por e-mail ao escritório da AGROCALIDAD do aeroporto de chegada pelo menos 72 horas antes para obter a Autorização Zoossanitária de Importação (paga pelos bancos autorizados, sem dinheiro em espécie)"
  - en: "Airline reservation confirming your dog's travel option and a suitable IATA crate if in the hold"
    fr: "Réservation confirmant l'option de transport de ton chien et une caisse IATA adaptée si en soute"
    es: "Reserva de la aerolínea que confirme la opción de viaje de tu perro y una jaula IATA adecuada si viaja en bodega"
    pt: "Reserva da companhia aérea confirmando a opção de viagem do seu cachorro e uma caixa de transporte IATA adequada se ele for no porão"

