origin:
  scheme: eu
  eu:
    title: { en: "Simplified — EU pet passport", fr: "Simplifié — passeport européen", es: "Simplificado — pasaporte europeo", pt: "Simplificado — passaporte europeu para animais" }
    body:
      en: "A dog coming from another EU country needs an EU pet passport showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate and normally no border check."
      fr: "Un chien venant d'un autre pays de l'UE a besoin d'un passeport européen mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire et normalement pas de contrôle frontalier."
      es: "Un perro que llega de otro país de la UE necesita un pasaporte europeo que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario y normalmente sin control fronterizo."
      pt: "Um cachorro vindo de outro país da UE precisa de um passaporte europeu que comprove um microchip ISO válido e uma vacinação antirrábica em dia. Sem teste sorológico, sem certificado sanitário e, normalmente, sem controle de fronteira."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a listed non-EU country (United States, Canada, United Kingdom, Switzerland, Japan, Australia and others), your dog needs a microchip, a valid rabies vaccination and an EU animal health certificate endorsed by an official vet before departure. No antibody test is required; enter Czechia via an approved international airport and present yourself to customs."
      fr: "Depuis un pays tiers listé (États-Unis, Canada, Royaume-Uni, Suisse, Japon, Australie…), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire européen visé par un vétérinaire officiel avant le départ. Pas de titrage ; entre en Tchéquie par un aéroport international agréé et présente-toi à la douane."
      es: "Desde un país tercero listado (Estados Unidos, Canadá, Reino Unido, Suiza, Japón, Australia y otros), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal de la UE refrendado por un veterinario oficial antes de la salida. No se exige prueba de titulación; entra en Chequia por un aeropuerto internacional autorizado y preséntate ante la aduana."
      pt: "Vindo de um país listado fora da UE (Estados Unidos, Canadá, Reino Unido, Suíça, Japão, Austrália e outros), seu cachorro precisa de microchip, vacinação antirrábica válida e um certificado sanitário europeu endossado por um veterinário oficial antes da partida. Não é exigido teste sorológico; entre na Tchéquia por um aeroporto internacional aprovado e apresente-se à alfândega."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (at-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an EU-designated laboratory, then a compulsory 3-month wait before entry. An endorsed EU animal health certificate is also required."
      fr: "Depuis un pays non listé (à risque), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé UE, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire européen visé est également requis."
      es: "Desde un país no listado (con riesgo), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado por la UE, y luego una espera obligatoria de 3 meses antes de la entrada. También se exige un certificado sanitario animal de la UE refrendado."
      pt: "Vindo de um país não listado (de risco), acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório designado pela UE, e depois 3 meses obrigatórios de espera antes da entrada. Também é exigido um certificado sanitário europeu endossado."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Czechia depends on where you flew from."
    fr: "Ce qui se passe à l'arrivée de ton chien en Tchéquie dépend de ton lieu de départ."
    es: "Lo que ocurre cuando tu perro llega a Chequia depende del lugar desde el que hayas volado."
    pt: "O que acontece quando seu cachorro chega à Tchéquia depende do país de onde você veio."
  points:
    - from: eu
      en: "From another EU country: no systematic border check — keep the EU pet passport with you."
      fr: "Depuis un autre pays de l'UE : pas de contrôle systématique — garde le passeport européen sur toi."
      es: "Desde otro país de la UE: sin control fronterizo sistemático — lleva contigo el pasaporte europeo."
      pt: "De outro país da UE: sem controle de fronteira sistemático — leve o passaporte europeu com você."
    - from: non_eu
      en: "From outside the EU: pets may be imported only via an approved international airport point of entry; present yourself to Czech customs for documentary and identity checks."
      fr: "Depuis hors UE : les animaux ne peuvent entrer que par un aéroport international agréé comme point d'entrée ; présente-toi à la douane tchèque pour les contrôles documentaires et d'identité."
      es: "Desde fuera de la UE: las mascotas solo pueden entrar por un aeropuerto internacional autorizado como punto de entrada; preséntate ante la aduana checa para los controles documentales y de identidad."
      pt: "De fora da UE: os animais de estimação só podem ser importados por um aeroporto internacional aprovado como ponto de entrada; apresente-se à alfândega tcheca para os controles de documentos e de identificação."
    - en: "No import permit is issued and no prior appointment with customs is needed for non-commercial pet travel."
      fr: "Aucun permis d'import n'est délivré et aucun rendez-vous préalable avec la douane n'est nécessaire pour le voyage non commercial."
      es: "No se expide ningún permiso de importación ni se necesita cita previa con la aduana para el viaje no comercial de mascotas."
      pt: "Nenhuma autorização de importação é emitida e não é preciso agendamento prévio na alfândega para a viagem não comercial com animal de estimação."
    - en: "A maximum of five pets may travel with an owner under the non-commercial movement rules."
      fr: "Un maximum de cinq animaux peut voyager avec un propriétaire dans le cadre du mouvement non commercial."
      es: "Un máximo de cinco mascotas puede viajar con un propietario según las normas de movimiento no comercial."
      pt: "No máximo cinco animais de estimação podem viajar com um dono segundo as regras de deslocamento não comercial."
    - en: "Carry original documents (not copies); keep the laboratory report for any antibody test."
      fr: "Munis-toi des documents originaux (pas de copies) ; conserve le protocole de laboratoire pour tout titrage."
      es: "Lleva los documentos originales (no copias); conserva el informe de laboratorio de cualquier prueba de titulación."
      pt: "Leve os documentos originais (não cópias); guarde o laudo do laboratório de qualquer teste sorológico."
    - en: "If documents are missing or invalid, authorities may order re-export, quarantine or other measures — at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, les autorités peuvent ordonner réexpédition, quarantaine ou autres mesures — aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, las autoridades pueden ordenar la reexpedición, la cuarentena u otras medidas — a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, as autoridades podem determinar a reexportação, a quarentena ou outras medidas — às custas do dono."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Czechia has no national breed-specific dangerous-dog ban. There is no list of prohibited breeds; the law relies on an owner-responsibility model rather than on the dog's breed."
    fr: "La Tchéquie n'a aucune interdiction nationale de chiens dangereux fondée sur la race. Il n'existe pas de liste de races interdites ; la loi repose sur un modèle de responsabilité du propriétaire plutôt que sur la race du chien."
    es: "Chequia no tiene ninguna prohibición nacional de perros peligrosos basada en la raza. No existe una lista de razas prohibidas; la ley se basa en un modelo de responsabilidad del propietario y no en la raza del perro."
    pt: "A Tchéquia não tem nenhuma proibição nacional de cachorros perigosos baseada na raça. Não existe lista de raças proibidas; a lei se apoia em um modelo de responsabilidade do dono, e não na raça do cachorro."
  cat1:
    en: "No breed is banned from import or ownership on the basis of its type. Historically parliament chose responsibility over breed lists, approving only a ban on training any dog for fighting rather than outlawing specific breeds."
    fr: "Aucune race n'est interdite d'importation ou de détention en raison de son type. Historiquement, le parlement a privilégié la responsabilité plutôt que des listes de races, approuvant seulement l'interdiction de dresser un chien au combat, sans proscrire de races précises."
    es: "Ninguna raza está prohibida para la importación o la tenencia por razón de su tipo. Históricamente, el parlamento optó por la responsabilidad en lugar de las listas de razas, aprobando únicamente la prohibición de adiestrar a cualquier perro para el combate en lugar de proscribir razas concretas."
    pt: "Nenhuma raça é proibida de importação ou de posse por causa do seu tipo. Historicamente, o parlamento preferiu a responsabilidade às listas de raças, aprovando apenas a proibição de treinar qualquer cachorro para briga, em vez de banir raças específicas."
  cat2:
    en: "Rules are set locally: individual municipalities may adopt ordinances (for example muzzle, leash or registration requirements in public spaces), so obligations can vary from one town to another."
    fr: "Les règles sont fixées localement : chaque commune peut adopter des arrêtés (par exemple muselière, laisse ou enregistrement dans l'espace public), si bien que les obligations peuvent varier d'une ville à l'autre."
    es: "Las normas se fijan a nivel local: cada municipio puede adoptar ordenanzas (por ejemplo, exigencias de bozal, correa o registro en los espacios públicos), por lo que las obligaciones pueden variar de una ciudad a otra."
    pt: "As regras são definidas localmente: cada município pode adotar posturas municipais (por exemplo, exigência de focinheira, guia ou registro em espaços públicos), de modo que as obrigações podem variar de uma cidade para outra."
  note:
    en: "Because there is no national breed ban, no dog is refused entry for its breed alone. Check the municipal rules of your destination town, and confirm current local requirements before travelling."
    fr: "Comme il n'y a pas d'interdiction nationale de race, aucun chien n'est refusé à l'entrée pour sa seule race. Vérifie les règles municipales de ta ville de destination et confirme les obligations locales en vigueur avant de voyager."
    es: "Como no hay ninguna prohibición nacional por raza, no se rechaza la entrada a ningún perro solo por su raza. Consulta las normas municipales de tu ciudad de destino y confirma los requisitos locales vigentes antes de viajar."
    pt: "Como não há proibição nacional por raça, nenhum cachorro tem a entrada recusada só pela raça. Consulte as regras municipais da cidade de destino e confirme as exigências locais em vigor antes de viajar."

