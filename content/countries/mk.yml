  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consulte sempre seu veterinário antes de fechar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — North Macedonia (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — la Macédoine du Nord (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Macedonia del Norte (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — a Macedônia do Norte (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — North Macedonia", fr: "Pays de destination — Macédoine du Nord", es: "País de destino — Macedonia del Norte", pt: "País de destino — Macedônia do Norte" }
      text:
        en: "North Macedonia applies its national Rulebook (Official Gazette 153/2015): a dog over 3 months old, permanently identified, with a valid rabies vaccination and either a pet passport or a veterinary health certificate."
        fr: "La Macédoine du Nord applique son Règlement national (Journal officiel 153/2015) : chien de plus de 3 mois, identifié de façon permanente, avec une vaccination antirabique valide et un passeport ou un certificat vétérinaire."
        es: "Macedonia del Norte aplica su Reglamento nacional (Boletín Oficial 153/2015): un perro de más de 3 meses, identificado de forma permanente, con una vacunación antirrábica válida y un pasaporte para mascotas o un certificado sanitario veterinario."
        pt: "A Macedônia do Norte aplica seu Regulamento nacional (Diário Oficial 153/2015): um cachorro com mais de 3 meses, identificado de forma permanente, com vacinação antirrábica válida e um passaporte para animais ou um atestado de saúde veterinário."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Whether your dog leaves from a passport country (Annex II Part A), a certificate country (Annex II Part B) or a country not on the low-risk lists decides whether a rabies antibody test is required."
        fr: "Que ton chien parte d'un pays à passeport (annexe II partie A), d'un pays à certificat (annexe II partie B) ou d'un pays hors des listes à faible risque détermine si un titrage antirabique est exigé."
        es: "Que tu perro salga de un país con pasaporte (anexo II parte A), de un país con certificado (anexo II parte B) o de un país fuera de las listas de bajo riesgo determina si se exige una prueba de titulación de rabia."
        pt: "Se o seu cachorro parte de um país de passaporte (anexo II parte A), de um país de certificado (anexo II parte B) ou de um país fora das listas de baixo risco é o que determina se o teste sorológico antirrábico é exigido."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay in a rabies-risk country can trigger the antibody test even if you fly in from a low-risk country. It is your dog's real origin and history that count — not only the last airport."
        fr: "Un séjour récent dans un pays à risque rabique peut imposer le titrage même si tu arrives d'un pays à faible risque. C'est l'origine réelle et l'historique du chien qui comptent — pas seulement l'aéroport de destination finale."
        es: "Una estancia reciente en un país con riesgo de rabia puede obligar a la prueba de titulación aunque llegues desde un país de bajo riesgo. Lo que cuenta es el origen y el historial reales de tu perro — no solo el último aeropuerto."
        pt: "Uma estadia recente em um país de risco de raiva pode acionar o teste sorológico mesmo que você chegue de um país de baixo risco. O que conta é a origem e o histórico reais do seu cachorro — não apenas o último aeroporto."
  note:
    en: "So read the requirements below as North Macedonia's framework, then confirm your dog's exact origin and history with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre macédonien, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Macedonia del Norte y luego confirma el origen y el historial exactos de tu perro con tu veterinario."
    pt: "Leia então as exigências abaixo como o quadro geral da Macedônia do Norte, e confirme com seu veterinário a origem e o histórico exatos do seu cachorro."

requirements:
  - item: { en: "Microchip / permanent identification", fr: "Puce / identification permanente", es: "Microchip / identificación permanente", pt: "Microchip / identificação permanente" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "The dog must be individually identified before travel.", fr: "Le chien doit être identifié individuellement avant le voyage.", es: "El perro debe estar identificado individualmente antes del viaje.", pt: "O cachorro precisa estar identificado individualmente antes da viagem." }
    exceptions: { en: "An electronic microchip, a clearly legible tattoo or any other permanent means of identification is accepted.", fr: "Une puce électronique, un tatouage clairement lisible ou tout autre moyen d'identification permanent est accepté.", es: "Se acepta un microchip electrónico, un tatuaje claramente legible o cualquier otro medio de identificación permanente.", pt: "Um microchip eletrônico, uma tatuagem claramente legível ou qualquer outro meio permanente de identificação é aceito." }
    ref: { en: "Rulebook, Official Gazette 153/2015; fva.gov.mk", fr: "Règlement, Journal officiel 153/2015 ; fva.gov.mk", es: "Reglamento, Boletín Oficial 153/2015; fva.gov.mk", pt: "Regulamento, Diário Oficial 153/2015; fva.gov.mk" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Valid rabies vaccination for a dog over 3 months old, as recorded in the passport or veterinary health certificate.", fr: "Vaccination antirabique valide pour un chien de plus de 3 mois, consignée dans le passeport ou le certificat vétérinaire.", es: "Vacunación antirrábica válida para un perro de más de 3 meses, registrada en el pasaporte o el certificado sanitario veterinario.", pt: "Vacinação antirrábica válida para um cachorro com mais de 3 meses, registrada no passaporte ou no atestado de saúde veterinário." }
    exceptions: { en: "Puppies under 3 months not yet vaccinated may enter only under strict conditions (see minimum age).", fr: "Les chiots de moins de 3 mois non encore vaccinés ne peuvent entrer que sous conditions strictes (voir âge minimum).", es: "Los cachorros de menos de 3 meses aún no vacunados solo pueden entrar bajo condiciones estrictas (ver edad mínima).", pt: "Filhotes com menos de 3 meses ainda não vacinados só podem entrar sob condições rigorosas (veja idade mínima)." }
    ref: { en: "Rulebook 153/2015; model veterinary health certificate", fr: "Règlement 153/2015 ; modèle de certificat vétérinaire", es: "Reglamento 153/2015; modelo de certificado sanitario veterinario", pt: "Regulamento 153/2015; atestado de saúde veterinário modelo" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Required only for origins not on the Annex I (Part A/B) low-risk lists: test done at least 3 months before travel.", fr: "Exigé uniquement pour les origines hors des listes à faible risque de l'annexe I (parties A/B) : test réalisé au moins 3 mois avant le voyage.", es: "Se exige solo para orígenes fuera de las listas de bajo riesgo del anexo I (partes A/B): prueba realizada al menos 3 meses antes del viaje.", pt: "Exigido apenas para origens fora das listas de baixo risco do anexo I (partes A/B): teste feito pelo menos 3 meses antes da viagem." }
    exceptions: { en: "Not required from countries on the Annex I low-risk lists (which include the EU).", fr: "Non requis depuis les pays des listes à faible risque de l'annexe I (dont l'UE).", es: "No se exige desde países de las listas de bajo riesgo del anexo I (que incluyen la UE).", pt: "Não exigido a partir de países nas listas de baixo risco do anexo I (que incluem a UE)." }
    ref: { en: "Rulebook 153/2015, Annex I; fva.gov.mk", fr: "Règlement 153/2015, annexe I ; fva.gov.mk", es: "Reglamento 153/2015, anexo I; fva.gov.mk", pt: "Regulamento 153/2015, anexo I; fva.gov.mk" }
  - item: { en: "Pet passport (Annex II, Part A)", fr: "Passeport pour animaux (annexe II, partie A)", es: "Pasaporte para mascotas (anexo II, parte A)", pt: "Passaporte para animais (anexo II, parte A)" }
    required: { en: "Part A origins", fr: "Origines partie A", es: "Orígenes de la parte A", pt: "Origens da parte A" }
    when: { en: "Issued by an authorised vet; records the identification and rabies vaccination.", fr: "Délivré par un vétérinaire autorisé ; consigne l'identification et la vaccination antirabique.", es: "Expedido por un veterinario autorizado; registra la identificación y la vacunación antirrábica.", pt: "Emitido por um veterinário autorizado; registra a identificação e a vacinação antirrábica." }
    exceptions: { en: "Replaced by a veterinary health certificate for Annex II Part B origins.", fr: "Remplacé par un certificat vétérinaire pour les origines de l'annexe II partie B.", es: "Se sustituye por un certificado sanitario veterinario para orígenes del anexo II parte B.", pt: "Substituído por um atestado de saúde veterinário para origens do anexo II parte B." }
    ref: { en: "Rulebook 153/2015, Annex II Part A", fr: "Règlement 153/2015, annexe II partie A", es: "Reglamento 153/2015, anexo II parte A", pt: "Regulamento 153/2015, anexo II parte A" }
  - item: { en: "Veterinary health certificate (Annex II, Part B)", fr: "Certificat vétérinaire (annexe II, partie B)", es: "Certificado sanitario veterinario (anexo II, parte B)", pt: "Atestado de saúde veterinário (anexo II, parte B)" }
    required: { en: "Part B origins", fr: "Origines partie B", es: "Orígenes de la parte B", pt: "Origens da parte B" }
    when: { en: "Issued by an authorised/official vet in the country of origin, endorsed within 10 days before travel.", fr: "Établi par un vétérinaire autorisé/officiel du pays d'origine, visé dans les 10 jours précédant le voyage.", es: "Expedido por un veterinario autorizado/oficial del país de origen, refrendado dentro de los 10 días previos al viaje.", pt: "Emitido por um veterinário autorizado/oficial no país de origem, endossado nos 10 dias antes da viagem." }
    exceptions: { en: "Not needed for Annex II Part A origins (pet passport instead).", fr: "Inutile pour les origines de l'annexe II partie A (passeport à la place).", es: "No necesario para orígenes del anexo II parte A (en su lugar, el pasaporte).", pt: "Não necessário para origens do anexo II parte A (nesse caso, vale o passaporte para animais)." }
    ref: { en: "Rulebook 153/2015, Annex II Part B; model certificate", fr: "Règlement 153/2015, annexe II partie B ; modèle de certificat", es: "Reglamento 153/2015, anexo II parte B; modelo de certificado", pt: "Regulamento 153/2015, anexo II parte B; certificado modelo" }
  - item: { en: "Tapeworm (Echinococcus) & tick treatment", fr: "Traitement échinococcose & tiques", es: "Tratamiento contra la tenia (Echinococcus) y garrapatas", pt: "Tratamento contra a tênia (Echinococcus) e carrapatos" }
    required: { en: "Optional", fr: "Facultatif", es: "Opcional", pt: "Opcional" }
    when: { en: "May be examined and treated for echinococcosis and ticks by an official vet, noted in the passport or certificate.", fr: "Peut être examiné et traité contre l'échinococcose et les tiques par un vétérinaire officiel, avec mention dans le passeport ou le certificat.", es: "Puede ser examinado y tratado contra la equinococosis y las garrapatas por un veterinario oficial, con anotación en el pasaporte o el certificado.", pt: "Pode ser examinado e tratado contra a equinococose e os carrapatos por um veterinário oficial, com anotação no passaporte ou no certificado." }
    exceptions: { en: "Not mandatory for entry into North Macedonia.", fr: "Non obligatoire pour l'entrée en Macédoine du Nord.", es: "No obligatorio para la entrada en Macedonia del Norte.", pt: "Não obrigatório para a entrada na Macedônia do Norte." }
