    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "For non-commercial pets (up to 5 animals) no import permit is issued; customs clears them with veterinary consent.", fr: "Pour les animaux non commerciaux (jusqu'à 5), aucun permis n'est délivré ; la douane les dédouane avec l'accord vétérinaire.", es: "Para mascotas no comerciales (hasta 5 animales) no se expide permiso de importación; la aduana las despacha con la conformidad veterinaria.", pt: "Para animais não comerciais (até 5 animais), nenhuma autorização de importação é emitida; a alfândega os libera com o aval veterinário." }
