origin:
  scheme: eu
  eu:
    title: { en: "Simplified — pet passport (Annex II Part A)", fr: "Simplifié — passeport (annexe II partie A)", es: "Simplificado — pasaporte para mascotas (anexo II parte A)", pt: "Simplificado — passaporte para animais (anexo II parte A)" }
    body:
      en: "A dog coming from a country listed in Annex II Part A (which includes EU countries) travels with a pet passport showing permanent identification and a valid rabies vaccination. No antibody test is required. The dog must be over 3 months old."
      fr: "Un chien venant d'un pays de l'annexe II partie A (dont les pays de l'UE) voyage avec un passeport mentionnant une identification permanente et une vaccination antirabique valide. Aucun titrage n'est requis. Le chien doit avoir plus de 3 mois."
      es: "Un perro que llega de un país incluido en el anexo II parte A (que incluye los países de la UE) viaja con un pasaporte para mascotas que acredite una identificación permanente y una vacunación antirrábica válida. No se exige prueba de titulación. El perro debe tener más de 3 meses."
      pt: "Um cachorro vindo de um país listado no anexo II parte A (que inclui os países da UE) viaja com um passaporte para animais que comprove a identificação permanente e a vacinação antirrábica válida. Nenhum teste sorológico é exigido. O cachorro precisa ter mais de 3 meses."
    cls: ok
  listed:
    title: { en: "Veterinary health certificate, no blood test", fr: "Certificat vétérinaire, sans prise de sang", es: "Certificado sanitario veterinario, sin análisis de sangre", pt: "Atestado de saúde veterinário, sem exame de sangue" }
    body:
      en: "From a country listed in Annex II Part B but still on North Macedonia's Annex I low-risk lists, your dog needs permanent identification, a valid rabies vaccination and a veterinary health certificate endorsed by an official vet within 10 days before travel. No antibody test is required."
      fr: "Depuis un pays de l'annexe II partie B mais figurant sur les listes à faible risque de l'annexe I, ton chien a besoin d'une identification permanente, d'une vaccination antirabique valide et d'un certificat vétérinaire visé par un vétérinaire officiel dans les 10 jours précédant le voyage. Aucun titrage n'est requis."
      es: "Desde un país incluido en el anexo II parte B pero que sigue en las listas de bajo riesgo del anexo I de Macedonia del Norte, tu perro necesita identificación permanente, una vacunación antirrábica válida y un certificado sanitario veterinario refrendado por un veterinario oficial dentro de los 10 días previos al viaje. No se exige prueba de titulación."
      pt: "De um país listado no anexo II parte B, mas ainda nas listas de baixo risco do anexo I da Macedônia do Norte, seu cachorro precisa de identificação permanente, vacinação antirrábica válida e um atestado de saúde veterinário endossado por um veterinário oficial nos 10 dias antes da viagem. Nenhum teste sorológico é exigido."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a country that is not on the Annex I low-risk lists, add a rabies antibody titration test carried out at least 3 months before travel, on top of the identification, rabies vaccination and endorsed veterinary health certificate."
      fr: "Depuis un pays hors des listes à faible risque de l'annexe I, ajoute un titrage antirabique réalisé au moins 3 mois avant le voyage, en plus de l'identification, de la vaccination antirabique et du certificat vétérinaire visé."
      es: "Desde un país que no está en las listas de bajo riesgo del anexo I, añade una prueba de titulación de rabia realizada al menos 3 meses antes del viaje, además de la identificación, la vacunación antirrábica y el certificado sanitario veterinario refrendado."
      pt: "De um país fora das listas de baixo risco do anexo I, acrescente um teste sorológico antirrábico feito pelo menos 3 meses antes da viagem, além da identificação, da vacinação antirrábica e do atestado de saúde veterinário endossado."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches North Macedonia depends on where you flew from and your documents."
    fr: "Ce qui se passe à l'arrivée de ton chien en Macédoine du Nord dépend de ton lieu de départ et de tes documents."
    es: "Lo que ocurre cuando tu perro llega a Macedonia del Norte depende del lugar desde el que hayas volado y de tus documentos."
    pt: "O que acontece quando seu cachorro chega à Macedônia do Norte depende de onde você partiu e dos seus documentos."
  points:
    - en: "Import and transit take place only at passenger travel terminals of official border crossings (including Skopje airport)."
      fr: "L'importation et le transit n'ont lieu qu'aux terminaux voyageurs des postes-frontières officiels (dont l'aéroport de Skopje)."
      es: "La importación y el tránsito solo tienen lugar en las terminales de pasajeros de los pasos fronterizos oficiales (incluido el aeropuerto de Skopie)."
      pt: "A importação e o trânsito só acontecem nos terminais de passageiros dos postos de fronteira oficiais (incluindo o aeroporto de Skopje)."
    - en: "Customs officials check identity and documents; an official veterinarian may also inspect the animal if required."
      fr: "Les douaniers vérifient l'identité et les documents ; un vétérinaire officiel peut aussi inspecter l'animal si nécessaire."
      es: "Los funcionarios de aduanas verifican la identidad y los documentos; un veterinario oficial también puede inspeccionar al animal si es necesario."
      pt: "Agentes alfandegários conferem a identidade e os documentos; um veterinário oficial também pode inspecionar o animal, se necessário."
    - en: "Up to five non-commercial pets may accompany a traveller (more only for shows, competitions or training)."
      fr: "Jusqu'à cinq animaux non commerciaux peuvent accompagner un voyageur (davantage seulement pour expositions, concours ou entraînement)."
      es: "Hasta cinco mascotas no comerciales pueden acompañar a un viajero (más solo para exposiciones, competiciones o entrenamiento)."
      pt: "Até cinco animais não comerciais podem acompanhar um viajante (mais apenas para exposições, competições ou treinamento)."
    - en: "Carry the original pet passport or veterinary health certificate, plus proof of the antibody test if you come from a non-listed country."
      fr: "Munis-toi du passeport original ou du certificat vétérinaire, ainsi que de la preuve du titrage si tu viens d'un pays non listé."
      es: "Lleva el pasaporte para mascotas o el certificado sanitario veterinario original, además de la prueba de la titulación si vienes de un país no listado."
      pt: "Leve o passaporte para animais ou o atestado de saúde veterinário original, além do comprovante do teste sorológico, se você vier de um país não listado."
    - en: "If documents are missing or invalid, the animal may be refused entry or returned at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, l'animal peut être refusé à l'entrée ou renvoyé aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, el animal puede ser rechazado en la entrada o devuelto a cargo del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, o animal pode ter a entrada recusada ou ser devolvido às custas do dono."

travellerExperience: null

restrictedDogs:
  intro:
    en: "North Macedonia's pet-import Rulebook (153/2015) sets no breed-specific restriction: the requirements apply to dogs by age, identification, vaccination and origin, not by breed. No official national breed-import ban is published by the Food and Veterinary Agency."
    fr: "Le Règlement d'importation (153/2015) de la Macédoine du Nord ne fixe aucune restriction par race : les exigences s'appliquent selon l'âge, l'identification, la vaccination et l'origine, non selon la race. Aucune interdiction nationale d'importation par race n'est publiée par l'Agence pour l'alimentation et la médecine vétérinaire."
    es: "El Reglamento de importación de mascotas (153/2015) de Macedonia del Norte no establece ninguna restricción por raza: los requisitos se aplican a los perros según la edad, la identificación, la vacunación y el origen, no según la raza. La Agencia de Alimentos y Veterinaria no publica ninguna prohibición nacional de importación por raza."
    pt: "O Regulamento de importação de animais da Macedônia do Norte (153/2015) não estabelece nenhuma restrição por raça: as exigências se aplicam aos cachorros conforme idade, identificação, vacinação e origem, não conforme a raça. Nenhuma proibição nacional oficial de importação por raça é publicada pela Agência de Alimentos e Veterinária."
  cat1:
    en: "No category of dog is banned from import under the published FVA rules. Local ownership and public-safety rules for dangerous dogs may still apply once in the country."
    fr: "Aucune catégorie de chien n'est interdite d'importation selon les règles publiées de l'AHV. Des règles locales de détention et de sécurité publique pour les chiens dangereux peuvent néanmoins s'appliquer sur place."
    es: "Ninguna categoría de perro está prohibida para la importación según las normas publicadas por la AAV. Las normas locales de tenencia y seguridad pública para perros peligrosos pueden aplicarse igualmente una vez en el país."
    pt: "Nenhuma categoria de cachorro tem a importação proibida segundo as regras publicadas pela FVA. Regras locais de posse e de segurança pública para cachorros perigosos ainda podem se aplicar depois da entrada no país."
  cat2:
    en: "No second category is defined for import purposes. Owners should confirm any municipal or public-order rules on specific breeds with local authorities."
    fr: "Aucune deuxième catégorie n'est définie pour l'importation. Les propriétaires doivent vérifier auprès des autorités locales toute règle municipale ou d'ordre public visant des races spécifiques."
    es: "No se define una segunda categoría a efectos de importación. Los propietarios deben confirmar con las autoridades locales cualquier norma municipal o de orden público que afecte a razas específicas."
    pt: "Nenhuma segunda categoria é definida para fins de importação. Os donos devem confirmar junto às autoridades locais quaisquer regras municipais ou de ordem pública sobre raças específicas."
  note:
    en: "Because no breed-import ban is published, confirm the current position with the Food and Veterinary Agency before travel if your dog is a breed restricted elsewhere in Europe."
    fr: "Aucune interdiction d'importation par race n'étant publiée, confirme la position actuelle auprès de l'Agence pour l'alimentation et la médecine vétérinaire avant le voyage si ton chien est d'une race restreinte ailleurs en Europe."
    es: "Como no se publica ninguna prohibición de importación por raza, confirma la situación actual con la Agencia de Alimentos y Veterinaria antes de viajar si tu perro es de una raza restringida en otros lugares de Europa."
    pt: "Como nenhuma proibição de importação por raça é publicada, confirme a posição atual junto à Agência de Alimentos e Veterinária antes de viajar, se o seu cachorro for de uma raça restrita em outros lugares da Europa."

