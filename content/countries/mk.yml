# Country Entry Guide — North Macedonia (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_mk
iso2: "MK"
name: { en: "North Macedonia", fr: "Macédoine du Nord", es: "Macedonia del Norte", pt: "Macedônia do Norte" }
region: { en: "Europe (non-EU)", fr: "Europe (hors UE)", es: "Europa (fuera de la UE)", pt: "Europa (fora da UE)" }


regime: listed
exit:
  authority: FVA
  authorityUrl: https://fva.gov.mk/en/pets
  intro:
    en: "North Macedonia is a listed country, so no rabies titer is needed to return to the EU — the EU health certificate is issued by an official veterinarian of the Food and Veterinary Agency (FVA)."
    fr: "La Macédoine du Nord est un pays listé : pas de titrage pour rentrer dans l'UE — le certificat sanitaire UE est délivré par un vétérinaire officiel de l'Agence pour l'alimentation et la vétérinaire (FVA)."
    es: "Macedonia del Norte es un país listado: no hace falta titulación para volver a la UE — el certificado sanitario UE lo emite un veterinario oficial de la Agencia de Alimentos y Veterinaria (FVA)."
    pt: "A Macedônia do Norte é um país listado: nenhum teste sorológico antirrábico é necessário para voltar à UE — o certificado sanitário da UE é emitido por um veterinário oficial da Agência de Alimentos e Veterinária (FVA)."
  steps:
    - timing: window
      scope: eu
      text:
        en: "Your dog needs a microchip and valid rabies vaccination; an FVA authorised veterinarian completes and endorses the EU-model health certificate before departure."
        fr: "Ton chien doit être pucé et vacciné contre la rage ; un vétérinaire autorisé de la FVA remplit et vise le certificat au modèle UE avant le départ."
        es: "Tu perro necesita microchip y vacuna antirrábica válida; un veterinario autorizado de la FVA rellena y refrenda el certificado en modelo UE antes de salir."
        pt: "Seu cachorro precisa de microchip e vacinação antirrábica válida; um veterinário autorizado pela FVA preenche e endossa o certificado sanitário no modelo da UE antes da partida."
    - timing: window
      scope: non_eu
      text:
        en: "Your dog needs a microchip and a valid rabies vaccination; an FVA authorised veterinarian completes and endorses the health certificate before departure."
        fr: "Ton chien a besoin d'une puce et d'une vaccination antirabique valide ; un vétérinaire habilité par la FVA remplit et vise le certificat sanitaire avant le départ."
        es: "Tu perro necesita microchip y vacunación antirrábica válida; un veterinario autorizado por la FVA completa y valida el certificado sanitario antes de la salida."
        pt: "Seu cachorro precisa de microchip e vacinação antirrábica válida; um veterinário autorizado pela FVA preenche e endossa o certificado sanitário antes da partida."
  onSiteNote:
    en: "The certificate is valid 10 days to reach the EU border check — arrange it close to departure."
    fr: "Le certificat est valable 10 jours pour atteindre le contrôle à la frontière UE — organise-le peu avant le départ."
    es: "El certificado vale 10 días para llegar al control fronterizo de la UE — organízalo cerca de la salida."
    pt: "O certificado vale 10 dias para chegar ao controle de fronteira da UE — providencie-o pouco antes da partida."

hero:
  h1: { en: "Traveling to North Macedonia with your dog", fr: "Voyager en Macédoine du Nord avec ton chien", es: "Viajar a Macedonia del Norte con tu perro", pt: "Viajar para a Macedônia do Norte com seu cachorro" }
  intro:
    en: >-
      North Macedonia welcomes dogs, but what you need to prepare depends mainly on the country your dog
      is travelling from — not only on North Macedonia itself. North Macedonia is not in the European
      Union; it applies its own national rules set by the Food and Veterinary Agency (Agencija za hrana
      i veterinarstvo). A dog must be over 3 months old, permanently identified and travel with either a
      pet passport or a veterinary health certificate, depending on its country of origin. Dogs from
      countries on North Macedonia's low-risk lists need no blood test, while a dog from a country that
      is not listed must also pass a rabies antibody test at least three months before travel. Up to
      five non-commercial pets may accompany a traveller. This guide explains each case so you know
      exactly what to prepare before you book your flight.
    fr: >-
      La Macédoine du Nord accueille les chiens, mais ce qu'il faut préparer dépend surtout du pays d'où
      ton chien voyage — pas seulement de la Macédoine du Nord. Le pays n'est pas membre de l'Union
      européenne ; il applique ses propres règles nationales fixées par l'Agence pour l'alimentation et
      la médecine vétérinaire (Agencija za hrana i veterinarstvo). Le chien doit avoir plus de 3 mois,
      être identifié de façon permanente et voyager avec un passeport pour animaux ou un certificat
      vétérinaire, selon son pays d'origine. Les chiens venant des pays figurant sur les listes à faible
      risque de la Macédoine du Nord n'ont pas besoin de prise de sang, tandis qu'un chien issu d'un pays
      non listé doit aussi réussir un titrage antirabique au moins trois mois avant le voyage. Jusqu'à
      cinq animaux non commerciaux peuvent accompagner un voyageur. Ce guide détaille chaque cas pour
      savoir exactement quoi préparer avant de réserver ton vol.
    es: >-
      Macedonia del Norte acoge a los perros, pero lo que debes preparar depende sobre todo del país
      desde el que viaja tu perro — no solo de Macedonia del Norte. Macedonia del Norte no forma parte de
      la Unión Europea; aplica sus propias normas nacionales fijadas por la Agencia de Alimentos y
      Veterinaria (Agencija za hrana i veterinarstvo). El perro debe tener más de 3 meses, estar
      identificado de forma permanente y viajar con un pasaporte para mascotas o un certificado sanitario
      veterinario, según su país de origen. Los perros procedentes de países incluidos en las listas de
      bajo riesgo de Macedonia del Norte no necesitan análisis de sangre, mientras que un perro de un
      país que no está listado también debe superar una prueba de titulación de rabia al menos tres meses
      antes del viaje. Hasta cinco mascotas no comerciales pueden acompañar a un viajero. Esta guía
      explica cada caso para que sepas exactamente qué preparar antes de reservar tu vuelo.

    pt: "A Macedônia do Norte recebe bem os cachorros, mas o que você precisa preparar depende principalmente do país de onde seu cachorro parte — e não só da Macedônia do Norte em si. A Macedônia do Norte não faz parte da União Europeia; ela aplica suas próprias regras nacionais, definidas pela Agência de Alimentos e Veterinária (Agencija za hrana i veterinarstvo). Um cachorro precisa ter mais de 3 meses, estar identificado de forma permanente e viajar com um passaporte para animais ou um atestado de saúde veterinário, dependendo do seu país de origem. Cachorros vindos de países nas listas de baixo risco da Macedônia do Norte não precisam de exame de sangue, enquanto um cachorro vindo de um país não listado também precisa passar por um teste sorológico antirrábico pelo menos três meses antes da viagem. Até cinco animais não comerciais podem acompanhar um viajante. Este guia explica cada caso para você saber exatamente o que preparar antes de comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Easy to difficult (depends on origin)", fr: "Facile à difficile (selon l'origine)", es: "De fácil a difícil (según el origen)", pt: "De fácil a difícil (depende da origem)" }

prepTime:
  eu:
    en: "A few days if a pet passport and rabies vaccination are already up to date."
    fr: "Quelques jours si le passeport et la vaccination antirabique sont déjà à jour."
    es: "Unos días si el pasaporte para mascotas y la vacunación antirrábica ya están al día."
    pt: "Alguns dias se o passaporte para animais e a vacinação antirrábica já estiverem em dia."
  listed:
    en: "~2 weeks: a veterinary health certificate must be issued within 10 days before travel, plus a valid rabies vaccination."
    fr: "~2 semaines : un certificat vétérinaire doit être établi dans les 10 jours précédant le voyage, plus une vaccination antirabique valide."
    es: "~2 semanas: un certificado sanitario veterinario debe expedirse dentro de los 10 días previos al viaje, más una vacunación antirrábica válida."
    pt: "~2 semanas: um atestado de saúde veterinário precisa ser emitido nos 10 dias antes da viagem, mais uma vacinação antirrábica válida."
  nonListed:
    en: "~3–4 months: a rabies antibody test must be done at least 3 months before travel, on top of the certificate."
    fr: "~3–4 mois : un titrage antirabique doit être réalisé au moins 3 mois avant le voyage, en plus du certificat."
    es: "~3–4 meses: una prueba de titulación de rabia debe realizarse al menos 3 meses antes del viaje, además del certificado."
    pt: "~3–4 meses: um teste sorológico antirrábico precisa ser feito pelo menos 3 meses antes da viagem, além do certificado."

