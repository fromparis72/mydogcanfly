notice:
  - en: "MyDogCanFly provides general information — not veterinary or legal advice."
    fr: "MyDogCanFly fournit une information générale — pas un avis vétérinaire ou juridique."
    es: "MyDogCanFly ofrece información general — no asesoramiento veterinario ni jurídico."
    pt: "O MyDogCanFly fornece informações gerais — não constitui aconselhamento veterinário nem jurídico."
  - en: "Only a veterinarian can confirm the exact procedure for your individual dog, and the Director of Veterinary Services (DINAV) sets the exact conditions on your import licence."
    fr: "Seul un vétérinaire peut confirmer la procédure exacte pour ton chien, et le Directeur des Services vétérinaires (DINAV) fixe les conditions exactes sur ton licence d'importation."
    es: "Solo un veterinario puede confirmar el procedimiento exacto para tu perro, y el Director de los Servicios Veterinarios (DINAV) fija las condiciones exactas en tu licencia de importación."
    pt: "Só um médico veterinário pode confirmar o procedimento exato para cada cachorro, e é o Director dos Serviços de Veterinária (DINAV) que fixa as condições exatas na licença de importação."
  - en: "Requirements depend on: the country of origin, previous travel history, identification, vaccinations, the itinerary and the travel date."
    fr: "Les exigences dépendent : du pays d'origine, de l'historique de voyage, de l'identification, des vaccinations, de l'itinéraire et de la date du voyage."
    es: "Los requisitos dependen de: el país de origen, el historial de viajes previo, la identificación, las vacunas, el itinerario y la fecha del viaje."
    pt: "As exigências dependem de: país de origem, histórico de viagens anteriores, identificação, vacinas, itinerário e data da viagem."
noticeClose:
  en: "Always consult your veterinarian before booking your trip."
  fr: "Consulte toujours ton vétérinaire avant de réserver ton voyage."
  es: "Consulta siempre a tu veterinario antes de reservar tu viaje."
  pt: "Consultar sempre o médico-veterinário antes de reservar a viagem."

factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do cão" }
  intro:
    en: "The exact documents depend on three things — Mozambique (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — le Mozambique (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Mozambique (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três fatores — Moçambique (o destino) é apenas o primeiro."
  items:
    - stars: 5
      label: { en: "Country of destination — Mozambique", fr: "Pays de destination — Mozambique", es: "País de destino — Mozambique", pt: "País de destino — Moçambique" }
      text:
        en: "Mozambique always requires an advance import licence from the Director of Veterinary Services (DINAV), a valid rabies vaccination and an international sanitary certificate from a vet in the country of export. Rules flow from the Animal Health Regulation (Decree 26/2009), and the customs procedure adds advance notification, a border inspection and a quarantine period for live animals."
        fr: "Le Mozambique exige toujours une licence d'importation préalable du Directeur des Services vétérinaires (DINAV), une vaccination antirabique valide et un certificat sanitaire international d'un vétérinaire du pays d'export. Les règles découlent du Règlement de santé animale (Décret 26/2009), et la procédure douanière ajoute une notification préalable, une inspection à la frontière et une quarantaine pour les animaux vivants."
        es: "Mozambique siempre exige una licencia de importación previa del Director de los Servicios Veterinarios (DINAV), una vacunación antirrábica válida y un certificado sanitario internacional de un veterinario del país exportador. Las normas derivan del Reglamento de Sanidad Animal (Decreto 26/2009), y el procedimiento aduanero añade una notificación previa, una inspección en la frontera y un periodo de cuarentena para los animales vivos."
        pt: "Moçambique exige sempre uma licença de importação prévia do Director dos Serviços de Veterinária (DINAV), uma vacinação antirrábica válida e um certificado sanitário internacional emitido por um médico veterinário do país de exportação. As regras decorrem do Regulamento de Sanidade Animal (Decreto 26/2009), e o procedimento aduaneiro acrescenta a notificação prévia, uma inspeção na fronteira e um período de quarentena para animais vivos."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Your departure country feeds Mozambique's risk analysis: DINAV assesses the animal-health situation of the origin (including WOAH/OIE data) before issuing the licence, and your departure country decides who endorses the certificate — an EU official veterinarian, or a USDA-accredited vet with USDA-APHIS endorsement from the United States."
        fr: "Ton pays de départ alimente l'analyse de risque du Mozambique : la DINAV évalue la situation sanitaire de l'origine (dont les données WOAH/OIE) avant de délivrer la licence, et ton pays de départ détermine qui vise le certificat — un vétérinaire officiel de l'UE, ou un vétérinaire agréé USDA avec visa USDA-APHIS depuis les États-Unis."
        es: "Tu país de salida alimenta el análisis de riesgo de Mozambique: la DINAV evalúa la situación sanitaria animal del origen (incluidos los datos de la WOAH/OIE) antes de expedir la licencia, y tu país de salida determina quién refrenda el certificado — un veterinario oficial de la UE, o un veterinario acreditado por el USDA con refrendo del USDA-APHIS desde Estados Unidos."
        pt: "O país de partida alimenta a análise de risco de Moçambique: a DINAV avalia a situação sanitária animal da origem (incluindo os dados da WOAH/OIE) antes de emitir a licença, e é o país de partida que determina quem endossa o certificado — um veterinário oficial da UE ou, a partir dos Estados Unidos, um veterinário acreditado pelo USDA com endosso do USDA-APHIS."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde o cachorro esteve recentemente" }
      text:
        en: "Your dog's real origin and recent movements can affect what the country-of-export vet is able to certify and what the border veterinarian asks for on arrival. Confirm your dog's history with your vet before you finalise the import-licence application."
        fr: "L'origine réelle et les déplacements récents de ton chien peuvent influer sur ce que le vétérinaire du pays d'export peut attester et sur ce que le vétérinaire de la frontière demande à l'arrivée. Confirme l'historique de ton chien avec ton vétérinaire avant de finaliser la demande de licence."
        es: "El origen real y los movimientos recientes de tu perro pueden influir en lo que el veterinario del país exportador puede certificar y en lo que el veterinario de la frontera pide a la llegada. Confirma el historial de tu perro con tu veterinario antes de finalizar la solicitud de la licencia de importación."
        pt: "A origem real do cachorro e as suas viagens recentes podem influenciar aquilo que o veterinário do país de exportação consegue certificar e aquilo que o veterinário de fronteira exige à chegada. Convém confirmar o histórico do cachorro com o médico veterinário antes de finalizar o pedido de licença de importação."
  note:
    en: "So read the requirements below as Mozambique's framework, then confirm your dog's exact origin and history with your vet — the import licence lists the precise conditions."
    fr: "Lis donc les exigences ci-dessous comme le cadre mozambicain, puis confirme l'origine et l'historique exacts avec ton vétérinaire — la licence d'importation liste les conditions précises."
    es: "Así que lee los requisitos siguientes como el marco de Mozambique y luego confirma el origen y el historial exactos de tu perro con tu veterinario — la licencia de importación detalla las condiciones precisas."
    pt: "Assim, as exigências abaixo devem ser lidas como o enquadramento geral de Moçambique; depois, há que confirmar a origem exata e o histórico do cachorro com o médico veterinário — é a licença de importação que enumera as condições precisas."

requirements:
  - item: { en: "Import licence (Licença de Importação)", fr: "Licence d'importation (Licença de Importação)", es: "Licencia de importación (Licença de Importação)", pt: "Licença de Importação" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Applied for in advance to the Director of Veterinary Services (DINAV), filed through the Provincial Livestock Services (SPP). After a risk analysis based on the animal-health situation of the country of origin, the licence is issued; it is then sent to the exporter so the origin-country veterinary authority can inspect and issue the international sanitary certificate. Fees apply per the veterinary services tariff (Diploma Ministerial 9/2007).", fr: "À demander à l'avance au Directeur des Services vétérinaires (DINAV), déposée auprès des Serviços Provinciais de Pecuária (SPP). Après une analyse de risque fondée sur la situation sanitaire du pays d'origine, la licence est délivrée ; elle est ensuite envoyée à l'exportateur pour que l'autorité vétérinaire du pays d'origine inspecte et établisse le certificat sanitaire international. Des frais s'appliquent selon la table des tarifs (Diploma Ministerial 9/2007).", es: "Se solicita por adelantado al Director de los Servicios Veterinarios (DINAV), presentada a través de los Serviços Provinciais de Pecuária (SPP). Tras un análisis de riesgo basado en la situación sanitaria animal del país de origen, se expide la licencia; luego se envía al exportador para que la autoridad veterinaria del país de origen inspeccione y expida el certificado sanitario internacional. Se aplican tasas según la tabla de tarifas de los servicios veterinarios (Diploma Ministerial 9/2007).", pt: "Pedida antecipadamente ao Director dos Serviços de Veterinária (DINAV), com entrada pelos Serviços Provinciais de Pecuária (SPP). Após uma análise de risco baseada na situação sanitária animal do país de origem, a licença é emitida; é depois enviada ao exportador, para que a autoridade veterinária do país de origem possa inspecionar o animal e emitir o certificado sanitário internacional. São devidas taxas segundo o tarifário dos serviços de veterinária (Diploma Ministerial 9/2007)." }
    exceptions: { en: "No exceptions — an animal that arrives without an import licence and international sanitary certificate is not permitted to enter the country.", fr: "Aucune exception — un animal qui arrive sans licence d'importation et certificat sanitaire international n'est pas autorisé à entrer dans le pays.", es: "Sin excepciones — un animal que llega sin licencia de importación y certificado sanitario internacional no puede entrar en el país.", pt: "Sem exceções — um animal que chegue sem licença de importação e sem certificado sanitário internacional não é autorizado a entrar no país." }
    ref: { en: "Animal Health Regulation (Decree 26/2009); Autoridade Tributária (Customs) — Import of animals and meat; Ministry of Agriculture — Guide to animal movement (import licence issued by DINAV)", fr: "Règlement de santé animale (Décret 26/2009) ; Autoridade Tributária (Douanes) — Importation d'animaux et de viandes ; Ministère de l'Agriculture — Guide du mouvement des animaux (licence délivrée par la DINAV)", es: "Reglamento de Sanidad Animal (Decreto 26/2009); Autoridade Tributária (Aduanas) — Importación de animales y carnes; Ministerio de Agricultura — Guía del movimiento de animales (licencia expedida por la DINAV)", pt: "Regulamento de Sanidade Animal (Decreto 26/2009); Autoridade Tributária (Alfândegas) — Importação de animais e carnes; Ministério da Agricultura — Guia de movimentação de animais (licença de importação emitida pela DINAV)" }
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Recommended", fr: "Recommandée", es: "Recomendado", pt: "Recomendado" }
    when: { en: "An ISO 11784/11785 15-digit microchip is advised for identification, ideally implanted before the rabies vaccination so the records match. The official Mozambique dog/cat certificate identifies the animal by 'microchip number or name of animal', so a microchip is accepted but not the only means of identification.", fr: "Une puce ISO 11784/11785 à 15 chiffres est conseillée pour l'identification, idéalement posée avant la vaccination antirabique pour que les documents concordent. Le certificat officiel chien/chat du Mozambique identifie l'animal par « numéro de puce ou nom de l'animal » ; la puce est donc acceptée mais n'est pas l'unique moyen d'identification.", es: "Se aconseja un microchip ISO 11784/11785 de 15 dígitos para la identificación, idealmente implantado antes de la vacunación antirrábica para que los registros coincidan. El certificado oficial de perro/gato de Mozambique identifica al animal por «número de microchip o nombre del animal», por lo que el microchip se acepta pero no es el único medio de identificación.", pt: "Recomenda-se um microchip ISO 11784/11785 de 15 dígitos para identificação, de preferência implantado antes da vacinação antirrábica, para que os documentos coincidam. O certificado oficial moçambicano para cães e gatos identifica o animal pelo “número de microchip ou nome do animal”, pelo que o microchip é admitido, mas não é o único meio de identificação." }
    exceptions: { en: "Mozambique's published conditions do not list the microchip as a mandatory entry condition, but it is strongly recommended.", fr: "Les conditions publiées du Mozambique ne listent pas la puce comme condition d'entrée obligatoire, mais elle est fortement recommandée.", es: "Las condiciones publicadas de Mozambique no incluyen el microchip como condición de entrada obligatoria, pero es muy recomendable.", pt: "As condições publicadas por Moçambique não indicam o microchip como condição obrigatória de entrada, mas é fortemente recomendado." }
    ref: { en: "USDA APHIS — Official Mozambique dog/cat health certificate (identification: microchip number or name)", fr: "USDA APHIS — Certificat sanitaire officiel chien/chat du Mozambique (identification : numéro de puce ou nom)", es: "USDA APHIS — Certificado sanitario oficial de perro/gato de Mozambique (identificación: número de microchip o nombre)", pt: "USDA APHIS — Atestado de saúde oficial de Moçambique para cães e gatos (identificação: número de microchip ou nome)" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "The dog must be vaccinated against rabies with an approved anti-rabies vaccine within 12 months prior to export; OR be less than three (3) months of age and accompanied by the mother's rabies vaccination certificate. Mozambique is a rabies-endemic country.", fr: "Le chien doit être vacciné contre la rage avec un vaccin antirabique approuvé dans les 12 mois avant l'export ; OU avoir moins de trois (3) mois et être accompagné du certificat de vaccination antirabique de la mère. Le Mozambique est un pays d'enzootie rabique.", es: "El perro debe estar vacunado contra la rabia con una vacuna antirrábica aprobada dentro de los 12 meses previos a la exportación; O bien tener menos de tres (3) meses de edad y ir acompañado del certificado de vacunación antirrábica de la madre. Mozambique es un país con rabia endémica.", pt: "O cachorro deve estar vacinado contra a raiva com uma vacina antirrábica aprovada nos 12 meses anteriores à exportação; OU ter menos de três (3) meses de idade e ser acompanhado do certificado de vacinação antirrábica da mãe. Moçambique é um país onde a raiva é endémica." }
    exceptions: { en: "The under-3-months allowance (with the mother's vaccination certificate) is stated on the official dog/cat certificate. Confirm any minimum interval with the Director of Veterinary Services.", fr: "La tolérance pour les moins de 3 mois (avec le certificat de vaccination de la mère) figure sur le certificat officiel chien/chat. Confirme tout délai minimum auprès du Directeur des Services vétérinaires.", es: "La tolerancia para los menores de 3 meses (con el certificado de vacunación de la madre) figura en el certificado oficial de perro/gato. Confirma cualquier intervalo mínimo con el Director de los Servicios Veterinarios.", pt: "A tolerância para animais com menos de 3 meses (mediante o certificado de vacinação da mãe) consta do certificado oficial para cães e gatos. Qualquer intervalo mínimo deve ser confirmado junto do Director dos Serviços de Veterinária." }
    ref: { en: "USDA APHIS — Official Mozambique dog/cat health certificate (rabies within 12 months; <3 months exception)", fr: "USDA APHIS — Certificat sanitaire officiel chien/chat du Mozambique (rage sous 12 mois ; exception <3 mois)", es: "USDA APHIS — Certificado sanitario oficial de perro/gato de Mozambique (rabia dentro de 12 meses; excepción <3 meses)", pt: "USDA APHIS — Atestado de saúde oficial de Moçambique para cães e gatos (raiva nos 12 meses anteriores; exceção para menos de 3 meses)" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Not listed in published conditions", fr: "Non mentionné dans les conditions publiées", es: "No figura en las condiciones publicadas", pt: "Não consta das condições publicadas" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Mozambique's published import conditions and the official dog/cat certificate do not list a rabies antibody test to enter. Because the requirement is not published, confirm directly with the Director of Veterinary Services for your specific origin.", fr: "Les conditions d'importation publiées du Mozambique et le certificat officiel chien/chat ne mentionnent pas de titrage antirabique pour entrer. Cette exigence n'étant pas publiée, vérifie directement auprès du Directeur des Services vétérinaires pour ton origine précise.", es: "Las condiciones de importación publicadas de Mozambique y el certificado oficial de perro/gato no incluyen una prueba de titulación de rabia para entrar. Como el requisito no está publicado, confírmalo directamente con el Director de los Servicios Veterinarios para tu origen concreto.", pt: "As condições de importação publicadas por Moçambique e o certificado oficial para cães e gatos não preveem qualquer teste sorológico antirrábico para a entrada. Como a exigência não está publicada, cada origem concreta deve ser confirmada diretamente junto do Director dos Serviços de Veterinária." }
    ref: { en: "USDA APHIS Mozambique dog/cat certificate; Mozambique import procedure (no antibody test listed)", fr: "Certificat chien/chat USDA APHIS pour le Mozambique ; procédure d'importation du Mozambique (aucun titrage listé)", es: "Certificado de perro/gato USDA APHIS para Mozambique; procedimiento de importación de Mozambique (ninguna prueba de titulación listada)", pt: "Certificado do USDA APHIS de Moçambique para cães e gatos; procedimento de importação de Moçambique (nenhum teste sorológico indicado)" }
  - item: { en: "International sanitary certificate", fr: "Certificat sanitaire international", es: "Certificado sanitario internacional", pt: "Certificado sanitário internacional" }
    required: { en: "Required", fr: "Requis", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "An international sanitary certificate issued by the veterinary authority of the country of export must accompany the animal at entry. It certifies the animal is healthy and free from clinical signs of rabies and infectious or contagious diseases (including external parasites), and that no rabies has been reported at the premises of origin for at least 12 months. From the United States it is issued by a USDA-accredited vet and endorsed by USDA-APHIS on Mozambique's official dog/cat certificate; it is valid for 30 days after issuance.", fr: "Un certificat sanitaire international délivré par l'autorité vétérinaire du pays d'export doit accompagner l'animal à l'entrée. Il atteste que l'animal est en bonne santé et exempt de signes cliniques de rage et de maladies infectieuses ou contagieuses (dont les parasites externes), et qu'aucun cas de rage n'a été signalé sur le lieu d'origine depuis au moins 12 mois. Depuis les États-Unis, il est établi par un vétérinaire agréé USDA et visé par l'USDA-APHIS sur le certificat officiel chien/chat du Mozambique ; il est valable 30 jours après émission.", es: "Un certificado sanitario internacional expedido por la autoridad veterinaria del país exportador debe acompañar al animal en la entrada. Certifica que el animal está sano y libre de signos clínicos de rabia y de enfermedades infecciosas o contagiosas (incluidos los parásitos externos), y que no se ha notificado ningún caso de rabia en el lugar de origen durante al menos 12 meses. Desde Estados Unidos lo expide un veterinario acreditado por el USDA y lo refrenda el USDA-APHIS en el certificado oficial de perro/gato de Mozambique; es válido durante 30 días tras su expedición.", pt: "Um certificado sanitário internacional emitido pela autoridade veterinária do país de exportação deve acompanhar o animal na entrada. Atesta que o animal está saudável e livre de sinais clínicos de raiva e de doenças infecciosas ou contagiosas (incluindo parasitas externos) e que não foi notificado qualquer caso de raiva no estabelecimento de origem há pelo menos 12 meses. A partir dos Estados Unidos, é emitido por um veterinário acreditado pelo USDA e endossado pelo USDA-APHIS no certificado oficial de Moçambique para cães e gatos; é válido durante 30 dias após a emissão." }
    exceptions: { en: "Use the certificate format required by your national veterinary authority / the Mozambican import licence; the entry is not permitted without this certificate.", fr: "Utilise le format de certificat exigé par ton autorité vétérinaire nationale / la licence d'importation mozambicaine ; l'entrée n'est pas autorisée sans ce certificat.", es: "Utiliza el formato de certificado exigido por tu autoridad veterinaria nacional / la licencia de importación mozambiqueña; la entrada no se permite sin este certificado.", pt: "Deve usar-se o modelo de certificado exigido pela autoridade veterinária nacional / pela licença de importação moçambicana; sem este certificado, a entrada não é autorizada." }
    ref: { en: "USDA APHIS Mozambique dog/cat certificate; Ministry of Agriculture — Guide to animal movement (international sanitary certificate)", fr: "Certificat chien/chat USDA APHIS pour le Mozambique ; Ministère de l'Agriculture — Guide du mouvement des animaux (certificat sanitaire international)", es: "Certificado de perro/gato USDA APHIS para Mozambique; Ministerio de Agricultura — Guía del movimiento de animales (certificado sanitario internacional)", pt: "Certificado do USDA APHIS de Moçambique para cães e gatos; Ministério da Agricultura — Guia de movimentação de animais (certificado sanitário internacional)" }
  - item: { en: "Parasite treatment", fr: "Traitement antiparasitaire", es: "Tratamiento antiparasitario", pt: "Tratamento antiparasitário" }
    required: { en: "Partly certified / recommended", fr: "En partie attesté / recommandé", es: "En parte certificado / recomendado", pt: "Parcialmente certificado / recomendado" }
    when: { en: "The official dog/cat certificate requires the animal to be free from external parasites at examination and its vaccination status and routine treatments to be up to date. A specific internal/external parasite treatment protocol for pets is not published as a separate mandatory step; deworming and up-to-date treatments are recommended good practice.", fr: "Le certificat officiel chien/chat exige que l'animal soit exempt de parasites externes à l'examen et que son statut vaccinal et ses traitements de routine soient à jour. Un protocole spécifique de traitement antiparasitaire interne/externe pour les animaux de compagnie n'est pas publié comme étape obligatoire distincte ; la vermifugation et les traitements à jour sont une bonne pratique recommandée.", es: "El certificado oficial de perro/gato exige que el animal esté libre de parásitos externos en el examen y que su estado de vacunación y sus tratamientos rutinarios estén al día. No se publica un protocolo específico de tratamiento antiparasitario interno/externo para mascotas como paso obligatorio aparte; la desparasitación y los tratamientos al día son una buena práctica recomendada.", pt: "O certificado oficial para cães e gatos exige que o animal esteja livre de parasitas externos no momento do exame e que as vacinas e os tratamentos de rotina estejam em dia. Não está publicado, como etapa obrigatória separada, qualquer protocolo específico de tratamento contra parasitas internos/externos para animais de companhia; a desparasitação e os tratamentos em dia são boas práticas recomendadas." }
    exceptions: { en: "Confirm any compulsory parasite treatment on your import licence and with your vet before travel.", fr: "Confirme tout traitement antiparasitaire obligatoire sur ton licence d'importation et avec ton vétérinaire avant le voyage.", es: "Confirma cualquier tratamiento antiparasitario obligatorio en tu licencia de importación y con tu veterinario antes del viaje.", pt: "Qualquer tratamento antiparasitário obrigatório deve ser confirmado na licença de importação e junto do médico veterinário antes da viagem." }
    ref: { en: "USDA APHIS Mozambique dog/cat certificate (free from external parasites; treatments up to date)", fr: "Certificat chien/chat USDA APHIS pour le Mozambique (exempt de parasites externes ; traitements à jour)", es: "Certificado de perro/gato USDA APHIS para Mozambique (libre de parásitos externos; tratamientos al día)", pt: "Certificado do USDA APHIS de Moçambique para cães e gatos (livre de parasitas externos; tratamentos em dia)" }
  - item: { en: "Advance notification & border veterinary inspection", fr: "Notification préalable et inspection vétérinaire à la frontière", es: "Notificación previa e inspección veterinaria en la frontera", pt: "Notificação prévia e inspeção veterinária na fronteira" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Notify the veterinary inspector of the animal's arrival at least 14 days in advance so an inspection can take place before customs clearance. Live animals are examined by the veterinary inspector at entry; if the inspection is satisfactory, entry is authorised via a sanitary certificate issued by the inspector.", fr: "Notifie l'inspecteur vétérinaire de l'arrivée de l'animal au moins 14 jours à l'avance afin qu'une inspection ait lieu avant le dédouanement. Les animaux vivants sont examinés par l'inspecteur vétérinaire à l'entrée ; si l'inspection est satisfaisante, l'entrée est autorisée par un certificat sanitaire délivré par l'inspecteur.", es: "Notifica al inspector veterinario la llegada del animal con al menos 14 días de antelación para que la inspección pueda realizarse antes del despacho de aduanas. Los animales vivos son examinados por el inspector veterinario a la entrada; si la inspección es satisfactoria, la entrada se autoriza mediante un certificado sanitario expedido por el inspector.", pt: "A chegada do animal deve ser comunicada ao inspetor veterinário com pelo menos 14 dias de antecedência, para que a inspeção possa ocorrer antes do desembaraço aduaneiro. Os animais vivos são examinados pelo inspetor veterinário na entrada; se a inspeção for satisfatória, a entrada é autorizada mediante um certificado sanitário emitido pelo inspetor." }
    exceptions: { en: "If results are not satisfactory, the inspector may order treatment, retention, quarantine, return to the country of origin or destruction.", fr: "Si les résultats ne sont pas satisfaisants, l'inspecteur peut ordonner un traitement, une rétention, une quarantaine, un renvoi vers le pays d'origine ou la destruction.", es: "Si los resultados no son satisfactorios, el inspector puede ordenar un tratamiento, una retención, una cuarentena, la devolución al país de origen o la destrucción.", pt: "Se o resultado não for satisfatório, o inspetor pode determinar tratamento, retenção, quarentena, devolução ao país de origem ou abate." }
    ref: { en: "Autoridade Tributária (Customs) — Import of animals and meat (14-day notice; veterinary inspection)", fr: "Autoridade Tributária (Douanes) — Importation d'animaux et de viandes (préavis de 14 jours ; inspection vétérinaire)", es: "Autoridade Tributária (Aduanas) — Importación de animales y carnes (preaviso de 14 días; inspección veterinaria)", pt: "Autoridade Tributária (Alfândegas) — Importação de animais e carnes (aviso de 14 dias; inspeção veterinária)" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Provided for live animals", fr: "Prévue pour les animaux vivants", es: "Prevista para los animales vivos", pt: "Prevista para animais vivos" }
    when: { en: "The published customs procedure states that live animals are subject to an isolation regime of 40 days (quarantine), in permanent or temporary facilities, under the Animal Health Regulation (Decree 26/2009). Whether and how this is applied to a compliant pet dog in practice is not separately published for pets.", fr: "La procédure douanière publiée indique que les animaux vivants sont soumis à un régime d'isolement de 40 jours (quarantaine), dans des installations permanentes ou temporaires, au titre du Règlement de santé animale (Décret 26/2009). L'application concrète à un chien de compagnie conforme n'est pas publiée séparément pour les animaux de compagnie.", es: "El procedimiento aduanero publicado indica que los animales vivos están sujetos a un régimen de aislamiento de 40 días (cuarentena), en instalaciones permanentes o temporales, en virtud del Reglamento de Sanidad Animal (Decreto 26/2009). Si esto se aplica y cómo a un perro de compañía conforme en la práctica no se publica por separado para las mascotas.", pt: "O procedimento aduaneiro publicado indica que os animais vivos ficam sujeitos a um regime de isolamento de 40 dias (quarentena), em instalações permanentes ou temporárias, nos termos do Regulamento de Sanidade Animal (Decreto 26/2009). Não está publicado, de forma específica para animais de companhia, se e como esta regra é aplicada na prática a um cachorro em situação regular." }
    exceptions: { en: "The exact application to pets is not published — confirm the quarantine terms on your import licence and with the Director of Veterinary Services before you travel.", fr: "L'application exacte aux animaux de compagnie n'est pas publiée — confirme les modalités de quarantaine sur ton licence d'importation et auprès du Directeur des Services vétérinaires avant de voyager.", es: "La aplicación exacta a las mascotas no está publicada — confirma las condiciones de cuarentena en tu licencia de importación y con el Director de los Servicios Veterinarios antes de viajar.", pt: "A aplicação exata a animais de companhia não está publicada — as condições de quarentena devem ser confirmadas na licença de importação e junto do Director dos Serviços de Veterinária antes da viagem." }
    ref: { en: "Autoridade Tributária (Customs) — Import of animals and meat (40-day isolation); Decree 26/2009", fr: "Autoridade Tributária (Douanes) — Importation d'animaux et de viandes (isolement de 40 jours) ; Décret 26/2009", es: "Autoridade Tributária (Aduanas) — Importación de animales y carnes (aislamiento de 40 días); Decreto 26/2009", pt: "Autoridade Tributária (Alfândegas) — Importação de animais e carnes (isolamento de 40 dias); Decreto 26/2009" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "Not explicitly published", fr: "Non explicitement publié", es: "No publicado explícitamente", pt: "Não publicado expressamente" }
    when: { en: "No specific minimum travelling age is published. The official dog/cat certificate expressly handles animals under three months by allowing entry with the mother's rabies vaccination certificate; otherwise the animal must carry its own rabies vaccination within 12 months.", fr: "Aucun âge minimum de voyage précis n'est publié. Le certificat officiel chien/chat traite explicitement les animaux de moins de trois mois en autorisant l'entrée avec le certificat de vaccination antirabique de la mère ; sinon l'animal doit porter sa propre vaccination antirabique dans les 12 mois.", es: "No se publica una edad mínima de viaje específica. El certificado oficial de perro/gato aborda expresamente a los animales menores de tres meses permitiendo la entrada con el certificado de vacunación antirrábica de la madre; de lo contrario, el animal debe llevar su propia vacunación antirrábica dentro de los 12 meses.", pt: "Não está publicada qualquer idade mínima específica para viajar. O certificado oficial para cães e gatos trata expressamente dos animais com menos de três meses, permitindo a entrada mediante o certificado de vacinação antirrábica da mãe; caso contrário, o animal deve ter a sua própria vacinação antirrábica, administrada nos 12 meses anteriores." }
    exceptions: { en: "Confirm the minimum age for your dog with the Director of Veterinary Services and your vet.", fr: "Confirme l'âge minimum pour ton chien auprès du Directeur des Services vétérinaires et de ton vétérinaire.", es: "Confirma la edad mínima para tu perro con el Director de los Servicios Veterinarios y con tu veterinario.", pt: "A idade mínima aplicável ao cachorro deve ser confirmada junto do Director dos Serviços de Veterinária e do médico veterinário." }
    ref: { en: "USDA APHIS Mozambique dog/cat certificate (<3 months with mother's rabies certificate)", fr: "Certificat chien/chat USDA APHIS pour le Mozambique (<3 mois avec le certificat de rage de la mère)", es: "Certificado de perro/gato USDA APHIS para Mozambique (<3 meses con el certificado de rabia de la madre)", pt: "Certificado do USDA APHIS de Moçambique para cães e gatos (menos de 3 meses com o certificado antirrábico da mãe)" }
  - item: { en: "Restricted breeds", fr: "Races restreintes", es: "Razas restringidas", pt: "Raças restritas" }
    required: { en: "No national import ban found", fr: "Aucune interdiction nationale trouvée", es: "No se encontró prohibición nacional de importación", pt: "Nenhuma proibição nacional de importação encontrada" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "We found no official Mozambican breed-specific import ban; entry is controlled by the import licence, the sanitary certificate and the veterinary inspection, not by breed. Because national rules are not always published in full, treat this as 'none found' rather than a guarantee.", fr: "Nous n'avons trouvé aucune interdiction d'importation officielle par race au Mozambique ; l'entrée est encadrée par la licence d'importation, le certificat sanitaire et l'inspection vétérinaire, non par la race. Les règles nationales n'étant pas toujours publiées en intégralité, considère cela comme « rien de trouvé » plutôt qu'une garantie.", es: "No encontramos ninguna prohibición de importación oficial por raza en Mozambique; la entrada está controlada por la licencia de importación, el certificado sanitario y la inspección veterinaria, no por la raza. Como las normas nacionales no siempre se publican en su totalidad, considera esto como «nada encontrado» y no como una garantía.", pt: "Não foi encontrada qualquer proibição oficial moçambicana de importação por raça; a entrada é controlada pela licença de importação, pelo certificado sanitário e pela inspeção veterinária, e não pela raça. Como as regras nacionais nem sempre são publicadas na íntegra, isto deve ser entendido como “nada encontrado” e não como uma garantia." }
    ref: { en: "Mozambique import conditions (no breed-specific legislation cited)", fr: "Conditions d'importation du Mozambique (aucune législation par race citée)", es: "Condiciones de importación de Mozambique (no se cita legislación por raza)", pt: "Condições de importação de Moçambique (nenhuma legislação por raça citada)" }

origin:
  scheme: eu
  eu:
    title: { en: "From Europe / the EU", fr: "Depuis l'Europe / l'UE", es: "Desde Europa / la UE", pt: "Da Europa / da UE" }
    body:
      en: "There is no EU pet-passport shortcut into Mozambique: the EU passport is not a Mozambican document. A dog from Europe needs the import licence from the Director of Veterinary Services (DINAV), a valid rabies vaccination (given within 12 months before export) and an international sanitary certificate signed by the official veterinary authority of the country of export. Notify the border veterinary inspector at least 14 days ahead, and plan for the veterinary inspection and the quarantine period provided for live animals. No rabies antibody test is listed in the published conditions."
      fr: "Aucun raccourci « passeport européen » pour entrer au Mozambique : le passeport UE n'est pas un document mozambicain. Un chien venant d'Europe a besoin de la licence d'importation du Directeur des Services vétérinaires (DINAV), d'une vaccination antirabique valide (faite dans les 12 mois avant l'export) et d'un certificat sanitaire international signé par l'autorité vétérinaire officielle du pays d'export. Notifie l'inspecteur vétérinaire de la frontière au moins 14 jours à l'avance, et anticipe l'inspection vétérinaire et la quarantaine prévue pour les animaux vivants. Aucun titrage antirabique n'est mentionné dans les conditions publiées."
      es: "No hay atajo de «pasaporte europeo para mascotas» para entrar en Mozambique: el pasaporte de la UE no es un documento mozambiqueño. Un perro procedente de Europa necesita la licencia de importación del Director de los Servicios Veterinarios (DINAV), una vacunación antirrábica válida (realizada dentro de los 12 meses previos a la exportación) y un certificado sanitario internacional firmado por la autoridad veterinaria oficial del país exportador. Notifica al inspector veterinario de la frontera con al menos 14 días de antelación, y prevé la inspección veterinaria y el periodo de cuarentena establecido para los animales vivos. En las condiciones publicadas no figura ninguna prueba de titulación de rabia."
      pt: "Não há atalho pelo passaporte europeu para animais de companhia na entrada em Moçambique: o passaporte da UE não é um documento moçambicano. Um cachorro proveniente da Europa precisa da licença de importação do Director dos Serviços de Veterinária (DINAV), de uma vacinação antirrábica válida (administrada nos 12 meses anteriores à exportação) e de um certificado sanitário internacional assinado pela autoridade veterinária oficial do país de exportação. O inspetor veterinário de fronteira deve ser notificado com pelo menos 14 dias de antecedência, e há que contar com a inspeção veterinária e com o período de quarentena previsto para animais vivos. As condições publicadas não indicam qualquer teste sorológico antirrábico."
    cls: warn
  listed:
    title: { en: "From other non-EU countries", fr: "Depuis d'autres pays hors UE", es: "Desde otros países fuera de la UE", pt: "De outros países fora da UE" }
    body:
      en: "Mozambique does not operate an EU-style list of approved countries for pet entry; instead it runs a risk analysis on each origin before issuing the import licence. From any non-EU origin the same core requirements apply: import licence, rabies vaccination and international sanitary certificate. From the United States, for example, the certificate must be issued by a USDA-accredited veterinarian and endorsed by USDA-APHIS on Mozambique's official dog/cat form, valid for 30 days."
      fr: "Le Mozambique n'applique pas de liste de pays approuvés à l'européenne pour l'entrée des animaux ; il réalise plutôt une analyse de risque sur chaque origine avant de délivrer la licence d'importation. Depuis toute origine hors UE, les mêmes exigences de base s'appliquent : licence d'importation, vaccination antirabique et certificat sanitaire international. Depuis les États-Unis, par exemple, le certificat doit être établi par un vétérinaire agréé USDA et visé par l'USDA-APHIS sur le formulaire officiel chien/chat du Mozambique, valable 30 jours."
      es: "Mozambique no aplica una lista de países aprobados al estilo de la UE para la entrada de mascotas; en su lugar realiza un análisis de riesgo de cada origen antes de expedir la licencia de importación. Desde cualquier origen fuera de la UE se aplican los mismos requisitos básicos: licencia de importación, vacunación antirrábica y certificado sanitario internacional. Desde Estados Unidos, por ejemplo, el certificado debe expedirlo un veterinario acreditado por el USDA y refrendarlo el USDA-APHIS en el formulario oficial de perro/gato de Mozambique, válido durante 30 días."
      pt: "Moçambique não mantém uma lista de países aprovados à maneira da UE para a entrada de animais de companhia; em vez disso, faz uma análise de risco de cada origem antes de emitir a licença de importação. A partir de qualquer origem fora da UE aplicam-se as mesmas exigências essenciais: licença de importação, vacinação antirrábica e certificado sanitário internacional. A partir dos Estados Unidos, por exemplo, o certificado deve ser emitido por um médico veterinário acreditado pelo USDA e endossado pelo USDA-APHIS no formulário oficial de Moçambique para cães e gatos, com validade de 30 dias."
    cls: warn
  nonListed:
    title: { en: "From all other origins", fr: "Depuis toute autre origine", es: "Desde cualquier otro origen", pt: "De todas as outras origens" }
    body:
      en: "Whatever the origin, Mozambique's framework is the same: apply in advance for the import licence, carry a valid rabies vaccination and an international sanitary certificate, notify the veterinary inspector at least 14 days before arrival, and present everything at the border. Live animals are inspected and are subject to an isolation regime of 40 days under Decree 26/2009. Arriving without a licence or the required certificate risks refusal, quarantine, return to the country of origin or, in the worst case, destruction."
      fr: "Quelle que soit l'origine, le cadre mozambicain est le même : demande la licence d'importation à l'avance, munis-toi d'une vaccination antirabique valide et d'un certificat sanitaire international, notifie l'inspecteur vétérinaire au moins 14 jours avant l'arrivée, et présente l'ensemble à la frontière. Les animaux vivants sont inspectés et soumis à un régime d'isolement de 40 jours au titre du Décret 26/2009. Arriver sans licence ou sans le certificat requis expose à un refus, une quarantaine, un renvoi vers le pays d'origine ou, au pire, une destruction."
      es: "Sea cual sea el origen, el marco de Mozambique es el mismo: solicita por adelantado la licencia de importación, lleva una vacunación antirrábica válida y un certificado sanitario internacional, notifica al inspector veterinario con al menos 14 días de antelación a la llegada, y presenta todo en la frontera. Los animales vivos son inspeccionados y están sujetos a un régimen de aislamiento de 40 días en virtud del Decreto 26/2009. Llegar sin licencia o sin el certificado exigido conlleva el riesgo de rechazo, cuarentena, devolución al país de origen o, en el peor de los casos, destrucción."
      pt: "Seja qual for a origem, o enquadramento moçambicano é o mesmo: pedir antecipadamente a licença de importação, levar uma vacinação antirrábica válida e um certificado sanitário internacional, notificar o inspetor veterinário com pelo menos 14 dias de antecedência e apresentar tudo na fronteira. Os animais vivos são inspecionados e ficam sujeitos a um regime de isolamento de 40 dias, nos termos do Decreto 26/2009. Chegar sem licença ou sem o certificado exigido implica o risco de recusa, de quarentena, de devolução ao país de origem ou, na pior das hipóteses, de abate."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Mozambique depends on your import licence, the certificates you carry and the veterinary inspection."
    fr: "Ce qui se passe à l'arrivée au Mozambique dépend de ton licence d'importation, des certificats que tu porte et de l'inspection vétérinaire."
    es: "Lo que ocurre cuando tu perro llega a Mozambique depende de tu licencia de importación, de los certificados que lleves y de la inspección veterinaria."
    pt: "O que acontece quando o cachorro chega a Moçambique depende da licença de importação, dos certificados que o acompanham e da inspeção veterinária."
  points:
    - en: "Notify the veterinary inspector of the animal's arrival at least 14 days in advance so the inspection can take place before customs clearance."
      fr: "Notifie l'inspecteur vétérinaire de l'arrivée de l'animal au moins 14 jours à l'avance afin que l'inspection ait lieu avant le dédouanement."
      es: "Notifica al inspector veterinario la llegada del animal con al menos 14 días de antelación para que la inspección pueda realizarse antes del despacho de aduanas."
      pt: "Comunicar a chegada do animal ao inspetor veterinário com pelo menos 14 dias de antecedência, para que a inspeção ocorra antes do desembaraço aduaneiro."
    - en: "Present the original import licence and the international sanitary certificate; the animal is examined by the veterinary inspector at the point of entry."
      fr: "Présente la licence d'importation originale et le certificat sanitaire international ; l'animal est examiné par l'inspecteur vétérinaire au point d'entrée."
      es: "Presenta la licencia de importación original y el certificado sanitario internacional; el animal es examinado por el inspector veterinario en el punto de entrada."
      pt: "Apresentar o original da licença de importação e do certificado sanitário internacional; o animal é examinado pelo inspetor veterinário no ponto de entrada."
    - en: "Live animals are subject to an isolation regime (quarantine) of 40 days under Decree 26/2009; the exact application to a compliant pet is not separately published, so confirm the terms on your licence."
      fr: "Les animaux vivants sont soumis à un régime d'isolement (quarantaine) de 40 jours au titre du Décret 26/2009 ; l'application exacte à un animal de compagnie conforme n'est pas publiée séparément, confirme donc les modalités sur ton licence."
      es: "Los animales vivos están sujetos a un régimen de aislamiento (cuarentena) de 40 días en virtud del Decreto 26/2009; la aplicación exacta a una mascota conforme no se publica por separado, así que confirma las condiciones en tu licencia."
      pt: "Os animais vivos ficam sujeitos a um regime de isolamento (quarentena) de 40 dias, nos termos do Decreto 26/2009; a aplicação exata a um animal de companhia em situação regular não está publicada de forma específica, pelo que as condições devem ser confirmadas na licença."
    - en: "If the inspection is satisfactory, entry is authorised through a sanitary certificate issued by the inspector; if not, the inspector may order treatment, retention, quarantine, return to the origin or destruction."
      fr: "Si l'inspection est satisfaisante, l'entrée est autorisée par un certificat sanitaire délivré par l'inspecteur ; sinon, l'inspecteur peut ordonner un traitement, une rétention, une quarantaine, un renvoi vers l'origine ou une destruction."
      es: "Si la inspección es satisfactoria, la entrada se autoriza mediante un certificado sanitario expedido por el inspector; si no, el inspector puede ordenar un tratamiento, una retención, una cuarentena, la devolución al origen o la destrucción."
      pt: "Se a inspeção for satisfatória, a entrada é autorizada mediante um certificado sanitário emitido pelo inspetor; caso contrário, o inspetor pode determinar tratamento, retenção, quarentena, devolução à origem ou abate."
    - en: "Carry original documents (not copies) and keep a set with you throughout the journey; all veterinary-service costs are borne by the importer per the official tariff."
      fr: "Munis-toi des documents originaux (pas de copies) et garde-en un jeu sur toi durant tout le trajet ; tous les frais de services vétérinaires sont à la charge de l'importateur selon la table des tarifs officielle."
      es: "Lleva los documentos originales (no copias) y guarda un juego contigo durante todo el trayecto; todos los costes de los servicios veterinarios corren a cargo del importador según la tabla de tarifas oficial."
      pt: "Levar os documentos originais (não cópias) e manter sempre um conjunto à mão durante todo o trajeto; todos os custos dos serviços de veterinária são suportados pelo importador, segundo o tarifário oficial."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Mozambique's published import conditions control entry through the import licence, the international sanitary certificate and the border veterinary inspection, not through breed. We found no national breed-specific import ban in the official conditions."
    fr: "Les conditions d'importation publiées du Mozambique encadrent l'entrée par la licence d'importation, le certificat sanitaire international et l'inspection vétérinaire à la frontière, non par la race. Nous n'avons trouvé aucune interdiction d'importation nationale par race dans les conditions officielles."
    es: "Las condiciones de importación publicadas de Mozambique controlan la entrada a través de la licencia de importación, el certificado sanitario internacional y la inspección veterinaria en la frontera, no por la raza. No encontramos ninguna prohibición nacional de importación por raza en las condiciones oficiales."
    pt: "As condições de importação publicadas por Moçambique controlam a entrada através da licença de importação, do certificado sanitário internacional e da inspeção veterinária na fronteira, e não através da raça. Não foi encontrada, nas condições oficiais, qualquer proibição nacional de importação por raça."
  cat1:
    en: "No prohibited-breed list: the official Mozambican import framework does not name banned breeds. A compliant dog of any breed can be imported once the import licence, rabies vaccination and international sanitary certificate are in order and the inspection is passed."
    fr: "Pas de liste de races interdites : le cadre d'importation officiel du Mozambique ne nomme aucune race prohibée. Un chien conforme, quelle que soit sa race, peut être importé dès lors que la licence d'importation, la vaccination antirabique et le certificat sanitaire international sont en règle et l'inspection réussie."
    es: "Sin lista de razas prohibidas: el marco de importación oficial de Mozambique no nombra ninguna raza prohibida. Un perro conforme de cualquier raza puede importarse una vez que la licencia de importación, la vacunación antirrábica y el certificado sanitario internacional están en regla y se supera la inspección."
    pt: "Não existe lista de raças proibidas: o enquadramento oficial moçambicano de importação não designa raças banidas. Um cachorro de qualquer raça pode ser importado desde que a licença de importação, a vacinação antirrábica e o certificado sanitário internacional estejam em ordem e a inspeção seja aprovada."
  cat2:
    en: "We found no official Mozambican breed-specific ownership or import legislation to report. Because national rules are not always published in full, treat this as 'none found' rather than a guarantee, and verify with the Director of Veterinary Services if you own a breed sometimes restricted elsewhere."
    fr: "Nous n'avons trouvé aucune législation mozambicaine officielle par race, à la détention ou à l'importation, à signaler. Les règles nationales n'étant pas toujours publiées en intégralité, considère cela comme « rien de trouvé » plutôt qu'une garantie, et vérifie auprès du Directeur des Services vétérinaires si tu détiens une race parfois restreinte ailleurs."
    es: "No encontramos ninguna legislación mozambiqueña oficial por raza, ni de tenencia ni de importación, que señalar. Como las normas nacionales no siempre se publican en su totalidad, considera esto como «nada encontrado» y no como una garantía, y verifica con el Director de los Servicios Veterinarios si tienes una raza a veces restringida en otros lugares."
    pt: "Não foi encontrada qualquer legislação oficial moçambicana por raça, seja de posse, seja de importação. Como as regras nacionais nem sempre são publicadas na íntegra, isto deve ser entendido como “nada encontrado” e não como uma garantia; quem tenha uma raça por vezes restringida noutros países deve confirmar junto do Director dos Serviços de Veterinária."
  note:
    en: "Because national rules can change and are not always published in full, confirm any breed requirement directly with DINAV before you travel."
    fr: "Les règles nationales pouvant évoluer et n'étant pas toujours publiées en intégralité, confirme toute exigence par race directement auprès de la DINAV avant de voyager."
    es: "Como las normas nacionales pueden cambiar y no siempre se publican en su totalidad, confirma cualquier requisito por raza directamente con la DINAV antes de viajar."
    pt: "Como as regras nacionais podem mudar e nem sempre são publicadas na íntegra, qualquer exigência relativa à raça deve ser confirmada diretamente junto da DINAV antes da viagem."

checklist:
  - en: "Apply to the Director of Veterinary Services (DINAV), via the Provincial Livestock Services, for the import licence well before travel"
    fr: "Demande la licence d'importation au Directeur des Services vétérinaires (DINAV), via les Serviços Provinciais de Pecuária, bien avant le voyage"
    es: "Solicita al Director de los Servicios Veterinarios (DINAV), a través de los Serviços Provinciais de Pecuária, la licencia de importación bastante antes del viaje"
    pt: "Pedir a licença de importação ao Director dos Serviços de Veterinária (DINAV), através dos Serviços Provinciais de Pecuária, bem antes da viagem"
  - en: "ISO microchip (recommended) implanted before the rabies vaccination"
    fr: "Puce ISO (recommandée) posée avant la vaccination antirabique"
    es: "Microchip ISO (recomendado) implantado antes de la vacunación antirrábica"
    pt: "Microchip ISO (recomendado) implantado antes da vacinação antirrábica"
  - en: "Valid rabies vaccination given within 12 months before export (or, for a puppy under 3 months, the mother's rabies certificate)"
    fr: "Vaccination antirabique valide faite dans les 12 mois avant l'export (ou, pour un chiot de moins de 3 mois, le certificat de rage de la mère)"
    es: "Vacunación antirrábica válida realizada dentro de los 12 meses previos a la exportación (o, para un cachorro menor de 3 meses, el certificado de rabia de la madre)"
    pt: "Vacinação antirrábica válida administrada nos 12 meses anteriores à exportação (ou, para um filhote com menos de 3 meses, o certificado antirrábico da mãe)"
  - en: "International sanitary certificate from the export-country veterinary authority (USDA-APHIS endorsed from the US), valid 30 days"
    fr: "Certificat sanitaire international de l'autorité vétérinaire du pays d'export (visé USDA-APHIS depuis les États-Unis), valable 30 jours"
    es: "Certificado sanitario internacional de la autoridad veterinaria del país exportador (refrendado por el USDA-APHIS desde EE. UU.), válido 30 días"
    pt: "Certificado sanitário internacional da autoridade veterinária do país de exportação (endossado pelo USDA-APHIS a partir dos EUA), válido 30 dias"
  - en: "Ensure the dog is free from external parasites and treatments are up to date"
    fr: "Assure-toi que le chien est exempt de parasites externes et que les traitements sont à jour"
    es: "Asegúrate de que el perro esté libre de parásitos externos y de que los tratamientos estén al día"
    pt: "Garantir que o cachorro está livre de parasitas externos e com os tratamentos em dia"
  - en: "Notify the veterinary inspector at least 14 days before arrival; plan for the veterinary inspection and possible 40-day quarantine"
    fr: "Notifie l'inspecteur vétérinaire au moins 14 jours avant l'arrivée ; prévois l'inspection vétérinaire et une éventuelle quarantaine de 40 jours"
    es: "Notifica al inspector veterinario con al menos 14 días de antelación a la llegada; prevé la inspección veterinaria y una posible cuarentena de 40 días"
    pt: "Notificar o inspetor veterinário com pelo menos 14 dias de antecedência da chegada; contar com a inspeção veterinária e com a possível quarentena de 40 dias"
  - en: "Original import licence and certificates to present at the point of entry"
    fr: "Licence d'importation et certificats originaux à présenter au point d'entrée"
    es: "Licencia de importación y certificados originales para presentar en el punto de entrada"
    pt: "Licença de importação e certificados originais para apresentar no ponto de entrada"
  - en: "Airline reservation and suitable travel crate if travelling in the hold"
    fr: "Réservation et caisse de transport adaptée si voyage en soute"
    es: "Reserva de la aerolínea y jaula de transporte adecuada si viaja en bodega"
    pt: "Reserva na companhia aérea e caixa de transporte adequada à IATA se a viagem for no porão"

