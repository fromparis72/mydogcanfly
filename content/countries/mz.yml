# Country Entry Guide — Mozambique (bilingual EN/FR).
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_mz
iso2: "MZ"
name: { en: "Mozambique", fr: "Mozambique", es: "Mozambique", pt: "Moçambique" }
region: { en: "Africa", fr: "Afrique", es: "África", pt: "África" }


regime: non_listed
exit:
  authority: DINAV
  authorityUrl: https://www.agricultura.gov.mz/
  intro:
    en: "Mozambique is non-listed, so a valid rabies antibody titer is mandatory to return to the EU — plus an export health certificate endorsed by the Direcção Nacional de Veterinária (DINAV)."
    fr: "Le Mozambique est un pays non listé : un titrage antirabique valide est obligatoire pour rentrer dans l'UE — plus un certificat sanitaire d'export visé par la Direcção Nacional de Veterinária (DINAV)."
    es: "Mozambique no está listado: una titulación antirrábica válida es obligatoria para volver a la UE — más un certificado sanitario de exportación refrendado por la Direcção Nacional de Veterinária (DINAV)."
    pt: "Moçambique é um país não listado: um teste sorológico antirrábico (titulação) válido é obrigatório para regressar à UE — além de um atestado de saúde de exportação endossado pela Direcção Nacional de Veterinária (DINAV)."
  steps:
    - timing: longlead
      scope: eu
      text:
        en: "Anticipate the rabies antibody titer: blood test in an EU-approved lab, at least 30 days after vaccination — a valid result is essential to re-enter the EU and cannot be arranged at the last minute."
        fr: "Anticipe le titrage antirabique : prise de sang dans un labo agréé UE, au moins 30 jours après la vaccination — un résultat valide est indispensable pour rentrer dans l'UE et ne se règle pas à la dernière minute."
        es: "Anticipa la titulación antirrábica: análisis de sangre en un laboratorio aprobado por la UE, al menos 30 días tras la vacuna — un resultado válido es imprescindible para volver a la UE y no se puede resolver a última hora."
        pt: "Antecipar o teste sorológico antirrábico (titulação): análise de sangue num laboratório aprovado pela UE, pelo menos 30 dias depois da vacinação — um resultado válido é indispensável para reentrar na UE e não se resolve à última hora."
    - timing: window
      scope: any
      text:
        en: "The veterinary authority (DINAV) must authorise the export and issue the international sanitary certificate before the dog can leave."
        fr: "L'autorité vétérinaire (DINAV) doit autoriser l'export et délivrer le certificat sanitaire international avant que le chien puisse partir."
        es: "La autoridad veterinaria (DINAV) debe autorizar la exportación y emitir el certificado sanitario internacional antes de que el perro pueda salir."
        pt: "A autoridade veterinária (DINAV) deve autorizar a exportação e emitir o certificado sanitário internacional antes de o cachorro poder sair."
  onSiteNote:
    en: "If your dog already had a valid EU rabies titer before leaving, it stays valid for life as long as the rabies vaccination is kept up — check this before you travel."
    fr: "Si ton chien avait déjà un titrage antirabique UE valide avant de partir, il reste valable à vie tant que la vaccination antirabique est à jour — vérifie-le avant de voyager."
    es: "Si tu perro ya tenía una titulación antirrábica UE válida antes de salir, sigue siendo válida de por vida mientras la vacuna antirrábica esté al día — compruébalo antes de viajar."
    pt: "Se o cachorro já tinha um teste sorológico antirrábico (titulação) válido para a UE antes da partida, este permanece válido para toda a vida enquanto a vacinação antirrábica estiver em dia — convém verificar antes de viajar."

hero:
  h1: { en: "Traveling to Mozambique with your dog", fr: "Voyager au Mozambique avec ton chien", es: "Viajar a Mozambique con tu perro", pt: "Viajar para Moçambique com o cachorro" }
  intro:
    en: >-
      Mozambique allows dogs, but entry is controlled by its own veterinary authority — the National
      Directorate of Veterinary Services (Direcção Nacional dos Serviços de Veterinária, DINAV) within
      the Ministry of Agriculture, Environment and Fisheries. Under the Animal Health Regulation
      (Decree 26/2009), no animal may enter without an import licence (Licença de Importação) issued in
      advance by the Director of Veterinary Services, together with an international sanitary certificate
      from the exporting country. Mozambique is not an EU country and does not recognise the EU pet
      passport as an entry document. It is a rabies-endemic country, so a valid rabies vaccination is a
      core requirement. The published customs procedure also provides for advance notification, a
      veterinary inspection at the border and a period of quarantine for live animals. This guide
      explains each step so you know what to prepare before you book your flight.
    fr: >-
      Le Mozambique admet les chiens, mais l'entrée est contrôlée par sa propre autorité vétérinaire — la
      Direcção Nacional dos Serviços de Veterinária (DINAV) au sein du ministère de l'Agriculture, de
      l'Environnement et des Pêches. Au titre du Règlement de santé animale (Décret 26/2009), aucun animal
      ne peut entrer sans une licence d'importation (Licença de Importação) délivrée à l'avance par le
      Directeur des Services vétérinaires, accompagnée d'un certificat sanitaire international du pays
      d'export. Le Mozambique n'est pas un pays de l'UE et ne reconnaît pas le passeport européen comme
      document d'entrée. C'est un pays d'enzootie rabique : une vaccination antirabique valide est donc une
      exigence de base. La procédure douanière publiée prévoit aussi une notification préalable, une
      inspection vétérinaire à la frontière et une quarantaine pour les animaux vivants. Ce guide détaille
      chaque étape avant de réserver ton vol.
    es: >-
      Mozambique admite perros, pero la entrada está controlada por su propia autoridad veterinaria — la
      Dirección Nacional de los Servicios Veterinarios (Direcção Nacional dos Serviços de Veterinária,
      DINAV) dentro del Ministerio de Agricultura, Medio Ambiente y Pesca. En virtud del Reglamento de
      Sanidad Animal (Decreto 26/2009), ningún animal puede entrar sin una licencia de importación
      (Licença de Importação) expedida por adelantado por el Director de los Servicios Veterinarios, junto
      con un certificado sanitario internacional del país exportador. Mozambique no es un país de la UE y
      no reconoce el pasaporte europeo para mascotas como documento de entrada. Es un país con rabia
      endémica, por lo que una vacunación antirrábica válida es un requisito básico. El procedimiento
      aduanero publicado también prevé una notificación previa, una inspección veterinaria en la frontera
      y un periodo de cuarentena para los animales vivos. Esta guía explica cada paso para que sepas qué
      preparar antes de reservar tu vuelo.

    pt: "Moçambique admite a entrada de cachorros, mas essa entrada é controlada pela sua própria autoridade veterinária — a Direcção Nacional dos Serviços de Veterinária (DINAV), do Ministério da Agricultura, Ambiente e Pescas. Nos termos do Regulamento de Sanidade Animal (Decreto 26/2009), nenhum animal pode entrar sem uma Licença de Importação emitida previamente pelo Director dos Serviços de Veterinária, acompanhada de um certificado sanitário internacional do país exportador. Moçambique não é um país da UE e não reconhece o passaporte europeu para animais de companhia como documento de entrada. É um país onde a raiva é endémica, por isso uma vacinação antirrábica válida é uma exigência essencial. O procedimento aduaneiro publicado prevê ainda a notificação prévia, uma inspeção veterinária na fronteira e um período de quarentena para animais vivos. Este guia explica cada etapa, para que se saiba o que preparar antes de reservar o voo."
difficulty:
  level: difficult
  label: { en: "Difficult — import licence, inspection and quarantine", fr: "Difficile — licence d'importation, inspection et quarantaine", es: "Difícil — licencia de importación, inspección y cuarentena", pt: "Difícil — licença de importação, inspeção e quarentena" }

prepTime:
  eu:
    en: "From Europe / the EU: allow ~6–10 weeks for the import licence from the Director of Veterinary Services, a valid rabies vaccination and an international sanitary certificate — plus a possible 40-day quarantine on arrival."
    fr: "Depuis l'Europe / l'UE : prévoir ~6 à 10 semaines pour la licence d'importation du Directeur des Services vétérinaires, une vaccination antirabique valide et un certificat sanitaire international — plus une éventuelle quarantaine de 40 jours à l'arrivée."
    es: "Desde Europa / la UE: calcula ~6–10 semanas para la licencia de importación del Director de los Servicios Veterinarios, una vacunación antirrábica válida y un certificado sanitario internacional — más una posible cuarentena de 40 días a la llegada."
    pt: "Da Europa / da UE: contar com ~6 a 10 semanas para a licença de importação do Director dos Serviços de Veterinária, uma vacinação antirrábica válida e um certificado sanitário internacional — além de uma possível quarentena de 40 dias à chegada."
  listed:
    en: "From other non-EU countries: ~6–10 weeks — the same core steps (import licence, rabies vaccination, international sanitary certificate), the certificate endorsed by your national veterinary authority (USDA-APHIS from the US)."
    fr: "Depuis d'autres pays hors UE : ~6 à 10 semaines — mêmes étapes de base (licence d'importation, vaccination antirabique, certificat sanitaire international), le certificat étant visé par ton autorité vétérinaire nationale (USDA-APHIS depuis les États-Unis)."
    es: "Desde otros países fuera de la UE: ~6–10 semanas — los mismos pasos básicos (licencia de importación, vacunación antirrábica, certificado sanitario internacional), con el certificado refrendado por tu autoridad veterinaria nacional (USDA-APHIS desde EE. UU.)."
    pt: "De outros países fora da UE: ~6 a 10 semanas — as mesmas etapas essenciais (licença de importação, vacinação antirrábica, certificado sanitário internacional), com o certificado endossado pela autoridade veterinária nacional do país de partida (USDA-APHIS a partir dos EUA)."
  nonListed:
    en: "From all origins: Mozambique applies the same import-licence and certificate framework, plus a risk analysis based on your origin's animal-health situation; allow extra time and plan for the 40-day quarantine provided for live animals."
    fr: "Depuis toute origine : le Mozambique applique le même cadre de licence et de certificat, plus une analyse de risque selon la situation sanitaire de l'origine ; prévois une marge et anticipe la quarantaine de 40 jours prévue pour les animaux vivants."
    es: "Desde cualquier origen: Mozambique aplica el mismo marco de licencia de importación y certificado, más un análisis de riesgo según la situación sanitaria animal de tu origen; deja tiempo adicional y prevé la cuarentena de 40 días establecida para los animales vivos."
    pt: "De todas as origens: Moçambique aplica o mesmo enquadramento de licença de importação e de certificado, acrescido de uma análise de risco baseada na situação sanitária animal da origem; convém prever tempo adicional e contar com a quarentena de 40 dias prevista para animais vivos."

