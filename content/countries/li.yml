origin:
  eu:
    title: { en: "Simplified — pet passport", fr: "Simplifié — passeport", es: "Simplificado — pasaporte para mascotas", pt: "Simplificado — passaporte para animais" }
    body:
      en: "A dog coming from an EU/EEA country or Switzerland needs a pet passport (EU or Swiss — the two are mutually recognised) showing a valid ISO microchip and an in-date rabies vaccination. No antibody test, no health certificate and normally no border check. Up to five pets per person travel under the pet rules."
      fr: "Un chien venant d'un pays de l'UE/EEE ou de Suisse a besoin d'un passeport (européen ou suisse — les deux sont mutuellement reconnus) mentionnant une puce ISO valide et une vaccination antirabique à jour. Pas de titrage, pas de certificat sanitaire et normalement pas de contrôle frontalier. Jusqu'à cinq animaux par personne voyagent sous le régime des animaux de compagnie."
      es: "Un perro que llega de un país de la UE/EEE o de Suiza necesita un pasaporte para mascotas (europeo o suizo — ambos se reconocen mutuamente) que acredite un microchip ISO válido y una vacunación antirrábica en vigor. Sin prueba de titulación, sin certificado sanitario y normalmente sin control fronterizo. Hasta cinco mascotas por persona viajan conforme a las normas de mascotas."
      pt: "Um cachorro vindo de um país da UE/EEE ou da Suíça precisa de um passaporte para animais (europeu ou suíço — os dois são mutuamente reconhecidos) que comprove microchip ISO válido e vacinação antirrábica em dia. Sem teste sorológico, sem certificado sanitário e, normalmente, sem controle de fronteira. Até cinco animais de estimação por pessoa viajam sob o regime de animais de companhia."
    cls: ok
  listed:
    title: { en: "Health certificate, no blood test", fr: "Certificat sanitaire, sans prise de sang", es: "Certificado sanitario, sin análisis de sangre", pt: "Certificado sanitário, sem exame de sangue" }
    body:
      en: "From a listed low-rabies-risk country (United States, Canada, United Kingdom and others), your dog needs a microchip, a valid rabies vaccination and an animal health certificate endorsed by an official vet before departure. No antibody test is required. As Liechtenstein has no international airport, entry is overland or via Switzerland, where the dog is declared to customs."
      fr: "Depuis un pays listé à faible risque rabique (États-Unis, Canada, Royaume-Uni…), ton chien a besoin d'une puce, d'une vaccination antirabique valide et d'un certificat sanitaire visé par un vétérinaire officiel avant le départ. Pas de titrage. Le Liechtenstein n'ayant pas d'aéroport international, l'entrée se fait par voie terrestre ou via la Suisse, où le chien est déclaré à la douane."
      es: "Desde un país listado de bajo riesgo de rabia (Estados Unidos, Canadá, el Reino Unido y otros), tu perro necesita un microchip, una vacunación antirrábica válida y un certificado sanitario animal refrendado por un veterinario oficial antes de la salida. No se exige prueba de titulación. Como Liechtenstein no tiene aeropuerto internacional, la entrada se realiza por vía terrestre o a través de Suiza, donde el perro se declara en aduanas."
      pt: "Vindo de um país listado de baixo risco de raiva (Estados Unidos, Canadá, Reino Unido e outros), seu cachorro precisa de microchip, vacinação antirrábica válida e um atestado de saúde animal endossado por um veterinário oficial antes da partida. Não é exigido teste sorológico. Como o Liechtenstein não tem aeroporto internacional, a entrada é por via terrestre ou pela Suíça, onde o cachorro é declarado à alfândega."
    cls: warn
  nonListed:
    title: { en: "Antibody test + 3-month wait", fr: "Titrage + 3 mois d'attente", es: "Prueba de titulación + espera de 3 meses", pt: "Teste sorológico + 3 meses de espera" }
    body:
      en: "From a non-listed (rabies-risk) country, add a rabies antibody test: blood drawn at least 30 days after vaccination, result ≥0.5 IU/ml at an approved laboratory, then a compulsory 3-month wait before entry. An endorsed health certificate is also required, and a Swiss import licence may apply for arrivals from high-rabies-risk countries."
      fr: "Depuis un pays non listé (à risque rabique), ajoute un titrage antirabique : sang prélevé au moins 30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé, puis un délai obligatoire de 3 mois avant l'entrée. Un certificat sanitaire visé est également requis, et une autorisation d'importation suisse peut s'appliquer pour les arrivées de pays à haut risque rabique."
      es: "Desde un país no listado (con riesgo de rabia), añade una prueba de titulación de rabia: sangre extraída al menos 30 días después de la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado, y luego una espera obligatoria de 3 meses antes de la entrada. También se exige un certificado sanitario refrendado, y puede aplicarse una autorización de importación suiza para las llegadas de países de alto riesgo de rabia."
      pt: "Vindo de um país não listado (de risco de raiva), acrescente o teste sorológico antirrábico: sangue coletado no mínimo 30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório aprovado e, em seguida, 3 meses obrigatórios de espera antes da entrada. Também é exigido um certificado sanitário endossado, e uma autorização de importação suíça pode ser necessária nas chegadas de países de alto risco de raiva."
    cls: no

arrival:
  intro:
    en: "What happens when your dog reaches Liechtenstein depends on where you flew from. Liechtenstein has no international airport, so dogs arrive overland — usually via Switzerland or Austria."
    fr: "Ce qui se passe à l'arrivée de ton chien au Liechtenstein dépend de ton lieu de départ. Le Liechtenstein n'ayant pas d'aéroport international, les chiens arrivent par voie terrestre — généralement via la Suisse ou l'Autriche."
    es: "Lo que ocurre cuando tu perro llega a Liechtenstein depende del lugar desde el que hayas volado. Liechtenstein no tiene aeropuerto internacional, por lo que los perros llegan por vía terrestre — normalmente a través de Suiza o Austria."
    pt: "O que acontece quando seu cachorro chega ao Liechtenstein depende do lugar de onde você voou. O Liechtenstein não tem aeroporto internacional, então os cachorros chegam por via terrestre — normalmente pela Suíça ou pela Áustria."
  points:
    - en: "From the EU/EEA or Switzerland: no systematic border check — keep the pet passport with you."
      fr: "Depuis l'UE/EEE ou la Suisse : pas de contrôle systématique — garde le passeport sur toi."
      es: "Desde la UE/EEE o Suiza: sin control fronterizo sistemático — lleva contigo el pasaporte para mascotas."
      pt: "Da UE/EEE ou da Suíça: sem controle sistemático de fronteira — leve o passaporte para animais com você."
    - en: "From a third country: the dog enters the Swiss–Liechtenstein customs and veterinary territory and must be declared to customs on entry."
      fr: "Depuis un pays tiers : le chien entre dans le territoire douanier et vétérinaire suisse-liechtensteinois et doit être déclaré à la douane à l'entrée."
      es: "Desde un país tercero: el perro entra en el territorio aduanero y veterinario suizo-liechtensteiniano y debe declararse en aduanas a la entrada."
      pt: "De um país terceiro: o cachorro entra no território aduaneiro e veterinário suíço-liechtensteinense e precisa ser declarado à alfândega na entrada."
    - en: "The ALKVW (Office for Food Control and Veterinary Affairs) is the responsible authority for dog registration and entry supervision."
      fr: "L'ALKVW (Office du contrôle des denrées alimentaires et des affaires vétérinaires) est l'autorité responsable de l'enregistrement des chiens et de la supervision de l'entrée."
      es: "La ALKVW (Oficina de Control de Alimentos y Asuntos Veterinarios) es la autoridad responsable del registro de perros y de la supervisión de la entrada."
      pt: "O ALKVW (Amt für Lebensmittelkontrolle und Veterinärwesen, serviço de controle de alimentos e assuntos veterinários) é a autoridade responsável pelo registro dos cachorros e pela supervisão da entrada."
    - en: "A dog that stays in Liechtenstein must be reported and microchip-registered in the national database, and dogs over three months old are declared to the municipality of residence."
      fr: "Un chien qui séjourne au Liechtenstein doit être déclaré et enregistré (puce) dans la base nationale, et les chiens de plus de trois mois sont annoncés à la commune de résidence."
      es: "Un perro que permanece en Liechtenstein debe ser notificado y registrado (microchip) en la base de datos nacional, y los perros de más de tres meses se declaran ante el municipio de residencia."
      pt: "Um cachorro que fica no Liechtenstein precisa ser comunicado e ter o microchip registrado no banco de dados nacional, e os cachorros com mais de três meses são declarados ao município de residência."
    - en: "Carry original documents (not copies); documents in German are accepted without translation."
      fr: "Munis-toi des documents originaux (pas de copies) ; les documents en allemand sont acceptés sans traduction."
      es: "Lleva los documentos originales (no copias); los documentos en alemán se aceptan sin traducción."
      pt: "Leve os documentos originais (não cópias); documentos em alemão são aceitos sem tradução."
    - en: "If documents are missing or invalid, the veterinary authority handles the non-compliant animal at the owner's expense."
      fr: "Si les documents manquent ou sont invalides, l'autorité vétérinaire prend en charge l'animal non conforme aux frais du propriétaire."
      es: "Si faltan documentos o no son válidos, la autoridad veterinaria se hace cargo del animal no conforme a expensas del propietario."
      pt: "Se faltarem documentos ou eles não forem válidos, a autoridade veterinária cuida do animal fora das exigências às custas do dono."

travellerExperience: null

restrictedDogs:
  intro:
    en: "Liechtenstein regulates 'potentially dangerous dogs' (potentiell gefährliche Hunde) under the Dog Act (Hundegesetz). The government designates the affected breeds, breed types and their crosses by ordinance. Owning such a dog is allowed but strictly controlled — there is no outright breed ban, but a permit and safety obligations apply."
    fr: "Le Liechtenstein réglemente les « chiens potentiellement dangereux » (potentiell gefährliche Hunde) via la loi sur les chiens (Hundegesetz). Le gouvernement désigne par ordonnance les races, types de races et leurs croisements concernés. La détention d'un tel chien est autorisée mais strictement encadrée — il n'y a pas d'interdiction pure de race, mais un permis et des obligations de sécurité s'appliquent."
    es: "Liechtenstein regula los «perros potencialmente peligrosos» (potentiell gefährliche Hunde) en virtud de la Ley de Perros (Hundegesetz). El gobierno designa por reglamento las razas, tipos de razas y sus cruces afectados. Tener un perro así está permitido pero estrictamente controlado — no existe una prohibición absoluta de razas, pero se aplican un permiso y obligaciones de seguridad."
    pt: "O Liechtenstein regula os “cachorros potencialmente perigosos” (potentiell gefährliche Hunde) pela lei sobre cães (Hundegesetz). O governo designa por decreto as raças, os tipos de raça e seus cruzamentos abrangidos. Ter um cachorro desses é permitido, mas estritamente controlado — não existe proibição total de raças, mas valem uma autorização e obrigações de segurança."
  cat1:
    en: "Keeping permit (Haltebewilligung): anyone wanting a potentially dangerous dog must obtain a permit from the ALKVW before acquiring the animal. The permit requires legal capacity, a passed competence test (Sachkundeprüfung), no convictions for violent offences or serious animal-welfare breaches, and proof of the dog's origin (Art. 6 HG)."
    fr: "Permis de détention (Haltebewilligung) : quiconque souhaite un chien potentiellement dangereux doit obtenir un permis de l'ALKVW avant d'acquérir l'animal. Le permis exige la capacité juridique, la réussite d'un examen de compétence (Sachkundeprüfung), l'absence de condamnation pour violence ou infraction grave à la protection animale, et une preuve de l'origine du chien (art. 6 HG)."
    es: "Permiso de tenencia (Haltebewilligung): quien quiera un perro potencialmente peligroso debe obtener un permiso de la ALKVW antes de adquirir el animal. El permiso exige capacidad jurídica, haber superado una prueba de competencia (Sachkundeprüfung), no tener condenas por delitos violentos o infracciones graves de bienestar animal, y una prueba del origen del perro (art. 6 HG)."
    pt: "Autorização de posse (Haltebewilligung): quem quiser ter um cachorro potencialmente perigoso precisa obter uma autorização do ALKVW antes de adquirir o animal. A autorização exige capacidade civil, aprovação em uma prova de competência (Sachkundeprüfung), ausência de condenações por crimes violentos ou por infrações graves ao bem-estar animal e a comprovação da origem do cachorro (art. 6 da HG)."
  cat2:
    en: "Muzzle, lead and insurance: a potentially dangerous dog must be leashed and muzzled outside fenced private property unless the owner has passed the social-compatibility test (Sozialverträglichkeitsprüfung). Liability insurance of at least CHF 1 million is compulsory (Art. 6a and 6c HG)."
    fr: "Muselière, laisse et assurance : un chien potentiellement dangereux doit être tenu en laisse et muselé hors d'une propriété privée clôturée, sauf si le détenteur a réussi le test de sociabilité (Sozialverträglichkeitsprüfung). Une assurance responsabilité civile d'au moins 1 million de CHF est obligatoire (art. 6a et 6c HG)."
    es: "Bozal, correa y seguro: un perro potencialmente peligroso debe ir sujeto con correa y con bozal fuera de una propiedad privada vallada, salvo que el propietario haya superado la prueba de sociabilidad (Sozialverträglichkeitsprüfung). Es obligatorio un seguro de responsabilidad civil de al menos 1 millón de CHF (art. 6a y 6c HG)."
    pt: "Focinheira, guia e seguro: um cachorro potencialmente perigoso precisa andar na guia e de focinheira fora de uma propriedade particular cercada, a menos que o dono tenha sido aprovado no teste de convívio social (Sozialverträglichkeitsprüfung). É obrigatório um seguro de responsabilidade civil de pelo menos 1 milhão de francos suíços (art. 6a e 6c da HG)."
  note:
    en: "Because the exact list of designated breeds is set by government ordinance and may change, confirm your dog's status and the permit procedure directly with the ALKVW before you travel. A general competence certificate (Sachkundenachweis) is also required before acquiring any dog."
    fr: "La liste exacte des races désignées étant fixée par ordonnance gouvernementale et susceptible d'évoluer, confirme le statut de ton chien et la procédure de permis directement auprès de l'ALKVW avant de voyager. Un certificat de compétence général (Sachkundenachweis) est également requis avant l'acquisition de tout chien."
    es: "Como la lista exacta de razas designadas se fija por reglamento gubernamental y puede cambiar, confirma la situación de tu perro y el procedimiento del permiso directamente con la ALKVW antes de viajar. También se exige un certificado de competencia general (Sachkundenachweis) antes de adquirir cualquier perro."
    pt: "Como a lista exata das raças designadas é fixada por decreto do governo e pode mudar, confirme a situação do seu cachorro e o procedimento de autorização diretamente com o ALKVW antes de viajar. Um certificado geral de competência (Sachkundenachweis) também é exigido antes de adquirir qualquer cachorro."

checklist:
  - en: "Microchip (ISO) implanted before the rabies vaccination"
    fr: "Puce (ISO) posée avant la vaccination antirabique"
    es: "Microchip (ISO) implantado antes de la vacunación antirrábica"
    pt: "Microchip (ISO) implantado antes da vacinação antirrábica"
  - en: "Valid rabies vaccination (dog ≥12 weeks at the shot, +21 days)"
    fr: "Vaccination antirabique valide (chien ≥12 semaines, +21 jours)"
    es: "Vacunación antirrábica válida (perro ≥12 semanas en la vacuna, +21 días)"
    pt: "Vacinação antirrábica válida (cachorro com ≥12 semanas na data da vacina, +21 dias)"
  - en: "Rabies antibody test — non-listed countries only (≥0.5 IU/ml, then 3-month wait)"
    fr: "Titrage antirabique — pays non listés uniquement (≥0,5 UI/ml, puis 3 mois d'attente)"
    es: "Prueba de titulación de rabia — solo países no listados (≥0,5 UI/ml, luego espera de 3 meses)"
    pt: "Teste sorológico antirrábico — apenas países não listados (≥0,5 UI/ml e depois 3 meses de espera)"
  - en: "Pet passport (EU/EEA or Swiss origin) or endorsed health certificate (third-country origin)"
    fr: "Passeport (origine UE/EEE ou suisse) ou certificat sanitaire visé (origine pays tiers)"
    es: "Pasaporte para mascotas (origen UE/EEE o suizo) o certificado sanitario refrendado (origen de país tercero)"
    pt: "Passaporte para animais (origem na UE/EEE ou na Suíça) ou certificado sanitário endossado (origem em país terceiro)"
  - en: "No more than five pets per person; original documents in German accepted"
    fr: "Cinq animaux maximum par personne ; documents originaux en allemand acceptés"
    es: "No más de cinco mascotas por persona; se aceptan documentos originales en alemán"
    pt: "No máximo cinco animais de estimação por pessoa; documentos originais em alemão são aceitos"
  - en: "Plan entry overland or via Switzerland — Liechtenstein has no international airport"
    fr: "Prévois une entrée par voie terrestre ou via la Suisse — le Liechtenstein n'a pas d'aéroport international"
    es: "Prevé la entrada por vía terrestre o a través de Suiza — Liechtenstein no tiene aeropuerto internacional"
    pt: "Planeje a entrada por via terrestre ou pela Suíça — o Liechtenstein não tem aeroporto internacional"
  - en: "Airline reservation and suitable IATA crate if flying into a neighbouring airport"
    fr: "Réservation et caisse IATA adaptée si vol vers un aéroport voisin"
    es: "Reserva de la aerolínea y jaula IATA adecuada si vuelas a un aeropuerto vecino"
    pt: "Reserva na companhia aérea e caixa de transporte adequada às normas IATA se o voo chegar a um aeroporto vizinho"
  - en: "If your dog is a potentially dangerous breed, arrange the ALKVW keeping permit, insurance and muzzle/lead"
    fr: "Si ton chien est d'une race potentiellement dangereuse, prévois le permis de détention ALKVW, l'assurance et la muselière/laisse"
    es: "Si tu perro es de una raza potencialmente peligrosa, gestiona el permiso de tenencia de la ALKVW, el seguro y el bozal/correa"
    pt: "Se seu cachorro for de uma raça potencialmente perigosa, providencie a autorização de posse do ALKVW, o seguro e a focinheira/guia"

