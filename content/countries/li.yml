# Country Entry Guide — Liechtenstein (bilingual EN/FR).
# EEA (non-EU); customs + veterinary union with Switzerland. Authority: ALKVW (llv.li); Swiss FSVO rules apply.
# Edit here, then run: node packages/knowledge/scripts/ingest-countries.mjs
id: country_li
iso2: "LI"
name: { en: "Liechtenstein", fr: "Liechtenstein", es: "Liechtenstein", pt: "Liechtenstein" }
region: { en: "Europe (EEA, non-EU)", fr: "Europe (EEE, hors UE)", es: "Europa (EEE, fuera de la UE)", pt: "Europa (EEE, fora da UE)" }


regime: eu

hero:
  h1: { en: "Traveling to Liechtenstein with your dog", fr: "Voyager au Liechtenstein avec ton chien", es: "Viajar a Liechtenstein con tu perro", pt: "Viajar para o Liechtenstein com seu cachorro" }
  intro:
    en: >-
      Liechtenstein welcomes dogs, but what you need to prepare depends mainly on the country your dog is
      travelling from — not only on Liechtenstein itself. Liechtenstein is not an EU member; it belongs to
      the EEA and forms a customs and veterinary union with Switzerland, so Swiss rules apply and its own
      authority (the Office for Food Control and Veterinary Affairs, ALKVW) supervises entry. An ISO
      microchip and a valid rabies vaccination are always required. A dog arriving from an EU/EEA country or
      Switzerland simply needs a pet passport. A dog from a listed low-rabies-risk country (such as the
      United States, Canada or the United Kingdom) needs a health certificate but no blood test. A dog from
      a non-listed country faces the longest path, including a rabies antibody test and a three-month wait.
      This guide explains each case so you know exactly what to prepare before you book your flight.
    fr: >-
      Le Liechtenstein accueille les chiens, mais ce qu'il faut préparer dépend surtout du pays d'où ton
      chien voyage — pas seulement du Liechtenstein. Le Liechtenstein n'est pas membre de l'UE ; il fait
      partie de l'EEE et forme une union douanière et vétérinaire avec la Suisse : les règles suisses
      s'appliquent et sa propre autorité (l'Office du contrôle des denrées alimentaires et des affaires
      vétérinaires, ALKVW) supervise l'entrée. Une puce ISO et une vaccination antirabique valide sont
      toujours exigées. Un chien arrivant d'un pays de l'UE/EEE ou de Suisse a simplement besoin d'un
      passeport. Un chien venant d'un pays listé à faible risque rabique (États-Unis, Canada, Royaume-Uni…)
      a besoin d'un certificat sanitaire mais pas de prise de sang. Un chien venant d'un pays non listé suit
      le parcours le plus long, avec un titrage antirabique et un délai de trois mois. Ce guide détaille
      chaque cas pour savoir exactement quoi préparer avant de réserver ton vol.
    es: >-
      Liechtenstein acoge a los perros, pero lo que debes preparar depende sobre todo del país desde el
      que viaja tu perro — no solo de Liechtenstein. Liechtenstein no es miembro de la UE; pertenece al
      EEE y forma una unión aduanera y veterinaria con Suiza, por lo que se aplican las normas suizas y su
      propia autoridad (la Oficina de Control de Alimentos y Asuntos Veterinarios, ALKVW) supervisa la
      entrada. Siempre se exigen un microchip ISO y una vacunación antirrábica válida. Un perro que llega
      de un país de la UE/EEE o de Suiza solo necesita un pasaporte para mascotas. Un perro procedente de
      un país listado de bajo riesgo de rabia (como Estados Unidos, Canadá o el Reino Unido) necesita un
      certificado sanitario, pero no una prueba de sangre. Un perro de un país no listado se enfrenta al
      camino más largo, que incluye una prueba de titulación de rabia y una espera de tres meses. Esta
      guía explica cada caso para que sepas exactamente qué preparar antes de reservar tu vuelo.

    pt: "O Liechtenstein recebe bem os cachorros, mas o que você precisa preparar depende principalmente do país de onde seu cachorro parte — e não só do Liechtenstein em si. O Liechtenstein não é membro da UE; ele faz parte do EEE e forma uma união aduaneira e veterinária com a Suíça, então valem as regras suíças e sua própria autoridade (o Amt für Lebensmittelkontrolle und Veterinärwesen, ALKVW, serviço de controle de alimentos e assuntos veterinários) supervisiona a entrada. Microchip ISO e vacinação antirrábica válida são sempre obrigatórios. Um cachorro que chega de um país da UE/EEE ou da Suíça precisa apenas de um passaporte para animais. Um cachorro vindo de um país listado de baixo risco de raiva (como Estados Unidos, Canadá ou Reino Unido) precisa de um certificado sanitário, mas não de exame de sangue. Um cachorro vindo de um país não listado enfrenta o caminho mais longo, com teste sorológico antirrábico e três meses de espera. Este guia explica cada caso para você saber exatamente o que preparar antes de comprar a passagem."
difficulty:
  level: moderate
  label: { en: "Easy to difficult (depends on origin)", fr: "Facile à difficile (selon l'origine)", es: "De fácil a difícil (según el origen)", pt: "De fácil a difícil (depende da origem)" }

prepTime:
  eu:
    en: "A few days if the passport is up to date, up to ~3 weeks if the first rabies shot is still needed."
    fr: "Quelques jours si le passeport est à jour, jusqu'à ~3 semaines si la première vaccination reste à faire."
    es: "Unos días si el pasaporte está al día, hasta ~3 semanas si aún falta la primera vacuna antirrábica."
    pt: "Alguns dias se o passaporte estiver em dia, até cerca de 3 semanas se ainda faltar a primeira vacina antirrábica."
  listed:
    en: "~3–4 weeks: 21-day wait after the rabies shot, plus a health certificate from a low-rabies-risk country."
    fr: "~3–4 semaines : délai de 21 jours après le vaccin, plus un certificat sanitaire depuis un pays à faible risque rabique."
    es: "~3–4 semanas: espera de 21 días tras la vacuna antirrábica, más un certificado sanitario desde un país de bajo riesgo de rabia."
    pt: "Cerca de 3 a 4 semanas: 21 dias de espera depois da vacina antirrábica, mais um certificado sanitário emitido em um país de baixo risco de raiva."
  nonListed:
    en: "~4–7 months: antibody test at least 30 days after vaccination, then a compulsory 3-month wait."
    fr: "~4–7 mois : titrage au moins 30 jours après le vaccin, puis un délai obligatoire de 3 mois."
    es: "~4–7 meses: prueba de titulación al menos 30 días después de la vacuna, y luego una espera obligatoria de 3 meses."
    pt: "Cerca de 4 a 7 meses: teste sorológico no mínimo 30 dias depois da vacinação, seguido de 3 meses obrigatórios de espera."

