factors:
  title: { en: "How your dog's entry requirements are decided", fr: "Comment sont déterminées les formalités d'entrée de ton chien", es: "Cómo se determinan los requisitos de entrada de tu perro", pt: "Como são definidas as exigências de entrada do seu cachorro" }
  intro:
    en: "The exact documents depend on three things — Liechtenstein (your destination) is only the first."
    fr: "Les documents exacts dépendent de trois éléments — le Liechtenstein (ta destination) n'est que le premier."
    es: "Los documentos exactos dependen de tres factores — Liechtenstein (tu destino) es solo el primero."
    pt: "Os documentos exatos dependem de três coisas — o Liechtenstein (seu destino) é apenas a primeira."
  items:
    - stars: 5
      label: { en: "Country of destination — Liechtenstein", fr: "Pays de destination — Liechtenstein", es: "País de destino — Liechtenstein", pt: "País de destino — Liechtenstein" }
      text:
        en: "Liechtenstein applies Swiss veterinary rules through its customs and veterinary union: an ISO microchip and a valid rabies vaccination are always required, and no tapeworm treatment is needed to enter."
        fr: "Le Liechtenstein applique les règles vétérinaires suisses via son union douanière et vétérinaire : puce ISO et vaccination antirabique valide toujours exigées, et aucun traitement contre l'échinococcose n'est requis à l'entrée."
        es: "Liechtenstein aplica las normas veterinarias suizas a través de su unión aduanera y veterinaria: siempre se exigen un microchip ISO y una vacunación antirrábica válida, y no se necesita tratamiento contra la tenia para entrar."
        pt: "O Liechtenstein aplica as regras veterinárias suíças por meio da sua união aduaneira e veterinária: microchip ISO e vacinação antirrábica válida são sempre obrigatórios, e nenhum tratamento contra a tênia é exigido para entrar."
    - stars: 5
      label: { en: "Country of departure", fr: "Pays de départ", es: "País de salida", pt: "País de partida" }
      text:
        en: "Whether your dog leaves from the EU/EEA and Switzerland, a listed low-rabies-risk country or a non-listed country decides whether an antibody test and a health certificate are required."
        fr: "Que ton chien parte de l'UE/EEE et de Suisse, d'un pays listé à faible risque rabique ou d'un pays non listé détermine si un titrage et un certificat sanitaire sont exigés."
        es: "Que tu perro salga de la UE/EEE y Suiza, de un país listado de bajo riesgo de rabia o de un país no listado determina si se exigen una prueba de titulación y un certificado sanitario."
        pt: "Partir da UE/EEE e da Suíça, de um país listado de baixo risco de raiva ou de um país não listado é o que define se o teste sorológico e o certificado sanitário são exigidos."
    - stars: 4
      label: { en: "Countries your dog recently stayed in", fr: "Pays où ton chien a récemment séjourné", es: "Países donde tu perro ha estado recientemente", pt: "Países onde seu cachorro esteve recentemente" }
      text:
        en: "A recent stay in a rabies-risk country can trigger an antibody test even if you fly in from a low-risk country. It is your dog's real origin and history that count — not only the last airport."
        fr: "Un séjour récent dans un pays à risque rabique peut imposer un titrage même si tu arrives d'un pays à faible risque. C'est l'origine réelle et l'historique du chien qui comptent — pas seulement l'aéroport de destination finale."
        es: "Una estancia reciente en un país con riesgo de rabia puede obligar a una prueba de titulación aunque llegues desde un país de bajo riesgo. Lo que cuenta es el origen y el historial reales de tu perro — no solo el último aeropuerto."
        pt: "Uma estadia recente em um país de risco de raiva pode obrigar ao teste sorológico mesmo que você chegue de um país de baixo risco. O que conta é a origem real e o histórico do seu cachorro — não apenas o último aeroporto."
  note:
    en: "So read the requirements below as Liechtenstein's framework, then confirm your dog's exact origin and history with your vet."
    fr: "Lis donc les exigences ci-dessous comme le cadre liechtensteinois, puis confirme l'origine et l'historique exacts de ton chien avec ton vétérinaire."
    es: "Así que lee los requisitos siguientes como el marco de Liechtenstein y luego confirma el origen y el historial exactos de tu perro con tu veterinario."
    pt: "Então leia as exigências abaixo como o quadro do Liechtenstein e depois confirme com seu veterinário a origem e o histórico exatos do seu cachorro."

requirements:
  - item: { en: "ISO microchip", fr: "Puce ISO", es: "Microchip ISO", pt: "Microchip ISO" }
    required: { en: "Required", fr: "Requise", es: "Obligatorio", pt: "Obrigatório" }
    when: { en: "Must be implanted before the rabies vaccination; every dog must be microchipped and registered in the national database.", fr: "Doit être posée avant la vaccination antirabique ; chaque chien doit être pucé et enregistré dans la base nationale.", es: "Debe implantarse antes de la vacunación antirrábica; todo perro debe llevar microchip y estar registrado en la base de datos nacional.", pt: "Deve ser implantado antes da vacinação antirrábica; todo cachorro precisa ter microchip e estar registrado no banco de dados nacional." }
    exceptions: { en: "A tattoo is accepted only if it can be proven it was done before 3 July 2011.", fr: "Un tatouage n'est accepté que s'il peut être prouvé qu'il est antérieur au 3 juillet 2011.", es: "Un tatuaje solo se acepta si puede probarse que se hizo antes del 3 de julio de 2011.", pt: "Uma tatuagem só é aceita se for possível provar que foi feita antes de 3 de julho de 2011." }
    ref: { en: "Hundegesetz (HG) Art. 10; ALKVW llv.li", fr: "Hundegesetz (HG) art. 10 ; ALKVW llv.li", es: "Hundegesetz (HG) art. 10; ALKVW llv.li", pt: "Hundegesetz (HG, lei sobre cães) art. 10; ALKVW llv.li" }
  - item: { en: "Rabies vaccination", fr: "Vaccination antirabique", es: "Vacunación antirrábica", pt: "Vacinação antirrábica" }
    required: { en: "Required", fr: "Requise", es: "Obligatoria", pt: "Obrigatório" }
    when: { en: "Dog at least 12 weeks old at the shot; valid from 21 days after the primary vaccination.", fr: "Chien d'au moins 12 semaines ; valide 21 jours après la primo-vaccination.", es: "Perro de al menos 12 semanas en el momento de la vacuna; válida a partir de los 21 días de la primovacunación.", pt: "Cachorro com pelo menos 12 semanas na data da vacina; válida a partir de 21 dias após a primovacinação." }
    exceptions: { en: "The microchip must already be in place; no waiting period for an in-time booster.", fr: "La puce doit déjà être posée ; pas de délai pour un rappel effectué avant échéance.", es: "El microchip debe estar ya implantado; sin periodo de espera para un refuerzo administrado antes del vencimiento.", pt: "O microchip já deve estar implantado; sem prazo de espera para um reforço aplicado antes do vencimento." }
    ref: { en: "ALKVW llv.li; Swiss FSVO blv.admin.ch", fr: "ALKVW llv.li ; OSAV suisse blv.admin.ch", es: "ALKVW llv.li; FSVO suiza blv.admin.ch", pt: "ALKVW llv.li; OSAV suíço blv.admin.ch" }
  - item: { en: "Rabies antibody test", fr: "Titrage des anticorps antirabiques", es: "Prueba de titulación de anticuerpos contra la rabia", pt: "Teste sorológico antirrábico (titulação)" }
    required: { en: "Conditional", fr: "Conditionnel", es: "Condicional", pt: "Condicional" }
    when: { en: "Non-listed origins only: blood ≥30 days after vaccination, result ≥0.5 IU/ml at an approved laboratory, then a 3-month wait before entry.", fr: "Pays non listés : sang ≥30 jours après le vaccin, résultat ≥0,5 UI/ml dans un laboratoire agréé, puis délai de 3 mois avant l'entrée.", es: "Solo orígenes no listados: sangre ≥30 días tras la vacuna, resultado ≥0,5 UI/ml en un laboratorio autorizado, y luego una espera de 3 meses antes de la entrada.", pt: "Apenas origens não listadas: sangue coletado ≥30 dias após a vacinação, resultado ≥0,5 UI/ml em laboratório aprovado e, depois, 3 meses de espera antes da entrada." }
    exceptions: { en: "Not required from the EU/EEA and Switzerland or from listed low-rabies-risk countries (US, Canada, UK, and others).", fr: "Non requis depuis l'UE/EEE et la Suisse ou les pays listés à faible risque rabique (USA, Canada, RU…).", es: "No se exige desde la UE/EEE y Suiza ni desde países listados de bajo riesgo de rabia (EE. UU., Canadá, RU y otros).", pt: "Não é exigido a partir da UE/EEE e da Suíça nem de países listados de baixo risco de raiva (EUA, Canadá, Reino Unido e outros)." }
    ref: { en: "ALKVW llv.li; Swiss FSVO — rabies-risk country list", fr: "ALKVW llv.li ; OSAV suisse — liste des pays à risque rabique", es: "ALKVW llv.li; FSVO suiza — lista de países con riesgo de rabia", pt: "ALKVW llv.li; OSAV suíço — lista dos países de risco de raiva" }
  - item: { en: "Pet passport", fr: "Passeport pour animal de compagnie", es: "Pasaporte para mascotas", pt: "Passaporte para animais" }
    required: { en: "EU/EEA & Swiss origins", fr: "Origines UE/EEE et suisses", es: "Orígenes de la UE/EEE y de Suiza", pt: "Origens da UE/EEE e da Suíça" }
    when: { en: "Records the microchip and rabies vaccination; the EU and Swiss passports are mutually recognised.", fr: "Consigne la puce et la vaccination ; les passeports européen et suisse sont mutuellement reconnus.", es: "Registra el microchip y la vacunación antirrábica; los pasaportes europeo y suizo se reconocen mutuamente.", pt: "Registra o microchip e a vacinação antirrábica; os passaportes europeu e suíço são mutuamente reconhecidos." }
    exceptions: { en: "Replaced by a health certificate for third-country origins.", fr: "Remplacé par un certificat sanitaire pour les origines pays tiers.", es: "Se sustituye por un certificado sanitario para orígenes de países terceros.", pt: "Substituído por um certificado sanitário nas origens de países terceiros." }
    ref: { en: "ALKVW llv.li", fr: "ALKVW llv.li", es: "ALKVW llv.li", pt: "ALKVW llv.li" }
  - item: { en: "Animal health certificate", fr: "Certificat sanitaire", es: "Certificado sanitario animal", pt: "Atestado de saúde animal" }
    required: { en: "Third-country origins", fr: "Origines pays tiers", es: "Orígenes de países terceros", pt: "Origens de países terceiros" }
    when: { en: "Issued/endorsed by an official vet before departure; the same template used for entry into Switzerland applies.", fr: "Établi/visé par un vétérinaire officiel avant départ ; le modèle utilisé pour l'entrée en Suisse s'applique.", es: "Expedido/refrendado por un veterinario oficial antes de la salida; se aplica el mismo modelo usado para la entrada en Suiza.", pt: "Emitido/endossado por um veterinário oficial antes da partida; vale o mesmo modelo usado para a entrada na Suíça." }
    exceptions: { en: "Not needed for EU/EEA or Swiss origins (pet passport instead).", fr: "Inutile pour les origines UE/EEE ou suisses (passeport à la place).", es: "No necesario para orígenes de la UE/EEE o de Suiza (en su lugar, el pasaporte para mascotas).", pt: "Desnecessário nas origens da UE/EEE ou da Suíça (o passaporte para animais faz esse papel)." }
    ref: { en: "ALKVW llv.li; Swiss FSVO blv.admin.ch", fr: "ALKVW llv.li ; OSAV suisse blv.admin.ch", es: "ALKVW llv.li; FSVO suiza blv.admin.ch", pt: "ALKVW llv.li; OSAV suíço blv.admin.ch" }
  - item: { en: "Tapeworm (Echinococcus) treatment", fr: "Traitement échinococcose", es: "Tratamiento contra la tenia (Echinococcus)", pt: "Tratamento contra a tênia (Echinococcus)" }
    required: { en: "Not required", fr: "Non requis", es: "No obligatorio", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
    exceptions: { en: "Liechtenstein does not require Echinococcus treatment on entry.", fr: "Le Liechtenstein n'exige pas de traitement contre l'échinococcose à l'entrée.", es: "Liechtenstein no exige tratamiento contra Echinococcus a la entrada.", pt: "O Liechtenstein não exige tratamento contra Echinococcus na entrada." }
    ref: { en: "ALKVW llv.li", fr: "ALKVW llv.li", es: "ALKVW llv.li", pt: "ALKVW llv.li" }
  - item: { en: "Maximum number of pets", fr: "Nombre maximum d'animaux", es: "Número máximo de mascotas", pt: "Número máximo de animais" }
    required: { en: "Up to 5 pets", fr: "Jusqu'à 5 animaux", es: "Hasta 5 mascotas", pt: "Até 5 animais" }
    when: { en: "A maximum of five pets (dogs, cats, ferrets) per person may enter under the non-commercial pet-travel rules.", fr: "Au maximum cinq animaux (chiens, chats, furets) par personne peuvent entrer sous le régime non commercial du voyage d'animaux.", es: "Un máximo de cinco mascotas (perros, gatos, hurones) por persona puede entrar conforme a las normas de viaje de mascotas no comercial.", pt: "No máximo cinco animais de estimação (cães, gatos, furões) por pessoa podem entrar segundo as regras de viagem não comercial de animais de companhia." }
    exceptions: { en: "More than five animals is treated as a commercial import with stricter rules.", fr: "Plus de cinq animaux relève de l'importation commerciale, avec des règles plus strictes.", es: "Más de cinco animales se considera una importación comercial con normas más estrictas.", pt: "Mais de cinco animais é tratado como importação comercial, com regras mais rígidas." }
    ref: { en: "ALKVW llv.li", fr: "ALKVW llv.li", es: "ALKVW llv.li", pt: "ALKVW llv.li" }
  - item: { en: "Border check / customs declaration", fr: "Contrôle frontalier / déclaration en douane", es: "Control fronterizo / declaración en aduanas", pt: "Controle de fronteira / declaração aduaneira" }
    required: { en: "Third-country arrivals", fr: "Arrivées pays tiers", es: "Llegadas de países terceros", pt: "Chegadas de países terceiros" }
    when: { en: "As Liechtenstein has no international airport, dogs arrive overland or via Switzerland; declare a third-country dog to customs on entry into the Swiss–Liechtenstein customs territory.", fr: "Le Liechtenstein n'ayant pas d'aéroport international, les chiens arrivent par voie terrestre ou via la Suisse ; déclare un chien pays tiers à la douane à l'entrée du territoire douanier suisse-liechtensteinois.", es: "Como Liechtenstein no tiene aeropuerto internacional, los perros llegan por vía terrestre o a través de Suiza; declara un perro de país tercero en aduanas al entrar en el territorio aduanero suizo-liechtensteiniano.", pt: "Como o Liechtenstein não tem aeroporto internacional, os cachorros chegam por via terrestre ou pela Suíça; declare na alfândega um cachorro vindo de país terceiro ao entrar no território aduaneiro suíço-liechtensteinense." }
    exceptions: { en: "No systematic check for arrivals from the EU/EEA or Switzerland — keep the passport with you.", fr: "Pas de contrôle systématique pour les arrivées de l'UE/EEE ou de Suisse — garde le passeport sur toi.", es: "Sin control sistemático para las llegadas desde la UE/EEE o Suiza — lleva contigo el pasaporte.", pt: "Sem controle sistemático nas chegadas da UE/EEE ou da Suíça — leve o passaporte com você." }
    ref: { en: "ALKVW llv.li; Swiss customs (FOCBS)", fr: "ALKVW llv.li ; douane suisse (OFDF)", es: "ALKVW llv.li; aduana suiza (FOCBS)", pt: "ALKVW llv.li; alfândega suíça (OFDF)" }
  - item: { en: "Puppies / minimum age", fr: "Chiots / âge minimum", es: "Cachorros / edad mínima", pt: "Filhotes / idade mínima" }
    required: { en: "Effectively ≥15 weeks", fr: "En pratique ≥15 semaines", es: "En la práctica ≥15 semanas", pt: "Na prática, ≥15 semanas" }
    when: { en: "Earliest rabies vaccination at 12 weeks plus a 21-day wait, so puppies may enter no earlier than 15 weeks of age.", fr: "Vaccination antirabique au plus tôt à 12 semaines plus 21 jours d'attente : un chiot ne peut donc entrer avant l'âge de 15 semaines.", es: "Vacunación antirrábica lo antes posible a las 12 semanas más una espera de 21 días, por lo que los cachorros no pueden entrar antes de las 15 semanas de edad.", pt: "A vacinação antirrábica só é possível a partir das 12 semanas, mais 21 dias de espera: por isso os filhotes só podem entrar a partir das 15 semanas de idade." }
    exceptions: { en: "Unvaccinated young puppies cannot be brought in from outside the EU/EEA and Switzerland.", fr: "Les jeunes chiots non vaccinés ne peuvent pas être introduits depuis hors UE/EEE et Suisse.", es: "Los cachorros jóvenes sin vacunar no pueden introducirse desde fuera de la UE/EEE y Suiza.", pt: "Filhotes jovens não vacinados não podem ser trazidos de fora da UE/EEE e da Suíça." }
    ref: { en: "ALKVW llv.li; Swiss FSVO blv.admin.ch", fr: "ALKVW llv.li ; OSAV suisse blv.admin.ch", es: "ALKVW llv.li; FSVO suiza blv.admin.ch", pt: "ALKVW llv.li; OSAV suíço blv.admin.ch" }
  - item: { en: "Quarantine", fr: "Quarantaine", es: "Cuarentena", pt: "Quarentena" }
    required: { en: "Not required", fr: "Non requise", es: "No obligatoria", pt: "Não obrigatório" }
    when: { en: "—", fr: "—", es: "—", pt: "—" }
