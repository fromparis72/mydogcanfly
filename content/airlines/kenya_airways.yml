name: Kenya Airways
titleH1:
  en: Flying with a dog on Kenya Airways
  fr: Voyager avec un chien sur Kenya Airways
  es: Volar con un perro en Kenya Airways
  pt: "Viajar com um cachorro na Kenya Airways"
metaDesc:
  en: "Kenya Airways pet policy: no pets in the cabin or the hold, live animals as cargo only, certified assistance dogs on direct flights, and official sources."
  fr: "Politique animaux Kenya Airways : aucun animal en cabine ni en soute, animaux vivants en fret uniquement, chiens d'assistance certifiés sur vols directs, et sources officielles."
  es: "Política de mascotas de Kenya Airways: sin animales en cabina ni en bodega, animales vivos solo como carga, perros de asistencia certificados en vuelos directos, y fuentes oficiales."
  pt: "Política de animais da Kenya Airways: nenhum animal na cabine ou no porão, animais vivos somente como carga, cães de assistência certificados em voos diretos, e fontes oficiais."
