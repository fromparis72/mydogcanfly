verdict:
  cls: "no"
  label:
    en: No pets
    fr: Aucun animal
    es: Sin mascotas
    pt: "Sem animais"
verdictNote:
  en: Kenya Airways carries no pet in the cabin or in the hold. "Live animals shall be consigned as cargo only" — cargo is the single route, and a certified assistance dog on a direct flight is the only exception.
  fr: "Kenya Airways ne transporte aucun animal en cabine ni en soute. « Live animals shall be consigned as cargo only » — le fret est la seule voie, et le chien d'assistance certifié sur vol direct la seule exception."
  es: "Kenya Airways no transporta ninguna mascota en cabina ni en bodega. «Live animals shall be consigned as cargo only»: la carga es la única vía, y el perro de asistencia certificado en vuelo directo, la única excepción."
  pt: "A Kenya Airways não transporta nenhum animal na cabine nem no porão. \"Live animals shall be consigned as cargo only\" — a carga é o único caminho, e o cão de assistência certificado em voo direto, a única exceção."
