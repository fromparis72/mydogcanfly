channels:
  - icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: "no"
    statusLabel:
      en: Forbidden
      fr: Interdit
      es: Prohibido
      pt: "Proibido"
    detail:
      en: No pet is accepted in the cabin, whatever its size or carrier. Only a certified assistance dog travels with you, and only on a direct flight.
      fr: Aucun animal n'est accepté en cabine, quels que soient sa taille ou son sac. Seul un chien d'assistance certifié voyage avec toi, et seulement sur un vol direct.
      es: No se acepta ninguna mascota en cabina, sea cual sea su tamaño o su transportín. Solo un perro de asistencia certificado viaja contigo, y únicamente en vuelo directo.
      pt: "Nenhum animal é aceito na cabine, seja qual for o tamanho ou a bolsa. Somente um cão de assistência certificado viaja com você, e apenas em voo direto."
    fee:
      en: —
      fr: —
      es: —
      pt: "—"
  - icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: "no"
    statusLabel:
      en: Not carried
      fr: Non transporté
      es: No se transporta
      pt: "Não transportado"
    detail:
      en: Kenya Airways carries no animal as checked baggage. There is no pet-in-hold product to book, at any price, on any route.
      fr: Kenya Airways ne transporte aucun animal en bagage enregistré. Il n'existe aucune offre soute à réserver, à aucun prix, sur aucune route.
      es: Kenya Airways no transporta ningún animal como equipaje facturado. No existe ningún producto de bodega que reservar, a ningún precio ni en ninguna ruta.
      pt: "A Kenya Airways não transporta nenhum animal como bagagem despachada. Não existe produto de porão para reservar, a nenhum preço, em nenhuma rota."
    fee:
      en: —
      fr: —
      es: —
      pt: "—"
  - icon: ✈️
    name:
      en: Cargo
      fr: Fret
      es: Carga
      pt: "Carga"
    cls: warn
    statusLabel:
      en: The only route
      fr: La seule voie
      es: La única vía
      pt: "O único caminho"
    detail:
      en: The airline's own wording is that live animals shall be consigned as cargo only. The passenger pet page publishes no rate, crate standard or breed rule for those shipments — everything is handled by Kenya Airways Cargo.
      fr: La compagnie écrit elle-même que les animaux vivants doivent être expédiés en fret uniquement. La page animaux passagers ne publie ni tarif, ni norme de caisse, ni règle de race pour ces expéditions — tout passe par Kenya Airways Cargo.
      es: "La propia aerolínea escribe que los animales vivos deben enviarse únicamente como carga. La página de mascotas para pasajeros no publica ninguna tarifa, norma de jaula ni regla de raza para esos envíos: todo lo gestiona Kenya Airways Cargo."
      pt: "A própria companhia escreve que animais vivos devem ser despachados apenas como carga. A página de animais para passageiros não publica tarifa, padrão de caixa nem regra de raça para esses envios — tudo passa pela Kenya Airways Cargo."
    fee:
      en: Not published
      fr: Non publié
      es: No publicado
      pt: "Não publicado"
