    sub: ≤ 8 kg
  - flex: 66
    color: "#1f5fa8"
    label:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    sub: "> 8 kg"
  - flex: 20
    color: "#9a6410"
