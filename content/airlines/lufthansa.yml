id: airline_lufthansa
mono: LH
name: Lufthansa
titleH1:
  en: Flying with a dog on Lufthansa
  fr: Voyager avec un chien sur Lufthansa
  es: Viajar con un perro en Lufthansa
  pt: "Viajar com um cachorro na Lufthansa"
metaDesc:
  en: "Lufthansa pet policy: cabin, air-conditioned hold and Lufthansa Cargo rules, fares, breed limits and official sources."
  fr: "Politique animaux Lufthansa : cabine, soute climatisée et Lufthansa Cargo, tarifs, restrictions de races et sources officielles."
  es: "Política de mascotas de Lufthansa: cabina, bodega climatizada y normas de Lufthansa Cargo, tarifas, límites por raza y fuentes oficiales."
  pt: "Política de animais da Lufthansa: cabine, porão climatizado e regras da Lufthansa Cargo, tarifas, limites por raça e fontes oficiais."
chips:
  - icon: ✈
    label:
      en: Star Alliance
      fr: Star Alliance
      es: Star Alliance
      pt: "Star Alliance"
  - icon: 📍
    label:
      en: Germany · FRA / MUC
      fr: Allemagne · FRA / MUC
      es: Alemania · FRA / MUC
      pt: "Alemanha · FRA / MUC"
  - icon: 🗓
    label:
      en: Updated 11 Jul 2026
      fr: Mise à jour le 11 juil. 2026
      es: Actualizado el 11 jul. 2026
      pt: "Atualizado em 11 jul. 2026"
verdict:
  cls: warn
  label:
    en: Moderate
    fr: Modéré
    es: Moderado
    pt: "Moderada"
verdictNote:
  en: Cats & dogs in the cabin (≤ 8 kg) or the air-conditioned hold — snub-nosed breeds barred from the hold.
  fr: Chats et chiens en cabine (≤ 8 kg) ou en soute climatisée — races au nez écrasé interdites en soute.
  es: Gatos y perros en cabina (≤ 8 kg) o en la bodega climatizada; las razas de hocico chato no pueden viajar en bodega.
  pt: "Gatos e cachorros na cabine (≤ 8 kg) ou no porão climatizado — raças de focinho achatado proibidas no porão."
ladder:
  - flex: 14
    color: "#16794f"
    label:
