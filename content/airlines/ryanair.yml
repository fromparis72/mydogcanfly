  es: Viajar con un perro en Ryanair
  pt: "Viajar com um cachorro na Ryanair"
metaDesc:
  en: "Ryanair pet policy: no pets carried, only accredited assistance dogs on eligible routes, and official sources."
  fr: "Politique animaux Ryanair : aucun animal transporté, seulement les chiens d'assistance accrédités sur certaines routes, et sources officielles."
  es: "Política de mascotas de Ryanair: no se transportan mascotas, solo perros de asistencia acreditados en rutas elegibles, y fuentes oficiales."
  pt: "Política de animais da Ryanair: nenhum animal transportado, somente cães de assistência credenciados em rotas elegíveis, e fontes oficiais."
