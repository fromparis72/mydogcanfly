    pt: "Três zonas publicadas, em euros. Nenhuma tarifa de carga é publicada."
restrictions:
  - icon: 🐶
    title:
      en: Flat-faced breeds
      fr: Races brachycéphales
      es: Razas de hocico chato
      pt: "Raças de focinho achatado"
    pills:
      - cls: ok
        label:
          en: Cabin allowed
          fr: Cabine autorisée
          es: Cabina permitida
          pt: "Cabine permitida"
      - cls: "no"
        label:
          en: Hold forbidden
          fr: Soute interdite
          es: Bodega prohibida
          pt: "Porão proibido"
    note:
      en: "Flat-faced breeds are barred from the hold on every flight — the list is published as a PDF. There is no flat-faced ban in the cabin: under 8 kg with the cage, a pug or a Shih Tzu travels with you in the seat row."
      fr: "Les races brachycéphales sont interdites en soute sur tous les vols — la liste est publiée en PDF. Aucune interdiction brachycéphale en cabine : sous 8 kg avec la cage, un carlin ou un shih tzu voyage avec toi à ta place."
      es: "Las razas braquicéfalas están prohibidas en bodega en todos los vuelos; la lista se publica en PDF. En cabina no hay ninguna prohibición braquicéfala: por debajo de 8 kg con la jaula, un carlino o un Shih Tzu viaja contigo en tu fila."
      pt: "As raças braquicefálicas são proibidas no porão em todos os voos — a lista é publicada em PDF. Na cabine não há proibição braquicefálica: abaixo de 8 kg com a caixa, um pug ou um Shih Tzu viaja com você na sua fileira."
  - icon: 🚫
    title:
      en: Banned breeds
      fr: Races interdites
      es: Razas prohibidas
      pt: "Raças proibidas"
    pills:
      - cls: "no"
        label:
          en: Hold forbidden
          fr: Soute interdite
          es: Bodega prohibida
          pt: "Porão proibido"
      - cls: "no"
        label:
          en: Assistance dogs too
          fr: Chiens d'assistance aussi
          es: También perros de asistencia
          pt: "Cães de assistência também"
    note:
      en: TAROM publishes a separate list of banned breeds. It applies to the hold and, unusually, also to assistance dogs — being a certified assistance dog does not lift the breed ban.
      fr: TAROM publie une liste distincte de races interdites. Elle s'applique à la soute et, fait rare, aussi aux chiens d'assistance — être un chien d'assistance certifié ne lève pas l'interdiction de race.
      es: "TAROM publica una lista aparte de razas prohibidas. Se aplica a la bodega y, algo poco frecuente, también a los perros de asistencia: ser perro de asistencia certificado no levanta la prohibición por raza."
      pt: "A TAROM publica uma lista separada de raças proibidas. Ela vale para o porão e, algo raro, também para cães de assistência — ser cão de assistência certificado não suspende a proibição por raça."
temperature:
  pills:
    - cls: warn
      label:
        en: "Temperature limits: not disclosed"
        fr: "Limites de température : non communiqué"
        es: "Límites de temperatura: no comunicado"
        pt: "Limites de temperatura: não divulgados"
  note:
    en: TAROM publishes no hold-temperature limits and no seasonal embargo on its pet pages.
    fr: TAROM ne publie pas de limites de température en soute ni d'embargo saisonnier sur ses pages animaux.
    es: TAROM no publica límites de temperatura en bodega ni embargo estacional en sus páginas de mascotas.
    pt: "A TAROM não publica limites de temperatura no porão nem embargo sazonal em suas páginas sobre animais."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: Assistance dogs travel free in the cabin, with 48 h notice and form 4113.
      fr: Les chiens d'assistance voyagent gratuitement en cabine, avec un préavis de 48 h et le formulaire 4113.
      es: Los perros de asistencia viajan gratis en cabina, con 48 h de preaviso y el formulario 4113.
      pt: "Cães de assistência viajam grátis na cabine, com aviso de 48 h e o formulário 4113."
  - icon: 🚫
    label:
      en: Emotional support
      fr: Soutien émotionnel
      es: Apoyo emocional
      pt: "Apoio emocional"
    value:
      en: Emotional support and psychiatric assistance animals are refused. Only trained assistance dogs qualify, and the banned-breed list still applies to them.
      fr: Les animaux de soutien émotionnel et d'assistance psychiatrique sont refusés. Seuls les chiens d'assistance dressés sont admis, et la liste des races interdites leur reste applicable.
      es: Los animales de apoyo emocional y de asistencia psiquiátrica son rechazados. Solo se admiten perros de asistencia adiestrados, y la lista de razas prohibidas les sigue aplicando.
      pt: "Animais de apoio emocional e de assistência psiquiátrica são recusados. Só cães de assistência treinados são aceitos, e a lista de raças proibidas continua valendo para eles."
goodToKnow:
  - icon: ⚠️
    label:
      en: Two pages disagree on the ATR
      fr: Deux pages se contredisent sur l'ATR
      es: Dos páginas se contradicen sobre el ATR
      pt: "Duas páginas se contradizem sobre o ATR"
    value:
      en: "The cabin page says the ATR 72 takes two cages in the cabin; the fares page says these animals cannot be carried on ATR aircraft at all. We publish the cabin-page figure and flag the conflict rather than arbitrate — note that the fares page is the more recently rebuilt of the two. Confirm with TAROM if your flight is on an ATR."
      fr: "La page cabine indique que l'ATR 72 accepte deux cages en cabine ; la page tarifaire indique que ces animaux ne peuvent pas être transportés sur les avions de type ATR. On publie le chiffre de la page cabine et on signale le conflit plutôt que de trancher — sachant que la page tarifaire est la plus récemment reconstruite des deux. Fais confirmer par TAROM si ton vol est sur ATR."
      es: "La página de cabina dice que el ATR 72 admite dos jaulas en cabina; la página de tarifas dice que esos animales no pueden transportarse en aviones de tipo ATR. Publicamos la cifra de la página de cabina y señalamos el conflicto en lugar de arbitrar, teniendo en cuenta que la página de tarifas es la más recientemente rehecha de las dos. Confírmalo con TAROM si tu vuelo es en ATR."
      pt: "A página da cabine diz que o ATR 72 aceita duas caixas na cabine; a página de tarifas diz que esses animais não podem ser transportados em aeronaves do tipo ATR. Publicamos o número da página da cabine e sinalizamos o conflito em vez de arbitrar — lembrando que a página de tarifas é a mais recentemente reconstruída das duas. Confirme com a TAROM se o seu voo for em ATR."
  - icon: 🛩️
    label:
      en: No hold on the A320
      fr: Pas de soute sur A320
      es: Sin bodega en el A320
      pt: "Sem porão no A320"
    value:
      en: The hold is closed to animals on the A320, a common aircraft on this network. Check the aircraft type before you book, not just the route.
      fr: La soute est fermée aux animaux sur A320, un appareil courant sur ce réseau. Vérifie le type d'avion avant de réserver, pas seulement la route.
      es: La bodega está cerrada a los animales en el A320, un avión habitual en esta red. Comprueba el tipo de avión antes de reservar, no solo la ruta.
      pt: "O porão está fechado para animais no A320, uma aeronave comum nessa malha. Confira o tipo de aeronave antes de reservar, não só a rota."
  - icon: 👤
    label:
      en: Accompanying passenger
      fr: Passager accompagnant
      es: Pasajero acompañante
      pt: "Passageiro acompanhante"
    value:
      en: The cabin is refused if the accompanying passenger is an unaccompanied minor, an infant under 2, or a wheelchair user.
      fr: La cabine est refusée si le passager accompagnant est un mineur non accompagné, un bébé de moins de 2 ans, ou un passager en fauteuil roulant.
      es: Se rechaza la cabina si el pasajero acompañante es un menor no acompañado, un bebé de menos de 2 años o un pasajero en silla de ruedas.
      pt: "A cabine é recusada se o passageiro acompanhante for um menor desacompanhado, um bebê com menos de 2 anos ou um passageiro em cadeira de rodas."
  - icon: 🕳️
    label:
      en: What is missing
      fr: Ce qui manque
      es: Lo que falta
      pt: "O que falta"
    value:
      en: "Not published: minimum age for the cabin, temperature thresholds, cargo rates, and any list of closed destinations — the UK/UAE restriction reported in the press appears on no TAROM page."
      fr: "Non publiés : âge minimal en cabine, seuils de température, tarifs fret, et toute liste de destinations fermées — la restriction Royaume-Uni/Émirats qui circule dans la presse n'apparaît sur aucune page TAROM."
      es: "No publicados: edad mínima en cabina, umbrales de temperatura, tarifas de carga ni lista alguna de destinos cerrados; la restricción Reino Unido/Emiratos que circula en la prensa no aparece en ninguna página de TAROM."
      pt: "Não publicados: idade mínima na cabine, limites de temperatura, tarifas de carga e qualquer lista de destinos fechados — a restrição Reino Unido/Emirados que circula na imprensa não aparece em nenhuma página da TAROM."
