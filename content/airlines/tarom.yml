id: airline_tarom
mono: RO
name: TAROM
titleH1:
  en: Flying with a dog on TAROM
  fr: Voyager avec un chien sur TAROM
  es: Volar con un perro en TAROM
  pt: "Viajar com um cachorro na TAROM"
metaDesc:
  en: "TAROM pet policy: 8 kg in the cabin, hold up to 75 kg but closed on the A320, three-zone fares in euros, flat-faced breeds allowed in the cabin only."
  fr: "Politique animaux TAROM : 8 kg en cabine, soute jusqu'à 75 kg mais fermée sur A320, tarifs en euros par zone, brachycéphales acceptés en cabine uniquement."
  es: "Política de mascotas de TAROM: 8 kg en cabina, bodega hasta 75 kg pero cerrada en el A320, tarifas en euros por zona, razas de hocico chato solo en cabina."
  pt: "Política de animais da TAROM: 8 kg na cabine, porão até 75 kg mas fechado no A320, tarifas em euros por zona, raças de focinho achatado somente na cabine."
