    sub: ≤ 8 kg
  - flex: 58
    color: "#1f5fa8"
    label:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    sub:
      en: 8–75 kg crate incl.
      fr: 8–75 kg caisse comprise
      es: 8–75 kg jaula incl.
      pt: "8–75 kg com a caixa"
  - flex: 30
    color: "#9a6410"
    label:
      en: Cargo
      fr: Fret
      es: Carga
      pt: "Carga"
    sub:
      en: dogs > 40 kg
      fr: chiens > 40 kg
      es: perros > 40 kg
      pt: "cachorros > 40 kg"
channels:
  - icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: 8 kg cage included, 42 × 26 × 20 cm. Rigid cage or soft bag — but on ATR aircraft only soft bags are accepted. One cage per passenger; several animals may share it if they know each other and the total stays under 8 kg. Two cages per ATR 72, three per Boeing 737. The animal must fit entirely inside the carrier, tail included.
      fr: 8 kg cage comprise, 42 × 26 × 20 cm. Cage rigide ou sac souple — mais sur ATR, seuls les sacs souples sont admis. Une seule cage par passager ; plusieurs animaux peuvent la partager s'ils se connaissent et si le total reste sous 8 kg. Deux cages par ATR 72, trois par Boeing 737. L'animal doit tenir entièrement dans le contenant, queue comprise.
      es: 8 kg con la jaula incluida, 42 × 26 × 20 cm. Jaula rígida o bolso blando, pero en los ATR solo se admiten bolsos blandos. Una sola jaula por pasajero; varios animales pueden compartirla si se conocen y el total no supera los 8 kg. Dos jaulas por ATR 72, tres por Boeing 737. El animal debe caber por completo dentro del contenedor, con la cola incluida.
      pt: "8 kg com a caixa incluída, 42 × 26 × 20 cm. Caixa rígida ou bolsa maleável — mas nos ATR só são aceitas bolsas maleáveis. Uma única caixa por passageiro; vários animais podem dividi-la se já se conhecem e se o total ficar abaixo de 8 kg. Duas caixas por ATR 72, três por Boeing 737. O animal precisa caber inteiro dentro do contêiner, rabo incluído."
    fee:
      en: €40 / €65 / €120 by zone
      fr: 40 € / 65 € / 120 € selon la zone
      es: 40 € / 65 € / 120 € según la zona
      pt: "40 € / 65 € / 120 € conforme a zona"
  - icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: warn
    statusLabel:
      en: Not on the A320
      fr: Sauf sur A320
      es: Salvo en el A320
      pt: "Exceto no A320"
    detail:
      en: Above 8 kg and up to 75 kg cage included, from 12 weeks old. Forbidden on the A320 — a common aircraft on this network. ATR 72 takes one crate of 71 × 50 × 51 cm, the Boeing 737 two crates of 122 × 82 × 84 cm. Book 48 h ahead, or 24 h through the call centre. The animal must not be sedated, and travels without leash or muzzle.
      fr: Au-delà de 8 kg et jusqu'à 75 kg cage comprise, à partir de 12 semaines. Interdite sur A320 — un appareil pourtant courant sur ce réseau. L'ATR 72 prend une caisse de 71 × 50 × 51 cm, le Boeing 737 deux caisses de 122 × 82 × 84 cm. Réservation 48 h avant, ou 24 h par le centre d'appels. L'animal ne doit pas être tranquillisé, et voyage sans laisse ni muselière.
      es: Por encima de 8 kg y hasta 75 kg con la jaula incluida, a partir de las 12 semanas. Prohibida en el A320, un avión habitual en esta red. El ATR 72 admite una jaula de 71 × 50 × 51 cm y el Boeing 737 dos jaulas de 122 × 82 × 84 cm. Reserva 48 h antes, o 24 h por el call center. El animal no debe ir sedado y viaja sin correa ni bozal.
      pt: "Acima de 8 kg e até 75 kg com a caixa incluída, a partir de 12 semanas. Proibido no A320 — aeronave, aliás, comum nessa malha. O ATR 72 aceita uma caixa de 71 × 50 × 51 cm e o Boeing 737, duas caixas de 122 × 82 × 84 cm. Reserve 48 h antes, ou 24 h pelo call center. O animal não pode estar sedado e viaja sem coleira nem focinheira."
    fee:
      en: €60 / €110 / €220 by zone
      fr: 60 € / 110 € / 220 € selon la zone
      es: 60 € / 110 € / 220 € según la zona
      pt: "60 € / 110 € / 220 € conforme a zona"
  - icon: ✈️
    name:
      en: Cargo
      fr: Fret
      es: Carga
      pt: "Carga"
    cls: warn
    statusLabel:
      en: Compulsory in three cases
      fr: Obligatoire dans trois cas
      es: Obligatoria en tres casos
      pt: "Obrigatória em três casos"
    detail:
      en: Cargo is the only route for any species other than dogs and cats, for dogs over 40 kg (crate with a solid wood frame), and once the number of crates allowed on the aircraft is used up.
      fr: Le fret est la seule voie pour toute espèce autre que chien et chat, pour les chiens de plus de 40 kg (caisse à cadre en bois massif), et dès que le nombre de caisses admis dans l'avion est atteint.
      es: La carga es la única vía para cualquier especie que no sea perro o gato, para los perros de más de 40 kg (jaula con marco de madera maciza) y en cuanto se agota el número de jaulas admitidas en el avión.
      pt: "A carga é a única via para qualquer espécie que não seja cachorro ou gato, para cachorros acima de 40 kg (caixa com estrutura de madeira maciça) e assim que o número de caixas admitidas na aeronave se esgota."
    fee:
      en: Not published
      fr: Non publié
      es: No publicado
      pt: "Não publicado"
