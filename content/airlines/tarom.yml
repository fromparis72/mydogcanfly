  cls: warn
  label:
    en: Possible
    fr: Sous conditions
    es: Con condiciones
    pt: "Com condições"
verdictNote:
  en: Clear zone fares and generous weight limits, but the hold is closed on the A320 and two official pages disagree about pets in the cabin on ATR aircraft.
  fr: Tarifs par zone clairs et limites de poids généreuses, mais la soute est fermée sur A320 et deux pages officielles se contredisent sur les animaux en cabine sur ATR.
  es: Tarifas por zona claras y límites de peso generosos, pero la bodega está cerrada en el A320 y dos páginas oficiales se contradicen sobre las mascotas en cabina en los ATR.
  pt: "Tarifas por zona claras e limites de peso generosos, mas o porão está fechado no A320 e duas páginas oficiais se contradizem sobre animais na cabine nos ATR."
