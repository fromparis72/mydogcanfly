id: airline_westjet
mono: WS
name: WestJet
titleH1:
  en: Flying with a dog on WestJet
  fr: Voyager avec un chien sur WestJet
  es: Volar con un perro en WestJet
  pt: "Viajar com um cachorro na WestJet"
metaDesc:
  en: "WestJet pet policy: cabin, hold and WestJet Cargo, CAD fares, snub-nosed cargo rule, excluded destinations and official sources."
  fr: "Politique animaux WestJet : cabine, soute et WestJet Cargo, tarifs CAD, règle brachy en fret, destinations exclues et sources officielles."
  es: "Política de mascotas de WestJet: cabina, bodega y WestJet Cargo, tarifas en CAD, regla de carga para hocico chato, destinos excluidos y fuentes oficiales."
  pt: "Política de animais da WestJet: cabine, porão e WestJet Cargo, tarifas em CAD, regra de carga para focinho achatado, destinos excluídos e fontes oficiais."
chips:
  - icon: 📍
    label:
      en: Canada · YYC
      fr: Canada · YYC
      es: Canadá · YYC
      pt: "Canadá · YYC"
  - icon: 🗓
    label:
      en: Updated 11 Jul 2026
      fr: Mise à jour le 11 juil. 2026
      es: Actualizado el 11 jul. 2026
      pt: "Atualizado em 11 jul. 2026"
verdict:
  cls: warn
  label:
    en: Moderate
    fr: Modéré
    es: Moderado
    pt: "Moderada"
verdictNote:
  en: Small pets in the cabin, larger in the hold — but snub-nosed breeds cargo-only and many destinations excluded.
  fr: Petits animaux en cabine, plus grands en soute — mais races au nez écrasé en fret uniquement et de nombreuses destinations exclues.
  es: Mascotas pequeñas en cabina, las más grandes en bodega, pero las razas de hocico chato solo en carga y muchos destinos excluidos.
  pt: "Animais pequenos na cabine, os maiores no porão — mas raças de focinho achatado somente na carga, e muitos destinos excluídos."
