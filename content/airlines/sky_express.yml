titleH1:
  en: Flying with a dog on Sky Express
  fr: Voyager avec un chien sur Sky Express
  es: Volar con un perro en Sky Express
  pt: "Viajar com um cachorro na Sky Express"
metaDesc:
  en: "Sky Express pet policy: 8 kg in the cabin, hold up to 25 kg — but not to or from the United Kingdom, a route the airline still flies."
  fr: "Politique animaux Sky Express : 8 kg en cabine, soute jusqu'à 25 kg — sauf vers ou depuis le Royaume-Uni, une destination pourtant desservie."
  es: "Política de mascotas de Sky Express: 8 kg en cabina, bodega hasta 25 kg — excepto hacia o desde el Reino Unido, un destino que la aerolínea sigue volando."
  pt: "Política de animais da Sky Express: 8 kg na cabine, porão até 25 kg — exceto para ou do Reino Unido, destino que a companhia continua operando."
