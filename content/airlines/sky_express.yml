verdictNote:
  en: Cabin and hold are both open and inexpensive on this Greek-islands specialist, but the fleet-type restriction (hold is ATR-only) and the blanket UK ban are easy to miss.
  fr: Cabine et soute sont ouvertes et peu coûteuses chez ce spécialiste des îles grecques, mais la restriction par type d'avion (soute réservée aux ATR) et l'interdiction totale vers le Royaume-Uni passent facilement inaperçues.
  es: "Cabina y bodega están abiertas y son económicas en esta aerolínea especializada en las islas griegas, pero la restricción por tipo de avión (bodega solo en ATR) y la prohibición total hacia el Reino Unido son fáciles de pasar por alto."
  pt: "Cabine e porão estão abertos e são baratos nesta especialista em ilhas gregas, mas a restrição por tipo de aeronave (porão só em ATR) e a proibição total para o Reino Unido passam facilmente despercebidas."
