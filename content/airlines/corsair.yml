channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: One pet ≤ 8 kg incl. carrier in a soft carrier under the seat; min 2 months, microchipped. Declare 72 h ahead. Not to/from Mauritius.
      fr: Un animal ≤ 8 kg avec le sac dans un sac souple sous le siège ; min 2 mois, pucé. Déclarer 72 h à l'avance. Pas vers/depuis Maurice.
      es: Una mascota ≤ 8 kg incl. jaula, en una jaula blanda bajo el asiento; mín. 2 meses, con microchip. Declárala 72 h antes. No hacia/desde Mauricio.
      pt: "Um animal ≤ 8 kg incl. bolsa de transporte, em uma bolsa de transporte macia sob o assento; mín. 2 meses, com microchip. Declare com 72 h de antecedência. Não de/para Maurício."
    fee:
      en: €75–150
      fr: 75–150 €
      es: 75–150 €
      pt: "75–150 €"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Over 8 kg, up to 50 kg incl. crate, in a rigid travel crate (no wheels/metal). Min 2 months, microchipped. Not Paris–Mauritius.
      fr: Au-delà de 8 kg, jusqu'à 50 kg avec la caisse, en caisse de transport rigide (sans roulettes/métal). Min 2 mois, pucé. Pas Paris–Maurice.
      es: Más de 8 kg, hasta 50 kg incl. jaula, en una jaula de transporte rígida (sin ruedas/metal). Mín. 2 meses, con microchip. No París–Mauricio.
      pt: "Acima de 8 kg, até 50 kg incl. caixa de transporte, em uma caixa de transporte rígida (sem rodas/metal). Mín. 2 meses, com microchip. Não em Paris–Maurício."
    fee:
      en: €150–300
      fr: 150–300 €
      es: 150–300 €
      pt: "150–300 €"
  - placement: cargo
    icon: ✈️
    name:
      en: Cargo
      fr: Fret
      es: Carga
      pt: "Carga"
    cls: warn
    statusLabel:
      en: Via cargo
      fr: Via fret
      es: Mediante carga
      pt: "Via carga"
    detail:
      en: Over 50 kg total travels via cargo.
      fr: Au-delà de 50 kg au total, transport via fret.
      es: Por encima de 50 kg en total, se viaja mediante carga.
      pt: "Acima de 50 kg no total, o transporte é mediante carga."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
