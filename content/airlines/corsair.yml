verdictNote:
  en: Cats & dogs in the cabin or hold on Corsair routes — but breed rules and no pets to/from Mauritius.
  fr: Chats et chiens en cabine ou en soute sur les lignes Corsair — mais règles de races et rien vers/depuis Maurice.
  es: Gatos y perros en cabina o bodega en las rutas de Corsair, pero con reglas de raza y sin mascotas hacia/desde Mauricio.
  pt: "Gatos e cachorros na cabine ou no porão nas rotas da Corsair — mas com regras de raça e nenhum animal de/para Maurício."
