metaDesc:
  en: "Corsair pet policy: cabin, hold and cargo, fares by zone, snub-nosed hold ban, Mauritius exclusion and official sources."
  fr: "Politique animaux Corsair : cabine, soute et fret, tarifs par zone, interdiction soute brachy, exclusion Maurice et sources officielles."
  es: "Política de mascotas de Corsair: cabina, bodega y carga, tarifas por zona, veto en bodega a razas de hocico chato, exclusión de Mauricio y fuentes oficiales."
  pt: "Política de animais da Corsair: cabine, porão e carga, tarifas por zona, veto no porão a raças de focinho achatado, exclusão de Maurício e fontes oficiais."
