restrictions:
  - icon: 🐶
    title:
      en: Flat-faced breeds
      fr: Races brachycéphales
      es: Razas de hocico chato
      pt: "Raças de focinho achatado"
    pills:
      - cls: ok
        label:
          en: Cabin possible
          fr: Cabine possible
          es: Cabina posible
          pt: "Cabine possível"
      - cls: no
        label:
          en: Hold/cargo forbidden
          fr: Soute/fret interdits
          es: Bodega/carga prohibidas
          pt: "Porão/carga proibidos"
    note:
      en: "Snub-nosed dogs & cats aren't allowed in the hold or cargo (respiratory risk) — cabin only if within limits: boxers, bulldogs, pugs, Cane Corso, chow chow, mastiffs, Shih Tzu, Shar Pei, Staffordshire, American Bully, and Burmese/Exotic/Himalayan/Persian cats."
      fr: "Chiens et chats au nez écrasé interdits en soute et en fret (risque respiratoire) — cabine uniquement dans les limites : boxers, bouledogues, carlins, Cane Corso, chow chow, mastiffs, Shih Tzu, Shar Pei, Staffordshire, American Bully, et chats birmans/exotiques/himalayens/persans."
      es: "Los perros y gatos de hocico chato no se admiten en bodega ni en carga (riesgo respiratorio): solo cabina si están dentro de los límites: bóxers, bulldogs, carlinos, Cane Corso, chow chow, mastines, Shih Tzu, Shar Pei, Staffordshire, American Bully, y gatos birmanos/exóticos/himalayos/persas."
      pt: "Cachorros e gatos de focinho achatado não são permitidos no porão nem na carga (risco respiratório) — somente na cabine, se dentro dos limites: boxers, buldogues, pugs, Cane Corso, Chow Chow, mastins, Shih Tzu, Shar Pei, Staffordshire, American Bully, e gatos Burmês/Exótico/Himalaia/Persa."
  - icon: 🚫
    title:
      en: French categories 1 & 2
      fr: Catégories françaises 1 & 2
      es: Categorías francesas 1 y 2
      pt: "Categorias francesas 1 e 2"
    pills:
      - cls: no
        label:
          en: Category 1 refused
          fr: Catégorie 1 refusée
          es: Categoría 1 rechazada
          pt: "Categoria 1 recusada"
      - cls: warn
        label:
          en: Category 2 conditions
          fr: Catégorie 2 sous conditions
          es: Categoría 2 con condiciones
          pt: "Condições da categoria 2"
    note:
      en: French category 1 dogs (non-LOF pit-bull/Boerbull/Tosa, mastiffs) aren't accepted. Category 2 (LOF) dogs need proof of breed, liability insurance and a permit — cabin only if under 8 kg. Sedation isn't advised.
      fr: Les chiens de catégorie 1 (pit-bull/Boerbull/Tosa non-LOF, mastiffs) ne sont pas acceptés. Les chiens de catégorie 2 (LOF) nécessitent un justificatif de race, une assurance responsabilité civile et un permis — cabine uniquement si moins de 8 kg. Sédation déconseillée.
      es: "Los perros de categoría 1 francesa (pit bull/Boerbull/Tosa sin LOF, mastines) no se aceptan. Los perros de categoría 2 (LOF) necesitan justificante de raza, seguro de responsabilidad civil y un permiso: solo cabina si pesan menos de 8 kg. No se aconseja la sedación."
      pt: "Cachorros de categoria 1 francesa (pit bull/Boerbull/Tosa sem LOF, mastins) não são aceitos. Cachorros de categoria 2 (LOF) precisam de comprovante de raça, seguro de responsabilidade civil e uma autorização — somente na cabine se pesarem menos de 8 kg. Sedação não é recomendada."
temperature:
  pills:
    - cls: warn
      label:
        en: "Temperature limits: not disclosed"
        fr: "Limites de température : non communiqué"
        es: "Límites de temperatura: no comunicados"
        pt: "Limites de temperatura: não divulgados"
  note:
    en: Corsair publishes no hold-temperature limits or seasonal embargo on its pet page.
    fr: Corsair ne publie pas de limites de température en soute ni d'embargo saisonnier sur sa page animaux.
    es: Corsair no publica límites de temperatura de la bodega ni embargos estacionales en su página de mascotas.
    pt: "A Corsair não divulga limites de temperatura do porão nem embargo sazonal em sua página de animais."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: Guide dogs for the visually impaired travel free in the cabin, leashed throughout.
      fr: Les chiens guides pour déficients visuels voyagent gratuitement en cabine, en laisse tout le vol.
      es: Los perros guía para personas con discapacidad visual viajan gratis en cabina, con correa durante todo el vuelo.
      pt: "Cães-guia para pessoas com deficiência visual viajam gratuitamente na cabine, presos com guia durante todo o voo."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: Book ≥ 48 h ahead + a live-animal form. Health certificate (within 5 days) at check-in; rabies certificate except FDF/PTP/Mayotte/Réunion.
      fr: Réserver ≥ 48 h à l'avance + un formulaire animal vivant. Certificat sanitaire (moins de 5 jours) à l'enregistrement ; certificat de rage sauf FDF/PTP/Mayotte/Réunion.
      es: Reserva ≥ 48 h antes + un formulario de animal vivo. Certificado sanitario (de menos de 5 días) en la facturación; certificado de rabia salvo FDF/PTP/Mayotte/Reunión.
      pt: "Reserve ≥ 48 h antes + um formulário de animal vivo. Atestado de saúde (emitido em até 5 dias) no check-in; certificado de raiva, exceto para FDF/PTP/Mayotte/Reunião."
goodToKnow:
  - icon: 🚫
    label:
      en: No pets to Mauritius
      fr: Pas d'animaux vers Maurice
      es: Sin mascotas a Mauricio
      pt: "Nenhum animal para Maurício"
    value:
      en: Pet transport is prohibited to/from Mauritius (cabin, and Paris–Mauritius in the hold).
      fr: Le transport d'animaux est interdit vers/depuis Maurice (cabine, et Paris–Maurice en soute).
      es: El transporte de mascotas está prohibido hacia/desde Mauricio (cabina, y París–Mauricio en bodega).
      pt: "O transporte de animais é proibido de/para Maurício (cabine, e Paris–Maurício no porão)."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: A health certificate (within 5 days) is required at check-in; rabies except for the French Caribbean, Mayotte and Réunion.
      fr: Un certificat sanitaire (moins de 5 jours) est requis à l'enregistrement ; rage sauf pour les Antilles françaises, Mayotte et Réunion.
      es: Se exige un certificado sanitario (de menos de 5 días) en la facturación; rabia salvo para las Antillas francesas, Mayotte y Reunión.
      pt: "É exigido um atestado de saúde (emitido em até 5 dias) no check-in; raiva, exceto para o Caribe francês, Mayotte e Reunião."
  - icon: 🐾
    label:
      en: St Barth Executive
      fr: St Barth Executive
      es: St Barth Executive
      pt: "St Barth Executive"
    value:
      en: On St Barth Executive flights, pets under 7 kg fly free in the cabin; 7–12 kg in a travel crate at a checked-baggage fare.
      fr: Sur les vols St Barth Executive, les animaux de moins de 7 kg volent gratuitement en cabine ; 7–12 kg en caisse de transport au tarif bagage enregistré.
      es: En los vuelos de St Barth Executive, las mascotas de menos de 7 kg vuelan gratis en cabina; de 7 a 12 kg en una jaula de transporte a tarifa de equipaje facturado.
      pt: "Em voos St Barth Executive, animais com menos de 7 kg voam gratuitamente na cabine; de 7 a 12 kg em uma caixa de transporte, na tarifa de bagagem despachada."
