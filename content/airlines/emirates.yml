id: airline_emirates
mono: EK
name: Emirates
titleH1:
  en: Flying with a dog on Emirates
  fr: Voyager avec un chien sur Emirates
  es: Volar con un perro en Emirates
  pt: "Voar com um cachorro na Emirates"
metaDesc:
  en: "Emirates pet policy: no cabin pets, hold and SkyCargo rules, fares, restrictions and official sources."
  fr: "Politique animaux Emirates : pas d'animaux en cabine, soute et SkyCargo, tarifs, restrictions et sources officielles."
  es: "Política de mascotas de Emirates: sin mascotas en cabina, normas de bodega y SkyCargo, tarifas, restricciones y fuentes oficiales."
  pt: "Política de animais da Emirates: sem animais em cabine, regras de porão e SkyCargo, tarifas, restrições e fontes oficiais."
chips:
  - icon: 📍
    label:
      en: United Arab Emirates · DXB
      fr: Émirats arabes unis · DXB
      es: Emiratos Árabes Unidos · DXB
      pt: "Emirados Árabes Unidos · DXB"
  - icon: 🗓
    label:
      en: Updated 11 Jul 2026
      fr: Mise à jour le 11 juil. 2026
      es: Actualizado el 11 jul 2026
      pt: "Atualizado em 11 jul. 2026"
verdict:
  cls: no
  label:
    en: Hard
    fr: Difficile
    es: Difícil
    pt: "Difícil"
verdictNote:
  en: No pets in the cabin — dogs travel in the hold or via SkyCargo under strict conditions.
  fr: Pas d'animaux en cabine — les chiens voyagent en soute ou via SkyCargo, sous conditions strictes.
  es: Sin mascotas en cabina; los perros viajan en bodega o por SkyCargo bajo condiciones estrictas.
  pt: "Sem animais na cabine — os cachorros viajam no porão ou pela SkyCargo, sob condições rígidas."
ladder:
  - flex: 8
    color: "#8a94a3"
    label:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    sub: —
  - flex: 52
    color: "#1f5fa8"
    label:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    sub: ≤ 32 kg
  - flex: 40
    color: "#9a6410"
    label:
      en: SkyCargo
      fr: SkyCargo
      es: SkyCargo
