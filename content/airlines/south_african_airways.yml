id: airline_south_african_airways
mono: SA
name: South African Airways
titleH1:
  en: Flying with a dog on South African Airways
  fr: Voyager avec un chien sur South African Airways
  es: Volar con un perro en South African Airways
  pt: "Viajar com um cachorro na South African Airways"
metaDesc:
  en: "South African Airways pet policy: no cabin anywhere, hold on South African domestic flights only (1 m crate, 23 kg), cargo compulsory internationally, and official sources."
  fr: "Politique animaux South African Airways : pas de cabine, soute en domestique sud-africain seulement (caisse 1 m, 23 kg), fret obligatoire à l'international, et sources officielles."
  es: "Política de mascotas de South African Airways: sin cabina, bodega solo en vuelos nacionales sudafricanos (jaula de 1 m, 23 kg), carga obligatoria en internacional, y fuentes oficiales."
  pt: "Política de animais da South African Airways: sem cabine, porão apenas em voos domésticos sul-africanos (caixa de 1 m, 23 kg), carga obrigatória no internacional, e fontes oficiais."
