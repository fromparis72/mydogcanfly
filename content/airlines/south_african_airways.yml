verdict:
  cls: warn
  label:
    en: Domestic hold only
    fr: Soute domestique seulement
    es: Solo bodega nacional
    pt: "Somente porão doméstico"
verdictNote:
  en: The cabin is closed on every route. The only accompanied option is the hold on South African domestic flights; on any international flight — including a simple transit — your dog has to travel as cargo.
  fr: La cabine est fermée sur toutes les routes. La seule option accompagnée est la soute sur les vols domestiques sud-africains ; sur tout vol international — y compris un simple transit — ton chien doit voyager en fret.
  es: La cabina está cerrada en todas las rutas. La única opción acompañada es la bodega en vuelos nacionales sudafricanos; en cualquier vuelo internacional — incluso un simple tránsito — tu perro debe viajar como carga.
  pt: "A cabine está fechada em todas as rotas. A única opção acompanhada é o porão em voos domésticos sul-africanos; em qualquer voo internacional — inclusive um simples trânsito — seu cachorro precisa viajar como carga."
