verdictNote:
  en: Easy in the cabin, but the hold is military-only — large dogs travel via PetEmbark cargo.
  fr: Simple en cabine, mais la soute est réservée aux militaires — les grands chiens passent par le fret PetEmbark.
  es: "Fácil en cabina, pero la bodega es solo para militares: los perros grandes viajan mediante la carga PetEmbark."
  pt: "Fácil na cabine, mas o porão é exclusivo para militares — os cachorros grandes viajam via carga PetEmbark."
