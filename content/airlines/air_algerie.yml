verdictNote:
  en: Small pets in the cabin, larger in a heated pressurised hold — but no hold pets to/from the UK.
  fr: Petits animaux en cabine, plus grands en soute chauffée et pressurisée — mais pas d'animaux en soute vers/depuis le R.-U.
  es: Mascotas pequeñas en cabina, las más grandes en una bodega calefactada y presurizada — pero sin mascotas en bodega hacia/desde el Reino Unido.
  pt: "Animais pequenos na cabine, maiores em um porão aquecido e pressurizado — mas sem animais no porão de/para o Reino Unido."
