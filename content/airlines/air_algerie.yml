channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Small cats, dogs, hamsters, birds or turtles ≤ 6 kg incl. carrier at your feet (max 55 + 40 + 20 cm); counts as your cabin bag.
      fr: Petits chats, chiens, hamsters, oiseaux ou tortues ≤ 6 kg avec le sac à tes pieds (max 55 + 40 + 20 cm) ; compte comme ton bagage cabine.
      es: Gatos, perros, hámsteres, aves o tortugas pequeños ≤ 6 kg incluida la jaula a tus pies (máx 55 + 40 + 20 cm); cuenta como tu equipaje de cabina.
      pt: "Gatos, cachorros, hamsters, aves ou tartarugas pequenos, ≤ 6 kg com a bolsa incluída, aos seus pés (máx. 55 + 40 + 20 cm); conta como sua bagagem de cabine."
    fee:
      en: Excess-baggage rate
      fr: Tarif bagage excédentaire
      es: Tarifa de exceso de equipaje
      pt: "Tarifa de excesso de bagagem"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Over 6 kg (pet + cage < 23 kg) in a robust, watertight, ventilated crate in a warm, pressurised hold. Not to/from the UK.
      fr: Au-delà de 6 kg (animal + cage < 23 kg) en caisse robuste, étanche et ventilée dans une soute chaude et pressurisée. Pas vers/depuis le R.-U.
      es: Más de 6 kg (mascota + jaula < 23 kg) en una jaula robusta, estanca y ventilada en una bodega cálida y presurizada. No hacia/desde el Reino Unido.
      pt: "Acima de 6 kg (animal + caixa < 23 kg) em uma caixa robusta, estanque e ventilada, em um porão aquecido e pressurizado. Não disponível de/para o Reino Unido."
    fee:
      en: Excess-baggage rate
      fr: Tarif bagage excédentaire
      es: Tarifa de exceso de equipaje
      pt: "Tarifa de excesso de bagagem"
  - placement: cargo
    icon: ✈️
    name:
      en: Cargo
      fr: Fret
      es: Carga
      pt: "Carga"
    cls: warn
    statusLabel:
      en: Via cargo
      fr: Via fret
      es: Vía carga
      pt: "Via carga"
    detail:
      en: Oversize, or all pets to/from the UK (freight only).
      fr: Hors gabarit, ou tous les animaux vers/depuis le R.-U. (fret uniquement).
      es: Fuera de medidas, o todas las mascotas hacia/desde el Reino Unido (solo carga).
      pt: "Fora do tamanho, ou todos os animais de/para o Reino Unido (somente carga)."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
