titleH1:
  en: Flying with a dog on Air Algérie
  fr: Voyager avec un chien sur Air Algérie
  es: Volar con un perro en Air Algérie
  pt: "Viajar com um cachorro na Air Algérie"
metaDesc:
  en: "Air Algérie pet policy: cabin, heated pressurised hold and cargo, UK hold ban and official sources."
  fr: "Politique animaux Air Algérie : cabine, soute chauffée et pressurisée, fret, interdiction soute R.-U. et sources officielles."
  es: "Política de mascotas de Air Algérie: cabina, bodega calefactada y presurizada, carga, prohibición de bodega al Reino Unido y fuentes oficiales."
  pt: "Política de animais da Air Algérie: cabine, porão aquecido e pressurizado, carga, proibição de porão para o Reino Unido e fontes oficiais."
