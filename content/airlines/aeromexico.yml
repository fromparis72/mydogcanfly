verdictNote:
  en: Cabin and hold are offered on many routes. Aeromexico publishes cabin fares in MXN; the hold fare remains to be confirmed.
  fr: Cabine et soute sont proposées sur de nombreux trajets. Aeromexico publie les tarifs cabine en MXN ; le tarif soute reste à confirmer.
  es: Cabina y bodega se ofrecen en muchas rutas. Aeromexico publica las tarifas de cabina en MXN; la tarifa de bodega queda por confirmar.
  pt: "Cabine e porão são oferecidos em muitas rotas. A Aeromexico publica as tarifas de cabine em MXN; a tarifa de porão ainda deve ser confirmada."
