    availability: offered
    # PREUVE IMPORTÉE — import strict lot6 (Codex, lecture directe du 2026-09-09, cohorte LOT6 fait 0).
    # Effet attendu : Aeromexico cabin is a documented conditional route. Its 9 kg combined limit is not a global dog-only threshold.
    # Portée nommée : Dogs and cats only; pet plus carrier must not exceed 9 kg, and health, route and carrier conditions apply.
    # Le plafond cité inclut le CONTENANT : refus sûr si le chien seul le dépasse, jamais un oui en dessous.
    max_weight_kg: 9
    weight_includes_carrier: true
    source:
      url: "https://www.aeromexico.com/es-mx/informacion-de-vuelos/transporte-aereo-de-mascotas"
      source_type: official_website
      verified_date: "2026-09-12"
      review_due: "2026-12-11"   # reviewDueFrom(verified_date, "airline") — calculé par l'importeur
      confidence: 4
