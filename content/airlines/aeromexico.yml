channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Dogs & cats only, ≤ 9 kg incl. carrier under the seat; one per passenger; window/non-bulkhead. Snub-nosed breeds allowed here.
      fr: Chiens et chats uniquement, ≤ 9 kg avec le sac sous le siège ; un par passager ; place hublot/hors cloison. Races au nez écrasé admises ici.
      es: Solo perros y gatos, ≤ 9 kg incluida la jaula bajo el asiento; uno por pasajero; ventanilla/fuera de mamparo. Aquí se admiten las razas de hocico chato.
      pt: "Somente cachorros e gatos, ≤ 9 kg com a bolsa incluída, sob o assento; um por passageiro; janela/fora das fileiras de anteparo. Raças de focinho achatado permitidas aqui."
    fee:
      en: MXN 1,520–3,820 / segment
      fr: 1 520–3 820 MXN / tronçon
      es: 1,520–3,820 MXN / tramo
      pt: "1.520–3.820 MXN / trecho"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: "Checked pet (AVIH): cats, dogs & birds up to 45 kg incl. kennel, on your flight. Not on some Embraer 190."
      fr: "Animal enregistré (AVIH) : chats, chiens et oiseaux jusqu'à 45 kg avec la caisse, sur ton vol. Pas sur certains Embraer 190."
      es: "Mascota facturada (AVIH): gatos, perros y aves de hasta 45 kg incluida la jaula, en tu vuelo. No en algunos Embraer 190."
      pt: "Animal despachado (AVIH): gatos, cachorros e aves até 45 kg com a caixa incluída, no seu voo. Não disponível em alguns Embraer 190."
    fee:
      en: Fare to confirm
      fr: Tarif à confirmer
      es: Tarifa por confirmar
      pt: "Tarifa a confirmar"
  - placement: cargo
    icon: ✈️
    name:
      en: Aeromexico Cargo
      fr: Aeromexico Cargo
      es: Aeromexico Cargo
      pt: "Aeromexico Cargo"
    cls: warn
    statusLabel:
      en: On request
      fr: Sur devis
      es: Bajo petición
      pt: "Sob consulta"
    detail:
      en: Over cabin/hold limits or exotic species, via Aeromexico Cargo (Live Animals).
      fr: Au-delà des limites cabine/soute ou espèces exotiques, via Aeromexico Cargo (animaux vivants).
      es: Por encima de los límites de cabina/bodega o especies exóticas, vía Aeromexico Cargo (animales vivos).
      pt: "Acima dos limites de cabine/porão ou espécies exóticas, via Aeromexico Cargo (Animais Vivos)."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
