      history: []
      quote: "Mascota bajo el asiento (PETC) / Pet with you | Perros, Gatos | Sin límite de tiempo (cumpliendo requisitos de cada país) | Cabina | Hasta 9 kg (Incluyendo transportadora)"
      quote_language: es
      locator: "Servicios de Mascotas → Tipos de servicios para viajar con tu mascota"
  hold:
    availability: offered
    # PREUVE IMPORTÉE — import strict lot6 (Codex, lecture directe du 2026-09-09, cohorte LOT6 fait 1).
    # Effet attendu : Aeromexico hold is a documented conditional route, not a guaranteed booking.
    # Portée nommée : Dogs and cats only; pet plus carrier must not exceed 45 kg, with country requirements and advance procedures.
    # Le plafond cité inclut le CONTENANT : refus sûr si le chien seul le dépasse, jamais un oui en dessous.
    max_weight_kg: 45
    weight_includes_carrier: true
    source:
