    pt: "Moderada"
verdictNote:
  en: Small pets in the cabin or hold on Schengen/EU and Svalbard routes only — the UK isn't allowed.
  fr: Petits animaux en cabine ou en soute uniquement sur les routes Schengen/UE et Svalbard — le R.-U. n'est pas autorisé.
  es: Mascotas pequeñas en cabina o bodega solo en rutas Schengen/UE y Svalbard; el Reino Unido no está permitido.
  pt: "Animais pequenos na cabine ou no porão somente nas rotas Schengen/UE e Svalbard — o Reino Unido não é permitido."
