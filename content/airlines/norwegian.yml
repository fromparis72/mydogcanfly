id: airline_norwegian
mono: DY
name: Norwegian
titleH1:
  en: Flying with a dog on Norwegian
  fr: Voyager avec un chien sur Norwegian
  es: Viajar con un perro en Norwegian
  pt: "Viajar com um cachorro na Norwegian"
metaDesc:
  en: "Norwegian pet policy: cabin and hold on Schengen/EU and Svalbard routes, fares, snub-nosed release form and official sources."
  fr: "Politique animaux Norwegian : cabine et soute sur les routes Schengen/UE et Svalbard, tarifs, décharge brachy et sources officielles."
  es: "Política de mascotas de Norwegian: cabina y bodega en rutas Schengen/UE y Svalbard, tarifas, formulario de exención para razas de hocico chato y fuentes oficiales."
  pt: "Política de animais da Norwegian: cabine e porão nas rotas Schengen/UE e Svalbard, tarifas, termo de responsabilidade para focinho achatado e fontes oficiais."
