name: Luxair
titleH1:
  en: Flying with a dog on Luxair
  fr: Voyager avec un chien sur Luxair
  es: Volar con un perro en Luxair
  pt: "Viajar com um cachorro na Luxair"
metaDesc:
  en: "Luxair pet policy: under 8 kg in the cabin, hold up to 50 kg, flat-faced breeds welcome in the cabin but barred from the hold, excluded destinations."
  fr: "Politique animaux Luxair : moins de 8 kg en cabine, soute jusqu'à 50 kg, brachycéphales acceptés en cabine mais interdits en soute, destinations exclues."
  es: "Política de mascotas de Luxair: menos de 8 kg en cabina, bodega hasta 50 kg, razas de hocico chato en cabina pero no en bodega, destinos excluidos."
  pt: "Política de animais da Luxair: menos de 8 kg na cabine, porão até 50 kg, raças de focinho achatado na cabine mas proibidas no porão, destinos excluídos."
