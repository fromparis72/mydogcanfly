verdictNote:
  en: Flat rates, precise crate specs, cabin and hold both open — and a flat-faced dog under 8 kg is welcome in the cabin. Watch the excluded destinations.
  fr: Tarifs forfaitaires, cotes de caisse précises, cabine et soute ouvertes — et un chien au nez écrasé de moins de 8 kg est accepté en cabine. Attention aux destinations exclues.
  es: Tarifas planas, medidas de jaula precisas, cabina y bodega abiertas, y un perro de hocico chato de menos de 8 kg es bienvenido en cabina. Ojo con los destinos excluidos.
  pt: "Tarifas fixas, medidas de caixa precisas, cabine e porão abertos — e um cachorro de focinho achatado com menos de 8 kg é aceito na cabine. Atenção aos destinos excluídos."
