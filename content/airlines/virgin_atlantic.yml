  es: Volar con un perro en Virgin Atlantic
  pt: "Viajar com um cachorro na Virgin Atlantic"
metaDesc:
  en: "Virgin Atlantic pet policy: passenger pet service and cargo pet product currently unavailable; assistance dogs follow a separate process."
  fr: "Politique animaux Virgin Atlantic : service passager et produit fret actuellement indisponibles ; procédure séparée pour les chiens d'assistance."
  es: "Política de mascotas de Virgin Atlantic: servicio de pasajeros y producto de carga actualmente no disponibles; proceso aparte para perros de asistencia."
  pt: "Política de animais da Virgin Atlantic: serviço de passageiros e produto de carga atualmente indisponíveis; processo separado para cães de assistência."
