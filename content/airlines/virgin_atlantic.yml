verdictNote:
  en: Ordinary pets are not accepted in the cabin or hold, and the Virgin Atlantic Cargo pet product is currently unavailable.
  fr: Les animaux ordinaires ne sont acceptés ni en cabine ni en soute, et le produit animalier de Virgin Atlantic Cargo est actuellement indisponible.
  es: Las mascotas ordinarias no se aceptan en cabina ni en bodega, y el producto de animales de Virgin Atlantic Cargo no está disponible actualmente.
  pt: "Animais comuns não são aceitos na cabine nem no porão, e o produto para animais da Virgin Atlantic Cargo está atualmente indisponível."
