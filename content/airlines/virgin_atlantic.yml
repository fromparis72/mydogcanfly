fareList:
  rows:
    - label:
        en: Cabin / hold
        fr: Cabine / soute
        es: Cabina / bodega
        pt: "Cabine / porão"
      value:
        en: Not carried
        fr: Non transporté
        es: No se transporta
        pt: "Não transportado"
    - label:
        en: Cargo pet product
        fr: Produit fret animalier
        es: Producto de carga para mascotas
        pt: "Produto de carga para animais"
      value:
        en: Currently unavailable
        fr: Actuellement indisponible
        es: Actualmente no disponible
        pt: "Atualmente indisponível"
    - label:
        en: Assistance dog (cabin)
        fr: Chien d'assistance (cabine)
        es: Perro de asistencia (cabina)
        pt: "Cão de assistência (cabine)"
      value:
        en: Free
        fr: Gratuit
        es: Gratis
        pt: "Grátis"
  note:
    en: No public cargo pet offer or fare is published while the product remains unavailable.
    fr: Aucune offre ni aucun tarif fret grand public n'est publié tant que le produit reste indisponible.
    es: No se publica ninguna oferta ni tarifa de carga para el público mientras el producto siga no disponible.
    pt: "Nenhuma oferta nem tarifa pública de carga é publicada enquanto o produto permanecer indisponível."
restrictions:
  - icon: 🐶
    title:
      en: Flat-faced breeds
      fr: Races brachycéphales
      es: Razas de hocico chato
      pt: "Raças de focinho achatado"
    pills:
      - cls: no
        label:
          en: Not accepted
          fr: Non acceptées
          es: No aceptadas
          pt: "Não aceitas"
    note:
      en: "Snub-nosed dogs & cats are refused: all pugs, Boston terrier, Brussels Griffon, English/Japanese toy spaniels, Pekingese, English/French/American bulldog, Shih Tzu, and Himalayan/Persian cats. Crossbreeds need a side-profile photo for a decision."
      fr: "Chiens et chats au nez écrasé refusés : tous les carlins, Boston terrier, Griffon bruxellois, épagneuls nains anglais/japonais, pékinois, bouledogue anglais/français/américain, Shih Tzu, et chats himalayens/persans. Les croisés nécessitent une photo de profil pour décision."
      es: "Se rechazan los perros y gatos de hocico chato: todos los carlinos, Boston terrier, grifón de Bruselas, spaniels toy inglés/japonés, pekinés, bulldog inglés/francés/americano, Shih Tzu, y gatos himalayo/persa. Los cruces necesitan una foto de perfil para una decisión."
      pt: "Cachorros e gatos de focinho achatado são recusados: todos os pugs, Boston terrier, Griffon de Bruxelas, spaniels anões inglês/japonês, Pequinês, bulldog inglês/francês/americano, Shih Tzu, e gatos himalaio/persa. Cruzamentos precisam de uma foto de perfil para a decisão."
  - icon: 🚫
    title:
      en: Banned breeds
      fr: Races interdites
      es: Razas prohibidas
      pt: "Raças proibidas"
    pills:
      - cls: no
        label:
          en: Not accepted
          fr: Non acceptées
          es: No aceptadas
          pt: "Não aceitas"
      - cls: warn
        label:
          en: No sedation
          fr: Pas de sédation
          es: Sin sedación
          pt: "Sem sedação"
    note:
      en: Dangerous breeds (pit bull types, American Staffordshire, Dogo Argentino, Fila, Tosa, Boerboel, Bully Kutta) aren't accepted. Pets must not be sedated.
      fr: Les races dangereuses (types pit-bull, American Staffordshire, Dogo Argentino, Fila, Tosa, Boerboel, Bully Kutta) ne sont pas acceptées. Les animaux ne doivent pas être sédatés.
      es: Las razas peligrosas (tipos pit bull, American Staffordshire, Dogo Argentino, Fila, Tosa, Boerboel, Bully Kutta) no se aceptan. Las mascotas no deben ir sedadas.
      pt: "Raças perigosas (tipos pit bull, American Staffordshire, Dogo Argentino, Fila, Tosa, Boerboel, Bully Kutta) não são aceitas. Os animais não podem ser sedados."
temperature:
  pills:
    - cls: warn
      label:
        en: "Temperature limits: not disclosed"
        fr: "Limites de température : non communiqué"
        es: "Límites de temperatura: no comunicados"
        pt: "Limites de temperatura: não divulgados"
  note:
    en: Virgin Atlantic publishes no numeric hold-temperature limits; pets travel as manifested cargo.
    fr: Virgin Atlantic ne publie pas de limites chiffrées de température en soute ; les animaux voyagent en fret manifesté.
    es: Virgin Atlantic no publica límites numéricos de temperatura en bodega; las mascotas viajan como carga manifestada.
    pt: "A Virgin Atlantic não publica limites numéricos de temperatura de porão; os animais viajam como carga manifestada."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: Recognised assistance dogs (ADI-accredited) travel in the cabin; snub-nosed and Dangerous Dogs Act breeds are excluded.
      fr: Les chiens d'assistance reconnus (accrédités ADI) voyagent en cabine ; les races au nez écrasé et du Dangerous Dogs Act sont exclues.
      es: Los perros de asistencia reconocidos (acreditados por ADI) viajan en cabina; las razas de hocico chato y las del Dangerous Dogs Act quedan excluidas.
      pt: "Cães de assistência reconhecidos (credenciados pela ADI) viajam na cabine; raças de focinho achatado e as do Dangerous Dogs Act ficam excluídas."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: "Notify Special Assistance ≥ 72 h ahead with training + health docs. US: DOT form (+ relief over 8 h)."
      fr: "Prévenir l'Assistance spéciale ≥ 72 h à l'avance avec les documents de dressage + santé. USA : formulaire DOT (+ soulagement au-delà de 8 h)."
      es: "Avisa a Asistencia Especial ≥ 72 h antes con la documentación de adiestramiento y de salud. EE. UU.: formulario DOT (+ alivio en vuelos de más de 8 h)."
      pt: "Avise a Assistência Especial com ≥ 72 h de antecedência, com os documentos de treinamento e de saúde. EUA: formulário DOT (+ alívio em voos acima de 8 h)."
goodToKnow:
  - icon: 🐾
    label:
      en: Cats & dogs only
      fr: Chats & chiens seuls
      es: Solo gatos y perros
      pt: "Somente gatos e cachorros"
    value:
      en: Only cats and dogs are carried (cargo); no other species and no emotional-support animals.
      fr: Seuls les chats et chiens sont transportés (fret) ; pas d'autres espèces ni animaux de soutien émotionnel.
      es: Solo se transportan gatos y perros (carga); ninguna otra especie ni animales de apoyo emocional.
      pt: "Somente gatos e cachorros são transportados (carga); nenhuma outra espécie e nenhum animal de apoio emocional."
  - icon: ✈️
    label:
      en: Point-to-point
      fr: Point à point
      es: Punto a punto
      pt: "Ponto a ponto"
    value:
      en: Pets are moved point-to-point only — Virgin doesn't tranship pets, and not all routes are offered.
      fr: Les animaux sont transportés point à point uniquement — Virgin ne fait pas de transbordement, et toutes les routes ne sont pas proposées.
      es: Las mascotas se transportan solo punto a punto; Virgin no hace transbordo de mascotas y no se ofrecen todas las rutas.
      pt: "Os animais são transportados somente ponto a ponto — a Virgin não faz transbordo de animais, e nem todas as rotas são oferecidas."
  - icon: ⏱️
    label:
      en: Book 7 days ahead
      fr: Réserver 7 jours avant
      es: Reserva 7 días antes
      pt: "Reserve com 7 dias de antecedência"
    value:
      en: Pet cargo can't be booked online — contact the Cargo dept or an IATA pet agent ≥ 7 days ahead.
      fr: Le fret animalier ne se réserve pas en ligne — contacter le service Cargo ou un agent IATA ≥ 7 jours à l'avance.
      es: La carga de mascotas no se puede reservar en línea; contacta con el departamento de carga o un agente IATA de mascotas ≥ 7 días antes.
      pt: "A carga de animais não pode ser reservada on-line — entre em contato com o departamento de Carga ou um agente IATA de animais com ≥ 7 dias de antecedência."
