id: airline_virgin_atlantic
mono: VS
name: Virgin Atlantic
titleH1:
  en: Flying with a dog on Virgin Atlantic
  fr: Voyager avec un chien sur Virgin Atlantic
  es: Volar con un perro en Virgin Atlantic
  pt: "Viajar com um cachorro na Virgin Atlantic"
metaDesc:
  en: "Virgin Atlantic pet policy: cargo-only via approved agent, cabin assistance dogs, restrictions and official sources."
  fr: "Politique animaux Virgin Atlantic : fret uniquement via agent agréé, chiens d'assistance en cabine, restrictions et sources officielles."
  es: "Política de mascotas de Virgin Atlantic: solo carga a través de un agente autorizado, perros de asistencia en cabina, restricciones y fuentes oficiales."
  pt: "Política de animais da Virgin Atlantic: somente carga via agente autorizado, cães de assistência na cabine, restrições e fontes oficiais."
