    en: Hard
    fr: Difficile
    es: Difícil
    pt: "Difícil"
verdictNote:
  en: No cabin or checked pets; cats & dogs travel only as cargo via an approved agent, plus assistance dogs in the cabin.
  fr: Pas d'animaux en cabine ni en bagage enregistré ; chats et chiens uniquement en fret via un agent agréé, plus les chiens d'assistance en cabine.
  es: Sin mascotas en cabina ni facturadas; los gatos y perros viajan solo como carga a través de un agente autorizado, además de los perros de asistencia en cabina.
  pt: "Sem animais na cabine nem despachados; gatos e cachorros viajam somente como carga via agente autorizado, além dos cães de assistência na cabine."
