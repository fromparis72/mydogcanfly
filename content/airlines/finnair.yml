    es: Moderado
    pt: "Moderada"
verdictNote:
  en: Small pets in the cabin, larger in a heated hold — but many countries are cargo-only (UK, HK, UAE, Australia).
  fr: Petits animaux en cabine, plus grands en soute chauffée — mais de nombreux pays sont fret-seul (R.-U., HK, ÉAU, Australie).
  es: Mascotas pequeñas en cabina, las más grandes en una bodega climatizada, pero muchos países son solo carga (R.U., HK, EAU, Australia).
  pt: "Animais pequenos na cabine, os maiores em um porão aquecido — mas muitos países são somente carga (Reino Unido, HK, EAU, Austrália)."
