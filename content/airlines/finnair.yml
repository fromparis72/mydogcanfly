policies:
  cabin:
    availability: offered
  hold:
    availability: offered
  cargo:
    review_state: legacy_unreviewed
channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Cats & small dogs (min 8 weeks) ≤ 8 kg incl. carrier under the seat (soft 55 × 40 × 23 cm); max 2 per carrier. Not in long-haul Business.
      fr: Chats et petits chiens (min 8 semaines) ≤ 8 kg avec le sac sous le siège (souple 55 × 40 × 23 cm) ; max 2 par sac. Pas en Business long-courrier.
      es: Gatos y perros pequeños (mín. 8 semanas) ≤ 8 kg con la jaula bajo el asiento (blanda 55 × 40 × 23 cm); máx. 2 por jaula. No en Business de largo radio.
      pt: "Gatos e cachorros pequenos (mín. 8 semanas) ≤ 8 kg com a bolsa embaixo do assento (flexível, 55 × 40 × 23 cm); máx. 2 por bolsa. Não disponível na Business de longa distância."
    fee:
      en: €60–130
      fr: 60–130 €
      es: 60–130 €
      pt: "60–130 €"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Bigger dogs & ferrets in a heated, air-conditioned hold (≤ 75 kg incl. container on Finnair, 50 kg on Norra). No auto-transfer at Helsinki.
      fr: Chiens plus grands et furets dans une soute chauffée et climatisée (≤ 75 kg avec le contenant sur Finnair, 50 kg sur Norra). Pas de transfert automatique à Helsinki.
      es: Perros más grandes y hurones en una bodega climatizada con calefacción (≤ 75 kg con el contenedor en Finnair, 50 kg en Norra). Sin transferencia automática en Helsinki.
      pt: "Cachorros maiores e furões em um porão aquecido e climatizado (≤ 75 kg com o recipiente na Finnair, 50 kg na Norra). Sem transferência automática em Helsinque."
    fee:
      en: €140–650
      fr: 140–650 €
      es: 140–650 €
      pt: "140–650 €"
  - placement: cargo
    icon: ✈️
    name:
      en: Finnair Cargo
      fr: Finnair Cargo
      es: Finnair Cargo
      pt: "Finnair Cargo"
    cls: warn
    statusLabel:
      en: Via cargo
      fr: Via fret
      es: Vía carga
      pt: "Via carga"
    detail:
      en: Over hold limits, unaccompanied, or to/via cargo-only countries (UK, Hong Kong, UAE, Australia). Via a forwarder.
      fr: Au-delà des limites soute, non accompagné, ou vers/via des pays fret-seul (R.-U., Hong Kong, ÉAU, Australie). Via un transitaire.
      es: Por encima de los límites de bodega, sin acompañante, o hacia/vía países solo carga (R.U., Hong Kong, EAU, Australia). Mediante un transitario.
      pt: "Acima dos limites de porão, sem acompanhante, ou de/via países somente carga (Reino Unido, Hong Kong, EAU, Austrália). Por meio de um despachante."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
