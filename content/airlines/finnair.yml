name: Finnair
titleH1:
  en: Flying with a dog on Finnair
  fr: Voyager avec un chien sur Finnair
  es: Volar con un perro en Finnair
  pt: "Voar com um cachorro na Finnair"
metaDesc:
  en: "Finnair pet policy: cabin, heated hold and cargo, fares by zone, cargo-only countries and official sources."
  fr: "Politique animaux Finnair : cabine, soute chauffée et fret, tarifs par zone, pays fret-seul et sources officielles."
  es: "Política de mascotas de Finnair: cabina, bodega climatizada y carga, tarifas por zona, países solo carga y fuentes oficiales."
  pt: "Política de animais da Finnair: cabine, porão aquecido e carga, tarifas por zona, países somente carga e fontes oficiais."
