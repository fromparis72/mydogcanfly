    es: Por segmento de vuelo y por animal, con el transportín incluido. La tarifa se duplica por encima de 32 kg.
    pt: "Por trecho de voo e por animal, com a caixa incluída. A tarifa dobra acima de 32 kg."
restrictions:
  - icon: 🐶
    title:
      en: Flat-faced breeds
      fr: Races brachycéphales
      es: Razas de hocico chato
      pt: "Raças de focinho achatado"
    pills:
      - cls: ok
        label:
          en: Cabin possible
          fr: Cabine possible
          es: Cabina posible
          pt: "Cabine possível"
      - cls: no
        label:
          en: Hold forbidden
          fr: Soute interdite
          es: Bodega prohibida
          pt: "Porão proibido"
    note:
      en: Asiana has barred snub-nosed dogs and cats from the hold since 1 July 2019 and publishes the list of breeds by name. The ban is written for hold carriage only — the cabin rules set no breed condition, so a flat-faced dog that fits 7 kg and 45 × 32 × 21 cm can travel under the seat.
      fr: "Asiana refuse les chiens et chats au nez écrasé en soute depuis le 1ᵉʳ juillet 2019 et publie la liste nominative des races. L'interdiction est explicitement circonscrite au transport en soute : les règles de cabine ne posent aucune condition de race, donc un brachycéphale qui tient dans 7 kg et 45 × 32 × 21 cm peut voyager sous le siège."
      es: "Asiana no acepta perros ni gatos de hocico chato en bodega desde el 1 de julio de 2019 y publica la lista de razas por nombre. La prohibición está redactada solo para la bodega: las normas de cabina no imponen ninguna condición de raza, así que un braquicéfalo que quepa en 7 kg y 45 × 32 × 21 cm puede viajar bajo el asiento."
      pt: "A Asiana proíbe cachorros e gatos de focinho achatado no porão desde 1º de julho de 2019 e publica a lista nominal das raças. A proibição vale explicitamente só para o transporte no porão: as regras da cabine não impõem nenhuma condição de raça, então um braquicefálico que caiba em 7 kg e 45 × 32 × 21 cm pode viajar sob o assento."
  - icon: 🚫
    title:
      en: Dogs listed as dangerous
      fr: Chiens dits dangereux
      es: Perros considerados peligrosos
      pt: "Cachorros classificados como perigosos"
    pills:
      - cls: warn
        label:
          en: Separate list
          fr: Liste distincte
          es: Lista aparte
          pt: "Lista à parte"
    note:
      en: Asiana publishes a separate list of dogs classed as dangerous — Tosa, pit bull, American Staffordshire terrier, Rottweiler, Kangal, Ovcharka, American Bully, Cane Corso and wolfdogs — which also covers crosses of those breeds. Check your dog's status with Asiana before you book.
      fr: "Asiana publie une liste distincte de chiens dits dangereux — Tosa, pit-bull, American Staffordshire terrier, Rottweiler, Kangal, Ovtcharka, American Bully, Cane Corso et chiens-loups — qui vise aussi leurs croisements. Fais confirmer le statut de ton chien par Asiana avant de réserver."
      es: Asiana publica una lista aparte de perros considerados peligrosos — Tosa, pit bull, American Staffordshire terrier, Rottweiler, Kangal, Ovcharka, American Bully, Cane Corso y perros lobo — que incluye también sus cruces. Confirma con Asiana la situación de tu perro antes de reservar.
      pt: "A Asiana publica uma lista à parte de cachorros classificados como perigosos — Tosa, pit bull, American Staffordshire terrier, Rottweiler, Kangal, Ovtcharka, American Bully, Cane Corso e cães-lobo — que abrange também os cruzamentos dessas raças. Confirme a situação do seu cachorro com a Asiana antes de reservar."
temperature:
  pills:
    - cls: warn
      label:
        en: "Temperature limits: not disclosed"
        fr: "Limites de température : non communiqué"
        es: "Límites de temperatura: no comunicado"
        pt: "Limites de temperatura: não divulgados"
  note:
    en: Asiana publishes no hold-temperature limits or seasonal embargo on its pet pages.
    fr: Asiana ne publie pas de limites de température en soute ni d'embargo saisonnier sur ses pages animaux.
    es: Asiana no publica límites de temperatura en bodega ni embargo estacional en sus páginas de mascotas.
    pt: "A Asiana não publica limites de temperatura no porão nem embargo sazonal em suas páginas sobre animais."
assistance:
  - icon: ℹ️
    label:
      en: Service dogs
      fr: Chiens d'assistance
      es: Perros de asistencia
      pt: "Cães de assistência"
    value:
      en: The Asiana pet page we checked doesn't cover assistance dogs — no conditions, fee or documents are published there. Ask Asiana directly before booking.
      fr: "La page animaux d'Asiana que nous avons consultée ne traite pas des chiens d'assistance : ni conditions, ni tarif, ni documents n'y sont publiés. Demande directement à Asiana avant de réserver."
      es: "La página de mascotas de Asiana que consultamos no aborda los perros de asistencia: no publica condiciones, tarifa ni documentos. Pregunta directamente a Asiana antes de reservar."
      pt: "A página de animais da Asiana que consultamos não trata de cães de assistência: não há condições, tarifa nem documentos publicados ali. Pergunte diretamente à Asiana antes de reservar."
goodToKnow:
  - icon: 🛩️
    label:
      en: Aircraft & codeshare
      fr: Appareil & partage de code
      es: Avión y código compartido
      pt: "Aeronave e code-share"
    value:
      en: The A321 carries no animals in the hold on international routes, and Air Busan codeshare flights offer no pet service at all.
      fr: L'A321 ne prend aucun animal en soute sur les vols internationaux, et les vols en partage de code Air Busan n'offrent aucun service animalier.
      es: El A321 no admite animales en bodega en rutas internacionales, y los vuelos en código compartido con Air Busan no ofrecen ningún servicio para mascotas.
      pt: "O A321 não transporta animais no porão em rotas internacionais, e os voos em code-share com a Air Busan não oferecem nenhum serviço para animais."
  - icon: 👤
    label:
      en: Who can travel with the pet
      fr: Qui peut accompagner l'animal
      es: Quién puede acompañar al animal
      pt: "Quem pode acompanhar o animal"
    value:
      en: One animal in the cabin and two in the hold per adult passenger. A child may not travel with an animal in the cabin.
      fr: Un animal en cabine et deux en soute par passager adulte. Un enfant ne peut pas voyager avec un animal en cabine.
      es: Un animal en cabina y dos en bodega por pasajero adulto. Un menor no puede viajar con un animal en cabina.
      pt: "Um animal na cabine e dois no porão por passageiro adulto. Uma criança não pode viajar com um animal na cabine."
  - icon: 💺
    label:
      en: In Business class
      fr: En Business
      es: En Business
      pt: "Na Business"
    value:
      en: Except on the A321, the carrier does not go under the seat in Business — the crew stows it elsewhere for take-off and landing.
      fr: "Sauf sur A321, le sac ne se range pas sous le siège en Business : le PNC le place ailleurs au décollage et à l'atterrissage."
      es: "Salvo en el A321, en Business el transportín no va bajo el asiento: la tripulación lo guarda en otro sitio para el despegue y el aterrizaje."
      pt: "Exceto no A321, na Business a bolsa não fica sob o assento: a tripulação a guarda em outro lugar na decolagem e no pouso."
  - icon: ❓
    label:
      en: Not published
      fr: Non publié
      es: No publicado
      pt: "Não publicado"
    value:
      en: Asiana publishes no per-flight cap on the number of animals, no cargo option for pets and no temperature limit.
      fr: Asiana ne publie ni plafond d'animaux par vol, ni option fret pour les animaux, ni limite de température.
      es: Asiana no publica un límite de animales por vuelo, ni una opción de carga para mascotas, ni límites de temperatura.
      pt: "A Asiana não publica limite de animais por voo, nem opção de carga para animais, nem limite de temperatura."
