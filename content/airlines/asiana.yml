policies:
  cabin:
    availability: offered
  hold:
    availability: offered
  cargo:
    review_state: legacy_unreviewed
    # dette éditoriale scellée (T0-B2) : aucun canal visible ne décrit ce placement
channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: One cat or dog, 7 kg carrier included, max 45 × 32 × 21 cm under the seat. A soft fabric bag may measure 26 cm high provided it compresses to 21 cm; rigid-frame crates stay capped at 21 cm. From 16 weeks, one pet per adult passenger. Book 24 h ahead on domestic flights, 48 h on international ones.
      fr: Un chat ou un chien, 7 kg sac compris, 45 × 32 × 21 cm maximum sous le siège. Un sac en tissu peut faire 26 cm de haut s'il se comprime à 21 cm ; les cages à armature rigide restent plafonnées à 21 cm. À partir de 16 semaines, un animal par passager adulte. Réservation 24 h avant en domestique, 48 h en international.
      es: Un gato o un perro, 7 kg con el transportín incluido, máximo 45 × 32 × 21 cm bajo el asiento. Un bolso de tela puede medir 26 cm de alto si se comprime hasta 21 cm; los transportines de armazón rígido siguen limitados a 21 cm. Desde las 16 semanas, un animal por pasajero adulto. Reserva con 24 h de antelación en vuelos nacionales y 48 h en internacionales.
      pt: "Um gato ou cachorro, 7 kg com a bolsa incluída, no máximo 45 × 32 × 21 cm sob o assento. Uma bolsa de tecido pode ter 26 cm de altura se comprimir até 21 cm; caixas de estrutura rígida continuam limitadas a 21 cm. A partir de 16 semanas, um animal por passageiro adulto. Reserve com 24 h de antecedência em voos domésticos e 48 h nos internacionais."
    fee:
      en: KRW 30,000–290,000
      fr: 30 000–290 000 KRW
      es: 30 000–290 000 KRW
      pt: "30.000–290.000 KRW"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Up to 45 kg crate included, three dimensions adding up to 285 cm or less and height 84 cm or less. Two animals in the hold per adult passenger. Not available on the A321 on international routes, nor on Air Busan codeshare flights. Flat-faced breeds are barred from the hold.
      fr: Jusqu'à 45 kg caisse comprise, somme des trois dimensions ≤ 285 cm et hauteur ≤ 84 cm. Deux animaux en soute par passager adulte. Pas de soute animalière sur A321 en international, ni sur les vols en partage de code Air Busan. Les races brachycéphales sont exclues de la soute.
      es: Hasta 45 kg con la jaula incluida, suma de las tres dimensiones ≤ 285 cm y altura ≤ 84 cm. Dos animales en bodega por pasajero adulto. No disponible en el A321 en rutas internacionales ni en los vuelos en código compartido con Air Busan. Las razas de hocico chato quedan excluidas de la bodega.
      pt: "Até 45 kg com a caixa incluída, soma das três dimensões ≤ 285 cm e altura ≤ 84 cm. Dois animais no porão por passageiro adulto. Não disponível no A321 em rotas internacionais nem nos voos em code-share com a Air Busan. Raças de focinho achatado são proibidas no porão."
    fee:
      en: KRW 30,000–290,000 (double over 32 kg)
      fr: 30 000–290 000 KRW (le double au-delà de 32 kg)
      es: 30 000–290 000 KRW (el doble por encima de 32 kg)
      pt: "30.000–290.000 KRW (o dobro acima de 32 kg)"
