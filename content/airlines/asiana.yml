verdictNote:
  en: Cabin and hold are both open with published sizes and a clear fare grid; the flat-faced ban applies to the hold only.
  fr: Cabine et soute sont ouvertes, avec des cotes publiées et une grille tarifaire claire ; l'interdiction brachycéphale ne vise que la soute.
  es: Cabina y bodega están abiertas, con medidas publicadas y una tarifa clara; la prohibición de hocico chato solo afecta a la bodega.
  pt: "Cabine e porão estão abertos, com medidas publicadas e uma tabela de tarifas clara; a proibição de focinho achatado vale apenas para o porão."
