name: Asiana Airlines
titleH1:
  en: Flying with a dog on Asiana Airlines
  fr: Voyager avec un chien sur Asiana Airlines
  es: Volar con un perro en Asiana Airlines
  pt: "Viajar com um cachorro na Asiana Airlines"
metaDesc:
  en: "Asiana Airlines pet policy: 7 kg in the cabin, 45 kg in the hold, fares by region, the flat-faced rule that applies to the hold only, and official sources."
  fr: "Politique animaux Asiana Airlines : 7 kg en cabine, 45 kg en soute, tarifs par région, la règle brachycéphale qui ne vise que la soute, et sources officielles."
  es: "Política de mascotas de Asiana Airlines: 7 kg en cabina, 45 kg en bodega, tarifas por región, la regla de hocico chato que solo afecta a la bodega y fuentes oficiales."
  pt: "Política de animais da Asiana Airlines: 7 kg na cabine, 45 kg no porão, tarifas por região, a regra de focinho achatado que vale só para o porão e fontes oficiais."
