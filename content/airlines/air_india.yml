  es: Volar con un perro en Air India
  pt: "Viajar com um cachorro na Air India"
metaDesc:
  en: "Air India pet policy: cabin, hold and cargo, fares, banned routes, brachycephalic and temperature limits and official sources."
  fr: "Politique animaux Air India : cabine, soute et fret, tarifs, routes interdites, limites brachy et température, sources officielles."
  es: "Política de mascotas de Air India: cabina, bodega y carga, tarifas, rutas prohibidas, límites braquicéfalos y de temperatura, y fuentes oficiales."
  pt: "Política de animais da Air India: cabine, porão e carga, tarifas, rotas proibidas, limites para braquicefálicos e de temperatura, e fontes oficiais."
