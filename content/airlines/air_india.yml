policies:
  cabin:
    availability: offered
  hold:
    availability: offered
  cargo:
    review_state: legacy_unreviewed
channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Cats & dogs (8 weeks+) ≤ 10 kg incl. carrier in a soft kennel under the seat (last 5 rows, Economy); max 2/flight. Not to US/Canada/UK/Australia or India–UAE.
      fr: Chats et chiens (8 semaines+) ≤ 10 kg avec le sac dans un sac souple sous le siège (5 derniers rangs, Économique) ; max 2/vol. Pas vers USA/Canada/R.-U./Australie ni Inde–ÉAU.
      es: Gatos y perros (8 semanas+) ≤ 10 kg incluida la jaula en una jaula blanda bajo el asiento (últimas 5 filas, Economy); máx 2/vuelo. No hacia EE. UU./Canadá/R.U./Australia ni India–EAU.
      pt: "Gatos e cachorros (8 semanas ou mais) ≤ 10 kg com a bolsa incluída, em uma bolsa flexível sob o assento (últimas 5 fileiras, Economy); máx. 2 por voo. Não disponível para EUA/Canadá/Reino Unido/Austrália ou Índia–EAU."
    fee:
      en: $140–225 / ₹7,500
      fr: 140–225 $ / 7 500 ₹
      es: 140–225 $ / 7 500 ₹
      pt: "140–225 $ / 7.500 ₹"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Pets 10–32 kg incl. carrier as checked baggage in a hard travel crate; availability depends on the aircraft.
      fr: Animaux de 10–32 kg avec le sac en bagage enregistré dans une caisse de transport rigide ; disponibilité selon l'avion.
      es: Mascotas de 10–32 kg incluida la jaula como equipaje facturado en una jaula rígida de transporte; la disponibilidad depende de la aeronave.
      pt: "Animais de 10–32 kg com a caixa incluída, como bagagem despachada em uma caixa de transporte rígida; a disponibilidade depende da aeronave."
    fee:
      en: $350 / ₹16,000
      fr: 350 $ / 16 000 ₹
      es: 350 $ / 16 000 ₹
      pt: "350 $ / 16.000 ₹"
  - placement: cargo
    icon: ✈️
    name:
      en: Air India Cargo
      fr: Air India Cargo
      es: Air India Cargo
      pt: "Air India Cargo"
    cls: warn
    statusLabel:
      en: Via cargo
      fr: Via fret
      es: Vía carga
      pt: "Via carga"
    detail:
      en: Over 32 kg and UK routes via Air India Cargo (airport-to-airport); not on ultra-long-haul US/Canada.
      fr: Au-delà de 32 kg et routes R.-U. via Air India Cargo (aéroport à aéroport) ; pas sur les ultra-long-courriers USA/Canada.
      es: Por encima de 32 kg y rutas al R.U. vía Air India Cargo (de aeropuerto a aeropuerto); no en los ultralargos EE. UU./Canadá.
      pt: "Acima de 32 kg e rotas para o Reino Unido via Air India Cargo (de aeroporto a aeroporto); não disponível em voos ultra longos para EUA/Canadá."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
