verdictNote:
  en: Cats & dogs in the cabin, hold or cargo — but manual booking and many routes barred (US, UK, Australia…).
  fr: Chats et chiens en cabine, soute ou fret — mais réservation manuelle et de nombreuses routes exclues (USA, R.-U., Australie…).
  es: Gatos y perros en cabina, bodega o carga — pero reserva manual y muchas rutas vetadas (EE. UU., R.U., Australia…).
  pt: "Gatos e cachorros na cabine, no porão ou na carga — mas com reserva manual e muitas rotas proibidas (EUA, Reino Unido, Austrália…)."
