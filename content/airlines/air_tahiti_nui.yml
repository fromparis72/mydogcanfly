id: airline_air_tahiti_nui
mono: TN
name: Air Tahiti Nui
titleH1:
  en: Flying with a dog on Air Tahiti Nui
  fr: Voyager avec un chien sur Air Tahiti Nui
  es: Volar con un perro en Air Tahiti Nui
  pt: "Viajar com um cachorro pela Air Tahiti Nui"
metaDesc:
  en: "Air Tahiti Nui pet policy: cabin on select routes, cargo hold, French category dog ban and official sources."
  fr: "Politique animaux Air Tahiti Nui : cabine sur certaines routes, soute via cargo, interdiction des chiens catégorisés et sources officielles."
  es: "Política de mascotas de Air Tahiti Nui: cabina en rutas seleccionadas, bodega vía carga, prohibición de perros categorizados en Francia y fuentes oficiales."
  pt: "Política de animais da Air Tahiti Nui: cabine em rotas selecionadas, porão via carga, proibição de cachorros categorizados na França e fontes oficiais."
chips:
  - icon: 📍
    label:
      en: French Polynesia · PPT
      fr: Polynésie française · PPT
      es: Polinesia Francesa · PPT
      pt: "Polinésia Francesa · PPT"
  - icon: 🗓
    label:
      en: Updated 11 Jul 2026
      fr: Mise à jour le 11 juil. 2026
      es: Actualizado el 11 jul. 2026
      pt: "Atualizado em 11 jul. 2026"
verdict:
  cls: warn
  label:
    en: Moderate
    fr: Modéré
    es: Moderado
    pt: "Moderada"
verdictNote:
  en: Small cats & dogs in the cabin on select routes; larger pets go via cargo, with breed and health limits.
  fr: Petits chats et chiens en cabine sur certaines routes ; les plus grands via cargo, avec restrictions de races et de santé.
  es: Gatos y perros pequeños en cabina en rutas seleccionadas; las mascotas más grandes viajan como carga, con límites de raza y de salud.
  pt: "Gatos e cachorros pequenos na cabine em rotas selecionadas; os animais maiores viajam via carga, com limites de raça e de saúde."
ladder:
  - flex: 20
    color: "#16794f"
    label:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    sub: ≤ 8 kg
  - flex: 80
    color: "#1f5fa8"
    label:
      en: Cargo
      fr: Fret
      es: Carga
      pt: "Carga"
    sub:
      en: hold via cargo
      fr: soute via cargo
      es: bodega vía carga
      pt: "porão via carga"
policies:
  cabin:
    availability: offered
  cargo:
    review_state: legacy_unreviewed
channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Vaccinated cats & dogs ≤ 8 kg incl. carrier under the seat (max 40 × 35 × 20 cm), on 4 routes (LA–Paris, Paris–LA, Papeete–LA, Papeete–Paris). Quota applies.
      fr: Chats et chiens vaccinés ≤ 8 kg avec le sac sous le siège (max 40 × 35 × 20 cm), sur 4 routes (LA–Paris, Paris–LA, Papeete–LA, Papeete–Paris). Quota applicable.
      es: Gatos y perros vacunados ≤ 8 kg incluida la jaula bajo el asiento (máx 40 × 35 × 20 cm), en 4 rutas (LA–París, París–LA, Papeete–LA, Papeete–París). Se aplica cupo.
      pt: "Gatos e cachorros vacinados ≤ 8 kg incl. bolsa de transporte embaixo do assento (máx. 40 × 35 × 20 cm), em 4 rotas (LA–Paris, Paris–LA, Papeete–LA, Papeete–Paris). Aplica-se cota."
    fee:
      en: €150 / $150
      fr: 150 € / 150 $
      es: 150 € / 150 $
      pt: "€150 / $150"
  - placement: cargo
    icon: ✈️
    name:
      en: Air Tahiti Nui Cargo
      fr: Air Tahiti Nui Cargo
      es: Air Tahiti Nui Cargo
      pt: "Air Tahiti Nui Cargo"
    cls: warn
    statusLabel:
      en: Via cargo
      fr: Via fret
      es: Vía carga
      pt: "Via carga"
    detail:
      en: Pets that can't fly in the cabin travel in the pressurised hold via Cargo (min 6 months, microchipped, travel cage), between PPT/CDG/AKL/LAX/NRT.
      fr: Les animaux qui ne peuvent pas voyager en cabine voyagent dans la soute pressurisée via Cargo (min 6 mois, pucés, cage de transport), entre PPT/CDG/AKL/LAX/NRT.
      es: Las mascotas que no pueden volar en cabina viajan en la bodega presurizada vía Cargo (mín 6 meses, con microchip, jaula de transporte), entre PPT/CDG/AKL/LAX/NRT.
      pt: "Os animais que não podem voar na cabine viajam no porão pressurizado via Cargo (mín. 6 meses, com microchip, caixa de transporte), entre PPT/CDG/AKL/LAX/NRT."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
