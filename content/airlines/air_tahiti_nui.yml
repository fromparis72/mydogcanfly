        pt: "Ver condições"
  note:
    en: EUR/USD/XPF per trip by route. Larger pets are quoted by the cargo rate tool.
    fr: EUR/USD/XPF par trajet selon la route. Les animaux plus grands sont chiffrés par l'outil de tarif cargo.
    es: EUR/USD/XPF por trayecto según la ruta. Las mascotas más grandes se presupuestan con la herramienta de tarifas de carga.
    pt: "EUR/USD/XPF por trajeto conforme a rota. Os animais maiores são orçados pela ferramenta de tarifas de carga."
restrictions:
  - icon: 🐶
    title:
      en: Flat-faced breeds
      fr: Races brachycéphales
      es: Razas de hocico chato
      pt: "Raças de focinho achatado"
    pills:
      - cls: no
        label:
          en: Hold forbidden
          fr: Soute interdite
          es: Bodega prohibida
          pt: "Porão proibido"
    note:
      en: Snub-nosed dogs & cats aren't allowed for transport in the hold.
      fr: Les chiens et chats au nez écrasé ne sont pas admis au transport en soute.
      es: Los perros y gatos de hocico chato no se admiten para el transporte en bodega.
      pt: "Cachorros e gatos de focinho achatado não são admitidos para transporte no porão."
  - icon: 🚫
    title:
      en: French categories 1 & 2
      fr: Catégories françaises 1 & 2
      es: Categorías francesas 1 y 2
      pt: "Categorias francesas 1 e 2"
    pills:
      - cls: no
        label:
          en: Category 1 & 2 banned
          fr: Catégories 1 & 2 interdites
          es: Categorías 1 y 2 prohibidas
          pt: "Categorias 1 e 2 proibidas"
      - cls: warn
        label:
          en: Muzzle required
          fr: Muselière requise
          es: Bozal obligatorio
          pt: "Focinheira obrigatória"
    note:
      en: "French category 1 (attack) and 2 (guard) dogs and crosses are banned on all flights: pit bull, American Staffordshire, Rottweiler, Dogo Argentino, Fila, mastiffs (Bordeaux/Neapolitan/Bull/Cane Corso/German), Tosa, bulldogs. Females in heat or advanced pregnancy are refused in the hold; leash + muzzle mandatory."
      fr: "Les chiens de catégorie 1 (attaque) et 2 (garde) et leurs croisés sont interdits sur tous les vols : pit-bull, American Staffordshire, Rottweiler, Dogo Argentino, Fila, mastiffs (Bordeaux/Napolitain/Bull/Cane Corso/allemand), Tosa, bouledogues. Les femelles en chaleur ou en gestation avancée sont refusées en soute ; laisse + muselière obligatoires."
      es: "Los perros de categoría 1 (ataque) y 2 (guarda) en Francia y sus cruces están prohibidos en todos los vuelos: pit bull, American Staffordshire, Rottweiler, Dogo Argentino, Fila, mastines (de Burdeos/napolitano/Bull/Cane Corso/alemán), Tosa, bulldogs. Las hembras en celo o en gestación avanzada son rechazadas en bodega; correa + bozal obligatorios."
      pt: "Cachorros das categorias francesas 1 (ataque) e 2 (guarda), e seus cruzamentos, são proibidos em todos os voos: pit bull, American Staffordshire, Rottweiler, Dogo Argentino, Fila, mastins (de Bordeaux/napolitano/Bull/Cane Corso/alemão), Tosa, buldogues. Fêmeas no cio ou em gestação avançada são recusadas no porão; guia + focinheira obrigatórias."
temperature:
  pills:
    - cls: warn
      label:
        en: "Temperature limits: not disclosed"
        fr: "Limites de température : non communiqué"
        es: "Límites de temperatura: no comunicado"
        pt: "Limites de temperatura: não divulgados"
  note:
    en: Air Tahiti Nui publishes no hold-temperature limits; pets travel in the pressurised hold.
    fr: Air Tahiti Nui ne publie pas de limites de température en soute ; les animaux voyagent dans la soute pressurisée.
    es: Air Tahiti Nui no publica límites de temperatura en bodega; las mascotas viajan en la bodega presurizada.
    pt: "A Air Tahiti Nui não divulga limites de temperatura no porão; os animais viajam no porão pressurizado."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: Trained service animals (max 2 dogs or 1 cat) travel in the cabin, at your feet, leashed and muzzled; emotional-support animals excluded.
      fr: Les animaux d'assistance dressés (max 2 chiens ou 1 chat) voyagent en cabine, à tes pieds, en laisse et muselés ; animaux de soutien émotionnel exclus.
      es: Los animales de asistencia adiestrados (máx 2 perros o 1 gato) viajan en cabina, a tus pies, con correa y bozal; los animales de apoyo emocional quedan excluidos.
      pt: "Animais de serviço treinados (máx. 2 cachorros ou 1 gato) viajam na cabine, aos seus pés, com guia e focinheira; animais de apoio emocional ficam excluídos."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: "Valid vet certificate/passport. US routes: DOT service-animal + relief forms at check-in."
      fr: "Certificat vétérinaire/passeport valide. Vols USA : formulaires DOT d'animal d'assistance + soulagement à l'enregistrement."
      es: "Certificado veterinario/pasaporte válido. Rutas a EE. UU.: formularios DOT de animal de servicio + de desahogo en la facturación."
      pt: "Atestado veterinário/passaporte válido. Rotas para os EUA: formulários do DOT de animal de serviço + de necessidades fisiológicas no check-in."
goodToKnow:
  - icon: ✈️
    label:
      en: Cabin on 4 routes
      fr: Cabine sur 4 routes
      es: Cabina en 4 rutas
      pt: "Cabine em 4 rotas"
    value:
      en: Cabin pets only on LA–Paris, Paris–LA, Papeete–LA and Papeete–Paris; a per-flight quota applies.
      fr: Animaux en cabine uniquement sur LA–Paris, Paris–LA, Papeete–LA et Papeete–Paris ; un quota par vol s'applique.
      es: Mascotas en cabina solo en LA–París, París–LA, Papeete–LA y Papeete–París; se aplica un cupo por vuelo.
      pt: "Animais na cabine somente em LA–Paris, Paris–LA, Papeete–LA e Papeete–Paris; aplica-se uma cota por voo."
  - icon: 📄
    label:
      en: Health certificate 48 h
      fr: Certificat santé 48 h
      es: Certificado sanitario 48 h
      pt: "Atestado de saúde 48 h"
    value:
      en: Send a vet health certificate (weight/size/breed) to reservations ≥ 48 h ahead; a signed waiver is presented at check-in.
      fr: Envoyer un certificat vétérinaire (poids/taille/race) aux réservations ≥ 48 h à l'avance ; une décharge signée est présentée à l'enregistrement.
      es: Envía un certificado veterinario de salud (peso/tamaño/raza) a reservas con ≥ 48 h de antelación; en la facturación se presenta una exención firmada.
      pt: "Envie um atestado de saúde veterinário (peso/tamanho/raça) às reservas com ≥ 48 h de antecedência; um termo assinado é apresentado no check-in."
  - icon: 🌍
    label:
      en: Import permit
      fr: Permis d'importation
      es: Permiso de importación
      pt: "Autorização de importação"
    value:
      en: A destination import permit is the traveller's responsibility; non-compliance can lead to refusal and repatriation at your cost.
      fr: Un permis d'importation du pays de destination est à la charge du voyageur ; le non-respect peut entraîner un refus et un rapatriement à tes frais.
      es: El permiso de importación del destino es responsabilidad del viajero; el incumplimiento puede dar lugar a rechazo y repatriación a tu cargo.
      pt: "A autorização de importação do destino é responsabilidade do viajante; o não cumprimento pode levar à recusa e à repatriação por sua conta."
