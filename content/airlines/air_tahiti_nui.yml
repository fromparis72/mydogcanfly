        es: 150 €
        pt: "150 €"
    - label:
        en: Cabin — Papeete → LA / Paris
        fr: Cabine — Papeete → LA / Paris
        es: Cabina — Papeete → LA / París
        pt: "Cabine — Papeete → LA / Paris"
      value:
        en: XPF 14,000 / 24,000
        fr: 14 000 / 24 000 XPF
        es: 14 000 / 24 000 XPF
        pt: "XPF 14.000 / 24.000"
    - label:
        en: Cargo (hold)
        fr: Fret (soute)
        es: Carga (bodega)
        pt: "Carga (porão)"
