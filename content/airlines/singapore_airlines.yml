verdictNote:
  en: No cabin pets (only assistance dogs); cats & dogs travel as checked baggage in the hold.
  fr: Pas d'animaux en cabine (sauf chiens d'assistance) ; chats et chiens en bagage enregistré en soute.
  es: No se admiten mascotas en cabina (solo perros de asistencia); los gatos y perros viajan como equipaje facturado en la bodega.
  pt: "Sem animais na cabine (somente cachorros de assistência); gatos e cachorros viajam como bagagem despachada no porão."
