id: airline_singapore_airlines
mono: SQ
name: Singapore Airlines
titleH1:
  en: Flying with a dog on Singapore Airlines
  fr: Voyager avec un chien sur Singapore Airlines
  es: Viajar con un perro en Singapore Airlines
  pt: "Viajar com um cachorro na Singapore Airlines"
metaDesc:
  en: "Singapore Airlines pet policy: no cabin pets, checked-hold and cargo rules, fares, breed limits and official sources."
  fr: "Politique animaux Singapore Airlines : pas de cabine, soute et fret, tarifs, restrictions de races et sources officielles."
  es: "Política de mascotas de Singapore Airlines: sin mascotas en cabina, normas de bodega facturada y carga, tarifas, límites por raza y fuentes oficiales."
  pt: "Política de animais da Singapore Airlines: sem animais na cabine, regras de porão facturado e carga, tarifas, limites por raça e fontes oficiais."
