id: airline_tui_airways
mono: BY
name: TUI Airways
titleH1:
  en: Flying with a dog on TUI Airways
  fr: Voyager avec un chien sur TUI Airways
  es: Volar con un perro en TUI Airways
  pt: "Viajar com um cachorro na TUI Airways"
metaDesc:
  en: "TUI Airways pet policy: no pets in the cabin, hold as cargo only through ECS Group, no published weights or fares, assistance dogs and official sources."
  fr: "Politique animaux TUI Airways : pas d'animaux en cabine, soute en régime fret via ECS Group, aucun poids ni tarif publié, chiens d'assistance et sources officielles."
  es: "Política de mascotas de TUI Airways: sin mascotas en cabina, bodega solo como carga mediante ECS Group, sin pesos ni tarifas publicadas, perros de asistencia y fuentes oficiales."
  pt: "Política de animais da TUI Airways: sem animais na cabine, porão apenas em regime de carga via ECS Group, sem pesos nem tarifas publicados, cães de assistência e fontes oficiais."
