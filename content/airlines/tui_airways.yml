verdict:
  cls: warn
  label:
    en: Via a third party
    fr: Via un prestataire
    es: Mediante un proveedor
    pt: "Via prestador externo"
verdictNote:
  en: "TUI is explicit: \"All pets flying with TUI travel in the hold as cargo and not in the passenger cabin.\" The hold stays open, but only under a cargo booking handled by ECS Group — which is also why no weight, size or price appears on TUI's own pages."
  fr: "TUI est explicite : « All pets flying with TUI travel in the hold as cargo and not in the passenger cabin. » La soute reste ouverte, mais uniquement sous réservation fret gérée par ECS Group — ce qui explique aussi qu'aucun poids, gabarit ni prix n'apparaisse sur les pages de TUI."
  es: "TUI es explícita: «All pets flying with TUI travel in the hold as cargo and not in the passenger cabin». La bodega sigue abierta, pero solo mediante una reserva de carga gestionada por ECS Group, y por eso tampoco aparece ningún peso, medida ni precio en las páginas de TUI."
  pt: "A TUI é explícita: \"All pets flying with TUI travel in the hold as cargo and not in the passenger cabin.\" O porão continua aberto, mas apenas com reserva de carga feita pela ECS Group — e é também por isso que nenhum peso, medida ou preço aparece nas páginas da TUI."
