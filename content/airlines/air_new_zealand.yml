id: airline_air_new_zealand
mono: NZ
name: Air New Zealand
titleH1:
  en: Flying with a dog on Air New Zealand
  fr: Voyager avec un chien sur Air New Zealand
  es: Volar con un perro en Air New Zealand
  pt: "Viajar com um cachorro pela Air New Zealand"
metaDesc:
  en: "Air New Zealand pet policy: no cabin pets, domestic hold, cargo pet services, snub-nosed 5-hour limit and official sources."
  fr: "Politique animaux Air New Zealand : pas de cabine, soute domestique, services cargo, limite brachy 5 h et sources officielles."
  es: "Política de mascotas de Air New Zealand: sin mascotas en cabina, bodega nacional, servicios de carga para mascotas, límite de 5 horas para hocico chato y fuentes…"
  pt: "Política de animais da Air New Zealand: sem cabine, porão em voos domésticos, carga para animais, limite de 5 horas para focinho achatado e fontes."
chips:
  - icon: ✈
    label:
      en: Star Alliance
      fr: Star Alliance
      es: Star Alliance
      pt: "Star Alliance"
  - icon: 📍
    label:
      en: New Zealand · AKL
      fr: Nouvelle-Zélande · AKL
      es: Nueva Zelanda · AKL
      pt: "Nova Zelândia · AKL"
  - icon: ✓
    label:
      en: Verified 11 Jul 2026
      fr: Vérifié le 11 juil. 2026
      es: Verificado el 11 jul. 2026
      pt: "Verificado em 11 jul. 2026"
    cls: ok
verdict:
  cls: warn
  label:
    en: Moderate
    fr: Modéré
    es: Moderado
    pt: "Moderada"
verdictNote:
  en: No cabin pets (service dogs only); pets fly in the hold on NZ domestic flights, and internationally only via approved transporters.
  fr: Pas d'animaux en cabine (chiens d'assistance seuls) ; les animaux volent en soute sur les vols domestiques NZ, et à l'international uniquement via des transporteurs agréés.
  es: No se admiten mascotas en cabina (solo perros de asistencia); las mascotas vuelan en bodega en los vuelos nacionales de NZ, y a nivel internacional solo vía transportistas autorizados.
  pt: "Nenhum animal na cabine (somente cães de serviço); os animais voam no porão nos voos domésticos da NZ e, internacionalmente, somente via transportadoras aprovadas."
