policies:
  cabin:
    availability: offered
  hold:
    availability: offered
  cargo:
    review_state: legacy_unreviewed
channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Cats & dogs only ≤ 8 kg incl. container (max 55 × 40 × 20 cm); limited seats per cabin, incl. Q400 aircraft.
      fr: Chats et chiens uniquement ≤ 8 kg avec le sac (max 55 × 40 × 20 cm) ; places limitées par cabine, y compris avions Q400.
      es: Solo perros y gatos ≤ 8 kg con la jaula (máx. 55 × 40 × 20 cm); plazas limitadas por cabina, incluidos los aviones Q400.
      pt: "Somente gatos e cachorros ≤ 8 kg com a caixa (máx. 55 × 40 × 20 cm); lugares limitados por cabine, inclusive em aeronaves Q400."
    fee:
      en: $100–300
      fr: 100–300 $
      es: 100–300 $
      pt: "US$ 100–300"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: When the cage exceeds cabin size or pet + cage is over 8 kg, up to 45 kg.
      fr: Quand la caisse dépasse la taille cabine ou que l'animal + caisse fait plus de 8 kg, jusqu'à 45 kg.
      es: Cuando la jaula supera el tamaño de cabina o la mascota + jaula pasa de 8 kg, hasta 45 kg.
      pt: "Quando a caixa ultrapassa o tamanho de cabine ou o animal + caixa passa de 8 kg, até 45 kg."
    fee:
      en: $370–500
      fr: 370–500 $
      es: 370–500 $
      pt: "US$ 370–500"
  - placement: cargo
    icon: ✈️
    name:
      en: Ethiopian Cargo
      fr: Ethiopian Cargo
      es: Ethiopian Cargo
      pt: "Ethiopian Cargo"
    cls: warn
    statusLabel:
      en: Via cargo
      fr: Via fret
      es: Vía carga
      pt: "Via carga"
    detail:
      en: Pets (incl. cage) over 45 kg travel as cargo via Ethiopian Cargo's Live Animals service.
      fr: Les animaux (avec la caisse) de plus de 45 kg voyagent en fret via le service animaux vivants d'Ethiopian Cargo.
      es: Las mascotas (con la jaula) de más de 45 kg viajan como carga por el servicio de animales vivos de Ethiopian Cargo.
      pt: "Animais (com a caixa) acima de 45 kg viajam como carga pelo serviço de animais vivos da Ethiopian Cargo."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
