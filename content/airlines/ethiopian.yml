  label:
    en: Moderate
    fr: Modéré
    es: Moderado
    pt: "Moderada"
verdictNote:
  en: Small cats & dogs in the cabin, larger in the hold — but snub-nosed breeds are banned and advance booking is required.
  fr: Petits chats et chiens en cabine, plus grands en soute — mais races au nez écrasé interdites et réservation préalable requise.
  es: Perros y gatos pequeños en cabina, los más grandes en bodega, pero las razas de hocico chato están vetadas y hace falta reservar con antelación.
  pt: "Gatos e cachorros pequenos na cabine, os maiores no porão — mas raças de focinho achatado são proibidas e é exigida reserva antecipada."
