id: airline_ethiopian
mono: ET
name: Ethiopian Airlines
titleH1:
  en: Flying with a dog on Ethiopian Airlines
  fr: Voyager avec un chien sur Ethiopian Airlines
  es: Volar con un perro en Ethiopian Airlines
  pt: "Voar com um cachorro na Ethiopian Airlines"
metaDesc:
  en: "Ethiopian Airlines pet policy: cabin, hold and Ethiopian Cargo, fares by zone, snub-nosed ban and official sources."
  fr: "Politique animaux Ethiopian Airlines : cabine, soute et Ethiopian Cargo, tarifs par zone, interdiction brachy et sources officielles."
  es: "Política de mascotas de Ethiopian Airlines: cabina, bodega y Ethiopian Cargo, tarifas por zona, veto braquicéfalo y fuentes oficiales."
  pt: "Política de animais da Ethiopian Airlines: cabine, porão e Ethiopian Cargo, tarifas por zona, proibição de raças de focinho achatado e fontes oficiais."
