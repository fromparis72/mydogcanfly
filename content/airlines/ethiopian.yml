      en: Ethiopia · ADD
      fr: Éthiopie · ADD
      es: Etiopía · ADD
      pt: "Etiópia · ADD"
  - icon: 🗓
    label:
      en: Updated 11 Jul 2026
      fr: Mise à jour le 11 juil. 2026
