  en: Flying with a dog on Virgin Australia
  fr: Voyager avec un chien sur Virgin Australia
  es: Volar con un perro en Virgin Australia
  pt: "Viajar com um cachorro na Virgin Australia"
metaDesc:
  en: "Virgin Australia pet policy: cabin trial on select routes, Virgin Australia Cargo, breed limits and official sources."
  fr: "Politique animaux Virgin Australia : cabine en test sur certaines routes, Virgin Australia Cargo, restrictions de races et sources officielles."
  es: "Política de mascotas de Virgin Australia: prueba en cabina en rutas seleccionadas, Virgin Australia Cargo, restricciones de razas y fuentes oficiales."
  pt: "Política de animais da Virgin Australia: teste de cabine em rotas selecionadas, Virgin Australia Cargo, limites por raça e fontes oficiais."
