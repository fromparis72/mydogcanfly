verdictNote:
  en: Pets now fly in the cabin on select domestic routes (trial); other animals may possibly travel via Virgin Australia Cargo, subject to route, aircraft, transport partner and prior acceptance.
  fr: Les animaux volent désormais en cabine sur certaines routes domestiques (test) ; les autres peuvent éventuellement voyager via Virgin Australia Cargo, sous réserve de l'itinéraire, de l'appareil, du partenaire de transport et de l'acceptation préalable.
  es: Las mascotas ya vuelan en cabina en rutas nacionales seleccionadas (prueba); los demás animales pueden eventualmente viajar vía Virgin Australia Cargo, sujeto a la ruta, el avión, el socio de transporte y la aceptación previa.
  pt: "Os animais agora voam na cabine em rotas domésticas selecionadas (teste); os demais animais podem eventualmente viajar via Virgin Australia Cargo, sujeito à rota, à aeronave, ao parceiro de transporte e à aceitação prévia."
