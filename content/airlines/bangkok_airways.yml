  label:
    en: Hold only
    fr: Soute uniquement
    es: Solo bodega
    pt: "Somente porão"
verdictNote:
  en: No cabin for pets at all. The hold is well documented but capped by aircraft type — 20 kg on the ATR, 60 kg on the Airbus — and open on a handful of routes only.
  fr: Aucune cabine pour les animaux. La soute est bien documentée mais plafonnée par appareil — 20 kg sur ATR, 60 kg sur Airbus — et ouverte sur une poignée de routes seulement.
  es: No hay cabina para mascotas. La bodega está bien documentada, pero limitada según el avión — 20 kg en ATR, 60 kg en Airbus — y abierta solo en unas pocas rutas.
  pt: "Não há cabine para animais. O porão é bem documentado, mas limitado pelo tipo de aeronave — 20 kg no ATR, 60 kg no Airbus — e aberto em apenas algumas rotas."
