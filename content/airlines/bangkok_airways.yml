id: airline_bangkok_airways
mono: PG
name: Bangkok Airways
titleH1:
  en: Flying with a dog on Bangkok Airways
  fr: Voyager avec un chien sur Bangkok Airways
  es: Volar con un perro en Bangkok Airways
  pt: "Viajar com um cachorro na Bangkok Airways"
metaDesc:
  en: "Bangkok Airways pet policy: no pet cabin, hold limits by aircraft (20 kg on ATR, 60 kg on Airbus), the short list of open routes, banned breeds and official sources."
  fr: "Politique animaux Bangkok Airways : pas de cabine pour les animaux, limites de soute par appareil (20 kg sur ATR, 60 kg sur Airbus), routes ouvertes, races interdites et sources officielles."
  es: "Política de mascotas de Bangkok Airways: sin cabina para mascotas, límites de bodega por avión (20 kg en ATR, 60 kg en Airbus), rutas abiertas, razas prohibidas y fuentes oficiales."
  pt: "Política de animais da Bangkok Airways: sem cabine para animais, limites de porão por aeronave (20 kg no ATR, 60 kg no Airbus), rotas abertas, raças proibidas e fontes oficiais."
