id: airline_air_austral
mono: UU
name: Air Austral
titleH1:
  en: Flying with a dog on Air Austral
  fr: Voyager avec un chien sur Air Austral
  es: Volar con un perro en Air Austral
  pt: "Viajar com um cachorro na Air Austral"
metaDesc:
  en: "Air Austral pet policy: under 8 kg in the cabin, up to 75 kg in the hold, five published crate sizes, capacity per aircraft and official sources."
  fr: "Politique animaux Air Austral : moins de 8 kg en cabine, jusqu'à 75 kg en soute, cinq gabarits de caisse publiés, capacités par appareil et sources officielles."
  es: "Política de mascotas de Air Austral: menos de 8 kg en cabina, hasta 75 kg en bodega, cinco tamaños de jaula publicados, capacidad por avión y fuentes oficiales."
  pt: "Política de animais da Air Austral: menos de 8 kg na cabine, até 75 kg no porão, cinco tamanhos de caixa publicados, capacidade por aeronave e fontes oficiais."
chips:
  - icon: 📍
    label:
      en: Réunion · RUN
      fr: La Réunion · RUN
      es: Reunión · RUN
      pt: "Reunião · RUN"
  - icon: 🐶
    label:
      en: No flat-faced restriction
      fr: Aucune restriction brachycéphale
      es: Sin restricción para braquicéfalos
      pt: "Sem restrição a braquicefálicos"
    cls: ok
  - icon: 🗓
    label:
      en: Updated 8 Aug 2026
      fr: Mise à jour le 8 août 2026
      es: Actualizado el 8 ago. 2026
      pt: "Atualizado em 8 ago. 2026"
verdict:
  cls: ok
  label:
    en: Easy
    fr: Facile
    es: Fácil
    pt: "Fácil"
verdictNote:
  en: Cabin and hold are both open up to 75 kg with a single flat fare and published crate sizes; the one gap is that no cabin-bag dimension is published.
  fr: Cabine et soute sont ouvertes jusqu'à 75 kg, avec un tarif unique et des gabarits de caisse publiés ; seul manque à l'appel, aucune cote de sac cabine n'est publiée.
  es: Cabina y bodega están abiertas hasta 75 kg, con una tarifa única y tamaños de jaula publicados; lo único que falta son las medidas del bolso de cabina.
  pt: "Cabine e porão estão abertos até 75 kg, com tarifa única e tamanhos de caixa publicados; a única lacuna é que nenhuma medida da bolsa de cabine é publicada."
ladder:
  - flex: 12
    color: "#16794f"
    label:
