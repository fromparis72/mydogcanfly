verdict:
  cls: warn
  label:
    en: Moderate
    fr: Modéré
    es: Moderado
    pt: "Moderada"
verdictNote:
  en: Small pets in the cabin, larger in the hold — snub-nosed breeds barred from the hold, and the UK/South Africa are cargo-only.
  fr: Petits animaux en cabine, plus grands en soute — races au nez écrasé interdites en soute, et R.-U./Afrique du Sud en fret.
  es: Mascotas pequeñas en cabina, las más grandes en bodega; las razas de hocico chato están vetadas en bodega, y el RU/Sudáfrica son solo de carga.
  pt: "Animais pequenos na cabine, os maiores no porão — as raças de focinho achatado são vetadas no porão, e o Reino Unido/África do Sul são somente via carga."
