id: airline_austrian
mono: OS
name: Austrian Airlines
titleH1:
  en: Flying with a dog on Austrian Airlines
  fr: Voyager avec un chien sur Austrian Airlines
  es: Viajar con perro en Austrian Airlines
  pt: "Viajar com um cachorro pela Austrian Airlines"
metaDesc:
  en: "Austrian Airlines pet policy: cabin, hold and Lufthansa Cargo, fares by zone, snub-nosed hold ban and official sources."
  fr: "Politique animaux Austrian Airlines : cabine, soute et Lufthansa Cargo, tarifs par zone, interdiction soute brachy et sources officielles."
  es: "Política de mascotas de Austrian Airlines: cabina, bodega y Lufthansa Cargo, tarifas por zona, veto en bodega a razas de hocico chato y fuentes oficiales."
  pt: "Política de animais da Austrian Airlines: cabine, porão e Lufthansa Cargo, tarifas por zona, proibição de raças de focinho achatado no porão e fontes oficiais."
chips:
