restrictions:
  - icon: 🐶
    title:
      en: Flat-faced breeds
      fr: Races brachycéphales
      es: Razas de hocico chato
      pt: "Raças de focinho achatado"
    pills:
      - cls: ok
        label:
          en: Cabin possible
          fr: Cabine possible
          es: Cabina posible
          pt: "Cabine possível"
      - cls: no
        label:
          en: Hold forbidden
          fr: Soute interdite
          es: Bodega prohibida
          pt: "Porão proibido"
    note:
      en: "Air France doesn't publish a named list. Its wording is open-ended: snub-nosed animals — \"pugs, bulldogs, boxers, Pekingese, Shih Tzu dogs, or Persian cats\" — are barred from the hold, and it recommends asking your vet before any flight. If your dog is snub-nosed and over 8 kg, it must go by cargo. Since 15 July 2019 pugs, bulldogs and Boston terriers are no longer accepted by cargo either. Any breed not named but visibly snub-nosed: confirm with Air France."
      fr: "Air France ne publie pas de liste nominative. Sa formulation est ouverte : les animaux à nez retroussé — « carlins, bouledogues, boxers, pékinois, shih tzu ou encore chats persans » — sont interdits en soute, et elle recommande de demander l'avis de ton vétérinaire avant tout vol. Si ton chien a le nez retroussé et pèse plus de 8 kg, il doit passer par le fret. Depuis le 15 juillet 2019, les carlins, bouledogues et boston terriers ne sont plus acceptés par le fret non plus. Une race non nommée mais visiblement à museau court : confirme auprès d'Air France."
      es: "Air France no publica una lista nominal. Su formulación es abierta: los animales de hocico chato — «carlinos, bulldogs, bóxers, pekineses, shih tzu o gatos persas» — están vetados de la bodega, y recomienda consultar a tu veterinario antes de cualquier vuelo. Si tu perro tiene el hocico chato y pesa más de 8 kg, debe ir por carga. Desde el 15 de julio de 2019, los carlinos, bulldogs y boston terriers tampoco se aceptan por carga. Si tu raza no está nombrada pero es visiblemente de hocico chato: confírmalo con Air France."
      pt: "A Air France não publica uma lista nominal. Sua formulação é aberta: os animais de focinho achatado — \"pugs, buldogues, boxers, pequinesess, shih tzu ou gatos persas\" — são proibidos no porão, e ela recomenda consultar seu veterinário antes de qualquer voo. Se o seu cachorro tem focinho achatado e pesa mais de 8 kg, precisa ir por carga. Desde 15 de julho de 2019, pugs, buldogues e boston terriers também não são mais aceitos por carga. Se a sua raça não é citada mas é visivelmente de focinho curto: confirme com a Air France."
  - icon: 🚫
    title:
      en: French category 1 & 2 dogs
      fr: Chiens catégories 1 & 2
      es: Perros de categorías 1 y 2 en Francia
      pt: "Cachorros de categoria francesa 1 e 2"
    pills:
      - cls: no
        label:
          en: Cat. 1 — no transport
          fr: Cat. 1 — aucun transport
          es: Cat. 1 — ningún transporte
          pt: "Cat. 1 — nenhum transporte"
      - cls: warn
        label:
          en: Cat. 2 — cargo only
          fr: Cat. 2 — fret seulement
          es: Cat. 2 — solo carga
          pt: "Cat. 2 — somente carga"
    note:
      en: "Category 1 (attack dogs of no registered breed but resembling Staffordshire Terriers/pit bulls, American Staffordshire Terriers/pit bulls, Mastiffs/Boerboels or Tosas) is refused in the cabin, the hold and cargo alike. Category 2 (pedigreed Staffordshire Terriers, pedigreed American Staffordshire Terriers, pedigreed Tosas, and dogs resembling a Rottweiler with or without pedigree) is accepted on Air France cargo flights only — on request and subject to availability they may travel on the same flight as their owner, with an approved crate. A vet certificate of non-belonging is required in case of resemblance."
      fr: "La 1re catégorie (chiens d'attaque n'appartenant à aucune race mais assimilables aux Staffordshire terriers/pit-bulls, American Staffordshire terriers/pit-bulls, mastiffs/boerbulls ou tosas) est refusée en cabine, en soute comme en fret. La 2e catégorie (Staffordshire terriers avec pedigree, American Staffordshire terriers avec pedigree, tosas avec pedigree, et chiens assimilables à un rottweiler avec ou sans pedigree) n'est acceptée que sur les vols de fret Air France — sur demande et selon les disponibilités, ils peuvent voyager sur le même vol que leur propriétaire, avec une cage conforme aux exigences applicables. Certificat vétérinaire de non-appartenance exigé en cas de ressemblance."
      es: "La categoría 1 (perros de ataque sin raza registrada pero asimilables a Staffordshire terriers/pit bulls, American Staffordshire terriers/pit bulls, mastines/boerbulls o tosas) se rechaza tanto en cabina como en bodega y carga. La categoría 2 (Staffordshire terriers con pedigrí, American Staffordshire terriers con pedigrí, tosas con pedigrí y perros asimilables a un rottweiler con o sin pedigrí) solo se acepta en los vuelos de carga de Air France — bajo petición y según disponibilidad pueden viajar en el mismo vuelo que su dueño, con una jaula conforme a los requisitos aplicables. Se exige un certificado veterinario de no pertenencia en caso de parecido."
      pt: "A categoria 1 (cachorros de ataque sem raça registrada, mas assemelháveis a Staffordshire terriers/pit bulls, American Staffordshire terriers/pit bulls, mastins/boerbulls ou tosas) é recusada na cabine, no porão e na carga. A categoria 2 (Staffordshire terriers com pedigree, American Staffordshire terriers com pedigree, tosas com pedigree e cachorros assemelháveis a um rottweiler com ou sem pedigree) só é aceita nos voos de carga da Air France — mediante solicitação e conforme disponibilidade, podem viajar no mesmo voo que o dono, com caixa conforme a los requisitos aplicables. Atestado veterinário de não pertencimento exigido em caso de semelhança."
crate:
  - en: Fibreglass or hard-plastic shell, bolted together
    fr: Coque en fibre de verre ou plastique dur, boulonnée
    es: Carcasa de fibra de vidrio o plástico duro, atornillada
    pt: "Casco de fibra de vidro ou plástico rígido, aparafusado"
  - en: Wheels removed or taped over
    fr: Roulettes retirées ou scotchées
    es: Ruedas retiradas o cubiertas con cinta
    pt: "Rodinhas removidas ou vedadas com fita"
  - en: Central locking, top + bottom; hinges ≥ 1.6 cm
    fr: Verrouillage central haut + bas ; charnières ≥ 1,6 cm
    es: Cierre central arriba y abajo; bisagras ≥ 1,6 cm
    pt: "Trava central, na parte superior e inferior; dobradiças ≥ 1,6 cm"
  - en: Empty bowl fixed to the door, fillable from outside
    fr: Gamelle vide fixée à la porte, accessible de l'extérieur
    es: Comedero vacío fijado a la puerta, rellenable desde fuera
    pt: "Comedouro vazio fixado na porta, que pode ser abastecido por fora"
  - en: Dog can stand, turn and lie down (≥ 5 cm above the head)
    fr: L'animal se tient debout, se retourne, s'allonge (≥ 5 cm au-dessus de la tête)
    es: El perro puede ponerse de pie, girar y tumbarse (≥ 5 cm por encima de la cabeza)
    pt: "O cachorro consegue ficar em pé, virar e deitar (≥ 5 cm acima da cabeça)"
  - en: Absorbent bedding — straw forbidden
    fr: Litière absorbante — paille interdite
    es: Lecho absorbente — paja prohibida
    pt: "Forração absorvente — palha proibida"
temperature:
  pills:
    - cls: warn
      label:
        en: "Pressurisation: not disclosed"
        fr: "Pressurisation : non communiqué"
        es: "Presurización: no comunicado"
        pt: "Pressurização: não divulgada"
    - cls: warn
      label:
        en: "Temperature range: not disclosed"
        fr: "Plage de température : non communiqué"
        es: "Rango de temperatura: no comunicado"
        pt: "Faixa de temperatura: não divulgada"
    - cls: warn
      label:
        en: "Heat embargo: not disclosed"
        fr: "Embargo chaleur : non communiqué"
        es: "Embargo por calor: no comunicado"
        pt: "Embargo por calor: não divulgado"
  note:
    en: Air France does not publish a fleet-wide temperature guarantee. Suitability depends on the aircraft, route and weather, confirmed flight by flight — don't assume a hold is suitable just because the aircraft is pressurised.
    fr: Air France ne publie pas de garantie de température applicable à toute sa flotte. La compatibilité dépend de l'avion, de la route et de la météo, confirmée vol par vol — ne présume pas qu'une soute convient simplement parce que l'appareil est pressurisé.
    es: Air France no publica ninguna garantía de temperatura para toda su flota. La idoneidad depende de la aeronave, la ruta y el clima, y se confirma vuelo a vuelo — no des por hecho que una bodega es adecuada solo porque la aeronave esté presurizada.
    pt: "A Air France não publica uma garantia de temperatura válida para toda a frota. A adequação depende da aeronave, da rota e do clima, e é confirmada voo a voo — não presuma que um porão é adequado apenas porque a aeronave é pressurizada."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: Free for trained, certified guide and assistance dogs.
      fr: Gratuit pour les chiens guides et d'assistance dressés et certifiés.
      es: Gratis para perros guía y de asistencia adiestrados y certificados.
      pt: "Grátis para cães-guia e de assistência treinados e certificados."
  - icon: ✓
    label:
      en: Large dog
      fr: Grand chien
      es: Perro grande
      pt: "Cachorro grande"
    value:
      en: Free hold transport if you provide a suitable kennel (flat-faced excluded).
      fr: Transport en soute gratuit si tu fournis une caisse adaptée (brachy exclus).
      es: Transporte en bodega gratis si aportas una jaula adecuada (braquicéfalos excluidos).
      pt: "Transporte grátis no porão se você fornecer uma caixa adequada (raças de focinho achatado excluídas)."
  - icon: ⏱️
    label:
      en: Lead time
      fr: Préavis
      es: Antelación
      pt: "Antecedência"
    value:
      en: ≥ 48 h (96 h to the UAE). DOT + CDC forms for the United States.
      fr: ≥ 48 h (96 h vers les Émirats). Formulaires DOT + CDC pour les États-Unis.
      es: ≥ 48 h (96 h hacia los EAU). Formularios DOT + CDC para Estados Unidos.
      pt: "≥ 48 h (96 h para os Emirados Árabes Unidos). Formulários do DOT + CDC para os Estados Unidos."
goodToKnow:
  - icon: 🔁
    label:
      en: Connections
      fr: Correspondances
      es: Conexiones
      pt: "Conexões"
    value:
      en: At CDG and ORY you may need to collect and re-check the animal.
      fr: À CDG et ORY, il faut parfois récupérer puis réenregistrer l'animal.
      es: En CDG y ORY, a veces tendrás que recoger y volver a facturar el animal.
      pt: "Em CDG e ORY, pode ser necessário recolher e despachar o animal novamente."
  - icon: 🛋️
    label:
      en: Lounges
      fr: Salons
      es: Salas VIP
      pt: "Salas VIP"
    value:
      en: Pets welcome in a carrier; assistance dogs on a leash.
      fr: Animaux admis en sac ; chiens d'assistance tenus en laisse.
      es: Se admiten mascotas en la jaula; los perros de asistencia con correa.
      pt: "Animais bem-vindos em uma bolsa de transporte; cães de assistência com coleira."
  - icon: ⏱️
    label:
      en: Booking
      fr: Réserver
      es: Reservar
      pt: "Reserva"
    value:
      en: Prior approval required · hold ≥ 24 h · United States 48 h.
      fr: Accord préalable requis · soute ≥ 24 h · États-Unis 48 h.
      es: Se requiere aprobación previa · bodega ≥ 24 h · Estados Unidos 48 h.
      pt: "Aprovação prévia exigida · porão ≥ 24 h · Estados Unidos 48 h."
  - icon: 📄
    label:
      en: Minimum age
      fr: Âge minimal
      es: Edad mínima
      pt: "Idade mínima"
    value:
      en: "15 weeks, vaccinations up to date. Within metropolitan France (Corsica included) and between metropolitan France and Guadeloupe, Martinique or Réunion, 8 weeks is enough."
      fr: "15 semaines, vaccins à jour. En France métropolitaine (Corse comprise) et entre la métropole et la Guadeloupe, la Martinique ou La Réunion, 8 semaines suffisent."
      es: "15 semanas, con las vacunas al día. Dentro de la Francia metropolitana (Córcega incluida) y entre la metrópoli y Guadalupe, Martinica o Reunión, bastan 8 semanas."
      pt: "15 semanas, com as vacinas em dia. Dentro da França metropolitana (Córsega incluída) e entre a metrópole e Guadalupe, Martinica ou Reunião, bastam 8 semanas."
  - icon: 💺
    label:
      en: Business cabin
      fr: Cabine Business
      es: Cabina Business
      pt: "Cabine Business"
    value:
      en: "Air France doesn't accept ordinary pets in the Business cabin on intercontinental flights — your dog or cat travels in the hold instead. Since snub-nosed animals are barred from the hold, that combination leaves cargo as the only option."
      fr: "Air France n'accepte pas les animaux ordinaires en cabine Business sur les vols intercontinentaux — ton chien ou ton chat voyage alors en soute. Les animaux à nez retroussé étant interdits en soute, cette combinaison ne laisse que le fret."
      es: "Air France no acepta mascotas ordinarias en la cabina Business en los vuelos intercontinentales — tu perro o gato viaja entonces en la bodega. Como los animales de hocico chato están vetados de la bodega, esa combinación solo deja la carga."
      pt: "A Air France não aceita animais comuns na cabine Business em voos intercontinentais — seu cachorro ou gato viaja no porão. Como os animais de focinho achatado são proibidos no porão, essa combinação deixa apenas a carga."
