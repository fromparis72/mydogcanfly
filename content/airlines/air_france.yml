    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Dog or cat under 8 kg, soft ventilated bag under the seat (46 × 28 × 24 cm).
      fr: Chien ou chat < 8 kg, sac souple ventilé sous le siège (46 × 28 × 24 cm).
      es: Perro o gato de menos de 8 kg, bolsa blanda ventilada bajo el asiento (46 × 28 × 24 cm).
      pt: "Cachorro ou gato com menos de 8 kg, em bolsa flexível e ventilada sob o assento (46 × 28 × 24 cm)."
    fee:
      en: 70 – 200 €
      fr: 70 – 200 €
      es: 70 – 200 €
      pt: "70 – 200 €"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: From 8 kg up to 75 kg (kennel included). Add ≥ 24 h before departure.
      fr: De 8 kg à 75 kg (caisse incluse). À ajouter ≥ 24 h avant le départ.
      es: Desde 8 kg y hasta 75 kg (jaula incluida). Añádelo ≥ 24 h antes de la salida.
      pt: "De 8 kg até 75 kg (caixa de transporte incluída). Adicionar com ≥ 24 h de antecedência da partida."
    fee:
      en: 100 – 400 €
      fr: 100 – 400 €
      es: 100 – 400 €
      pt: "100 – 400 €"
  - placement: cargo
