  en: One of the easiest legacy airlines to fly with a dog.
  fr: Une des compagnies classiques les plus simples pour voyager avec un chien.
  es: Una de las aerolíneas tradicionales más fáciles para viajar con un perro.
  pt: "Uma das companhias tradicionais mais fáceis para viajar com um cachorro."
