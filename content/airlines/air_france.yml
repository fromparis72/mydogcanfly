      fr: Sur devis
      es: Bajo petición
      pt: "Sob consulta"
    detail:
      en: Over 75 kg or when the route requires it. Via an authorised handler.
      fr: Au-delà de 75 kg ou si la route l'exige. Via transporteur agréé.
      es: Por encima de 75 kg o cuando la ruta lo exige. A través de un agente autorizado.
      pt: "Acima de 75 kg ou quando a rota exigir. Via um agente autorizado."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
