id: airline_china_eastern
mono: MU
name: China Eastern Airlines
titleH1:
  en: Flying with a dog on China Eastern
  fr: Voyager avec un chien sur China Eastern
  es: Viajar con perro en China Eastern
  pt: "Voar com um cachorro na China Eastern"
metaDesc:
  en: "China Eastern pet policy: hold-only carriage, −12 °C to 30 °C limit, strict crate rules, breed limits and official sources."
  fr: "Politique animaux China Eastern : transport en soute uniquement, limite −12 °C à 30 °C, caisse stricte, restrictions de races et sources officielles."
  es: "Política de mascotas de China Eastern: transporte solo en bodega, límite de −12 °C a 30 °C, reglas estrictas de jaula, límites de raza y fuentes oficiales."
  pt: "Política de animais da China Eastern: transporte somente no porão, limite de −12 °C a 30 °C, regras rígidas de caixa de transporte, limites de raça e fontes."
chips:
  - icon: ✈
    label:
      en: SkyTeam
      fr: SkyTeam
      es: SkyTeam
      pt: "SkyTeam"
  - icon: 📍
    label:
      en: China · PVG
      fr: Chine · PVG
      es: China · PVG
      pt: "China · PVG"
  - icon: ✓
    label:
      en: Verified 11 Jul 2026
      fr: Vérifié le 11 juil. 2026
      es: Verificado el 11 jul 2026
      pt: "Verificado em 11 jul. 2026"
    cls: ok
verdict:
  cls: no
  label:
    en: Hard
    fr: Difficile
    es: Difícil
    pt: "Difícil"
verdictNote:
  en: No cabin pets except service dogs; cats & dogs travel as checked baggage — with a −12 °C to 30 °C limit.
  fr: Pas d'animaux en cabine sauf chiens d'assistance ; chats et chiens en bagage enregistré — avec une limite de −12 °C à 30 °C.
  es: Sin mascotas en cabina salvo perros de servicio; gatos y perros viajan como equipaje facturado, con un límite de −12 °C a 30 °C.
  pt: "Nenhum animal na cabine, exceto cães de assistência; gatos e cachorros viajam como bagagem despachada — com um limite de −12 °C a 30 °C."
