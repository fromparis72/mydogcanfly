verdictNote:
  en: Cabin and hold are both open with clear weight and crate rules, but the page contradicts itself on the cabin carrier's exact size, and the fighting-breed/brachycephalic tables leave one breed (American Bulldog) in an ambiguous spot.
  fr: Cabine et soute sont ouvertes avec des règles de poids et de caisse claires, mais la page se contredit sur la taille exacte du sac cabine, et les tableaux races dangereuses/brachycéphales laissent une race (American Bulldog) dans une zone ambiguë.
  es: "Cabina y bodega están abiertas con normas claras de peso y jaula, pero la página se contradice en el tamaño exacto de la bolsa de cabina, y las tablas de razas peligrosas/braquicéfalas dejan a una raza (American Bulldog) en una posición ambigua."
  pt: "Cabine e porão estão abertos com regras claras de peso e caixa, mas a página se contradiz quanto ao tamanho exato da bolsa de cabine, e as tabelas de raças perigosas/braquicefálicas deixam uma raça (American Bulldog) em posição ambígua."
