name: Croatia Airlines
titleH1:
  en: Flying with a dog on Croatia Airlines
  fr: Voyager avec un chien sur Croatia Airlines
  es: Volar con un perro en Croatia Airlines
  pt: "Viajar com um cachorro na Croatia Airlines"
metaDesc:
  en: "Croatia Airlines pet policy: 8 kg in the cabin, hold up to 18 kg in a shared crate — but the page gives two different carrier sizes for the same cabin bag."
  fr: "Politique animaux Croatia Airlines : 8 kg en cabine, soute jusqu'à 18 kg en caisse partagée — mais la page donne deux tailles différentes pour le même sac cabine."
  es: "Política de mascotas de Croatia Airlines: 8 kg en cabina, bodega hasta 18 kg en jaula compartida — pero la página da dos tamaños distintos para la misma bolsa de cabina."
  pt: "Política de animais da Croatia Airlines: 8 kg na cabine, porão até 18 kg em caixa compartilhada — mas a página dá dois tamanhos diferentes para a mesma bolsa de cabine."
