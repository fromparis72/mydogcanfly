  rows:
    - label:
        en: Cabin (≤ 8 kg)
        fr: Cabine (≤ 8 kg)
        es: Cabina (≤ 8 kg)
        pt: "Cabine (≤ 8 kg)"
      value:
        en: €70–500
        fr: 70–500 €
        es: 70–500 €
        pt: "70–500 €"
    - label:
        en: Hold (< 75 kg)
        fr: Soute (< 75 kg)
        es: Bodega (< 75 kg)
        pt: "Porão (< 75 kg)"
      value:
        en: €70–500
        fr: 70–500 €
        es: 70–500 €
        pt: "70–500 €"
    - label:
        en: Cargo
        fr: Fret
        es: Carga
        pt: "Carga"
      value:
        en: Quote
        fr: Devis
