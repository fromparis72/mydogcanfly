id: airline_klm
mono: KL
name: KLM Royal Dutch Airlines
titleH1:
  en: Flying with a dog on KLM
  fr: Voyager avec un chien sur KLM
  es: Viajar con un perro en KLM
  pt: "Viajar com um cachorro pela KLM"
metaDesc:
  en: "KLM pet policy: cabin, hold and cargo rules, fares by zone, breed limits, UK embargo and official sources."
  fr: "Politique animaux KLM : cabine, soute et fret, tarifs par zone, restrictions de races, embargo Royaume-Uni et sources officielles."
  es: "Política de mascotas de KLM: normas de cabina, bodega y carga, tarifas por zona, límites por raza, embargo del Reino Unido y fuentes oficiales."
  pt: "Política de animais da KLM: regras de cabine, porão e carga, tarifas por zona, restrições de raça, embargo do Reino Unido e fontes oficiais."
chips:
  - icon: ✈
    label:
      en: SkyTeam
      fr: SkyTeam
      es: SkyTeam
      pt: "SkyTeam"
  - icon: 📍
    label:
      en: Netherlands · AMS
      fr: Pays-Bas · AMS
      es: Países Bajos · AMS
      pt: "Países Baixos · AMS"
  - icon: ✓
    label:
      en: Verified 11 Jul 2026
      fr: Vérifié le 11 juil. 2026
      es: Verificado el 11 jul. 2026
      pt: "Verificado em 11 jul. 2026"
    cls: ok
verdict:
  cls: warn
  label:
    en: Moderate
    fr: Modéré
    es: Moderado
    pt: "Moderada"
verdictNote:
  en: Cats & dogs in the cabin, hold or cargo — but snub-nosed breeds are barred from the hold and no pets to the UK.
  fr: Chats et chiens en cabine, soute ou fret — mais races au nez écrasé interdites en soute et pas d'animaux vers le Royaume-Uni.
  es: Gatos y perros en cabina, bodega o carga, pero las razas de hocico chato no pueden viajar en bodega y no se admiten mascotas hacia el Reino Unido.
  pt: "Gatos e cachorros na cabine, no porão ou na carga — mas as raças de focinho achatado não podem viajar no porão, e não há transporte de animais para o Reino Unido."
ladder:
  - flex: 12
    color: "#16794f"
    label:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    sub: ≤ 8 kg
  - flex: 66
    color: "#1f5fa8"
    label:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    sub: ≤ 75 kg
  - flex: 22
    color: "#9a6410"
    label:
      en: Cargo
      fr: Fret
      es: Carga
      pt: "Carga"
    sub:
      en: 3 h+ transfer
      fr: transfert 3 h+
      es: escala de 3 h+
      pt: "conexão de 3 h+"
channels:
  - icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Aceptado
      pt: "Permitido"
    detail:
      en: One cat or dog (≤ 8 kg incl. carrier) in a closed bag under the seat (max 46 × 28 × 24 cm); Economy or intra-Europe Business.
      fr: Un chat ou chien (≤ 8 kg avec le sac) dans un sac fermé sous le siège (max 46 × 28 × 24 cm) ; Économique ou Business intra-Europe.
      es: Un gato o perro (≤ 8 kg con el bolso) en una bolsa cerrada bajo el asiento (máx. 46 × 28 × 24 cm); Economy o Business dentro de Europa.
      pt: "Um gato ou cachorro (≤ 8 kg incluindo a bolsa de transporte) em uma bolsa fechada sob o assento (máx. 46 × 28 × 24 cm); Econômica ou Executiva dentro da Europa."
    fee:
      en: €70–500
      fr: 70–500 €
      es: 70–500 €
      pt: "70–500 €"
  - icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Aceptado
      pt: "Permitido"
    detail:
      en: Larger pets (pet + kennel < 75 kg) in the hold; not on B787-9/-10, A321neo, German Airways or KLC flights over 2 h.
      fr: Animaux plus grands (animal + caisse < 75 kg) en soute ; pas sur B787-9/-10, A321neo, German Airways ni vols KLC de plus de 2 h.
      es: Mascotas más grandes (mascota + jaula < 75 kg) en bodega; no en B787-9/-10, A321neo, German Airways ni vuelos KLC de más de 2 h.
      pt: "Animais maiores (animal + caixa de transporte < 75 kg) no porão; não disponível em B787-9/-10, A321neo, German Airways ou voos da KLC com mais de 2 h."
    fee:
      en: €70–500
      fr: 70–500 €
      es: 70–500 €
      pt: "70–500 €"
  - icon: ✈️
    name:
      en: Cargo
      fr: Fret
      es: Carga
      pt: "Carga"
    cls: warn
    statusLabel:
      en: On request
      fr: Sur devis
      es: Bajo cotización
      pt: "Sob consulta"
    detail:
      en: When the transfer exceeds 3 h or the destination only allows pets as cargo. Via AF-KLM-Martinair Cargo.
      fr: Quand la correspondance dépasse 3 h ou que la destination n'autorise l'animal qu'en fret. Via AF-KLM-Martinair Cargo.
      es: Cuando la escala supera las 3 h o el destino solo admite la mascota como carga. A través de AF-KLM-Martinair Cargo.
      pt: "Quando a conexão ultrapassa 3 h ou o destino só permite o animal como carga. Via AF-KLM-Martinair Cargo."
    fee:
      en: Quote
      fr: Devis
      es: Cotización
      pt: "Cotação"
