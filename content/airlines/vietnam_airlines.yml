  rows:
    - label:
        en: Cabin (Zones A–D)
        fr: Cabine (zones A–D)
        es: Cabina (zonas A–D)
        pt: "Cabine (zonas A–D)"
      value:
        en: $300–650
        fr: 300–650 $
        es: 300–650 $
        pt: "US$ 300–650"
    - label:
        en: Hold — ≤ 9 kg
        fr: Soute — ≤ 9 kg
        es: Bodega — ≤ 9 kg
        pt: "Porão — ≤ 9 kg"
      value:
        en: $100–350
        fr: 100–350 $
        es: 100–350 $
        pt: "US$ 100–350"
    - label:
        en: Hold — 9–32 kg
        fr: Soute — 9–32 kg
        es: Bodega — 9–32 kg
        pt: "Porão — 9–32 kg"
      value:
        en: $150–550
        fr: 150–550 $
        es: 150–550 $
        pt: "US$ 150–550"
    - label:
        en: Hold — domestic (Vietnam)
        fr: Soute — national (Vietnam)
        es: Bodega — nacional (Vietnam)
        pt: "Porão — doméstico (Vietnã)"
      value:
        en: ₫1–2M
        fr: 1–2 M₫
        es: 1–2 M₫
        pt: "1–2 M₫"
    - label:
        en: Service dog
        fr: Chien d'assistance
        es: Perro de asistencia
        pt: "Cão de serviço"
      value:
        en: Free
        fr: Gratuit
        es: Gratis
        pt: "Grátis"
  note:
    en: USD by zone (international) / VND domestic, excl. VAT.
    fr: USD par zone (international) / VND national, hors TVA.
    es: USD por zona (internacional) / VND nacional, sin IVA.
    pt: "USD por zona (internacional) / VND doméstico, sem IVA."
restrictions:
  - icon: 🐶
    title:
      en: Banned breeds
      fr: Races interdites
      es: Razas prohibidas
      pt: "Raças proibidas"
    pills:
      - cls: no
        label:
          en: Cabin & hold banned
          fr: Cabine & soute interdites
          es: Cabina y bodega prohibidas
          pt: "Cabine e porão proibidos"
    note:
      en: "Snub-nosed dogs & cats aren't accepted in the cabin or hold (vulnerable to temperature/humidity/pressure/noise): bulldogs (all), boxer, pug, Boston terrier, Brussels Griffon, Pekingese, Shih Tzu, Lhasa Apso, chow chow, Shar Pei, mastiffs, Cavalier King Charles, and Burmese/Exotic/Himalayan/Persian cats. Also barred: Akita, greyhound, pit bull types, Tosa, Dogo Argentino, Rottweiler, wolfdogs."
      fr: "Chiens et chats au nez écrasé refusés en cabine et en soute (vulnérables à la température/humidité/pression/bruit) : bouledogues (tous), boxer, carlin, Boston terrier, Griffon bruxellois, pékinois, Shih Tzu, Lhasa Apso, chow chow, Shar Pei, mastiffs, Cavalier King Charles, et chats birmans/exotiques/himalayens/persans. Aussi interdits : Akita, greyhound, types pit-bull, Tosa, Dogo Argentino, Rottweiler, chiens-loups."
      es: "Los perros y gatos de hocico chato no se aceptan ni en cabina ni en bodega (vulnerables a la temperatura/humedad/presión/ruido): bulldogs (todos), bóxer, carlino, Boston terrier, grifón de Bruselas, pekinés, Shih Tzu, Lhasa Apso, chow chow, Shar Pei, mastines, Cavalier King Charles, y gatos birmano/exótico/himalayo/persa. También vetados: Akita, galgo, tipos pit bull, Tosa, Dogo Argentino, Rottweiler, perros lobo."
      pt: "Cachorros e gatos de focinho achatado não são aceitos na cabine nem no porão (vulneráveis a temperatura/umidade/pressão/ruído): bulldogs (todos), boxer, pug, Boston terrier, Griffon de Bruxelas, Pequinês, Shih Tzu, Lhasa Apso, chow chow, Shar Pei, mastins, Cavalier King Charles, e gatos burmeses/exóticos/himalaios/persas. Também proibidos: Akita, galgo, tipos pit bull, Tosa, Dogo Argentino, Rottweiler, cães-lobo."
  - icon: 🚫
    title:
      en: Other rules
      fr: Autres règles
      es: Otras normas
      pt: "Outras regras"
    pills:
      - cls: warn
        label:
          en: Certificate of Adaptation
          fr: Certificat d'adaptation
          es: Certificado de adaptación
          pt: "Certificado de adaptação"
    note:
      en: A Certificate of Adaptation may be required; the captain may refuse a pet or move it to cargo if it endangers passengers or crew.
      fr: Un certificat d'adaptation peut être exigé ; le commandant peut refuser un animal ou le transférer en fret s'il présente un risque pour les passagers ou l'équipage.
      es: Puede exigirse un certificado de adaptación; el comandante puede rechazar una mascota o trasladarla a carga si supone un riesgo para los pasajeros o la tripulación.
      pt: "Pode ser exigido um certificado de adaptação; o comandante pode recusar um animal ou transferi-lo para a carga se ele representar risco para passageiros ou tripulação."
temperature:
  pills:
    - cls: warn
      label:
        en: May refuse in extreme heat/cold
        fr: Refus possible par chaleur/froid extrême
        es: Puede rechazar en calor/frío extremo
        pt: "Pode recusar em calor/frio extremo"
  note:
    en: Vietnam Airlines publishes no numeric limit but reserves the right to require a Certificate of Adaptation or refuse pets in excessively hot or cold weather.
    fr: Vietnam Airlines ne publie pas de limite chiffrée mais se réserve le droit d'exiger un certificat d'adaptation ou de refuser les animaux par temps excessivement chaud ou froid.
    es: Vietnam Airlines no publica ningún límite numérico, pero se reserva el derecho de exigir un certificado de adaptación o de rechazar mascotas con un clima excesivamente caluroso o frío.
    pt: "A Vietnam Airlines não publica um limite numérico, mas se reserva o direito de exigir um certificado de adaptação ou recusar animais em clima excessivamente quente ou frio."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: Reduced-mobility passengers may bring a trained service dog free in the cabin, muzzled and leashed, at their feet.
      fr: Les passagers à mobilité réduite peuvent emmener un chien d'assistance dressé gratuitement en cabine, muselé et en laisse, à leurs pieds.
      es: Los pasajeros con movilidad reducida pueden llevar un perro de servicio adiestrado gratis en cabina, con bozal y correa, a sus pies.
      pt: "Passageiros com mobilidade reduzida podem levar um cão de serviço treinado gratuitamente na cabine, com focinheira e coleira, aos seus pés."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: Advance reservation required with all documents ready.
      fr: Réservation préalable requise, tous documents prêts.
      es: Se requiere reserva previa con toda la documentación lista.
      pt: "Reserva antecipada exigida, com todos os documentos prontos."
goodToKnow:
  - icon: 🚫
    label:
      en: No dogs to the US
      fr: Pas de chiens vers les USA
      es: Sin perros a EE. UU.
      pt: "Sem cachorros para os EUA"
    value:
      en: Dogs aren't carried on flights between Vietnam and the US, in any class or the hold.
      fr: Les chiens ne sont pas transportés sur les vols entre le Vietnam et les USA, en aucune classe ni en soute.
      es: Los perros no se transportan en vuelos entre Vietnam y EE. UU., en ninguna clase ni en bodega.
      pt: "Cachorros não são transportados em voos entre o Vietnã e os EUA, em nenhuma classe nem no porão."
  - icon: ✈️
    label:
      en: Australia / UK
      fr: Australie / R.-U.
      es: Australia / Reino Unido
      pt: "Austrália / Reino Unido"
    value:
      en: Pets to Australia aren't accepted; UK-bound animals only as cargo.
      fr: Les animaux vers l'Australie ne sont pas acceptés ; ceux vers le R.-U. uniquement en fret.
      es: No se aceptan mascotas a Australia; los animales con destino al Reino Unido solo como carga.
      pt: "Animais para a Austrália não são aceitos; animais com destino ao Reino Unido, somente como carga."
  - icon: ⏱️
    label:
      en: Booking
      fr: Réserver
      es: Reserva
      pt: "Reserva"
    value:
      en: Register via a Vietnam Airlines branch ≥ 24 h before departure — not fully online.
      fr: S'inscrire via une agence Vietnam Airlines ≥ 24 h avant le départ — pas entièrement en ligne.
      es: Regístrate a través de una oficina de Vietnam Airlines ≥ 24 h antes de la salida; no es totalmente en línea.
      pt: "Registre-se em uma agência da Vietnam Airlines ≥ 24 h antes da partida — não é totalmente on-line."
