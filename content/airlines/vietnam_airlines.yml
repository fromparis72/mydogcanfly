id: airline_vietnam_airlines
mono: VN
name: Vietnam Airlines
titleH1:
  en: Flying with a dog on Vietnam Airlines
  fr: Voyager avec un chien sur Vietnam Airlines
  es: Volar con un perro en Vietnam Airlines
  pt: "Viajar com um cachorro na Vietnam Airlines"
metaDesc:
  en: "Vietnam Airlines pet policy: cabin, hold and cargo, fares by zone, banned breeds, no dogs to the US and official sources."
  fr: "Politique animaux Vietnam Airlines : cabine, soute et fret, tarifs par zone, races interdites, pas de chiens vers les USA et sources officielles."
  es: "Política de mascotas de Vietnam Airlines: cabina, bodega y carga, tarifas por zona, razas prohibidas, sin perros a EE. UU. y fuentes oficiales."
  pt: "Política de animais da Vietnam Airlines: cabine, porão e carga, tarifas por zona, raças proibidas, sem cachorros para os EUA e fontes oficiais."
chips:
  - icon: ✈
    label:
      en: SkyTeam
      fr: SkyTeam
      es: SkyTeam
      pt: "SkyTeam"
  - icon: 📍
    label:
      en: Vietnam · HAN / SGN
      fr: Vietnam · HAN / SGN
      es: Vietnam · HAN / SGN
      pt: "Vietnã · HAN / SGN"
  - icon: ✓
    label:
      en: Verified 11 Jul 2026
      fr: Vérifié le 11 juil. 2026
      es: Verificado el 11 jul. 2026
      pt: "Verificado em 11 jul. 2026"
    cls: ok
verdict:
  cls: warn
  label:
    en: Moderate
    fr: Modéré
    es: Moderado
    pt: "Moderada"
verdictNote:
  en: Small pets in the cabin, larger in the hold — but many breeds banned and no dogs on Vietnam–US flights.
  fr: Petits animaux en cabine, plus grands en soute — mais de nombreuses races interdites et aucun chien sur les vols Vietnam–USA.
  es: Mascotas pequeñas en cabina, las más grandes en bodega, pero muchas razas están prohibidas y no se admiten perros en vuelos Vietnam–EE. UU.
  pt: "Animais pequenos na cabine, os maiores no porão — mas muitas raças são proibidas e não há cachorros em voos Vietnã–EUA."
ladder:
  - flex: 14
    color: "#16794f"
    label:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    sub: ≤ 6 kg
  - flex: 66
    color: "#1f5fa8"
    label:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    sub: ≤ 32 kg
  - flex: 20
    color: "#9a6410"
    label:
      en: Cargo
      fr: Fret
      es: Carga
      pt: "Carga"
    sub:
      en: "> 32 kg / UK"
      fr: "> 32 kg / R.-U."
      es: "> 32 kg / R. Unido"
      pt: "> 32 kg / Reino Unido"
channels:
  - icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Dogs & cats (10 weeks+) ≤ 6 kg incl. carrier under the seat (max 35 × 30 × 20 cm); max 2 per cabin. No dogs on Vietnam–US flights; no birds.
      fr: Chiens et chats (10 semaines+) ≤ 6 kg avec le sac sous le siège (max 35 × 30 × 20 cm) ; max 2 par cabine. Pas de chiens sur les vols Vietnam–USA ; pas d'oiseaux.
      es: Perros y gatos (10 semanas o más) de ≤ 6 kg con la jaula bajo el asiento (máx. 35 × 30 × 20 cm); máx. 2 por cabina. Sin perros en vuelos Vietnam–EE. UU.; sin aves.
      pt: "Cachorros e gatos (10 semanas ou mais) ≤ 6 kg com a bolsa sob o assento (máx. 35 × 30 × 20 cm); máx. 2 por cabine. Sem cachorros em voos Vietnã–EUA; sem aves."
    fee:
      en: $300–650
      fr: 300–650 $
      es: 300–650 $
      pt: "US$ 300–650"
  - icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Dogs, cats & ornamental birds (10 weeks+) as checked baggage up to 32 kg incl. cage; max 3 per passenger. No dogs on Vietnam–US flights.
      fr: Chiens, chats et oiseaux d'ornement (10 semaines+) en bagage enregistré jusqu'à 32 kg avec la cage ; max 3 par passager. Pas de chiens sur les vols Vietnam–USA.
      es: Perros, gatos y aves ornamentales (10 semanas o más) como equipaje facturado hasta 32 kg incluida la jaula; máx. 3 por pasajero. Sin perros en vuelos Vietnam–EE. UU.
      pt: "Cachorros, gatos e aves ornamentais (10 semanas ou mais) como bagagem despachada até 32 kg com a caixa; máx. 3 por passageiro. Sem cachorros em voos Vietnã–EUA."
    fee:
      en: $100–550
      fr: 100–550 $
      es: 100–550 $
      pt: "US$ 100–550"
  - icon: ✈️
    name:
      en: Live Animals cargo
      fr: Fret Live Animals
      es: Carga Live Animals
      pt: "Carga Live Animals"
    cls: warn
    statusLabel:
      en: Via cargo
      fr: Via fret
      es: Vía carga
      pt: "Via carga"
    detail:
      en: Over 32 kg, or routes like the UK, via Vietnam Airlines Cargo Live Animals.
      fr: Au-delà de 32 kg, ou des routes comme le R.-U., via Vietnam Airlines Cargo Live Animals.
      es: Por encima de 32 kg, o rutas como la del Reino Unido, a través de Vietnam Airlines Cargo Live Animals.
      pt: "Acima de 32 kg, ou rotas como a do Reino Unido, via Vietnam Airlines Cargo Live Animals."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
