  en: Flying with a dog on Air China
  fr: Voyager avec un chien sur Air China
  es: Volar con un perro en Air China
  pt: "Viajar com um cachorro na Air China"
metaDesc:
  en: "Air China pet policy: hold-only carriage, US dog suspension, breed limits and official sources."
  fr: "Politique animaux Air China : transport en soute uniquement, suspension des chiens vers les USA, restrictions de races et sources officielles."
  es: "Política de mascotas de Air China: transporte solo en bodega, suspensión de perros hacia EE. UU., límites de razas y fuentes oficiales."
  pt: "Política de animais da Air China: transporte somente no porão, suspensão de cachorros para os EUA, limites de raça e fontes oficiais."
