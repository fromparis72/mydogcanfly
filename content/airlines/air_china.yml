  rows:
    - label:
        en: Hold (≤ 32 kg)
        fr: Soute (≤ 32 kg)
        es: Bodega (≤ 32 kg)
        pt: "Porão (≤ 32 kg)"
      value:
        en: Special-baggage fee
        fr: Tarif bagage spécial
        es: Tarifa de equipaje especial
        pt: "Tarifa de bagagem especial"
    - label:
        en: Cargo (large)
        fr: Fret (grands)
        es: Carga (grandes)
        pt: "Carga (grande porte)"
      value:
        en: Quote
        fr: Devis
        es: Presupuesto
        pt: "Cotação"
    - label:
        en: Service dog
        fr: Chien d'assistance
        es: Perro de servicio
        pt: "Cão de serviço"
      value:
        en: Free
        fr: Gratuit
        es: Gratis
        pt: "Grátis"
  note:
    en: Air China charges pets per its special-baggage schedule (paid at check-in) — no flat published amount.
    fr: Air China facture les animaux selon son barème de bagage spécial (payé à l'enregistrement) — pas de montant fixe publié.
    es: Air China cobra las mascotas según su tarifa de equipaje especial (se paga en la facturación) — sin importe fijo publicado.
    pt: "A Air China cobra pelos animais conforme sua tabela de bagagem especial (paga no check-in) — sem valor fixo publicado."
restrictions:
  - icon: 🐶
    title:
      en: Flat-faced breeds
      fr: Races brachycéphales
      es: Razas de hocico chato
      pt: "Raças de focinho achatado"
    pills:
      - cls: no
        label:
          en: Not accepted
          fr: Non acceptées
          es: No aceptadas
          pt: "Não aceitas"
    note:
      en: "Snub-nosed dogs & cats prone to breathing difficulty aren't accepted: bulldogs, boxers, pugs, Boston terrier, mastiffs, Pekingese, chow chow, Shih Tzu, Shar Pei, pit bull types, Tosa, Dogo Argentino, and Burmese/Himalayan/Persian/Exotic cats."
      fr: "Chiens et chats au nez écrasé sujets aux difficultés respiratoires refusés : bouledogues, boxers, carlins, Boston terrier, mastiffs, pékinois, chow chow, Shih Tzu, Shar Pei, types pit-bull, Tosa, Dogo Argentino, et chats birmans/himalayens/persans/exotiques."
      es: "Los perros y gatos de hocico chato propensos a dificultades respiratorias no se aceptan: bulldogs, boxers, carlinos, Boston terrier, mastines, pekineses, chow chow, Shih Tzu, Shar Pei, tipos pit bull, Tosa, Dogo Argentino y gatos birmanos/himalayos/persas/exóticos."
      pt: "Cachorros e gatos de focinho achatado, propensos a dificuldades respiratórias, não são aceitos: bulldogues, boxers, pugs, Boston terrier, mastiffs, pequinês, chow chow, Shih Tzu, Shar Pei, tipos pit bull, Tosa, Dogo Argentino, e gatos burmeses/himalaios/persas/exóticos."
  - icon: 🚫
    title:
      en: Other rules
      fr: Autres règles
      es: Otras reglas
      pt: "Outras regras"
    pills:
      - cls: no
        label:
          en: No US dogs (since Feb 2025)
          fr: Pas de chiens USA (depuis fév. 2025)
          es: Sin perros a EE. UU. (desde feb. 2025)
          pt: "Sem cachorros para os EUA (desde fev. de 2025)"
      - cls: warn
        label:
          en: Min. 8 weeks
          fr: 8 semaines min.
          es: Mín. 8 semanas
          pt: "Mín. 8 semanas"
    note:
      en: Pregnant, nursing, sick or under-8-week animals are refused. No interline pet service. Since 1 Feb 2025, all dogs (incl. guide/hearing) are suspended on flights to the US.
      fr: Les animaux gestants, allaitants, malades ou de moins de 8 semaines sont refusés. Pas de service interligne. Depuis le 1er fév. 2025, tous les chiens (y compris guides/d'écoute) sont suspendus sur les vols vers les USA.
      es: Los animales gestantes, lactantes, enfermos o de menos de 8 semanas son rechazados. Sin servicio interlínea de mascotas. Desde el 1 de feb. de 2025, todos los perros (incluidos guía/de escucha) están suspendidos en los vuelos hacia EE. UU.
      pt: "Animais prenhes, lactantes, doentes ou com menos de 8 semanas são recusados. Sem serviço de animais interline. Desde 1º de fev. de 2025, todos os cachorros (incluindo cães-guia/de audição) estão suspensos em voos para os EUA."
temperature:
  pills:
    - cls: ok
      label:
        en: Oxygen-equipped hold required
        fr: Soute équipée d'oxygène requise
        es: Se requiere bodega equipada con oxígeno
        pt: "Porão equipado com oxigênio obrigatório"
    - cls: warn
      label:
        en: "Temperature limits: not disclosed"
        fr: "Limites de température : non communiqué"
        es: "Límites de temperatura: no comunicado"
        pt: "Limites de temperatura: não divulgados"
  note:
    en: Pets must be loaded into a cargo compartment with an oxygen supply; aircraft without one (A319/A320/737-8MAX/ARJ21) can't carry pets. No numeric temperature limit is published.
    fr: Les animaux doivent être chargés dans un compartiment équipé d'oxygène ; les avions sans (A319/A320/737-8MAX/ARJ21) ne peuvent pas transporter d'animaux. Aucune limite chiffrée de température n'est publiée.
    es: Las mascotas deben cargarse en un compartimento con suministro de oxígeno; las aeronaves sin él (A319/A320/737-8MAX/ARJ21) no pueden transportar mascotas. No se publica ningún límite numérico de temperatura.
    pt: "Os animais devem ser carregados em um compartimento de carga com suprimento de oxigênio; aeronaves sem esse recurso (A319/A320/737-8MAX/ARJ21) não podem transportar animais. Nenhum limite numérico de temperatura é publicado."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: A disabled passenger (16+) may travel with a trained guide/hearing dog free in the cabin, vested and leashed.
      fr: Un passager handicapé (16+) peut voyager avec un chien guide/d'écoute dressé gratuitement en cabine, en gilet et en laisse.
      es: Un pasajero con discapacidad (16+) puede viajar con un perro guía/de escucha adiestrado gratis en cabina, con chaleco y correa.
      pt: "Um passageiro com deficiência (16 anos ou mais) pode viajar com um cão-guia/de audição treinado, grátis na cabine, com colete e coleira."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: "Apply at an Air China office ≥ 48 h ahead with the dog's ID + quarantine certificate. Note: all dogs are suspended to the US since 1 Feb 2025."
      fr: "Demander dans un bureau Air China ≥ 48 h à l'avance avec l'ID du chien + certificat de quarantaine. Note : tous les chiens sont suspendus vers les USA depuis le 1er fév. 2025."
      es: "Solicítalo en una oficina de Air China con ≥ 48 h de antelación con la identificación del perro + certificado de cuarentena. Nota: todos los perros están suspendidos hacia EE. UU. desde el 1 de feb. de 2025."
      pt: "Solicite em um escritório da Air China com ≥ 48 h de antecedência, com a identificação do cachorro + certificado de quarentena. Nota: todos os cachorros estão suspensos para os EUA desde 1º de fev. de 2025."
goodToKnow:
  - icon: 🚫
    label:
      en: No US dogs
      fr: Pas de chiens USA
      es: Sin perros a EE. UU.
      pt: "Sem cachorros para os EUA"
    value:
      en: Since 1 Feb 2025, Air China has suspended all dogs (pets and guide/hearing dogs) on flights to the US.
      fr: Depuis le 1er fév. 2025, Air China a suspendu tous les chiens (animaux et chiens guides/d'écoute) sur les vols vers les USA.
      es: Desde el 1 de feb. de 2025, Air China ha suspendido todos los perros (mascotas y perros guía/de escucha) en los vuelos hacia EE. UU.
      pt: "Desde 1º de fev. de 2025, a Air China suspendeu todos os cachorros (de estimação e cães-guia/de audição) em voos para os EUA."
  - icon: 🧳
    label:
      en: Hold only
      fr: Soute uniquement
      es: Solo bodega
      pt: "Somente porão"
    value:
      en: One pet per passenger, in the hold on an oxygen-equipped aircraft — never in the cabin.
      fr: Un animal par passager, en soute sur un avion équipé d'oxygène — jamais en cabine.
      es: Una mascota por pasajero, en la bodega de una aeronave equipada con oxígeno — nunca en cabina.
      pt: "Um animal por passageiro, no porão de uma aeronave equipada com oxigênio — nunca na cabine."
  - icon: 📄
    label:
      en: China quarantine
      fr: Quarantaine Chine
      es: Cuarentena en China
      pt: "Quarentena na China"
    value:
      en: Pets entering China face customs quarantine (up to 30 days) unless from an exempt country, with ISO microchip + rabies docs.
      fr: Les animaux entrant en Chine subissent une quarantaine douanière (jusqu'à 30 jours) sauf pays exempté, avec puce ISO + documents rage.
      es: Las mascotas que entran en China se enfrentan a una cuarentena aduanera (hasta 30 días) salvo que procedan de un país exento, con microchip ISO + documentos de rabia.
      pt: "Os animais que entram na China enfrentam quarentena alfandegária (até 30 dias), a menos que venham de um país isento, com microchip ISO + documentos antirrábicos."
