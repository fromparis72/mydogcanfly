verdictNote:
  en: No cabin pets except service dogs; cats & dogs travel in the hold on oxygen-equipped aircraft.
  fr: Pas d'animaux en cabine sauf chiens d'assistance ; chats et chiens voyagent en soute sur avions équipés d'oxygène.
  es: No se admiten mascotas en cabina salvo perros de asistencia; los gatos y perros viajan en bodega en aeronaves equipadas con oxígeno.
  pt: "Sem animais na cabine, exceto cães de serviço; gatos e cachorros viajam no porão em aeronaves equipadas com oxigênio."
