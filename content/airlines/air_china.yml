channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: no
    statusLabel:
      en: Not allowed
      fr: Non autorisé
      es: No permitido
      pt: "Não permitido"
    detail:
      en: Pets can't enter the cabin — only trained service dogs. Cats & dogs travel in the hold.
      fr: Les animaux ne peuvent pas entrer en cabine — seulement les chiens d'assistance dressés. Chats et chiens voyagent en soute.
      es: Las mascotas no pueden entrar en cabina — solo perros de asistencia adiestrados. Los gatos y perros viajan en bodega.
      pt: "Animais não podem entrar na cabine — somente cães de serviço treinados. Gatos e cachorros viajam no porão."
    fee:
      en: —
      fr: —
      es: —
      pt: "—"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Cats & dogs (≤ 32 kg incl. container) in an oxygen-equipped hold; not on A319/A320/737-8MAX/ARJ21. One per passenger; check in 120 min ahead.
      fr: Chats et chiens (≤ 32 kg avec le contenant) dans une soute équipée d'oxygène ; pas sur A319/A320/737-8MAX/ARJ21. Un par passager ; enregistrement 120 min avant.
      es: Gatos y perros (≤ 32 kg incluido el contenedor) en una bodega equipada con oxígeno; no en A319/A320/737-8MAX/ARJ21. Uno por pasajero; factura 120 min antes.
      pt: "Gatos e cachorros (≤ 32 kg com a caixa incluída) em um porão equipado com oxigênio; não disponível em A319/A320/737-8MAX/ARJ21. Um por passageiro; check-in com 120 min de antecedência."
    fee:
      en: Special-baggage fee
      fr: Tarif bagage spécial
      es: Tarifa de equipaje especial
      pt: "Tarifa de bagagem especial"
  - placement: cargo
    icon: ✈️
    name:
      en: Air China Cargo
      fr: Air China Cargo
      es: Air China Cargo
      pt: "Air China Cargo"
    cls: warn
    statusLabel:
      en: Via cargo
      fr: Via fret
      es: Vía carga
      pt: "Via carga"
    detail:
      en: Larger animals travel via Air China Cargo.
      fr: Les animaux plus grands voyagent via Air China Cargo.
      es: Los animales más grandes viajan vía Air China Cargo.
      pt: "Animais maiores viajam via Air China Cargo."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
