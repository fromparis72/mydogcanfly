channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Dogs & cats (min. 3 months) in a soft carrier under the seat (max 55 × 40 × 23 cm); up to 12 kg on domestic flights, 8 kg elsewhere.
      fr: Chiens et chats (min. 3 mois) dans un sac souple sous le siège (max 55 × 40 × 23 cm) ; jusqu'à 12 kg sur les vols nationaux, 8 kg ailleurs.
      es: Perros y gatos (mín. 3 meses) en una jaula blanda bajo el asiento (máx. 55 × 40 × 23 cm); hasta 12 kg en vuelos nacionales, 8 kg en el resto.
      pt: "Cachorros e gatos (mín. 3 meses) em uma bolsa de transporte macia sob o assento (máx. 55 × 40 × 23 cm); até 12 kg em voos domésticos, 8 kg nos demais."
    fee:
      en: €73–230
      fr: 73–230 €
      es: 73–230 €
      pt: "73–230 €"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Dogs & cats up to 75 kg incl. carrier (AVIH) in a rigid crate. Snub-nosed breeds suspended from the hold since Oct 2025.
      fr: Chiens et chats jusqu'à 75 kg avec la caisse (AVIH), caisse rigide. Soute suspendue pour les brachycéphales depuis oct. 2025.
      es: Perros y gatos hasta 75 kg con la jaula (AVIH), en una jaula rígida. Bodega suspendida para hocicos chatos desde oct. 2025.
      pt: "Cachorros e gatos até 75 kg incluindo a caixa de transporte (AVIH), em uma caixa rígida. Raças de focinho achatado suspensas do porão desde out. 2025."
    fee:
      en: €83–330
      fr: 83–330 €
      es: 83–330 €
      pt: "83–330 €"
  - placement: cargo
    icon: ✈️
    name:
      en: Cargo
      fr: Fret
      es: Carga
      pt: "Carga"
    cls: no
    statusLabel:
      en: Not offered
      fr: Non proposé
      es: No ofrecido
      pt: "Não oferecido"
    detail:
      en: ITA carries pets only in the cabin or hold — there's no separate pet cargo service.
      fr: ITA ne transporte les animaux qu'en cabine ou en soute — pas de service fret animalier séparé.
      es: ITA solo transporta mascotas en cabina o bodega; no hay servicio de carga de mascotas por separado.
      pt: "A ITA transporta animais somente na cabine ou no porão — não há serviço separado de carga para animais."
    fee:
      en: —
      fr: —
      es: —
      pt: "—"
