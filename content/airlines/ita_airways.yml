verdictNote:
  en: Generous cabin allowance (up to 12 kg on domestic) — but phone-only booking and a snub-nosed hold ban.
  fr: Franchise cabine généreuse (jusqu'à 12 kg en national) — mais réservation par téléphone et soute interdite aux brachycéphales.
  es: Franquicia de cabina generosa (hasta 12 kg en nacional), pero reserva solo por teléfono y veto de hocicos chatos en bodega.
  pt: "Franquia generosa na cabine (até 12 kg em voos domésticos) — mas reserva somente por telefone e proibição de raças de focinho achatado no porão."
