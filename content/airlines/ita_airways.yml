  en: Generous cabin allowance (up to 12 kg on domestic) — but phone-only booking and a snub-nosed hold ban.
  fr: Franchise cabine généreuse (jusqu'à 12 kg en national) — mais réservation par téléphone et soute interdite aux brachycéphales.
