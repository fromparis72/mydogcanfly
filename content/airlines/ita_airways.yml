    en: ITA Airways publishes no hold-temperature limits or seasonal embargo on its pet pages. Suitability depends on the aircraft, route and weather.
    fr: ITA Airways ne publie pas de limites de température en soute ni d'embargo saisonnier sur ses pages animaux. La compatibilité dépend de l'avion, de la route et de la météo.
    es: ITA Airways no publica límites de temperatura en bodega ni embargo estacional en sus páginas de mascotas. La idoneidad depende del avión, la ruta y el tiempo.
    pt: "A ITA Airways não divulga limites de temperatura no porão nem embargo sazonal em suas páginas sobre animais. A adequação depende da aeronave, da rota e do clima."
