  es: Volar con un perro en ITA Airways
  pt: "Viajar com um cachorro pela ITA Airways"
metaDesc:
  en: "ITA Airways pet policy: generous cabin allowance, hold rules, fares by zone, brachycephalic hold ban and official sources."
  fr: "Politique animaux ITA Airways : cabine généreuse, soute, tarifs par zone, suspension soute brachycéphales et sources officielles."
  es: "Política de mascotas de ITA Airways: franquicia de cabina generosa, normas de bodega, tarifas por zona, veto de braquicéfalos en bodega y fuentes oficiales."
  pt: "Política de animais da ITA Airways: franquia generosa na cabine, regras de porão, tarifas por zona, proibição de braquicefálicos no porão e fontes oficiais."
