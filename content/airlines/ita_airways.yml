channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Standard service — dog or cat with soft carrier and food up to 12 kg on domestic flights and 8 kg elsewhere. A separate Large Dog service exists on selected domestic flights.
      fr: Service standard — chien ou chat avec sac souple et nourriture jusqu'à 12 kg sur les vols nationaux et 8 kg ailleurs. Un service Grand Chien distinct existe sur certains vols nationaux.
      es: "Servicio estándar: perro o gato con transportín blando y comida hasta 12 kg en vuelos nacionales y 8 kg en los demás. Existe un servicio separado para perros grandes en determinados vuelos nacionales."
      pt: "Serviço padrão — cão ou gato com bolsa flexível e alimento até 12 kg em voos domésticos e 8 kg nos demais. Há um serviço separado para cães grandes em determinados voos domésticos."
    fee:
      en: €73–230
      fr: 73–230 €
      es: 73–230 €
      pt: "73–230 €"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Dogs & cats up to 75 kg incl. carrier (AVIH) in a rigid crate. Snub-nosed breeds suspended from the hold since Oct 2025.
      fr: Chiens et chats jusqu'à 75 kg avec la caisse (AVIH), caisse rigide. Soute suspendue pour les brachycéphales depuis oct. 2025.
      es: Perros y gatos hasta 75 kg con la jaula (AVIH), en una jaula rígida. Bodega suspendida para hocicos chatos desde oct. 2025.
      pt: "Cachorros e gatos até 75 kg incluindo a caixa de transporte (AVIH), em uma caixa rígida. Raças de focinho achatado suspensas do porão desde out. 2025."
    fee:
      en: €83–330
      fr: 83–330 €
      es: 83–330 €
      pt: "83–330 €"
  - placement: cargo
    icon: ✈️
    name:
      en: Cargo
      fr: Fret
      es: Carga
      pt: "Carga"
    cls: no
    statusLabel:
      en: Not offered
      fr: Non proposé
      es: No ofrecido
      pt: "Não oferecido"
    detail:
      en: ITA carries pets only in the cabin or hold — there's no separate pet cargo service.
      fr: ITA ne transporte les animaux qu'en cabine ou en soute — pas de service fret animalier séparé.
      es: ITA solo transporta mascotas en cabina o bodega; no hay servicio de carga de mascotas por separado.
      pt: "A ITA transporta animais somente na cabine ou no porão — não há serviço separado de carga para animais."
    fee:
      en: —
      fr: —
      es: —
      pt: "—"
specialServices:
  - id: special_ita_large_dog_on_board
    placement: cabin
    species: dog
    route:
      origin_iso: IT
      destination_iso: IT
    weight:
      min_kg: 10
      min_bound: gt
      max_kg: 30
      max_bound: lte
    title:
      en: "Special case: large dog in the cabin"
      fr: "Cas particulier : grand chien en cabine"
      es: "Caso especial: perro grande en cabina"
      pt: "Caso especial: cão grande na cabine"
    summary:
      en: "On selected domestic Italian “Large Dog” flights, ITA may accept a dog weighing over 10 kg and up to 30 kg in the cabin. Prior confirmation is mandatory."
      fr: "Sur certains vols intérieurs italiens « Large Dog », ITA peut accepter en cabine un chien de plus de 10 kg et jusqu'à 30 kg. Confirmation préalable obligatoire."
      es: "En determinados vuelos nacionales italianos «Large Dog», ITA puede aceptar en cabina un perro de más de 10 kg y hasta 30 kg. La confirmación previa es obligatoria."
      pt: "Em determinados voos domésticos italianos «Large Dog», a ITA pode aceitar na cabine um cão com mais de 10 kg e até 30 kg. A confirmação prévia é obrigatória."
    details:
      en: "Request the service through the CIAO Contact Center at least 4 days before departure. Availability depends on the aircraft, other animals and operating conditions. Two passenger tickets plus a PETX surcharge, specific documents and a crash-tested harness are required."
      fr: "La demande se fait auprès du Contact Center CIAO au moins 4 jours avant le départ. La disponibilité dépend de l'avion, des autres animaux et des conditions opérationnelles. Deux billets passagers, un supplément PETX, des documents spécifiques et un harnais crash-testé sont requis."
      es: "El servicio debe solicitarse al Contact Center CIAO al menos 4 días antes de la salida. La disponibilidad depende del avión, de los demás animales y de las condiciones operativas. Se requieren dos billetes de pasajero, un suplemento PETX, documentos específicos y un arnés sometido a pruebas de choque."
      pt: "O serviço deve ser solicitado ao Contact Center CIAO pelo menos 4 dias antes da partida. A disponibilidade depende da aeronave, dos outros animais e das condições operacionais. São exigidos dois bilhetes de passageiro, uma taxa PETX, documentos específicos e um peitoral testado em colisão."
    cta:
      en: "See ITA's official Large Dog conditions"
      fr: "Voir les conditions officielles Grand Chien d'ITA"
      es: "Ver las condiciones oficiales de ITA para perros grandes"
      pt: "Ver as condições oficiais da ITA para cães grandes"
    source:
      url: "https://www.ita-airways.com/it/it/book-and-prepare/other-requests/travelling-with-pets/pets-in-cabin/large-dog-on-board"
      source_type: official_website
      verified_date: "2026-09-15"
      review_due: "2026-12-14"
      confidence: 5
      reviewer: "Codex — lecture directe de la page nationale italienne"
      history: []
      quote: |-
        Su ciascun volo Large Dog possono essere ammessi al massimo 2 cani in cabina:
        1 di peso superiore a 10 kg e fino a 15 kg
        1 di peso superiore a 15 kg e fino a 30 kg
        La disponibilità del servizio dipende:
        dal tipo di aeromobile;
        dalla presenza di altri animali a bordo;
        dalle condizioni operative del volo.
        La conferma del servizio è sempre soggetta a verifica preventiva.
        Ti consigliamo di richiedere il servizio con il maggiore anticipo possibile e, in ogni caso, almeno 4 giorni prima della partenza del volo.
        Per viaggiare con il servizio Large Dog On Board è previsto l'acquisto di due biglietti, per garantire al cane lo spazio dedicato in cabina, e il pagamento della tariffa prevista per il trasporto a bordo.
        Al momento della richiesta e del check-in sarà necessario presentare:
        attestazione del veterinario, rilasciata non oltre 20 giorni prima del volo, relativa all’ idoneità del large dog, comprensiva della valutazione dello stato di salute, del comportamento e del peso.
        documento identificativo o passaporto dell’animale;
        documentazione vaccinale aggiornata;
        attestazione assicurativa RC PET;
        Modulo di Accettazione Animali Domestici sottoscritto dal proprietario.
        Al check-in sarà inoltre verificata la presenza della pettorina Crash Tested conforme agli standard CMVSS 213 e FMVSS 213, obbligatoria per il trasporto.
      quote_language: it
      locator: "Large Dog On Board → Come funziona il servizio"
