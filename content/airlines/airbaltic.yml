titleH1:
  en: Flying with a dog on airBaltic
  fr: Voyager avec un chien sur airBaltic
  es: Volar con un perro en airBaltic
  pt: "Viajar com um cachorro na airBaltic"
metaDesc:
  en: "airBaltic pet policy: 8 kg in the cabin, hold up to 75 kg, but a self-contradicting rule on UK/Ireland routes worth reading twice."
  fr: "Politique animaux airBaltic : 8 kg en cabine, soute jusqu'à 75 kg, mais une règle qui se contredit elle-même sur les vols UK/Irlande — à lire deux fois."
  es: "Política de mascotas de airBaltic: 8 kg en cabina, bodega hasta 75 kg, pero una norma que se contradice a sí misma en las rutas Reino Unido/Irlanda — hay que leerla dos veces."
  pt: "Política de animais da airBaltic: 8 kg na cabine, porão até 75 kg, mas uma regra que se contradiz nas rotas Reino Unido/Irlanda — vale a pena ler duas vezes."
