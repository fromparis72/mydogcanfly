      value:
        en: "€70"
        fr: "70 €"
        es: "70 €"
        pt: "70 €"
    - label:
        en: Hold — 1–32 kg
        fr: Soute — 1–32 kg
        es: Bodega — 1–32 kg
        pt: "Porão — 1–32 kg"
      value:
        en: "€130"
        fr: "130 €"
        es: "130 €"
        pt: "130 €"
    - label:
        en: Hold — 33–75 kg
        fr: Soute — 33–75 kg
        es: Bodega — 33–75 kg
        pt: "Porão — 33–75 kg"
      value:
        en: "€220"
        fr: "220 €"
        es: "220 €"
        pt: "220 €"
  note:
    en: Flat fees, not zoned by distance. Non-refundable once paid; a multi-airline itinerary pays the fee to each carrier separately.
    fr: Tarifs fixes, non zonés par distance. Non remboursables une fois payés ; un itinéraire multi-compagnies paie le tarif à chaque transporteur séparément.
    es: "Tarifas fijas, sin zonificar por distancia. No reembolsables una vez pagadas; un itinerario con varias aerolíneas paga la tarifa a cada transportista por separado."
    pt: "Tarifas fixas, sem zoneamento por distância. Não reembolsáveis após o pagamento; um itinerário com várias companhias paga a tarifa a cada transportadora separadamente."
restrictions:
  - icon: 🐶
    title:
      en: Restricted breeds
      fr: Races restreintes
      es: Razas restringidas
      pt: "Raças restritas"
    pills:
      - cls: neutral
        label:
          en: Not published
          fr: Non publié
          es: No publicado
          pt: "Não publicado"
    note:
      en: "airBaltic publishes no breed list at all — no brachycephalic ban, no fighting-breed ban, for cabin or hold. This is genuinely unusual among the airlines we survey; most publish at least a snub-nosed-breed caution."
      fr: "airBaltic ne publie aucune liste de races — ni interdiction brachycéphale, ni interdiction de races dites dangereuses, en cabine comme en soute. C'est vraiment inhabituel parmi les compagnies étudiées ; la plupart publient au moins un avertissement pour les races au nez écrasé."
      es: "airBaltic no publica ninguna lista de razas: ni prohibición para razas braquicéfalas ni para razas consideradas peligrosas, en cabina ni en bodega. Es realmente inusual entre las aerolíneas que estudiamos; la mayoría publica al menos una advertencia para razas de hocico chato."
      pt: "A airBaltic não publica nenhuma lista de raças — nem proibição para braquicefálicos nem para raças consideradas perigosas, em cabine ou porão. É realmente incomum entre as companhias que estudamos; a maioria publica ao menos um aviso para raças de focinho achatado."
  - icon: 🐹
    title:
      en: Species accepted
      fr: Espèces acceptées
      es: Especies aceptadas
      pt: "Espécies aceitas"
    pills:
      - cls: ok
        label:
          en: Dogs & cats
          fr: Chiens & chats
          es: Perros y gatos
          pt: "Cachorros e gatos"
      - cls: "no"
        label:
          en: Other species → cargo only
          fr: Autres espèces → fret uniquement
          es: Otras especies → solo carga
          pt: "Outras espécies → apenas carga"
    note:
      en: Only cats and dogs travel as accompanied pets. Rabbits, birds and other species must be shipped as cargo.
      fr: Seuls les chats et les chiens voyagent comme animaux accompagnés. Lapins, oiseaux et autres espèces doivent être expédiés en fret.
      es: Solo gatos y perros viajan como mascotas acompañadas. Conejos, aves y otras especies deben enviarse como carga.
      pt: "Somente gatos e cachorros viajam como animais acompanhados. Coelhos, aves e outras espécies precisam ser enviados como carga."
temperature:
  pills:
    - cls: warn
      label:
        en: "Temperature limits: not disclosed"
        fr: "Limites de température : non communiqué"
        es: "Límites de temperatura: no comunicado"
        pt: "Limites de temperatura: não divulgados"
  note:
    en: airBaltic only offers generic reassurance ("cabin is climate-controlled," "cargo area is pressurized") — no °C threshold and no seasonal embargo are published.
    fr: airBaltic ne donne que des formules rassurantes génériques (« cabine climatisée », « soute pressurisée ») — aucun seuil en °C, aucun embargo saisonnier publié.
    es: "airBaltic solo ofrece frases genéricas tranquilizadoras (“cabina climatizada”, “bodega presurizada”): no publica ningún umbral en °C ni ningún embargo estacional."
    pt: "A airBaltic só oferece frases genéricas tranquilizadoras (“cabine climatizada”, “porão pressurizado”) — nenhum limite em °C, nenhum embargo sazonal publicado."
assistance:
  - icon: ❓
    label:
      en: Assistance dogs
      fr: Chiens d'assistance
      es: Perros de asistencia
      pt: "Cães de assistência"
    value:
      en: "Free, no carrier and no weight limit, sits at your feet. Certificate needed from ADI, IGDF, ADEu or EGDFEF (UK flights: ADI or IGDF only, plus a mandatory UK pre-approval letter and contact with the Animal Reception Center 72 h ahead). Emotional support animals are explicitly not accepted — only as a standard paid pet."
      fr: "Gratuit, sans caisse ni limite de poids, aux pieds du passager. Certificat requis d'ADI, IGDF, ADEu ou EGDFEF (vols UK : ADI ou IGDF uniquement, plus une lettre d'approbation préalable UK obligatoire et un contact avec l'Animal Reception Center 72 h avant). Les animaux de soutien émotionnel ne sont explicitement pas acceptés — seulement comme animal payant classique."
      es: "Gratis, sin jaula ni límite de peso, a los pies del pasajero. Se necesita certificado de ADI, IGDF, ADEu o EGDFEF (vuelos al Reino Unido: solo ADI o IGDF, más una carta de preaprobación obligatoria del Reino Unido y contacto con el Animal Reception Center 72 h antes). Los animales de apoyo emocional no se aceptan explícitamente — solo como mascota de pago estándar."
      pt: "Grátis, sem caixa nem limite de peso, aos pés do passageiro. Certificado necessário de ADI, IGDF, ADEu ou EGDFEF (voos para o Reino Unido: apenas ADI ou IGDF, mais uma carta de pré-aprovação obrigatória do Reino Unido e contato com o Animal Reception Center 72 h antes). Animais de apoio emocional não são explicitamente aceitos — apenas como animal de estimação pago padrão."
goodToKnow:
  - icon: ⚠️
    label:
      en: A route rule that contradicts itself
      fr: Une règle de route qui se contredit elle-même
      es: Una norma de ruta que se contradice a sí misma
      pt: "Uma regra de rota que se contradiz"
    value:
      en: "airBaltic's own FAQ states three route rules in a row: to the UK, Ireland, Iceland and the UAE, no cabin or hold — cargo only. From the UK, Ireland, Iceland and the UAE, hold IS allowed. From London Gatwick and Dublin specifically, hold is NOT allowed. Gatwick is in the UK and Dublin is in Ireland — so rules two and three describe overlapping routes with opposite answers, on the same page. Call to confirm before booking either direction."
      fr: "Le FAQ d'airBaltic pose trois règles de route à la suite : vers le UK, l'Irlande, l'Islande et les Émirats, ni cabine ni soute — fret uniquement. Depuis le UK, l'Irlande, l'Islande et les Émirats, la soute EST autorisée. Depuis Londres Gatwick et Dublin en particulier, la soute n'est PAS autorisée. Or Gatwick est au Royaume-Uni et Dublin en Irlande — les règles deux et trois décrivent des trajets qui se recoupent avec des réponses opposées, sur la même page. Appelle pour confirmer avant de réserver, dans un sens comme dans l'autre."
      es: "El FAQ de airBaltic enumera tres normas de ruta seguidas: hacia Reino Unido, Irlanda, Islandia y Emiratos, ni cabina ni bodega — solo carga. Desde Reino Unido, Irlanda, Islandia y Emiratos, la bodega SÍ está permitida. Desde Londres Gatwick y Dublín en concreto, la bodega NO está permitida. Pero Gatwick está en el Reino Unido y Dublín en Irlanda: las normas dos y tres describen rutas que se solapan con respuestas opuestas, en la misma página. Llama para confirmarlo antes de reservar, en cualquier dirección."
      pt: "O FAQ da airBaltic lista três regras de rota seguidas: para Reino Unido, Irlanda, Islândia e Emirados, nem cabine nem porão — só carga. De Reino Unido, Irlanda, Islândia e Emirados, o porão É permitido. De Londres Gatwick e Dublin especificamente, o porão NÃO é permitido. Mas Gatwick fica no Reino Unido e Dublin na Irlanda — as regras dois e três descrevem rotas que se sobrepõem com respostas opostas, na mesma página. Ligue para confirmar antes de reservar, em qualquer direção."
  - icon: 🔢
    label:
      en: Two different destination counts
      fr: Deux nombres de destinations différents
      es: Dos cifras de destinos diferentes
      pt: "Dois números de destinos diferentes"
    value:
      en: "airBaltic's consumer site says \"more than 80 destinations,\" while its corporate site says \"over 100 destinations\" — two official airBaltic web properties, two different figures."
      fr: "Le site grand public d'airBaltic annonce « plus de 80 destinations », tandis que son site corporate dit « plus de 100 destinations » — deux sites officiels airBaltic, deux chiffres différents."
      es: "El sitio de consumidor de airBaltic dice “más de 80 destinos”, mientras que su sitio corporativo dice “más de 100 destinos”: dos webs oficiales de airBaltic, dos cifras distintas."
      pt: "O site voltado ao consumidor da airBaltic diz “mais de 80 destinos”, enquanto o site corporativo diz “mais de 100 destinos” — dois sites oficiais da airBaltic, dois números diferentes."
  - icon: 🔢
    label:
      en: No published per-aircraft cap
      fr: Aucun plafond par avion publié
      es: Sin límite publicado por avión
      pt: "Sem limite publicado por avião"
    value:
      en: "The page states \"there's a limit to how many pets can fly on each flight\" without ever giving the number — you only find out by contacting airBaltic."
      fr: "La page affirme qu'« il existe une limite au nombre d'animaux pouvant voyager par vol » sans jamais donner ce chiffre — on ne le connaît qu'en contactant airBaltic."
      es: "La página afirma que “existe un límite al número de mascotas que pueden volar en cada vuelo” sin dar nunca esa cifra — solo se conoce contactando con airBaltic."
      pt: "A página afirma que “há um limite de quantos animais podem voar em cada voo” sem nunca informar o número — só se descobre entrando em contato com a airBaltic."
