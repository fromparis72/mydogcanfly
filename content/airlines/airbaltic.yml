  cabin:
    availability: offered
  hold:
    availability: offered
  cargo:
    review_state: legacy_unreviewed
channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: 8 kg (pet + carrier), closed waterproof and breathable carrier up to 55 × 40 × 23 cm, stowed under the seat in front of you. One carrier per person; two pets of the same kind may share a carrier if they fit. No seats in the first row or at an emergency exit. Contact airBaltic before booking to check space, then pay online.
      fr: 8 kg (animal + caisse), caisse fermée, imperméable et aérée jusqu'à 55 × 40 × 23 cm, rangée sous le siège devant toi. Une caisse par personne ; deux animaux de la même espèce peuvent partager une caisse s'ils y tiennent. Ni première rangée ni sortie de secours. Contacter airBaltic avant de réserver pour vérifier la place, puis payer en ligne.
      es: "8 kg (mascota + jaula), jaula cerrada, impermeable y ventilada de hasta 55 × 40 × 23 cm, guardada bajo el asiento delantero. Una jaula por persona; dos mascotas de la misma especie pueden compartir jaula si caben. Ni primera fila ni salida de emergencia. Contactar con airBaltic antes de reservar para comprobar el espacio disponible, y pagar en línea después."
      pt: "8 kg (animal + caixa), caixa fechada, impermeável e ventilada de até 55 × 40 × 23 cm, guardada sob o assento da frente. Uma caixa por pessoa; dois animais da mesma espécie podem dividir uma caixa se couberem. Nem primeira fila nem saída de emergência. Contate a airBaltic antes de reservar para checar disponibilidade, e pague on-line depois."
    fee:
      en: "€70 per crate, per direction"
      fr: "70 € par caisse, par direction"
      es: "70 € por jaula, por trayecto"
      pt: "70 € por caixa, por trecho"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Up to 75 kg (pet + crate) — except Amsterdam flights, capped at 39 kg. Hard plastic or wood crate up to 84 × 142 × 84 cm, no wheels, at least 2 handles above 32 kg. Two pets of the same kind up to 14 kg each may share a crate, or three young animals of the same litter under 6 months. Arrive at least 2 hours before departure.
      fr: Jusqu'à 75 kg (animal + caisse) — sauf vols Amsterdam, plafonnés à 39 kg. Caisse rigide en plastique ou en bois jusqu'à 84 × 142 × 84 cm, sans roulettes, au moins 2 poignées au-delà de 32 kg. Deux animaux de la même espèce jusqu'à 14 kg chacun peuvent partager une caisse, ou trois jeunes animaux de la même portée de moins de 6 mois. Arriver au moins 2 h avant le départ.
      es: "Hasta 75 kg (mascota + jaula), salvo vuelos a Ámsterdam, limitados a 39 kg. Jaula rígida de plástico o madera de hasta 84 × 142 × 84 cm, sin ruedas, al menos 2 asas por encima de 32 kg. Dos mascotas de la misma especie de hasta 14 kg cada una pueden compartir jaula, o tres crías de la misma camada menores de 6 meses. Llegar al menos 2 h antes de la salida."
      pt: "Até 75 kg (animal + caixa) — exceto voos para Amsterdã, limitados a 39 kg. Caixa rígida de plástico ou madeira de até 84 × 142 × 84 cm, sem rodas, pelo menos 2 alças acima de 32 kg. Dois animais da mesma espécie de até 14 kg cada podem dividir uma caixa, ou três filhotes da mesma ninhada com menos de 6 meses. Chegue com pelo menos 2 h de antecedência."
    fee:
      en: "€130 (1–32 kg) or €220 (33–75 kg) per crate, per direction"
      fr: "130 € (1–32 kg) ou 220 € (33–75 kg) par caisse, par direction"
      es: "130 € (1–32 kg) o 220 € (33–75 kg) por jaula, por trayecto"
      pt: "130 € (1–32 kg) ou 220 € (33–75 kg) por caixa, por trecho"
  - placement: cargo
    icon: ✈️
    name:
      en: Cargo
      fr: Fret
      es: Carga
      pt: "Carga"
    cls: warn
    statusLabel:
      en: Via agents, no published rate
      fr: Via agences, tarif non publié
      es: Vía agencias, sin tarifa publicada
      pt: "Via agências, sem tarifa publicada"
    detail:
      en: For animals over 75 kg or shipped without their owner. airBaltic is an EU-authorised animal carrier, but pricing and crate specifics are handled entirely by third-party cargo agents holding a valid IATA Live Animals Regulations training certificate, not published on airBaltic's own site.
      fr: Pour les animaux de plus de 75 kg ou expédiés sans leur propriétaire. airBaltic est un transporteur animalier agréé UE, mais tarifs et gabarits de caisse sont entièrement gérés par des agences de fret tierces titulaires d'un certificat de formation IATA Live Animals Regulations valide, non publiés sur le site d'airBaltic.
      es: "Para animales de más de 75 kg o enviados sin su propietario. airBaltic es un transportista animal autorizado por la UE, pero las tarifas y las especificaciones de la jaula las gestionan por completo agencias de carga externas con un certificado de formación IATA Live Animals Regulations en vigor, no publicadas en el sitio de airBaltic."
      pt: "Para animais com mais de 75 kg ou enviados sem o dono. A airBaltic é uma transportadora de animais autorizada pela UE, mas tarifas e especificações de caixa são geridas inteiramente por agências de carga terceirizadas com certificado de formação IATA Live Animals Regulations válido, não publicadas no site da airBaltic."
    fee:
      en: Not published
      fr: Non publié
      es: No publicado
      pt: "Não publicado"
