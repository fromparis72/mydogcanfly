    pt: "Com condições"
verdictNote:
  en: Cabin and hold are both open and reasonably priced, but airBaltic's own route-restriction rules contradict each other on UK, Ireland and Gatwick/Dublin flights — check by phone before assuming either way.
  fr: Cabine et soute sont ouvertes et à un prix raisonnable, mais les règles de restriction de routes d'airBaltic se contredisent elles-mêmes sur les vols UK, Irlande et Gatwick/Dublin — vérifie par téléphone avant de conclure dans un sens ou dans l'autre.
  es: Cabina y bodega están abiertas y a un precio razonable, pero las propias normas de restricción de rutas de airBaltic se contradicen en los vuelos a Reino Unido, Irlanda y Gatwick/Dublín — confírmalo por teléfono antes de dar nada por hecho.
  pt: "Cabine e porão estão abertos e com preço razoável, mas as próprias regras de restrição de rotas da airBaltic se contradizem nos voos para Reino Unido, Irlanda e Gatwick/Dublin — confirme por telefone antes de presumir qualquer coisa."
