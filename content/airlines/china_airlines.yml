policies:
  cabin:
    availability: not_offered
    source:
      url: https://www.china-airlines.com/tw/zh/prepare-for-the-fly/information/baggage/pet-transport
      source_type: official_website
      verified_date: 2026-09-12
      review_due: 2026-12-11
      confidence: 4
      reviewer: Codex — contre-lecture du dossier officiel national remis par Philippe
      history: []
      quote: "寵物必須置放於妥善容器內以託運方式裝載於貨艙運送。因考量貨艙溫度調節因素，目前本公司 B738 / 32C 機型，不接受旅客託運寵物。"
      quote_language: zh-TW
      locator: onglet « 基本規定 », section « 寵物託運 »
  hold:
    availability: offered
    # PREUVE IMPORTÉE — import strict lot5 (Codex, lecture directe du 2026-09-09, cohorte LOT5 fait 4).
    # Effet attendu : China Airlines hold is a documented conditional route, never a specific-flight confirmation.
    # Portée nommée : Advance application, suitable container, flight cargo-compartment capacity and destination restrictions apply; certain aircraft are excluded.
    source:
      url: "https://www.china-airlines.com/tw/en/prepare-for-the-fly/information/baggage/pet-transport"
      source_type: official_website
      verified_date: "2026-09-09"
      review_due: "2026-12-08"   # reviewDueFrom(verified_date, "airline") — calculé par l'importeur
      confidence: 4
      reviewer: "Codex — direct reading of official airline page"
      history: []
      quote: "Pets must be placed in appropriate containers and transported in the cargo hold as checked baggage."
      quote_language: en
      locator: "Pets → Transporting pets as checked baggage (AVIH)"
    # TARIF (relevé du 18/09/2026, page anglaise). La page n'écrit AUCUN montant en clair : elle
    # porte un sélecteur « Zone Definitions » — zone de départ, zone d'arrivée — qui rend une grille
    # de tarifs fixes. Quatre zones (Taïwan, Zone 1, Zone 2, Zone 3), donc seize cases, dont
    # Taïwan→Taïwan est « Not Applicable ». Les quinze autres sont reprises ici, chacune dans les
    # deux devises publiées, sans conversion.
    #
    # L'ORDRE DE LA MATRICE A ÉTÉ VÉRIFIÉ, PAS SUPPOSÉ. La grille complète est présente dans la
    # charge utile de la page, mais rien n'y dit quelle ligne va avec quelle zone. Deux
    # interrogations réelles du sélecteur — Taïwan→Zone 1 et Zone 3→Zone 1 — ont rendu 280/392 et
    # 460/644, exactement les cases attendues aux deux bouts du tableau. Sans ce recoupement, je
    # publierais un tableau dont je devinerais l'ordre.
    #
    # TROIS FAITS QUE LA PAGE IMPOSE et qui sont repris tels quels : le prix est PAR PIÈCE, il vaut
    # pour un ensemble animal + caisse de moins de 32 kg, et « Weight > 32kg : Double fixed rate
    # should be applied ». Ce doublement est une règle, pas un montant : il est dit dans la fiche,
    # il n'engendre pas de ligne chiffrée que la compagnie n'écrit pas.
    #
    # LE CAD EST PUBLIÉ SUR TOUTES LES CASES, y compris celles dont le départ n'est pas canadien,
    # alors que la page précise « CAD is applicable exclusively for flights departing from Canada ».
    # C'est ce que la source affiche ; on la suit et on le signale, comme pour l'anomalie Edelweiss.
    # Le corriger serait inventer.
    #
    # La base de trajet n'est écrite nulle part : `per_one_way` est une lecture du couple
    # départ/arrivée, signalée ici et non déduite d'un barème.
