  cabin:
    availability: not_offered
  hold:
    availability: offered
  cargo:
    review_state: legacy_unreviewed
channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: no
    statusLabel:
      en: Not allowed
      fr: Non autorisé
      es: No permitido
      pt: "Não permitido"
    detail:
      en: Pets (incl. emotional-support animals) aren't allowed in the cabin — only trained service dogs.
      fr: Les animaux (y compris de soutien émotionnel) ne sont pas admis en cabine — seulement les chiens d'assistance dressés.
      es: Las mascotas (incluidos los animales de apoyo emocional) no se admiten en cabina, solo los perros de servicio adiestrados.
      pt: "Animais (incluindo animais de apoio emocional) não são permitidos na cabine — somente cães de assistência treinados."
    fee:
      en: —
      fr: —
      es: —
      pt: "—"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Cats & dogs as checked baggage (AVIH) up to 32 kg incl. container on CI/Mandarin flights; not on B738/32C or Taiwan–Hong Kong. Max 2 per passenger, min 10 weeks.
      fr: Chats et chiens en bagage enregistré (AVIH) jusqu'à 32 kg avec le contenant sur vols CI/Mandarin ; pas sur B738/32C ni Taïwan–Hong Kong. Max 2 par passager, min 10 semaines.
      es: Gatos y perros como equipaje facturado (AVIH) hasta 32 kg incl. contenedor en vuelos CI/Mandarin; no en B738/32C ni Taiwán–Hong Kong. Máx. 2 por pasajero, mín. 10 semanas.
      pt: "Gatos e cachorros como bagagem despachada (AVIH) até 32 kg incl. recipiente em voos CI/Mandarin; não em B738/32C nem em Taiwan–Hong Kong. Máx. 2 por passageiro, mín. 10 semanas."
    fee:
      en: By weight (fixed rate)
      fr: Au poids (tarif fixe)
      es: Por peso (tarifa fija)
      pt: "Por peso (tarifa fixa)"
  - placement: cargo
    icon: ✈️
    name:
      en: Live Animals cargo
      fr: Fret Live Animals
      es: Carga Live Animals
      pt: "Carga Live Animals"
    cls: warn
    statusLabel:
      en: Via cargo
      fr: Via fret
      es: Mediante carga
      pt: "Via carga"
    detail:
      en: Some countries (e.g. Hong Kong) require cargo; needs an Air Waybill + Shipper's Certification.
      fr: Certains pays (ex. Hong Kong) imposent le fret ; nécessite une lettre de transport aérien + certification de l'expéditeur.
      es: Algunos países (p. ej. Hong Kong) exigen carga; requiere una carta de porte aéreo + certificación del expedidor.
      pt: "Alguns países (por exemplo, Hong Kong) exigem carga; é necessário um conhecimento aéreo (Air Waybill) + certificação do expedidor."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
