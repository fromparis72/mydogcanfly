verdictNote:
  en: No cabin pets (service dogs only); cats & dogs travel as checked baggage or cargo, with seasonal breed limits.
  fr: Pas d'animaux en cabine (chiens d'assistance seuls) ; chats et chiens en bagage enregistré ou en fret, avec des restrictions de races saisonnières.
  es: Sin mascotas en cabina (solo perros de servicio); gatos y perros viajan como equipaje facturado o carga, con límites de raza estacionales.
  pt: "Nenhum animal na cabine (somente cães de assistência); gatos e cachorros viajam como bagagem despachada ou carga, com limites de raça sazonais."
