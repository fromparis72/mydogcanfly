          es: "Bodega (AVIH), animal y jaula hasta 32 kg, por pieza: Taiwán → Zona 1 (Japón, Corea, Palaos, Guam, Hong Kong, China, Filipinas, Tailandia, Malasia, Singapur, Indonesia, Vietnam, Camboya)"
          pt: "Porão (AVIH), animal e caixa até 32 kg, por peça: Taiwan → Zona 1 (Japão, Coreia, Palau, Guam, Hong Kong, China, Filipinas, Tailândia, Malásia, Singapura, Indonésia, Vietnã, Camboja)"
