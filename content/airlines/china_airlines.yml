name: China Airlines
titleH1:
  en: Flying with a dog on China Airlines
  fr: Voyager avec un chien sur China Airlines
  es: Viajar con perro en China Airlines
  pt: "Voar com um cachorro na China Airlines"
metaDesc:
  en: "China Airlines (Taiwan) pet policy: hold and cargo, seasonal breed limits, cold-weather rules and official sources."
  fr: "Politique animaux China Airlines (Taïwan) : soute et fret, restrictions de races saisonnières, règles par temps froid et sources officielles."
  es: "Política de mascotas de China Airlines (Taiwán): bodega y carga, límites de raza estacionales, reglas para clima frío y fuentes oficiales."
  pt: "Política de animais da China Airlines (Taiwan): porão e carga, limites de raça sazonais, regras para clima frio e fontes oficiais."
