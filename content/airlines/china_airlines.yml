          en: "Hold (AVIH), pet and crate up to 32 kg, per piece: Taiwan → Zone 1 (Japan, Korea, Palau, Guam, Hong Kong, China, the Philippines, Thailand, Malaysia, Singapore, Indonesia, Vietnam, Cambodia)"
