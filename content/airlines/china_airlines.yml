  note:
    en: "Over 292 cm total: two pieces of excess baggage. Local airport weight limits may apply."
    fr: "Au-delà de 292 cm au total : deux pièces de bagage excédentaire. Des limites de poids locales peuvent s'appliquer."
    es: "Por encima de 292 cm en total: dos piezas de exceso de equipaje. Pueden aplicarse límites de peso locales del aeropuerto."
    pt: "Acima de 292 cm no total: duas peças de excesso de bagagem. Podem se aplicar limites de peso locais do aeroporto."
restrictions:
  - icon: 🐶
    title:
      en: Flat-faced breeds
      fr: Races brachycéphales
      es: Razas de hocico chato
      pt: "Raças de focinho achatado"
    pills:
      - cls: warn
        label:
          en: Seasonal / regional only
          fr: Saisonnier / régional
          es: Solo estacional / regional
          pt: "Somente sazonal / regional"
    note:
      en: "Snub-nosed dogs & cats (and mixes) are accepted only seasonally/regionally (China/HK/Japan/Korea/Taiwan Dec–Mar; Australia/NZ Apr–Nov), journey ≤ 6 h, kennel one size larger: boxer, bulldogs, pug, Shih Tzu, Pekingese, chow chow, Boston terrier, Lhasa Apso, and Persian/Himalayan/British Shorthair/Burmese/Exotic/Scottish Fold cats."
      fr: "Chiens et chats au nez écrasé (et croisés) acceptés uniquement de façon saisonnière/régionale (Chine/HK/Japon/Corée/Taïwan déc.–mars ; Australie/N.-Z. avr.–nov.), trajet ≤ 6 h, caisse une taille au-dessus : boxer, bouledogues, carlin, Shih Tzu, pékinois, chow chow, Boston terrier, Lhasa Apso, et chats persans/himalayens/British Shorthair/birmans/exotiques/Scottish Fold."
      es: "Los perros y gatos de hocico chato (y sus cruces) se aceptan solo de forma estacional/regional (China/HK/Japón/Corea/Taiwán dic–mar; Australia/NZ abr–nov), trayecto ≤ 6 h, jaula una talla mayor: bóxer, bulldogs, carlino, Shih Tzu, pequinés, chow chow, Boston terrier, Lhasa Apso, y gatos persas/himalayos/British Shorthair/birmanos/exóticos/Scottish Fold."
      pt: "Cachorros e gatos de focinho achatado (e mestiços) são aceitos somente em determinadas épocas/regiões (China/HK/Japão/Coreia/Taiwan dez.–mar.; Austrália/NZ abr.–nov.), trajeto ≤ 6 h, caixa de transporte um tamanho acima: boxer, buldogues, pug, Shih Tzu, Pequinês, Chow Chow, Boston Terrier, Lhasa Apso, e gatos Persa/Himalaia/British Shorthair/Burmês/Exótico/Scottish Fold."
  - icon: 🚫
    title:
      en: Banned breeds
      fr: Races interdites
      es: Razas prohibidas
      pt: "Raças proibidas"
    pills:
      - cls: no
        label:
          en: Dangerous breeds banned
          fr: Races dangereuses interdites
          es: Razas peligrosas prohibidas
          pt: "Raças perigosas proibidas"
    note:
      en: "Not accepted: pit bull types, American Bully, Fila, Tosa, Dogo Argentino, mastiffs (Neapolitan/Tibetan/Bull/Cane Corso/Dogue de Bordeaux). Pregnant pets only if under 40 days and not within 7 days post-partum."
      fr: "Non acceptés : types pit-bull, American Bully, Fila, Tosa, Dogo Argentino, mastiffs (Napolitain/Tibétain/Bull/Cane Corso/Dogue de Bordeaux). Femelles gestantes seulement si moins de 40 jours et pas à moins de 7 jours post-partum."
      es: "No se aceptan: tipos pit bull, American Bully, Fila, Tosa, Dogo Argentino, mastines (napolitano/tibetano/Bull/Cane Corso/Dogo de Burdeos). Hembras gestantes solo si es de menos de 40 días y no dentro de los 7 días posparto."
      pt: "Não são aceitos: tipos pit bull, American Bully, Fila, Tosa, Dogo Argentino, mastins (napolitano/tibetano/bull/Cane Corso/Dogue de Bordeaux). Fêmeas gestantes somente se com menos de 40 dias de gestação e fora dos 7 dias pós-parto."
temperature:
  pills:
    - cls: no
      label:
        en: Tropical / cold-blooded refused ≤ 10 °C
        fr: Tropicaux / à sang froid refusés ≤ 10 °C
        es: Tropicales / de sangre fría rechazados ≤ 10 °C
        pt: "Tropicais / de sangue frio recusados ≤ 10 °C"
    - cls: ok
      label:
        en: Same pressure/temp as cabin
        fr: Même pression/temp. que la cabine
        es: Misma presión/temp. que la cabina
        pt: "Mesma pressão/temperatura da cabine"
  note:
    en: Live animals from tropical regions and cold-blooded species aren't accepted if the temperature anywhere on the journey is 10 °C or below. B738 holds can't carry pets needing ventilation/warmth. The pet compartment matches the cabin's pressure, temperature and humidity.
    fr: Les animaux des régions tropicales et les espèces à sang froid ne sont pas acceptés si la température, à un point du trajet, est de 10 °C ou moins. Les soutes B738 ne peuvent pas transporter d'animaux nécessitant ventilation/chaleur. Le compartiment animal égale la pression, la température et l'humidité de la cabine.
    es: Los animales de regiones tropicales y las especies de sangre fría no se aceptan si la temperatura, en cualquier punto del trayecto, es de 10 °C o menos. Las bodegas del B738 no pueden transportar mascotas que necesiten ventilación/calor. El compartimento de mascotas iguala la presión, la temperatura y la humedad de la cabina.
    pt: "Animais de regiões tropicais e espécies de sangue frio não são aceitos se a temperatura, em qualquer ponto do trajeto, for de 10 °C ou menos. Os porões dos B738 não podem transportar animais que precisem de ventilação/calor. O compartimento de animais tem a mesma pressão, temperatura e umidade da cabine."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: Trained service dogs (medical assistance) fly free in the cabin, harnessed and rabies-vaccinated.
      fr: Les chiens d'assistance dressés (assistance médicale) voyagent gratuitement en cabine, en harnais et vaccinés contre la rage.
      es: Los perros de servicio adiestrados (asistencia médica) viajan gratis en cabina, con arnés y vacunados contra la rabia.
      pt: "Cães de assistência treinados (assistência médica) voam gratuitamente na cabine, com peitoral e vacinados contra a raiva."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: "US routes: DOT + CDC forms (+ relief form over 8 h); non-US: Service Dogs Declaration Form. Contact CS ≥ 48 h ahead. Psychiatric assistance dogs go in the hold (paid)."
      fr: "Vols USA : formulaires DOT + CDC (+ formulaire de soulagement au-delà de 8 h) ; hors USA : Service Dogs Declaration Form. Contacter le service client ≥ 48 h à l'avance. Les chiens d'assistance psychiatrique voyagent en soute (payant)."
      es: "Rutas a EE. UU.: formularios del DOT + CDC (+ formulario de alivio si supera 8 h); fuera de EE. UU.: Service Dogs Declaration Form. Contacta con Atención al Cliente ≥ 48 h antes. Los perros de asistencia psiquiátrica viajan en bodega (de pago)."
      pt: "Rotas para os EUA: formulários do DOT + CDC (+ formulário de alívio acima de 8 h); fora dos EUA: Service Dogs Declaration Form. Contate o Atendimento ao Cliente ≥ 48 h antes. Cães de assistência psiquiátrica viajam no porão (pago)."
goodToKnow:
  - icon: 🚫
    label:
      en: No pets Taiwan–HK
      fr: Pas d'animaux Taïwan–HK
      es: Sin mascotas Taiwán–HK
      pt: "Nenhum animal Taiwan–HK"
    value:
      en: Pets aren't accepted as checked baggage on Taiwan–Hong Kong flights (Hong Kong is cargo-only).
      fr: Les animaux ne sont pas acceptés en bagage enregistré sur les vols Taïwan–Hong Kong (Hong Kong est fret uniquement).
      es: Las mascotas no se aceptan como equipaje facturado en los vuelos Taiwán–Hong Kong (Hong Kong es solo carga).
      pt: "Animais não são aceitos como bagagem despachada em voos Taiwan–Hong Kong (Hong Kong é somente carga)."
  - icon: 📄
    label:
      en: Declaration
      fr: Déclaration
      es: Declaración
      pt: "Declaração"
    value:
      en: A Passenger's Declaration for Live Animals (2 copies) is required; arrive 2 h before departure.
      fr: Une déclaration passager pour animaux vivants (2 exemplaires) est requise ; arriver 2 h avant le départ.
      es: Se requiere una declaración del pasajero para animales vivos (2 copias); llega 2 h antes de la salida.
      pt: "É exigida uma Declaração do Passageiro para Animais Vivos (2 cópias); chegue 2 h antes da partida."
  - icon: 🐾
    label:
      en: US Air Waybill
      fr: Lettre de transport USA
      es: Carta de porte de EE. UU.
      pt: "Conhecimento aéreo dos EUA"
    value:
      en: For dogs to the US, China Airlines provides the CDC-required Air Waybill to present at check-in and US entry.
      fr: Pour les chiens vers les USA, China Airlines fournit la lettre de transport exigée par la CDC à présenter à l'enregistrement et à l'entrée aux USA.
      es: Para perros hacia EE. UU., China Airlines facilita la carta de porte aéreo exigida por los CDC para presentar en la facturación y en la entrada a EE. UU.
      pt: "Para cachorros com destino aos EUA, a China Airlines fornece o conhecimento aéreo (Air Waybill) exigido pelo CDC, a ser apresentado no check-in e na entrada nos EUA."
