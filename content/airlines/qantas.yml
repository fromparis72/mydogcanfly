verdictNote:
  en: No pets in the cabin except service dogs — all pets fly as freight via Qantas Freight.
  fr: Pas d'animaux en cabine sauf chiens d'assistance — tous les animaux voyagent en fret via Qantas Freight.
  es: No se admiten mascotas en cabina salvo perros de servicio; todas las mascotas viajan como carga a través de Qantas Freight.
  pt: "Nenhum animal na cabine, exceto cães de serviço — todos os animais voam como carga via Qantas Freight."
