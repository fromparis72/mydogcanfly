  fr: Voyager avec un chien sur Qantas
  es: Viajar con un perro en Qantas
  pt: "Viajar com um cachorro na Qantas"
metaDesc:
  en: "Qantas pet policy: cargo-only via Qantas Freight, cabin service dogs, temperature limits, breed rules and official sources."
  fr: "Politique animaux Qantas : fret uniquement via Qantas Freight, chiens d'assistance en cabine, limites de température, règles de races et sources officielles."
  es: "Política de mascotas de Qantas: solo carga a través de Qantas Freight, perros de servicio en cabina, límites de temperatura, normas por raza y fuentes oficiales."
  pt: "Política de animais da Qantas: somente carga via Qantas Freight, cães de serviço em cabine, limites de temperatura, regras por raça e fontes oficiais."
