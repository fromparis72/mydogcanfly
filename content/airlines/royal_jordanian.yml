verdictNote:
  en: Cabin and hold are both open, but the cabin is Economy-only, capped at flights of 5 h and two animals per aircraft, and can only be booked by phone.
  fr: Cabine et soute sont ouvertes, mais la cabine est réservée à l'Économique, plafonnée aux vols de 5 h et à deux animaux par avion, et ne se réserve que par téléphone.
  es: Cabina y bodega están abiertas, pero la cabina es solo en Económica, se limita a vuelos de 5 h y a dos animales por avión, y solo se reserva por teléfono.
  pt: "Cabine e porão estão abertos, mas a cabine é só na Econômica, limitada a voos de 5 h e a dois animais por avião, e só pode ser reservada por telefone."
