id: airline_royal_jordanian
mono: RJ
name: Royal Jordanian
titleH1:
  en: Flying with a dog on Royal Jordanian
  fr: Voyager avec un chien sur Royal Jordanian
  es: Volar con un perro en Royal Jordanian
  pt: "Viajar com um cachorro na Royal Jordanian"
metaDesc:
  en: "Royal Jordanian pet policy: 7 kg in the cabin on flights up to 5 h, hold up to 45 kg, zone-by-zone fares in USD, breed list limited to the hold."
  fr: "Politique animaux Royal Jordanian : 7 kg en cabine sur les vols de 5 h maximum, soute jusqu'à 45 kg, tarifs par zone en dollars, liste de races limitée à la soute."
  es: "Política de mascotas de Royal Jordanian: 7 kg en cabina en vuelos de hasta 5 h, bodega hasta 45 kg, tarifas por zona en dólares, lista de razas limitada a la bodega."
  pt: "Política de animais da Royal Jordanian: 7 kg na cabine em voos de até 5 h, porão até 45 kg, tarifas por zona em dólares, lista de raças restrita ao porão."
