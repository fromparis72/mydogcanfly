channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: warn
    statusLabel:
      en: Under conditions
      fr: Sous conditions
      es: Con condiciones
      pt: "Com condições"
    detail:
      en: 7 kg (15 lb) crate included, 50 × 40 × 26 cm, Economy class only, flights of 5 h maximum, two animals per flight (one forward, one aft). Book 48 h ahead through a travel agency or the call centre — never online. No first row and no bulkhead seats, since there is no stowage under the seat.
      fr: 7 kg (15 lb) caisse comprise, 50 × 40 × 26 cm, classe Économique uniquement, vols de 5 h maximum, deux animaux par vol (un à l'avant, un à l'arrière). Réservation 48 h avant, par agence ou centre d'appels — jamais en ligne. Ni première rangée ni sièges cloison, faute de rangement sous le siège.
      es: 7 kg (15 lb) con la jaula incluida, 50 × 40 × 26 cm, solo en clase Económica, vuelos de 5 h como máximo, dos animales por vuelo (uno delante, otro detrás). Reserva 48 h antes, por agencia o call center; nunca en línea. Ni primera fila ni asientos de mamparo, porque no hay hueco bajo el asiento.
      pt: "7 kg (15 lb) com a caixa incluída, 50 × 40 × 26 cm, somente na classe Econômica, voos de no máximo 5 h, dois animais por voo (um na frente, outro atrás). Reserve 48 h antes, por agência ou call center — nunca on-line. Nem primeira fila nem assentos de divisória, porque não há espaço sob o assento."
    fee:
      en: USD 85–185
      fr: 85–185 USD
      es: 85–185 USD
      pt: "85–185 USD"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Dogs and cats, four crates maximum per aircraft, booked 48 h ahead. Three published sizes — up to 32 kg / 203 cm, 32–45 kg under 203 cm, and 32–45 kg between 203 and 250 cm. Above 45 kg the crate is handled manually, on request.
      fr: Chiens et chats, quatre caisses maximum par appareil, réservation 48 h avant. Trois gabarits publiés — jusqu'à 32 kg / 203 cm, 32–45 kg sous 203 cm, et 32–45 kg entre 203 et 250 cm. Au-delà de 45 kg, la caisse passe en traitement manuel, sur demande.
      es: "Perros y gatos, cuatro jaulas como máximo por avión, con reserva 48 h antes. Tres formatos publicados: hasta 32 kg / 203 cm, 32–45 kg por debajo de 203 cm y 32–45 kg entre 203 y 250 cm. Por encima de 45 kg, la jaula pasa a manejo manual, bajo petición."
      pt: "Cachorros e gatos, no máximo quatro caixas por aeronave, com reserva 48 h antes. Três formatos publicados: até 32 kg / 203 cm, 32–45 kg abaixo de 203 cm e 32–45 kg entre 203 e 250 cm. Acima de 45 kg, a caixa passa a tratamento manual, mediante solicitação."
    fee:
      en: USD 175–800
      fr: 175–800 USD
      es: 175–800 USD
      pt: "175–800 USD"
  - placement: cargo
    icon: ✈️
    name:
      en: Cargo
      fr: Fret
      es: Carga
      pt: "Carga"
    cls: warn
    statusLabel:
      en: Not published
      fr: Non publié
      es: No publicado
      pt: "Não publicado"
    detail:
      en: Royal Jordanian publishes no cargo policy for animals — no conditions, no crate limits, no rates. Ask the cargo department directly for an unaccompanied pet.
      fr: Royal Jordanian ne publie aucune politique fret pour les animaux — ni conditions, ni limites de caisse, ni tarifs. Pour un animal non accompagné, il faut interroger le service fret.
      es: "Royal Jordanian no publica ninguna política de carga para animales: ni condiciones, ni límites de jaula, ni tarifas. Para una mascota no acompañada hay que preguntar al departamento de carga."
      pt: "A Royal Jordanian não publica nenhuma política de carga para animais: nem condições, nem limites de caixa, nem tarifas. Para um animal desacompanhado, é preciso consultar o setor de carga."
    fee:
      en: Not published
      fr: Non publié
      es: No publicado
      pt: "Não publicado"
