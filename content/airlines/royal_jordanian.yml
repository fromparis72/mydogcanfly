restrictions:
  - icon: 🐶
    title:
      en: Restricted breeds
      fr: Races restreintes
      es: Razas restringidas
      pt: "Raças restritas"
    pills:
      - cls: ok
        label:
          en: Cabin unaffected
          fr: Cabine non concernée
          es: Cabina no afectada
          pt: "Cabine não afetada"
      - cls: "no"
        label:
          en: Hold forbidden
          fr: Soute interdite
          es: Bodega prohibida
          pt: "Porão proibido"
    note:
      en: "Royal Jordanian publishes a list of 23 breeds and states explicitly that it applies to the hold only. Nothing in the policy bars a flat-faced dog under 7 kg from the cabin — so a small pug or Shih Tzu is a genuine option here, provided the flight is under 5 h."
      fr: "Royal Jordanian publie une liste de 23 races et précise explicitement qu'elle ne vaut que pour la soute. Rien n'interdit un chien au nez écrasé de moins de 7 kg en cabine — un carlin ou un shih tzu de petit gabarit est donc une vraie option ici, à condition que le vol dure moins de 5 h."
      es: "Royal Jordanian publica una lista de 23 razas y precisa de forma explícita que solo se aplica a la bodega. Nada impide que un perro de hocico chato de menos de 7 kg vaya en cabina: un carlino o un Shih Tzu pequeño es aquí una opción real, siempre que el vuelo dure menos de 5 h."
      pt: "A Royal Jordanian publica uma lista de 23 raças e diz explicitamente que ela vale apenas para o porão. Nada impede que um cachorro de focinho achatado com menos de 7 kg viaje na cabine — um pug ou um Shih Tzu pequeno é, aqui, uma opção real, desde que o voo dure menos de 5 h."
  - icon: 🐹
    title:
      en: Species accepted
      fr: Espèces acceptées
      es: Especies aceptadas
      pt: "Espécies aceitas"
    pills:
      - cls: ok
        label:
          en: Dogs & cats
          fr: Chiens & chats
          es: Perros y gatos
          pt: "Cachorros e gatos"
      - cls: "no"
        label:
          en: No rodents
          fr: Pas de rongeurs
          es: Sin roedores
          pt: "Sem roedores"
    note:
      en: Only dogs and cats are carried. Rodents are barred from every Royal Jordanian flight, in the cabin as in the hold.
      fr: Seuls les chiens et les chats sont transportés. Les rongeurs sont interdits sur tous les vols Royal Jordanian, en cabine comme en soute.
      es: Solo se transportan perros y gatos. Los roedores están prohibidos en todos los vuelos de Royal Jordanian, tanto en cabina como en bodega.
      pt: "Somente cachorros e gatos são transportados. Roedores são proibidos em todos os voos da Royal Jordanian, tanto na cabine quanto no porão."
temperature:
  pills:
    - cls: warn
      label:
        en: "Temperature limits: not disclosed"
        fr: "Limites de température : non communiqué"
        es: "Límites de temperatura: no comunicado"
        pt: "Limites de temperatura: não divulgados"
  note:
    en: Royal Jordanian publishes no hold-temperature limits and no seasonal embargo on its pet page.
    fr: Royal Jordanian ne publie pas de limites de température en soute ni d'embargo saisonnier sur sa page animaux.
    es: Royal Jordanian no publica límites de temperatura en bodega ni embargo estacional en su página de mascotas.
    pt: "A Royal Jordanian não publica limites de temperatura no porão nem embargo sazonal em sua página sobre animais."
assistance:
  - icon: ❓
    label:
      en: Assistance dogs
      fr: Chiens d'assistance
      es: Perros de asistencia
      pt: "Cães de assistência"
    value:
      en: Not published. The pet page sets out no conditions, accepted certifications or fee waiver for assistance dogs — call the airline before booking.
      fr: Non publié. La page animaux ne fixe ni conditions, ni certifications acceptées, ni gratuité pour les chiens d'assistance — appelle la compagnie avant de réserver.
      es: No publicado. La página de mascotas no fija condiciones, certificaciones aceptadas ni exención de tarifa para perros de asistencia; llama a la aerolínea antes de reservar.
      pt: "Não publicado. A página sobre animais não define condições, certificações aceitas nem isenção de tarifa para cães de assistência — ligue para a companhia antes de reservar."
goodToKnow:
  - icon: ⚠️
    label:
      en: Two conflicting crate sizes
      fr: Deux cotes de caisse contradictoires
      es: Dos medidas de jaula contradictorias
      pt: "Duas medidas de caixa contraditórias"
    value:
      en: "The same page gives the cabin crate twice: the conditions table says 50 (L) × 40 (W) × 26 (H) cm, the seating paragraph says 40 (L) × 50 (W) × 26 (H) cm. Same numbers, length and width swapped. We publish the table value and flag the ambiguity rather than pick a side — ask when you book."
      fr: "La même page donne deux fois la caisse cabine : le tableau des conditions dit 50 (L) × 40 (l) × 26 (H) cm, le paragraphe sur le placement dit 40 (L) × 50 (l) × 26 (H) cm. Mêmes chiffres, longueur et largeur inversées. On publie la valeur du tableau et on signale l'ambiguïté plutôt que de trancher — pose la question à la réservation."
      es: "La misma página da dos veces la jaula de cabina: la tabla de condiciones dice 50 (L) × 40 (An) × 26 (Al) cm y el párrafo sobre asientos dice 40 (L) × 50 (An) × 26 (Al) cm. Mismos números, con largo y ancho invertidos. Publicamos el valor de la tabla y señalamos la ambigüedad en lugar de decidir: pregúntalo al reservar."
      pt: "A mesma página informa duas vezes a caixa de cabine: a tabela de condições diz 50 (C) × 40 (L) × 26 (A) cm e o parágrafo sobre assentos diz 40 (C) × 50 (L) × 26 (A) cm. Mesmos números, comprimento e largura invertidos. Publicamos o valor da tabela e sinalizamos a ambiguidade em vez de decidir — pergunte ao reservar."
  - icon: 📞
    label:
      en: No online booking
      fr: Pas de réservation en ligne
      es: Sin reserva en línea
      pt: "Sem reserva on-line"
    value:
      en: A pet cannot be added on the website. Everything goes through a travel agency or the call centre, 48 h before departure at the latest.
      fr: On ne peut pas ajouter un animal sur le site. Tout passe par une agence de voyages ou le centre d'appels, 48 h avant le départ au plus tard.
      es: No se puede añadir una mascota en la web. Todo pasa por una agencia de viajes o el call center, 48 h antes de la salida como máximo.
      pt: "Não dá para incluir um animal pelo site. Tudo passa por uma agência de viagens ou pelo call center, 48 h antes da partida no máximo."
  - icon: 📅
    label:
      en: Outdated notice on the page
      fr: Mention périmée sur la page
      es: Aviso caducado en la página
      pt: "Aviso vencido na página"
    value:
      en: The policy page still carries a US CDC notice given as expiring on 31 July 2025. It is out of date — check the current entry rules for your destination, not that paragraph.
      fr: La page policy porte encore une mention CDC américaine donnée comme expirant le 31 juillet 2025. Elle est périmée — vérifie les règles d'entrée en vigueur pour ta destination, pas ce paragraphe.
      es: "La página de la política sigue mostrando un aviso de los CDC de EE. UU. con vencimiento el 31 de julio de 2025. Está caducado: consulta las normas de entrada vigentes en tu destino, no ese párrafo."
      pt: "A página da política ainda traz um aviso do CDC dos EUA com validade até 31 de julho de 2025. Está desatualizado — consulte as regras de entrada vigentes no seu destino, não esse parágrafo."
  - icon: 🕳️
    label:
      en: What is missing
      fr: Ce qui manque
      es: Lo que falta
      pt: "O que falta"
    value:
      en: "Not published: minimum age, whether the cabin carrier must be soft or rigid, temperature thresholds, and how many animals one passenger may take in the cabin."
      fr: "Non publiés : âge minimal, caractère souple ou rigide du sac cabine, seuils de température, et nombre d'animaux qu'un même passager peut emmener en cabine."
      es: "No publicados: edad mínima, si el bolso de cabina debe ser blando o rígido, umbrales de temperatura y cuántos animales puede llevar un mismo pasajero en cabina."
      pt: "Não publicados: idade mínima, se a bolsa de cabine deve ser maleável ou rígida, limites de temperatura e quantos animais um mesmo passageiro pode levar na cabine."
