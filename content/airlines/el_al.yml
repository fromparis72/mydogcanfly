name: EL AL Israel Airlines
titleH1:
  en: Flying with a dog on EL AL
  fr: Voyager avec un chien sur EL AL
  es: Volar con un perro en EL AL
  pt: "Voar com um cachorro na EL AL"
metaDesc:
  en: "EL AL pet policy: cabin, hold and cargo, fares, cabin route bans, Israel vet forms and official sources."
  fr: "Politique animaux EL AL : cabine, soute et fret, tarifs, routes cabine interdites, formalités vétérinaires israéliennes et sources officielles."
  es: "Política de mascotas de EL AL: cabina, bodega y carga, tarifas, rutas con cabina vetada, trámites veterinarios de Israel y fuentes oficiales."
  pt: "Política de animais da EL AL: cabine, porão e carga, tarifas, rotas com cabine vetada, formulários veterinários de Israel e fontes oficiais."
