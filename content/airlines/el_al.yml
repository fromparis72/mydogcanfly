policies:
  cabin:
    availability: offered
  hold:
    availability: offered
  cargo:
    review_state: legacy_unreviewed
channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Dogs, cats & exotic birds ≤ 9 kg incl. carrier with a passenger; up to 2 per carrier. Not in 777 Business. Booked via the call centre. Not on some routes.
      fr: Chiens, chats et oiseaux exotiques ≤ 9 kg avec le sac, accompagnés ; jusqu'à 2 par sac. Pas en Business 777. Réservé via le centre d'appel. Pas sur certaines routes.
      es: Perros, gatos y aves exóticas ≤ 9 kg con la jaula, acompañados; hasta 2 por jaula. No en Business del 777. Se reserva por el centro de atención. No en algunas rutas.
      pt: "Cachorros, gatos e aves exóticas ≤ 9 kg com a caixa, acompanhados; até 2 por caixa. Não disponível na Business do 777. Reservado pela central de atendimento. Não disponível em algumas rotas."
    fee:
      en: $100 / NIS 50
      fr: 100 $ / 50 NIS
      es: 100 $ / 50 NIS
      pt: "US$ 100 / 50 NIS"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Pets over 9 kg (up to 100 kg incl. container) in the hold; two adults (≤ 14 kg each) may share. A drinker is required on flights over 12 h.
      fr: Animaux de plus de 9 kg (jusqu'à 100 kg avec le contenant) en soute ; deux adultes (≤ 14 kg chacun) peuvent partager. Un abreuvoir est requis sur les vols de plus de 12 h.
      es: Mascotas de más de 9 kg (hasta 100 kg con el contenedor) en bodega; dos adultos (≤ 14 kg cada uno) pueden compartir. Se exige bebedero en vuelos de más de 12 h.
      pt: "Animais acima de 9 kg (até 100 kg com o recipiente) no porão; dois adultos (≤ 14 kg cada) podem compartilhar. É exigido um bebedouro em voos acima de 12 h."
    fee:
      en: $200–400
      fr: 200–400 $
      es: 200–400 $
      pt: "US$ 200–400"
  - placement: cargo
    icon: ✈️
    name:
      en: EL AL Cargo
      fr: EL AL Cargo
      es: EL AL Cargo
      pt: "EL AL Cargo"
    cls: warn
    statusLabel:
      en: Via cargo
      fr: Via fret
      es: Vía carga
      pt: "Via carga"
    detail:
      en: Over 100 kg, and pets to/from London (LHR/LTN), Johannesburg, Hong Kong and Australia via EL AL Cargo.
      fr: Au-delà de 100 kg, et les animaux de/vers Londres (LHR/LTN), Johannesburg, Hong Kong et l'Australie via EL AL Cargo.
      es: Más de 100 kg, y las mascotas hacia/desde Londres (LHR/LTN), Johannesburgo, Hong Kong y Australia por EL AL Cargo.
      pt: "Acima de 100 kg, e animais de/para Londres (LHR/LTN), Joanesburgo, Hong Kong e Austrália via EL AL Cargo."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
