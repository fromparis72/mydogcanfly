  label:
    en: Moderate
    fr: Modéré
    es: Moderado
    pt: "Moderada"
verdictNote:
  en: Small pets in the cabin, larger in the hold — but cabin barred to London, Hong Kong, UAE, Australia and Johannesburg.
  fr: Petits animaux en cabine, plus grands en soute — mais cabine interdite vers Londres, Hong Kong, ÉAU, Australie et Johannesburg.
  es: Mascotas pequeñas en cabina, las más grandes en bodega, pero cabina vetada a Londres, Hong Kong, EAU, Australia y Johannesburgo.
  pt: "Animais pequenos na cabine, os maiores no porão — mas cabine vetada para Londres, Hong Kong, EAU, Austrália e Joanesburgo."
