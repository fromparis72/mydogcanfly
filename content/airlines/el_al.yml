    es: USD por trayecto (internacional) / NIS nacional. Reconfirma los importes actuales con EL AL.
    pt: "USD por trajeto (internacional) / NIS nacional. Reconfirme os valores atuais com a EL AL."
restrictions:
  - icon: 🚫
    title:
      en: Cabin route bans
      fr: Routes cabine interdites
      es: Rutas con cabina vetada
      pt: "Rotas com cabine vetada"
    pills:
      - cls: no
        label:
          en: "No cabin: London/HK/UAE/AU/JNB"
          fr: "Pas de cabine : Londres/HK/ÉAU/AU/JNB"
          es: "Sin cabina: Londres/HK/EAU/AU/JNB"
          pt: "Sem cabine: Londres/HK/EAU/AU/JNB"
    note:
      en: Cabin carriage is barred to/from London (Heathrow, Luton), Johannesburg, Hong Kong, the UAE and Australia — those routes are hold- or cargo-only.
      fr: Le transport en cabine est interdit de/vers Londres (Heathrow, Luton), Johannesburg, Hong Kong, les ÉAU et l'Australie — ces routes sont soute- ou fret-seul.
      es: El transporte en cabina está vetado hacia/desde Londres (Heathrow, Luton), Johannesburgo, Hong Kong, EAU y Australia; esas rutas son solo bodega o solo carga.
      pt: "O transporte em cabine é vetado de/para Londres (Heathrow, Luton), Joanesburgo, Hong Kong, os EAU e a Austrália — essas rotas são somente porão ou somente carga."
  - icon: 📄
    title:
      en: Israel vet forms
      fr: Formalités vétérinaires Israël
      es: Trámites veterinarios de Israel
      pt: "Formulários veterinários de Israel"
    pills:
      - cls: warn
        label:
          en: Ministry authorization ≤ 2 days
          fr: Autorisation ministère ≤ 2 jours
          es: Autorización del ministerio ≤ 2 días
          pt: "Autorização do ministério ≤ 2 dias"
    note:
      en: Pets to/from Israel need Ministry of Agriculture veterinary authorization sent to EL AL no later than 2 days before the flight. A rigid, leak-proof, four-side-ventilated container is required.
      fr: Les animaux de/vers Israël nécessitent une autorisation vétérinaire du ministère de l'Agriculture envoyée à EL AL au plus tard 2 jours avant le vol. Un contenant rigide, étanche et ventilé sur les quatre côtés est requis.
      es: Las mascotas hacia/desde Israel necesitan una autorización veterinaria del Ministerio de Agricultura enviada a EL AL a más tardar 2 días antes del vuelo. Se exige un contenedor rígido, estanco y ventilado por los cuatro lados.
      pt: "Animais de/para Israel precisam de autorização veterinária do Ministério da Agricultura enviada à EL AL até 2 dias antes do voo. É exigido um recipiente rígido, à prova de vazamento e ventilado nos quatro lados."
temperature:
  pills:
    - cls: warn
      label:
        en: "Temperature limits: not disclosed"
        fr: "Limites de température : non communiqué"
        es: "Límites de temperatura: no divulgados"
        pt: "Limites de temperatura: não divulgados"
  note:
    en: EL AL publishes no hold-temperature limits or seasonal embargo on its pet pages.
    fr: EL AL ne publie pas de limites de température en soute ni d'embargo saisonnier sur ses pages animaux.
    es: EL AL no publica límites de temperatura en bodega ni embargo estacional en sus páginas de mascotas.
    pt: "A EL AL não divulga limites de temperatura no porão nem embargo sazonal em suas páginas de animais."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: A service dog for a passenger with special needs flies free in the cabin, leashed, harnessed and muzzled throughout.
      fr: Un chien d'assistance pour passager à besoins spécifiques voyage gratuitement en cabine, en laisse, harnais et muselière tout le vol.
      es: Un perro de servicio para un pasajero con necesidades especiales viaja gratis en cabina, con correa, arnés y bozal durante todo el vuelo.
      pt: "Um cão de assistência para um passageiro com necessidades especiais viaja de graça na cabine, com guia, peitoral e focinheira durante todo o voo."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: Notify ≥ 48 h ahead with a training certificate + vet vaccination certificate; complete Israel entry/exit forms.
      fr: Prévenir ≥ 48 h à l'avance avec un certificat de dressage + certificat vétérinaire de vaccination ; remplir les formulaires d'entrée/sortie d'Israël.
      es: Avisa con ≥ 48 h de antelación con un certificado de adiestramiento + certificado veterinario de vacunación; completa los formularios de entrada/salida de Israel.
      pt: "Avise com ≥ 48 h de antecedência com um certificado de adestramento e um certificado veterinário de vacinação; preencha os formulários de entrada/saída de Israel."
goodToKnow:
  - icon: 🚫
    label:
      en: Cabin route bans
      fr: Routes cabine interdites
      es: Rutas con cabina vetada
      pt: "Rotas com cabine vetada"
    value:
      en: No cabin pets to/from London, Johannesburg, Hong Kong, the UAE or Australia.
      fr: Pas d'animaux en cabine de/vers Londres, Johannesburg, Hong Kong, les ÉAU ou l'Australie.
      es: Sin mascotas en cabina hacia/desde Londres, Johannesburgo, Hong Kong, EAU o Australia.
      pt: "Sem animais em cabine de/para Londres, Joanesburgo, Hong Kong, os EAU ou a Austrália."
  - icon: 📄
    label:
      en: Israel vet authorization
      fr: Autorisation vétérinaire Israël
      es: Autorización veterinaria de Israel
      pt: "Autorização veterinária de Israel"
    value:
      en: Pets to/from Israel need Ministry of Agriculture authorization ≤ 2 days before the flight.
      fr: Les animaux de/vers Israël nécessitent une autorisation du ministère de l'Agriculture ≤ 2 jours avant le vol.
      es: Las mascotas hacia/desde Israel necesitan una autorización del Ministerio de Agricultura ≤ 2 días antes del vuelo.
      pt: "Animais de/para Israel precisam de autorização do Ministério da Agricultura ≤ 2 dias antes do voo."
  - icon: 📞
    label:
      en: Phone booking
      fr: Réservation par téléphone
      es: Reserva por teléfono
      pt: "Reserva por telefone"
    value:
      en: Pets are booked by phone via the EL AL service centre, not online.
      fr: Les animaux se réservent par téléphone via le centre de service EL AL, pas en ligne.
      es: Las mascotas se reservan por teléfono a través del centro de atención de EL AL, no en línea.
      pt: "Os animais são reservados por telefone pela central de atendimento da EL AL, não online."
