  note:
    en: Aircalin publishes no figure at all — not a rate, not a weight, not a dimension. Everything is quoted case by case by the cargo office.
    fr: Aircalin ne publie aucun chiffre — ni tarif, ni poids, ni dimension. Tout est chiffré au cas par cas par le bureau cargo.
    es: "Aircalin no publica ninguna cifra: ni tarifa, ni peso, ni dimensión. Todo lo cotiza caso por caso la oficina de carga."
    pt: "A Aircalin não publica nenhum número — nem tarifa, nem peso, nem dimensão. Tudo é orçado caso a caso pelo escritório de carga."
restrictions:
  - icon: 🚫
    title:
      en: Pit Bull type
      fr: Type Pit Bull
      es: Tipo Pit Bull
      pt: "Tipo Pit Bull"
    pills:
      - cls: "no"
        label:
          en: Refused
          fr: Refusé
          es: Rechazado
          pt: "Recusado"
    note:
      en: "The only breed rule Aircalin publishes, word for word: \"Dogs such as Pit Bull will be no longer accepted from the 1st of January 2015.\" No snub-nosed list, no dangerous-dog categories, nothing else."
      fr: "La seule règle de race publiée par Aircalin, mot pour mot : « Dogs such as Pit Bull will be no longer accepted from the 1st of January 2015. » Aucune liste de nez écrasés, aucune catégorie de chiens dangereux, rien d'autre."
      es: "La única regla de raza que publica Aircalin, literalmente: «Dogs such as Pit Bull will be no longer accepted from the 1st of January 2015». Ninguna lista de hocicos chatos, ninguna categoría de perros peligrosos, nada más."
      pt: "A única regra de raça publicada pela Aircalin, palavra por palavra: \"Dogs such as Pit Bull will be no longer accepted from the 1st of January 2015.\" Nenhuma lista de focinho achatado, nenhuma categoria de cães perigosos, nada além disso."
temperature:
  pills:
    - cls: warn
      label:
        en: "Temperature limits: not disclosed"
        fr: "Limites de température : non communiqué"
        es: "Límites de temperatura: no comunicado"
        pt: "Limites de temperatura: não divulgados"
  note:
    en: Aircalin publishes no hold-temperature limits or seasonal embargo on its pet page.
    fr: Aircalin ne publie pas de limites de température en soute ni d'embargo saisonnier sur sa page animaux.
    es: Aircalin no publica límites de temperatura en bodega ni embargo estacional en su página de mascotas.
    pt: "A Aircalin não publica limites de temperatura no porão nem embargo sazonal em sua página sobre animais."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: Guide dogs for the visually or hearing impaired may be admitted in the cabin, subject to authorisation. It's the single exception to the airfreight rule.
      fr: Les chiens guides pour déficients visuels ou auditifs peuvent être admis en cabine, sur autorisation. C'est la seule exception à la règle du fret.
      es: Los perros guía para personas con discapacidad visual o auditiva pueden ser admitidos en cabina, previa autorización. Es la única excepción a la regla del flete.
      pt: "Cães-guia para pessoas com deficiência visual ou auditiva podem ser admitidos na cabine, mediante autorização. É a única exceção à regra do frete."
  - icon: 📄
    label:
      en: Conditions
      fr: Conditions
      es: Condiciones
      pt: "Condições"
    value:
      en: "Not published: Aircalin gives no training standard, no certifying body, no notice period and no price for the guide dog. Request the authorisation early and get it in writing."
      fr: "Non publiées : Aircalin n'indique ni norme de dressage, ni organisme certificateur, ni préavis, ni prix pour le chien guide. Demande l'autorisation tôt et fais-la confirmer par écrit."
      es: "No publicadas: Aircalin no indica norma de adiestramiento, ni organismo certificador, ni plazo de aviso, ni precio para el perro guía. Pide la autorización con tiempo y consíguela por escrito."
      pt: "Não publicadas: a Aircalin não informa padrão de adestramento, nem entidade certificadora, nem prazo de aviso, nem preço para o cão-guia. Peça a autorização com antecedência e obtenha por escrito."
goodToKnow:
  - icon: 📅
    label:
      en: Three months ahead
      fr: Trois mois à l'avance
      es: Tres meses antes
      pt: "Três meses antes"
    value:
      en: The file has to be opened with the Tontouta cargo office three months before the flight — an unusually long lead time. Start there, before you book your own seat.
      fr: Le dossier doit être ouvert auprès du bureau cargo de Tontouta trois mois avant le vol — un délai peu commun. Commence par là, avant même de réserver ta place.
      es: El expediente debe abrirse en la oficina de carga de Tontouta tres meses antes del vuelo, un plazo poco habitual. Empieza por ahí, antes incluso de reservar tu asiento.
      pt: "O processo precisa ser aberto no escritório de carga de Tontouta três meses antes do voo — um prazo pouco comum. Comece por aí, antes mesmo de reservar seu assento."
  - icon: 📄
    label:
      en: SIVAP certificate & drop-off
      fr: Certificat SIVAP & dépôt
      es: Certificado SIVAP y entrega
      pt: "Certificado SIVAP e entrega"
    value:
      en: A SIVAP certificate (the New Caledonian veterinary and food-safety service) is required, and the animal is dropped off 4 hours before departure.
      fr: Un certificat SIVAP (le service vétérinaire et alimentaire néo-calédonien) est exigé, et l'animal se dépose 4 h avant le départ.
      es: Se exige un certificado SIVAP (el servicio veterinario y alimentario de Nueva Caledonia) y el animal se entrega 4 h antes de la salida.
      pt: "É exigido um certificado SIVAP (o serviço veterinário e de segurança alimentar da Nova Caledônia), e o animal é entregue 4 h antes da partida."
  - icon: ⚠️
    label:
      en: A near-empty page
      fr: Une page presque vide
      es: Una página casi vacía
      pt: "Uma página quase vazia"
    value:
      en: "Almost everything you'd normally look for is missing here — weights, crate sizes, rates, breed lists, temperature rules. That's not an omission on our side: Aircalin simply doesn't publish it. Expect the cargo office to be your only source of numbers."
      fr: "Presque tout ce qu'on cherche d'habitude manque ici — poids, gabarits de caisse, tarifs, listes de races, règles de température. Ce n'est pas un oubli de notre part : Aircalin ne le publie pas. Le bureau cargo sera ta seule source de chiffres."
      es: "Aquí falta casi todo lo que se suele buscar: pesos, medidas de jaula, tarifas, listas de razas, reglas de temperatura. No es un olvido nuestro: Aircalin no lo publica. La oficina de carga será tu única fuente de cifras."
      pt: "Aqui falta quase tudo o que normalmente se procura — pesos, tamanhos de caixa, tarifas, listas de raças, regras de temperatura. Não é um esquecimento nosso: a Aircalin simplesmente não publica. O escritório de carga será sua única fonte de números."
