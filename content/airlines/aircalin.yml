verdict:
  cls: no
  label:
    en: Airfreight only
    fr: Fret aérien uniquement
    es: Solo flete aéreo
    pt: "Somente frete aéreo"
verdictNote:
  en: "Aircalin says it in one line: \"Pets are only carried by airfreight.\" Neither the cabin nor the hold is open to your dog — the file goes through the Tontouta cargo office, three months ahead."
  fr: "Aircalin le dit en une phrase : « Pets are only carried by airfreight. » Ni la cabine ni la soute ne sont ouvertes à ton chien — le dossier passe par le bureau cargo de Tontouta, trois mois à l'avance."
  es: "Aircalin lo dice en una línea: «Pets are only carried by airfreight». Ni la cabina ni la bodega están abiertas a tu perro: el expediente pasa por la oficina de carga de Tontouta, con tres meses de antelación."
  pt: "A Aircalin diz em uma linha: \"Pets are only carried by airfreight.\" Nem a cabine nem o porão estão abertos ao seu cachorro — o processo passa pelo escritório de carga de Tontouta, com três meses de antecedência."
