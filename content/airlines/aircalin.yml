    - label:
        en: Cargo (airfreight)
        fr: Fret aérien
        es: Carga (flete aéreo)
        pt: "Carga (frete aéreo)"
      value:
        en: Quote — no published rate
        fr: Devis — aucun tarif publié
        es: Presupuesto — sin tarifa publicada
        pt: "Cotação — nenhuma tarifa publicada"
    - label:
