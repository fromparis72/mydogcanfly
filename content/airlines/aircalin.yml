channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: no
    statusLabel:
      en: Not allowed
      fr: Non autorisé
      es: No permitido
      pt: "Não permitido"
    detail:
      en: No pet in the cabin, whatever its size. Only guide dogs for the visually or hearing impaired can be admitted, and only with prior authorisation.
      fr: Aucun animal de compagnie en cabine, quelle que soit sa taille. Seuls les chiens guides pour déficients visuels ou auditifs peuvent être admis, et uniquement sur autorisation préalable.
      es: Ninguna mascota en cabina, sea del tamaño que sea. Solo pueden admitirse perros guía para personas con discapacidad visual o auditiva, y únicamente con autorización previa.
      pt: "Nenhum animal de estimação na cabine, seja qual for o porte. Somente cães-guia para pessoas com deficiência visual ou auditiva podem ser admitidos, e apenas com autorização prévia."
    fee:
      en: —
      fr: —
      es: —
      pt: "—"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: no
    statusLabel:
      en: Not allowed
      fr: Non autorisé
      es: No permitido
      pt: "Não permitido"
    detail:
      en: Aircalin doesn't take pets as checked baggage either. There is no accompanied-hold option at all — no weight bracket, no crate size, nothing to book at the counter.
      fr: Aircalin ne prend pas non plus les animaux en bagage enregistré. Il n'existe aucune option soute accompagnée — ni tranche de poids, ni gabarit de caisse, rien à réserver au comptoir.
      es: "Aircalin tampoco acepta mascotas como equipaje facturado. No existe ninguna opción de bodega acompañada: ni tramo de peso, ni medida de jaula, nada que reservar en el mostrador."
      pt: "A Aircalin também não aceita animais como bagagem despachada. Não existe nenhuma opção de porão acompanhado — nem faixa de peso, nem tamanho de caixa, nada para reservar no balcão."
    fee:
      en: —
      fr: —
      es: —
      pt: "—"
  - placement: cargo
    icon: ✈️
    name:
      en: Cargo (airfreight)
      fr: Fret aérien
      es: Carga (flete aéreo)
      pt: "Carga (frete aéreo)"
    cls: warn
    statusLabel:
      en: Only route
      fr: Seule voie
      es: Única vía
      pt: "Único caminho"
    detail:
      en: The file is opened with the Tontouta cargo office three months before departure, with a SIVAP certificate, and the animal is dropped off 4 hours before the flight. Aircalin publishes no rate, no weight limit and no crate dimensions for this channel.
      fr: Le dossier s'ouvre auprès du bureau cargo de Tontouta trois mois avant le départ, avec un certificat SIVAP, et l'animal est déposé 4 h avant le vol. Aircalin ne publie ni tarif, ni limite de poids, ni dimensions de caisse pour ce canal.
      es: El expediente se abre en la oficina de carga de Tontouta tres meses antes de la salida, con certificado SIVAP, y el animal se entrega 4 h antes del vuelo. Aircalin no publica tarifa, ni límite de peso, ni dimensiones de jaula para este canal.
      pt: "O processo é aberto no escritório de carga de Tontouta três meses antes da partida, com certificado SIVAP, e o animal é entregue 4 h antes do voo. A Aircalin não publica tarifa, nem limite de peso, nem dimensões de caixa para esse canal."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
