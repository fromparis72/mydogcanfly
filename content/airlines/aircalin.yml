id: airline_aircalin
mono: SB
name: Aircalin
titleH1:
  en: Flying with a dog on Aircalin
  fr: Voyager avec un chien sur Aircalin
  es: Volar con un perro en Aircalin
  pt: "Viajar com um cachorro na Aircalin"
metaDesc:
  en: "Aircalin pet policy: airfreight only, no cabin and no hold, three-month lead time, SIVAP certificate and official sources."
  fr: "Politique animaux Aircalin : fret aérien uniquement, ni cabine ni soute, dossier trois mois à l'avance, certificat SIVAP et sources officielles."
  es: "Política de mascotas de Aircalin: solo flete aéreo, ni cabina ni bodega, expediente con tres meses de antelación, certificado SIVAP y fuentes oficiales."
  pt: "Política de animais da Aircalin: somente frete aéreo, sem cabine e sem porão, processo com três meses de antecedência, certificado SIVAP e fontes oficiais."
