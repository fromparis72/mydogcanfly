id: airline_jal
mono: JL
name: Japan Airlines (JAL)
titleH1:
  en: Flying with a dog on Japan Airlines
  fr: Voyager avec un chien sur Japan Airlines
  es: Volar con un perro en Japan Airlines
  pt: "Viajar com um cachorro pela Japan Airlines"
metaDesc:
  en: "Japan Airlines pet policy: hold-only carriage, year-round bulldog ban, fares, restrictions and official sources."
  fr: "Politique animaux Japan Airlines : transport en soute uniquement, bulldogs interdits toute l'année, tarifs, restrictions et sources officielles."
  es: "Política de mascotas de Japan Airlines: transporte solo en bodega, veto a los bulldogs todo el año, tarifas, restricciones y fuentes oficiales."
  pt: "Política de animais da Japan Airlines: transporte somente no porão, proibição de buldogues o ano todo, tarifas, restrições e fontes oficiais."
