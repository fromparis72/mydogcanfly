verdict:
  cls: no
  label:
    en: Hard
    fr: Difficile
    es: Difícil
    pt: "Difícil"
verdictNote:
  en: No cats or dogs in the cabin; pets fly only in the hold — bulldogs are banned year-round.
  fr: Ni chats ni chiens en cabine ; les animaux ne volent qu'en soute — les bulldogs sont interdits toute l'année.
  es: Sin perros ni gatos en cabina; las mascotas vuelan solo en bodega y los bulldogs están vetados todo el año.
  pt: "Nenhum cachorro ou gato na cabine; os animais só voam no porão — os buldogues são proibidos o ano todo."
ladder:
  - flex: 8
    color: "#8a94a3"
    label:
