      value:
        en: Free
        fr: Gratuit
        es: Gratis
        pt: "Grátis"
  note:
    en: IndiGo carries no pets; only trained service dogs travel in the cabin for customers with disabilities.
    fr: IndiGo ne transporte aucun animal ; seuls les chiens d'assistance dressés voyagent en cabine pour les clients handicapés.
    es: IndiGo no transporta mascotas; solo los perros de servicio adiestrados viajan en cabina para clientes con discapacidad.
    pt: "A IndiGo não transporta animais; somente cães de serviço treinados viajam na cabine para clientes com deficiência."
restrictions:
  - icon: 🚫
    title:
      en: No pets
      fr: Aucun animal
      es: Sin mascotas
      pt: "Sem animais"
    pills:
      - cls: no
        label:
          en: Pets forbidden
          fr: Animaux interdits
          es: Mascotas prohibidas
          pt: "Animais proibidos"
    note:
      en: Animals (alive or dead) are explicitly prohibited in both cabin and checked baggage. Only trained service dogs for customers with disabilities are carried.
      fr: Les animaux (vivants ou morts) sont explicitement interdits en cabine et en bagage enregistré. Seuls les chiens d'assistance dressés pour les clients handicapés sont transportés.
      es: Los animales (vivos o muertos) están explícitamente prohibidos tanto en cabina como en el equipaje facturado. Solo se transportan perros de servicio adiestrados para clientes con discapacidad.
      pt: "Animais (vivos ou mortos) são explicitamente proibidos tanto na cabine quanto na bagagem despachada. Somente cães de serviço treinados para clientes com deficiência são transportados."
  - icon: 🐾
    title:
      en: No pet program
      fr: Pas de programme animal
      es: Sin programa de mascotas
      pt: "Sem programa para animais"
    pills:
      - cls: warn
        label:
          en: No 'IndiGo Pets' page
          fr: Pas de page « IndiGo Pets »
          es: Sin página «IndiGo Pets»
          pt: "Sem página «IndiGo Pets»"
    note:
      en: Despite third-party reports, no official 'IndiGo Pets' cabin/hold service exists on goindigo.in as of July 2026.
      fr: Malgré des articles tiers, aucun service officiel « IndiGo Pets » cabine/soute n'existe sur goindigo.in en juillet 2026.
      es: A pesar de artículos de terceros, no existe ningún servicio oficial «IndiGo Pets» de cabina/bodega en goindigo.in a fecha de julio de 2026.
      pt: "Apesar de reportagens de terceiros, não existe nenhum serviço oficial «IndiGo Pets» de cabine/porão no goindigo.in até julho de 2026."
temperature:
  pills:
    - cls: warn
      label:
        en: No pets carried
        fr: Aucun animal transporté
        es: No se transportan mascotas
        pt: "Nenhum animal transportado"
  note:
    en: IndiGo carries no pets, so no hold-temperature policy applies.
    fr: "IndiGo ne transporte aucun animal : aucune règle de température de soute ne s'applique."
    es: "IndiGo no transporta mascotas: no se aplica ninguna norma de temperatura en bodega."
    pt: "A IndiGo não transporta animais, portanto nenhuma política de temperatura no porão se aplica."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: Service dogs for customers with disabilities travel in the cabin, at your feet, muzzled and restrained; excluded from weight/container limits.
      fr: Les chiens d'assistance pour clients handicapés voyagent en cabine, à tes pieds, muselés et attachés ; exclus des limites de poids/contenant.
      es: Los perros de servicio para clientes con discapacidad viajan en cabina, a sus pies, con bozal y sujetos; sin límites de peso/jaula.
      pt: "Os cães de serviço para clientes com deficiência viajam na cabine, aos seus pés, com focinheira e presos; sem limites de peso ou de caixa de transporte."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: Add the dog by calling the call centre ≥ 48 h ahead with training + vaccination proof; bring an absorbent mat, arrive 2 h early.
      fr: Ajouter le chien en appelant le centre d'appel ≥ 48 h à l'avance avec preuves de dressage + vaccination ; apporter un tapis absorbant, arriver 2 h avant.
      es: Añade el perro llamando al centro de atención ≥ 48 h antes con pruebas de adiestramiento + vacunación; lleva una alfombrilla absorbente y llega 2 h antes.
      pt: "Adicione o cachorro ligando para a central de atendimento ≥ 48 h antes, com comprovantes de treinamento e vacinação; leve um tapete absorvente e chegue 2 h antes."
goodToKnow:
  - icon: 🚫
    label:
      en: No pets
      fr: Aucun animal
      es: Sin mascotas
      pt: "Sem animais"
    value:
      en: Animals are prohibited in cabin and checked baggage; only service dogs are carried.
      fr: Les animaux sont interdits en cabine et en bagage enregistré ; seuls les chiens d'assistance sont transportés.
      es: Los animales están prohibidos en cabina y equipaje facturado; solo se transportan perros de servicio.
      pt: "Os animais são proibidos na cabine e na bagagem despachada; somente cães de serviço são transportados."
  - icon: 🦮
    label:
      en: Service dogs only
      fr: Chiens d'assistance seuls
      es: Solo perros de servicio
      pt: "Somente cães de serviço"
    value:
      en: Only trained service dogs for customers with disabilities may travel in the cabin.
      fr: Seuls les chiens d'assistance dressés pour clients handicapés peuvent voyager en cabine.
      es: Solo los perros de servicio adiestrados para clientes con discapacidad pueden viajar en cabina.
      pt: "Somente cães de serviço treinados para clientes com deficiência podem viajar na cabine."
  - icon: 📄
    label:
      en: No official program
      fr: Pas de programme officiel
      es: Sin programa oficial
      pt: "Sem programa oficial"
    value:
      en: No official IndiGo pet service exists as of July 2026.
      fr: Aucun service animal officiel IndiGo n'existe en juillet 2026.
      es: No existe ningún servicio oficial de mascotas de IndiGo a fecha de julio de 2026.
      pt: "Não existe nenhum serviço oficial da IndiGo para animais até julho de 2026."
