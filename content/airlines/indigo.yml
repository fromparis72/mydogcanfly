metaDesc:
  en: "IndiGo pet policy: no pets carried, only service dogs for customers with disabilities, and official sources."
  fr: "Politique animaux IndiGo : aucun animal transporté, seulement les chiens d'assistance pour clients handicapés, et sources officielles."
  es: "Política de mascotas de IndiGo: no se transportan mascotas, solo perros de servicio para clientes con discapacidad, y fuentes oficiales."
  pt: "Política de animais da IndiGo: nenhum animal é transportado, somente cães de serviço para clientes com deficiência, e fontes oficiais."
