id: airline_philippine
mono: PR
name: Philippine Airlines
titleH1:
  en: Flying with a dog on Philippine Airlines
  fr: Voyager avec un chien sur Philippine Airlines
  es: Viajar con un perro en Philippine Airlines
  pt: "Viajar com um cachorro na Philippine Airlines"
metaDesc:
  en: "Philippine Airlines pet policy: FurPAL cabin dogs (domestic), hold and cargo, fares, snub-nosed embargo and official sources."
  fr: "Politique animaux Philippine Airlines : chiens en cabine FurPAL (domestique), soute et fret, tarifs, embargo brachy et sources officielles."
  es: "Política de mascotas de Philippine Airlines: perros en cabina FurPAL (nacional), bodega y carga, tarifas, embargo para razas de hocico chato y fuentes oficiales."
  pt: "Política de animais da Philippine Airlines: cachorros em cabine via FurPAL (voos domésticos), porão e carga, tarifas, embargo para focinho achatado e fontes."
