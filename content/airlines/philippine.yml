verdict:
  cls: warn
  label:
    en: Moderate
    fr: Modéré
    es: Moderado
    pt: "Moderada"
verdictNote:
  en: Cabin dogs on domestic flights (FurPAL), plus hold & cargo — but strict permits and a broad snub-nosed embargo.
  fr: Chiens en cabine sur vols domestiques (FurPAL), plus soute & fret — mais permis stricts et large embargo brachy.
  es: Perros en cabina en vuelos nacionales (FurPAL), además de bodega y carga, pero con permisos estrictos y un amplio embargo para razas de hocico chato.
  pt: "Cachorros em cabine nos voos domésticos (FurPAL), além de porão e carga — mas com autorizações rigorosas e um amplo embargo para focinho achatado."
