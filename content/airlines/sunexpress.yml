titleH1:
  en: Flying with a dog on SunExpress
  fr: Voyager avec un chien sur SunExpress
  es: Volar con un perro en SunExpress
  pt: "Viajar com um cachorro na SunExpress"
metaDesc:
  en: "SunExpress pet policy: 8 kg in the cabin from €89.99, hold priced but never given a weight ceiling — and a surprisingly generous free emotional-support-dog policy for 2026."
  fr: "Politique animaux SunExpress : 8 kg en cabine dès 89,99 €, soute tarifée mais sans plafond de poids jamais indiqué — et une politique gratuite pour chiens de soutien émotionnel étonnamment généreuse pour 2026."
  es: "Política de mascotas de SunExpress: 8 kg en cabina desde 89,99 €, bodega con precio pero sin techo de peso indicado nunca — y una política gratuita para perros de apoyo emocional sorprendentemente generosa para 2026."
  pt: "Política de animais da SunExpress: 8 kg na cabine a partir de 89,99 €, porão com preço mas sem teto de peso informado — e uma política gratuita para cães de apoio emocional surpreendentemente generosa para 2026."
