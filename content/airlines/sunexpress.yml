verdictNote:
  en: Cabin and hold are both open and clearly priced, but the hold program never states an upper weight limit, and no temperature policy exists for a carrier headquartered in one of Europe's hottest summer airports.
  fr: Cabine et soute sont ouvertes et clairement tarifées, mais le programme soute ne donne jamais de poids maximal, et aucune politique de température n'existe chez ce transporteur dont le siège est dans l'un des aéroports les plus chauds d'Europe l'été.
  es: "Cabina y bodega están abiertas y con precios claros, pero el programa de bodega nunca indica un límite máximo de peso, y no existe ninguna política de temperatura en esta aerolínea con sede en uno de los aeropuertos más calurosos de Europa en verano."
  pt: "Cabine e porão estão abertos e com preços claros, mas o programa de porão nunca informa um limite máximo de peso, e não existe nenhuma política de temperatura nesta companhia sediada em um dos aeroportos mais quentes da Europa no verão."
