channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Aceptado
      pt: "Permitido"
    detail:
      en: Dogs, cats & birds (min 8 weeks) ≤ 7 kg incl. carrier under the seat (max 32 × 45 × 19 cm); one per passenger.
      fr: Chiens, chats et oiseaux (min 8 semaines) ≤ 7 kg avec le sac sous le siège (max 32 × 45 × 19 cm) ; un par passager.
      es: Perros, gatos y aves (mín. 8 semanas) ≤ 7 kg con el bolso bajo el asiento (máx. 32 × 45 × 19 cm); uno por pasajero.
      pt: "Cachorros, gatos e aves (mín. 8 semanas) ≤ 7 kg incluindo a bolsa de transporte sob o assento (máx. 32 × 45 × 19 cm); um por passageiro."
    fee:
      en: $150–300
      fr: 150–300 $
      es: 150–300 $
      pt: "150–300 $"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Aceptado
      pt: "Permitido"
    detail:
      en: Dogs & cats (min 16 weeks) up to 45 kg incl. carrier in a ventilated hold. Not on B737/A321 international or domestic Jun–Sep.
      fr: Chiens et chats (min 16 semaines) jusqu'à 45 kg avec la caisse dans une soute ventilée. Pas sur B737/A321 en international ni en national juin–sept.
      es: Perros y gatos (mín. 16 semanas) hasta 45 kg con la jaula en una bodega ventilada. No en B737/A321 internacional ni doméstico de jun. a sep.
      pt: "Cachorros e gatos (mín. 16 semanas) até 45 kg incluindo a caixa de transporte em um porão ventilado. Não disponível em B737/A321 internacional nem em voos domésticos de jun. a set."
    fee:
      en: $150–600
      fr: 150–600 $
      es: 150–600 $
      pt: "150–600 $"
  - placement: cargo
    icon: ✈️
    name:
      en: Specialized-LIVE
      fr: Specialized-LIVE
      es: Specialized-LIVE
      pt: "Specialized-LIVE"
    cls: warn
    statusLabel:
      en: Via agent
      fr: Via agent
      es: A través de agente
      pt: "Via agente"
    detail:
      en: Freighter live-animal service (KE routes) via a specialist, ~10–14 days ahead. Snub-nosed breeds barred.
      fr: Service cargo animaux vivants (routes KE) via un spécialiste, ~10–14 jours à l'avance. Races au nez écrasé exclues.
      es: Servicio de animales vivos en avión de carga (rutas KE) a través de un especialista, ~10–14 días antes. Razas de hocico chato excluidas.
      pt: "Serviço de animais vivos em avião cargueiro (rotas KE) por meio de um especialista, ~10–14 dias de antecedência. Raças de focinho achatado excluídas."
    fee:
      en: Quote
      fr: Devis
      es: Cotización
      pt: "Cotação"
