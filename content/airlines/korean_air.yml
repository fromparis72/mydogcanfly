    pt: "Moderada"
verdictNote:
  en: Pets in the cabin (≤ 7 kg) or hold (≤ 45 kg) on most routes — but advance approval and strict breed rules.
  fr: Animaux en cabine (≤ 7 kg) ou en soute (≤ 45 kg) sur la plupart des routes — mais approbation préalable et règles de races strictes.
  es: Mascotas en cabina (≤ 7 kg) o bodega (≤ 45 kg) en la mayoría de las rutas, pero con aprobación previa y normas de raza estrictas.
  pt: "Animais na cabine (≤ 7 kg) ou no porão (≤ 45 kg) na maioria das rotas — mas exige aprovação prévia e regras rígidas de raça."
