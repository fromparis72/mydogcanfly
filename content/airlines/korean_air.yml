titleH1:
  en: Flying with a dog on Korean Air
  fr: Voyager avec un chien sur Korean Air
  es: Viajar con un perro en Korean Air
  pt: "Viajar com um cachorro pela Korean Air"
metaDesc:
  en: "Korean Air pet policy: cabin, hold and Specialized-LIVE cargo, fares by zone, breed limits and official sources."
  fr: "Politique animaux Korean Air : cabine, soute et fret Specialized-LIVE, tarifs par zone, restrictions de races et sources officielles."
  es: "Política de mascotas de Korean Air: cabina, bodega y carga Specialized-LIVE, tarifas por zona, límites por raza y fuentes oficiales."
  pt: "Política de animais da Korean Air: cabine, porão e carga Specialized-LIVE, tarifas por zona, restrições de raça e fontes oficiais."
