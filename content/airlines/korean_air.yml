restrictions:
  - icon: 🐶
    title:
      en: Flat-faced breeds
      fr: Races brachycéphales
      es: Razas braquicéfalas
      pt: "Raças de focinho achatado"
    pills:
      - cls: ok
        label:
          en: Cabin possible
          fr: Cabine possible
          es: Cabina posible
          pt: "Cabine possível"
      - cls: no
        label:
          en: Hold/cargo forbidden
          fr: Soute/fret interdits
          es: Bodega/carga prohibidas
          pt: "Porão/carga proibidos"
    note:
      en: "Snub-nosed breeds can't travel in the hold or cargo — cabin only if within limits: Boston terrier, boxer, bulldog, Brussels Griffon, Shar Pei, Shih Tzu, American Bully, chow chow, Cane Corso, pug, Pekingese, Chihuahua, Japanese Chin, and Burmese/British Shorthair/Scottish Fold/Exotic/Persian/Himalayan cats — plus Newfoundland, Dogo Argentino, Lhasa Apso."
      fr: "Les races au nez écrasé ne peuvent pas voyager en soute ni en fret — cabine seulement dans les limites : Boston terrier, boxer, bulldog, Griffon bruxellois, Shar Pei, Shih Tzu, American Bully, chow chow, Cane Corso, carlin, pékinois, Chihuahua, Chin japonais, et chats birmans/British Shorthair/Scottish Fold/exotiques/persans/himalayens — plus Terre-Neuve, Dogo Argentino, Lhassa Apso."
      es: "Las razas de hocico chato no pueden viajar en bodega ni carga; solo en cabina si están dentro de los límites: Boston terrier, bóxer, bulldog, Grifón de Bruselas, Shar Pei, Shih Tzu, American Bully, chow chow, Cane Corso, carlino, pekinés, Chihuahua, Chin japonés y gatos birmanos/British Shorthair/Scottish Fold/exóticos/persas/himalayos, además de Terranova, Dogo Argentino y Lhasa Apso."
      pt: "As raças de focinho achatado não podem viajar no porão nem na carga — somente na cabine, dentro dos limites: Boston Terrier, boxer, buldogue, Grifon de Bruxelas, Shar Pei, Shih Tzu, American Bully, Chow Chow, Cane Corso, pug, Pequinês, Chihuahua, Chin Japonês, e gatos burmeses/British Shorthair/Scottish Fold/exóticos/persas/himalaios — além de Terra-nova, Dogo Argentino e Lhasa Apso."
  - icon: 🚫
    title:
      en: Banned breeds
      fr: Races interdites
      es: Razas prohibidas
      pt: "Raças proibidas"
    pills:
      - cls: no
        label:
          en: Not accepted
          fr: Refusées
          es: No aceptadas
          pt: "Não aceitas"
      - cls: no
        label:
          en: No sedation
          fr: Pas de sédation
          es: Sin sedación
          pt: "Sem sedação"
    note:
      en: "Not accepted at all: Tosa, pit bull types (incl. Bull Terrier, American Staffordshire, Staffordshire), Rottweiler, mastiffs, Laika, Ovcharka, Kangal, wolfdogs — and mixes. Sedated or pregnant pets are refused."
      fr: "Totalement refusés : Tosa, types pit-bull (dont Bull Terrier, American Staffordshire, Staffordshire), Rottweiler, mastiffs, Laïka, Ovtcharka, Kangal, chiens-loups — et croisés. Animaux sédatés ou gestants refusés."
      es: "No se aceptan en absoluto: Tosa, tipos pit bull (incl. Bull Terrier, American Staffordshire, Staffordshire), Rottweiler, mastines, Laika, Ovcharka, Kangal, perros lobo y sus cruces. Se rechazan las mascotas sedadas o preñadas."
      pt: "Totalmente recusados: Tosa, tipos pit bull (incluindo Bull Terrier, American Staffordshire, Staffordshire), Rottweiler, mastins, Laika, Ovcharka, Kangal, cães-lobo — e seus cruzamentos. Animais sedados ou prenhes são recusados."
temperature:
  pills:
    - cls: no
      label:
        en: Adverse above 29 °C / below −7 °C
        fr: Néfaste au-dessus de 29 °C / sous −7 °C
        es: Perjudicial por encima de 29 °C / por debajo de −7 °C
        pt: "Prejudicial acima de 29 °C / abaixo de −7 °C"
    - cls: warn
      label:
        en: No hold Jun–Sep (domestic)
        fr: Pas de soute juin–sept. (national)
        es: Sin bodega de jun. a sep. (doméstico)
        pt: "Sem porão de jun. a set. (doméstico)"
  note:
    en: Korean Air warns that temperatures above 29 °C (84 °F) or below −7 °C (19 °F) can harm pets; checked-pet hold transport is restricted in the warm season (Jun–Sep) on domestic flights. The hold has controlled ventilation, temperature and lighting.
    fr: Korean Air avertit que les températures au-dessus de 29 °C (84 °F) ou sous −7 °C (19 °F) peuvent nuire aux animaux ; le transport en soute est restreint en saison chaude (juin–sept.) sur les vols nationaux. La soute dispose d'une ventilation, d'une température et d'un éclairage contrôlés.
    es: Korean Air advierte que las temperaturas por encima de 29 °C (84 °F) o por debajo de −7 °C (19 °F) pueden perjudicar a las mascotas; el transporte en bodega está restringido en la temporada cálida (jun.–sep.) en vuelos domésticos. La bodega cuenta con ventilación, temperatura e iluminación controladas.
    pt: "A Korean Air alerta que temperaturas acima de 29 °C (84 °F) ou abaixo de −7 °C (19 °F) podem prejudicar os animais; o transporte de animais no porão é restrito na estação quente (jun.–set.) em voos domésticos. O porão tem ventilação, temperatura e iluminação controladas."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En la cabina
      pt: "Na cabine"
    value:
      en: Trained service dogs (min 16 weeks, max 2) travel free in the cabin, harnessed, no carrier.
      fr: Chiens d'assistance dressés (min 16 semaines, max 2) gratuits en cabine, en harnais, sans sac.
      es: Los perros de servicio adiestrados (mín. 16 semanas, máx. 2) viajan gratis en cabina, con arnés y sin jaula.
      pt: "Cães de serviço treinados (mín. 16 semanas, máx. 2) viajam gratuitamente na cabine, com peitoral, sem bolsa de transporte."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: "Request in advance and select a pet-designated seat. US: CDC Dog Import Form, dogs 6 months+."
      fr: "Demander à l'avance et choisir un siège dédié à l'animal. USA : formulaire CDC Dog Import, chiens 6 mois+."
      es: "Solicítalo con antelación y elige un asiento designado para la mascota. EE. UU.: formulario CDC Dog Import, perros de 6 meses+."
      pt: "Solicite com antecedência e escolha um assento designado para animais. EUA: formulário CDC Dog Import Form, cachorros com 6 meses ou mais."
goodToKnow:
  - icon: ⏱️
    label:
      en: Advance approval
      fr: Approbation préalable
      es: Aprobación previa
      pt: "Aprovação prévia"
    value:
      en: Request the pet service ≥ 48 h (international) / 24 h (domestic) ahead; approval required, fare recalculated on the day by measured weight.
      fr: Demander le service animal ≥ 48 h (international) / 24 h (national) à l'avance ; approbation requise, tarif recalculé le jour même selon le poids mesuré.
      es: Solicite el servicio de mascota con ≥ 48 h (internacional) / 24 h (doméstico) de antelación; se requiere aprobación y la tarifa se recalcula el mismo día según el peso medido.
      pt: "Solicite o serviço para animais com ≥ 48 h (internacional) / 24 h (doméstico) de antecedência; exige aprovação, e a tarifa é recalculada no dia com base no peso medido."
  - icon: 🚫
    label:
      en: Excluded destinations
      fr: Destinations exclues
      es: Destinos excluidos
      pt: "Destinos excluídos"
    value:
      en: New Zealand, Australia, Hong Kong and the UK don't accept pets in cabin or hold.
      fr: Nouvelle-Zélande, Australie, Hong Kong et le R.-U. n'acceptent pas d'animaux en cabine ni en soute.
      es: Nueva Zelanda, Australia, Hong Kong y el Reino Unido no aceptan mascotas en cabina ni en bodega.
      pt: "Nova Zelândia, Austrália, Hong Kong e Reino Unido não aceitam animais na cabine nem no porão."
  - icon: 🐾
    label:
      en: SKYPETS
      fr: SKYPETS
      es: SKYPETS
      pt: "SKYPETS"
    value:
      en: The pet fare can be paid by card or miles — or free with SKYPETS points.
      fr: Le tarif animal peut être payé par carte ou en miles — ou gratuit avec les points SKYPETS.
      es: La tarifa de la mascota se puede pagar con tarjeta o con millas, o gratis con los puntos SKYPETS.
      pt: "A tarifa para animais pode ser paga com cartão ou milhas — ou de graça com pontos SKYPETS."
