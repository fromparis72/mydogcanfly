policies:
  cabin:
    availability: offered
  hold:
    availability: not_offered
  cargo:
    availability: not_offered
channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Small dogs & cats (min 8 weeks) ≤ 10 kg (pet + carrier) in a soft carrier under the seat (max 50 × 40 × 20 cm); one per passenger, max 5/flight.
      fr: Petits chiens et chats (min 8 semaines) ≤ 10 kg (animal + sac) dans un sac souple sous le siège (max 50 × 40 × 20 cm) ; un par passager, max 5/vol.
      es: Perros y gatos pequeños (mín. 8 semanas) ≤ 10 kg (mascota + jaula) en una jaula blanda bajo el asiento (máx. 50 × 40 × 20 cm); uno por pasajero, máx. 5 por vuelo.
      pt: "Cachorros e gatos pequenos (mín. 8 semanas) ≤ 10 kg (animal + bolsa) em uma bolsa flexível sob o assento (máx. 50 × 40 × 20 cm); um por passageiro, máx. 5 por voo."
    fee:
      en: €39–60
      fr: 39–60 €
      es: 39–60 €
      pt: "€39–60"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: no
    statusLabel:
      en: Not offered
      fr: Non proposé
      es: No disponible
      pt: "Não oferecido"
    detail:
      en: Volotea doesn't transport pets in the hold.
      fr: Volotea ne transporte pas les animaux en soute.
      es: Volotea no transporta mascotas en la bodega.
      pt: "A Volotea não transporta animais no porão."
    fee:
      en: —
      fr: —
      es: —
      pt: "—"
  - placement: cargo
    icon: ✈️
    name:
      en: Cargo
      fr: Fret
      es: Carga
      pt: "Carga"
    cls: no
    statusLabel:
      en: Not offered
      fr: Non proposé
      es: No disponible
      pt: "Não oferecido"
    detail:
      en: Volotea publishes no cargo option for pets — its conditions only cover the cabin.
      fr: Volotea ne publie aucune offre de fret pour les animaux — ses conditions ne couvrent que la cabine.
      es: Volotea no publica ninguna opción de carga para mascotas — sus condiciones solo cubren la cabina.
      pt: "A Volotea não publica nenhuma opção de carga para animais — suas condições cobrem apenas a cabine."
    fee:
      en: —
      fr: —
      es: —
      pt: "—"
fareList:
  rows:
    - label:
        en: Cabin (≤ 10 kg)
        fr: Cabine (≤ 10 kg)
        es: Cabina (≤ 10 kg)
        pt: "Cabine (≤ 10 kg)"
      value:
        en: €39 online / €60 airport
        fr: 39 € en ligne / 60 € aéroport
        es: 39 € en línea / 60 € en el aeropuerto
        pt: "€39 on-line / €60 no aeroporto"
    - label:
        en: Hold / cargo
        fr: Soute / fret
        es: Bodega / carga
        pt: "Porão / carga"
      value:
        en: Not offered
        fr: Non proposé
        es: No disponible
        pt: "Não oferecido"
    - label:
        en: Guide dog
        fr: Chien guide
        es: Perro guía
        pt: "Cão-guia"
      value:
        en: Free
        fr: Gratuit
        es: Gratis
        pt: "Grátis"
  note:
    en: EUR each way; check in at the airport when travelling with a pet.
    fr: EUR par trajet ; enregistrement à l'aéroport avec un animal.
    es: EUR por trayecto; factura en el aeropuerto cuando viajes con una mascota.
    pt: "EUR por trajeto; faça check-in no aeroporto quando viajar com um animal."
restrictions:
  - icon: 🐾
    title:
      en: Cats & dogs only
      fr: Chats & chiens seuls
      es: Solo gatos y perros
      pt: "Somente gatos e cachorros"
    pills:
      - cls: no
        label:
          en: No hold
          fr: Pas de soute
          es: Sin bodega
          pt: "Sem porão"
    note:
      en: Only cats and dogs are accepted (no other animals) and there's no hold option. Pets are refused if pregnant, unwell, unhygienic, malodorous or aggressive.
      fr: Seuls les chats et chiens sont acceptés (pas d'autres animaux) et il n'y a pas d'option soute. Les animaux sont refusés s'ils sont gestants, malades, malpropres, malodorants ou agressifs.
      es: Solo se aceptan gatos y perros (ningún otro animal) y no hay opción de bodega. Se rechazan las mascotas gestantes, enfermas, poco higiénicas, malolientes o agresivas.
      pt: "Somente gatos e cachorros são aceitos (nenhum outro animal) e não há opção de porão. Os animais são recusados se estiverem prenhes, doentes, sem higiene, com mau cheiro ou agressivos."
  - icon: 🚫
    title:
      en: Excluded countries
      fr: Pays exclus
      es: Países excluidos
      pt: "Países excluídos"
    pills:
      - cls: no
        label:
          en: UK / Ireland / Malta
          fr: R.-U. / Irlande / Malte
          es: Reino Unido / Irlanda / Malta
          pt: "Reino Unido / Irlanda / Malta"
    note:
      en: No pet transport to/from the UK, Ireland or Malta. The carrier must be soft with breathing holes and a waterproof base (homemade boxes rejected).
      fr: Aucun transport d'animal de/vers le R.-U., l'Irlande ou Malte. Le sac doit être souple avec des trous d'aération et un fond étanche (boîtes artisanales refusées).
      es: No se transportan mascotas desde/hacia Reino Unido, Irlanda ni Malta. La jaula debe ser blanda, con orificios de ventilación y base impermeable (se rechazan las cajas caseras).
      pt: "Nenhum transporte de animais de/para o Reino Unido, a Irlanda ou Malta. A bolsa deve ser flexível, com furos de ventilação e base impermeável (caixas artesanais são recusadas)."
noPetCountries: [GB, IE, MT]
temperature:
  pills:
    - cls: warn
      label:
        en: Cabin-only program
        fr: Programme cabine seule
        es: Programa solo cabina
        pt: "Programa somente cabine"
  note:
    en: Volotea carries pets in the cabin only, so no hold-temperature policy applies.
    fr: "Volotea ne transporte les animaux qu'en cabine : aucune règle de température de soute ne s'applique."
    es: Volotea transporta mascotas solo en cabina, por lo que no se aplica ninguna norma de temperatura de bodega.
    pt: "A Volotea transporta animais somente na cabine, portanto nenhuma norma de temperatura de porão se aplica."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: Guide dogs for visually-impaired passengers travel free in the cabin, correctly secured.
      fr: Les chiens guides pour passagers déficients visuels voyagent gratuitement en cabine, correctement attachés.
      es: Los perros guía para pasajeros con discapacidad visual viajan gratis en cabina, correctamente sujetos.
      pt: "Cães-guia de passageiros com deficiência visual viajam gratuitamente na cabine, devidamente presos."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: Book via Special Assistance; carry ID/passport + health certificate.
      fr: Réserver via l'Assistance spéciale ; se munir de la pièce/passeport + certificat sanitaire.
      es: Reserva a través de Asistencia Especial; lleva el DNI/pasaporte + certificado sanitario.
      pt: "Reserve pela Assistência Especial; leve identidade/passaporte + atestado de saúde veterinário."
goodToKnow:
  - icon: 🐾
    label:
      en: Cabin only
      fr: Cabine uniquement
      es: Solo cabina
      pt: "Somente cabine"
    value:
      en: "Volotea's conditions of carriage say it plainly: it does not offer the option of transporting pets in the aircraft hold. It publishes no pet cargo option either, so the cabin is the only route."
      fr: "Les conditions de transport de Volotea le disent noir sur blanc : elle ne propose pas le transport d'animaux en soute. Elle ne publie pas davantage d'offre de fret pour les animaux, la cabine est donc la seule voie."
      es: "Las condiciones de transporte de Volotea lo dicen claramente: no ofrece la opción de transportar mascotas en la bodega. Tampoco publica ninguna opción de carga para mascotas, así que la cabina es la única vía."
      pt: "As condições de transporte da Volotea dizem claramente: ela não oferece a opção de transportar animais no porão. Também não publica nenhuma opção de carga para animais, então a cabine é o único caminho."
  - icon: 🚫
    label:
      en: No UK/Ireland/Malta
      fr: Pas R.-U./Irlande/Malte
      es: Ni Reino Unido/Irlanda/Malta
      pt: "Sem Reino Unido/Irlanda/Malta"
    value:
      en: No pet transport to/from the UK, Ireland or Malta.
      fr: Aucun transport d'animal de/vers le R.-U., l'Irlande ou Malte.
      es: No se transportan mascotas desde/hacia Reino Unido, Irlanda ni Malta.
      pt: "Nenhum transporte de animais de/para o Reino Unido, a Irlanda ou Malta."
  - icon: 🎫
    label:
      en: Airport check-in
      fr: Enregistrement aéroport
      es: Facturación en el aeropuerto
      pt: "Check-in no aeroporto"
    value:
      en: Passengers travelling with a pet must check in at the airport (not online); max 5 pets/flight.
      fr: Les passagers avec un animal doivent s'enregistrer à l'aéroport (pas en ligne) ; max 5 animaux/vol.
      es: Los pasajeros que viajan con una mascota deben facturar en el aeropuerto (no en línea); máx. 5 mascotas por vuelo.
      pt: "Passageiros que viajam com um animal devem fazer check-in no aeroporto (não on-line); máx. 5 animais por voo."
book:
