id: airline_volotea
mono: V7
name: Volotea
titleH1:
  en: Flying with a dog on Volotea
  fr: Voyager avec un chien sur Volotea
  es: Volar con un perro en Volotea
  pt: "Viajar com um cachorro na Volotea"
metaDesc:
  en: "Volotea pet policy: small cabin pets only, no hold or cargo, UK/Ireland/Malta exclusion and official sources."
  fr: "Politique animaux Volotea : petits animaux en cabine seulement, pas de soute ni fret, exclusion R.-U./Irlande/Malte et sources officielles."
  es: "Política de mascotas de Volotea: solo mascotas pequeñas en cabina, sin bodega ni carga, exclusión de Reino Unido/Irlanda/Malta y fuentes oficiales."
  pt: "Política de animais da Volotea: somente animais pequenos na cabine, sem porão nem carga, exclusão de Reino Unido/Irlanda/Malta e fontes oficiais."
chips:
  - icon: 📍
    label:
      en: Spain / France
      fr: Espagne / France
      es: España / Francia
      pt: "Espanha / França"
  - icon: 🗓
    label:
      en: Updated 8 Aug 2026
      fr: Mise à jour le 8 août 2026
      es: Actualizado el 8 ago. 2026
      pt: "Atualizado em 8 ago. 2026"
verdict:
  cls: ok
  label:
    en: Easy
    fr: Facile
    es: Fácil
    pt: "Fácil"
verdictNote:
  en: Small cats & dogs in the cabin for a modest fee — but no hold, and no pets to the UK, Ireland or Malta.
  fr: Petits chats et chiens en cabine pour un tarif modéré — mais pas de soute, et rien vers le R.-U., l'Irlande ou Malte.
  es: Gatos y perros pequeños en cabina por una tarifa moderada, pero sin bodega y sin mascotas a Reino Unido, Irlanda ni Malta.
  pt: "Gatos e cachorros pequenos na cabine por uma tarifa modesta — mas sem porão, e nenhum animal para o Reino Unido, a Irlanda ou Malta."
ladder:
  - flex: 24
    color: "#16794f"
    label:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    sub: ≤ 10 kg
  - flex: 76
    color: "#8a94a3"
    label:
      en: Hold / cargo
      fr: Soute / fret
      es: Bodega / carga
      pt: "Porão / carga"
