id: airline_united
mono: UA
name: United Airlines
titleH1:
  en: Flying with a dog on United Airlines
  fr: Voyager avec un chien sur United Airlines
  es: Volar con un perro en United Airlines
  pt: "Viajar com um cachorro na United Airlines"
metaDesc:
  en: "United Airlines pet policy: cabin-only pets, discontinued checked baggage, military cargo, restrictions and official sources."
  fr: "Politique animaux United Airlines : animaux en cabine seulement, soute abandonnée, fret militaire, restrictions et sources officielles."
  es: "Política de mascotas de United Airlines: mascotas solo en cabina, equipaje facturado suspendido, carga militar, restricciones y fuentes oficiales."
  pt: "Política de animais da United Airlines: animais somente na cabine, bagagem despachada encerrada, carga militar, restrições e fontes oficiais."
chips:
  - icon: ✈
    label:
      en: Star Alliance
      fr: Star Alliance
      es: Star Alliance
      pt: "Star Alliance"
  - icon: 📍
    label:
      en: United States · ORD
      fr: États-Unis · ORD
      es: Estados Unidos · ORD
      pt: "Estados Unidos · ORD"
  - icon: 🗓
    label:
      en: Updated 11 Jul 2026
      fr: Mise à jour le 11 juil. 2026
      es: Actualizado el 11 jul. 2026
      pt: "Atualizado em 11 jul. 2026"
verdict:
  cls: warn
  label:
    en: Moderate
    fr: Modéré
    es: Moderado
    pt: "Moderada"
verdictNote:
  en: Small cats & dogs in the cabin only — checked baggage ended, cargo limited to military.
  fr: Petits chats et chiens en cabine seulement — soute abandonnée, fret réservé aux militaires.
  es: Gatos y perros pequeños solo en cabina; el equipaje facturado se suspendió y la carga se limita a militares.
  pt: "Gatos e cachorros pequenos somente na cabine — bagagem despachada encerrada, carga limitada a militares."
