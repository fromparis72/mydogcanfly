      - cls: "no"
        label:
          en: Cabin & hold
          fr: Cabine & soute
          es: Cabina y bodega
          pt: "Cabine e porão"
    note:
      en: On international flights no pet travels in the cabin or hold. If your dog must fly with you, you'll need a different carrier — the finder shows the alternatives on your route.
      fr: Sur les vols internationaux, aucun animal ne voyage en cabine ni en soute. Si ton chien doit voler avec toi, il faudra une autre compagnie — le moteur affiche les alternatives sur ton trajet.
      es: En vuelos internacionales ninguna mascota viaja en cabina ni en bodega. Si tu perro debe volar contigo, necesitarás otra aerolínea — el buscador muestra las alternativas de tu ruta.
      pt: "Em voos internacionais, nenhum animal viaja na cabine nem no porão. Se seu cachorro precisar voar com você, será necessária outra companhia aérea — o buscador mostra as alternativas na sua rota."
temperature:
  pills:
    - cls: neutral
      label:
        en: "Not applicable"
        fr: "Sans objet"
        es: "No aplicable"
        pt: "Não aplicável"
  note:
    en: With no pet transport on international routes, hold-temperature and seasonal heat-embargo rules don't apply.
    fr: Sans transport d'animaux sur les routes internationales, les limites de température en soute et l'embargo saisonnier ne s'appliquent pas.
    es: Al no haber transporte de mascotas en rutas internacionales, no aplican los límites de temperatura en bodega ni el embargo estacional.
    pt: "Sem transporte de animais nas rotas internacionais, as regras de limite de temperatura no porão e de embargo sazonal por calor não se aplicam."
assistance:
  - icon: ✓
    label:
      en: Service dogs welcome
      fr: Chiens d'assistance admis
      es: Perros de servicio admitidos
      pt: "Cães de serviço bem-vindos"
    value:
      en: Service dogs (guide, hearing, diabetic-alert, mobility, autism), regardless of breed, travel in the cabin free of charge when you fly with Icelandair.
      fr: Les chiens d'assistance (guide, audition, alerte diabétique, mobilité, autisme), quelle que soit la race, voyagent gratuitement en cabine sur Icelandair.
      es: Los perros de servicio (guía, audición, alerta de diabetes, movilidad, autismo), sea cual sea la raza, viajan gratis en cabina con Icelandair.
      pt: "Os cães de serviço (guia, audição, alerta de diabetes, mobilidade, autismo), seja qual for a raça, viajam na cabine gratuitamente com a Icelandair."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: Add a service dog to the booking in advance and provide the documentation Icelandair requires for service animals.
      fr: Ajoute le chien d'assistance à la réservation à l'avance et fournis les documents exigés par Icelandair pour les animaux d'assistance.
      es: Añade el perro de servicio a la reserva con antelación y aporta la documentación que Icelandair exige para los animales de servicio.
      pt: "Adicione o cão de serviço à reserva com antecedência e forneça a documentação exigida pela Icelandair para animais de serviço."
goodToKnow:
  - icon: 🗓️
    label:
      en: Since November 2024
      fr: Depuis novembre 2024
      es: Desde noviembre de 2024
      pt: "Desde novembro de 2024"
    value:
      en: The international hold-pet service ended on 1 November 2024 due to fleet changes; it has not been reinstated.
      fr: Le service animaux en soute international a pris fin le 1er novembre 2024 pour cause de changement de flotte ; il n'a pas été rétabli.
      es: El servicio de mascotas en bodega internacional terminó el 1 de noviembre de 2024 por cambios de flota; no se ha restablecido.
      pt: "O serviço de animais no porão internacional terminou em 1º de novembro de 2024 devido a mudanças de frota; ele não foi restabelecido."
  - icon: 🇮🇸
    label:
      en: Domestic exception
      fr: Exception intérieure
      es: Excepción doméstica
      pt: "Exceção doméstica"
    value:
      en: On domestic routes within Iceland, pets are still accepted in the hold in a crate that meets the applicable requirements.
      fr: Sur les vols intérieurs en Islande, les animaux sont toujours admis en soute dans une caisse conforme à l'IATA.
      es: En rutas domésticas dentro de Islandia, las mascotas se siguen admitiendo en bodega en una jaula conforme a los requisitos aplicables.
      pt: "Nas rotas domésticas dentro da Islândia, os animais continuam sendo aceitos no porão em uma caixa de transporte."
  - icon: 🔎
    label:
      en: Plan an alternative
      fr: Prévoir une alternative
      es: Planifica una alternativa
      pt: "Planeje uma alternativa"
    value:
      en: For an international trip with your dog, compare other carriers on the same route in the flight finder before booking.
      fr: Pour un voyage international avec ton chien, compare d'autres compagnies sur le même trajet dans le moteur de recherche avant de réserver.
      es: Para un viaje internacional con tu perro, compara otras aerolíneas de la misma ruta en el buscador de vuelos antes de reservar.
      pt: "Para uma viagem internacional com seu cachorro, compare outras companhias aéreas na mesma rota no buscador de voos antes de reservar."
