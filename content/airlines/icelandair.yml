verdict:
  cls: "no"
  label:
    en: No pets (international)
    fr: Pas d'animaux (international)
    es: Sin mascotas (internacional)
    pt: "Sem animais (internacional)"
verdictNote:
  en: On international flights Icelandair carries no pets — not in the cabin, and no longer in the hold since 1 November 2024 (fleet change). Only recognised service dogs travel, free, in the cabin. Pets are still allowed in the hold on domestic routes within Iceland.
  fr: Sur les vols internationaux, Icelandair ne transporte aucun animal — ni en cabine, ni en soute depuis le 1er novembre 2024 (changement de flotte). Seuls les chiens d'assistance reconnus voyagent, gratuitement, en cabine. Les animaux restent admis en soute sur les vols intérieurs en Islande.
  es: En vuelos internacionales Icelandair no transporta mascotas — ni en cabina, ni en bodega desde el 1 de noviembre de 2024 (cambio de flota). Solo viajan perros de servicio reconocidos, gratis, en cabina. Las mascotas siguen permitidas en bodega en rutas domésticas dentro de Islandia.
  pt: "Em voos internacionais, a Icelandair não transporta animais — nem na cabine, nem no porão desde 1º de novembro de 2024 (mudança de frota). Somente cães de serviço reconhecidos viajam, gratuitamente, na cabine. Os animais continuam permitidos no porão nas rotas domésticas dentro da Islândia."
