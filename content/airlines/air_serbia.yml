name: Air Serbia
titleH1:
  en: Flying with a dog on Air Serbia
  fr: Voyager avec un chien sur Air Serbia
  es: Volar con un perro en Air Serbia
  pt: "Viajar com um cachorro na Air Serbia"
metaDesc:
  en: "Air Serbia pet policy: 8 kg in the cabin from €40, but the airline publishes no hold program at all — and its own fee table lists a price for a route it bans."
  fr: "Politique animaux Air Serbia : 8 kg en cabine dès 40 €, mais la compagnie ne publie aucun programme soute — et sa propre grille tarifaire affiche un prix pour une route qu'elle interdit."
  es: "Política de mascotas de Air Serbia: 8 kg en cabina desde 40 €, pero la aerolínea no publica ningún programa de bodega — y su propia tabla de tarifas incluye un precio para una ruta que prohíbe."
  pt: "Política de animais da Air Serbia: 8 kg na cabine a partir de 40 €, mas a companhia não publica nenhum programa de porão — e sua própria tabela de tarifas lista um preço para uma rota que proíbe."
