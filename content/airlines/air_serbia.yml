  note:
    en: "Only for Air Serbia flights, non-refundable except when Air Serbia itself cancels. The Middle East/Africa tier includes UAE and Qatar in its own zone name — even though pets are banned outright on those two routes (see restrictions)."
    fr: "Uniquement pour les vols Air Serbia, non remboursable sauf annulation par Air Serbia elle-même. Le palier Moyen-Orient/Afrique inclut dans son propre nom les Émirats et le Qatar — alors même que les animaux y sont totalement interdits sur ces deux routes (voir restrictions)."
    es: "Solo para vuelos de Air Serbia, no reembolsable salvo que la propia Air Serbia cancele. El nivel Oriente Medio/África incluye en su propio nombre a EAU y Catar, aunque las mascotas están totalmente prohibidas en esas dos rutas (ver restricciones)."
    pt: "Somente para voos da Air Serbia, não reembolsável exceto quando a própria Air Serbia cancela. A faixa Oriente Médio/África inclui em seu próprio nome os EAU e o Catar — mesmo que os animais sejam totalmente proibidos nessas duas rotas (ver restrições)."
restrictions:
  - icon: 🐶
    title:
      en: Breed restrictions
      fr: Races restreintes
      es: Razas restringidas
      pt: "Raças restritas"
    pills:
      - cls: neutral
        label:
          en: Not published
          fr: Non publié
          es: No publicado
          pt: "Não publicado"
    note:
      en: "No brachycephalic or dangerous-breed list exists anywhere on airserbia.com. The only breed-adjacent clause is behavioral: \"the pet must not be dangerous, aggressive or have an unpleasant smell.\""
      fr: "Aucune liste de races brachycéphales ou dangereuses n'existe sur airserbia.com. La seule clause proche d'une race est comportementale : « l'animal ne doit pas être dangereux, agressif ni avoir une odeur désagréable »."
      es: "No existe ninguna lista de razas braquicéfalas o peligrosas en airserbia.com. La única cláusula cercana a una raza es de comportamiento: “la mascota no debe ser peligrosa, agresiva ni tener un olor desagradable”."
      pt: "Não existe nenhuma lista de raças braquicefálicas ou perigosas em airserbia.com. A única cláusula próxima de raça é comportamental: “o animal não deve ser perigoso, agressivo ou ter cheiro desagradável”."
  - icon: 🌍
    title:
      en: Route ban
      fr: Interdiction de route
      es: Prohibición de ruta
      pt: "Proibição de rota"
    pills:
      - cls: "no"
        label:
          en: No pets to/from UK, UAE, Qatar
          fr: Pas d'animaux vers/depuis UK, Émirats, Qatar
          es: Sin mascotas hacia/desde Reino Unido, EAU, Catar
          pt: "Sem animais para/do Reino Unido, EAU, Catar"
    note:
      en: "\"Air Serbia does not transport pets on flights to or from the United Kingdom, the United Arab Emirates or Qatar\" — stated in the same body text as the fare table that lists a Middle East/Africa price bracket covering two of those three countries."
      fr: "« Air Serbia ne transporte pas d'animaux sur les vols vers ou depuis le Royaume-Uni, les Émirats arabes unis ou le Qatar » — énoncé dans le même texte que la grille tarifaire qui liste un palier Moyen-Orient/Afrique couvrant deux de ces trois pays."
      es: "“Air Serbia no transporta mascotas en vuelos hacia o desde el Reino Unido, los Emiratos Árabes Unidos o Catar”, indicado en el mismo texto que la tabla de tarifas que incluye un nivel Oriente Medio/África que cubre dos de esos tres países."
      pt: "“A Air Serbia não transporta animais em voos para ou do Reino Unido, Emirados Árabes Unidos ou Catar” — declarado no mesmo texto da tabela de tarifas que lista uma faixa Oriente Médio/África cobrindo dois desses três países."
temperature:
  pills:
    - cls: warn
      label:
        en: "Temperature limits: not disclosed"
        fr: "Limites de température : non communiqué"
        es: "Límites de temperatura: no comunicado"
        pt: "Limites de temperatura: não divulgados"
  note:
    en: No temperature restriction or seasonal embargo is published anywhere — consistent with the absence of a hold program.
    fr: Aucune restriction de température ni embargo saisonnier n'est publié — cohérent avec l'absence de programme soute.
    es: "No se publica ninguna restricción de temperatura ni embargo estacional, algo coherente con la ausencia de un programa de bodega."
    pt: "Nenhuma restrição de temperatura ou embargo sazonal é publicado — coerente com a ausência de um programa de porão."
assistance:
  - icon: ❓
    label:
      en: Assistance dogs
      fr: Chiens d'assistance
      es: Perros de asistencia
      pt: "Cães de assistência"
    value:
      en: "A trained guide dog travels free of charge for visually or hearing-impaired passengers, subject to Air Serbia's approval — notify at booking or at least 48 h ahead, with breed and weight details. The legal Conditions of Carriage also reference \"search and rescue dogs\" and \"emotional support animals\" as distinct categories, but neither is explained, priced or documented on any consumer-facing page."
      fr: "Un chien guide entraîné voyage gratuitement pour les passagers malvoyants ou malentendants, sous réserve d'accord d'Air Serbia — à signaler à la réservation ou au moins 48 h avant, avec race et poids. Les conditions générales légales mentionnent aussi des « chiens de recherche et de sauvetage » et des « animaux de soutien émotionnel » comme catégories distinctes, mais aucune n'est expliquée, tarifée ou documentée sur une page destinée au grand public."
      es: "Un perro guía entrenado viaja gratis para pasajeros con discapacidad visual o auditiva, sujeto a la aprobación de Air Serbia — hay que avisar al reservar o al menos 48 h antes, indicando raza y peso. Las condiciones legales de transporte también mencionan “perros de búsqueda y rescate” y “animales de apoyo emocional” como categorías distintas, pero ninguna se explica, tarifica o documenta en ninguna página orientada al público."
      pt: "Um cão-guia treinado viaja de graça para passageiros com deficiência visual ou auditiva, sujeito à aprovação da Air Serbia — avise no momento da reserva ou com pelo menos 48 h de antecedência, informando raça e peso. As condições legais de transporte também mencionam “cães de busca e resgate” e “animais de apoio emocional” como categorias distintas, mas nenhuma é explicada, precificada ou documentada em qualquer página voltada ao público."
goodToKnow:
  - icon: ⚠️
    label:
      en: A price listed for a banned route
      fr: Un tarif affiché pour une route interdite
      es: Una tarifa indicada para una ruta prohibida
      pt: "Uma tarifa listada para uma rota proibida"
    value:
      en: "The fee table's \"Serbia–Middle East/Africa: €80\" tier isn't carved out from the outright UAE/Qatar ban stated elsewhere on the same page — a reader skimming only the price table could reasonably think pet travel to Dubai or Doha is a paid option."
      fr: "Le palier « Serbie–Moyen-Orient/Afrique : 80 € » de la grille tarifaire n'exclut pas explicitement l'interdiction totale vers les Émirats/Qatar énoncée ailleurs sur la même page — un lecteur ne consultant que la grille des prix pourrait raisonnablement croire qu'un animal peut voyager à Dubaï ou Doha moyennant paiement."
      es: "El nivel “Serbia–Oriente Medio/África: 80 €” de la tabla de tarifas no excluye la prohibición total hacia EAU/Catar indicada en otra parte de la misma página: un lector que solo mire la tabla de precios podría pensar razonablemente que viajar con una mascota a Dubái o Doha es una opción de pago."
      pt: "A faixa “Sérvia–Oriente Médio/África: 80 €” da tabela de tarifas não exclui explicitamente a proibição total para EAU/Catar declarada em outro ponto da mesma página — um leitor que veja apenas a tabela de preços poderia razoavelmente pensar que viajar com um animal para Dubai ou Doha é uma opção paga."
  - icon: 📅
    label:
      en: A five-year-old blog post still linked as guidance
      fr: Un article de blog vieux de cinq ans encore proposé comme référence
      es: Una entrada de blog de hace cinco años todavía enlazada como guía
      pt: "Um post de blog de cinco anos ainda vinculado como orientação"
    value:
      en: The current policy page links out, under "Travel Smart," to a blog post dated 2 October 2020 as if it were live guidance. Its numbers still match the current page, but presenting five-year-old content as current practice is worth a second look before you fly.
      fr: La page de politique actuelle renvoie, sous « Voyage malin », vers un article de blog daté du 2 octobre 2020, présenté comme une référence active. Ses chiffres correspondent encore à la page actuelle, mais présenter un contenu vieux de cinq ans comme une pratique en vigueur mérite d'être vérifié avant de voler.
      es: "La página de política actual enlaza, bajo “Viaja con inteligencia”, a una entrada de blog fechada el 2 de octubre de 2020 como si fuera una guía vigente. Sus cifras aún coinciden con la página actual, pero presentar contenido de hace cinco años como práctica vigente merece una segunda mirada antes de volar."
      pt: "A página de política atual encaminha, em “Viaje com inteligência”, para um post de blog datado de 2 de outubro de 2020, apresentado como orientação vigente. Os números ainda batem com a página atual, mas apresentar conteúdo de cinco anos como prática vigente merece uma segunda checagem antes de voar."
