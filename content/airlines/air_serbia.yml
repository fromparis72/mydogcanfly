    es: Solo cabina
    pt: "Somente cabine"
verdictNote:
  en: Air Serbia's cabin program is detailed and reasonably priced, but there is no published hold or cargo option for an accompanying pet — a bigger dog effectively has no route with this airline as a solo option.
  fr: Le programme cabine d'Air Serbia est détaillé et à prix raisonnable, mais aucune option soute ni fret n'est publiée pour un animal accompagnant son propriétaire — un chien plus grand n'a en pratique aucune solution avec cette compagnie seule.
  es: "El programa de cabina de Air Serbia está bien detallado y tiene un precio razonable, pero no se publica ninguna opción de bodega ni de carga para una mascota que acompañe a su dueño: un perro más grande no tiene, en la práctica, ninguna opción con esta aerolínea por sí sola."
  pt: "O programa de cabine da Air Serbia é detalhado e com preço razoável, mas não há opção publicada de porão ou carga para um animal que acompanhe o dono — um cachorro maior, na prática, não tem opção com esta companhia sozinha."
