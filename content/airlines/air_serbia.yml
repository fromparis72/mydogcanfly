    availability: not_offered
channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: 8 kg (carrier + animal), soft carrier up to 40 × 30 × 24 cm (sum of dimensions 94 cm), net cover for ventilation, kept at your feet for the whole flight. One carrier per passenger, at least 12 weeks old. Two littermates may share a carrier. Not offered on flights to or from the UK, UAE or Qatar. Cannot be booked online — call the Contact Centre or a branch/agency. Check-in at the airport only, 2 h before departure.
      fr: 8 kg (caisse + animal), caisse souple jusqu'à 40 × 30 × 24 cm (somme des dimensions 94 cm), filet de ventilation, gardée aux pieds pendant tout le vol. Une caisse par passager, à partir de 12 semaines. Deux animaux de la même portée peuvent partager une caisse. Non proposé sur les vols vers ou depuis le UK, les Émirats ou le Qatar. Ne se réserve pas en ligne — appeler le centre de contact ou une agence. Enregistrement à l'aéroport uniquement, 2 h avant le départ.
      es: "8 kg (jaula + animal), jaula blanda de hasta 40 × 30 × 24 cm (suma de dimensiones 94 cm), con red de ventilación, a tus pies durante todo el vuelo. Una jaula por pasajero, a partir de 12 semanas. Dos crías de la misma camada pueden compartir jaula. No disponible en vuelos hacia o desde el Reino Unido, EAU o Catar. No se puede reservar en línea: hay que llamar al centro de contacto o a una agencia. Facturación solo en el aeropuerto, 2 h antes de la salida."
      pt: "8 kg (caixa + animal), caixa maleável de até 40 × 30 × 24 cm (soma das dimensões 94 cm), com tela de ventilação, mantida aos seus pés durante todo o voo. Uma caixa por passageiro, a partir de 12 semanas. Dois filhotes da mesma ninhada podem dividir uma caixa. Não disponível em voos para ou do Reino Unido, EAU ou Catar. Não pode ser reservado on-line — ligue para a central de atendimento ou uma agência. Check-in somente no aeroporto, 2 h antes da partida."
    fee:
      en: "€40–130 depending on zone (see fare list)"
      fr: "40–130 € selon la zone (voir la grille tarifaire)"
      es: "40–130 € según la zona (ver la lista de tarifas)"
      pt: "40–130 € dependendo da zona (ver a lista de tarifas)"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: "no"
    statusLabel:
      en: Not published
      fr: Non publié
      es: No publicado
      pt: "Não publicado"
    detail:
      en: "Air Serbia publishes no weight limits, crate-size bands or dedicated fee for hold travel. The only related text is a legal boilerplate line in the Conditions of Carriage: an animal checked as baggage is excess baggage, billed at the applicable rate — with no rate ever given."
      fr: "Air Serbia ne publie aucune limite de poids, gabarit de caisse ou tarif dédié pour la soute. Le seul texte disponible est une clause générique des conditions de transport : un animal enregistré comme bagage est un excédent de bagage, facturé au tarif applicable — sans que ce tarif soit jamais précisé."
      es: "Air Serbia no publica límites de peso, formatos de jaula ni una tarifa dedicada para la bodega. El único texto relacionado es una cláusula genérica de las condiciones de transporte: un animal facturado como equipaje es exceso de equipaje, cobrado a la tarifa aplicable, sin que esa tarifa se especifique nunca."
      pt: "A Air Serbia não publica limites de peso, formatos de caixa ou uma tarifa dedicada para o porão. O único texto relacionado é uma cláusula genérica das condições de transporte: um animal despachado como bagagem é excesso de bagagem, cobrado pela tarifa aplicável — sem que essa tarifa seja informada."
    fee:
      en: Not published
      fr: Non publié
      es: No publicado
      pt: "Não publicado"
  - placement: cargo
    icon: ✈️
    name:
      en: Cargo
      fr: Fret
      es: Carga
      pt: "Carga"
    cls: "no"
    statusLabel:
      en: Not published
      fr: Non publié
      es: No publicado
      pt: "Não publicado"
    detail:
      en: The tariff document references a "Rule 75 — Acceptance of animals" section, but its full text isn't accessible on the public site, and no standalone unaccompanied-cargo pet page exists.
      fr: Le document tarifaire mentionne une section « Règle 75 — Acceptation des animaux », mais son texte complet n'est pas accessible sur le site public, et aucune page fret non accompagné dédiée aux animaux n'existe.
      es: "El documento de tarifas menciona una sección “Norma 75 — Aceptación de animales”, pero su texto completo no es accesible en el sitio público, y no existe ninguna página independiente de carga no acompañada para mascotas."
      pt: "O documento tarifário menciona uma seção “Regra 75 — Aceitação de animais”, mas seu texto completo não está acessível no site público, e não existe página independente de carga não acompanhada para animais."
    fee:
      en: Not published
      fr: Non publié
      es: No publicado
      pt: "Não publicado"
