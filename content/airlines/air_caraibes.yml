    pt: "EUR por viagem, não reembolsável. Pago no balcão no dia da partida."
restrictions:
  - icon: 🐶
    title:
      en: Flat-faced breeds
      fr: Races brachycéphales
      es: Razas de hocico chato
      pt: "Raças de focinho achatado"
    pills:
      - cls: ok
        label:
          en: Cabin only
          fr: Cabine uniquement
          es: Solo cabina
          pt: "Somente cabine"
      - cls: no
        label:
          en: Hold/FRET forbidden
          fr: Soute/FRET interdits
          es: Bodega/FRET prohibidos
          pt: "Porão/FRET proibidos"
    note:
      en: "On transatlantic flights, all snub-nosed dogs & cats are barred from the hold and FRET — cabin only: boxers, bulldogs, pugs, Cane Corso, chow chow, mastiffs, Shih Tzu, Shar Pei, Staffordshire, American Bully, and Burmese/Exotic/Himalayan/Persian cats."
      fr: "Sur les vols transatlantiques, tous les chiens et chats au nez écrasé sont interdits en soute et en FRET — cabine uniquement : boxers, bouledogues, carlins, Cane Corso, chow chow, mastiffs, Shih Tzu, Shar Pei, Staffordshire, American Bully, et chats birmans/exotiques/himalayens/persans."
      es: "En los vuelos transatlánticos, todos los perros y gatos de hocico chato están vetados de la bodega y de FRET — solo cabina: boxers, bulldogs, carlinos, Cane Corso, chow chow, mastines, Shih Tzu, Shar Pei, Staffordshire, American Bully y gatos birmanos/exóticos/himalayos/persas."
      pt: "Em voos transatlânticos, todos os cachorros e gatos de focinho achatado são proibidos no porão e na FRET — somente cabine: boxers, bulldogues, pugs, Cane Corso, chow chow, mastiffs, Shih Tzu, Shar Pei, Staffordshire, American Bully, e gatos burmeses/exóticos/himalaios/persas."
  - icon: 🚫
    title:
      en: French categories 1 & 2
      fr: Catégories françaises 1 & 2
      es: Categorías francesas 1 y 2
      pt: "Categorias francesas 1 e 2"
    pills:
      - cls: no
        label:
          en: Category 1 banned
          fr: Catégorie 1 interdite
          es: Categoría 1 prohibida
          pt: "Categoria 1 proibida"
      - cls: warn
        label:
          en: Category 2 conditions
          fr: Catégorie 2 sous conditions
          es: Categoría 2 con condiciones
          pt: "Condições da categoria 2"
    note:
      en: "French category 1 dogs (non-LOF pit-bull/Boerbull/Tosa) are import-banned. Category 2 (Staffordshire, American Staffordshire, Rottweiler, Tosa): owner only, muzzled and leashed, with a per-trip fee. Sedation not advised; no under-8-week or in-heat animals."
      fr: "Les chiens de catégorie 1 (pit-bull/Boerbull/Tosa non-LOF) sont interdits d'importation. Catégorie 2 (Staffordshire, American Staffordshire, Rottweiler, Tosa) : propriétaire seul, muselé et en laisse, avec des frais par trajet. Sédation déconseillée ; pas d'animaux de moins de 8 semaines ni en chaleur."
      es: "Los perros de categoría 1 en Francia (pit bull/Boerbull/Tosa sin LOF) tienen prohibida la importación. Categoría 2 (Staffordshire, American Staffordshire, Rottweiler, Tosa): solo el dueño, con bozal y correa, con una tasa por trayecto. Sedación desaconsejada; sin animales de menos de 8 semanas ni en celo."
      pt: "Os cachorros de categoria francesa 1 (pit bull/Boerbull/Tosa sem registro LOF) têm importação proibida. Categoria 2 (Staffordshire, American Staffordshire, Rottweiler, Tosa): somente o dono, com focinheira e coleira, com uma taxa por viagem. Sedação não recomendada; sem animais com menos de 8 semanas ou em cio."
temperature:
  pills:
    - cls: warn
      label:
        en: "Temperature limits: not disclosed"
        fr: "Limites de température : non communiqué"
        es: "Límites de temperatura: no comunicado"
        pt: "Limites de temperatura: não divulgados"
  note:
    en: Air Caraïbes publishes no hold-temperature limits or seasonal embargo on its pet pages.
    fr: Air Caraïbes ne publie pas de limites de température en soute ni d'embargo saisonnier sur ses pages animaux.
    es: Air Caraïbes no publica límites de temperatura en bodega ni embargo estacional en sus páginas de mascotas.
    pt: "A Air Caraïbes não publica limites de temperatura no porão nem embargo sazonal em suas páginas sobre animais."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: Dogs for blind or hearing-impaired passengers travel free in the cabin (medical certificate required).
      fr: Les chiens pour passagers aveugles ou malentendants voyagent gratuitement en cabine (certificat médical requis).
      es: Los perros para pasajeros ciegos o con discapacidad auditiva viajan gratis en cabina (se requiere certificado médico).
      pt: "Cães para passageiros com deficiência visual ou auditiva viajam grátis na cabine (atestado médico exigido)."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: "Emotional-support animals may be refused. Category-2 dogs: email documents to transportspeciaux@aircaraibes.com."
      fr: "Les animaux de soutien émotionnel peuvent être refusés. Chiens de catégorie 2 : envoyer les documents à transportspeciaux@aircaraibes.com."
      es: "Los animales de apoyo emocional pueden ser rechazados. Perros de categoría 2: envía los documentos por correo a transportspeciaux@aircaraibes.com."
      pt: "Animais de apoio emocional podem ser recusados. Cachorros de categoria 2: envie os documentos por e-mail para transportspeciaux@aircaraibes.com."
goodToKnow:
  - icon: 📄
    label:
      en: Declare at booking
      fr: Déclarer à la réservation
      es: Declarar al reservar
      pt: "Declarar na reserva"
    value:
      en: The pet must be declared at booking and authorised (flight quotas apply).
      fr: L'animal doit être déclaré à la réservation et autorisé (quotas par vol).
      es: La mascota debe declararse al reservar y ser autorizada (se aplican cupos por vuelo).
      pt: "O animal deve ser declarado no momento da reserva e autorizado (aplicam-se cotas por voo)."
  - icon: 💶
    label:
      en: Pay at the airport
      fr: Paiement à l'aéroport
      es: Pago en el aeropuerto
      pt: "Pagar no aeroporto"
    value:
      en: Payment is made on the day of departure at the airline counter.
      fr: Le paiement se fait le jour du départ au comptoir de la compagnie.
      es: El pago se realiza el día de la salida en el mostrador de la aerolínea.
      pt: "O pagamento é feito no dia da partida, no balcão da companhia."
  - icon: 🐾
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: Microchip ID + valid rabies certificate required at check-in for animals from certain territories.
      fr: Puce d'identification + certificat de rage valide requis à l'enregistrement pour les animaux de certains territoires.
      es: Microchip de identificación + certificado de rabia válido requeridos en la facturación para animales de ciertos territorios.
      pt: "Microchip de identificação + certificado antirrábico válido exigidos no check-in para animais vindos de determinados territórios."
