name: Air Caraïbes
titleH1:
  en: Flying with a dog on Air Caraïbes
  fr: Voyager avec un chien sur Air Caraïbes
  es: Volar con un perro en Air Caraïbes
  pt: "Viajar com um cachorro na Air Caraïbes"
metaDesc:
  en: "Air Caraïbes pet policy: cabin, hold and freight, fares, snub-nosed hold ban, French category dogs and official sources."
  fr: "Politique animaux Air Caraïbes : cabine, soute et fret, tarifs, interdiction soute brachy, chiens catégorisés et sources officielles."
  es: "Política de mascotas de Air Caraïbes: cabina, bodega y carga, tarifas, prohibición de bodega para hocico chato, perros categorizados en Francia y fuentes oficiales."
  pt: "Política de animais da Air Caraïbes: cabine, porão e carga, tarifas, proibição de porão para raças de focinho achatado, cachorros de categoria francesa e fontes."
