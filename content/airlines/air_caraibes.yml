    pt: "Moderada"
verdictNote:
  en: Small pets in the cabin, larger dogs in the hold on Paris–Caribbean — snub-nosed breeds cabin-only.
  fr: Petits animaux en cabine, plus grands en soute sur Paris–Antilles — races au nez écrasé en cabine seulement.
  es: Mascotas pequeñas en cabina, perros más grandes en bodega en París–Caribe — las razas de hocico chato solo en cabina.
  pt: "Animais pequenos na cabine, cachorros maiores no porão nas rotas Paris–Caribe — raças de focinho achatado somente na cabine."
