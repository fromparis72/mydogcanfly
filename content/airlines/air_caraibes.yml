policies:
  cabin:
    availability: offered
  hold:
    availability: offered
  cargo:
    review_state: legacy_unreviewed
channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Dogs, cats & small rodents ≤ 8 kg incl. carrier (transatlantic) in a soft bag under the seat (max 43 × 35 × 20 cm). Snub-nosed allowed here.
      fr: Chiens, chats et petits rongeurs ≤ 8 kg avec le sac (transatlantique) dans un sac souple sous le siège (max 43 × 35 × 20 cm). Nez écrasé admis ici.
      es: Perros, gatos y roedores pequeños ≤ 8 kg incluida la jaula (transatlántico) en una bolsa blanda bajo el asiento (máx 43 × 35 × 20 cm). Aquí se admiten los de hocico chato.
      pt: "Cachorros, gatos e pequenos roedores ≤ 8 kg com a bolsa incluída (rotas transatlânticas), em uma bolsa flexível sob o assento (máx. 43 × 35 × 20 cm). Raças de focinho achatado permitidas aqui."
    fee:
      en: €10–75
      fr: 10–75 €
      es: 10–75 €
      pt: "10–75 €"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Dogs & cats only (AVIH) up to 75 kg incl. cage (transatlantic) in a rigid travel crate. Two pets ≤ 14 kg each may share.
      fr: Chiens et chats uniquement (AVIH) jusqu'à 75 kg avec la caisse (transatlantique) en caisse de transport rigide. Deux animaux ≤ 14 kg chacun peuvent partager.
      es: Solo perros y gatos (AVIH) hasta 75 kg incluida la jaula (transatlántico) en una jaula rígida de transporte. Dos mascotas de ≤ 14 kg cada una pueden compartir.
      pt: "Somente cachorros e gatos (AVIH) até 75 kg com a caixa incluída (rotas transatlânticas), em uma caixa de transporte rígida. Dois animais ≤ 14 kg cada podem compartilhar a mesma caixa."
    fee:
      en: €20–150
      fr: 20–150 €
      es: 20–150 €
      pt: "20–150 €"
  - placement: cargo
    icon: ✈️
    name:
      en: FRET
      fr: FRET
      es: FRET
      pt: "FRET"
    cls: warn
    statusLabel:
      en: Via freight
      fr: Via fret
      es: Vía carga
      pt: "Via carga"
    detail:
      en: Other species, oversize, and snub-nosed dogs/cats (barred from hold & FRET on transatlantic).
      fr: Autres espèces, hors gabarit, et chiens/chats au nez écrasé (interdits en soute & FRET sur le transatlantique).
      es: Otras especies, fuera de medidas, y perros/gatos de hocico chato (vetados de bodega y FRET en el transatlántico).
      pt: "Outras espécies, fora do tamanho, e cachorros/gatos de focinho achatado (proibidos no porão e na FRET nas rotas transatlânticas)."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
