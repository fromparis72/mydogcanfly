titleH1:
  en: Flying with a dog on Air Europa
  fr: Voyager avec un chien sur Air Europa
  es: Volar con un perro en Air Europa
  pt: "Viajar com um cachorro na Air Europa"
metaDesc:
  en: "Air Europa pet policy: cabin, hold and cargo, fares by zone, Madrid summer embargo, UK exclusion and official sources."
  fr: "Politique animaux Air Europa : cabine, soute et fret, tarifs par zone, embargo estival Madrid, exclusion R.-U. et sources officielles."
  es: "Política de mascotas de Air Europa: cabina, bodega y carga, tarifas por zona, embargo estival en Madrid, exclusión del Reino Unido y fuentes oficiales."
  pt: "Política de animais da Air Europa: cabine, porão e carga, tarifas por zona, embargo de verão em Madri, exclusão do Reino Unido e fontes oficiais."
