policies:
  cabin:
    availability: offered
  hold:
    availability: offered
  cargo:
    review_state: legacy_unreviewed
channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Dogs & cats only (pet ≤ 8 kg, pet + carrier ≤ 10 kg) in a soft carrier under the seat (max 40 × 30 × 30 cm). Not in Business.
      fr: Chiens et chats uniquement (animal ≤ 8 kg, animal + sac ≤ 10 kg) dans un sac souple sous le siège (max 40 × 30 × 30 cm). Pas en Business.
      es: Solo perros y gatos (mascota ≤ 8 kg, mascota + jaula ≤ 10 kg) en una jaula blanda bajo el asiento (máx 40 × 30 × 30 cm). No en Business.
      pt: "Somente cachorros e gatos (animal ≤ 8 kg, animal + bolsa ≤ 10 kg) em uma bolsa de transporte flexível sob o assento (máx. 40 × 30 × 30 cm). Não disponível na Business."
    fee:
      en: €35–175
      fr: 35–175 €
      es: 35–175 €
      pt: "35–175 €"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Cats & dogs (pet + kennel ≤ 50 kg) in a rigid kennel with a metal door; two similar pets ≤ 14 kg each may share.
      fr: Chats et chiens (animal + caisse ≤ 50 kg) en caisse de transport rigide à porte métallique ; deux animaux similaires ≤ 14 kg chacun peuvent partager.
      es: Gatos y perros (mascota + jaula ≤ 50 kg) en una jaula rígida de transporte con puerta metálica; dos mascotas similares de ≤ 14 kg cada una pueden compartir.
      pt: "Gatos e cachorros (animal + caixa ≤ 50 kg) em uma caixa de transporte rígida com porta de metal; dois animais semelhantes ≤ 14 kg cada podem compartilhar a mesma caixa."
    fee:
      en: €90–350
      fr: 90–350 €
      es: 90–350 €
      pt: "90–350 €"
  - placement: cargo
    icon: ✈️
    name:
      en: Air Europa Cargo
      fr: Air Europa Cargo
      es: Air Europa Cargo
      pt: "Air Europa Cargo"
    cls: warn
    statusLabel:
      en: Via cargo
      fr: Via fret
      es: Vía carga
      pt: "Via carga"
    detail:
      en: Other species, more than 5 pets, and all pets to/from the UK.
      fr: Autres espèces, plus de 5 animaux, et tous les animaux de/vers le R.-U.
      es: Otras especies, más de 5 mascotas y todas las mascotas hacia/desde el Reino Unido.
      pt: "Outras espécies, mais de 5 animais, e todos os animais de/para o Reino Unido."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
