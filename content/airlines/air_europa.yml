verdict:
  cls: warn
  label:
    en: Moderate
    fr: Modéré
    es: Moderado
    pt: "Moderada"
verdictNote:
  en: Cats & dogs in the cabin or hold on most routes — but a Madrid summer connection embargo and no pets to the UK.
  fr: Chats et chiens en cabine ou en soute sur la plupart des routes — mais un embargo estival en correspondance à Madrid et rien vers le R.-U.
  es: Gatos y perros en cabina o bodega en la mayoría de las rutas — pero un embargo estival para conexiones en Madrid y nada de mascotas al Reino Unido.
  pt: "Gatos e cachorros na cabine ou no porão na maioria das rotas — mas com embargo de verão nas conexões em Madri e sem animais para o Reino Unido."
