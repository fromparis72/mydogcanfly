id: airline_copa
mono: CM
name: Copa Airlines
titleH1:
  en: Flying with a dog on Copa Airlines
  fr: Voyager avec un chien sur Copa Airlines
  es: Viajar con perro en Copa Airlines
  pt: "Voar com um cachorro na Copa Airlines"
metaDesc:
  en: "Copa Airlines pet policy: cabin-only pets, Copa Pets cargo for larger dogs, fares, restrictions and official sources."
  fr: "Politique animaux Copa Airlines : animaux en cabine, fret Copa Pets pour grands chiens, tarifs, restrictions et sources officielles."
  es: "Política de mascotas de Copa Airlines: mascotas solo en cabina, carga Copa Pets para perros más grandes, tarifas, restricciones y fuentes oficiales."
  pt: "Política de animais da Copa Airlines: animais somente na cabine, carga Copa Pets para cachorros maiores, tarifas, restrições e fontes oficiais."
chips:
  - icon: ✈
    label:
      en: Star Alliance
      fr: Star Alliance
      es: Star Alliance
      pt: "Star Alliance"
  - icon: 📍
    label:
      en: Panama · PTY
      fr: Panama · PTY
      es: Panamá · PTY
      pt: "Panamá · PTY"
  - icon: 🗓
    label:
      en: Updated 11 Jul 2026
      fr: Mise à jour le 11 juil. 2026
      es: Actualizado el 11 jul 2026
      pt: "Atualizado em 11 jul. 2026"
verdict:
  cls: warn
  label:
    en: Moderate
    fr: Modéré
    es: Moderado
    pt: "Moderada"
verdictNote:
  en: Small dogs & cats in the cabin only on international routes — larger pets go via the separate Copa Pets cargo service.
  fr: Petits chiens et chats en cabine seulement sur les vols internationaux — les grands animaux passent par le service fret Copa Pets.
  es: Perros y gatos pequeños solo en cabina en vuelos internacionales; las mascotas más grandes van por el servicio de carga aparte Copa Pets.
  pt: "Cachorros e gatos pequenos somente na cabine em voos internacionais — os animais maiores vão pelo serviço de carga separado Copa Pets."
