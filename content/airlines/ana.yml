id: airline_ana
mono: NH
name: ANA (All Nippon Airways)
titleH1:
  en: Flying with a dog on ANA
  fr: Voyager avec un chien sur ANA
  es: Viajar con perro en ANA
  pt: "Viajar com um cachorro pela ANA"
metaDesc:
  en: "ANA pet policy: hold-only carriage, summer snub-nosed embargo, fares, restrictions and official sources."
  fr: "Politique animaux ANA : transport en soute uniquement, embargo brachy l'été, tarifs, restrictions et sources officielles."
  es: "Política de mascotas de ANA: transporte solo en bodega, embargo de razas de hocico chato en verano, tarifas, restricciones y fuentes oficiales."
  pt: "Política de animais da ANA: transporte somente no porão, embargo de verão para raças de focinho achatado, tarifas, restrições e fontes oficiais."
