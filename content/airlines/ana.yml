verdict:
  cls: no
  label:
    en: Hard
    fr: Difficile
    es: Difícil
    pt: "Difícil"
verdictNote:
  en: Pets travel only in the hold (no cabin), phone booking only, with a summer snub-nosed embargo.
  fr: Les animaux ne voyagent qu'en soute (pas de cabine), réservation par téléphone, avec un embargo brachy l'été.
  es: Las mascotas viajan solo en bodega (sin cabina), reserva únicamente por teléfono, con un embargo de razas de hocico chato en verano.
  pt: "Os animais viajam somente no porão (sem cabine), reserva apenas por telefone, com embargo de verão para raças de focinho achatado."
