id: airline_lot
mono: LO
name: LOT Polish Airlines
titleH1:
  en: Flying with a dog on LOT Polish Airlines
  fr: Voyager avec un chien sur LOT Polish Airlines
  es: Viajar con un perro en LOT Polish Airlines
  pt: "Viajar com um cachorro na LOT Polish Airlines"
metaDesc:
  en: "LOT Polish Airlines pet policy: cabin, hold and cargo, fares by zone, snub-nosed hold ban, UK/UAE exclusion and official sources."
  fr: "Politique animaux LOT Polish Airlines : cabine, soute et fret, tarifs par zone, interdiction soute brachy, exclusion R.-U./ÉAU et sources officielles."
  es: "Política de mascotas de LOT Polish Airlines: cabina, bodega y carga, tarifas por zona, veto en bodega a razas de hocico chato, exclusión Reino Unido/EAU y fuentes…"
  pt: "Política de animais da LOT Polish Airlines: cabine, porão e carga, tarifas por zona, proibição de porão para focinho achatado, exclusão de Reino Unido/EAU e fontes."
chips:
  - icon: ✈
    label:
      en: Star Alliance
      fr: Star Alliance
      es: Star Alliance
      pt: "Star Alliance"
  - icon: 📍
    label:
      en: Poland · WAW
      fr: Pologne · WAW
      es: Polonia · WAW
      pt: "Polônia · WAW"
  - icon: 🗓
    label:
      en: Updated 11 Jul 2026
      fr: Mise à jour le 11 juil. 2026
      es: Actualizado el 11 jul. 2026
      pt: "Atualizado em 11 jul. 2026"
verdict:
  cls: warn
  label:
    en: Moderate
    fr: Modéré
    es: Moderado
    pt: "Moderada"
verdictNote:
  en: Cats, dogs & ferrets in the cabin or hold — but snub-nosed breeds barred from the hold and no pets to the UK/UAE.
  fr: Chats, chiens et furets en cabine ou en soute — mais races au nez écrasé interdites en soute et rien vers le R.-U./ÉAU.
  es: Gatos, perros y hurones en cabina o bodega, pero las razas de hocico chato no pueden viajar en bodega y no se admiten mascotas hacia el Reino Unido/EAU.
  pt: "Gatos, cachorros e furões na cabine ou no porão — mas raças de focinho achatado são proibidas no porão e nenhum animal para Reino Unido/EAU."
