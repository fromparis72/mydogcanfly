  note:
    en: USD (or local currency at origin), one-way per segment.
    fr: USD (ou monnaie locale à l'origine), aller simple par tronçon.
    es: USD (o moneda local en el origen), por trayecto de ida y por tramo.
    pt: "USD (ou moeda local na origem), ida por trecho."
restrictions:
  - icon: 🐶
    title:
      en: Flat-faced breeds
      fr: Races brachycéphales
      es: Razas de hocico chato
      pt: "Raças de focinho achatado"
    pills:
      - cls: ok
        label:
          en: Cabin only
          fr: Cabine uniquement
          es: Solo cabina
          pt: "Somente cabine"
      - cls: no
        label:
          en: Hold forbidden
          fr: Soute interdite
          es: Bodega prohibida
          pt: "Porão proibido"
    note:
      en: "Snub-nosed dogs & cats and crosses travel only in the cabin (barred from the hold), with a signed pet form: Shar Pei, boxer, Dogue de Bordeaux, bulldogs, Brussels Griffon, Boston terrier, King Charles/Cavalier, Pekingese, pug, and Burmese/Persian/Exotic/Himalayan cats."
      fr: "Chiens et chats au nez écrasé et croisés ne voyagent qu'en cabine (interdits en soute), avec un formulaire animal signé : Shar Pei, boxer, Dogue de Bordeaux, bouledogues, Griffon bruxellois, Boston terrier, King Charles/Cavalier, pékinois, carlin, et chats birmans/persans/exotiques/himalayens."
      es: "Los perros y gatos de hocico chato y sus cruces viajan solo en cabina (vetados en bodega), con un formulario de mascota firmado: Shar Pei, bóxer, Dogo de Burdeos, bulldogs, Grifón de Bruselas, Boston terrier, King Charles/Cavalier, pequinés, carlino, y gatos birmanos/persas/exóticos/himalayos."
      pt: "Cachorros e gatos de focinho achatado e seus cruzamentos viajam somente na cabine (vetados no porão), com um formulário de animal assinado: Shar Pei, boxer, Dogue de Bordeaux, buldogues, Grifon de Bruxelas, Boston Terrier, King Charles/Cavalier, pequinês, pug, e gatos birmaneses/persas/exóticos/himalaios."
  - icon: 🚫
    title:
      en: Dangerous breeds
      fr: Races dangereuses
      es: Razas peligrosas
      pt: "Raças perigosas"
    pills:
      - cls: no
        label:
          en: Hold, metal crate
          fr: Soute, caisse métal
          es: Bodega, jaula metálica
          pt: "Porão, caixa de metal"
      - cls: warn
        label:
          en: Colombia import ban
          fr: Import interdit Colombie
          es: Importación vetada a Colombia
          pt: "Importação proibida na Colômbia"
    note:
      en: "'Dangerous' breeds (pit bull, Rottweiler, Doberman, Presa Canario, Dogo Argentino, mastiffs, Fila, Bull Terrier, American Staffordshire, Tosa) travel only in the hold in a metal-walled crate; pit-bull types are import-banned into Colombia."
      fr: Races « dangereuses » (pit-bull, Rottweiler, Doberman, Presa Canario, Dogo Argentino, mastiffs, Fila, Bull Terrier, American Staffordshire, Tosa) uniquement en soute dans une caisse à parois métalliques ; les types pit-bull sont interdits d'importation en Colombie.
      es: "Las razas «peligrosas» (pit bull, Rottweiler, Doberman, Presa Canario, Dogo Argentino, mastines, Fila, Bull Terrier, American Staffordshire, Tosa) viajan solo en bodega en una jaula de paredes metálicas; los tipos pit bull tienen prohibida la importación a Colombia."
      pt: "As raças “perigosas” (pit bull, Rottweiler, Dobermann, Presa Canário, Dogo Argentino, mastins, Fila, Bull Terrier, American Staffordshire, Tosa) viajam somente no porão em uma caixa de paredes metálicas; os tipos pit bull têm importação proibida na Colômbia."
temperature:
  pills:
    - cls: no
      label:
        en: Seasonal route embargoes
        fr: Embargos de routes saisonniers
        es: Embargos de rutas estacionales
        pt: "Embargos sazonais de rotas"
    - cls: warn
      label:
        en: Ventilated hold only
        fr: Soute ventilée uniquement
        es: Solo bodega ventilada
        pt: "Somente porão ventilado"
  note:
    en: "Avianca publishes no degree thresholds but applies seasonal hold embargoes on many routes: summer (24 Jun–30 Sep 2026) to/from Orlando, Miami, Houston, Madrid, Barcelona and others; winter (15 Dec 2026–31 Mar 2027) to/from New York, Boston, Chicago, Toronto and more. Pets travel only on aircraft with a ventilated hold."
    fr: "Avianca ne publie pas de seuils en degrés mais applique des embargos de soute saisonniers sur de nombreuses routes : été (24 juin–30 sept. 2026) de/vers Orlando, Miami, Houston, Madrid, Barcelone et d'autres ; hiver (15 déc. 2026–31 mars 2027) de/vers New York, Boston, Chicago, Toronto et plus. Les animaux voyagent uniquement sur avions à soute ventilée."
    es: "Avianca no publica umbrales en grados, pero aplica embargos de bodega estacionales en muchas rutas: verano (24 jun–30 sep 2026) hacia/desde Orlando, Miami, Houston, Madrid, Barcelona y otras; invierno (15 dic 2026–31 mar 2027) hacia/desde Nueva York, Boston, Chicago, Toronto y más. Las mascotas viajan solo en aviones con bodega ventilada."
    pt: "A Avianca não divulga limiares em graus, mas aplica embargos sazonais de porão em muitas rotas: verão (24 jun.–30 set. 2026) de/para Orlando, Miami, Houston, Madri, Barcelona e outras; inverno (15 dez. 2026–31 mar. 2027) de/para Nova York, Boston, Chicago, Toronto e mais. Os animais viajam somente em aeronaves com porão ventilado."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: Trained service dogs (max 2) travel free in the cabin, no container, regardless of size.
      fr: Chiens d'assistance dressés (max 2) gratuits en cabine, sans sac, quelle que soit la taille.
      es: Los perros de asistencia adiestrados (máx. 2) viajan gratis en cabina, sin jaula, sin importar su tamaño.
      pt: "Cães de serviço treinados (máx. 2) viajam gratuitamente na cabine, sem caixa de transporte, independentemente do tamanho."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: DOT service-animal + relief forms; request ≤ 48 h ahead. Emotional-support dogs are treated as pets.
      fr: Formulaires DOT d'animal d'assistance + soulagement ; demande ≤ 48 h à l'avance. Chiens de soutien émotionnel traités comme animaux.
      es: Formularios del DOT de animal de asistencia + de alivio; solicítalos ≤ 48 h antes. Los perros de apoyo emocional se tratan como mascotas.
      pt: "Formulários do DOT de animal de serviço + de necessidades fisiológicas; solicite com ≤ 48 h de antecedência. Cães de apoio emocional são tratados como animais comuns."
goodToKnow:
  - icon: 🚫
    label:
      en: Excluded destinations
      fr: Destinations exclues
      es: Destinos excluidos
      pt: "Destinos excluídos"
    value:
      en: No live animals to the Galápagos; no service to the UK or to/from Aruba and Curaçao (except permanent relocation).
      fr: Pas d'animaux vivants vers les Galápagos ; pas de service vers le R.-U. ni de/vers Aruba et Curaçao (sauf déménagement définitif).
      es: No se admiten animales vivos a las Galápagos; sin servicio al RU ni hacia/desde Aruba y Curazao (salvo mudanza permanente).
      pt: "Nenhum animal vivo para as Galápagos; sem serviço para o Reino Unido nem de/para Aruba e Curaçao (exceto mudança definitiva)."
  - icon: 🐾
    label:
      en: One cabin pet
      fr: Un animal en cabine
      es: Una mascota en cabina
      pt: "Um animal por cabine"
    value:
      en: Only one pet per cabin; extra pets travel in the hold.
      fr: Un seul animal par cabine ; les animaux supplémentaires voyagent en soute.
      es: Solo una mascota por cabina; las mascotas adicionales viajan en bodega.
      pt: "Somente um animal por cabine; os animais adicionais viajam no porão."
  - icon: 🔁
    label:
      en: Avianca-operated only
      fr: Opéré par Avianca seul
      es: Solo operado por Avianca
      pt: "Somente operado pela Avianca"
    value:
      en: Not available on partner or codeshare bookings.
      fr: Non disponible sur les réservations partenaires ou codeshare.
      es: No disponible en reservas de socios ni en código compartido.
      pt: "Não disponível em reservas de parceiras ou em codeshare."
