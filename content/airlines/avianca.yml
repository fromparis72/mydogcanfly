policies:
  cabin:
    availability: offered
  hold:
    availability: offered
  cargo:
    review_state: legacy_unreviewed
channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: One dog or cat ≤ 10 kg incl. carrier in a soft carrier under the seat; not in B787 Business.
      fr: Un chien ou chat ≤ 10 kg avec le sac dans un sac souple sous le siège ; pas en Business B787.
      es: Un perro o gato ≤ 10 kg incl. jaula, en una jaula blanda bajo el asiento; no en Business del B787.
      pt: "Um cachorro ou gato ≤ 10 kg incl. bolsa de transporte, em uma bolsa de transporte flexível embaixo do assento; não na Business do B787."
    fee:
      en: $45–235
      fr: 45–235 $
      es: 45–235 $
      pt: "$45–235"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Dog or cat up to 70 kg incl. container in a rigid, ventilated crate you provide. Ventilated-hold aircraft only.
      fr: Chien ou chat jusqu'à 70 kg avec la caisse, caisse rigide ventilée fournie par tu. Uniquement avions à soute ventilée.
      es: Perro o gato de hasta 70 kg incl. contenedor, en una jaula rígida y ventilada que tú aportas. Solo aviones con bodega ventilada.
      pt: "Cachorro ou gato de até 70 kg incl. caixa de transporte, em uma caixa rígida e ventilada fornecida por você. Somente aeronaves com porão ventilado."
    fee:
      en: $70–345
      fr: 70–345 $
      es: 70–345 $
      pt: "$70–345"
  - placement: cargo
    icon: ✈️
    name:
      en: Avianca Cargo
      fr: Avianca Cargo
      es: Avianca Cargo
      pt: "Avianca Cargo"
    cls: warn
    statusLabel:
      en: On request
      fr: Sur devis
      es: Bajo presupuesto
      pt: "Sob consulta"
    detail:
      en: Pets over 70 kg incl. container and all UK shipments, via Avianca Cargo live-animal service.
      fr: Animaux de plus de 70 kg avec la caisse et toutes les expéditions vers le R.-U., via le service animaux vivants d'Avianca Cargo.
      es: Mascotas de más de 70 kg incl. contenedor y todos los envíos al RU, mediante el servicio de animales vivos de Avianca Cargo.
      pt: "Animais com mais de 70 kg incl. caixa de transporte e todos os envios para o Reino Unido, via o serviço de animais vivos da Avianca Cargo."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
