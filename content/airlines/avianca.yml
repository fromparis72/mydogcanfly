        fr: Cabine (régional → Europe)
        es: Cabina (regional → Europa)
        pt: "Cabine (regional → Europa)"
      value:
        en: $45–235
        fr: 45–235 $
        es: 45–235 $
        pt: "$45–235"
    - label:
        en: Hold (regional → Europe)
        fr: Soute (régional → Europe)
        es: Bodega (regional → Europa)
        pt: "Porão (regional → Europa)"
      value:
        en: $70–345
        fr: 70–345 $
        es: 70–345 $
        pt: "$70–345"
    - label:
        en: Avianca Cargo
        fr: Avianca Cargo
        es: Avianca Cargo
        pt: "Avianca Cargo"
      value:
        en: Quote
        fr: Devis
