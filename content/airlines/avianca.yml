name: Avianca
titleH1:
  en: Flying with a dog on Avianca
  fr: Voyager avec un chien sur Avianca
  es: Viajar con perro en Avianca
  pt: "Viajar com um cachorro pela Avianca"
metaDesc:
  en: "Avianca pet policy: cabin, hold and Avianca Cargo, fares by zone, seasonal route embargoes, breed limits and official sources."
  fr: "Politique animaux Avianca : cabine, soute et Avianca Cargo, tarifs par zone, embargos saisonniers, restrictions de races et sources officielles."
  es: "Política de mascotas de Avianca: cabina, bodega y Avianca Cargo, tarifas por zona, embargos de rutas estacionales, límites de raza y fuentes oficiales."
  pt: "Política de animais da Avianca: cabine, porão e Avianca Cargo, tarifas por zona, embargos sazonais de rotas, limites de raça e fontes oficiais."
chips:
  - icon: ✈
    label:
      en: Star Alliance
      fr: Star Alliance
      es: Star Alliance
      pt: "Star Alliance"
  - icon: 📍
    label:
      en: Colombia · BOG
      fr: Colombie · BOG
      es: Colombia · BOG
      pt: "Colômbia · BOG"
  - icon: 🗓
    label:
      en: Updated 11 Jul 2026
      fr: Mise à jour le 11 juil. 2026
      es: Actualizado el 11 jul 2026
      pt: "Atualizado em 11 jul. 2026"
verdict:
  cls: warn
  label:
    en: Moderate
    fr: Modéré
    es: Moderado
    pt: "Moderada"
verdictNote:
  en: Cabin (≤ 10 kg) and hold (≤ 70 kg) for cats & dogs — but many seasonal route embargoes and breed limits.
  fr: Cabine (≤ 10 kg) et soute (≤ 70 kg) pour chats et chiens — mais nombreux embargos de routes saisonniers et restrictions de races.
  es: Cabina (≤ 10 kg) y bodega (≤ 70 kg) para gatos y perros, pero con muchos embargos de rutas estacionales y límites de raza.
  pt: "Cabine (≤ 10 kg) e porão (≤ 70 kg) para gatos e cachorros — mas com muitos embargos sazonais de rotas e limites de raça."
