    en: Moderate
    fr: Modéré
    es: Moderado
    pt: "Moderada"
verdictNote:
  en: No cabin pets except guide dogs; pets travel in the hold (AVIH) or via the MASkargo Animal Hotel.
  fr: Pas d'animaux en cabine sauf chiens guides ; les animaux voyagent en soute (AVIH) ou via le MASkargo Animal Hotel.
  es: No se admiten mascotas en cabina salvo perros guía; las mascotas viajan en bodega (AVIH) o a través del MASkargo Animal Hotel.
  pt: "Nenhum animal na cabine, exceto cães-guia; os animais viajam no porão (AVIH) ou via o MASkargo Animal Hotel."
