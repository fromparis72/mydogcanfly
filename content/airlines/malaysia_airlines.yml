name: Malaysia Airlines
titleH1:
  en: Flying with a dog on Malaysia Airlines
  fr: Voyager avec un chien sur Malaysia Airlines
  es: Viajar con un perro en Malaysia Airlines
  pt: "Viajar com um cachorro na Malaysia Airlines"
metaDesc:
  en: "Malaysia Airlines pet policy: hold (AVIH) or MASkargo Animal Hotel, breed limits, and official sources."
  fr: "Politique animaux Malaysia Airlines : soute (AVIH) ou MASkargo Animal Hotel, restrictions de races et sources officielles."
  es: "Política de mascotas de Malaysia Airlines: bodega (AVIH) o MASkargo Animal Hotel, límites por raza y fuentes oficiales."
  pt: "Política de animais da Malaysia Airlines: porão (AVIH) ou MASkargo Animal Hotel, limites por raça e fontes oficiais."
