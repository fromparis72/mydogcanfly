  es: Viajar con perro en easyJet
  pt: "Voar com um cachorro na easyJet"
metaDesc:
  en: "easyJet pet policy: no pets carried, only accredited assistance dogs in the cabin, route limits and official sources."
  fr: "Politique animaux easyJet : aucun animal transporté, seulement les chiens d'assistance accrédités en cabine, restrictions de routes et sources officielles."
  es: "Política de mascotas de easyJet: no se transportan mascotas, solo perros de asistencia acreditados en cabina, límites de rutas y fuentes oficiales."
  pt: "Política de animais da easyJet: nenhum animal transportado, somente cães de assistência credenciados na cabine, limites de rota e fontes oficiais."
