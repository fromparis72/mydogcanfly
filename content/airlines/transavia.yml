restrictions:
  - icon: 🐶
    title:
      en: Flat-faced breeds
      fr: Races brachycéphales
      es: Razas de hocico chato
      pt: "Raças de focinho achatado"
    pills:
      - cls: ok
        label:
          en: Cabin only
          fr: Cabine uniquement
          es: Solo cabina
          pt: "Somente cabine"
      - cls: no
        label:
          en: Hold forbidden
          fr: Soute interdite
          es: Bodega prohibida
          pt: "Porão proibido"
    note:
      en: "Snub-nosed dogs & cats are barred from the hold (breathing risk) — cabin only (≤ 8 kg): bulldogs (all), boxers (all), pugs (all), Boston terrier, Brussels Griffon, Bull Mastiff, Cane Corso, chow chow, Great Danes, Lhasa Apso, mastiffs, Pekingese, Shar Pei, Shih Tzu, spaniels (Tibetan/Japanese/English/King Charles), Staffordshire Bull Terrier, and Burmese/Exotic/Himalayan/Persian cats."
      fr: "Chiens et chats au nez écrasé interdits en soute (risque respiratoire) — cabine uniquement (≤ 8 kg) : bouledogues (tous), boxers (tous), carlins (tous), Boston terrier, Griffon bruxellois, Bull Mastiff, Cane Corso, chow chow, dogues allemands, Lhasa Apso, mastiffs, pékinois, Shar Pei, Shih Tzu, épagneuls (tibétain/japonais/anglais/King Charles), Staffordshire Bull Terrier, et chats birmans/exotiques/himalayens/persans."
      es: "Los perros y gatos de hocico chato tienen prohibida la bodega (riesgo respiratorio); solo cabina (≤ 8 kg): bulldogs (todos), bóxeres (todos), carlinos (todos), Boston terrier, grifón de Bruselas, Bullmastiff, Cane Corso, chow chow, dogos alemanes, Lhasa Apso, mastines, pekinés, Shar Pei, Shih Tzu, spaniels (tibetano/japonés/inglés/King Charles), Staffordshire Bull Terrier, y gatos birmano/exótico/himalayo/persa."
      pt: "Cachorros e gatos de focinho achatado são proibidos no porão (risco respiratório) — somente na cabine (≤ 8 kg): buldogues (todos), boxers (todos), pugs (todos), Boston terrier, grifão de Bruxelas, Bull Mastiff, Cane Corso, chow chow, dogues alemães, Lhasa Apso, mastins, pequinês, Shar Pei, Shih Tzu, spaniels (tibetano/japonês/inglês/King Charles), Staffordshire Bull Terrier, e gatos birmanês/exótico/himalaia/persa."
  - icon: 🚫
    title:
      en: Other rules
      fr: Autres règles
      es: Otras normas
      pt: "Outras regras"
    pills:
      - cls: no
        label:
          en: No ESA / rodents
          fr: Pas d'ESA / rongeurs
          es: Sin ESA / roedores
          pt: "Sem ESA / roedores"
    note:
      en: Emotional-support animals and small rodents (hamsters, rabbits, guinea pigs) aren't accepted. No toys in the kennel; pets must be clean and non-aggressive.
      fr: Les animaux de soutien émotionnel et les petits rongeurs (hamsters, lapins, cochons d'Inde) ne sont pas acceptés. Pas de jouets dans la caisse ; les animaux doivent être propres et non agressifs.
      es: No se aceptan animales de apoyo emocional ni pequeños roedores (hámsteres, conejos, cobayas). Sin juguetes en la jaula; las mascotas deben estar limpias y no ser agresivas.
      pt: "Animais de suporte emocional e pequenos roedores (hamsters, coelhos, porquinhos-da-índia) não são aceitos. Sem brinquedos na caixa de transporte; os animais devem estar limpos e não ser agressivos."
temperature:
  pills:
    - cls: ok
      label:
        en: Heated, climate- & pressure-controlled hold
        fr: Soute chauffée, climatisée & pressurisée
        es: Bodega calefactada, climatizada y presurizada
        pt: "Porão aquecido, com clima e pressão controlados"
    - cls: warn
      label:
        en: "Temperature limits: not disclosed"
        fr: "Limites de température : non communiqué"
        es: "Límites de temperatura: no comunicados"
        pt: "Limites de temperatura: não divulgados"
  note:
    en: The hold is a heated, climate- and pressure-controlled environment; snub-nosed breeds are excluded because heat and stress cause breathing difficulty. No numeric temperature limit is published.
    fr: La soute est un environnement chauffé, climatisé et pressurisé ; les races au nez écrasé sont exclues car la chaleur et le stress provoquent des difficultés respiratoires. Aucune limite chiffrée de température n'est publiée.
    es: La bodega es un entorno calefactado, climatizado y presurizado; las razas de hocico chato quedan excluidas porque el calor y el estrés provocan dificultad respiratoria. No se publica ningún límite numérico de temperatura.
    pt: "O porão é um ambiente aquecido, com clima e pressão controlados; as raças de focinho achatado são excluídas porque o calor e o estresse causam dificuldade respiratória. Nenhum limite numérico de temperatura é publicado."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: Certified assistance dogs (ADI/ADEu/IGDF or AAI register) travel in the cabin on the floor at your feet, on a lead.
      fr: Chiens d'assistance certifiés (ADI/ADEu/IGDF ou registre AAI) voyagent en cabine au sol à tes pieds, en laisse.
      es: Los perros de asistencia certificados (ADI/ADEu/IGDF o registro AAI) viajan en cabina en el suelo a tus pies, con correa.
      pt: "Cachorros de assistência certificados (registro ADI/ADEu/IGDF ou AAI) viajam na cabine, no chão, a seus pés, na guia."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: Valid pet passport + vaccinations; proof of certification. Emotional-support/therapy dogs follow normal paid pet rules.
      fr: Passeport animalier valide + vaccinations ; preuve de certification. Chiens de soutien émotionnel/thérapie soumis aux règles animaux payantes.
      es: Pasaporte de mascota válido + vacunas; prueba de la certificación. Los perros de apoyo emocional/terapia siguen las normas de mascotas de pago habituales.
      pt: "Passaporte de animal válido + vacinas; comprovante da certificação. Cachorros de suporte emocional/terapia seguem as regras normais e pagas para animais."
goodToKnow:
  - icon: 🚫
    label:
      en: No ESA or rodents
      fr: Pas d'ESA ni rongeurs
      es: Sin ESA ni roedores
      pt: "Sem ESA nem roedores"
    value:
      en: Emotional-support animals and small rodents aren't accepted on board.
      fr: Les animaux de soutien émotionnel et les petits rongeurs ne sont pas admis à bord.
      es: No se admiten a bordo animales de apoyo emocional ni pequeños roedores.
      pt: "Animais de suporte emocional e pequenos roedores não são aceitos a bordo."
  - icon: 💶
    label:
      en: Non-refundable
      fr: Non remboursable
      es: No reembolsable
      pt: "Não reembolsável"
    value:
      en: Pet fees are non-refundable; cancel via the Service Centre.
      fr: Les frais animaux sont non remboursables ; annulation via le Service Centre.
      es: Las tarifas de mascotas no son reembolsables; cancele a través del Service Centre.
      pt: "As tarifas de animais não são reembolsáveis; cancele através do Service Centre."
  - icon: ⏱️
    label:
      en: Booking
      fr: Réserver
      es: Reserva
      pt: "Reserva"
    value:
      en: Add the pet at booking or in My Transavia up to 2 h before departure; space is limited.
      fr: Ajouter l'animal à la réservation ou dans My Transavia jusqu'à 2 h avant le départ ; places limitées.
      es: Añade la mascota al reservar o en My Transavia hasta 2 h antes de la salida; las plazas son limitadas.
      pt: "Adicione o animal na reserva ou no My Transavia até 2 h antes da partida; as vagas são limitadas."
