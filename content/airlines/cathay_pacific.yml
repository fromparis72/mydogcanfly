verdictNote:
  en: Pets fly only via Cathay Cargo through certified agents; the cabin is limited to accredited assistance dogs.
  fr: Les animaux ne voyagent que via Cathay Cargo par agents certifiés ; la cabine est réservée aux chiens d'assistance accrédités.
  es: Las mascotas vuelan solo mediante Cathay Cargo a través de agentes certificados; la cabina se limita a perros de asistencia acreditados.
  pt: "Os animais só voam mediante a Cathay Cargo, por agentes certificados; a cabine é reservada a cães de assistência credenciados."
