titleH1:
  en: Flying with a dog on Cathay Pacific
  fr: Voyager avec un chien sur Cathay Pacific
  es: Viajar con perro en Cathay Pacific
  pt: "Voar com um cachorro na Cathay Pacific"
metaDesc:
  en: "Cathay Pacific pet policy: cargo-only via certified agents, cabin assistance dogs, restrictions and official sources."
  fr: "Politique animaux Cathay Pacific : fret uniquement via agents certifiés, chiens d'assistance en cabine, restrictions et sources officielles."
  es: "Política de mascotas de Cathay Pacific: solo carga mediante agentes certificados, perros de asistencia en cabina, restricciones y fuentes oficiales."
  pt: "Política de animais da Cathay Pacific: somente carga mediante agentes certificados, cães de assistência em cabine, restrições e fontes oficiais."
