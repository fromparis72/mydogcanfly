  label:
    en: Hard
    fr: Difficile
    es: Difícil
    pt: "Difícil"
verdictNote:
  en: No cats or dogs in the cabin — they travel in the hold or via QR Cargo Live.
  fr: Ni chats ni chiens en cabine — ils voyagent en soute ou via QR Cargo Live.
  es: No se admiten gatos ni perros en cabina; viajan en bodega o a través de QR Cargo Live.
  pt: "Nenhum gato ou cachorro na cabine — eles viajam no porão ou via QR Cargo Live."
