name: Qatar Airways
titleH1:
  en: Flying with a dog on Qatar Airways
  fr: Voyager avec un chien sur Qatar Airways
  es: Viajar con un perro en Qatar Airways
  pt: "Viajar com um cachorro na Qatar Airways"
metaDesc:
  en: "Qatar Airways pet policy: no cabin pets, hold and QR Cargo rules, fares, restrictions and official sources."
  fr: "Politique animaux Qatar Airways : pas d'animaux en cabine, soute et QR Cargo, tarifs, restrictions et sources officielles."
  es: "Política de mascotas de Qatar Airways: sin mascotas en cabina, normas de bodega y QR Cargo, tarifas, restricciones y fuentes oficiales."
  pt: "Política de animais da Qatar Airways: sem animais em cabine, regras de porão e QR Cargo, tarifas, restrições e fontes oficiais."
