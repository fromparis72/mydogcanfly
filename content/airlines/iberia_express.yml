restrictions:
  - icon: 🐶
    title:
      en: Flat-faced breeds
      fr: Races brachycéphales
      es: Razas de hocico chato
      pt: "Raças de focinho achatado"
    pills:
      - cls: ok
        label:
          en: Cabin possible
          fr: Cabine possible
          es: Cabina posible
          pt: "Cabine possível"
      - cls: no
        label:
          en: Hold forbidden
          fr: Soute interdite
          es: Bodega prohibida
          pt: "Porão proibido"
    note:
      en: "Snub-nosed dogs & cats aren't accepted in the hold (cabin only, ≤ 8 kg): bulldog, boxer, pug, Boston terrier, Shih Tzu, Pekingese, and Persian/Himalayan/Exotic/Burmese cats."
      fr: "Chiens et chats au nez écrasé refusés en soute (cabine uniquement, ≤ 8 kg) : bouledogue, boxer, carlin, Boston terrier, Shih Tzu, pékinois, et chats persans/himalayens/exotiques/birmans."
      es: "Los perros y gatos de hocico chato no se aceptan en bodega (solo cabina, ≤ 8 kg): bulldog, bóxer, carlino, bóston terrier, shih tzu, pequinés, y gatos persas/himalayos/exóticos/birmanos."
      pt: "Cachorros e gatos de focinho achatado não são aceitos no porão (somente cabine, ≤ 8 kg): buldogue, boxer, pug, Boston Terrier, Shih Tzu, Pequinês, e gatos persas/himalaios/exóticos/burmeses."
  - icon: 🚫
    title:
      en: Dangerous breeds & mustelids
      fr: Races dangereuses & mustélidés
      es: Razas peligrosas y mustélidos
      pt: "Raças perigosas e mustelídeos"
    pills:
      - cls: no
        label:
          en: Not accepted
          fr: Non acceptés
          es: No aceptados
          pt: "Não aceitas"
    note:
      en: Dangerous breeds (pit bull, Staffordshire, American Staffordshire, Rottweiler, Doberman, Dogo Argentino, Fila, Tosa, Akita) aren't accepted. Mustelids (ferrets etc.) are never carried; no weaned, pregnant or lab animals.
      fr: Races dangereuses (pit-bull, Staffordshire, American Staffordshire, Rottweiler, Doberman, Dogo Argentino, Fila, Tosa, Akita) non acceptées. Les mustélidés (furets, etc.) ne sont jamais transportés ; pas d'animaux sevrés, gestants ou de laboratoire.
      es: Las razas potencialmente peligrosas (pit bull, staffordshire, american staffordshire, rottweiler, doberman, dogo argentino, fila, tosa, akita) no se aceptan. Los mustélidos (hurones, etc.) nunca se transportan; tampoco animales sin destetar, gestantes o de laboratorio.
      pt: "As raças perigosas (pit bull, Staffordshire, American Staffordshire, Rottweiler, Dobermann, Dogo Argentino, Fila, Tosa, Akita) não são aceitas. Os mustelídeos (furões etc.) nunca são transportados; também não são aceitos animais recém-desmamados, gestantes ou de laboratório."
temperature:
  pills:
    - cls: warn
      label:
        en: "Temperature limits: not disclosed"
        fr: "Limites de température : non communiqué"
        es: "Límites de temperatura: no divulgados"
        pt: "Limites de temperatura: não divulgados"
  note:
    en: Iberia Express publishes no hold-temperature limits or seasonal embargo on its pet pages.
    fr: Iberia Express ne publie pas de limites de température en soute ni d'embargo saisonnier sur ses pages animaux.
    es: Iberia Express no publica límites de temperatura en bodega ni embargo estacional en sus páginas de mascotas.
    pt: "A Iberia Express não divulga limites de temperatura no porão nem embargo sazonal em suas páginas sobre animais."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: Service dogs travel free in the cabin, at your feet on a lead.
      fr: Les chiens d'assistance voyagent gratuitement en cabine, à tes pieds en laisse.
      es: Los perros de asistencia viajan gratis en cabina, a tus pies y con correa.
      pt: "Os cães de serviço viajam gratuitamente na cabine, aos seus pés e com guia."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: Mark the option at booking + complete the accreditation form (health, training, behaviour).
      fr: Cocher l'option à la réservation + remplir le formulaire d'accréditation (santé, dressage, comportement).
      es: Marca la opción al reservar + completa el formulario de acreditación (salud, adiestramiento, comportamiento).
      pt: "Marque a opção na reserva + preencha o formulário de credenciamento (saúde, adestramento, comportamento)."
goodToKnow:
  - icon: 🐶
    label:
      en: Brachy cabin only
      fr: Brachy cabine seule
      es: Braquicéfalos solo en cabina
      pt: "Braquicefálicos somente na cabine"
    value:
      en: Snub-nosed dogs & cats are barred from the hold and only fly in the cabin (≤ 8 kg).
      fr: Chiens et chats au nez écrasé interdits en soute, uniquement en cabine (≤ 8 kg).
      es: Los perros y gatos de hocico chato tienen vetada la bodega y solo vuelan en cabina (≤ 8 kg).
      pt: "Cachorros e gatos de focinho achatado têm o porão vetado e só voam na cabine (≤ 8 kg)."
  - icon: 🚫
    label:
      en: Route hold limits
      fr: Limites soute par route
      es: Límites de bodega por ruta
      pt: "Limites de porão por rota"
    value:
      en: Hold pets are restricted on Iberia-coded Iberia Express flights to/from Cairo, Tel Aviv and Keflavik (cabin still allowed).
      fr: La soute est restreinte sur les vols Iberia Express sous code Iberia de/vers Le Caire, Tel Aviv et Keflavik (cabine toujours possible).
      es: Las mascotas en bodega están restringidas en los vuelos de Iberia Express con código de Iberia hacia/desde El Cairo, Tel Aviv y Keflavik (la cabina sigue permitida).
      pt: "Animais no porão são restritos nos voos da Iberia Express com código Iberia de/para o Cairo, Tel Aviv e Keflavik (a cabine continua permitida)."
  - icon: 🏝️
    label:
      en: Ibiza / Menorca
      fr: Ibiza / Minorque
      es: Ibiza / Menorca
      pt: "Ibiza / Menorca"
    value:
      en: Pets arriving from a non-EU country can't enter Ibiza or Menorca; ferrets are never accepted.
      fr: Les animaux arrivant d'un pays hors UE ne peuvent pas entrer à Ibiza ni Minorque ; les furets ne sont jamais acceptés.
      es: Las mascotas que llegan de un país de fuera de la UE no pueden entrar en Ibiza ni Menorca; los hurones nunca se aceptan.
      pt: "Animais que chegam de um país fora da UE não podem entrar em Ibiza nem em Menorca; furões nunca são aceitos."
