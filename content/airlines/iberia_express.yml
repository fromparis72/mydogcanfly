channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Dogs, cats, birds, fish & turtles ≤ 8 kg incl. carrier under the seat (max 45 × 35 × 25 cm); prior Booking Office authorisation.
      fr: Chiens, chats, oiseaux, poissons et tortues ≤ 8 kg avec le sac sous le siège (max 45 × 35 × 25 cm) ; autorisation préalable du Booking Office.
      es: Perros, gatos, aves, peces y tortugas ≤ 8 kg con la jaula bajo el asiento (máx. 45 × 35 × 25 cm); autorización previa del Booking Office.
      pt: "Cachorros, gatos, aves, peixes e tartarugas ≤ 8 kg incluindo a bolsa de transporte sob o assento (máx. 45 × 35 × 25 cm); exige autorização prévia do Booking Office."
    fee:
      en: €40–180
      fr: 40–180 €
      es: 40–180 €
      pt: "40–180 €"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Live animals up to 45 kg incl. container; authorisation + 48 h notice; transit 90 min–4 h. Snub-nosed barred.
      fr: Animaux vivants jusqu'à 45 kg avec le contenant ; autorisation + préavis 48 h ; correspondance 90 min–4 h. Races au nez écrasé exclues.
      es: Animales vivos hasta 45 kg con el contenedor; autorización + aviso de 48 h; conexión de 90 min–4 h. Los hocicos chatos quedan excluidos.
      pt: "Animais vivos até 45 kg incluindo a caixa de transporte; exige autorização + aviso prévio de 48 h; conexão de 90 min–4 h. Raças de focinho achatado excluídas."
    fee:
      en: €100–360
      fr: 100–360 €
      es: 100–360 €
      pt: "100–360 €"
