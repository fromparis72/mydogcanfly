verdictNote:
  en: Small pets in the cabin or hold — but Booking Office authorisation 48 h ahead and snub-nosed breeds cabin-only.
  fr: Petits animaux en cabine ou en soute — mais autorisation du Booking Office 48 h à l'avance et races au nez écrasé en cabine seulement.
  es: Mascotas pequeñas en cabina o bodega, pero con autorización del Booking Office 48 h antes y las razas de hocico chato solo en cabina.
  pt: "Animais pequenos na cabine ou no porão — mas com autorização do Booking Office 48 h antes, e as raças de focinho achatado somente na cabine."
