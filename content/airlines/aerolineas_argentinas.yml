channels:
  - icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Dogs and cats from 12 weeks, 9 kg carrier included, one animal per passenger and per carrier. Soft carrier compulsory since 1 April 2024, max 44 × 30 × 23 cm, under the seat in front. Book 72 h ahead by WhatsApp or call centre. No cabin pets in Business on the A330. Dogs under veterinary treatment are refused.
      fr: Chiens et chats à partir de 12 semaines, 9 kg sac compris, un animal par passager et par contenant. Sac souple obligatoire depuis le 1ᵉʳ avril 2024, 44 × 30 × 23 cm maximum, sous le siège devant toi. Réservation 72 h à l'avance par WhatsApp ou centre d'appels. Pas d'animal en cabine en Business sur A330. Chiens sous traitement vétérinaire refusés.
      es: Perros y gatos desde las 12 semanas, 9 kg con el bolso incluido, un animal por pasajero y por contenedor. Bolso blando obligatorio desde el 1 de abril de 2024, máximo 44 × 30 × 23 cm, bajo el asiento delantero. Reserva con 72 h de antelación por WhatsApp o call center. Sin mascotas en cabina en Business en el A330. Se rechazan los perros bajo tratamiento veterinario.
      pt: "Cachorros e gatos a partir de 12 semanas, 9 kg com a bolsa incluída, um animal por passageiro e por contêiner. Bolsa maleável obrigatória desde 1º de abril de 2024, no máximo 44 × 30 × 23 cm, sob o assento da frente. Reserve com 72 h de antecedência por WhatsApp ou call center. Sem animais na cabine na Business do A330. Cachorros sob tratamento veterinário são recusados."
    fee:
      en: ARS 54,450 · USD 150–250
      fr: 54 450 ARS · 150–250 USD
      es: 54.450 ARS · 150–250 USD
      pt: "54.450 ARS · 150–250 USD"
  - icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Dogs and cats from 12 weeks. No weight limit on the animal — the crate governs, up to 100 × 70 × 80 cm, rigid with a metal door and no wheels. Since 1 September 2025 cable ties and a nylon net are compulsory, fitted at the counter and not before. Water required beyond 12 h of flight, no food inside the crate.
      fr: Chiens et chats dès 12 semaines. Aucune limite de poids sur l'animal — c'est la caisse qui commande, jusqu'à 100 × 70 × 80 cm, rigide, porte métallique, sans roulettes. Depuis le 1ᵉʳ septembre 2025, colliers de serrage et filet de nylon obligatoires, posés au comptoir et pas avant. Eau obligatoire au-delà de 12 h de vol, nourriture interdite dans la caisse.
      es: "Perros y gatos desde las 12 semanas. Sin límite de peso para el animal: manda la jaula, hasta 100 × 70 × 80 cm, rígida, con puerta metálica y sin ruedas. Desde el 1 de septiembre de 2025 son obligatorios los precintos y la red de nailon, colocados en el mostrador y no antes. Agua obligatoria a partir de 12 h de vuelo; nada de comida dentro de la jaula."
      pt: "Cachorros e gatos a partir de 12 semanas. Sem limite de peso para o animal — quem manda é a caixa, de até 100 × 70 × 80 cm, rígida, com porta metálica e sem rodinhas. Desde 1º de setembro de 2025, abraçadeiras e rede de náilon são obrigatórias, colocadas no balcão e não antes. Água obrigatória acima de 12 h de voo; nada de comida dentro da caixa."
    fee:
      en: ARS 229,900 · USD 330–1,149
      fr: 229 900 ARS · 330–1 149 USD
      es: 229.900 ARS · 330–1.149 USD
      pt: "229.900 ARS · 330–1.149 USD"
  - icon: ✈️
    name:
      en: Cargo
      fr: Fret
      es: Carga
      pt: "Carga"
    cls: warn
    statusLabel:
      en: Via cargo
      fr: Via fret
      es: Vía carga
      pt: "Via carga"
    detail:
      en: The only route for flat-faced breeds (barred from the hold but accepted in cargo) and for the eighteen breeds listed as dangerous, which must always travel as cargo.
      fr: La seule voie pour les brachycéphales (refusés en soute mais acceptés en fret) et pour les dix-huit races classées dangereuses, qui passent obligatoirement par le fret.
      es: La única vía para las razas de hocico chato (rechazadas en bodega pero aceptadas en carga) y para las dieciocho razas consideradas peligrosas, que viajan siempre como carga.
      pt: "A única via para as raças de focinho achatado (recusadas no porão, mas aceitas na carga) e para as dezoito raças classificadas como perigosas, que viajam sempre como carga."
    fee:
      en: Not published
      fr: Non publié
      es: No publicado
      pt: "Não publicado"
