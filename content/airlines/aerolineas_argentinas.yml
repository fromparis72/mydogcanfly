restrictions:
  - icon: 🐶
    title:
      en: Flat-faced breeds
      fr: Races brachycéphales
      es: Razas de hocico chato
      pt: "Raças de focinho achatado"
    pills:
      - cls: ok
        label:
          en: Cabin allowed
          fr: Cabine autorisée
          es: Cabina permitida
          pt: "Cabine permitida"
      - cls: "no"
        label:
          en: Hold forbidden
          fr: Soute interdite
          es: Bodega prohibida
          pt: "Porão proibido"
      - cls: warn
        label:
          en: Cargo possible
          fr: Fret possible
          es: Carga posible
          pt: "Carga possível"
    note:
      en: "The asymmetry is the whole point: a flat-faced dog under 9 kg flies in the cabin, is refused in the hold, and is accepted as cargo. The published list covers English/American/French bulldogs, boxer, Boston terrier, pug, Pekingese, Lhasa Apso, chow chow, Shih Tzu, Brussels griffon, mastiff, Staffordshire bull terrier, Japanese chin, Tibetan spaniel, English toy spaniel; and Burmese, Exotic, Himalayan and Persian cats."
      fr: "L'asymétrie est tout l'intérêt : un chien au nez écrasé de moins de 9 kg vole en cabine, se voit refuser la soute, et passe en fret. La liste publiée couvre les bouledogues anglais/américain/français, boxer, Boston terrier, carlin, pékinois, Lhasa Apso, chow chow, Shih Tzu, griffon bruxellois, mastiff, Staffordshire bull terrier, chin japonais, spaniel tibétain, English toy spaniel ; et les chats burmese, exotic, himalayen et persan."
      es: "La asimetría es lo esencial: un perro de hocico chato de menos de 9 kg vuela en cabina, no se acepta en bodega y sí como carga. La lista publicada incluye bulldog inglés/americano/francés, bóxer, Boston terrier, carlino, pequinés, Lhasa Apso, chow chow, Shih Tzu, grifón de Bruselas, mastín, Staffordshire bull terrier, chin japonés, spaniel tibetano, English toy spaniel; y gatos burmés, exotic, himalayo y persa."
      pt: "A assimetria é o ponto central: um cachorro de focinho achatado com menos de 9 kg voa na cabine, é recusado no porão e é aceito na carga. A lista publicada abrange bulldogues inglês/americano/francês, boxer, Boston terrier, pug, pequinês, Lhasa Apso, chow chow, Shih Tzu, grifon de Bruxelas, mastiff, Staffordshire bull terrier, spaniel japonês, spaniel tibetano, English toy spaniel; e gatos burmese, exotic, himalaio e persa."
  - icon: 🚫
    title:
      en: Breeds listed as dangerous
      fr: Races classées dangereuses
      es: Razas consideradas peligrosas
      pt: "Raças classificadas como perigosas"
    pills:
      - cls: "no"
        label:
          en: Cargo only
          fr: Fret uniquement
          es: Solo carga
          pt: "Somente carga"
    note:
      en: "Eighteen breeds must travel as cargo, never in the cabin or the hold: Akita Inu, American Staffordshire terrier, bullmastiff, bull terrier, Cane Corso, Dobermann, Dogo Argentino, Dogo Canario, Dogue de Bordeaux, Fila Brasileiro, Japanese large dog, Neapolitan mastiff, German shepherd, pit bull terrier, Presa Canario, Rottweiler, Staffordshire bull terrier, Tosa Inu. Yes — the German shepherd is on that list."
      fr: "Dix-huit races passent obligatoirement par le fret, jamais en cabine ni en soute : Akita Inu, American Staffordshire terrier, bullmastiff, bull terrier, Cane Corso, Dobermann, Dogo argentin, Dogo canario, Dogue de Bordeaux, Fila brasileiro, grand chien japonais, mâtin napolitain, berger allemand, pit bull terrier, Presa Canario, Rottweiler, Staffordshire bull terrier, Tosa Inu. Oui, le berger allemand est bien dans la liste."
      es: "Dieciocho razas viajan obligatoriamente como carga, nunca en cabina ni en bodega: Akita Inu, American Staffordshire terrier, bullmastiff, bull terrier, Cane Corso, Dobermann, Dogo Argentino, Dogo Canario, Dogo de Burdeos, Fila Brasileiro, gran perro japonés, mastín napolitano, pastor alemán, pit bull terrier, Presa Canario, Rottweiler, Staffordshire bull terrier, Tosa Inu. Sí: el pastor alemán está en la lista."
      pt: "Dezoito raças viajam obrigatoriamente como carga, nunca na cabine nem no porão: Akita Inu, American Staffordshire terrier, bullmastiff, bull terrier, Cane Corso, Dobermann, Dogo Argentino, Dogo Canario, Dogue de Bordeaux, Fila Brasileiro, grande cão japonês, mastim napolitano, pastor-alemão, pit bull terrier, Presa Canario, Rottweiler, Staffordshire bull terrier, Tosa Inu. Sim: o pastor-alemão está na lista."
temperature:
  pills:
    - cls: warn
      label:
        en: "Temperature limits: not disclosed"
        fr: "Limites de température : non communiqué"
        es: "Límites de temperatura: no comunicado"
        pt: "Limites de temperatura: não divulgados"
  note:
    en: Aerolíneas Argentinas publishes no temperature threshold and no seasonal embargo. The pet page only mentions "the weather situation at the time of boarding" as a reason to refuse an animal.
    fr: Aerolíneas Argentinas ne publie aucun seuil de température ni embargo saisonnier. La page animaux évoque seulement « la situation climatique au moment de l'embarquement » comme motif de refus.
    es: Aerolíneas Argentinas no publica ningún umbral de temperatura ni embargo estacional. La página de mascotas solo menciona «la situación climática en el momento del embarque» como motivo de rechazo.
    pt: "A Aerolíneas Argentinas não publica nenhum limite de temperatura nem embargo sazonal. A página sobre animais menciona apenas \"a situação climática no momento do embarque\" como motivo de recusa."
assistance:
  - icon: ❓
    label:
      en: Assistance dogs
      fr: Chiens d'assistance
      es: Perros de asistencia
      pt: "Cães de assistência"
    value:
      en: Not published. The pet page sets out no conditions, documents or fee waiver for assistance dogs — call the airline before booking.
      fr: Non publié. La page animaux ne fixe ni conditions, ni documents, ni gratuité pour les chiens d'assistance — appelle la compagnie avant de réserver.
      es: No publicado. La página de mascotas no fija condiciones, documentos ni exención de tarifa para perros de asistencia; llama a la aerolínea antes de reservar.
      pt: "Não publicado. A página sobre animais não define condições, documentos nem isenção de tarifa para cães de assistência — ligue para a companhia antes de reservar."
goodToKnow:
  - icon: 👶
    label:
      en: Accompanying passenger
      fr: Passager accompagnant
      es: Pasajero acompañante
      pt: "Passageiro acompanhante"
    value:
      en: An adult travelling with a child under 2 cannot take a pet in the cabin. An unaccompanied minor cannot take an animal at all, cabin or hold.
      fr: Un adulte accompagné d'un enfant de moins de 2 ans ne peut pas emmener d'animal en cabine. Un mineur voyageant seul ne peut rien emmener, ni en cabine ni en soute.
      es: Un adulto que viaja con un niño menor de 2 años no puede llevar mascota en cabina. Un menor no acompañado no puede llevar animal alguno, ni en cabina ni en bodega.
      pt: "Um adulto que viaja com uma criança de menos de 2 anos não pode levar animal na cabine. Um menor desacompanhado não pode levar animal nenhum, nem na cabine nem no porão."
  - icon: 🔁
    label:
      en: Connections
      fr: Correspondances
      es: Conexiones
      pt: "Conexões"
    value:
      en: 3 h minimum in the same airport, and the crate cannot be checked through to the final destination — you collect it at every stop.
      fr: 3 h minimum dans le même aéroport, et la caisse ne peut pas être enregistrée jusqu'à la destination finale — tu la récupères à chaque escale.
      es: "Mínimo 3 h en el mismo aeropuerto, y la jaula no puede facturarse hasta el destino final: la recoges en cada escala."
      pt: "Mínimo de 3 h no mesmo aeroporto, e a caixa não pode ser despachada até o destino final — você a retira em cada escala."
  - icon: ⚠️
    label:
      en: Conditional booking
      fr: Réservation conditionnelle
      es: Reserva condicionada
      pt: "Reserva condicional"
    value:
      en: Acceptance is never final at booking — boarding depends on the aircraft operated and on the weather on the day.
      fr: L'acceptation n'est jamais acquise à la réservation — l'embarquement dépend de l'appareil affecté et de la météo du jour.
      es: "La aceptación nunca es definitiva al reservar: el embarque depende del avión asignado y del clima del día."
      pt: "A aceitação nunca é definitiva na reserva — o embarque depende da aeronave designada e do clima do dia."
  - icon: 🔢
    label:
      en: Two animals maximum
      fr: Deux animaux maximum
      es: Dos animales como máximo
      pt: "Dois animais no máximo"
    value:
      en: Two animals per passenger as accompanied baggage, but only one of them in the hold if another is in the cabin.
      fr: Deux animaux par passager en bagage accompagné, mais un seul en soute si un autre voyage en cabine.
      es: Dos animales por pasajero como equipaje acompañado, pero solo uno en bodega si otro va en cabina.
      pt: "Dois animais por passageiro como bagagem acompanhada, mas apenas um no porão se outro estiver na cabine."
