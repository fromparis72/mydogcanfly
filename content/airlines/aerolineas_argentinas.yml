  cls: ok
  label:
    en: Easy
    fr: Facile
    es: Fácil
    pt: "Fácil"
verdictNote:
  en: Cabin and hold are both open with a fully published fare grid — and flat-faced breeds are accepted in the cabin, which is rare.
  fr: Cabine et soute sont ouvertes, avec une grille tarifaire entièrement publiée — et les brachycéphales sont acceptés en cabine, ce qui est rare.
  es: Cabina y bodega están abiertas, con una tarifa publicada al completo, y las razas de hocico chato se aceptan en cabina, algo poco frecuente.
  pt: "Cabine e porão estão abertos, com tabela de preços totalmente publicada — e raças de focinho achatado são aceitas na cabine, o que é raro."
