id: airline_aerolineas_argentinas
mono: AR
name: Aerolíneas Argentinas
titleH1:
  en: Flying with a dog on Aerolíneas Argentinas
  fr: Voyager avec un chien sur Aerolíneas Argentinas
  es: Volar con un perro en Aerolíneas Argentinas
  pt: "Viajar com um cachorro na Aerolíneas Argentinas"
metaDesc:
  en: "Aerolíneas Argentinas pet policy: 9 kg in the cabin, crate up to 100 × 70 × 80 cm in the hold, flat-faced breeds accepted in the cabin, full published fares."
  fr: "Politique animaux Aerolíneas Argentinas : 9 kg en cabine, caisse jusqu'à 100 × 70 × 80 cm en soute, brachycéphales acceptés en cabine, grille tarifaire complète."
  es: "Política de mascotas de Aerolíneas Argentinas: 9 kg en cabina, jaula de hasta 100 × 70 × 80 cm en bodega, razas de hocico chato aceptadas en cabina, tarifas completas."
  pt: "Política de animais da Aerolíneas Argentinas: 9 kg na cabine, caixa de até 100 × 70 × 80 cm no porão, raças de focinho achatado aceitas na cabine, tarifas completas."
