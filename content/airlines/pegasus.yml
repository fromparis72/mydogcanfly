id: airline_pegasus
mono: PC
name: Pegasus Airlines
titleH1:
  en: Flying with a dog on Pegasus Airlines
  fr: Voyager avec un chien sur Pegasus Airlines
  es: Volar con un perro en Pegasus Airlines
  pt: "Viajar com um cachorro na Pegasus Airlines"
metaDesc:
  en: "Pegasus pet policy: 8 kg in the cabin, hold only on domestic Turkey/North Cyprus flights — never international — and three official pages that name three different breed-ban lists."
  fr: "Politique animaux Pegasus : 8 kg en cabine, soute uniquement sur les vols domestiques Turquie/Chypre du Nord — jamais à l'international — et trois pages officielles qui donnent trois listes de races interdites différentes."
  es: "Política de mascotas de Pegasus: 8 kg en cabina, bodega solo en vuelos nacionales de Turquía/Chipre del Norte — nunca internacionales — y tres páginas oficiales con tres listas distintas de razas prohibidas."
  pt: "Política de animais da Pegasus: 8 kg na cabine, porão apenas em voos domésticos da Turquia/Chipre do Norte — nunca internacionais — e três páginas oficiais com três listas diferentes de raças proibidas."
