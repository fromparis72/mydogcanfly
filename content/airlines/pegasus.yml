verdict:
  cls: warn
  label:
    en: Cabin, domestic hold only
    fr: Cabine, soute domestique seulement
    es: Cabina, bodega solo nacional
    pt: "Cabine, porão só doméstico"
verdictNote:
  en: Cabin travel is open network-wide, but hold (AVIH) is restricted to domestic Turkish and North Cyprus flights only — an international trip with a bigger dog has no hold option on Pegasus at all. The airline's own pages also disagree with each other on the breed list and the banned-country list.
  fr: Le transport en cabine est ouvert sur tout le réseau, mais la soute (AVIH) est réservée aux vols domestiques turcs et vers Chypre du Nord — un trajet international avec un chien plus grand n'a aucune option soute chez Pegasus. Les pages officielles de la compagnie se contredisent aussi entre elles sur la liste de races et la liste de pays interdits.
  es: "El transporte en cabina está abierto en toda la red, pero la bodega (AVIH) se limita a vuelos nacionales turcos y a Chipre del Norte: un viaje internacional con un perro más grande no tiene ninguna opción de bodega con Pegasus. Las propias páginas de la aerolínea también se contradicen entre sí sobre la lista de razas y la lista de países prohibidos."
  pt: "O transporte em cabine está aberto em toda a rede, mas o porão (AVIH) é restrito a voos domésticos turcos e para o Chipre do Norte — uma viagem internacional com um cachorro maior não tem nenhuma opção de porão na Pegasus. As próprias páginas da companhia também discordam entre si sobre a lista de raças e a lista de países proibidos."
