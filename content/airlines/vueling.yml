      reviewer: Codex — contrôle du dossier officiel fret rev2 remis par Philippe
      history: []
      quote: "Nos hemos asociado con Pet Air UK para cuidar de todas las mascotas que salen del Reino Unido."
      quote_language: es
      locator: "section « ¿Vuela con tu mascota desde el Reino Unido? »"
channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Dogs, cats, birds & tortoises ≤ 10 kg incl. carrier in a soft carrier under the seat (max 45 × 39 × 21 cm); 1 per passenger, max 5/flight.
      fr: Chiens, chats, oiseaux et tortues ≤ 10 kg avec le sac dans un sac souple sous le siège (max 45 × 39 × 21 cm) ; 1 par passager, max 5/vol.
      es: Perros, gatos, aves y tortugas ≤ 10 kg con la jaula en una jaula blanda bajo el asiento (máx. 45 × 39 × 21 cm); 1 por pasajero, máx. 5 por vuelo.
      pt: "Cachorros, gatos, aves e tartarugas ≤ 10 kg com a bolsa, em uma bolsa flexível sob o assento (máx. 45 × 39 × 21 cm); 1 por passageiro, máx. 5 por voo."
    fee:
      en: Fly Light fare
      fr: Formule Fly Light
      es: Tarifa Fly Light
      pt: "Tarifa Fly Light"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
