policies:
  cabin:
    # TARIFS OFFICIELS — audit indépendant du 2026-09-10 ; aucune valeur héritée réactivée.
    fares:
      - id: fare_vueling_cabin_eur_2026_09_10
        placement: cabin
        price:
          kind: minimum
          amounts:
            - amount: 50
              currency: EUR
        billing_subject: pet_or_container
        journey_basis: per_segment
        scope_label:
          en: "Domestic Spain; international and Canary"
          fr: "Espagne intérieure ; international et Canaries"
          es: "España nacional; internacional y Canarias"
          pt: "Espanha doméstica; internacional e Canárias"
        source:
          url: https://www.vueling.com/faq/html/ancillary-products.html
          source_type: official_website
          verified_date: 2026-09-10
