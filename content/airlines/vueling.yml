metaDesc:
  en: "Vueling pet policy: cabin pets, no checked-pet hold, and IAG Cargo handling to confirm by route; restrictions and official sources."
  fr: "Politique animaux Vueling : cabine, pas de soute passager et prise en charge IAG Cargo à confirmer selon la route ; sources officielles."
  es: "Política de mascotas de Vueling: cabina, sin bodega de pasajeros y gestión de IAG Cargo por confirmar según la ruta; fuentes oficiales."
  pt: "Política de animais da Vueling: cabine, sem porão de passageiros e transporte IAG Cargo a confirmar conforme a rota; fontes oficiais."
