    weight_limit_bound: lte
    weight_includes_carrier: true
    source:
      url: "https://help.vueling.com/hc/es/articles/19798818168337-Mascotas"
      source_type: official_website
      verified_date: "2026-09-12"
      review_due: "2026-12-11"
      confidence: 4
      reviewer: "Codex — lectura directa de la página nacional oficial"
      history: []
      quote: "Tu mascota deberá volar en un transportín homologado que no sea rígido de medidas máx. 45x39x21 cm y 10 kg (peso máximo con la mascota dentro)"
      quote_language: es
      locator: "Mascotas → primera liste, deuxième puce"
  hold:
    availability: not_offered
    # PREUVE IMPORTÉE — import strict V3 (Codex, lecture directe du 2026-09-08, cohorte F fait 1).
    # Effet attendu : For a large pet dog, do not offer passenger hold. Do not infer a separate cargo service without another official Vueling source.
    # Portée nommée : the official passenger-pet page states that animals cannot be carried in the aircraft cargo hold; it is not a cargo-service statement
    source:
      url: "https://help.vueling.com/hc/en-gb/articles/19798818168337-Fly-with-my-Pet"
      source_type: official_website
      verified_date: "2026-09-08"
      review_due: "2026-12-07"   # reviewDueFrom(verified_date, "airline") — calculé par l'importeur
      confidence: 4
      reviewer: "Codex — lecture directe de la page officielle"
      history: []
      quote: "animals cannot be carried in the plane's cargo hold."
      quote_language: en
      locator: "Fly with my Pet → service features"
  cargo:
    availability: case_by_case
    conditions:
      en: IAG Cargo publishes a pet-handling process for departures from the United Kingdom; carriage on a Vueling-operated route requires confirmation.
      fr: IAG Cargo publie un processus de prise en charge des animaux au départ du Royaume-Uni ; le transport sur une route opérée par Vueling doit être confirmé.
      es: IAG Cargo publica un proceso para mascotas desde el Reino Unido; el transporte en una ruta operada por Vueling debe confirmarse.
      pt: A IAG Cargo publica um processo para animais nas partidas do Reino Unido; o transporte numa rota operada pela Vueling deve ser confirmado.
    source:
      url: https://www.iagcargo.com/es/products/pets/
      source_type: official_website
