fareList:
  rows:
    - label:
        en: Cabin (≤ 10 kg)
        fr: Cabine (≤ 10 kg)
        es: Cabina (≤ 10 kg)
        pt: "Cabine (≤ 10 kg)"
      value:
        en: Fly Light fare (per leg)
        fr: Formule Fly Light (par tronçon)
        es: Tarifa Fly Light (por tramo)
        pt: "Tarifa Fly Light (por trecho)"
    - label:
        en: Hold / IAG Cargo
        fr: Soute / IAG Cargo
        es: Bodega / IAG Cargo
        pt: "Porão / IAG Cargo"
      value:
        en: Hold not carried; cargo to confirm by route
        fr: Soute non transportée ; fret à confirmer selon la route
        es: Bodega no disponible; carga por confirmar según la ruta
        pt: "Porão não transportado; carga a confirmar conforme a rota"
    - label:
        en: Assistance dog
        fr: Chien d'assistance
        es: Perro de asistencia
        pt: "Cão de assistência"
      value:
        en: Free
        fr: Gratuit
        es: Gratis
        pt: "Grátis"
  note:
    en: Vueling requires the Fly Light bundle for a cabin pet and doesn't publish a flat pet price.
    fr: Vueling exige la formule Fly Light pour un animal en cabine et ne publie pas de tarif animal fixe.
    es: Vueling exige la tarifa Fly Light para una mascota en cabina y no publica un precio fijo por mascota.
    pt: "A Vueling exige o pacote Fly Light para um animal na cabine e não publica um preço fixo por animal."
restrictions:
  - icon: 🚫
    title:
      en: Passenger hold unavailable
      fr: Soute passager indisponible
      es: Bodega de pasajeros no disponible
      pt: "Porão de passageiros indisponível"
    pills:
      - cls: no
        label:
          en: No checked-pet hold
          fr: Pas de soute passager
          es: Sin bodega para mascotas
          pt: "Sem porão para animais"
    note:
      en: "Under no circumstances are pets carried in the hold. Prohibited animals: rodents, rabbits, ferrets, birds of prey, fish and reptiles."
      fr: "Les animaux ne sont en aucun cas transportés en soute. Animaux interdits : rongeurs, lapins, furets, rapaces, poissons et reptiles."
      es: "En ningún caso se transportan mascotas en la bodega. Animales prohibidos: roedores, conejos, hurones, aves rapaces, peces y reptiles."
      pt: "Em nenhuma circunstância os animais são transportados no porão. Animais proibidos: roedores, coelhos, furões, aves de rapina, peixes e répteis."
  - icon: 📄
    title:
      en: Health & routes
      fr: Santé & routes
      es: Salud y rutas
      pt: "Saúde e rotas"
    pills:
      - cls: warn
        label:
          en: Microchip + rabies
          fr: Puce + rage
          es: Microchip + rabia
          pt: "Microchip + raiva"
      - cls: no
        label:
          en: Not to UK / Iceland
          fr: Pas UK / Islande
          es: No a Reino Unido / Islandia
          pt: "Não para Reino Unido / Islândia"
    note:
      en: Cats/dogs must be microchipped with rabies vaccination ≥ 21 days before the flight. Pet service is unavailable to/from the UK and Iceland.
      fr: Chats/chiens doivent être pucés avec vaccination antirabique ≥ 21 jours avant le vol. Le service animal est indisponible de/vers le R.-U. et l'Islande.
      es: Los gatos y perros deben llevar microchip y la vacuna antirrábica ≥ 21 días antes del vuelo. El servicio de mascotas no está disponible desde/hacia Reino Unido ni Islandia.
      pt: "Gatos e cachorros devem ter microchip e vacinação antirrábica ≥ 21 dias antes do voo. O serviço de animais não está disponível de/para o Reino Unido e a Islândia."
temperature:
  pills:
    - cls: warn
      label:
        en: Cabin-only — no hold policy
        fr: Cabine seule — pas de soute
        es: Solo cabina — sin norma de bodega
        pt: "Somente cabine — sem norma de porão"
  note:
    en: Vueling carries pets in the cabin only, so no hold-temperature policy applies.
    fr: "Vueling ne transporte les animaux qu'en cabine : aucune règle de température de soute ne s'applique."
    es: Vueling transporta mascotas solo en cabina, por lo que no se aplica ninguna norma de temperatura de bodega.
    pt: "A Vueling transporta animais somente na cabine, portanto nenhuma norma de temperatura de porão se aplica."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: Assistance/guide dogs travel free in the cabin (booked via 'Passenger with Special Needs'), on the floor with a harness.
      fr: Chiens d'assistance/guides gratuits en cabine (via « Passager à besoins spécifiques »), au sol avec un harnais.
      es: Los perros de asistencia/guía viajan gratis en cabina (se reservan mediante «Pasajero con necesidades especiales»), en el suelo con un arnés.
      pt: "Cães de assistência/guia viajam gratuitamente na cabine (reservados via 'Passageiro com Necessidades Especiais'), no chão com um peitoral."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: Official assistance-dog certificate (ADI/IGDF for the UK); min 3 months, microchipped, rabies ≥ 21 days. Notify ≥ 48 h. Emotional-support animals not accepted.
      fr: Certificat officiel de chien d'assistance (ADI/IGDF pour le R.-U.) ; min 3 mois, pucé, rage ≥ 21 jours. Prévenir ≥ 48 h. Chiens de soutien émotionnel non acceptés.
      es: Certificado oficial de perro de asistencia (ADI/IGDF para el Reino Unido); mín. 3 meses, con microchip, rabia ≥ 21 días. Avisa ≥ 48 h. No se aceptan animales de apoyo emocional.
      pt: "Certificado oficial de cão de assistência (ADI/IGDF para o Reino Unido); mín. 3 meses, com microchip, raiva ≥ 21 dias. Avise com ≥ 48 h de antecedência. Animais de apoio emocional não são aceitos."
goodToKnow:
  - icon: 🐾
    label:
      en: Passenger channels
      fr: Canaux passagers
      es: Canales de pasajeros
      pt: "Canais de passageiros"
    value:
      en: Cabin only on passenger tickets; IAG Cargo handling must be confirmed separately.
      fr: Cabine uniquement sur billet passager ; la prise en charge IAG Cargo doit être confirmée séparément.
      es: Solo cabina en billetes de pasajeros; la gestión de IAG Cargo debe confirmarse por separado.
      pt: "Somente cabine nos bilhetes de passageiros; o transporte IAG Cargo deve ser confirmado separadamente."
  - icon: 🚫
    label:
      en: Not to UK / Iceland
      fr: Pas UK / Islande
      es: No a Reino Unido / Islandia
      pt: "Não para Reino Unido / Islândia"
    value:
      en: Pet service is unavailable to/from the UK and Iceland.
      fr: Le service animal est indisponible de/vers le R.-U. et l'Islande.
      es: El servicio de mascotas no está disponible desde/hacia Reino Unido ni Islandia.
      pt: "O serviço de animais não está disponível de/para o Reino Unido e a Islândia."
  - icon: 🎫
    label:
      en: Airport seat
      fr: Siège au comptoir
      es: Asiento en el aeropuerto
      pt: "Assento no aeroporto"
    value:
      en: The seat is assigned at check-in on the day; you fly in a window seat.
      fr: Le siège est attribué à l'enregistrement le jour même ; tu voyages côté hublot.
      es: El asiento se asigna en la facturación el mismo día; viaja en un asiento de ventanilla.
      pt: "O assento é atribuído no check-in no mesmo dia; você viaja na janela."
