      fr: IAG Cargo publie un processus de prise en charge des animaux ; sa disponibilité sur la route Vueling doit être confirmée.
      es: IAG Cargo publica un proceso para mascotas; debe confirmarse su disponibilidad en la ruta de Vueling.
      pt: "A IAG Cargo publica um processo para animais; a disponibilidade na rota da Vueling deve ser confirmada."
