verdictNote:
  en: Small pets in the cabin; no checked-pet hold. IAG Cargo publishes a pet process, but its application to a Vueling route must be confirmed.
  fr: Petits animaux en cabine ; pas de soute passager. IAG Cargo publie un processus animalier, à confirmer pour la route Vueling concernée.
  es: Mascotas pequeñas en cabina; sin bodega de pasajeros. IAG Cargo publica un proceso para animales que debe confirmarse para la ruta de Vueling.
  pt: "Animais pequenos na cabine; sem porão de passageiros. A IAG Cargo publica um processo para animais que deve ser confirmado para a rota da Vueling."
