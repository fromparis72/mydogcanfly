policies:
  cabin:
    availability: offered
  hold:
    availability: offered
  cargo:
    review_state: legacy_unreviewed
channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Dogs & cats only (min 10 weeks) ≤ 8 kg incl. carrier in a soft carrier under the seat (max 45 × 30 × 23 cm); 1 carrier per passenger. Not in long-haul Business.
      fr: Chiens et chats uniquement (min 10 semaines) ≤ 8 kg avec le sac dans un sac souple sous le siège (max 45 × 30 × 23 cm) ; 1 sac par passager. Pas en Business long-courrier.
      es: Solo perros y gatos (mín. 10 semanas) de ≤ 8 kg con la jaula en una jaula blanda bajo el asiento (máx. 45 × 30 × 23 cm); 1 jaula por pasajero. No en Business de largo radio.
      pt: "Somente cachorros e gatos (mín. 10 semanas) ≤ 8 kg com a bolsa em uma bolsa de transporte macia sob o assento (máx. 45 × 30 × 23 cm); 1 bolsa por passageiro. Não em Business de longo curso."
    fee:
      en: €40–170
      fr: 40–170 €
      es: 40–170 €
      pt: "€40–170"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Dogs & cats in a hard carrier; up to 32 kg (to US/Hungary/France/Netherlands) or 45 kg elsewhere. Snub-nosed breeds barred.
      fr: Chiens et chats dans un contenant rigide ; jusqu'à 32 kg (vers USA/Hongrie/France/Pays-Bas) ou 45 kg ailleurs. Races au nez écrasé exclues.
      es: Perros y gatos en una jaula rígida; hasta 32 kg (a EE. UU./Hungría/Francia/Países Bajos) o 45 kg en el resto. Razas de hocico chato excluidas.
      pt: "Cachorros e gatos em uma caixa de transporte rígida; até 32 kg (para EUA/Hungria/França/Países Baixos) ou 45 kg nas demais rotas. Raças de focinho achatado são proibidas."
    fee:
      en: €78–320
      fr: 78–320 €
      es: 78–320 €
      pt: "€78–320"
  - placement: cargo
    icon: ✈️
    name:
      en: TAP Air Cargo
      fr: TAP Air Cargo
      es: TAP Air Cargo
      pt: "TAP Air Cargo"
    cls: warn
    statusLabel:
      en: Via cargo
      fr: Via fret
      es: Vía carga
      pt: "Via carga"
    detail:
      en: Other species, over hold limits, and always on Lisbon–Luanda.
      fr: Autres espèces, au-delà des limites soute, et toujours sur Lisbonne–Luanda.
      es: Otras especies, por encima de los límites de bodega, y siempre en Lisboa–Luanda.
      pt: "Outras espécies, acima dos limites do porão, e sempre na rota Lisboa–Luanda."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
