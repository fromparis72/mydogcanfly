verdict:
  cls: warn
  label:
    en: Moderate
    fr: Modéré
    es: Moderado
    pt: "Moderada"
verdictNote:
  en: Cats & small dogs in the cabin easily, larger in the hold — but many snub-nosed breeds are hold-banned and no pets to the UK.
  fr: Chats et petits chiens facilement en cabine, plus grands en soute — mais de nombreuses races au nez écrasé interdites en soute et rien vers le R.-U.
  es: Gatos y perros pequeños fácilmente en cabina, los más grandes en bodega, pero muchas razas de hocico chato tienen prohibida la bodega y no se admiten mascotas al Reino Unido.
  pt: "Gatos e cachorros pequenos com facilidade na cabine, os maiores no porão — mas muitas raças de focinho achatado têm o porão proibido e não há transporte de animais para o Reino Unido."
