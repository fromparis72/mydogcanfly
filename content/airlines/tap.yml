name: TAP Air Portugal
titleH1:
  en: Flying with a dog on TAP Air Portugal
  fr: Voyager avec un chien sur TAP Air Portugal
  es: Volar con un perro en TAP Air Portugal
  pt: "Viajar com um cachorro na TAP Air Portugal"
metaDesc:
  en: "TAP Air Portugal pet policy: cabin, hold and cargo, fares by zone, snub-nosed hold ban, UK exclusion and official sources."
  fr: "Politique animaux TAP Air Portugal : cabine, soute et fret, tarifs par zone, interdiction soute brachy, exclusion R.-U. et sources officielles."
  es: "Política de mascotas de TAP Air Portugal: cabina, bodega y carga, tarifas por zona, veto braquicéfalo en bodega, exclusión del Reino Unido y fuentes oficiales."
  pt: "Política de animais da TAP Air Portugal: cabine, porão e carga, tarifas por zona, proibição de raças de focinho achatado no porão, exclusão do Reino Unido e fontes."
