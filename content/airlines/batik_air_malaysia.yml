temperature:
  pills:
    - cls: warn
      label:
        en: "Temperature limits: not disclosed"
        fr: "Limites de température : non communiqué"
        es: "Límites de temperatura: no comunicado"
        pt: "Limites de temperatura: não divulgados"
  note:
    en: "The FAQ even has an \"Embargo Period\" category — but it turns out to be about fare/promotion blackout dates, not animal transport. No heat-related pet policy exists, despite Malaysia's tropical climate."
    fr: "La FAQ possède même une catégorie « période d'embargo » — mais il s'agit en réalité de périodes de blackout tarifaire/promotionnel, pas de transport animalier. Aucune politique liée à la chaleur n'existe, malgré le climat tropical de la Malaisie."
    es: "La FAQ incluso tiene una categoría “período de embargo”, pero resulta ser sobre fechas de bloqueo de tarifas/promociones, no sobre el transporte de animales. No existe ninguna política relacionada con el calor, pese al clima tropical de Malasia."
    pt: "A FAQ até tem uma categoria “período de embargo” — mas se refere a datas de bloqueio de tarifas/promoções, não ao transporte de animais. Não existe nenhuma política relacionada ao calor, apesar do clima tropical da Malásia."
assistance:
  - icon: ❓
    label:
      en: Assistance dogs
      fr: Chiens d'assistance
      es: Perros de asistencia
      pt: "Cães de assistência"
    value:
      en: Not published. The dedicated Special Assistance page covers only human mobility, medical fitness-to-fly and wheelchairs — zero mention of service animals, guide dogs or emotional support animals.
      fr: Non publié. La page d'assistance spéciale dédiée ne couvre que la mobilité humaine, l'aptitude médicale à voler et les fauteuils roulants — aucune mention d'animal d'assistance, de chien guide ou de soutien émotionnel.
      es: "No publicado. La página dedicada de asistencia especial solo cubre movilidad humana, aptitud médica para volar y sillas de ruedas: ninguna mención a animales de servicio, perros guía o de apoyo emocional."
      pt: "Não publicado. A página dedicada de assistência especial cobre apenas mobilidade humana, aptidão médica para voar e cadeiras de rodas — nenhuma menção a animais de serviço, cães-guia ou de apoio emocional."
goodToKnow:
  - icon: 🔀
    label:
      en: Still branded "Malindo Air" in places
      fr: Encore de marque « Malindo Air » par endroits
      es: Todavía con la marca “Malindo Air” en algunos lugares
      pt: "Ainda com a marca “Malindo Air” em alguns lugares"
    value:
      en: "The Special Assistance page still reads \"Malindo Air will make its commercially reasonable efforts...\" and every page footer names the legal entity as \"Malindo Airways Sdn Bhd (D.B.A. Trading Name: Batik Air)\" — the pre-rebrand name persists in body copy and legal footers years after the switch to Batik Air branding."
      fr: "La page d'assistance spéciale porte encore la mention « Malindo Air fera tous les efforts commercialement raisonnables... » et le pied de page de chaque page nomme l'entité légale « Malindo Airways Sdn Bhd (nom commercial : Batik Air) » — le nom d'avant le rebranding persiste dans le corps du texte et les mentions légales, des années après le passage à la marque Batik Air."
      es: "La página de asistencia especial todavía dice “Malindo Air hará todos los esfuerzos comercialmente razonables...” y el pie de página de cada página nombra a la entidad legal como “Malindo Airways Sdn Bhd (nombre comercial: Batik Air)”: el nombre previo al cambio de marca persiste en el texto y en los avisos legales, años después del cambio a la marca Batik Air."
      pt: "A página de assistência especial ainda diz “a Malindo Air fará todos os esforços comercialmente razoáveis...” e o rodapé de cada página nomeia a entidade legal como “Malindo Airways Sdn Bhd (nome comercial: Batik Air)” — o nome anterior ao rebranding persiste no texto e nos avisos legais, anos depois da mudança para a marca Batik Air."
  - icon: 🔀
    label:
      en: Easy to confuse with a different airline
      fr: Facile à confondre avec une autre compagnie
      es: Fácil de confundir con otra aerolínea
      pt: "Fácil de confundir com outra companhia"
    value:
      en: "Batik Air Indonesia (a different airline, IATA code ID) has a help article stating it bans pets outright. Searching \"Batik Air pet policy\" can easily surface that Indonesian answer for what is actually a Malaysian airline with no published policy at all — the two share a name but not a fleet, a country, or a website."
      fr: "Batik Air Indonésie (une compagnie différente, code IATA ID) a un article expliquant qu'elle interdit purement les animaux. Chercher « politique animaux Batik Air » peut facilement faire remonter cette réponse indonésienne pour ce qui est en réalité une compagnie malaisienne sans aucune politique publiée — les deux partagent un nom, mais ni flotte, ni pays, ni site web."
      es: "Batik Air Indonesia (una aerolínea distinta, código IATA ID) tiene un artículo de ayuda que declara una prohibición total de mascotas. Buscar “política de mascotas Batik Air” puede fácilmente mostrar esa respuesta indonesia para lo que en realidad es una aerolínea malasia sin ninguna política publicada: ambas comparten nombre, pero no flota, país ni sitio web."
      pt: "A Batik Air Indonésia (uma companhia diferente, código IATA ID) tem um artigo de ajuda que declara uma proibição total de animais. Buscar “política de animais Batik Air” pode facilmente mostrar essa resposta indonésia para o que na verdade é uma companhia malaia sem nenhuma política publicada — as duas compartilham o nome, mas não a frota, o país ou o site."
