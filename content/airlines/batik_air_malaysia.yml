channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: "no"
    statusLabel:
      en: Not published
      fr: Non publié
      es: No publicado
      pt: "Não publicado"
    detail:
      en: No mention of pets exists in the cabin-baggage rules, which otherwise detail sports equipment, musical instruments, strollers and even Zamzam water in depth.
      fr: Aucune mention d'animal dans les règles de bagage cabine, qui détaillent pourtant équipement sportif, instruments de musique, poussettes et même l'eau de Zamzam.
      es: "No hay ninguna mención a mascotas en las normas de equipaje de cabina, que sí detallan equipo deportivo, instrumentos musicales, carritos de bebé e incluso el agua de Zamzam."
      pt: "Não há menção a animais nas regras de bagagem de cabine, que detalham equipamento esportivo, instrumentos musicais, carrinhos de bebê e até a água de Zamzam."
    fee:
      en: Not published
      fr: Non publié
      es: No publicado
      pt: "Não publicado"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: "no"
    statusLabel:
      en: Implied, never described
      fr: Sous-entendu, jamais décrit
      es: Se sugiere, nunca se describe
      pt: "Sugerido, nunca descrito"
    detail:
      en: "The Terms & Conditions disclaim liability for \"live animals if carried as baggage\" — twice, word for word — implying a hold option exists, without ever explaining how to book it, what it costs, or what's required."
      fr: "Les conditions générales excluent la responsabilité pour « les animaux vivants s'ils sont transportés comme bagage » — deux fois, mot pour mot — sous-entendant qu'une option soute existe, sans jamais expliquer comment la réserver, son coût, ni ce qu'elle exige."
      es: "Los términos y condiciones eximen de responsabilidad por “animales vivos si se transportan como equipaje” —dos veces, palabra por palabra— dando a entender que existe una opción de bodega, sin explicar nunca cómo reservarla, su coste ni qué se requiere."
      pt: "Os termos e condições isentam a responsabilidade por “animais vivos se transportados como bagagem” — duas vezes, palavra por palavra — sugerindo que existe uma opção de porão, sem nunca explicar como reservá-la, seu custo ou o que é exigido."
    fee:
      en: Not published
      fr: Non publié
      es: No publicado
      pt: "Não publicado"
  - placement: cargo
    icon: ✈️
    name:
      en: Cargo
      fr: Fret
      es: Carga
      pt: "Carga"
    cls: "no"
    statusLabel:
      en: Not published
      fr: Non publié
      es: No publicado
      pt: "Não publicado"
    detail:
      en: No live-animal cargo page or booking portal exists — the only cargo content found on the site is a general freight fuel-surcharge notice unrelated to animals.
      fr: Aucune page fret animalier ni portail de réservation n'existe — le seul contenu fret trouvé sur le site est un avis général de surcharge carburant, sans rapport avec les animaux.
      es: "No existe ninguna página de carga de animales vivos ni portal de reserva: el único contenido de carga encontrado en el sitio es un aviso general de recargo por combustible, sin relación con los animales."
      pt: "Não existe nenhuma página de carga de animais vivos nem portal de reserva — o único conteúdo de carga encontrado no site é um aviso geral de sobretaxa de combustível, sem relação com animais."
    fee:
      en: Not published
      fr: Non publié
      es: No publicado
      pt: "Não publicado"
