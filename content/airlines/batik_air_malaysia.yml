name: Batik Air Malaysia
titleH1:
  en: Flying with a dog on Batik Air Malaysia
  fr: Voyager avec un chien sur Batik Air Malaisie
  es: Volar con un perro en Batik Air Malaysia
  pt: "Viajar com um cachorro na Batik Air Malaysia"
metaDesc:
  en: "Batik Air Malaysia pet policy: not published anywhere on the official site — no pets page, no FAQ entry, just one liability sentence buried in the legal terms."
  fr: "Politique animaux Batik Air Malaisie : introuvable sur le site officiel — pas de page animaux, pas de FAQ, seulement une phrase de responsabilité légale enfouie dans les conditions générales."
  es: "Política de mascotas de Batik Air Malaysia: no publicada en ningún lugar del sitio oficial — sin página de mascotas, sin entrada en la FAQ, solo una frase de responsabilidad enterrada en los términos legales."
  pt: "Política de animais da Batik Air Malaysia: não publicada em nenhum lugar do site oficial — sem página de animais, sem item na FAQ, apenas uma frase de responsabilidade enterrada nos termos legais."
