verdictNote:
  en: Batik Air Malaysia has no pet-travel page, no pet question in its FAQ, and no pet section in its disability-assistance page. The only trace of animals anywhere on the site is a liability disclaimer for "live animals if carried as baggage" — which implies the service might exist without ever describing it.
  fr: Batik Air Malaisie n'a aucune page dédiée aux animaux, aucune question animaux dans sa FAQ, et aucune section animaux dans sa page d'assistance handicap. La seule trace d'animal sur tout le site est une clause de non-responsabilité pour « les animaux vivants s'ils sont transportés comme bagage » — qui laisse entendre que le service existe peut-être, sans jamais le décrire.
  es: "Batik Air Malasia no tiene ninguna página sobre viajar con mascotas, ninguna pregunta sobre mascotas en su FAQ, y ninguna sección de mascotas en su página de asistencia por discapacidad. El único rastro de animales en todo el sitio es una cláusula de exención de responsabilidad para “animales vivos si se transportan como equipaje”, que da a entender que el servicio podría existir sin describirlo nunca."
  pt: "A Batik Air Malaysia não tem nenhuma página sobre viajar com animais, nenhuma pergunta sobre animais na sua FAQ, e nenhuma seção de animais na página de assistência para deficiência. O único rastro de animais em todo o site é uma cláusula de isenção de responsabilidade para “animais vivos se transportados como bagagem” — que sugere que o serviço talvez exista, sem nunca descrevê-lo."
