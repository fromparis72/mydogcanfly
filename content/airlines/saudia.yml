id: airline_saudia
mono: SV
name: Saudia
titleH1:
  en: Flying with a dog on Saudia
  fr: Voyager avec un chien sur Saudia
  es: Viajar con un perro en Saudia
  pt: "Viajar com um cachorro na Saudia"
metaDesc:
  en: "Saudia pet policy: cats in cabin, dogs in the hold, Saudia Cargo, Saudi import rules and official sources."
  fr: "Politique animaux Saudia : chats en cabine, chiens en soute, Saudia Cargo, règles d'importation saoudiennes et sources officielles."
  es: "Política de mascotas de Saudia: gatos en cabina, perros en bodega, Saudia Cargo, normas de importación saudíes y fuentes oficiales."
  pt: "Política de animais da Saudia: gatos na cabine, cachorros no porão, Saudia Cargo, regras sauditas de importação e fontes oficiais."
chips:
  - icon: ✈
    label:
      en: SkyTeam
      fr: SkyTeam
