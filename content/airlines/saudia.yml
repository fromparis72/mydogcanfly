    cls: ok
verdict:
  cls: no
  label:
    en: Hard
    fr: Difficile
    es: Difícil
    pt: "Difícil"
verdictNote:
  en: Dogs are barred from the cabin (cats allowed); dogs travel in the hold — plus strict Saudi import registration.
  fr: Les chiens sont interdits en cabine (chats admis) ; les chiens voyagent en soute — plus un enregistrement d'importation saoudien strict.
  es: Los perros no pueden viajar en cabina (los gatos sí); los perros viajan en bodega, además de un estricto registro de importación saudí.
  pt: "Cachorros não podem viajar na cabine (gatos são aceitos); os cachorros viajam no porão — além de um registro saudita de importação rigoroso."
