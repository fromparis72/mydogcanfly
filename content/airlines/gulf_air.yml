verdictNote:
  en: Gulf Air refuses pets in the cabin and in the hold — the refusal is written into its conditions of carriage (art. 8.9.3). The only route is cargo, under a master air waybill.
  fr: Gulf Air refuse les animaux en cabine comme en soute — le refus est inscrit à ses conditions de transport (art. 8.9.3). La seule voie possible est le fret, sous lettre de transport aérien mère.
  es: "Gulf Air no admite mascotas ni en cabina ni en bodega: la negativa figura en sus condiciones de transporte (art. 8.9.3). La única vía es la carga, con guía aérea madre."
  pt: "A Gulf Air recusa animais tanto na cabine quanto no porão — a recusa está inscrita nas suas condições de transporte (art. 8.9.3). O único caminho é a carga, com conhecimento aéreo máster."
