    en: Gulf Air publishes no pet rate at all. Everything but the free guide dog goes through a cargo quote.
    fr: Gulf Air ne publie aucun tarif animal. Tout, sauf le chien-guide gratuit, passe par un devis fret.
    es: Gulf Air no publica ninguna tarifa para animales. Todo, salvo el perro guía gratuito, pasa por un presupuesto de carga.
    pt: "A Gulf Air não publica nenhuma tarifa para animais. Tudo, exceto o cão-guia gratuito, passa por uma cotação de carga."
restrictions:
  - icon: 🐶
    title:
      en: Breeds
      fr: Races
      es: Razas
      pt: "Raças"
    pills:
      - cls: warn
        label:
          en: No published list
          fr: Aucune liste publiée
          es: Sin lista publicada
          pt: "Nenhuma lista publicada"
    note:
      en: "Gulf Air publishes no breed list — no snub-nosed ban, no dangerous-dog list. That's not a green light: since no dog travels with a passenger anyway, breed rules are decided by the cargo service and by the countries you fly to and from. Ask when you request your quote."
      fr: "Gulf Air ne publie aucune liste de races — ni interdiction des nez écrasés, ni liste de chiens dangereux. Ce n'est pas un feu vert : comme aucun chien ne voyage avec un passager de toute façon, les règles de race sont fixées par le service fret et par les pays de départ et d'arrivée. Pose la question au moment du devis."
      es: "Gulf Air no publica ninguna lista de razas: ni prohibición de hocicos chatos, ni lista de perros peligrosos. No es luz verde: como ningún perro viaja con un pasajero, las reglas de raza las fijan el servicio de carga y los países de salida y llegada. Pregúntalo al pedir el presupuesto."
      pt: "A Gulf Air não publica nenhuma lista de raças — nem proibição de focinho achatado, nem lista de cães perigosos. Isso não é sinal verde: como nenhum cachorro viaja com passageiro, as regras de raça são definidas pelo serviço de carga e pelos países de origem e destino. Pergunte na hora da cotação."
