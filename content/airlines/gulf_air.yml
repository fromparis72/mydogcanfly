  pills:
    - cls: warn
      label:
        en: "Temperature limits: not disclosed"
        fr: "Limites de température : non communiqué"
        es: "Límites de temperatura: no comunicado"
        pt: "Limites de temperatura: não divulgados"
  note:
    en: Gulf Air publishes no hold-temperature limits or seasonal embargo on its animal pages.
    fr: Gulf Air ne publie pas de limites de température en soute ni d'embargo saisonnier sur ses pages animaux.
    es: Gulf Air no publica límites de temperatura en bodega ni embargo estacional en sus páginas sobre animales.
    pt: "A Gulf Air não publica limites de temperatura no porão nem embargo sazonal em suas páginas sobre animais."
assistance:
  - icon: ✓
    label:
      en: Guide dog
      fr: Chien-guide
      es: Perro guía
      pt: "Cão-guia"
    value:
      en: The guide dog is the one exception — it travels free in the cabin.
      fr: Le chien-guide est la seule exception — il voyage gratuitement en cabine.
      es: "El perro guía es la única excepción: viaja gratis en cabina."
      pt: "O cão-guia é a única exceção — viaja grátis na cabine."
  - icon: 📄
    label:
      en: Conditions
      fr: Conditions
      es: Condiciones
      pt: "Condições"
    value:
      en: "Not published: Gulf Air states the guide-dog conditions are \"available on request\". No documents, no notice period, no breed or training rules are given online — you have to call to find out."
      fr: "Non publiées : Gulf Air indique que les conditions du chien-guide sont « disponibles sur demande ». Aucun document, aucun préavis, aucune règle de dressage n'est donné en ligne — il faut appeler pour les connaître."
      es: "No publicadas: Gulf Air indica que las condiciones del perro guía están «disponibles bajo petición». No da online ningún documento, ni plazo de aviso, ni requisitos de adiestramiento: hay que llamar para saberlo."
      pt: "Não publicadas: a Gulf Air indica que as condições do cão-guia estão \"disponíveis mediante solicitação\". Nenhum documento, prazo de aviso ou regra de adestramento é informado online — é preciso ligar para saber."
goodToKnow:
  - icon: 🦅
    label:
      en: A falcon, yes — a dog, no
      fr: Un faucon oui, un chien non
      es: Un halcón sí, un perro no
      pt: "Um falcão sim, um cachorro não"
    value:
      en: On some routes a falcon may travel in the cabin with 48 hours' notice. Your dog may not. It's the clearest illustration of where the line sits at Gulf Air — the cabin isn't closed to animals as such, it's closed to pets.
      fr: "Sur certaines routes, un faucon peut voyager en cabine avec 48 h de préavis. Ton chien, non. C'est l'illustration la plus nette de la frontière chez Gulf Air : la cabine n'est pas fermée aux animaux en général, elle est fermée aux animaux de compagnie."
      es: "En algunas rutas un halcón puede viajar en cabina avisando con 48 horas. Tu perro no. Es la mejor muestra de dónde está la línea en Gulf Air: la cabina no está cerrada a los animales, está cerrada a las mascotas."
      pt: "Em algumas rotas, um falcão pode viajar na cabine com 48 h de aviso prévio. Seu cachorro, não. É a ilustração mais clara de onde fica a linha na Gulf Air: a cabine não está fechada aos animais em geral, está fechada aos animais de estimação."
  - icon: 🛂
    label:
      en: Shipping from Bahrain
      fr: Expédition depuis Bahreïn
      es: Envío desde Baréin
      pt: "Envio a partir do Bahrein"
    value:
      en: Gulf Air makes this point itself — an animal shipped directly from Bahrain, vaccinated and microchipped, escapes the six-month EU quarantine. Worth checking against the destination country's own rules before you build a plan on it.
      fr: Gulf Air met cet argument en avant — un animal expédié directement depuis Bahreïn, vacciné et pucé, échappe à la quarantaine UE de six mois. À vérifier auprès du pays d'arrivée avant d'en faire ton plan.
      es: "La propia Gulf Air lo destaca: un animal enviado directamente desde Baréin, vacunado y con microchip, se libra de la cuarentena de seis meses de la UE. Conviene contrastarlo con las normas del país de destino antes de basar tu plan en ello."
      pt: "A própria Gulf Air destaca isso: um animal enviado diretamente do Bahrein, vacinado e com microchip, escapa da quarentena de seis meses da UE. Vale confirmar com as regras do país de destino antes de montar seu plano em cima disso."
  - icon: 📦
    label:
      en: What cargo means
      fr: Ce que « fret » implique
      es: Qué implica la carga
      pt: "O que significa ir como carga"
    value:
      en: A master air waybill means a separate booking, a separate terminal and, in practice, a pet shipping agent. Budget several weeks — and get the quote before you buy your own ticket.
      fr: Une lettre de transport aérien mère, cela veut dire une réservation à part, un terminal à part et, en pratique, un agent spécialisé. Compte plusieurs semaines — et obtiens le devis avant d'acheter ton propre billet.
      es: Una guía aérea madre significa reserva aparte, terminal aparte y, en la práctica, un agente especializado. Cuenta varias semanas y consigue el presupuesto antes de comprar tu propio billete.
      pt: "Um conhecimento aéreo máster significa reserva separada, terminal separado e, na prática, um agente especializado. Conte várias semanas — e peça a cotação antes de comprar sua própria passagem."
