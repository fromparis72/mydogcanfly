name: Gulf Air
titleH1:
  en: Flying with a dog on Gulf Air
  fr: Voyager avec un chien sur Gulf Air
  es: Volar con un perro en Gulf Air
  pt: "Viajar com um cachorro na Gulf Air"
metaDesc:
  en: "Gulf Air pet policy: no dogs in the cabin or the hold, cargo only under a master air waybill, guide-dog rules and official sources."
  fr: "Politique animaux Gulf Air : pas de chien en cabine ni en soute, fret uniquement sous lettre de transport aérien mère, chiens-guides et sources officielles."
  es: "Política de mascotas de Gulf Air: ningún perro en cabina ni en bodega, solo carga con guía aérea madre, perros guía y fuentes oficiales."
  pt: "Política de animais da Gulf Air: nenhum cachorro na cabine nem no porão, somente carga com conhecimento aéreo máster, cães-guia e fontes oficiais."
