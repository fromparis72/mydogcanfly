channels:
  - icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: no
    statusLabel:
      en: Not allowed
      fr: Non autorisé
      es: No permitido
      pt: "Não permitido"
    detail:
      en: No dog or cat in the cabin, on any route, at any size. The ban comes from the conditions of carriage (art. 8.9.3), not from a case-by-case decision — there is nothing to negotiate at the counter.
      fr: Aucun chien ni chat en cabine, sur aucune route, quelle que soit la taille. L'interdiction vient des conditions de transport (art. 8.9.3), pas d'une décision au cas par cas — inutile de négocier au comptoir.
      es: "Ningún perro ni gato en cabina, en ninguna ruta y de ningún tamaño. La prohibición viene de las condiciones de transporte (art. 8.9.3), no de una decisión caso por caso: no hay nada que negociar en el mostrador."
      pt: "Nenhum cachorro ou gato na cabine, em nenhuma rota e de nenhum porte. A proibição vem das condições de transporte (art. 8.9.3), não de uma decisão caso a caso — não adianta negociar no balcão."
    fee:
      en: —
      fr: —
      es: —
      pt: "—"
  - icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: no
    statusLabel:
      en: Not allowed
      fr: Non autorisé
      es: No permitido
      pt: "Não permitido"
    detail:
      en: Pets don't travel as checked baggage either. You can't check your dog in with your suitcase — the hold is closed to animals under a passenger ticket.
      fr: Les animaux ne voyagent pas non plus en bagage enregistré. Impossible d'enregistrer ton chien avec ta valise — la soute est fermée aux animaux sous billet passager.
      es: "Las mascotas tampoco viajan como equipaje facturado. No puedes facturar a tu perro junto con la maleta: la bodega está cerrada a los animales bajo billete de pasajero."
      pt: "Os animais também não viajam como bagagem despachada. Você não pode despachar seu cachorro junto com a mala — o porão está fechado para animais sob bilhete de passageiro."
    fee:
      en: —
      fr: —
      es: —
      pt: "—"
  - icon: ✈️
    name:
      en: Cargo
      fr: Fret
      es: Carga
      pt: "Carga"
    cls: warn
    statusLabel:
      en: Only route
      fr: Seule voie
      es: Única vía
      pt: "Único caminho"
    detail:
      en: Your dog flies as freight, under a master air waybill, on a booking separate from yours. You go through the cargo terminal, not the passenger terminal, and usually through an agent. Gulf Air publishes no rate, no weight limit and no crate dimensions for this channel.
      fr: Ton chien voyage en fret, sous lettre de transport aérien mère, sur une réservation distincte de la tienne. Tu passes par le terminal cargo, pas par l'aérogare passagers, et le plus souvent par un agent. Gulf Air ne publie ni tarif, ni limite de poids, ni dimensions de caisse pour ce canal.
      es: Tu perro vuela como mercancía, con guía aérea madre y en una reserva distinta de la tuya. Pasas por la terminal de carga, no por la de pasajeros, y normalmente a través de un agente. Gulf Air no publica tarifa, ni límite de peso, ni dimensiones de jaula para este canal.
      pt: "Seu cachorro viaja como carga, com conhecimento aéreo máster, em uma reserva separada da sua. Você passa pelo terminal de carga, não pelo terminal de passageiros, e em geral por meio de um agente. A Gulf Air não publica tarifa, nem limite de peso, nem dimensões de caixa para esse canal."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
