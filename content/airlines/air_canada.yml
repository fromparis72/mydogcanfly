verdictNote:
  en: Cabin for small pets and hold for larger dogs — but heavy seasonal, aircraft and breed restrictions.
  fr: Cabine pour petits animaux et soute pour grands chiens — mais fortes restrictions saisonnières, avion et races.
  es: Cabina para mascotas pequeñas y bodega para perros más grandes — pero fuertes restricciones estacionales, de aeronave y de razas.
  pt: "Cabine para animais pequenos e porão para cachorros maiores — mas com fortes restrições sazonais, de aeronave e de raça."
