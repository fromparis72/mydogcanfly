channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: One cat or small dog in a soft carrier under the seat; not in Premium Economy or exit rows. Soft-sided only since June 2025.
      fr: Un chat ou petit chien dans un sac souple sous le siège ; pas en Économique Privilège ni rangs d'issue. Sac souple uniquement depuis juin 2025.
      es: Un gato o perro pequeño en una jaula blanda bajo el asiento; no en Económica Premium ni en filas de salida. Solo jaulas blandas desde junio de 2025.
      pt: "Um gato ou cachorro pequeno em uma bolsa de transporte flexível sob o assento; não disponível na Premium Economy nem nas fileiras de saída de emergência. Somente bolsas flexíveis desde junho de 2025."
    fee:
      en: $50–120
      fr: 50–120 $
      es: 50–120 $
      pt: "50–120 $"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Cats & dogs as checked baggage (pet + kennel ≤ 45 kg) in the pressurised hold — subject to heavy seasonal and aircraft limits.
      fr: Chats et chiens en bagage enregistré (animal + caisse ≤ 45 kg) dans la soute pressurisée — sous fortes limites saisonnières et avion.
      es: Gatos y perros como equipaje facturado (mascota + jaula ≤ 45 kg) en la bodega presurizada — sujeto a fuertes límites estacionales y de aeronave.
      pt: "Gatos e cachorros como bagagem despachada (animal + caixa ≤ 45 kg) no porão pressurizado — sujeitos a fortes limites sazonais e de aeronave."
    fee:
      en: $105–324
      fr: 105–324 $
      es: 105–324 $
      pt: "105–324 $"
  - placement: cargo
    icon: ✈️
    name:
      en: AC Animals cargo
      fr: Fret AC Animals
      es: Carga AC Animals
      pt: "Carga AC Animals"
    cls: warn
    statusLabel:
      en: On request
      fr: Sur devis
      es: Bajo petición
      pt: "Sob consulta"
    detail:
      en: Unaccompanied pets, oversize kennels, more than 2 pets, or winter transport. Drop-off at a cargo facility.
      fr: Animaux non accompagnés, caisses hors gabarit, plus de 2 animaux, ou transport hivernal. Dépôt à un centre de fret.
      es: Mascotas no acompañadas, jaulas fuera de medidas, más de 2 mascotas o transporte invernal. Entrega en un centro de carga.
      pt: "Animais desacompanhados, caixas fora do tamanho, mais de 2 animais, ou transporte no inverno. Entrega em uma instalação de carga."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
