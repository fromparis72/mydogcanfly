restrictions:
  - icon: 🐶
    title:
      en: Flat-faced breeds
      fr: Races brachycéphales
      es: Razas de hocico chato
      pt: "Raças de focinho achatado"
    pills:
      - cls: ok
        label:
          en: Cabin possible
          fr: Cabine possible
          es: Cabina posible
          pt: "Cabine possível"
      - cls: no
        label:
          en: Hold/cargo forbidden
          fr: Soute/fret interdits
          es: Bodega/carga prohibidos
          pt: "Porão/carga proibidos"
    note:
      en: "Snub-nosed dogs & cats are permanently embargoed from the hold and cargo (since 2015, heat/breathing risk): pugs, bulldogs, Pekingese and other snub-nosed breeds. They may still fly in the cabin if small enough. Wolf-dogs aren't carried."
      fr: "Chiens et chats au nez écrasé sous embargo permanent en soute et en fret (depuis 2015, risque chaleur/respiration) : carlins, bouledogues, pékinois et autres races au nez écrasé. Ils peuvent voyager en cabine s'ils sont assez petits. Les chiens-loups ne sont pas transportés."
      es: "Los perros y gatos de hocico chato están permanentemente vetados de la bodega y la carga (desde 2015, riesgo de calor/respiración): carlinos, bulldogs, pekineses y otras razas de hocico chato. Aún pueden volar en cabina si son lo bastante pequeños. Los perros lobo no se transportan."
      pt: "Cachorros e gatos de focinho achatado estão permanentemente sob embargo no porão e na carga (desde 2015, risco de calor/respiração): pugs, bulldogues, pequinês e outras raças de focinho achatado. Ainda podem voar na cabine se forem pequenos o suficiente. Lobos-cães não são transportados."
  - icon: 🚫
    title:
      en: Other rules
      fr: Autres règles
      es: Otras reglas
      pt: "Outras regras"
    pills:
      - cls: warn
        label:
          en: Sedation not advised
          fr: Sédation déconseillée
          es: Sedación desaconsejada
          pt: "Sedação não recomendada"
      - cls: warn
        label:
          en: Reinforced crate for strong breeds
          fr: Caisse renforcée pour races fortes
          es: Jaula reforzada para razas fuertes
          pt: "Caixa reforçada para raças fortes"
    note:
      en: Sedation isn't recommended. Certain 'strong dog' breeds must travel in a reinforced non-plastic crate (wood/metal/wire mesh) in the hold.
      fr: La sédation n'est pas recommandée. Certaines races de « chiens puissants » doivent voyager en soute dans une caisse renforcée non plastique (bois/métal/grillage).
      es: No se recomienda la sedación. Ciertas razas de «perros fuertes» deben viajar en la bodega en una jaula reforzada no plástica (madera/metal/malla metálica).
      pt: "A sedação não é recomendada. Certas raças de \"cachorros fortes\" devem viajar em uma caixa reforçada e não plástica (madeira/metal/tela de arame) no porão."
temperature:
  pills:
    - cls: no
      label:
        en: Summer refusal above 29.5 °C
        fr: Refus été au-dessus de 29,5 °C
        es: Rechazo en verano por encima de 29,5 °C
        pt: "Recusa no verão acima de 29,5 °C"
    - cls: no
      label:
        en: Winter limits · Dec 18–Jan 4 embargo
        fr: Limites hiver · embargo 18 déc–4 jan
        es: Límites de invierno · embargo 18 dic–4 ene
        pt: "Limites de inverno · embargo de 18 de dez. a 4 de jan."
  note:
    en: Hold travel may be refused above 29.5 °C (85 °F); country-specific summer embargoes apply (US 1 May–30 Nov, Mexico Jul–Aug). In winter (1 Nov–31 Mar or ≤ 0 °C) pets under 4.5 kg aren't accepted in the hold, and no hold/cargo pets travel 18 Dec–4 Jan. Some aircraft holds are unheated.
    fr: La soute peut être refusée au-dessus de 29,5 °C (85 °F) ; des embargos d'été s'appliquent selon les pays (USA 1er mai–30 nov., Mexique juil.–août). En hiver (1er nov.–31 mars ou ≤ 0 °C), les animaux de moins de 4,5 kg sont refusés en soute, et aucun animal en soute/fret ne voyage du 18 déc. au 4 jan. Certaines soutes ne sont pas chauffées.
    es: El viaje en bodega puede rechazarse por encima de 29,5 °C (85 °F); se aplican embargos de verano según el país (EE. UU. 1 may–30 nov, México jul–ago). En invierno (1 nov–31 mar o ≤ 0 °C) las mascotas de menos de 4,5 kg no se aceptan en bodega, y ninguna mascota viaja en bodega/carga del 18 dic al 4 ene. Algunas bodegas de aeronaves no están calefactadas.
    pt: "O transporte no porão pode ser recusado acima de 29,5 °C (85 °F); aplicam-se embargos de verão específicos por país (EUA de 1º de maio a 30 de nov., México em jul.–ago.). No inverno (1º de nov. a 31 de mar. ou ≤ 0 °C), animais com menos de 4,5 kg não são aceitos no porão, e nenhum animal viaja no porão/carga de 18 de dez. a 4 de jan. Alguns porões de aeronaves não são aquecidos."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: Individually trained service dogs travel free in the cabin.
      fr: Les chiens d'assistance dressés individuellement voyagent gratuitement en cabine.
      es: Los perros de servicio adiestrados individualmente viajan gratis en cabina.
      pt: "Cães de serviço treinados individualmente viajam grátis na cabine."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: "Submit the service-dog form to accessible@aircanada.ca ≥ 48 h ahead (US routes: DOT form). Emotional-support dogs no longer qualify."
      fr: "Envoyer le formulaire chien d'assistance à accessible@aircanada.ca ≥ 48 h à l'avance (vols USA : formulaire DOT). Chiens de soutien émotionnel non éligibles."
      es: "Envía el formulario de perro de servicio a accessible@aircanada.ca con ≥ 48 h de antelación (rutas a EE. UU.: formulario DOT). Los perros de apoyo emocional ya no reúnen los requisitos."
      pt: "Envie o formulário de cão de serviço para accessible@aircanada.ca com ≥ 48 h de antecedência (rotas para os EUA: formulário do DOT). Cães de apoio emocional não são mais elegíveis."
goodToKnow:
  - icon: 🧳
    label:
      en: Soft carriers only
      fr: Sacs souples seuls
      es: Solo jaulas blandas
      pt: "Somente bolsas flexíveis"
    value:
      en: Since June 2025, cabin pets must be in soft-sided carriers — hard kennels are no longer accepted in the cabin.
      fr: Depuis juin 2025, les animaux en cabine doivent être en sac souple — les caisses rigides ne sont plus acceptées en cabine.
      es: Desde junio de 2025, las mascotas en cabina deben ir en jaulas blandas — las jaulas rígidas ya no se aceptan en cabina.
      pt: "Desde junho de 2025, os animais em cabine devem estar em bolsas de transporte flexíveis — caixas rígidas não são mais aceitas na cabine."
  - icon: 🔁
    label:
      en: No codeshares
      fr: Pas de codeshare
      es: Sin código compartido
      pt: "Sem codeshare"
    value:
      en: Pets can't travel on flights operated by other airlines; Premium Economy has no cabin pets.
      fr: Les animaux ne voyagent pas sur les vols opérés par d'autres compagnies ; pas d'animaux en Économique Privilège.
      es: Las mascotas no pueden viajar en vuelos operados por otras aerolíneas; Económica Premium no admite mascotas en cabina.
      pt: "Animais não podem viajar em voos operados por outras companhias; a Premium Economy não aceita animais na cabine."
  - icon: ⏱️
    label:
      en: Check-in
      fr: Enregistrement
      es: Facturación
      pt: "Check-in"
    value:
      en: Pets must be 10 weeks+; check in with an agent (no online or kiosk check-in).
      fr: Animaux de 10 semaines+ ; enregistrement auprès d'un agent (ni en ligne ni borne).
      es: Las mascotas deben tener 10 semanas o más; factura con un agente (no en línea ni en quiosco).
      pt: "Os animais devem ter 10 semanas ou mais; o check-in é feito com um agente (sem check-in on-line ou em totem)."
