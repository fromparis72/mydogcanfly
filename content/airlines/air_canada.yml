  es: "Política de mascotas de Air Canada: cabina, bodega y carga AC Animals, tarifas, embargos estacionales por temperatura, límites de razas y fuentes oficiales."
  pt: "Política de animais da Air Canada: cabine, porão e carga AC Animals, tarifas, embargos sazonais de temperatura, limites de raça e fontes oficiais."
