    en: Possible
    fr: Sous conditions
    es: Con condiciones
    pt: "Com condições"
verdictNote:
  en: Cabin and hold are both open, with a comparatively generous 10 kg cabin cap and no stated hold weight ceiling — but Neos publishes no heat or seasonal embargo despite flying long-haul to some of the hottest leisure destinations in its own network.
  fr: Cabine et soute sont ouvertes, avec un plafond cabine plutôt généreux de 10 kg et aucune limite de poids soute annoncée — mais Neos ne publie aucun embargo chaleur ou saisonnier, alors qu'elle dessert en long-courrier certaines des destinations loisirs les plus chaudes de son réseau.
  es: "Cabina y bodega están abiertas, con un límite de cabina comparativamente generoso de 10 kg y sin techo de peso declarado para la bodega — pero Neos no publica ningún embargo por calor o estacional, pese a volar de largo radio a algunos de los destinos de ocio más calurosos de su propia red."
  pt: "Cabine e porão estão abertos, com um limite de cabine comparativamente generoso de 10 kg e sem teto de peso declarado para o porão — mas a Neos não publica nenhum embargo por calor ou sazonal, apesar de voar de longo curso para alguns dos destinos de lazer mais quentes da própria rede."
