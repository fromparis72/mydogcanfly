name: Neos
titleH1:
  en: Flying with a dog on Neos
  fr: Voyager avec un chien sur Neos
  es: Volar con un perro en Neos
  pt: "Viajar com um cachorro na Neos"
metaDesc:
  en: "Neos pet policy: 10 kg in the cabin, hold with no published upper weight limit — and no heat policy at all for a leisure carrier flying to the Maldives and Zanzibar."
  fr: "Politique animaux Neos : 10 kg en cabine, soute sans limite de poids publiée — et aucune politique de chaleur chez ce voyagiste qui vole vers les Maldives et Zanzibar."
  es: "Política de mascotas de Neos: 10 kg en cabina, bodega sin límite de peso publicado — y sin ninguna política de calor en esta aerolínea de ocio que vuela a Maldivas y Zanzíbar."
  pt: "Política de animais da Neos: 10 kg na cabine, porão sem limite de peso publicado — e sem nenhuma política de calor nesta companhia de lazer que voa para Maldivas e Zanzibar."
