name: SWISS
titleH1:
  en: Flying with a dog on SWISS
  fr: Voyager avec un chien sur SWISS
  es: Volar con un perro en SWISS
  pt: "Viajar com um cachorro na SWISS"
metaDesc:
  en: "SWISS pet policy: cabin, air-conditioned hold and Swiss WorldCargo rules, fares by zone, breed limits and official sources."
  fr: "Politique animaux SWISS : cabine, soute climatisée et Swiss WorldCargo, tarifs par zone, restrictions de races et sources officielles."
  es: "Política de mascotas de SWISS: cabina, bodega climatizada y normas de Swiss WorldCargo, tarifas por zona, restricciones de razas y fuentes oficiales."
  pt: "Política de animais da SWISS: cabine, porão com ar-condicionado e regras da Swiss WorldCargo, tarifas por zona, limites por raça e fontes oficiais."
