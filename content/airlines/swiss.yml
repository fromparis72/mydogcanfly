verdictNote:
  en: Cats & small dogs in the cabin or air-conditioned hold — snub-nosed breeds cabin-only, paperwork required.
  fr: Chats et petits chiens en cabine ou en soute climatisée — races au nez écrasé en cabine seulement, formalités requises.
  es: Gatos y perros pequeños en cabina o bodega climatizada; las razas braquicéfalas solo en cabina, con documentación obligatoria.
  pt: "Gatos e cachorros pequenos na cabine ou no porão com ar-condicionado — raças de focinho achatado somente na cabine, documentação obrigatória."
