name: Etihad Airways
titleH1:
  en: Flying with a dog on Etihad Airways
  fr: Voyager avec un chien sur Etihad Airways
  es: Volar con un perro en Etihad Airways
  pt: "Voar com um cachorro na Etihad Airways"
metaDesc:
  en: "Etihad Airways pet policy: cabin pets to/from Abu Dhabi, Etihad Cargo, fares, breed limits and official sources."
  fr: "Politique animaux Etihad Airways : cabine de/vers Abu Dhabi, Etihad Cargo, tarifs, restrictions de races et sources officielles."
  es: "Política de mascotas de Etihad Airways: mascotas en cabina hacia/desde Abu Dabi, Etihad Cargo, tarifas, límites de raza y fuentes oficiales."
  pt: "Política de animais da Etihad Airways: animais em cabine de/para Abu Dhabi, Etihad Cargo, tarifas, limites de raça e fontes oficiais."
