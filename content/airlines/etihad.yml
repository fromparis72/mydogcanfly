policies:
  cabin:
    availability: offered
  hold:
    availability: not_offered
  cargo:
    review_state: legacy_unreviewed
channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Small cats & dogs (min. 16 weeks, ≤ 8 kg incl. carrier) under the seat, to/from Abu Dhabi; falcons too. Many route exclusions.
      fr: Petits chats et chiens (min. 16 semaines, ≤ 8 kg avec sac) sous le siège, de/vers Abu Dhabi ; faucons aussi. Nombreuses exclusions de routes.
      es: Perros y gatos pequeños (mín. 16 semanas, ≤ 8 kg con jaula) bajo el asiento, hacia/desde Abu Dabi; también halcones. Muchas rutas excluidas.
      pt: "Gatos e cachorros pequenos (mín. 16 semanas, ≤ 8 kg com a bolsa) embaixo do assento, de/para Abu Dhabi; falcões também. Muitas rotas excluídas."
    fee:
      en: $399
      fr: 399 $
      es: 399 $
      pt: "US$ 399"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: no
    statusLabel:
      en: Not allowed
      fr: Non autorisé
      es: No permitido
      pt: "Não permitido"
    detail:
      en: "Cats & dogs aren't carried as checked baggage (falcons are, at a per-cage fare). Service dogs fly in the cabin."
      fr: "Chats et chiens non transportés en bagage enregistré (les faucons le sont, à un tarif par cage). Les chiens d'assistance voyagent en cabine."
      es: "Perros y gatos no se transportan como equipaje facturado (los halcones sí, con una tarifa por jaula). Los perros de servicio viajan en cabina."
      pt: "Gatos e cachorros não são transportados como bagagem despachada (falcões são, com tarifa por caixa). Cães de assistência viajam na cabine."
    fee:
      en: —
      fr: —
      es: —
      pt: "—"
  - placement: cargo
    icon: ✈️
    name:
      en: Etihad Cargo
      fr: Etihad Cargo
      es: Etihad Cargo
      pt: "Etihad Cargo"
    cls: warn
    statusLabel:
      en: On request
      fr: Sur devis
      es: Bajo petición
      pt: "Sob consulta"
    detail:
      en: Cats, dogs & small pets in climate-controlled, pressurised holds via Etihad Cargo LiveAnimals.
      fr: Chats, chiens et petits animaux dans des soutes climatisées et pressurisées via Etihad Cargo LiveAnimals.
      es: Perros, gatos y mascotas pequeñas en bodegas climatizadas y presurizadas por Etihad Cargo LiveAnimals.
      pt: "Gatos, cachorros e animais pequenos em porões climatizados e pressurizados pela Etihad Cargo LiveAnimals."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
