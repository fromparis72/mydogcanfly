verdict:
  cls: warn
  label:
    en: Moderate
    fr: Modéré
    es: Moderado
    pt: "Moderada"
verdictNote:
  en: Small cats, dogs & falcons fly in the cabin to/from Abu Dhabi — but many routes are excluded.
  fr: Petits chats, chiens et faucons en cabine de/vers Abu Dhabi — mais de nombreuses routes sont exclues.
  es: Perros, gatos y halcones pequeños viajan en cabina hacia/desde Abu Dabi, pero muchas rutas quedan excluidas.
  pt: "Gatos, cachorros e falcões pequenos voam na cabine de/para Abu Dhabi — mas muitas rotas ficam de fora."
