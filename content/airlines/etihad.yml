restrictions:
  - icon: 🐶
    title:
      en: Flat-faced breeds
      fr: Races brachycéphales
      es: Razas de hocico chato
      pt: "Raças de focinho achatado"
    pills:
      - cls: warn
        label:
          en: "Cargo: seasonal only"
          fr: "Fret : saisonnier"
          es: "Carga: solo estacional"
          pt: "Carga: somente sazonal"
    note:
      en: The cabin sets no snub-nosed rule; via Etihad Cargo, brachycephalic breeds are accepted only seasonally (1 Nov–1 Mar) with extra checks and Live Animals approval.
      fr: La cabine ne fixe pas de règle nez écrasé ; via Etihad Cargo, les races brachycéphales ne sont acceptées qu'en saison (1er nov.–1er mars) avec contrôles supplémentaires et accord Live Animals.
      es: La cabina no fija normas de hocico chato; por Etihad Cargo, las razas braquicéfalas solo se aceptan en temporada (1 nov–1 mar) con controles adicionales y aprobación de Live Animals.
      pt: "A cabine não define regra sobre focinho achatado; pela Etihad Cargo, as raças braquicefálicas são aceitas apenas na temporada (1º nov.–1º mar.) com verificações extras e aprovação do Live Animals."
  - icon: 🚫
    title:
      en: Banned breeds
      fr: Races interdites
      es: Razas vetadas
      pt: "Raças proibidas"
    pills:
      - cls: no
        label:
          en: Not accepted
          fr: Refusées
          es: No aceptadas
          pt: "Não aceitas"
      - cls: warn
        label:
          en: No pregnancy
          fr: Pas de gestation
          es: Sin gestación
          pt: "Sem gestação"
    note:
      en: Pit bull, American Staffordshire, American Bully, Fila Brasileiro, Dogo Argentino, mastiffs, Tosa, Rottweiler, Doberman, Presa Canario, boxer & hybrids aren't accepted. Sedation only under veterinary supervision; pregnant pets refused.
      fr: Pit-bull, American Staffordshire, American Bully, Fila Brasileiro, Dogo Argentino, mastiffs, Tosa, Rottweiler, Doberman, Presa Canario, boxer et croisés refusés. Sédation uniquement sous contrôle vétérinaire ; animaux gestants refusés.
      es: Pit bull, American Staffordshire, American Bully, fila brasileiro, dogo argentino, mastines, tosa, rottweiler, doberman, presa canario, bóxer y cruces no se aceptan. Sedación solo bajo supervisión veterinaria; no se admiten mascotas gestantes.
      pt: "Pit bull, American Staffordshire, American Bully, Fila Brasileiro, Dogo Argentino, mastins, Tosa, Rottweiler, Doberman, Presa Canario, boxer e cruzas não são aceitos. Sedação somente sob supervisão veterinária; animais gestantes são recusados."
temperature:
  pills:
    - cls: ok
      label:
        en: Climate-controlled, pressurised (cargo)
        fr: Climatisée, pressurisée (fret)
        es: Climatizada y presurizada (carga)
        pt: "Climatizado e pressurizado (carga)"
    - cls: warn
      label:
        en: "Cabin temperature: not disclosed"
        fr: "Température cabine : non communiqué"
        es: "Temperatura de cabina: no divulgada"
        pt: "Temperatura da cabine: não divulgada"
  note:
    en: Etihad Cargo LiveAnimals uses climate-controlled, pressurised hold compartments, with maximum pet transport time extended to 24 h. No numeric temperature limit is published.
    fr: Etihad Cargo LiveAnimals utilise des compartiments de soute climatisés et pressurisés, avec une durée de transport portée à 24 h maximum. Aucune limite chiffrée de température n'est publiée.
    es: Etihad Cargo LiveAnimals usa compartimentos de bodega climatizados y presurizados, con un tiempo máximo de transporte ampliado a 24 h. No se publica ningún límite numérico de temperatura.
    pt: "A Etihad Cargo LiveAnimals usa compartimentos de porão climatizados e pressurizados, com tempo máximo de transporte ampliado para 24 h. Nenhum limite numérico de temperatura é divulgado."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: One trained service dog free (two from the US); ADI/IGDF certification required (not on direct US flights).
      fr: Un chien d'assistance dressé gratuit (deux depuis les USA) ; certification ADI/IGDF requise (sauf vols directs USA).
      es: Un perro de servicio adiestrado gratis (dos desde EE. UU.); se exige certificación ADI/IGDF (salvo en vuelos directos a EE. UU.).
      pt: "Um cão de assistência adestrado viaja de graça (dois a partir dos EUA); é exigida certificação ADI/IGDF (exceto em voos diretos para os EUA)."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: "Book via form + call ≥ 48 h ahead. US: DOT forms + CDC Dog Import Form. Not permitted from China."
      fr: "Réserver via le formulaire + appeler ≥ 48 h à l'avance. USA : formulaires DOT + CDC Dog Import Form. Interdit au départ de Chine."
      es: "Reserva con el formulario + llama ≥ 48 h antes. EE. UU.: formularios DOT + CDC Dog Import Form. No permitido desde China."
      pt: "Reserve pelo formulário + ligue com ≥ 48 h de antecedência. EUA: formulários do DOT + CDC Dog Import Form. Não permitido saindo da China."
goodToKnow:
  - icon: 🚫
    label:
      en: Route exclusions
      fr: Routes exclues
      es: Rutas excluidas
      pt: "Rotas excluídas"
    value:
      en: "Pets banned on many routes: USA, London, Manchester, Sydney, Bali, Hong Kong, Malé, Johannesburg."
      fr: "Animaux interdits sur de nombreuses routes : USA, Londres, Manchester, Sydney, Bali, Hong Kong, Malé, Johannesburg."
      es: "Mascotas vetadas en muchas rutas: EE. UU., Londres, Mánchester, Sídney, Bali, Hong Kong, Malé, Johannesburgo."
      pt: "Animais proibidos em muitas rotas: EUA, Londres, Manchester, Sydney, Bali, Hong Kong, Malé, Joanesburgo."
  - icon: 🧳
    label:
      en: Carrier size
      fr: Taille du sac
      es: Tamaño de la jaula
      pt: "Tamanho da bolsa de transporte"
    value:
      en: Under-seat carrier max 40 × 40 × 22 cm (50 × 43 × 50 cm with an extra seat).
      fr: Sac sous le siège max 40 × 40 × 22 cm (50 × 43 × 50 cm avec un siège supplémentaire).
      es: Jaula bajo el asiento máx. 40 × 40 × 22 cm (50 × 43 × 50 cm con un asiento extra).
      pt: "Bolsa para debaixo do assento com no máx. 40 × 40 × 22 cm (50 × 43 × 50 cm com um assento extra)."
  - icon: 🐾
    label:
      en: Two pets
      fr: Deux animaux
      es: Dos mascotas
      pt: "Dois animais"
    value:
      en: Two pets only if from the same household and known to each other, each with its own form.
      fr: Deux animaux seulement s'ils sont du même foyer et se connaissent, chacun avec son propre formulaire.
      es: Dos mascotas solo si son del mismo hogar y se conocen entre sí, cada una con su propio formulario.
      pt: "Dois animais somente se forem do mesmo domicílio e se conhecerem entre si, cada um com seu próprio formulário."
