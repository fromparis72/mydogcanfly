    # Effet attendu : For a dog above 8 kg, do not offer the Etihad cabin. At or below 8 kg, do not infer acceptance from the threshold alone.
    # Portée nommée : the 8 kg ceiling includes the carrier; a dog alone over 8 kg cannot satisfy the cabin rule. Etihad-operated flight, eligible route, documents and advance approval remain required.
