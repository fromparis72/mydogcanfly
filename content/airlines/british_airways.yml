name: British Airways
titleH1:
  en: Flying with a dog on British Airways
  fr: Voyager avec un chien sur British Airways
  es: Viajar con perro en British Airways
  pt: "Viajar com um cachorro pela British Airways"
metaDesc:
  en: "British Airways pet policy: cargo-only via IAG Cargo, cabin assistance dogs, restrictions and official sources."
  fr: "Politique animaux British Airways : fret uniquement via IAG Cargo, chiens d'assistance en cabine, restrictions et sources officielles."
  es: "Política de mascotas de British Airways: solo carga mediante IAG Cargo, perros de asistencia en cabina, restricciones y fuentes oficiales."
  pt: "Política de animais da British Airways: somente via carga pela IAG Cargo, cães de assistência na cabine, restrições e fontes oficiais."
