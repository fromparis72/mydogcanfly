    es: Difícil
    pt: "Difícil"
verdictNote:
  en: No pets in the cabin or as checked baggage — only via IAG Cargo, plus assistance dogs in the cabin.
  fr: Pas d'animaux en cabine ni en bagage enregistré — uniquement via IAG Cargo, plus les chiens d'assistance en cabine.
  es: No se admiten mascotas en cabina ni como equipaje facturado, solo mediante IAG Cargo, además de perros de asistencia en cabina.
  pt: "Nenhum animal na cabine nem como bagagem despachada — somente via IAG Cargo, além dos cães de assistência na cabine."
