channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Small dogs, cats, rabbits & birds in a soft carrier under the seat (max 17 × 11 × 9.5 in). First-come, first-served.
      fr: Petits chiens, chats, lapins et oiseaux dans un sac souple sous le siège (max 17 × 11 × 9,5 po). Premier arrivé, premier servi.
      es: Perros pequeños, gatos, conejos y aves en una jaula blanda bajo el asiento (máx. 17 × 11 × 9,5 in). Por orden de llegada.
      pt: "Cachorros pequenos, gatos, coelhos e aves em uma bolsa de transporte flexível embaixo do assento (máx. 17 × 11 × 9,5 pol.). Por ordem de chegada."
    fee:
      en: $100 / way
      fr: 100 $ / trajet
      es: 100 $ / trayecto
      pt: "$100 / trajeto"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Larger pets in the climate-controlled baggage hold on your flight (pet + carrier ≤ 150 lb). Health certificate required.
      fr: Animaux plus grands dans la soute bagages climatisée sur ton vol (animal + caisse ≤ 150 lb). Certificat sanitaire requis.
      es: Mascotas más grandes en la bodega de equipaje climatizada de tu vuelo (mascota + jaula ≤ 150 lb). Se requiere certificado sanitario.
      pt: "Animais maiores no porão de bagagem climatizado do seu voo (animal + caixa de transporte ≤ 150 lb). É exigido atestado de saúde."
    fee:
      en: $150 / way
      fr: 150 $ / trajet
      es: 150 $ / trayecto
      pt: "US$ 150 / trajeto"
  - placement: cargo
    icon: ✈️
    name:
      en: Pet Connect cargo
      fr: Fret Pet Connect
      es: Carga Pet Connect
      pt: "Carga Pet Connect"
    cls: warn
    statusLabel:
      en: On request
      fr: Sur devis
      es: Bajo presupuesto
      pt: "Sob consulta"
    detail:
      en: Unaccompanied pets or over 150 lb, via Alaska Air Cargo Pet Connect.
      fr: Animaux non accompagnés ou de plus de 150 lb, via Alaska Air Cargo Pet Connect.
      es: Mascotas no acompañadas o de más de 150 lb, mediante Alaska Air Cargo Pet Connect.
      pt: "Animais desacompanhados ou com mais de 150 lb, via Alaska Air Cargo Pet Connect."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
