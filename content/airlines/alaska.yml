  fr: "Politique animaux Alaska Airlines : cabine, soute climatisée et fret Pet Connect, tarifs, restrictions de races et température, sources officielles."
  es: "Política de mascotas de Alaska Airlines: cabina, bodega climatizada y carga Pet Connect, tarifas, límites de raza y temperatura, y fuentes oficiales."
  pt: "Política de animais da Alaska Airlines: cabine, porão climatizado e carga Pet Connect, tarifas, limites de raça e temperatura e fontes oficiais."
