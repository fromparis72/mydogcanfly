    pt: "USD. A tarifa de bagagem despachada é de $150 por trajeto (a partir de 14 out. 2025)."
restrictions:
  - icon: 🐶
    title:
      en: Flat-faced breeds
      fr: Races brachycéphales
      es: Razas de hocico chato
      pt: "Raças de focinho achatado"
    pills:
      - cls: ok
        label:
          en: Cabin possible
          fr: Cabine possible
          es: Cabina posible
          pt: "Cabine possível"
      - cls: no
        label:
          en: Hold/cargo forbidden
          fr: Soute/fret interdits
          es: Bodega/carga prohibidas
          pt: "Porão/carga proibidos"
    note:
      en: "Snub-nosed dogs & cats aren't accepted in the hold or cargo (Hawaii exception) but may fly in the cabin: pit bull, American Staffordshire, boxer, bulldogs (French/English), Boston terrier, pug, Shih Tzu, chow chow, mastiffs, Brussels Griffon, and Burmese/Exotic/Himalayan/Persian cats."
      fr: "Chiens et chats au nez écrasé refusés en soute et en fret (exception Hawaï) mais admis en cabine : pit-bull, American Staffordshire, boxer, bouledogues (français/anglais), Boston terrier, carlin, Shih Tzu, chow chow, mastiffs, Griffon bruxellois, et chats birmans/exotiques/himalayens/persans."
      es: "Los perros y gatos de hocico chato no se aceptan en bodega ni en carga (excepción Hawái), pero pueden volar en cabina: pit bull, American Staffordshire, bóxer, bulldogs (francés/inglés), Boston terrier, carlino, Shih Tzu, chow chow, mastines, Grifón de Bruselas, y gatos birmanos/exóticos/himalayos/persas."
      pt: "Cachorros e gatos de focinho achatado não são aceitos no porão nem na carga (exceção para o Havaí), mas podem voar na cabine: pit bull, American Staffordshire, boxer, buldogues (francês/inglês), Boston Terrier, pug, Shih Tzu, Chow Chow, mastins, Grifon de Bruxelas, e gatos birmaneses/exóticos/himalaios/persas."
  - icon: 🚫
    title:
      en: Other rules
      fr: Autres règles
      es: Otras reglas
      pt: "Outras regras"
    pills:
      - cls: warn
        label:
          en: Sedation not advised
          fr: Sédation déconseillée
          es: Sedación desaconsejada
          pt: "Sedação não recomendada"
    note:
      en: Sedation isn't advised for hold travel — any decision to tranquillise must be made by your vet.
      fr: La sédation est déconseillée pour la soute — toute décision de tranquilliser revient à ton vétérinaire.
      es: No se aconseja la sedación para viajar en bodega; cualquier decisión de tranquilizar corresponde a tu veterinario.
      pt: "A sedação não é recomendada para viagens no porão — qualquer decisão de tranquilizar cabe ao seu veterinário."
temperature:
  pills:
    - cls: ok
      label:
        en: Climate-controlled hold
        fr: Soute climatisée
        es: Bodega climatizada
        pt: "Porão climatizado"
    - cls: no
      label:
        en: "Cargo: 7–29.5 °C (45–85 °F)"
        fr: "Fret : 7–29,5 °C (45–85 °F)"
        es: "Carga: 7–29,5 °C (45–85 °F)"
        pt: "Carga: 7–29,5 °C (45–85 °F)"
  note:
    en: Pet Connect cargo accepts pets only when forecast temperatures are 45–85 °F (7–29.5 °C) at every point; summer embargoes run ~1 May–16 Oct above 85 °F, with cold exceptions on a vet acclimation certificate. Checked baggage uses the same climate-controlled hold, with acceptance declined in extreme temperatures.
    fr: Le fret Pet Connect n'accepte les animaux que si les températures prévues sont de 45–85 °F (7–29,5 °C) à chaque point ; embargos d'été ~1er mai–16 oct. au-dessus de 85 °F, avec exceptions par temps froid sur certificat vétérinaire d'acclimatation. La soute bagages est la même soute climatisée, refus possible par température extrême.
    es: La carga Pet Connect solo acepta mascotas cuando las temperaturas previstas son de 45–85 °F (7–29,5 °C) en cada punto; hay embargos de verano ~1 may–16 oct por encima de 85 °F, con excepciones por frío mediante certificado veterinario de aclimatación. El equipaje facturado usa la misma bodega climatizada, con rechazo posible en temperaturas extremas.
    pt: "A carga Pet Connect só aceita animais quando as temperaturas previstas são de 45–85 °F (7–29,5 °C) em cada ponto; embargos por calor de verão ocorrem ~1 mai.–16 out. acima de 85 °F, com exceções por frio mediante atestado veterinário de aclimatação. A bagagem despachada usa o mesmo porão climatizado, com recusa possível em temperaturas extremas."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: Trained service dogs fly free in the cabin (max 2); emotional-support animals no longer qualify.
      fr: Chiens d'assistance dressés gratuits en cabine (max 2) ; chiens de soutien émotionnel non éligibles.
      es: Los perros de asistencia adiestrados viajan gratis en cabina (máx. 2); los animales de apoyo emocional ya no son elegibles.
      pt: "Cães de serviço treinados voam gratuitamente na cabine (máx. 2); animais de apoio emocional não são mais elegíveis."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: US DOT Service Animal form, submitted ≥ 48 h ahead.
      fr: Formulaire DOT d'animal d'assistance, soumis ≥ 48 h à l'avance.
      es: Formulario de animal de asistencia del DOT de EE. UU., presentado ≥ 48 h antes.
      pt: "Formulário de Animal de Serviço do DOT dos EUA, enviado com ≥ 48 h de antecedência."
goodToKnow:
  - icon: 🐾
    label:
      en: Pet-friendly
      fr: Pet-friendly
      es: Pet-friendly
      pt: "Pet-friendly"
    value:
      en: Cabin, climate-controlled checked hold, and cargo — one of the most flexible US carriers.
      fr: Cabine, soute enregistrée climatisée et fret — une des compagnies US les plus souples.
      es: "Cabina, bodega facturada climatizada y carga: una de las aerolíneas de EE. UU. más flexibles."
      pt: "Cabine, porão despachado climatizado e carga — uma das companhias dos EUA mais flexíveis."
  - icon: 🧳
    label:
      en: Species
      fr: Espèces
      es: Especies
      pt: "Espécies"
    value:
      en: The hold accepts many species domestically (ferrets, rabbits, reptiles, birds…), but dogs & cats only to Hawaii/international.
      fr: La soute accepte de nombreuses espèces en national (furets, lapins, reptiles, oiseaux…), mais chiens et chats seulement vers Hawaï/international.
      es: La bodega acepta muchas especies en vuelos nacionales (hurones, conejos, reptiles, aves…), pero perros y gatos solo hacia Hawái/internacional.
      pt: "O porão aceita muitas espécies em voos domésticos (furões, coelhos, répteis, aves…), mas cachorros e gatos somente para o Havaí/internacional."
  - icon: ⏱️
    label:
      en: Booking
      fr: Réserver
      es: Reservar
      pt: "Reserva"
    value:
      en: Cabin & checked pets are first-come, first-served — reserve before the day of travel; cargo via the Pet Connect call centre.
      fr: Animaux en cabine et en soute au premier arrivé — réserver avant le jour du voyage ; fret via le centre d'appel Pet Connect.
      es: "Las mascotas en cabina y facturadas se atienden por orden de llegada: reserva antes del día del viaje; la carga se gestiona por el centro de llamadas de Pet Connect."
      pt: "Animais na cabine e despachados são atendidos por ordem de chegada — reserve antes do dia da viagem; a carga é feita via a central de atendimento do Pet Connect."
