verdictNote:
  en: One of the most pet-friendly US airlines — cabin, climate-controlled hold and cargo are all available.
  fr: Une des compagnies US les plus pet-friendly — cabine, soute climatisée et fret sont tous disponibles.
  es: "Una de las aerolíneas de EE. UU. más pet-friendly: cabina, bodega climatizada y carga están todas disponibles."
  pt: "Uma das companhias dos EUA mais pet-friendly — cabine, porão climatizado e carga estão todos disponíveis."
