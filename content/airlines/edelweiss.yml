  - icon: 📍
    label:
      en: Switzerland
      fr: Suisse
      es: Suiza
      pt: "Suíça"
  - icon: 🐾
    label:
      en: Cabin ≤ 8 kg
      fr: Cabine ≤ 8 kg
      es: Cabina ≤ 8 kg
      pt: "Cabine ≤ 8 kg"
  - icon: 🗓
    label:
