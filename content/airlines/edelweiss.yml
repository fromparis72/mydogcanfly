id: airline_edelweiss
mono: WK
name: Edelweiss Air
titleH1:
  en: Flying with a dog on Edelweiss Air
  fr: Voyager avec un chien sur Edelweiss Air
  es: Volar con un perro en Edelweiss Air
  pt: "Viajar com um cachorro na Edelweiss Air"
metaDesc:
  en: "Edelweiss pet policy: 8 kg in the cabin from CHF 90, hold in sized kennels — priced in a table still framed as a \"future\" change eight months after it took effect."
  fr: "Politique animaux Edelweiss : 8 kg en cabine dès 90 CHF, soute en cages calibrées — tarifée dans un tableau encore présenté comme un changement « à venir » huit mois après son entrée en vigueur."
  es: "Política de mascotas de Edelweiss: 8 kg en cabina desde 90 CHF, bodega en jaulas de tamaño estándar — con precios en una tabla que todavía se presenta como un cambio “futuro” ocho meses después de entrar en vigor."
  pt: "Política de animais da Edelweiss: 8 kg na cabine a partir de 90 CHF, porão em gaiolas de tamanho padrão — precificado em uma tabela ainda apresentada como uma mudança “futura” oito meses depois de entrar em vigor."
