verdict:
  cls: warn
  label:
    en: Possible
    fr: Sous conditions
    es: Con condiciones
    pt: "Com condições"
verdictNote:
  en: Cabin and hold are both open, with a clear kennel-size table and generous service-dog terms — but the fee page reads as stale, and cargo for an unaccompanied pet is entirely outsourced to sister carrier SWISS.
  fr: Cabine et soute sont ouvertes, avec un tableau de cages clair et des conditions généreuses pour les chiens d'assistance — mais la page tarifaire semble périmée, et le fret pour un animal non accompagné est entièrement délégué à SWISS, la compagnie sœur.
  es: "Cabina y bodega están abiertas, con una tabla de jaulas clara y condiciones generosas para perros de servicio — pero la página de tarifas parece desactualizada, y la carga para una mascota no acompañada está totalmente delegada a SWISS, la aerolínea hermana."
  pt: "Cabine e porão estão abertos, com uma tabela de gaiolas clara e condições generosas para cães de serviço — mas a página de tarifas parece desatualizada, e a carga para um animal não acompanhado é totalmente terceirizada para a SWISS, companhia irmã."
