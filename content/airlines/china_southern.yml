verdictNote:
  en: "Two official pages disagree about the cabin: a paid in-cabin product on designated direct flights against an FAQ that refuses pets. The hold is open to cats, dogs and birds as checked baggage."
  fr: "Deux pages officielles se contredisent sur la cabine : un produit payant sur les vols directs désignés, contre une FAQ qui refuse les animaux. La soute, elle, accepte chats, chiens et oiseaux en bagage enregistré."
  es: "Dos páginas oficiales se contradicen sobre la cabina: un producto de pago en vuelos directos designados frente a una FAQ que rechaza las mascotas. La bodega sí admite gatos, perros y aves como equipaje facturado."
  pt: "Duas páginas oficiais contradizem-se quanto à cabine: um produto pago em voos diretos designados contra uma FAQ que recusa animais. O porão aceita gatos, cães e aves como bagagem despachada."
