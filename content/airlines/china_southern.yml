    detail:
      en: A current paid cabin product coexists with an official FAQ refusing pets in the cabin; confirm flight eligibility before booking.
      fr: Un produit cabine payant actuel coexiste avec une FAQ officielle refusant les animaux en cabine ; confirme l'éligibilité du vol avant de réserver.
      es: Un producto actual de cabina de pago coexiste con una FAQ oficial que rechaza mascotas; confirma la elegibilidad del vuelo antes de reservar.
      pt: "Um produto atual pago de cabine coexiste com uma FAQ oficial que recusa animais; confirme a elegibilidade do voo antes de reservar."
    fee:
