      es: Perros, gatos y aves como equipaje facturado (≤ 32 kg incl. jaula, máx. 90 × 60 × 66 cm); no en vuelos con conexión. Aprobación ≥ 24 h (nacional) / 48 h (internacional).
      pt: "Cachorros, gatos e aves como bagagem despachada (≤ 32 kg incl. gaiola, máx. 90 × 60 × 66 cm); não em voos com conexão. Aprovação ≥ 24 h (doméstico) / 48 h (internacional)."
