metaDesc:
  en: "China Southern pet policy: hold carriage by weight, a disputed paid cabin product, breed limits and official sources."
  fr: "Politique animaux China Southern : transport en soute au poids, produit cabine payant contesté, restrictions de races et sources officielles."
  es: "Política de mascotas de China Southern: transporte en bodega por peso, producto de cabina de pago en disputa, límites de raza y fuentes oficiales."
  pt: "Política de animais da China Southern: transporte no porão por peso, produto pago de cabine em disputa, limites de raça e fontes oficiais."
