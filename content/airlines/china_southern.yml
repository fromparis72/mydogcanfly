restrictions:
  - icon: 🐶
    title:
      en: Flat-faced breeds
      fr: Races brachycéphales
      es: Razas de hocico chato
      pt: "Raças de focinho achatado"
    pills:
      - cls: no
        label:
          en: Not accepted
          fr: Non acceptées
          es: No aceptadas
          pt: "Não aceitas"
    note:
      en: "Snub-nosed cats & dogs can't be carried: bulldogs (all), boxers (all), pugs (all), Boston terrier, Brussels Griffon, Pekingese, Shih Tzu, Lhasa Apso, chow chow, Shar Pei, Japanese Chin, Cane Corso, mastiffs, pit bull/Staffordshire types, and Persian/Himalayan/Exotic/British Shorthair/Burmese cats."
      fr: "Chats et chiens au nez écrasé refusés : bouledogues (tous), boxers (tous), carlins (tous), Boston terrier, Griffon bruxellois, pékinois, Shih Tzu, Lhasa Apso, chow chow, Shar Pei, Chin japonais, Cane Corso, mastiffs, types pit-bull/Staffordshire, et chats persans/himalayens/exotiques/British Shorthair/birmans."
      es: "Los gatos y perros de hocico chato no pueden transportarse: bulldogs (todos), bóxers (todos), carlinos (todos), Boston terrier, Grifón de Bruselas, pequinés, Shih Tzu, Lhasa Apso, chow chow, Shar Pei, Chin japonés, Cane Corso, mastines, tipos pit bull/Staffordshire, y gatos persas/himalayos/exóticos/British Shorthair/birmanos."
      pt: "Gatos e cachorros de focinho achatado não podem ser transportados: buldogues (todos), boxers (todos), pugs (todos), Boston Terrier, Grifon de Bruxelas, Pequinês, Shih Tzu, Lhasa Apso, Chow Chow, Shar Pei, Chin Japonês, Cane Corso, mastins, tipos pit bull/Staffordshire, e gatos Persa/Himalaia/Exótico/British Shorthair/Burmês."
  - icon: 🚫
    title:
      en: Other rules
      fr: Autres règles
      es: Otras reglas
      pt: "Outras regras"
    pills:
      - cls: no
        label:
          en: No pregnancy
          fr: Pas de gestation
          es: Sin gestación
          pt: "Sem gestação"
    note:
      en: Pregnant animals aren't accepted; pets must be healthy, clean and odorless. Too small (mice, fish), wild or offensive animals are refused.
      fr: Les animaux gestants ne sont pas acceptés ; les animaux doivent être sains, propres et inodores. Les animaux trop petits (souris, poissons), sauvages ou repoussants sont refusés.
      es: No se aceptan animales gestantes; las mascotas deben estar sanas, limpias y sin olor. Se rechazan los animales demasiado pequeños (ratones, peces), salvajes o desagradables.
      pt: "Animais gestantes não são aceitos; os animais precisam estar saudáveis, limpos e sem odor. Animais pequenos demais (camundongos, peixes), selvagens ou desagradáveis são recusados."
temperature:
  pills:
    - cls: ok
      label:
        en: Oxygen-equipped hold required
        fr: Soute équipée d'oxygène requise
        es: Se requiere bodega con oxígeno
        pt: "Porão equipado com oxigênio obrigatório"
    - cls: warn
      label:
        en: "Temperature limits: not disclosed"
        fr: "Limites de température : non communiqué"
        es: "Límites de temperatura: no comunicados"
        pt: "Limites de temperatura: não divulgados"
  note:
    en: China Southern only accepts pets on aircraft with a suitable oxygen-equipped hold; it publishes no numeric temperature limit but won't carry animals unsuited to the hold.
    fr: China Southern n'accepte les animaux que sur les avions dotés d'une soute adaptée équipée d'oxygène ; elle ne publie pas de limite chiffrée mais ne transporte pas d'animaux inadaptés à la soute.
    es: China Southern solo acepta mascotas en aviones con una bodega adecuada equipada con oxígeno; no publica un límite de temperatura numérico, pero no transporta animales no aptos para la bodega.
    pt: "A China Southern só aceita animais em aeronaves com porão adequado equipado com oxigênio; ela não divulga limite numérico de temperatura, mas não transporta animais inadequados para o porão."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: Service dogs (guide, hearing, support) travel free in the cabin, muzzled and leashed at your feet; not counted in baggage.
      fr: Les chiens d'assistance (guide, écoute, soutien) voyagent gratuitement en cabine, muselés et en laisse à tes pieds ; hors franchise bagages.
      es: Los perros de servicio (guía, de señal, de apoyo) viajan gratis en cabina, con bozal y con correa a tus pies; no cuentan en la franquicia de equipaje.
      pt: "Cães de assistência (guia, para surdos, de apoio) viajam gratuitamente na cabine, com focinheira e presos com guia aos seus pés; não contam na franquia de bagagem."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: Emotional-support dogs not accepted since Feb 2021. Provide training + quarantine certificates.
      fr: Chiens de soutien émotionnel non acceptés depuis fév. 2021. Fournir les certificats de dressage + quarantaine.
      es: Los perros de apoyo emocional no se aceptan desde feb 2021. Aporta los certificados de adiestramiento + cuarentena.
      pt: "Cães de apoio emocional não são aceitos desde fev. de 2021. Apresente certificados de treinamento + quarentena."
goodToKnow:
  - icon: 🔁
    label:
      en: No connections
      fr: Pas de correspondance
      es: Sin conexiones
      pt: "Sem conexões"
    value:
      en: Pets aren't carried on connecting flights.
      fr: Les animaux ne sont pas transportés en correspondance.
      es: Las mascotas no se transportan en vuelos con conexión.
      pt: "Animais não são transportados em voos com conexão."
  - icon: 🛋️
    label:
      en: Domestic perks
      fr: Avantages national
      es: Ventajas en vuelos nacionales
      pt: "Vantagens em voos domésticos"
    value:
      en: "The domestic fare includes a protective net, a pet lounge, priority collection and insurance cover."
      fr: "Le tarif national inclut un filet de protection, un salon animalier, une récupération prioritaire et une assurance."
      es: "La tarifa nacional incluye una red de protección, una sala para mascotas, recogida prioritaria y un seguro."
      pt: "A tarifa doméstica inclui uma rede de proteção, sala para animais, retirada prioritária e seguro."
  - icon: 📄
    label:
      en: China quarantine
      fr: Quarantaine Chine
      es: Cuarentena en China
      pt: "Quarentena na China"
    value:
      en: Dogs/cats to China (one per passenger) need an ISO microchip and may face 30-day quarantine unless exempt.
      fr: Les chiens/chats vers la Chine (un par passager) ont besoin d'une puce ISO et peuvent subir 30 jours de quarantaine sauf exemption.
      es: Los perros/gatos hacia China (uno por pasajero) necesitan un microchip ISO y pueden enfrentar 30 días de cuarentena salvo exención.
      pt: "Cachorros/gatos com destino à China (um por passageiro) precisam de microchip ISO e podem enfrentar quarentena de 30 dias, salvo isenção."
