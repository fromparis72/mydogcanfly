      fr: Certains aéroports (ex. Hong Kong) n'autorisent les animaux qu'en fret.
      es: Algunos aeropuertos (p. ej. Hong Kong) solo permiten que las mascotas viajen como carga.
      pt: "Alguns aeroportos (por exemplo, Hong Kong) só permitem que os animais viajem como carga."
    fee:
