temperature:
  pills:
    - cls: neutral
      label:
        en: Moot — no pets accepted
        fr: Sans objet — aucun animal accepté
        es: Sin objeto — no se acepta ninguna mascota
        pt: "Sem objeto — nenhum animal é aceito"
  note:
    en: Indonesia's tropical climate is exactly where a heat policy would matter — but the airline sidesteps the question entirely by not carrying pets at all.
    fr: Le climat tropical de l'Indonésie est justement le contexte où une politique de chaleur compterait — mais la compagnie évite la question en ne transportant aucun animal.
    es: "El clima tropical de Indonesia es precisamente donde importaría una política sobre el calor, pero la aerolínea evita la cuestión por completo al no transportar mascotas."
    pt: "O clima tropical da Indonésia é exatamente onde uma política de calor importaria — mas a companhia evita a questão por completo ao não transportar nenhum animal."
assistance:
  - icon: ❓
    label:
      en: Assistance dogs
      fr: Chiens d'assistance
      es: Perros de asistencia
      pt: "Cães de assistência"
    value:
      en: Not published. The dedicated Special Assistance help articles cover human mobility and medical needs only — no mention of service dogs, guide dogs or emotional support animals anywhere.
      fr: Non publié. Les articles d'aide dédiés à l'assistance spéciale ne couvrent que la mobilité et les besoins médicaux humains — aucune mention de chien d'assistance, chien guide ou animal de soutien émotionnel nulle part.
      es: "No publicado. Los artículos de ayuda dedicados a la asistencia especial solo cubren la movilidad y las necesidades médicas humanas: no hay ninguna mención a perros de servicio, perros guía o animales de apoyo emocional."
      pt: "Não publicado. Os artigos de ajuda dedicados à assistência especial cobrem apenas mobilidade e necessidades médicas humanas — nenhuma menção a cães de serviço, cães-guia ou animais de apoio emocional em lugar nenhum."
goodToKnow:
  - icon: 🕳️
    label:
      en: A dead link on the airline's own help page
      fr: Un lien mort sur la propre page d'aide de la compagnie
      es: Un enlace roto en la propia página de ayuda de la aerolínea
      pt: "Um link quebrado na própria página de ajuda da companhia"
    value:
      en: "Batik Air Indonesia's own \"Bring Live Animal/Pet\" article redirects owners to sister carrier Lion Air's pet policy as the only option within the group — but that link returns a 404 Not Found. A currently published official page points customers to a page that no longer exists."
      fr: "L'article « Bring Live Animal/Pet » de Batik Air Indonésie renvoie les propriétaires vers la politique animaux de sa compagnie sœur Lion Air, seule option au sein du groupe — mais ce lien renvoie une erreur 404. Une page officielle actuellement publiée pointe vers une page qui n'existe plus."
      es: "El artículo “Bring Live Animal/Pet” de Batik Air Indonesia remite a los dueños a la política de mascotas de su aerolínea hermana Lion Air, como única opción dentro del grupo, pero ese enlace devuelve un error 404. Una página oficial actualmente publicada apunta a una página que ya no existe."
      pt: "O artigo “Bring Live Animal/Pet” da Batik Air Indonésia encaminha os donos para a política de animais da companhia irmã Lion Air, como única opção dentro do grupo — mas esse link retorna um erro 404. Uma página oficial atualmente publicada aponta para uma página que não existe mais."
  - icon: 🕳️
    label:
      en: A single-sentence policy
      fr: Une politique en une seule phrase
      es: Una política de una sola frase
      pt: "Uma política de uma única frase"
    value:
      en: No formal Conditions of Carriage document or dedicated live-animal policy page exists — the entire pet policy is one short FAQ answer, thinner than what most airlines, including budget carriers, publish on the topic.
      fr: Aucun document formel de conditions de transport ni page dédiée à la politique animalière — toute la politique animaux tient en une courte réponse de FAQ, plus mince que ce que publient la plupart des compagnies, même low-cost, sur le sujet.
      es: "No existe ningún documento formal de condiciones de transporte ni una página dedicada a la política sobre animales: toda la política de mascotas cabe en una breve respuesta de FAQ, más escueta que lo que publican la mayoría de las aerolíneas, incluso las de bajo coste, sobre este tema."
      pt: "Não existe nenhum documento formal de condições de transporte nem página dedicada à política de animais — toda a política de animais se resume a uma curta resposta de FAQ, mais escassa do que o que a maioria das companhias, mesmo as de baixo custo, publica sobre o tema."
