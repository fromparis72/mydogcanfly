verdictNote:
  en: Batik Air Indonesia states, in plain language on its own help center, that it does not carry pets on any of its flights — cabin, hold or cargo. There is no fallback service of its own; it only points to a different airline.
  fr: Batik Air Indonésie déclare, en toutes lettres sur son propre centre d'aide, qu'elle ne transporte d'animal sur aucun de ses vols — ni cabine, ni soute, ni fret. Elle n'a aucun service de repli qui lui soit propre ; elle renvoie seulement vers une autre compagnie.
  es: "Batik Air Indonesia declara, en su propio centro de ayuda y sin rodeos, que no transporta mascotas en ninguno de sus vuelos — ni cabina, ni bodega, ni carga. No tiene ningún servicio propio de respaldo; solo remite a otra aerolínea."
  pt: "A Batik Air Indonésia declara, com todas as letras em sua própria central de ajuda, que não transporta animais em nenhum de seus voos — nem cabine, nem porão, nem carga. Não tem serviço próprio alternativo; apenas encaminha para outra companhia."
