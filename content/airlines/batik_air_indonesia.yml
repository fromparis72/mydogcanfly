channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: "no"
    statusLabel:
      en: Not accepted
      fr: Non accepté
      es: No aceptado
      pt: "Não aceito"
    detail:
      en: "\"Batik Air Indonesia flights are not allowed to bring pets\" — the airline's own words, with no cabin/hold/cargo distinction: it's a blanket ban stated once."
      fr: "« Les vols Batik Air Indonésie ne sont pas autorisés à transporter des animaux » — les mots de la compagnie elle-même, sans distinction cabine/soute/fret : une interdiction générale posée une seule fois."
      es: "“Los vuelos de Batik Air Indonesia no pueden llevar mascotas”, en palabras de la propia aerolínea, sin distinguir cabina/bodega/carga: es una prohibición general planteada de una sola vez."
      pt: "“Voos da Batik Air Indonésia não têm permissão para levar animais de estimação” — nas palavras da própria companhia, sem distinção cabine/porão/carga: é uma proibição geral declarada de uma só vez."
    fee:
      en: Not applicable
      fr: Non applicable
      es: No aplicable
      pt: "Não aplicável"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: "no"
    statusLabel:
      en: Not accepted
      fr: Non accepté
      es: No aceptado
      pt: "Não aceito"
    detail:
      en: Same blanket statement applies — no separate hold provision exists. The general cabin-baggage rules page, which covers strollers and musical instruments in detail, has zero mention of animals.
      fr: La même déclaration générale s'applique — aucune disposition soute distincte n'existe. La page des règles de bagages cabine, qui détaille poussettes et instruments de musique, ne mentionne jamais les animaux.
      es: "Se aplica la misma declaración general: no existe ninguna disposición específica para bodega. La página de normas de equipaje de cabina, que detalla carritos e instrumentos musicales, no menciona los animales en ningún momento."
      pt: "A mesma declaração geral se aplica — não existe uma provisão separada para porão. A página de regras de bagagem de cabine, que detalha carrinhos de bebê e instrumentos musicais, não menciona animais em nenhum momento."
    fee:
      en: Not applicable
      fr: Non applicable
      es: No aplicable
      pt: "Não aplicável"
