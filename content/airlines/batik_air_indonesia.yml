titleH1:
  en: Flying with a dog on Batik Air Indonesia
  fr: Voyager avec un chien sur Batik Air Indonésie
  es: Volar con un perro en Batik Air Indonesia
  pt: "Viajar com um cachorro na Batik Air Indonésia"
metaDesc:
  en: "Batik Air Indonesia pet policy: no pets accepted at all — cabin, hold or cargo — and its own help page points elsewhere to a link that no longer works."
  fr: "Politique animaux Batik Air Indonésie : aucun animal accepté — ni cabine, ni soute, ni fret — et sa propre page d'aide renvoie vers un lien qui ne fonctionne plus."
  es: "Política de mascotas de Batik Air Indonesia: no se acepta ningún animal — ni cabina, ni bodega, ni carga — y su propia página de ayuda remite a un enlace que ya no funciona."
  pt: "Política de animais da Batik Air Indonésia: nenhum animal é aceito — nem cabine, nem porão, nem carga — e a própria página de ajuda aponta para um link que não funciona mais."
