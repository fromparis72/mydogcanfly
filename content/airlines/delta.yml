  cls: warn
  label:
    en: Moderate
    fr: Modéré
    es: Moderado
    pt: "Moderada"
verdictNote:
  en: Small pets in the cabin for a fee; the hold is military-only and cargo is largely suspended.
  fr: Petits animaux en cabine (payant) ; soute réservée aux militaires et fret largement suspendu.
  es: Mascotas pequeñas en cabina con tarifa; la bodega es solo para militares y la carga está en gran parte suspendida.
  pt: "Animais pequenos na cabine, mediante tarifa; o porão é somente para militares e a carga está, em grande parte, suspensa."
