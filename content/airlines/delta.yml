id: airline_delta
mono: DL
name: Delta Air Lines
titleH1:
  en: Flying with a dog on Delta Air Lines
  fr: Voyager avec un chien sur Delta Air Lines
  es: Viajar con perro en Delta Air Lines
  pt: "Voar com um cachorro na Delta Air Lines"
metaDesc:
  en: "Delta pet policy: cabin pets, military-only hold, suspended cargo, temperature limits, breed limits and official sources."
  fr: "Politique animaux Delta : cabine, soute militaires, fret suspendu, limites de température, restrictions de races et sources officielles."
  es: "Política de mascotas de Delta: mascotas en cabina, bodega solo para militares, carga suspendida, límites de temperatura, límites de raza y fuentes oficiales."
  pt: "Política de animais da Delta: animais na cabine, porão somente para militares, carga suspensa, limites de temperatura, limites de raça e fontes oficiais."
