titleH1:
  en: Flying with a dog on Wizz Air
  fr: Voyager avec un chien sur Wizz Air
  es: Volar con un perro en Wizz Air
  pt: "Viajar com um cachorro na Wizz Air"
metaDesc:
  en: "Wizz Air pet policy: no pets carried, only certified assistance dogs on qualifying EU routes, and official sources."
  fr: "Politique animaux Wizz Air : aucun animal transporté, seulement les chiens d'assistance certifiés sur certaines routes UE, et sources officielles."
  es: "Política de mascotas de Wizz Air: no se transportan mascotas, solo perros de asistencia certificados en rutas de la UE que reúnan los requisitos."
  pt: "Política de animais da Wizz Air: nenhum animal transportado, somente cães de assistência certificados em rotas elegíveis da UE, e fontes oficiais."
