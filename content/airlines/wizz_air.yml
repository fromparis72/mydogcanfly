verdictNote:
  en: Wizz Air carries no pets at all — only certified assistance dogs on qualifying EU routes.
  fr: Wizz Air ne transporte aucun animal — seulement les chiens d'assistance certifiés sur certaines routes UE.
  es: Wizz Air no transporta ninguna mascota; solo perros de asistencia certificados en rutas de la UE que reúnan los requisitos.
  pt: "A Wizz Air não transporta animal nenhum — somente cães de assistência certificados em rotas elegíveis da UE."
