name: Air Mauritius
titleH1:
  en: Flying with a dog on Air Mauritius
  fr: Voyager avec un chien sur Air Mauritius
  es: Volar con un perro en Air Mauritius
  pt: "Viajar com um cachorro pela Air Mauritius"
metaDesc:
  en: "Air Mauritius pet policy: no cabin pets, hold and cargo, strict Mauritius quarantine and official sources."
  fr: "Politique animaux Air Mauritius : pas d'animaux en cabine, soute et fret, quarantaine stricte à Maurice et sources officielles."
  es: "Política de mascotas de Air Mauritius: sin mascotas en cabina, bodega y carga, cuarentena estricta en Mauricio y fuentes oficiales."
  pt: "Política de animais da Air Mauritius: sem animais na cabine, porão e carga, quarentena rigorosa em Maurício e fontes oficiais."
