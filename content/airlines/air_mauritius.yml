verdictNote:
  en: No cabin pets except guide dogs; pets travel in the hold or via cargo — with strict Mauritius quarantine on import.
  fr: Pas d'animaux en cabine sauf chiens guides ; les animaux voyagent en soute ou en fret — avec une quarantaine stricte à Maurice à l'importation.
  es: No se admiten mascotas en cabina salvo perros guía; las mascotas viajan en bodega o como carga — con cuarentena estricta en Mauricio a la importación.
  pt: "Nenhum animal na cabine, exceto cães-guia; os animais viajam no porão ou via carga — com quarentena rigorosa em Maurício na importação."
