    pt: "Moderada"
verdictNote:
  en: Small cats & dogs in the cabin or hold — but snub-nosed breeds barred and many destinations fully banned.
  fr: Petits chats et chiens en cabine ou en soute — mais races au nez écrasé interdites et de nombreuses destinations totalement bannies.
  es: Gatos y perros pequeños en cabina o bodega, pero las razas de hocico chato están vetadas y muchos destinos totalmente prohibidos.
  pt: "Gatos e cachorros pequenos na cabine ou no porão — mas raças de focinho achatado vetadas e muitos destinos totalmente proibidos."
