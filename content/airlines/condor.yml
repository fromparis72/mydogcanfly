id: airline_condor
mono: DE
name: Condor
titleH1:
  en: Flying with a dog on Condor
  fr: Voyager avec un chien sur Condor
  es: Viajar con perro en Condor
  pt: "Voar com um cachorro na Condor"
metaDesc:
  en: "Condor pet policy: cabin and hold on nonstop flights, fares by zone, snub-nosed ban, banned destinations and official sources."
  fr: "Politique animaux Condor : cabine et soute sur vols directs, tarifs par zone, interdiction brachy, destinations interdites et sources officielles."
  es: "Política de mascotas de Condor: cabina y bodega en vuelos directos, tarifas por zona, veto a razas de hocico chato, destinos prohibidos y fuentes oficiales."
  pt: "Política de animais da Condor: cabine e porão em voos diretos, tarifas por zona, veto a raças de focinho achatado, destinos proibidos e fontes oficiais."
