policies:
  cabin:
    availability: offered
  hold:
    availability: offered
  cargo:
    review_state: legacy_unreviewed
    # dette éditoriale scellée (T0-B2) : aucun canal visible ne décrit ce placement
channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Cats & dogs ≤ 8 kg incl. carrier in a ventilated IATA carrier under the seat (max 55 × 40 × 23 cm). Not in A330neo Business or exit rows.
      fr: Chats et chiens ≤ 8 kg avec le sac dans un sac IATA ventilé sous le siège (max 55 × 40 × 23 cm). Pas en Business A330neo ni rangs d'issue.
      es: Gatos y perros ≤ 8 kg incl. jaula, en una jaula IATA ventilada bajo el asiento (máx. 55 × 40 × 23 cm). No en Business del A330neo ni en filas de salida.
      pt: "Gatos e cachorros ≤ 8 kg incl. bolsa de transporte, em uma bolsa de transporte IATA ventilada sob o assento (máx. 55 × 40 × 23 cm). Não na Business do A330neo nem em fileiras de saída."
    fee:
      en: €59.99–99.99
      fr: 59,99–99,99 €
      es: 59,99–99,99 €
      pt: "59,99–99,99 €"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Cats & dogs in a ventilated IATA crate, on Condor nonstop flights only; the breed must be declared.
      fr: Chats et chiens en caisse IATA ventilée, uniquement sur les vols directs Condor ; la race doit être déclarée.
      es: Gatos y perros en una jaula IATA ventilada, solo en vuelos directos de Condor; hay que declarar la raza.
      pt: "Gatos e cachorros em uma caixa de transporte IATA ventilada, somente em voos diretos da Condor; a raça precisa ser declarada."
    fee:
      en: €79.99–254.99
      fr: 79,99–254,99 €
      es: 79,99–254,99 €
      pt: "79,99–254,99 €"
