        fr: 79,99–154,99 €
        es: 79,99–154,99 €
        pt: "79,99–154,99 €"
    - label:
        en: Hold — large crate
        fr: Soute — grande caisse
        es: Bodega — jaula grande
        pt: "Porão — caixa grande"
      value:
        en: €154.99–254.99
        fr: 154,99–254,99 €
        es: 154,99–254,99 €
