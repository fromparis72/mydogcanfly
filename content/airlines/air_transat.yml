verdictNote:
  en: Cats & dogs in the cabin or hold with clear CAD fees — but many route and breed restrictions.
  fr: Chats et chiens en cabine ou en soute avec des tarifs CAD clairs — mais de nombreuses restrictions de routes et de races.
  es: Gatos y perros en cabina o bodega con tarifas claras en CAD — pero muchas restricciones de ruta y de raza.
  pt: "Gatos e cachorros na cabine ou no porão com tarifas claras em CAD — mas com muitas restrições de rota e de raça."
