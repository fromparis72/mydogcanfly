  - icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Cats & dogs only ≤ 8 kg (carrier + pet) in a soft carrier under the seat (max 43 × 24 × 25 cm). Reserve ≥ 24 h ahead.
      fr: Chats et chiens uniquement ≤ 8 kg (sac + animal) dans un sac souple sous le siège (max 43 × 24 × 25 cm). Réserver ≥ 24 h à l'avance.
      es: Solo gatos y perros ≤ 8 kg (jaula + mascota) en una jaula blanda bajo el asiento (máx 43 × 24 × 25 cm). Resérvalo con ≥ 24 h de antelación.
      pt: "Somente gatos e cachorros ≤ 8 kg (bolsa de transporte + animal) em uma bolsa de transporte flexível embaixo do assento (máx. 43 × 24 × 25 cm). Reserve com ≥ 24 h de antecedência."
    fee:
      en: $50–100 CAD
      fr: 50–100 $ CAD
      es: 50–100 $ CAD
      pt: "$50–100 CAD"
  - icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Cats & dogs (≤ 45 kg incl. carrier) as checked baggage; one per cage, min 12 weeks. Cable-tied free. Payment doesn't guarantee acceptance.
      fr: Chats et chiens (≤ 45 kg avec la caisse) en bagage enregistré ; un par caisse, min 12 semaines. Attaches fournies gratuitement. Le paiement ne garantit pas l'acceptation.
      es: Gatos y perros (≤ 45 kg incluida la jaula) como equipaje facturado; uno por jaula, mín 12 semanas. Bridas incluidas gratis. El pago no garantiza la aceptación.
      pt: "Gatos e cachorros (≤ 45 kg incl. caixa de transporte) como bagagem despachada; um por caixa, mín. 12 semanas. Lacres fornecidos gratuitamente. O pagamento não garante a aceitação."
    fee:
      en: $100–275 CAD
      fr: 100–275 $ CAD
      es: 100–275 $ CAD
      pt: "$100–275 CAD"
  - icon: ✈️
    name:
      en: Air Transat Cargo
      fr: Air Transat Cargo
      es: Air Transat Cargo
      pt: "Air Transat Cargo"
    cls: warn
    statusLabel:
      en: Via cargo
      fr: Via fret
      es: Vía carga
      pt: "Via carga"
    detail:
      en: "Cats & dogs to/from the UK and the Republic of Ireland go by cargo, with advance arrangements and extra fees — except that cabin and hold stay open on flights from Manchester and Glasgow (but not from London). Oversize cages also travel via cargo."
      fr: "Chats et chiens de/vers le R.-U. et la République d'Irlande passent par le fret, sur arrangement préalable et avec des frais supplémentaires — sauf au départ de Manchester et de Glasgow, où la cabine et la soute restent possibles (mais pas au départ de Londres). Les caisses hors gabarit passent aussi par le fret."
      es: "Los gatos y perros hacia/desde el Reino Unido y la República de Irlanda van por carga, con acuerdo previo y tasas adicionales — salvo en los vuelos desde Mánchester y Glasgow, donde la cabina y la bodega siguen siendo posibles (pero no desde Londres). Las jaulas fuera de medidas también van por carga."
      pt: "Gatos e cachorros de/para o Reino Unido e a República da Irlanda vão por carga, mediante acordo prévio e com taxas adicionais — exceto nos voos partindo de Manchester e Glasgow, onde a cabine e o porão continuam possíveis (mas não partindo de Londres). As caixas fora do padrão também vão por carga."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
