restrictions:
  - icon: 🐶
    title:
      en: Flat-faced breeds
      fr: Races brachycéphales
      es: Razas de hocico chato
      pt: "Raças de focinho achatado"
    pills:
      - cls: warn
        label:
          en: Liability waiver
          fr: Décharge de responsabilité
          es: Exención de responsabilidad
          pt: "Isenção de responsabilidade"
      - cls: no
        label:
          en: "French bulldog: cabin only"
          fr: "Bouledogue français : cabine seule"
          es: "Bulldog francés: solo cabina"
          pt: "Buldogue Francês: somente cabine"
    note:
      en: "Snub-nosed dogs & cats not on the banned list are accepted in the hold, but: the passenger signs an Acknowledgment and Exclusion of Liability, and the animal must be shipped in a kennel one size larger than the normal standard, with ventilation on all four sides. Acclimatise your dog to the crate as long as possible beforehand. If those conditions aren't met the pet may be refused, and the fees are non-refundable. French bulldogs are cabin-only. Air Transat's brachycephalic list also names the chihuahua and the Teddy Bear dog (Shichon/Zuchon)."
      fr: "Les chiens et chats au nez écrasé qui ne sont pas sur la liste des races interdites sont acceptés en soute, mais : le passager signe une décharge de responsabilité, et l'animal doit voyager dans une caisse d'une taille au-dessus du standard normal, ventilée sur les quatre côtés. Habitue ton chien à la caisse le plus longtemps possible avant le départ. Si ces conditions ne sont pas réunies, l'animal peut être refusé et les frais ne sont pas remboursés. Les bouledogues français sont admis en cabine uniquement. La liste brachycéphale d'Air Transat nomme aussi le chihuahua et le Teddy Bear (shichon/zuchon)."
      es: "Los perros y gatos de hocico chato que no figuran en la lista de razas prohibidas se aceptan en bodega, pero: el pasajero firma una exención de responsabilidad y el animal debe viajar en una jaula de una talla superior al estándar normal, con ventilación en los cuatro lados. Acostumbra a tu perro a la jaula el mayor tiempo posible antes del viaje. Si no se cumplen esas condiciones, la mascota puede ser rechazada y las tasas no se reembolsan. Los bulldogs franceses solo en cabina. La lista braquicéfala de Air Transat también nombra al chihuahua y al Teddy Bear (shichon/zuchon)."
      pt: "Cachorros e gatos de focinho achatado que não constam da lista de raças proibidas são aceitos no porão, mas: o passageiro assina um termo de isenção de responsabilidade e o animal deve viajar em uma caixa um tamanho acima do padrão normal, com ventilação nos quatro lados. Acostume seu cachorro à caixa o máximo de tempo possível antes da viagem. Se essas condições não forem atendidas, o animal pode ser recusado e as taxas não são reembolsadas. Os buldogues franceses só viajam na cabine. A lista braquicefálica da Air Transat também cita o chihuahua e o Teddy Bear (shichon/zuchon)."
  - icon: 🚫
    title:
      en: Banned breeds
      fr: Races interdites
      es: Razas prohibidas
      pt: "Raças proibidas"
    pills:
      - cls: no
        label:
          en: Not accepted
          fr: Non acceptées
          es: No aceptadas
          pt: "Não aceitas"
      - cls: warn
        label:
          en: No sedation
          fr: Pas de sédation
          es: Sin sedación
          pt: "Sem sedação"
    note:
      en: "Air Transat's published list — and any mixed breed including one or more of these: mastiffs (all breeds, incl. Dogo Argentino, Bandog, Boerboel, Fila Brasileiro, Cane Corso, Neapolitan Mastiff, Presa Canario, Tosa Inu), pit bulls (all breeds, incl. American Bully, American Pit Bull Terrier, American Staffordshire Terrier, Staffordshire Bull Terrier), Akita, Caucasian Ovcharka, Kangal / Anatolian Shepherd (Karabash), Rottweiler, wolf-dog hybrids, Doberman Pinscher. French bulldogs and American bulldogs are on the hold list only — the French bulldog stays welcome in the cabin. Bullmastiffs and French mastiffs (Dogue de Bordeaux) are explicitly exempt and accepted. Sedation isn't recommended."
      fr: "Liste publiée par Air Transat — et tout croisement comprenant une ou plusieurs de ces races : mastiffs (toutes races, dont dogo argentino, bandog, boerboel, fila brasileiro, cane corso, mâtin napolitain, presa canario, tosa inu), pit-bulls (toutes races, dont American Bully, American Pit Bull Terrier, American Staffordshire Terrier, Staffordshire bull terrier), akita, berger du Caucase, kangal / berger d'Anatolie (karabash), rottweiler, hybrides chien-loup, dobermann. Le bouledogue français et l'American bulldog ne figurent que sur la liste soute — le bouledogue français reste admis en cabine. Le bullmastiff et le dogue de Bordeaux sont explicitement exemptés et acceptés. La sédation n'est pas recommandée."
      es: "Lista publicada por Air Transat — y cualquier cruce que incluya una o varias de estas razas: mastines (todas, incl. dogo argentino, bandog, boerboel, fila brasileiro, cane corso, mastín napolitano, presa canario, tosa inu), pit bulls (todos, incl. American Bully, American Pit Bull Terrier, American Staffordshire Terrier, Staffordshire bull terrier), akita, ovcharka del Cáucaso, kangal / pastor de Anatolia (karabash), rottweiler, híbridos perro-lobo, dóberman. El bulldog francés y el bulldog americano solo figuran en la lista de bodega — el bulldog francés sigue admitido en cabina. El bullmastiff y el dogo de Burdeos están explícitamente exentos y se aceptan. No se recomienda la sedación."
      pt: "Lista publicada pela Air Transat — e qualquer cruzamento que inclua uma ou mais dessas raças: mastins (todas as raças, incl. dogo argentino, bandog, boerboel, fila brasileiro, cane corso, mastim napolitano, presa canario, tosa inu), pit bulls (todas as raças, incl. American Bully, American Pit Bull Terrier, American Staffordshire Terrier, Staffordshire bull terrier), akita, ovtcharka do Cáucaso, kangal / pastor da Anatólia (karabash), rottweiler, híbridos cão-lobo, doberman. O buldogue francês e o buldogue americano constam apenas da lista do porão — o buldogue francês continua admitido na cabine. O bullmastiff e o dogue de Bordeaux são explicitamente isentos e aceitos. A sedação não é recomendada."
# La Jamaïque seule : « No animals are accepted on flights to Jamaica ». Le R.-U. et l'Irlande
# restent dans la liste des destinations — Air Transat y transporte des animaux, par le fret,
# et en cabine ou en soute au départ de Manchester et de Glasgow.
noPetCountries: [JM]
temperature:
  pills:
    - cls: warn
      label:
        en: "Temperature limits: not disclosed"
        fr: "Limites de température : non communiqué"
        es: "Límites de temperatura: no comunicado"
        pt: "Limites de temperatura: não divulgados"
  note:
    en: Air Transat publishes no hold-temperature limits or embargo; hold acceptance is subject to loading restrictions.
    fr: Air Transat ne publie pas de limites de température en soute ni d'embargo ; l'acceptation en soute est soumise à des restrictions de chargement.
    es: Air Transat no publica límites de temperatura en bodega ni embargo; la aceptación en bodega está sujeta a restricciones de carga.
    pt: "A Air Transat não divulga limites de temperatura no porão nem embargo; a aceitação no porão está sujeita a restrições de carregamento."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: Service animals on duty fly free in the cabin; certified service dogs are welcome.
      fr: Les animaux d'assistance en service voyagent gratuitement en cabine ; les chiens d'assistance certifiés sont admis.
      es: Los animales de asistencia en servicio viajan gratis en cabina; se admiten perros de asistencia certificados.
      pt: "Os animais de serviço em atividade voam gratuitamente na cabine; cães de serviço certificados são bem-vindos."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: "Certified service dogs to London/Manchester/Glasgow: reserve via the call centre ≥ 7 days ahead."
      fr: "Chiens d'assistance certifiés vers Londres/Manchester/Glasgow : réserver via le centre d'appel ≥ 7 jours à l'avance."
      es: "Perros de asistencia certificados hacia Londres/Manchester/Glasgow: resérvalos a través del centro de llamadas con ≥ 7 días de antelación."
      pt: "Cães de serviço certificados para Londres/Manchester/Glasgow: reserve pela central de atendimento com ≥ 7 dias de antecedência."
goodToKnow:
  - icon: 🎟️
    label:
      en: Where the service doesn't exist
      fr: Où le service n'existe pas
      es: Dónde no existe el servicio
      pt: "Onde o serviço não existe"
    value:
      en: "Read this before anything else — it decides whether the trip is possible at all. No pets on codeshare flights, on flights operated by another carrier, or in vacation packages. In the hold, no pets on connecting flights either, and none with Train + Air (the cabin does allow pets on Train + Air, under SNCF's own conditions)."
      fr: "À lire avant tout le reste : c'est ce qui décide si le voyage est possible. Pas d'animal sur les vols en partage de code, sur les vols opérés par une autre compagnie, ni dans les forfaits vacances. En soute, pas d'animal non plus en correspondance, ni en Train + Air (la cabine, elle, accepte l'animal en Train + Air, selon les conditions propres à la SNCF)."
      es: "Léelo antes que nada: decide si el viaje es siquiera posible. Nada de mascotas en vuelos en código compartido, en vuelos operados por otra aerolínea ni en paquetes vacacionales. En bodega, tampoco en vuelos con conexión ni en Train + Air (la cabina sí admite mascota en Train + Air, según las condiciones propias de la SNCF)."
      pt: "Leia antes de tudo: é o que decide se a viagem é possível. Nenhum animal em voos em code-share, em voos operados por outra companhia nem em pacotes de férias. No porão, também não em voos com conexão nem no Train + Air (a cabine aceita animal no Train + Air, conforme as condições da própria SNCF)."
  - icon: 🌍
    label:
      en: Routes that are closed
      fr: Routes fermées
      es: Rutas cerradas
      pt: "Rotas fechadas"
    value:
      en: "No animals at all on flights to Jamaica. No one-way carriage from the Dominican Republic, Colombia, El Salvador, Cuba, Peru, Morocco, Guyana, Brazil, Türkiye or Haiti — a round trip is accepted if reserved in advance through the contact centre. To the United States, no animal that has been in a CDC high-risk rabies country in the previous 6 months is accepted. Certified service dogs have their own exceptions on these routes."
      fr: "Aucun animal sur les vols vers la Jamaïque. Pas d'aller simple au départ de la République dominicaine, de la Colombie, du Salvador, de Cuba, du Pérou, du Maroc, du Guyana, du Brésil, de la Türkiye ou d'Haïti — l'aller-retour est accepté s'il est réservé à l'avance auprès du centre d'appel. Vers les États-Unis, aucun animal ayant séjourné dans un pays à haut risque rabique (liste CDC) au cours des 6 derniers mois n'est accepté. Les chiens d'assistance certifiés bénéficient d'exceptions propres sur ces routes."
      es: "Ningún animal en los vuelos a Jamaica. Nada de trayectos de solo ida desde República Dominicana, Colombia, El Salvador, Cuba, Perú, Marruecos, Guyana, Brasil, Türkiye o Haití — el ida y vuelta se acepta si se reserva por adelantado en el centro de contacto. Hacia Estados Unidos no se acepta ningún animal que haya estado en un país de alto riesgo de rabia (lista de los CDC) en los 6 meses anteriores. Los perros de asistencia certificados tienen excepciones propias en estas rutas."
      pt: "Nenhum animal nos voos para a Jamaica. Sem trecho de ida simples partindo da República Dominicana, Colômbia, El Salvador, Cuba, Peru, Marrocos, Guiana, Brasil, Türkiye ou Haiti — a ida e volta é aceita se reservada com antecedência pela central de atendimento. Para os Estados Unidos, nenhum animal que tenha estado em um país de alto risco de raiva (lista do CDC) nos 6 meses anteriores é aceito. Cães de assistência certificados têm exceções próprias nessas rotas."
  - icon: 📄
    label:
      en: Minimum age
      fr: Âge minimal
      es: Edad mínima
      pt: "Idade mínima"
    value:
      en: "12 weeks and fully weaned to every destination — except 6 months for flights to the United States and 4 months for flights to Guyana. You must be at least 16 to travel with an animal."
      fr: "12 semaines et sevré vers toutes les destinations — sauf 6 mois pour les vols vers les États-Unis et 4 mois pour les vols vers le Guyana. Tu dois avoir au moins 16 ans pour voyager avec un animal."
      es: "12 semanas y completamente destetado hacia cualquier destino — salvo 6 meses para los vuelos a Estados Unidos y 4 meses para los vuelos a Guyana. Debes tener al menos 16 años para viajar con un animal."
      pt: "12 semanas e totalmente desmamado para qualquer destino — exceto 6 meses para voos aos Estados Unidos e 4 meses para voos à Guiana. Você precisa ter pelo menos 16 anos para viajar com um animal."
  - icon: 🐾
    label:
      en: Cats & dogs only
      fr: Chats & chiens seuls
      es: Solo gatos y perros
      pt: "Somente gatos e cachorros"
    value:
      en: Only domestic cats and dogs are accepted; all other animals are refused.
      fr: Seuls les chats et chiens domestiques sont acceptés ; tous les autres animaux sont refusés.
      es: Solo se aceptan gatos y perros domésticos; el resto de animales son rechazados.
      pt: "Somente gatos e cachorros domésticos são aceitos; todos os demais animais são recusados."
  - icon: 📄
    label:
      en: Pet Information Form
      fr: Formulaire animal
      es: Formulario de información de la mascota
      pt: "Formulário de Informações do Animal"
    value:
      en: Complete a Pet Information Form after booking and present it at check-in; arrive 2 h ahead.
      fr: Remplir un formulaire d'information animal après la réservation et le présenter à l'enregistrement ; arriver 2 h avant.
      es: Rellena un formulario de información de la mascota tras la reserva y preséntalo en la facturación; llega 2 h antes.
      pt: "Preencha um Formulário de Informações do Animal após a reserva e apresente-o no check-in; chegue com 2 h de antecedência."
  - icon: 💶
    label:
      en: Canada entry
      fr: Entrée au Canada
      es: Entrada a Canadá
      pt: "Entrada no Canadá"
    value:
      en: A CAD $30 CFIA inspection fee (per animal) applies on entry to Canada, except from the US.
      fr: Des frais d'inspection ACIA de 30 $ CAD (par animal) s'appliquent à l'entrée au Canada, sauf en provenance des USA.
      es: Se aplica una tasa de inspección de la CFIA de 30 $ CAD (por animal) al entrar en Canadá, salvo desde EE. UU.
      pt: "Uma taxa de inspeção da CFIA de CAD $30 (por animal) se aplica na entrada no Canadá, exceto vindo dos EUA."
