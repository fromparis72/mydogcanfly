verdict:
  cls: no
  label:
    en: Hard
    fr: Difficile
    es: Difícil
    pt: "Difícil"
verdictNote:
  en: No cabin or checked pets; pets travel only via IAG Cargo through a pet agent (Ireland is rabies-free).
  fr: Pas d'animaux en cabine ni en bagage enregistré ; les animaux ne voyagent que via IAG Cargo par un agent (l'Irlande est indemne de rage).
  es: No se admiten mascotas en cabina ni facturadas; las mascotas solo viajan vía IAG Cargo mediante un agente (Irlanda está libre de rabia).
  pt: "Sem animais na cabine nem em bagagem despachada; os animais só viajam via IAG Cargo, por meio de um agente de animais (a Irlanda é livre de raiva)."
