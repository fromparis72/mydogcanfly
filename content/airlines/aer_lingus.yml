id: airline_aer_lingus
mono: EI
name: Aer Lingus
titleH1:
  en: Flying with a dog on Aer Lingus
  fr: Voyager avec un chien sur Aer Lingus
  es: Volar con un perro en Aer Lingus
  pt: "Viajar com um cachorro na Aer Lingus"
metaDesc:
  en: "Aer Lingus pet policy: cargo-only via IAG Cargo, cabin assistance dogs, restrictions and official sources."
  fr: "Politique animaux Aer Lingus : fret uniquement via IAG Cargo, chiens d'assistance en cabine, restrictions et sources officielles."
  es: "Política de mascotas de Aer Lingus: solo carga vía IAG Cargo, perros de asistencia en cabina, restricciones y fuentes oficiales."
  pt: "Política de animais da Aer Lingus: somente carga via IAG Cargo, cães de assistência na cabine, restrições e fontes oficiais."
