restrictions:
  - icon: 🐶
    title:
      en: Flat-faced breeds
      fr: Races brachycéphales
      es: Razas de hocico chato
      pt: "Raças de focinho achatado"
    pills:
      - cls: ok
        label:
          en: Cabin possible
          fr: Cabine possible
          es: Cabina posible
          pt: "Cabine possível"
      - cls: no
        label:
          en: Hold/cargo forbidden
          fr: Soute/fret interdits
          es: Bodega/carga prohibidos
          pt: "Porão/carga proibidos"
    note:
      en: "Aegean's own published list, not accepted in the hold or as cargo. Dogs: Affenpinscher, American Bully, American Staffordshire Terrier, Boston Terrier, Boxer (all), Brussels Griffon, Bulldog (all), Cane Corso, Cavalier King Charles Spaniel, Chow Chow, Dogue de Bordeaux, English Toy Spaniel (King Charles Spaniel), Japanese Spaniel (Chin), Lhasa Apso, Mastiff (all), Pekingese, Pinscher, Pit Bull, Presa Canario, Pug (all), Shar Pei, Shih Tzu, Staffordshire Bull Terrier, Tibetan Spaniel — and any mix or hybrid of those. Cats: American Longhair, American Shorthair, British Longhair, British Shorthair, Burmese, Exotic, Himalayan, Persian, Scottish Fold, Scottish Straight, Selkirk Rex."
      fr: "Liste publiée par Aegean, refusée en soute et en fret. Chiens : affenpinscher, American Bully, American Staffordshire Terrier, Boston terrier, boxer (tous), griffon bruxellois, bouledogue (tous), Cane Corso, cavalier King Charles, chow chow, dogue de Bordeaux, King Charles spaniel, épagneul japonais (chin), lhassa apso, mastiff (tous), pékinois, pinscher, pit-bull, Presa Canario, carlin (tous), shar-peï, shih tzu, Staffordshire bull terrier, épagneul tibétain — et tout croisement ou hybride de ces races. Chats : American Longhair, American Shorthair, British Longhair, British Shorthair, burmese, exotic, himalayen, persan, Scottish Fold, Scottish Straight, Selkirk Rex."
      es: "Lista publicada por Aegean, no aceptada en bodega ni como carga. Perros: affenpinscher, American Bully, American Staffordshire Terrier, Boston terrier, bóxer (todos), grifón de Bruselas, bulldog (todos), Cane Corso, cavalier King Charles, chow chow, dogo de Burdeos, King Charles spaniel, spaniel japonés (chin), lhasa apso, mastín (todos), pekinés, pinscher, pit bull, Presa Canario, carlino (todos), shar pei, shih tzu, Staffordshire bull terrier, spaniel tibetano — y cualquier cruce o híbrido de esas razas. Gatos: American Longhair, American Shorthair, British Longhair, British Shorthair, burmés, exótico, himalayo, persa, Scottish Fold, Scottish Straight, Selkirk Rex."
      pt: "Lista publicada pela Aegean, não aceita no porão nem como carga. Cachorros: affenpinscher, American Bully, American Staffordshire Terrier, Boston terrier, boxer (todos), grifon de Bruxelas, buldogue (todos), Cane Corso, cavalier King Charles, chow chow, dogue de Bordeaux, King Charles spaniel, spaniel japonês (chin), lhasa apso, mastim (todos), pequinês, pinscher, pit bull, Presa Canario, pug (todos), shar-pei, shih tzu, Staffordshire bull terrier, spaniel tibetano — e qualquer cruzamento ou híbrido dessas raças. Gatos: American Longhair, American Shorthair, British Longhair, British Shorthair, burmês, exótico, himalaio, persa, Scottish Fold, Scottish Straight, Selkirk Rex."
  - icon: 🚫
    title:
      en: Other breeds
      fr: Autres races
      es: Otras razas
      pt: "Outras raças"
    pills:
      - cls: no
        label:
          en: Not in cabin/hold
          fr: Ni cabine ni soute
          es: Ni en cabina ni en bodega
          pt: "Nem na cabine nem no porão"
      - cls: no
        label:
          en: No sedation
          fr: Pas de sédation
          es: Sin sedación
          pt: "Sem sedação"
    note:
      en: "Aegean's separate 'other breeds' list, accepted neither in the cabin nor in the hold — contact the Cargo Dept: Bandog, Caucasian Ovcharka, Dogo Argentino, Doberman Pinscher (incl. Purina/Isabella), Fila Brasileiro, Japanese Tosa, Karabash, Mastino Napoletano, Rottweiler, Tosa Inu. Pit bull, American Staffordshire Terrier and Presa Canario are not on this list — Aegean bars them from the hold and cargo as flat-faced breeds, so the cabin stays open to them in principle (in practice the 8 kg limit closes it for an adult). Pets must not be sedated."
      fr: "Liste « autres races » distincte chez Aegean, admises ni en cabine ni en soute — contacter le service Cargo : bandog, berger du Caucase, dogo argentino, dobermann (y compris Purina/Isabelle), fila brasileiro, tosa japonais, karabash, mâtin napolitain, rottweiler, tosa inu. Le pit-bull, l'American Staffordshire Terrier et le Presa Canario n'y figurent pas : Aegean les refuse en soute et en fret au titre des races au nez écrasé, la cabine leur reste donc ouverte en principe (en pratique, la limite de 8 kg la ferme pour un adulte). Les animaux ne doivent pas être sédatés."
      es: "Lista «otras razas» aparte de Aegean, no admitidas ni en cabina ni en bodega — contacta con el departamento de carga: bandog, ovcharka del Cáucaso, dogo argentino, dóberman (incl. Purina/Isabella), fila brasileiro, tosa japonés, karabash, mastín napolitano, rottweiler, tosa inu. El pit bull, el American Staffordshire Terrier y el Presa Canario no figuran en ella: Aegean los rechaza en bodega y carga como razas de hocico chato, así que la cabina les queda abierta en principio (en la práctica, el límite de 8 kg la cierra para un adulto). Las mascotas no deben ser sedadas."
      pt: "Lista \"outras raças\" separada da Aegean, não admitidas nem na cabine nem no porão — entre em contato com o departamento de carga: bandog, ovtcharka do Cáucaso, dogo argentino, doberman (incl. Purina/Isabella), fila brasileiro, tosa japonês, karabash, mastim napolitano, rottweiler, tosa inu. O pit bull, o American Staffordshire Terrier e o Presa Canario não constam dela: a Aegean os recusa no porão e na carga como raças de focinho achatado, portanto a cabine lhes fica aberta em princípio (na prática, o limite de 8 kg a fecha para um adulto). Os animais não podem ser sedados."
temperature:
  pills:
    - cls: warn
      label:
        en: "Temperature limits: not disclosed"
        fr: "Limites de température : non communiqué"
        es: "Límites de temperatura: no comunicado"
        pt: "Limites de temperatura: não divulgados"
  note:
    en: Aegean publishes no hold-temperature limits or seasonal embargo on its pet pages.
    fr: Aegean ne publie pas de limites de température en soute ni d'embargo saisonnier sur ses pages animaux.
    es: Aegean no publica límites de temperatura en bodega ni embargo estacional en sus páginas de mascotas.
    pt: "A Aegean não publica limites de temperatura no porão nem embargo sazonal em suas páginas sobre animais."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: Trained service and rescue dogs travel free in the cabin; notify Aegean before booking.
      fr: Les chiens d'assistance et de sauvetage dressés voyagent gratuitement en cabine ; prévenir Aegean avant de réserver.
      es: Los perros de asistencia y de rescate adiestrados viajan gratis en cabina; avisa a Aegean antes de reservar.
      pt: "Cães de assistência e de resgate treinados viajam grátis na cabine; avise a Aegean antes de reservar."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: Certification from an ADI/IGDF/EGDF member or national guide-dog school. Min 12 weeks, rabies vaccine at least 21 days old on the day of travel.
      fr: Certification d'un membre ADI/IGDF/EGDF ou d'une école nationale de chiens guides. Min 12 semaines, vaccin antirabique datant d'au moins 21 jours le jour du voyage.
      es: Certificación de un miembro ADI/IGDF/EGDF o de una escuela nacional de perros guía. Mín 12 semanas, vacuna antirrábica de al menos 21 días el día del viaje.
      pt: "Certificação de um membro ADI/IGDF/EGDF ou de uma escola nacional de cães-guia. Mín. 12 semanas, vacina antirrábica com pelo menos 21 dias no dia da viagem."
goodToKnow:
  - icon: 🚫
    label:
      en: Destination limits
      fr: Limites de destination
      es: Límites de destino
      pt: "Limites de destino"
    value:
      en: "Dubai, Abu Dhabi & Saudi Arabia: cats/dogs only as cargo (Saudi Arabia also requires permits and health documents through the NAAMA portal). To the UK only via London Heathrow as cargo; from the UK cabin/hold allowed except Gatwick (cargo only). Ireland: dogs with cropped ears need an import licence from the Department of Agriculture plus an original vet certificate giving the medical reason."
      fr: "Dubaï, Abou Dabi & Arabie saoudite : chats/chiens uniquement en fret (l'Arabie saoudite exige en plus des permis et documents sanitaires via le portail NAAMA). Vers le R.-U. uniquement via Londres Heathrow en fret ; depuis le R.-U. cabine/soute possibles sauf Gatwick (fret uniquement). Irlande : un chien aux oreilles coupées a besoin d'une licence d'importation du ministère de l'Agriculture et d'un certificat vétérinaire original indiquant le motif médical."
      es: "Dubái, Abu Dabi y Arabia Saudí: gatos/perros solo como carga (Arabia Saudí exige además permisos y documentos sanitarios a través del portal NAAMA). Al Reino Unido solo vía Londres Heathrow como carga; desde el Reino Unido se permite cabina/bodega excepto Gatwick (solo carga). Irlanda: un perro con las orejas cortadas necesita una licencia de importación del Ministerio de Agricultura y un certificado veterinario original que indique el motivo médico."
      pt: "Dubai, Abu Dhabi e Arábia Saudita: gatos/cachorros somente como carga (a Arábia Saudita exige ainda permissões e documentos sanitários pelo portal NAAMA). Para o Reino Unido somente via Londres Heathrow como carga; a partir do Reino Unido, cabine/porão permitidos exceto em Gatwick (somente carga). Irlanda: um cachorro com as orelhas cortadas precisa de licença de importação do Ministério da Agricultura e de um atestado veterinário original com o motivo médico."
  - icon: 🎫
    label:
      en: Priority basis
      fr: Sur priorité
      es: Con prioridad
      pt: "Por prioridade"
    value:
      en: Limited pets per flight; a Live Animal Acceptance Checklist is signed at check-in.
      fr: Nombre d'animaux limité par vol ; une checklist d'acceptation d'animal vivant est signée à l'enregistrement.
      es: Número limitado de mascotas por vuelo; se firma una lista de aceptación de animal vivo en la facturación.
      pt: "Número limitado de animais por voo; uma lista de verificação de aceitação de animal vivo é assinada no check-in."
  - icon: 📄
    label:
      en: Age & vaccine
      fr: Âge & vaccin
      es: Edad y vacuna
      pt: "Idade e vacina"
    value:
      en: "Pets must be 12 weeks+ and the rabies vaccine must have been given after the microchip. The vaccine must also be at least 21 days old on the day you fly — a booster given before the previous one expired is exempt from that 21-day wait."
      fr: "Ton animal doit avoir 12 semaines minimum et le vaccin antirabique doit avoir été fait après la pose de la puce. Le vaccin doit aussi dater d'au moins 21 jours le jour du vol — un rappel fait avant l'expiration du précédent échappe à ce délai de 21 jours."
      es: "Tu mascota debe tener 12 semanas como mínimo y la vacuna antirrábica debe haberse puesto después del microchip. Además, la vacuna debe tener al menos 21 días el día del vuelo: un refuerzo puesto antes de que caducara el anterior queda exento de esa espera de 21 días."
      pt: "Seu animal deve ter no mínimo 12 semanas e a vacina antirrábica deve ter sido aplicada depois do microchip. A vacina também precisa ter pelo menos 21 dias no dia do voo — um reforço aplicado antes de o anterior vencer fica isento dessa espera de 21 dias."
  - icon: 🕐
    label:
      en: Booking & desk times
      fr: Réservation & comptoir
      es: Reserva y mostrador
      pt: "Reserva e balcão"
    value:
      en: "Book up to 2 h before departure; a per-passenger service fee applies if you add the pet through the call centre after your ticket has been issued. Present your pet at a check-in counter at least 1 h before departure — online check-in doesn't exempt you from collecting the boarding pass at the airport."
      fr: "Réserve jusqu'à 2 h avant le départ ; des frais de service par passager s'appliquent si tu ajoutes l'animal par le centre d'appel après l'émission du billet. Présente ton animal à un comptoir d'enregistrement au moins 1 h avant le départ — l'enregistrement en ligne ne te dispense pas de retirer la carte d'embarquement à l'aéroport."
      es: "Reserva hasta 2 h antes de la salida; se aplica una tasa de servicio por pasajero si añades la mascota por el centro de llamadas después de emitir el billete. Presenta tu mascota en un mostrador de facturación al menos 1 h antes de la salida — la facturación en línea no te exime de recoger la tarjeta de embarque en el aeropuerto."
      pt: "Reserve até 2 h antes da partida; uma taxa de serviço por passageiro se aplica se você adicionar o animal pela central de atendimento após a emissão do bilhete. Apresente seu animal em um balcão de check-in pelo menos 1 h antes da partida — o check-in on-line não dispensa a retirada do cartão de embarque no aeroporto."
crate:
  - en: "Cabin carrier: max 55 × 40 × 23 cm — but 40 × 25 × 25 cm on DH8-100 and ATR aircraft."
    fr: "Sac cabine : max 55 × 40 × 23 cm — mais 40 × 25 × 25 cm sur DH8-100 et ATR."
    es: "Bolso de cabina: máx. 55 × 40 × 23 cm — pero 40 × 25 × 25 cm en DH8-100 y ATR."
    pt: "Bolsa de cabine: máx. 55 × 40 × 23 cm — mas 40 × 25 × 25 cm em DH8-100 e ATR."
  - en: "Hold crate, medium pet (8–25 kg): max 71 × 52 × 55 cm."
    fr: "Caisse soute, animal moyen (8–25 kg) : max 71 × 52 × 55 cm."
    es: "Jaula de bodega, mascota mediana (8–25 kg): máx. 71 × 52 × 55 cm."
    pt: "Caixa de porão, animal médio (8–25 kg): máx. 71 × 52 × 55 cm."
  - en: "Hold crate, large pet (over 25 kg): max 105 × 75 × 79 cm. Beyond that, cargo only."
    fr: "Caisse soute, grand animal (plus de 25 kg) : max 105 × 75 × 79 cm. Au-delà, fret uniquement."
    es: "Jaula de bodega, mascota grande (más de 25 kg): máx. 105 × 75 × 79 cm. Por encima, solo carga."
    pt: "Caixa de porão, animal grande (acima de 25 kg): máx. 105 × 75 × 79 cm. Acima disso, somente carga."
  - en: "Ventilation on at least four sides; door hinge and locking pins engaging the container by at least 1.6 cm; leak-proof, escape-proof and claw-proof, with a lock and tie wraps for the hold."
    fr: "Aération sur au moins quatre côtés ; charnière et pênes de porte engageant la caisse d'au moins 1,6 cm ; étanche, inviolable et résistante aux griffes, avec serrure et colliers de serrage pour la soute."
    es: "Ventilación en al menos cuatro lados; bisagra y pasadores de la puerta que encajen al menos 1,6 cm; estanca, a prueba de fugas y de arañazos, con cerradura y bridas para la bodega."
    pt: "Ventilação em pelo menos quatro lados; dobradiça e pinos da porta engatando pelo menos 1,6 cm; estanque, à prova de fuga e de garras, com fechadura e abraçadeiras para o porão."
