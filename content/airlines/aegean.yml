verdictNote:
  en: Small pets in the cabin and larger dogs in the hold on most routes, with clear published fees.
  fr: Petits animaux en cabine et grands chiens en soute sur la plupart des routes, avec des tarifs clairs publiés.
  es: Mascotas pequeñas en cabina y perros más grandes en bodega en la mayoría de las rutas, con tarifas publicadas claras.
  pt: "Animais pequenos na cabine e cachorros maiores no porão na maioria das rotas, com tarifas claras publicadas."
