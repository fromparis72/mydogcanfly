policies:
  cabin:
    availability: offered
  hold:
    availability: offered
  cargo:
    review_state: legacy_unreviewed
channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: One cat or dog ≤ 8 kg incl. carrier in an approved carrier under the seat; window seat, not first row/exit. Not when travelling with an infant.
      fr: Un chat ou chien ≤ 8 kg avec le sac dans un sac approuvé sous le siège ; place hublot, hors premier rang/issue. Pas avec un bébé.
      es: Un gato o perro ≤ 8 kg incluida la jaula, en una jaula aprobada bajo el asiento; asiento de ventanilla, no en la primera fila ni en salidas. No si viajas con un bebé.
      pt: "Um gato ou cachorro ≤ 8 kg com a bolsa incluída, em uma bolsa de transporte aprovada, sob o assento; assento de janela, fora da primeira fila e das saídas de emergência. Não é permitido viajando com um bebê."
    fee:
      en: €35–65
      fr: 35–65 €
      es: 35–65 €
      pt: "35–65 €"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Cats & dogs only (medium 8–25 kg / large > 25 kg) in the hold of A320/A321/ATR; not for connections over 3 h. Snub-nosed breeds barred.
      fr: Chats et chiens uniquement (moyen 8–25 kg / grand > 25 kg) en soute des A320/A321/ATR ; pas pour les correspondances de plus de 3 h. Races au nez écrasé exclues.
      es: Solo gatos y perros (mediano 8–25 kg / grande > 25 kg) en la bodega de A320/A321/ATR; no para conexiones de más de 3 h. Razas de hocico chato excluidas.
      pt: "Somente gatos e cachorros (médio 8–25 kg / grande > 25 kg) no porão dos A320/A321/ATR; não disponível para conexões acima de 3 h. Raças de focinho achatado proibidas."
    fee:
      en: €50–190
      fr: 50–190 €
      es: 50–190 €
      pt: "50–190 €"
  - placement: cargo
    icon: ✈️
    name:
      en: Aegean Cargo
      fr: Aegean Cargo
      es: Aegean Cargo
      pt: "Aegean Cargo"
    cls: warn
    statusLabel:
      en: Via cargo
      fr: Via fret
      es: Vía carga
      pt: "Via carga"
    detail:
      en: Unaccompanied pets, crates over 105 × 75 × 79 cm, or cats/dogs to the UK.
      fr: Animaux non accompagnés, caisses de plus de 105 × 75 × 79 cm, ou chats/chiens vers le R.-U.
      es: Mascotas no acompañadas, jaulas de más de 105 × 75 × 79 cm, o gatos/perros al Reino Unido.
      pt: "Animais desacompanhados, caixas de transporte acima de 105 × 75 × 79 cm, ou gatos/cachorros para o Reino Unido."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
