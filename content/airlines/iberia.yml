  note:
    en: EUR, online per segment; airport and connecting-flight rates are higher.
    fr: EUR, en ligne par tronçon ; les tarifs aéroport et en correspondance sont plus élevés.
    es: EUR, en línea por tramo; las tarifas en aeropuerto y con conexión son más altas.
    pt: "EUR, online por trecho; as tarifas no aeroporto e em conexões são mais altas."
restrictions:
  - icon: 🐶
    title:
      en: Flat-faced breeds
      fr: Races brachycéphales
      es: Razas de hocico chato
      pt: "Raças de focinho achatado"
    pills:
      - cls: ok
        label:
          en: Cabin possible
          fr: Cabine possible
          es: Cabina posible
          pt: "Cabine possível"
      - cls: no
        label:
          en: Hold forbidden
          fr: Soute interdite
          es: Bodega prohibida
          pt: "Porão proibido"
    note:
      en: "Snub-nosed dogs & cats can't travel in the hold (heat/breathing risk) but may fly in the cabin: boxers, bulldogs (all), Boston terrier, pug, Shih Tzu, Pekingese, chow chow, Cane Corso, Dogue de Bordeaux, mastiffs, Shar Pei, and Persian/Exotic/Himalayan/Burmese cats."
      fr: "Chiens et chats au nez écrasé interdits en soute (risque chaleur/respiration) mais admis en cabine : boxers, bouledogues (tous), Boston terrier, carlin, Shih Tzu, pékinois, chow chow, Cane Corso, Dogue de Bordeaux, mastiffs, Shar Pei, et chats persans/exotiques/himalayens/birmans."
      es: "Los perros y gatos de hocico chato no pueden viajar en bodega (riesgo de calor/respiración), pero sí pueden ir en cabina: bóxeres, bulldogs (todos), bóston terrier, carlino, shih tzu, pequinés, chow chow, cane corso, dogo de Burdeos, mastines, shar pei, y gatos persas/exóticos/himalayos/birmanos."
      pt: "Cachorros e gatos de focinho achatado não podem viajar no porão (risco de calor/respiração), mas podem voar na cabine: boxers, buldogues (todos), Boston Terrier, pug, Shih Tzu, Pequinês, Chow Chow, Cane Corso, Dogue de Bordeaux, mastins, Shar Pei, e gatos persas/exóticos/himalaios/burmeses."
  - icon: 🚫
    title:
      en: Dangerous breeds
      fr: Races dangereuses
      es: Razas potencialmente peligrosas
      pt: "Raças perigosas"
    pills:
      - cls: no
        label:
          en: Cabin & hold banned
          fr: Cabine & soute interdites
          es: Cabina y bodega prohibidas
          pt: "Cabine e porão proibidos"
    note:
      en: Dangerous breeds (pit bull, Staffordshire, American Staffordshire, Rottweiler, Doberman, Dogo Argentino, Fila Brasileiro, Tosa, Akita) are banned from cabin and hold — cargo only. Ferrets and weasel-family animals aren't carried.
      fr: Races dangereuses (pit-bull, Staffordshire, American Staffordshire, Rottweiler, Doberman, Dogo Argentino, Fila Brasileiro, Tosa, Akita) interdites en cabine et en soute — fret uniquement. Furets et mustélidés non transportés.
      es: "Las razas potencialmente peligrosas (pit bull, staffordshire, american staffordshire, rottweiler, doberman, dogo argentino, fila brasileiro, tosa, akita) están prohibidas en cabina y bodega: solo carga. Los hurones y demás mustélidos no se transportan."
      pt: "As raças perigosas (pit bull, Staffordshire, American Staffordshire, Rottweiler, Dobermann, Dogo Argentino, Fila Brasileiro, Tosa, Akita) são proibidas na cabine e no porão — somente carga. Furões e outros mustelídeos não são transportados."
temperature:
  pills:
    - cls: warn
      label:
        en: "Temperature limits: not disclosed"
        fr: "Limites de température : non communiqué"
        es: "Límites de temperatura: no divulgados"
        pt: "Limites de temperatura: não divulgados"
    - cls: warn
      label:
        en: "Heat embargo: not disclosed"
        fr: "Embargo chaleur : non communiqué"
        es: "Embargo por calor: no divulgado"
        pt: "Embargo por calor: não divulgado"
  note:
    en: Iberia publishes no hold-temperature limits or seasonal embargo beyond the brachycephalic heat-risk rationale.
    fr: Iberia ne publie pas de limites de température en soute ni d'embargo saisonnier, au-delà du motif de risque chaleur pour les brachycéphales.
    es: Iberia no publica límites de temperatura en bodega ni embargo estacional más allá del motivo de riesgo por calor en las razas braquicéfalas.
    pt: "A Iberia não divulga limites de temperatura no porão nem embargo sazonal, além do critério de risco por calor para as raças braquicefálicas."
assistance:
  - icon: ✓
    label:
      en: In the cabin
      fr: En cabine
      es: En cabina
      pt: "Na cabine"
    value:
      en: Recognised assistance dogs fly free in the cabin at the owner's feet; emotional-support dogs follow pet rules.
      fr: Chiens d'assistance reconnus gratuits en cabine aux pieds du maître ; chiens de soutien émotionnel soumis aux règles animaux.
      es: Los perros de asistencia reconocidos viajan gratis en cabina a los pies del dueño; los perros de apoyo emocional se rigen por las normas de mascotas.
      pt: "Cães de assistência reconhecidos viajam gratuitamente na cabine aos pés do dono; cães de apoio emocional seguem as regras para animais de estimação."
  - icon: 📄
    label:
      en: Documents
      fr: Documents
      es: Documentos
      pt: "Documentos"
    value:
      en: "Notify ≥ 48 h ahead with ID/certificate (IGDF/ADI/ONCE). UK: Pet Travel Scheme + Animal Aircare ≥ 72 h. US: DOT form."
      fr: "Prévenir ≥ 48 h à l'avance avec pièce/certificat (IGDF/ADI/ONCE). R.-U. : Pet Travel Scheme + Animal Aircare ≥ 72 h. USA : formulaire DOT."
      es: "Avisa con ≥ 48 h de antelación con documento/certificado (IGDF/ADI/ONCE). R.U.: Pet Travel Scheme + Animal Aircare ≥ 72 h. EE. UU.: formulario DOT."
      pt: "Avise com ≥ 48 h de antecedência, com identificação/certificado (IGDF/ADI/ONCE). R.U.: Pet Travel Scheme + Animal Aircare ≥ 72 h. EUA: formulário DOT."
goodToKnow:
  - icon: 🚫
    label:
      en: No pets to the UK
      fr: Pas d'animaux vers le R.-U.
      es: Sin mascotas al R.U.
      pt: "Sem animais para o Reino Unido"
    value:
      en: No cabin pets to UK airports and no hold pets to/from the UK — cargo only.
      fr: Pas d'animaux en cabine vers les aéroports britanniques ni en soute de/vers le R.-U. — fret uniquement.
      es: "Sin mascotas en cabina a aeropuertos británicos ni en bodega hacia/desde el R.U.: solo carga."
      pt: "Sem animais em cabine para aeroportos do R.U. nem no porão de/para o R.U. — somente carga."
  - icon: 💻
    label:
      en: Online booking
      fr: Réservation en ligne
      es: Reserva en línea
      pt: "Reserva online"
    value:
      en: Cabin dogs, cats, tortoises & birds can be added online at booking (≥ 48 h before).
      fr: Chiens, chats, tortues et oiseaux en cabine ajoutables en ligne à l'achat (≥ 48 h avant).
      es: Los perros, gatos, tortugas y aves de cabina se pueden añadir en línea al comprar el billete (≥ 48 h antes).
      pt: "Cachorros, gatos, tartarugas e aves em cabine podem ser adicionados online na compra da passagem (≥ 48 h antes)."
  - icon: ⏱️
    label:
      en: Hold approval
      fr: Accord soute
      es: Autorización de bodega
      pt: "Autorização de porão"
    value:
      en: Hold travel needs prior approval via Iberia offices with all flights confirmed.
      fr: La soute exige un accord préalable via les bureaux Iberia, tous les vols confirmés.
      es: Viajar en bodega requiere autorización previa a través de las oficinas de Iberia, con todos los vuelos confirmados.
      pt: "Viajar no porão exige autorização prévia junto aos escritórios da Iberia, com todos os voos confirmados."
