        fr: Cabine — Europe / Afrique du N.
        es: Cabina — Europa / Norte de África
        pt: "Cabine — Europa / Norte da África"
      value:
        en: €60
        fr: 60 €
        es: 60 €
        pt: "60 €"
    - label:
        en: Cabin — America / Asia
        fr: Cabine — Amérique / Asie
        es: Cabina — América / Asia
        pt: "Cabine — América / Ásia"
      value:
        en: €180
        fr: 180 €
        es: 180 €
        pt: "180 €"
    - label:
        en: Hold (by weight & zone)
        fr: Soute (poids & zone)
        es: Bodega (por peso y zona)
        pt: "Porão (por peso e zona)"
      value:
        en: €90–330
        fr: 90–330 €
        es: 90–330 €
        pt: "90–330 €"
    - label:
        en: Assistance dog
        fr: Chien d'assistance
        es: Perro de asistencia
        pt: "Cão de assistência"
      value:
        en: Free
        fr: Gratuit
