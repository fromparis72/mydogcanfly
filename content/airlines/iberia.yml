restrictions:
  - icon: 🐶
    title:
      en: Flat-faced breeds
      fr: Races brachycéphales
      es: Razas de hocico chato
      pt: "Raças de focinho achatado"
    pills:
      - cls: ok
        label:
          en: Cabin possible
          fr: Cabine possible
          es: Cabina posible
          pt: "Cabine possível"
      - cls: no
        label:
          en: Hold forbidden
          fr: Soute interdite
          es: Bodega prohibida
          pt: "Porão proibido"
    note:
      en: "Snub-nosed dogs & cats can't travel in the hold (heat/breathing risk) but may fly in the cabin: boxers, bulldogs (all), Boston terrier, pug, Shih Tzu, Pekingese, chow chow, Cane Corso, Dogue de Bordeaux, mastiffs, Shar Pei, and Persian/Exotic/Himalayan/Burmese cats."
      fr: "Chiens et chats au nez écrasé interdits en soute (risque chaleur/respiration) mais admis en cabine : boxers, bouledogues (tous), Boston terrier, carlin, Shih Tzu, pékinois, chow chow, Cane Corso, Dogue de Bordeaux, mastiffs, Shar Pei, et chats persans/exotiques/himalayens/birmans."
      es: "Los perros y gatos de hocico chato no pueden viajar en bodega (riesgo de calor/respiración), pero sí pueden ir en cabina: bóxeres, bulldogs (todos), bóston terrier, carlino, shih tzu, pequinés, chow chow, cane corso, dogo de Burdeos, mastines, shar pei, y gatos persas/exóticos/himalayos/birmanos."
      pt: "Cachorros e gatos de focinho achatado não podem viajar no porão (risco de calor/respiração), mas podem voar na cabine: boxers, buldogues (todos), Boston Terrier, pug, Shih Tzu, Pequinês, Chow Chow, Cane Corso, Dogue de Bordeaux, mastins, Shar Pei, e gatos persas/exóticos/himalaios/burmeses."
  - icon: 🚫
    title:
      en: Dangerous breeds
      fr: Races dangereuses
      es: Razas potencialmente peligrosas
      pt: "Raças perigosas"
    pills:
      - cls: no
        label:
          en: Cabin & hold banned
          fr: Cabine & soute interdites
          es: Cabina y bodega prohibidas
          pt: "Cabine e porão proibidos"
    note:
      en: Dangerous breeds (pit bull, Staffordshire, American Staffordshire, Rottweiler, Doberman, Dogo Argentino, Fila Brasileiro, Tosa, Akita) are banned from cabin and hold — cargo only. Ferrets and weasel-family animals aren't carried.
      fr: Races dangereuses (pit-bull, Staffordshire, American Staffordshire, Rottweiler, Doberman, Dogo Argentino, Fila Brasileiro, Tosa, Akita) interdites en cabine et en soute — fret uniquement. Furets et mustélidés non transportés.
      es: "Las razas potencialmente peligrosas (pit bull, staffordshire, american staffordshire, rottweiler, doberman, dogo argentino, fila brasileiro, tosa, akita) están prohibidas en cabina y bodega: solo carga. Los hurones y demás mustélidos no se transportan."
      pt: "As raças perigosas (pit bull, Staffordshire, American Staffordshire, Rottweiler, Dobermann, Dogo Argentino, Fila Brasileiro, Tosa, Akita) são proibidas na cabine e no porão — somente carga. Furões e outros mustelídeos não são transportados."
temperature:
  pills:
