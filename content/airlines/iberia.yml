      fr: Pas d'animaux vers le R.-U.
      es: Sin mascotas al R.U.
      pt: "Sem animais para o Reino Unido"
    value:
      en: No cabin pets to UK airports and no hold pets to/from the UK — cargo only.
      fr: Pas d'animaux en cabine vers les aéroports britanniques ni en soute de/vers le R.-U. — fret uniquement.
      es: "Sin mascotas en cabina a aeropuertos británicos ni en bodega hacia/desde el R.U.: solo carga."
      pt: "Sem animais em cabine para aeroportos do R.U. nem no porão de/para o R.U. — somente carga."
  - icon: 💻
    label:
      en: Online booking
      fr: Réservation en ligne
      es: Reserva en línea
      pt: "Reserva online"
    value:
      en: Cabin dogs, cats, tortoises & birds can be added online at booking (≥ 48 h before).
      fr: Chiens, chats, tortues et oiseaux en cabine ajoutables en ligne à l'achat (≥ 48 h avant).
      es: Los perros, gatos, tortugas y aves de cabina se pueden añadir en línea al comprar el billete (≥ 48 h antes).
      pt: "Cachorros, gatos, tartarugas e aves em cabine podem ser adicionados online na compra da passagem (≥ 48 h antes)."
  - icon: ⏱️
    label:
      en: Hold approval
      fr: Accord soute
      es: Autorización de bodega
      pt: "Autorização de porão"
    value:
      en: Hold travel needs prior approval via Iberia offices with all flights confirmed.
      fr: La soute exige un accord préalable via les bureaux Iberia, tous les vols confirmés.
      es: Viajar en bodega requiere autorización previa a través de las oficinas de Iberia, con todos los vuelos confirmados.
      pt: "Viajar no porão exige autorização prévia junto aos escritórios da Iberia, com todos os voos confirmados."
