channels:
  - placement: cabin
    icon: 🐾
    name:
      en: Cabin
      fr: Cabine
      es: Cabina
      pt: "Cabine"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Dogs, cats & small pets ≤ 8 kg incl. carrier under the seat (max 45 × 35 × 25 cm). Bookable online at booking.
      fr: Chiens, chats et petits animaux ≤ 8 kg avec le sac sous le siège (max 45 × 35 × 25 cm). Réservable en ligne à l'achat.
      es: Perros, gatos y mascotas pequeñas ≤ 8 kg con la jaula bajo el asiento (máx. 45 × 35 × 25 cm). Se puede reservar en línea al comprar el billete.
      pt: "Cachorros, gatos e animais pequenos ≤ 8 kg incluindo a bolsa de transporte sob o assento (máx. 45 × 35 × 25 cm). Pode ser reservado online na compra da passagem."
    fee:
      en: €40–180
      fr: 40–180 €
      es: 40–180 €
      pt: "40–180 €"
  - placement: hold
    icon: 🧳
    name:
      en: Hold
      fr: Soute
      es: Bodega
      pt: "Porão"
    cls: ok
    statusLabel:
      en: Allowed
      fr: Autorisé
      es: Permitido
      pt: "Permitido"
    detail:
      en: Cats & dogs (not snub-nosed or dangerous breeds) up to 45 kg incl. carrier; prior authorisation required, transit 90 min–4 h.
      fr: Chats et chiens (hors races au nez écrasé ou dangereuses) jusqu'à 45 kg avec la caisse ; accord préalable requis, correspondance 90 min–4 h.
      es: Perros y gatos (salvo razas de hocico chato o potencialmente peligrosas) hasta 45 kg con la jaula; se requiere autorización previa, conexión de 90 min–4 h.
      pt: "Gatos e cachorros (exceto raças de focinho achatado ou perigosas) até 45 kg incluindo a caixa de transporte; exige autorização prévia, conexão de 90 min–4 h."
    fee:
      en: €90–330
      fr: 90–330 €
      es: 90–330 €
      pt: "90–330 €"
  - placement: cargo
    icon: ✈️
    name:
      en: IAG Cargo
      fr: IAG Cargo
      es: IAG Cargo
      pt: "IAG Cargo"
    cls: warn
    statusLabel:
      en: Via agent
      fr: Via agent
      es: Vía agente
      pt: "Via agente"
    detail:
      en: Over 45 kg, restricted breeds, unaccompanied, or to/from the UK. Booked through a cargo agent.
      fr: Au-delà de 45 kg, races restreintes, animal non accompagné, ou de/vers le R.-U. Réservé via un agent de fret.
      es: Más de 45 kg, razas restringidas, animal sin acompañante, o hacia/desde el R.U. Se reserva a través de un agente de carga.
      pt: "Acima de 45 kg, raças restritas, animal sem acompanhante, ou de/para o Reino Unido. Reservado por meio de um agente de carga."
    fee:
      en: Quote
      fr: Devis
      es: Presupuesto
      pt: "Cotação"
