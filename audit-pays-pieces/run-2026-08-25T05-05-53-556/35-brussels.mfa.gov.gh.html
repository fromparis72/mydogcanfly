<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Official mission information will appear after administrative setup." />
    <!-- %CSP_META% — injected at build time by vite.config.js -->
    <link rel="manifest" href="/api/site-settings/manifest.webmanifest" />
    <link rel="icon" href="/api/site-settings/favicon.ico" />
    <!--
      Static pre-React fallback: CRM branding (mission loading image /
      configured Coat of Arms) isn't reachable yet at this point in the boot
      sequence, so this is always the bundled Ghana Coat of Arms, shown small
      inside the same restrained navy/gold boot-gate treatment React renders
      once mounted (SiteModeBootLoader / BrandedLoadingScreen) — see
      src/lib/loadingBranding.js for the precedence applied after mount.
      Preloaded so it paints immediately instead of popping in after the
      request round-trip. This is the optimized ~128px loader derivative,
      not the full master (design-source/branding/ghana-coat-of-arms-master.webp,
      kept outside public/ as the source the derivative was generated from,
      never shipped as a runtime asset itself) — no reason to ship ~244KB on
      the critical boot path for a 40px image.
    -->
    <link rel="preload" as="image" href="/assets/branding/ghana-coat-of-arms-loader.webp" fetchpriority="high" />
    <!--
      Route-aware warm-up hint for the homepage hero/LCP path — see
      public/hero-preload-boot.js for why this is a small classic script
      (CSP script-src has no 'unsafe-inline', so an inline block would be
      blocked) rather than a static <link rel=preload as=fetch> here
      directly: a static tag in this one shared shell would fire on every
      route, not just "/". Runs before the module script below because
      classic scripts execute during HTML parsing; type="module" scripts
      wait for their whole import graph to resolve first.
    -->
    <script src="/hero-preload-boot.js"></script>
    <!--
      The mission title/description below (and the description meta tag
      above) are build-time placeholders — see the mission-name and
      mission-description placeholder constants the `mission-build-profile`
      Vite plugin (vite.config.js) replaces from
      config/mission-build-profile.json, the same non-secret release
      configuration React reads at runtime via src/lib/siteIdentity.js.
      Deliberately not spelled out literally in this comment: the plugin's
      replaceAll() runs over the whole document including comments, so
      writing the exact token text here would get it silently substituted
      too. This is what the browser tab shows before React has mounted or
      fetched anything, so it must already be the real configured mission
      title: shipping a generic fallback here is exactly the "Mission
      Website" flash this file exists to prevent. See useSeo.js for how
      React then layers a route-specific title on top without ever
      regressing to a less-specific one.
    -->
    <title>Mission</title>
    <meta property="og:site_name" content="Mission" />
    <meta property="og:title" content="Mission" />
    <meta name="twitter:title" content="Mission" />
    <meta name="application-name" content="Mission" />
    <!--
      Critical first-paint loader CSS lives in <head>, inline, so it applies
      before the browser has to wait for anything else — no flash of
      unstyled content between the markup below painting and this styling
      taking effect.
    -->
    <style>
      .first-paint-loader{position:fixed;inset:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#051a53}
      .first-paint-loader__sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
      .first-paint-loader__ring{position:relative;display:flex;height:6rem;width:6rem;align-items:center;justify-content:center}
      .first-paint-loader__spin{position:absolute;inset:0;border-radius:9999px;border:4px solid rgba(250,204,21,.2);border-top-color:#facc15;animation:first-paint-loader-spin 1s linear infinite}
      .first-paint-loader__box{display:flex;height:3.5rem;width:3.5rem;align-items:center;justify-content:center;overflow:hidden}
      .first-paint-loader__emblem{height:2.5rem;width:2.5rem;-o-object-fit:contain;object-fit:contain}
      @keyframes first-paint-loader-spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){.first-paint-loader__spin{animation:none}}
    </style>
