OA\\MOA-Website\\moa\\public\\locales","localeDetection":false},"default":{"i18n":{"defaultLocale":"ar","locales":["en","ar"],"localePath":"C:\\inetpub\\MOA\\MOA-Website\\moa\\public\\locales","localeDetection":false}}}},"data":{"nameEn":"Decree No 12301: Veterinary Quarantine ","nameAr":"مرسوم رقم ١٢٣٠١: الحجر الصحي البيطري","decisionDate":"1963-03-20T00:00:00","decisionDateEN":null,"decisionDateAR":null,"headerId":null,"productId":null,"parentDecisionId":null,"filePath":"veterinary quarantine animal products مرسوم 12301 الحجر الصحي البيطري_20220830085655_20220914143840.pdf","keywords":"","descriptionEn":"\u003cp\u003eThis decree shall apply to the veterinary quarantine, which consists in subjecting animals and animal based products exported to Lebanon to the veterinary health control in order to prevent the infiltration of pandemic deceases to Lebanon.\u003cbr /\u003e\nAll animals, domesticated and non-domesticated birds shall be subject to the provisions of this law, in addition to animal derivatives such as meat, milk and its derivatives, eggs, leather and others.\u003c/p\u003e\n\n\u003cp\u003eThis law governs the conditions of entry of animals such as their possession of a veterinary health certificate from the country of origin and other conditions in case such certificate is not available.\u003c/p\u003e\n\n\u003cp\u003eThe management of quarantine premises and persons in charge are also determined by this decree, in addition to the manner in which animals are entered, from which border they enter, the mechanism of their stamp and quarantine duration. It also determines the import procedures for certain types of animals coming from endemic countries, and the procedures that should be taken in case diseases appeared during quarantine. The animal owners\u0026rsquo; obligations are also governed.\u003cbr /\u003e\nThis decree also governs the inspection of violations and the prerogatives of the relevant employees, and determines the penalties and fines to be applied upon violation. \u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/veterinary quarantine animal products مرسوم 12301 الحجر الصحي البيطري_20220830085655_20220914143840_20220922154736.pdf\" target=\"_blank\"\u003eTo read the full Law, click on download PDF button below.\u003c/a\u003e\u003c/p\u003e\n","descriptionAr":"\u003cp\u003eيطبق هذا القانون على الحجر الصحي البيطري الذي هو عملية اخضاع الحيوانات والمواد الحيوانية المستوردة الى لبنان للمراقبة الصحية البيطرية لمنع تسرب الامراض الوبائية الى لبنان.\u003cbr /\u003e\nتخضع جميع الحيوانات والطيور الداجنة وغير الداجنة الى احكام هذا القانون كما والمشتقات الحيوانية من اللحوم والحليب ومشتقاته والبيض والجلود وغيرها.\u0026nbsp;\u003cbr /\u003e\nيرعى هذا القانون شروط دخول الحيوانات مثل حيازتها على شهادة صحية بيطرية من بلد المنشأ وغيرها من الشروط في حال عدم وجودها.\u003c/p\u003e\n\n\u003cp\u003eيحدد القانون طريقة إدارة المحاجر والمسؤولين فيهم، كما وطريقة وكيفية دخول الحيوانات ومن اية معابر حدودية وآلية ختمها ومدة حجرها. كما يحدد إجراءات الاستيراد لأنواع من الحيوانات من البلدان الموبوءة، والإجراءات المتخذة في حال ظهور الامراض خلال الحجر. كما يحدد واجبات أصحاب الحيوانات.\u003cbr /\u003e\nيحدد هذا القانون معاينة المخالفات وصلاحية الموظفين المولجين بها ويحدد العقوبات والغرامات عند المخالفة.\u003c/p\u003e\n\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\"https://regulations.agriculture.gov.lb/backoffice-mvc/API/File/veterinary quarantine animal products مرسوم 12301 الحجر الصحي البيطري_20220830085655_20220914143840_20220922154714.pdf\" target=\"_blank\"\u003eلاطلاع على كامل القرار يمكن النقر على خانة تحميل ادناه.\u003c/a\u003e\u003c/p\u003e\n","isHidden":false,"keyLegislation":true,"order":4,"product":null,"products":[],"decisionsProducts":[],"header":null,"id":523},"headers":[{"nameEn":"Product-Specific Regulations","nameAr":"قرارات على مستوى المنتج النهائي","iconUrl":"shopping-cart_20211004004000.svg","order":2,"isHidden":false,"decisions":null,"id":2},{"nameEn":"Processing, Storage and Transportation Regulations","nameAr":"قرارات على مستوى التصنيع، التخزين، التعبئة والنقل","iconUrl":"package_20211004004011.svg","order":3,"isHidden":false,"decisions":null,"id":3},{"nameEn":"Certificates and Attestations Related Regulations","nameAr":"قرارات خاصة بالشهادات والإفادات","iconUrl":"export_20211004035227.svg","order":4,"isHidden":false,"decisions":null,"id":4},{"nameEn":"Import and Export Related Regulations","nameAr":" قرارات على مستوى الإستيراد والتصدير","iconUrl":"import_20211004035237.svg","order":5,"isHidden":false,"decisions":null,"id":5},{"nameEn":"Other Regulations","nameAr":"قرارات أخرى","iconUrl":"decisions_20211004004046.svg","order":6,"isHidden":false,"decisions":null,"id":6}],"LegislationId":"523"},"__N_SSP":true},"page":"/legislation/[id]","query":{"id":"523"},"buildId":"7xqFgacYQDCh_XAQMgQzy","isFallback":false,"gssp":true,"customServer":true,"locale":"en","locales":["ar","en"],"defaultLocale":"ar","scriptLoader":[]}</script></body></html>
