name: CI

# Permissions minimales : ce workflow lit le dépôt et n'écrit rien — il n'a aucune raison
# d'avoir plus (recommandation GitHub, durcissement K-bis du 11/08/2026).
permissions:
  contents: read

# Filet de sécurité : transformer en contrôles automatiques ce qui était vérifié à la main.
#
# DEUX JOBS, SUR LES MÊMES DÉCLENCHEURS ET LE MÊME COMMIT (20/08/2026) :
#
#   verify        build RÉDUIT (~100 pages, ~36 s) + les contrôles rapides. Rend la main vite.
#   site-complet  build COMPLET (~3 000 pages, ~12 min) + les contrôles qui ne savent lire que
#                 le site entier. Tourne EN PARALLÈLE.
#
# CE QUE CETTE ARCHITECTURE REMPLACE, et pourquoi. Le partage précédent — « pull request réduite,
# main complet », décidé le 11/08/2026 — donnait un retour rapide, mais il avait une conséquence
# qu'on n'avait pas vue : les contrôles du site entier ne s'exécutaient QU'APRÈS la fusion. Leur
# premier passage réel avait lieu une fois le code dans `main`. Ce n'est pas une vérification,
# c'est un constat après coup. Les deux jobs suppriment ce délai sans sacrifier la rapidité : le
# job court reste court, le job long s'exécute à côté, et aucune condition `github.event_name` ne
# subsiste dans ce fichier.
#
# La garantie de déploiement reste ailleurs et inchangée : `deploy:preview` exécute un build
# complet AVEC vérification du `noindex` avant tout déploiement. Un dist de CI n'est jamais déployé.
#
# ORDRE NON NÉGOCIABLE : le build précède les harnais DOM. `test-fiche-harness.cjs` et
# `test-flightfinder-harness.cjs` lisent packages/ui/dist ; sans build ils meurent sur ENOENT.
#
# Node 22 partout : un build Astro complet sous Node 24.18.0 échoue après plusieurs milliers de
# pages sur un ENOENT dans dist/chunks/, sans jamais mentionner Node (constaté le 11/08/2026).
#
# DEUX NODE, À NE PAS CONFONDRE — la ligne ci-dessus parle du Node DU PROJET, installé depuis
# `.nvmrc` par setup-node, et c'est lui qui exécute build, harnais et scripts. Les actions, elles,
# tournent dans un Node choisi par LEURS auteurs (`runs.using` dans leur `action.yml`). Le 16/08/2026
# le runner écrivait : « Node.js 20 is deprecated. The following actions target Node.js 20 but are
# being forced to run on Node.js 24 » — checkout et setup-node tournaient donc déjà sous un Node que
# leur code n'avait jamais vu, sans que rien ne rougisse. Les deux sont passées en v7 (`using:
# node24`) le 17/08/2026. Le Node du projet reste 22.22.2 : ce changement ne le touche pas.
# `.github/actions-epinglees.json` fige ce qui a été mesuré, `check-actions-node.mjs` le fait tenir.

# CE QUI EST VÉRIFIÉ SUR UNE PULL REQUEST N'EST PAS LE SOMMET DE LA BRANCHE. `actions/checkout`
# extrait par défaut, pour l'événement `pull_request`, le commit de FUSION synthétique entre la tête
# de la branche et sa base, pas le SHA brut de la branche. C'est préférable — on vérifie le résultat
# fusionné, qui est ce qui atterrira dans `main` — mais ce n'est pas la même chose, et un compte
# rendu qui dit « sur le SHA de la branche » se trompe. Le SHA de tête reste lisible dans
# `github.event.pull_request.head.sha`.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Une pull request qui reçoit trois commits d'affilée n'a pas besoin de trois pipelines.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Vérifications
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node 22 (depuis .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Le seul contrôle du lot qui ne lise pas le site : il relit ce workflow. Chaque `uses:` doit
      # être épinglé sur un SHA complet, déclaré au manifeste avec le runtime relevé dans son
      # `action.yml`, et ce runtime doit être supporté. Sans réseau, donc sans aléa.
      - name: Actions épinglées sur un runtime supporté
        run: node packages/knowledge/scripts/check-actions-node.mjs

      # `npm ci` et non `npm install` : installation reproductible, à partir du seul lockfile.
      # C'est aussi ce qui rend obligatoire la déclaration de jsdom en devDependency — en tant que
      # dépendance « extraneous », `npm ci` la supprimait et test:built-ui cassait.
      - name: Installation reproductible
        run: npm ci

      - name: Base de connaissances (schéma · règles · couverture)
        run: npm run check

      # Les artefacts dérivés des fiches (airlines.generated.json, premium.policy dans
      # objects.json) n'étaient régénérés QUE si quelqu'un pensait à lancer l'ingestion à la
      # main. Rien ne le rappelait, et `airlines.ts` affirmait même le contraire. Ce contrôle
      # rend la promesse vraie : il régénère en mémoire, compare aux artefacts versionnés, et
      # échoue si une fiche a été modifiée sans que ses artefacts suivent. Il n'écrit rien,
      # donc il peut tourner ici sans salir l'arbre de travail.
      - name: Fiches et artefacts synchronisés (ingest --check)
        run: npm run ingest:check

      - name: Typecheck (knowledge · engine · workers)
        run: npm run typecheck

      - name: Moteur en direct via le Worker
        run: npm run smoke

      # Hors build : sélection de version Worker, double concordance, invariants de vols directs
      # et sémantique de `carrier_of_origin`.
      - name: Tests unitaires
        run: npm run test:unit

      # ── Build ────────────────────────────────────────────────────────────────────────────
      # TOUJOURS RÉDUIT ICI, sur pull request comme sur main. Le site entier est construit par le
      # job `site-complet`, qui tourne EN PARALLÈLE et sur les mêmes déclencheurs.
      #
      # Ce job construisait le site complet sur main et le site réduit sur pull request. Les
      # contrôles qui exigent le site entier ne pouvaient donc s'exécuter qu'APRÈS la fusion : leur
      # premier passage réel avait lieu une fois le code DANS main, ce qui n'est pas une
      # vérification mais un constat après coup.
      #
      # La sentinelle versionnée vaut pour les deux (K-bis) : un dist de CI n'est jamais déployé,
      # il n'a aucune raison de porter une adresse réelle, et surtout pas la seule qui soit mutable.
      - name: Build réduit
        run: npm run build:ci

      # ── Après build ──────────────────────────────────────────────────────────────────────
      - name: Harnais DOM (fiche + Finder, 4 langues)
        run: npm run test:built-ui

      # Les pages d'ENTITÉS — le trou par lequel les trois anomalies du contre-test navigateur
      # du 15/08/2026 sont passées : aucun harnais ne les lisait, et `build:ci` n'en construisait
      # aucune. La portée suit le build : les sentinelles sur pull request (que `build:ci`
      # construit désormais, compagnies ET pays en une seule passe), les 71 fiches × 4 langues
      # sur main. Ici les SENTINELLES seules ; les 78 canaux × 4 langues sont couverts par le job
      # `site-complet`, sur le même commit. Aucune des deux portées ne passe « faute de matière » :
      # chacune a une cible EXACTE calculée sur les données, et échoue si une page manque.
      - name: Harnais DOM des pages d'entités (sentinelles)
        run: npm run test:entities

      - name: Bundle épinglé sur le Worker attendu
        run: node packages/knowledge/scripts/check-bundle.mjs --expect="https://00000000-mydogcanfly-api-preview.fromparis.workers.dev"

      # Dette connue et chiffrée, pas un contrôle vert : échoue à la hausse par code OU par
      # fichier, même à total constant, et échoue aussi à la baisse pour forcer à resserrer.
      - name: Dette astro check (plafond)
        run: node packages/knowledge/scripts/check-astro-debt.mjs

  # ────────────────────────────────────────────────────────────────────────────────────────
  # LE SITE ENTIER — même déclencheur, même commit, en parallèle du job rapide.
  #
  # POURQUOI UN SECOND JOB PLUTÔT QU'UNE BRANCHE `if` DE PLUS. Certains contrôles ne savent lire
  # que le site COMPLET : sous le build réduit, les fiches et les guides n'existent pas, ils
  # échoueraient faute de matière et non faute de qualité. Ils étaient donc réservés à `main` —
  # c'est-à-dire qu'ils s'exécutaient pour la première fois APRÈS la fusion. Une vérification qui
  # n'a lieu qu'une fois le code écrit dans `main` ne protège plus rien : elle constate.
  #
  # Ce job les exécute AVANT toute fusion, sur le même état que le job rapide — c'est-à-dire, sur
  # une pull request, le commit de FUSION synthétique décrit en tête de ce fichier. Il est séparé
  # pour que le job rapide reste rapide : un build complet demande une vingtaine de minutes, et une
  # erreur de typage n'a pas à les attendre pour être signalée.
  #
  # CE JOB GRANDIRA. Il ne porte ici que les contrôles du site entier qui EXISTENT DÉJÀ ; les lots
  # suivants y ajouteront les leurs, dans la pull request qui apporte le script correspondant.
  # Aucune étape ne nomme jamais une commande qui n'existe pas encore.
  site-complet:
    name: Site entier (build complet + contrôles du site)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # LES MÊMES ÉPINGLES QUE LE JOB RAPIDE, c'est-à-dire celles de `main`. Le lot suivant porte
      # la migration Node 20 → 22 des actions, le manifeste et le contrôle qui les vérifie : il
      # migrera les DEUX jobs ensemble, avec sa garde. Introduire ici des SHA que rien ne vérifie
      # encore reviendrait à faire entrer une épingle non mesurée — précisément ce que ce contrôle,
      # quand il arrivera, existe pour interdire.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Node 22 (depuis .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation reproductible
        run: npm ci

      # Même sentinelle versionnée que le job rapide, et `noindex` sur toutes les pages : ce dist
      # n'est jamais déployé. `build:preview` refuse de déclarer le build utilisable si l'une de
      # ses vérifications d'après-build échoue.
      - name: Build complet + noindex sur toutes les pages
        run: npm run build:preview -- --api-base=https://00000000-mydogcanfly-api-preview.fromparis.workers.dev

      # Les fiches d'entités à leur portée réelle : 78 canaux × 4 langues, et non les sentinelles.
      - name: Harnais DOM des pages d'entités (78 canaux × 4 langues)
        run: npm run test:entities:complet

      # `audit` est BLOQUANT et n'était lancé PAR RIEN — un contrôle laissé à la main, c'est-à-dire
      # oubliable, exactement ce que son propre en-tête reproche aux vérifications manuelles. Il
      # sortait d'ailleurs deux anomalies bloquantes FAUSSES, corrigées dans cette même pull
      # request : voir les commentaires de `audit-site.mjs`.
      - name: Audit de cohérence du site construit
        run: npm run audit
